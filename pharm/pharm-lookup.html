<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pocket drug handbook — sticky search + body-system index tabs, entries as expandable monographs */
:root{
  --paper:#EEF3F1; --card:#FFFFFF; --ink:#132029; --muted:#55646D; --line:#D2DCD9; --line-strong:#B9C7C3;
  --accent:#0A6A64; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --warn:#AD2318; --warn-soft:#FBEAE7; --tox:#663C9C; --tox-soft:#F0E9F8; --tip:#7C5300; --tip-soft:#FAF0D6;
  --mark:#FFE07A; --mark-ink:#132029; --shadow:0 1px 2px rgba(19,32,41,.06),0 4px 14px rgba(19,32,41,.05);
  --s1:#3D5A98; --s2:#2F7D8C; --s3:#8A4E9C; --s4:#B23A48; --s5:#9C2B2B; --s6:#2E7FB8; --s7:#B07A14;
  --s8:#B5487E; --s9:#3E8E5E; --s10:#6E7F1F; --s11:#C2602B; --s12:#7A5A3A; --s13:#4F6470;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --warn:#FF8A7E; --warn-soft:#3A1C1A; --tox:#C3A2F0; --tox-soft:#2A2140; --tip:#F0C35C; --tip-soft:#33290F;
  --mark:#7A6417; --mark-ink:#FFF6D6; --shadow:0 1px 2px rgba(0,0,0,.3);
  --s1:#8AA6E6; --s2:#6CC3D2; --s3:#C99BDA; --s4:#F08B97; --s5:#E77F7F; --s6:#7DB8E6; --s7:#E7B95A;
  --s8:#EE93BD; --s9:#80C99C; --s10:#B6C760; --s11:#F1A070; --s12:#C9A27E; --s13:#9FB3BD;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --warn:#FF8A7E; --warn-soft:#3A1C1A; --tox:#C3A2F0; --tox-soft:#2A2140; --tip:#F0C35C; --tip-soft:#33290F;
  --mark:#7A6417; --mark-ink:#FFF6D6; --shadow:0 1px 2px rgba(0,0,0,.3);
  --s1:#8AA6E6; --s2:#6CC3D2; --s3:#C99BDA; --s4:#F08B97; --s5:#E77F7F; --s6:#7DB8E6; --s7:#E7B95A;
  --s8:#EE93BD; --s9:#80C99C; --s10:#B6C760; --s11:#F1A070; --s12:#C9A27E; --s13:#9FB3BD;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* Sticky header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.3rem;letter-spacing:-.01em;line-height:1.1}
.brand h1 span{color:var(--accent)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.search{position:relative}
.search input{width:100%;padding:11px 40px 11px 14px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--card);font-size:16px}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:1.2rem;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent))}
.chip .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.tools .count{margin-right:auto;font-family:var(--f-mono);font-size:.75rem}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:700;color:var(--ink)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:transform .15s}
.toggle input:checked + .sw{background:var(--accent)}
.toggle input:checked + .sw::after{transform:translateX(14px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.group h2 .tab{width:14px;height:14px;border-radius:3px;background:var(--c)}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* Monograph cards */
details.mono{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
details.mono[open]{border-color:var(--line-strong)}
details.mono > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
details.mono > summary::-webkit-details-marker{display:none}
.s-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.s-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.s-title h3{margin:0;font-family:var(--f-display);font-stretch:110%;font-weight:700;font-size:1.05rem;line-height:1.25;text-wrap:balance}
.sfx{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.systag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.s-drugs{grid-column:1/2;color:var(--muted);font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chev{grid-row:1/3;grid-column:2;align-self:center;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
details[open] .chev{transform:rotate(180deg)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}

.body{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px}
.druglist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:9px 12px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .dn{font-weight:700}
.drow .db{font-style:italic;color:var(--muted);font-weight:400}
.drow .dnote{font-size:.88rem;color:var(--ink)}
.drow.hit{background:var(--tip-soft)}
@media (min-width:720px){ .drow{grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:4px 16px} .drow .dnote{grid-column:2;grid-row:1/3} }

.secs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:760px){ .secs{grid-template-columns:repeat(2,minmax(0,1fr))} .sec.wide{grid-column:1/-1} }
.sec{border-radius:10px;padding:10px 12px;background:var(--paper);min-width:0}
.sec h4{margin:0 0 4px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sec .ans p{margin:0}
.sec .ans ul{margin:0;padding-left:1.1em}
.sec .ans li{margin:2px 0}
.sec.k-ae,.sec.k-warn{background:var(--warn-soft)} .sec.k-ae h4,.sec.k-warn h4{color:var(--warn)}
.sec.k-tox{background:var(--tox-soft)} .sec.k-tox h4{color:var(--tox)}
.sec.k-hesi{background:var(--tip-soft)} .sec.k-hesi h4{color:var(--tip)}
.sec.k-kid{background:var(--accent-soft)} .sec.k-kid h4{color:var(--accent)}
.sec.k-kid .ans{font-style:italic}

.cardfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.copybtn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.82rem}
.copybtn.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Self-test mode */
body.quiz .sec .ans{filter:blur(6px);user-select:none;cursor:pointer;transition:filter .15s}
body.quiz .sec.revealed .ans{filter:none;user-select:text}
body.quiz .sec{cursor:pointer}
body.quiz .sec h4::after{content:" · tap to reveal";text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
body.quiz .sec.revealed h4::after{content:""}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line-strong);border-radius:12px}

/* Quick reference */
.qsec{display:flex;flex-direction:column;gap:8px}
.qsec h2{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:1rem}
.qsec p.lede{margin:0;color:var(--muted);font-size:.88rem}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
td.mono{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child{font-weight:700}
.foot{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Pharm <span>Lookup</span></h1>
      <div class="tabs" role="tablist" aria-label="View">
        <button role="tab" id="tab-drugs" aria-selected="true" aria-controls="view-drugs">Drugs</button>
        <button role="tab" id="tab-quick" aria-selected="false" aria-controls="view-quick">Quick reference</button>
      </div>
    </div>
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search a drug, brand, class or suffix (e.g. Lasix, -pril, hypokalemia)" aria-label="Search drugs">
      <button class="clear" id="clear" aria-label="Clear search" hidden>×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by body system"></div>
    <div class="tools" id="tools">
      <span class="count" id="count"></span>
      <label class="toggle"><input type="checkbox" id="quiz"><span class="sw"></span>Self-test</label>
      <button class="tbtn" id="expand">Expand all</button>
      <button class="tbtn" id="collapse">Collapse all</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="view-drugs" role="tabpanel" aria-labelledby="tab-drugs"></div>
  <div class="wrap" id="view-quick" role="tabpanel" aria-labelledby="tab-quick" hidden></div>
</main>

<script>
const SYSTEMS = [
  {id:"cns", name:"Nervous System & Pain", hue:"var(--s1)"},
  {id:"ans", name:"Autonomic Nervous System", hue:"var(--s2)"},
  {id:"psy", name:"Mental Health", hue:"var(--s3)"},
  {id:"cv", name:"Cardiovascular", hue:"var(--s4)"},
  {id:"blood", name:"Blood & Clotting", hue:"var(--s5)"},
  {id:"renal", name:"Renal, Fluids & Electrolytes", hue:"var(--s6)"},
  {id:"endo", name:"Endocrine", hue:"var(--s7)"},
  {id:"repro", name:"Reproductive & Obstetric", hue:"var(--s8)"},
  {id:"resp", name:"Respiratory & Allergy", hue:"var(--s9)"},
  {id:"inf", name:"Anti-infectives", hue:"var(--s10)"},
  {id:"imm", name:"Inflammation, Immune & Cancer", hue:"var(--s11)"},
  {id:"gi", name:"Gastrointestinal", hue:"var(--s12)"},
  {id:"other", name:"Eye, Skin & Supplements", hue:"var(--s13)"}
];

const CLASSES = [
/* ============ NERVOUS SYSTEM & PAIN ============ */
{sys:"cns", name:"Opioid Agonists", sfx:"-done, -phone, -morphine",
 drugs:[["morphine","MS Contin","Prototype. PO, IV, IM. Releases histamine (itching)."],
  ["hydromorphone","Dilaudid","About 5–7× stronger than morphine. Look-alike dose errors are common."],
  ["fentanyl","Duragesic, Sublimaze","Patch takes 12–24 h to work. Heat (heating pad, fever) speeds absorption. Not for opioid-naive patients."],
  ["oxycodone","OxyContin, Percocet","Never crush controlled-release forms. Percocet contains acetaminophen."],
  ["codeine","—","Weak opioid. Also a cough suppressant. Very constipating. Avoid in children under 12."],
  ["methadone","Dolophine","Opioid addiction detox/maintenance and chronic or cancer pain. Long half-life, so it builds up. QT prolongation and dysrhythmias."],
  ["meperidine","Demerol","Metabolite (normeperidine) causes seizures. Avoid in older adults and renal failure."],
  ["tramadol","Ultram","Lowers the seizure threshold. Serotonin syndrome risk with SSRIs."]],
 moa:"Bind mu (and kappa) opioid receptors in the brain and spinal cord. This blocks pain transmission and changes how pain is perceived.",
 use:["Moderate to severe acute pain","Chronic and cancer pain","Cough (codeine, hydrocodone)","Diarrhea (opioid-based antidiarrheals)","Opioid addiction maintenance (methadone)"],
 exp:"Lower pain rating, a relaxed patient, and the ability to cough, deep breathe and ambulate.",
 se:["Constipation (no tolerance develops)","Nausea and vomiting","Sedation and drowsiness","Dizziness and orthostatic hypotension","Itching (histamine release)","Urinary retention","Pinpoint pupils (miosis)"],
 ae:["Respiratory depression (most serious)","Hypotension","Profound CNS depression or coma","Physical dependence and withdrawal"],
 warn:["Hold and notify if RR is below 12","Severe asthma or respiratory insufficiency","Head injury: masks neuro signs and raises ICP through CO2 retention","Never crush CR/ER forms","Older adults: start low, go slow","Do not combine with alcohol or other CNS depressants"],
 tox:"Overdose triad: coma, respiratory depression, pinpoint pupils. Antidote is NALOXONE (Narcan). Naloxone wears off in 1–2 h, faster than many opioids, so the patient can slip back into overdose (renarcotization) and may need repeat doses. In chronic users, titrate slowly to avoid sudden withdrawal and severe pain.",
 int:["Alcohol, benzodiazepines, barbiturates, sedating antihistamines: additive respiratory depression","MAOIs with meperidine: serotonin syndrome or hypertensive crisis"],
 mon:["RR, SpO2 and sedation level before and after each dose","Pain score about 30 min after IV and 60 min after PO","Bowel movements","BP (orthostatic)"],
 ed:["Start a stool softener plus a stimulant laxative with fluids and fiber","Rise slowly","No alcohol and no driving","Store securely and dispose of unused doses safely"],
 kid:"Opioids turn down the volume knob on pain signals in the brain. Turn the knob too far and the brain also turns down the 'breathe' signal.",
 hesi:"Assess RR first. Increasing sedation comes BEFORE respiratory depression, so it is the early warning sign. Tolerance develops to respiratory depression but NOT to constipation or miosis. Know the opioid ceiling effect: some opioids reach a maximum pain-relief effect, and raising the dose adds no relief (only side effects)."},

{sys:"cns", name:"Opioid Antagonists & Partial Agonists", sfx:"nal-",
 drugs:[["naloxone","Narcan","Pure antagonist. IV, IM, SubQ, intranasal. Works in 1–2 min and lasts 1–2 h."],
  ["naltrexone","Vivitrol, ReVia","Oral or monthly IM. Maintenance for alcohol and opioid dependence. Must be opioid-free 7–10 days first. Hepatotoxic."],
  ["buprenorphine","Subutex; Suboxone (with naloxone)","Partial agonist with a ceiling on respiratory depression. Used for opioid-use disorder. Sublingual: let it dissolve fully."]],
 moa:"Antagonists sit on opioid receptors and block opioids from binding. Partial agonists activate the receptor only part way.",
 use:["Reversing opioid overdose or sedation","Opioid- and alcohol-use disorder maintenance"],
 exp:"After naloxone: RR rises, the patient becomes arousable, pupils dilate.",
 se:["Naloxone: abrupt withdrawal (sweating, tachycardia, agitation, N/V)","Buprenorphine: headache, constipation, nausea"],
 ae:["Sudden return of severe pain","Precipitated withdrawal in dependent patients","Rare after naloxone: pulmonary edema, dysrhythmias"],
 warn:["Naltrexone or buprenorphine given while opioids are still on board triggers precipitated withdrawal","Naltrexone: liver disease"],
 tox:"Re-sedation risk when naloxone wears off before the opioid does. Keep monitoring and repeat the dose as needed.",
 int:["Naltrexone blocks opioid analgesics, so the patient needs non-opioid pain plans"],
 mon:["RR, LOC and SpO2 every few minutes after naloxone, then closely for at least 2 hours","Pain level","Withdrawal signs"],
 ed:["Carry a medical alert ID (naltrexone)","Family should keep intranasal Narcan at home"],
 kid:"Naloxone is like a bouncer who pushes the opioid out of its seat. But the bouncer goes home early, and the opioid can sneak back in.",
 hesi:"Naloxone reverses OPIOIDS only, not benzodiazepines (that's flumazenil). After giving it, stay with the patient and recheck RR."},

{sys:"cns", name:"Acetaminophen", sfx:"APAP",
 drugs:[["acetaminophen","Tylenol, Ofirmev (IV)","Hidden in many combination products (Percocet, Vicodin/Norco, NyQuil)."]],
 moa:"Blocks prostaglandin synthesis in the CNS, which relieves pain and lowers the hypothalamic set point to reduce fever. It has NO meaningful anti-inflammatory or antiplatelet effect.",
 use:["Mild to moderate pain","Fever","Preferred analgesic and antipyretic in children (no Reye's syndrome risk)"],
 exp:"Lower temperature and lower pain score.",
 se:["Few at normal doses","Rash, nausea"],
 ae:["Hepatotoxicity (dose-related)"],
 warn:["Max 4 g/day for healthy adults. Many guidelines use 3 g/day for older adults, liver disease or regular alcohol use","Count acetaminophen in combination products"],
 tox:"Early: N/V, sweating, malaise. Within 24–72 h: RUQ pain, jaundice, rising LFTs, liver failure. Antidote is ACETYLCYSTEINE (Mucomyst, Acetadote). It smells like rotten eggs; mix PO doses with juice or soda.",
 int:["Alcohol: increases hepatotoxicity","Warfarin: high chronic doses can raise INR"],
 mon:["LFTs with chronic or high-dose use","Total daily dose from all sources"],
 ed:["Read labels for 'APAP' or 'acetaminophen'","Limit alcohol"],
 kid:"Tylenol is a fever thermostat-fixer and pain dimmer, but the liver does all the cleanup. Overload the liver and it gets hurt.",
 hesi:"Overdose looks mild at first, which is the trap. Antidote = acetylcysteine (also a mucolytic)."},

{sys:"cns", name:"Benzodiazepines", sfx:"-azepam, -azolam",
 drugs:[["lorazepam","Ativan","First line for status epilepticus. Alcohol withdrawal and anxiety."],
  ["diazepam","Valium","Long half-life. Muscle spasm, seizures, alcohol withdrawal."],
  ["midazolam","Versed","Short-acting. Procedural and pre-op sedation and amnesia."],
  ["alprazolam","Xanax","Anxiety and panic disorder."],
  ["temazepam","Restoril","Insomnia."],
  ["chlordiazepoxide","Librium","Alcohol withdrawal."]],
 moa:"Enhance GABA, the brain's main inhibitory (calming) neurotransmitter, which causes CNS depression.",
 use:["Anxiety and panic","Insomnia (short term)","Seizures and status epilepticus","Alcohol withdrawal","Procedural sedation","Muscle spasm"],
 exp:"Calmer, less anxious, sleeping, seizures stopped.",
 se:["Drowsiness and sedation","Dizziness and loss of coordination (ataxia)","Blurred vision","Headache","Next-day hangover","Paradoxical excitement or agitation (children and older adults)"],
 ae:["Respiratory depression, especially combined with alcohol or opioids","Dependence and tolerance","Withdrawal seizures if stopped abruptly","Falls in older adults (Beers list)"],
 warn:["Taper; never stop abruptly","No alcohol","Pregnancy","Narrow-angle glaucoma","Older adults: fall risk, lower doses"],
 tox:"Somnolence, confusion, diminished reflexes, coma. Benzos alone rarely cause fatal respiratory depression; the danger is the combination with other depressants. Antidote is FLUMAZENIL (Romazicon), which can trigger seizures in long-term users.",
 int:["Opioids, alcohol, barbiturates, antihistamines: additive CNS and respiratory depression","Grapefruit juice raises levels of some (alprazolam)"],
 mon:["RR, LOC and BP (IV doses)","Fall risk","Signs of dependence"],
 ed:["No driving until the response is known","No alcohol","Don't stop suddenly"],
 kid:"GABA is the brain's brake pedal. Benzos press the brake harder.",
 hesi:"Flumazenil = benzos; naloxone = opioids. IV lorazepam is the first drug for status epilepticus."},

{sys:"cns", name:"Barbiturates", sfx:"-barbital",
 drugs:[["phenobarbital","Luminal","Long-acting. Seizures. Therapeutic level ~15–40 mcg/mL."],
  ["pentobarbital","Nembutal","Short-acting. Induced coma, preprocedure sedation."]],

 exp:"Seizure control, sedation.",
 se:["Drowsiness, lethargy, vertigo","Hangover effect"],
 ae:["Respiratory depression","Severe hypotension","Stevens-Johnson syndrome","Dependence with severe withdrawal"],
 warn:["Narrow therapeutic index","Older adults: reduce the dose (by about half)","Pregnancy","Porphyria","Do not stop abruptly"],

{sys:"cns", name:"Antiepileptics", sfx:"none consistent",
 drugs:[["phenytoin","Dilantin","Level 10–20 mcg/mL. Gingival hyperplasia, hirsutism, nystagmus. IV: NS only (precipitates in dextrose), max 50 mg/min, cardiac monitor. Purple glove syndrome."],
  ["fosphenytoin","Cerebyx","IV prodrug of phenytoin. Faster rate, less tissue injury."],
  ["carbamazepine","Tegretol","Level 4–12 mcg/mL. Also for trigeminal neuralgia and bipolar disorder. Agranulocytosis/aplastic anemia, SJS (HLA-B*1502 in patients of Asian descent). Induces its own metabolism."],
  ["valproic acid","Depakote","Level 50–100 mcg/mL. Hepatotoxicity, pancreatitis, thrombocytopenia, hyperammonemia. Major neural-tube teratogen."],
  ["levetiracetam","Keppra","Few drug interactions. Mood changes, irritability, depression."],
  ["lamotrigine","Lamictal","Life-threatening rash (SJS); titrate slowly."],
  ["gabapentin","Neurontin","Also neuropathic pain. Dizziness, sedation, peripheral edema."]],
 moa:"Stabilize neuron membranes by blocking sodium or calcium channels or by enhancing GABA. This dampens the abnormal, synchronized firing that causes seizures.",
 use:["Seizure disorders (epilepsy)","Status epilepticus (IV benzo first, then fosphenytoin/phenytoin)","Neuropathic pain, bipolar disorder, migraine prevention (selected drugs)"],
 exp:"Fewer or no seizures.",
 se:["Drowsiness","Dizziness","Ataxia","Nystagmus and diplopia","GI upset"],
 ae:["Stevens-Johnson syndrome or TEN","Blood dyscrasias","Hepatotoxicity","Suicidal thoughts (FDA class warning)","Teratogenicity"],
 warn:["Never stop abruptly: risk of status epilepticus","Pregnancy (valproate, phenytoin)","Older drugs reduce oral contraceptive effectiveness"],
 tox:"Phenytoin above 20: nystagmus FIRST, then ataxia, slurred speech, confusion, lethargy. There is no specific antidote; hold the drug and give supportive care.",
 int:["Phenytoin and carbamazepine are enzyme inducers: they lower warfarin, oral contraceptive and steroid levels","Valproate raises lamotrigine levels","Alcohol: additive CNS depression"],
 mon:["Trough drug levels","CBC and LFTs","Seizure diary","Mood and suicidal thoughts","Ammonia (valproate)"],
 ed:["Wear a medical alert ID","Good oral hygiene and dental visits (phenytoin)","Use backup birth control","Follow state rules on driving","Take at the same time every day"],
 kid:"In a seizure, brain cells fire like popcorn going off all at once. These drugs turn down the heat so they pop normally again.",
 hesi:"Phenytoin: the IV must be in normal saline, push slowly, and nystagmus is the first toxic sign. For gingival hyperplasia, teach brushing, flossing and dental visits."},

{sys:"cns", name:"Antiparkinson Drugs", sfx:"none consistent",
 drugs:[["carbidopa-levodopa","Sinemet","Levodopa becomes dopamine in the brain. Carbidopa blocks levodopa breakdown in the periphery, so more reaches the brain and peripheral side effects drop."],
  ["pramipexole, ropinirole","Mirapex, Requip","Dopamine agonists. Sudden sleep attacks, hallucinations, compulsive gambling or shopping."],
  ["selegiline, rasagiline","Eldepryl, Azilect","MAO-B inhibitors. At high doses, tyramine can trigger hypertensive crisis."],
  ["entacapone, tolcapone","Comtan, Tasmar","COMT inhibitors. Prolong levodopa and reduce wearing-off. Tolcapone can cause severe liver failure (check LFTs). Urine may turn brownish-orange."],
  ["benztropine, trihexyphenidyl","Cogentin, Artane","Anticholinergics. Reduce tremor. Also treat antipsychotic EPS."],
  ["amantadine","Gocovri","Antiviral that also releases dopamine. Reduces dyskinesia."]],
 moa:"Parkinson's is too little dopamine relative to acetylcholine. These drugs either add dopamine (levodopa, agonists, MAO-B and COMT inhibitors) or block acetylcholine (anticholinergics).",
 use:["Parkinson's disease","Drug-induced EPS (benztropine)","Restless legs (ropinirole, pramipexole)"],
 exp:"Less tremor, rigidity and bradykinesia; improved gait and ADLs. Full effect may take weeks to months.",
 se:["Nausea","Orthostatic hypotension","Dyskinesias (involuntary movements)","Dark urine or sweat (levodopa)","Hallucinations and confusion","Anticholinergic effects (benztropine)"],
 ae:["On-off phenomenon and wearing-off","Severe liver failure (tolcapone)","Neuroleptic malignant–like syndrome if stopped abruptly","Hypertensive crisis (MAO-B inhibitors plus tyramine or other drugs)"],
 warn:["Narrow-angle glaucoma (levodopa, anticholinergics)","Don't combine with nonselective MAOIs (14-day washout)","Don't stop abruptly"],
 tox:"Levodopa excess: severe dyskinesia, psychosis. Anticholinergic excess: delirium, urinary retention, hyperthermia.",
 int:["Antipsychotics and metoclopramide block dopamine, so they cancel out the benefit","High-protein meals compete with levodopa absorption","Pyridoxine (B6) lowers levodopa's effect (less so with carbidopa)"],
 mon:["Motor function and ADLs","Orthostatic BP","Mental status","LFTs (tolcapone)"],
 ed:["Rise slowly","Darkened urine or sweat is harmless","Spread protein through the day","Don't stop suddenly"],
 kid:"Picture a seesaw with dopamine on one end and acetylcholine on the other. In Parkinson's, the dopamine side is too light. These drugs add weight to the dopamine side or take weight off the acetylcholine side.",
 hesi:"Carbidopa does NOT treat Parkinson's by itself. It is levodopa's bodyguard."},

{sys:"cns", name:"Skeletal Muscle Relaxants", sfx:"none consistent",
 drugs:[["cyclobenzaprine","Flexeril","Acute muscle spasm. Anticholinergic and sedating. Structurally similar to TCAs."],
  ["baclofen","Lioresal","Spasticity (MS, spinal cord injury). Abrupt withdrawal, especially intrathecal, causes hallucinations, seizures and high fever."],
  ["tizanidine","Zanaflex","Hypotension, dry mouth, hepatotoxicity."],
  ["dantrolene","Dantrium","Acts directly on skeletal muscle. Treats MALIGNANT HYPERTHERMIA. Hepatotoxicity with long-term oral use."]],

 exp:"Less spasm and pain, better mobility.",
 se:["Drowsiness and dizziness","Dry mouth","Weakness"],
 ae:["Hepatotoxicity (dantrolene, tizanidine)","Withdrawal syndrome (baclofen)"],
 warn:["Don't stop baclofen abruptly","No alcohol or other CNS depressants","Older adults (Beers list)"],

 mon:["LFTs","Sedation and fall risk"],
 ed:["Avoid driving","Taper baclofen"],
 kid:"These tell tight, cramped muscles to let go.",
 hesi:"Dantrolene = malignant hyperthermia (after succinylcholine or volatile anesthetics). It is also used for NMS."},

{sys:"cns", name:"Anesthetics & Neuromuscular Blockers", sfx:"-curonium, -caine",
 drugs:[["propofol","Diprivan","Milky white. Rapid sedation. Strict aseptic technique; discard tubing and vial per policy (usually 12 h). Hypotension, respiratory depression. Propofol infusion syndrome."],
  ["succinylcholine","Anectine","Depolarizing NMB. Malignant hyperthermia, hyperkalemia."],
  ["vecuronium, rocuronium","Zemuron","Nondepolarizing NMBs. Reverse with neostigmine or sugammadex."],
  ["lidocaine, bupivacaine","Xylocaine, Marcaine","Local anesthetics. Systemic toxicity (LAST): tinnitus, metallic taste, seizures, dysrhythmias; treat with lipid emulsion. 'With epinephrine' forms are not used on fingers, toes, nose, penis or ears."]],
 moa:"General anesthetics depress the CNS. Neuromuscular blockers block acetylcholine at the neuromuscular junction, causing paralysis. Local anesthetics block sodium channels in nerves.",
 use:["Surgery","Intubation","Mechanical ventilation","Local procedures"],
 exp:"Unconsciousness or paralysis as intended; a numb area for local anesthetics.",
 se:["Hypotension","Nausea and vomiting after anesthesia","Muscle pain (succinylcholine)"],
 ae:["Malignant hyperthermia: rising end-tidal CO2 (earliest sign), muscle rigidity, high fever, tachycardia","Respiratory arrest","Hyperkalemia (succinylcholine)"],
 warn:["NMBs provide NO sedation or pain relief: the paralyzed patient may be awake. Always pair with sedation and analgesia","Family history of malignant hyperthermia"],
 tox:"Malignant hyperthermia: stop the trigger and give DANTROLENE, cooling, 100% O2. NMB reversal: neostigmine (with glycopyrrolate) or sugammadex.",

 mon:["Airway and ventilation","End-tidal CO2 and temperature","Train-of-four (NMBs)","Return of gag reflex before oral intake"],
 ed:["Keep NPO until the gag reflex returns after throat or local anesthesia"],
 kid:"Anesthetics turn the brain's lights off. NMBs unplug the muscles, but the lights can still be on, so pain and sedation drugs are a must.",
 hesi:"Priority after anesthesia: airway. An early MH clue is rising end-tidal CO2."},

  ["caffeine","—","Neonatal apnea. CNS stimulation."]],

{sys:"cns", name:"Substance Use Treatment", sfx:"—",
 drugs:[["disulfiram","Antabuse","Drinking alcohol causes a severe reaction: flushing, throbbing headache, N/V, hypotension. Avoid ALL alcohol, including mouthwash, cough syrup, hand sanitizer, vinegar and sauces. Must be alcohol-free 12 h first."],
  ["naltrexone","ReVia, Vivitrol","Reduces alcohol and opioid craving. Hepatotoxic."],
  ["acamprosate","Campral","Reduces alcohol craving after abstinence. Renal dosing."],
  ["chlordiazepoxide, lorazepam","Librium, Ativan","Alcohol withdrawal (benzodiazepines)."],
  ["thiamine","Vitamin B1","Give before glucose in alcohol use to prevent Wernicke encephalopathy."],
  ["varenicline","Chantix","Smoking cessation. Vivid dreams, mood changes; monitor for neuropsychiatric effects."],
  ["nicotine replacement","patch, gum, lozenge","Don't smoke while using. Patch: rotate sites. Chew-and-park gum."],
  ["fomepizole (or ethanol)","Antizol","Antidote for methanol and ethylene glycol poisoning."]],
 moa:"Disulfiram blocks alcohol breakdown, so acetaldehyde builds up. Naltrexone blocks opioid receptors and reduces reward. Acamprosate restores the glutamate/GABA balance. Varenicline is a partial nicotine agonist.",
 use:["Alcohol use disorder","Opioid use disorder","Nicotine dependence","Withdrawal management"],
 exp:"Maintained abstinence, fewer cravings, safe withdrawal.",
 se:["Disulfiram: drowsiness, metallic taste","Naltrexone: nausea, headache","Varenicline: nausea, abnormal dreams"],
 ae:["Disulfiram-alcohol reaction (can be severe)","Hepatotoxicity (naltrexone, disulfiram)","Neuropsychiatric effects (varenicline)"],
 warn:["Never give disulfiram to an intoxicated patient or without their knowledge","Naltrexone: must be opioid-free first"],
 tox:"Alcohol withdrawal starts 6–24 h after the last drink: tremors, anxiety, tachycardia, HTN, diaphoresis. Delirium tremens can follow at 48–96 h. Treat with benzodiazepines (CIWA scale).",
 int:["Disulfiram plus metronidazole: psychosis","Disulfiram raises warfarin and phenytoin levels"],
 mon:["CIWA score","Vitals","LFTs","Mood"],
 ed:["Read labels for hidden alcohol","Carry a wallet card (disulfiram)"],
 kid:"Disulfiram makes alcohol feel like food poisoning, so the body learns to stay away.",
 hesi:"Disulfiram teaching = hidden alcohol sources. Thiamine before glucose."},

/* ============ AUTONOMIC ============ */
{sys:"ans", name:"Adrenergic Agonists (Vasopressors)", sfx:"-ine (catecholamines)",
 drugs:[["epinephrine","Adrenalin, EpiPen","Alpha and beta. Anaphylaxis (0.3–0.5 mg IM of 1 mg/mL in the lateral thigh) and cardiac arrest (1 mg IV of 0.1 mg/mL). Check the concentration twice."],
  ["norepinephrine","Levophed","Mostly alpha-1: strong vasoconstriction for septic shock. Central line preferred. Extravasation causes necrosis; treat with phentolamine."],
  ["dopamine","Intropin","Dose-dependent: low dose = renal/dopaminergic, mid = beta-1 (contractility), high = alpha-1 (vasoconstriction)."],
  ["dobutamine","Dobutrex","Beta-1. Increases contractility in cardiogenic shock and acute HF."],
  ["phenylephrine","Neo-Synephrine","Alpha-1. Hypotension during anesthesia; nasal decongestant."],
  ["midodrine","ProAmatine","Oral alpha-1 agonist for orthostatic hypotension. Don't take within 4 h of bedtime (supine HTN)."]],
 moa:"Mimic the sympathetic nervous system. Alpha-1 constricts vessels. Beta-1 raises HR and contractility. Beta-2 dilates bronchi.",
 use:["Shock and hypotension","Cardiac arrest","Anaphylaxis","Acute heart failure","Nasal congestion"],
 exp:"MAP of 65 or more, improved perfusion and urine output, reversal of anaphylaxis.",
 se:["Tachycardia and palpitations","Hypertension","Tremor and anxiety","Headache","Insomnia"],
 ae:["Dysrhythmias","Chest pain and myocardial ischemia","Tissue necrosis if IV fluid leaks out (extravasation)","Reduced blood flow to organs or extremities at high doses"],
 warn:["Correct hypovolemia first (vasopressors don't fill an empty tank)","Tachydysrhythmias","Narrow-angle glaucoma","Use a central line or large vein; check the IV site often"],
 tox:"Extravasation antidote: PHENTOLAMINE (an alpha blocker) injected SubQ around the site.",
 int:["MAOIs and TCAs: hypertensive crisis","Beta blockers blunt the beta effects"],
 mon:["Continuous ECG","BP (often an arterial line)","Urine output","IV site hourly","Peripheral pulses and skin"],
 ed:["EpiPen: lateral thigh through clothing, hold about 3 s, then call 911"],
 kid:"The body's gas pedal. These drugs press it: heart races, vessels squeeze, airways open.",
 hesi:"Infiltrated norepinephrine: stop the infusion, leave the catheter in, give phentolamine."},

{sys:"ans", name:"Alpha-Adrenergic Blockers", sfx:"-osin",
 drugs:[["prazosin","Minipress","Hypertension; PTSD nightmares."],
  ["doxazosin, terazosin","Cardura, Hytrin","Hypertension and BPH."],
  ["tamsulosin","Flomax","Selective for the prostate, so less hypotension. BPH. Floppy iris syndrome during cataract surgery."],
  ["phentolamine","Regitine","Antidote for norepinephrine/dopamine extravasation and pheochromocytoma crisis."]],

 mon:["Orthostatic BP","Urinary symptoms"],
 ed:["Take at bedtime","Sit at the edge of the bed before standing"],
 kid:"These loosen the squeeze on blood vessels and on the tube that carries pee out.",
 hesi:"'-osin' = first-dose fainting. The answer is bedtime dosing and fall precautions."},

{sys:"ans", name:"Cholinergic Agonists (Parasympathomimetics)", sfx:"-stigmine",
 drugs:[["bethanechol","Urecholine","Nonobstructive urinary retention. Give on an empty stomach. Keep atropine available."],
  ["pilocarpine","Isopto Carpine","Glaucoma (miosis); dry mouth."],
  ["neostigmine, pyridostigmine","Prostigmin, Mestinon","Cholinesterase inhibitors. Myasthenia gravis; reverse nondepolarizing NMBs."],
  ["donepezil","Aricept","Alzheimer's (cholinesterase inhibitor). Give at bedtime. Bradycardia, GI upset. Slows decline; not a cure."],
  ["rivastigmine, galantamine","Exelon, Razadyne","Alzheimer's. Rivastigmine comes as a patch."],
  ["memantine","Namenda","Alzheimer's: NMDA antagonist (not cholinergic). Often paired with donepezil."]],
 moa:"Directly stimulate cholinergic receptors, or block acetylcholinesterase so acetylcholine lasts longer. The result is 'rest and digest'.",
 use:["Urinary retention","Myasthenia gravis","Alzheimer's dementia","Glaucoma","NMB reversal"],
 exp:"Voiding, stronger muscles (MG), slowed cognitive decline, lower intraocular pressure.",
 se:["SLUDGE: Salivation, Lacrimation, Urination, Diarrhea, GI cramping, Emesis","Bradycardia","Sweating","Bronchoconstriction"],
 ae:["Cholinergic crisis: severe weakness, respiratory failure, bradycardia","Hypotension"],
 warn:["Asthma and COPD","Bradycardia and heart block","GI or urinary OBSTRUCTION","Peptic ulcer","Hyperthyroidism"],
 tox:"Cholinergic crisis (and organophosphate poisoning). Antidote: ATROPINE, plus pralidoxime for organophosphates. MG: too much drug = cholinergic crisis; too little = myasthenic crisis. Both cause weakness.",
 int:["Anticholinergics cancel the effect"],
 mon:["HR","Respiratory status","Muscle strength and swallowing (MG)","Cognition (Alzheimer's)","I&O"],
 ed:["MG: take on time, 30–45 min before meals to help chewing","Report excessive salivation or sweating"],
 kid:"Acetylcholine is the 'rest and digest' messenger. These make more of it hang around: more spit, more pee, slower heart.",
 hesi:"SLUDGE = too much cholinergic. Antidote = atropine. Contraindicated with obstruction."},

 int:["Antihistamines, TCAs, phenothiazines: additive anticholinergic burden"],
 mon:["HR","I&O and bladder distension","Bowel sounds","Mental status","Temperature"],
 ed:["Sugar-free gum or sips of water","Sunglasses","Avoid hot environments and heavy exercise","Fiber and fluids"],

/* ============ MENTAL HEALTH ============ */

 warn:["Recent MI","Narrow-angle glaucoma, BPH","Older adults (Beers list)","MAOIs"],

{sys:"psy", name:"MAO Inhibitors", sfx:"none consistent",
 drugs:[["phenelzine","Nardil","Treatment-resistant depression."],

  ["isocarboxazid","Marplan",""],
  ["selegiline transdermal","Emsam","At the lowest patch dose, dietary limits may not apply."]],

 ae:["HYPERTENSIVE CRISIS with tyramine or sympathomimetics","Serotonin syndrome"],
 warn:["Strict tyramine-free diet: aged cheese, cured, smoked or pickled meats and fish, tap beer and red wine, soy sauce, sauerkraut, fava beans, overripe avocado and bananas","No OTC cold medicines (pseudoephedrine)","14-day washout before switching to other antidepressants","Pheochromocytoma, HF, liver disease"],

{sys:"psy", name:"Lithium (Mood Stabilizer)", sfx:"—",
 drugs:[["lithium carbonate","Lithobid","Therapeutic about 0.6–1.2 mEq/L (acute mania up to about 1.5). Toxic above 1.5. Draw levels 12 h after the last dose."]],

{sys:"psy", name:"Typical (1st-Gen) Antipsychotics", sfx:"-azine (phenothiazines)",
 drugs:[["haloperidol","Haldol","High potency: most EPS. Also used for delirium. QT prolongation. Long-acting decanoate IM."],
  ["chlorpromazine","Thorazine","Low potency: more sedation, anticholinergic effects, hypotension and photosensitivity. Also treats hiccups."],
  ["fluphenazine","Prolixin","High potency; decanoate form."],
  ["prochlorperazine","Compazine","Mainly used as an antiemetic."]],
 moa:"Block dopamine (D2) receptors in the brain, which reduces positive symptoms (hallucinations, delusions).",
 use:["Schizophrenia","Acute psychosis and agitation","Delirium","Nausea (prochlorperazine)"],
 exp:"Fewer hallucinations and delusions; calmer, organized thinking.",
 se:["Sedation","Anticholinergic effects","Orthostatic hypotension","Photosensitivity","Weight gain","High prolactin (gynecomastia, galactorrhea, amenorrhea)"],
 ae:["EPS: acute DYSTONIA (hours to days; torticollis, oculogyric crisis), AKATHISIA (days to weeks; restlessness), PSEUDOPARKINSONISM (weeks)","TARDIVE DYSKINESIA (months to years; lip smacking, tongue thrusting; often irreversible)","NEUROLEPTIC MALIGNANT SYNDROME","QT prolongation","Agranulocytosis","Boxed warning: increased death in older adults with dementia"],
 warn:["CNS depression","Parkinson's","Seizures (lowers threshold)","Older adults with dementia"],
 tox:"NMS: high FEVER, 'lead-pipe' muscle rigidity, altered LOC, unstable BP/HR, high CK. Stop the drug, cool, give dantrolene or bromocriptine. Acute dystonia: IV/IM diphenhydramine or benztropine.",
 int:["CNS depressants: additive","Levodopa: opposing effects","Anticholinergics: additive"],
 mon:["AIMS scale for TD","Temperature (NMS)","Orthostatic BP","ECG (QT)","CBC"],
 ed:["Sunscreen","Rise slowly","Report a sore throat or fever"],
 kid:"These block dopamine in the brain to quiet the 'false alarms' of psychosis. But dopamine also runs smooth movement, so blocking it causes stiffness and odd movements.",
 hesi:"EPS timeline: dystonia (hours to days), then akathisia, then pseudoparkinsonism (weeks), then TD (months to years). NMS = fever + rigidity."},

{sys:"psy", name:"Atypical (2nd-Gen) Antipsychotics", sfx:"-apine, -idone",

  ["olanzapine","Zyprexa","Major weight gain, diabetes and dyslipidemia."],

 warn:["Diabetes and obesity","Heart disease (QT)","Seizure disorder (clozapine)"],

 ed:["Diet and exercise","Report fever or sore throat (clozapine)","Rise slowly"],

{sys:"psy", name:"Buspirone (Non-Benzo Anxiolytic)", sfx:"—",

/* ============ CARDIOVASCULAR ============ */
{sys:"cv", name:"ACE Inhibitors", sfx:"-pril",
 drugs:[["captopril","Capoten","Short-acting; give 1 h before meals. Not a prodrug; excreted unchanged by the kidneys. Taste changes, neutropenia."],
  ["enalapril / enalaprilat","Vasotec","Prodrug. Enalaprilat is the IV form."],
  ["lisinopril","Prinivil, Zestril","Once daily. Not a prodrug; excreted unchanged by the kidneys."],
  ["ramipril, benazepril","Altace, Lotensin","Prodrugs."]],
 moa:"Block angiotensin-converting enzyme, so less angiotensin II (a vasoconstrictor) and less aldosterone are made. Result: vasodilation, sodium and water loss, potassium RETAINED. Bradykinin builds up.",
 use:["Hypertension","Heart failure","After MI (prevents ventricular remodeling)","Diabetic nephropathy (kidney-protective)"],
 exp:"BP at goal; improved HF symptoms; less protein in the urine.",
 se:["DRY, nonproductive COUGH (bradykinin)","First-dose hypotension","Dizziness","Headache","Loss of taste (captopril)"],
 ae:["ANGIOEDEMA (swelling of lips, tongue, airway; more common in Black patients)","HYPERKALEMIA","Acute renal impairment","Neutropenia (captopril)"],
 warn:["PREGNANCY (boxed warning: fetal toxicity)","History of angioedema","Bilateral renal artery stenosis"],
 tox:"Severe hypotension: fluids. Angioedema: stop permanently and protect the airway.",
 int:["Potassium-sparing diuretics, potassium supplements, salt substitutes: HYPERKALEMIA","NSAIDs: blunt the effect and harm the kidneys","Lithium: toxicity","Thiazides: added BP lowering (a good combination)"],
 mon:["BP (first dose especially)","Potassium","BUN and creatinine","Cough","Swelling of the face or tongue"],
 ed:["Rise slowly","Avoid salt substitutes (they contain KCl)","Report swelling of the face or throat immediately","Use contraception"],
 kid:"Angiotensin II is a hand that squeezes blood vessels. ACE inhibitors stop the hand from being built, so the vessels relax.",
 hesi:"-pril = cough plus hyperkalemia. Pair with a thiazide; avoid potassium-sparing diuretics. Angioedema is an airway emergency."},

{sys:"cv", name:"Angiotensin II Receptor Blockers (ARBs)", sfx:"-sartan",

  ["irbesartan, candesartan, olmesartan","Avapro, Atacand, Benicar",""]],

 se:["Dizziness","Headache","Hypotension","Fatigue"],
 ae:["HYPERKALEMIA","Renal impairment","Angioedema (rare)"],
 warn:["PREGNANCY (boxed warning)","Bilateral renal artery stenosis"],
 tox:"Hypotension: supportive care.",
 int:["Potassium-sparing diuretics and potassium supplements: HYPERKALEMIA","NSAIDs","Lithium"],
 mon:["BP","Potassium","BUN and creatinine"],
 ed:["Avoid salt substitutes","Use contraception"],

{sys:"cv", name:"Beta-Adrenergic Blockers", sfx:"-olol, -ilol, -alol",
 drugs:[["metoprolol","Lopressor (tartrate), Toprol XL (succinate)","Beta-1 selective. Succinate form for HF. Don't crush XL."],
  ["atenolol","Tenormin","Beta-1 selective. Renally excreted."],
  ["esmolol","Brevibloc","Beta-1 selective. IV, ultra-short acting for SVT and perioperative HTN."],
  ["nebivolol","Bystolic","Beta-1 selective plus nitric oxide vasodilation."],
  ["propranolol","Inderal","NONselective. Also migraine prevention, essential tremor, thyroid storm, performance anxiety, portal hypertension."],
  ["carvedilol","Coreg","Nonselective beta plus alpha-1. Heart failure. Take with food."],
  ["labetalol","Trandate","Nonselective beta plus alpha-1. Hypertensive emergency and HTN in pregnancy."],
  ["timolol","Timoptic","Eye drops for glaucoma; can still cause systemic effects."]],
 moa:"Block beta-1 receptors in the heart: slower HR, less contractility, slower AV conduction, less renin. Nonselective drugs also block beta-2 in the lungs, causing bronchoconstriction.",

 exp:"Lower HR and BP; fewer angina episodes.",
 se:["BRADYCARDIA","Hypotension and orthostatic hypotension","Fatigue","Dizziness","Depression","Sexual dysfunction","Cold hands and feet"],
 ae:["Heart block","Acute HF worsening (early in therapy)","Bronchospasm (nonselective)","MASKS HYPOGLYCEMIA signs (tachycardia, tremor); sweating remains"],
 warn:["Asthma and COPD (especially nonselective)","HR below 60, 2nd or 3rd degree heart block","Cardiogenic shock","Decompensated HF","Diabetes (masked hypoglycemia)","NEVER stop abruptly: rebound tachycardia, HTN, angina, MI. Taper over 1–2 weeks"],
 tox:"Bradycardia, hypotension, heart block, hypoglycemia. Antidote: GLUCAGON IV; atropine for bradycardia.",
 int:["Verapamil and diltiazem: additive bradycardia and heart block","Insulin and sulfonylureas: masked hypoglycemia","Clonidine: rebound HTN if stopped","Digoxin: additive bradycardia"],
 mon:["APICAL pulse for 1 full minute and BP before each dose. Hold for HR below 60 or SBP below 90–100 (per order)","Blood glucose","Lung sounds","Daily weight and edema in HF"],
 ed:["Check pulse daily","Don't stop suddenly","Rise slowly","Diabetics: check glucose; sweating may be the only warning sign"],

{sys:"cv", name:"Calcium Channel Blockers", sfx:"-dipine",
 drugs:[["amlodipine","Norvasc","Dihydropyridine (vessels). Peripheral edema."],
  ["nifedipine","Procardia XL","Dihydropyridine. Avoid immediate-release forms for HTN (sudden drop, reflex tachycardia). Also preterm labor."],
  ["nicardipine, clevidipine","Cardene, Cleviprex","IV dihydropyridines for hypertensive emergency. Clevidipine is a lipid emulsion (soy/egg allergy)."],

  ["diltiazem","Cardizem","Non-DHP. AFib rate control (IV) and angina."]],

 exp:"Lower BP; less angina; controlled ventricular rate.",
 se:["Hypotension and dizziness","Headache and flushing","PERIPHERAL EDEMA (dihydropyridines)","Reflex tachycardia (dihydropyridines)","Constipation (verapamil)","Bradycardia (non-DHP)"],
 ae:["Heart block and HF worsening (verapamil, diltiazem)","Severe hypotension"],
 warn:["2nd/3rd degree AV block, sick sinus","Hypotension","Acute MI","Decompensated HF (non-DHP)","Don't crush SR forms"],

{sys:"cv", name:"Centrally Acting Alpha-2 Agonists", sfx:"—",

{sys:"cv", name:"Direct Vasodilators", sfx:"—",

  ["minoxidil","Loniten, Rogaine","Severe HTN; hair growth (hirsutism); pericardial effusion."],

{sys:"cv", name:"Nitrates (Antianginals)", sfx:"nitro-, isosorbide",
 drugs:[["nitroglycerin","Nitrostat (SL), Nitrolingual (spray), Nitro-Dur (patch), Nitro-Bid (ointment), IV","SL: 1 tab at onset of pain. If no relief in 5 min, call 911 and take a 2nd; max 3 doses in 15 min."],
  ["isosorbide dinitrate","Isordil","Oral prevention."],

 kid:"Nitro opens up the veins so blood pools there and the heart has less to pump. A tired heart gets a break.",
 hesi:"Check BP first. Sildenafil plus nitro is a dangerous combination. A nitrate-free period every night prevents tolerance."},

{sys:"cv", name:"Cardiac Glycoside (Digoxin)", sfx:"—",
 drugs:[["digoxin","Lanoxin","Therapeutic 0.5–2 ng/mL (many HF guidelines aim for 0.5–0.9). Loading ('digitalizing') dose often given."]],

 exp:"Stronger heartbeat with more stroke volume and cardiac output; less edema and dyspnea; better activity tolerance; controlled ventricular rate.",

 ae:["Dysrhythmias (any new rhythm, including heart block and PVCs)","Bradycardia","Visual changes: yellow-green vision, halos, blurring","Confusion (especially older adults)"],

 mon:["APICAL pulse for 1 full minute. Hold if below 60 in adults (below 70 in children, below 90 in infants), or if the rhythm or rate changes notably","Potassium","Digoxin level","Renal function","ECG"],
 ed:["Take your pulse daily","Report nausea, vision changes or a slow pulse","Eat potassium-rich foods if on a diuretic","Separate from antacids"],
 kid:"Digoxin is a coach telling the heart: 'Squeeze harder, and slow down.' Too much coaching makes the heart too slow and out of rhythm, and makes you nauseated and see yellow.",
 hesi:"Low K + digoxin = toxicity. Check the apical pulse before every dose."},

{sys:"cv", name:"Antidysrhythmics", sfx:"none consistent",

  ["Alcohol","Metronidazole, disulfiram, some cephalosporins, sulfonylureas → disulfiram-like reaction; CNS depressants; acetaminophen (liver); metformin (lactic acidosis)"],
  ["Caffeine","Theophylline, stimulants → additive stimulation"],
  ["High-protein meals","Levodopa → less absorption"],
  ["High-fiber / bran","Digoxin → less absorption"],
  ["Licorice","Digoxin toxicity (low K); HTN"],
  ["Any food","Bisphosphonates, levothyroxine, PPIs (before breakfast), sucralfate → take on an empty stomach"],
  ["Fatty meal","Increases absorption of CFTR modulators (needed); lurasidone needs food"]
];
QUICK.suffixes.push(
  ["-lukast","Leukotriene receptor antagonist","montelukast"],
  ["-triptan","Migraine (5-HT1 agonist)","sumatriptan"],
  ["-gepant","CGRP antagonist","ubrogepant"],
  ["-grastim","Colony-stimulating factor","filgrastim"],
  ["-poetin","Erythropoiesis stimulant","epoetin alfa"],
  ["-sentan","Endothelin antagonist (PAH)","bosentan"],
  ["-nib","Kinase inhibitor (targeted cancer)","imatinib"],
  ["-salamine","5-ASA (IBD)","mesalamine"],
  ["-quine","Antimalarial","chloroquine"],
  ["-bendazole","Anthelmintic","albendazole"],
  ["-tinib / -ciclib","Targeted oral chemo","osimertinib, palbociclib"],
  ["-gravir","Integrase inhibitor (HIV)","dolutegravir"]
);
QUICK.antidotes.push(
  ["Hyperkalemia (cardiac effects)","Calcium gluconate, then insulin + dextrose"],
  ["Chemo extravasation (anthracyclines)","Dexrazoxane"],
  ["Ifosfamide/cyclophosphamide bladder toxicity","Mesna (preventive)"]
);



const FIELDS = [
  ["moa","How it works","wide"],["use","Used for"],["exp","Therapeutic response / expected findings"],
  ["se","Side effects"],["ae","Adverse effects (serious)"],["warn","Warnings & contraindications"],
  ["tox","Toxicity & antidote","wide"],["int","Interactions"],["mon","Monitor / assess"],
  ["ed","Nursing & teaching"],["kid","Like I'm 10"],["hesi","HESI focus"]
];
const SYS = Object.fromEntries(SYSTEMS.map(s=>[s.id,s]));
CLASSES.forEach((c,i)=>{ c.id = "c"+i; });

const state = { sys:"all", q:"", quiz:false, tab:"drugs", open:new Set() };
try{ state.quiz = localStorage.getItem("pl_quiz")==="1"; const t=localStorage.getItem("pl_tab"); if(t==="quick") state.tab="quick"; }catch(e){}

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const norm = s=>String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"");
function hl(text, q){
  const raw = String(text); if(!q) return esc(raw);
  const words = q.split(/\s+/).filter(w=>w.length>1).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!words.length) return esc(raw);
  return raw.split(new RegExp("("+words.join("|")+")","gi")).map((p,i)=>i%2?"<mark>"+esc(p)+"</mark>":esc(p)).join("");
}
function fullText(c){
  return norm([c.name,c.sfx,c.drugs.map(d=>d.join(" ")).join(" "),...FIELDS.map(([k])=>[].concat(c[k]||"").join(" "))].join(" "));
}
CLASSES.forEach(c=>{ c._txt = fullText(c); c._names = c.drugs.map(d=>norm(d[0]+" "+d[1])); c._parts = c.drugs.flatMap(d=>d[0].split(/,|\s\/\s|;/).map(p=>p.replace(/\(.*?\)/g,"").trim().toLowerCase()).filter(Boolean)); });
const uniq = cs=>new Set(cs.flatMap(c=>c._parts)).size;

function score(c, q){
  if(!q) return {s:1, hits:[]};
  const terms = norm(q).split(/\s+/).filter(Boolean);
  let s = 0; const hits = [];
  c.drugs.forEach((d,i)=>{
    const n = c._names[i];
    if(terms.every(t=>n.includes(t))){
      hits.push(i);
      const starts = terms.every(t=>new RegExp("(^|[\\s,/(-])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(n));
      s = Math.max(s, starts?100:80);
    }
  });
  const cn = norm(c.name+" "+c.sfx);
  if(terms.every(t=>cn.includes(t))) s = Math.max(s,70);
  if(!s && terms.every(t=>c._txt.includes(t))) s = 20;
  return {s, hits};
}

function renderChips(){
  const counts = {}; SYSTEMS.forEach(s=>counts[s.id]=uniq(CLASSES.filter(c=>c.sys===s.id)));
  const total = uniq(CLASSES);
  const chip = (id,label,c,n)=>`<button class="chip" style="--c:${c}" aria-pressed="${state.sys===id}" data-sys="${id}">${id==="all"?"":'<span class="dot"></span>'}${esc(label)} <span class="n">${n}</span></button>`;
  $("#chips").innerHTML = chip("all","All systems","var(--accent)",total) + SYSTEMS.map(s=>chip(s.id,s.name,s.hue,counts[s.id]||0)).join("");
}

function listHTML(v){
  if(Array.isArray(v)) return "<ul>"+v.map(x=>"<li>"+hl(x,state.q)+"</li>").join("")+"</ul>";
  return "<p>"+hl(v,state.q)+"</p>";
}
function cardHTML(c, hits, showSys){
  const sys = SYS[c.sys];
  const names = c.drugs.map(d=>d[0]).join(" · ");
  const open = state.open.has(c.id);
  const drugRows = c.drugs.map((d,i)=>`<div class="drow${hits.includes(i)&&state.q?" hit":""}"><div class="dn">${hl(d[0],state.q)}</div><div class="db">${d[1]&&d[1]!=="—"?hl(d[1],state.q):""}</div>${d[2]?`<div class="dnote">${hl(d[2],state.q)}</div>`:""}</div>`).join("");
  const secs = FIELDS.filter(([k])=>c[k]).map(([k,label,w])=>`<section class="sec k-${k}${w?" wide":""}"><h4>${label}</h4><div class="ans">${listHTML(c[k])}</div></section>`).join("");
  return `<details class="mono" data-id="${c.id}" style="--c:${sys.hue}"${open?" open":""}>
    <summary>
      <div class="s-head">${showSys?`<span class="systag">${esc(sys.name)}</span>`:""}<div class="s-title"><h3>${hl(c.name,state.q)}</h3>${c.sfx&&c.sfx!=="—"?`<span class="sfx">${esc(c.sfx)}</span>`:""}</div></div>
      <span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="s-drugs">${hl(names,state.q)}</div>
    </summary>
    <div class="body">
      <div class="druglist">${drugRows}</div>
      <div class="secs">${secs}</div>
      <div class="cardfoot"><button class="copybtn" data-copy="${c.id}">Copy as notes</button></div>
    </div>
  </details>`;
}

function renderDrugs(){
  const view = $("#view-drugs");
  const q = state.q.trim();
  let items = CLASSES.filter(c=>state.sys==="all"||c.sys===state.sys).map(c=>({c,...score(c,q)})).filter(x=>x.s>0);
  const nDrugs = uniq(items.map(x=>x.c));
  $("#count").textContent = q ? `${items.length} class${items.length===1?"":"es"} match` : `${items.length} classes · ${nDrugs} drugs`;
  if(!items.length){
    view.innerHTML = `<div class="empty">No match for “${esc(q)}”${state.sys!=="all"?" in "+esc(SYS[state.sys].name):""}. Try the generic name, a brand, or a suffix like <b>-olol</b>.${state.sys!=="all"?' <br><br><button class="tbtn" id="allsys">Search all systems</button>':""}</div>`;
    const b=$("#allsys"); if(b) b.onclick=()=>{state.sys="all";renderChips();render();};
    return;
  }
  if(q){
    items.sort((a,b)=>b.s-a.s);
    const strong = items.filter(x=>x.s>=70);
    if(strong.length && strong.length<=3) strong.forEach(x=>state.open.add(x.c.id));
    const top = items.filter(x=>x.s>=70), rest = items.filter(x=>x.s<70);
    let html = "";
    if(top.length) html += `<div class="group">${top.map(x=>cardHTML(x.c,x.hits,true)).join("")}</div>`;
    if(rest.length) html += `<div class="group"><h2>Also mentioned in</h2>${rest.map(x=>cardHTML(x.c,x.hits,true)).join("")}</div>`;
    view.innerHTML = html;
  } else {
    view.innerHTML = SYSTEMS.filter(s=>state.sys==="all"||s.id===state.sys).map(s=>{
      const cs = items.filter(x=>x.c.sys===s.id); if(!cs.length) return "";
      return `<div class="group" style="--c:${s.hue}"><h2><span class="tab"></span>${esc(s.name)}</h2>${cs.map(x=>cardHTML(x.c,[],false)).join("")}</div>`;
    }).join("");
  }
}

function tbl(head, rows, monoCols){
  const q = norm(state.q.trim());
  const rs = q ? rows.filter(r=>q.split(/\s+/).every(t=>norm(r.join(" ")).includes(t))) : rows;
  if(!rs.length) return `<p class="lede">No rows match “${esc(state.q)}”.</p>`;
  return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map((v,i)=>`<td${monoCols.includes(i)?' class="mono"':""}>${hl(v,state.q)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function renderQuick(){
  $("#count").textContent = state.q ? `Filtering tables for “${state.q}”` : "High-yield tables";
  $("#view-quick").innerHTML = `
  <section class="qsec"><h2>Antidotes & reversal agents</h2>${tbl(["Drug / toxin","Antidote"],QUICK.antidotes,[])}</section>
  <section class="qsec"><h2>Therapeutic drug levels</h2><p class="lede">Ranges vary by lab and edition; use your facility's reference range on the job.</p>${tbl(["Drug","Range","Note"],QUICK.levels,[1])}</section>
  <section class="qsec"><h2>Hold parameters (check before giving)</h2>${tbl(["Drug","Hold / call provider if"],QUICK.hold,[])}</section>
  <section class="qsec"><h2>High-alert medications</h2><p class="lede">ISMP high-alert list: errors with these cause the most harm. Expect independent double-checks.</p>${tbl(["Drug","Main danger / safeguard"],QUICK.highalert,[])}</section>
  <section class="qsec"><h2>Avoid in pregnancy</h2>${tbl(["Drug","Risk"],QUICK.pregnancy,[])}</section>
  <section class="qsec"><h2>Food & drug interactions</h2>${tbl(["Food / substance","Drugs affected"],QUICK.food,[])}</section>
  <section class="qsec"><h2>Lab normals that come up with meds</h2>${tbl(["Lab","Normal"],QUICK.labs,[1])}</section>
  <section class="qsec"><h2>Suffix recognition</h2>${tbl(["Ending","Class","Example"],QUICK.suffixes,[0])}</section>
  <p class="foot">Built from Lilley, <i>Pharmacology and the Nursing Process</i>, and the NCLEX-RN pharmacology content areas. This is a study aid, not a clinical reference; use current facility protocols and drug references in practice.</p>`;
}

function render(){
  document.body.classList.toggle("quiz", state.quiz);
  $("#quiz").checked = state.quiz;
  const drugs = state.tab==="drugs";
  $("#view-drugs").hidden = !drugs; $("#view-quick").hidden = drugs;
  $("#tab-drugs").setAttribute("aria-selected", drugs); $("#tab-quick").setAttribute("aria-selected", !drugs);
  $("#chips").hidden = !drugs; $("#expand").hidden = !drugs; $("#collapse").hidden = !drugs;
  $("#q").placeholder = drugs ? "Search a drug, brand, class or suffix (e.g. Lasix, -pril, hypokalemia)" : "Filter tables (e.g. digoxin, -olol, potassium)";
  $("#clear").hidden = !state.q;
  drugs ? renderDrugs() : renderQuick();
}

function copyText(c){
  const L = [];
  L.push(c.name.toUpperCase()+"  ("+SYS[c.sys].name+")" + (c.sfx&&c.sfx!=="—" ? "  Suffix: "+c.sfx : ""));
  L.push("DRUGS:");
  c.drugs.forEach(d=>L.push("  • "+d[0]+(d[1]&&d[1]!=="—"?" ("+d[1]+")":"")+(d[2]?" – "+d[2]:"")));
  FIELDS.forEach(([k,label])=>{ if(!c[k]) return; L.push(label.toUpperCase()+":"); [].concat(c[k]).forEach(x=>L.push("  • "+x)); });
  return L.join("\n");
}

/* Events */
let t;
$("#q").addEventListener("input", e=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=e.target.value; if(!state.q) state.open.clear(); render(); },120); });
$("#clear").addEventListener("click", ()=>{ state.q=""; $("#q").value=""; state.open.clear(); render(); $("#q").focus(); });
$("#chips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; state.sys=b.dataset.sys; renderChips(); render(); window.scrollTo({top:0}); });
$("#quiz").addEventListener("change", e=>{ state.quiz=e.target.checked; try{localStorage.setItem("pl_quiz",state.quiz?"1":"0")}catch(_){} document.querySelectorAll(".sec.revealed").forEach(s=>s.classList.remove("revealed")); render(); });
$("#expand").addEventListener("click", ()=>{ document.querySelectorAll("details.mono").forEach(d=>{d.open=true; state.open.add(d.dataset.id);}); });
$("#collapse").addEventListener("click", ()=>{ document.querySelectorAll("details.mono").forEach(d=>d.open=false); state.open.clear(); });
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click", ()=>{ state.tab = b.id==="tab-quick"?"quick":"drugs"; try{localStorage.setItem("pl_tab",state.tab)}catch(_){} render(); window.scrollTo({top:0}); }));
$("#view-drugs").addEventListener("toggle", e=>{ const d=e.target; if(d.matches&&d.matches("details.mono")){ d.open?state.open.add(d.dataset.id):state.open.delete(d.dataset.id); } }, true);
$("#view-drugs").addEventListener("click", e=>{
  const sec = e.target.closest(".sec");
  if(sec && document.body.classList.contains("quiz")){ sec.classList.toggle("revealed"); return; }
  const btn = e.target.closest(".copybtn"); if(!btn) return;
  const c = CLASSES.find(x=>x.id===btn.dataset.copy); const text = copyText(c);
  const done = ()=>{ btn.textContent="Copied"; btn.classList.add("ok"); setTimeout(()=>{btn.textContent="Copy as notes";btn.classList.remove("ok");},1600); };
  const fallback = ()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); done();}catch(_){ btn.textContent="Select text manually"; } ta.remove(); };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(_){ fallback(); }
});

renderChips(); render();
</script>

</body></html>
