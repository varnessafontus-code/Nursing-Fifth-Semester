<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Psych Meds Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a pocket psych drug handbook — sticky search + category index tabs, entries as expandable monographs */
:root{
  --paper:#EEF3F1; --card:#FFFFFF; --ink:#132029; --muted:#55646D; --line:#D2DCD9; --line-strong:#B9C7C3;
  --accent:#0A6A64; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --warn:#AD2318; --warn-soft:#FBEAE7; --tox:#663C9C; --tox-soft:#F0E9F8; --tip:#7C5300; --tip-soft:#FAF0D6; --lab:#1F5FA8; --lab-soft:#E4EEFA;
  --mark:#FFE07A; --mark-ink:#132029; --shadow:0 1px 2px rgba(19,32,41,.06),0 4px 14px rgba(19,32,41,.05);
  --s1:#3D5A98; --s2:#2F7D8C; --s3:#8A4E9C; --s4:#B23A48; --s5:#9C2B2B; --s6:#2E7FB8; --s7:#B07A14;
  --s8:#B5487E; --s9:#3E8E5E; --s10:#6E7F1F; --s11:#C2602B; --s12:#7A5A3A; --s13:#4F6470;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --warn:#FF8A7E; --warn-soft:#3A1C1A; --tox:#C3A2F0; --tox-soft:#2A2140; --tip:#F0C35C; --tip-soft:#33290F; --lab:#8DBBF2; --lab-soft:#172A40;
  --mark:#7A6417; --mark-ink:#FFF6D6; --shadow:0 1px 2px rgba(0,0,0,.3);
  --s1:#8AA6E6; --s2:#6CC3D2; --s3:#C99BDA; --s4:#F08B97; --s5:#E77F7F; --s6:#7DB8E6; --s7:#E7B95A;
  --s8:#EE93BD; --s9:#80C99C; --s10:#B6C760; --s11:#F1A070; --s12:#C9A27E; --s13:#9FB3BD;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --warn:#FF8A7E; --warn-soft:#3A1C1A; --tox:#C3A2F0; --tox-soft:#2A2140; --tip:#F0C35C; --tip-soft:#33290F; --lab:#8DBBF2; --lab-soft:#172A40;
  --mark:#7A6417; --mark-ink:#FFF6D6; --shadow:0 1px 2px rgba(0,0,0,.3);
  --s1:#8AA6E6; --s2:#6CC3D2; --s3:#C99BDA; --s4:#F08B97; --s5:#E77F7F; --s6:#7DB8E6; --s7:#E7B95A;
  --s8:#EE93BD; --s9:#80C99C; --s10:#B6C760; --s11:#F1A070; --s12:#C9A27E; --s13:#9FB3BD;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* Sticky header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.3rem;letter-spacing:-.01em;line-height:1.1}
.brand h1 span{color:var(--accent)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.search{position:relative}
.search input{width:100%;padding:11px 40px 11px 14px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--card);font-size:16px}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:1.2rem;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent))}
.chip .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.tools .count{margin-right:auto;font-family:var(--f-mono);font-size:.75rem}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:700;color:var(--ink)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:transform .15s}
.toggle input:checked + .sw{background:var(--accent)}
.toggle input:checked + .sw::after{transform:translateX(14px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.group h2 .tab{width:14px;height:14px;border-radius:3px;background:var(--c)}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* Monograph cards */
details.mono{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
details.mono[open]{border-color:var(--line-strong)}
details.mono > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
details.mono > summary::-webkit-details-marker{display:none}
.s-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.s-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.s-title h3{margin:0;font-family:var(--f-display);font-stretch:110%;font-weight:700;font-size:1.05rem;line-height:1.25;text-wrap:balance}
.sfx{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;white-space:nowrap}
.systag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.s-drugs{grid-column:1/2;color:var(--muted);font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chev{grid-row:1/3;grid-column:2;align-self:center;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
details[open] .chev{transform:rotate(180deg)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}

.body{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:14px}
.druglist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:9px 12px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .dn{font-weight:700}
.drow .db{font-style:italic;color:var(--muted);font-weight:400}
.drow .dnote{font-size:.88rem;color:var(--ink)}
.drow.hit{background:var(--tip-soft)}
@media (min-width:720px){ .drow{grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:4px 16px} .drow .dnote{grid-column:2;grid-row:1/3} }

.secs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:760px){ .secs{grid-template-columns:repeat(2,minmax(0,1fr))} .sec.wide{grid-column:1/-1} }
.sec{border-radius:10px;padding:10px 12px;background:var(--paper);min-width:0}
.sec h4{margin:0 0 4px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sec .ans p{margin:0}
.sec .ans ul{margin:0;padding-left:1.1em}
.sec .ans li{margin:2px 0}
.sec.k-ae,.sec.k-warn{background:var(--warn-soft)} .sec.k-ae h4,.sec.k-warn h4{color:var(--warn)}
.sec.k-tox{background:var(--tox-soft)} .sec.k-tox h4{color:var(--tox)}
.sec.k-hesi{background:var(--tip-soft)} .sec.k-hesi h4{color:var(--tip)}
.sec.k-kid{background:var(--accent-soft)} .sec.k-kid h4{color:var(--accent)}
.sec.k-kid .ans{font-style:italic}
.sec.k-labs{background:var(--lab-soft)} .sec.k-labs h4{color:var(--lab)}
.sec.k-labs li b{font-weight:700}
.dg{color:var(--lab);font-weight:700;margin-right:2px;cursor:help}
.srcline{margin:0;font-size:.8rem;color:var(--muted)}
.srcline b{color:var(--ink)}
table.wide{min-width:980px}
table.mid{min-width:680px}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--ink);cursor:pointer}
.qsec{scroll-margin-top:150px}

.cardfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.copybtn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.82rem}
.copybtn.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Self-test mode */
body.quiz .sec .ans{filter:blur(6px);user-select:none;cursor:pointer;transition:filter .15s}
body.quiz .sec.revealed .ans{filter:none;user-select:text}
body.quiz .sec{cursor:pointer}
body.quiz .sec h4::after{content:" · tap to reveal";text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted)}
body.quiz .sec.revealed h4::after{content:""}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line-strong);border-radius:12px}

/* Quick reference */
.qsec{display:flex;flex-direction:column;gap:8px}
.qsec h2{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:1rem}
.qsec p.lede{margin:0;color:var(--muted);font-size:.88rem}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
td.mono{font-family:var(--f-mono);font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child{font-weight:700}
.foot{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Psych Meds <span>Lookup</span></h1>
      <div class="tabs" role="tablist" aria-label="View">

</header>

<script>
const SYSTEMS = [
  {id:"dep", name:"Antidepressants", hue:"var(--s3)"},
  {id:"mood", name:"Mood Stabilizers", hue:"var(--s7)"},
  {id:"apsy", name:"Antipsychotics", hue:"var(--s4)"},
  {id:"anx", name:"Anxiety Meds", hue:"var(--s2)"},
  {id:"sleep", name:"Sleep & Wake Meds", hue:"var(--s1)"},
  {id:"adhd", name:"ADHD Meds", hue:"var(--s11)"},
  {id:"dem", name:"Dementia Drugs", hue:"var(--s12)"},
  {id:"sud", name:"Substance Use & Withdrawal", hue:"var(--s9)"},
  {id:"eps", name:"EPS & Emergency Treatments", hue:"var(--s6)"},
  {id:"other", name:"Other Psych-Related", hue:"var(--s13)"}
];

const CLASSES = [
/* ============ ANTIDEPRESSANTS ============ */
{sys:"dep", name:"SSRIs (Selective Serotonin Reuptake Inhibitors)", sfx:"no single suffix; -oxetine, -pram", ch:"3, 14, 15, 16, 18",
 drugs:[["fluoxetine","Prozac, Prozac Weekly, Sarafem","Most activating: insomnia and nervousness, so give in the morning. Very long half-life (once-weekly form exists). Only FDA drug for bulimia; also PMDD. †Longest washout: 5 weeks before an MAOI. †Least discontinuation syndrome."],
  ["sertraline","Zoloft","Most GI upset (diarrhea). FDA approved for PTSD, panic, social anxiety, OCD. †Often chosen in pregnancy, breastfeeding and cardiac patients."],
  ["paroxetine","Paxil, Paxil CR, Pexeva, Brisdelle","Most anticholinergic (avoid in narrow-angle glaucoma). Most calming SSRI. Avoid in pregnancy: fetal heart defects. Brisdelle treats menopausal hot flashes. †Worst discontinuation syndrome and most weight gain."],
  ["citalopram","Celexa","Dose-dependent QT prolongation. Caution with low potassium or other QT drugs; ECG in high-risk patients. †Max 40 mg/day (20 mg/day over age 60)."],
  ["escitalopram","Lexapro","S-enantiomer of citalopram. FDA approved for generalized anxiety disorder. †Fewest drug interactions; less QT effect than citalopram."],
  ["fluvoxamine","Luvox","Most sedating: start at bedtime. Used for OCD. Contraindicated with ramelteon. †Many CYP interactions (raises clozapine, theophylline, warfarin levels)."]],
 moa:"Block the reuptake of serotonin, so more serotonin stays in the synapse. Receptors slowly down-regulate, which is why the benefit is delayed.",
 use:["Major depressive disorder (first line)","Anxiety disorders: GAD, panic disorder, social anxiety (first line)","OCD (fluoxetine, fluvoxamine, paroxetine, sertraline)","PTSD (sertraline, paroxetine)","Bulimia nervosa and PMDD (fluoxetine)"],
 exp:["Better mood, sleep, appetite, energy and concentration; fewer anxious or obsessive thoughts","Textbook (Ch. 3): 4 to 8 weeks for onset","†Standard references: first signs in 1–3 weeks, full effect in 4–8 weeks (often quoted as 2–6 weeks). Sleep and energy improve before mood","May increase anxiety at first, especially fluoxetine and sertraline"],
 se:["Nausea, diarrhea, dry mouth","Sexual dysfunction (anorgasmia, low libido)","Insomnia, restlessness, jitteriness, tremor","Headache, sweating, weight change","Fatigue or dizziness"],
 ae:["SEROTONIN SYNDROME","Suicidal thinking early in treatment","Hyponatremia, †especially in older adults (SIADH)","Discontinuation syndrome if stopped abruptly: dizziness, insomnia, nervousness, irritability, nausea, agitation","Rare induction of mania","†Bleeding (impaired platelets), worse with NSAIDs or anticoagulants","QT prolongation (citalopram)"],
 warn:["BOXED WARNING (all antidepressants): suicidal thinking and behavior in children and adolescents; †extended to young adults up to age 24","Never combine with an MAOI","Paroxetine: avoid in pregnancy","Older adults: start at half the lowest adult dose; change no more often than every 7 days","†Screen for bipolar disorder first: an antidepressant alone can trigger mania"],
 tox:["Serotonin syndrome: hyperactivity or restlessness, tachycardia, fever, high BP, delirium, myoclonus, incoordination, rigidity, abdominal pain and diarrhea, seizures","†Classic exam clues: hyperreflexia, clonus, shivering, dilated pupils, onset within hours of a dose change or new drug","Treatment: stop the offending drug; cyproheptadine (serotonin blocker), cooling blankets, diazepam or dantrolene for rigidity, anticonvulsants, ventilation if needed","Overdose of an SSRI alone is rarely lethal. No specific antidote"],
 int:["MAOIs: serotonin syndrome. See washout table","Other serotonergic drugs: buspirone, dextromethorphan, †triptans, tramadol, meperidine, linezolid, lithium, St. John's wort","Digoxin and warfarin: tell the provider","Alcohol: avoid","†NSAIDs, aspirin, anticoagulants: bleeding","†Fluoxetine and paroxetine inhibit CYP2D6 (raise TCA, antipsychotic and tamoxifen effects)"],
 mon:["Suicide risk, especially in the first weeks and at dose changes","Mood, sleep, appetite, anxiety level","Signs of serotonin syndrome","Sexual side effects (ask; patients rarely volunteer)","†Weight, and falls in older adults"],
 labs:["Liver and renal function tests and blood counts: checked periodically (textbook patient teaching)","Serum sodium: hyponatremia, †highest risk in older adults and with diuretics","ECG (QT): citalopram in high-risk patients; correct low potassium first","†INR if on warfarin"],
 ed:["It takes weeks to work. Keep taking it even when you feel better","Do not stop suddenly. The dose is tapered","No MAOI within 14 days. No over-the-counter drugs or herbs without asking","Avoid alcohol. Do not drive until you know how it affects you","Report right away: worse depression or suicidal thoughts, rash, fever, unusual bleeding, severe headache, racing heart","Tell the provider about sexual side effects; there are fixes","†Take fluoxetine in the morning; take with food if nauseated"],
 kid:"Serotonin is the brain's 'feel steady' messenger. Normally it gets vacuumed back up right after it is sent. An SSRI clogs the vacuum, so the message hangs around longer. It takes weeks because the brain has to slowly adjust to the louder signal.",
 hesi:"Energy returns before mood lifts, so suicide risk is highest in the first weeks. SSRI + MAOI = serotonin syndrome. Fever, clonus and hyperreflexia after a new serotonergic drug = serotonin syndrome, not NMS."},

{sys:"dep", name:"SNRIs (Serotonin Norepinephrine Reuptake Inhibitors)", sfx:"-faxine, -nacipran", ch:"3, 14, 15",
 drugs:[["venlafaxine","Effexor, Effexor XR","Serotonin only at low doses; norepinephrine reuptake blockade starts above 150 mg/day. Raises BP. Most likely to cause discontinuation syndrome. GAD, panic, social anxiety."],
  ["desvenlafaxine","Pristiq, Khedezla","Active metabolite of venlafaxine. Neonates exposed in utero have needed respiratory support and tube feeding."],
  ["duloxetine","Cymbalta","Also diabetic neuropathy, fibromyalgia, chronic musculoskeletal pain. GAD (approved ages 7–17 too). †Hepatotoxic: avoid with heavy alcohol use or liver disease."],
  ["levomilnacipran","Fetzima","Most noradrenergic SNRI. Urinary hesitancy in up to 6%. Raises heart rate; may increase anticoagulant effect."],
  ["milnacipran","Savella","Fibromyalgia only; not approved for depression."]],
 moa:"Block the reuptake of both serotonin and norepinephrine. Norepinephrine also turns on the descending pain-blocking pathways in the spinal cord.",
 use:["Major depressive disorder (first line)","Generalized anxiety, panic and social anxiety disorder","Neuropathic pain, fibromyalgia, chronic musculoskeletal pain (duloxetine)","Common next step after an SSRI fails (venlafaxine)"],
 exp:["Better mood and energy, less anxiety, less nerve pain","Textbook (Ch. 3): 4 to 8 weeks","†Standard references: 2–6 weeks, full effect up to 8 weeks"],
 se:["Nausea, dry mouth, constipation","Excessive sweating (more than SSRIs)","Insomnia or sedation, dizziness, headache","Sexual dysfunction","Reduced appetite"],
 ae:["Dose-dependent rise in blood pressure and heart rate","Serotonin syndrome","Suicidal thinking","Discontinuation syndrome: flu-like symptoms, insomnia, nausea, dizziness, paresthesias, anxiety (venlafaxine is worst)","†Hyponatremia; bleeding","†Liver injury (duloxetine)"],
 warn:["BOXED WARNING: suicidal thinking in children, adolescents †and young adults","Never combine with an MAOI","Uncontrolled hypertension: use with caution","†Narrow-angle glaucoma","†Duloxetine: avoid in liver disease and heavy alcohol use"],
 tox:["Serotonin syndrome (see SSRIs). Stop the drug, supportive care, cyproheptadine","†Overdose: tachycardia, hypertension, seizures; venlafaxine is more dangerous in overdose than SSRIs. No antidote"],
 int:["MAOIs: serotonin syndrome and hypertensive crisis","Other serotonergic drugs","Anticoagulants: bleeding (levomilnacipran noted in the textbook)","†Alcohol with duloxetine: liver injury"],
 mon:["Blood pressure and heart rate at baseline and periodically, especially at dose changes","Suicide risk","Pain scores when used for pain","†Urinary hesitancy (levomilnacipran)"],
 labs:["†Serum sodium in older adults","†Liver function tests with duloxetine","†No drug level is drawn"],
 ed:["Do not stop suddenly; the dose is tapered slowly","Check your blood pressure regularly","It takes weeks to work","†Swallow extended-release capsules whole","†Limit alcohol (duloxetine)"],
 kid:"An SSRI turns up one messenger. An SNRI turns up two: serotonin for 'steady' and norepinephrine for 'get up and go'. Norepinephrine is also why your heart beats harder and why pain signals get quieter.",
 hesi:"Venlafaxine = watch BP and never stop abruptly. Duloxetine = depression plus pain, watch the liver."},

{sys:"dep", name:"Atypical Antidepressants", sfx:"-zodone (trazodone, nefazodone, vilazodone)", ch:"3, 14, 22",
 drugs:[["bupropion","Wellbutrin, Aplenzin, Forfivo XL, Zyban","NDRI: blocks norepinephrine and dopamine reuptake. No serotonin effect, so little sexual dysfunction (given for SSRI-induced sexual dysfunction). Insomnia, tremor, weight loss. Seizures (0.4%). Smoking cessation as Zyban."],
  ["mirtazapine","Remeron","NaSSA: blocks presynaptic alpha-2 and postsynaptic 5-HT2 and 5-HT3 receptors. Sedation, appetite stimulation, weight gain. Chosen for depression with insomnia and weight loss. Fewer GI and sexual effects. †Give at bedtime. Rare agranulocytosis."],
  ["trazodone","Desyrel, Oleptro","SARI. Very sedating; used off label for insomnia at low dose (e.g., 50 mg at bedtime). Orthostatic hypotension from alpha-1 blockade. PRIAPISM."],
  ["nefazodone","generic only (was Serzone)","SARI. Rarely used: rare life-threatening liver failure. Avoid in liver impairment. Inhibits CYP3A4. Little sexual dysfunction."],
  ["vilazodone","Viibryd","SSRI plus 5-HT1A partial agonist (like buspirone). Take with food to absorb it. Diarrhea, nausea, insomnia."],
  ["vortioxetine","Trintellix","Serotonin modulator: reuptake inhibitor plus actions at several serotonin receptors. Nausea, constipation, vomiting. May improve cognition; sexual dysfunction from SSRIs may improve after a switch. †21-day washout before an MAOI."]],
 moa:"Each one raises serotonin, norepinephrine or dopamine by a different route than a plain SSRI: blocking reuptake of other transmitters (bupropion), blocking the brake receptors that hold transmitters back (mirtazapine), or blocking and stimulating specific serotonin receptors (trazodone, vilazodone, vortioxetine).",
 use:["Major depressive disorder","Smoking cessation (bupropion)","Insomnia, off label (trazodone)","Depression with poor appetite, weight loss or insomnia (mirtazapine)","†Seasonal affective disorder (bupropion XL)"],
 exp:["Better mood, sleep and appetite","Textbook (Ch. 3): antidepressants take 4 to 8 weeks. Mirtazapine's antidepressant effect may come faster (Ch. 14)","†Sleep (trazodone, mirtazapine) improves with the first doses"],
 se:["Bupropion: insomnia, agitation, tremor, headache, anorexia, weight loss, nausea","Mirtazapine: sedation, increased appetite, weight gain, dizziness","Trazodone and nefazodone: sedation, dizziness, hypotension, headache, nausea, blurred vision","Vilazodone and vortioxetine: nausea, diarrhea or constipation, vomiting"],
 ae:["Seizures (bupropion), risk rises with dose","Priapism (trazodone; nefazodone rarely)","Liver failure (nefazodone)","Serotonin syndrome (all except bupropion)","Hyponatremia and rare mania (vortioxetine)","Suicidal thinking"],
 warn:["BOXED WARNING: suicidal thinking in children, adolescents †and young adults","Bupropion is contraindicated in seizure disorders, eating disorders (anorexia, bulimia), and during abrupt withdrawal from alcohol or sedatives including benzodiazepines","Nefazodone: avoid with pre-existing liver disease","†Bupropion maximum 450 mg/day; do not crush or double up"],
 tox:["†Bupropion overdose: seizures, tachycardia, QRS widening. Benzodiazepines for seizures","Serotonin syndrome with the serotonergic agents: stop the drug, supportive care, cyproheptadine","†Priapism lasting more than 4 hours is a urologic emergency","No specific antidote"],
 int:["MAOIs: contraindicated","Alcohol, benzodiazepines and other CNS depressants add to sedation (mirtazapine, trazodone)","Nefazodone raises levels of CYP3A4 drugs","†Bupropion inhibits CYP2D6 and lowers the seizure threshold with other threshold-lowering drugs (tramadol, antipsychotics, stimulants)"],
 mon:["Suicide risk","Seizure history and eating disorder history before bupropion","Orthostatic BP and fall risk (trazodone)","Weight (mirtazapine up, bupropion down)","Sleep pattern"],
 labs:["†Liver function tests with nefazodone","†Sodium with vortioxetine in older adults","†Lipids and weight with mirtazapine; CBC if fever or sore throat","†No drug levels"],
 ed:["Bupropion: take the last dose early in the day to protect sleep; no alcohol binges","Mirtazapine and trazodone: take at bedtime; rise slowly","Trazodone: an erection that will not go away needs emergency care","Vilazodone: take with food","Do not stop suddenly"],
 kid:"These are the 'different door' antidepressants. Bupropion is the wake-up one (no sleepiness, no weight gain, but can spark a seizure). Mirtazapine and trazodone are the sleepy ones. Each takes a different door to the same room.",
 hesi:"Bupropion: seizures, no sexual side effects, never in bulimia or anorexia. Trazodone: priapism and orthostasis. Mirtazapine: sleepy and hungry."},

{sys:"dep", name:"Tricyclic Antidepressants (TCAs)", sfx:"-triptyline, -pramine", ch:"3, 14, 15",
 drugs:[["amitriptyline","Elavil (generic only)","Tertiary amine: blocks serotonin and norepinephrine reuptake. Off label for migraine and neuropathic pain. †Most sedating and anticholinergic."],
  ["nortriptyline","Pamelor, Aventyl","Secondary amine: mainly norepinephrine. †Fewer anticholinergic effects and less orthostasis; preferred TCA in older adults. Therapeutic level 50–150 ng/mL."],
  ["imipramine","Tofranil","Tertiary amine. †Also childhood enuresis."],
  ["desipramine","Norpramin","Secondary amine: mainly norepinephrine. †Least sedating; most cardiotoxic in overdose."],
  ["clomipramine","Anafranil","FDA approved for OCD (ages 10 and up). †The most serotonergic TCA; lowers the seizure threshold; high serotonin syndrome risk."],
  ["doxepin","Sinequan; Silenor (low dose)","Low dose (Silenor) is approved for insomnia with trouble staying asleep. Strong H1 blocker."],
  ["amoxapine","generic only","Also blocks dopamine receptors, †so it can cause EPS, tardive dyskinesia and NMS."],
  ["protriptyline, trimipramine, maprotiline","Vivactil, Surmontil, generic","Less used. †Protriptyline is activating. Maprotiline is a tetracyclic with seizure risk."]],
 moa:"Block the reuptake of norepinephrine and serotonin. They also block histamine (H1), alpha-1 and muscarinic (M1) receptors, which causes most of the side effects, and sodium channels in the heart, which is why overdose kills.",
 use:["Depression (second line because of side effects and lethality in overdose)","OCD (clomipramine)","Neuropathic pain and migraine prevention, off label","Insomnia (low-dose doxepin)","May work better in melancholic depression"],
 exp:["Better mood, sleep and appetite; less nerve pain","Textbook (Ch. 3): 4 to 8 weeks for antidepressant effect","†Sedation and anticholinergic effects appear with the first doses; pain relief often in 1–2 weeks"],
 se:["Anticholinergic: dry mouth, blurred vision, constipation, urinary retention, tachycardia, esophageal reflux","Sedation (H1 block)","Orthostatic hypotension and dizziness (alpha-1 block)","Weight gain","Confusion or memory problems in older adults"],
 ae:["Cardiac conduction disturbances and dysrhythmias","Seizures","Suicidal thinking","Lethal in overdose","†Mania switch in bipolar disorder"],
 warn:["BOXED WARNING: suicidal thinking in children, adolescents †and young adults","Recent MI or other cardiovascular disease, narrow-angle glaucoma, seizure history, pregnancy: avoid or use extreme caution","Older adults: caution with cardiac disease, urinary retention, hyperthyroidism, liver or kidney dysfunction","Suicidal patients: dispense the smallest quantity possible","†On the Beers list (avoid in older adults)"],
 tox:["Overdose: dysrhythmias, tachycardia, heart block, MI. Early CNS stimulation (hyperpyrexia, delirium, hypertension, hallucinations, seizures, hyperreflexia), then CNS depression","†Antidote for cardiotoxicity: IV sodium bicarbonate (for QRS over 100 ms or ventricular dysrhythmia)","†Continuous ECG, airway support, activated charcoal if recent, benzodiazepines for seizures","†Do not give physostigmine or flumazenil","†As little as a 1-week supply can be fatal"],
 int:["MAOIs: used cautiously per the textbook; †most references say do not combine (hypertensive crisis, serotonin syndrome)","Alcohol and CNS depressants: more sedation","Other anticholinergic drugs: additive effects","†SSRIs (fluoxetine, paroxetine) raise TCA levels","†Other QT-prolonging drugs"],
 mon:["Suicide risk and how many pills the patient has on hand","Orthostatic BP and heart rate","Bowel and bladder function; urinary retention and severe constipation need medical attention","Sedation and fall risk"],
 labs:["Serum TCA levels: some may be monitored","†ECG at baseline and periodically, especially over age 40 or with heart disease (QRS and QT)","†Nortriptyline 50–150 ng/mL; any tricyclic total above 500 ng/mL is toxic, above 1000 ng/mL life-threatening","†Liver function"],
 ed:["Take the whole daily dose at bedtime: it helps sleep and you sleep through the side effects","Rise slowly","Sugarless gum, fluids and fiber for dry mouth and constipation","Do not stop suddenly","Keep away from children; an overdose is deadly"],
 kid:"TCAs are the old, messy antidepressants. They turn up the mood messengers but also bump into lots of other switches: the 'dry everything up' switch, the 'sleepy' switch, and the heart's electrical wiring. Too many pills and the heart wiring fails.",
 hesi:"TCA overdose = cardiac dysrhythmias; give sodium bicarbonate. Give only a small supply to a suicidal patient. Anticholinergic side effects: can't see, can't pee, can't spit, can't poop."},

{sys:"dep", name:"MAOIs (Monoamine Oxidase Inhibitors)", sfx:"—", ch:"3, 14",
 drugs:[["phenelzine","Nardil","†Most sedating; weight gain and orthostasis."],
  ["tranylcypromine","Parnate","†Most stimulating (amphetamine-like); insomnia."],
  ["isocarboxazid","Marplan","†Least used."],
  ["selegiline transdermal","Emsam","The only antidepressant patch. No strict diet restrictions at the lowest dose †(6 mg/24 h); higher doses need the tyramine diet. †Oral selegiline is a Parkinson drug."]],
 moa:"Inhibit the enzyme monoamine oxidase, which normally breaks down serotonin, norepinephrine and dopamine. More of all three stay available. The same enzyme in the gut and liver breaks down tyramine from food, so tyramine builds up and causes vasoconstriction.",
 use:["Depression when other drugs fail (last-line or third-line)","†Atypical depression","Suggested for PTSD if other drugs fail (phenelzine)"],
 exp:["Better mood and energy","Textbook (Ch. 3): antidepressants take 4 to 8 weeks","†Standard references: 2–4 weeks, sometimes longer"],
 se:["Orthostatic hypotension (expected)","Insomnia, sedation, weakness, fatigue","Weight gain, edema","Constipation, urinary hesitancy","Sexual dysfunction (anorgasmia)","Muscle twitching or cramps","Changes in heart rate and rhythm"],
 ae:["HYPERTENSIVE CRISIS with tyramine or sympathomimetic drugs","Serotonin syndrome with serotonergic drugs","Hypomania or mania","Suicidal thinking"],
 warn:["BOXED WARNING: suicidal thinking in children, adolescents †and young adults","Contraindicated with: cerebrovascular disease, hypertension, heart failure, liver disease, recurrent severe headaches, surgery in the previous 10 to 14 days, age under 16","Contraindicated with SSRIs and many other drugs","Keep diet and drug restrictions for 14 days after stopping","†Pheochromocytoma"],
 tox:["Hypertensive crisis: starts 15 to 90 minutes after the food or drug. Severe headache, palpitations, tachycardia, flushing, sweating, nausea and vomiting, then fever, seizures, coma, death (stroke, intracranial bleed)","†Classic clue: sudden occipital headache with stiff neck","Treatment: emergency care. Phentolamine 5 mg IV (textbook; also nitroprusside or nitroglycerin). Cooling blankets or ice packs, fluids, IV benzodiazepines for agitation or seizures. Gastric lavage and charcoal if recent","Textbook also lists sublingual nifedipine 10 mg. †Most current references no longer recommend sublingual nifedipine (BP can drop too fast)"],
 int:["Tyramine foods: see the tyramine table","SSRIs, SNRIs, buspirone, dextromethorphan, †meperidine, tramadol, linezolid: serotonin syndrome","Cold, allergy and congestion remedies (ephedrine, pseudoephedrine, phenylephrine), stimulants (amphetamines, cocaine): hypertensive crisis","TCAs, opioids, antihypertensives (methyldopa, reserpine), levodopa, L-tryptophan, general anesthetics, alcohol, barbiturates, benzodiazepines","†Tell the surgeon and dentist"],
 mon:["Blood pressure, lying then sitting or standing after 1–2 minutes. Ideally monitor BP for the first 6 weeks","Headache: assume crisis until proven otherwise","Diet adherence","Suicide risk","Fall risk in older adults"],
 labs:["†Blood glucose in diabetics (MAOIs can lower glucose)","†Liver function tests (rare hepatotoxicity with phenelzine and isocarboxazid)","BP is the priority check; there is no drug level"],
 ed:["Avoid aged, cured, fermented, smoked or ripened foods","No cold remedies or any new drug without checking first","Go to the emergency department for a severe headache","Carry a wallet card listing the MAOI","Keep the diet and drug rules for 14 days after stopping","Rise slowly"],
 kid:"MAO is the cleanup crew that sweeps away used-up mood messengers. The drug sends the crew home, so messengers pile up and mood lifts. But the same crew also cleans up tyramine from old cheese and cured meat. With no crew, tyramine piles up and squeezes the blood vessels until the pressure is dangerously high.",
 hesi:"MAOI + aged cheese, cured meat, or pseudoephedrine = hypertensive crisis (severe headache). MAOI + SSRI = serotonin syndrome. 14-day rule both for washout and for the diet after stopping."},

{sys:"dep", name:"Rapid-Acting & Novel Antidepressants", sfx:"—", ch:"3, 14",
 drugs:[["esketamine","Spravato","NMDA receptor (glutamate) antagonist nasal spray for treatment-resistant depression (two failed antidepressant trials). Used with an oral antidepressant. Schedule III. Given only in a certified setting; monitor at least 2 hours after each dose."],
  ["brexanolone","Zulresso","First drug approved for postpartum depression. Neuroactive steroid acting on GABA-A. One continuous 60-hour IV infusion. Schedule IV; restricted program. Continuous pulse oximetry."],
  ["†zuranolone","Zurzuvae","Oral neuroactive steroid for postpartum depression. One capsule each evening with a fatty meal for 14 days. No driving for 12 hours after a dose."],
  ["†dextromethorphan-bupropion","Auvelity","Oral NMDA antagonist combination for major depression. Effect within about 1 week. Carries bupropion's seizure warnings."],
  ["†gepirone","Exxua","5-HT1A agonist (related to buspirone). Take with food. QT prolongation: ECG before and during. Little sexual dysfunction or weight gain."]],
 moa:"Esketamine blocks NMDA receptors so glutamate signaling changes within hours. Brexanolone and zuranolone copy allopregnanolone, a progesterone metabolite that boosts calming GABA-A receptors; its level drops sharply after delivery.",
 use:["Treatment-resistant depression (esketamine)","Depression with acute suicidal ideation, †approved; off label per the textbook (esketamine)","Postpartum depression (brexanolone, †zuranolone)"],
 exp:["Esketamine: †improvement within hours to days. Dosed twice weekly for 4 weeks, weekly for 4 weeks, then every 1–2 weeks","Brexanolone: rapid relief over the 60-hour (2.5-day) infusion","†Zuranolone: improvement within days of the 14-day course"],
 se:["Esketamine: dissociation, increased blood pressure, dizziness, sedation, vertigo, numbness, anxiety, nausea, feeling drunk, urinary urgency or dysuria","Brexanolone: sedation, dry mouth, flushing, hot flashes","†Zuranolone: sleepiness, dizziness, diarrhea, fatigue"],
 ae:["Esketamine: marked sedation, dissociation, hypertension, misuse","Brexanolone: excessive sedation, sudden loss of consciousness, hypoxia","†Zuranolone: CNS depression and impaired driving","Suicidal thinking"],
 warn:["†BOXED WARNING (esketamine): sedation, dissociation, abuse and misuse, suicidal thoughts. REMS program","†BOXED WARNING (brexanolone): excessive sedation and sudden loss of consciousness. REMS program","†BOXED WARNING (zuranolone): impaired ability to drive","Esketamine is not for home use","†Esketamine: avoid with aneurysmal vascular disease or history of intracerebral hemorrhage"],
 tox:["No specific antidote. Supportive care","Brexanolone: stop the infusion for excessive sedation or hypoxia","Esketamine: manage a BP spike or prolonged dissociation in the clinic before discharge"],
 int:["Alcohol, opioids, benzodiazepines and other CNS depressants: more sedation","†Stimulants and MAOIs raise BP further with esketamine"],
 mon:["Esketamine: BP before and after each dose; watch for dissociation and sedation for at least 2 hours","Brexanolone: continuous pulse oximetry; stay with the mother during contact with her infant","Suicide risk","Level of sedation"],
 labs:["†No routine labs or drug levels","†Pregnancy test before zuranolone (fetal harm; contraception during and for 1 week after)","†ECG with gepirone"],
 ed:["Esketamine: no food for 2 hours and no liquids for 30 minutes before. Do not prime the device; blow your nose before the first spray only; recline the head at 45 degrees; rest 5 minutes between devices","No driving or hazardous activity until the next day after a full night's sleep (esketamine)","Arrange a ride home","Brexanolone: someone must be with you when you are with your baby"],
 kid:"Most antidepressants are like planting seeds: you wait weeks. These are more like flipping a breaker switch. They act on different wiring (glutamate or GABA) and can work in hours or days, but they can make you very sleepy or 'floaty', so a nurse has to watch you.",
 hesi:"Esketamine: monitor BP and stay 2 hours; never take home. Brexanolone: continuous pulse ox and never leave mom alone with the baby during the infusion."},

/* ============ MOOD STABILIZERS ============ */
{sys:"mood", name:"Lithium", sfx:"—", ch:"3, 13",
 drugs:[["lithium carbonate","Eskalith, Eskalith CR, Lithobid","Gold standard mood stabilizer. FDA approved for acute mania and bipolar maintenance. Has antisuicidal properties. Narrow therapeutic index."],
  ["†lithium citrate","generic oral solution","Liquid form for patients who cannot swallow tablets or who cheek medication."]],
 moa:"Not fully understood. Lithium is a positive ion similar to sodium and potassium. It stabilizes electrical activity at the neuron membrane, reduces excitatory glutamate, inhibits inositol monophosphatase and enhances serotonin. The kidney handles it like sodium.",
 use:["Acute mania","Bipolar maintenance (prevents relapse)","Best for elation, grandiosity, flight of ideas, irritability, anxiety and self-injurious behavior","Reduces suicide risk","†Augmentation in treatment-resistant depression"],
 exp:["Calmer mood, slower speech, more sleep, less grandiosity and impulsivity","Takes 7 to 14 days (or longer) to reach a therapeutic level and effect","†An antipsychotic or benzodiazepine is often used at first to control behavior while lithium builds"],
 se:["Fine hand tremor","Nausea, vomiting, diarrhea","Thirst and polyuria","Weight gain (up to 5 lb of water weight in the first week)","Lethargy, sedation","Acne, alopecia, psoriasis","Edema"],
 ae:["Lithium toxicity","Hypothyroidism and goiter with long-term use","Renal toxicity with long-term use","Hyperparathyroidism","†Nephrogenic diabetes insipidus","†ECG changes (T-wave flattening), sinus node dysfunction","†Leukocytosis (benign)"],
 warn:["†BOXED WARNING: lithium toxicity is closely related to serum levels and can occur near therapeutic doses; use only where levels can be monitored","Generally contraindicated in cardiovascular disease, brain damage, renal disease, thyroid disease, myasthenia gravis","Pregnancy: avoid when possible, †Ebstein anomaly of the tricuspid valve in the first trimester","Breastfeeding: contraindicated","Children: textbook says contraindicated under age 12; †FDA labeling now allows use from age 7","Dehydration and low sodium raise the level"],
 tox:["Below 1.5 mEq/L (side effects): nausea, vomiting, diarrhea, thirst, polyuria, lethargy, sedation, fine hand tremor","1.5–2.0 mEq/L (early toxicity): GI upset, COARSE hand tremor, confusion, muscle hyperirritability, sedation, incoordination. Hold the drug, draw a level, re-evaluate the dose","2.0–2.5 mEq/L (advanced): ataxia, giddiness, blurred vision, clonic movements, large output of dilute urine, seizures, stupor, severe hypotension, coma. Hospitalize, stop the drug, hasten excretion; whole bowel irrigation","Above 2.5 mEq/L (severe): convulsions, oliguria, death. Hemodialysis","NO ANTIDOTE. †IV normal saline to restore volume and promote excretion"],
 int:["Raise lithium levels: thiazide diuretics (hydrochlorothiazide), ACE inhibitors (lisinopril), NSAIDs (ibuprofen, naproxen)","Lower lithium levels: caffeine, high sodium intake","Low sodium intake, dehydration, vomiting, diarrhea, heavy sweating: raise levels","†ARBs raise levels; theophylline and osmotic diuretics lower them","†Serotonergic drugs: serotonin syndrome; antipsychotics: neurotoxicity"],
 mon:["Tremor: fine is expected, coarse means toxicity","Fluid balance, intake and output, weight","GI losses, fever, sweating","Mental status and gait","†Pulse and ECG in cardiac patients"],
 labs:["Serum lithium, textbook: acute mania 0.8–1.2 mEq/L (1.0–1.2 may work best); maintenance 0.6–0.8 mEq/L; 0.4–0.6 in some cases","†Serum lithium, standard references: 0.6–1.2 mEq/L overall (acute 0.8–1.2, maintenance 0.6–1.0); toxic at 1.5 and above","Draw as a 12-hour trough (12 hours after the last dose)","How often, textbook: every 2 to 3 days after starting and after any dose change until therapeutic, then every 3 to 6 months","†How often, standard references: about 5 days after starting or changing a dose (steady state), then every 1–3 months, then every 6 months when stable","Renal function (BUN, creatinine) at baseline and then yearly","Thyroid (T4 and TSH) at baseline and then yearly","Sodium: low sodium raises lithium","†Calcium (hyperparathyroidism), pregnancy test, CBC","ECG as needed for the patient's condition"],
 ed:["Lithium is not addictive. Keep taking it after the episode ends","Drink a consistent 1500–3000 mL of fluid a day (textbook); †most references say 2–3 L","Keep salt intake consistent. Do not start a low-salt diet","Stop the drug and call if you have a lot of vomiting, diarrhea or sweating","Take with meals to limit stomach upset","No NSAIDs or other over-the-counter drugs without asking. Tell the prescriber about diuretics","Keep a list of toxic signs and a contact number","It is tapered, not stopped suddenly, to lower the risk of relapse"],
 kid:"Lithium is a salt, and the kidneys can't tell it apart from table salt. If you get low on salt or water (sweating, throwing up, water pills), the kidneys grab extra salt back from the urine and grab the lithium with it. Then too much lithium stays in the blood.",
 hesi:"Low sodium or dehydration = high lithium. Fine tremor is a side effect; coarse tremor, confusion and ataxia are toxicity. A level of 1.5 or above: hold the dose and call. No NSAIDs, thiazides or ACE inhibitors."},

{sys:"mood", name:"Anticonvulsant Mood Stabilizers", sfx:"—", ch:"3, 13",
 drugs:[["valproate (divalproex, valproic acid)","Depakote, Depakote ER, Depakene","FDA approved for acute mania; good for mixed episodes and rapid cycling. Sedation, weight gain, tremor. Boxed: hepatotoxicity, pancreatitis, teratogenicity. †Level 50–125 mcg/mL."],
  ["carbamazepine","Equetro, Tegretol","Second line. Acute mania and mixed episodes. Induces CYP3A4, so it lowers other drug levels (and its own). Boxed: Stevens-Johnson syndrome and TEN. Test for HLA-B*1502 in patients of Asian descent. †Level 4–12 mcg/mL."],
  ["lamotrigine","Lamictal","Bipolar maintenance and bipolar depression; not effective for acute mania. Slow dose titration to avoid rash. Halve the dose if valproate is added."],
  ["†oxcarbazepine","Trileptal","Off label for bipolar. Related to carbamazepine with fewer interactions; more hyponatremia."],
  ["†topiramate, gabapentin","Topamax, Neurontin","Not effective as mood stabilizers. Topiramate: weight loss, word-finding trouble, kidney stones. Gabapentin is used for anxiety."]],
 moa:"Calm overexcited neurons by blocking sodium channels (all three), raising GABA (valproate) and reducing glutamate release (lamotrigine). The same membrane-stabilizing effect that stops seizures evens out mood swings.",
 use:["Acute mania (valproate, carbamazepine)","Mixed episodes and rapid or continuous cycling","Bipolar maintenance and bipolar depression (lamotrigine)","Impulsive and aggressive behavior","Alcohol and benzodiazepine withdrawal","Seizure disorders"],
 exp:["Mania controlled within 2 weeks; depression within 3 weeks or longer","Lamotrigine: †full effect is delayed by the 6-week or longer titration","Fewer mood episodes over time"],
 se:["Valproate: nausea, indigestion, diarrhea, sedation, weakness, dizziness, tremor, weight gain; †hair loss","Carbamazepine: dizziness, somnolence, nausea, vomiting, ataxia, blurred vision, constipation, dry mouth, pruritus","Lamotrigine: dizziness, headache, double or blurred vision, ataxia, nausea, somnolence, rhinitis"],
 ae:["Valproate: hepatotoxicity, pancreatitis (can be fatal and hemorrhagic), thrombocytopenia, hyperammonemia","Carbamazepine: leukopenia, aplastic anemia, hyponatremia, Stevens-Johnson syndrome and toxic epidermal necrolysis","Lamotrigine: rash in about 10% within 8 weeks; about 1% progress to Stevens-Johnson syndrome or TEN","†Suicidal thoughts (all antiepileptics)","†Valproate: polycystic ovary syndrome"],
 warn:["BOXED WARNING (valproate): hepatotoxicity, pancreatitis, fetal harm (neural tube defects, lower IQ, autism)","BOXED WARNING (carbamazepine): serious skin reactions; †also aplastic anemia and agranulocytosis","†BOXED WARNING (lamotrigine): life-threatening rash","Pregnancy test before valproate or carbamazepine; reliable birth control during therapy","Lamotrigine rash risk is higher in children 2–16, with valproate, with fast titration and with high doses. Stop the drug if any rash appears","Asian ancestry: 10 times the TEN risk with carbamazepine; genetic testing first","†If lamotrigine is missed for about 5 days, restart the titration from the beginning"],
 tox:["†Valproate: sedation, confusion, hyperammonemic encephalopathy, coma. L-carnitine for hyperammonemia or liver toxicity; hemodialysis in severe cases","†Carbamazepine: ataxia, nystagmus, double vision, drowsiness, dysrhythmias, seizures. Activated charcoal; supportive care","No specific antidote for lamotrigine. Stop the drug for rash"],
 int:["Carbamazepine lowers levels of oral contraceptives, antiretrovirals, immunosuppressants and many psychotropics","Valproate sharply raises lamotrigine levels (more rash)","Valproate may raise lumateperone levels","†Oral contraceptives lower lamotrigine levels","†Grapefruit juice raises carbamazepine levels","†Alcohol and CNS depressants add sedation"],
 mon:["Skin: any rash, blisters, mouth sores, fever","Abdominal pain, nausea, vomiting, anorexia (pancreatitis or liver injury)","Bruising, bleeding, sore throat, fever (blood dyscrasias)","Mental status and confusion (ammonia, sodium)","Mood charting and suicide risk"],
 labs:["Valproate: liver function tests and CBC with platelets at baseline and periodically; coagulation studies; serum level; †ammonia if confused or lethargic","Valproate level: the textbook says levels are monitored but gives no range. †50–125 mcg/mL (50–100 for seizures)","Carbamazepine: LFTs, CBC, ECG and sodium at baseline and periodically. Textbook: liver enzymes at least weekly for the first 8 weeks","Carbamazepine level: the textbook says there is no established range for bipolar disorder. †4–12 mcg/mL","HLA-B*1502 genetic test before carbamazepine in patients of Asian descent","Pregnancy test before valproate or carbamazepine","Lamotrigine: †no routine level or labs"],
 ed:["Report any rash at once (lamotrigine, carbamazepine)","Report abdominal pain, vomiting, yellow skin, dark urine, bruising, sore throat or fever","Use reliable birth control. Carbamazepine makes the pill less effective, so add a barrier method","Do not stop suddenly, †risk of seizures","†Take valproate with food; do not crush delayed-release tablets","†Take folic acid if you could become pregnant"],
 kid:"Imagine brain cells are a crowd doing 'the wave' too fast and too hard. These drugs are the ushers who tell everyone to sit back down. Each usher has one big danger: valproate hurts the liver, pancreas and unborn babies; carbamazepine hurts the blood and skin; lamotrigine hurts the skin.",
 hesi:"Valproate: liver, pancreas, platelets, pregnancy. Carbamazepine: CBC, sodium, rash, makes birth control fail. Lamotrigine: any rash = stop and call. None of these replaces lithium's monitoring of sodium and fluids."},

/* ============ ANTIPSYCHOTICS ============ */
{sys:"apsy", name:"First-Generation (Typical) Antipsychotics", sfx:"-azine (phenothiazines); haloperidol", ch:"3, 11, 12, 13, 27",
 drugs:[["haloperidol","Haldol","High potency. Very high EPS; low sedation and anticholinergic effects. QT prolongation; cardiac monitoring for IV use. Most used for acute agitation. FDA approved for tics. Decanoate form every 4 weeks."],
  ["fluphenazine","generic (was Prolixin)","High potency. Very high EPS. Decanoate form every 2–3 weeks."],
  ["chlorpromazine","generic (was Thorazine)","Low potency. Very sedating; high orthostatic hypotension; QT prolongation; photosensitivity. Approved for acute mania."],
  ["thioridazine","generic (was Mellaril)","Low potency. High anticholinergic and sedation. QT prolongation. Visual changes; †pigmentary retinopathy at high doses. †Boxed warning for QT."],
  ["perphenazine","generic (was Trilafon)","Medium potency. Moderate EPS and sedation."],
  ["loxapine","Loxitane; Adasuve (inhaled)","Medium potency. Inhaled form for agitation can cause fatal bronchospasm; restricted program."],
  ["thiothixene, trifluoperazine","Navane, generic","High potency. High EPS."],
  ["pimozide","Orap","High potency. FDA approved for tics (Tourette's). QT prolongation."]],
 moa:"Block dopamine D2 receptors. In the mesolimbic pathway this reduces positive symptoms. In the nigrostriatal pathway it causes EPS. In the tuberoinfundibular pathway it raises prolactin. In the mesocortical pathway it can worsen negative and cognitive symptoms. They also block H1, M1 and alpha-1 receptors.",
 use:["Schizophrenia: positive symptoms (hallucinations, delusions)","Acute agitation and psychosis","Acute mania (chlorpromazine)","Tic disorders (haloperidol, pimozide)","Little effect on negative symptoms"],
 exp:["Fewer hallucinations and delusions, calmer behavior, clearer thinking","†Agitation calms within minutes to hours of an IM dose","†Psychosis improves over 1–2 weeks; full effect in 2–6 weeks or longer"],
 se:["Sedation (worst with low potency; tolerance develops)","Anticholinergic: dry mouth, blurred vision, constipation, urinary hesitancy, tachycardia","Orthostatic hypotension and dizziness","Weight gain","Photosensitivity (chlorpromazine, thioridazine)","Sexual dysfunction, galactorrhea, amenorrhea, gynecomastia (high prolactin)","Impaired swallowing, drooling"],
 ae:["Acute dystonia, akathisia, pseudoparkinsonism (EPS)","Tardive dyskinesia: about 25% of patients; often irreversible","NEUROLEPTIC MALIGNANT SYNDROME: 0.2% to 1% of patients on first-generation drugs","Anticholinergic toxicity","QT prolongation (chlorpromazine, haloperidol, thioridazine, pimozide)","Lowered seizure threshold","Severe neutropenia, cholestatic jaundice (rare)"],
 warn:["BOXED WARNING: increased mortality in older adults with dementia-related psychosis (strokes and death)","Pre-existing QT prolongation: ECG before starting","Seizure disorders: caution","†Parkinson disease and Lewy body dementia: severe sensitivity, avoid","Rule: high potency = high EPS, low anticholinergic. Low potency = low EPS, high sedation, anticholinergic and hypotension"],
 tox:["NMS: severe muscle rigidity, temperature over 103°F, unstable BP, tachycardia, diaphoresis, incontinence, reduced consciousness, delirium to coma. Hold all antipsychotics, call the prescriber stat, transfer to critical care. Bromocriptine and dantrolene; cooling; hydration; treat dysrhythmias","Anticholinergic toxicity: hot dry skin, dilated pupils, urinary retention, absent bowel sounds, delirium. Hold all medications; cooling; physostigmine may reverse it","Acute dystonia: benztropine or diphenhydramine 25–50 mg IM/IV; relief in 5–15 minutes","Overdose is unlikely to be lethal. No antidote for the antipsychotic itself"],
 int:["Other anticholinergic drugs (diphenhydramine, benztropine, TCAs): additive, risk of toxicity","Other QT-prolonging drugs","Alcohol and CNS depressants: sedation","Antihypertensives: more hypotension","Carbamazepine lowers antipsychotic levels","†Levodopa and dopamine agonists: opposite effects","†Lithium with haloperidol: rare neurotoxicity"],
 mon:["AIMS for abnormal movements: at least every 3 months (textbook); †guidelines commonly say every 6 months on first-generation drugs","EPS in the first days to weeks","Temperature and muscle tone (NMS)","Lying and standing BP. Hold and call if standing systolic is below 80 mm Hg","Bowel and bladder function","Cheeking; swallowing ability; fall risk"],
 labs:["ECG before starting and as needed (QT interval)","Liver function tests every 6 months (textbook)","CBC with ANC: severe neutropenia is possible with most antipsychotics","†Prolactin if symptomatic","†In NMS: CK is very high, WBC is high, myoglobin in urine; watch renal function","†Weight, fasting glucose and lipids at baseline and periodically"],
 ed:["Rise slowly; expect dizziness to ease in 1–2 weeks","Use sunscreen and protective clothing","Report muscle stiffness with fever, spasms of the neck, tongue or eyes, or restlessness","Sugarless gum, fluids and fiber for dry mouth and constipation","Do not stop suddenly","Avoid alcohol","†Avoid overheating and dehydration"],
 kid:"Psychosis is like a radio stuck on full volume from too much dopamine. These drugs turn the dopamine volume down everywhere. The voices get quieter, but the 'movement' station gets turned down too, so muscles get stiff, shaky or restless.",
 hesi:"Haloperidol = EPS. Muscle rigidity + high fever + unstable vitals = NMS: stop the drug. Neck spasm or eyes rolling up = acute dystonia: give benztropine or diphenhydramine IM. Lip smacking and tongue movements = tardive dyskinesia: do AIMS."},

{sys:"apsy", name:"Second-Generation (Atypical) Antipsychotics", sfx:"-apine, -idone, -piprazole, -rasidone", ch:"3, 11, 12, 13",
 drugs:[["risperidone","Risperdal","Potent D2 blocker: most EPS of this group at doses above 6 mg/day, and high prolactin. Orthostatic hypotension. Moderate weight gain."],
  ["paliperidone","Invega","Active metabolite of risperidone. High prolactin. Tablet shell may appear in stool; avoid with severe GI narrowing."],
  ["olanzapine","Zyprexa, Zyprexa Zydis","High metabolic risk: weight gain and hyperglycemia. Sedating, anticholinergic. Combined with fluoxetine as Symbyax for bipolar depression. †With samidorphan (Lybalvi) to limit weight gain."],
  ["quetiapine","Seroquel, Seroquel XR","Very sedating. Minimal EPS and prolactin. Moderate to high metabolic risk. QT prolongation. Bipolar depression; adjunct for major depression."],
  ["ziprasidone","Geodon","QT prolongation: contraindicated with recent MI or uncompensated heart failure. Low metabolic risk. Take each dose with a 500-calorie meal."],
  ["aripiprazole","Abilify","D2 partial agonist. Low metabolic risk and low prolactin. Rare compulsive behaviors (gambling, shopping, sex). Adjunct for depression; approved for tics. †Akathisia is common."],
  ["brexpiprazole","Rexulti","D2 partial agonist. Low prolactin, low metabolic and QT risk. Adjunct for depression. †Approved for agitation of Alzheimer's dementia."],
  ["cariprazine","Vraylar","D2 partial agonist. High EPS rates. Very long half-life: effects and side effects show up weeks later. Bipolar depression."],
  ["lurasidone","Latuda","Low metabolic and QT risk. Take with food (350 calories). Bipolar depression."],
  ["asenapine","Saphris (sublingual), Secuado (patch)","Sublingual: no food or drink for 10 minutes; mouth numbness for up to 1 hour. Less than 2% absorbed if swallowed. Sedation, orthostasis."],
  ["iloperidone","Fanapt","Strong alpha-1 blockade: titrate slowly for orthostatic hypotension. QT prolongation."],
  ["lumateperone","Caplyta","Low EPS and metabolic risk. Sedating. Once daily with food. Valproate may raise its level."],
  ["pimavanserin","Nuplazid","Blocks serotonin receptors only. Approved only for Parkinson's disease psychosis."],
  ["†xanomeline-trospium","Cobenfy","Muscarinic agonist, not a dopamine blocker. No EPS or weight gain. Nausea, vomiting, constipation, urinary retention, fast heart rate."]],
 moa:"Block dopamine D2 and serotonin 5-HT2A receptors, with more serotonin than dopamine blockade. Blocking 5-HT2A releases dopamine in the movement and prolactin pathways, so there is less EPS and less prolactin rise. Aripiprazole, brexpiprazole and cariprazine are D2 partial agonists (they act like a dimmer).",
 use:["Schizophrenia: positive and negative symptoms (first line)","Acute mania and bipolar maintenance","Bipolar depression (quetiapine, lurasidone, cariprazine, olanzapine-fluoxetine)","Adjunct in major depression (aripiprazole, brexpiprazole, quetiapine)","Tics (aripiprazole); severe aggression","†Irritability in autism (risperidone, aripiprazole)"],
 exp:["Fewer hallucinations and delusions; some improvement in motivation and social withdrawal","Sedation and calming early in treatment","†Psychosis improves over 1–2 weeks; full effect in 4–6 weeks or longer"],
 se:["Weight gain (most in the abdomen), increased appetite","Sedation (quetiapine, olanzapine, asenapine, lumateperone)","Orthostatic hypotension, dizziness","Anticholinergic effects (olanzapine, clozapine)","Sexual dysfunction, amenorrhea, galactorrhea (risperidone, paliperidone)","†Akathisia (aripiprazole, cariprazine, lurasidone)"],
 ae:["METABOLIC SYNDROME: weight gain, dyslipidemia, insulin resistance; diabetes and rarely ketoacidosis. Highest with clozapine and olanzapine","QT prolongation (ziprasidone, quetiapine, risperidone, paliperidone, iloperidone, asenapine)","EPS and tardive dyskinesia (less than first generation)","NMS (less likely, still possible)","Severe neutropenia","Lowered seizure threshold","Compulsive behaviors (partial agonists)"],
 warn:["BOXED WARNING: increased mortality in older adults with dementia-related psychosis; this use is off label","†BOXED WARNING: suicidal thinking in young people for those approved for depression (aripiprazole, brexpiprazole, quetiapine, lurasidone, cariprazine, olanzapine-fluoxetine)","Ziprasidone: recent MI, uncompensated heart failure, long QT","Diabetes, obesity, dyslipidemia: choose a low-risk agent (aripiprazole, ziprasidone, lurasidone)","ECG before starting any antipsychotic"],
 tox:["NMS: stop the drug; bromocriptine, dantrolene, cooling, fluids","†Overdose: sedation, hypotension, tachycardia, QT prolongation. Supportive care; no antidote","Acute dystonia: benztropine or diphenhydramine IM"],
 int:["Carbamazepine lowers levels of most (CYP3A4 inducer)","Other QT-prolonging drugs","Alcohol, benzodiazepines, opioids: sedation","Antihypertensives: orthostasis","Avoid IM olanzapine with IM lorazepam","Smoking lowers olanzapine and clozapine levels (CYP1A2)"],
 mon:["Weight, BMI and waist circumference","AIMS: at least every 3 months (textbook); †guidelines commonly say every 12 months on second-generation drugs","Orthostatic BP; fall risk","Signs of hyperglycemia: thirst, urination, hunger","Sexual side effects and menstrual changes","Temperature and rigidity (NMS)"],
 labs:["Fasting glucose †or A1C: baseline and periodically","Fasting lipid panel: baseline and periodically","ECG at baseline (QT), especially ziprasidone, iloperidone, quetiapine","CBC with ANC","Liver function tests every 6 months (textbook)","†Prolactin if symptomatic (risperidone, paliperidone)","†ADA/APA schedule: weight at 4, 8 and 12 weeks then quarterly; glucose and lipids at 12 weeks then yearly"],
 ed:["Diet and exercise from day one; pick low-calorie snacks","Ziprasidone and lurasidone must be taken with a meal","Asenapine: let it dissolve under the tongue; nothing by mouth for 10 minutes","Rise slowly","Report thirst and frequent urination, fever with stiffness, or new movements","Do not stop suddenly"],
 kid:"The older drugs turned the dopamine volume down everywhere. These newer ones are smarter with the dial, so muscles stay looser. The trade-off is that they flip the 'I'm hungry' switch, so weight, sugar and cholesterol can climb.",
 hesi:"Atypicals = metabolic syndrome: monitor weight, glucose, lipids. Olanzapine and clozapine are worst; aripiprazole, ziprasidone and lurasidone are best. Risperidone = prolactin and EPS. Ziprasidone = QT, take with food. Not for dementia psychosis."},

{sys:"apsy", name:"Clozapine", sfx:"-apine", ch:"3, 12",
 drugs:[["clozapine","Clozaril, FazaClo (ODT), Versacloz (liquid)","Most effective antipsychotic. For treatment-resistant schizophrenia (at least two failed trials) and for suicidal behavior in schizophrenia. Minimal EPS. Severe neutropenia in 0.5% to 1%."]],
 moa:"Blocks D1 and D2 receptors mainly in the mesolimbic pathway and not the nigrostriatal pathway, plus serotonin, muscarinic, histamine and alpha-1 receptors. That gives strong antipsychotic action with almost no EPS, but many other side effects.",
 use:["Treatment-resistant schizophrenia","Reducing suicidal behavior in schizophrenia and schizoaffective disorder","Improves negative symptoms","†Psychosis in patients with tardive dyskinesia or Parkinson disease"],
 exp:["Improvement in patients who failed other antipsychotics","†Response can take 6–12 weeks, sometimes up to 6 months"],
 se:["Sedation (can be severe)","Drooling (sialorrhea), †especially at night","Weight gain","Constipation and other anticholinergic effects","Orthostatic hypotension, tachycardia"],
 ae:["SEVERE NEUTROPENIA (agranulocytosis)","Myocarditis","Seizures (dose-dependent)","Life-threatening bowel emergencies (ileus, obstruction)","Metabolic syndrome, new diabetes, rarely ketoacidosis","NMS"],
 warn:["†BOXED WARNINGS: severe neutropenia; orthostatic hypotension, bradycardia and syncope; seizures; myocarditis and cardiomyopathy; increased mortality in dementia-related psychosis","Uncontrolled epilepsy: avoid","Benign ethnic neutropenia (common in people of African and some Middle Eastern descent): not higher risk, but needs a baseline ANC","Restricted distribution with required ANC reporting (Clozapine REMS) per the textbook. †The FDA ended the REMS requirement in 2025; ANC monitoring is still recommended in the label","†If doses are missed for 2 days or more, restart at 12.5 mg and retitrate"],
 tox:["Neutropenia: hold the drug and call the prescriber; reverse isolation if severe. May be restarted in some cases once the ANC recovers","†Overdose: sedation, delirium, seizures, tachycardia, hypotension, respiratory depression. Supportive care; no antidote","†Constipation is treated early and aggressively (it has caused deaths)"],
 int:["Smoking induces CYP1A2 and lowers clozapine levels. Quitting or cutting down raises levels","†Fluvoxamine and ciprofloxacin raise levels","†Carbamazepine: avoid (both suppress bone marrow)","†Benzodiazepines: respiratory and cardiovascular collapse reported","Other anticholinergics: ileus risk"],
 mon:["Signs of infection: fever, sore throat, chills, malaise, body aches","Bowel movements every day","Chest pain, shortness of breath, tachycardia, fever in the first weeks (myocarditis)","Seizure activity","Weight; orthostatic BP","Smoking status"],
 labs:["ANC schedule: weekly for 6 months, then every 2 weeks for 6 months, then every 4 weeks","Textbook: interrupt treatment for moderate neutropenia (ANC 500–999/µL) or severe neutropenia (ANC below 500/µL)","†Standard references: ANC must be at least 1500/µL to start (at least 1000/µL with benign ethnic neutropenia). ANC 1000–1499: continue and check 3 times a week. Below 1000: interrupt","†Older exam references: hold if WBC is below 3000 or ANC is below 1500","Fasting glucose and lipids","†Troponin, CRP and ECG if myocarditis is suspected","†Clozapine level: above 350 ng/mL is the usual target"],
 ed:["Report fever, sore throat or any sign of infection right away","Never miss blood draws","Treat constipation early; report no bowel movement for 2–3 days","Tell the prescriber if you start or stop smoking","Rise slowly; do not drive until you know how sedated you get","†Do not stop suddenly (rebound psychosis)"],
 kid:"Clozapine is the strongest tool in the box, saved for when nothing else works. The catch: it can wipe out the white blood cells, the body's germ-fighting soldiers. So the lab counts the soldiers on a schedule. A sore throat or fever could mean the army is gone.",
 hesi:"Clozapine + fever or sore throat = check the ANC now. Weekly ANC for the first 6 months. Also: seizures, myocarditis, drooling, severe constipation. Smoking lowers the level."},

{sys:"apsy", name:"Long-Acting Injectable Antipsychotics (LAIs)", sfx:"decanoate, palmitate, pamoate", ch:"3, 12",
 drugs:[["haloperidol decanoate","Haldol Decanoate","Every 4 weeks. Thick oil: Z-track, deltoid or gluteal."],
  ["fluphenazine decanoate","generic","Every 2–3 weeks. Thick oil: Z-track, deltoid or gluteal."],
  ["risperidone microspheres","Risperdal Consta","Every 2 weeks. Deltoid or gluteal. Shake hard just before giving. †Needs 3 weeks of oral overlap."],
  ["risperidone subcutaneous","Perseris","Every 4 weeks. Subcutaneous in the abdomen only. A lump forms and shrinks; do not rub it. †Uzedy: subcutaneous every 1–2 months."],
  ["paliperidone palmitate","Invega Sustenna","Every 4 weeks. First two doses in the deltoid on days 1 and 8; then deltoid or gluteal. Shake hard."],
  ["paliperidone palmitate 3-month","Invega Trinza","Every 12 weeks, only after at least 4 months on the monthly form. †Invega Hafyera: every 6 months."],
  ["olanzapine pamoate","Zyprexa Relprevv","Every 2–4 weeks. Gluteal only. Post-injection delirium/sedation syndrome: observe for at least 3 hours after every injection."],
  ["aripiprazole monohydrate","Abilify Maintena","Every 4 weeks. Deltoid or gluteal. †Needs 2 weeks of oral overlap. †Abilify Asimtufii: every 2 months."],
  ["aripiprazole lauroxil","Aristada","Every 4, 6 or 8 weeks depending on strength. Deltoid for the lowest strength only, otherwise gluteal."],
  ["aripiprazole lauroxil (starter)","Aristada Initio","One-time injection to start Aristada without 3 weeks of oral overlap, or to catch up after missed doses."]],
 moa:"The same antipsychotic drug, packaged in oil or tiny crystals so it leaks slowly out of the muscle (or under the skin) for weeks to months.",
 use:["Schizophrenia maintenance when daily pills are not taken reliably","Frequent hospitalizations from nonadherence","Patients who prefer not to take a daily pill","Bipolar I maintenance (†risperidone, aripiprazole forms)"],
 exp:["Steady symptom control and fewer relapses and readmissions","†Not for acute agitation: levels build over days to weeks, so oral overlap is often needed","Side effects also last longer and cannot be taken back out"],
 se:["Injection site pain, lump or redness","Same side effects as the oral drug: EPS (haloperidol, fluphenazine, risperidone), weight gain (olanzapine), prolactin (risperidone, paliperidone)"],
 ae:["Post-injection delirium/sedation syndrome (olanzapine pamoate): sedation, agitation, disorientation from a sudden rise in blood level","NMS, tardive dyskinesia, metabolic syndrome as with the oral drug","A side effect cannot be stopped quickly once injected"],
 warn:["BOXED WARNING: increased mortality in older adults with dementia-related psychosis","†BOXED WARNING (olanzapine pamoate): post-injection delirium/sedation syndrome; restricted program","†Confirm the patient tolerates the oral drug before the first injection","Never give intravenously"],
 tox:["Post-injection syndrome: medical monitoring and supportive care until it clears","Manage EPS or NMS the same way as with oral drugs, but expect it to last longer"],
 int:["Same as the oral drug","CNS depressants add to sedation"],
 mon:["Olanzapine pamoate: stay with or near the patient for 3 hours; check alertness and orientation","Injection site","EPS, AIMS, weight and metabolic checks as for the oral drug","Date the next dose is due; missed-dose rules differ by product"],
 labs:["Same as the oral drug: glucose, lipids, ECG, CBC as indicated","No drug level is needed"],
 ed:["Keep every injection appointment","You may feel you have less control; talk about it","Olanzapine pamoate: you must stay 3 hours and someone should take you home","Do not rub or massage the Perseris lump","Report stiffness, fever, restlessness or new movements"],
 kid:"Instead of a pill every day, it's one shot that slowly drips medicine for weeks, like a slow-release plant food spike in a flowerpot. Good if remembering pills is hard. But once it's in, you can't take it back out.",
 hesi:"Decanoates = Z-track. Olanzapine LAI = watch 3 hours for sedation and delirium. Paliperidone Sustenna = deltoid on day 1 and day 8. LAIs are for adherence, not for acute agitation."},

/* ============ ANXIETY ============ */
{sys:"anx", name:"Benzodiazepines", sfx:"-pam, -lam", ch:"3, 15, 22, 27",
 drugs:[["lorazepam","Ativan","PO, SL, IM, IV. Drug of choice for acute agitation; alcohol withdrawal. †No active metabolites: safer in liver disease and older adults."],
  ["alprazolam","Xanax","GAD and panic disorder. Paradoxical reactions in personality disorders and older adults. †Short acting: worst rebound anxiety and withdrawal."],
  ["clonazepam","Klonopin","Panic disorder. †Long acting; also a seizure drug."],
  ["diazepam","Valium","PO, IM, IV. Fast onset, long half-life; caution in older adults. IV for alcohol withdrawal seizures; muscle relaxant."],
  ["chlordiazepoxide","Librium","Alcohol withdrawal (tremulousness, mild to moderate agitation). Long acting."],
  ["oxazepam, clorazepate","Serax, Tranxene","Generalized anxiety. †Oxazepam has no active metabolites."],
  ["temazepam, triazolam, estazolam, flurazepam, quazepam","Restoril, Halcion, ProSom, Dalmane, Doral","Hypnotics for insomnia. Flurazepam and quazepam last too long and are not recommended."],
  ["†midazolam","Versed","IV or IM for procedural sedation and status epilepticus; marked amnesia."]],
 moa:"Bind to a site on the GABA-A receptor and make GABA work better. The chloride channel opens more often, the neuron is hyperpolarized and harder to fire. They do nothing without GABA present.",
 use:["Short-term relief of anxiety and panic","Insomnia","Alcohol withdrawal and prevention of withdrawal seizures","Status epilepticus (treatment of choice)","Acute agitation","Akathisia; muscle spasm","†Catatonia; pre-procedure sedation"],
 exp:["Calm within 30–60 minutes orally, within minutes IV","Works fast, unlike antidepressants and buspirone","Use only for short periods, until other treatments take effect"],
 se:["Sedation (most common; tolerance develops)","Ataxia, slowed reflexes","Anterograde amnesia","Decreased cognitive function","Dizziness"],
 ae:["Respiratory depression when combined with alcohol or opioids","Physical dependence and withdrawal, including seizures","Paradoxical reaction: anxiety, agitation, talkativeness, loss of impulse control (children and older adults)","Falls, fractures and delirium in older adults","Misuse"],
 warn:["†BOXED WARNING: use with opioids can cause profound sedation, respiratory depression, coma and death","†BOXED WARNING: abuse, misuse, addiction, physical dependence and withdrawal reactions","Controlled substance (Schedule IV)","Not recommended in substance use disorders or in older adults †(Beers list)","Pregnancy: floppy infant syndrome and neonatal withdrawal near delivery; small increase in cleft lip and palate. Do not breastfeed","†Sleep apnea, severe respiratory disease, acute narrow-angle glaucoma"],
 tox:["Overdose alone is rarely fatal. With alcohol or opioids: life-threatening CNS and respiratory depression","†Antidote: flumazenil (Romazicon) IV. It can trigger seizures in dependent patients and after TCA co-ingestion, and wears off before the benzodiazepine does","Withdrawal: anxiety, insomnia, irritability, tremor, muscle tension, confusion, seizures. Treat by tapering"],
 int:["Alcohol, opioids, barbiturates and other CNS depressants: additive sedation and respiratory depression","Cimetidine slows benzodiazepine metabolism (more sedation)","Antacids delay absorption","Caffeine reduces the effect","IM olanzapine with IM lorazepam: avoid"],
 mon:["Respiratory rate and level of sedation","Fall risk and gait","Signs of misuse or early refill requests","Withdrawal signs when tapering","CIWA-Ar scores in alcohol withdrawal"],
 labs:["†No routine labs or drug level","†Liver function with long-term use; prefer lorazepam, oxazepam or temazepam (LOT) in liver disease","†Urine drug screen as indicated"],
 ed:["Do not change the dose or stop on your own. Stopping after a month or more of daily use can cause withdrawal and seizures","No alcohol","Do not drive or use machinery until you know the effect","Avoid caffeine","Take with or after food if it upsets your stomach","Discuss pregnancy and breastfeeding with the prescriber"],
 kid:"GABA is the brain's brake pedal. A benzodiazepine doesn't press the brake itself; it makes the pedal extra sensitive, so a light tap from GABA stops the car fast. Add alcohol or opioids and now too many feet are on the brake, and breathing can stop.",
 hesi:"Benzodiazepine + alcohol or opioid = respiratory depression. Never stop abruptly (seizures). Antidote is flumazenil. Avoid in older adults (falls, delirium, paradoxical agitation). Lorazepam for alcohol withdrawal with liver disease."},

{sys:"anx", name:"Non-Benzodiazepine Anxiolytics", sfx:"—", ch:"3, 15",
 drugs:[["buspirone","BuSpar","5-HT1A partial agonist for generalized anxiety disorder. Not a controlled substance; no dependence, sedation or withdrawal. Taken every day, not as needed. Takes weeks to work."],
  ["hydroxyzine","Vistaril, Atarax","Antihistamine. Safe, non-addictive alternative; good choice in substance use problems. †Works in 15–30 minutes; sedation and anticholinergic effects; avoid in older adults."],
  ["propranolol","Inderal","Beta blocker. Reduces the physical signs of anxiety (fast heart rate, blushing); used for social or performance anxiety. Also treats akathisia. †Avoid in asthma; masks hypoglycemia."],
  ["gabapentin, pregabalin","Neurontin, Lyrica","Anticonvulsants used for generalized and social anxiety. †Dizziness, sedation, edema; taper to stop; pregabalin is Schedule V."],
  ["SSRIs and SNRIs","see Antidepressants","First-line long-term treatment for anxiety disorders. Take 4 to 8 weeks."]],
 moa:"Buspirone partly stimulates serotonin 5-HT1A receptors, which over weeks increases serotonin release. It does not touch GABA. Hydroxyzine blocks histamine. Propranolol blocks the beta receptors that make the heart pound. Gabapentin and pregabalin quiet overactive nerve firing.",
 use:["Generalized anxiety disorder (buspirone)","Anxiety in patients with substance use disorders or older adults who should avoid benzodiazepines","Performance and social anxiety (propranolol)","Add-on when first treatment is not enough","Short-term anxiety relief (hydroxyzine)"],
 exp:["Buspirone, textbook: 2 to 4 weeks for full effect (Ch. 15); 'several weeks' (Ch. 3)","†Buspirone, standard references: first effects in 1–2 weeks, full effect in 3–6 weeks","Hydroxyzine and propranolol work with the first dose","Less worry, tension and restlessness"],
 se:["Buspirone: dizziness, nausea, headache, nervousness, lightheadedness, excitement","Hydroxyzine: †drowsiness, dry mouth","Propranolol: †fatigue, slow pulse, low BP, cold hands","Gabapentin and pregabalin: †dizziness, sleepiness, weight gain"],
 ae:["Buspirone: serotonin syndrome with other serotonergic drugs","†Hydroxyzine: QT prolongation, confusion in older adults","†Propranolol: bradycardia, bronchospasm, masked hypoglycemia","†Gabapentin and pregabalin: respiratory depression with opioids; misuse"],
 warn:["Buspirone: not recommended with impaired liver or kidney function; do not combine with MAOIs","Buspirone in pregnancy and breastfeeding: only if clearly needed","Buspirone does not stop benzodiazepine withdrawal; †taper the benzodiazepine separately","†Propranolol: asthma, heart block, bradycardia","†No boxed warning on buspirone"],
 tox:["Buspirone overdose: †nausea, dizziness, drowsiness, small pupils. Supportive care; no antidote","†Propranolol overdose: bradycardia, hypotension, hypoglycemia. Glucagon","†Hydroxyzine overdose: anticholinergic picture, sedation, QT prolongation"],
 int:["Buspirone + MAOIs: avoid (serotonin syndrome, high BP)","Buspirone + SSRIs and other serotonergic drugs: serotonin syndrome risk","†Buspirone + grapefruit juice, erythromycin, ketoconazole: higher buspirone levels","†Hydroxyzine + other CNS depressants or anticholinergics: additive","†Gabapentin and pregabalin + opioids: respiratory depression"],
 mon:["Anxiety level over weeks, not hours (buspirone)","Whether the patient expects instant relief and stops early","Pulse and BP before propranolol","Sedation and fall risk (hydroxyzine, gabapentin)"],
 labs:["†No routine labs or levels for buspirone","†Renal function for gabapentin and pregabalin dosing","†Liver and renal function before buspirone"],
 ed:["Buspirone: take it every day on a schedule; it will not work as needed","Give it 2 to 4 weeks. Do not stop because you don't feel it right away","Take it the same way each time, †always with food or always without","†Avoid large amounts of grapefruit juice","It will not make you sleepy or dependent"],
