 kid:"A benzodiazepine is like a fire extinguisher: it works right now. Buspirone is more like fireproofing the house: nothing happens the first day, but after a few weeks the fires stop starting. And it doesn't make you sleepy or hooked.",
 hesi:"Buspirone: not PRN, takes 2–4 weeks, no sedation, no dependence, not for alcohol or benzodiazepine withdrawal. A patient who says 'it isn't working' after 3 days needs teaching, not a new drug."},

/* ============ SLEEP ============ */
{sys:"sleep", name:"Z-Hypnotics (Non-Benzodiazepine Receptor Agonists)", sfx:"zol-, zal-, -clone", ch:"3, 19",
 drugs:[["zolpidem","Ambien, Ambien CR, Intermezzo","Onset 30 minutes. Immediate release helps falling asleep; CR also helps staying asleep. Intermezzo (sublingual) is for middle-of-the-night waking with at least 4 hours left to sleep. Women clear it more slowly, so the starting dose is lower."],
  ["zaleplon","Sonata","Shortest half-life (about 1 hour). Onset 15–30 minutes. For trouble falling asleep only."],
  ["eszopiclone","Lunesta","Half-life about 6 hours: helps falling and staying asleep. Bitter, unpleasant taste on waking in about one-third of patients."]],
 moa:"Bind selectively to GABA-A receptors that contain the alpha-1 subunit. That gives the sleep and amnesia effects of a benzodiazepine without the antianxiety, anticonvulsant or muscle relaxant effects.",
 use:["Insomnia: trouble falling asleep (all three)","Insomnia: trouble staying asleep (eszopiclone, zolpidem CR)","Short-term use; long-term sleeping pill use is discouraged"],
 exp:["Sleep within 15–60 minutes of the dose","Shorter time to fall asleep, fewer awakenings","Shorter half-lives and no active metabolites, so less hangover than benzodiazepines"],
 se:["Sedation, next-day drowsiness","Dizziness, ataxia","Headache","Amnesia","Bitter taste (eszopiclone)"],
 ae:["COMPLEX SLEEP BEHAVIORS: sleepwalking, sleep-driving, cooking or eating while not fully awake, with no memory of it","Falls, fractures and delirium in older adults","Tolerance and dependence (less than benzodiazepines)","†Respiratory depression with other depressants"],
 warn:["†BOXED WARNING: complex sleep behaviors. Do not use again if one episode has occurred (the textbook describes this as a strengthened FDA warning)","Controlled substance (Schedule IV); caution in substance use disorders","Older adults: fall and delirium risk; †Beers list","†Lower starting dose for women and older adults (zolpidem 5 mg immediate release)"],
 tox:["†Overdose: deep sedation and respiratory depression, mostly with alcohol or other depressants. Supportive care","†Flumazenil can reverse the sedation"],
 int:["Alcohol, opioids, benzodiazepines and other CNS depressants: more sedation and more complex sleep behaviors","†Food (especially a heavy or high-fat meal) delays onset","†CYP3A4 inhibitors raise levels"],
 mon:["Sleep diary: time to fall asleep, awakenings, daytime sleepiness","Any report of sleepwalking or unexplained activity","Fall risk at night","How long the patient has been taking it"],
 labs:["†No routine labs or drug levels"],
 ed:["Take it right before getting into bed, with 7–8 hours available for sleep","†Take on an empty stomach for faster effect","No alcohol","Report any sleepwalking or things you did but cannot remember; stop the drug","Use it with sleep hygiene: regular wake time, bed only for sleep, no naps","Do not drive the next morning until fully alert"],
 kid:"These press only the 'go to sleep' button on the brain's brake system, not the 'relax' or 'stop seizures' buttons. Sometimes the body gets up and does things while the brain is still asleep, like a robot on autopilot.",
 hesi:"Zolpidem: take immediately before bed with a full night available; lower dose for women; sleep-driving and sleep-eating mean stop the drug."},

{sys:"sleep", name:"Other Sleep Medications", sfx:"-melteon, -orexant", ch:"3, 19",
 drugs:[["ramelteon","Rozerem","Melatonin MT1 and MT2 receptor agonist. Trouble falling asleep. Not a controlled substance; no misuse potential. Headache, dizziness. Can lower testosterone and raise prolactin. Contraindicated with fluvoxamine."],
  ["suvorexant","Belsomra","Orexin receptor antagonist: blocks the wakefulness signal. Falling and staying asleep. Schedule IV. Contraindicated in narcolepsy."],
  ["lemborexant","Dayvigo","Orexin receptor antagonist. Onset 15–20 minutes. Schedule IV. Contraindicated in narcolepsy. †Daridorexant (Quviviq) is a third drug in this class."],
  ["doxepin (low dose)","Silenor","Tricyclic at a tiny dose; works by blocking H1. Trouble staying asleep only. Not a controlled substance. Avoid with severe urinary retention, glaucoma or MAOIs."],
  ["temazepam, triazolam, estazolam","Restoril, Halcion, ProSom","Benzodiazepine hypnotics, Schedule IV. See Benzodiazepines."],
  ["melatonin","over the counter","Natural hormone. Little data to support it for insomnia disorder; prolonged-release forms show some promise."],
  ["trazodone","Desyrel","Antidepressant used off label at low dose (e.g., 50 mg) for insomnia. Orthostasis, priapism."],
  ["†diphenhydramine, doxylamine","Benadryl, Unisom","Over-the-counter antihistamines. Anticholinergic; next-day grogginess; avoid in older adults."]],
 moa:"Three different routes to sleep. Ramelteon copies melatonin at the receptors that control sleepiness (MT1) and the body clock (MT2). Orexin antagonists block orexin, the peptide that keeps you awake. Low-dose doxepin blocks histamine, another wakefulness signal.",
 use:["Insomnia with trouble falling asleep (ramelteon, orexin antagonists)","Insomnia with trouble staying asleep (doxepin, orexin antagonists)","Patients with substance use history (ramelteon, doxepin: not controlled)"],
 exp:["Ramelteon and suvorexant: onset about 30 minutes; lemborexant 15–20 minutes; doxepin more than 60 minutes","Shorter time to fall asleep or fewer awakenings","Non-drug treatment (CBT-I, sleep hygiene) works better long term"],
 se:["Ramelteon: headache, dizziness, †sleepiness","Orexin antagonists: next-day sleepiness, †headache","Doxepin: †sedation, nausea","Antihistamines: †dry mouth, urinary retention, confusion"],
 ae:["Complex sleep behaviors (FDA warning on all approved hypnotics)","Orexin antagonists: sleep paralysis, hallucinations when falling asleep or waking, cataplexy-like symptoms","Ramelteon: lower testosterone, higher prolactin (lower sex drive, fertility problems)","†Worsening depression or suicidal thoughts (orexin antagonists)"],
 warn:["Orexin antagonists: contraindicated in narcolepsy; controlled substances","Ramelteon with fluvoxamine: contraindicated; †avoid in severe liver impairment","Doxepin: severe urinary retention, glaucoma, MAOI use","†Antihistamines and benzodiazepine hypnotics: Beers list for older adults","†No boxed warning on ramelteon, orexin antagonists or low-dose doxepin"],
 tox:["†Overdose causes sedation. Supportive care; no antidote for ramelteon or orexin antagonists","†Antihistamine overdose: anticholinergic toxicity"],
 int:["Alcohol and CNS depressants: additive sedation and complex sleep behaviors","Fluvoxamine sharply raises ramelteon levels","†Strong CYP3A4 inhibitors raise orexin antagonist levels","†A high-fat meal delays the effect"],
 mon:["Sleep diary and daytime functioning","Odd nighttime behavior, sleep paralysis or hallucinations","Mood","†Libido or menstrual changes on long-term ramelteon"],
 labs:["†No routine labs","†Prolactin and testosterone if symptoms appear on ramelteon"],
 ed:["Take within 30 minutes of bedtime with a full night available","Do not take with or right after a heavy meal","No alcohol","Report sleepwalking, being unable to move on waking, or sudden muscle weakness","Remove nicotine patches at bedtime; avoid caffeine and alcohol near bedtime","Keep a regular wake time"],
 kid:"Your brain has an 'awake' switch (orexin and histamine) and a 'night-time' clock (melatonin). Instead of pressing the brake like a benzodiazepine, these drugs either turn off the awake switch or tell the clock it's night.",
 hesi:"Ramelteon: not controlled, safe choice with substance use history, not with fluvoxamine. Suvorexant and lemborexant: never in narcolepsy."},

{sys:"sleep", name:"Narcolepsy & Wake-Promoting Drugs", sfx:"-afinil", ch:"19",
 drugs:[["modafinil","Provigil","Stimulant-type wake promoter for excessive daytime sleepiness. †Schedule IV. Headache, nausea, anxiety. Rare Stevens-Johnson syndrome. Makes hormonal birth control less effective."],
  ["armodafinil","Nuvigil","R-enantiomer of modafinil; †longer acting."],
  ["methylphenidate, amphetamine","Ritalin, Adderall","Stimulants also approved for daytime sleepiness. See ADHD Stimulants."],
  ["pitolisant","Wakix","Histamine-3 receptor antagonist/inverse agonist. Non-stimulant. Insomnia, nausea, anxiety. †Not a controlled substance; QT prolongation."],
  ["solriamfetol","Sunosi","Dopamine and norepinephrine reuptake inhibitor. Non-stimulant. Contraindicated with MAOIs. Monitor BP and heart rate."],
  ["sodium oxybate","Xyrem","CNS depressant for daytime sleepiness and cataplexy, ages 7 and up. Restores night-time sleep architecture. †Taken at bedtime and again 2.5–4 hours later, in bed."]],
 moa:"Wake promoters raise dopamine, norepinephrine or histamine, the brain's wakefulness transmitters. Sodium oxybate works the other way: it deepens and consolidates night-time sleep so the daytime improves.",
 use:["Excessive daytime sleepiness in narcolepsy","Cataplexy (sodium oxybate, †pitolisant)","†Shift-work sleep disorder and residual sleepiness in treated sleep apnea (modafinil, armodafinil)"],
 exp:["More alertness and fewer sleep attacks within hours of a dose","†Sodium oxybate: cataplexy improves over weeks","Used alongside scheduled naps, exercise and a balanced diet"],
 se:["Insomnia, nausea, anxiety (pitolisant)","†Headache, nervousness, decreased appetite (modafinil, solriamfetol)","†Sodium oxybate: nausea, dizziness, bed-wetting, sleepwalking"],
 ae:["Raised BP and heart rate (solriamfetol, stimulants)","†Serious rash including Stevens-Johnson syndrome (modafinil, armodafinil)","†Psychiatric symptoms: mania, psychosis, suicidal thoughts","†Sodium oxybate: respiratory depression, misuse"],
 warn:["†BOXED WARNING (sodium oxybate): CNS and respiratory depression; abuse and misuse (it is GHB). Restricted REMS program","Solriamfetol: contraindicated with MAOIs","†Sodium oxybate: never with alcohol or sedative-hypnotics","†Modafinil: stop at the first sign of rash"],
 tox:["†Stimulant-type overdose: agitation, tachycardia, hypertension. Supportive care, benzodiazepines","†Sodium oxybate overdose: coma, respiratory depression, bradycardia. Airway support; no antidote"],
 int:["MAOIs with solriamfetol or stimulants: hypertensive crisis","†Modafinil lowers levels of hormonal contraceptives (use another method during and for 1 month after)","†Alcohol and CNS depressants with sodium oxybate: respiratory depression"],
 mon:["Blood pressure and heart rate (solriamfetol, stimulants)","Daytime sleepiness and number of cataplexy episodes","Sleep at night","Mood and misuse"],
 labs:["†No routine labs","†ECG if cardiac risk (pitolisant)","†Sodium oxybate has a high sodium load: watch in heart failure and hypertension"],
 ed:["Take wake-promoting drugs in the morning to protect night sleep","Keep scheduled short naps","†Use non-hormonal birth control with modafinil","†Sodium oxybate: take in bed, lie down right away, no food for 2 hours before","Report rash, chest pain or mood changes"],
 kid:"In narcolepsy the brain's 'stay awake' signal keeps cutting out, like a flickering light bulb. Most of these drugs boost the power so the light stays on during the day. One (sodium oxybate) fixes the night instead, so the day goes better.",
 hesi:"Narcolepsy + cataplexy = sodium oxybate. Orexin antagonist sleep aids are contraindicated in narcolepsy. Modafinil cancels birth control pills."},

/* ============ ADHD ============ */
{sys:"adhd", name:"ADHD Stimulants", sfx:"-phenidate, -amfetamine", ch:"3, 11, 18, 19",
 drugs:[["methylphenidate","Ritalin, Ritalin LA, Concerta, Metadate, Quillivant XR, Jornay PM, Daytrana (patch)","Blocks norepinephrine and dopamine reuptake. Short acting 6–8 h; long acting 10–12 h once daily. Daytrana patch keeps working up to 3 hours after removal. Jornay PM is taken in the evening."],
  ["dexmethylphenidate","Focalin, Focalin XR","Active isomer of methylphenidate. 4–5 h; XR 8–12 h."],
  ["mixed amphetamine salts","Adderall, Adderall XR, Mydayis","Blocks reuptake and also increases release. 4–6 h; XR 10–12 h; Mydayis up to 16 h (age 13 and up)."],
  ["dextroamphetamine","Dexedrine, ProCentra, Zenzedi","4–6 h. Approved from age 3."],
  ["lisdexamfetamine","Vyvanse","Prodrug, 10–12 h. Also approved for moderate to severe binge-eating disorder in adults. Black box warning for abuse and dependence."],
  ["amphetamine","Adzenys XR-ODT, Dyanavel XR, Evekeo","12 h for the XR forms."],
  ["methamphetamine","Desoxyn","6–8 h. Rarely used."]],
 moa:"Sympathomimetic amines that block the reuptake of norepinephrine and dopamine. Amphetamines also push more transmitter out of the neuron. In ADHD this improves attention and reduces impulsivity; the exact reason is not fully understood.",
 use:["ADHD (first-line drug treatment)","Narcolepsy and excessive daytime sleepiness","Binge-eating disorder (lisdexamfetamine)","Aggression in children (moderate to high doses suppress it; low doses can stimulate it)"],
 exp:["More attention and task-directed behavior; less impulsivity, restlessness and distractibility","Response is often dramatic and quick, †within 30–60 minutes of a dose","†Doses are adjusted weekly using parent and teacher ratings"],
 se:["Insomnia","Appetite suppression, weight loss","Headache, abdominal pain","Increased blood pressure and heart rate","Irritability or agitation; lethargy","†Rebound irritability as the dose wears off"],
 ae:["Growth suppression","New or worse psychosis or mania","Misuse and diversion","Tics may worsen","†Sudden cardiac death in patients with structural heart disease","†Priapism; Raynaud-type circulation problems (methylphenidate)","†Seizures at high doses"],
 warn:["BOXED WARNING: high potential for abuse, misuse and dependence (the textbook cites it for lisdexamfetamine; †it applies to all CNS stimulants)","Controlled substance (Schedule II)","Contraindicated with MAOIs, †or within 14 days of one","†Structural cardiac abnormalities, serious dysrhythmias, uncontrolled hypertension, hyperthyroidism, glaucoma","Coexisting tic disorder: monitor carefully"],
 tox:["†Overdose: agitation, tremor, hyperreflexia, tachycardia, hypertension, hyperthermia, psychosis, seizures","†Treatment: benzodiazepines, cooling, treat hypertension. No antidote"],
 int:["MAOIs: hypertensive crisis","†Other sympathomimetics, decongestants, caffeine: more stimulation","†Acidic juices and vitamin C lower amphetamine absorption; antacids raise it","†Serotonergic drugs with amphetamines: serotonin syndrome"],
 mon:["Height and weight (growth chart)","Blood pressure and heart rate","Sleep and appetite","Behavior and school performance","Tics, mood, psychotic symptoms","Signs of misuse or selling"],
 labs:["†No routine labs or drug levels","†Cardiac history and exam before starting; ECG only if indicated","†Growth chart is the key measure in children"],
 ed:["Give no later than 4:00 in the afternoon (textbook); †many references say at least 6 hours before bedtime","Use the lowest effective dose","†Give with or after breakfast and offer a good dinner when appetite returns","†Swallow extended-release forms whole; some capsules can be sprinkled on applesauce","†Daytrana patch: apply to the hip 2 hours before needed, remove after 9 hours","Store safely; never share","†Drug holidays (weekends, summer) may be ordered to catch up on growth"],
 kid:"It seems backwards to give a 'speed-up' drug to a kid who can't sit still. But in ADHD the brain's 'pay attention' manager is half asleep. The stimulant wakes the manager up, and now the manager can keep the rest of the brain on task.",
 hesi:"Stimulants: monitor height, weight, BP, pulse. Give in the morning. Appetite loss and insomnia are expected. Never with an MAOI. Schedule II."},

{sys:"adhd", name:"ADHD Non-Stimulants", sfx:"-oxetine; -idine", ch:"3, 11",
 drugs:[["atomoxetine","Strattera","Selective norepinephrine reuptake inhibitor. Ages 6–65. Full effect may take up to 6 weeks. Not a controlled substance. Preferred with anxiety, active substance use disorder or tics. Liver injury; small rise in BP and pulse; suicidal ideation."],
  ["guanfacine","Intuniv (ER), Tenex","Central alpha-2 agonist. Once daily. Usually well tolerated: somnolence, fatigue, hypotension, dizziness, abdominal pain. Also used for tics."],
  ["clonidine","Kapvay (ER), Catapres","Central alpha-2 agonist. Twice daily. More side effects than guanfacine: somnolence, fatigue, nightmares, irritability, constipation, dry mouth. Also used for tics and opioid withdrawal."],
  ["†viloxazine","Qelbree","Selective norepinephrine reuptake inhibitor, ages 6 and up. Boxed warning for suicidal thoughts. Sleepiness, decreased appetite."]],
 moa:"Atomoxetine (and viloxazine) block norepinephrine reuptake, which raises norepinephrine in the attention circuits of the prefrontal cortex. Guanfacine and clonidine stimulate central alpha-2 receptors, which lowers sympathetic outflow and calms impulsivity and agitation.",
 use:["ADHD when stimulants are not tolerated, not wanted, contraindicated (such as MAOI use) or there is a substance use disorder","ADHD with anxiety or tics","Alone or added to a stimulant (alpha-2 agonists)","Agitation, rage and low frustration tolerance; tic disorders (alpha-2 agonists)"],
 exp:["Atomoxetine: develops slowly; up to 6 weeks for full improvement","†Alpha-2 agonists: 2–4 weeks for ADHD benefit; sedation is immediate","Less effective than stimulants"],
 se:["Atomoxetine: GI upset, decreased appetite, weight loss, fatigue, dizziness, insomnia, urinary hesitancy or retention","Alpha-2 agonists: somnolence, lethargy, fatigue, dizziness, hypotension, dry mouth, constipation, nightmares"],
 ae:["Atomoxetine: liver injury; increased suicidal ideation; raised BP and heart rate; rare serious allergic reactions","Alpha-2 agonists: hypotension and bradycardia; REBOUND HYPERTENSION if stopped abruptly","†Atomoxetine: priapism"],
 warn:["†BOXED WARNING (atomoxetine, viloxazine): suicidal ideation in children and adolescents","Atomoxetine: extreme caution with comorbid depression","Alpha-2 agonists: increase the dose slowly; never stop abruptly","†Atomoxetine: contraindicated with MAOIs (or within 14 days), narrow-angle glaucoma, pheochromocytoma"],
 tox:["†Atomoxetine overdose: drowsiness, agitation, tachycardia, seizures. Supportive","†Clonidine overdose: bradycardia, hypotension, sedation, pinpoint pupils, respiratory depression (can look like opioid overdose). Supportive; naloxone sometimes helps"],
 int:["MAOIs with atomoxetine: contraindicated","†CYP2D6 inhibitors (fluoxetine, paroxetine) raise atomoxetine levels","†Alpha-2 agonists with other antihypertensives or CNS depressants: additive","†Beta blockers worsen clonidine rebound"],
 mon:["Vital signs: BP and heart rate throughout therapy","Suicidal thoughts, mood, irritability, especially early","Jaundice, dark urine, right-upper-quadrant pain, itching","Sedation (alpha-2 agonists)","Growth and appetite"],
 labs:["Liver function tests: regular screening with atomoxetine","†No drug levels"],
 ed:["It takes weeks; this is not a same-day drug","Report yellow skin or eyes, dark urine or belly pain","Report sadness or thoughts of self-harm","Do not stop clonidine or guanfacine suddenly","Rise slowly; expect sleepiness at first","†Swallow extended-release tablets whole; do not take guanfacine ER with a high-fat meal"],
 kid:"Stimulants are like a strong cup of coffee for the brain's attention manager: fast and powerful. Atomoxetine is more like slowly charging a battery; it takes weeks. Clonidine and guanfacine are the 'calm down' helpers that lower the body's alarm system.",
 hesi:"Atomoxetine: suicidal ideation and liver; not a controlled substance; weeks to work. Clonidine and guanfacine: taper to avoid rebound hypertension; watch BP and pulse."},

/* ============ DEMENTIA ============ */
{sys:"dem", name:"Cholinesterase Inhibitors", sfx:"-pezil, -stigmine, -tamine", ch:"3, 23",
 drugs:[["donepezil","Aricept, Aricept ODT","Mild, moderate and severe Alzheimer's disease. Nausea, diarrhea, insomnia, muscle cramps, fatigue, anorexia. †Once daily; give in the morning if it causes vivid dreams or insomnia."],
  ["rivastigmine","Exelon, Exelon Patch","Oral: mild to moderate AD. Patch: all stages, once a day, no food requirement, useful when swallowing is hard. Also Parkinson's disease dementia. Stop the patch if skin irritation spreads beyond the patch."],
  ["galantamine","Razadyne, Razadyne ER","Mild to moderate AD. Nausea, vomiting, diarrhea, dizziness, headache, weight loss."]],
 moa:"Block cholinesterase, the enzyme that breaks down acetylcholine. More acetylcholine stays in the synapse for learning and memory. As cholinergic neurons die, the drugs work less well.",
 use:["Alzheimer's disease, mild to moderate (all); severe (donepezil, rivastigmine patch)","Parkinson's disease dementia (rivastigmine)"],
 exp:["Slows the rate of memory loss; does not stop or reverse the disease","Minimal benefit after 1 year","†Assess after 6–12 weeks at a stable dose; stable function counts as a response"],
 se:["Nausea, vomiting, diarrhea (usually temporary; a lower dose helps)","Anorexia, weight loss","Insomnia, fatigue","Muscle cramps","Dizziness, headache","Urinary incontinence"],
 ae:["Bradycardia and syncope","GI bleeding and ulcers, especially with NSAIDs","Side effect risk doubles over age 85","†Worsening of asthma or COPD (bronchoconstriction); seizures"],
 warn:["Caution with NSAIDs","Abrupt discontinuation can worsen cognition and behavior","†Sick sinus syndrome, heart block, bradycardia","†Peptic ulcer disease, asthma or COPD, seizures","†No boxed warning"],
 tox:["†Overdose = cholinergic crisis: severe nausea and vomiting, salivation, sweating, bradycardia, hypotension, muscle weakness, respiratory depression","†Antidote: atropine. Remove any patch"],
 int:["NSAIDs: GI bleeding","†Anticholinergic drugs (diphenhydramine, oxybutynin, TCAs) cancel the benefit","†Beta blockers, digoxin, calcium channel blockers: more bradycardia","†Succinylcholine: prolonged paralysis"],
 mon:["Heart rate; dizziness, fainting, falls","Weight and food intake","GI bleeding: black stools, abdominal pain","Cognition and daily function over time","Skin under the patch"],
 labs:["†No routine labs or drug levels","†ECG if bradycardia or syncope","†Hemoglobin and stool occult blood if bleeding is suspected"],
 ed:["It may slow decline; it is not a cure","Take with food to reduce stomach upset","Patch: one a day; †new site each day, remove the old one first, do not cut","Do not stop suddenly","Report fainting, a slow pulse, black stools or vomiting that does not stop","Avoid over-the-counter sleep and allergy pills (†anticholinergic)"],
 kid:"Acetylcholine is the brain's 'memory glue'. In Alzheimer's the glue factory is shutting down. These drugs can't rebuild the factory, but they stop the cleanup crew from wiping away the little glue that is left. The glue is the same stuff that slows the heart and speeds the gut, which explains the side effects.",
 hesi:"Donepezil: GI upset and bradycardia; check the pulse; fall risk. It slows decline but does not cure. Never give with anticholinergics like diphenhydramine."},

{sys:"dem", name:"Memantine (NMDA Receptor Antagonist)", sfx:"—", ch:"3, 23",
 drugs:[["memantine","Namenda, Namenda XR","Moderate to severe Alzheimer's disease. Usually added after a cholinesterase inhibitor. Dizziness, headache, confusion, constipation."],
  ["memantine + donepezil","Namzaric","Combination capsule for moderate to severe AD once the patient tolerates both drugs."]],
 moa:"Glutamate helps memory, but in Alzheimer's there is too much of it. It over-stimulates NMDA receptors, calcium floods the neuron and damages it. Memantine sits in some of the NMDA receptor sites, so less glutamate binds and less calcium gets in.",
 use:["Moderate to severe Alzheimer's disease","Added to a cholinesterase inhibitor as the disease progresses"],
 exp:["Slower loss of thinking and daily function; †may ease agitation","Does not stop or reverse the disease","†Titrated weekly over about 4 weeks; assess after several weeks at full dose"],
 se:["Dizziness","Headache","Confusion","Constipation","†Fatigue, hypertension"],
 ae:["†Hallucinations, agitation","†Falls from dizziness","†Rare seizures; Stevens-Johnson syndrome"],
 warn:["†Severe renal impairment: lower dose","†Conditions that make urine alkaline (renal tubular acidosis, severe UTI) raise levels","†No boxed warning"],
 tox:["†Overdose: agitation, confusion, hallucinations, slow movements, stupor","†Supportive care; acidifying the urine speeds elimination. No antidote"],
 int:["†Other NMDA antagonists (amantadine, dextromethorphan, ketamine): additive CNS effects","†Sodium bicarbonate and carbonic anhydrase inhibitors raise memantine levels","Safe to combine with cholinesterase inhibitors"],
 mon:["Cognition and daily function","Dizziness and fall risk","New confusion or hallucinations","Bowel pattern"],
 labs:["†Renal function (creatinine clearance) for dosing","†No drug levels"],
 ed:["It may slow worsening; it does not cure","Rise slowly; make the home safe for falls","Extended-release capsule can be opened and sprinkled on applesauce; †do not crush or chew","Report new confusion or seeing things"],
 kid:"Glutamate is like a doorbell that helps brain cells learn. In Alzheimer's the doorbell is stuck ringing nonstop, and the noise wears the cell out. Memantine is a bit of tape over the button: normal rings still get through, but the constant buzzing stops.",
 hesi:"Memantine is for moderate to severe Alzheimer's and is often paired with donepezil. Cholinesterase inhibitors = GI and bradycardia; memantine = dizziness, confusion, constipation."},

{sys:"dem", name:"†Anti-Amyloid Antibodies", sfx:"-mab", ch:"not in your files",
 drugs:[["†lecanemab","Leqembi","IV infusion every 2 weeks for early Alzheimer's disease (mild cognitive impairment or mild dementia) with confirmed amyloid."],
  ["†donanemab","Kisunla","IV infusion every 4 weeks; can be stopped once amyloid plaques are cleared on PET."],
  ["†aducanumab","Aduhelm","First of the class; discontinued by the manufacturer in 2024."]],
 moa:"†Monoclonal antibodies that bind amyloid-beta and help the immune system clear amyloid plaques from the brain. This is the first class aimed at the disease process itself instead of symptoms.",
 use:["†Early Alzheimer's disease only: mild cognitive impairment or mild dementia, with amyloid confirmed by PET or CSF","†Not for moderate or severe disease"],
 exp:["†Modest slowing of decline over about 18 months; no improvement or cure","†Plaque clearing shows on PET over months"],
 se:["†Infusion reactions: fever, chills, nausea, flushing, BP changes (mostly first doses)","†Headache","†Falls"],
 ae:["†ARIA (amyloid-related imaging abnormalities): brain swelling (ARIA-E) or small bleeds (ARIA-H). Often silent; can cause headache, confusion, dizziness, vision changes, nausea, seizures","†Intracerebral hemorrhage","†Anaphylaxis"],
 warn:["†BOXED WARNING: ARIA. Higher risk in ApoE ε4 homozygotes; genetic testing is recommended before starting","†Anticoagulants and thrombolytics raise bleeding risk","†Brain MRI at baseline and before set infusions"],
 tox:["†No antidote. For symptomatic ARIA: hold or stop the drug, urgent MRI, supportive care; steroids for severe cases"],
 int:["†Anticoagulants, antiplatelets, thrombolytics (tPA): brain bleeding risk"],
 mon:["†Infusion reactions during and after each dose","†New headache, confusion, vision change, dizziness, gait change: think ARIA and report","†Cognition and function over time"],
 labs:["†Brain MRI: baseline and before specific early infusions","†ApoE ε4 genotype before starting","†Amyloid PET or CSF to confirm eligibility"],
 ed:["†This slows the disease a little; it does not restore memory","†Keep every MRI appointment","†Report headache, confusion, vision changes or dizziness right away","†Tell every provider you take it, especially in an emergency (stroke treatment)"],
 kid:"†Sticky plaques build up in the brain like gunk in a pipe. These antibodies are tags that tell the body's cleanup cells 'remove this'. Pulling the gunk out can make the pipe leak or swell a little, so doctors take brain pictures to check.",
 hesi:"†New headache or confusion on lecanemab or donanemab = suspect ARIA; hold the infusion and get an MRI. This class is newer than most exam references, so expect few questions."},
/* ============ SUBSTANCE USE & WITHDRAWAL ============ */
{sys:"sud", name:"Alcohol Withdrawal Drugs", sfx:"—", ch:"22",
 drugs:[["chlordiazepoxide","Librium","Long-acting benzodiazepine for tremulousness and mild to moderate agitation. PO or IM; tapered over 5 to 7 days. †Avoid in liver failure."],
  ["lorazepam","Ativan","PO or IM/IV; tapered over 5 to 7 days. †Preferred with liver disease or in older adults (no active metabolites)."],
  ["diazepam","Valium","IV for alcohol withdrawal seizures. Long acting."],
  ["thiamine (vitamin B1)","—","Prevents and treats Wernicke's encephalopathy: large IV doses 2–3 times daily for 1–2 weeks. Korsakoff's syndrome: thiamine for 3 to 12 months. †Give BEFORE glucose."],
  ["carbamazepine, phenobarbital","Tegretol, generic","Older withdrawal treatments still in use; others are safer and more effective."],
  ["clonidine","Catapres","Mild to moderate withdrawal. Alpha agonist given every 4–6 h as needed. Dizziness, hypotension, fatigue, headache. †Does not prevent seizures or DTs."],
  ["†folic acid, multivitamin, magnesium","'banana bag'","Replace nutritional deficits; low magnesium raises seizure and dysrhythmia risk."]],
 moa:"Alcohol presses the brain's GABA brake for years, so the brain turns its own accelerator up to compensate. When alcohol stops, the accelerator is stuck down. Benzodiazepines put a foot back on the GABA brake and are then eased off slowly. Thiamine replaces a vitamin the brain needs to burn glucose.",
 use:["Alcohol withdrawal: tremor, agitation, autonomic hyperactivity","Prevention and treatment of withdrawal seizures","Alcohol withdrawal delirium (delirium tremens)","Wernicke's encephalopathy and Korsakoff's syndrome (thiamine)"],
 exp:["Lower CIWA-Ar score, stable vital signs, no seizures, patient calm but rousable","Timeline, textbook: tremor at 6–8 h; perceptual and psychotic symptoms at 8–10 h; seizures at 12–24 h; delirium tremens any time in the first 72 h","†Timeline, standard references: tremor 6–12 h; hallucinosis 12–24 h; seizures 6–48 h; delirium tremens 48–96 h (peak day 2–3)","Wernicke's responds rapidly to thiamine; Korsakoff's recovers in only about 20%"],
 se:["Sedation, lower BP, less anxiety (benzodiazepines)","Dizziness, hypotension (clonidine)","†Ataxia"],
 ae:["Oversedation and respiratory depression","Untreated withdrawal: seizures, delirium tremens, coma, death (DTs are fatal in 20% of untreated patients)","†Anaphylaxis with IV thiamine (rare)"],
 warn:["†BOXED WARNING (benzodiazepines): respiratory depression with opioids; dependence and withdrawal","Withdrawal with psychosis is a medical emergency","†Giving glucose before thiamine can trigger Wernicke's encephalopathy","†Use lorazepam or oxazepam with significant liver disease"],
 tox:["†Benzodiazepine oversedation: hold the dose, support the airway; flumazenil is avoided in withdrawal because it can cause seizures","Delirium tremens: tachycardia, diaphoresis, fever, hypertension, delusions, visual and tactile hallucinations. Emergency: high-dose benzodiazepines, IV fluids, quiet room"],
 int:["Alcohol and other CNS depressants: additive sedation","†Phenobarbital with benzodiazepines: respiratory depression"],
 mon:["CIWA-Ar score to guide dosing, per agency policy. †A score of about 8–10 or more usually triggers a dose; above 15–20 is severe","Vital signs: rising BP, pulse and temperature","Seizure precautions","Level of consciousness, orientation, hallucinations","Fluid status (diaphoresis and fever cause dehydration)","Time of the last drink"],
 labs:["†Blood alcohol level","†Electrolytes: magnesium, potassium, phosphate, sodium","†Glucose","†Liver function tests, CBC (MCV), PT/INR","†Urine drug screen"],
 ed:["Withdrawal can be deadly; never detox alone at home after heavy use","The benzodiazepine is short term and will be tapered","Good nutrition and vitamins matter","Plan for what comes next: rehabilitation, mutual support groups such as AA, relapse-prevention drugs"],
 kid:"After years of drinking, the brain is like a car driven with the brake on all the time, so the driver keeps the gas floored to move. Take the brake (alcohol) away suddenly and the car shoots off: shaking, racing heart, seizures. The nurse gives a substitute brake and eases it off over days.",
 hesi:"Alcohol withdrawal: benzodiazepines guided by CIWA-Ar, seizure precautions, thiamine before glucose. Rising pulse, BP and temperature with visual or tactile hallucinations = delirium tremens = emergency."},

{sys:"sud", name:"Alcohol Relapse-Prevention Drugs", sfx:"—", ch:"22",
 drugs:[["disulfiram","Antabuse","Aversion therapy. Drinking causes intense nausea and vomiting, headache, sweating, flushing, dyspnea and confusion. Avoid all alcohol, including cough syrup and mouthwash."],
  ["naltrexone","ReVia, Depade (oral); Vivitrol (monthly IM)","Opioid antagonist. Reduces the pleasure of drinking and cravings. Nausea usually fades after the first month; headache, sedation. Must be opioid free first."],
  ["acamprosate","Campral","Relapse prevention. Start on the fifth day of abstinence. One dose three times a day. Diarrhea, GI upset, appetite loss, dizziness, anxiety, trouble sleeping. Contraindicated in renal impairment."]],
 moa:"Disulfiram blocks aldehyde dehydrogenase, so toxic acetaldehyde builds up when alcohol is taken. Naltrexone blocks opioid receptors, so alcohol stops feeling rewarding. Acamprosate †rebalances glutamate and GABA, easing the long tail of withdrawal (anxiety, insomnia) that drives relapse.",
 use:["Maintenance of abstinence after detox","Reducing cravings and heavy drinking days (naltrexone)","Aversion therapy for motivated patients (disulfiram)","Used with counseling and mutual support groups"],
 exp:["Longer abstinence, fewer drinking days, fewer cravings","Acamprosate works only when started after drinking has stopped","†Disulfiram reaction starts within 5–10 minutes of alcohol and lasts 30–60 minutes or more"],
 se:["Disulfiram: †drowsiness, headache, metallic or garlic taste","Naltrexone: nausea, headache, sedation, GI distress, muscle cramps, dizziness, appetite changes; injection site pain","Acamprosate: diarrhea, GI upset, appetite loss, dizziness, anxiety, insomnia"],
 ae:["Disulfiram-alcohol reaction: †severe cases cause hypotension, dysrhythmias, respiratory depression, seizures, death","†Disulfiram: hepatotoxicity, peripheral neuropathy, psychosis","Naltrexone: precipitated opioid withdrawal; injection site reactions (cellulitis, induration, abscess, necrosis); †liver injury at high doses","†Acamprosate: suicidal thoughts"],
 warn:["†BOXED WARNING (disulfiram): never give to a patient who is intoxicated or without the patient's full knowledge","†Disulfiram: wait at least 12 hours after the last drink; a reaction can occur for up to 14 days after the last dose","Naltrexone: opiate free for 10 days before starting (textbook); †standard references say 7–10 days, up to 14 after methadone","Acamprosate: contraindicated in renal impairment; †severe (CrCl below 30)","†Naltrexone: acute hepatitis or liver failure; disulfiram: severe heart disease, psychosis, pregnancy"],
 tox:["†Disulfiram-alcohol reaction: supportive care, IV fluids, oxygen; no antidote","†Naltrexone-precipitated withdrawal: supportive care","†Trying to override naltrexone with large opioid doses can cause fatal overdose"],
 int:["Disulfiram + any alcohol: cough syrup, mouthwash, †aftershave, hand sanitizer, sauces and desserts made with alcohol","†Disulfiram + metronidazole: psychosis; raises warfarin and phenytoin levels","Naltrexone + opioids: blocks pain relief and causes withdrawal","†Metronidazole and some cephalosporins cause a disulfiram-like reaction on their own"],
 mon:["Sobriety and cravings","Opioid use before naltrexone","Injection site (Vivitrol)","Mood and suicidal thoughts","†Jaundice, dark urine, abdominal pain"],
 labs:["†Liver function tests at baseline and periodically (disulfiram, naltrexone)","Renal function before acamprosate","†Urine drug screen negative for opioids, or a naloxone challenge, before naltrexone","†Breath or blood alcohol of zero before disulfiram"],
 ed:["Disulfiram: read every label; alcohol hides in mouthwash, cough syrup and food","†Carry a card or wear a bracelet saying you take disulfiram or naltrexone","Naltrexone: opioid pain medicine will not work; tell every provider","Acamprosate: keep taking it even if you slip and drink; three times a day","These drugs support recovery; they do not replace counseling and support groups"],
 kid:"Three different helpers. Disulfiram is a booby trap: drink and you get very sick. Naltrexone takes the fun out, like eating candy with a stuffy nose. Acamprosate calms the jittery, can't-sleep feeling that makes people want to drink again.",
 hesi:"Disulfiram: no alcohol in any form, even mouthwash; effects last up to 2 weeks. Naltrexone: must be opioid free; watch the liver. Acamprosate: start after abstinence; check the kidneys; safe for the liver."},

{sys:"sud", name:"Opioid Use Disorder & Overdose Drugs", sfx:"nal- (antagonists)", ch:"22",
 drugs:[["naloxone","Narcan","Pure opioid antagonist for overdose. Intranasal, IM, subcutaneous or IV. Breathing and pupils respond quickly. Short acting: repeat doses are often needed. Too much causes withdrawal."],
  ["methadone","Dolophine, Methadose","Synthetic opioid, †full agonist. Eases withdrawal and blocks the euphoria of other opioids. Once daily. Dispensed only by a certified opioid treatment program. Low dose may be the safest course in pregnancy. †QT prolongation."],
  ["buprenorphine","Subutex (SL); Sublocade (monthly subcutaneous); Probuphine (6-month implant)","Partial opioid agonist; Schedule III. Start only after 12 to 24 hours without opioids and when early withdrawal has begun, or it causes acute withdrawal. †Ceiling effect on respiratory depression; office-based prescribing."],
  ["buprenorphine + naloxone","Suboxone, Zubsolv, Bunavail","Sublingual or buccal. †The naloxone is not absorbed by mouth; it is there to block the high if the drug is injected."],
  ["naltrexone","ReVia (oral daily); Vivitrol (monthly IM)","Opioid antagonist for relapse prevention after detox. Blocks euphoria. Injection site reactions in about 70%."],
  ["clonidine","Catapres","Alpha agonist. Eases sweating, hot flashes, watery eyes, restlessness and anxiety of withdrawal."],
  ["lofexidine","Lucemyra","Alpha agonist FDA approved for opioid withdrawal symptoms. Far more expensive than clonidine. †Less hypotension."]],
 moa:"Opioid receptors are locks. Heroin and fentanyl are keys that turn the lock all the way. Methadone is a slow, long-lasting key. Buprenorphine fits the lock but only turns it part way and holds on tightly. Naloxone and naltrexone fit the lock, do not turn it, and block every other key. Clonidine and lofexidine calm the sympathetic storm of withdrawal.",
 use:["Opioid overdose reversal (naloxone)","Opioid withdrawal (methadone, buprenorphine, clonidine, lofexidine)","Maintenance therapy to reduce cravings (methadone, buprenorphine-naloxone)","Relapse prevention after detox (naltrexone)"],
 exp:["Naloxone: respirations rise and pupils dilate †within 2–5 minutes; lasts 30–90 minutes","Methadone and buprenorphine: withdrawal eases within hours; cravings controlled once stabilized","Clonidine and lofexidine: fewer autonomic symptoms; withdrawal may be shortened"],
 se:["Buprenorphine: nausea, vomiting, constipation, muscle aches and cramps, insomnia, irritability, fever","Methadone: †sedation, constipation, sweating","Naltrexone: GI distress, muscle cramps, dizziness, sedation, appetite changes","Clonidine, lofexidine: †hypotension, bradycardia, dizziness, dry mouth, sleepiness"],
 ae:["Naloxone: abrupt withdrawal; return of respiratory depression when it wears off","Methadone: difficulty or shallow breathing, faintness, chest pain, fast or pounding heartbeat, hallucinations, confusion; †QT prolongation and torsades","Buprenorphine: precipitated withdrawal if opioids are still on board","Naltrexone: precipitated withdrawal; †overdose risk after stopping because tolerance is lost","†Neonatal opioid withdrawal syndrome"],
 warn:["†BOXED WARNING (methadone): life-threatening respiratory depression, QT prolongation, addiction and misuse, accidental ingestion, neonatal withdrawal, danger with benzodiazepines and CNS depressants","†BOXED WARNING (Sublocade): serious harm or death if injected IV; REMS","Naltrexone: must be opioid free (10 days per the textbook; †7–10 days, up to 14 after methadone)","Methadone must eventually be tapered","†Clonidine and lofexidine: taper to avoid rebound hypertension"],
 tox:["Opioid overdose triad: coma, pinpoint pupils, respiratory depression. Also hypothermia, hypotension, bradycardia","Treatment: open the airway, suction, ventilate; give naloxone and repeat as needed","†Buprenorphine overdose may need higher or repeated naloxone doses"],
 int:["Benzodiazepines, alcohol and other CNS depressants with methadone or buprenorphine: respiratory depression","Naltrexone blocks all opioid analgesics","†Other QT-prolonging drugs with methadone","†CYP3A4 inducers (carbamazepine, rifampin) lower methadone levels and cause withdrawal"],
 mon:["Respiratory rate, SpO2 and level of consciousness; keep watching after naloxone","Withdrawal signs: tachycardia, hypertension, dilated pupils, yawning, runny nose and tearing, gooseflesh, cramps, diarrhea, muscle and bone pain; †scored with COWS","BP and pulse with clonidine or lofexidine","Injection or implant site","Cravings and use"],
 labs:["†Urine drug screen (must be opioid negative before naltrexone)","†ECG at baseline and periodically on methadone (QT)","†Liver function tests (naltrexone, buprenorphine)","†Pregnancy test; hepatitis and HIV screening"],
 ed:["Naloxone: give it, call 911, stay with the person; a second dose may be needed","Buprenorphine: let it dissolve under the tongue; do not swallow or chew; wait until withdrawal has started for the first dose","Methadone: daily clinic dosing at first; never share take-home doses; store locked","Naltrexone: your tolerance is gone, so using your old dose can kill you","No alcohol or benzodiazepines","Medication works best with counseling and groups such as Narcotics Anonymous"],
 kid:"Think of the opioid receptor as a chair. Heroin sits in the chair and makes you feel high but can stop your breathing. Methadone is a calm guest who sits there all day. Buprenorphine half-sits and won't get up. Naloxone shoves everyone out of the chair and sits there doing nothing, which is why breathing comes back.",
 hesi:"Naloxone wears off before the opioid: keep monitoring respirations. Buprenorphine too early = precipitated withdrawal. Methadone = QT and respiratory depression. Clonidine helps symptoms but not cravings."},

{sys:"sud", name:"Smoking Cessation Drugs", sfx:"—", ch:"19, 22",
 drugs:[["nicotine replacement","gum, lozenge, patch, nasal spray, inhaler","Highly successful. †Patch gives a steady level; gum, lozenge, spray or inhaler cover sudden cravings. †Gum: chew until it tingles, then park it in the cheek; no food or drink for 15 minutes before."],
  ["bupropion SR","Zyban","Antidepressant that reduces cravings and withdrawal symptoms. Lowers the seizure threshold. †Start 1–2 weeks before the quit date."],
  ["varenicline","Chantix","Nicotinic receptor partial agonist. Mimics nicotine to reduce cravings and withdrawal, and partly blocks the receptor so smoking is less rewarding. †Start 1 week before the quit date; take after eating with a full glass of water."]],
 moa:"Nicotine replacement gives clean nicotine without smoke so the dose can be stepped down. Varenicline half-activates the nicotine receptor and blocks nicotine from it. Bupropion raises dopamine and norepinephrine, which eases cravings.",
 use:["Tobacco use disorder; easing nicotine withdrawal","Combined with counseling and behavioral strategies"],
 exp:["Fewer cravings and less irritability, anxiety and restlessness","†A usual course is 12 weeks; varenicline may be extended to 24","†Combining a patch with a short-acting form works better than either alone"],
 se:["Nicotine: †skin irritation (patch), mouth soreness, hiccups, heartburn (gum), insomnia and vivid dreams","Bupropion: insomnia, dry mouth, headache, agitation","Varenicline: †nausea, insomnia, abnormal or vivid dreams, headache, constipation"],
 ae:["Bupropion: seizures","†Varenicline: mood changes, agitation, suicidal thoughts (monitor); rare seizures; sleepwalking","†Nicotine overdose from smoking while on replacement: nausea, palpitations, dizziness"],
 warn:["Bupropion: contraindicated with seizure disorders and eating disorders; †boxed warning for suicidal thinking as an antidepressant","†Varenicline: the boxed warning about neuropsychiatric events was removed in 2016; monitoring is still advised","†Nicotine: caution right after MI, with serious dysrhythmias or unstable angina; avoid in pregnancy if possible","†Renal impairment: lower the varenicline dose"],
 tox:["†Nicotine toxicity: nausea, vomiting, salivation, abdominal pain, sweating, palpitations, then weakness and seizures. Remove the patch and wash the skin; supportive care","†Bupropion overdose: seizures; benzodiazepines"],
 int:["MAOIs with bupropion: contraindicated","†Stopping smoking raises levels of clozapine, olanzapine, theophylline and caffeine (the enzyme CYP1A2 is no longer induced)","†Alcohol tolerance may drop on varenicline"],
 mon:["Smoking status and cravings","Mood and behavior changes","Sleep","Blood pressure (bupropion plus nicotine can raise it)","Seizure risk factors"],
 labs:["†No routine labs","†Renal function for varenicline dosing","†Recheck clozapine or theophylline levels after quitting"],
 ed:["Set a quit date","Do not smoke while using nicotine replacement","Remove the nicotine patch at bedtime if it disturbs sleep; rotate sites","Report mood changes, agitation or thoughts of self-harm","Take varenicline with food and water to limit nausea","Expect cravings to peak in the first days and fade over weeks"],
 kid:"Quitting cold is like jumping off a tall step. Nicotine patches and gum build a staircase so you step down slowly. Varenicline sits in nicotine's seat so cigarettes stop feeling good. Bupropion quiets the 'I need one' feeling.",
 hesi:"Varenicline: nausea, vivid dreams, watch mood. Bupropion (Zyban): seizure risk. When a patient on clozapine quits smoking, the clozapine level rises."},

/* ============ EPS & EMERGENCY ============ */
{sys:"eps", name:"Anticholinergics & Other Drugs for EPS", sfx:"—", ch:"12, 27",
 drugs:[["benztropine","Cogentin","Antiparkinsonian anticholinergic. Oral for prevention or treatment of pseudoparkinsonism; IM for acute dystonia (relief usually in 5–15 minutes). Added to an IM antipsychotic to reduce EPS."],
  ["trihexyphenidyl","Artane","Oral anticholinergic for pseudoparkinsonism. The one most often misused."],
  ["diphenhydramine","Benadryl","Antihistamine with anticholinergic action. 25–50 mg IM/IV for acute dystonia. Added to haloperidol and lorazepam injections."],
  ["propranolol","Inderal","Beta blocker. First choice for akathisia."],
  ["lorazepam, diazepam","Ativan, Valium","Benzodiazepines used for akathisia."],
  ["†amantadine","Symmetrel","Dopamine-releasing drug for pseudoparkinsonism when anticholinergic effects must be avoided (older adults). Livedo reticularis, ankle edema."]],
 moa:"Movement depends on a balance between dopamine and acetylcholine in the basal ganglia. Antipsychotics lower dopamine, so acetylcholine is left too strong and muscles get stiff or spasm. Anticholinergics lower acetylcholine and restore the balance. They do not help tardive dyskinesia.",
 use:["Acute dystonia (IM benztropine or diphenhydramine)","Pseudoparkinsonism (oral benztropine or trihexyphenidyl)","Akathisia (propranolol, benzodiazepines; antiparkinsonian drug as ordered)","Prevention of EPS with high-potency antipsychotics"],
 exp:["Acute dystonia: relief in 5–15 minutes after an IM dose","†Pseudoparkinsonism and akathisia: improvement over hours to days","Tardive dyskinesia does NOT improve; †anticholinergics can make it worse"],
 se:["Dry mouth, blurred vision, constipation, urinary retention","Tachycardia","Sedation (diphenhydramine)","Memory problems or confusion, especially in older adults","†Decreased sweating"],
 ae:["ANTICHOLINERGIC TOXICITY","Paralytic ileus, bowel obstruction","Misuse for a euphoric effect (trihexyphenidyl most, also benztropine and diphenhydramine)","†Acute angle-closure glaucoma; heat stroke","†Propranolol: bradycardia, hypotension, bronchospasm"],
 warn:["Older adults and patients on several anticholinergic drugs are at highest risk of toxicity","†Narrow-angle glaucoma, prostatic hypertrophy or urinary retention, bowel obstruction, myasthenia gravis, tardive dyskinesia","†Dementia: worsens confusion (Beers list)","†Propranolol: asthma, heart block; boxed warning against stopping it abruptly in heart disease","†No boxed warning on benztropine, trihexyphenidyl or diphenhydramine"],
 tox:["Anticholinergic toxicity: hot dry skin and fever without sweating, dilated pupils, absent bowel sounds, urinary retention, tachycardia, agitation, hallucinations, delirium, seizures. It can look like worsening psychosis","Treatment: hold all medications, call the prescriber, cooling measures, catheterize as needed, benzodiazepine for agitation. Physostigmine may reverse it","†Memory aid: hot as a hare, dry as a bone, red as a beet, blind as a bat, mad as a hatter, full as a flask"],
 int:["Other anticholinergic drugs: low-potency antipsychotics, clozapine, olanzapine, TCAs, paroxetine, over-the-counter cold and allergy medicines","†Cholinesterase inhibitors: opposite effects","†Alcohol and CNS depressants: sedation"],
 mon:["Airway first in acute dystonia; stay with the patient","Muscle tone, tremor, gait, restlessness","Bowel sounds and last bowel movement; bladder distention","Temperature and mental status","Pulse and BP before propranolol"],
 labs:["†No routine labs or drug levels","†ECG if tachycardia or dysrhythmia in toxicity"],
 ed:["Acute dystonia is frightening but treatable; it does not mean the antipsychotic is poison","Sip water, use sugarless gum; fluids and fiber for constipation","Report trouble urinating, no bowel movement, fever or confusion","†Avoid overheating; you sweat less","Do not take extra doses or over-the-counter allergy pills with it","†Do not stop suddenly"],
 kid:"Picture a seesaw with dopamine on one side and acetylcholine on the other. Antipsychotics push dopamine down, so acetylcholine flies up and the muscles lock or shake. Benztropine pushes acetylcholine back down and levels the seesaw. Too much, though, and everything dries up and overheats.",
 hesi:"Acute dystonia (neck twisting, eyes rolling up, tongue spasm) = IM benztropine or diphenhydramine and protect the airway. Akathisia = propranolol. Tardive dyskinesia is NOT treated with benztropine."},

{sys:"eps", name:"VMAT2 Inhibitors (for Tardive Dyskinesia)", sfx:"-benazine", ch:"12",
 drugs:[["valbenazine","Ingrezza","FDA approved for tardive dyskinesia in adults. †Once daily, with or without food."],
  ["deutetrabenazine","Austedo, Austedo XR","FDA approved for tardive dyskinesia in adults. †Twice daily with food (XR once daily). Also treats Huntington's chorea."],
  ["†tetrabenazine","Xenazine","Older drug for Huntington's chorea; off label for tardive dyskinesia. Boxed warning for depression and suicidality."]],
 moa:"Selectively block vesicular monoamine transporter 2 (VMAT2), the pump that loads dopamine into storage vesicles. Less dopamine is released onto the over-sensitive receptors that cause the involuntary movements.",
 use:["Tardive dyskinesia in adults","†Chorea of Huntington's disease (deutetrabenazine, valbenazine)"],
 exp:["Fewer and milder involuntary movements; lower AIMS score","†Improvement begins in 2 weeks and builds over about 6 weeks","†Movements return if the drug is stopped; it controls, not cures"],
 se:["Sleepiness","†Dry mouth, fatigue","†Akathisia or restlessness","†Balance problems"],
 ae:["QT prolongation","†Parkinson-like symptoms","†Depression and suicidal thoughts in patients with Huntington's disease","†NMS (rare)"],
 warn:["Contraindicated with congenital or acquired long-QT syndrome and related dysrhythmias","Caution with driving and hazardous activity until the effect is known","†BOXED WARNING (deutetrabenazine, tetrabenazine; valbenazine in Huntington's): depression and suicidality in Huntington's disease","†Not with MAOIs or reserpine"],
 tox:["†Overdose: sedation, dystonia, low BP, QT prolongation. Supportive care with ECG monitoring; no antidote"],
 int:["Other QT-prolonging drugs","†MAOIs: contraindicated","†Strong CYP2D6 inhibitors (paroxetine, fluoxetine, bupropion) raise levels","†Alcohol and sedatives: more sleepiness"],
 mon:["AIMS at baseline and regularly","Sleepiness and fall risk","Mood and suicidal thoughts","†New stiffness, tremor or slowness"],
 labs:["†ECG (QT) in at-risk patients","†No drug levels"],
 ed:["It reduces the movements but they can return if you stop","Do not drive until you know how sleepy it makes you","Keep taking your antipsychotic unless told otherwise","Report fainting, palpitations, low mood or new stiffness","†Take deutetrabenazine with food; swallow tablets whole"],
 kid:"After years of dopamine being blocked, the receptors become extra jumpy, and the face and tongue move by themselves. These drugs pack less dopamine into each little delivery bubble, so the jumpy receptors get a gentler signal.",
 hesi:"Tardive dyskinesia: screen with AIMS, treat with valbenazine or deutetrabenazine, not benztropine. Watch the QT interval and sleepiness."},

{sys:"eps", name:"Antidotes & Rescue Drugs for Psych Emergencies", sfx:"—", ch:"12, 14, 22",
 drugs:[["dantrolene","Dantrium, Ryanodex","NMS: direct muscle relaxant that relieves rigidity and lowers the heat made by contracting muscle. Also listed for rigidity in serotonin syndrome. †Hepatotoxic; tissue damage if it leaks from the vein."],
  ["bromocriptine","Parlodel","NMS: dopamine agonist that restores the blocked dopamine signal. †Hypotension, nausea; can worsen psychosis."],
  ["cyproheptadine","Periactin","Serotonin syndrome: serotonin-receptor blocker. †Oral only; sedating and anticholinergic."],
  ["physostigmine","Antilirium","Anticholinergic toxicity: cholinesterase inhibitor that may reverse it. †Slow IV; can cause bradycardia, seizures and bronchospasm; keep atropine at hand. Not for TCA overdose."],
  ["phentolamine","Regitine","MAOI hypertensive crisis: 5 mg IV alpha blocker (nitroprusside or nitroglycerin are alternatives)."],
  ["†flumazenil","Romazicon","Benzodiazepine antagonist. Seizure risk in dependent patients; short acting."],
  ["naloxone","Narcan","Opioid overdose. See Opioid Use Disorder card."],
  ["†sodium bicarbonate","—","TCA overdose with widened QRS or ventricular dysrhythmia."],
  ["diphenhydramine, benztropine","Benadryl, Cogentin","Acute dystonia, IM or IV."]],
 moa:"Each rescue drug reverses one specific mechanism: dantrolene stops calcium release inside muscle; bromocriptine turns dopamine receptors back on; cyproheptadine blocks serotonin receptors; physostigmine raises acetylcholine; phentolamine opens constricted vessels; flumazenil and naloxone push the drug off its receptor.",
 use:["Neuroleptic malignant syndrome (dantrolene, bromocriptine)","Serotonin syndrome (cyproheptadine; benzodiazepines)","Anticholinergic toxicity (physostigmine)","MAOI hypertensive crisis (phentolamine)","Benzodiazepine, opioid and TCA overdose","Acute dystonia"],
 exp:["Dystonia: 5–15 minutes after IM treatment","Naloxone: †2–5 minutes","†Serotonin syndrome: usually clears within 24–72 hours of stopping the drug","†NMS: resolves over 1–2 weeks (longer after a long-acting injection)"],
 se:["†Dantrolene: muscle weakness, drowsiness, diarrhea","†Bromocriptine: nausea, orthostatic hypotension","†Cyproheptadine: sedation, dry mouth","†Physostigmine: nausea, salivation, sweating"],
 ae:["†Dantrolene: liver injury","†Physostigmine: bradycardia, asystole, seizures, bronchospasm (cholinergic crisis)","†Flumazenil: seizures, re-sedation when it wears off","Naloxone: acute withdrawal; re-sedation","†Phentolamine: sudden hypotension, tachycardia"],
 warn:["The first step in every one of these emergencies is to stop the offending drug","NMS and serotonin syndrome need critical care transfer","†Never give physostigmine in TCA overdose (asystole)","†Avoid flumazenil in long-term benzodiazepine users, seizure disorders and mixed TCA overdose","†After NMS, wait at least 2 weeks before restarting any antipsychotic","†BOXED WARNING (oral dantrolene): hepatotoxicity"],
 tox:["†Physostigmine overdose (cholinergic crisis): atropine","†Too much naloxone or flumazenil: withdrawal; supportive care","See the comparison table in Quick reference for telling the four syndromes apart"],
 int:["†Dantrolene with IV calcium channel blockers (verapamil): cardiovascular collapse","†Bromocriptine opposes antipsychotics","†Cyproheptadine adds to anticholinergic load"],
 mon:["Temperature (core), muscle tone, level of consciousness","BP, heart rate and rhythm; continuous ECG","Respiratory rate and SpO2","Intake and output; urine color (dark urine suggests rhabdomyolysis)","Cooling measures: cooling blanket, ice or cool water bath as ordered","Hydration with oral or IV fluids"],
 labs:["†Creatine kinase (CK): very high in NMS","†WBC: elevated in NMS","†Renal function, electrolytes and urine myoglobin (rhabdomyolysis); complications of NMS include acute kidney injury","†Liver function with dantrolene","†Serum drug levels where they exist (lithium, TCA)","†ECG: QRS and QT"],
 ed:["Teach patients and families the warning signs of each syndrome and to seek care at once","MAOI patients: severe headache means go to the emergency department","Give all providers a full medication list, including over-the-counter and herbal products","Carry naloxone if opioids are in the home"],
 kid:"Each emergency is a different alarm, and each antidote is the right key for one alarm. Stiff as a board with a high fever (NMS) gets a muscle unlocker. Twitchy and jumpy (serotonin syndrome) gets a serotonin blocker. Hot, dry and confused (anticholinergic) gets a drug that brings the 'wet' signal back.",
 hesi:"Match the antidote: NMS = dantrolene or bromocriptine. Serotonin syndrome = cyproheptadine. Anticholinergic toxicity = physostigmine. MAOI hypertensive crisis = phentolamine. Benzodiazepines = flumazenil. Opioids = naloxone. TCA = sodium bicarbonate. Lithium = none (dialysis)."},

/* ============ OTHER ============ */
{sys:"other", name:"Acute Agitation & Aggression Drugs", sfx:"—", ch:"11, 27",
 drugs:[["lorazepam","Ativan","PO, SL, IM, IV. Benzodiazepine of choice. Caution with liver dysfunction. Lowers the amount of antipsychotic needed."],
  ["haloperidol","Haldol","PO, IM, IV. Most widely used. Keep the patient hydrated, check vital signs and test for muscle rigidity (NMS). Cardiac monitoring for IV use."],
  ["haloperidol + lorazepam + diphenhydramine or benztropine","'B52' †","Common IM combination. The anticholinergic is added to reduce EPS."],
  ["olanzapine","Zyprexa, Zyprexa Zydis (ODT)","PO, orally disintegrating, IM. Useful when haloperidol fails. ODT dissolves in saliva almost at once. Avoid IM with IM lorazepam."],
  ["ziprasidone","Geodon","PO, IM. Use cautiously with QT prolongation."],
  ["chlorpromazine","Thorazine","PO, PR, IM. Very sedating. Painful injection; watch for hypotension."],
  ["loxapine (inhaled)","Adasuve","Rapid delivery. Restricted program because of potentially fatal bronchospasm."],
  ["alprazolam, diazepam","Xanax, Valium","Alprazolam can cause paradoxical reactions in personality disorders and older adults. Diazepam: fast calming, long half-life."],
  ["†dexmedetomidine (sublingual film)","Igalmi","Alpha-2 agonist film for agitation in schizophrenia or bipolar disorder. Hypotension, bradycardia, sleepiness."],
  ["†droperidol","Inapsine","IM/IV in emergency departments. Boxed warning for QT prolongation."]],
 moa:"Antipsychotics block dopamine to calm psychotic agitation. Benzodiazepines boost GABA to sedate and relax. Used together, a lower dose of each is needed. These treat the acute episode; long-term treatment targets the underlying disorder.",

 suffixes: [
  ["-pram, -oxetine","SSRI","citalopram, escitalopram, fluoxetine, paroxetine (duloxetine and atomoxetine are exceptions)"],
  ["-faxine","SNRI","venlafaxine, desvenlafaxine"],

 ]
};

const FIELDS = [
  ["moa","How it works","wide"],["use","Used for"],["exp","Therapeutic response & how long it takes"],
  ["se","Side effects"],["ae","Adverse effects (serious)"],["warn","Warnings & contraindications"],
  ["tox","Toxicity & antidote","wide"],["int","Interactions"],["mon","Monitor / assess"],["labs","Labs to monitor","wide"],
  ["ed","Nursing & teaching"],["kid","Like I'm 10"],["hesi","NCLEX / HESI focus"]
];
const SYS = Object.fromEntries(SYSTEMS.map(s=>[s.id,s]));
CLASSES.forEach((c,i)=>{ c.id = "c"+i; });

const state = { sys:"all", q:"", quiz:false, tab:"drugs", open:new Set() };
try{ state.quiz = localStorage.getItem("pm_quiz")==="1"; const t=localStorage.getItem("pm_tab"); if(t==="quick") state.tab="quick"; }catch(e){}

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const norm = s=>String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"");
function hl(text, q){
  const raw = String(text); if(!q) return esc(raw);
  const words = q.split(/\s+/).filter(w=>w.length>1).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!words.length) return esc(raw);
  return raw.split(new RegExp("("+words.join("|")+")","gi")).map((p,i)=>i%2?"<mark>"+esc(p)+"</mark>":esc(p)).join("");
}
function fullText(c){
  return norm([c.name,c.sfx,c.drugs.map(d=>d.join(" ")).join(" "),...FIELDS.map(([k])=>[].concat(c[k]||"").join(" "))].join(" "));
}
CLASSES.forEach(c=>{ c._txt = fullText(c); c._names = c.drugs.map(d=>norm(d[0]+" "+d[1])); c._parts = c.drugs.flatMap(d=>d[0].split(/,|\s\/\s|;/).map(p=>p.replace(/\(.*?\)/g,"").trim().toLowerCase()).filter(Boolean)); });
const uniq = cs=>new Set(cs.flatMap(c=>c._parts)).size;

function score(c, q){
  if(!q) return {s:1, hits:[]};
  const terms = norm(q).split(/\s+/).filter(Boolean);
  let s = 0; const hits = [];
  c.drugs.forEach((d,i)=>{
    const n = c._names[i];
    if(terms.every(t=>n.includes(t))){
      hits.push(i);
      const starts = terms.every(t=>new RegExp("(^|[\\s,/(-])"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(n));
      s = Math.max(s, starts?100:80);
    }
  });
  const cn = norm(c.name+" "+c.sfx);
  if(terms.every(t=>cn.includes(t))) s = Math.max(s,70);
  if(!s && terms.every(t=>c._txt.includes(t))) s = 20;
  return {s, hits};
}

function renderChips(){
  const counts = {}; SYSTEMS.forEach(s=>counts[s.id]=uniq(CLASSES.filter(c=>c.sys===s.id)));
  const total = uniq(CLASSES);
  const chip = (id,label,c,n)=>`<button class="chip" style="--c:${c}" aria-pressed="${state.sys===id}" data-sys="${id}">${id==="all"?"":'<span class="dot"></span>'}${esc(label)} <span class="n">${n}</span></button>`;
  $("#chips").innerHTML = chip("all","All categories","var(--accent)",total) + SYSTEMS.map(s=>chip(s.id,s.name,s.hue,counts[s.id]||0)).join("");
}

const DG = '<span class="dg" title="From standard drug references, not your project files">†</span>';
const dg = html=>html.replace(/†/g, DG);
function listHTML(v){
  if(Array.isArray(v)) return "<ul>"+v.map(x=>"<li>"+dg(hl(x,state.q))+"</li>").join("")+"</ul>";
  return "<p>"+dg(hl(v,state.q))+"</p>";
}
function labsHTML(c){
  const items = c.labs.map(x=>{
    const d = x.startsWith("†"); const t = d ? x.slice(1) : x; const i = t.indexOf(": ");
    const body = i>0 && i<60 ? "<b>"+hl(t.slice(0,i),state.q)+"</b>: "+hl(t.slice(i+2),state.q) : hl(t,state.q);
    return "<li>"+(d?"†":"")+body+"</li>";
  }).join("");
  return dg("<ul>"+items+"</ul>");
}
const srcText = c=> c.ch.startsWith("not") ? "Source: standard drug references only. This class is not in your project files." : "Source: Varcarolis, Foundations of Psychiatric-Mental Health Nursing (9th ed.), Ch. "+c.ch+". † = from standard drug references, not your project files.";
function cardHTML(c, hits, showSys){
  const sys = SYS[c.sys];
  const names = c.drugs.map(d=>d[0]).join(" · ");
  const open = state.open.has(c.id);
  const drugRows = c.drugs.map((d,i)=>`<div class="drow${hits.includes(i)&&state.q?" hit":""}"><div class="dn">${dg(hl(d[0],state.q))}</div><div class="db">${d[1]&&d[1]!=="—"?hl(d[1],state.q):""}</div>${d[2]?`<div class="dnote">${dg(hl(d[2],state.q))}</div>`:""}</div>`).join("");
  const secs = FIELDS.filter(([k])=>c[k]).map(([k,label,w])=>`<section class="sec k-${k}${w?" wide":""}"><h4>${label}</h4><div class="ans">${k==="labs"?labsHTML(c):listHTML(c[k])}</div></section>`).join("");
  return `<details class="mono" data-id="${c.id}" style="--c:${sys.hue}"${open?" open":""}>
    <summary>
      <div class="s-head">${showSys?`<span class="systag">${esc(sys.name)}</span>`:""}<div class="s-title"><h3>${hl(c.name.replace(/†/g,""),state.q)}</h3>${c.sfx&&c.sfx!=="—"?`<span class="sfx">${esc(c.sfx)}</span>`:""}</div></div>
      <span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="s-drugs">${hl(names.replace(/†/g,""),state.q)}</div>
    </summary>
    <div class="body">
      <div class="druglist">${drugRows}</div>
      <div class="secs">${secs}</div>
      <p class="srcline">${dg(esc(srcText(c)))}</p>
      <div class="cardfoot"><button class="copybtn" data-copy="${c.id}">Copy as notes</button></div>
    </div>
  </details>`;
}

function renderDrugs(){
  const view = $("#view-drugs");
  const q = state.q.trim();
  let items = CLASSES.filter(c=>state.sys==="all"||c.sys===state.sys).map(c=>({c,...score(c,q)})).filter(x=>x.s>0);
  const nDrugs = uniq(items.map(x=>x.c));
  $("#count").textContent = q ? `${items.length} class${items.length===1?"":"es"} match` : `${items.length} classes · ${nDrugs} drugs`;
  if(!items.length){
    view.innerHTML = `<div class="empty">No match for “${esc(q)}”${state.sys!=="all"?" in "+esc(SYS[state.sys].name):""}. Try the generic name, a brand, or a suffix like <b>-apine</b>.${state.sys!=="all"?' <br><br><button class="tbtn" id="allsys">Search all categories</button>':""}</div>`;
    const b=$("#allsys"); if(b) b.onclick=()=>{state.sys="all";renderChips();render();};
    return;
  }
  if(q){
    items.sort((a,b)=>b.s-a.s);
    const strong = items.filter(x=>x.s>=70);
    if(strong.length && strong.length<=3) strong.forEach(x=>state.open.add(x.c.id));
    const top = items.filter(x=>x.s>=70), rest = items.filter(x=>x.s<70);
    let html = "";
    if(top.length) html += `<div class="group">${top.map(x=>cardHTML(x.c,x.hits,true)).join("")}</div>`;
    if(rest.length) html += `<div class="group"><h2>Also mentioned in</h2>${rest.map(x=>cardHTML(x.c,x.hits,true)).join("")}</div>`;
    view.innerHTML = html;
  } else {
    view.innerHTML = SYSTEMS.filter(s=>state.sys==="all"||s.id===state.sys).map(s=>{
      const cs = items.filter(x=>x.c.sys===s.id); if(!cs.length) return "";
      return `<div class="group" style="--c:${s.hue}"><h2><span class="tab"></span>${esc(s.name)}</h2>${cs.map(x=>cardHTML(x.c,[],false)).join("")}</div>`;
    }).join("");
  }
}

function tbl(head, rows, monoCols, cls){
  const q = norm(state.q.trim());
  const rs = q ? rows.filter(r=>q.split(/\s+/).every(t=>norm(r.join(" ")).includes(t))) : rows;
  if(!rs.length) return `<p class="lede">No rows match “${esc(state.q)}”.</p>`;
  return `<div class="tablewrap"><table${cls?` class="${cls}"`:""}><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map((v,i)=>`<td${monoCols.includes(i)?' class="mono"':""}>${dg(hl(v,state.q))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const QSECS = [
  ["compare","Serotonin syndrome vs NMS vs anticholinergic toxicity vs hypertensive crisis","Read across a row to tell them apart. Reflexes, skin and bowel sounds are the fastest clues.",["Feature","Serotonin syndrome","Neuroleptic malignant syndrome","Anticholinergic toxicity","MAOI hypertensive crisis"],[],"wide"],
  ["eps","EPS types: onset and treatment","Onset times in the textbook are general; the † times are the ones most exam references use.",["Type","Onset","Looks like","Treatment and nursing care"],[],"wide"],
  ["levels","Therapeutic drug levels","Where your textbook and standard references differ, both are listed. Ranges vary by lab.",["Drug","Range","Note"],[1],"mid"],
  ["antidotes","Antidotes and rescue drugs","",["Problem","Antidote or treatment"],[],""],
  ["taper","Drugs that need a taper","Never stop these abruptly. What happens if you do:",["Drug","If stopped suddenly"],[],""],
  ["washout","Washout periods between antidepressants","The enzyme MAO takes about 2 weeks to grow back, which is where the 14-day rule comes from.",["Switch","Your textbook","†Standard references"],[],"mid"],
  ["tyramine","Tyramine foods (MAOI diet)","From the textbook's MAOI food table (Ch. 14). Rule of thumb: aged, cured, fermented, smoked or spoiled.",["Category","Avoid (high tyramine)","Safe"],[],"mid"],
  ["pregnancy","Pregnancy and breastfeeding risks","",["Drug","Risk"],[],""],
  ["labmap","Which lab goes with which drug","Start from the lab value in the question and find the drugs that change it or need it checked.",["Lab / test","Drugs to think of"],[],""],
  ["boxed","Boxed warnings at a glance","",["Drug or class","Boxed warning"],[],""],
  ["suffixes","Suffix recognition","",["Ending","Class","Examples"],[0],"mid"]
];
function renderQuick(){
  $("#count").textContent = state.q ? `Filtering tables for “${state.q}”` : "High-yield tables";
  $("#view-quick").innerHTML = `<nav class="qnav" aria-label="Jump to table">${QSECS.map(s=>`<button type="button" data-go="q-${s[0]}">${esc(s[1].split(":")[0].replace(" vs NMS vs anticholinergic toxicity vs hypertensive crisis"," vs NMS vs others"))}</button>`).join("")}</nav>`
  + QSECS.map(([k,title,lede,head,mono,cls])=>`<section class="qsec" id="q-${k}"><h2>${esc(title)}</h2>${lede?`<p class="lede">${dg(esc(lede))}</p>`:""}${tbl(head.map(h=>dg(esc(h))),QUICK[k],mono,cls)}</section>`).join("")
  + `<p class="foot">Built from Varcarolis' <i>Foundations of Psychiatric-Mental Health Nursing</i> (9th ed.) in your project files, at full NCLEX-RN scope. ${DG} marks anything taken from standard drug references (FDA labeling, Lehne, nursing drug handbooks) because it is not in your files. This is a study aid, not a clinical reference; use current facility protocols and drug references in practice.</p>`;
}

function render(){
  document.body.classList.toggle("quiz", state.quiz);
  $("#quiz").checked = state.quiz;
  const drugs = state.tab==="drugs";
  $("#view-drugs").hidden = !drugs; $("#view-quick").hidden = drugs;
  $("#tab-drugs").setAttribute("aria-selected", drugs); $("#tab-quick").setAttribute("aria-selected", !drugs);
  $("#chips").hidden = !drugs; $("#expand").hidden = !drugs; $("#collapse").hidden = !drugs;
  $("#q").placeholder = drugs ? "Search a drug, brand, class, suffix or finding (e.g. Zoloft, -apine, tremor)" : "Filter tables (e.g. lithium, clozapine, QT)";
  $("#clear").hidden = !state.q;
  drugs ? renderDrugs() : renderQuick();
}

function copyText(c){
  const L = [];
  L.push(c.name.toUpperCase()+"  ("+SYS[c.sys].name+")" + (c.sfx&&c.sfx!=="—" ? "  Suffix: "+c.sfx : ""));
  L.push("DRUGS:");
  c.drugs.forEach(d=>L.push("  • "+d[0]+(d[1]&&d[1]!=="—"?" ("+d[1]+")":"")+(d[2]?" – "+d[2]:"")));
  FIELDS.forEach(([k,label])=>{ if(!c[k]) return; L.push(label.toUpperCase()+":"); [].concat(c[k]).forEach(x=>L.push("  • "+x)); });
  L.push(srcText(c));
  return L.join("\n");
}

/* Events */
let t;
$("#q").addEventListener("input", e=>{ clearTimeout(t); t=setTimeout(()=>{ state.q=e.target.value; if(!state.q) state.open.clear(); render(); },120); });
$("#clear").addEventListener("click", ()=>{ state.q=""; $("#q").value=""; state.open.clear(); render(); $("#q").focus(); });
$("#chips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; state.sys=b.dataset.sys; $("#view-quick").addEventListener("click", e=>{ const b=e.target.closest("[data-go]"); if(!b) return; const el=document.getElementById(b.dataset.go); if(el) el.scrollIntoView({block:"start"}); });

renderChips(); render(); window.scrollTo({top:0}); });
$("#quiz").addEventListener("change", e=>{ state.quiz=e.target.checked; try{localStorage.setItem("pm_quiz",state.quiz?"1":"0")}catch(_){} document.querySelectorAll(".sec.revealed").forEach(s=>s.classList.remove("revealed")); render(); });
$("#expand").addEventListener("click", ()=>{ document.querySelectorAll("details.mono").forEach(d=>{d.open=true; state.open.add(d.dataset.id);}); });
$("#collapse").addEventListener("click", ()=>{ document.querySelectorAll("details.mono").forEach(d=>d.open=false); state.open.clear(); });
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click", ()=>{ state.tab = b.id==="tab-quick"?"quick":"drugs"; try{localStorage.setItem("pm_tab",state.tab)}catch(_){} render(); window.scrollTo({top:0}); }));
$("#view-drugs").addEventListener("toggle", e=>{ const d=e.target; if(d.matches&&d.matches("details.mono")){ d.open?state.open.add(d.dataset.id):state.open.delete(d.dataset.id); } }, true);
$("#view-drugs").addEventListener("click", e=>{
  const sec = e.target.closest(".sec");
  if(sec && document.body.classList.contains("quiz")){ sec.classList.toggle("revealed"); return; }
  const btn = e.target.closest(".copybtn"); if(!btn) return;
  const c = CLASSES.find(x=>x.id===btn.dataset.copy); const text = copyText(c);
  const done = ()=>{ btn.textContent="Copied"; btn.classList.add("ok"); setTimeout(()=>{btn.textContent="Copy as notes";btn.classList.remove("ok");},1600); };
  const fallback = ()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); done();}catch(_){ btn.textContent="Select text manually"; } ta.remove(); };
  try{ navigator.clipboard.writeText(text).then(done, fallback); }catch(_){ fallback(); }
});

renderChips(); render();
</script>
