<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endocrine quiz</title>
<style>
:root {
  --bg: #EDF2F4;
  --surface: #FFFFFF;
  --ink: #15242C;
  --muted: #4F626C;
  --line: #C6D3D9;
  --brand: #0D6A7E;
  --brand-deep: #084453;
  --brand-tint: #DCF0F4;
  --ok: #17693F;
  --ok-tint: #E0F2E8;
  --bad: #A3251B;
  --bad-tint: #FBE6E3;
  --warn: #8E5300;
  --warn-tint: #FFF0D2;
  --focus: #0B57D0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A20; --surface: #17262E; --ink: #E6EEF1; --muted: #A4B6BF; --line: #2C424D;
    --brand: #55C1D6; --brand-deep: #9BE0EE; --brand-tint: #183A45;
    --ok: #6FD39D; --ok-tint: #123523; --bad: #FF9A8F; --bad-tint: #4A1F1B;
    --warn: #F3B45B; --warn-tint: #3E2B0B; --focus: #8AB4F8;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A20; --surface: #17262E; --ink: #E6EEF1; --muted: #A4B6BF; --line: #2C424D;
  --brand: #55C1D6; --brand-deep: #9BE0EE; --brand-tint: #183A45;
  --ok: #6FD39D; --ok-tint: #123523; --bad: #FF9A8F; --bad-tint: #4A1F1B;
  --warn: #F3B45B; --warn-tint: #3E2B0B; --focus: #8AB4F8;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* start screen */
.start h1 { font: 700 2rem/1.15 Charter, "Iowan Old Style", Georgia, serif; margin: 24px 0 8px; letter-spacing: -0.01em; }
.start p { color: var(--muted); margin: 0 0 16px; max-width: 46ch; }
.facts { list-style: none; padding: 0; margin: 20px 0 28px; display: grid; gap: 10px; }
.facts li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.facts b { display: block; font-size: 1.05rem; }
.facts span { color: var(--muted); font-size: 0.93rem; }
.btn { border: 0; border-radius: 10px; padding: 14px 20px; min-height: 48px; font-weight: 650; }
.btn.primary { background: var(--brand); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #062028; } }
:root[data-theme="dark"] .btn.primary { color: #062028; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: 0.92rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* quiz header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 0 8px; }
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.qmeta { min-width: 0; }
.qmeta .n { font-weight: 700; font-size: 1.05rem; }
.qmeta .t { color: var(--muted); font-size: 0.9rem; }
.timer { display: flex; align-items: center; gap: 10px; }
.ring { position: relative; width: 56px; height: 56px; flex: none; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .track { stroke: var(--line); }
.ring .prog { stroke: var(--brand); transition: stroke 0.3s; }
.ring.warn .prog { stroke: var(--warn); }
.ring.bad .prog { stroke: var(--bad); }
.ring .txt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.ring.off .prog, .ring.off .track { opacity: 0.35; }
.tools { display: flex; gap: 8px; margin-top: 8px; }
.pal { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 10px; }
.pal button { position: relative; min-height: 34px; padding: 0; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 0.78rem; font-weight: 650; color: var(--muted); }
.pal button.done { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-deep); }
.pal button.cur { border-width: 3px; border-color: var(--ink); color: var(--ink); }
.pal button.flag::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 10px 10px 0; border-color: transparent var(--warn) transparent transparent; border-top-right-radius: 4px; }

/* question card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin-top: 12px; }
.instr { display: inline-block; font-size: 0.85rem; font-weight: 650; color: var(--brand-deep); background: var(--brand-tint); border-radius: 999px; padding: 3px 12px; margin-bottom: 12px; }
.stem { font: 1.1rem/1.6 Charter, "Iowan Old Style", Georgia, serif; margin: 0 0 16px; }
.stem p { margin: 0 0 10px; }
.stem ul { margin: 0 0 10px; padding-left: 20px; }
.opts { display: grid; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 12px; min-height: 52px; cursor: pointer; background: var(--surface); }
.opt input { margin-top: 4px; width: 20px; height: 20px; flex: none; accent-color: var(--brand); }
.opt .l { font-weight: 700; color: var(--muted); width: 1.2em; flex: none; }
.opt.sel { border-color: var(--brand); background: var(--brand-tint); }
.opt.dis { opacity: 0.5; cursor: not-allowed; }

.row { border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.row .rt { margin: 0 0 10px; font-weight: 600; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg label { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 10px; text-align: center; font-size: 0.92rem; cursor: pointer; min-height: 48px; display: grid; place-items: center; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label.sel { border-color: var(--brand); background: var(--brand-tint); font-weight: 650; }
.seg label:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }

.cloze { font: 1.1rem/2.4 Charter, "Iowan Old Style", Georgia, serif; }
.cloze select { font: 1rem system-ui, sans-serif; margin: 0 4px; padding: 8px 10px; min-height: 44px; border: 1.5px solid var(--brand); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 100%; }

.bt { display: grid; gap: 14px; }
.bt fieldset { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; margin: 0; min-width: 0; }
.bt legend { font-weight: 700; padding: 0 6px; }
.bt .hint { color: var(--muted); font-size: 0.88rem; margin: 0 0 8px; }
@media (min-width: 680px) {
  .bt { grid-template-columns: 1fr 1fr 1fr; align-items: start; }
  .bt .center { order: 2; } .bt .left { order: 1; } .bt .right { order: 3; }
}

.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.nav .grow { flex: 1; }
.flagbtn[aria-pressed="true"] { background: var(--warn-tint); border-color: var(--warn); color: var(--warn); }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(8, 20, 26, 0.72); display: grid; place-items: center; padding: 20px; z-index: 20; }
.overlay.opaque { background: var(--bg); }
.dialog { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 22px 20px; max-width: 420px; width: 100%; }
.dialog h2 { margin: 0 0 8px; font-size: 1.25rem; }
.dialog p { color: var(--muted); margin: 0 0 18px; }
.dialog .acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* results */
.score { text-align: left; padding: 8px 0 4px; }
.score .big { font: 700 3rem/1 Charter, "Iowan Old Style", Georgia, serif; }
.score .sub { color: var(--muted); }
.topics { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.topics li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.topics .meter { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.topics .meter i { display: block; height: 100%; background: var(--brand); }
.filters { display: flex; gap: 8px; margin: 18px 0 8px; }
.filters button[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-deep); font-weight: 650; }
details.rev { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
details.rev > summary { list-style: none; cursor: pointer; padding: 14px; display: flex; gap: 10px; align-items: center; min-height: 52px; }
details.rev > summary::-webkit-details-marker { display: none; }
.chip { font-size: 0.8rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.chip.ok { background: var(--ok-tint); color: var(--ok); }
.chip.part { background: var(--warn-tint); color: var(--warn); }
.chip.bad { background: var(--bad-tint); color: var(--bad); }
.chip.none { background: var(--line); color: var(--muted); }
.rev .body { padding: 0 14px 16px; }
.rev .stem { font-size: 1rem; }
.ritem { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.ritem.ok { border-color: var(--ok); background: var(--ok-tint); }
.ritem.bad { border-color: var(--bad); background: var(--bad-tint); }
.ritem .tag { font-size: 0.82rem; font-weight: 700; margin-bottom: 2px; }
.ritem.ok .tag { color: var(--ok); } .ritem.bad .tag { color: var(--bad); }
.ritem .why { color: var(--muted); font-size: 0.93rem; margin: 4px 0 0; }
.sum { border-left: 4px solid var(--brand); padding: 6px 0 6px 12px; margin: 14px 0 0; }
.src { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
h2.sec { font-size: 1.15rem; margin: 24px 0 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="modal" hidden></div>

<script>
"use strict";

/* ------------------------------------------------------------------
   Question bank. Every option is verifiable in Iggy, Chapters 53-55
   (and Chapter 13 for the sodium and potassium cross-references).
------------------------------------------------------------------- */
var TOTAL_SECONDS = 15 * 60;

var Q = [
  {
    topic: "Adrenal", type: "mc",
    instr: "Choose one answer",
    stem: "<p>A client had a bilateral adrenalectomy 2 years ago and has been unable to fill the replacement hormone prescriptions for the past 3 days. The client is now lethargic and confused.</p><ul><li>Blood pressure 82/46 mm Hg</li><li>Serum sodium 126 mEq/L</li><li>Serum potassium 6.4 mEq/L</li><li>Blood glucose 54 mg/dL</li></ul><p>Which prescription would the nurse question?</p>",
    options: [
      "Rapid infusion of dextrose 5% in normal saline",
      "Hydrocortisone given as an intravenous bolus",
      "Spironolactone given orally",
      "Intravenous calcium"
    ],
    correct: 2,
    why: [
      "Appropriate. Volume replacement treats the hypotension, and the dextrose treats the glucose of 54 mg/dL. Box 54.7 lists normal saline or dextrose 5% in normal saline.",
      "Appropriate. This replaces the cortisol the client has been missing. Box 54.7 lists an initial intravenous bolus of hydrocortisone.",
      "Question this order. Spironolactone is a potassium-sparing diuretic, and Box 54.7 says to avoid potassium-sparing diuretics during hyperkalemia management. It would push a potassium of 6.4 mEq/L higher.",
      "Appropriate. Intravenous calcium stabilizes cardiac cell membranes while the potassium is lowered (Box 54.7)."
    ],
    summary: "The cues are hypotension, hyponatremia, hyperkalemia, hypoglycemia, and confusion after missing lifelong replacement. That is acute adrenal insufficiency (adrenal crisis). After a bilateral adrenalectomy the client has no adrenal source of glucocorticoid or mineralocorticoid, so stopping replacement for even a day or two can trigger a crisis. Treat volume, cortisol, hyperkalemia, and glucose, and never give a drug that retains potassium.",
    src: "Chapter 54: Acute adrenal insufficiency, Box 54.7, and Care Coordination after bilateral adrenalectomy."
  },
  {
    topic: "Adrenal", type: "sata",
    instr: "Select all that apply",
    stem: "<p>A client has a round face, thin skin with reddish-purple striae on the abdomen, and truncal weight gain. The client has taken prednisone daily for 3 years for another illness.</p><p>Which findings does the nurse expect?</p>",
    options: [
      { t: "Serum sodium 148 mEq/L", c: true, why: "Expected. Excess cortisol causes sodium and water retention, so serum sodium rises." },
      { t: "Serum potassium 5.8 mEq/L", c: false, why: "Not expected. Hypercortisolism is associated with a low potassium. A high potassium is the adrenal hypofunction pattern (Table 54.2)." },
      { t: "Fasting blood glucose 168 mg/dL", c: true, why: "Expected. The liver releases glucose and insulin receptors become less sensitive." },
      { t: "Decreased lymphocyte count", c: true, why: "Expected. Excess cortisol lowers circulating lymphocytes and reduces immunity." },
      { t: "Serum calcium 11.4 mg/dL", c: false, why: "Not expected. Hypercortisolism lowers serum calcium and thins bone. A high calcium belongs to adrenal hypofunction (Table 54.2)." },
      { t: "Infected wound with mild redness and only a low-grade fever", c: true, why: "Expected. Cortisol suppresses inflammation, so a serious infection can appear with little redness, no pus, and only a low-grade fever." }
    ],
    summary: "These cues describe hypercortisolism from long-term glucocorticoid therapy. Think of cortisol as a hormone that keeps sodium and water, pushes out potassium and calcium, raises glucose, and mutes the immune system. Anything that matches that pattern is expected; the opposite pattern belongs to adrenal insufficiency.",
    src: "Chapter 54: Cushing syndrome, laboratory assessment, Box 54.9, and Table 54.2."
  },
  {
    topic: "Pituitary", type: "mc",
    instr: "Choose one answer",
    stem: "<p>Twenty-four hours after a transsphenoidal hypophysectomy, a client reports intense thirst.</p><ul><li>Urine output 350 mL/hr for the last 3 hours</li><li>Urine specific gravity 1.002</li><li>Serum sodium 150 mEq/L</li></ul><p>Which prescription does the nurse anticipate?</p>",
    options: [
      "Desmopressin",
      "Fluid restriction to 1000 mL in 24 hours",
      "Tolvaptan",
      "Hypertonic (3%) sodium chloride"
    ],
    correct: 0,
    why: [
      "Correct. Desmopressin is synthetic vasopressin and replaces the missing antidiuretic hormone. Monitor serum sodium, because it can cause hyponatremia, and weigh the client daily.",
      "This treats the syndrome of inappropriate antidiuretic hormone secretion. Restricting fluid in a client who is already losing large volumes of dilute urine would cause severe dehydration.",
      "Vasopressin receptor antagonists such as tolvaptan and conivaptan promote water excretion. They treat water retention, not water loss.",
      "Hypertonic saline is reserved for a very low serum sodium in the syndrome of inappropriate antidiuretic hormone secretion. This client has a high sodium."
    ],
    summary: "Massive dilute urine, a specific gravity below 1.005, thirst, and a rising sodium after pituitary surgery point to diabetes insipidus (arginine vasopressin deficiency), which is often transient after this surgery. The kidneys cannot reabsorb water, so the plasma becomes concentrated. Never deprive a client with suspected diabetes insipidus of fluids for more than 4 hours.",
    src: "Chapter 54: Hypophysectomy postoperative care and Arginine Vasopressin Deficiency/Diabetes Insipidus."
  },
  {
    topic: "Pituitary", type: "matrix",
    instr: "Choose one column for each row",
    stem: "<p>For each finding, decide which condition it best matches.</p>",
    cols: ["Diabetes insipidus", "Syndrome of inappropriate antidiuretic hormone secretion"],
    rows: [
      { t: "Serum sodium 126 mEq/L", c: 1, why: "Water retention dilutes the sodium (dilutional hyponatremia)." },
      { t: "Urine specific gravity 1.002", c: 0, why: "The kidneys cannot concentrate urine, so it is very dilute (below 1.005)." },
      { t: "Full, bounding pulse without dependent edema", c: 1, why: "Free water is retained, which increases blood volume. Dependent edema is not usually present." },
      { t: "Urine output of 6 L in 24 hours that does not fall when fluid intake is reduced", c: 0, why: "Output that stays high despite less intake is a hallmark of diabetes insipidus." },
      { t: "Serum sodium 152 mEq/L", c: 0, why: "Water loss concentrates the plasma and raises the sodium." },
      { t: "Conivaptan is prescribed", c: 1, why: "Vasopressin receptor antagonists promote water excretion without sodium loss. Diabetes insipidus is treated with desmopressin instead." }
    ],
    summary: "Diabetes insipidus is too little antidiuretic hormone effect, so water is lost and the sodium rises. The syndrome of inappropriate antidiuretic hormone secretion is too much, so water is kept and the sodium falls. Sort every finding by which direction the water is moving.",
    src: "Chapter 54: Diabetes insipidus and Syndrome of Inappropriate Antidiuretic Hormone."
  },
  {
    topic: "Adrenal", type: "cloze",
    instr: "Choose an option in each drop-down",
    parts: [
      "A client with primary adrenal insufficiency is expected to have a serum sodium level that is ",
      { o: ["low", "normal", "high"], c: 0, name: "sodium" },
      ", a serum potassium level that is ",
      { o: ["low", "normal", "high"], c: 2, name: "potassium" },
      ", and an adrenocorticotropic hormone level that is ",
      { o: ["normal", "elevated", "decreased"], c: 1, name: "adrenocorticotropic hormone" },
      ". In secondary adrenal insufficiency, skin pigmentation is ",
      { o: ["darker", "lighter", "unchanged"], c: 2, name: "pigmentation" },
      "."
    ],
    why: [
      "Low sodium. Aldosterone is lost, so sodium and water are wasted and hypotension follows.",
      "High potassium. Without aldosterone the kidneys hold potassium, which threatens the heart.",
      "Elevated. In primary disease the failing adrenal gland cannot make cortisol, so the pituitary keeps sending more adrenocorticotropic hormone. Melanocyte-stimulating hormone rises with it and darkens the skin.",
      "Unchanged. In secondary disease the pituitary or hypothalamus is the problem, so adrenocorticotropic hormone and melanocyte-stimulating hormone are low and pigmentation does not change. Mineralocorticoid function is also preserved."
    ],
    summary: "Ask where the failure is. If the adrenal gland fails, the pituitary shouts louder (high adrenocorticotropic hormone and darker skin). If the pituitary fails, there is no shouting at all.",
    src: "Chapter 54: Adrenal insufficiency, Recognize Cues and Diagnostic Assessment."
  },
  {
    topic: "Thyroid", type: "mc",
    instr: "Choose one answer",
    stem: "<p>A client is 10 hours after a subtotal thyroidectomy for hyperthyroidism. The client is restless and vomiting.</p><ul><li>Temperature 102.6°F (39.2°C)</li><li>Heart rate 148 beats/min</li><li>Blood pressure 150/58 mm Hg</li></ul><p>The provider prescribes several drugs. Which prescription would the nurse question?</p>",
    options: [
      "Propranolol given orally",
      "Iodide solution",
      "Methimazole given orally",
      "Aspirin for the fever"
    ],
    correct: 3,
    why: [
      "Appropriate. Propranolol controls the heart rate in thyroid storm (Box 55.6).",
      "Appropriate. Iodide solution is listed for thyroid storm in Box 55.6.",
      "Appropriate. Oral antithyroid drugs, methimazole or propylthiouracil, are listed first in Box 55.6.",
      "Question this order. Box 55.6 calls for nonsalicylate antipyretic drugs. Aspirin is a salicylate."
    ],
    summary: "Fever, severe tachycardia, restlessness, and vomiting after thyroid surgery signal thyroid storm, a life-threatening surge of thyroid hormone that dramatically raises the metabolic rate. Treatment protects the airway, blocks new hormone, controls the heart rate, cools the client, and replaces fluid. A temperature rise of even 1°F (1.8°C) should be reported immediately.",
    src: "Chapter 55: Thyroid storm, Box 55.6, and the Critical Rescue on temperature."
  },
  {
    topic: "Thyroid", type: "sata",
    instr: "Select all that apply",
    stem: "<p>The nurse is caring for a client 6 hours after a total thyroidectomy.</p><p>Which findings require immediate action by the nurse?</p>",
    options: [
      { t: "Stridor when the client breathes", c: true, why: "Requires immediate action. Stridor signals acute airway obstruction from swelling, hemorrhage, or spasm. Activate the Rapid Response Team and keep emergency tracheostomy equipment at hand." },
      { t: "Moderate serosanguineous drainage in the neck drain", c: false, why: "Expected. A moderate amount of serosanguineous drainage is normal. Frank bleeding or a saturated dressing would not be." },
      { t: "Tingling around the mouth and in the fingertips", c: true, why: "Requires action. This is early hypocalcemia from injured parathyroid glands, which can progress to tetany. Have intravenous calcium gluconate available and notify the provider." },
      { t: "Temperature 98.6°F (37°C)", c: false, why: "Expected. A normal temperature is reassuring. A rise of even 1°F (1.8°C) is what would raise concern for thyroid storm." },
      { t: "Drooling and inability to swallow", c: true, why: "Requires immediate action. Inability to swallow and drooling are listed as signs of obstruction after thyroid surgery." },
      { t: "Oxygen saturation falling from 97% to 91%", c: true, why: "Requires immediate action. A falling oxygen saturation with airway swelling or spasm is a listed sign of poor gas exchange." }
    ],
    summary: "After thyroid surgery keep two things in mind: the airway (hemorrhage, swelling, laryngeal spasm, nerve injury) and the calcium (parathyroid injury). Stridor, dyspnea, falling oxygen saturation, inability to swallow, and drooling all trigger the Rapid Response Team. Perioral or fingertip tingling means calcium.",
    src: "Chapter 55: Thyroidectomy postoperative care and Critical Rescue."
  },
  {
    topic: "Thyroid", type: "mc",
    instr: "Choose one answer",
    stem: "<p>A client newly diagnosed with hypothyroidism has been prescribed levothyroxine. Which statement by the client indicates the need for further teaching?</p>",
    options: [
      "\u201CI will take it with water on an empty stomach before breakfast.\u201D",
      "\u201CI will take it with my calcium supplement so I remember both.\u201D",
      "\u201CIf I start sleeping more and become constipated, my dose may need to be checked.\u201D",
      "\u201CI will report chest pain right away.\u201D"
    ],
    correct: 1,
    why: [
      "Correct teaching. Levothyroxine should be taken with water on an empty stomach, 30 to 60 minutes before the morning meal.",
      "Needs further teaching. Iron, calcium supplements, and antacids reduce absorption and must be taken at least 4 hours apart from levothyroxine.",
      "Correct teaching. More sleep and constipation suggest hypothyroidism is not controlled, so the level may need to be checked. Trouble sleeping and more bowel movements suggest the dose may be too high.",
      "Correct teaching. Too high a dose or too rapid an increase can cause dysrhythmias, heart failure, and myocardial infarction, so chest pain must be reported."
    ],
    summary: "Absorption is the teaching priority for levothyroxine. Empty stomach, water only, and keep calcium, iron, and antacids at least 4 hours away.",
    src: "Chapter 55: Hypothyroidism drug therapy and Self-Management Education."
  },
  {
    topic: "Thyroid", type: "bowtie",
    instr: "Complete all three parts of the bow-tie",
    stem: "<p>A 70-year-old client stopped taking levothyroxine 3 weeks ago. The client now responds only to painful stimuli.</p><ul><li>Temperature 94.1°F (34.5°C)</li><li>Heart rate 46 beats/min</li><li>Blood pressure 86/50 mm Hg</li><li>Respiratory rate 8 breaths/min and shallow</li><li>Blood glucose 52 mg/dL</li><li>Serum sodium 128 mEq/L</li></ul>",
    condTitle: "Condition the client is most likely experiencing (select 1)",
    conditions: [
      { t: "Myxedema coma", c: true, why: "Correct. Lack of thyroid replacement plus hypothermia, bradycardia, hypotension, hypoventilation, hypoglycemia, hyponatremia, and a greatly reduced level of consciousness is the pattern of myxedema coma." },
      { t: "Thyroid storm", c: false, why: "Thyroid storm is the opposite picture: high fever, tachycardia, and agitation." },

function freshState() {

    lastTick: 0, announced: {}, finished: false, timeUp: false,
    answers: Q.map(function (q) {

        case "sata": return [];
        case "matrix": return q.rows.map(function () { return null; });
        case "cloze": return q.parts.filter(function (p) { return typeof p !== "string"; }).map(function () { return null; });
        case "bowtie": return { cond: null, act: [], par: [] };

}

/* ---------- scoring ---------- */
function isAnswered(q, a) {
  switch (q.type) {
    case "mc": return a !== null;
    case "sata": return a.length > 0;
    case "matrix": return a.some(function (v) { return v !== null; });
    case "cloze": return a.some(function (v) { return v !== null; });
    case "bowtie": return a.cond !== null || a.act.length > 0 || a.par.length > 0;
  }
}
function groupPoints(list, picked) {
  var good = 0, bad = 0;
  picked.forEach(function (i) { if (list[i].c) good++; else bad++; });
  return Math.max(0, good - bad);
}
function score(q, a) {
  switch (q.type) {
    case "mc": return a === q.correct ? 1 : 0;
    case "sata":
      var need = q.options.filter(function (o) { return o.c; }).length;
      return Math.max(0, groupPoints(q.options, a)) / need;
    case "matrix":
      return a.reduce(function (s, v, i) { return s + (v === q.rows[i].c ? 1 : 0); }, 0) / q.rows.length;
    case "cloze":
      var sel = q.parts.filter(function (p) { return typeof p !== "string"; });
      return a.reduce(function (s, v, i) { return s + (v === sel[i].c ? 1 : 0); }, 0) / sel.length;
    case "bowtie":
      var c = a.cond !== null && q.conditions[a.cond].c ? 1 : 0;
      return (c + groupPoints(q.actions, a.act) + groupPoints(q.params, a.par)) / 5;
  }
}
function statusOf(q, a) {
  if (!isAnswered(q, a)) return "none";
  var s = score(q, a);
  if (s >= 0.999) return "ok";
  if (s > 0) return "part";
  return "bad";
}
var STATUS_LABEL = { ok: "Correct", part: "Partial credit", bad: "Incorrect", none: "Not answered" };

/* ---------- timer ---------- */
function fmt(s) {
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function startTimer() {
  state.lastTick = Date.now();
  clearInterval(tick);
  tick = setInterval(onTick, 250);
}
function onTick() {
  var now = Date.now();
  if (!state.paused && !state.finished) {
    state.remaining -= (now - state.lastTick) / 1000;
    if (state.remaining <= 0) { state.remaining = 0; state.timeUp = true; finish(true); return; }
    if (state.remaining <= 300 && !state.announced.five) { state.announced.five = true; live.textContent = "Five minutes remaining."; }
    if (state.remaining <= 60 && !state.announced.one) { state.announced.one = true; live.textContent = "One minute remaining."; }
  }
  state.lastTick = now;
  paintTimer();
}
function paintTimer() {
  var ring = document.getElementById("ring");
  if (!ring) return;
  var C = 2 * Math.PI * 22;
  var prog = ring.querySelector(".prog");
  prog.setAttribute("stroke-dashoffset", String(C * (1 - state.remaining / TOTAL_SECONDS)));
  ring.classList.toggle("warn", state.remaining <= 300 && state.remaining > 60);
  ring.classList.toggle("bad", state.remaining <= 60);
  ring.classList.toggle("off", state.hideTimer);
  ring.querySelector(".txt").textContent = state.hideTimer ? "--:--" : fmt(state.remaining);
}

function renderQuiz() {

function refreshPalette() {

    if (!idxs.length) return;
    var s = idxs.reduce(function (a, i) { return a + scores[i]; }, 0);
    var p = Math.round((s / idxs.length) * 100);
    tl.appendChild(el("li", null,
      el("span", { text: t + " (" + idxs.length + (idxs.length === 1 ? " question)" : " questions)") }),
      el("b", { text: p + "%" }),
      el("div", { class: "meter" }, el("i", { style: "width:" + p + "%" }))
    ));
  });

  var listBox = el("div", { id: "reviews" });
  var showAll = true;
  function drawList() {
    listBox.innerHTML = "";
    Q.forEach(function (q, i) {
      var st = statusOf(q, state.answers[i]);
      if (!showAll && st === "ok") return;
      listBox.appendChild(reviewItem(q, i, st, !showAll));
    });
    if (!listBox.children.length) listBox.appendChild(el("p", { text: "Every question was answered correctly." }));
  }
  var bAll = el("button", { class: "btn ghost small", type: "button", "aria-pressed": "true", text: "All questions" });
  var bMiss = el("button", { class: "btn ghost small", type: "button", "aria-pressed": "false", text: "Missed or partial only" });
  bAll.addEventListener("click", function () { showAll = true; bAll.setAttribute("aria-pressed", "true"); bMiss.setAttribute("aria-pressed", "false"); drawList(); });
  bMiss.addEventListener("click", function () { showAll = false; bMiss.setAttribute("aria-pressed", "true"); bAll.setAttribute("aria-pressed", "false"); drawList(); });
  drawList();

  app.appendChild(el("main", null,
    el("h1", { style: "margin:16px 0 0;font:700 1.4rem Charter,Georgia,serif", text: "Endocrine quiz results" }),
    head,
    el("h2", { class: "sec", text: "By topic" }), tl,
    el("h2", { class: "sec", text: "Review with rationales" }),
    el("div", { class: "filters" }, bAll, bMiss),
    listBox,
    el("div", { style: "margin-top:20px" }, el("button", { class: "btn primary", type: "button", id: "retake", text: "Retake the quiz", onclick: showStart }))
  ));
}

function tagRow(cls, tag, text, why) {
  return el("div", { class: "ritem " + cls },
    el("div", { class: "tag", text: tag }),
    el("div", { text: text }),
    why ? el("p", { class: "why", text: why }) : null
  );
}

function reviewItem(q, i, st, open) {
  var a = state.answers[i];
  var d = el("details", { class: "rev" });
  if (open) d.setAttribute("open", "");
  d.appendChild(el("summary", null,
    el("b", { text: "Question " + (i + 1) }),
    el("span", { class: "chip " + st, text: (st === "ok" ? "\u2713 " : st === "bad" ? "\u2717 " : "") + STATUS_LABEL[st] }),
    el("span", { style: "color:var(--muted);font-size:.9rem", text: q.topic })
  ));
  var body = el("div", { class: "body" });
  body.appendChild(el("div", { class: "stem", html: q.stem || "" }));

  if (q.type === "mc") {
    q.options.forEach(function (t, k) {
      var isC = k === q.correct, isSel = a === k;
      var tag = isC ? (isSel ? "\u2713 Your answer, correct" : "\u2713 Correct answer") : (isSel ? "\u2717 Your answer" : "");
      body.appendChild(tagRow(isC ? "ok" : (isSel ? "bad" : ""), tag, "ABCD"[k] + ". " + t, q.why[k]));
    });
  }
  if (q.type === "sata") {
    q.options.forEach(function (o, k) {
      var sel = a.indexOf(k) > -1, tag, cls;
      if (o.c && sel) { tag = "\u2713 Selected, correct"; cls = "ok"; }
      else if (o.c && !sel) { tag = "\u2717 Missed. This should be selected"; cls = "bad"; }
      else if (!o.c && sel) { tag = "\u2717 Selected, incorrect"; cls = "bad"; }
      else { tag = "\u2713 Correctly left blank"; cls = ""; }
      body.appendChild(tagRow(cls, tag, "ABCDEF"[k] + ". " + o.t, o.why));
    });
  }
  if (q.type === "matrix") {
    q.rows.forEach(function (r, k) {
      var mine = a[k];
      var ok = mine === r.c;
      var tag = mine === null ? "\u2717 Not answered. Correct: " + q.cols[r.c] : (ok ? "\u2713 " + q.cols[mine] : "\u2717 You chose " + q.cols[mine] + ". Correct: " + q.cols[r.c]);
      body.appendChild(tagRow(ok ? "ok" : "bad", tag, r.t, r.why));
    });
  }
  if (q.type === "cloze") {
    var sel = q.parts.filter(function (p) { return typeof p !== "string"; });
    var sent = q.parts.map(function (p) { return typeof p === "string" ? p : "[" + p.o[p.c] + "]"; }).join("");
    body.appendChild(el("p", { class: "src", text: "Completed sentence: " + sent }));
    sel.forEach(function (p, k) {
      var mine = a[k], ok = mine === p.c;
      var tag = mine === null ? "\u2717 Not answered. Correct: " + p.o[p.c] : (ok ? "\u2713 " + p.o[mine] : "\u2717 You chose " + p.o[mine] + ". Correct: " + p.o[p.c]);
      body.appendChild(tagRow(ok ? "ok" : "bad", tag, p.name.charAt(0).toUpperCase() + p.name.slice(1), q.why[k]));
    });
  }
  if (q.type === "bowtie") {
    var groups = [
      { title: "Condition", list: q.conditions, picked: a.cond === null ? [] : [a.cond] },
      { title: "Actions to take", list: q.actions, picked: a.act },
      { title: "Parameters to monitor", list: q.params, picked: a.par }
    ];
    groups.forEach(function (g) {
      body.appendChild(el("h3", { style: "margin:14px 0 6px;font-size:1rem", text: g.title }));
      g.list.forEach(function (o) {
        var idx = g.list.indexOf(o), sel = g.picked.indexOf(idx) > -1, tag, cls;
        if (o.c && sel) { tag = "\u2713 Selected, correct"; cls = "ok"; }
        else if (o.c && !sel) { tag = "\u2717 Missed"; cls = "bad"; }
        else if (!o.c && sel) { tag = "\u2717 Selected, incorrect"; cls = "bad"; }
        else { tag = "Not selected, correctly"; cls = ""; }
        body.appendChild(tagRow(cls, tag, o.t, o.why));
      });
    });
  }
  body.appendChild(el("p", { class: "sum", text: q.summary }));
  body.appendChild(el("p", { class: "src", text: "Source: Iggy, " + q.src }));
  d.appendChild(body);
  return d;
}

showStart();
</script>
</body>
</html>
