{ch:56,cs:"56b",hard:1,need:N.pa,skill:S.gs,type:MC,src:"Iggy Ch. 56, Hyperglycemic-Hyperosmolar State: Fluid Therapy; Continuing Therapy",chart:C56B,
stem:"Which prescription does the nurse expect to carry out first?",
opts:[{t:"0.9% saline at 1 L/hr",c:1,r:"The first priority is to increase blood volume. In shock or severe hypotension normal saline is used, at 1 L/hr until central venous pressure rises or blood pressure and urine output are adequate."},
{t:"0.45% saline at 1 L/hr",r:"Half-normal saline is used when the client is not in shock or severely hypotensive."},
{t:"IV regular insulin bolus followed by a continuous infusion",r:"IV insulin is given after adequate fluids have been replaced."},
{t:"5% dextrose in 0.45% saline at 150 mL/hr",r:"Dextrose is not given with a glucose of 1,040 mg/dL."}],
why:"Two saline options and insulin are all part of treatment. The blood pressure of 88/50 decides which fluid, and the textbook's sequence decides that fluid precedes insulin.",
plain:"His blood pressure is too low, so he needs the saltier fluid first, and he needs fluid before insulin."},

{ch:56,cs:"56b",need:N.rr,skill:S.eo,type:MC,src:"Iggy Ch. 56, Hyperglycemic-Hyperosmolar State: Continuing Therapy",chart:C56B,
stem:"After fluids, an IV insulin infusion is started. Which parameter is the priority to monitor now?",
opts:[{t:"Serum potassium and the cardiac rhythm",c:1,r:"Potassium drops quickly with insulin therapy. Electrolytes are checked every 1 to 2 hours until stable, with continuous cardiac monitoring."},
{t:"Serum ketones",r:"Negative in this condition."},
{t:"Arterial pH",r:"Normal in this condition."},
{t:"Temperature",r:"Monitored for the infection, but not the immediate risk from insulin."}],
why:"His potassium is 4.4 mEq/L before insulin. He has lost potassium for days through diuresis, so the level will fall once insulin moves it into cells.",
plain:"Insulin pushes potassium into the cells along with sugar, and he did not have much to spare."},

/* ---- hypoglycemia ---- */
{ch:56,cs:"56c",need:N.rr,skill:S.rc,type:SATA,src:"Iggy Ch. 56, Interventions for Preventing Hypoglycemia; Older Adult Health; Postoperative Monitoring",chart:C56C,
stem:"Which factors increased this client's risk for a low blood glucose, or for missing its warning signs? Select all that apply.",
opts:[{t:"Glipizide given with no meal eaten",c:1,r:"Sulfonylureas put clients at risk. A meal delayed or missed after the dose causes hypoglycemia."},
{t:"Progressive chronic kidney disease",c:1,r:"Reduced kidney function slows elimination of sulfonylureas and insulin."},
{t:"Alcohol last evening without food",c:1,r:"Alcohol inhibits liver glucose production and can cause hypoglycemia hours later."},
{t:"Propranolol",c:1,r:"Beta blockers mask the symptoms of hypoglycemia."},
{t:"Lisinopril",r:"Not a listed risk."},
{t:"A1C of 7.4%",r:"Reflects average glucose over months. It does not explain today's event."}],
why:"He has no sweating or tremor. Older adults often have hypoglycemic unawareness, and the beta blocker hides the early warning signs. What remains are the brain symptoms: unsteadiness, light-headedness, and poor concentration.",
plain:"The pill kept working, lunch never came, his kidneys could not clear the drug, and another drug hid the warning signs."},

{ch:56,cs:"56c",hard:1,need:N.bcc,skill:S.ta,type:MC,src:"Iggy Ch. 56, Hypoglycemia: Nutrition Therapy",chart:C56C,
stem:"Which does the nurse give this client?",
opts:[{t:"A half-cup (120 mL) of apple juice",c:1,r:"A liquid, fast-acting carbohydrate of 15 g for a glucose below 70 mg/dL in a client who can swallow."},
{t:"A half-cup (120 mL) of orange juice",r:"The right amount of carbohydrate, but high-potassium options such as orange juice are avoided. His potassium is 5.2 mEq/L and he has kidney disease."},
{t:"Crackers with nut butter",r:"A complex carbohydrate. It is given after the recheck is above the hypoglycemic range."},
{t:"A chocolate bar",r:"Fat slows absorption."}],
why:"Two juices deliver the same 15 g. The client's kidney disease and potassium level decide between them. Glucose is rechecked in 15 minutes.",
plain:"He needs fast sugar, but not the kind that comes loaded with potassium."},

{ch:56,cs:"56c",need:N.hp,skill:S.eo,type:MX,src:"Iggy Ch. 56, Hypoglycemia: Prevention Strategies; Blood Glucose Monitoring; Older Adult Health",chart:C56C,
stem:"Before discharge, the client and his wife make these statements. For each, choose whether teaching was effective.",
cols:["Teaching effective","Needs further teaching"],
rows:[{t:"“We will check his glucose when he seems unsteady or cannot concentrate.”",a:0},
{t:"“If I have a drink, it will be with a meal or right after one.”",a:0},
{t:"“I will test on my forearm instead of my finger because it hurts less.”",a:1},
{t:"“When the shaky feeling passes, I know my sugar is normal and I do not need to recheck.”",a:1},
{t:"“If his appetite is poor, he will have a small snack at bedtime.”",a:0},
{t:"“He will carry glucagon and wear a medical alert bracelet.”",a:0}],
why:"Clients with hypoglycemic unawareness do not test at alternate sites, because those sites lag when glucose is changing quickly. Symptoms can persist after glucose is normal or disappear before it is, so the recheck at 15 minutes is always done.",
plain:"His body no longer warns him, so the meter has to. Only the fingertip is fast enough."},

/* ---- peripheral neuropathy and foot ulcer ---- */
{ch:56,cs:"56d",need:N.hp,skill:S.rc,type:HL,src:"Iggy Ch. 56, Box 56.9; Preventing Injury From Peripheral Neuropathy",chart:C56D,
stem:"Select the self-care practices that need to be corrected.",
segs:[{t:"Soaks his feet in hot water every night",c:1},{t:"uses an over-the-counter corn remover",c:1},{t:"walks barefoot at home",c:1},{t:"wears open-toed sandals",c:1},{t:"applies lotion between his toes",c:1},
{t:"trims nails straight across",c:0},{t:"wears clean white cotton socks daily",c:0},{t:"checks inside his shoes before putting them on",c:0}],
why:"Foot injuries come from walking barefoot, ill-fitting shoes, heat, and chemical burns from corn treatments. Feet are washed in lukewarm water and dried well. Moisturizer is applied, but not between the toes. White socks make blood or drainage easy to see.",
plain:"He cannot feel heat, sharp objects, or burns. Each of these habits is a way to get hurt without knowing."},

{ch:56,cs:"56d",need:N.pa,skill:S.ac,type:CZ,src:"Iggy Ch. 56, Preventing Injury From Peripheral Neuropathy; Table 56.7",chart:C56D,
stem:"Complete the statements.",
parts:["The main risk factor for developing a diabetic foot ulcer is ",{o:["neuropathy","poor perfusion","dry skin"],a:0},
", and the main cause of poor healing is ",{o:["inadequate perfusion","loss of sensation","foot deformity"],a:0},
". With this history, his feet should be evaluated every ",{o:["1 to 3 months","3 to 6 months","12 months"],a:0},"."],
why:"He has lost protective sensation, has evidence of peripheral vascular disease, and now has an ulcer. A history of ulcer places him in the highest risk category, which calls for evaluation every 1 to 3 months, referral to a specialist, and prescription footwear.",
plain:"Numb feet get injured. Poor blood flow keeps the injury from healing."},

{ch:56,cs:"56d",hard:1,need:N.bcc,skill:S.gs,type:MC,src:"Iggy Ch. 56, Wound care (diabetic ulcers); Exercise adjustments",chart:C56D,
stem:"Which instruction is essential for this ulcer to heal?",
opts:[{t:"“Keep all pressure off the ulcer. Do not wear a shoe on that foot, and use the device you are given.”",c:1,r:"Eliminating pressure is essential. Standards of care are a moist wound environment, débridement, and offloading."},
{t:"“Leave the ulcer open to the air so it dries out.”",r:"A moist wound environment is the standard."},
{t:"“Walk a little more each day to bring blood to the foot.”",r:"Walking on the ulcer causes pressure necrosis. Non–weight-bearing activity is used with a foot injury."},
{t:"“Let your pain tell you when you are putting too much weight on it.”",r:"He cannot feel the ulcer. Clients with poor sensation keep walking on it."}],
why:"Two distractors sound like ordinary wound or circulation advice. For a plantar ulcer in a numb foot they do harm. He should also know that ulcers recur unless weight is permanently redistributed.",
plain:"Every step presses on the sore. It cannot close until the pressure is gone."},

/* ---- standalone ---- */
{ch:56,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 56, Insulin therapy: fasting hyperglycemia (dawn and Somogyi phenomena)",
stem:"A client taking intermediate-acting insulin with the evening meal has fasting glucose values near 240 mg/dL. Glucose checked at 0300 is 52 mg/dL. Which change does the nurse anticipate?",
opts:[{t:"A bedtime snack and a review of the evening insulin dose and exercise",c:1,r:"Morning hyperglycemia after nighttime hypoglycemia is the Somogyi phenomenon. It is managed by ensuring adequate intake at bedtime and evaluating the insulin dose and exercise."},
{t:"Moving the evening intermediate-acting insulin to 2200",r:"That treats the dawn phenomenon, in which glucose is not low during the night."},
{t:"Increasing the evening insulin dose",r:"More insulin would deepen the nighttime low."},
{t:"Adding rapid-acting insulin at bedtime",r:"Would also worsen the nighttime low."}],
why:"Two conditions cause the same fasting number. The 0300 value tells them apart, and the treatments point in opposite directions.",
plain:"His sugar crashes at night and the body overcorrects by morning. He needs less insulin or more food at bedtime, not more insulin."},

{ch:56,hard:1,need:N.ph,skill:S.ta,type:MC,src:"Iggy Ch. 56, Insulin therapy: timing of injection",
stem:"A client's glucose before breakfast is 74 mg/dL. Insulin lispro is due with the meal. The usual premeal target is 80 to 130 mg/dL. Which action does the nurse take?",
opts:[{t:"Have the client eat, and give the lispro after the meal.",c:1,r:"When glucose is below the target range, rapid-acting insulin is delayed until after the meal is eaten."},
{t:"Give the lispro 10 minutes before the meal.",r:"That timing applies when glucose is within the target range."},
{t:"Give the lispro 20 to 30 minutes before the meal.",r:"That lag time is for regular insulin when glucose is in range."},
{t:"Give the lispro now and hold the tray for 30 minutes.",r:"A longer lag time is used when glucose is above target. Here it would cause hypoglycemia."}],
why:"The lag time between injection and eating changes with the premeal glucose: longer when high, shorter when low. All four timings are correct in some situation.",
plain:"When the sugar is already on the low side, food goes in first and insulin follows."},

{ch:56,need:N.ph,skill:S.gs,type:SATA,src:"Iggy Ch. 56, Insulin therapy: absorption; Box 56.5",
stem:"Which instructions about insulin injection does the nurse give? Select all that apply.",
opts:[{t:"Rotate sites within one body area instead of moving from area to area.",c:1,r:"Prevents day-to-day variation in absorption."},
{t:"In the abdomen, stay outside a 2-inch radius around the navel.",c:1,r:"The abdomen is preferred and has the fastest absorption, except near the navel."},
{t:"Do not rub the site after the injection.",c:1,r:"Massage increases blood flow and speeds absorption."},
{t:"Do not use a site again until at least a month has passed.",c:1,r:"A site not used in the past month is selected so each site heals completely."},
{t:"Pull back on the plunger to check for blood before injecting.",r:"Aspiration for blood is not needed."},
{t:"Inject into a scarred area because it hurts less.",r:"Scarred areas are less sensitive but usually slow absorption."}],
why:"Anything that changes blood flow at the site changes how fast the insulin acts: heat, massage, and exercising the injected area all speed it up.",
plain:"Same neighborhood, different house each time, and leave the spot alone afterward."},

{ch:56,need:N.saf,skill:S.ta,type:MC,src:"Iggy Ch. 56, Insulin therapy: mixing (Drug Alert); storage and dose preparation",
stem:"The nurse watches a client prepare the evening insulin at home. Which action requires correction?",
opts:[{t:"Drawing insulin glargine and insulin lispro into the same syringe",c:1,r:"No other insulin is mixed with glargine, detemir, or premixed formulations."},
{t:"Gently rolling the vial of intermediate-acting insulin between the palms",r:"Correct. It should look uniformly cloudy afterward."},
{t:"Keeping the unopened vials in the refrigerator",r:"Correct. Insulin not in use is refrigerated."},
{t:"Throwing away the vial in use after 28 days",r:"Correct."}],
why:"One dose given in a mixed syringe changes how both insulins act. The other three actions are taught exactly as shown.",
plain:"The long-acting insulin always gets its own syringe."},

{ch:56,hard:1,need:N.saf,skill:S.eo,type:MC,src:"Iggy Ch. 56, Box 56.5 (pen device)",
stem:"A client demonstrates use of an insulin pen. Which step shows a need for further teaching?",
opts:[{t:"Pulls the needle out as soon as the dosing knob is fully pressed",c:1,r:"The pen is held in place for 6 to 10 seconds before it is withdrawn, or part of the dose is lost."},
{t:"Presses the button with the needle pointing up until a drop of insulin appears, then dials the dose",r:"Correct. This is the safety shot."},
{t:"Wipes the tip of the pen with alcohol before attaching the needle",r:"Correct."},
{t:"Unscrews the needle after the injection and puts it in a hard plastic container",r:"Correct."}],
why:"All four steps look competent. The error is one of timing, and it results in a partial dose every time.",
plain:"The insulin needs a few seconds to finish flowing. Count to ten before pulling out."},

{ch:56,need:N.hp,skill:S.gs,type:MX,src:"Iggy Ch. 56, Physical activity; Action Alert; Box 56.7",
stem:"A client with type 1 diabetes mellitus plans a vigorous workout. For each situation, choose the nurse's advice.",
cols:["Exercise as planned","Eat carbohydrate first","Do not exercise now"],
rows:[{t:"Glucose 186 mg/dL, no urine ketones, ate 30 minutes ago",a:0},
{t:"Glucose 88 mg/dL",a:1},
{t:"Glucose 274 mg/dL with urine ketones present",a:2},
{t:"Glucose 150 mg/dL, no ketones, last meal 2 hours ago",a:1},
{t:"Glucose 160 mg/dL, no ketones, injected mealtime insulin 20 minutes ago",a:2}],
why:"Vigorous exercise is done only when glucose is 100 to 250 mg/dL with no urine ketones. Ketones mean insulin is inadequate and exercise would raise glucose. A carbohydrate snack is taken if more than 1 hour has passed since the last meal or the exercise is high intensity. Exercise is avoided within 1 hour of an insulin injection.",
plain:"Too low: eat first. Ketones: stop. Just injected: wait."},

{ch:56,hard:1,need:N.rr,skill:S.ta,type:MC,src:"Iggy Ch. 56, Continuous blood glucose monitoring systems",
stem:"A client's continuous glucose monitor alarms with a reading of 54 mg/dL and a downward arrow. The client feels fine. Which action does the nurse take first?",
opts:[{t:"Check a capillary glucose with a fingerstick.",c:1,r:"Capillary glucose is checked on all extreme values before any corrective treatment. Sensor readings can lag by as much as 30 minutes when glucose is changing rapidly."},
{t:"Give 30 g of rapidly absorbed carbohydrate.",r:"Treatment follows confirmation."},
{t:"Silence the alarm because the client has no symptoms.",r:"Absence of symptoms does not rule out hypoglycemia."},
{t:"Recalibrate the sensor.",r:"Calibration is routine maintenance. It does not answer what the glucose is now."}],
why:"The sensor measures interstitial fluid, not blood. The fingerstick takes seconds and tells the nurse whether treatment is needed and how much.",
plain:"The sensor is reading yesterday's news by a few minutes. Check the blood before acting."},

{ch:56,hard:1,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 56, Preventing Surgical Complications: Action Alert",
stem:"On the second day after surgery, a client's glucose values rise from the 150s to 240 mg/dL. Intake, insulin doses, and activity have not changed. Temperature is 98.8°F (37.1°C). Which action does the nurse take first?",
opts:[{t:"Assess the incision, lungs, and urine for signs of infection.",c:1,r:"An unexpected rise in glucose in a client who has been reasonably controlled calls for a check for infection. Hyperglycemia often occurs before a fever."},
{t:"Request a higher correction dose of insulin.",r:"Treats the number and misses the cause."},
{t:"Recheck the glucose in 4 hours to confirm a trend.",r:"The trend is already clear."},
{t:"Document the value as an expected stress response to surgery.",r:"The stress response was present on day 1. A new rise needs a reason."}],
why:"The normal temperature is the trap. In a client with diabetes mellitus, glucose is often the first sign of infection.",
plain:"A sudden jump in sugar is often the first clue that an infection has started, even before a fever."},

{ch:56,hard:1,need:N.pa,skill:S.ta,type:MC,src:"Iggy Ch. 56, Diabetic Autonomic Neuropathy; Cardiovascular monitoring",
stem:"A 68-year-old client with long-standing diabetes mellitus reports sudden nausea, sweating, and unusual fatigue. There is no chest pain. Capillary glucose is 142 mg/dL. Which action is the priority?",
opts:[{t:"Obtain a 12-lead ECG and assess the cardiac status.",c:1,r:"Cardiovascular autonomic neuropathy contributes to painless myocardial infarction. ECG changes may indicate a silent infarction."},
{t:"Give 15 g of carbohydrate and recheck the glucose in 15 minutes.",r:"The glucose is 142 mg/dL. This is not hypoglycemia."},
{t:"Give the prescribed antiemetic and reassess in 30 minutes.",r:"Treats a symptom and delays recognition of the cause."},
{t:"Check blood pressure lying and standing.",r:"Orthostatic hypotension is common with autonomic neuropathy, but it does not explain sudden nausea and sweating at rest."}],
why:"Sweating in a client with diabetes mellitus suggests hypoglycemia first, which is why the stem gives the glucose. With that ruled out, the next most dangerous cause must be excluded.",
plain:"Damaged nerves can hide the chest pain of a heart attack. Sweating and nausea may be the only signs."},

{ch:56,hard:1,need:N.hp,skill:S.gs,type:MC,src:"Iggy Ch. 56, Reducing the Risk for Kidney Disease",
stem:"A client with type 2 diabetes mellitus has a blood pressure of 118/72 mm Hg and no albumin in the urine. The client asks, “Should I be on one of those blood pressure pills that protect the kidneys?” Which response is accurate?",
opts:[{t:"“Those drugs are not recommended while your blood pressure and urine albumin are normal. A yearly urine albumin test will show if that changes.”",c:1,r:"Neither drug class is recommended for clients with normal blood pressure and normal albumin excretion. Urine albumin is tested yearly from the time of diagnosis in type 2 disease."},
{t:"“Yes. Everyone with diabetes should take one to prevent albumin from appearing in the urine.”",r:"These drugs slow progression once albuminuria is present. They do not appear to prevent it."},
{t:"“They are used only after dialysis has started.”",r:"They are recommended for persistent albuminuria or advanced nephropathy, well before dialysis."},
{t:"“They protect the kidneys only in type 1 diabetes.”",r:"The recommendation applies to both types."}],
why:"Once albuminuria develops, management focuses on blood pressure and glucose control, avoiding nephrotoxic agents, and an angiotensin-converting enzyme inhibitor or angiotensin receptor blocker, with potassium monitored for hyperkalemia.",
plain:"The pill helps a kidney that has started to leak protein. His has not, so for now he needs the yearly check."}
);

["Vital Signs","Blood pressure 128/78 mm Hg · Heart rate 84 · Respirations 24 · SpO₂ 92% on room air · Temperature 98.9°F (37.2°C)"],
["Laboratory","Creatinine 2.8 mg/dL (0.9 on admission) · BUN 46 mg/dL · Potassium 5.2 mEq/L · Gentamicin trough above the target range · Urinalysis: tubular cells and granular casts"],
["Orders","Gentamicin IV every 8 hours · Vancomycin IV every 12 hours · Ketorolac IV every 6 hours as needed for pain · 0.9% saline at 125 mL/hr · Repeat CT with IV contrast today"]];
const C60A2=C60A.concat([["Day 9","Nephrotoxic drugs stopped on day 5; fluids were restricted to 1,000 mL per day. <b>Today:</b> Urine output 4,200 mL in the past 24 hours. Fluid restriction order still active."]]);

Q.push(
/* ---- acute kidney injury (six-item case) ---- */
{ch:60,cs:"60a",need:N.rr,skill:S.rc,type:HL,src:"Iggy Ch. 60, Acute Kidney Injury: Assessment; Health Promotion/Disease Prevention",chart:C60A,
stem:"Select the findings that require follow-up.",
segs:[{t:"Urine 18 mL/hr for the last 4 hours",c:1},{t:"creatinine 2.8 mg/dL, up from 0.9",c:1},{t:"gentamicin trough above the target range",c:1},{t:"tubular cells and granular casts in the urine",c:1},{t:"new crackles in both lung bases",c:1},{t:"SpO₂ 92% on room air",c:1},{t:"weight up 2.4 kg in 2 days",c:1},
{t:"blood pressure 128/78 mm Hg",c:0},{t:"heart rate 84",c:0},{t:"temperature 98.9°F",c:0},{t:"alert and oriented",c:0}],
why:"For a 90-kg client, less than 0.5 mL/kg/hr is less than 45 mL/hr. A rise in creatinine over days is reported urgently. Crackles, falling oxygen saturation, edema, and weight gain show fluid is being retained.",

{ch:60,cs:"60a",hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 60, Acute Kidney Injury: Etiology; Fig. 60.1; Box 60.3",chart:C60A,
stem:"Which type of acute kidney injury do the findings most support?",
opts:[{t:"Intrarenal, from nephrotoxic drugs and contrast medium",c:1,r:"Aminoglycosides, vancomycin, and contrast media are nephrotoxic. Tubular cells and casts in the urine reflect damage inside the kidney."},
{t:"Prerenal, from reduced blood flow to the kidneys",r:"Sepsis and hypotension are prerenal causes, but perfusion has been adequate since day 1 and the urine now shows tubular damage."},
{t:"Postrenal, from obstruction of urine flow",r:"The catheter is patent and nothing suggests stones, tumor, or prostate obstruction."},
{t:"Chronic kidney disease that was not recognized on admission",r:"The admission creatinine was 0.9 mg/dL. The change occurred over days."}],
why:"This client has had risk factors for more than one type. The nurse reads which one fits today's data: normal blood pressure, a toxic drug level, and tubular debris in the urine.",

{ch:60,cs:"60a",need:N.pa,skill:S.ph,type:MC,src:"Iggy Ch. 60, Acute Kidney Injury: Assessment; Box 60.1",chart:C60A,
stem:"Which problem is the priority at 0800?",
opts:[{t:"Fluid overload with impaired gas exchange",c:1,r:"New crackles, respirations of 24, SpO₂ of 92%, edema, and a 2.4-kg weight gain are present now."},
{t:"Hyperkalemia with risk for dysrhythmia",r:"Potassium is 5.2 mEq/L. It is monitored closely, but it is not yet at a dangerous level."},
{t:"Malnutrition from protein breakdown",r:"A real problem in acute kidney injury that is managed with the dietitian. Not urgent."},
{t:"Worsening sepsis",r:"Temperature, heart rate, and blood pressure are stable."}],
why:"Two of the options are true complications of acute kidney injury that are developing. The priority is the one already affecting breathing.",
plain:"Fluid is backing up into his lungs right now."},

{ch:60,cs:"60a",need:N.rr,skill:S.gs,type:MX,src:"Iggy Ch. 60, Acute Kidney Injury: Health Promotion; Interventions; Nutrition Therapy",chart:C60A,
stem:"For each order or proposed action, choose whether the nurse anticipates it or questions it.",
cols:["Anticipate","Question"],
rows:[{t:"Give the next scheduled dose of gentamicin",a:1},
{t:"Consult the pharmacist to adjust drug doses for kidney function",a:0},
{t:"Give ketorolac for pain",a:1},
{t:"Repeat CT with IV contrast today",a:1},
{t:"Continue 0.9% saline at 125 mL/hr",a:1},
{t:"Consult the registered dietitian nutritionist about protein and calorie needs",a:0}],
why:"The nurse questions any order for a potentially nephrotoxic drug and validates the dose. Combining nephrotoxic agents sharply raises the risk. Fluids are restricted when fluid overload from acute kidney injury is present. Protein breakdown is high in acute kidney injury, so the dietitian calculates needs.",

{ch:60,cs:"60a",hard:1,need:N.pa,skill:S.ta,type:MC,src:"Iggy Ch. 60, Acute Kidney Injury: Interventions (diuretic phase)",chart:C60A2,

opts:[{t:"Contact the provider to revise the plan toward fluid and electrolyte replacement and monitoring.",c:1,r:"With high-volume urine output, hypovolemia and electrolyte loss become the main problems. The plan of care changes to replacement and monitoring."},

why:"Chest pain with a friction rub suggests uremic pericarditis. Asterixis, slurred speech, and drowsiness suggest uremic encephalopathy. Taste change, itching, skin color, and breath odor are long-standing features of uremia.",
plain:"The waste in her blood has started to irritate the lining of the heart and the brain."},

{ch:60,cs:"60b",need:N.pa,skill:S.ac,type:CZ,src:"Iggy Ch. 60, Chronic Kidney Disease: Cardiac Changes; Assessment",chart:C60B,
stem:"Complete the statements.",
parts:["The chest pain and friction rub indicate ",{o:["uremic pericarditis","pulmonary edema","myocardial infarction"],a:0},
". If it is not treated, it can lead to ",{o:["pericardial effusion and cardiac tamponade","renal osteodystrophy","peripheral neuropathy"],a:0},
". The deep respirations at a rate of 26 are a response to ",{o:["metabolic acidosis","fluid overload","anemia"],a:0},"."],
why:"The pericardial sac is inflamed by uremic toxins or infection. Signs include chest pain, tachycardia, low-grade fever, and a friction rub. Untreated, it progresses to effusion, tamponade, and death. A bicarbonate of 15 mEq/L with deep, rapid breathing is respiratory compensation for metabolic acidosis.",
plain:"The sac around the heart is inflamed and can fill with fluid and squeeze the heart."},

{ch:60,cs:"60b",hard:1,need:N.pa,skill:S.ph,type:MC,src:"Iggy Ch. 60, Hemodialysis: Patient Selection",chart:C60B,
stem:"Which finding is the strongest reason for this client to begin dialysis now?",
opts:[{t:"Pericarditis with changes in neurologic status",c:1,r:"Pericarditis is a listed indication for emergent dialysis. Dialysis is also used emergently when neurologic problems result from kidney disease."},
{t:"Estimated glomerular filtration rate of 12 mL/min/1.73 m²",r:"Starting dialysis depends on symptoms, not on the filtration rate alone."},
{t:"Hemoglobin 8.1 g/dL",r:"Anemia is treated with an erythropoiesis-stimulating agent and iron."},
{t:"Phosphorus 7.2 mg/dL",r:"Managed with diet and phosphate binders."}],
why:"Every value is abnormal and every one belongs to stage 5 disease. The decision to start dialysis is driven by symptoms of uremia and by life-threatening complications.",
plain:"The number that defines her stage is not what starts dialysis. What her body is doing is."},

{ch:60,cs:"60b",need:N.ph,skill:S.gs,type:SATA,src:"Iggy Ch. 60, Chronic Kidney Disease: Preventing Injury (drug therapy); Table 60.5",chart:C60B,
stem:"Which drug-related actions does the nurse include in the plan of care? Select all that apply.",
opts:[{t:"Anticipate a lower insulin dose than she needed last year.",c:1,r:"Failing kidneys do not excrete or metabolize insulin well, so it acts longer and hypoglycemia risk rises."},
{t:"Check blood glucose at least four times a day.",c:1,r:"Done to see whether a dose change is needed."},
{t:"Give calcium acetate with meals and at least 2 hours apart from other scheduled drugs.",c:1,r:"It binds dietary phosphorus and can block absorption of other drugs."},
{t:"Monitor blood pressure and hemoglobin while she receives epoetin alfa.",c:1,r:"Overproduction of blood cells raises blood viscosity and blood pressure."},
{t:"Request a higher epoetin dose to bring hemoglobin to 13 to 14 g/dL.",r:"The dose is set to keep hemoglobin no higher than about 10 to 11 g/dL."},
{t:"Offer ibuprofen for bone pain.",r:"Nonsteroidal antiinflammatory drugs reduce blood flow to the kidney and are nephrotoxic."}],
why:"Drug therapy in chronic kidney disease is a safety problem. Many drugs are excreted by the kidney or can damage it further, and doses change as function falls.",
plain:"Her kidneys clear drugs slowly, so ordinary doses pile up."},

{ch:60,cs:"60b",hard:1,need:N.rr,skill:S.ta,type:MC,src:"Iggy Ch. 60, Hemodialysis: Critical Rescue (hypotension)",chart:C60B2,
stem:"Review the Dialysis entry. Which response does the nurse expect from the dialysis nurse first?",
opts:[{t:"Adjust the rate of dialyzer blood flow and place the client in a legs-up position.",c:1,r:"This is the response to a modest decline in blood pressure."},
{t:"Give a 100- to 250-mL bolus of normal saline.",r:"Used for sustained or symptomatic hypotension."},
{t:"Discontinue the dialysis session.",r:"Done when hypotension continues despite two bolus infusions."},
{t:"Apply oxygen, reduce the blood flow, and notify the provider urgently.",r:"Done when hypotension persists and new myocardial injury or pericardial disease may be contributing."}],
why:"All four are real steps in the same protocol, in increasing order of severity. The stem describes a modest fall with no symptoms, so the first step is the answer.",
plain:"A small dip gets a small fix first: slow the machine and raise the legs."},

{ch:60,cs:"60b",need:N.pa,skill:S.eo,type:MX,src:"Iggy Ch. 60, Table 60.5; Minimizing Psychosocial Compromise; Calcium and phosphorus balance; Evaluation",chart:C60B2,
stem:"Six weeks later the client is receiving hemodialysis three times a week. For each finding, choose whether the expected outcome has been met.",
cols:["Outcome met","Not met: follow up"],
rows:[{t:"Hemoglobin 10.4 g/dL",a:0},
{t:"Hemoglobin 12.8 g/dL with blood pressure 178/100 mm Hg",a:1},
{t:"No chest pain; friction rub no longer heard",a:0},
{t:"Calcium 9.2 mg/dL and phosphorus 4.4 mg/dL",a:0},
{t:"Weight gain of 4.5 kg between dialysis sessions",a:1},
{t:"Calcium 10.4 mg/dL and phosphorus 7.5 mg/dL with worsening itching",a:1}],
why:"The hemoglobin goal is about 10 g/dL. Higher levels raise blood pressure and the risk of myocardial infarction. A calcium-phosphorus product above 70 lets crystals deposit in tissues, and itching increases. Each kilogram gained is about 1 L of retained fluid.",
plain:"Enough red blood cells but not too many, minerals in balance, and little fluid gained between treatments."},

/* ---- standalone ---- */
{ch:60,need:N.hp,skill:S.gs,type:MX,src:"Iggy Ch. 60, Table 60.4; Stages of Chronic Kidney Disease",
stem:"For each client with chronic kidney disease, choose the focus of care for the stage.",
cols:["Reduce risk factors","Slow progression","Prepare for kidney replacement","Start kidney replacement or transplant"],
rows:[{t:"Filtration rate 95 mL/min/1.73 m² with albumin in the urine",a:0},
{t:"Filtration rate 72 mL/min/1.73 m²",a:0},
{t:"Filtration rate 42 mL/min/1.73 m²",a:1},
{t:"Filtration rate 22 mL/min/1.73 m²",a:2},
{t:"Filtration rate 9 mL/min/1.73 m²",a:3}],
why:"Stage 1 is above 90 with signs of kidney disease, and stage 2 is 60 to 89; both focus on reducing risk. Stage 3, 30 to 59, focuses on slowing progression. In stage 4, 15 to 29, complications are managed and the client is educated about options. Stage 5 is below 15.",
plain:"Early: protect the kidneys. Middle: slow the slide. Late: get ready. Last: replace the kidney's work."},

{ch:60,hard:1,need:N.pa,skill:S.ph,type:MC,src:"Iggy Ch. 60, Stages of Chronic Kidney Disease; Metabolic Changes",
stem:"A client with stage 2 chronic kidney disease has had vomiting and diarrhea for 2 days. Which complication is the client at greatest risk for?",
opts:[{t:"Severe dehydration",c:1,r:"In this stage output of dilute urine may be increased and can lead to severe dehydration. The kidneys keep losing water and sodium even when intake is low."},
{t:"Fluid overload with pulmonary edema",r:"Occurs later, when the kidneys can no longer excrete sodium and water."},
{t:"Hyperkalemia",r:"Normal potassium is maintained until 24-hour urine output falls below 500 mL."},
{t:"Hypernatremia from sodium retention",r:"A late change. Early disease carries a risk of sodium depletion."}],
why:"Three of the options are the complications most people associate with kidney disease, and they are correct for late stages. Early disease behaves the opposite way.",
plain:"Early on, damaged kidneys cannot hold water in. Add vomiting and the client dries out quickly."},

{ch:60,need:N.pa,skill:S.ac,type:ORD,src:"Iggy Ch. 60, Calcium and phosphorus balance; Fig. 60.4",
stem:"Place the events that lead to renal osteodystrophy in the order they occur.",
steps:["The kidneys excrete less phosphorus.",
"The plasma phosphorus level rises.",
"The serum calcium level falls.",
"The parathyroid glands release more parathyroid hormone.",
"Calcium is released from bone, and bone density is lost."],
why:"Reduced production of active vitamin D makes the low calcium worse, because less calcium is absorbed from the intestine. The result is bone pain, fractures, and loss of bone density.",
plain:"Phosphorus builds up, calcium drops, and the body robs the bones to make up the difference."},

{ch:60,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 60, Metabolic Changes: sodium excretion",
stem:"A client with end-stage kidney disease has a serum sodium of 131 mEq/L, a 3-kg weight gain, edema, and a blood pressure of 172/100 mm Hg. How does the nurse interpret the sodium level?",
opts:[{t:"It is falsely low from dilution, because water is retained faster than sodium.",c:1,r:"In late disease sodium is retained. When fluid is retained at a greater rate, the serum level reads low."},
{t:"The body is depleted of sodium, and intake should be increased.",r:"That is the risk in early disease. Adding sodium here would worsen hypertension and edema."},
{t:"The value is a laboratory error and should be redrawn.",r:"The value fits the clinical picture."},
{t:"Excess antidiuretic hormone is being secreted.",r:"Nothing in the history points to that syndrome."}],
why:"The number alone suggests one thing. The weight, edema, and blood pressure show the opposite. Sodium retention causes hypertension and edema even when the serum level looks normal or low.",
plain:"There is plenty of salt in the body. It only looks low because it is watered down."},

{ch:60,need:N.pa,skill:S.gs,type:MC,src:"Iggy Ch. 60, Intermittent Versus Continuous Kidney Replacement Therapy",
stem:"A client with septic shock on a norepinephrine infusion develops acute kidney injury that requires kidney replacement therapy. Which plan does the nurse anticipate?",
opts:[{t:"Continuous venovenous hemofiltration in the intensive care unit",c:1,r:"Continuous therapies are used for adults too unstable to tolerate the blood pressure changes of intermittent hemodialysis. They run over 24 hours and occur only in intensive care."},
{t:"Intermittent hemodialysis for 4 hours, three times a week",r:"Creates fluid and electrolyte shifts that critically ill clients may not tolerate."},
{t:"Transfer to a community dialysis center",r:"For stable clients who do not need close supervision."},
{t:"Use of the central venous pressure line for dialysis access",r:"Dialysis requires a catheter specific for dialysis, used only for that purpose."}],
why:"The blood pressure support in the stem is the deciding cue.",
plain:"He is too fragile for the fast version, so the work is done slowly, around the clock."},

{ch:60,hard:1,need:N.saf,skill:S.ta,type:MC,src:"Iggy Ch. 60, Kidney Replacement Therapy: vascular access; Table 60.8",
stem:"A client has a temporary dialysis catheter in the right internal jugular vein. Which action by a nurse requires intervention?",
opts:[{t:"Preparing to give an IV antibiotic through the catheter because the client has no other IV access",c:1,r:"The catheter is not used for blood samples, drugs or fluids, or central venous pressure monitoring."},
{t:"Changing the dressing with aseptic technique",r:"Correct."},
{t:"Assessing the site each time vital signs are taken",r:"Correct."},
{t:"Confirming that placement was verified by x-ray before first use",r:"Correct. The catheter can be used immediately after insertion and x-ray confirmation."}],
why:"The reason given in the wrong action sounds practical. Using the dialysis catheter for anything else raises the risk of bloodstream infection and clotting.",
plain:"That line has one job. Using it for anything else risks losing it."},

{ch:60,need:N.rr,skill:S.ta,type:MX,src:"Iggy Ch. 60, Peritoneal Dialysis: Complications",
stem:"A client receives peritoneal dialysis. For each problem, choose the nurse's first response.",
cols:["Warm the dialysate","Lower the drainage bag","Milk the tubing","Start a bowel regimen"],
rows:[{t:"Outflow is slow, and the drainage bag is hooked on the upper side rail",a:1},
{t:"Pain during inflow in the first week; the bag feels cold",a:0},
{t:"Outflow has stopped, and fibrin strands are visible in the tubing",a:2},
{t:"Outflow has been poor for 2 days, and the client has had no bowel movement in 5 days",a:3}],
why:"Outflow depends on gravity, so the bag must be lower than the abdomen. Cold dialysate increases pain; it is warmed with a heating pad or the cycler's warming chamber, not a microwave. Milking the tubing may dislodge a fibrin clot. Poor flow is often related to constipation.",
plain:"Cold hurts, uphill does not drain, clots block, and a full bowel presses on the tube."},

{ch:60,hard:1,need:N.rr,skill:S.eo,type:MC,src:"Iggy Ch. 60, Acute Kidney Injury: prevention of contrast-induced nephropathy",
stem:"A client with reduced kidney function receives IV fluids before and after a CT scan with contrast medium. Which finding shows that the preventive hydration is achieving its desired outcome?",
opts:[{t:"Urine output of 150 mL/hr during the first 6 hours after the contrast",c:1,r:"This is the common desired outcome for clients who receive contrast medium."},
{t:"Urine output of 30 mL/hr during the first 6 hours after the contrast",r:"The usual minimum for adequate output. It is not enough to dilute and clear the contrast."},
{t:"Serum creatinine unchanged 1 hour after the scan",r:"Creatinine takes time to rise, so an early value does not show the kidney was protected."},
{t:"Urine specific gravity of 1.030",r:"Concentrated urine means hydration is inadequate."}],
why:"The usual 30 mL/hr rule is the tempting answer. After contrast the target is five times higher, to dilute the agent and speed its elimination.",
plain:"The goal is to flush the dye out quickly, so the kidneys should be making a lot of urine."},

{ch:60,hard:1,need:N.bcc,skill:S.gs,type:MC,src:"Iggy Ch. 60, Table 60.6; Enhancing Nutrition",
stem:"A client who has used continuous ambulatory peritoneal dialysis for 3 months has a poor appetite and a falling prealbumin level. Which instruction does the nurse expect to reinforce?",
opts:[{t:"Eat 1.2 to 1.5 g of protein per kilogram each day and use a high-calorie supplement if needed.",c:1,r:"Protein is lost in the outflow, so the need is higher. A falling prealbumin level indicates poor protein intake."},
{t:"Limit protein to 0.55 to 0.60 g per kilogram each day.",r:"That is the restriction for chronic uremia before dialysis."},
{t:"Limit potassium to 60 to 70 mEq each day.",r:"Potassium usually does not need to be restricted with peritoneal dialysis, because the dialysate is potassium free."},
{t:"Limit fluid to 500 to 700 mL plus urine output each day.",r:"That is the hemodialysis allowance. With peritoneal dialysis, restriction is based on weight gain and blood pressure."}],
why:"Each option is the correct rule for a different stage or type of treatment. Diet teaching must match the treatment the client is on.",
plain:"Each bag that drains out carries protein with it, so more has to go back in."},

{ch:60,need:N.pa,skill:S.ac,type:MX,src:"Iggy Ch. 60, Table 60.10",
stem:"For each description, choose the type of kidney transplant rejection.",
cols:["Hyperacute","Acute","Chronic"],
rows:[{t:"Begins within 48 hours of surgery",a:0},
{t:"Oliguria, temperature above 100°F, and an enlarged, tender kidney 3 weeks after surgery",a:1},
{t:"Treated with increased doses of immunosuppressive drugs",a:1},
{t:"Gradual rise in BUN and creatinine over months to years",a:2},
{t:"Treated by immediate removal of the transplanted kidney",a:0},
{t:"Managed conservatively until dialysis is required",a:2}],
why:"Acute rejection is the most common type. It can occur from 1 week to any time after surgery and often can be reversed.",
plain:"Right away: the kidney comes out. Weeks later: more antirejection medicine. Years later: slow decline."},

{ch:60,hard:1,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 60, Kidney Transplantation: Complications (infection)",
stem:"Three months after a kidney transplant, a client has a temperature of 99.8°F (37.7°C), is mildly confused, and says, “I just don't feel right.” The transplant site is not tender, urine output is unchanged, and blood pressure is at baseline. How does the nurse interpret these findings?",
opts:[{t:"Possible infection that could progress to sepsis; report now.",c:1,r:"Low-grade fever, mental status changes, and vague discomfort may be the only symptoms before sepsis in a client taking immunosuppressive drugs."},
{t:"Acute rejection.",r:"Presents with oliguria, temperature above 100°F, increased blood pressure, and an enlarged, tender kidney."},
{t:"Chronic rejection.",r:"Develops gradually over months to years with rising BUN and creatinine and fluid retention."},
{t:"An expected mood effect of corticosteroid therapy.",r:"A new change in mental status with a temperature rise is not attributed to drug effect."}],
why:"The stem rules out the signs of rejection one by one. What remains is a quiet presentation of infection, which is a major cause of death in transplant recipients.",
plain:"The antirejection drugs muffle the body's alarm. A small fever and fuzzy thinking can be a serious infection."},

{ch:60,need:N.rr,skill:S.ta,type:MC,src:"Iggy Ch. 60, Kidney Transplantation: Critical Rescue",
stem:"On the first day after a kidney transplant, urine output over the past 12 hours is 900 mL greater than intake. Blood pressure is 92/56 mm Hg; it was 128/78 six hours ago. Which action does the nurse take?",
opts:[{t:"Notify the nephrology provider now.",c:1,r:"Hypotension or excessive diuresis is reported, because hypotension reduces perfusion and oxygen to the new kidney and threatens the graft."},
{t:"Document the diuresis as a sign that the kidney is working well.",r:"Diuresis can occur with a new kidney, but output this far above intake with hypotension is a threat."},
{t:"Slow the IV fluids to keep from overloading the new kidney.",r:"Would deepen the hypotension."},
{t:"Request a diuretic to protect the kidney.",r:"Diuretics are used for oliguria, not for excessive diuresis."}],
why:"A new kidney that makes a lot of urine looks like success. The blood pressure shows the client is losing more than is being replaced.",
plain:"The new kidney is working so hard that it is drying him out, and a dry body cannot feed the kidney."},

{ch:60,need:N.psy,skill:S.ta,type:MC,src:"Iggy Ch. 60, Older Adult Health: Dialysis",
stem:"An 84-year-old client with stage 5 chronic kidney disease and coronary artery disease asks, “Do I have to go on dialysis?” Which response by the nurse is best?",
opts:[{t:"“Let's go over what dialysis involves and what care without dialysis involves, so you can decide what fits your life.”",c:1,r:"Clients are educated about all aspects of dialysis so they can make an informed decision. In adults over 80 with coronary artery disease and other conditions, dialysis has not been shown to prolong life compared with conservative treatment."},
{t:"“Yes. Without dialysis you will not survive.”",r:"Removes the client's choice and overstates what dialysis offers this client."},
{t:"“That is a decision for your family and your kidney doctor.”",r:"The decision belongs to the client."},
{t:"“Try not to think about that until your symptoms get worse.”",r:"Avoids the question and delays informed planning."}],
why:"Clients receiving dialysis spend far more days each year in the hospital or at treatment than those managed without it. The nurse gives information and emotional support for the decision.",
plain:"It is his choice, and he can only make it if someone lays out both paths honestly."}
);
