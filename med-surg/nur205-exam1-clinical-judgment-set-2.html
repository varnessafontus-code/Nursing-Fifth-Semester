<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clinical Judgment Set 2</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1c2526;--mut:#5d6b6c;--line:#d9d3c5;--acc:#0f5c63;--acc-ink:#fff;--soft:#e3eeee;
--ok:#1e6b3c;--okbg:#e1f1e5;--bad:#a3261d;--badbg:#f8e3e0;--warn:#8a5a00;--warnbg:#f8ecd0;--chart:#eef1f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191a;--card:#1a2324;--ink:#e9eeec;--mut:#9aa9a8;--line:#2e3b3c;--acc:#5fc2c9;--acc-ink:#06282b;--soft:#1f3436;
--ok:#7fd79c;--okbg:#173022;--bad:#ff9f94;--badbg:#3a1b18;--warn:#f0c367;--warnbg:#3a2e12;--chart:#202b2d}}
:root[data-theme="dark"]{--bg:#12191a;--card:#1a2324;--ink:#e9eeec;--mut:#9aa9a8;--line:#2e3b3c;--acc:#5fc2c9;--acc-ink:#06282b;--soft:#1f3436;
--ok:#7fd79c;--okbg:#173022;--bad:#ff9f94;--badbg:#3a1b18;--warn:#f0c367;--warnbg:#3a2e12;--chart:#202b2d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
h1{font:600 30px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 12px;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
h2:first-child{margin-top:0}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0;font-weight:600}
.lead{font-size:18px;color:var(--mut);margin:0 0 20px;max-width:62ch}
.muted{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{margin-top:8px}
.resume{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.45}
.btn.big{width:100%;margin-top:16px;min-height:54px;font-size:18px}
.btn.flagged{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segb{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column}
.segb span{font-size:14px;color:var(--mut)}
.segb.on{border-color:var(--acc);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--mut)}
.chip.on{border-color:var(--acc);background:var(--soft);color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.notes ul{margin:0 0 10px;padding-left:20px}.notes li{margin:4px 0}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:2}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);font-weight:600}
.clock{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--acc)}
.bar.g>div{background:var(--ok)}.bar.m>div{background:var(--warn)}.bar.l>div{background:var(--bad)}
.chart{background:var(--chart);border:1px solid var(--line);border-radius:10px;margin:8px 0 16px;overflow:hidden}
.ctitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 14px 0;font-weight:700}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{flex:none;min-height:44px;padding:0 14px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);background:var(--card)}
.cbody{padding:10px 14px 14px;font-size:16px}
.stem{font:600 21px/1.35 Georgia,"Times New Roman",serif;margin:6px 0 10px;text-wrap:pretty}
.caselbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:0}
.hardtag{border-color:var(--warn)!important;color:var(--warn)!important}
.hint{font-size:14px;color:var(--mut);margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);min-height:52px}
.ltr{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--mut)}
.ltr.box{border-radius:6px}
.ot{flex:1;min-width:0}
.or{display:block;font-size:15px;color:var(--mut);margin-top:6px}
.opt.sel{border-color:var(--acc);background:var(--soft)}
.opt.sel .ltr{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg);opacity:1}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.miss{border-color:var(--warn);background:var(--warnbg);border-style:dashed}
.opt:disabled{color:var(--ink)}
.hl{display:flex;flex-wrap:wrap;gap:8px}
.seg-h{min-height:44px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.seg-h.sel{background:#ffe98a;border-color:#b08a00;color:#1c2526}
.seg-h.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.seg-h.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.seg-h.miss{background:var(--warnbg);border-color:var(--warn);border-style:dashed;color:var(--ink)}
.seg-h:disabled{color:var(--ink)}.seg-h.dim:disabled{color:var(--mut)}
.mxw{overflow-x:auto}
.mx{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mx th{font-size:13px;font-weight:700;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:bottom;min-width:84px}
.mx .rt{min-width:170px}
.mx td{padding:8px 6px;border-bottom:1px solid var(--line)}
.mx tr:last-child td{border-bottom:0}
.mx .rt{padding-left:12px}
.mx .cell{text-align:center;width:1%}
.radio{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);background:transparent;padding:0;position:relative}
.radio.sel{border-color:var(--acc)}
.radio.sel::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--acc)}
.cell.ok{background:var(--okbg)}.cell.bad{background:var(--badbg)}
.cell.bad .radio.sel{border-color:var(--bad)}.cell.bad .radio.sel::after{background:var(--bad)}
.cell.ok .radio{border-color:var(--ok)}.cell.ok .radio.sel::after{background:var(--ok)}
.rbad .rt{color:var(--bad)}
.cz{font-size:18px;line-height:2.3;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0}
.cz select{font:inherit;font-size:16px;max-width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid var(--acc);background:var(--soft);color:var(--ink)}
.cz select.ok{border-color:var(--ok);background:var(--okbg)}.cz select.bad{border-color:var(--bad);background:var(--badbg)}
.cz select:disabled{opacity:1;color:var(--ink)}
.fix{color:var(--ok);font-weight:600}
.ord{list-style:none;counter-reset:n;padding:0;margin:0;display:grid;gap:8px}
.ord li{counter-increment:n;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.ord li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}.ord li.bad{border-color:var(--bad);background:var(--badbg)}
.mv{display:flex;gap:6px;flex:none}
.ar{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.ar:disabled{opacity:.3}
.right{margin-top:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--ok);background:var(--okbg)}
.right ol{margin:6px 0 0;padding-left:22px}
.conf{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.cf{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:transparent;font-size:14px}
.cf.on{background:var(--soft);border-color:var(--acc);font-weight:600}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:6px solid var(--mut);background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fb.full{border-left-color:var(--ok)}.fb.part{border-left-color:var(--warn)}.fb.zero{border-left-color:var(--bad)}
.fbh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fbh span{font-size:14px;color:var(--mut)}
.fb p{margin:8px 0}
.plain{background:var(--soft);padding:10px 12px;border-radius:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);color:var(--mut)}
.src{font-size:13px;color:var(--mut)}
.ask{margin-top:16px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--warn);background:var(--warnbg)}
.ask p{margin:0 0 10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.foot .pri{margin-left:auto;min-width:150px}
.nav{margin-top:16px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.nb{height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600;position:relative}
.nb.ans{background:var(--soft)}.nb.cur{outline:2.5px solid var(--acc);outline-offset:1px}
.nb.full{background:var(--okbg);border-color:var(--ok)}.nb.part{background:var(--warnbg);border-color:var(--warn)}.nb.zero{background:var(--badbg);border-color:var(--bad)}
.nb.flag::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.legend{margin:10px 0}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font:700 56px/1 Georgia,serif}
.big.g{color:var(--ok)}.big.m{color:var(--warn)}.big.l{color:var(--bad)}
.brow{margin:10px 0}.bl{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.lnk{border:0;background:transparent;color:var(--acc);font-weight:700;text-decoration:underline;padding:6px 4px}
.list{display:grid;gap:6px}
.li{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:48px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);border-left-width:6px;background:transparent;font-size:15px}
.li.full{border-left-color:var(--ok)}.li.part{border-left-color:var(--warn)}.li.zero{border-left-color:var(--bad)}
.num{flex:none;width:26px;font-weight:700;color:var(--mut)}.lt{flex:1;min-width:0}.pts{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:520px){h1{font-size:25px}.stem{font-size:19px}.seg{grid-template-columns:1fr}.foot .pri{flex:1 1 100%;order:-1;margin:0}.mx th{min-width:58px;font-size:11px;padding:8px 3px}.mx .rt{min-width:118px;padding-left:8px;font-size:15px}.mx td{padding:6px 3px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MC="mc",SATA="sata",MX="matrix",CZ="cloze",ORD="order",HL="highlight";
const N={moc:"Management of Care",saf:"Safety and Infection Control",hp:"Health Promotion and Maintenance",psy:"Psychosocial Integrity",bcc:"Basic Care and Comfort",ph:"Pharmacological Therapies",rr:"Reduction of Risk Potential",pa:"Physiological Adaptation"};
const S={rc:"Recognize Cues",ac:"Analyze Cues",ph:"Prioritize Hypotheses",gs:"Generate Solutions",ta:"Take Action",eo:"Evaluate Outcomes"};
const Q=[];

/* ================= CHAPTER 53: Assessment of the Endocrine System ================= */
const C53A=[["History","46-year-old woman. Reports 22-lb weight gain in 8 months, easy bruising, and a cut on her shin that has not healed in 5 weeks. Menses stopped 4 months ago. Sleeps poorly. Family history: mother with type 2 diabetes mellitus."],
["Physical Assessment","Round face. Fat pad between the shoulders. Large trunk with thin arms and legs. Reddish-purple striae on the abdomen. Several bruises on both forearms. Fungal rash under both breasts. Thyroid not visible. Scalp hair distribution unchanged."],
["Vital Signs","Blood pressure 158/96 mm Hg · Heart rate 76, regular · Respirations 16 · Temperature 98.4°F (36.9°C)"],
["Medications","Client states: “Nothing prescribed. I take a muscle-building supplement I ordered online and an herbal sleep aid.”"]];
const C53B=C53A.concat([["Orders","24-hour urine collection for cortisol, to start at home tomorrow · Overnight dexamethasone suppression test: dexamethasone by mouth at bedtime, fasting blood draw at 0800"]]);
Q.push(
{ch:53,cs:"53a",need:N.rr,skill:S.rc,type:HL,src:"Iggy Ch. 53, Physical Assessment: Inspection",chart:C53A,
stem:"Select the findings that require follow-up.",
segs:[{t:"Round face",c:1},{t:"fat pad between the shoulders",c:1},{t:"reddish-purple striae on the abdomen",c:1},{t:"bruises on both forearms",c:1},{t:"shin wound not healed in 5 weeks",c:1},{t:"fungal rash under both breasts",c:1},{t:"blood pressure 158/96 mm Hg",c:1},{t:"thyroid not visible",c:0},{t:"scalp hair distribution unchanged",c:0},{t:"heart rate 76, regular",c:0},{t:"temperature 98.4°F",c:0}],
why:"Truncal obesity, a fat pad between the shoulders, and striae point to adrenocortical excess. Fungal skin infections, slow wound healing, and bruising are often seen with adrenal hyperfunction. A thyroid that cannot be seen is the normal finding.",
plain:"The body is showing signs of too much stress hormone. A neck with no lump is normal."},

{ch:53,cs:"53a",need:N.pa,skill:S.ac,type:CZ,src:"Iggy Ch. 53, Physical Assessment; Patient History",chart:C53A,
stem:"Complete the statements.",
parts:["The physical findings are most consistent with ",{o:["adrenocortical excess","underactive thyroid function","adrenal hypofunction"],a:0},
". The history item that most needs clarification is the ",{o:["muscle-building supplement ordered online","family history of type 2 diabetes mellitus","poor sleep"],a:0},
" because ",{o:["exogenous hormones can cause serious dysfunction in endocrine glands","supplements usually contain iodine","supplements raise blood glucose in every client"],a:0},"."],
why:"Hormone-based products taken when no replacement is needed can disrupt many endocrine glands. The nurse asks about every prescribed and over-the-counter product and teaches the danger of misusing androgens and other hormones.",
plain:"A bodybuilding pill can secretly be a hormone. Hormones from outside confuse the body's own glands."},

{ch:53,cs:"53a",hard:1,need:N.rr,skill:S.ph,type:MC,src:"Iggy Ch. 53, Auscultation; Inspection",chart:C53A,
stem:"Which additional assessment is the priority at this visit?",
opts:[{t:"Auscultate the heart rate and rhythm and the lungs, and check for edema and neck vein distention.",c:1,r:"Adrenal excess disturbs fluid and electrolyte balance. Some endocrine problems cause dysrhythmias and fluid overload, and the blood pressure is already 158/96."},
{t:"Palpate the thyroid from behind while the client swallows.",r:"A correct technique, but nothing points to the thyroid."},
{t:"Inspect the fingernails for thickness and brittleness.",r:"Nail changes suggest a thyroid problem. Low priority here."},
{t:"Ask the age at which menarche began.",r:"Part of the history, but it does not address the current risk."}],
why:"Every option is a real endocrine assessment. The priority is the one tied to the cues already present: hypertension with signs of adrenal excess means fluid and electrolyte risk comes first.",
plain:"Too much of this hormone makes the body hold salt and water. Check the heart and lungs before anything else."},

{ch:53,cs:"53a",need:N.rr,skill:S.gs,type:MX,src:"Iggy Ch. 53, Provocative/Suppression Tests; Urine Tests; Laboratory Assessment",chart:C53B,
stem:"For each statement about the planned testing, choose whether it is accurate.",
cols:["Accurate","Not accurate"],
rows:[{t:"A suppression test is chosen because the hormone level is suspected to be high.",a:0},
{t:"If the hormone level fails to fall after the drug, the gland is hyperfunctioning.",a:0},
{t:"A single random blood sample reflects adrenal function better than a 24-hour urine collection.",a:1},
{t:"A stimulation test would be the better choice to confirm an overactive gland.",a:1},
{t:"A saliva sample can accurately reflect the blood cortisol level.",a:0}],
why:"Suppression tests are used when levels are high or high-normal. Failure to suppress means hyperfunction. Stimulation tests look for an underactive gland. Many hormones are released in pulses, so a 24-hour urine collection reflects gland function better than one sample. Saliva accurately reflects steroid hormones such as cortisol.",
plain:"To test a gland that is too loud, try to turn it down. If it will not turn down, it is overactive."},

{ch:53,cs:"53a",need:N.rr,skill:S.ta,type:ORD,src:"Iggy Ch. 53, Box 53.5",chart:C53B,
stem:"The nurse teaches the client how to do the 24-hour urine collection. Place the steps in order.",
steps:["Confirm with the laboratory whether a preservative or cold storage is required and that any preservative is already in the container.",
"Empty the bladder and discard that urine.",
"Write down the time of the discarded urine as the start of the collection.",
"Add all urine passed during the next 24 hours to the container.",
"At the end time, empty the bladder even without the urge and add that urine to the container."],
why:"The first voiding is discarded, and timing starts after it. The final voiding is included even if the client feels no urge.",
plain:"Start with an empty bladder, save everything for a full day, and finish with one last trip to the bathroom."},

{ch:53,cs:"53a",need:N.hp,skill:S.eo,type:MX,src:"Iggy Ch. 53, Box 53.5; Urine Tests",chart:C53B,
stem:"After teaching, the client makes these statements. For each, choose whether teaching was effective.",
cols:["Teaching effective","Needs further teaching"],
rows:[{t:"“I will pour out the liquid that is already in the container before I start.”",a:1},
{t:"“I will be careful not to splash, because the liquid in the container can burn skin.”",a:0},
{t:"“I will keep the container in a small cooler with ice, away from food and drinks.”",a:0},
{t:"“If I do not feel the need to go at the end time, I will skip the last sample.”",a:1},
{t:"“I will set an alarm so I take the dexamethasone on time.”",a:0},
{t:"“I will ask my provider before taking a new over-the-counter medicine during the test.”",a:0}],
why:"The preservative stays in the container and can be caustic. The last voiding is always added. A drug prescribed as part of a test must be taken on time, and other drugs can interfere with the assay.",
plain:"Do not dump the liquid in the jug, do not skip the last pee, and take the test pill on time."},

{ch:53,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 53, Anatomy and Physiology Review; Fig. 53.3",
stem:"A client's adrenal cortex is damaged and cannot secrete cortisol. Which laboratory pattern does the nurse expect?",
opts:[{t:"Corticotropin-releasing hormone and adrenocorticotropic hormone are both increased.",c:1,r:"Low cortisol removes the inhibition. The hypothalamus and anterior pituitary keep signaling."},
{t:"Corticotropin-releasing hormone is increased and adrenocorticotropic hormone is decreased.",r:"The releasing hormone stimulates the pituitary, so the pituitary hormone rises too."},
{t:"Both hormones are decreased.",r:"That pattern follows high cortisol, such as steroid drug therapy."},
{t:"Both hormones are unchanged because the pituitary is healthy.",r:"A healthy pituitary responds to low cortisol by increasing output."}],
why:"Negative feedback: the response opposes the change that started it. When the last gland in the chain fails, the glands above it increase their signals.",
plain:"When the worker does not answer, the boss shouts louder."},

{ch:53,need:N.pa,skill:S.ac,type:SATA,src:"Iggy Ch. 53, Adrenal Cortex",
stem:"Which conditions would trigger increased aldosterone secretion? Select all that apply.",
opts:[{t:"Blood loss of 800 mL",c:1,r:"A fall in extracellular fluid volume triggers renin release, which leads to aldosterone secretion."},
{t:"Serum potassium of 5.4 mEq/L",c:1,r:"A rise in potassium of as little as 0.1 mEq/L above normal triggers aldosterone."},
{t:"Sodium loss from heavy sweating",c:1,r:"Sodium loss triggers renin release."},
{t:"Hypoxemia",c:1,r:"Hypoxemia also triggers renin release."},
{t:"Serum potassium of 3.1 mEq/L",r:"Aldosterone promotes potassium excretion. Low potassium does not trigger it."},
{t:"Fluid overload with a serum sodium of 149 mEq/L",r:"Volume excess suppresses the renin-angiotensin-aldosterone system."}],
why:"Aldosterone keeps sodium and water and gets rid of potassium. Anything that drops volume or raises potassium turns it on.",
plain:"Aldosterone is the body's salt-and-water saver. It switches on when the tank is low or potassium is high."},

{ch:53,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 53, Hypothalamus and Pituitary Glands; Table 53.3",
stem:"A tumor compresses the nerve fibers of the hypophysial stalk. Which finding does the nurse expect first?",
opts:[{t:"Large volumes of dilute urine",c:1,r:"Vasopressin is made in the hypothalamus and travels down the stalk to be stored in the posterior pituitary."},
{t:"Weight gain with cold intolerance",r:"That reflects low thyroid-stimulating hormone from the anterior pituitary."},
{t:"Low blood glucose with postural hypotension",r:"That reflects low adrenocorticotropic hormone from the anterior pituitary."},
{t:"Loss of facial and body hair",r:"That reflects low gonadotropins from the anterior pituitary."}],
why:"The anterior pituitary receives its signals through a small blood portal system. The posterior pituitary depends on nerve fibers in the stalk. The distractors are all real pituitary deficiencies from the other lobe.",
plain:"The water-saving hormone travels down a nerve cable. Squeeze the cable and the body cannot hold water."},

{ch:53,hard:1,need:N.saf,skill:S.ta,type:MC,src:"Iggy Ch. 53, Box 53.5",
stem:"The nurse supervises a new nurse who is collecting blood for hormone testing. Which action requires intervention?",
opts:[{t:"Drawing the sample from one port of a triple-lumen central catheter after flushing it",c:1,r:"A double- or triple-lumen line is not used. Contamination or dilution from another port is possible."},
{t:"Placing a catecholamine sample on ice and taking it to the laboratory immediately",r:"Correct handling."},
{t:"Calling the laboratory to confirm the tube type and timing before the draw",r:"Correct. Handling varies by test."},
{t:"Reminding the client to set an alarm for a test drug that is due during the night",r:"Correct. A drug given as part of a test must be taken on time."}],
why:"Three actions are exactly what the textbook directs. The flush makes the wrong action sound careful, but a multi-lumen line is not used at all.",
plain:"A line with several channels can leak a little of one channel into another and spoil the test."},

{ch:53,need:N.moc,skill:S.ta,type:MC,src:"Iggy Ch. 53, Age-Related Endocrine System Changes",
stem:"An 84-year-old client has no fluid restriction. Which instruction does the nurse give assistive personnel because of age-related endocrine change?",
opts:[{t:"“Offer fluids at least every 2 hours while the client is awake.”",c:1,r:"Vasopressin production falls with age. Urine stays dilute even when intake is low, so dehydration risk is high."},
{t:"“Limit fluids after noon to reduce nighttime urination.”",r:"This increases dehydration risk."},
{t:"“Decide whether the client looks dehydrated and tell me at the end of the shift.”",r:"Assessment is not delegated, and the report would be late."},
{t:"“Keep the room cool because older adults produce more body heat.”",r:"Metabolism decreases with age. Older adults have less tolerance for cold."}],
why:"The task is within the role of assistive personnel, and it targets the real risk. The nurse still assesses for dehydration frequently.",
plain:"Older kidneys keep letting water go. Keep the drinks coming."},

{ch:53,hard:1,need:N.hp,skill:S.rc,type:MX,src:"Iggy Ch. 53, Age-Related Endocrine System Changes",
stem:"The nurse assesses a 79-year-old client. For each finding, choose the correct interpretation.",
cols:["Expected with aging","Assess further for an endocrine disorder"],
rows:[{t:"Wears a sweater indoors; less tolerance for cold",a:0},
{t:"Body temperature consistently below 97°F (36°C)",a:1},
{t:"Skin thinner and drier than in past years",a:0},
{t:"Leg wound that has not healed in 3 weeks",a:1},
{t:"Heart rate consistently 52 beats per minute",a:1},
{t:"Urine more dilute than in past years",a:0},
{t:"Constipation that is a change from the usual bowel pattern",a:1}],
why:"Aging lowers general metabolism, so cold intolerance and a smaller appetite are expected. A temperature consistently below 97°F, a heart rate consistently below 60, lethargy, slowed speech, and new constipation call for further assessment. A wound that fails to heal in 2 weeks calls for diabetes testing.",
plain:"A little slower and a little colder is normal with age. Very cold, very slow, or not healing is not."},

{ch:53,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 53, Auscultation; Inspection",
stem:"The nurse hears a bruit with the stethoscope over a client's visibly enlarged thyroid gland. How does the nurse interpret this finding?",
opts:[{t:"Enlargement of the gland has increased blood flow through it.",c:1,r:"Hypertrophy of the thyroid increases vascular flow, which may produce a bruit."},
{t:"The client has fluid overload.",r:"Fluid overload shows as jugular vein distention on neck inspection."},
{t:"A nodule is compressing the trachea.",r:"Compression causes breathing or swallowing difficulty, not a vascular sound."},
{t:"The finding is normal and needs no documentation.",r:"A bruit over the thyroid is abnormal and is documented."}],
why:"Match the sound to its source. A bruit is turbulent blood flow.",
plain:"A bigger gland needs more blood. More blood rushing through makes a whooshing sound."},

{ch:53,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 53, Inspection (skin)",
stem:"A client has darkened skin over the knuckles and along an old surgical scar, with patchy loss of pigment on both hands. Which gland problem does the nurse suspect?",
opts:[{t:"Primary hypofunction of the adrenal glands",c:1,r:"High adrenocorticotropic hormone and melanocyte-stimulating hormone darken joints and scars. Vitiligo comes from autoimmune destruction of melanocytes."},
{t:"Adrenocortical excess",r:"That causes striae, bruising, truncal obesity, and slow wound healing."},
{t:"Underactive thyroid",r:"That causes brittle nails and coarse, dry skin."},
{t:"Low gonadal hormone levels",r:"That changes body hair distribution and breast tissue."}],
why:"Two opposite pigment changes in one client point to the same gland. The distractors are skin findings of other endocrine disorders.",
plain:"When the adrenal glands fail, the brain's 'work harder' signal also tells skin to make more color."},

{ch:53,need:N.rr,skill:S.ac,type:MX,src:"Iggy Ch. 53, Physical Assessment: Inspection",
stem:"For each finding, choose the hormone problem it most suggests.",
cols:["Adrenocortical excess","Thyroid problem","Low gonadal hormone level"],
rows:[{t:"Fat pad between the shoulders with truncal obesity",a:0},

{t:"Breast enlargement in a man",a:2},
{t:"Protruding eyeballs with retracted upper lids",a:1},
{t:"Reddish-purple striae on the breasts and abdomen",a:0},
{t:"Sparse pubic hair",a:2}],
why:"Inspection findings are grouped by the hormone involved. Low testosterone causes gynecomastia. Hypogonadism changes the amount and pattern of pubic hair.",
plain:"Each gland leaves its own fingerprints on the body."},

{ch:53,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 53, Provocative/Suppression Tests",
stem:"A client suspected of having an underactive gland receives a measured dose of a stimulating hormone. The target hormone level does not rise. How does the nurse interpret the result?",
opts:[{t:"The gland is hypofunctioning.",c:1,r:"Failure of the level to rise with provocation indicates hypofunction."},
{t:"The gland is hyperfunctioning.",r:"Hyperfunction is shown by failure to suppress."},
{t:"Negative feedback is working normally.",r:"A normal gland would respond to the stimulus."},
{t:"The result is unreliable because hormones are released in pulses.",r:"Stimulation testing is used precisely because single levels are hard to interpret."}],
why:"Provocative and suppression tests are mirror images. Keep them straight: no rise means too little, no fall means too much.",
plain:"Poke a sleepy gland. If it still does nothing, it is not working."},

{ch:53,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 53, Glucose Tests",
stem:"A client says, “I ate perfectly for three days so my blood test would look good.” Which test result is least affected by the client's recent change in eating?",
opts:[{t:"Glycosylated hemoglobin (A1C)",c:1,r:"It reflects the average blood glucose over the previous 100 to 120 days."},
{t:"Fasting blood glucose",r:"Reflects the current state and is affected by recent intake."},
{t:"Random blood glucose",r:"Reflects the moment of the draw."},
{t:"Oral glucose tolerance test",r:"Measures the response to a glucose load on the day of testing."}],
why:"Glucose attaches to hemoglobin for the life of the red blood cell, so a few careful days change very little.",
plain:"This test is a three-month report card, not a pop quiz."},

{ch:53,need:N.rr,skill:S.gs,type:SATA,src:"Iggy Ch. 53, Laboratory Assessment",
stem:"Which hormones can be accurately measured with a saliva specimen? Select all that apply.",
opts:[{t:"Cortisol",c:1,r:"A steroid hormone. Salivary levels reflect blood levels."},
{t:"Testosterone",c:1,r:"A steroid hormone."},
{t:"Estradiol",c:1,r:"A steroid hormone."},
{t:"Progesterone",c:1,r:"A steroid hormone."},
{t:"Thyroid-stimulating hormone",r:"A protein hormone from the pituitary. Not assessed with saliva."},
{t:"Growth hormone",r:"A protein hormone from the pituitary. Not assessed with saliva."}],
why:"Steroid hormones can be measured in saliva. Protein hormones from the pituitary and thyroid cannot.",
plain:"Small, fatty hormones slip into spit. Big protein hormones do not."},

{ch:53,need:N.rr,skill:S.gs,type:MX,src:"Iggy Ch. 53, Imaging Assessment; Other Diagnostic Assessment",
stem:"For each structure, choose the imaging method the nurse expects to be used.",
cols:["MRI with contrast","CT scan","Ultrasound"],
rows:[{t:"Pituitary gland (most sensitive method)",a:0},{t:"Adrenal glands",a:1},{t:"Thyroid nodule, with fine needle aspiration",a:2},{t:"Pancreas",a:1},{t:"Parathyroid glands",a:2}],
why:"MRI with contrast is the most sensitive for the pituitary. CT is usual for the adrenal glands, ovaries, and pancreas. Ultrasound evaluates the thyroid, parathyroid glands, ovaries, and testes, and guides fine needle aspiration of thyroid nodules.",
plain:"Brain gland: magnet scan. Belly glands: CT. Neck glands: sound waves."},

{ch:53,hard:1,need:N.rr,skill:S.gs,type:MC,src:"Iggy Ch. 53, Imaging Assessment (thyroid scan)",
stem:"A client is scheduled for a thyroid scan. Which information does the nurse give?",
opts:[{t:"“You will swallow a pill that contains radioactive iodine, and the images are taken 4 to 6 hours later.”",c:1,r:"The iodine collects in the thyroid and is then imaged."},
{t:"“You will receive the radioactive iodine by IV, and the images are taken right away.”",r:"The iodine is taken as a pill and needs hours to collect in the gland."},
{t:"“After the scan you must stay 6 feet from children and pregnant women for a week.”",r:"That precaution belongs to radioactive iodine therapy, not to this diagnostic scan."},
{t:"“A thin needle will be passed into the gland during the scan.”",r:"That describes fine needle aspiration, a separate procedure."}],
why:"Each distractor is true of a different thyroid procedure. The diagnostic scan and the treatment both use radioactive iodine, which is why they are confused.",
plain:"Swallow a tiny tracer, wait a few hours while the gland soaks it up, then take the picture."},

{ch:53,need:N.hp,skill:S.rc,type:MC,src:"Iggy Ch. 53, Nutrition History; Box 53.3",
stem:"Which client's diet history most concerns the nurse about the ability to make thyroid hormone?",
opts:[{t:"Eats no dairy, eggs, or seafood and cooks only with non-iodized sea salt",c:1,r:"The body cannot make iodine. Dairy, eggs, saltwater fish, shellfish, seaweed, and iodized salt are the common sources, and this client has none."},
{t:"Eats yogurt every day and avoids red meat",r:"Dairy supplies iodine."},
{t:"Eats tuna twice a week and avoids bread",r:"Saltwater fish supplies iodine."},
{t:"Avoids dairy and takes an iodine-containing multivitamin each day",r:"The multivitamin supplies iodine."}],
why:"Look for the client with no source at all. Each of the others has one source that covers the need.",
plain:"The thyroid needs iodine as a building block. No iodine in, no hormone out."},

{ch:53,hard:1,need:N.rr,skill:S.ph,type:MC,src:"Iggy Ch. 53, Nutrition History; Auscultation",
stem:"A client reports months of fatigue and says, “I put salt on everything now. I crave it.” Which assessment does the nurse perform next?",
opts:[{t:"Blood pressure and pulse lying, sitting, and standing",c:1,r:"Salt craving is triggered by adrenal hypofunction. Some endocrine problems cause dehydration and volume depletion, which show as orthostatic changes."},
{t:"Inspection of the lower neck while the client swallows",r:"A thyroid assessment. Rapid weight change without diet change would point here."},
{t:"Questions about how often the client urinates at night",r:"Excessive thirst and urination point to vasopressin deficiency or diabetes mellitus."},
{t:"Height, weight, and fat distribution",r:"Part of a general inspection, but it does not test the suspected volume problem."}],
why:"The stem contains one cue, and each option follows a different cue. Follow the cue you were given.",
plain:"Craving salt can mean the body is losing salt and water. Check whether the blood pressure drops on standing."},

stem:"A client's cortisol level is the same at 0800 and at 2000. Both values are at the top of the morning reference range. How does the nurse interpret this?",
opts:[{t:"The normal daily pattern is absent; the evening level should be much lower.",c:1,r:"Glucocorticoid release peaks in the morning and reaches its lowest level about 12 hours later."},
{t:"Both values are within range, so the result is normal.",r:"Each value must be read against the time it was drawn."},
{t:"The morning sample was probably drawn incorrectly.",r:"Nothing suggests a collection error."},
{t:"The pattern shows adrenal hypofunction.",r:"Hypofunction produces low levels."}],

{ch:53,need:N.psy,skill:S.ta,type:MC,src:"Iggy Ch. 53, Psychosocial Assessment",
stem:"A client with an endocrine disorder looks in the mirror and says, “I don't even look like myself anymore.” Which response by the nurse is most therapeutic?",

{t:"“Many clients with this condition look the same way.”",r:"Minimizes the client's feelings."},
{t:"“Let's review your medication schedule so you stay on track.”",r:"Changes the subject."}],
why:"Body features can change greatly with pituitary, adrenal, and thyroid disorders. The nurse's role is to invite the client to talk.",
plain:"Do not fix it or brush it off. Ask and listen."},

{t:"Morphine",c:1,r:"Opiates are a listed drug cause."},
{t:"Lisinopril",r:"Not a listed cause."},
{t:"Metformin",r:"Not a listed cause. The antidiabetic drugs listed are chlorpropamide and tolbutamide."},
{t:"Age over 65",r:"Age raises the risk of complications, but it is not a listed cause."}],
why:"Sodium fell from 137 to 124 with concentrated urine and weight gain. Three separate triggers are present at once. The nurse reports all of them so the team can decide what can be changed.",
plain:"A sick lung and two of her medicines are all telling the body to hold on to water."},

{ch:54,cs:"54d",hard:1,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 54, SIADH: Assessment; Interventions",chart:C54D,
stem:"Four hours later the nurse reassesses. Which finding shows the client is getting worse and must be reported?",
opts:[{t:"New crackles in both lungs with shortness of breath",c:1,r:"Fluid overload is progressing toward pulmonary edema, which can develop quickly and cause death."},
{t:"No ankle edema",r:"Expected. Free water is retained, not salt, so dependent edema is usually absent."},
{t:"Urine specific gravity 1.034",r:"Expected. The urine is concentrated."},
{t:"Decreased deep tendon reflexes",r:"Expected with hyponatremia. Already present on the first assessment."}],
why:"Every option is an abnormal finding in a client with this disorder. Three are part of the baseline picture. The nurse checks for bounding pulse, neck vein distention, crackles, dyspnea, and falling urine output at least every 2 hours.",
plain:"The extra water has started to fill the lungs."},

{ch:54,cs:"54d",need:N.pa,skill:S.eo,type:MX,src:"Iggy Ch. 54, SIADH: Interventions",chart:C54D,
stem:"Fluid restriction and drug therapy are started. The next day, for each finding choose whether the client is improving.",
cols:["Improving","Not improving"],
rows:[{t:"Weight down 1.1 kg",a:0},
{t:"Serum sodium 130 mEq/L",a:0},
{t:"Neck veins newly distended with a bounding pulse",a:1},
{t:"Oriented, no muscle twitching, headache gone",a:0},
{t:"Urine output 15 mL/hr with specific gravity 1.034",a:1}],
why:"A 1-kg loss equals about 1 L of water removed. Sodium is rising at a safe pace. Low output of concentrated urine and neck vein distention mean water is still being retained.",
plain:"Lighter, clearer in the head, and more salt in the blood: better. Still holding water: not better."},

/* ---- adrenal insufficiency ---- */
{ch:54,cs:"54e",need:N.pa,skill:S.ac,type:CZ,src:"Iggy Ch. 54, Adrenal Gland Hypofunction: Pathophysiology; Assessment",chart:C54E,
stem:"Complete the statements.",
parts:["The findings indicate ",{o:["primary","secondary"],a:0}," adrenal insufficiency. The finding that separates the two types is ",
{o:["darkened skin with an elevated adrenocorticotropic hormone level","a low sodium level","a low glucose level"],a:0},
". In the other type, secretion of ",{o:["aldosterone","cortisol","adrenal androgens"],a:0}," is preserved."],
why:"In primary disease the adrenal gland fails, so the pituitary raises adrenocorticotropic hormone and melanocyte-stimulating hormone, which darkens the skin. Autoimmune disease can also cause vitiligo. In secondary disease the pituitary signal is low, skin color is unchanged, and mineralocorticoid function is preserved.",
plain:"If the gland itself is broken, the brain shouts at it, and the shouting darkens the skin."},

{ch:54,cs:"54e",hard:1,need:N.pa,skill:S.ta,type:MC,src:"Iggy Ch. 54, Adrenal Gland Hypofunction: Diagnostic Assessment; Box 54.7",chart:C54E,
stem:"While waiting for an adrenocorticotropic hormone stimulation test, the client becomes confused. Blood pressure is 74/40. Which action does the nurse take?",
opts:[{t:"Report the change now and prepare for a rapid saline infusion and IV hydrocortisone without waiting for the test.",c:1,r:"When acute adrenal insufficiency is suspected, treatment starts without stimulation testing."},
{t:"Complete the stimulation test first because it is the most definitive test.",r:"True that it is the most definitive test, but it delays lifesaving treatment."},
{t:"Give the first dose of oral fludrocortisone.",r:"A maintenance mineralocorticoid. It does not treat a crisis."},
{t:"Give two-thirds of the daily oral prednisone dose now.",r:"That is the maintenance schedule. A crisis needs IV fluid and an IV glucocorticoid bolus."}],
why:"Each option names a real part of care for this disease. The stem describes a crisis, and only one option is crisis care.",
plain:"Do not wait for the test when the blood pressure is crashing. Fluids and the missing hormone come first."},

{ch:54,cs:"54e",need:N.ph,skill:S.ta,type:SATA,src:"Iggy Ch. 54, Table 54.3; Drug Alert (prednisone); Interventions",chart:C54E,
stem:"The client is discharged on prednisone and fludrocortisone. Which instructions does the nurse include? Select all that apply.",
opts:[{t:"Report rapid weight gain, a rounder face, or swelling.",c:1,r:"Signs of excessive drug therapy and a possible need for a dose change."},
{t:"Have your blood pressure checked regularly.",c:1,r:"Hypertension is a potential side effect of fludrocortisone."},
{t:"Your dose may need to change in hot weather.",c:1,r:"More sodium is lost with heavy perspiration."},
{t:"Check with your provider before starting a low-salt diet or a diuretic.",c:1,r:"Salt restriction or diuretic therapy can lead to an adrenal crisis."},
{t:"If the pharmacy is out of prednisone, prednisolone at the same dose is fine.",r:"The two are not interchangeable. Prednisolone is more potent."},
{t:"Wear your medical alert bracelet when you travel.",r:"It is worn at all times."}],
why:"The client must watch for both too much drug and too little, and must know that ordinary advice such as cutting salt can be dangerous for this condition.",
plain:"This body cannot hold salt on its own, so 'eat less salt' is bad advice here."},

/* ---- hypercortisolism (six-item case) ---- */
{ch:54,cs:"54f",need:N.rr,skill:S.rc,type:HL,src:"Iggy Ch. 54, Cushing Syndrome: Assessment; Restoring Fluid Volume Balance",chart:C54F,
stem:"Select the findings that require follow-up.",
segs:[{t:"Blood pressure 172/98 mm Hg",c:1},{t:"potassium 3.1 mEq/L",c:1},{t:"crackles in both lung bases",c:1},{t:"2+ ankle edema",c:1},{t:"fasting glucose 212 mg/dL",c:1},{t:"skin tear where tape was removed",c:1},
{t:"temperature 98.6°F",c:0},{t:"SpO₂ 97%",c:0},{t:"respirations 16",c:0},{t:"alert and oriented",c:0}],
why:"Sodium and water retention cause hypertension, edema, and crackles. Low potassium can cause dysrhythmias. High glucose and fragile skin raise the risk of infection and injury.",
plain:"Too much fluid, too little potassium, too much sugar, and skin that tears."},

{ch:54,cs:"54f",hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 54, Cushing Syndrome: Laboratory Assessment",chart:C54F,
stem:"How does the nurse interpret the laboratory pattern?",
opts:[{t:"The excess cortisol is coming from the adrenal gland itself.",c:1,r:"Cortisol is high and is not suppressed, while adrenocorticotropic hormone is low. The client takes no steroids."},
{t:"A pituitary tumor is secreting adrenocorticotropic hormone.",r:"In the pituitary form, adrenocorticotropic hormone is elevated."},
{t:"A lung tumor is secreting adrenocorticotropic hormone.",r:"The hormone level would be elevated, not low."},
{t:"The disorder is not present because cortisol was measured after dexamethasone.",r:"The disorder is ruled out only when dexamethasone suppresses cortisol. It did not."}],
why:"Read two values together. High cortisol with a high pituitary signal means the pituitary is driving it. High cortisol with a low pituitary signal means the adrenal gland, or a steroid drug, is the source.",
plain:"The boss has gone quiet but the worker is still overproducing. The problem is the worker."},

{ch:54,cs:"54f",need:N.pa,skill:S.ph,type:MC,src:"Iggy Ch. 54, Cushing Syndrome: Analysis; Restoring Fluid Volume Balance",chart:C54F,
stem:"Which problem is the priority for this client today?",
opts:[{t:"Fluid overload that can progress to pulmonary edema and heart failure",c:1,r:"Crackles, edema, bounding pulse, and hypertension are present now. Pulmonary edema can occur quickly."},
{t:"Potential for fragility fracture",r:"A real risk, but no injury is occurring."},
{t:"Potential for infection",r:"A real risk, but there are no cues of infection."},
{t:"Disturbed body image",r:"Important, and addressed once physiologic problems are controlled."}],
why:"The textbook lists three priority problems. An actual problem with current cues outranks potential problems.",
plain:"The lungs are already starting to collect fluid."},

{ch:54,cs:"54f",need:N.rr,skill:S.gs,type:SATA,src:"Iggy Ch. 54, Cushing Syndrome: Preoperative Care",chart:C54F2,
stem:"Which interventions belong in the plan of care before surgery? Select all that apply.",
opts:[{t:"Cardiac monitoring",c:1,r:"Dysrhythmias from potassium imbalance may occur."},
{t:"A glucocorticoid preparation before surgery",c:1,r:"Removing the tumor causes a sudden drop in cortisol. Glucocorticoids before and during surgery prevent adrenal crisis."},
{t:"A high-calorie, high-protein diet",c:1,r:"Ordered before surgery."},
{t:"Top side rails up and a reminder to call for help before getting out of bed",c:1,r:"Muscle weakness and bone density loss raise the risk of falls and fractures."},
{t:"Withhold all steroids for 48 hours to lower the cortisol level",r:"The opposite is done. Glucocorticoids are given."},
{t:"Encourage extra oral fluids and added salt",r:"Sodium and water are already retained. Fluid and sodium may be restricted."}],
why:"Preoperative care corrects fluid and electrolyte disturbances, controls glucose, prevents infection and falls, and protects against the cortisol drop that follows removal of the tumor.",
plain:"The body is used to a flood of this hormone. Taking the tumor out without a backup supply would cause a crash."},

{ch:54,cs:"54f",hard:1,need:N.pa,skill:S.ta,type:MC,src:"Iggy Ch. 54, Cushing Syndrome: Postoperative Care",chart:C54F3,
stem:"Review the postoperative entry. Which action does the nurse take?",
opts:[{t:"Report the findings immediately and anticipate additional IV glucocorticoid.",c:1,r:"Hypotension, a rapid weak pulse, and falling urine output after adrenalectomy indicate shock from insufficient glucocorticoid replacement."},
{t:"Increase the IV rate and reassess in 1 hour.",r:"The client is assessed every 15 minutes. Fluid alone does not replace the missing hormone."},
{t:"Give the prescribed opioid; the tachycardia is from pain.",r:"Pain is 3 of 10. An opioid would lower the blood pressure further."},
{t:"Reinforce the dressing and continue to monitor for bleeding.",r:"The dressing is dry and the drain output is minimal."}],
why:"The stem removes bleeding and pain as explanations. What is left is the complication specific to this surgery.",
plain:"The gland that made the stress hormone is gone, and the body is running out."},

{ch:54,cs:"54f",need:N.hp,skill:S.eo,type:MX,src:"Iggy Ch. 54, Cushing Syndrome: Self-Management Education; Preventing Injury; Preventing Infection",chart:C54F3,
stem:"Before discharge, the client makes these statements. For each, choose whether teaching was effective.",
cols:["Teaching effective","Needs further teaching"],
rows:[{t:"“I will call if I gain more than 3 pounds in a week or 1 to 2 pounds in a day.”",a:0},
{t:"“My skin will stay fragile for a while, so I will use an electric shaver and a soft toothbrush.”",a:0},
{t:"“I still have one adrenal gland, so I can stop the hydrocortisone when I feel well.”",a:1},
{t:"“I will take the antacid only when my stomach hurts.”",a:1},
{t:"“I will cut back on coffee and alcohol.”",a:0},
{t:"“A temperature of 100°F is not worth a phone call.”",a:1}],
why:"After removal of one gland, replacement continues until the remaining gland increases production, which may take up to 2 years. Antacids are taken on a regular schedule. Any fever is reported at once because infection signs are muted.",
plain:"The leftover gland has been asleep. It needs months of help before it can work alone."},

/* ---- hyperaldosteronism ---- */
{ch:54,cs:"54g",need:N.pa,skill:S.ac,type:MX,src:"Iggy Ch. 54, Hyperaldosteronism: Pathophysiology",chart:C54G,
stem:"For each finding, choose whether it is expected with this client's disorder.",
cols:["Expected","Not expected"],
rows:[{t:"Potassium 2.9 mEq/L",a:0},{t:"Arterial pH 7.49",a:0},{t:"Low plasma renin",a:0},{t:"Urine specific gravity 1.004",a:0},{t:"Blood glucose 58 mg/dL",a:1},{t:"Darkened skin over the knuckles",a:1}],
why:"Excess aldosterone makes the kidney keep sodium and excrete potassium and hydrogen ions. The result is hypernatremia, hypokalemia, metabolic alkalosis, and high blood pressure. Renin is low and urine specific gravity is low. Low glucose and skin darkening belong to adrenal insufficiency.",
plain:"Too much of the salt-saving hormone: salt and pressure go up, potassium and acid go down."},

{ch:54,cs:"54g",hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 54, Hyperaldosteronism: Pathophysiology",chart:C54G,
stem:"The client reports new tingling in the hands and feet. How does the nurse interpret this?",
opts:[{t:"Potassium depletion has become severe.",c:1,r:"Paresthesias may occur when potassium depletion is severe."},
{t:"Calcium has fallen and tetany is developing.",r:"Tingling from hypocalcemia follows parathyroid injury. Nothing here points to it."},
{t:"Sodium has fallen from drug therapy.",r:"Hyponatremia can occur with spironolactone, but it causes weakness, dizziness, lethargy, or drowsiness."},
{t:"High blood glucose has damaged peripheral nerves.",r:"Neuropathy from hyperglycemia develops slowly over years."}],
why:"Tingling appears in several endocrine disorders, each with a different electrolyte behind it. Match the symptom to the disorder in front of you. The nurse checks the potassium level and the cardiac rhythm.",
plain:"So much potassium has been lost that the nerves are starting to misfire."},

{ch:54,cs:"54g",need:N.ph,skill:S.eo,type:MC,src:"Iggy Ch. 54, Hyperaldosteronism: Interprofessional Collaborative Care",chart:C54G,
stem:"Surgery is planned. Spironolactone and a potassium supplement are started. Which result shows the preoperative therapy has met its goal?",
opts:[{t:"Potassium 4.0 mEq/L",c:1,r:"The potassium level must be corrected before surgery."},
{t:"Potassium 5.7 mEq/L",r:"Overcorrection. Spironolactone spares potassium, and hyperkalemia can occur."},
{t:"Sodium 128 mEq/L",r:"Hyponatremia can occur with spironolactone. It is an adverse effect."},
{t:"Urine specific gravity 1.003",r:"Unchanged from baseline. It does not show the goal was met."}],
why:"The goal is a normal potassium level. Going past it is a new problem, not a better result.",
plain:"Fill the potassium back up to normal, and stop there."},

/* ---- hypophysectomy teaching ---- */
{ch:54,hard:1,need:N.hp,skill:S.eo,type:MC,src:"Iggy Ch. 54, Hypophysectomy: Postoperative Care; Box 54.3",
stem:"A client is going home after transsphenoidal hypophysectomy. Which statement indicates a need for further teaching?",
opts:[{t:"“I will brush my teeth gently with a soft brush starting tomorrow.”",c:1,r:"Toothbrushing is avoided for about 2 weeks. Mouth rinses and daily flossing are used."},
{t:"“It is normal if I cannot smell well for a few months.”",r:"Correct. A decreased sense of smell is expected and usually lasts 3 to 4 months."},
{t:"“I will bend my knees to pick something up off the floor.”",r:"Correct. Bending at the waist raises intracranial pressure."},

plain:"In this disease a small fever is an alarm bell. Check the heart, then call."},

/* ---- thyroiditis ---- */
{ch:55,cs:"55c",need:N.pa,skill:S.ac,type:MX,src:"Iggy Ch. 55, Thyroiditis",chart:C55C,
stem:"The nurse reviews the types of thyroiditis. For each description, choose the type.",
cols:["Subacute (viral)","Infectious (bacterial)","Chronic autoimmune","Radiation"],
rows:[{t:"Neck pain and a hard, enlarged gland after an upper respiratory infection",a:0},
{t:"Sudden pain and tenderness on one side of the neck with fever; resolves with IV antibiotics",a:1},
{t:"Painless enlargement with difficulty swallowing and elevated antithyroid peroxidase antibody",a:2},
{t:"Mild symptoms 5 to 10 days after radioiodine treatment that disappear within a week",a:3}],
why:"This client's history of a recent cold, neck pain, and a hard enlarged gland fits the subacute type.",
plain:"After a cold: viral. One-sided with fever: bacterial. Painless with antibodies: the immune system. After radiation treatment: radiation."},

{ch:55,cs:"55c",hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 55, Thyroiditis (subacute)",chart:C55C,
stem:"Three weeks later the client returns with fatigue, constipation, and feeling cold. Heart rate is 58. How does the nurse interpret this change?",
opts:[{t:"It is the expected next phase, and thyroid function usually returns to normal afterward.",c:1,r:"The typical pattern is hyperthyroidism, then hypothyroidism, followed by a return to normal levels."},
{t:"The gland is permanently destroyed, and lifelong replacement will be needed.",r:"That outcome belongs to chronic autoimmune thyroiditis when large amounts of the gland are destroyed."},
{t:"The infection has spread and IV antibiotics are needed.",r:"This type is viral. IV antibiotics treat the bacterial type."},
{t:"Thyroid storm is developing.",r:"Thyroid storm presents with high fever and tachycardia."}],
why:"The client moved from 'wired' with a heart rate of 108 to slow and cold. Knowing the usual course keeps the nurse from treating a passing phase as a new disease.",
plain:"The inflamed gland dumped its hormone, then ran low, and will usually recover."},

{ch:55,cs:"55c",need:N.hp,skill:S.eo,type:MC,src:"Iggy Ch. 55, Thyroiditis (chronic autoimmune); Hypothyroidism: Etiology",chart:C55C,
stem:"The client's sister has painless thyroid enlargement, difficulty swallowing, and an elevated antithyroid peroxidase antibody. Which outcome does the nurse expect for the sister?",
opts:[{t:"Hypothyroidism that requires lifelong thyroid hormone replacement",c:1,r:"Antibodies and lymphocytes destroy thyroid tissue. When large amounts are destroyed, hypothyroidism results. This is the most common cause of hypothyroidism in the United States."},
{t:"A return to normal function without treatment within a few months",r:"That is the usual course of the subacute viral type."},
{t:"Hyperthyroidism that requires radioactive iodine",r:"The destruction lowers hormone secretion."},
{t:"Resolution after a course of IV antibiotics",r:"That is the bacterial type."}],
why:"Two family members, two types of thyroiditis, two different outcomes.",
plain:"Her immune system is slowly wearing the gland out. She will need the pill for life."},

/* ---- thyroid cancer ---- */
{ch:55,cs:"55d",hard:1,need:N.rr,skill:S.rc,type:MC,src:"Iggy Ch. 55, Thyroid Cancer; Thyroiditis; Hyperthyroidism",chart:C55D,
stem:"Which presentation is most typical of thyroid cancer at the time it is first found?",
opts:[{t:"A single, painless lump in the thyroid gland",c:1,r:"The initial sign is typically a single, painless lump or nodule."},
{t:"A hard, enlarged, painful gland after a cold",r:"Subacute thyroiditis."},
{t:"A diffusely enlarged gland with a bruit and protruding eyes",r:"Graves disease."},
{t:"Painless enlargement of the whole gland with difficulty swallowing and antithyroid antibodies",r:"Chronic autoimmune thyroiditis."}],
why:"Each option is a real way a thyroid problem presents. Two of the distractors are also painless, so 'painless' alone does not answer the question. 'Single nodule' does.",
plain:"One quiet lump that does not hurt is the usual first sign."},

{ch:55,cs:"55d",need:N.pa,skill:S.gs,type:MX,src:"Iggy Ch. 55, Thyroid Cancer: Pathophysiology; Interprofessional Collaborative Care",chart:C55D,
stem:"For each statement, choose the type of thyroid cancer it describes.",
cols:["Papillary","Follicular","Medullary","Anaplastic"],
rows:[{t:"Most common type; slow-growing",a:0},
{t:"Invades blood vessels and spreads to bone and lung",a:1},
{t:"Can occur as part of a familial endocrine disorder",a:2},
{t:"Radioactive iodine is not used for treatment",a:3},
{t:"External beam radiation or chemotherapy is used most often",a:3}],
why:"This client's cancer is papillary and confined to the gland, so a cure is possible with partial or total thyroidectomy. Anaplastic carcinoma is rapidly growing and aggressive and has usually spread by diagnosis.",
plain:"Hers is the slow, common, curable kind."},

{ch:55,cs:"55d",need:N.hp,skill:S.gs,type:MC,src:"Iggy Ch. 55, Thyroid Cancer: Interprofessional Collaborative Care",chart:C55D,
stem:"The client has a total thyroidectomy followed by radioactive iodine. Which topic is the priority for long-term teaching?",
opts:[{t:"Lifelong thyroid hormone replacement and the symptoms of too little or too much hormone",c:1,r:"The client is hypothyroid after treatment. Nursing interventions focus on teaching management of hypothyroidism."},
{t:"Taking methimazole every day",r:"An antithyroid drug. There is no thyroid tissue left to suppress."},
{t:"Hospice services",r:"Thyroid cancer is very rarely fatal. Referral is made only for clients who need it."},
{t:"Avoiding all iodine-containing foods for life",r:"Not a long-term requirement in this chapter."}],
why:"After the gland is removed, the long-term nursing problem is the same as for any client with hypothyroidism.",
plain:"No thyroid means a thyroid pill every day for life."},

/* ---- hypoparathyroidism ---- */
{ch:55,cs:"55e",need:N.pa,skill:S.ac,type:MX,src:"Iggy Ch. 55, Table 55.3",chart:C55E,
stem:"For each laboratory finding, choose the disorder it supports.",
cols:["Hypoparathyroidism","Hyperparathyroidism"],
rows:[{t:"Calcium 7.2 mg/dL",a:0},{t:"Phosphorus 5.6 mg/dL",a:0},{t:"Magnesium 1.1 mEq/L",a:0},{t:"Calcium 11.9 mg/dL",a:1},{t:"Phosphorus 2.1 mg/dL",a:1},{t:"Parathyroid hormone 148 pg/mL",a:1}],
why:"Parathyroid hormone raises calcium and increases phosphorus excretion. Without it calcium falls and phosphorus rises. With too much, calcium rises and phosphorus falls. Reference ranges: calcium 9.0 to 10.5 mg/dL, phosphorus 3 to 4.5 mg/dL, magnesium 1.3 to 2.1 mEq/L, parathyroid hormone 10 to 65 pg/mL.",
plain:"Calcium and phosphorus sit on a seesaw, and this hormone decides which end is up."},

{ch:55,cs:"55e",hard:1,need:N.rr,skill:S.ph,type:MC,src:"Iggy Ch. 55, Hypoparathyroidism: Assessment",chart:C55E,
stem:"Which new finding shows that the client's hypocalcemia has become severe?",
opts:[{t:"Spasms of the hands and feet with severe muscle cramps",c:1,r:"Severe cramps, spasms of the hands and feet, and seizures reflect more severe hypocalcemia."},
{t:"Tingling around the mouth",r:"Reflects mild to moderate hypocalcemia. Already present."},
{t:"Numbness in the fingertips",r:"Reflects mild to moderate hypocalcemia."},
{t:"Irritability",r:"Mental changes range from irritability to psychosis. Irritability alone does not mark severity."}],
why:"All four are signs of low calcium. The question is where each one sits on the scale from mild to severe. Flexion of the fingers, hand, and elbow can signal an impending attack of tetany.",
plain:"Tingling is the warning. Muscles locking up is the emergency."},

{ch:55,cs:"55e",need:N.hp,skill:S.gs,type:SATA,src:"Iggy Ch. 55, Hypoparathyroidism: Interventions",chart:C55E,
stem:"Which points does the nurse include in long-term teaching? Select all that apply.",
opts:[{t:"Therapy for low calcium is lifelong.",c:1,r:"Stressed in teaching."},
{t:"Wear a medical alert bracelet.",c:1,r:"Advised for this disorder."},
{t:"Eat high-calcium foods such as milk, yogurt, and cheese in moderation.",c:1,r:"In moderation is the instruction."},
{t:"The dose is adjusted to keep your calcium in the low-normal range.",c:1,r:"High enough to prevent symptoms and low enough to prevent high urine calcium and kidney stones."},
{t:"The goal is a calcium level at the top of the normal range.",r:"A higher level raises urine calcium and the risk of kidney stones."},
{t:"You can stop the calcium once the tingling is gone.",r:"Stopping leads to recurrence and possible hypocalcemic crisis."}],
why:"Management has two goals that pull against each other: correct the low calcium and prevent kidney stones. That is why the target is low-normal.",
plain:"Enough calcium to stop the tingling, but not so much that it clogs the kidneys."},

/* ---- hyperparathyroidism ---- */
{ch:55,cs:"55f",hard:1,need:N.rr,skill:S.rc,type:MC,src:"Iggy Ch. 55, Hyperparathyroidism: Assessment",chart:C55F,
stem:"Which new finding requires the nurse to notify the provider immediately?",
opts:[{t:"New confusion",c:1,r:"When calcium is above 12 mg/dL, psychosis with confusion can develop, followed by coma and death if untreated."},
{t:"Constipation",r:"Common when calcium is high. Already reported."},
{t:"Epigastric pain",r:"Common. High calcium raises gastrin and can cause peptic ulcer disease. It needs follow-up, but it is not the most urgent."},
{t:"Worsening fatigue",r:"Fatigue and lethargy worsen as calcium rises. Confusion marks the dangerous level."}],
why:"The calcium is 12.6 mg/dL, which is past the threshold for neurologic effects. Three options are expected effects of high calcium. One is the sign of a life-threatening level.",
plain:"Too much calcium eventually clouds the brain. That is the point where it becomes dangerous."},

{ch:55,cs:"55f",hard:1,need:N.ph,skill:S.gs,type:MC,src:"Iggy Ch. 55, Hyperparathyroidism: Nonsurgical Management; Ch. 60, Table 60.5",chart:C55F,
stem:"Cinacalcet is prescribed. Which explanation does the nurse give?",
opts:[{t:"“It makes the parathyroid glands release less hormone, which lowers your calcium. You will need regular calcium checks.”",c:1,r:"It binds calcium-sensitive receptors on parathyroid tissue and reduces hormone production and release. Routine calcium monitoring is required."},
{t:"“It protects your bones by slowing bone breakdown.”",r:"That describes a bisphosphonate, the preferred drug for fracture risk."},
{t:"“It binds phosphorus in your food, so take it with meals.”",r:"That describes a phosphate binder."},
{t:"“It replaces the calcium your bones have lost.”",r:"Calcium is already high. Replacement is used in hypoparathyroidism."}],
why:"Each distractor is the correct explanation for another drug that affects calcium or bone. Know which organ each drug acts on.",
plain:"This pill tells the overactive glands that there is already plenty of calcium, so they quiet down."},

{ch:55,cs:"55f",need:N.pa,skill:S.eo,type:MC,src:"Iggy Ch. 55, Hyperparathyroidism: Surgical Management",chart:C55F2,
stem:"Review the postoperative entry. How does the nurse interpret these findings?",
opts:[{t:"Calcium is falling while the remaining glands are not yet working; check for Chvostek and Trousseau signs and report.",c:1,r:"Remaining glands may have atrophied and need days to weeks to recover. A hypocalcemic crisis can occur in this period."},
{t:"The surgery was curative and no further monitoring is needed.",r:"Surgery is typically curative, but calcium is checked frequently until it stabilizes."},
{t:"The recurrent laryngeal nerve was damaged.",r:"That causes hoarseness. The voice is clear."},
{t:"The tingling is from anxiety and rapid breathing.",r:"The calcium has dropped 4 mg/dL in a day. The tingling has a physical cause."}],
why:"A calcium of 8.6 mg/dL is only slightly low, but the direction and speed of the change and the new symptom matter more than the single number.",
plain:"The overactive gland is gone and the sleepy ones have not woken up yet, so calcium is dropping."},

/* ---- standalone ---- */
{ch:55,need:N.bcc,skill:S.gs,type:SATA,src:"Iggy Ch. 55, Hyperthyroidism: eye and vision problems",
stem:"A client with Graves disease has protruding eyes and cannot close the eyelids completely. Which instructions does the nurse give? Select all that apply.",
opts:[{t:"Raise the head of the bed at night.",c:1,r:"Taught for mild eye problems."},
{t:"Use artificial tears.",c:1,r:"Prevents dryness."},
{t:"Wear dark glasses if light bothers the eyes.",c:1,r:"Helps with photophobia."},
{t:"Gently tape the eyelids closed at bedtime.",c:1,r:"Prevents irritation and injury when the lids cannot close."},
{t:"Expect the eye changes to resolve once thyroid levels are normal.",r:"Eye problems are not usually fully corrected by treatment of the hyperthyroidism. Management is symptomatic."},
{t:"Sleep flat without a pillow.",r:"The head is elevated."}],
why:"If pressure behind the eye continues, blood supply can be compromised and blindness can result, so worsening is reported.",
plain:"The eyes cannot protect themselves, so the client keeps them wet, shaded, and covered."},

{ch:55,hard:1,need:N.moc,skill:S.ta,type:MC,src:"Iggy Ch. 55, Thyroidectomy: Preoperative and Postoperative Care",
stem:"The nurse observes assistive personnel caring for a client 3 hours after thyroidectomy. Which action requires the nurse to intervene?",
opts:[{t:"Removing the pillows and laying the client flat with the chin tilted up",c:1,r:"Positions that extend the neck are avoided. The client is in semi-Fowler's position with pillows supporting the head and neck."},
{t:"Raising the head of the bed to a semi-Fowler's position",r:"Correct position."},
{t:"Reminding the client to place both hands behind the neck before moving",r:"Correct. This reduces strain on the incision."},
{t:"Reporting that the client's voice sounds hoarse",r:"Correct. A voice change is reported to the nurse."}],
why:"Tilting the chin up is a familiar way to open an airway, which is why it is tempting. After neck surgery it pulls on the incision.",
plain:"Keep the neck supported and slightly forward. Never stretch it back."},

{ch:55,hard:1,need:N.hp,skill:S.eo,type:MC,src:"Iggy Ch. 55, Thyroid Function and Aging",
stem:"An 82-year-old client has taken levothyroxine for 4 months. Which approach gives the nurse the most reliable picture of whether therapy is effective?",
opts:[{t:"Review changes in the client's symptoms together with the laboratory values.",c:1,r:"Laboratory values alone are not relied on in older adults, because both secretion and clearance of the hormone are reduced. Symptom changes help evaluate therapy."},
{t:"Compare the thyroid-stimulating hormone level with the reference range.",r:"Useful, but not relied on alone. Older adults also tend to have higher levels."},
{t:"Test grip strength and leg strength at each visit.",r:"Muscle mass falls with age. Change in muscle strength is not used as an indicator of thyroid function."},
{t:"Track body weight.",r:"Body fat increases with age-related decreased metabolism."}],
why:"Every option is something a nurse might measure. In an older adult, two of them change with age alone and one is not enough by itself. Symptoms may also be less pronounced than in younger clients.",
plain:"In an older person the numbers do not tell the whole story. Ask how the person is actually doing."},

{ch:55,need:N.saf,skill:S.gs,type:SATA,src:"Iggy Ch. 55, Thyroidectomy: Postoperative Care",
stem:"The nurse prepares a room for a client returning from thyroidectomy. Which items must be available? Select all that apply.",
opts:[{t:"Emergency tracheostomy equipment",c:1,r:"Kept in the room in case of acute airway obstruction."},
{t:"Oxygen, checked and working",c:1,r:"Required at the bedside."},
{t:"Suction equipment, checked and working",c:1,r:"Oral and tracheal secretions are suctioned when necessary."},
{t:"Calcium gluconate for IV use",c:1,r:"Available for hypocalcemia and tetany from parathyroid injury."},
{t:"IV levothyroxine",r:"Used for myxedema coma, not for immediate postoperative emergencies."},
{t:"A sandbag to hold the neck in extension",r:"Neck extension is avoided."}],
why:"The equipment matches the complications: airway obstruction from swelling, bleeding, or nerve damage, and tetany from low calcium.",
plain:"Be ready for two emergencies: a blocked airway and a sudden drop in calcium."}
);

["Self-Care Interview","Soaks his feet in hot water every night. Uses an over-the-counter corn remover. Walks barefoot at home. Wears open-toed sandals in summer. Applies lotion between his toes. Trims nails straight across. Wears clean white cotton socks daily. Checks inside his shoes before putting them on."]];
Q.push(
/* ---- diabetic ketoacidosis (six-item case) ---- */
{ch:56,cs:"56a",need:N.rr,skill:S.rc,type:MC,src:"Iggy Ch. 56, Continuous Subcutaneous Insulin Infusion; Interventions for Preventing Diabetic Ketoacidosis",chart:C56A,
stem:"Which finding best explains why this client's condition developed?",
opts:[{t:"An infusion set left in place for 5 days, with a red, firm site",c:1,r:"The set is changed every 2 to 3 days. Infection, obstruction of the infusion, or pump problems make ketoacidosis more likely in pump users."},
{t:"Vomiting for 10 hours",r:"A classic symptom of the condition. It also worsens dehydration, but it did not stop insulin delivery."},
{t:"Serum sodium 131 mEq/L",r:"A result of the condition. Initial sodium may be low or normal."},
{t:"Respirations of 30",r:"A compensation for acidosis."}],
why:"The pump delivers only rapid-acting insulin. When delivery is interrupted there is no long-acting insulin in the body to fall back on. Infection or illness is the most common precipitating factor.",
plain:"The pump's tube was blocked and infected, so no insulin was getting in."},

{ch:56,cs:"56a",need:N.pa,skill:S.ac,type:CZ,src:"Iggy Ch. 56, Pathophysiology: Absence of Insulin; Fig. 56.12",chart:C56A,
stem:"Complete the statements.",
parts:["The arterial blood gas shows ",{o:["metabolic acidosis","respiratory acidosis","metabolic alkalosis"],a:0}," with ",
{o:["respiratory compensation","no compensation","kidney compensation only"],a:0},
". The potassium of 5.3 mEq/L reflects ",{o:["potassium moving out of cells in exchange for hydrogen ions","excess potassium intake","kidney failure with potassium retention"],a:0},
", so the nurse expects the level to ",{o:["fall once insulin and fluids are given","rise further once insulin is given","stay the same during treatment"],a:0},"."],
why:"Low pH with low bicarbonate is metabolic acidosis. The low PaCO₂ shows the lungs are blowing off acid. Acidosis shifts potassium out of cells, so the serum level can look high or normal while the body is short of potassium. Insulin, correction of acidosis, and fluids all lower the serum level.",
plain:"Potassium is hiding in the blood because the cells pushed it out. When insulin opens the cells again, it rushes back in and the blood level drops."},

{ch:56,cs:"56a",hard:1,need:N.pa,skill:S.ph,type:MC,src:"Iggy Ch. 56, Diabetic Ketoacidosis: Fluid and Electrolyte Management",chart:C56A,
stem:"What is the first outcome the nurse expects from fluid therapy during the first hour?",
opts:[{t:"Blood volume is restored and vital organs are perfused.",c:1,r:"The first outcome of fluid therapy. Typical initial rates are 15 to 20 mL/kg/hr during the first hour."},
{t:"Total body fluid losses are fully replaced.",r:"The second outcome. It is achieved more slowly, usually with hypotonic fluid."},
{t:"Blood glucose falls to 250 mg/dL.",r:"Insulin lowers glucose by about 50 to 75 mg/dL each hour. This is not a first-hour goal of fluid."},
{t:"Arterial pH returns to 7.35.",r:"Acidosis corrects as insulin stops ketone production, over many hours."}],
why:"All four are goals of treatment. They are reached in a set order, and perfusion is first. Blood pressure is 94/58 with a heart rate of 124.",
plain:"First refill the pipes so blood can reach the brain and kidneys. Everything else comes after."},

{ch:56,cs:"56a",need:N.ph,skill:S.gs,type:MX,src:"Iggy Ch. 56, Diabetic Ketoacidosis: Fluid and Electrolyte Management; Drug Therapy",chart:C56A,
stem:"For each proposed order, choose whether the nurse anticipates it or questions it.",
cols:["Anticipate","Question"],
rows:[{t:"0.9% saline at 15 to 20 mL/kg for the first hour",a:0},
{t:"Restart the insulin pump at a higher basal rate as the only insulin",a:1},
{t:"Sodium bicarbonate IV for the pH of 7.21",a:1},
{t:"Potassium chloride IV now, with the potassium at 5.3 mEq/L",a:1},
{t:"Record urine output, temperature, and mental status every hour",a:0},
{t:"Blood pressure, pulse, and respirations every 15 minutes until stable",a:0}],
why:"Unless the episode is mild, regular insulin is given by IV bolus followed by continuous infusion, because subcutaneous insulin has a delayed onset. Bicarbonate is used only when pH is 7.0 or less or bicarbonate is below 5 mEq/L. Potassium replacement starts after the level falls below 5.0 mEq/L.",
plain:"Insulin goes by vein in this emergency. The acid fixes itself once insulin is working."},

{ch:56,cs:"56a",hard:1,need:N.ph,skill:S.ta,type:MC,src:"Iggy Ch. 56, Diabetic Ketoacidosis: Drug Therapy; Fluid and Electrolyte Management",chart:C56A2,
stem:"Review the Hour 1 entry. Which action does the nurse take?",
opts:[{t:"Notify the provider now; glucose is falling faster than the target rate.",c:1,r:"The target is a fall of about 50 to 75 mg/dL per hour. A fall of 168 mg/dL in 1 hour risks a rapid drop in serum osmolarity and cerebral edema."},
{t:"Continue the infusion; a faster fall means the client will recover sooner.",r:"Rapid correction is the danger, and the client has a new headache."},
{t:"Stop the insulin infusion until the glucose rises again.",r:"Insulin is still needed to stop ketone production. The rate is adjusted by prescription."},
{t:"Change the IV fluid to 5% dextrose in 0.45% saline.",r:"That change is made when glucose reaches about 250 mg/dL."}],
why:"Three options sound reasonable because each is correct at some point in treatment. The nurse compares the trend with the target, links it to the new symptom, and reports.",
plain:"The sugar is coming down too fast, and a fast drop can make the brain swell."},

{ch:56,cs:"56a",need:N.pa,skill:S.eo,type:SATA,src:"Iggy Ch. 56, Diabetic Ketoacidosis: Drug Therapy (resolution criteria)",chart:C56A2,
stem:"Eighteen hours later, which findings show that the criteria for resolution have been met? Select all that apply.",
opts:[{t:"Blood glucose 188 mg/dL",c:1,r:"Below 200 mg/dL."},
{t:"Serum bicarbonate 19 mEq/L",c:1,r:"Higher than 18 mEq/L."},
{t:"Venous pH 7.33",c:1,r:"Higher than 7.30."},
{t:"Calculated anion gap 10 mEq/L",c:1,r:"Less than 12 mEq/L."},
{t:"Potassium 3.2 mEq/L",r:"Hypokalemia. A complication of treatment, not a sign of resolution."},
{t:"Client states she feels well enough to restart her pump herself",r:"Not a criterion. Subcutaneous insulin starts when she can take oral fluids and ketosis has stopped."}],
why:"Resolution is defined by four laboratory values together, not by the glucose alone.",
plain:"The sugar is down, the acid is gone, and the blood chemistry is back in balance."},

/* ---- hyperglycemic-hyperosmolar state ---- */
{ch:56,cs:"56b",need:N.pa,skill:S.ac,type:SATA,src:"Iggy Ch. 56, Interventions for Preventing Hyperglycemic-Hyperosmolar State; Older Adult Health",chart:C56B,

{t:"Furosemide",c:1,r:"Diuretics may cause or contribute, and they add to dehydration."},
{t:"Age-related change in thirst",c:1,r:"Older adults have reduced thirst perception and poor urine-concentrating ability."},
{t:"Probable urinary tract infection",c:1,r:"Infection is a precipitating factor. Sepsis is a listed cause."},
{t:"Metformin",r:"Not a listed contributor."},
{t:"Absence of ketones",r:"A feature of the condition. He secretes just enough insulin to prevent ketosis."}],
