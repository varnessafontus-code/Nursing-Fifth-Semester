Q.push(
/* ---------- Chapter 53 ---------- */
{ch:53,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 53, Parathyroid Glands; Fig. 53.6",
stem:"A client has a tumor that secretes excess parathyroid hormone. Which laboratory pattern does the nurse expect?",
opts:[{t:"Calcium high, phosphorus low",c:1,r:"The hormone releases calcium from bone, increases kidney reabsorption of calcium, and increases phosphorus excretion."},
{t:"Calcium high, phosphorus high",r:"Phosphorus excretion in the urine is increased, so the serum level falls."},
{t:"Calcium low, phosphorus high",r:"That pattern follows too little parathyroid hormone."},
{t:"Calcium low, phosphorus low",r:"Does not match either excess or deficiency."}],
why:"Parathyroid hormone acts on bone, kidney, and, through activated vitamin D, the intestine. All three raise serum calcium.",
plain:"This hormone pulls calcium into the blood and sends phosphorus out in the urine."},

{ch:53,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 53, Thyroid Gland (calcitonin); Parathyroid Glands",
stem:"A client's serum calcium rises above normal after an infusion. Which hormone response does the nurse expect in a healthy adult?",
opts:[{t:"Calcitonin secretion increases and parathyroid hormone secretion decreases.",c:1,r:"Elevated calcium increases calcitonin, which reduces bone release of calcium. Parathyroid hormone secretion falls when calcium is high."},
{t:"Calcitonin secretion decreases and parathyroid hormone secretion increases.",r:"That is the response to a low calcium level."},
{t:"Both calcitonin and parathyroid hormone increase.",r:"The two hormones have opposite actions and move in opposite directions."},
{t:"Both calcitonin and parathyroid hormone decrease.",r:"Calcitonin rises to bring calcium down."}],
why:"Two hormones control calcium from opposite sides. Both respond to the serum calcium level, in opposite directions.",
plain:"One hormone raises calcium and one lowers it. When calcium is high, the lowering one switches on and the raising one switches off."},

{ch:53,need:N.pa,skill:S.ac,type:SATA,src:"Iggy Ch. 53, Thyroid Gland",
stem:"Thyroxine (T4) must be converted to triiodothyronine (T3), the most active thyroid hormone. Which factors impair this conversion? Select all that apply.",
opts:[{t:"Physiologic stress",c:1,r:"Listed as impairing conversion."},
{t:"Starvation",c:1,r:"Listed as impairing conversion."},
{t:"Dyes",c:1,r:"Listed as impairing conversion."},
{t:"Some drugs",c:1,r:"Listed as impairing conversion."},
{t:"Exposure to cold temperatures",r:"Cold increases the conversion."},
{t:"A diet that contains iodized salt",r:"Iodine is needed to make thyroid hormone. It does not impair conversion."}],
why:"A hospitalized client who is stressed, poorly nourished, and receiving contrast and several drugs can have less active thyroid hormone even when the gland is healthy.",
plain:"The body makes a storage form first, then switches it on. Illness and hunger slow the switch."},

{ch:53,need:N.pa,skill:S.rc,type:MX,src:"Iggy Ch. 53, Adrenal Medulla; Table 53.2",
stem:"A client is having a fight-or-flight response. For each finding, choose whether it is expected from adrenal medulla hormones.",
cols:["Expected","Not expected"],
rows:[{t:"Dilated pupils",a:0},{t:"Increased heart rate and contractility",a:0},{t:"Relaxed, dilated bronchioles",a:0},{t:"Increased GI motility",a:1},{t:"Increased sweating",a:0},{t:"Decreased blood glucose",a:1}],
why:"Catecholamines dilate pupils and bronchioles, raise heart rate and contractility, decrease GI motility, increase sweating, and raise glucose through liver glucose production and glycogen breakdown.",
plain:"The body gets ready to run: eyes wide, heart fast, airways open, digestion on hold, sugar up."},

{ch:53,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 53, Adrenal Cortex; Adrenal Medulla",
stem:"Which hormone loss is an immediate threat to life?",
opts:[{t:"Glucocorticoids from the adrenal cortex",c:1,r:"Glucocorticoids are essential for life. Cortisol is needed for the stress response, for catecholamine action, and for normal excitability of heart muscle."},
{t:"Epinephrine and norepinephrine from the adrenal medulla",r:"Not essential for life, because other body tissues also secrete them."},
{t:"Sex hormones from the adrenal cortex",r:"Secreted in small amounts. The gonads make much more."},
{t:"Melatonin from the pineal gland",r:"Helps regulate the sleep-wake cycle."}],
why:"Both parts of the adrenal gland are involved in the stress response, which makes the first two options easy to confuse. Only the cortex makes a hormone the body cannot do without.",
plain:"The outer part of the adrenal gland makes the hormone you cannot live without."},

{ch:53,need:N.hp,skill:S.rc,type:SATA,src:"Iggy Ch. 53, Patient History",
stem:"During an endocrine history, which past and current drugs does the nurse specifically ask about? Select all that apply.",
opts:[{t:"Cortisone",c:1,r:"Named in the history-taking guidance."},
{t:"Levothyroxine",c:1,r:"Named in the history-taking guidance."},
{t:"Oral contraceptives",c:1,r:"Named in the history-taking guidance."},
{t:"Antihypertensive agents",c:1,r:"Named in the history-taking guidance."},
{t:"Androgens used for bodybuilding",c:1,r:"Misuse of hormone-based drugs such as androgens and thyroid hormones can cause serious gland dysfunction."},
{t:"Only drugs that were prescribed, because over-the-counter products do not affect hormones",r:"Over-the-counter drugs are included. Some drugs alter endocrine function and can interfere with testing."}],
why:"Exogenous hormones taken when replacement is not needed can disrupt many endocrine glands, so the drug history is one of the most useful parts of the assessment.",
plain:"Any hormone taken from outside can confuse the glands inside. Ask about all of them."},

{ch:53,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 53, Imaging Assessment",
stem:"A skull x-ray report states that the sella turcica is eroded. How does the nurse interpret this finding?",
opts:[{t:"An abnormal growth is invading the bony pocket that holds the pituitary gland.",c:1,r:"Erosion of the sella turcica indicates invasion of the wall from an abnormal growth."},
{t:"The thyroid gland is enlarged.",r:"The thyroid is in the anterior neck and is evaluated by ultrasound."},
{t:"The adrenal glands have atrophied.",r:"The adrenal glands sit on the kidneys and are evaluated by CT."},
{t:"The finding is a normal change of aging.",r:"Erosion is abnormal."}],
why:"The nurse expects further imaging. MRI with contrast is the most sensitive method for the pituitary gland.",
plain:"Something is growing in the small bony cup under the brain where the master gland sits."},

{ch:53,need:N.pa,skill:S.ac,type:MX,src:"Iggy Ch. 53, Pancreas",
stem:"For each statement, choose the pancreatic hormone it describes.",
cols:["Glucagon","Insulin","Somatostatin"],
rows:[{t:"Secreted by alpha cells",a:0},{t:"Triggered by a falling blood glucose level",a:0},{t:"Moves glucose across cell membranes into cells",a:1},{t:"Secreted by beta cells",a:1},{t:"Inhibits release of both other pancreatic hormones",a:2}],
why:"Glucagon raises blood glucose and helps prevent hypoglycemia. Insulin lowers it by moving glucose into cells. Somatostatin, from delta cells, inhibits the release of glucagon and insulin and of several GI peptides.",
plain:"One raises sugar, one lowers it, and one quiets them both."},

{ch:53,need:N.bcc,skill:S.gs,type:SATA,src:"Iggy Ch. 53, Age-Related Endocrine System Changes (decreased estrogen)",
stem:"Which interventions does the nurse include for an older woman with decreased estrogen production? Select all that apply.",
opts:[{t:"Teach the importance of regular weight-bearing activity.",c:1,r:"Helps maintain bone density."},
{t:"Perform or assist with perineal care at least twice a day.",c:1,r:"Perineal tissues are drier and the risk for cystitis is higher."},
{t:"Encourage adequate protein and 2 L of fluid daily unless contraindicated.",c:1,r:"Supports skin and urinary health."},
{t:"Teach her to urinate immediately after intercourse.",c:1,r:"Reduces the risk for cystitis."},
{t:"Advise her to avoid exercise to protect fragile bones.",r:"Weight-bearing activity maintains bone density."},
{t:"Limit fluids to reduce urinary frequency.",r:"Increases the risk for cystitis and dehydration."}],
why:"Lower estrogen thins bone, skin, and perineal tissue. Care targets each of those.",
plain:"Less estrogen means thinner bones and drier skin. Move, drink, and keep clean."},

{ch:53,need:N.rr,skill:S.rc,type:MC,src:"Iggy Ch. 53, Nutrition History",
stem:"Which client's weight history most suggests a thyroid or hypothalamic disorder?",
opts:[{t:"Lost 18 lb in 2 months while eating the same amount",c:1,r:"Rapid changes in weight without diet changes can be associated with a thyroid or hypothalamic disorder."},
{t:"Gained 6 lb over the winter holidays",r:"Explained by a change in intake."},
{t:"Lost 10 lb in 4 months after starting a daily walking program",r:"Explained by a change in activity."},
{t:"Weight unchanged; appetite smaller than 10 years ago",r:"A decreased appetite is expected with aging."}],
why:"The cue is not the size of the change. It is a rapid change with no explanation.",
plain:"Weight that moves quickly for no reason points to a hormone problem."},

/* ---------- Chapter 54 ---------- */
{ch:54,hard:1,need:N.moc,skill:S.ph,type:MC,src:"Iggy Ch. 54, Diabetes Insipidus: Interventions; Drug Alert (desmopressin)",
stem:"The nurse receives report on four clients. Which client does the nurse see first?",
opts:[{t:"Taking desmopressin; new confusion, persistent headache, and a 1.5-kg weight gain since yesterday",c:1,r:"Signs of water toxicity. Desmopressin can induce hyponatremia that leads to seizures, coma, respiratory failure, or death."},
{t:"Syndrome of inappropriate antidiuretic hormone; sodium 124 mEq/L, alert and oriented, on fluid restriction",r:"Needs neurologic checks every 2 to 4 hours, but is currently stable."},
{t:"Two days after hypophysectomy; reports food has no smell",r:"Expected. A decreased sense of smell usually lasts 3 to 4 months."},
{t:"Hypercortisolism; blood pressure 162/94 mm Hg and 1+ ankle edema",r:"Expected findings that need management, not immediate action."}],
why:"Two clients have sodium problems. One is stable and under treatment. The other has an acute change in mental status caused by the treatment.",
plain:"The medicine that stops water loss has worked too well, and her brain is showing it."},

{ch:54,need:N.moc,skill:S.ta,type:MC,src:"Iggy Ch. 54, Cushing Syndrome: Preventing Injury",
stem:"A client with long-standing hypercortisolism and bone density loss needs to walk in the hall. Which task does the nurse delegate to assistive personnel?",
opts:[{t:"Walk with the client using a gait belt.",c:1,r:"Assistive personnel are taught to use a gait belt when walking with a client who has bone density loss."},
{t:"Decide whether the client is strong enough to walk without a walker.",r:"A judgment that belongs to the nurse."},
{t:"Inspect the skin over the hips and heels for redness after the walk.",r:"Skin assessment is the nurse's responsibility."},
{t:"Explain why caffeine and alcohol increase the risk of fracture.",r:"Teaching is not delegated."}],
why:"The client has muscle weakness and fragile bones, so a fall can mean a fracture. The task is delegated with the safety device specified.",
plain:"The helper walks beside the client with a firm grip on the belt."},

{ch:54,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 54, Adrenal Gland Hypofunction: Pathophysiology",
stem:"A client stopped taking prednisone 4 days ago after 8 months of daily use. The client is weak and dizzy, with a blood pressure of 86/52 mm Hg. Which explanation does the nurse give for why the drug must be tapered?",
opts:[{t:"Long-term therapy shuts down the pituitary signal and shrinks the adrenal cortex, and both need time to recover.",c:1,r:"Glucocorticoid therapy suppresses production through negative feedback and causes atrophy of the adrenal cortex. Gradual withdrawal allows the pituitary and adrenal cells to resume function."},
{t:"Stopping suddenly causes the adrenal glands to release a surge of cortisol.",r:"The atrophied cortex cannot release enough cortisol."},
{t:"The drug must be cleared slowly to protect the kidneys.",r:"Not the reason for tapering."},
{t:"Stopping suddenly causes the pituitary to release excess adrenocorticotropic hormone, which damages the adrenal glands.",r:"The pituitary signal is suppressed, not excessive."}],
why:"Sudden cessation of long-term glucocorticoid therapy is the most common cause of secondary adrenal insufficiency and is often the underlying cause of shock in these clients.",
plain:"The pill did the gland's job for so long that the gland stopped working. It needs to be woken up slowly."},

{ch:54,need:N.pa,skill:S.rc,type:SATA,src:"Iggy Ch. 54, Hyperpituitarism: Pathophysiology; Box 54.2",
stem:"A 31-year-old woman has a prolactin-secreting pituitary adenoma. Which findings does the nurse expect? Select all that apply.",
opts:[{t:"Breast milk production",c:1,r:"Galactorrhea."},
{t:"Absent menses",c:1,r:"Excess prolactin inhibits gonadotropins and sex hormones."},
{t:"Difficulty becoming pregnant",c:1,r:"Infertility results from the same inhibition."},
{t:"Decreased libido",c:1,r:"Commonly reported."},
{t:"Enlarged hands and feet",r:"Growth hormone excess."},
{t:"Round face with truncal obesity",r:"Adrenocorticotropic hormone excess."}],
why:"Usually only one hormone is produced in excess. The findings follow that hormone. This is the most common type of pituitary adenoma.",
plain:"Too much of the milk hormone turns off the monthly cycle."},

{ch:54,need:N.bcc,skill:S.gs,type:SATA,src:"Iggy Ch. 54, Cushing Syndrome: Restoring Fluid Volume Balance; Preventing Injury",
stem:"A client with hypercortisolism has dependent edema and limited mobility. Which skin care measures does the nurse include? Select all that apply.",
opts:[{t:"Place a pressure-reducing overlay on the mattress.",c:1,r:"Fluid excess with dependent edema raises the risk for skin breakdown."},
{t:"Help the client change position every 2 hours.",c:1,r:"Bony prominences are also padded."},
{t:"Use tape sparingly and remove it carefully.",c:1,r:"Adhesive tape often causes skin breakdown."},
{t:"Hold pressure on a venipuncture site until bleeding stops.",c:1,r:"Blood vessels are fragile and bleeding is prolonged."},
{t:"Massage reddened areas over the hips and heels.",r:"Massage of reddened pressure areas damages fragile tissue."},
{t:"Leave the skin slightly damp after bathing to prevent dryness.",r:"The skin is dried thoroughly. A moisturizing lotion prevents excessive dryness."}],
why:"The skin is also checked under oxygen tubing, around the nares and ears, and under any elastic band.",
plain:"The skin is thin and the vessels are weak. Cushion it, move it, and do not pull on it."},

{ch:54,need:N.bcc,skill:S.gs,type:MC,src:"Iggy Ch. 54, Cushing Syndrome: Nutrition therapy; Preventing Injury",
stem:"Which meal choice is best for a client with hypercortisolism, fluid overload, and bone density loss?",
opts:[{t:"Grilled chicken, a leafy green salad, yogurt, and water, with no added salt",c:1,r:"Sodium is limited, and calcium and vitamin D are increased through dairy and green leafy vegetables."},
{t:"Canned soup, a ham sandwich, and pickles",r:"Processed foods are high in sodium."},
{t:"Pastry with two cups of coffee",r:"Caffeine increases the risk for GI ulcers and reduces bone density."},
{t:"Pepperoni pizza with a glass of wine",r:"High in sodium, and alcohol increases ulcer risk and reduces bone density."}],
why:"Three goals shape the meal: less sodium for fluid control, more calcium and vitamin D for bone, and no gastric irritants.",
plain:"Low salt, plenty of calcium, and nothing that upsets the stomach."},

{ch:54,hard:1,need:N.ph,skill:S.rc,type:MC,src:"Iggy Ch. 54, Cushing Syndrome: Drug therapy; Drug Alert (ketoconazole)",
stem:"A client is about to start ketoconazole for hypercortisolism. Which statement by the client requires follow-up before the first dose?",
opts:[{t:"“My husband and I are trying to have a baby.”",c:1,r:"Ketoconazole is teratogenic. Pregnancy or plans for pregnancy are reported to the provider before the drug is taken."},
{t:"“I heard I will need blood tests for my liver.”",r:"Accurate. The drug can cause reversible liver damage, so liver function tests are followed closely."},
{t:"“I hope I lose some of this weight.”",r:"Weight loss is an expected response to therapy."},
{t:"“Will I be going to the bathroom more?”",r:"Increased urine output is an expected response to therapy."}],
why:"Three statements show the client already understands the drug. One reveals a contraindication the client does not know about.",
plain:"This medicine can harm a developing baby, so the plan to conceive has to be discussed first."},

{ch:54,hard:1,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 54, Hypophysectomy: Postoperative Care",
stem:"Two days after transsphenoidal hypophysectomy, a client has a temperature of 101.4°F (38.6°C), a headache, and a stiff neck. The nasal drip pad is dry. How does the nurse interpret these findings?",
opts:[{t:"Meningitis; report immediately.",c:1,r:"Headache, fever, and nuchal rigidity are indications of infection, especially meningitis."},
{t:"Cerebrospinal fluid leak into the sinus area.",r:"Suggested by persistent, severe headache with postnasal drip or increased swallowing, without fever and neck stiffness."},
{t:"Transient diabetes insipidus.",r:"Presents with large volumes of dilute urine and thirst."},
{t:"Expected discomfort from nasal packing.",r:"Fever and neck stiffness are not expected."}],
why:"Headache appears in three of the four complications. The other two findings separate them.",
plain:"Fever plus a stiff neck after surgery near the brain means infection until proven otherwise."},

{ch:54,hard:1,need:N.rr,skill:S.eo,type:MC,src:"Iggy Ch. 54, Cushing Syndrome: Nutrition therapy and monitoring",
stem:"Which measurement is the most reliable indicator that a client with hypercortisolism is retaining fluid?",
opts:[{t:"Daily weight taken before breakfast on the same scale",c:1,r:"Rapid weight gain is the best indicator of fluid retention and overload. Each pound gained equals about 500 mL of retained water."},
{t:"Depth of pitting edema at the ankles",r:"Fluid retention may not be visible."},
{t:"Intake and output totals",r:"Monitored and must be accurate, but weight is the best indicator."},
{t:"Urine specific gravity",r:"A value below 1.005 may indicate fluid overload, but it is less reliable than weight."}],
why:"All four are monitored in this client. The question asks which one to trust most.",
plain:"Water is heavy. The scale catches it before the eye does."},

{ch:54,need:N.ph,skill:S.ac,type:MX,src:"Iggy Ch. 54, Box 54.7",
stem:"A client is in acute adrenal insufficiency. For each prescribed intervention, choose its purpose.",
cols:["Replaces the missing hormone","Moves potassium into cells","Protects the heart muscle","Prevents stomach ulcers"],
rows:[{t:"IV hydrocortisone bolus, then continuous infusion",a:0},{t:"IV insulin with dextrose",a:1},{t:"IV calcium",a:2},{t:"IV cimetidine",a:3}],
why:"Hyperkalemia management also includes a potassium-binding resin, loop or thiazide diuretics, and potassium restriction. Potassium-sparing diuretics are avoided. Glucose is checked hourly.",
plain:"One drug replaces what is missing, one hides the potassium, one steadies the heart, and one guards the stomach."},

/* ---------- Chapter 55 ---------- */
{ch:55,hard:1,need:N.moc,skill:S.ph,type:MC,src:"Iggy Ch. 55, Hypothyroidism: Supporting Cardiac Output; Drug therapy",
stem:"The nurse receives report on four clients. Which client does the nurse see first?",
opts:[{t:"Started levothyroxine 5 days ago; reports chest pain and shortness of breath",c:1,r:"Starting at too high a dose or increasing too quickly can cause dysrhythmias, heart failure, and myocardial infarction. Chest pain is reported immediately."},
{t:"Graves disease; heart rate 104 and reports feeling hot",r:"Expected. Temperature and pulse are monitored at least every 4 hours."},
{t:"Two days after thyroidectomy; voice is hoarse",r:"Usually temporary. Voice is assessed regularly."},
{t:"Hypoparathyroidism on oral calcium; tingling in the fingertips unchanged from yesterday",r:"A known, stable symptom of mild to moderate hypocalcemia."}],
why:"The client receiving treatment for the least dramatic disorder has the most dangerous new symptom.",
plain:"The thyroid pill has pushed her heart harder than it can handle."},

{ch:55,need:N.pa,skill:S.ac,type:MX,src:"Iggy Ch. 55, Box 55.2; Box 55.4; Hyperthyroidism: Assessment",
stem:"For each finding, choose the disorder it supports.",
cols:["Hypothyroidism","Hyperthyroidism"],
rows:[{t:"Decreased deep tendon reflexes",a:0},{t:"Increased number of stools each day",a:1},{t:"Thick tongue with hoarseness",a:0},{t:"Fine, soft, silky hair",a:1},{t:"Widened pulse pressure",a:1},{t:"Nonpitting edema of the hands and feet",a:0}],
why:"Low thyroid hormone slows every system. High thyroid hormone speeds every system and raises systolic pressure while diastolic pressure falls.",
plain:"One body is running slow and swollen. The other is running fast and hot."},

{ch:55,need:N.saf,skill:S.gs,type:MC,src:"Iggy Ch. 55, Hypothyroidism: Home Care Management",
stem:"An older client with hypothyroidism and reduced memory lives with two adult children. Which plan best prevents medication errors at home?",
opts:[{t:"One family member is clearly designated to prepare and give the levothyroxine.",c:1,r:"One person is designated so that doses are neither missed nor duplicated."},
{t:"Whoever is home in the morning gives the dose.",r:"Shared responsibility leads to missed or doubled doses."},
{t:"The client takes the drug independently to preserve dignity.",r:"Memory is impaired, so the client may need help with medication."},
{t:"The drug is given with dinner, when both children are home.",r:"It is taken on an empty stomach, 30 to 60 minutes before breakfast."}],
why:"The plan is developed with the client and family. The nurse makes sure whoever oversees daily care understands the condition.",
plain:"One person, one job, every morning."},

{ch:55,hard:1,need:N.ph,skill:S.eo,type:MC,src:"Iggy Ch. 55, Drug Alert (levothyroxine); Self-Management Education",
stem:"A client has taken levothyroxine for 3 months. Which statement requires follow-up?",
opts:[{t:"“On days I feel sluggish, I take an extra half tablet.”",c:1,r:"The drug is taken exactly as prescribed. The dose or schedule is not changed without consulting the provider."},
{t:"“I go for blood tests when my provider schedules them.”",r:"Correct. Periodic hormone levels guide the dose."},
{t:"“I ask before taking anything from the drugstore.”",r:"Correct. Thyroid preparations interact with many drugs and supplements."},
{t:"“I eat more fiber and drink more water for my bowels.”",r:"Correct. Fiber in food and fluids prevent constipation."}],
why:"The incorrect statement sounds like good self-management. The client is responding to a symptom by changing a dose that takes weeks to show its effect.",
plain:"More is not better with this pill. Extra doses can strain the heart."},

{ch:55,hard:1,need:N.rr,skill:S.gs,type:MC,src:"Iggy Ch. 55, Hyperthyroidism: Other Diagnostic Assessments",
stem:"A 28-year-old woman is scheduled for a radioactive iodine uptake test. Which action does the nurse take before the test?",
opts:[{t:"Confirm that pregnancy has been ruled out.",c:1,r:"Pregnancy is ruled out before the scan is performed."},
{t:"Teach her to flush the toilet two to three times after each use for a week.",r:"A precaution for radioactive iodine therapy. The isotope used for the test has a short half-life and needs no radiation precautions."},
{t:"Tell her she will need lifelong thyroid hormone afterward.",r:"That may follow therapy that destroys thyroid tissue, not a diagnostic test."},
{t:"Arrange for her to stay away from her toddler for 7 days.",r:"A precaution for therapy, not for the test."}],
why:"The test and the treatment use different isotopes of the same element. Three options belong to the treatment.",
plain:"The test dose is tiny and fades fast. The only safety check is making sure she is not pregnant."},

{ch:55,need:N.bcc,skill:S.gs,type:SATA,src:"Iggy Ch. 55, Hyperthyroidism: Nonsurgical Management",
stem:"Which comfort and rest measures does the nurse plan for a hospitalized client with hyperthyroidism? Select all that apply.",
opts:[{t:"Keep the door to the room closed.",c:1,r:"Keeps the environment quiet."},
{t:"Limit visitors.",c:1,r:"Reduces stimulation."},
{t:"Postpone nonessential care and treatments.",c:1,r:"Encourages rest."},
{t:"Offer a cool shower or sponge bath several times a day.",c:1,r:"Relieves heat intolerance."},
{t:"Add extra blankets at night.",r:"The room temperature is reduced. The client is heat intolerant."},
{t:"Group all tests into one busy morning so the afternoon is free.",r:"A burst of activity increases stimulation and the risk for cardiac complications."}],
why:"Reducing stimulation helps prevent worsening symptoms and cardiac complications.",
plain:"Cool, quiet, and unhurried."},

{ch:55,need:N.rr,skill:S.rc,type:SATA,src:"Iggy Ch. 55, Thyroid storm",
stem:"Which events can trigger thyroid storm in a client with uncontrolled Graves disease? Select all that apply.",
opts:[{t:"Infection",c:1,r:"A listed stressor."},
{t:"Trauma",c:1,r:"A listed stressor."},
{t:"Pregnancy",c:1,r:"A listed stressor."},
{t:"Diabetic ketoacidosis",c:1,r:"A listed stressor."},
{t:"Exposure to iodine",c:1,r:"Listed, along with radioactive iodine therapy and vigorous palpation of the goiter."},
{t:"Exposure to cold weather",r:"Not a listed trigger."}],
why:"Thyroid storm after surgery is now uncommon because clients are treated with drugs before the procedure.",
plain:"Any big stress on the body can tip an overactive thyroid into a crisis."},

{ch:55,need:N.ph,skill:S.eo,type:MC,src:"Iggy Ch. 55, Hyperthyroidism: Drug therapy",
stem:"A client has taken methimazole for 6 days and says, “It isn't working. My heart is still racing.” Which response by the nurse is accurate?",
opts:[{t:"“The gland has hormone stored that is still being released, so improvement takes a couple of weeks.”",c:1,r:"The response is delayed because large amounts of stored hormone continue to be released. Improvement usually occurs within 2 weeks."},
{t:"“The drug has failed, and surgery will be needed.”",r:"Too early to judge."},
{t:"“Take an extra dose today to catch up.”",r:"Doses are not self-adjusted."},
{t:"“Methimazole only relieves symptoms. It does not lower hormone levels.”",r:"That describes a beta blocker. Methimazole blocks hormone production."}],
why:"Propranolol is often added because it relieves the racing heart while the antithyroid drug takes effect.",
plain:"The factory has slowed down, but the warehouse is still full."},

{ch:55,need:N.saf,skill:S.gs,type:SATA,src:"Iggy Ch. 55, Hyperparathyroidism: Nonsurgical Management",
stem:"A client with chronic hyperparathyroidism and significant bone density loss is hospitalized. Which interventions does the nurse include? Select all that apply.",
opts:[{t:"Teach assistive personnel to reposition the client with a lift sheet.",c:1,r:"Bones are fragile. The client is not pulled."},
{t:"Monitor hydration and encourage adequate fluids.",c:1,r:"Hydration status is monitored carefully in hypercalcemia."},
{t:"Help the client stay active and avoid prolonged bed rest.",c:1,r:"Prolonged bed rest raises calcium."},
{t:"Monitor serum calcium levels.",c:1,r:"Close monitoring of calcium, kidney function, and bone density is necessary."},
{t:"Offer a calcium supplement with each meal.",r:"Calcium is already high. A diet with moderate calcium and vitamin D is used."},
{t:"Keep the client on strict bed rest to prevent fractures.",r:"Immobility increases calcium loss from bone."}],
why:"Priority nursing interventions for this disorder focus on monitoring and preventing injury.",
plain:"The bones are brittle, but lying still makes them worse. Move gently and keep the fluids up."},

{ch:55,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 55, Table 55.1; Hyperthyroidism: Etiology",
stem:"Which laboratory pattern does the nurse expect in a client with Graves disease?",
opts:[{t:"Thyroxine (T4) high, thyroid-stimulating hormone low",c:1,r:"Antibodies stimulate the gland directly. High hormone levels suppress the pituitary through negative feedback."},
{t:"Thyroxine (T4) high, thyroid-stimulating hormone high",r:"The pattern of secondary or tertiary hyperthyroidism, in which the pituitary or hypothalamus drives the gland."},
{t:"Thyroxine (T4) low, thyroid-stimulating hormone high",r:"Primary hypothyroidism."},
{t:"Thyroxine (T4) low, thyroid-stimulating hormone low",r:"Secondary or tertiary hypothyroidism."}],
why:"All four combinations exist. The second value tells whether the problem is in the thyroid or above it.",
plain:"The thyroid is being forced to overwork by antibodies, so the brain stops asking for more."},

/* ---------- Chapter 56 ---------- */
{ch:56,hard:1,need:N.rr,skill:S.ac,type:MC,src:"Iggy Ch. 56, Laboratory Assessment: Diagnosis of Diabetes; Table 56.3",
stem:"A 52-year-old client with no symptoms has an A1C of 7.1% on a routine screening. Which action does the nurse anticipate next?",
opts:[{t:"A repeat test to confirm the result",c:1,r:"A result that indicates diabetes mellitus is repeated to rule out laboratory error unless symptoms of hyperglycemia or a hyperglycemic crisis are present."},
{t:"Teaching that the result shows prediabetes",r:"Prediabetes is 5.7% to 6.4%."},
{t:"Starting insulin therapy today",r:"The diagnosis is not yet confirmed."},
{t:"Reassurance that the value is within the normal range",r:"Normal is 4% to 5.7%."}],
why:"The value is in the diabetes range, but the client has no symptoms. One abnormal value in a client without symptoms is confirmed before a lifelong diagnosis is made.",
plain:"One high number with no symptoms gets checked twice."},

{ch:56,need:N.hp,skill:S.eo,type:MC,src:"Iggy Ch. 56, Ongoing Assessment (A1C)",
stem:"A client's antidiabetic drug was changed 6 weeks ago. The last A1C was 8.4%. The client asks when the next A1C will be drawn. Which response is accurate?",
opts:[{t:"“About every 3 months until you are at your target.”",c:1,r:"Quarterly testing is recommended when therapy has changed or the client is not within the glycemic target range."},
{t:"“Twice a year is enough for everyone.”",r:"Twice yearly is for clients who are meeting goals with stable control."},
{t:"“Every week, to see whether the new drug is working.”",r:"A1C reflects about 120 days and does not change week to week."},
{t:"“Once a year at your physical.”",r:"Too infrequent."}],
why:"The target for most nonpregnant adults is an A1C below 7% without significant hypoglycemia.",
plain:"This test moves slowly, so it is checked every few months while things are being adjusted."},

{ch:56,need:N.saf,skill:S.gs,type:SATA,src:"Iggy Ch. 56, Blood glucose monitoring: infection control; alternate site testing",
stem:"Which instructions about home blood glucose monitoring does the nurse give? Select all that apply.",
opts:[{t:"Wash your hands before testing.",c:1,r:"Reduces infection risk."},
{t:"Use a new lancet each time.",c:1,r:"Lancets are not reused."},
{t:"Do not share your meter or lancet holder, even with a new lancet in it.",c:1,r:"Infection can be spread by the lancet holder."},
{t:"Clean the meter regularly.",c:1,r:"Critical for infection control."},
{t:"Use your forearm instead of your fingertip when your glucose is changing quickly.",r:"Alternate sites lag. The fingertip is the only safe choice when glucose is changing rapidly."},
{t:"Keep using test strips after the expiration date as long as the bottle was kept closed.",r:"Using expired strips is a common user error."}],
why:"Performance accuracy fades over time, so technique is rechecked with teach-back at follow-up visits.",
plain:"Clean hands, fresh needle, your own meter, and the fingertip when it matters."},

{ch:56,need:N.ph,skill:S.ta,type:MC,src:"Iggy Ch. 56, Nutrition therapy: carbohydrate counting",
stem:"A client uses an insulin-to-carbohydrate ratio of 1 unit of rapid-acting insulin for every 15 g of carbohydrate. Lunch contains 75 g of carbohydrate. Premeal glucose is in the target range. How much mealtime insulin does the client take?",
opts:[{t:"5 units",c:1,r:"75 g divided by 15 g per unit equals 5 units."},
{t:"3 units",r:"That covers 45 g."},
{t:"7.5 units",r:"That uses a ratio of 1 unit per 10 g."},
{t:"15 units",r:"That uses a ratio of 1 unit per 5 g."}],
why:"The ratio is checked with glucose values before and 2 hours after meals and adjusted if needed.",
plain:"Count the carbohydrate, divide by fifteen."},

{ch:56,need:N.hp,skill:S.eo,type:MC,src:"Iggy Ch. 56, Nutrition therapy: alcohol; Action Alert",
stem:"A man who takes insulin asks about drinking alcohol. Which statement shows he understands the teaching?",
opts:[{t:"“I can have up to two drinks, with a meal or right after, and I still need to watch for a low later.”",c:1,r:"Two drinks for males and one for females, taken with or shortly after a meal. Delayed hypoglycemia remains a risk."},
{t:"“I should skip dinner to make room for the calories in the drinks.”",r:"Alcohol is taken in addition to the usual meal plan. Drinking without food causes hypoglycemia."},
{t:"“Alcohol raises my sugar, so I will take extra insulin first.”",r:"Alcohol inhibits liver glucose production and lowers glucose hours later."},
{t:"“If I feel fine when I go to bed, the risk has passed.”",r:"Hypoglycemia can occur hours after drinking."}],
why:"Clients may want someone with them who can help if a low occurs.",
plain:"A drink or two with food is allowed. The low can show up hours later."},

{ch:56,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 56, Surgical Management: pancreas transplantation",
stem:"A client received a pancreas transplant in which the pancreatic duct drains into the urinary bladder. Which acid-base problem does the nurse monitor for?",
opts:[{t:"Metabolic acidosis from loss of bicarbonate-rich fluid",c:1,r:"The new pancreas makes 800 to 1,000 mL of fluid daily. When it drains into the bladder, loss of bicarbonate may cause acidosis."},
{t:"Metabolic alkalosis from loss of acid",r:"The fluid lost is rich in bicarbonate, a base."},
{t:"Respiratory acidosis from shallow breathing",r:"Not related to the drainage."},
{t:"Ketoacidosis from lack of insulin",r:"A successful graft secretes insulin into the bloodstream."}],
why:"The transplant treats the glucose problem and creates a fluid and electrolyte problem. Excretion of pancreatic fluid also irritates the bladder.",
plain:"The new pancreas pours a baking-soda-like fluid into the bladder, and losing it leaves the blood too acidic."},

{ch:56,need:N.hp,skill:S.gs,type:MC,src:"Iggy Ch. 56, Physical activity: exercise adjustments",
stem:"A client with unstable proliferative diabetic retinopathy wants to stay active. Which activity does the nurse recommend?",
opts:[{t:"Walking at a comfortable pace",c:1,r:"Avoids activities that raise blood pressure or jar the head."},
{t:"Heavy weightlifting",r:"Heavy lifting raises blood pressure and can cause vitreous hemorrhage or retinal detachment."},
{t:"Boxing",r:"Jarring activity with rapid head motion."},
{t:"High-intensity interval sprints",r:"Vigorous aerobic or resistance exercise is avoided with retinopathy."}],
why:"The new retinal vessels are thin and fragile and bleed easily.",
plain:"The new vessels in the eye are fragile. Nothing that strains or jolts."},

{ch:56,hard:1,need:N.pa,skill:S.ac,type:MC,src:"Iggy Ch. 56, Diabetic Autonomic Neuropathy; Hypoglycemia: causes",
stem:"A client with long-standing diabetes mellitus takes mealtime insulin as taught and eats full meals. The client has nausea, early fullness, and bloating, and has low glucose readings about an hour after eating. Which explanation is most likely?",
opts:[{t:"Delayed stomach emptying; the insulin acts before the food is absorbed.",c:1,r:"Gastroparesis causes hypoglycemia through a mismatch between nutrient absorption and insulin action."},
{t:"Hypoglycemic unawareness.",r:"That affects recognition of a low. It does not cause one."},
{t:"The dawn phenomenon.",r:"Causes high glucose in the early morning."},
{t:"Insulin resistance.",r:"Would raise glucose after meals."}],
why:"The stem rules out errors in dose and intake. The GI symptoms point to autonomic neuropathy of the stomach.",
plain:"The insulin arrives on time, but the meal is stuck in the stomach."},

{ch:56,hard:1,need:N.rr,skill:S.ta,type:MC,src:"Iggy Ch. 56, Blood glucose control in hospitalized patients",
stem:"A critically ill client on a continuous IV insulin infusion has a glucose of 96 mg/dL. The previous value was 142 mg/dL. The client is alert with no symptoms. Which action does the nurse take?",
opts:[{t:"Report the value so the insulin regimen can be reviewed.",c:1,r:"The target for critically ill clients is 140 to 180 mg/dL. Insulin regimens are reviewed when glucose falls below 100 mg/dL."},
{t:"Continue the infusion; the value is normal.",r:"Normal for a healthy adult, but below the target range and falling."},
{t:"Give 15 g of carbohydrate.",r:"Treatment is given below 70 mg/dL or with symptoms."},
{t:"Give IV concentrated dextrose.",r:"Used for a client with hypoglycemia who cannot swallow."}],
why:"A value that would be welcome in a clinic visit is a warning in the intensive care unit. The trend matters as much as the number.",
plain:"In a very sick person, sugar is kept a little higher on purpose. This one is sliding toward too low."},

{ch:56,need:N.pa,skill:S.ac,type:MX,src:"Iggy Ch. 56, Table 56.2",
stem:"For each feature, choose the type of diabetes mellitus.",
cols:["Type 1","Type 2"],
rows:[{t:"Abrupt onset with thirst, hunger, and weight loss",a:0},{t:"Destruction of pancreatic beta cells",a:0},{t:"Insulin resistance",a:1},{t:"Frequently no symptoms at diagnosis",a:1},{t:"All clients depend on insulin",a:0},{t:"Most clients are obese",a:1}],
why:"Type 1 follows autoimmune destruction of beta cells and usually begins before age 30. Type 2 involves insulin resistance with dysfunctional beta cells, and insulin is required by only 20% to 30% of clients.",
plain:"In one type the insulin factory is destroyed. In the other the body stops listening to insulin."},

/* ---------- Chapter 60 ---------- */

 h('div',{class:'grid'},items.map((it,k)=>{let c='nb';const locked=st.done||st.chk[k];
  if(k===st.idx)c+=' cur';
  if(locked){const s=score(it,st.ans[k]);c+=s.got===s.max?' full':s.got>0?' part':' zero'}else if(it.q.type!==ORD&&answered(it,st.ans[k]))c+=' ans';
  if(st.flag[k])c+=' flag';
  return h('button',{class:c,onclick:()=>{navOpen=false;go(k)}},String(k+1))})),
 h('div',{class:'legend muted'},'Outlined = current · filled = answered · dot = flagged'),
 st.done?null:h('button',{class:'btn',id:'finish-early',onclick:()=>{askSubmit=true;navOpen=false;render(false)}},'Finish now'));
}
function vQ(){const i=st.idx,it=items[i],q=it.q,n=items.length;
 const locked=st.done||!!st.chk[i],has=answered(it,st.ans[i]),last=i===n-1;
 const unanswered=items.filter((x,k)=>!(st.chk[k]||(x.q.type!==ORD&&answered(x,st.ans[k]))||(x.q.type===ORD&&st.mode==='exam'))).length;
 let primary;
 if(st.done)primary=last?h('button',{class:'btn pri',onclick:()=>{view='res';render(true)}},'Results'):h('button',{class:'btn pri',id:'next',onclick:()=>go(i+1)},'Next');
 else if(st.mode==='tutor'&&!st.chk[i])primary=h('button',{class:'btn pri',id:'check',disabled:!has,onclick:()=>{st.chk[i]=1;upd()}},'Check answer');
 else if(last)primary=h('button',{class:'btn pri',id:'submit',onclick:()=>{if(st.mode==='tutor'&&!unanswered)finish();else{askSubmit=true;render(false)}}},st.mode==='tutor'?'See results':'Submit exam');
 else primary=h('button',{class:'btn pri',id:'next',onclick:()=>go(i+1)},'Next');
 return h('main',{class:'wrap'},
  h('header',{class:'top'},
   h('div',{class:'meta'},h('span',null,(st.done?'Review · ':'')+'Question '+(i+1)+' of '+n),h('span',{id:'clock',class:'clock'},fmt(st.el))),
   h('div',{class:'bar'},h('div',{style:'width:'+Math.round((i+1)/n*100)+'%'}))),
  chartBox(q,i),
  it.ci?h('p',{class:'caselbl'},'Unfolding case · item '+it.ci+' of '+it.cn):null,
  h('h1',{class:'stem'},q.stem),
  HINT[q.type]?h('p',{class:'hint'},HINT[q.type]):null,
  body(it,i,locked),
  locked?feedback(it,i):h('div',{class:'conf'},h('span',{class:'muted'},'Confidence'),CONF.map(c=>h('button',{class:'cf'+(st.conf[i]===c[0]?' on':''),'data-cf':c[0],onclick:()=>{st.conf[i]=st.conf[i]===c[0]?null:c[0];upd()}},c[1]))),
  askSubmit?h('div',{class:'ask'},h('p',null,unanswered?unanswered+(unanswered===1?' question is':' questions are')+' unanswered and will score zero. Finish anyway?':'Finish and see results?'),
   h('div',{class:'row'},h('button',{class:'btn pri',id:'confirm',onclick:finish},'Finish'),h('button',{class:'btn',onclick:()=>{askSubmit=false;render(false)}},'Keep working'))):null,
  h('footer',{class:'foot'},
   h('button',{class:'btn',id:'back',disabled:i===0,onclick:()=>go(i-1)},'Back'),
   st.done?h('button',{class:'btn',onclick:()=>{view='res';render(true)}},'Results'):h('button',{class:'btn'+(st.flag[i]?' flagged':''),onclick:()=>{st.flag[i]=st.flag[i]?null:1;upd()}},st.flag[i]?'Flagged':'Flag'),
   h('button',{class:'btn',id:'navt',onclick:()=>{navOpen=!navOpen;render(false)}},navOpen?'Hide list':'All questions'),
   primary),
  navOpen?navGrid():null);
}

/* ---------- results ---------- */
function vRes(){const sc=items.map((it,i)=>score(it,st.ans[i]));
 const got=sc.reduce((a,s)=>a+s.got,0),max=sc.reduce((a,s)=>a+s.max,0),pct=max?Math.round(got/max*100):0;
 const full=sc.filter(s=>s.got===s.max).length;
 function group(title,keyf,order){const m={};items.forEach((it,i)=>{const k=keyf(it.q);(m[k]=m[k]||{got:0,max:0,n:0});m[k].got+=sc[i].got;m[k].max+=sc[i].max;m[k].n++});
  let keys=Object.keys(m);if(order)keys=order.filter(k=>m[k]);else keys.sort((a,b)=>m[a].got/m[a].max-m[b].got/m[b].max);
  return h('section',{class:'card'},h('h2',null,title),keys.map(k=>{const p=Math.round(m[k].got/m[k].max*100);
   return h('div',{class:'brow'},h('div',{class:'bl'},h('span',null,k),h('span',{class:'muted'},m[k].got+'/'+m[k].max+' · '+p+'%')),h('div',{class:'bar '+(p>=85?'g':p>=70?'m':'l')},h('div',{style:'width:'+p+'%'})))}))}
 const jump=k=>h('button',{class:'lnk',onclick:()=>{view='q';go(k)}},'Q'+(k+1));
 const sureWrong=[],guessRight=[],missed=[];
 items.forEach((it,i)=>{if(sc[i].got<sc[i].max){missed.push(it.id);if(st.conf[i]==='s')sureWrong.push(i)}else if(st.conf[i]==='g')guessRight.push(i)});
 const anyConf=st.conf.some(c=>c);
 return h('main',{class:'wrap'},
  h('p',{class:'eyebrow'},'NUR205 · Exam 1 · Clinical Judgment Set 2'),
  h('h1',null,'Results'),
  h('section',{class:'card score'},
   h('div',{class:'big '+(pct>=85?'g':pct>=70?'m':'l')},pct+'%'),
   h('div',null,h('div',null,h('strong',null,got+' of '+max+' points')),h('div',{class:'muted'},full+' of '+items.length+' questions with full credit · '+fmt(st.el)+' · '+(st.mode==='tutor'?'rapid fire':'exam')+' mode'),
    h('div',{class:'muted'},'Course target: 85%.'))),
  anyConf?h('section',{class:'card'},h('h2',null,'Confidence check'),
   h('p',null,h('strong',null,'Missed while sure ('+sureWrong.length+'): '),sureWrong.length?sureWrong.map(k=>[jump(k),' ']):'none.',h('span',{class:'muted'},sureWrong.length?' These are false beliefs. Fix them first.':'')),
   h('p',null,h('strong',null,'Full credit on a guess ('+guessRight.length+'): '),guessRight.length?guessRight.map(k=>[jump(k),' ']):'none.',h('span',{class:'muted'},guessRight.length?' Read these rationales. The point was luck.':''))):null,
  group('By clinical judgment step',q=>q.skill,[S.rc,S.ac,S.ph,S.gs,S.ta,S.eo]),
  group('By client need',q=>q.need),
  group('By chapter',q=>CH_NAME[q.ch]),
  group('By item type',q=>TYPE_NAME[q.type]),
  group('By difficulty of the options',q=>q.hard?'Close-call options':'Standard options',['Close-call options','Standard options']),
  h('section',{class:'card'},h('h2',null,'Every question'),
   h('div',{class:'list'},items.map((it,k)=>h('button',{class:'li '+(sc[k].got===sc[k].max?'full':sc[k].got>0?'part':'zero'),onclick:()=>{view='q';go(k)}},
    h('span',{class:'num'},String(k+1)),h('span',{class:'lt'},(it.ci?'Case '+it.ci+'/'+it.cn+': ':'')+it.q.stem.slice(0,96)+(it.q.stem.length>96?'…':'')),h('span',{class:'pts'},sc[k].got+'/'+sc[k].max))))),
  h('div',{class:'row end'},
   missed.length?h('button',{class:'btn pri',id:'retake-missed',onclick:()=>{setup={mode:st.mode,mix:st.mix,chs:st.chs.slice()};begin(missed)}},'Retake the '+missed.length+' missed'):null,
   h('button',{class:'btn',id:'retake',onclick:()=>{setup={mode:st.mode,mix:st.mix,chs:st.chs.slice()};begin(null)}},'Retake, reshuffled'),
   h('button',{class:'btn',onclick:()=>{view='start';render(true)}},'Setup')));
}
window.__exam={prepare,score,answered,get st(){return st},get items(){return items}};
render(true);
})();
