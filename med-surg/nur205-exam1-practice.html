<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NUR205 Exam 1 Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column, sticky status bar on top, answer controls as full-width tap targets. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --sunk:#E8EEF3; --ink:#14233A; --muted:#55667C; --line:#CFD9E3;
  --accent:#0A6A93; --accent-ink:#FFFFFF; --accent-soft:#DDEFF7;
  --good:#1B7448; --good-bg:#E2F3E9; --bad:#AE2A21; --bad-bg:#FBE8E6; --warn:#7D5200; --warn-bg:#FFF1CF;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#17212E; --sunk:#1F2C3B; --ink:#E7EEF6; --muted:#9FB1C5; --line:#2D3E52;
  --accent:#63C3EC; --accent-ink:#06212D; --accent-soft:#143445;
  --good:#74D6A4; --good-bg:#143524; --bad:#FF9288; --bad-bg:#3B1C19; --warn:#F3C76E; --warn-bg:#3A2D10;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#17212E; --sunk:#1F2C3B; --ink:#E7EEF6; --muted:#9FB1C5; --line:#2D3E52;
  --accent:#63C3EC; --accent-ink:#06212D; --accent-soft:#143445;
  --good:#74D6A4; --good-bg:#143524; --bad:#FF9288; --bad-bg:#3B1C19; --warn:#F3C76E; --warn-bg:#3A2D10;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
#app{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1{font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.15rem;margin:0;text-wrap:balance}
p{margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}

/* start */
.start{padding-block:28px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--sunk);border-radius:8px;padding:10px 12px}
.fact b{display:block;font-family:var(--mono);font-size:1.25rem}
.choice{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.choice input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.choice span{min-width:0}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;margin-bottom:8px;padding:0}

/* status bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);margin-bottom:16px}
.bar .row{justify-content:space-between}
.bar .btn{padding:6px 12px;min-height:38px;font-size:.9rem}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px;max-height:220px;overflow:auto;padding:2px}
.navgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-height:36px;font-family:var(--mono);font-size:.82rem;padding:0}
.navgrid .ans{background:var(--accent-soft);border-color:var(--accent)}
.navgrid .ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.navgrid .part{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.navgrid .no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.navgrid .cur{outline:3px solid var(--ink);outline-offset:1px}
.navgrid .flg{box-shadow:inset 0 -4px 0 var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}

/* question */
.exhibit{background:var(--sunk);border-radius:var(--r);padding:14px 16px;font-size:.94rem;display:flex;flex-direction:column;gap:10px}
.exhibit .tw{overflow-x:auto}
.exhibit table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
.exhibit th,.exhibit td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;background:var(--surface)}
.exhibit th{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stem{font-size:1.08rem;max-width:66ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;min-height:48px}
.opt .mark{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700;font-family:var(--mono)}
.opt[role="checkbox"] .mark{border-radius:5px}
.opt .otxt{min-width:0;flex:1}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default;color:var(--ink);opacity:1}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.good .mark{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .mark{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.why{display:block;margin-top:6px;font-size:.92rem;color:var(--ink)}
.why b{font-weight:700}
.good .why b,.tgood{color:var(--good)} .bad .why b,.tbad{color:var(--bad)}
.mrow{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mrow.good{border-color:var(--good);background:var(--good-bg)} .mrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;min-height:36px}
.pill.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill[disabled]{cursor:default;opacity:1;color:var(--ink)}
.pill.sel[disabled]{color:var(--accent-ink)}
.pill.key{border-color:var(--good);box-shadow:inset 0 0 0 1.5px var(--good)}
.oitem{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
.oitem .n{font-family:var(--mono);font-weight:600;width:22px;flex:none;text-align:center}
.oitem .t{flex:1;min-width:0}
.oitem .mv{display:flex;gap:4px;flex:none}
.oitem .mv button{width:40px;height:40px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;font-size:1rem}
.oitem.good{border-color:var(--good);background:var(--good-bg)} .oitem.bad{border-color:var(--bad);background:var(--bad-bg)}
.cloze{font-size:1.04rem;line-height:2.2;max-width:66ch}
.cloze select{max-width:100%;border:1.5px solid var(--accent);background:var(--surface);border-radius:6px;padding:4px 6px}
.cloze select.good{border-color:var(--good);background:var(--good-bg)} .cloze select.bad{border-color:var(--bad);background:var(--bad-bg)}
.passage{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;line-height:2.1}
.seg{border:1.5px dashed var(--muted);background:transparent;border-radius:5px;padding:2px 5px;text-align:left;display:inline;line-height:1.5}
.seg.sel{background:var(--warn-bg);border-style:solid;border-color:var(--warn);font-weight:700}
.seg[disabled]{cursor:default;color:var(--ink);opacity:1}
.seg.good{background:var(--good-bg);border:1.5px solid var(--good)}
.seg.bad{background:var(--bad-bg);border:1.5px solid var(--bad)}
.seg.miss{border:1.5px solid var(--good);box-shadow:inset 0 -3px 0 var(--good)}
.verdict{border-radius:8px;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.verdict.ok{border-color:var(--good);background:var(--good-bg)} .verdict.part{border-color:var(--warn);background:var(--warn-bg)} .verdict.no{border-color:var(--bad);background:var(--bad-bg)}
.verdict h2{font-size:1.02rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:6px}
.confirm{border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:12px 14px}

/* results */
.scoreline{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.big{font-family:var(--mono);font-size:3rem;font-weight:600;line-height:1}
.meter{position:relative;height:14px;background:var(--sunk);border-radius:7px;margin-top:22px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--accent)}
.meter b{position:absolute;top:-20px;transform:translateX(-50%);font-size:.74rem;font-weight:700;color:var(--muted);white-space:nowrap}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tw{overflow-x:auto}
table.bd{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.bd th,table.bd td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.bd td.n,table.bd th.n{text-align:right;font-family:var(--mono)}
.minibar{height:8px;background:var(--sunk);border-radius:4px;min-width:70px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent)}
.missed{display:flex;flex-direction:column;gap:6px}
.missed button{display:flex;gap:12px;justify-content:space-between;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.missed button span{min-width:0}
@media (max-width:480px){ body{font-size:16px} .big{font-size:2.4rem} .panel{padding:14px} table.bd .mb{display:none} table.bd th,table.bd td{padding:8px 6px} }
</style>

<script>
const QUESTIONS = [{"ch":53,"t":"Age-related endocrine changes","cj":"Recognize Cues","type":"mc","stem":"The nurse reviews findings for four clients older than 75. Which finding requires further assessment for an endocrine problem rather than being attributed to aging?","o":[["Heart rate consistently below 60 beats/min, temperature consistently below 97 F, and slowed speech",1,"These are the listed signs that call for further endocrine assessment beyond the expected slowing of metabolism."],["Urine that stays dilute when fluid intake is low",0,"Decreased antidiuretic hormone production with aging produces dilute urine. It raises dehydration risk but is an expected change."],["Less tolerance for cold rooms",0,"Decreased general metabolism makes cold intolerance an expected change; the teaching is to dress in layers."],["Thinner, drier skin",0,"Decreased ovarian estrogen production causes thinner, drier skin. It is expected and managed with skin protection."]],"id":"q1"},{"ch":53,"t":"Physical assessment","cj":"Analyze Cues","type":"sata","stem":"A client has taken prednisone daily for 3 years. Which assessment findings does the nurse attribute to adrenocortical hormone excess? Select all that apply.","o":[["Fat pad between the shoulders with truncal obesity",1,"Truncal obesity and a buffalo hump may indicate adrenocortical excess."],["Reddish-purple striae on the abdomen",1,"Striae on the breasts or abdomen are often seen with adrenocortical excess."],["Bruising and petechiae",1,"Bruising, petechiae, slow wound healing, and fungal skin infections are often seen with adrenal hyperfunction."],["Patchy areas of pigment loss",0,"Vitiligo is seen with primary hypofunction of the adrenal glands, from autoimmune destruction of melanocytes."],["Protruding eyeballs with retracted upper lids",0,"Exophthalmos is a thyroid finding, specific to Graves disease."],["Craving for salty foods",0,"Salt craving is triggered by adrenal hypofunction, not excess."]],"id":"q2"},{"ch":53,"t":"24-hour urine collection","cj":"Take Action","type":"order","stem":"A client will collect a 24-hour urine specimen at home. The container holds a preservative and must stay cold. Place the client's actions in the correct order.","items":["Empty the bladder and discard that urine","Note the time; the 24-hour period starts now","Add every voiding to the container, kept in a cooler with ice","At the end time, empty the bladder even without an urge","Add that final specimen to the container"],"why":"Timing begins only after the first specimen is discarded, so the bladder is empty at time zero. Every voiding after that is saved. The collection ends by emptying the bladder at the end time and adding that urine, so the container holds exactly 24 hours of production.","id":"q3"},{"ch":53,"t":"Stimulation testing","cj":"Analyze Cues","type":"mc","stem":"A client with fatigue, weight loss, and postural hypotension receives a measured dose of a stimulating hormone. Serial levels of the target gland's hormone do not rise. How does the nurse interpret this result?","o":[["The target gland has hypofunction",1,"Provocative testing is used for a suspected underactive gland. Failure of the hormone level to rise with provocation indicates hypofunction."],["The target gland has hyperfunction",0,"Hyperfunction is shown by failure to suppress during a suppression test, not by failure to rise."],["The response is normal because hormone levels were already adequate",0,"A normal gland responds to stimulation with increased output."],["The result cannot be interpreted until a 24-hour urine collection is completed",0,"A 24-hour urine reflects pulsatile secretion over time; it is not required to read a provocative test."]],"id":"q4"},{"ch":53,"t":"Glycosylated hemoglobin","cj":"Evaluate Outcomes","type":"mc","stem":"A client says, “I ate very carefully yesterday and fasted this morning, so my A1C should look good.” Which response by the nurse is accurate?","o":[["“This test reflects your average glucose over roughly the past 3 to 4 months, so one day does not change it.”",1,"A1C shows the average blood glucose over the life span of the red blood cell and is not altered by eating habits the day before."],["“Fasting for at least 8 hours is what makes the A1C accurate.”",0,"Fasting is required for a fasting blood glucose, not for A1C."],["“The A1C mainly shows how high your glucose went after yesterday's meals.”",0,"That describes a postprandial glucose, not A1C."],["“The result will be falsely low because you fasted.”",0,"A1C is not altered by short-term intake."]],"id":"q5"},{"ch":53,"t":"Thyroid assessment safety","cj":"Take Action","type":"mc","stem":"A client reports heat intolerance and a 12-lb weight loss. Heart rate is 118 beats/min and the lower neck is visibly enlarged. A nursing student positions behind the client to palpate the neck. Which action does the nurse take?","o":[["Stop the student; palpation could release a surge of thyroid hormone",1,"Palpating or applying pressure to the thyroid of a client who has or may have hyperthyroidism can trigger thyroid storm."],["Remind the student to have the client bend the head slightly forward",0,"This is correct technique for palpation in general, but palpation itself is unsafe here."],["Ask the client to swallow while the student palpates",0,"Swallowing helps the examiner feel the gland rise; it does not make palpation safe with hyperthyroid symptoms."],["Have the student displace the trachea to examine one lobe at a time",0,"This is the standard method for examining each lobe, and it is contraindicated with suspected hyperthyroidism."]],"id":"q6"},{"ch":53,"t":"Specimen collection","cj":"Take Action","type":"mc","stem":"A blood sample for catecholamines is ordered for a client who has a triple-lumen central line. Which action by the nurse is correct?","o":[["Obtain the sample by another route, place it on ice, and take it to the laboratory immediately",1,"Double- or triple-lumen lines are not used because of contamination or dilution from another port; catecholamine samples go on ice and directly to the laboratory."],["Draw from the distal lumen after clearing the line and send it with routine pickup",0,"A multi-lumen line should not be used, and the sample cannot wait."],["Draw from any lumen and keep the tube at room temperature",0,"Both the site and the handling are incorrect."],["Collect a 24-hour urine instead because blood levels are not measured",0,"Blood catecholamine sampling is a described test with specific handling requirements."]],"id":"q7"},{"ch":53,"t":"Negative feedback","cj":"Analyze Cues","type":"mc","stem":"A client has taken high-dose glucocorticoids for 2 years. Which laboratory pattern does the nurse expect from the hypothalamic-pituitary-adrenal axis?","o":[["Corticotropin-releasing hormone and adrenocorticotropic hormone (ACTH) are suppressed",1,"Adequate or elevated blood cortisol inhibits release of both hormones through negative feedback."],["ACTH is elevated because the pituitary is overstimulated",0,"High glucocorticoid levels inhibit, not stimulate, ACTH release."],["Corticotropin-releasing hormone is elevated and ACTH is suppressed",0,"Both are inhibited by high cortisol levels."],["Neither hormone changes because the drug is not made by the adrenal gland",0,"Feedback responds to the blood level of glucocorticoid, whatever its source."]],"id":"q8"},{"ch":53,"t":"Older adult safety","cj":"Generate Solutions","type":"mc","stem":"An 86-year-old client with no fluid restriction has dry mucous membranes and dilute urine. Which instruction to assistive personnel best addresses the age-related change involved?","o":[["Offer fluids at least every 2 hours while the client is awake",1,"Decreased antidiuretic hormone production prevents urine concentration when intake is low; offering fluids every 2 hours addresses the dehydration risk."],["Provide perineal care at least twice daily",0,"This addresses drier perineal tissue from decreased estrogen, not dehydration."],["Help the client dress in layers",0,"This addresses decreased cold tolerance from slower metabolism."],["Encourage weight-bearing activity",0,"This addresses loss of bone density."]],"id":"q9"},{"ch":53,"t":"Screening cues","cj":"Prioritize Hypotheses","type":"mc","stem":"A 72-year-old client has a shin wound that has not healed in 3 weeks, persistent vaginal candidiasis, and increased thirst. Which screening does the nurse suggest?","o":[["Testing for diabetes mellitus",1,"A leg or foot wound not healed in 2 weeks, persistent vaginal candidiasis, and persistent thirst are each listed reasons to suggest diabetes testing."],["Thyroid function testing",0,"Thyroid cues would be lethargy, constipation, low temperature, and slow heart rate."],["Serum calcium for parathyroid function",0,"Nothing here points to a calcium problem."],["Serum cortisol for adrenal function",0,"Slow healing can occur with adrenal hyperfunction, but candidiasis with thirst points to glucose."]],"id":"q10"},{"ch":53,"t":"Psychosocial assessment","cj":"Take Action","type":"mc","stem":"A client whose facial features and hand size have changed over several years says, “I don't recognize myself in the mirror anymore.” Which response by the nurse is best?","o":[["“Tell me more about how these changes have affected you.”",1,"The nurse encourages the client to express feelings and concerns about a change in appearance."],["“Treatment will return your face and hands to the way they were.”",0,"Skeletal changes are permanent; this is false reassurance."],["“Your laboratory values matter more than how you look.”",0,"This dismisses the client's concern."],["“Most people adjust to these changes within a few months.”",0,"This minimizes the concern and closes the conversation."]],"id":"q11"},{"ch":53,"t":"Cue clustering","cj":"Analyze Cues","type":"mc","stem":"A client has blood pressure of 118/72 lying and 90/56 standing, darkened skin over the knuckles and an old surgical scar, and reports craving salty snacks. Which gland problem do these cues suggest?","o":[["Hypofunction of the adrenal cortex",1,"Salt craving is triggered by adrenal hypofunction; increased pigmentation over joints and scars reflects high ACTH and melanocyte-stimulating hormone; the postural drop reflects volume depletion."],["Hyperfunction of the adrenal cortex",0,"Excess produces hypertension, truncal obesity, and striae."],["Hyperfunction of the thyroid gland",0,"Thyroid excess produces tachycardia, heat intolerance, and weight loss."],["Excess secretion from the posterior pituitary",0,"Excess vasopressin causes water retention with a bounding pulse, not postural hypotension."]],"id":"q12"},{"ch":54,"t":"Hypophysectomy","cj":"Recognize Cues","type":"mc","stem":"A client is 12 hours post transsphenoidal hypophysectomy. Which finding requires immediate follow-up?","o":[["Urine output of 900 mL over 2 hours with an intake of 250 mL",1,"Output greater than intake signals transient diabetes insipidus, a known complication; fluid balance is monitored for exactly this."],["Breathing through the mouth with dry lips",0,"Mouth breathing is expected with nasal packing; mouth rinses and lip lubricant manage it."],["Reports that food has no smell",0,"A decreased sense of smell is expected and usually lasts 3 to 4 months."],["Nasal packing in place with a dry drip pad",0,"Packing may stay 2 to 3 days; a dry pad is reassuring."]],"id":"q13"},{"ch":54,"t":"Hypophysectomy","cj":"Generate Solutions","type":"sata","stem":"The nurse prepares discharge teaching for a client after transsphenoidal hypophysectomy. Which instructions does the nurse include? Select all that apply.","o":[["Bend the knees and lower the body to pick up objects",1,"Bending at the waist increases intracranial pressure."],["Use floss and mouth rinses instead of a toothbrush for about 2 weeks",1,"Toothbrushing is avoided for about 2 weeks after transsphenoidal surgery."],["Use high-fiber foods, fluids, and stool softeners to avoid straining",1,"Straining at stool increases intracranial pressure."],["Report postnasal drip or a need to swallow constantly",1,"These may indicate leakage of cerebrospinal fluid."],["Cough forcefully every hour to keep the lungs clear",0,"Coughing increases pressure at the incision and may cause a cerebrospinal fluid leak; deep breathing is used instead."],["Blow the nose gently to clear old drainage",0,"Nose blowing is prohibited after this surgery."]],"id":"q14"},{"ch":54,"t":"Hypophysectomy","cj":"Recognize Cues","type":"hl","stem":"The nurse reads this note on a client 18 hours after hypophysectomy. Select the findings that require follow-up.","segs":[["Client is ",null],["alert and oriented",0],[". Head of bed elevated. ",null],["Breathing through the mouth",0],[". Nasal drip pad shows ",null],["clear drainage surrounded by a light yellow ring",1],[". Client ",null],["reports swallowing frequently",1],[" and a ",null],["persistent severe headache",1],[". ",null],["Temperature 101.2 F with a stiff neck",1],[". States ",null],["food has little smell",0],[". ",null],["Performing deep-breathing exercises hourly",0],[".",null]],"why":"A halo ring on the drip pad, increased swallowing, and a persistent severe headache each suggest a cerebrospinal fluid leak. Fever with nuchal rigidity suggests meningitis. Orientation, mouth breathing, a reduced sense of smell, and deep breathing are expected or desired.","id":"q15"},{"ch":54,"t":"Hyperpituitarism","cj":"Analyze Cues","type":"mc","stem":"A client reports that rings and shoes no longer fit, the jaw seems larger, and joints ache. Which laboratory finding does the nurse anticipate?","o":[["Elevated blood glucose",1,"Growth hormone excess (acromegaly) commonly produces hyperglycemia."],["Low blood glucose",0,"Growth hormone antagonizes insulin; glucose rises."],["Low serum sodium",0,"Hyponatremia is not a described feature of growth hormone excess."],["Low serum calcium",0,"Hypocalcemia is not a described feature of growth hormone excess."]],"id":"q16"},{"ch":54,"t":"Hyperpituitarism drugs","cj":"Recognize Cues","type":"mc","stem":"A client taking bromocriptine for a prolactin-secreting tumor calls the clinic. Which report requires the nurse to direct the client to seek care immediately?","o":[["Chest pain with watery nasal discharge",1,"Chest pain, dizziness, or watery nasal discharge may signal dysrhythmias, coronary artery spasm, or fibrotic changes."],["Constipation since starting the drug",0,"Constipation is a listed side effect, not an emergency."],["Nausea when the dose is taken without food",0,"The drug is given with a meal or snack to reduce gastrointestinal effects."],["Abdominal cramps in the evening",0,"Abdominal cramps are a listed side effect."]],"id":"q17"},{"ch":54,"t":"Diabetes insipidus","cj":"Take Action","type":"mc","stem":"After a head injury, a client has urine output of 6 L in 24 hours, urine specific gravity of 1.002, and serum sodium of 152 mEq/L. The client is NPO for a procedure scheduled in 7 hours and has no IV fluids ordered. Which action does the nurse take?","o":[["Contact the provider now; this client must not go without fluids for more than 4 hours",1,"Clients with suspected diabetes insipidus cannot reduce urine output, so fluid deprivation beyond 4 hours leads to severe dehydration."],["Maintain NPO status and recheck the sodium after the procedure",0,"Seven hours without fluid risks severe dehydration and shock."],["Restrict fluids to bring the urine output down",0,"Urine output does not decrease when intake decreases in this condition."],["Request tolvaptan to correct the sodium",0,"Tolvaptan promotes water excretion and is used for water retention with low sodium, the opposite problem."]],"id":"q18"},{"ch":54,"t":"Diabetes insipidus","cj":"Generate Solutions","type":"mc","stem":"A client going home on desmopressin asks, “How will I know if I need another dose?” Which response is accurate?","o":[["“Passing large amounts of urine and feeling very thirsty mean another dose is needed.”",1,"Polyuria and polydipsia indicate the need for another dose."],["“A weight gain of 2 pounds in a day means the drug has worn off.”",0,"Weight gain suggests water retention from too much drug effect."],["“A headache with confusion means the drug has worn off.”",0,"With weight gain, these indicate water toxicity and require emergency care."],["“You take it only when your urine looks dark.”",0,"Dark, concentrated urine indicates the drug is working."]],"id":"q19"},{"ch":54,"t":"Antidiuretic hormone disorders","cj":"Analyze Cues","type":"matrix","stem":"For each finding, select the condition it is consistent with.","cols":["Diabetes insipidus","Syndrome of inappropriate antidiuretic hormone"],"rows":[["Urine specific gravity of 1.003",0,"Dilute urine with a specific gravity below 1.005."],["Serum sodium of 121 mEq/L",1,"Water retention dilutes serum sodium."],["Full, bounding pulse",1,"Increased fluid volume produces a bounding pulse."],["Urine output of 9 L in 24 hours",0,"Output may range from 4 to 30 L per day."],["Decreased deep tendon reflexes",1,"Reflexes are usually decreased with the hyponatremia of water retention."],["Increased plasma osmolarity",0,"Massive water loss concentrates the plasma."],["Poor skin turgor and dry mucous membranes",0,"Dehydration follows the water loss."]],"id":"q20"},{"ch":54,"t":"Syndrome of inappropriate antidiuretic hormone","cj":"Take Action","type":"mc","stem":"A client with small cell lung cancer has a serum sodium of 114 mEq/L. On the last check the client was oriented. Now the nurse notes new muscle twitching and increasing irritability. Which action is the priority?","o":[["Report the change and increase neurologic checks to at least hourly with seizure safety measures in place",1,"Twitching and irritability are subtle changes that precede seizures or coma; a change in status calls for checks at least every hour and a safe environment."],["Continue neurologic checks every 4 hours",0,"Every 2 to 4 hours is sufficient only when the client is alert and unchanged."],["Encourage oral fluids to improve hydration",0,"Fluid intake further dilutes plasma sodium."],["Use water to flush the feeding tube more often",0,"Saline, not water, is used for tube irrigation in this condition."]],"id":"q21"},{"ch":54,"t":"Syndrome of inappropriate antidiuretic hormone","cj":"Evaluate Outcomes","type":"mc","stem":"A hospitalized client receiving tolvaptan had a serum sodium of 116 mEq/L yesterday. Today it is 131 mEq/L. How does the nurse respond?","o":[["Report the result; the rise exceeds 12 mEq/L in 24 hours",1,"A rapid rise of more than 12 mEq/L in 24 hours is associated with central nervous system demyelination."],["Document the result as the expected therapeutic response",0,"The direction is desired but the speed is dangerous."],["Request 3% saline to reach a normal level sooner",0,"Hypertonic saline would raise sodium even faster."],["Liberalize fluids because the sodium is still below normal",0,"More fluid does not address the too-rapid correction."]],"id":"q22"},{"ch":54,"t":"Syndrome of inappropriate antidiuretic hormone","cj":"Analyze Cues","type":"sata","stem":"A client has a low serum sodium, concentrated urine, and weight gain without dependent edema. Which history findings could explain this presentation? Select all that apply.","o":[["Small cell lung cancer",1,"Malignancy, especially small cell lung cancer, is a listed cause."],["Carbamazepine therapy",1,"Antiseizure drugs including carbamazepine are listed causes."],["Stroke 5 days ago",1,"Central nervous system disorders including stroke are listed causes."],["Pneumonia requiring positive-pressure ventilation",1,"Pulmonary disorders and positive-pressure ventilation are listed causes."],["Long-term lithium therapy",0,"Lithium is associated with arginine vasopressin resistance (nephrogenic diabetes insipidus), which causes water loss."],["Abruptly stopping prednisone",0,"That causes adrenal insufficiency with sodium loss and volume depletion, not water retention."]],"id":"q23"},{"ch":54,"t":"Adrenal insufficiency","cj":"Take Action","type":"mc","stem":"A client on daily hydrocortisone replacement has vomited for 30 hours and cannot keep oral doses down. Which instruction does the nurse give?","o":[["“Call your provider now or go to the nearest emergency department; you need the drug by injection.”",1,"When oral doses cannot be taken for 24 to 36 hours, an injection must take the place of the oral drug."],["“Skip the doses until the vomiting stops, then resume.”",0,"The client is told never to skip a dose; without the drug, acute adrenal insufficiency develops."],["“Take the next dose with a magnesium antacid.”",0,"The client cannot retain oral medication."],["“Cut the dose in half until you are eating again.”",0,"Illness is a stressor that requires more drug, not less."]],"id":"q24"},{"ch":54,"t":"Adrenal insufficiency drugs","cj":"Evaluate Outcomes","type":"mc","stem":"A client with primary adrenal insufficiency takes hydrocortisone and fludrocortisone. Which finding suggests the fludrocortisone dose may need to be reduced?","o":[["Blood pressure of 168/98 mm Hg with ankle edema and weight gain",1,"Hypertension is a side effect of fludrocortisone; weight gain or edema is reported because sodium may need to be restricted."],["Craving for salty foods",0,"Salt craving suggests ongoing hormone deficiency."],["Dizziness on standing",0,"Postural hypotension suggests inadequate replacement."],["Serum potassium of 5.7 mEq/L",0,"Hyperkalemia suggests inadequate mineralocorticoid effect."]],"id":"q25"},{"ch":54,"t":"Adrenal insufficiency","cj":"Analyze Cues","type":"cloze","stem":"Complete the statements about a client with fatigue, weight loss, bronze skin over the knuckles, and an elevated ACTH level.","parts":["The findings indicate ",{"o":["primary","secondary"],"a":0}," adrenal insufficiency. In this type, the client loses ",{"o":["glucocorticoids, mineralocorticoids, and androgens","glucocorticoids only, with mineralocorticoid function preserved"],"a":0},". After ACTH is given, the nurse expects the cortisol response to be ",{"o":["absent or very decreased","increased"],"a":0},"."],"why":"Elevated ACTH with hyperpigmentation locates the problem in the adrenal gland itself. Primary insufficiency reduces all three hormone groups, whereas secondary insufficiency preserves mineralocorticoid function. In primary disease the cortisol response to ACTH stimulation is absent or very decreased; in secondary disease it is increased.","id":"q26"},{"ch":54,"t":"Acute adrenal insufficiency","cj":"Generate Solutions","type":"matrix","stem":"A client with long-term steroid use had emergency surgery and now has blood pressure of 76/40 mm Hg, sodium of 122 mEq/L, potassium of 6.4 mEq/L, and glucose of 54 mg/dL. For each potential order, select whether it is indicated or not indicated.","cols":["Indicated","Not indicated"],"rows":[["Rapid infusion of normal saline",0,"Emergency management begins with rapid infusion of normal saline or 5% dextrose in normal saline."],["Hydrocortisone IV bolus",0,"Initial higher doses of hydrocortisone or dexamethasone are given as an IV bolus."],["Spironolactone",1,"Potassium-sparing diuretics are avoided in hyperkalemia."],["IV insulin with dextrose",0,"Insulin with dextrose shifts potassium into cells."],["Delay treatment until an ACTH stimulation test is completed",1,"When acute adrenal insufficiency is suspected, treatment starts without stimulation testing."],["IV H2 histamine blocker",0,"An H2 blocker such as cimetidine is started for ulcer prevention."],["Continuous ECG monitoring",0,"Heart rate, rhythm, and ECG are monitored for signs of hyperkalemia."]],"id":"q27"},{"ch":54,"t":"Acute adrenal insufficiency","cj":"Analyze Cues","type":"mc","stem":"A client with adrenal insufficiency and a urinary tract infection becomes weak. The monitor shows a heart rate of 48 beats/min with tall, peaked T waves. Which laboratory value best explains the rhythm change?","o":[["Potassium of 6.8 mEq/L",1,"Slow heart rate, heart block, and tall peaked T waves are ECG signs of hyperkalemia, which follows loss of aldosterone."],["Sodium of 128 mEq/L",0,"Hyponatremia is expected but leads to hypotension and decreased cognition, not peaked T waves."],["Glucose of 62 mg/dL",0,"Hypoglycemia produces sweating, tremors, and tachycardia."],["Blood urea nitrogen of 34 mg/dL",0,"An elevated value reflects decreased filtration and causes anorexia, not this rhythm."]],"id":"q28"},{"ch":54,"t":"Glucocorticoid therapy","cj":"Take Action","type":"mc","stem":"A client who has taken prednisone daily for 4 months says, “I feel fine, so I threw the rest away yesterday.” Which response is the priority?","o":[["“Stopping suddenly is dangerous; the drug has to be withdrawn gradually. I am contacting your provider now.”",1,"Long-term therapy suppresses ACTH and causes adrenal atrophy; sudden cessation is a common cause of secondary adrenal insufficiency and can cause shock."],["“That is fine as long as your original symptoms do not return.”",0,"The risk is adrenal insufficiency, regardless of the original condition."],["“Restart it only if you gain weight or your face looks rounder.”",0,"Those are signs of too much glucocorticoid, not withdrawal."],["“Limit your salt intake for the next week.”",0,"Salt restriction should not be started without considering that it might lead to adrenal crisis."]],"id":"q29"},{"ch":54,"t":"Cortisol replacement teaching","cj":"Generate Solutions","type":"sata","stem":"Which instructions does the nurse include for a client starting lifelong cortisol replacement? Select all that apply.","o":[["Take the larger part of the daily dose on arising and the smaller part in the late afternoon",1,"Divided doses mimic normal release: two-thirds in the morning and one-third later in the day."],["Take each dose with a meal or snack",1,"Food prevents stomach irritation."],["Expect the dose to be increased, as directed, during illness or severe stress",1,"The usual dose may not be adequate during increased physical or severe emotional stress."],["Wear a medical alert bracelet at all times",1,"This is a listed teaching point."],["Have a family member also learn to give IM hydrocortisone",1,"The injection is needed if the oral drug cannot be taken."],["Skip a dose on days when the stomach is upset",0,"The client must never skip a dose."],["Follow a low-sodium diet to prevent swelling",0,"Salt restriction can lead to adrenal crisis and is not started routinely."]],"id":"q30"},{"ch":54,"t":"Hypercortisolism testing","cj":"Analyze Cues","type":"mc","stem":"A client with weight gain and facial rounding takes dexamethasone at bedtime. The 8 a.m. plasma cortisol the next morning is suppressed. How does the nurse interpret this result?","o":[["Cushing disease is not present",1,"When cortisol levels are suppressed by dexamethasone, Cushing disease is not present."],["Cushing disease is confirmed",0,"Disease is suggested when cortisol is not suppressed."],["The adrenal glands have atrophied",0,"The test does not measure adrenal atrophy."],["The test must be repeated because cortisol should rise after dexamethasone",0,"Suppression is the normal response."]],"id":"q31"},{"ch":54,"t":"Hypercortisolism","cj":"Prioritize Hypotheses","type":"mc","stem":"A client with hypercortisolism has the following findings. Which requires the nurse's immediate attention?","o":[["New lung crackles with increasing neck vein distention",1,"These indicate fluid overload; pulmonary edema can occur quickly and lead to death."],["Bruises on both forearms",0,"Fragile vessels make bruising an expected chronic finding."],["Fasting glucose of 162 mg/dL",0,"Elevated fasting glucose is expected with excess cortisol."],["Thin arms and legs with a large trunk",0,"Fat redistribution and muscle wasting are expected."]],"id":"q32"},{"ch":54,"t":"Hypercortisolism","cj":"Analyze Cues","type":"mc","stem":"Two days after surgery, a client with hypercortisolism has a temperature of 99.8 F (baseline 98.6 F). The incision has no redness or drainage. How does the nurse interpret these findings?","o":[["Infection is possible and should be reported; excess cortisol masks the usual signs",1,"A rise of even 1 F above baseline is significant; with reduced immunity, severe infection can exist without pus and with only a low-grade fever."],["Infection is unlikely because the incision has no purulent drainage",0,"Pus formation depends on white blood cell activity, which cortisol suppresses."],["The temperature is an expected response to surgery and needs no action",0,"In this client a small rise indicates infection until proven otherwise."],["The findings indicate the cortisol level is returning to normal",0,"Temperature is not a measure of cortisol level."]],"id":"q33"},{"ch":54,"t":"Hypercortisolism","cj":"Generate Solutions","type":"sata","stem":"The nurse plans care to prevent injury in a client with hypercortisolism and bone density loss. Which instructions does the nurse give assistive personnel? Select all that apply.","o":[["Use a lift sheet to move the client in bed",1,"A lift sheet is used instead of grasping the client."],["Use a gait belt when walking with the client",1,"A gait belt is used for clients with bone density loss."],["Use an electric shaver for shaving",1,"An electric shaver reduces skin trauma."],["Provide a soft toothbrush",1,"A soft toothbrush reduces trauma to fragile tissue."],["Grasp the client under the arms to pull up in bed",0,"Grasping risks skin injury and fragility fractures."],["Secure dressings firmly with extra adhesive tape",0,"Tape often causes skin breakdown; it is used sparingly and removed carefully."]],"id":"q34"},{"ch":54,"t":"Adrenalectomy","cj":"Take Action","type":"mc","stem":"Two hours after bilateral adrenalectomy, a client has blood pressure of 84/50 mm Hg, a rapid weak pulse of 128 beats/min, and falling urine output. Which action does the nurse take?","o":[["Report the findings immediately and anticipate additional glucocorticoid",1,"Hypotension, a rapid weak pulse, and decreasing urine output indicate shock from insufficient glucocorticoid replacement."],["Continue to monitor every hour; these changes are expected after anesthesia",0,"The client is assessed every 15 minutes for shock, and these findings are shock."],["Give the prescribed spironolactone",0,"A potassium-sparing diuretic does not treat shock from glucocorticoid deficiency."],["Restrict fluids to prevent overload",0,"The client is in shock; fluid restriction worsens perfusion."]],"id":"q35"},{"ch":54,"t":"Adrenalectomy","cj":"Evaluate Outcomes","type":"mc","stem":"After bilateral adrenalectomy, which client statement shows correct understanding?","o":[["“I will take both a glucocorticoid and a mineralocorticoid for the rest of my life.”",1,"After bilateral adrenalectomy, lifelong glucocorticoid and mineralocorticoid replacement is required."],["“I will take the hormones for up to 2 years until my body takes over.”",0,"That applies to unilateral adrenalectomy, while the remaining gland recovers."],["“I can stop the hormones for a few days if I have a stomach virus.”",0,"Stopping even for a day or two causes acute adrenal insufficiency."],["“I only need the hormones when I am under stress.”",0,"Without adrenal glands the client depends completely on the drug."]],"id":"q36"},{"ch":54,"t":"Hyperaldosteronism","cj":"Analyze Cues","type":"mc","stem":"A client has blood pressure of 178/102 mm Hg, potassium of 2.9 mEq/L, sodium of 148 mEq/L, muscle weakness, and tingling in the fingers. Plasma renin is low. Which drug does the nurse anticipate?","o":[["Spironolactone",1,"Hypertension with hypokalemia, hypernatremia, and low renin indicates hyperaldosteronism; spironolactone is an aldosterone antagonist that raises potassium."],["Fludrocortisone",0,"Fludrocortisone is a mineralocorticoid and would worsen the problem."],["Hydrocortisone",0,"There is no cortisol deficiency."],["Desmopressin",0,"Desmopressin replaces vasopressin and does not address aldosterone excess."]],"id":"q37"},{"ch":54,"t":"Hyperaldosteronism drugs","cj":"Evaluate Outcomes","type":"mc","stem":"A client with hyperaldosteronism who is not a surgical candidate continues spironolactone. Which statement indicates a need for more teaching?","o":[["“I will take a potassium supplement and eat more high-potassium foods to stay safe.”",1,"Spironolactone spares potassium; the client is advised to avoid potassium supplements and potassium-rich foods."],["“I will report dizziness, drowsiness, or muscle weakness.”",0,"Correct; these are symptoms of hyponatremia, which can occur with this drug."],["“This drug can cause breast enlargement.”",0,"Correct; gynecomastia is a listed side effect."],["“I may still need another drug for my blood pressure.”",0,"Correct; additional antihypertensive therapy is often needed."]],"id":"q38"},{"ch":54,"t":"Hypopituitarism","cj":"Take Action","type":"mc","stem":"A client with panhypopituitarism is admitted with pneumonia. Home drugs are hydrocortisone, levothyroxine, and testosterone. The admission orders include antibiotics only. Which action does the nurse take first?","o":[["Contact the provider to continue hormone replacement, especially the hydrocortisone",1,"Replacement must continue during any admission; ACTH and thyroid-stimulating hormone deficiencies are the most life-threatening, and infection is a stressor."],["Hold the home drugs until the infection has resolved",0,"Withholding cortisol replacement during a stressor risks acute adrenal insufficiency."],["Ask the family to bring the drugs so the client can take them independently",0,"The orders must be corrected; this leaves a life-sustaining drug unmanaged."],["Give only the testosterone because it has the longest dosing interval",0,"Gonadal replacement is the least urgent of the three."]],"id":"q39"},{"ch":54,"t":"Hypopituitarism drugs","cj":"Recognize Cues","type":"mc","stem":"A man with gonadotropin deficiency is to begin testosterone replacement. Which history finding does the nurse report before the first dose?","o":[["Prostate cancer",1,"Androgen therapy is avoided in men with prostate cancer to prevent enhancing tumor cell growth."],["Decreased facial and body hair",0,"This is an expected sign of the deficiency being treated."],["Decreased libido",0,"This is an expected sign of the deficiency being treated."],["Reduced muscle mass",0,"This is an expected sign of the deficiency being treated."]],"id":"q40"},{"ch":55,"t":"Hypothyroidism","cj":"Analyze Cues","type":"mc","stem":"A client reports sleeping 11 hours a night, constipation, a 14-lb weight gain, and wearing a sweater in summer. Heart rate is 54 beats/min. The problem is located in the gland itself. Which laboratory pattern does the nurse anticipate?","o":[["Low T3 and T4 with high thyroid-stimulating hormone (TSH)",1,"In primary hypothyroidism the gland underproduces hormone and the pituitary responds with high TSH."],["Low T3 and T4 with low TSH",0,"Low or near-normal TSH points to a secondary cause in the pituitary or hypothalamus."],["High T3 and T4 with low TSH",0,"This pattern fits Graves disease."],["High T3 and T4 with high TSH",0,"This pattern fits secondary hyperthyroidism."]],"id":"q41"},{"ch":55,"t":"Hypothyroidism drugs","cj":"Recognize Cues","type":"mc","stem":"A 76-year-old client with coronary artery disease started levothyroxine 4 days ago. Which report is the priority to communicate to the provider?","o":[["Chest pain and shortness of breath",1,"Starting too high or increasing too fast can cause dysrhythmias, heart failure, and myocardial infarction; chest pain and dyspnea are assessed during initiation."],["Still feeling tired",0,"The time required for symptom relief varies; fatigue at 4 days is not a complication."],["No bowel movement for 2 days",0,"Constipation is a feature of the disorder that improves as therapy takes effect."],["Needing an extra blanket at night",0,"Cold intolerance persists until hormone levels improve."]],"id":"q42"},{"ch":55,"t":"Hypothyroidism drugs","cj":"Generate Solutions","type":"sata","stem":"Which teaching points does the nurse include for a client starting levothyroxine? Select all that apply.","o":[["Take it with water on an empty stomach, 30 to 60 minutes before breakfast",1,"This is the stated administration instruction."],["Separate it from iron, calcium supplements, and antacids by at least 4 hours",1,"These drugs reduce absorption."],["The drug is taken for life",1,"Hypothyroidism requires lifelong replacement."],["Report trouble sleeping with more frequent bowel movements",1,"These suggest the dose may need to be decreased."],["Fiber supplements can interfere with absorption",1,"The client is cautioned that fiber supplements may interfere with absorption."],["Adjust the dose yourself according to your energy level",0,"The dose or schedule is not changed without consulting the provider."],["Stop the drug once constipation and fatigue resolve",0,"Therapy is lifelong; stopping replacement can precipitate myxedema coma."]],"id":"q43"},{"ch":55,"t":"Hypothyroidism","cj":"Take Action","type":"mc","stem":"A client with untreated hypothyroidism is anxious before a procedure. A standard adult dose of a sedative is ordered. Which action does the nurse take?","o":[["Question the order; sedation worsens gas exchange and this client needs a reduced dose if any",1,"Sedation is avoided if possible; when needed, the dosage is reduced because hypothyroidism increases sensitivity."],["Give the dose and recheck the client in 4 hours",0,"A standard dose risks respiratory depression, and the client would need assessment of gas exchange."],["Give the dose with a calcium supplement",0,"Calcium has no role here."],["Hold all drugs, including thyroid replacement, until after the procedure",0,"Stopping thyroid replacement is a trigger for myxedema coma."]],"id":"q44"},{"ch":55,"t":"Myxedema coma","cj":"Take Action","type":"mc","stem":"A client with hypothyroidism who received an opioid for pain is now unresponsive. Respirations are 8 breaths/min and shallow, temperature is 94.6 F, heart rate is 44 beats/min, and blood pressure is 82/50 mm Hg. Which action is the priority?","o":[["Maintain a patent airway and support ventilation",1,"Respiratory failure is the most common cause of death in myxedema coma; airway comes first."],["Cover the client with warm blankets",0,"Indicated for hypothermia, but after the airway is secured."],["Give IV glucose as prescribed",0,"Indicated for hypoglycemia, but after the airway is secured."],["Check the temperature hourly",0,"Monitoring is part of care but does not treat the failing respirations."]],"id":"q45"},{"ch":55,"t":"Myxedema coma","cj":"Recognize Cues","type":"sata","stem":"The nurse reviews the history of a client admitted with hypothermia, bradycardia, hypoventilation, and a greatly reduced level of consciousness. Which factors could have led to this emergency? Select all that apply.","o":[["Stopped taking levothyroxine 6 weeks ago",1,"Discontinuation of thyroid replacement is a listed precipitating factor for myxedema coma."],["Pneumonia diagnosed 3 days ago",1,"Acute illness is a listed precipitating factor."],["Received an opioid and a sedative yesterday",1,"Use of sedatives or opioids is a listed precipitating factor."],["Surgery 2 days ago",1,"Surgery is a listed precipitating factor."],["Recent exposure to iodine",0,"Iodine exposure is a trigger for thyroid storm, the opposite emergency."],["Vigorous palpation of a goiter",0,"This is a trigger for thyroid storm."]],"id":"q46"},{"ch":55,"t":"Hyperthyroidism","cj":"Analyze Cues","type":"mc","stem":"A client has weight loss, tremors, and a heart rate of 112 beats/min. Which finding indicates that the cause is Graves disease rather than another form of hyperthyroidism?","o":[["Abnormal protrusion of the eyes",1,"Exophthalmos and pretibial myxedema occur only with Graves disease."],["Upper eyelid that fails to descend when the client looks down",0,"Eyelid lag is common in all types of hyperthyroidism."],["Visibly enlarged thyroid gland",0,"A goiter occurs in several thyroid problems, including hypothyroidism."],["Widened pulse pressure",0,"Cardiovascular effects occur with any cause of excess thyroid hormone."]],"id":"q47"},{"ch":55,"t":"Hyperthyroidism","cj":"Take Action","type":"mc","stem":"A client with hyperthyroidism had a temperature of 99.0 F at 0800. At 1200 it is 100.6 F and the heart rate is 134 beats/min. Which action does the nurse take first?","o":[["Assess cardiac status and report the temperature increase immediately",1,"A rise of even 1 F may signal thyroid storm; the increase is reported immediately and cardiac status is assessed."],["Give an antipyretic and recheck at 1600",0,"Waiting 4 hours risks a fatal crisis."],["Offer a cool shower and fresh ice water",0,"These are comfort measures for heat intolerance, not a response to possible storm."],["Close the door and limit visitors",0,"Reducing stimulation is appropriate ongoing care but does not address the acute change."]],"id":"q48"},{"ch":55,"t":"Hyperthyroidism","cj":"Generate Solutions","type":"mc","stem":"The nurse delegates vital signs for a client with hyperthyroidism to assistive personnel. Which instruction is most important?","o":[["“Report the temperature to me as soon as you obtain it.”",1,"Temperature increases may indicate onset of thyroid storm, so assistive personnel report the value as soon as it is obtained."],["“Keep a fresh pitcher of ice water at the bedside.”",0,"Correct comfort care, lower priority."],["“Change the bed linen whenever it is damp.”",0,"Correct comfort care, lower priority."],["“Keep the room door closed.”",0,"Correct for reducing stimulation, lower priority."]],"id":"q49"},{"ch":55,"t":"Hyperthyroidism drugs","cj":"Take Action","type":"mc","stem":"A client taking methimazole tells the nurse, “My partner and I have started trying to have a baby.” Which response is correct?","o":[["“Tell your provider now; this drug can cause birth defects and may need to be changed.”",1,"Methimazole causes birth defects and may need to be changed during the first trimester."],["“Stop the drug today and restart after delivery.”",0,"The client does not stop therapy independently; uncontrolled disease is also dangerous."],["“Radioactive iodine is the safer choice during pregnancy.”",0,"Radioactive iodine crosses the placenta and damages the fetal thyroid."],["“No change is needed; this is the preferred drug in pregnancy.”",0,"It is the drug that carries the birth-defect warning."]],"id":"q50"},{"ch":55,"t":"Hyperthyroidism drugs","cj":"Recognize Cues","type":"mc","stem":"A client taking propylthiouracil reports the following. Which report requires prompt follow-up?","o":[["Dark urine and yellowing of the whites of the eyes",1,"These suggest liver toxicity or failure, a serious side effect of propylthiouracil."],["Still feeling warm after 1 week of therapy",0,"Response is delayed because stored thyroid hormone continues to be released."],["Avoiding crowded stores",0,"This is a taught precaution because the drug reduces the immune response."],["Heart rate of 88 beats/min",0,"This is an improvement, not a problem."]],"id":"q51"},{"ch":55,"t":"Radioactive iodine therapy","cj":"Generate Solutions","type":"sata","stem":"A client is going home after oral radioactive iodine therapy. Which instructions does the nurse include? Select all that apply.","o":[["Sit to urinate and flush two or three times with the lid closed",1,"This prevents splashing and spreads less radioactivity."],["Stay at least 6 feet from pregnant women, infants, and young children for the prescribed time",1,"Close contact is avoided, including sleeping in the same bed."],["Do not share a toothbrush or toothpaste tube",1,"Radioactivity is present in saliva during the first week."],["Do not prepare food for other people",1,"This avoids exposing others to saliva contamination."],["Expect symptoms to disappear within 2 to 3 days",0,"Relief may take 6 to 8 weeks because the gland stores hormone."],["Use absorbent gel-filled pads for any urine leakage",0,"Gel-filled briefs or pads are not used; women use facial tissue layers that are flushed."]],"id":"q52"},{"ch":55,"t":"Prioritization","cj":"Prioritize Hypotheses","type":"mc","stem":"The nurse receives report on four clients. Which client does the nurse assess first?","o":[["Three hours after thyroidectomy, drooling and unable to swallow",1,"Inability to swallow and drooling after thyroid surgery indicate airway obstruction and require an immediate response."],["Hypothyroidism, heart rate 58 beats/min, asleep",0,"Bradycardia is expected and the client is stable."],["Graves disease, temperature 99.2 F, restless",0,"Needs monitoring, but no acute change is described."],["Hypoparathyroidism, numbness around the mouth",0,"Indicates hypocalcemia and needs prompt attention, but an actual airway problem comes first."]],"id":"q53"},{"ch":55,"t":"Thyroidectomy","cj":"Generate Solutions","type":"mc","stem":"Which preoperative instruction helps a client protect the incision after thyroidectomy?","o":[["Place both hands behind the neck for support when coughing or moving",1,"Supporting the neck reduces strain on the incision."],["Tilt the head back when swallowing",0,"Positions that extend the neck are avoided."],["Lie flat without a pillow for the first day",0,"The client is placed in semi-Fowler position with pillows supporting the head and neck."],["Avoid deep breathing until the drain is removed",0,"Deep breathing is performed every 30 minutes to 1 hour."]],"id":"q54"},{"ch":55,"t":"Thyroidectomy","cj":"Take Action","type":"mc","stem":"A client returns to the unit awake after thyroidectomy. How does the nurse position the client?","o":[["Semi-Fowler with pillows supporting the head and neck",1,"This is the stated position; neck extension is avoided."],["Supine with the neck extended over a rolled towel",0,"Neck extension strains the incision."],["Flat on the side with no pillow",0,"The head and neck need support and elevation."],["Prone with the head turned to one side",0,"This rotates and strains the neck."]],"id":"q55"},{"ch":55,"t":"Thyroidectomy","cj":"Take Action","type":"mc","stem":"Ten hours after thyroidectomy, a client reports tingling around the mouth and in the fingertips. The nurse sees twitching of the facial muscles. Which prescribed drug does the nurse prepare?","o":[["IV calcium gluconate",1,"Tingling and twitching indicate hypocalcemia from parathyroid injury; IV calcium gluconate should be available."],["Propranolol",0,"Used to control heart rate in thyroid storm."],["Saturated solution of potassium iodide",0,"Used before surgery to reduce gland vascularity."],["Methimazole",0,"Blocks thyroid hormone production; unrelated to calcium."]],"id":"q56"},{"ch":55,"t":"Thyroidectomy","cj":"Recognize Cues","type":"hl","stem":"The nurse reads this note on a client 6 hours after total thyroidectomy. Select the findings that require follow-up.","segs":[["Client in ",null],["semi-Fowler position",0],[". Anterior dressing dry. ",null],["Blood pooled on the pillow behind the neck",1],[". Drain holds a ",null],["moderate amount of serosanguineous fluid",0],[". ",null],["High-pitched sound heard on inspiration",1],[". Client ",null],["reports tingling of the lips and toes",1],[". ",null],["Temperature 100.4 F, up from 98.8 F",1],[". ",null],["Heart rate 78 beats/min",0],[". ",null],["Performing deep breathing every hour",0],[".",null]],"why":"Blood behind the neck indicates hemorrhage, which can be hidden from an anterior view. Stridor signals airway obstruction. Tingling signals hypocalcemia from parathyroid injury. A temperature rise of more than 1 F may signal thyroid storm. A moderate amount of serosanguineous drainage, semi-Fowler positioning, a normal heart rate, and deep breathing are expected.","id":"q57"},{"ch":55,"t":"Thyroidectomy","cj":"Generate Solutions","type":"mc","stem":"The nurse prepares a room for a client returning from thyroidectomy. Which equipment is the priority to have at the bedside?","o":[["Emergency tracheostomy equipment with working oxygen and suction",1,"Swelling, tetany, or laryngeal nerve damage can obstruct the airway; this equipment is kept in the room."],["Cooling blanket",0,"Used for thyroid storm, which is now uncommon after surgery."],["Warm blankets",0,"Used in myxedema coma."],["Gait belt",0,"Useful for fall prevention but not the priority."]],"id":"q58"},{"ch":55,"t":"Thyroid storm","cj":"Generate Solutions","type":"matrix","stem":"A client with Graves disease and a severe infection has a temperature of 104.2 F, heart rate of 156 beats/min, vomiting, and agitation. For each potential order, select whether it is indicated or contraindicated.","cols":["Indicated","Contraindicated"],"rows":[["Oral propranolol",0,"Propranolol is given to control heart rate."],["Aspirin for fever",1,"Nonsalicylate antipyretics are specified."],["Cooling blanket",0,"A cooling blanket or ice packs reduce fever."],["Methimazole",0,"Antithyroid drugs are given as prescribed."],["Palpate the thyroid every shift to track its size",1,"Vigorous palpation of the goiter can lead to thyroid storm."],["Normal saline infusion",0,"Dehydration is corrected with normal saline."],["Glucocorticoid",0,"Glucocorticoids are given as prescribed."]],"id":"q59"},{"ch":55,"t":"Graves disease","cj":"Generate Solutions","type":"mc","stem":"A client with Graves disease cannot close the eyelids completely during sleep. Which teaching prevents corneal injury?","o":[["Gently tape the lids closed at bedtime and use artificial tears",1,"These are the stated measures for clients who cannot close the eyelids."],["Sleep flat to reduce pressure behind the eyes",0,"The head of the bed is elevated at night."],["Expect the eyes to return to normal once thyroid levels are controlled",0,"Eye problems are usually not fully corrected by treating the hyperthyroidism."],["Keep the room brightly lit",0,"Photophobia is common; dark glasses may help."]],"id":"q60"},{"ch":55,"t":"Hypothyroidism","cj":"Evaluate Outcomes","type":"mc","stem":"Three weeks after a levothyroxine dose increase, a client reports difficulty falling asleep and four loose stools a day. How does the nurse interpret this report?","o":[["The dose may be too high and may need to be decreased",1,"Difficulty sleeping with more bowel movements than usual suggests the dose may need to be decreased."],["The dose is too low and thyroid levels should be rechecked",0,"Too little hormone shows as more sleep and constipation."],["The drug is not being absorbed",0,"Poor absorption would produce hypothyroid symptoms."],["These are expected effects that resolve without a change",0,"They are the two self-monitoring signs the client is taught to report."]],"id":"q61"},{"ch":55,"t":"Hypoparathyroidism","cj":"Recognize Cues","type":"mc","stem":"A client who had neck surgery last week has a serum calcium of 6.9 mg/dL. Which assessment finding does the nurse expect?","o":[["Positive Trousseau and Chvostek signs",1,"Positive responses indicate potential tetany from hypocalcemia."],["Kidney stones",0,"Kidney stones are a result of high calcium levels."],["Constipation with lethargy",0,"These occur when serum calcium is high."],["Peptic ulcer disease",0,"Elevated gastrin from hypercalcemia leads to ulcers."]],"id":"q62"},{"ch":55,"t":"Hypoparathyroidism","cj":"Generate Solutions","type":"mc","stem":"A client with hypoparathyroidism asks why the calcium dose is not raised to bring the level to the middle of the normal range. Which explanation is accurate?","o":[["“The level is kept low-normal to stop symptoms without raising urine calcium, which causes kidney stones.”",1,"Dosage is adjusted to prevent symptoms while staying low enough to prevent increased urine calcium and stone formation."],["“Higher calcium levels would damage the thyroid gland.”",0,"This is not a described effect."],["“The level will rise on its own once the glands recover.”",0,"Therapy for hypocalcemia is lifelong."],["“High-calcium foods must be avoided completely for the same reason.”",0,"High-calcium foods are eaten in moderation, not avoided."]],"id":"q63"},{"ch":55,"t":"Hyperparathyroidism","cj":"Recognize Cues","type":"sata","stem":"A client has a serum calcium of 12.6 mg/dL and an elevated parathyroid hormone level. Which findings does the nurse expect? Select all that apply.","o":[["Kidney stones",1,"High parathyroid hormone levels cause kidney stones and calcium deposits in the kidney."],["Bone pain or fractures",1,"Increased bone destruction causes fractures, cysts, and osteoporosis."],["Constipation",1,"Gastrointestinal problems including constipation are common when calcium is high."],["Epigastric pain",1,"Hypercalcemia raises gastrin and leads to peptic ulcer disease."],["Confusion",1,"Above 12 mg/dL the client may develop psychosis with confusion."],["Tingling around the mouth",0,"This reflects hypocalcemia."],["Spasms of the hands and feet",0,"Tetany reflects hypocalcemia."]],"id":"q64"},{"ch":55,"t":"Parathyroid function","cj":"Analyze Cues","type":"cloze","stem":"Complete the statements about parathyroid function.","parts":["A client with a parathyroid adenoma is expected to have a serum calcium that is ",{"o":["increased","decreased"],"a":0}," and a serum phosphorus that is ",{"o":["decreased","increased"],"a":0},". A client whose parathyroid glands were injured during thyroidectomy is expected to have a serum calcium that is ",{"o":["decreased","increased"],"a":0},", which places the client at risk for ",{"o":["tetany","kidney stones"],"a":0},"."],"why":"Excess parathyroid hormone pulls calcium from bone and increases phosphorus excretion: calcium high, phosphorus low. Loss of parathyroid hormone lets calcium fall, and low calcium makes nerves and muscles hyperexcitable (tetany).","id":"q65"},{"ch":56,"t":"Type 1 diabetes mellitus","cj":"Generate Solutions","type":"mc","stem":"A 24-year-old client with abrupt weight loss, thirst, and ketones in the urine is diagnosed with autoimmune destruction of the pancreatic beta cells. The client asks to try pills first. Which response is accurate?","o":[["“Insulin is required because your body no longer makes it.”",1,"Beta cell destruction causes absolute insulin deficiency; all clients with type 1 diabetes mellitus depend on insulin."],["“Pills that trigger insulin release can be tried for 3 months.”",0,"Insulin stimulators work only in clients who can still produce insulin."],["“Diet and exercise alone are usually enough at your age.”",0,"There is no insulin to work with; lifestyle alone cannot replace it."],["“Insulin is needed only when ketones are present.”",0,"Insulin is required continuously."]],"id":"q66"},{"ch":56,"t":"Diagnosis","cj":"Analyze Cues","type":"mc","stem":"Four clients without symptoms had screening tests. Which result meets a criterion for diabetes mellitus?","o":[["A1C of 6.8%",1,"An A1C of 6.5% or higher meets the criterion."],["Fasting blood glucose of 118 mg/dL",0,"100 to 125 mg/dL is the prediabetes range."],["Two-hour glucose tolerance result of 168 mg/dL",0,"140 to 199 mg/dL is the prediabetes range."],["Random glucose of 182 mg/dL",0,"A random value must exceed 200 mg/dL and be accompanied by classic symptoms or crisis."]],"id":"q67"},{"ch":56,"t":"Monitoring","cj":"Evaluate Outcomes","type":"mc","stem":"A client's log shows fasting glucose values of 92 to 108 mg/dL for 3 months. The A1C is 8.6%. Which conclusion does the nurse draw?","o":[["Glucose is above target at other times of the day, and the plan needs review",1,"A1C reflects the average over about 3 months; the target is below 7%, so values outside the fasting checks must be high."],["The plan is effective because the fasting values are in range",0,"The A1C shows the overall average is too high."],["The A1C is inaccurate because the client was fasting when it was drawn",0,"A1C is not altered by recent intake."],["The client is having frequent hypoglycemia",0,"Frequent lows would pull the average down, not up."]],"id":"q68"},{"ch":56,"t":"Antidiabetic drugs","cj":"Evaluate Outcomes","type":"mc","stem":"A client taking metformin makes these statements. Which one indicates a need for more teaching?","o":[["“A few drinks each night will not matter with this drug.”",1,"Alcohol with metformin increases the risk for lactic acidosis."],["“I take it with food so my stomach is less upset.”",0,"Correct; gastrointestinal effects are common and food lessens them."],["“I will remind the staff about this drug before a scan with dye.”",0,"Correct; it is stopped before imaging with contrast agents."],["“I know the signs of low blood sugar.”",0,"Correct; all clients on antidiabetic drugs learn these."]],"id":"q69"},{"ch":56,"t":"Antidiabetic drugs","cj":"Recognize Cues","type":"mc","stem":"A client taking empagliflozin reports the following. Which report requires immediate evaluation?","o":[["Swelling, tenderness, and redness of the perineal skin",1,"These suggest Fournier gangrene with perineal fasciitis, a risk with this drug class."],["Urinating more often than before",0,"Increased urine output is expected because the kidney excretes glucose."],["Thirst on hot days",0,"The client is taught to watch for dehydration; thirst alone calls for fluids and monitoring."],["Glucose present on a urine dipstick",0,"Glucose in the urine is how the drug works."]],"id":"q70"},{"ch":56,"t":"Antidiabetic drugs","cj":"Recognize Cues","type":"mc","stem":"A provider plans to start liraglutide for a client with type 2 diabetes mellitus. Which history finding does the nurse report before the first dose?","o":[["Delayed gastric emptying from autonomic neuropathy",1,"This class delays gastric emptying and is contraindicated in gastroparesis."],["Body mass index of 34",0,"Not a contraindication."],["Hypertension controlled with an ACE inhibitor",0,"Not a contraindication."],["Dislike of injections",0,"A teaching need; most drugs in this class are injected, but this is not a safety contraindication."]],"id":"q71"},{"ch":56,"t":"Antidiabetic drugs","cj":"Take Action","type":"mc","stem":"A client with type 2 diabetes mellitus and symptomatic heart failure has a new order for pioglitazone. Which action does the nurse take?","o":[["Question the order before giving the drug",1,"This class carries a boxed warning against use in symptomatic heart failure."],["Give the drug and weigh the client weekly",0,"Daily weights are taught for clients on the drug, but this client should not receive it."],["Give the drug only with meals",0,"Meal timing applies to alpha-glucosidase inhibitors."],["Give the drug and teach signs of pancreatitis",0,"Pancreatitis risk belongs to incretin-based drugs."]],"id":"q72"},{"ch":56,"t":"Insulin therapy","cj":"Take Action","type":"mc","stem":"At 0700 a client's glucose is 132 mg/dL and insulin aspart is due. Breakfast trays arrive at 0745. Which action does the nurse take?","o":[["Give the insulin within 10 minutes before the tray is served",1,"Rapid-acting insulin is given within 10 minutes before mealtime when glucose is in the target range."],["Give the insulin now so it is working when the tray arrives",0,"Onset is 10 to 20 minutes; 45 minutes without food risks hypoglycemia."],["Hold the dose because the glucose is in range",0,"Mealtime insulin covers the coming meal."],["Give the dose intramuscularly at 0700 so it acts faster",0,"Intramuscular injection absorbs faster and is not used for routine insulin; the timing problem remains."]],"id":"q73"},{"ch":56,"t":"Insulin therapy","cj":"Analyze Cues","type":"mc","stem":"A client receives NPH insulin at 0730. During which period is hypoglycemia from this dose most likely?","o":[["1330 to 2130",1,"NPH peaks 6 to 14 hours after injection."],["0745 to 0830",0,"Onset is 60 to 120 minutes; the drug is not yet active."],["0830 to 1030",0,"This is the peak window of a rapid-acting insulin."],["0730 the next morning",0,"By 24 hours the duration is ending, well past the peak."]],"id":"q74"},{"ch":56,"t":"Fasting hyperglycemia","cj":"Analyze Cues","type":"cloze","stem":"A client on NPH and regular insulin has a glucose of 54 mg/dL at 0300 and 248 mg/dL at 0700 on three nights. Complete the statements.","parts":["The morning hyperglycemia is best explained by ",{"o":["Somogyi phenomenon","dawn phenomenon"],"a":0},", which results from ",{"o":["a counterregulatory response to nighttime hypoglycemia","a nighttime release of hormones without hypoglycemia"],"a":0},". It is managed by ",{"o":["ensuring adequate intake at bedtime and evaluating the insulin dose","giving more insulin overnight"],"a":0},"."],"why":"A low value during the night followed by a high morning value is rebound hyperglycemia (Somogyi). The fix is to prevent the nighttime low with a bedtime snack and a review of the insulin dose and exercise. Giving more insulin overnight is the fix for dawn phenomenon and would deepen the low here.","id":"q75"},{"ch":56,"t":"Fasting hyperglycemia","cj":"Generate Solutions","type":"mc","stem":"A client's glucose is 146 mg/dL at 0300 and 212 mg/dL at 0600 on repeated nights. The evening NPH is given with dinner at 1730. Which change does the nurse anticipate?","o":[["Moving the evening NPH dose to 2200",1,"Glucose rising from about 5 to 6 a.m. without a nighttime low is dawn phenomenon; it is managed by providing more insulin for the overnight period."],["Adding a larger bedtime snack",0,"A snack treats rebound from nighttime hypoglycemia, which is absent here."],["Reducing the evening NPH dose",0,"Less overnight insulin worsens the morning rise."],["Omitting the morning insulin dose",0,"This does not address overnight coverage."]],"id":"q76"},{"ch":56,"t":"Insulin therapy","cj":"Generate Solutions","type":"sata","stem":"Which instructions about insulin storage and preparation does the nurse include? Select all that apply.","o":[["Refrigerate insulin that is not in use",1,"Refrigeration maintains potency."],["Discard an in-use vial after 28 days",1,"In-use insulin may be kept at room temperature for up to 28 days, then discarded."],["Gently roll the NPH vial; it should look uniformly cloudy",1,"NPH preparations are uniformly cloudy after gentle rolling."],["Inspect the vial for clumping, frosting, or a color change before each use",1,"These changes may indicate loss of potency."],["Shake the vial vigorously to mix it",0,"Excessive shaking is avoided."],["Keep a spare supply in the freezer",0,"Insulin should not be allowed to freeze."],["Reuse each syringe for 1 day",0,"Disposable needles are used only once."]],"id":"q77"},{"ch":56,"t":"Insulin therapy","cj":"Take Action","type":"mc","stem":"The nurse gives subcutaneous insulin to a frail, very thin 88-year-old client. Which technique is correct?","o":[["Insert the needle at a 45-degree angle without aspirating",1,"A 45-degree angle is used for frail older adults and very thin clients; aspiration is not needed."],["Insert the needle at a 90-degree angle and aspirate for blood",0,"Ninety degrees suits most clients, but not this one, and aspiration is not needed."],["Inject into muscle for faster absorption",0,"Intramuscular injection is not used for routine insulin."],["Insert the needle at a 90-degree angle without lifting a skinfold",0,"That technique is described for clients who are overweight using short needles."]],"id":"q78"},{"ch":56,"t":"Hypoglycemia","cj":"Take Action","type":"order","stem":"A hospitalized client is shaky and irritable but alert and able to swallow. Blood glucose is 58 mg/dL. Place the nurse's actions in the correct order.","items":["Give 15 g of a fast-acting liquid carbohydrate","Recheck the blood glucose in 15 minutes","Repeat the 15 g of carbohydrate because the result is 64 mg/dL","Recheck the blood glucose in another 15 minutes","Give crackers with nut butter once the result is above the hypoglycemic range"],"why":"The 15-15 rule: treat with 15 g of carbohydrate, recheck in 15 minutes, and repeat the same treatment while the value stays low. A complex carbohydrate comes last, after the glucose has recovered, to prevent another drop.","id":"q79"},{"ch":56,"t":"Hypoglycemia","cj":"Take Action","type":"mc","stem":"A client is found unresponsive with cold, clammy skin. Blood glucose is 34 mg/dL. The IV site infiltrated an hour ago and has not been replaced. Which action does the nurse take first?","o":[["Give glucagon by the intramuscular or nasal route",1,"Glucagon is first-line therapy for severe hypoglycemia in a client who cannot swallow."],["Place glucose gel inside the cheek",0,"The client cannot swallow; oral treatment risks aspiration."],["Give half a cup of fruit juice",0,"The client cannot swallow."],["Recheck the glucose in 15 minutes",0,"Rechecking follows treatment; delaying treatment risks seizure and coma."]],"id":"q80"},{"ch":56,"t":"Hypoglycemia","cj":"Take Action","type":"mc","stem":"The nurse has just given glucagon to an unconscious client. Which action comes next?","o":[["Position the client on the side",1,"Glucagon can induce vomiting; side-lying positioning prevents aspiration."],["Give a small meal",0,"A meal is given once the client is awake and no longer nauseated."],["Give a second dose immediately",0,"A second dose is given in 10 minutes if the client remains unconscious."],["Stop glucose checks until the client wakes",0,"Glucose is monitored every 15 minutes until hypoglycemia resolves."]],"id":"q81"},{"ch":56,"t":"Glucose emergencies","cj":"Analyze Cues","type":"matrix","stem":"For each finding, select the condition it indicates.","cols":["Hypoglycemia","Hyperglycemia"],"rows":[["Cool, clammy skin",0,"Autonomic activation produces sweating."],["Warm, dry skin",1,"Dehydration and vasodilation."],["Rapid, deep respirations with a fruity odor",1,"Kussmaul respirations with acetone odor accompany ketosis."],["Tremors with hunger and palpitations",0,"Early neurogenic warning signs."],["Poor skin turgor and orthostatic hypotension",1,"Dehydration is present with hyperglycemia and absent with hypoglycemia."],["Sudden irritability and nervousness",0,"Classic mental status changes of low glucose."]],"id":"q82"},{"ch":56,"t":"Hypoglycemia","cj":"Recognize Cues","type":"sata","stem":"A client on a basal and mealtime insulin regimen has had three episodes of hypoglycemia this week. Which factors in the history increase the risk? Select all that apply.","o":[["Drinks wine in the evening without eating",1,"Alcohol inhibits liver glucose production and can cause hypoglycemia hours later."],["Declining kidney function",1,"Progressive kidney failure decreases insulin clearance."],["Delayed gastric emptying",1,"Gastroparesis mismatches nutrient absorption and insulin action."],["Began running 5 miles each afternoon",1,"Prolonged exercise increases muscle glucose uptake for several hours."],["Often eats lunch 2 hours late",1,"Missed or delayed meals are a listed cause."],["Started prednisone for asthma",0,"Glucocorticoids raise blood glucose."],["Has a urinary tract infection",0,"Infection is a stressor that raises blood glucose."]],"id":"q83"},{"ch":56,"t":"Exercise","cj":"Take Action","type":"mc","stem":"A client with type 1 diabetes mellitus plans a vigorous run. Blood glucose is 284 mg/dL and urine ketones are positive. Which instruction is correct?","o":[["“Do not exercise now.”",1,"Vigorous exercise is performed only when glucose is 100 to 250 mg/dL and no ketones are present."],["“Eat a carbohydrate snack and then run.”",0,"A pre-exercise snack is for lower glucose values or long gaps since a meal."],["“Run a shorter distance and carry a simple sugar.”",0,"Carrying sugar is correct in general, but exercise is not appropriate with ketones."],["“Inject your insulin and begin running within the hour.”",0,"Exercise within 1 hour of an insulin
