 injection is avoided."]],"id":"q84"},{"ch":56,"t":"Sick-day management","cj":"Generate Solutions","type":"sata","stem":"A client with type 1 diabetes mellitus has gastroenteritis and is eating very little. Which instructions does the nurse give? Select all that apply.","o":[["Check blood glucose at least every 2 to 4 hours",1,"A stated sick-day rule."],["Test urine for ketones even if glucose is in range",1,"Ketones are tested particularly when vomiting."],["Continue taking insulin",1,"Insulin therapy is not omitted during illness."],["Drink 8 to 12 ounces of sugar-free fluid every hour while awake",1,"This prevents dehydration; fluids with sugar are used if glucose is below target."],["Call the provider for a fever lasting more than 24 hours",1,"A listed reason to call."],["Skip insulin doses until a normal diet resumes",0,"Omitting insulin during illness leads to diabetic ketoacidosis."]],"id":"q85"},{"ch":56,"t":"Foot care","cj":"Evaluate Outcomes","type":"mc","stem":"A client with peripheral neuropathy describes a daily foot routine. Which statement indicates a need for more teaching?","o":[["“I warm my feet with a heating pad at night.”",1,"Heating pads, hot-water bottles, and portable heaters are never used; the client cannot feel a burn."],["“I shake out my shoes and feel inside them before I put them on.”",0,"Correct; shoes are checked for objects and torn linings."],["“I cut my toenails straight across.”",0,"Correct."],["“I use lotion on my feet but not between my toes.”",0,"Correct."]],"id":"q86"},{"ch":56,"t":"Diabetic kidney disease","cj":"Generate Solutions","type":"mc","stem":"A client with type 2 diabetes mellitus and persistent albuminuria starts lisinopril. Which laboratory value does the nurse monitor for an adverse effect of this drug?","o":[["Serum potassium",1,"Potassium is monitored for hyperkalemia with ACE inhibitor or angiotensin receptor blocker therapy."],["Serum calcium",0,"Not affected by this therapy."],["Urine ketones",0,"Unrelated to this drug."],["Serum bicarbonate",0,"Not the monitoring parameter named for this drug."]],"id":"q87"},{"ch":56,"t":"Neuropathy","cj":"Analyze Cues","type":"mc","stem":"A client with diabetes mellitus for 25 years has a glucose of 46 mg/dL on a routine check but reports feeling fine, with no tremor, sweating, or hunger. Which explanation is most likely?","o":[["Autonomic neuropathy has removed the warning signs of hypoglycemia",1,"Defective balancing hormones in autonomic neuropathy cause loss of hypoglycemia warning signs."],["The meter reading is wrong because the client has no symptoms",0,"Symptoms cannot be relied on in this client; the value is treated."],["Long-standing diabetes makes this value safe",0,"The brain depends on a continuous glucose supply at any duration of disease."],["Dawn phenomenon is lowering the glucose",0,"Dawn phenomenon raises early-morning glucose."]],"id":"q88"},{"ch":56,"t":"Hyperglycemic-hyperosmolar state","cj":"Evaluate Outcomes","type":"mc","stem":"An older client being treated for a glucose of 980 mg/dL and a serum osmolarity of 352 mOsm/L became more alert over 4 hours of IV fluids. At hour 6 the client is difficult to arouse. How does the nurse interpret this change?","o":[["Plasma osmolarity may be falling too quickly; notify the provider immediately",1,"Regression after initial improvement may indicate a too-rapid reduction in plasma osmolarity, and changes in level of consciousness are reported at once."],["Fluid replacement is too slow; increase the rate",0,"Too-slow replacement shows as a lack of improvement, not improvement followed by decline."],["The client is resting now that glucose is falling",0,"A declining level of consciousness is never assumed to be benign in this condition."],["Ketoacidosis is developing",0,"This condition is distinguished by absent or low ketones."]],"id":"q89"},{"ch":56,"t":"Glucose emergencies","cj":"Analyze Cues","type":"matrix","stem":"For each finding, select the condition it is most consistent with.","cols":["Diabetic ketoacidosis","Hyperglycemic-hyperosmolar state"],"rows":[["Serum ketones positive",0,"Ketones are positive in ketoacidosis and negative in the hyperosmolar state."],["Serum pH of 7.26",0,"pH is below 7.35."],["Serum glucose of 890 mg/dL",1,"Glucose exceeds 600 mg/dL."],["Serum osmolarity of 342 mOsm/L",1,"Osmolarity exceeds 320 mOsm/L."],["Deep, rapid respirations",0,"Kussmaul respirations compensate for metabolic acidosis."],["Onset over several days with poor fluid intake",1,"Onset is gradual; poor fluid intake is a precipitating factor."],["Serum bicarbonate of 11 mEq/L",0,"Bicarbonate is below 15 mEq/L."]],"id":"q90"},{"ch":56,"t":"Diabetic ketoacidosis","cj":"Take Action","type":"order","stem":"A client arrives with a glucose of 520 mg/dL, positive ketones, and a pH of 7.14. Place the steps of care in the order they occur.","items":["Assess airway and level of consciousness","Infuse 0.9% saline at 15 to 20 mL/kg/hr for the first hour","Change the IV fluid to 5% dextrose in 0.45% saline when glucose reaches 250 mg/dL","Start subcutaneous insulin once the client takes oral fluids and ketosis has stopped"],"why":"Assessment of the airway and level of consciousness comes first. The first outcome of fluid therapy is to restore blood volume. Dextrose is added when glucose reaches 250 mg/dL to prevent hypoglycemia and cerebral edema. Subcutaneous insulin begins only after oral fluids are tolerated and ketosis has stopped.","id":"q91"},{"ch":56,"t":"Diabetic ketoacidosis","cj":"Recognize Cues","type":"sata","case":"A","ex":"\u003cp>\u003cb>Emergency department, 0900.\u003c/b> A 22-year-old client with type 1 diabetes mellitus has had influenza with vomiting for 2 days. The client stopped taking insulin “because I wasn't eating.”\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Vital signs\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Temperature 100.8 F\u003cbr>Heart rate 124 beats/min\u003cbr>Blood pressure 92/58 mm Hg\u003cbr>Respirations 32/min, deep\u003cbr>Oxygen saturation 98% on room air\u003c/td>\n\u003ctd>Glucose 486 mg/dL\u003cbr>Venous pH 7.18\u003cbr>Bicarbonate 10 mEq/L\u003cbr>Potassium 5.4 mEq/L\u003cbr>Sodium 136 mEq/L\u003cbr>Serum ketones positive\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Drowsy but arousable. Breath has a fruity odor. Reports abdominal pain. Skin warm and dry with poor turgor.\u003c/p>","stem":"Which findings require immediate follow-up? Select all that apply.","o":[["Respirations 32/min and deep",1,"Kussmaul respirations indicate metabolic acidosis; with them, the condition can quickly lead to shock and coma."],["Blood pressure 92/58 mm Hg with heart rate 124 beats/min",1,"These indicate volume depletion from osmotic diuresis and vomiting."],["Venous pH 7.18 with positive ketones",1,"This is significant acidosis."],["Drowsy but arousable",1,"A reduced level of consciousness in this setting can progress to coma."],["Oxygen saturation 98% on room air",0,"Within the expected range."],["Sodium 136 mEq/L",0,"Within the reference range."]],"id":"q92"},{"ch":56,"t":"Diabetic ketoacidosis","cj":"Analyze Cues","type":"cloze","case":"A","ex":"\u003cp>\u003cb>Emergency department, 0900.\u003c/b> A 22-year-old client with type 1 diabetes mellitus has had influenza with vomiting for 2 days. The client stopped taking insulin “because I wasn't eating.”\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Vital signs\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Temperature 100.8 F\u003cbr>Heart rate 124 beats/min\u003cbr>Blood pressure 92/58 mm Hg\u003cbr>Respirations 32/min, deep\u003cbr>Oxygen saturation 98% on room air\u003c/td>\n\u003ctd>Glucose 486 mg/dL\u003cbr>Venous pH 7.18\u003cbr>Bicarbonate 10 mEq/L\u003cbr>Potassium 5.4 mEq/L\u003cbr>Sodium 136 mEq/L\u003cbr>Serum ketones positive\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Drowsy but arousable. Breath has a fruity odor. Reports abdominal pain. Skin warm and dry with poor turgor.\u003c/p>","stem":"Complete the statements about this client.","parts":["The findings are most consistent with ",{"o":["diabetic ketoacidosis","hyperglycemic-hyperosmolar state","hypoglycemia"],"a":0},", as shown by ",{"o":["positive ketones with a pH of 7.18","a sodium of 136 mEq/L","an oxygen saturation of 98%"],"a":0},". The breathing pattern is ",{"o":["compensation for metabolic acidosis","a sign of fluid overload","a response to fever alone"],"a":0},". The most likely trigger was ",{"o":["infection combined with omitted insulin","excess insulin","too much carbohydrate"],"a":0},"."],"why":"Glucose above 300 mg/dL, pH below 7.35, bicarbonate below 15 mEq/L, and positive ketones define diabetic ketoacidosis. Kussmaul respirations blow off carbon dioxide to offset the acidosis. Infection or illness is the most common precipitating factor, and insulin must not be omitted during illness.","id":"q93"},{"ch":56,"t":"Diabetic ketoacidosis","cj":"Prioritize Hypotheses","type":"mc","case":"A","ex":"\u003cp>\u003cb>Emergency department, 0900.\u003c/b> A 22-year-old client with type 1 diabetes mellitus has had influenza with vomiting for 2 days. The client stopped taking insulin “because I wasn't eating.”\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Vital signs\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Temperature 100.8 F\u003cbr>Heart rate 124 beats/min\u003cbr>Blood pressure 92/58 mm Hg\u003cbr>Respirations 32/min, deep\u003cbr>Oxygen saturation 98% on room air\u003c/td>\n\u003ctd>Glucose 486 mg/dL\u003cbr>Venous pH 7.18\u003cbr>Bicarbonate 10 mEq/L\u003cbr>Potassium 5.4 mEq/L\u003cbr>Sodium 136 mEq/L\u003cbr>Serum ketones positive\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Drowsy but arousable. Breath has a fruity odor. Reports abdominal pain. Skin warm and dry with poor turgor.\u003c/p>","stem":"Which problem poses the greatest immediate threat to this client?","o":[["Inadequate perfusion from fluid volume deficit",1,"Hypotension and tachycardia show volume depletion; the first outcome of fluid therapy is to restore blood volume and maintain perfusion to vital organs."],["Hypokalemia",0,"Potassium is 5.4 mEq/L now; it falls later, after insulin and fluids begin."],["Hypoglycemia",0,"Glucose is 486 mg/dL."],["Fluid overload",0,"The client is volume depleted; overload is a risk to watch for during replacement."]],"id":"q94"},{"ch":56,"t":"Diabetic ketoacidosis","cj":"Generate Solutions","type":"matrix","case":"A","ex":"\u003cp>\u003cb>Emergency department, 0900.\u003c/b> A 22-year-old client with type 1 diabetes mellitus has had influenza with vomiting for 2 days. The client stopped taking insulin “because I wasn't eating.”\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Vital signs\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Temperature 100.8 F\u003cbr>Heart rate 124 beats/min\u003cbr>Blood pressure 92/58 mm Hg\u003cbr>Respirations 32/min, deep\u003cbr>Oxygen saturation 98% on room air\u003c/td>\n\u003ctd>Glucose 486 mg/dL\u003cbr>Venous pH 7.18\u003cbr>Bicarbonate 10 mEq/L\u003cbr>Potassium 5.4 mEq/L\u003cbr>Sodium 136 mEq/L\u003cbr>Serum ketones positive\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Drowsy but arousable. Breath has a fruity odor. Reports abdominal pain. Skin warm and dry with poor turgor.\u003c/p>","stem":"For each potential order, select whether it is indicated or not indicated at this time.","cols":["Indicated","Not indicated"],"rows":[["0.9% saline at 15 to 20 mL/kg/hr for the first hour",0,"Typical initial rate to restore blood volume."],["Regular insulin by continuous IV infusion",0,"Usual management, because insulin's half-life is short and subcutaneous insulin has a delayed onset."],["IV sodium bicarbonate",1,"Used only when arterial pH is 7.0 or less or bicarbonate is below 5 mEq/L."],["IV potassium chloride now",1,"Replacement begins after the serum level falls below 5.0 mEq/L; it is 5.4 mEq/L."],["Subcutaneous long-acting insulin as the only insulin",1,"Subcutaneous insulin is started when oral fluids are tolerated and ketosis has stopped."],["Hourly urine output and mental status checks",0,"Urine output, temperature, and mental status are recorded every hour."]],"id":"q95"},{"ch":56,"t":"Diabetic ketoacidosis","cj":"Take Action","type":"sata","case":"A","ex":"\u003cp>\u003cb>Emergency department, 0900.\u003c/b> A 22-year-old client with type 1 diabetes mellitus has had influenza with vomiting for 2 days. The client stopped taking insulin “because I wasn't eating.”\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Vital signs\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Temperature 100.8 F\u003cbr>Heart rate 124 beats/min\u003cbr>Blood pressure 92/58 mm Hg\u003cbr>Respirations 32/min, deep\u003cbr>Oxygen saturation 98% on room air\u003c/td>\n\u003ctd>Glucose 486 mg/dL\u003cbr>Venous pH 7.18\u003cbr>Bicarbonate 10 mEq/L\u003cbr>Potassium 5.4 mEq/L\u003cbr>Sodium 136 mEq/L\u003cbr>Serum ketones positive\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Drowsy but arousable. Breath has a fruity odor. Reports abdominal pain. Skin warm and dry with poor turgor.\u003c/p>\u003cp>\u003cb>1300 update:\u003c/b> Glucose 242 mg/dL. Potassium 4.4 mEq/L. Urine output 45 mL/hr. Blood pressure 108/66 mm Hg. Receiving 0.9% saline and a continuous regular insulin infusion. Still nauseated; taking nothing by mouth.\u003c/p>","stem":"Based on the 1300 update, which actions does the nurse anticipate? Select all that apply.","o":[["Changing the IV fluid to 5% dextrose in 0.45% saline",1,"This is done when glucose reaches 250 mg/dL to prevent hypoglycemia and cerebral edema."],["Starting potassium replacement",1,"Potassium has fallen below 5.0 mEq/L and urine output is at least 30 mL/hr."],["Continuing the regular insulin infusion",1,"Ketosis has not been shown to be resolved and the client is not taking oral fluids."],["Stopping the insulin infusion because glucose is below 250 mg/dL",0,"Dextrose is added so that insulin can continue safely."],["Giving sodium bicarbonate",0,"Reserved for a pH of 7.0 or less."],["Changing to subcutaneous insulin now",0,"The client is still nauseated and taking nothing by mouth."]],"id":"q96"},{"ch":56,"t":"Diabetic ketoacidosis","cj":"Evaluate Outcomes","type":"mc","case":"A","ex":"\u003cp>\u003cb>Emergency department, 0900.\u003c/b> A 22-year-old client with type 1 diabetes mellitus has had influenza with vomiting for 2 days. The client stopped taking insulin “because I wasn't eating.”\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Vital signs\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Temperature 100.8 F\u003cbr>Heart rate 124 beats/min\u003cbr>Blood pressure 92/58 mm Hg\u003cbr>Respirations 32/min, deep\u003cbr>Oxygen saturation 98% on room air\u003c/td>\n\u003ctd>Glucose 486 mg/dL\u003cbr>Venous pH 7.18\u003cbr>Bicarbonate 10 mEq/L\u003cbr>Potassium 5.4 mEq/L\u003cbr>Sodium 136 mEq/L\u003cbr>Serum ketones positive\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Drowsy but arousable. Breath has a fruity odor. Reports abdominal pain. Skin warm and dry with poor turgor.\u003c/p>\u003cp>\u003cb>1300 update:\u003c/b> Glucose 242 mg/dL. Potassium 4.4 mEq/L. Urine output 45 mL/hr. Blood pressure 108/66 mm Hg. Receiving 0.9% saline and a continuous regular insulin infusion. Still nauseated; taking nothing by mouth.\u003c/p>","stem":"The next morning, which set of results shows that the condition has resolved?","o":[["Glucose 186 mg/dL, bicarbonate 20 mEq/L, venous pH 7.34, anion gap 10",1,"Resolution requires glucose below 200, bicarbonate above 18, venous pH above 7.30, and anion gap below 12."],["Glucose 148 mg/dL, bicarbonate 14 mEq/L, venous pH 7.26, anion gap 18",0,"Glucose has normalized but the acidosis persists."],["Glucose 240 mg/dL, bicarbonate 19 mEq/L, venous pH 7.32, anion gap 11",0,"Glucose is still above 200 mg/dL."],["Glucose 190 mg/dL, bicarbonate 17 mEq/L, venous pH 7.31, anion gap 14",0,"Bicarbonate and anion gap do not yet meet the criteria."]],"id":"q97"},{"ch":60,"t":"Acute kidney injury","cj":"Take Action","type":"mc","stem":"The day after abdominal surgery, a client's urine output has been 22 mL/hr for the past 2 hours. Serum creatinine rose from 0.9 to 1.3 mg/dL since yesterday. Which action does the nurse take?","o":[["Report the findings to the provider now",1,"Output below 30 mL/hr for 2 hours is reported, and a creatinine rise over hours to days is reported urgently; waiting for 6 hours of oliguria allows kidney damage to progress."],["Continue monitoring until output has been low for 6 hours",0,"Six hours meets the formal definition but delays intervention."],["Recheck the creatinine with tomorrow's routine laboratory tests",0,"The increase already meets the 0.3 mg/dL threshold within 48 hours."],["Start a fluid restriction",0,"Reduced perfusion from volume depletion is a common cause; restriction is used only when fluid overload is present."]],"id":"q98"},{"ch":60,"t":"Acute kidney injury","cj":"Analyze Cues","type":"matrix","stem":"For each cause, select the type of acute kidney injury it produces.","cols":["Prerenal","Intrarenal","Postrenal"],"rows":[["Hemorrhage with shock",0,"Reduced perfusion from a source outside the kidney."],["Enlarged prostate",2,"Urine flow obstruction."],["Aminoglycoside antibiotic therapy",1,"Nephrotoxic agents damage kidney tissue directly."],["Severe dehydration",0,"Volume depletion reduces perfusion."],["Iodinated contrast medium",1,"Contrast media are listed among causes of direct kidney damage."],["Bilateral kidney stones",2,"Urine flow obstruction."],["Sepsis",0,"Sepsis is a common cause of impaired renal perfusion."],["Glomerulonephritis",1,"A disorder of the kidney tissue itself."]],"id":"q99"},{"ch":60,"t":"Acute kidney injury prevention","cj":"Take Action","type":"mc","stem":"A client with 2 days of vomiting has thirst, dizziness on standing, a narrowed pulse pressure, and urine output of 25 mL/hr. The client cannot keep oral fluids down, and the IV runs at a keep-open rate. Which action does the nurse take?","o":[["Request an increase in the IV fluid rate",1,"These are signs of volume depletion; when the client cannot tolerate oral fluid, the nurse requests an increased IV rate to prevent permanent kidney damage."],["Encourage 2 to 3 L of oral water over the day",0,"This is health promotion for adults who can drink; this client cannot tolerate oral intake."],["Request a loop diuretic to increase urine output",0,"A diuretic worsens volume depletion and perfusion."],["Limit fluids until laboratory results return",0,"Restriction is for fluid overload, not depletion."]],"id":"q100"},{"ch":60,"t":"Acute kidney injury prevention","cj":"Take Action","type":"mc","stem":"A client with an estimated glomerular filtration rate of 46 has new orders for gentamicin and scheduled ibuprofen. Which action does the nurse take?","o":[["Question the orders and validate the doses before giving either drug",1,"The nurse questions any order for a potentially nephrotoxic drug; combining two or more dramatically increases the risk for acute kidney injury."],["Give both drugs and monitor urine output every shift",0,"Monitoring does not replace questioning a high-risk combination in a client with reduced function."],["Give the ibuprofen with food to protect the kidneys",0,"Food reduces stomach irritation; it does not reduce kidney risk."],["Give the gentamicin only after the trough level is drawn tomorrow",0,"Peak and trough levels are monitored when the drug must be used, but the combination should first be questioned."]],"id":"q101"},{"ch":60,"t":"Acute kidney injury","cj":"Generate Solutions","type":"mc","stem":"A client recovering from acute kidney injury had urine output below 400 mL/day for a week. Output is now 4 L/day. On which problems does the nurse focus the plan of care?","o":[["Hypovolemia and electrolyte loss",1,"During high-volume output, hypovolemia and electrolyte loss are the main problems; care focuses on replacement and monitoring."],["Fluid overload and hyperkalemia",0,"These belong to the low-output period."],["Hypertension and pulmonary edema",0,"These result from fluid retention, not from polyuria."],["Hypercalcemia and constipation",0,"Not described as problems of this phase."]],"id":"q102"},{"ch":60,"t":"Kidney replacement therapy","cj":"Analyze Cues","type":"sata","stem":"A client has acute kidney injury. Which findings indicate a need for kidney replacement therapy? Select all that apply.","o":[["Potassium of 6.8 mEq/L that continues to rise",1,"Persistent or rapidly rising potassium above 6.5 mEq/L is an indication."],["Arterial pH of 7.06",1,"Severe metabolic acidosis with pH below 7.1 is an indication."],["Pericardial friction rub with new confusion",1,"Symptomatic uremia includes pericarditis and decline in cognition."],["Fluid overload that is impairing tissue perfusion",1,"This is a listed indication."],["Blood urea nitrogen of 28 mg/dL without symptoms",0,"A mildly elevated value without symptoms is not a listed indication."],["Urine output of 45 mL/hr",0,"This output is above the reporting threshold."]],"id":"q103"},{"ch":60,"t":"Kidney replacement therapy","cj":"Take Action","type":"mc","stem":"A client has a temporary dialysis catheter in the internal jugular vein and no other IV access. An IV antibiotic is due. Which action does the nurse take?","o":[["Obtain other IV access; the dialysis catheter is not used for drugs",1,"This catheter is not used to draw blood, give drugs or fluid, or monitor central venous pressure."],["Give the antibiotic through the venous lumen and flush with saline",0,"The catheter is reserved for dialysis."],["Draw a blood sample from the catheter first, then give the drug",0,"Neither sampling nor drug administration is permitted."],["Give the antibiotic through the catheter only during dialysis",0,"The restriction is not lifted during treatment."]],"id":"q104"},{"ch":60,"t":"Chronic kidney disease","cj":"Generate Solutions","type":"mc","stem":"A client's estimated glomerular filtration rate has fallen to 22 mL/min/1.73 m2. Which focus is appropriate for this stage?","o":[["Managing complications and preparing the client for kidney replacement options",1,"A rate of 15 to 29 is stage 4: manage complications, discuss preferences, and prepare for renal replacement therapy."],["Screening for risk factors only",0,"That is the focus when the rate is above 90."],["Starting kidney replacement therapy today",0,"That is the intervention for a rate below 15."],["Encouraging a high-protein diet",0,"Protein is restricted before dialysis begins."]],"id":"q105"},{"ch":60,"t":"Chronic kidney disease","cj":"Analyze Cues","type":"cloze","stem":"A client with long-standing chronic kidney disease has bone pain. Complete the statements.","parts":["Because the kidneys cannot excrete it, serum phosphorus is ",{"o":["increased","decreased"],"a":0},". As a result, serum calcium is ",{"o":["decreased","increased"],"a":0},", and parathyroid hormone secretion is ",{"o":["increased","decreased"],"a":0},". The resulting bone problem is called ",{"o":["renal osteodystrophy","pretibial myxedema","acromegaly"],"a":0},"."],"why":"Reduced phosphorus excretion raises phosphorus and lowers calcium; reduced vitamin D activation lowers calcium further. Chronic low calcium stimulates the parathyroid glands, and the extra hormone releases calcium from bone, causing bone density loss, pain, and fractures.","id":"q106"},{"ch":60,"t":"Chronic kidney disease drugs","cj":"Take Action","type":"mc","stem":"A client on hemodialysis receives epoetin alfa. Today hemoglobin is 12.6 g/dL and blood pressure is 174/100 mm Hg. Which action does the nurse take?","o":[["Hold the dose and notify the provider",1,"Dosing aims for a hemoglobin no higher than 10 to 11 g/dL; overproduction increases blood viscosity and causes hypertension and risk for myocardial infarction."],["Give the dose; the hemoglobin shows the drug is working",0,"The value is above the dosing target and the blood pressure is elevated."],["Give the dose with an iron supplement",0,"Iron supports red cell production and would not address the excess."],["Give the dose after dialysis instead of before",0,"Timing does not address the high hemoglobin."]],"id":"q107"},{"ch":60,"t":"Chronic kidney disease drugs","cj":"Recognize Cues","type":"mc","stem":"A client with stage 4 chronic kidney disease and uremia receives a prescribed opioid for pain. Which assessment is the priority over the following hours?","o":[["Respiratory rate and depth",1,"Opioid effects last longer in advanced kidney disease, and clients with uremia are sensitive to respiratory depression."],["Bowel sounds",0,"Constipation matters but is not the immediate threat."],["Urine specific gravity",0,"Does not reflect the drug's risk."],["Deep tendon reflexes",0,"Not the monitoring priority after an opioid."]],"id":"q108"},{"ch":60,"t":"Chronic kidney disease","cj":"Analyze Cues","type":"mc","stem":"A client with diabetes mellitus and worsening chronic kidney disease takes the same insulin doses as last year. Glucose logs now show repeated values in the 50s. What best explains this change?","o":[["The failing kidneys clear insulin more slowly, so each dose lasts longer",1,"Failing kidneys do not excrete or metabolize insulin well; reduced doses are often required."],["Uremia increases the client's appetite",0,"Uremia causes anorexia and nausea."],["Kidney disease increases glucose loss in the urine",0,"This is not the described mechanism."],["The insulin has lost potency",0,"Loss of potency would raise glucose."]],"id":"q109"},{"ch":60,"t":"Nutrition","cj":"Evaluate Outcomes","type":"mc","stem":"A client began hemodialysis last month. Which statement shows correct understanding of the diet?","o":[["“Now that I am on dialysis, I am allowed more protein than before.”",1,"Protein is 0.55 to 0.60 g/kg/day with chronic uremia and 1.0 to 1.5 g/kg/day with hemodialysis."],["“I use a salt substitute to keep my sodium down.”",0,"Salt substitutes composed of potassium chloride are avoided."],["“I take my phosphate binder at bedtime on an empty stomach.”",0,"Phosphate binders must be taken with meals."],["“I can drink freely because dialysis removes the extra fluid.”",0,"Fluid is limited to 500 to 700 mL/day plus urine output."]],"id":"q110"},{"ch":60,"t":"Uremia","cj":"Recognize Cues","type":"sata","stem":"A client with end-stage kidney disease has not had dialysis for 6 days. Which findings does the nurse attribute to uremia? Select all that apply.","o":[["Metallic taste in the mouth",1,"A listed key feature."],["Hiccups",1,"A listed key feature."],["Muscle cramps",1,"A listed key feature."],["Anorexia with nausea and vomiting",1,"Listed key features."],["Paresthesias",1,"A listed key feature."],["Heat intolerance with weight loss",0,"These are features of thyroid hormone excess."],["Exophthalmos",0,"A feature of Graves disease."]],"id":"q111"},{"ch":60,"t":"Acid-base balance","cj":"Analyze Cues","type":"mc","stem":"A client with stage 5 chronic kidney disease has deep, rapid respirations. Bicarbonate is 13 mEq/L, glucose is 96 mg/dL, and ketones are negative. How does the nurse interpret the breathing pattern?","o":[["Respiratory compensation for metabolic acidosis from retained acid",1,"As acid retention increases, the respiratory system raises the rate and depth of breathing to excrete carbon dioxide (Kussmaul respiration)."],["Diabetic ketoacidosis",0,"Glucose is normal and ketones are negative."],["An effect of opioid sensitivity",0,"Opioids depress respirations."],["Anxiety that will resolve with rest",0,"The bicarbonate level identifies a metabolic cause."]],"id":"q112"},{"ch":60,"t":"Hemodialysis access","cj":"Take Action","type":"mc","stem":"During a routine check, the nurse cannot feel a thrill or hear a bruit over a client's arteriovenous fistula. Which action does the nurse take?","o":[["Notify the nephrology provider promptly",1,"A thrill and bruit show the access is functioning; their absence suggests clotting."],["Take a blood pressure in that arm to check circulation",0,"Compression can cause loss of the access."],["Recheck in 4 hours",0,"The routine interval is for a functioning access; delay risks losing it."],["Draw blood from the fistula to confirm flow",0,"Venipuncture is not performed in the access arm."]],"id":"q113"},{"ch":60,"t":"Hemodialysis","cj":"Take Action","type":"mc","stem":"A client is scheduled for hemodialysis at 0800. The 0730 drugs are enalapril, cefazolin, and a multivitamin with folic acid. Which action does the nurse take?","o":[["Consult the nephrology provider or dialysis nurse about holding these drugs until after the session",1,"All three are dialyzable; vitamins are taken after dialysis, and antihypertensives may add to hypotension during treatment."],["Give all three now so they are absorbed before the session",0,"Dialyzable drugs given before treatment are removed."],["Omit all three for the day",0,"They are given after the session, not skipped."],["Give a double dose after dialysis to replace what was removed",0,"Doses are not doubled."]],"id":"q114"},{"ch":60,"t":"Hemodialysis","cj":"Recognize Cues","type":"mc","stem":"A client returns from hemodialysis. Which finding requires follow-up?","o":[["Temperature of 101.6 F",1,"A fever suggests sepsis and calls for a blood culture; only a slight elevation is expected from blood warming."],["Weight 2.1 kg lower than before the session",0,"Weight is expected to fall with fluid removal."],["Blood pressure of 132/80 mm Hg, down from 152/94 mm Hg",0,"Blood pressure is expected to be lower."],["Temperature of 99.1 F",0,"The machine warms the blood slightly."]],"id":"q115"},{"ch":60,"t":"Hemodialysis","cj":"Take Action","type":"mc","stem":"Two hours after a client returns from hemodialysis, a provider plans an intramuscular injection and a bedside invasive procedure. Which action does the nurse take?","o":[["Ask that invasive procedures be delayed until 4 to 6 hours after dialysis",1,"Heparin used during treatment increases bleeding risk; all invasive procedures are avoided for 4 to 6 hours."],["Proceed, and apply a pressure dressing afterward",0,"A dressing does not remove the anticoagulation risk."],["Proceed, using the arm with the fistula",0,"The access arm is never used."],["Proceed after confirming the weight is lower",0,"Weight does not reflect bleeding risk."]],"id":"q116"},{"ch":60,"t":"Peritoneal dialysis","cj":"Analyze Cues","type":"mc","stem":"A client on peritoneal dialysis for 2 years reports that the drained fluid is brown. What does the nurse suspect?","o":[["Bowel perforation",1,"Brown effluent occurs with a bowel perforation."],["Peritonitis",0,"Infection produces cloudy or opaque effluent."],["Bladder perforation",0,"That outflow is the same color as urine with the same glucose level."],["A normal finding once dialysis is established",0,"Established effluent is clear and light yellow."]],"id":"q117"},{"ch":60,"t":"Peritoneal dialysis","cj":"Take Action","type":"order","stem":"The nurse changes the dressing at a peritoneal dialysis catheter exit site. Place the steps in the correct order.","items":["Mask yourself and the client, then wash your hands","Put on sterile gloves and remove the old dressing; discard the gloves","Assess the site for swelling, redness, or discharge","Open the sterile field with gauze pads and swabs, then put on new sterile gloves","Clean around the catheter in a circular motion from the insertion site outward","Apply precut gauze pads over the site and tape only the edges"],"why":"Masking and hand hygiene come before any contact. The old dressing is removed with one pair of gloves, which are then discarded. The site is assessed before cleaning. A new sterile field and gloves are set up, cleaning moves from the insertion site outward, and the dressing goes on last.","id":"q118"},{"ch":60,"t":"Kidney transplant","cj":"Analyze Cues","type":"matrix","stem":"For each description, select the type of transplant rejection.","cols":["Hyperacute","Acute","Chronic"],"rows":[["Begins within 48 hours after surgery",0,"Hyperacute onset is within 48 hours."],["Treated by immediate removal of the transplanted kidney",0,"The treatment for hyperacute rejection."],["Two weeks after surgery: oliguria, temperature above 100 F, and an enlarged, tender kidney",1,"Acute rejection occurs from 1 week onward, over days to weeks."],["Treated with increased doses of immunosuppressive drugs",1,"The treatment for acute rejection."],["Blood urea nitrogen and creatinine rise gradually over months to years",2,"Chronic rejection is gradual."],["Managed conservatively until dialysis is required",2,"The treatment for chronic rejection."]],"id":"q119"},{"ch":60,"t":"End-stage kidney disease","cj":"Recognize Cues","type":"sata","case":"B","ex":"\u003cp>\u003cb>Emergency department, 1000.\u003c/b> A 58-year-old client with type 2 diabetes mellitus, hypertension, and end-stage kidney disease receives hemodialysis three times a week through a left forearm arteriovenous fistula. The client missed the last two sessions.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Heart rate 50 beats/min\u003cbr>Blood pressure 176/98 mm Hg\u003cbr>Respirations 26/min, deep\u003cbr>Oxygen saturation 93% on room air\u003cbr>Weight 4.2 kg above the last post-dialysis weight\u003cbr>Crackles in both lung bases; dyspnea on exertion\u003cbr>ECG: tall, peaked T waves\u003c/td>\n\u003ctd>Potassium 6.9 mEq/L\u003cbr>Bicarbonate 14 mEq/L\u003cbr>Blood urea nitrogen 96 mg/dL\u003cbr>Creatinine 9.8 mg/dL\u003cbr>Phosphorus 6.4 mg/dL\u003cbr>Calcium 8.0 mg/dL\u003cbr>Hemoglobin 9.8 g/dL\u003cbr>Glucose 104 mg/dL\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Reports nausea, a metallic taste, and itching for weeks. Thrill palpable and bruit audible over the fistula.\u003c/p>","stem":"Which findings require immediate follow-up? Select all that apply.","o":[["Potassium 6.9 mEq/L with tall, peaked T waves and a heart rate of 50 beats/min",1,"High potassium causes life-threatening changes in cardiac rate and rhythm."],["Crackles with dyspnea and a 4.2-kg weight gain",1,"These show fluid overload, which can progress to pulmonary edema."],["Deep respirations at 26/min with a bicarbonate of 14 mEq/L",1,"Kussmaul respirations with a low bicarbonate indicate worsening metabolic acidosis."],["Hemoglobin 9.8 g/dL",0,"Anemia from decreased erythropoietin is a chronic, expected finding."],["Itching with a phosphorus of 6.4 mg/dL",0,"A chronic problem of calcium-phosphorus imbalance; important but not immediate."],["Thrill and bruit present over the fistula",0,"These show the access is working."]],"id":"q120"},{"ch":60,"t":"End-stage kidney disease","cj":"Analyze Cues","type":"matrix","case":"B","ex":"\u003cp>\u003cb>Emergency department, 1000.\u003c/b> A 58-year-old client with type 2 diabetes mellitus, hypertension, and end-stage kidney disease receives hemodialysis three times a week through a left forearm arteriovenous fistula. The client missed the last two sessions.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Heart rate 50 beats/min\u003cbr>Blood pressure 176/98 mm Hg\u003cbr>Respirations 26/min, deep\u003cbr>Oxygen saturation 93% on room air\u003cbr>Weight 4.2 kg above the last post-dialysis weight\u003cbr>Crackles in both lung bases; dyspnea on exertion\u003cbr>ECG: tall, peaked T waves\u003c/td>\n\u003ctd>Potassium 6.9 mEq/L\u003cbr>Bicarbonate 14 mEq/L\u003cbr>Blood urea nitrogen 96 mg/dL\u003cbr>Creatinine 9.8 mg/dL\u003cbr>Phosphorus 6.4 mg/dL\u003cbr>Calcium 8.0 mg/dL\u003cbr>Hemoglobin 9.8 g/dL\u003cbr>Glucose 104 mg/dL\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Reports nausea, a metallic taste, and itching for weeks. Thrill palpable and bruit audible over the fistula.\u003c/p>","stem":"For each finding, select the kidney function whose loss best explains it.","cols":["Potassium excretion","Sodium and water excretion","Acid excretion","Phosphorus excretion","Erythropoietin production"],"rows":[["Tall, peaked T waves",0,"Hyperkalemia changes cardiac depolarization and repolarization."],["Crackles and weight gain",1,"Sodium and water retention cause edema, hypertension, and fluid overload."],["Deep, rapid respirations",2,"The lungs compensate for retained hydrogen ions."],["Itching",3,"Itching increases with calcium-phosphorus imbalance."],["Hemoglobin 9.8 g/dL",4,"Decreased erythropoietin causes anemia."],["Blood pressure 176/98 mm Hg",1,"Fluid and sodium overload elevates blood pressure."]],"id":"q121"},{"ch":60,"t":"End-stage kidney disease","cj":"Prioritize Hypotheses","type":"mc","case":"B","ex":"\u003cp>\u003cb>Emergency department, 1000.\u003c/b> A 58-year-old client with type 2 diabetes mellitus, hypertension, and end-stage kidney disease receives hemodialysis three times a week through a left forearm arteriovenous fistula. The client missed the last two sessions.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Heart rate 50 beats/min\u003cbr>Blood pressure 176/98 mm Hg\u003cbr>Respirations 26/min, deep\u003cbr>Oxygen saturation 93% on room air\u003cbr>Weight 4.2 kg above the last post-dialysis weight\u003cbr>Crackles in both lung bases; dyspnea on exertion\u003cbr>ECG: tall, peaked T waves\u003c/td>\n\u003ctd>Potassium 6.9 mEq/L\u003cbr>Bicarbonate 14 mEq/L\u003cbr>Blood urea nitrogen 96 mg/dL\u003cbr>Creatinine 9.8 mg/dL\u003cbr>Phosphorus 6.4 mg/dL\u003cbr>Calcium 8.0 mg/dL\u003cbr>Hemoglobin 9.8 g/dL\u003cbr>Glucose 104 mg/dL\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Reports nausea, a metallic taste, and itching for weeks. Thrill palpable and bruit audible over the fistula.\u003c/p>","stem":"Which complication is the most urgent risk for this client?","o":[["Lethal dysrhythmia from hyperkalemia",1,"ECG changes with bradycardia are already present; potassium above 6.5 mEq/L is an indication for kidney replacement therapy."],["Pathologic fracture from bone mineral loss",0,"A long-term risk."],["Worsening anemia",0,"A chronic problem managed over time."],["Skin breakdown from scratching",0,"A real concern but not life-threatening."]],"id":"q122"},{"ch":60,"t":"End-stage kidney disease","cj":"Generate Solutions","type":"sata","case":"B","ex":"\u003cp>\u003cb>Emergency department, 1000.\u003c/b> A 58-year-old client with type 2 diabetes mellitus, hypertension, and end-stage kidney disease receives hemodialysis three times a week through a left forearm arteriovenous fistula. The client missed the last two sessions.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Heart rate 50 beats/min\u003cbr>Blood pressure 176/98 mm Hg\u003cbr>Respirations 26/min, deep\u003cbr>Oxygen saturation 93% on room air\u003cbr>Weight 4.2 kg above the last post-dialysis weight\u003cbr>Crackles in both lung bases; dyspnea on exertion\u003cbr>ECG: tall, peaked T waves\u003c/td>\n\u003ctd>Potassium 6.9 mEq/L\u003cbr>Bicarbonate 14 mEq/L\u003cbr>Blood urea nitrogen 96 mg/dL\u003cbr>Creatinine 9.8 mg/dL\u003cbr>Phosphorus 6.4 mg/dL\u003cbr>Calcium 8.0 mg/dL\u003cbr>Hemoglobin 9.8 g/dL\u003cbr>Glucose 104 mg/dL\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Reports nausea, a metallic taste, and itching for weeks. Thrill palpable and bruit audible over the fistula.\u003c/p>","stem":"Which actions does the nurse include in the immediate plan? Select all that apply.","o":[["Place the client on continuous cardiac monitoring",1,"The ECG is monitored for changes from hyperkalemia."],["Notify the nephrology provider and prepare for hemodialysis",1,"Potassium above 6.5 mEq/L and fluid overload are indications."],["Restrict dietary potassium",1,"Potassium restriction is used when levels are high."],["Continue to assess the fistula for a thrill and bruit",1,"A functioning access is required for treatment."],["Measure blood pressure in the left arm for accuracy",0,"The access arm is never used for blood pressure."],["Give a magnesium-containing antacid for the nausea",0,"Clients with kidney disease cannot excrete magnesium."]],"id":"q123"},{"ch":60,"t":"Hemodialysis","cj":"Take Action","type":"mc","case":"B","ex":"\u003cp>\u003cb>Emergency department, 1000.\u003c/b> A 58-year-old client with type 2 diabetes mellitus, hypertension, and end-stage kidney disease receives hemodialysis three times a week through a left forearm arteriovenous fistula. The client missed the last two sessions.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Heart rate 50 beats/min\u003cbr>Blood pressure 176/98 mm Hg\u003cbr>Respirations 26/min, deep\u003cbr>Oxygen saturation 93% on room air\u003cbr>Weight 4.2 kg above the last post-dialysis weight\u003cbr>Crackles in both lung bases; dyspnea on exertion\u003cbr>ECG: tall, peaked T waves\u003c/td>\n\u003ctd>Potassium 6.9 mEq/L\u003cbr>Bicarbonate 14 mEq/L\u003cbr>Blood urea nitrogen 96 mg/dL\u003cbr>Creatinine 9.8 mg/dL\u003cbr>Phosphorus 6.4 mg/dL\u003cbr>Calcium 8.0 mg/dL\u003cbr>Hemoglobin 9.8 g/dL\u003cbr>Glucose 104 mg/dL\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Reports nausea, a metallic taste, and itching for weeks. Thrill palpable and bruit audible over the fistula.\u003c/p>\u003cp>\u003cb>1600 update, after 4 hours of hemodialysis:\u003c/b> Potassium 4.8 mEq/L. Weight down 3.9 kg. Lungs clear; oxygen saturation 97%. Blood pressure 86/50 mm Hg; client reports dizziness. Temperature 101.5 F. No thrill felt over the fistula.\u003c/p>","stem":"Based on the 1600 update, which prescribed action does the nurse take for the blood pressure?","o":[["Give IV normal saline as prescribed",1,"Hypotension after dialysis may require rehydration with IV fluids such as normal saline."],["Give the antihypertensive dose that was held this morning",0,"This would lower the blood pressure further."],["Recheck the blood pressure in the left arm",0,"The access arm is never used."],["Encourage 1 L of oral fluid over the next hour",0,"Fluid intake is limited in this client; hypotension is managed with prescribed IV fluid."]],"id":"q124"},{"ch":60,"t":"Hemodialysis","cj":"Evaluate Outcomes","type":"matrix","case":"B","ex":"\u003cp>\u003cb>Emergency department, 1000.\u003c/b> A 58-year-old client with type 2 diabetes mellitus, hypertension, and end-stage kidney disease receives hemodialysis three times a week through a left forearm arteriovenous fistula. The client missed the last two sessions.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Assessment\u003c/th>\u003cth>Laboratory results\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Heart rate 50 beats/min\u003cbr>Blood pressure 176/98 mm Hg\u003cbr>Respirations 26/min, deep\u003cbr>Oxygen saturation 93% on room air\u003cbr>Weight 4.2 kg above the last post-dialysis weight\u003cbr>Crackles in both lung bases; dyspnea on exertion\u003cbr>ECG: tall, peaked T waves\u003c/td>\n\u003ctd>Potassium 6.9 mEq/L\u003cbr>Bicarbonate 14 mEq/L\u003cbr>Blood urea nitrogen 96 mg/dL\u003cbr>Creatinine 9.8 mg/dL\u003cbr>Phosphorus 6.4 mg/dL\u003cbr>Calcium 8.0 mg/dL\u003cbr>Hemoglobin 9.8 g/dL\u003cbr>Glucose 104 mg/dL\u003c/td>\u003c/tr>\u003c/table>\n\u003cp>\u003cb>Nurses' note:\u003c/b> Reports nausea, a metallic taste, and itching for weeks. Thrill palpable and bruit audible over the fistula.\u003c/p>\u003cp>\u003cb>1600 update, after 4 hours of hemodialysis:\u003c/b> Potassium 4.8 mEq/L. Weight down 3.9 kg. Lungs clear; oxygen saturation 97%. Blood pressure 86/50 mm Hg; client reports dizziness. Temperature 101.5 F. No thrill felt over the fistula.\u003c/p>","stem":"For each finding in the 1600 update, select whether it shows improvement or requires follow-up.","cols":["Improved","Requires follow-up"],"rows":[["Potassium 4.8 mEq/L",0,"Within the reference range of 3.5 to 5.0 mEq/L."],["Weight down 3.9 kg",0,"Weight is expected to fall as fluid is removed."],["Lungs clear with oxygen saturation of 97%",0,"Fluid overload has resolved."],["Temperature 101.5 F",1,"A fever after dialysis suggests sepsis and needs a blood culture."],["No thrill felt over the fistula",1,"Loss of the thrill suggests the access has clotted."],["Blood pressure 86/50 mm Hg with dizziness",1,"Hypotension is a common complication that needs treatment."]],"id":"q125"}];

  else if(q.type==="sata"){ m=q.o.filter(function(o){return o[1];}).length; (a||[]).forEach(function(i){ e+=q.o[i][1]?1:-1; }); e=Math.max(0,e); }
  else if(q.type==="matrix"){ m=q.rows.length; q.rows.forEach(function(r,i){ if(a&&a[i]===r[1]) e++; }); }
  else if(q.type==="order"){ e=(a&&a.every(function(v,i){return v===i;}))?1:0; }
  else if(q.type==="cloze"){ var b=blanks(q); m=b.length; b.forEach(function(x,i){ if(a&&a[i]===x.a) e++; }); }
  else if(q.type==="hl"){ m=q.segs.filter(function(s){return s[1]===1;}).length; (a||[]).forEach(function(i){ e+=q.segs[i][1]===1?1:-1; }); e=Math.max(0,e); }
  return {e:e,m:m};
}
function totals(filter){
  var e=0,m=0,n=0,full=0;
  S.order.forEach(function(id){ var q=byId[id]; if(filter && !filter(q)) return; var s=score(q); e+=s.e; m+=s.m; n++; if(s.e===s.m) full++; });
  return {e:e,m:m,n:n,full:full,pct:m?Math.round(e/m*1000)/10:0};
}

/* ---------- events ---------- */
function act(el){
  var a=el.getAttribute("data-act"), q = S && view==="q" ? byId[S.order[S.idx]] : null, v, i, top=false;
  switch(a){
    case "ch": setup.ch[el.getAttribute("data-c")] = el.checked; break;
    case "mode": setup.mode = el.getAttribute("data-m"); break;
    case "shuf": setup.shuffle = el.checked; break;
    case "start": startAttempt(Q.filter(function(x){return setup.ch[x.ch];}), setup.mode, setup.shuffle); return;
    case "resume": S=load(); view="q"; tick(); top=true; break;
    case "discard": clearSaved(); break;
    case "pick": if(revealed(q)) return; S.ans[q.id]=+el.getAttribute("data-i"); break;
    case "tog": case "seg": if(revealed(q)) return; v=S.ans[q.id]||[]; i=+el.getAttribute("data-i"); S.ans[q.id] = v.indexOf(i)>=0 ? v.filter(function(x){return x!==i;}) : v.concat(i); break;
    case "cell": if(revealed(q)) return; v=(S.ans[q.id]||q.rows.map(function(){return null;})).slice(); v[+el.getAttribute("data-r")]=+el.getAttribute("data-c"); S.ans[q.id]=v; break;
    case "blank": if(revealed(q)) return; v=(S.ans[q.id]||blanks(q).map(function(){return null;})).slice(); v[+el.getAttribute("data-b")] = el.value===""?null:+el.value; S.ans[q.id]=v; break;
    case "up": case "down": if(revealed(q)) return; v=curOrder(q).slice(); i=+el.getAttribute("data-p"); var j=a==="up"?i-1:i+1; if(j<0||j>=v.length) return; var t=v[i]; v[i]=v[j]; v[j]=t; S.ans[q.id]=v; break;
    case "submit": if(q.type==="order" && !S.ans[q.id]) S.ans[q.id]=curOrder(q).slice(); S.done[q.id]=true; break;
    case "next": if(S.idx<S.order.length-1){ S.idx++; top=true; } break;
    case "prev": if(S.idx>0){ S.idx--; top=true; } break;
    case "goto": S.idx=+el.getAttribute("data-n"); navOpen=false; top=true; break;
    case "nav": navOpen=!navOpen; break;
    case "flag": i=S.order[S.idx]; if(S.flags[i]) delete S.flags[i]; else S.flags[i]=true; break;
    case "end": confirmEnd=true; top=true; break;
    case "endNo": confirmEnd=false; break;
    case "endYes": S.finished=true; confirmEnd=false; view="results"; top=true; break;
    case "results": view="results"; top=true; break;
    case "review": S.idx=+el.getAttribute("data-n"); view="q"; navOpen=false; top=true; break;
    case "retakeMissed": startAttempt(S.order.map(function(id){return byId[id];}).filter(function(x){var s=score(x); return s.e<s.m;}), S.mode, true); return;
    case "newAttempt": clearSaved(); S=null; view="start"; top=true; render(true); return;
    default: return;
  }
  if(S) save();
  render(top);
}
app.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el || el.disabled) return;
  if(el.tagName==="INPUT"||el.tagName==="SELECT") return;
