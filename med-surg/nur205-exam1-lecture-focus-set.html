/* ---- unfolding case: hypothyroidism ---- */
{ch:55,cs:"L55",need:N.pa,skill:S.ac,type:CZ,src:"Lecture: Hypothyroidism cues and laboratory pattern | Iggy Ch. 55, Hypothyroidism: Laboratory Assessment; Box 55.1; Table 55.1",chart:L55A,
stem:"Complete the statements about this client.",
parts:["These findings are most consistent with ",{o:["hypothyroidism","a return of Graves disease","hyperparathyroidism"],a:0},
". The nurse expects her T3 and T4 levels to be ",{o:["decreased","increased","within the normal range"],a:0},
" and her thyroid-stimulating hormone level to be ",{o:["high","low","near normal"],a:0},
", because the problem is in the ",{o:["thyroid gland itself","anterior pituitary gland","parathyroid glands"],a:0},"."],
why:"Radiation-induced destruction of thyroid tissue is a primary cause of hypothyroidism, and the replacement hormone it requires is lifelong, so stopping the drug brought the slowed metabolism back. T3 and T4 are reduced. Thyroid-stimulating hormone is high in primary hypothyroidism because the pituitary keeps signaling a gland that cannot respond. It is low or near normal only in secondary disease.",
plain:"Her thyroid was shut down on purpose years ago, and the tablet was doing its job. Without the tablet, the brain shouts at the gland but nothing answers."},

{ch:55,cs:"L55",hard:1,need:N.pa,skill:S.ta,type:MC,src:"Lecture: Hypothyroidism priority problems, improving gas exchange | Iggy Ch. 55, Hypothyroidism: Analysis; Improving Gas Exchange",chart:L55B,
stem:"Review the 1500 entry. Which action does the nurse take first?",
opts:[{t:"Apply the prescribed oxygen and recheck SpO₂.",c:1,r:"Decreased gas exchange is the first priority problem. Oxygen is applied when the client has hypoxemia, and respiratory failure is the most common cause of death in myxedema coma."},
{t:"Place the client on a cardiac monitor.",r:"Monitoring heart rate and rhythm supports perfusion, which is the second priority problem. It follows the breathing problem."},
{t:"Cover the client with warm blankets.",r:"Appropriate for the low temperature, but it does not correct an SpO₂ of 89%."},
{t:"Compare her mental status with the admission note.",r:"Mental status is assessed at least every 8 hours and changes are reported, but she rouses and is oriented. The hypoxemia is treated first."}],
why:"All four are correct actions for this client. The textbook lists the priority problems in order: decreased gas exchange, reduced perfusion, then the potential for myxedema coma. Hypoxemia with slow, shallow breathing is an actual problem, so oxygen comes first. The nurse then reports the change promptly.",
plain:"She is not getting enough air. Fix the air first, then look at the heart, the warmth, and the thinking."},

{ch:55,cs:"L55",need:N.hp,skill:S.eo,type:MX,src:"Lecture: Hypothyroidism self-management education and outcomes | Iggy Ch. 55, Hypothyroidism: Self-Management Education; Evaluation; Drug Alert (levothyroxine)",chart:L55C,
stem:"At the 8-week visit the nurse evaluates the plan of care. For each finding or client statement, choose whether it shows the plan is working or requires more teaching.",
cols:["Shows the plan is working","Requires more teaching"],
rows:[{t:"Heart rate 68 with blood pressure 122/78 mm Hg",a:0},
{t:"“I feel like myself again, so I will stop the tablets when this bottle is empty.”",a:1},
{t:"SpO₂ 97% on room air",a:0},
{t:"“I write down how many hours I sleep and how often my bowels move.”",a:0},
{t:"“When my stomach is upset, I chew an antacid along with my morning tablet.”",a:1},
{t:"Answers promptly and recalls 3 of 3 words after 5 minutes",a:0},
{t:"“I started an herbal energy supplement from the pharmacy. I did not think I had to ask about it.”",a:1},
{t:"“I eat more vegetables and whole grains and drink more water to stay regular.”",a:0}],
why:"Expected outcomes are a pulse above 60 with a normal blood pressure, SpO₂ above 93%, and improved cognition. The most important teaching is about hormone replacement: it is lifelong, antacids, iron, and calcium are separated from it by at least 4 hours, and no over-the-counter product is taken without asking the provider. Need for sleep and bowel elimination are the two easiest things for the client to track.",
plain:"Her body is back up to speed. She still needs to learn that the tablet is forever, is taken by itself, and that new products get checked first."},

/* ---- hypothyroidism: primary versus secondary ---- */
{ch:55,hard:1,need:N.rr,skill:S.ac,type:MC,src:"Lecture: Hypothyroidism laboratory pattern, primary versus secondary | Iggy Ch. 55, Hypothyroidism: Laboratory Assessment; Table 55.1; Box 55.1",
stem:"A 58-year-old man with a pituitary tumor reports fatigue, constipation, and feeling cold. Heart rate is 54. Results: total T4 3.2 mcg/dL (reference 4 to 12), T3 34 ng/dL (reference 40 to 180), thyroid-stimulating hormone 0.5 µU/mL (reference 0.3 to 5). How does the nurse interpret these results?",
opts:[{t:"Secondary hypothyroidism from too little pituitary stimulation",c:1,r:"T3 and T4 are low, and the thyroid-stimulating hormone level is not raised in response. In secondary hypothyroidism it is decreased or near normal, and a pituitary tumor is a listed cause."},
{t:"Primary hypothyroidism from failure of the thyroid gland",r:"In primary disease the pituitary responds to low T3 and T4 with a high thyroid-stimulating hormone level."},
{t:"Normal thyroid function with an in-range thyroid-stimulating hormone level",r:"T3 and T4 are both below range and the client has symptoms. An in-range thyroid-stimulating hormone level does not rule out secondary disease."},
{t:"Early hyperthyroidism with a low-normal thyroid-stimulating hormone level",r:"Hyperthyroidism raises T3 and T4. These are decreased."}],
why:"The thyroid-stimulating hormone value falls inside the reference range, which is the trap. With T3 and T4 this low, a healthy pituitary would push the value high. A value that stays low or near normal points to the pituitary as the source.",
plain:"The thyroid is quiet because nobody is telling it to work. The boss gland has the problem."},

/* ---- hyperthyroidism ---- */
{ch:55,hard:1,need:N.moc,skill:S.ph,type:MC,src:"Lecture: Thyroid storm, report a temperature rise of 1 F | Iggy Ch. 55, Hyperthyroidism: Nonsurgical Management; Critical Rescue",
stem:"The nurse receives report on four clients at 0800. Which client does the nurse see first?",
opts:[{t:"Graves disease; temperature 98.6°F (37°C) at 0400 and 99.8°F (37.7°C) now; heart rate 108",c:1,r:"A temperature increase of even 1°F may signal impending thyroid storm. It is reported immediately and the cardiac status is assessed."},
{t:"Hypothyroidism; heart rate 56; temperature 96.8°F (36°C); slow to answer, as on admission",r:"A heart rate below 60 and a temperature below 97°F are expected with hypothyroidism, and the mental status has not changed."},
{t:"1 day after total thyroidectomy; hoarse, weak voice; no stridor; SpO₂ 97%; swallowing well",r:"Hoarseness with a weak voice reflects laryngeal nerve damage and is usually temporary. The voice is checked every 2 hours. There are no signs of obstruction."},
{t:"Hyperparathyroidism; calcium 11.2 mg/dL; nausea and no bowel movement for 3 days",r:"Expected with a high calcium level. Confusion and psychosis appear when the level is above 12 mg/dL."}],
why:"Every client has abnormal findings, and the correct one has the mildest-looking numbers. In hyperthyroidism a rise of 1.2°F is treated as the possible onset of thyroid storm, which is fatal if untreated.",
plain:"For most people a small fever is nothing. In Graves disease it can be the first sign of a storm, so that client comes first."},

{ch:55,need:N.rr,skill:S.gs,type:SATA,src:"Lecture: Thyroidectomy complications, neck position and voice checks | Iggy Ch. 55, Hyperthyroidism: Surgical Management, Postoperative Care",
stem:"A client returns to the surgical unit after a total thyroidectomy. Which interventions does the nurse include in the plan of care for the first 24 hours? Select all that apply.",
opts:[{t:"Keep the client in a semi-Fowler's position with pillows supporting the head and neck.",c:1,r:"Pillows support the head and neck, and positions that extend the neck are avoided."},
{t:"Assess the voice every 2 hours and document any change.",c:1,r:"Laryngeal nerve damage causes hoarseness and a weak voice."},
{t:"Inspect the dressing and behind the neck for blood.",c:1,r:"Hemorrhage is most likely in the first 24 hours, and blood can collect behind the neck."},
{t:"Ask about tingling around the mouth and in the fingers and toes.",c:1,r:"These are early signs of hypocalcemia from parathyroid injury."},
{t:"Lay the client flat with the neck extended to keep the airway open.",r:"Positions that cause neck extension are avoided. The client is placed in a semi-Fowler's position with the head and neck supported."},
{t:"Treat a moderate amount of serosanguineous drainage in the drain as hemorrhage.",r:"A moderate amount of serosanguineous drainage in a drain is normal. Hemorrhage shows as bleeding at the incision or as respiratory distress from tracheal compression."}],
why:"Monitoring for complications is the most important nursing action after thyroid surgery: hemorrhage, respiratory distress, hypocalcemia with tetany, laryngeal nerve damage, and thyroid storm. The client also deep-breathes every 30 minutes to 1 hour, and tracheostomy, oxygen, and suction equipment stay in the room.",
plain:"Keep the neck propped and never stretched back. Listen to the voice, look for blood, and ask about tingling."},

{ch:55,need:N.hp,skill:S.ta,type:SATA,src:"Lecture: Hyperthyroidism, radioactive iodine therapy | Iggy Ch. 55, Hyperthyroidism: Nonsurgical Management (radioactive iodine therapy)",
stem:"A 38-year-old client with Graves disease is scheduled for radioactive iodine therapy. Which information does the nurse include in teaching? Select all that apply.",
opts:[{t:"“The treatment is taken by mouth, and you go home the same day.”",c:1,r:"It is given as oral iodine-131 on an outpatient basis."},
{t:"“Relief of your symptoms may take 6 to 8 weeks.”",c:1,r:"The gland stores hormone that continues to be released."},
{t:"“You may still need your antithyroid drug for the first few weeks.”",c:1,r:"Additional drug therapy may be needed when symptoms are severe."},
{t:"“Your thyroid levels will be checked regularly, because the gland can become underactive years later.”",c:1,r:"Some clients become hypothyroid and then need lifelong hormone replacement."},
{t:"“The treatment is safe during pregnancy because the radiation dose is low.”",r:"It is not used in pregnancy. Iodine-131 crosses the placenta and can damage the fetal thyroid gland."},
{t:"“No precautions are needed at home, because the iodine stays inside the thyroid gland.”",r:"The source is unsealed. Some radioactivity is present in body fluids and stool for a few days."}],
why:"The thyroid takes up the radioactive iodine and some hormone-producing cells are destroyed. The degree of destruction varies, one dose may be enough or a second may be needed, and hypothyroidism can appear several years after therapy, so follow-up continues.",
plain:"The medicine slowly quiets the gland. It takes weeks to work, and the gland may end up too quiet, so it gets checked for years."},

/* ---- thyroid cancer ---- */
{ch:55,need:N.pa,skill:S.gs,type:MC,src:"Lecture: Thyroid cancer types and treatment | Iggy Ch. 55, Thyroid Cancer: Interprofessional Collaborative Care",
stem:"A client with anaplastic thyroid carcinoma says, “My sister had papillary thyroid cancer. She had surgery and then radioactive iodine.” Which treatment does the nurse expect for this client?",
opts:[{t:"External beam radiation, chemotherapy, or both",c:1,r:"These are used most often for anaplastic carcinoma because it has usually metastasized at diagnosis and is difficult to remove completely."},
{t:"Total thyroidectomy, then radioactive iodine",r:"This is the usual plan for most other types. Radioactive iodine is not used to treat anaplastic carcinoma."},
{t:"Removal of one lobe of the thyroid only",r:"Possible only when a cancer is small and contained."},
{t:"A kinase inhibitor as the first treatment",r:"Kinase inhibitors may be used when radioactive iodine after surgery is not successful."}],
why:"Surgery is the treatment of choice for most thyroid cancers. Anaplastic carcinoma is the exception: it is rare, grows rapidly, and invades nearby tissue. Radiation may shrink the tumor before surgery or treat cancer that persists afterward.",
plain:"Her sister had the slow kind that can be cut out. This kind has usually spread by the time it is found, so the treatment has to reach further."},

/* ---- parathyroid ---- */
{ch:55,need:N.ph,skill:S.gs,type:MX,src:"Lecture: Hypoparathyroidism and hyperparathyroidism treatment | Iggy Ch. 55, Hypoparathyroidism: Interventions; Hyperparathyroidism: Interventions",
stem:"The nurse cares for one client with hypoparathyroidism and one client with hyperparathyroidism. For each intervention, choose the client it is planned for.",
cols:["Hypoparathyroidism","Hyperparathyroidism"],
rows:[{t:"IV calcium gluconate for acute, severe symptoms",a:0},
{t:"Cinacalcet by mouth with routine calcium levels",a:1},
{t:"Oral calcitriol and calcium carbonate",a:0},
{t:"A bisphosphonate when fracture risk is high and surgery is declined",a:1},
{t:"Drug dose adjusted to hold the serum calcium in the low-normal range",a:0},
{t:"Regular exercise, adequate hydration, and no prolonged bed rest",a:1},
{t:"Teaching that therapy is lifelong and to wear a medical alert bracelet",a:0}],
why:"Hypoparathyroidism leaves the calcium level too low, so calcium and vitamin D are replaced for life, but only to the low-normal range so that urine calcium does not rise and form kidney stones. Hyperparathyroidism raises calcium and thins bone: cinacalcet lowers parathyroid hormone release, bisphosphonates are preferred when fracture risk is high and surgery is not done, and the client stays active and hydrated.",
plain:"One client needs calcium put back in. The other has too much calcium in the blood and bones that break easily."},

{ch:55,need:N.saf,skill:S.ta,type:MC,src:"Lecture: Hyperparathyroidism, injury prevention | Iggy Ch. 55, Hyperparathyroidism: Interventions (Preventing injury; Nonsurgical Management)",
stem:"A 68-year-old client with chronic hyperparathyroidism is admitted with a kidney stone. Serum calcium is 11.4 mg/dL, and a bone density scan shows significant bone loss. The nurse observes assistive personnel giving morning care. Which action requires the nurse to intervene?",
opts:[{t:"Sliding the client up in bed by pulling under both arms",c:1,r:"Bones are fragile and can fracture. Assistive personnel are taught to handle the client carefully and to reposition with a lift sheet rather than pulling."},
{t:"Walking with the client in the hallway before breakfast",r:"Appropriate. Regular exercise is encouraged and prolonged bed rest is avoided, even with bone density loss."},
{t:"Refilling the water pitcher and offering fluids every hour",r:"Appropriate. Adequate hydration is part of care when the calcium level is high."},
{t:"Setting up the breakfast tray, which includes a carton of milk",r:"Appropriate. The diet contains moderate amounts of calcium and vitamin D. Calcium is not removed from the diet."}],
why:"Priority nursing interventions for hyperparathyroidism focus on monitoring and preventing injury, because bone density loss puts the client at risk for fragile fractures. The textbook names the handling error: the client is repositioned with a lift sheet, not pulled. Activity, fluids, and a moderate amount of dietary calcium are all part of the plan, so stopping those would be the wrong correction.",
plain:"These bones are thin like chalk. Lift the client on a sheet and never tug on the arms. Walking, water, and a normal amount of milk are fine."}
);

/* ================= CHAPTER 56: Diabetes Mellitus (lecture-focus set) ================= */
const L56A=[["History","44-year-old man with type 1 diabetes mellitus for 21 years. Uses insulin glargine at bedtime and insulin lispro with meals. Three days of vomiting and diarrhea. He stopped all insulin 2 days ago “because I was not eating.” Weight 80 kg."],
["Assessment","Opens his eyes only to a loud voice, then drifts off. Vomited twice in triage; gurgling sounds with each breath. Respirations deep and rapid with a fruity odor. Holds his abdomen and moans when it is touched. Dry mouth, sunken eyes, poor skin turgor."],
["Vital Signs","Blood pressure 92/54 mm Hg · Heart rate 126 · Respirations 32 · Temperature 99.9°F (37.7°C) · SpO₂ 93% on room air"],
["Laboratory","Glucose 596 mg/dL · Arterial pH 7.14 · Bicarbonate 9 mEq/L · Potassium 5.7 mEq/L · Sodium 132 mEq/L · Blood urea nitrogen 38 mg/dL · Creatinine 1.8 mg/dL · Serum and urine ketones positive"],
["Prescriptions","0.9% saline at 15 to 20 mL/kg over the first hour · Regular insulin IV bolus, then continuous IV infusion · Continuous cardiac monitoring · Hourly intake and output · Serial electrolyte levels"]];
const L56B=L56A.concat([["Hour 3","Alert and oriented. Airway clear, no further vomiting. The 0.9% saline bolus is complete; 0.45% saline is infusing at 500 mL/hr. Regular insulin IV infusion continues.<br>Glucose 428 mg/dL · Potassium 4.6 mEq/L · Bicarbonate 12 mEq/L<br>Urine output 65 mL/hr for the past 2 hours. Cardiac monitor: sinus tachycardia, rate 108.<br>A new prescription is written for IV potassium replacement."]]);
const L56C=L56B.concat([["Hour 6","Potassium replacement and 0.45% saline are infusing. Regular insulin IV infusion continues. The reassessment findings are listed in the question."]]);
Q.push(
/* ---- unfolding case: diabetic ketoacidosis ---- */
{ch:56,cs:"L56",hard:1,need:N.pa,skill:S.ph,type:MC,src:"Lecture: Priority management of diabetic ketoacidosis | Iggy Ch. 56, Interventions for Preventing Diabetic Ketoacidosis: Blood Glucose Management",chart:L56A,
stem:"The nurse reviews the admission findings and the new prescriptions. Which problem is the nurse's first priority?",
opts:[{t:"An airway at risk from vomiting and decreased responsiveness",c:1,r:"The chapter directs the nurse to assess the airway and level of consciousness first. He is hard to rouse, is vomiting, and has gurgling with each breath."},
{t:"Low blood volume, shown by hypotension and a heart rate of 126",r:"Restoring blood volume is the first outcome of fluid therapy, but hydration status is assessed after the airway and level of consciousness."},
{t:"Ongoing ketone production that will not stop until insulin is given",r:"True, and IV regular insulin is prescribed, but glucose is the last item in the chapter's assessment order and the airway is the first."},
{t:"A potassium imbalance that places him at risk for dysrhythmias",r:"A real risk that needs monitoring. The potassium of 5.7 mEq/L will fall with treatment, but it is not the first threat."}],
why:"All four problems are real and all will be treated. The chapter states that the nurse first assesses the airway and level of consciousness, then hydration, electrolytes, and glucose. When confusion or Kussmaul respirations are present, ketoacidosis can quickly lead to shock and coma, so a client who cannot protect his airway is the first concern.",
plain:"Fluids and insulin cannot help someone who cannot breathe safely. Make sure the air can get in first."},

{ch:56,cs:"L56",hard:1,need:N.ph,skill:S.ta,type:MC,src:"Lecture: Potassium in diabetic ketoacidosis | Iggy Ch. 56, Diabetic Ketoacidosis: Drug Therapy; Action Alert",chart:L56B,
stem:"Review the Hour 3 entry. Which action does the nurse take?",
opts:[{t:"Hold the potassium, because a level of 4.6 mEq/L is not low.",r:"That waits for hypokalemia to develop. Replacement is started to prevent it, once the level falls below 5.0 mEq/L."},
{t:"Start the potassium replacement at the prescribed rate.",c:1,r:"Replacement begins once the serum level falls below 5.0 mEq/L, and urine output is above the required 30 mL/hr. The level keeps falling as insulin, fluids, and correction of acidosis continue."},
{t:"Hold the potassium, because the urine output is not adequate.",r:"The check is correct but the conclusion is not. Urine output must be at least 30 mL/hr before IV potassium is given, and his is 65 mL/hr."},
{t:"Start the potassium, and pause the insulin until the level is stable.",r:"Insulin is still needed to stop ketone production. Bicarbonate is only 12 mEq/L, so the ketoacidosis has not resolved."}],
why:"A level of 4.6 mEq/L looks normal, but it has dropped from 5.7 in 3 hours. Osmotic diuresis has already carried large amounts of potassium out in the urine, and acidosis had shifted what was left out of the cells and into the blood. Insulin therapy, correction of acidosis, and volume expansion now lower the serum level, so replacement starts when it falls below 5.0 mEq/L, provided urine output is at least 30 mL/hr.",
plain:"His body is low on potassium even though the blood test looks fine. Insulin is pushing it back into the cells, so it is topped up before it runs short."},

{ch:56,cs:"L56",need:N.rr,skill:S.eo,type:SATA,src:"Lecture: Priority management of diabetic ketoacidosis | Iggy Ch. 56, Diabetic Ketoacidosis: Fluid and Electrolyte Management; Drug Therapy",chart:L56C,
stem:"At hour 6 the nurse reassesses the client. Which findings show a complication of treatment that the nurse reports now? Select all that apply.",
opts:[{t:"New crackles in both lung bases with SpO₂ 90%",c:1,r:"Signs of fluid overload. The nurse watches for heart failure and pulmonary edema during fluid replacement."},
{t:"Abdominal distention, absent bowel sounds, and new muscle weakness",c:1,r:"Signs of hypokalemia, which include muscle weakness and abdominal distention or paralytic ileus."},
{t:"Drowsy and slow to answer after being fully alert at hour 3",c:1,r:"Mental status is recorded every hour. A decline after improvement may reflect cerebral edema from a rapid fall in serum osmolarity, or hypokalemia."},
{t:"Glucose 266 mg/dL, down from 428 mg/dL at hour 3",r:"A fall of 54 mg/dL each hour. The expected rate with insulin therapy is about 50 to 75 mg/dL per hour. Dextrose is added to the fluid when the level reaches 250 mg/dL."},
{t:"Urine output 60 mL/hr",r:"Adequate output. It shows the kidneys are perfused and allows potassium replacement to continue."},
{t:"Bicarbonate 15 mEq/L, up from 9 mEq/L on admission",r:"Acidosis is correcting. Resolution requires a level above 18 mEq/L, with glucose below 200 mg/dL, venous pH above 7.30, and an anion gap below 12 mEq/L, so treatment continues."}],
why:"The nurse assesses cardiac, kidney, and mental status to avoid fluid overload, and judges fluid replacement by blood pressure, intake and output, and daily weight. As much as 6 to 10 L may be given in the first 24 hours, so the lungs and the level of consciousness are checked often. Three of these findings are the expected response and should not be mistaken for problems.",
plain:"The sugar, the urine, and the acid level are all heading the right way. Wet lungs, a quiet belly with weak muscles, and new sleepiness are the warning signs."},

/* ---- standalone items ---- */
{ch:56,need:N.pa,skill:S.ac,type:CZ,src:"Lecture: Normal glucose and insulin physiology; absence of insulin | Iggy Ch. 56, The Endocrine Pancreas; Absence of Insulin; Physical Activity",
stem:"A client with type 1 diabetes mellitus has a cold and finds ketones in the urine. The client asks what this means. Complete the nurse's explanation.",
parts:["Insulin is made by the pancreatic ",{o:["alpha cells","beta cells","delta cells"],a:1},". It attaches to receptors on your cells so that glucose can ",
{o:["move from the blood into the cells","be changed into ketones","pass out through the kidneys"],a:0},". When there is not enough insulin, the body ",
{o:["stores the extra glucose as fat","stops releasing glucose from the liver","breaks down fat for energy, which makes acid ketones"],a:2},". While ketones are present, you should ",
{o:["exercise harder to use up the ketones","not exercise, because it would raise your glucose","drink less fluid until the urine clears"],a:1},"."],
why:"Beta cells produce insulin, first as inactive proinsulin. Insulin binds to membrane receptors and lets glucose move into cells. Without it, glucose builds up in the blood, the body breaks down fat, and ketones form as the acid by-product. Urine ketones mean that current insulin levels are not adequate, and the chapter states the client should not exercise when they are present.",
plain:"Insulin is the key that lets sugar into the cells. With no key, the body burns fat instead and makes acid, and exercise only makes that worse."},

{ch:56,need:N.hp,skill:S.rc,type:SATA,src:"Lecture: Metabolic syndrome | Iggy Ch. 56, Type 2 Diabetes and Metabolic Syndrome",
stem:"A 50-year-old man has an annual health visit. He takes lisinopril for hypertension and no other drugs. Which findings count as features of metabolic syndrome? Select all that apply.",
opts:[{t:"Waist circumference 42 inches (107 cm)",c:1,r:"Abdominal obesity is a waist of 40 inches or more for men."},
{t:"Blood pressure 126/78 mm Hg while taking lisinopril",c:1,r:"Drug treatment for hypertension counts, even when the reading is controlled."},
{t:"Fasting blood glucose 108 mg/dL",c:1,r:"A fasting level of 100 mg/dL or more counts."},
{t:"Triglycerides 142 mg/dL",r:"The feature is a level of 150 mg/dL or more, or drug treatment for elevated triglycerides."},
{t:"High-density lipoprotein cholesterol 46 mg/dL",r:"The cutoff for men is less than 40 mg/dL. Less than 50 mg/dL applies to women."},
{t:"Low-density lipoprotein cholesterol 134 mg/dL",r:"Not one of the listed features of the syndrome."}],
why:"Metabolic syndrome is the presence at the same time of abdominal obesity, hyperglycemia, hypertension, and hyperlipidemia, each with a defined cutoff or drug treatment for that problem. This client has three features, which raises his risk for type 2 diabetes mellitus and cardiovascular disease. A normal blood pressure reading on treatment still counts.",
plain:"A large waist, a blood pressure that needs a pill, and a fasting sugar that is a little high add up to a warning for diabetes and heart disease."},

{ch:56,hard:1,need:N.hp,skill:S.eo,type:MC,src:"Lecture: Assessment and ongoing complication screening; A1C | Iggy Ch. 56, Health Promotion/Disease Prevention; Ongoing Assessment; Reducing the Risk for Kidney Disease",
stem:"A 58-year-old client was diagnosed with type 2 diabetes mellitus last month. After teaching about follow-up testing, which statement shows a need for further teaching?",
opts:[{t:"“The urine albumin test can wait until I have had diabetes for 5 years.”",c:1,r:"That schedule applies to type 1 diabetes mellitus. With type 2, yearly urine albumin testing starts at diagnosis."},
{t:"“I will see the ophthalmologist every year, even if my vision seems fine.”",r:"Correct. Retinopathy has few symptoms until vision is lost, so eyes are examined yearly."},
{t:"“Eating carefully the day before the test will not change my A1C result.”",r:"Correct. A1C is not altered by eating habits on the day before the test. It reflects the average glucose over about the previous 3 months."},
{t:"“Someone should test the feeling in my feet at least once every year.”",r:"Correct. A monofilament foot examination is recommended at least annually."}],
why:"Diabetes mellitus is the leading cause of end-stage kidney disease. A yearly urine albumin test is done for clients who have had type 1 diabetes mellitus for more than 5 years and for all clients with type 2 diabetes mellitus starting at diagnosis. Finding kidney changes early allows treatment to be adjusted to slow or halt nephropathy.",
plain:"With type 2, the kidney check starts as soon as the diabetes is found and is repeated every year. The 5-year wait is only for type 1."},

{ch:56,hard:1,need:N.rr,skill:S.eo,type:MC,src:"Lecture: Hyperglycemic-hyperosmolar state versus diabetic ketoacidosis | Iggy Ch. 56, Hyperglycemic-Hyperosmolar State: Fluid Therapy; Continuing Therapy",
stem:"A 76-year-old woman with type 2 diabetes mellitus is admitted with a glucose of 912 mg/dL, serum osmolarity 356 mOsm/L, pH 7.38, and negative ketones. She responds only to pain. During the first 12 hours of treatment, which finding is the best evidence that fluid replacement is satisfactory?",
opts:[{t:"She opens her eyes to voice and later follows commands.",c:1,r:"A slow but steady improvement in central nervous system function is the best evidence that fluid management is satisfactory."},
{t:"Glucose falls from 912 to 520 mg/dL during the first 2 hours.",r:"That is about 196 mg/dL per hour. The expected reduction is 50 to 70 mg/dL per hour, and a rapid fall risks cerebral edema."},
{t:"Urine output is 45 mL/hr with a blood pressure of 118/70 mm Hg.",r:"A good sign that blood volume is restored and the infusion rate can be reduced, but it is not the best evidence named in the chapter."},
{t:"Serum osmolarity is 296 mOsm/L 6 hours after admission.",r:"Too fast. The outcome is rehydration and normal glucose within 36 to 72 hours, and a too-rapid reduction in osmolarity causes neurologic regression."}],
why:"In this condition the severity of the neurologic changes follows the level of blood hyperosmolarity and cell dehydration. Restoring fluid balance in brain cells is slow, so the chapter names steady improvement in level of consciousness as the best evidence. Two options describe numbers that look good but are correcting too quickly.",
plain:"Her brain dried out slowly, so it has to be refilled slowly. Waking up a little more each hour shows the fluid is going in at the right speed."},

{ch:56,need:N.hp,skill:S.eo,type:SATA,src:"Lecture: Nursing priorities: foot care and skin integrity; client education | Iggy Ch. 56, Preventing Injury From Peripheral Neuropathy: Footwear; Box 56.9",
stem:"A client with type 2 diabetes mellitus cannot feel the 10-g monofilament on either foot and has no ulcers. After teaching about footwear, which statements show that the client understands? Select all that apply.",
opts:[{t:"“I will shop for new shoes late in the day.”",c:1,r:"Shoes are bought later in the day, when feet are normally larger."},
{t:"“I will change my shoes at midday and again in the evening.”",c:1,r:"Tight shoes damage tissue, so shoes are changed by midday and again in the evening."},
{t:"“My shoes should be about a half inch longer than my longest toe.”",c:1,r:"The shoe should be one-half to five-eighths of an inch longer than the longest toe."},
{t:"“I will pick leather or cloth shoes instead of plastic ones.”",c:1,r:"Shoes should be made of breathable materials such as leather or cloth."},
{t:"“I will wear new shoes all day for the first week to break them in.”",r:"New shoes need a long, gradual break-in period with frequent foot inspection for irritation or blisters."},
{t:"“Knee-high stockings with snug elastic tops will help my circulation.”",r:"Tight stockings and constricting bands reduce blood flow and are avoided."}],
why:"Any degree of peripheral neuropathy places the client at risk for skin breakdown, because pressure and rubbing are not felt. Protective shoes are fitted by an experienced fitter such as a certified podiatrist. Neuropathy is the main risk factor for a diabetic foot ulcer, and most lower extremity amputations are preceded by one.",
plain:"His feet cannot tell him when a shoe is rubbing, so the shoes have to be chosen and changed in a way that never lets a sore start."},

{ch:56,need:N.saf,skill:S.ph,type:MC,src:"Lecture: Nursing priorities: preventing injury from hypoglycemia; confusion means severe hypoglycemia | Iggy Ch. 56, Interventions for Preventing Hypoglycemia; Box 56.10",
stem:"The nurse receives report on four clients with diabetes mellitus. Which client does the nurse see first?",
opts:[{t:"Type 1; insulin was given and the meal tray is late; now confused, cool, and clammy",c:1,r:"Confusion is a sign that the brain is short of glucose. In severe hypoglycemia the client cannot treat it alone, and the brain stores only a few minutes' supply of glucose."},
{t:"Type 2 and taking prednisone; glucose 304 mg/dL with thirst and frequent urination; alert",r:"Corticosteroids raise glucose in the hospital. This needs treatment, but the client is alert and stable."},

{ch:60,cs:"L60",need:N.pa,skill:S.ac,type:SATA,src:"Lecture: chronic kidney disease, hyperkalemia and diet restrictions | Iggy Ch. 60, Metabolic Changes (potassium); Enhancing Nutrition",chart:L60A,

{t:"Two units of packed red blood cells",c:1,r:"Blood transfusions are a listed contributor to high potassium in chronic kidney disease."},

{t:"Urine output 35 mL in the last hour; it was 50 mL the hour before",r:"For 80 kg, 0.5 mL/kg/hr is 40 mL/hr, so this one hour is low. The points for reporting are less than 30 mL/hr for 2 hours, or less than 0.5 mL/kg/hr for 2 or more hours. The falling output is a result of the low pressure, and the pressure is what the nurse acts on."},

{ch:60,need:N.hp,skill:S.gs,type:SATA,src:"Lecture: teach healthy adults to drink 2 to 3 L of water daily; nephrotoxic drugs | Iggy Ch. 60, Health Promotion/Disease Prevention (acute kidney injury and chronic kidney disease); Box 60.6",

{t:"“If you take ibuprofen or naproxen, use the lowest dose for the shortest time.”",c:1,r:"These drugs interfere with blood flow to the kidney. High-dose and long-term use reduces kidney function."},

{ch:60,hard:1,need:N.saf,skill:S.ta,type:MC,src:"Lecture: hemodialysis, pre-dialysis care and holding atenolol | Iggy Ch. 60, Hemodialysis Nursing Care; Box 60.9; Box 60.11",

 function group(title,keyf,order){const m={};items.forEach((it,i)=>{const k=keyf(it.q);(m[k]=m[k]||{got:0,max:0,n:0});m[k].got+=sc[i].got;m[k].max+=sc[i].max;m[k].n++});
  let keys=Object.keys(m);if(order)keys=order.filter(k=>m[k]);else keys.sort((a,b)=>m[a].got/m[a].max-m[b].got/m[b].max);

  h('section',{class:'card'},h('h2',null,'Every question'),

    h('span',{class:'num'},String(k+1)),h('span',{class:'lt'},(it.ci?'Case '+it.ci+'/'+it.cn+': ':'')+it.q.stem.slice(0,96)+(it.q.stem.length>96?'…':'')),h('span',{class:'pts'},sc[k].got+'/'+sc[k].max))))),
