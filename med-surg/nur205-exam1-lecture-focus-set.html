<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture Focus Set</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1c2526;--mut:#5d6b6c;--line:#d9d3c5;--acc:#0f5c63;--acc-ink:#fff;--soft:#e3eeee;
--ok:#1e6b3c;--okbg:#e1f1e5;--bad:#a3261d;--badbg:#f8e3e0;--warn:#8a5a00;--warnbg:#f8ecd0;--chart:#eef1f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191a;--card:#1a2324;--ink:#e9eeec;--mut:#9aa9a8;--line:#2e3b3c;--acc:#5fc2c9;--acc-ink:#06282b;--soft:#1f3436;
--ok:#7fd79c;--okbg:#173022;--bad:#ff9f94;--badbg:#3a1b18;--warn:#f0c367;--warnbg:#3a2e12;--chart:#202b2d}}
:root[data-theme="dark"]{--bg:#12191a;--card:#1a2324;--ink:#e9eeec;--mut:#9aa9a8;--line:#2e3b3c;--acc:#5fc2c9;--acc-ink:#06282b;--soft:#1f3436;
--ok:#7fd79c;--okbg:#173022;--bad:#ff9f94;--badbg:#3a1b18;--warn:#f0c367;--warnbg:#3a2e12;--chart:#202b2d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
h1{font:600 30px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 12px;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
h2:first-child{margin-top:0}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0;font-weight:600}
.lead{font-size:18px;color:var(--mut);margin:0 0 20px;max-width:62ch}
.muted{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{margin-top:8px}
.resume{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.45}
.btn.big{width:100%;margin-top:16px;min-height:54px;font-size:18px}
.btn.flagged{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segb{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column}
.segb span{font-size:14px;color:var(--mut)}
.segb.on{border-color:var(--acc);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--mut)}
.chip.on{border-color:var(--acc);background:var(--soft);color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.notes ul{margin:0 0 10px;padding-left:20px}.notes li{margin:4px 0}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:2}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);font-weight:600}
.clock{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--acc)}
.bar.g>div{background:var(--ok)}.bar.m>div{background:var(--warn)}.bar.l>div{background:var(--bad)}
.chart{background:var(--chart);border:1px solid var(--line);border-radius:10px;margin:8px 0 16px;overflow:hidden}
.ctitle{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 14px 0;font-weight:700}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{flex:none;min-height:44px;padding:0 14px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);background:var(--card)}
.cbody{padding:10px 14px 14px;font-size:16px}
.stem{font:600 21px/1.35 Georgia,"Times New Roman",serif;margin:6px 0 10px;text-wrap:pretty}
.caselbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:0}
.hardtag{border-color:var(--warn)!important;color:var(--warn)!important}
.hint{font-size:14px;color:var(--mut);margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);min-height:52px}
.ltr{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--mut)}
.ltr.box{border-radius:6px}
.ot{flex:1;min-width:0}
.or{display:block;font-size:15px;color:var(--mut);margin-top:6px}
.opt.sel{border-color:var(--acc);background:var(--soft)}
.opt.sel .ltr{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg);opacity:1}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.miss{border-color:var(--warn);background:var(--warnbg);border-style:dashed}
.opt:disabled{color:var(--ink)}
.hl{display:flex;flex-wrap:wrap;gap:8px}
.seg-h{min-height:44px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.seg-h.sel{background:#ffe98a;border-color:#b08a00;color:#1c2526}
.seg-h.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.seg-h.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.seg-h.miss{background:var(--warnbg);border-color:var(--warn);border-style:dashed;color:var(--ink)}
.seg-h:disabled{color:var(--ink)}.seg-h.dim:disabled{color:var(--mut)}
.mxw{overflow-x:auto}
.mx{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px}
.mx th{font-size:13px;font-weight:700;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:bottom;min-width:84px}
.mx .rt{min-width:170px}
.mx td{padding:8px 6px;border-bottom:1px solid var(--line)}
.mx tr:last-child td{border-bottom:0}
.mx .rt{padding-left:12px}
.mx .cell{text-align:center;width:1%}
.radio{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);background:transparent;padding:0;position:relative}
.radio.sel{border-color:var(--acc)}
.radio.sel::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--acc)}
.cell.ok{background:var(--okbg)}.cell.bad{background:var(--badbg)}
.cell.bad .radio.sel{border-color:var(--bad)}.cell.bad .radio.sel::after{background:var(--bad)}
.cell.ok .radio{border-color:var(--ok)}.cell.ok .radio.sel::after{background:var(--ok)}
.rbad .rt{color:var(--bad)}
.cz{font-size:18px;line-height:2.3;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0}
.cz select{font:inherit;font-size:16px;max-width:100%;padding:6px 8px;border-radius:8px;border:1.5px solid var(--acc);background:var(--soft);color:var(--ink)}
.cz select.ok{border-color:var(--ok);background:var(--okbg)}.cz select.bad{border-color:var(--bad);background:var(--badbg)}
.cz select:disabled{opacity:1;color:var(--ink)}
.fix{color:var(--ok);font-weight:600}
.ord{list-style:none;counter-reset:n;padding:0;margin:0;display:grid;gap:8px}
.ord li{counter-increment:n;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.ord li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.ord li.ok{border-color:var(--ok);background:var(--okbg)}.ord li.bad{border-color:var(--bad);background:var(--badbg)}
.mv{display:flex;gap:6px;flex:none}
.ar{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.ar:disabled{opacity:.3}
.right{margin-top:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--ok);background:var(--okbg)}
.right ol{margin:6px 0 0;padding-left:22px}
.conf{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.cf{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:transparent;font-size:14px}
.cf.on{background:var(--soft);border-color:var(--acc);font-weight:600}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:6px solid var(--mut);background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fb.full{border-left-color:var(--ok)}.fb.part{border-left-color:var(--warn)}.fb.zero{border-left-color:var(--bad)}
.fbh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fbh span{font-size:14px;color:var(--mut)}
.fb p{margin:8px 0}
.plain{background:var(--soft);padding:10px 12px;border-radius:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;padding:3px 8px;border-radius:12px;border:1px solid var(--line);color:var(--mut)}
.src{font-size:13px;color:var(--mut)}
.ask{margin-top:16px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--warn);background:var(--warnbg)}
.ask p{margin:0 0 10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.foot .pri{margin-left:auto;min-width:150px}
.nav{margin-top:16px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.nb{height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:600;position:relative}
.nb.ans{background:var(--soft)}.nb.cur{outline:2.5px solid var(--acc);outline-offset:1px}
.nb.full{background:var(--okbg);border-color:var(--ok)}.nb.part{background:var(--warnbg);border-color:var(--warn)}.nb.zero{background:var(--badbg);border-color:var(--bad)}
.nb.flag::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.legend{margin:10px 0}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font:700 56px/1 Georgia,serif}
.big.g{color:var(--ok)}.big.m{color:var(--warn)}.big.l{color:var(--bad)}
.brow{margin:10px 0}.bl{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.lnk{border:0;background:transparent;color:var(--acc);font-weight:700;text-decoration:underline;padding:6px 4px}
.list{display:grid;gap:6px}
.li{display:flex;gap:10px;align-items:center;text-align:left;width:100%;min-height:48px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);border-left-width:6px;background:transparent;font-size:15px}
.li.full{border-left-color:var(--ok)}.li.part{border-left-color:var(--warn)}.li.zero{border-left-color:var(--bad)}
.num{flex:none;width:26px;font-weight:700;color:var(--mut)}.lt{flex:1;min-width:0}.pts{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:520px){h1{font-size:25px}.stem{font-size:19px}.seg{grid-template-columns:1fr}.foot .pri{flex:1 1 100%;order:-1;margin:0}.mx th{min-width:58px;font-size:11px;padding:8px 3px}.mx .rt{min-width:118px;padding-left:8px;font-size:15px}.mx td{padding:6px 3px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MC="mc",SATA="sata",MX="matrix",CZ="cloze",ORD="order",HL="highlight";
const N={moc:"Management of Care",saf:"Safety and Infection Control",hp:"Health Promotion and Maintenance",psy:"Psychosocial Integrity",bcc:"Basic Care and Comfort",ph:"Pharmacological Therapies",rr:"Reduction of Risk Potential",pa:"Physiological Adaptation"};
const S={rc:"Recognize Cues",ac:"Analyze Cues",ph:"Prioritize Hypotheses",gs:"Generate Solutions",ta:"Take Action",eo:"Evaluate Outcomes"};
const Q=[];

/* ================= CHAPTER 53: Assessment of the Endocrine System (lecture-focus set) ================= */
const L53A=[["History","47-year-old man referred for suspected primary adrenal cortex hypofunction. Testing is not finished and no treatment has been started. Four months of fatigue, a 12-lb weight loss, and a craving for salty food. His wife says he is irritable and cries easily, which is new for him. He managed at home until 2 days ago, when fever, a productive cough, and vomiting began."],
["Assessment","Darkened skin over the knuckles, the elbows, and an old appendectomy scar. Blood pressure 106/64 mm Hg lying, 84/50 mm Hg standing with dizziness. Heart rate 96 lying, 122 standing. Temperature 101.8°F (38.8°C)."],
["Laboratory","Sodium 129 mEq/L (flagged low) · Potassium 5.6 mEq/L (flagged high) · Glucose 61 mg/dL (flagged low)"]];
const L53B=L53A.concat([["Six Hours Later","Hormone replacement and IV fluids have been given as prescribed. The reassessment findings are listed in the question."]]);
Q.push(
/* ---- unfolding case: adrenal cortex dysfunction and the response to stress ---- */
{ch:53,cs:"L53",hard:1,need:N.pa,skill:S.ac,type:MX,src:"Lecture: Adrenal cortex hormones | Iggy Ch. 53, Adrenal Cortex; Box 53.1; Physical Assessment: Inspection",chart:L53A,
stem:"For each finding in the chart, choose the hormone change that best explains it.",
cols:["Too little cortisol","Too little aldosterone","High adrenocorticotropic hormone"],
rows:[{t:"Glucose 61 mg/dL, flagged low",a:0},
{t:"Potassium 5.6 mEq/L, flagged high",a:1},
{t:"Darkened skin over the knuckles and the old scar",a:2},
{t:"New irritability and crying easily",a:0},
{t:"Low extracellular fluid volume, shown by dizziness and a pulse rise on standing",a:1}],
why:"Cortisol prevents hypoglycemia and maintains emotional stability, behavior, and cognitive function. Aldosterone maintains extracellular fluid volume and promotes potassium excretion in the kidney. Cortisol also affects sodium balance, but aldosterone is the hormone that maintains extracellular fluid volume. Skin over the joints and over scar tissue darkens because of increased adrenocorticotropic hormone and melanocyte-stimulating hormone.",
plain:"One hormone keeps sugar and mood steady, and another keeps salt and water in and pushes potassium out. The darker skin comes from the brain's “work harder” signal."},

{ch:53,cs:"L53",hard:1,need:N.pa,skill:S.ph,type:MC,src:"Lecture: Priority in adrenal cortex dysfunction is the response to stress | Iggy Ch. 53, Adrenal Cortex (glucocorticoids)",chart:L53A,
stem:"The client managed at home for 4 months and became unstable within 2 days of becoming ill. Which hypothesis best explains why this illness is dangerous for this client and takes priority in planning care?",
opts:[{t:"The infection demands more cortisol than his damaged adrenal cortex can release.",c:1,r:"Physical stress normally increases glucocorticoid release. Cortisol governs the response to stress, is essential for life, and must be present for catecholamines to act and for normal heart muscle excitability."},
{t:"The fever has caused more fluid loss than he has been able to replace by drinking.",r:"Fever adds to fluid loss in any client, so it does not explain why this client cannot compensate or why the glucose is low."},
{t:"The low glucose level is the result of two days of vomiting and poor food intake.",r:"Poor intake contributes, but a healthy adrenal cortex prevents hypoglycemia by raising liver glucose production."},
{t:"The high potassium level is new and is the cause of his dizziness when he stands.",r:"Nothing in the chart shows that the potassium level is new, and the dizziness on standing comes from low extracellular fluid volume."}],
why:"Emotional, chemical, or physical stress increases the release of glucocorticoids. A damaged adrenal cortex cannot meet that demand, so the stress response is the priority concern in adrenal cortex dysfunction. The other statements describe pieces of the picture, not the reason it turned dangerous.",
plain:"Being sick makes the body ask for extra stress hormone. His gland cannot make extra, so a regular infection becomes an emergency."},

{ch:53,cs:"L53",need:N.pa,skill:S.eo,type:SATA,src:"Lecture: Priority concepts, fluid and electrolyte balance and glucose regulation | Iggy Ch. 53, Adrenal Cortex; Box 53.1; Auscultation",chart:L53B,
stem:"Which reassessment findings would show that the client is responding to treatment? Select all that apply.",
opts:[{t:"Glucose 94 mg/dL (was 61 mg/dL)",c:1,r:"Glucocorticoids prevent hypoglycemia, and the glucose has risen from a value that was flagged low."},
{t:"Sodium 137 mEq/L (was 129 mEq/L)",c:1,r:"The serum sodium is back within 136 to 145 mEq/L."},
{t:"Blood pressure 112/70 mm Hg lying and 108/68 mm Hg standing, with no dizziness",c:1,r:"The orthostatic change is gone, which shows that extracellular fluid volume is being restored."},
{t:"Potassium 5.9 mEq/L (was 5.6 mEq/L)",r:"The potassium was flagged high and has gone higher, so potassium excretion by the kidney has not improved."},
{t:"Heart rate 124 lying, with a new irregular rhythm",r:"Some endocrine problems induce dysrhythmias. A faster, irregular rhythm is a sign the client is getting worse."},
{t:"New confusion about where he is",r:"Glucocorticoids maintain behavior and cognitive functions. New confusion is not improvement."}],
why:"Evaluate against what the missing hormones do. Cortisol keeps glucose up and supports the heart and thinking. Aldosterone holds sodium and water and removes potassium. Improvement means the low glucose and low sodium come up, the high potassium comes down, and the blood pressure holds when he stands.",
plain:"Better sugar, better salt, and no dizziness on standing mean the treatment is working. Higher potassium, a jumpy heartbeat, or confusion mean it is not."},

/* ---- findings that prompt a detailed endocrine assessment ---- */
{ch:53,need:N.hp,skill:S.rc,type:HL,src:"Lecture: Current health problems, energy, elimination, reproduction, physical features | Iggy Ch. 53, Box 53.4; Nutrition History; Physical Assessment: Inspection",
stem:"The nurse reviews the intake note for a 44-year-old woman at a routine visit. Select the findings that call for a detailed endocrine assessment.",
segs:[{t:"More tired than usual for 4 months",c:1},
{t:"one bowel movement a day, unchanged",c:0},
{t:"gained 16 lb in 6 months without eating differently",c:1},
{t:"heart rate 72 and regular",c:0},
{t:"feels cold when others in the room are comfortable",c:1},
{t:"scalp hair is thinner and feels coarse",c:1},
{t:"started wearing reading glasses last year",c:0},
{t:"voice has become hoarse and lower",c:1},
{t:"thyroid gland not visible at rest",c:0},
{t:"does not wake at night to urinate",c:0},
{t:"menstrual periods are heavier and closer together",c:1},
{t:"blood pressure the same lying and standing",c:0}],
why:"A change in energy level, feeling hot or cold much of the time, a change in hair distribution or texture, a change in voice quality, a significant weight change without a diet change, and a change in menstrual flow or frequency are all cues the systems history looks for. The thyroid is normally not visible, and unchanged elimination and steady vital signs are normal findings.",
plain:"Tired, heavier, cold, different hair, different voice, different periods: together these say “check the glands.” Needing reading glasses at 44 does not."},

/* ---- physical assessment: palpation safety ---- */
{ch:53,hard:1,need:N.saf,skill:S.ta,type:MC,src:"Lecture: Physical assessment, inspection, auscultation, palpation | Iggy Ch. 53, Palpation; Nursing Safety Priority: Action Alert",
stem:"The nurse precepts a student who is examining a client with suspected hyperthyroidism. Which action by the student requires the nurse to intervene?",
opts:[{t:"Standing behind the client with fingers curved around the front of the neck",c:1,r:"This is the start of thyroid palpation. Pressure on or palpation of the thyroid in suspected hyperthyroidism can cause a sudden release of thyroid hormones and a thyroid storm."},
{t:"Standing in front of the client and watching the lower neck during a swallow",r:"Inspection is safe. The thyroid may be seen moving upward with a swallow."},
{t:"Listening to the chest with a stethoscope for the heart rate and rhythm",r:"Auscultation of the chest gives a baseline, because some endocrine problems induce dysrhythmias."},
{t:"Measuring blood pressure and pulse with the client lying, sitting, and standing",r:"Orthostatic vital signs are a correct part of the endocrine assessment."}],
why:"The position described is the correct technique for palpating a thyroid gland, which is what makes it tempting. It is the wrong action for this client. Do not palpate or press on the thyroid when hyperthyroidism is present or suspected.",
plain:"Squeezing an overactive thyroid can make it dump its hormone all at once. Look and listen, but do not press."},

/* ---- aging: decreased antidiuretic hormone ---- */
{ch:53,hard:1,need:N.moc,skill:S.ac,type:MC,src:"Lecture: Aging, decreased antidiuretic hormone gives dilute urine and dehydration | Iggy Ch. 53, Older Adult Health: Age-Related Endocrine System Changes",
stem:"Assistive personnel report on an 87-year-old client who has no fluid restriction: “She drank only about 350 mL today, but her urine is pale and there is plenty of it, so she is well hydrated.” Which response by the nurse is best?",
opts:[{t:"“Her urine can stay dilute even when she drinks very little. I will assess her now.”",c:1,r:"With decreased antidiuretic hormone production, urine is more dilute and may not concentrate when intake is low. The client is at greater risk for dehydration and is assessed frequently."},
{t:"“Pale urine tells us her intake is enough. Record the amount and recheck this evening.”",r:"In an older adult, pale urine does not rule out dehydration, and this delays the assessment."},
{t:"“Pale urine with low intake points to diabetes mellitus. Check her blood glucose now.”",r:"Diabetes mellitus is suggested by increased and persistent thirst and hunger. This client is drinking very little."},
{t:"“Please check her skin and mouth for dryness and tell me whether she is dehydrated.”",r:"Assessing for dehydration is the nurse's responsibility. Assistive personnel are taught to offer fluids at least every 2 hours while the client is awake."}],
why:"Dilute urine together with low intake is the pattern of the age-related fall in antidiuretic hormone. The nurse assesses for dehydration and then directs assistive personnel to offer fluids at least every 2 hours while the client is awake, unless another condition prevents it.",
plain:"Older kidneys keep letting water out even when little water goes in. Pale urine does not prove she has had enough to drink."},

/* ---- psychosocial assessment ---- */
{ch:53,need:N.psy,skill:S.ta,type:MC,src:"Lecture: Psychosocial assessment, behavior and personality changes | Iggy Ch. 53, Psychosocial Assessment",
stem:"A client with a long-standing pituitary disorder says, “I handle stress the same way I always have.” The client's husband, seated beside the client, shakes his head. Which action does the nurse take next?",
opts:[{t:"Ask the client whether the husband may describe what he has noticed.",c:1,r:"Clients may not recognize changes in themselves. If the client is agreeable, the nurse asks a family member about changes in behavior or personality."},
{t:"Ask the husband to step into the hall and describe the changes in private.",r:"The family member is asked only when the client agrees."},
{t:"Document that the client reports no change in the way stress is handled.",r:"Accurate, but it ignores the cue. Clients may not recognize these changes in themselves."},
{t:"Assess the client's readiness to learn self-management of the disorder.",r:"A real part of the psychosocial assessment, but it does not follow up on the cue just given."}],
why:"Many endocrine problems change behavior, personality, and psychological responses, and the client may not see it. The nurse asks about stress, crying, patience, and anger, and with the client's agreement asks a family member.",
plain:"People cannot always see how they have changed. Ask the client first if it is okay to hear from the family."},

/* ---- endocrine changes with COVID-19 ---- */
{ch:53,hard:1,need:N.moc,skill:S.ph,type:MC,src:"Lecture: Endocrine changes associated with COVID-19 | Iggy Ch. 53, Endocrine Changes Associated With COVID-19",
stem:"Four clients admitted with COVID-19 each have a glucose of 268 mg/dL this morning, and a urine ketone check is prescribed for each of them. Which client is most likely to have ketoacidosis and is checked first?",
opts:[{t:"72-year-old Hispanic man who has had type 2 diabetes mellitus for 14 years",c:1,r:"With COVID-19, ketoacidosis was often diagnosed in older clients of non-White ethnic groups with a history of type 2 diabetes mellitus, and this client fits every part of that description."},
{t:"34-year-old Black woman who had no diabetes mellitus before this infection",r:"Hyperglycemia arose frequently in clients who were not previously diabetic, but ketoacidosis was reported mostly in older clients with a history of type 2 diabetes mellitus."},
{t:"78-year-old White woman who had no diabetes mellitus before this infection",r:"Older age is one part of the reported pattern, but this client has no history of type 2 diabetes mellitus."},
{t:"36-year-old White man who has had type 2 diabetes mellitus for 2 years",r:"Type 2 diabetes mellitus is one part of the reported pattern, but the reports describe older clients."}],
why:"The virus can infect and replicate in pancreatic cells, so hyperglycemia arose frequently, even in clients who were not previously diabetic. Ketoacidosis was often diagnosed in older clients of non-White ethnic groups with a history of type 2 diabetes mellitus. All four clients have the same glucose and all four get the ketone check. The client who fits the whole reported pattern is checked first.",
plain:"The virus can upset the organ that makes insulin, so anyone's sugar can go up. The dangerous acid problem showed up most in older people who already had type 2 diabetes, so that person is checked first."},

/* ---- glands and their hormones ---- */
{ch:53,need:N.pa,skill:S.ac,type:CZ,src:"Lecture: Pineal gland, gonads, thyroid cell types, pancreatic somatostatin | Iggy Ch. 53, Pineal Gland; Gonads; Thyroid Gland; Pancreas",
stem:"Complete the nurse's analysis of four clients.",
parts:["A night-shift worker who sleeps in a brightly lit room cannot keep a regular sleep-wake cycle. The pineal gland secretes melatonin when it is ",{o:["light","dark","cold"],a:1},
". A 19-year-old has structurally normal ovaries but has not developed secondary sexual characteristics. The nurse suspects too little ",{o:["gonadotropic hormone from the anterior pituitary","oxytocin from the posterior pituitary","melatonin from the pineal gland"],a:0},
". A client's thyroid parafollicular cells have been destroyed, and the follicular cells are intact. The hormone lost is ",{o:["thyroxine (T4)","parathyroid hormone","calcitonin"],a:2},
", which normally ",{o:["raises serum calcium by increasing bone resorption","lowers serum calcium by reducing bone resorption","raises the metabolic rate of all cells"],a:1},
". A client receives a drug that acts like somatostatin. The nurse monitors the blood glucose because the drug inhibits the release of ",{o:["insulin only","glucagon only","both insulin and glucagon"],a:2},"."],
why:"Melatonin is secreted when it is dark. The gonads stay dormant until gonadotropic hormones from the anterior pituitary trigger maturation at puberty. Thyroid follicular cells make T4 and T3, and parafollicular cells make calcitonin, which lowers serum calcium and phosphorus by reducing bone resorption, the opposite of parathyroid hormone. Somatostatin inhibits the release of glucagon and insulin, and also gastrin, secretin, and other gastrointestinal peptides.",
plain:"Darkness turns on the sleep hormone, and the pituitary wakes up the ovaries and testes. One kind of thyroid cell runs body speed and the other kind lowers calcium, and somatostatin is a brake on both sugar hormones."},

/* ---- diagnostic assessment: teaching ---- */
{ch:53,need:N.rr,skill:S.gs,type:SATA,src:"Lecture: Diagnostic assessment, assays, urine tests, genetic tests | Iggy Ch. 53, Laboratory Assessment: Assays; Urine Tests; Genetic Tests",
stem:"A client who was adopted as an infant is having an endocrine evaluation. Genetic testing and a 24-hour urine collection are planned, and the client asks why. Which information does the nurse include in teaching? Select all that apply.",
opts:[{t:"“Genetic testing may be done when a hormone level is too low to be measured.”",c:1,r:"This is the stated reason for genetic testing in endocrine assessment."},
{t:"“Genetic testing is especially useful for you because you know little about your family history.”",c:1,r:"It is particularly useful when the client has limited knowledge of family history."},
{t:"“Talk with your provider before you take any new prescribed or over-the-counter drug during testing.”",c:1,r:"Some drugs can interfere with the assay."},
{t:"“A full 24 hours of urine shows how a gland is working better than one sample, because many hormones are released in pulses.”",c:1,r:"Pulsatile secretion makes a timed collection a better reflection of gland function than a single blood or urine sample."},
{t:"“If the urine container has a preservative in it, pour the preservative out before you begin.”",r:"The client is told not to discard the preservative and to handle it with caution, because some preservatives are caustic."},
{t:"“A saliva sample will be used to measure your pituitary hormones.”",r:"Saliva reflects steroid hormones. Protein hormones, such as those from the pituitary gland, are not assessed with saliva."}],
why:"Genetic testing is used when some hormone levels are too low to be measured, and it helps most when family history is unknown. A 24-hour urine collection reflects gland function better than a single sample, and any preservative stays in the container. New drugs can interfere with the assay, and saliva is used for steroid hormones, not pituitary hormones.",
plain:"When a hormone is too tiny to measure, the genes can be checked instead. Save every drop of urine for a whole day, and ask before taking any new medicine."}
);

/* ---- Cushing syndrome: 3-item unfolding case ---- */
{ch:54,cs:"L54",hard:1,need:N.psy,skill:S.ac,type:MC,src:"Lecture: Cushing syndrome psychosocial assessment | Iggy Ch. 54, Cushing Syndrome: Psychosocial Assessment",chart:L54A,
stem:"The nurse reviews the Nurses' Notes with the rest of the record. How does the nurse interpret the change in the client's behavior?",
opts:[{t:"Excess cortisol is acting on the brain; ask about irritability and confusion.",c:1,r:"Hypercortisolism causes emotional instability. The nurse asks about mood swings, irritability, crying or laughing inappropriately, trouble concentrating, and sleep difficulty."},
{t:"A low sodium level is affecting the brain; begin hourly neurologic checks.",r:"That reasoning fits syndrome of inappropriate antidiuretic hormone. This client's sodium is 147 mEq/L, which is high."},
{t:"A low blood glucose level is developing; check a fingerstick glucose now.",r:"Hypoglycemia belongs to adrenal insufficiency. Excess cortisol raises glucose, and this client's fasting level is 196 mg/dL."},
{t:"He is grieving the change in his appearance; arrange a body image referral.",r:"Body changes do matter to clients, but they do not explain rapid swings from laughing to crying with poor concentration and poor sleep."}],
why:"Excess cortisol stimulates the central nervous system. Clients often say they do not feel like themselves and report mood swings, irritability, crying or laughing inappropriately, difficulty concentrating, and sleep problems. The sodium and glucose values in the record rule out the two look-alike explanations.",
plain:"Too much of the stress hormone makes feelings flip fast, like a light switch going on and off. It is the hormone, not the person."},

{ch:54,cs:"L54",need:N.moc,skill:S.ta,type:SATA,src:"Lecture: Cushing syndrome priority problems and planning | Iggy Ch. 54, Cushing Syndrome: Restoring Fluid Volume Balance; Preventing Injury; Preventing Infection",chart:L54B,
stem:"The nurse gives directions to the assistive personnel who will help with this client's care. Which directions does the nurse give? Select all that apply.",

{t:"“Look at the color and clearness of his urine and tell me what you see.”",c:1,r:"Assistive personnel are taught to check urine for color and character and to report the findings."},
{t:"“Use a lift sheet to move him up in bed. Do not pull on his arms.”",c:1,r:"A lift sheet is used instead of grasping the client because the skin is fragile and bone density is reduced."},
{t:"“Put on a mask before you go into his room if you have a cold.”",c:1,r:"Anyone with an upper respiratory infection who enters the room must wear a mask because the client's immunity is reduced."},
{t:"“Keep his water pitcher full and remind him to drink at every visit.”",r:"He is on a fluid restriction. Fluids are offered on a schedule spread over 24 hours."},
{t:"“Help him shave with a blade razor each morning.”",r:"Clients are taught to use an electric shaver to avoid skin trauma."}],
why:"Each correct direction matches one of the three priority problems. Exact intake and output and urine checks track fluid overload. The lift sheet prevents skin and bone injury. The mask protects a client with reduced immunity. The two wrong directions would add fluid and risk a skin injury.",

{ch:54,cs:"L54",need:N.pa,skill:S.eo,type:MX,src:"Lecture: Cushing syndrome evaluate outcomes | Iggy Ch. 54, Cushing Syndrome: Evaluate Outcomes; Care Coordination and Transition Management",chart:L54C,

{t:"Potassium 3.1 mEq/L",a:1},

/* ---- hypopituitarism ---- */
{ch:54,need:N.rr,skill:S.rc,type:CZ,src:"Lecture: Hypopituitarism assessment | Iggy Ch. 54, Hypopituitarism: Pathophysiology Review; Recognize Cues",
stem:"A 47-year-old woman with a pituitary tumor comes to the clinic. She reports no menses for 8 months, feeling cold and tired, and scraping the side mirror of her car on the garage door twice this month. The provider orders T3, T4, and estradiol levels. Complete the statements.",
parts:["The report about the car mirror is a cue of tumor growth, so the nurse assesses the client's ",{o:["hand grip strength","peripheral vision","deep tendon reflexes"],a:1},
". The provider ordered these tests because some pituitary hormones are evaluated by measuring ",{o:["their effects on the target glands","the size of the sella turcica","the response to an oral glucose dose"],a:0},
". If the levels are low, the nurse expects ",{o:["no further testing","the same tests to be repeated in 6 months","further pituitary evaluation"],a:2},
". The deficiencies that are most life-threatening are deficiencies of ",{o:["luteinizing hormone and follicle-stimulating hormone","growth hormone and prolactin","adrenocorticotropic hormone and thyroid-stimulating hormone"],a:2},"."],
why:"Tumor growth often shows first as vision change, especially loss of peripheral vision, and the mirror scrapes are that cue. For some pituitary hormones the laboratory measures the hormone's effect: T3 and T4 from the thyroid and estradiol from the gonads. Low levels call for further pituitary evaluation. Loss of adrenocorticotropic hormone or thyroid-stimulating hormone is most life-threatening because vital adrenal and thyroid hormones fall.",
plain:"The pituitary is the boss gland. To see whether the boss is working, the laboratory checks whether the worker glands are still doing their jobs. Trouble seeing off to the side is often the first warning."},

/* ---- hyperpituitarism: hypophysectomy ---- */
{ch:54,hard:1,need:N.rr,skill:S.ac,type:MX,src:"Lecture: Hyperpituitarism hypophysectomy care | Iggy Ch. 54, Hyperpituitarism: Postoperative Care; Box 54.3",
stem:"A client had the entire pituitary gland removed by transsphenoidal hypophysectomy 8 hours ago. Nasal packing and a drip pad are in place. For each observation, choose the correct category.",
cols:["Expected finding","Report to the surgeon","Correct the care or teaching"],
rows:[{t:"The client cannot smell the food on the meal tray.",a:0},
{t:"The client breathes through the mouth and the lips are dry.",a:0},
{t:"Clear drainage on the drip pad has a light yellow ring at its edge.",a:1},
{t:"The client says, “Something keeps dripping down the back of my throat.”",a:1},
{t:"Vision is blurred. It was clear at the check 1 hour ago.",a:1},
{t:"The head of the bed was lowered flat so the client could sleep.",a:2},
{t:"A family member coaches the client to cough to clear the chest.",a:2},
{t:"The client says, “I will take the thyroid and steroid pills until my 6-month visit.”",a:2}],
why:"A reduced sense of smell is expected for 3 to 4 months, and mouth breathing is expected with nasal packing. A light yellow ring at the edge of clear drainage is the halo sign, and postnasal drip or increased swallowing may also mean cerebrospinal fluid is leaking. Neurologic status is checked every hour, and any change in vision, mental status, level of consciousness, or extremity strength is acted on. The head of the bed stays elevated, coughing is avoided, and replacement of thyroid hormone and glucocorticoid is lifelong when the whole gland is removed.",
plain:"Not smelling and a dry mouth are normal after this surgery. A yellow ring on the pad, a drip in the throat, or blurry eyes mean tell the surgeon. Lying flat, coughing, and planning to stop the pills are mistakes to fix."},

/* ---- diabetes insipidus ---- */
{ch:54,need:N.saf,skill:S.ac,type:SATA,src:"Lecture: Diabetes insipidus classifications and assessment | Iggy Ch. 54, Diabetes Insipidus: Recognize Cues; Action Alert; Interventions",
stem:"A client who has taken lithium for 11 years reports constant thirst and urinating all night. A 24-hour measurement shows a fluid intake of 4,600 mL and a urine output of 5,400 mL. Urine specific gravity is 1.002 and serum sodium is 149 mEq/L. Which interpretations and actions by the nurse are correct? Select all that apply.",
opts:[{t:"The 24-hour result supports diabetes insipidus.",c:1,r:"The disorder is considered when urine output is more than 3 L in 24 hours and is greater than the volume taken in."},
{t:"Lithium is a likely cause, and the kidneys are not responding to vasopressin.",c:1,r:"Lithium can cause arginine vasopressin resistance, the nephrogenic form, in which the hormone is present but the kidney does not respond."},
{t:"Make sure the client never goes more than 4 hours without fluids.",c:1,r:"These clients cannot reduce urine output, so withholding fluids for more than 4 hours can cause severe dehydration."},
{t:"A low-salt, low-to-normal protein diet and a thiazide diuretic can lower the urine output.",c:1,r:"For the resistance form, urine output can be lowered with a low-salt, low-to-normal protein diet and a diuretic. A thiazide causes mild volume depletion that reduces urine output."},
{t:"A specific gravity of 1.002 shows the kidneys are concentrating the urine.",r:"A specific gravity below 1.005 is dilute urine. It shows the kidneys are not reabsorbing water."},
{t:"Have the client stop drinking after 1800 to reduce urination at night.",r:"Limiting fluids does not lower urine output in this disorder. It causes dehydration and raises the sodium level further."}],
why:"The 24-hour intake and output is measured without restricting food or fluid. Output over 3 L that exceeds intake, dilute urine with a specific gravity below 1.005, and a rising sodium level point to diabetes insipidus. Lithium points to the form in which the kidney does not respond to vasopressin, so urine output can be lowered with diet and a thiazide diuretic. The safety rule is that fluids are never withheld for more than 4 hours.",
plain:"The kidneys are like a tap that will not turn off. Taking away his water does not slow the tap; it just dries the client out."},

/* ---- syndrome of inappropriate antidiuretic hormone ---- */
{ch:54,hard:1,need:N.saf,skill:S.ta,type:MC,src:"Lecture: Syndrome of inappropriate antidiuretic hormone interventions and neurologic checks | Iggy Ch. 54, Syndrome of Inappropriate Antidiuretic Hormone: Take Actions; Box 54.4",
stem:"A client with small cell lung cancer was admitted yesterday with nausea, a weight gain of 2 kg in 3 days without ankle edema, and concentrated urine. Fluids are restricted to 1,000 mL in 24 hours. This morning the client was alert and oriented with a serum sodium of 124 mEq/L. At 1400 the client is drowsy, opens the eyes only when spoken to, and is disoriented to time. The serum sodium is 118 mEq/L. Which change does the nurse make to the plan of care?",
opts:[{t:"Perform neurologic checks at least every hour.",c:1,r:"A change in level of consciousness calls for neurologic checks at least every hour, and a sodium level below 120 mEq/L raises the risk for seizures."},
{t:"Keep neurologic checks at every 2 to 4 hours.",r:"That schedule is sufficient only for a client who is hyponatremic but alert, awake, and oriented, as this client was this morning."},
{t:"Request a diuretic to remove the retained water.",r:"Diuretics are used on a limited basis when the sodium level is near normal and heart failure is present. They can increase sodium loss."},
{t:"Brighten the room and turn on the television.",r:"Noise and lighting are reduced, not increased, to prevent overstimulation when the sodium level is this low."}],
why:"Small cell lung cancer is a listed cause of syndrome of inappropriate antidiuretic hormone, and water retention without dependent edema, concentrated urine, and dilutional hyponatremia fit it. The risk for neurologic changes and seizures rises when the sodium level falls below 120 mEq/L, and disorientation is an early cue. An alert, awake, oriented client can be checked every 2 to 4 hours. Once the level of consciousness changes, checks are done at least every hour, and noise and lighting are reduced.",
plain:"Too much water is making the brain swell a little, and the client is getting sleepy and mixed up. The nurse has to check the brain much more often now."},

/* ---- adrenal gland hypofunction ---- */
{ch:54,hard:1,need:N.pa,skill:S.ta,type:MC,src:"Lecture: Adrenal gland hypofunction interventions | Iggy Ch. 54, Adrenal Gland Hypofunction: Take Actions; Box 54.7",
stem:"A client with primary adrenal insufficiency is admitted with nausea and muscle weakness. Blood pressure is 102/64 mm Hg lying down. The apical pulse is 54 and irregular. Sodium is 128 mEq/L, potassium is 6.3 mEq/L, and glucose is 74 mg/dL. Which action does the nurse take first?",
opts:[{t:"Measure the blood pressure lying and then standing.",r:"This checks for fluid depletion and is part of care, but the slow, irregular pulse with a potassium of 6.3 mEq/L is the more immediate threat."},
{t:"Attach the cardiac monitor and assess the rhythm.",c:1,r:"Hyperkalemia can cause dysrhythmias with an irregular heart rate and can lead to cardiac arrest, so assessing cardiac function is the nursing priority."},
{t:"Weigh the client and start an intake and output record.",r:"Daily weight and intake and output are required, but they do not address the immediate cardiac risk."},
{t:"Recheck the blood glucose with a fingerstick.",r:"Preventing hypoglycemia is part of care, but the glucose is within the normal range at 74 mg/dL."}],
why:"Loss of aldosterone lets potassium build up. Hyperkalemia can cause dysrhythmias with an irregular heart rate and can result in cardiac arrest, so assessing cardiac function is a nursing priority. Signs of hyperkalemia on the monitor include a slow heart rate, heart block, and tall, peaked T waves. Checking for fluid deficit, weighing daily, and preventing hypoglycemia all follow.",
plain:"Too much potassium can make the heart beat slow and bumpy, and then stop. Look at the heart first; the other checks come right after."},

/* ---- Cushing syndrome: heart failure risk ---- */
{ch:54,need:N.moc,skill:S.ph,type:MC,src:"Lecture: Cushing syndrome fluid overload and heart failure risk | Iggy Ch. 54, Cushing Syndrome: Restoring Fluid Volume Balance, Nonsurgical Management",
stem:"The nurse receives report on four clients with hypercortisolism. Each has gained 2 lb (0.9 kg) since yesterday and has ankle edema. Which client does the nurse see first because the risk for pulmonary edema and heart failure is greatest?",
opts:[{t:"A 46-year-old with a temperature of 99.5°F (37.5°C)",r:"A small rise in temperature may mean infection and needs follow-up, but it is not one of the conditions that raises the risk for pulmonary edema."},
{t:"A 51-year-old with a fasting glucose of 214 mg/dL",r:"High glucose is expected with excess cortisol and needs management, but it is not one of the conditions that raises the risk for heart failure from fluid overload."},
{t:"A 49-year-old with osteoporosis and back pain",r:"This client is at risk for fracture, but has no coexisting cardiac, kidney, pulmonary, or liver problem."},
{t:"A 44-year-old with chronic kidney disease",c:1,r:"A client with fluid overload who also has a kidney problem is at greater risk for pulmonary edema and heart failure."}],
why:"Any client with fluid overload can progress to pulmonary edema and heart failure, and pulmonary edema can occur quickly and lead to death. The older adult, or a client who also has cardiac, kidney, pulmonary, or liver problems, is at greater risk. The nurse monitors for a bounding pulse, neck vein distention, crackles, increasing edema, and reduced urine output at least every 2 hours.",
plain:"All four are holding extra water. The one whose kidneys cannot get rid of water well will get into trouble fastest."},

/* ---- hyperaldosteronism ---- */
{ch:54,need:N.hp,skill:S.eo,type:MC,src:"Lecture: Hyperaldosteronism surgery and spironolactone | Iggy Ch. 54, Hyperaldosteronism: Interprofessional Collaborative Care",
stem:"A client with hyperaldosteronism from an adenoma in one adrenal gland is scheduled for removal of that gland. Blood pressure is 172/100 mm Hg and potassium is 3.0 mEq/L. Which statement by the client indicates a need for further teaching?",
opts:[{t:"“My potassium has to come up to normal before the operation.”",r:"Correct understanding. The potassium level must be corrected before surgery."},
{t:"“The spironolactone I take now helps my body hold on to potassium.”",r:"Correct understanding. Spironolactone is a potassium-sparing diuretic and an aldosterone antagonist."},
{t:"“I will get a steroid before surgery to prevent an adrenal crisis.”",r:"Correct understanding. Glucocorticoids are given before surgery to prevent adrenal crisis."},
{t:"“After this surgery I will need steroid pills for life.”",c:1,r:"After removal of one gland, glucocorticoid replacement may be needed only temporarily. It is lifelong when both glands are removed."}],
why:"Hypokalemia and high blood pressure are the most common problems in hyperaldosteronism. Surgery is a common treatment, and the potassium level must be corrected first with spironolactone or potassium supplements. Glucocorticoids are given before surgery to prevent adrenal crisis. Replacement is temporary after one gland is removed and lifelong only when both are removed.",
plain:"He has two of these glands. Taking one out leaves the other to take over after a while, so the extra medicine is not forever."}
);
