<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Exam — F&amp;E, Acid-Base, Burns, Endocrine, Oncology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7F6; --card:#FFFFFF; --ink:#1C2A33; --muted:#5A6A73; --rule:#D3DCDF; --soft:#E9EEEF;
  --flag:#C47A12; --ok:#2B7A4B; --okbg:#E4F2E9; --bad:#B0281F; --badbg:#FBE9E7; --sel:#1F5E8C; --selbg:#E3EEF7;
  --fe:#2F78A8; --ab:#7B57A8; --bu:#B8472F; --en:#2D8A6E; --on:#5F6B8C;
  --grid1:#F3C9C9; --grid2:#E59A9A; --trace:#1C2A33;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11181D; --card:#18222A; --ink:#E4EAED; --muted:#9AAAB3; --rule:#2C3A43; --soft:#1F2B33;
  --flag:#E0A040; --ok:#6BC28E; --okbg:#173326; --bad:#F08A7E; --badbg:#3A1C19; --sel:#7DB6E3; --selbg:#1C3346;
  --fe:#6AAAD6; --ab:#A889D2; --bu:#E07E62; --en:#5CC2A1; --on:#9AA6C8; --grid1:#3A2426; --grid2:#6A3A3D; --trace:#E4EAED;}}
:root[data-theme="dark"]{
  --paper:#11181D; --card:#18222A; --ink:#E4EAED; --muted:#9AAAB3; --rule:#2C3A43; --soft:#1F2B33;
  --flag:#E0A040; --ok:#6BC28E; --okbg:#173326; --bad:#F08A7E; --badbg:#3A1C19; --sel:#7DB6E3; --selbg:#1C3346;
  --fe:#6AAAD6; --ab:#A889D2; --bu:#E07E62; --en:#5CC2A1; --on:#9AA6C8; --grid1:#3A2426; --grid2:#6A3A3D; --trace:#E4EAED;}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0 6px}
.bar h1{font-size:15px;font-weight:600;margin:0}
.bar .meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip{display:flex;gap:2px;align-items:flex-end;height:30px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tick{flex:1 0 8px;min-width:8px;height:12px;border:0;padding:0;border-radius:2px;background:var(--soft);box-shadow:inset 0 -3px 0 var(--c);position:relative;opacity:.95;transition:height .15s}
.tick.r-ok,.tick.r-part,.tick.r-bad{box-shadow:none}
.tick.done{background:var(--c)}
.tick.cur{height:22px;outline:2px solid var(--ink);outline-offset:1px}
.tick.flag::after{content:"";position:absolute;left:50%;top:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--flag)}
.tick.r-ok{background:var(--ok)} .tick.r-part{background:var(--flag)} .tick.r-bad{background:var(--bad)}
/* screens */
main{padding:18px 0 120px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px}
.tagline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.stem{font-family:var(--serif);font-size:19px;line-height:1.55;margin:0 0 6px}
.instr{font-size:14px;color:var(--muted);margin:0 0 14px}
.ecg{width:100%;height:auto;display:block;margin:6px 0 16px;border:1px solid var(--rule);border-radius:6px;background:var(--card)}
.ecg .g1{stroke:var(--grid1);stroke-width:.6}.ecg .g2{stroke:var(--grid2);stroke-width:1}
.ecg .trace{fill:none;stroke:var(--trace);stroke-width:2.2;stroke-linejoin:round}
/* options */
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;margin:0 0 10px;line-height:1.4}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt.box .key{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--sel);background:var(--selbg)}
.opt[aria-pressed="true"] .key{background:var(--sel);border-color:var(--sel);color:var(--card)}
.opt.m-ok{border-color:var(--ok);background:var(--okbg)} .opt.m-bad{border-color:var(--bad);background:var(--badbg)}
.opt.m-miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default;color:inherit}
/* matrix */
.mrow{border-top:1px solid var(--rule);padding:12px 0}
.mrow:first-of-type{border-top:0}
.mlabel{font-weight:600;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--rule);background:var(--card);border-radius:18px;padding:6px 12px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--sel);background:var(--selbg);font-weight:600}
.seg button.m-ok{border-color:var(--ok);background:var(--okbg)} .seg button.m-bad{border-color:var(--bad);background:var(--badbg)}
.seg button.m-miss{border-color:var(--ok);border-style:dashed}
/* cloze */
.cloze{font-family:var(--serif);font-size:18px;line-height:2.1}
.cloze select{font-family:var(--sans);font-size:15px;padding:4px 6px;border:1.5px solid var(--sel);border-radius:6px;background:var(--selbg);max-width:100%}
.cloze select.m-ok{border-color:var(--ok);background:var(--okbg)} .cloze select.m-bad{border-color:var(--bad);background:var(--badbg)}
.fix{font-size:13px;color:var(--ok);font-family:var(--sans);font-weight:600}
/* highlight */
.passage{font-family:var(--serif);font-size:18px;line-height:1.9}
.hl{background:none;border:0;padding:1px 2px;border-bottom:2px dotted var(--muted);text-align:left;font:inherit;line-height:inherit;border-radius:3px}
.hl[aria-pressed="true"]{background:#F6DB9A;color:#1C2A33;border-bottom-color:var(--flag)}
.hl.m-ok{background:var(--okbg);color:var(--ink);border-bottom:2px solid var(--ok)} .hl.m-bad{background:var(--badbg);color:var(--ink);border-bottom:2px solid var(--bad)}
.hl.m-miss{border-bottom:2px dashed var(--ok)}
/* bowtie */
.bow{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;align-items:center;margin:4px 0 16px}
.bow .col{display:grid;gap:6px}
.slot{min-height:46px;border:1.5px dashed var(--muted);border-radius:6px;padding:6px 8px;font-size:13px;line-height:1.3;display:flex;align-items:center;color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--sel);background:var(--selbg);color:var(--ink)}
.slot.center{min-height:70px;font-weight:600}
.slot.m-ok{border-color:var(--ok);background:var(--okbg);border-style:solid} .slot.m-bad{border-color:var(--bad);background:var(--badbg);border-style:solid}
.bowhead{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:6px;font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
fieldset{border:0;margin:0 0 14px;padding:0}
legend{font-weight:600;margin-bottom:8px;font-size:15px}
/* order */
.olist{list-style:none;margin:0;padding:0}
.olist li{display:flex;gap:10px;align-items:center;border:1.5px solid var(--rule);border-radius:8px;padding:10px 10px 10px 12px;margin-bottom:8px;background:var(--card)}
.olist .n{font-weight:700;color:var(--muted);width:18px;font-variant-numeric:tabular-nums}
.olist .t{flex:1}
.olist .mv{display:flex;flex-direction:column;gap:4px}
.olist .mv button{width:34px;height:28px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);font-size:14px;line-height:1}
.olist li.m-ok{border-color:var(--ok);background:var(--okbg)} .olist li.m-bad{border-color:var(--bad);background:var(--badbg)}
/* feedback */
.fb{margin-top:16px;border-left:4px solid var(--c,var(--muted));background:var(--soft);border-radius:0 8px 8px 0;padding:12px 14px}
.fb h3{margin:0 0 6px;font-size:15px}
.fb p{margin:0 0 8px}
.fb .ref{font-size:13px;color:var(--muted);margin:0}
/* bottom bar */
.act{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.act .wrap{display:flex;gap:8px}
.btn{border:1.5px solid var(--rule);background:var(--card);border-radius:8px;padding:11px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);flex:1}
.btn.flagged{border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* start & results */
.hero h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin:8px 0 10px;letter-spacing:-.01em}
.hero p{color:var(--muted);max-width:60ch}
.mix{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 20px;font-size:14px}
.choice{display:grid;gap:10px;margin:0 0 18px}
.choice label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--card);cursor:pointer}
.choice input{margin-top:4px;accent-color:var(--ink)}
.choice small{display:block;color:var(--muted)}
.score{font-family:var(--serif);font-size:56px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px;margin:18px 0}
.bars .b{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.bars .track{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bars .fill{height:100%;background:var(--c)}
.bars .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rlist{list-style:none;padding:0;margin:0}
.rlist li{border-top:1px solid var(--rule)}
.rlist button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:12px 2px}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.rlist .s{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rlist .q{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px}
.review{padding:0 0 16px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0}
.hidden{display:none!important}
@media (max-width:520px){.stem{font-size:18px}.bars .b{grid-template-columns:110px 1fr 48px}.hero h2{font-size:28px}.slot{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <div class="row"><h1 id="title">Review exam</h1><span class="meta" id="meta"></span></div>
  <nav class="strip" id="strip" aria-label="Question navigator"></nav>
</div></div>
<main class="wrap" id="app"></main>
<div class="act hidden" id="act"><div class="wrap">

  <button class="btn" id="bFlag" aria-pressed="false">Flag</button>
  <button class="btn primary" id="bNext">Next</button>
</div></div>

s=\"g2\"/><line x1=\"0\" y1=\"8\" x2=\"640\" y2=\"8\" class=\"g1\"/><line x1=\"0\" y1=\"16\" x2=\"640\" y2=\"16\" class=\"g1\"/><line x1=\"0\" y1=\"24\" x2=\"640\" y2=\"24\" class=\"g1\"/><line x1=\"0\" y1=\"32\" x2=\"640\" y2=\"32\" class=\"g1\"/><line x1=\"0\" y1=\"40\" x2=\"640\" y2=\"40\" class=\"g2\"/><line x1=\"0\" y1=\"48\" x2=\"640\" y2=\"48\" class=\"g1\"/><line x1=\"0\" y1=\"56\" x2=\"640\" y2=\"56\" class=\"g1\"/><line x1=\"0\" y1=\"64\" x2=\"640\" y2=\"64\" class=\"g1\"/><line x1=\"0\" y1=\"72\" x2=\"640\" y2=\"72\" class=\"g1\"/><line x1=\"0\" y1=\"80\" x2=\"640\" y2=\"80\" class=\"g2\"/><line x1=\"0\" y1=\"88\" x2=\"640\" y2=\"88\" class=\"g1\"/><line x1=\"0\" y1=\"96\" x2=\"640\" y2=\"96\" class=\"g1\"/><line x1=\"0\" y1=\"104\" x2=\"640\" y2=\"104\" class=\"g1\"/><line x1=\"0\" y1=\"112\" x2=\"640\" y2=\"112\" class=\"g1\"/><line x1=\"0\" y1=\"120\" x2=\"640\" y2=\"120\" class=\"g2\"/><line x1=\"0\" y1=\"128\" x2=\"640\" y2=\"128\" class=\"g1\"/><line x1=\"0\" y1=\"136\" x2=\"640\" y2=\"136\" class=\"g1\"/><line x1=\"0\" y1=\"144\" x2=\"640\" y2=\"144\" class=\"g1\"/><path d=\"M0,95 L20,95 L28,90 L36,87 L44,90 L52,95 L64,95 L67,100 L72,37 L77,109 L81,95 L96,95 L110,35 L122,95 L170,95 L175,95 L183,90 L191,87 L199,90 L207,95 L219,95 L222,100 L227,37 L232,109 L236,95 L251,95 L265,35 L277,95 L325,95 L330,95 L338,90 L346,87 L354,90 L362,95 L374,95 L377,100 L382,37 L387,109 L391,95 L406,95 L420,35 L432,95 L480,95 L485,95 L493,90 L501,87 L509,90 L517,95 L529,95 L532,100 L537,37 L542,109 L546,95 L561,95 L575,35 L587,95 L635,95 L640,95\" class=\"trace\"/></svg>", "id": 0}, {"type": "mcq", "topic": "Fluid & Electrolytes", "stem": "A client being treated for diabetic ketoacidosis has a potassium of 3.4 mEq/L. An IV potassium infusion is prescribed. Urine output for the past hour was 20 mL. Which action is correct?", "opts": ["Hold the potassium infusion and notify the provider", "Give the potassium, then recheck urine output in 1 hour", "Increase the insulin infusion to lower glucose faster", "Change the IV fluid to 5% dextrose in 0.45% saline"], "ans": [0], "rat": "Action Alert: before giving IV potassium-containing solutions, ensure urine output is at least 30 mL/hr. At 20 mL/hr the kidneys cannot reliably excrete potassium. The dextrose switch is tied to blood glucose reaching 250 mg/dL, not to potassium. Insulin lowers glucose by about 50–75 mg/dL/hr by protocol and also drives potassium into cells — increasing it would worsen hypokalemia.", "ref": "Iggy Ch. 56 pp. 1371–1372", "cj": "Take Actions", "svg": null, "id": 1}, {"type": "sata", "topic": "Fluid & Electrolytes", "stem": "Six hours after a total thyroidectomy, which findings would the nurse report as consistent with low serum calcium? Select all that apply.", "opts": ["Tingling around the mouth", "Positive Chvostek sign", "Temperature increase of 1°F (1.8°C)", "Positive Trousseau sign", "Hoarse, weak voice", "Twitching of the fingers", "Shortened QT interval"], "ans": [0, 1, 3, 5], "rat": "Parathyroid injury during thyroid surgery lowers parathyroid hormone → hypocalcemia: perioral/fingertip tingling, muscle twitching, positive Trousseau and Chvostek signs (potential tetany). Hypocalcemia PROLONGS the QT interval; a shortened QT is hypercalcemia. Hoarseness points to laryngeal nerve injury. A 1°F temperature rise signals possible thyroid storm.", "ref": "Iggy Ch. 55 pp. 1334, 1336; Ch. 27 p. 652", "cj": "Recognize Cues", "id": 2}, {"type": "mcq", "topic": "Fluid & Electrolytes", "stem": "A client with syndrome of inappropriate antidiuretic hormone receives continuous enteral feedings. Which action is correct?", "opts": ["Use saline rather than water to dilute feedings and flush the tube", "Encourage 2 L of oral fluid daily to prevent dehydration", "Keep the IV open with 5% dextrose in water", "Flush the tube with 30 mL of sterile water every 4 hours"], "ans": [0], "rat": "In this condition free water is retained, diluting serum sodium. Iggy: use saline instead of water to dilute tube feedings, irrigate GI tubes, and give drugs by tube; restrict fluid (as little as 500–1000 mL/24 hr); if routine IV fluids are needed, a saline solution is ordered to prevent further sodium dilution.", "ref": "Iggy Ch. 54 p. 1310", "cj": "Take Actions", "svg": null, "id": 3}, {"type": "mcq", "topic": "Fluid & Electrolytes", "stem": "A client receiving tolvaptan had a serum sodium of 118 mEq/L yesterday morning. This morning it is 134 mEq/L. What is the nurse’s priority concern?", "opts": ["Central nervous system demyelination from overly rapid sodium correction", "Rebound hyponatremia once the drug is stopped", "Worsening fluid overload from water retention", "Hyperkalemia from reduced potassium excretion"], "ans": [0], "rat": "Tolvaptan carries a black box warning: a sodium rise greater than 12 mEq/L in 24 hours is associated with central nervous system demyelination, serious complications, and death. This client rose 16 mEq/L. That is why vaptans are given only in the hospital with close sodium monitoring. (Its second black box warning is liver failure.)", "ref": "Iggy Ch. 54 p. 1310 (Drug Alert)", "cj": "Analyze Cues", "svg": null, "id": 4}, {"type": "matrix", "topic": "Fluid & Electrolytes", "stem": "For each finding, select the adrenal condition it is most consistent with.", "cols": ["Adrenal insufficiency", "Cushing syndrome"], "rows": ["Serum sodium 128 mEq/L", "Serum potassium 5.9 mEq/L", "Fasting glucose 198 mg/dL", "Serum potassium 3.1 mEq/L", "Serum calcium 11.2 mg/dL", "Salt craving and hyperpigmented skin", "Bounding pulse and hypertension"], "ans": [0, 0, 1, 1, 0, 0, 1], "rat": "Adrenal insufficiency (loss of aldosterone and cortisol): low sodium, high potassium, normal-to-low glucose, high calcium, high BUN, salt craving, hyperpigmentation (elevated melanocyte-stimulating hormone in primary disease), hypotension. Cushing syndrome is the opposite: sodium and water retention (hypertension, bounding pulses, edema), low potassium, high glucose, low calcium.", "ref": "Iggy Ch. 54 Table 54.2, Box 54.6, Box 54.10, pp. 1311–1316", "cj": "Analyze Cues", "id": 5}, {"type": "sata", "topic": "Fluid & Electrolytes", "stem": "Which interventions does Iggy list for managing hyperkalemia in a client with acute adrenal insufficiency? Select all that apply.", "opts": ["Loop diuretic", "IV calcium", "Potassium binding and excreting resin", "Spironolactone", "Dietary potassium restriction", "IV insulin with dextrose", "Potassium chloride salt substitute"], "ans": [0, 1, 2, 4, 5], "rat": "Box 54.7: insulin and dextrose shift potassium into cells; resin binds and excretes it; loop or thiazide diuretics increase loss; IV calcium stabilizes cardiac cell membranes; restrict potassium; monitor intake, output, and ECG. Avoid potassium-sparing diuretics such as spironolactone. Potassium chloride salt substitutes add potassium (Iggy tells patients with kidney disease to avoid them).", "ref": "Iggy Ch. 54 Box 54.7; Ch. 60 p. 1466", "cj": "Generate Solutions", "id": 6}, {"type": "mcq", "topic": "Fluid & Electrolytes", "stem": "A client with syndrome of inappropriate antidiuretic hormone weighs 1.5 kg more than yesterday on the same scale at the same time. Approximately how much fluid has been retained?", "opts": ["500 mL", "3000 mL", "1500 mL", "150 mL"], "ans": [2], "rat": "Iggy: a 1-kg (2.2-lb) increase equals 1000 mL of fluid retention (1 kg = 1 L), so 1.5 kg ≈ 1500 mL. A gain of 1 kg or more per day is cause for concern.", "ref": "Iggy Ch. 54 p. 1310", "cj": "Recognize Cues", "svg": null, "id": 7}, {"type": "mcq", "topic": "Fluid & Electrolytes", "stem": "A client with arginine vasopressin deficiency (central diabetes insipidus) is NPO for a procedure that has been delayed. It has now been 4 hours since the client last drank. What is the nurse’s best action?", "opts": ["Continue NPO and measure urine output every 8 hours", "Allow unlimited ice chips in place of IV fluids", "Contact the provider for an IV fluid prescription", "Give a double dose of desmopressin to reduce urine output"], "ans": [2], "rat": "Action Alert: no patient suspected of this condition should be deprived of fluids for more than 4 hours — they cannot reduce urine output, and severe dehydration (and shock) can result. Desmopressin is dosed by response; excess causes water retention and hyponatremia (seizures, coma, death).", "ref": "Iggy Ch. 54 pp. 1308–1309", "cj": "Take Actions", "svg": null, "id": 8}, {"type": "bowtie", "topic": "Fluid & Electrolytes", "stem": "A client with breast cancer metastatic to bone reports 3 days of constipation, nausea, frequent urination, and increasing drowsiness. Serum calcium is 13.1 mg/dL. Complete the diagram: the condition, 2 actions to take, and 2 parameters to monitor.", "conds": ["Syndrome of inappropriate antidiuretic hormone", "Hypercalcemia", "Hypocalcemia", "Hyperkalemia"], "acts": ["Give a thiazide diuretic as prescribed", "Infuse IV normal saline as prescribed", "Restrict fluids to 1000 mL/day", "Give IV calcium gluconate", "Give a loop diuretic as prescribed"], "pars": ["Urine ketones", "Periorbital edema", "Lung sounds and neck veins for fluid overload", "Serum calcium level", "Chvostek sign"], "cAns": 1, "aAns": [1, 4], "pAns": [2, 3], "rat": "Bone metastasis + constipation, polyuria, altered cognition = hypercalcemia (an oncologic emergency; dehydration worsens it). Treatment: aggressive IV normal saline, loop diuretics to promote urinary calcium loss; thiazides are AVOIDED because they increase calcium reabsorption. Aggressive saline makes fluid overload the key safety parameter (monitor at least every 2 hours) along with serum calcium. Chvostek sign is for hypocalcemia.", "ref": "Iggy Ch. 18 p. 402; Ch. 55 p. 1337", "cj": "Take Actions", "id": 9}, {"type": "mcq", "topic": "Acid-Base", "stem": "A postoperative client receiving IV opioids has a respiratory rate of 8/min. ABG: pH 7.28, PaCO2 58 mm Hg, HCO3 25 mEq/L. (Ranges: pH 7.35–7.45; PaCO2 35–45; HCO3 22–26.) How does the nurse interpret this ABG?", "opts": ["Respiratory alkalosis", "Uncompensated respiratory acidosis", "Partially compensated respiratory acidosis", "Uncompensated metabolic acidosis"], "ans": [1], "rat": "pH low = acidosis. PaCO2 high moves opposite to pH (Respiratory Opposite) → respiratory cause. HCO3 is normal, so the kidneys have not compensated yet → uncompensated. Iggy lists opioid use as a cause of elevated PaCO2 (respiratory acidosis).", "ref": "Iggy Ch. 22 Table 22.5", "cj": "Analyze Cues", "svg": null, "id": 10}, {"type": "mcq", "topic": "Acid-Base", "stem": "A client with long-standing chronic obstructive pulmonary disease has this ABG: pH 7.33, PaCO2 56 mm Hg, HCO3 32 mEq/L. How is it interpreted?", "opts": ["Fully compensated respiratory acidosis", "Partially compensated metabolic alkalosis", "Uncompensated respiratory acidosis", "Partially compensated respiratory acidosis"], "ans": [3], "rat": "Iggy: in chronic obstructive pulmonary disease, carbon dioxide retention causes chronic respiratory acidosis; the kidneys compensate by retaining bicarbonate (elevated HCO3), ‘although pH remains lower than normal.’ Primary problem respiratory (PaCO2 high, pH low); compensation present (HCO3 high) but pH not yet normal → partial.", "ref": "Iggy Ch. 24 p. 552", "cj": "Analyze Cues", "svg": null, "id": 11}, {"type": "mcq", "topic": "Acid-Base", "stem": "A client with deep, rapid respirations and a fruity breath odor has glucose 520 mg/dL and ABG: pH 7.18, PaCO2 24 mm Hg, HCO3 9 mEq/L. Which interpretation is correct?", "opts": ["Metabolic acidosis with respiratory compensation", "Respiratory acidosis with metabolic compensation", "Respiratory alkalosis with metabolic compensation", "Metabolic alkalosis"], "ans": [0], "rat": "Ketoacids lower pH and bicarbonate (Metabolic Equal: both down). Kussmaul respirations ‘blow off’ carbon dioxide, lowering PaCO2 — Iggy calls this compensatory respiratory alkalosis. pH is still low, so compensation is partial.", "ref": "Iggy Ch. 56 pp. 1344, 1370", "cj": "Analyze Cues", "svg": null, "id": 12}, {"type": "mcq", "topic": "Acid-Base", "stem": "A client develops sudden dyspnea and pleuritic chest pain 3 days after hip surgery. Which initial ABG pattern does the nurse anticipate?", "opts": ["pH 7.30, PaCO2 52 mm Hg, HCO3 24 mEq/L", "pH 7.49, PaCO2 30 mm Hg, HCO3 24 mEq/L", "pH 7.31, PaCO2 38 mm Hg, HCO3 17 mEq/L", "pH 7.49, PaCO2 40 mm Hg, HCO3 32 mEq/L"], "ans": [1], "rat": "With pulmonary embolism, hypoxia and pain trigger hyperventilation, which FIRST causes respiratory alkalosis (low PaCO2, high pH). Iggy: later, shunting raises PaCO2 (respiratory acidosis), and lactic acid buildup adds metabolic acidosis.", "ref": "Iggy Ch. 26 p. 602", "cj": "Prioritize Hypotheses", "svg": null, "id": 13}, {"type": "cloze", "topic": "Acid-Base", "stem": "Complete the statement about a client in diabetic ketoacidosis.", "text": "Kussmaul respirations are the body’s attempt to {0} to compensate for {1}. Sodium bicarbonate is reserved for severe acidosis, indicated when the arterial pH is {2}.", "blanks": [["exhale carbon dioxide", "exhale ketones only", "retain bicarbonate", "retain carbon dioxide"], ["respiratory acidosis", "metabolic acidosis", "respiratory alkalosis", "metabolic alkalosis"], ["7.0 or less", "7.25 or less", "7.30 or less", "7.35 or less"]], "ans": [0, 1, 0], "rat": "Excess acids trigger the brain to increase rate and depth of breathing to blow off carbon dioxide and acid (Kussmaul). Iggy: sodium bicarbonate, by slow IV infusion over several hours, is indicated when arterial pH is 7.0 or less or serum bicarbonate is less than 5 mEq/L. (Contrast sepsis: bicarbonate for pH 7.2 or lower with acute kidney injury.)", "ref": "Iggy Ch. 56 pp. 1344, 1372; Ch. 31 p. 776", "cj": "Generate Solutions", "id": 14}, {"type": "sata", "topic": "Acid-Base", "stem": "According to Iggy, which conditions can produce metabolic acidosis? Select all that apply.", "opts": ["Acute adrenal insufficiency", "Opioid overdose with slow respirations", "Progressive stage of shock", "Emergent phase of a major burn", "Anxiety-induced hyperventilation", "Diabetic ketoacidosis", "Advanced chronic kidney disease"], "ans": [0, 2, 3, 5, 6], "rat": "Ketoacids (diabetic ketoacidosis); failed hydrogen ion excretion and bicarbonate loss (chronic kidney disease, with Kussmaul breathing); lactic acid from anaerobic metabolism (shock); potassium retention promoting hydrogen reabsorption (adrenal insufficiency); fluid shift and cell damage (burns). Opioid respiratory depression causes RESPIRATORY acidosis; hyperventilation causes respiratory alkalosis.", "ref": "Iggy Ch. 60 p. 1466; Ch. 31 p. 765; Ch. 54 p. 1311; Ch. 21 p. 468; Ch. 22 Table 22.5", "cj": "Analyze Cues", "id": 15}, {"type": "matrix", "topic": "Acid-Base", "stem": "Interpret each ABG. (Ranges: pH 7.35–7.45; PaCO2 35–45 mm Hg; HCO3 22–26 mEq/L.)", "cols": ["Respiratory acidosis", "Respiratory alkalosis", "Metabolic acidosis", "Metabolic alkalosis"], "rows": ["pH 7.52, PaCO2 38, HCO3 33", "pH 7.30, PaCO2 36, HCO3 17", "pH 7.47, PaCO2 29, HCO3 23", "pH 7.31, PaCO2 52, HCO3 26"], "ans": [3, 2, 1, 0], "rat": "Use ROME. Row 1: pH up, HCO3 up (same direction) → metabolic alkalosis. Row 2: pH down, HCO3 down → metabolic acidosis. Row 3: pH up, PaCO2 down (opposite) → respiratory alkalosis. Row 4: pH down, PaCO2 up → respiratory acidosis. All four are uncompensated (the other value is normal).", "ref": "Iggy Ch. 22 Table 22.5 (ranges and interpretation)", "cj": "Analyze Cues", "id": 16}, {"type": "mcq", "topic": "Acid-Base", "stem": "Four clients are in diabetic ketoacidosis. For which client does the nurse anticipate a prescription for sodium bicarbonate?", "opts": ["PaCO2 25 mm Hg", "Arterial pH 6.98", "Arterial pH 7.24", "Serum bicarbonate 12 mEq/L"], "ans": [1], "rat": "Bicarbonate is used only for severe acidosis: arterial pH 7.0 or less, or serum bicarbonate less than 5 mEq/L. A PaCO2 of 25 is expected respiratory compensation, not an indication.", "ref": "Iggy Ch. 56 p. 1372", "cj": "Generate Solutions", "svg": null, "id": 17}, {"type": "highlight", "topic": "Burns", "stem": "Click every finding in the nurse’s note that requires immediate follow-up for possible airway injury.", "phrases": ["Client found in a smoke-filled bedroom.", "Alert and oriented.", "Eyelashes singed.", "Carbonaceous sputum with coughing.", "Voice has become brassy.", "Superficial burns on both forearms.", "Reports thirst.", "Drooling; states it hurts to swallow.", "Blood pressure 128/80."], "ans": [0, 2, 3, 4, 7], "rat": "Box 21.13 and Critical Rescue: enclosed-space smoke exposure, singed eyelashes, carbonaceous sputum, voice change (hoarse/brassy), drooling, and difficulty swallowing indicate inhalation injury or evolving obstruction → position upright, apply oxygen, notify the Rapid Response Team. Scoring is plus-minus: wrong highlights subtract.", "ref": "Iggy Ch. 21 pp. 474–475", "cj": "Recognize Cues", "id": 18}, {"type": "mcq", "topic": "Burns", "stem": "A client weighing 220 lb (100 kg) has partial- and full-thickness burns covering 27% of total body surface area. Using the Parkland formula, how much fluid is due in the first 8 hours postburn?", "opts": ["5,400 mL", "7,200 mL", "2,700 mL", "10,800 mL"], "ans": [0], "rat": "4 mL × 100 kg × 27 = 10,800 mL over 24 hours. Half is given in the first 8 hours postburn (5,400 mL); the remaining half over the next 16 hours.", "ref": "Iggy Ch. 21 p. 480, Box 21.16", "cj": "Generate Solutions", "svg": null, "id": 19}, {"type": "mcq", "topic": "Burns", "stem": "A lineman arrives with a small entrance wound on the right hand and an exit wound on the left foot after contact with a power line. He is awake and talking. Which action is the priority?", "opts": ["Apply silver sulfadiazine to both wounds", "Base the fluid calculation on the size of the two wounds", "Cool both wounds with ice packs", "Obtain a 12-lead ECG"], "ans": [3], "rat": "Emergency management of electrical burns: initiate/continue CPR and obtain an ECG. The ‘iceberg effect’ means small surface wounds hide major internal damage, so wound size underestimates injury (and electrical burns are the exception to accurate surface-area assessment). Ice is never used; cooling is cool water, not cold.", "ref": "Iggy Ch. 21 pp. 471, 473, 477", "cj": "Take Actions", "svg": null, "id": 20}, {"type": "mcq", "topic": "Burns", "stem": "A worker arrives with dry industrial powder on both arms and clothing. Which action does the nurse take first?", "opts": ["Apply a neutralizing agent to the skin", "Cover the arms with wet saline dressings", "Brush off the dry chemical where the debris will not contact others", "Irrigate immediately with large amounts of water"], "ans": [2], "rat": "Box 21.12: brush off dry chemicals first, remove clothing without wetting it, identify the chemical, and do NOT neutralize until the chemical is identified and the correct agent is available. Irrigation with large amounts of water follows decontamination.", "ref": "Iggy Ch. 21 pp. 473, 481", "cj": "Take Actions", "svg": null, "id": 21}, {"type": "sata", "topic": "Burns", "stem": "On day 6 after a burn injury, which findings are local indicators of burn wound infection? Select all that apply.", "opts": ["Foul odor from the wound", "Sloughing of a recent graft", "Low-grade fever since admission", "A partial-thickness area now appears full thickness", "Pain at the wound edges", "Soft, dry eschar on a deep partial-thickness area", "Edema of healthy skin around the wound"], "ans": [0, 1, 3, 6], "rat": "Box 21.14 local indicators include conversion of partial- to full-thickness injury, odor, graft sloughing, surrounding edema, excessive drainage, and pale boggy granulation tissue. A low-grade fever is expected from hypermetabolism. Soft, dry eschar is a normal feature of deep partial-thickness burns. Pain at edges is expected with partial-thickness injury.", "ref": "Iggy Ch. 21 pp. 467, 470, 476", "cj": "Recognize Cues", "id": 22}, {"type": "mcq", "topic": "Burns", "stem": "A mechanically ventilated client has burns over 40% of total body surface area. Which prescription does the nurse expect in order to prevent a Curling ulcer?", "opts": ["Aspirin daily", "Remove the nasogastric tube", "A proton pump inhibitor", "Delay enteral feeding until bowel sounds return"], "ans": [2], "rat": "Curling ulcer (acute stress gastroduodenal ulcer) risk is higher with mechanical ventilation, multiorgan complications, and burns over 30%. It is prevented with H2-histamine blockers, proton pump inhibitors, GI-protective drugs, and EARLY enteral feeding. A nasogastric tube is generally required with burns of 25% or more or intubation.", "ref": "Iggy Ch. 21 pp. 469–470, 477", "cj": "Generate Solutions", "svg": null, "id": 23}, {"type": "mcq", "topic": "Burns", "stem": "A client has a circumferential full-thickness burn of the right lower leg. Four hours into fluid resuscitation, the pedal pulse is detectable only by Doppler and capillary refill is 4 seconds. Which intervention does the nurse anticipate?", "opts": ["Apply a compression garment to the leg", "Escharotomy", "A fluid bolus to improve perfusion", "Elevate the leg and apply ice"], "ans": [1], "rat": "Fluid collects under circumferential eschar and creates a tourniquet effect → arterial compression, ischemia, necrosis. Escharotomy relieves it; fasciotomy follows if pressure remains high. Boluses are avoided in burn resuscitation because they raise capillary pressure and worsen edema. Compression garments are for scar and contracture prevention, not acute ischemia.", "ref": "Iggy Ch. 21 p. 480", "cj": "Take Actions", "svg": null, "id": 24}, {"type": "matrix", "topic": "Burns", "stem": "For each nursing priority, select the phase of burn care in which Iggy places it.", "cols": ["Emergent (resuscitation)", "Acute (healing)", "Rehabilitative (restorative)"], "rows": ["Secure the airway", "Prevent contractures", "Nutrition and metabolic support", "Fluid resuscitation for hypovolemia", "Prevent infection and continue wound care", "Support resumption of work and family roles"], "ans": [0, 2, 1, 0, 1, 2], "rat": "Emergent (0 to about 24–48 hours): airway, circulation and perfusion, temperature, analgesia, emotional support. Acute (about 36–48 hours until wound closure): infection prevention, wound care, nutrition and metabolic support. Rehabilitative (wound closure to highest function): contracture and scar prevention, psychosocial adjustment, resuming roles.", "ref": "Iggy Ch. 21 p. 473, Box 21.11", "cj": "Prioritize Hypotheses", "id": 25}, {"type": "mcq", "topic": "Endocrine", "stem": "Which client statement shows correct understanding of levothyroxine?", "opts": ["“I’ll take it with my iron pill so I don’t forget either one.”", "“I’ll take it at bedtime with a snack so it doesn’t upset my stomach.”", "“I can stop it once my energy comes back.”", "“I’ll take it with water on an empty stomach in the morning and take my calcium 4 hours apart.”"], "ans": [3], "rat": "Drug Alert: take levothyroxine with water on an empty stomach 30–60 minutes before the morning meal; iron, calcium supplements, and antacids reduce absorption and must be separated by at least 4 hours. Replacement is lifelong. Bedtime-with-snack is a distractor Iggy uses in its own mastery question.", "ref": "Iggy Ch. 55 pp. 1328–1329", "cj": "Evaluate Outcomes", "svg": null, "id": 26}, {"type": "sata", "topic": "Endocrine", "stem": "A client with untreated hypothyroidism is admitted after surgery and given opioids. Which findings would indicate progression to myxedema coma? Select all that apply.", "opts": ["Bradycardia", "Fever", "Greatly reduced level of consciousness", "Exophthalmos", "Hypothermia", "Hyponatremia", "Tachycardia", "Hypoglycemia"], "ans": [0, 2, 4, 5, 7], "rat": "Iggy lists: greatly reduced level of consciousness and cognition, respiratory failure (most common cause of death), hypotension, hyponatremia, hypothermia, hypoglycemia, bradycardia. Surgery and opioids/sedatives are triggers. Fever, tachycardia, and exophthalmos belong to hyperthyroidism and thyroid storm.", "ref": "Iggy Ch. 55 pp. 1327–1328", "cj": "Recognize Cues", "id": 27}, {"type": "mcq", "topic": "Endocrine", "stem": "A client with Graves disease had a subtotal thyroidectomy yesterday. Temperature was 98.6°F (37°C) at 0800 and is 99.8°F (37.7°C) at 1200; heart rate is 118/min. What is the nurse’s best action?", "opts": ["Give aspirin as needed for fever", "Report the findings to the provider immediately", "Recheck the temperature in 1 hour", "Palpate the neck to assess thyroid size"], "ans": [1], "rat": "Critical Rescue: in hyperthyroidism, even after thyroidectomy, a temperature increase of even 1°F (1.8°C) may indicate impending thyroid storm — report it immediately and assess cardiac status. Thyroid storm treatment uses NONSALICYLATE antipyretics. Never palpate the thyroid in a hyperthyroid client — it can release hormone and trigger storm.", "ref": "Iggy Ch. 55 pp. 1331, 1334", "cj": "Take Actions", "svg": null, "id": 28}, {"type": "mcq", "topic": "Endocrine", "stem": "Four hours after thyroidectomy, which finding requires the nurse to call the Rapid Response Team?", "opts": ["Tingling in the fingertips", "Hoarse, weak voice", "Inspiratory stridor with increasing dyspnea", "Small amount of serosanguineous drainage on the dressing"], "ans": [2], "rat": "Stridor, dyspnea, or other signs of obstruction after thyroid surgery → notify the Rapid Response Team (keep suction and tracheotomy equipment in the room). Hoarseness is usually temporary laryngeal nerve irritation. Tingling suggests hypocalcemia — report it and have IV calcium gluconate available, but the airway comes first.", "ref": "Iggy Ch. 55 pp. 1334, 1338", "cj": "Prioritize Hypotheses", "svg": null, "id": 29}, {"type": "mcq", "topic": "Endocrine", "stem": "Which teaching point is specific to propylthiouracil rather than methimazole?", "opts": ["Report weight gain, slow heart rate, and cold intolerance", "Report dark urine or yellowing of the skin or eyes", "Avoid crowds and people who are ill", "Take it diluted in a glass of water 1 hour after other antithyroid drugs"], "ans": [1], "rat": "Table 55.2: propylthiouracil → report dark urine or jaundice (liver toxicity or failure). Both thionamides reduce immune response (avoid crowds) and both can overshoot into hypothyroidism (weight gain, bradycardia, cold intolerance). Dilution in water and timing after thionamides are instructions for iodine (SSKI).", "ref": "Iggy Ch. 55 p. 1332, Table 55.2", "cj": "Take Actions", "svg": null, "id": 30}, {"type": "mcq", "topic": "Endocrine", "stem": "Which instruction does the nurse give a client going home after oral radioactive iodine (131I) therapy?", "opts": ["Sit to urinate and flush 2 to 3 times with the lid closed", "Use absorbent gel-filled pads for any incontinence", "Avoid pregnant women and young children for 24 hours", "Share meals as usual since radioactivity stays in the thyroid"], "ans": [0], "rat": "Box 55.5: sit to urinate (men and women), flush 2–3 times with the lid closed; do NOT use gel-filled pads (use condom catheter or flushable tissue); avoid pregnant women, infants, and young children for the prescribed time — usually at least a week — at 6 feet; saliva is radioactive the first week, so do not prepare food or share beverages.", "ref": "Iggy Ch. 55 p. 1332, Box 55.5", "cj": "Take Actions", "svg": null, "id": 31}, {"type": "mcq", "topic": "Endocrine", "stem": "A client on long-term prednisone stopped it abruptly 3 days ago and now has blood pressure 78/46, sodium 124 mEq/L, potassium 6.0 mEq/L, and glucose 58 mg/dL. Which prescription does the nurse implement first?", "opts": ["IV potassium chloride replacement", "Spironolactone to correct fluid balance", "Rapid IV normal saline infusion with IV hydrocortisone", "Oral fludrocortisone and a sodium-restricted diet"], "ans": [2], "rat": "Sudden cessation of long-term glucocorticoids is a common cause of secondary adrenal insufficiency and can cause shock. Box 54.7: start rapid infusion of normal saline or 5% dextrose in normal saline, give IV hydrocortisone (or dexamethasone) bolus, then continuous infusion. Potassium is already HIGH; spironolactone (potassium-sparing) is avoided.", "ref": "Iggy Ch. 54 pp. 1311–1313, Box 54.7", "cj": "Take Actions", "svg": null, "id": 32}, {"type": "mcq", "topic": "Endocrine", "stem": "A client with Addison disease is being discharged on hydrocortisone. Which statement indicates correct understanding?", "opts": ["“I’ll take it on an empty stomach so it absorbs faster.”", "“I’ll take two-thirds of the dose when I get up and one-third around 6 p.m.”", "“I can stop it when my blood pressure is back to normal.”", "“If I get the flu, I’ll keep my dose exactly the same.”"], "ans": [1], "rat": "Divided doses mimic normal secretion: two-thirds on arising, one-third at 6 p.m. Table 54.3: take with meals or a snack (gastric irritation); report illness because the usual dose may not be adequate during illness or severe stress. Replacement is not stopped on the patient’s own.", "ref": "Iggy Ch. 54 pp. 1312–1313, Table 54.3", "cj": "Evaluate Outcomes", "svg": null, "id": 33}, {"type": "mcq", "topic": "Endocrine", "stem": "Which finding is the best indicator of fluid retention in a client with Cushing syndrome?", "opts": ["Rapid weight gain", "Moon face", "Urine specific gravity 1.030", "Dependent edema"], "ans": [0], "rat": "Iggy: fluid retention may not be visible; rapid weight gain is the best indicator of fluid retention and overload. Weigh daily before breakfast on the same scale in similar clothing. A specific gravity BELOW 1.005 may indicate fluid overload; 1.030 is concentrated urine. Moon face is fat redistribution.", "ref": "Iggy Ch. 54 p. 1317", "cj": "Recognize Cues", "svg": null, "id": 34}, {"type": "mcq", "topic": "Endocrine", "stem": "A hospitalized client’s blood glucose is 62 mg/dL. The client is alert and can swallow. Which action is correct?", "opts": ["Give glucagon intramuscularly", "Give crackers with peanut butter first", "Give 15 g of fast-acting carbohydrate such as 4 oz of apple juice and recheck in 15 minutes", "Give 30 g of carbohydrate and recheck in 30 minutes"], "ans": [2], "rat": "15-15 rule: glucose below 70 mg/dL → 15 g of carbohydrate (30 g if below 50), recheck within 15 minutes, repeat if still low, then follow with a complex carbohydrate. Liquid preferred; avoid high-potassium options such as orange juice in hospital protocols. Glucagon is for clients who cannot swallow. Complex carbohydrates come AFTER correction.", "ref": "Iggy Ch. 56 p. 1369", "cj": "Take Actions", "svg": null, "id": 35}, {"type": "order", "topic": "Endocrine", "stem": "A family member finds a client with type 1 diabetes unconscious at home. Place the steps Iggy teaches families in the correct order.", "items": ["Give the prescribed glucagon (IM, subcutaneous, or nasal)", "Give a second glucagon dose in 10 minutes if still unconscious", "Call 911 if the person remains unconscious", "Call the diabetes health care provider for insulin instructions", "Give a small meal once awake and no longer nauseated"], "rat": "Box 56.11 (severe hypoglycemia): glucagon → second dose in 10 minutes if unconscious → if still unconscious, call 911 for transport and IV dextrose → call the diabetes provider for insulin instructions → small meal when awake and not nauseated. Glucagon can cause vomiting — position the person on the side. Ordered-response items are scored all-or-nothing.", "ref": "Iggy Ch. 56 p. 1369, Box 56.11", "cj": "Take Actions", "id": 36, "start": [4, 3, 0, 1, 2]}, {"type": "cloze", "topic": "Endocrine", "stem": "Complete the diabetic ketoacidosis fluid statement.", "text": "The first hour of fluid therapy is typically infused at {0}. When blood glucose reaches {1}, the IV is changed to {2} to help prevent hypoglycemia and {3}.", "blanks": [["100 mL/hr", "30 mL/kg over 3 hours", "15–20 mL/kg/hr", "4–14 mL/kg/hr"], ["250 mg/dL", "180 mg/dL", "300 mg/dL", "70 mg/dL"], ["5% dextrose in water", "lactated Ringer’s", "5% dextrose in 0.45% saline", "3% sodium chloride"], ["hyperkalemia", "ketonuria", "cerebral edema", "fluid overload"]], "ans": [2, 0, 2, 2], "rat": "Iggy: initial infusion 15–20 mL/kg/hr during the first hour; then hypotonic fluids at 4–14 mL/kg/hr. At a glucose of 250 mg/dL give 5% dextrose in 0.45% saline, which helps prevent hypoglycemia and cerebral edema from too-rapid decline in serum osmolarity. (30 mL/kg is the sepsis bundle.)", "ref": "Iggy Ch. 56 p. 1371", "cj": "Generate Solutions", "id": 37}, {"type": "matrix", "topic": "Endocrine", "stem": "For each finding, select whether it is more consistent with diabetic ketoacidosis or hyperglycemic-hyperosmolar state.", "cols": ["Diabetic ketoacidosis", "Hyperglycemic-hyperosmolar state"], "rows": ["Glucose 740 mg/dL with osmolarity 348 mOsm/L", "Positive serum and urine ketones", "Arterial pH 7.21, HCO3 11 mEq/L", "Older adult, gradual onset, poor fluid intake", "Kussmaul respirations and fruity breath", "Serum pH 7.42 with prominent neurologic changes"], "ans": [1, 0, 0, 1, 0, 1], "rat": "Table 56.9. Diabetic ketoacidosis: sudden onset, glucose above 300, ketones positive, pH below 7.35, HCO3 below 15, Kussmaul respirations and fruity breath. Hyperglycemic-hyperosmolar state: gradual onset, glucose above 600, osmolarity above 320, ketones negative, pH above 7.4, HCO3 above 20, altered central nervous system function; most often older adults with type 2 diabetes and poor fluid intake.", "ref": "Iggy Ch. 56 pp. 1371–1373, Table 56.9", "cj": "Analyze Cues", "id": 38}, {"type": "mcq", "topic": "Endocrine", "stem": "A client taking metformin is scheduled for a CT scan with IV contrast. What does the nurse teach?", "opts": ["Drink alcohol only in moderation that day", "The metformin must be stopped before the contrast study", "Double the next dose after the scan", "Take metformin on an empty stomach the morning of the test"], "ans": [1], "rat": "Table 56.5: metformin must be stopped before certain imaging tests using contrast agents because of increased risk for kidney damage and lactic acidosis; avoid alcohol (lactic acidosis); take with food to lessen GI effects.", "ref": "Iggy Ch. 56 p. 1353, Table 56.5", "cj": "Take Actions", "svg": null, "id": 39}, {"type": "sata", "topic": "Endocrine", "stem": "A client is starting empagliflozin. What does the nurse include in teaching? Select all that apply.", "opts": ["Report swelling or redness of the genital or perineal skin", "Report a weight gain of 2 lb in 1 day", "Report thirst, light-headedness, and dry mouth", "Inject once weekly on the same day", "Report genital itching or discharge", "Take only with the first bite of a meal", "Report burning or frequency with urination"], "ans": [0, 2, 4, 6], "rat": "SGLT2 inhibitors excrete glucose and sodium in urine: dehydration, hyponatremia, urinary tract infection, genital yeast infection, and Fournier gangrene risk. ‘Take with the first bite of a meal’ = alpha-glucosidase inhibitors; weekly injection = some GLP-1 agonists; daily weight gain reporting for heart failure = thiazolidinediones. (Watch for drug-class cross-wiring.)", "ref": "Iggy Ch. 56 pp. 1353–1354, Table 56.5", "cj": "Generate Solutions", "id": 40}, {"type": "mcq", "topic": "Endocrine", "stem": "A client uses insulin glargine at bedtime and regular insulin with meals. Which statement requires correction?", "opts": ["“I’ll wear my medical alert bracelet.”", "“I’ll check my blood sugar before meals.”", "“I’ll keep a fast carbohydrate with me.”", "“At bedtime I’ll draw both insulins into the same syringe to save a shot.”"], "ans": [3], "rat": "Drug Alert: do not mix any other insulin type with insulin glargine, insulin detemir, or premixed formulations. The other statements are correct self-management.", "ref": "Iggy Ch. 56 p. 1357", "cj": "Evaluate Outcomes", "svg": null, "id": 41}, {"type": "mcq", "topic": "Oncology", "stem": "Nine days after chemotherapy, a client’s temperature is 100.6°F (38.1°C). There is no redness, cough, or drainage, and the client says, “I feel fine.” What is the nurse’s priority action?", "opts": ["Place the client on airborne precautions", "Recheck the temperature in 4 hours", "Notify the provider immediately and initiate the infection protocol", "Insert an indwelling catheter to obtain a urine culture"], "ans": [2], "rat": "Day 9 is within the nadir (usually 7–10 days). In neutropenia, typical infection signs may be absent; a low-grade fever may be the only sign. Any temperature above 100.4°F (38°C) is reported immediately; cultures are drawn before antibiotics. The neutropenic client is not an infection risk to others. Box 18.7: avoid indwelling urinary catheters.", "ref": "Iggy Ch. 18 pp. 392–394, 401", "cj": "Take Actions", "svg": null, "id": 42}, {"type": "sata", "topic": "Oncology", "stem": "A client’s platelet count is 18,000/mm³. What does the nurse teach? Select all that apply.", "opts": ["Floss firmly to remove plaque", "Use a soft-bristled toothbrush", "Use a rectal suppository if constipated", "Take a stool softener to avoid straining", "Avoid aspirin-containing products", "Blow your nose forcefully to clear congestion", "Use an electric shaver"], "ans": [1, 3, 4, 6], "rat": "Below 20,000/mm³ spontaneous, uncontrollable bleeding can occur. Box 18.10: electric shaver, soft toothbrush, no aspirin or salicylates, stool softener, NO enemas or rectal suppositories, blow the nose gently with both nostrils open, avoid trauma to gums.", "ref": "Iggy Ch. 18 pp. 394–395, Box 18.10", "cj": "Generate Solutions", "id": 43}, {"type": "mcq", "topic": "Oncology", "stem": "During a peripheral IV infusion of doxorubicin, the client reports burning and the site is swelling. What does the nurse do?", "opts": ["Flush the line to clear the vein", "Slow the rate and reassess in 30 minutes", "Apply a warm compress and continue the infusion", "Stop the infusion and initiate the agency’s extravasation protocol"], "ans": [3], "rat": "Doxorubicin is a vesicant; extravasation can cause pain, infection, and tissue loss. Nurses must observe for leakage, pain, or swelling and initiate management guidelines immediately, coordinating with the oncologist and pharmacist on the drug-specific antidote. Continuing or flushing drives more drug into tissue.", "ref": "Iggy Ch. 18 pp. 390–391, Table 18.10", "cj": "Take Actions", "svg": null, "id": 44}, {"type": "mcq", "topic": "Oncology", "stem": "A client with non-Hodgkin lymphoma is scheduled for a first dose of rituximab. Which action does the nurse take?", "opts": ["Monitor for peripheral neuropathy during the infusion", "Hold the dose if the platelet count is below 150,000/mm³", "Schedule surgery within 7 days after the dose", "Give the prescribed diphenhydramine and acetaminophen before the infusion"], "ans": [3], "rat": "Rituximab (anti-CD20 monoclonal antibody) can cause infusion-related reactions, usually during the infusion within 30 minutes to 2 hours: fever, chills, rigors, rash, hypotension, bronchospasm. Premedication with antihistamines, steroids, and acetaminophen decreases incidence. The surgery rule (none within 28 days) belongs to bevacizumab.", "ref": "Iggy Ch. 18 pp. 398–400, Table 18.12", "cj": "Take Actions", "svg": null, "id": 45}, {"type": "mcq", "topic": "Oncology", "stem": "Ondansetron is prescribed before chemotherapy. Which laboratory results does the nurse review first because of the drug’s cardiac risk?", "opts": ["INR", "Serum uric acid", "Blood glucose", "Serum potassium and magnesium"], "ans": [3], "rat": "Drug Alert: 5-HT3 antagonists such as ondansetron can prolong the QT interval; ECG monitoring is recommended with hypokalemia or hypomagnesemia, heart failure, bradydysrhythmias, or other QT-prolonging drugs. INR monitoring belongs to aprepitant (warfarin interaction); glucose to dexamethasone.", "ref": "Iggy Ch. 18 p. 396, Table 18.11", "cj": "Recognize Cues", "svg": null, "id": 46}, {"type": "bowtie", "topic": "Oncology", "stem": "A client with prostate cancer metastatic to the spine reports thoracic back pain that has worsened over 5 days, legs that feel heavy, and difficulty starting urination. Complete the diagram.", "conds": ["Hypercalcemia", "Superior vena cava syndrome", "Spinal cord compression", "Tumor lysis syndrome"], "acts": ["Give the prescribed high-dose IV corticosteroid", "Encourage walking to strengthen the legs", "Restrict fluids to 1 L/day", "Apply heat and reassess in 24 hours", "Prepare the client for MRI"], "pars": ["Serum uric acid", "Serum sodium", "Lower-extremity strength and sensation", "Facial and periorbital edema", "Bladder function and urinary retention"], "cAns": 2, "aAns": [0, 4], "pAns": [2, 4], "rat": "Back pain is usually the first symptom of spinal cord compression (thoracic spine most common); weakness, heaviness, sensory loss, and urinary retention follow. Treat immediately when suspected to preserve function: MRI is preferred, high-dose IV corticosteroid bolus then taper, radiation, surgery. Paralysis is usually permanent if compression is not relieved promptly.", "ref": "Iggy Ch. 18 p. 402", "cj": "Take Actions", "id": 47}, {"type": "mcq", "topic": "Oncology", "stem": "A sealed radioactive implant becomes dislodged onto the bed of a client being treated for cervical cancer. What does the nurse do?", "opts": ["Leave it in place and have the client move to another bed", "Pick it up with double gloves and send it to pharmacy", "Wrap it in the linens and remove them from the room", "Pick it up with long-handled forceps and place it in the lead container in the room"], "ans": [3], "rat": "Box 18.3: never touch the source with bare hands; retrieve it with long-handled forceps and deposit it in the lead container kept in the room. Also: private room and bath, dosimeter for each caregiver, apron facing the source, no pregnant staff or visitors, no children younger than 16.", "ref": "Iggy Ch. 18 p. 388, Box 18.3", "cj": "Take Actions", "svg": null, "id": 48}, {"type": "sata", "topic": "Oncology", "stem": "A client with a bulky, fast-growing lymphoma will start chemotherapy tomorrow. What does the nurse teach to prevent tumor lysis syndrome? Select all that apply.", "opts": ["Take your antiemetics on schedule", "Drink at least 3 L of fluid a day before and during treatment", "Stop drinking fluids after 6 p.m.", "Take allopurinol as prescribed", "Limit fluids to avoid swelling", "Call the oncologist if nausea keeps you from drinking", "Take a daily potassium supplement"], "ans": [0, 1, 3, 5], "rat": "Hydration prevents and manages tumor lysis syndrome by increasing kidney flow, preventing uric acid buildup, and diluting potassium. Teach at least 3000 mL/day, follow the antiemetic plan, and call so IV fluids can start if nausea blocks intake. Allopurinol or rasburicase promote uric acid excretion. Potassium supplements are wrong — hyperkalemia is a defining danger.", "ref": "Iggy Ch. 18 p. 403", "cj": "Generate Solutions", "id": 49}], "order": [28, 26, 22, 16, 40, 7, 44, 24, 42, 31, 27, 29, 39, 6, 11, 14, 48, 32, 34, 36, 49, 30, 19, 1, 45, 2, 17, 25, 37, 23, 33, 21, 8, 12, 5, 3, 9, 41, 35, 46, 4, 0, 20, 13, 18, 38, 10, 47, 43, 15]};

function maxPts(it){ switch(it.type){ case "mcq": return 1; case "sata": case "highlight": return it.ans.length;
  case "matrix": return it.rows.length; case "cloze": return it.blanks.length; case "bowtie": return 5; case "order": return 1; } }
function score(it, r){
  if (r==null) return 0;
  switch(it.type){
    case "mcq": return r===it.ans[0] ? 1 : 0;
    case "sata": case "highlight": { let s=0; r.forEach(i => s += it.ans.includes(i) ? 1 : -1); return Math.max(0,s); }
    case "matrix": case "cloze": return it.ans.reduce((s,a,i)=> s + (r[i]===a?1:0), 0);
    case "bowtie": { let s = r.c===it.cAns?1:0; (r.a||[]).forEach(i=> s += it.aAns.includes(i)?1:0); (r.p||[]).forEach(i=> s += it.pAns.includes(i)?1:0); return s; }
    case "order": return r.every((v,i)=> v===i) ? 1 : 0;
  }
}
function answered(it, r){
  if (r==null) return false;
  switch(it.type){ case "mcq": return true; case "sata": case "highlight": return r.length>0;
    case "matrix": return r.filter(v=>v!=null).length===it.rows.length; case "cloze": return r.filter(v=>v!=null).length===it.blanks.length;
    case "bowtie": return r.c!=null && (r.a||[]).length===2 && (r.p||[]).length===2; case "order": return !!r.touched; }
}
function respOf(it){ const r = S.resp[it.id];
  if (it.type==="order") return r ? r.seq : it.start.slice(); return r; }

/* ---------- renderers ---------- */
function renderItem(it, locked){
  const box = h("div", {class:"card", style:`--c:${tcolor(it)}`});
  box.append(h("div",{class:"tagline"}, h("span",{class:"chip"}, h("i"), it.topic), TYPE_LABEL[it.type]));
  box.append(h("p",{class:"stem"}, it.stem));
  const instr = {sata:"Select all that apply. Scored plus-minus: wrong selections subtract.", highlight:"Tap a phrase to highlight it; tap again to remove.", order:"Use the arrows to arrange every step in order.", bowtie:"Choose 1 condition, 2 actions, and 2 parameters.", matrix:"Select one option per row.", cloze:"Choose the best option for each blank."}[it.type];
  if (instr) box.append(h("p",{class:"instr"}, instr));
  if (it.svg) box.append(h("div",{html:it.svg}));
  const body = h("div"); box.append(body);
  ({mcq:rMcq, sata:rSata, matrix:rMatrix, cloze:rCloze, bowtie:rBow, highlight:rHl, order:rOrder})[it.type](it, body, locked);
  if (locked) box.append(feedback(it));
  return box;
}
function setResp(it, v){ S.resp[it.id]=v; save(); refreshStrip(); refreshAct(); }

function rMcq(it, el, locked){ const r = S.resp[it.id];
  it.opts.forEach((o,i)=>{ const pressed = r===i; let cls="opt";
    if (locked){ if (it.ans.includes(i)) cls += pressed?" m-ok":" m-miss"; else if (pressed) cls+=" m-bad"; }
    el.append(h("button",{class:cls, "aria-pressed":String(pressed), disabled:locked, onclick:()=>{ setResp(it,i); rerender(); }}, h("span",{class:"key"},LET[i]), h("span",{},o))); }); }
function rSata(it, el, locked){ const r = S.resp[it.id]||[];
  it.opts.forEach((o,i)=>{ const pressed=r.includes(i); let cls="opt box";
    if (locked){ if (it.ans.includes(i)) cls += pressed?" m-ok":" m-miss"; else if (pressed) cls+=" m-bad"; }
    el.append(h("button",{class:cls,"aria-pressed":String(pressed),disabled:locked,onclick:()=>{ const n=r.includes(i)?r.filter(x=>x!==i):[...r,i]; setResp(it,n.sort((a,b)=>a-b)); rerender(); }}, h("span",{class:"key"}, pressed?"✓":""), h("span",{},o))); }); }
function rMatrix(it, el, locked){ const r = S.resp[it.id] || Array(it.rows.length).fill(null);
  it.rows.forEach((row,ri)=>{ const seg=h("div",{class:"seg",role:"radiogroup","aria-label":row});
    it.cols.forEach((c,ci)=>{ const p=r[ri]===ci; let cls="";
      if (locked){ if (it.ans[ri]===ci) cls = p?"m-ok":"m-miss"; else if (p) cls="m-bad"; }
      seg.append(h("button",{class:cls,"aria-pressed":String(p),disabled:locked,onclick:()=>{ const n=r.slice(); n[ri]=ci; setResp(it,n); rerender(); }}, c)); });
    el.append(h("div",{class:"mrow"}, h("div",{class:"mlabel"},row), seg)); }); }
function rCloze(it, el, locked){ const r = S.resp[it.id] || Array(it.blanks.length).fill(null);
  const p = h("div",{class:"cloze"});
  it.text.split(/(\{\d\})/).forEach(part=>{ const m=part.match(/^\{(\d)\}$/);
    if (!m){ p.append(part); return; } const bi=+m[1];
    const sel=h("select",{"aria-label":`Blank ${bi+1}`, disabled:locked, onchange:e=>{ const n=(S.resp[it.id]||Array(it.blanks.length).fill(null)).slice(); n[bi]=e.target.value===""?null:+e.target.value; setResp(it,n); }});
    sel.append(h("option",{value:""},"Select…"));
    it.blanks[bi].forEach((o,oi)=> sel.append(h("option",{value:oi, selected:r[bi]===oi}, o)));
    if (locked) sel.classList.add(r[bi]===it.ans[bi]?"m-ok":"m-bad");
    p.append(sel);
    if (locked && r[bi]!==it.ans[bi]) p.append(h("span",{class:"fix"}," [", it.blanks[bi][it.ans[bi]], "] ")); });
  el.append(p); }
function rHl(it, el, locked){ const r = S.resp[it.id]||[]; const p=h("div",{class:"passage"});
  it.phrases.forEach((ph,i)=>{ const on=r.includes(i); let cls="hl";
    if (locked){ if (it.ans.includes(i)) cls += on?" m-ok":" m-miss"; else if (on) cls+=" m-bad"; }
    p.append(h("button",{class:cls,"aria-pressed":String(on),disabled:locked,onclick:()=>{ const n=on?r.filter(x=>x!==i):[...r,i]; setResp(it,n.sort((a,b)=>a-b)); rerender(); }}, ph), " "); });
  el.append(p); }
function rOrder(it, el, locked){ const r = S.resp[it.id] || {seq: it.start.slice(), touched:false}; const seq=r.seq;
  const ol=h("ol",{class:"olist"});
  seq.forEach((id,pos)=>{ let cls=""; if (locked) cls = id===pos?"m-ok":"m-bad";
    const mv = locked ? h("span",{class:"n"}, id===pos?"✓":`→${id+1}`) : h("div",{class:"mv"},
      h("button",{"aria-label":"Move up",disabled:pos===0,onclick:()=>move(pos,-1)},"▲"),
      h("button",{"aria-label":"Move down",disabled:pos===seq.length-1,onclick:()=>move(pos,1)},"▼"));
    ol.append(h("li",{class:cls}, h("span",{class:"n"},pos+1), h("span",{class:"t"},it.items[id]), mv)); });
  function move(pos,d){ const n=seq.slice(); [n[pos],n[pos+d]]=[n[pos+d],n[pos]]; setResp(it,{seq:n,touched:true}); rerender(); }
  el.append(ol);
  if (!locked && !r.touched) el.append(h("p",{class:"instr"},"Move at least one step to record an answer (or move one and back if you think the starting order is correct)."));
}
function rBow(it, el, locked){ const r = S.resp[it.id] || {c:null,a:[],p:[]};
  const slot=(txt,ok,center)=>{ let cls="slot"+(center?" center":"")+(txt?" full":""); if (locked&&txt!=null) cls += ok?" m-ok":" m-bad"; return h("div",{class:cls}, txt || "—"); };
  el.append(h("div",{class:"bowhead"}, h("span",{},"Actions to take"), h("span",{},"Condition most likely"), h("span",{},"Parameters to monitor")));
  el.append(h("div",{class:"bow"},
    h("div",{class:"col"}, ...[0,1].map(k=>{ const i=r.a[k]; return slot(i!=null?it.acts[i]:null, it.aAns.includes(i)); })),
    slot(r.c!=null?it.conds[r.c]:null, r.c===it.cAns, true),
    h("div",{class:"col"}, ...[0,1].map(k=>{ const i=r.p[k]; return slot(i!=null?it.pars[i]:null, it.pAns.includes(i)); }))));
  const group=(label, list, key, multi, correct)=>{ const fs=h("fieldset",{},h("legend",{},label));
    list.forEach((o,i)=>{ const cur = multi ? r[key].includes(i) : r[key]===i; let cls="opt"+(multi?" box":"");
      if (locked){ const ok = multi ? correct.includes(i) : correct===i; if (ok) cls += cur?" m-ok":" m-miss"; else if (cur) cls+=" m-bad"; }
      fs.append(h("button",{class:cls,"aria-pressed":String(cur),disabled:locked,onclick:()=>{ const n={c:r.c,a:r.a.slice(),p:r.p.slice()};
        if (!multi) n[key]=i; else if (cur) n[key]=n[key].filter(x=>x!==i); else { n[key].push(i); if (n[key].length>2) n[key].shift(); }
        setResp(it,n); rerender(); }}, h("span",{class:"key"}, multi?(cur?"✓":""):LET[i]), h("span",{},o))); });
    return fs; };
  el.append(group("Condition (choose 1)", it.conds, "c", false, it.cAns), group("Actions to take (choose 2)", it.acts, "a", true, it.aAns), group("Parameters to monitor (choose 2)", it.pars, "p", true, it.pAns));
}
function feedback(it){ const r=respOf(it); const s=score(it, it.type==="order"?(S.resp[it.id]?S.resp[it.id].seq:null):S.resp[it.id]), m=maxPts(it);
  const verdict = s===m ? "Correct" : s===0 ? "Incorrect" : `Partial credit`;
  return h("div",{class:"fb"}, h("h3",{}, `${verdict} — ${s} of ${m} point${m>1?"s":""}`), h("p",{}, it.rat),
    h("p",{class:"ref"}, `${it.ref}${it.cj?"  |  Clinical judgment: "+it.cj:""}`)); }

/* ---------- screens ---------- */
function list(){ return S.order; }
function curItem(){ return ITEMS[list()[S.cur]]; }
function refreshStrip(){ const st=$("#strip"); st.innerHTML=""; if (S.screen==="start"){ return; }
  list().forEach((id,i)=>{ const it=ITEMS[id]; let cls="tick";
    if (S.submitted){ const sc=score(it, it.type==="order"?(S.resp[id]?S.resp[id].seq:null):S.resp[id]), m=maxPts(it); cls += sc===m?" r-ok":sc===0?" r-bad":" r-part"; }
    else if (answered(it,S.resp[id])) cls+=" done";
    if (S.screen==="q" && i===S.cur) cls+=" cur"; if (S.flags[id]) cls+=" flag";
    st.append(h("button",{class:cls,style:`--c:${tcolor(it)}`,"aria-label":`Item ${i+1}, ${it.topic}${S.flags[id]?", flagged":""}`,onclick:()=>{ S.cur=i; S.screen="q"; save(); rerender(); }})); });
  const t=st.querySelector(".cur"); if (t) t.scrollIntoView({block:"nearest",inline:"center"}); }
function refreshAct(){ const act=$("#act"); if (S.screen!=="q"){ act.classList.add("hidden"); return; } act.classList.remove("hidden");
  const it=curItem(); const locked = S.submitted || (S.mode==="tutor" && S.checked[it.id]);
  $("#bBack").disabled = S.cur===0;
  const fb=$("#bFlag"); fb.textContent = S.flags[it.id]?"Flagged":"Flag"; fb.classList.toggle("flagged",!!S.flags[it.id]); fb.setAttribute("aria-pressed",String(!!S.flags[it.id])); fb.classList.toggle("hidden", S.submitted);
  const nx=$("#bNext"); const last = S.cur===list().length-1;
  if (S.submitted){ nx.textContent = last?"Back to results":"Next"; nx.disabled=false; }
  else if (S.mode==="tutor" && !S.checked[it.id]){ nx.textContent="Check answer"; nx.disabled=!answered(it,S.resp[it.id]); }
  else nx.textContent = last ? "Review and submit" : "Next", nx.disabled=false; }
function meta(){ const m=$("#meta"); if (S.screen==="start"){ m.textContent=""; return; }
  if (S.screen==="q") m.textContent=`Item ${S.cur+1} of ${list().length}`; else if (S.screen==="sum") m.textContent="Review"; else m.textContent="Results"; }

function rerender(){ const app=$("#app"); app.innerHTML=""; meta(); refreshStrip(); refreshAct();
  if (S.screen==="start") app.append(startScreen());
  else if (S.screen==="q"){ const it=curItem(); const locked = S.submitted || (S.mode==="tutor" && !!S.checked[it.id]); app.append(renderItem(it, locked)); }
  else if (S.screen==="sum") app.append(summaryScreen());
  else app.append(resultsScreen());
}
function startScreen(){ const counts={}; DATA.items.forEach(i=> counts[i.topic]=(counts[i.topic]||0)+1);
  const inprog = S.order.length && !S.submitted && Object.keys(S.resp).length;
  const root=h("section",{class:"hero"});
  root.append(h("h2",{},"Review exam: fluid and electrolytes, acid-base, burns, endocrine, oncology"));
  root.append(h("p",{},"50 items built from Iggy 11th edition, mixing traditional and Next Generation formats: select all that apply, matrix, drop-down cloze, bow-tie, highlight, and ordered response. Scoring follows NGN rules — plus-minus for select-all and highlight, 0/1 per row or blank, all-or-nothing for ordering."));
  root.append(h("div",{class:"mix"}, ...Object.entries(counts).map(([t,n])=> h("span",{class:"chip",style:`--c:var(${TOPICS[t]})`}, h("i"), `${t} ${n}`))));
  const modes=h("div",{class:"choice",role:"radiogroup","aria-label":"Mode"});
  [["exam","Exam mode","No feedback until you submit. Timed. Closest to test day."],["tutor","Tutor mode","Check each answer and read the rationale before moving on."]].forEach(([v,t,d])=>{
    modes.append(h("label",{}, h("input",{type:"radio",name:"mode",value:v,checked:S.mode===v,onchange:()=>{S.mode=v;}}), h("span",{}, h("b",{},t), h("small",{},d)))); });
  root.append(modes);
  const sel=h("select",{"aria-label":"Topic",style:"padding:10px;border-radius:8px;border:1.5px solid var(--rule);background:var(--card);width:100%;margin-bottom:18px",onchange:e=>{S.topic=e.target.value;}});
  sel.append(h("option",{value:"all",selected:S.topic==="all"},"All topics, mixed (50 items)"));
  Object.keys(counts).forEach(t=> sel.append(h("option",{value:t,selected:S.topic===t}, `${t} only (${counts[t]} items)`)));
  root.append(sel);
  root.append(h("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},
    h("button",{class:"btn primary",style:"flex:0 1 auto;padding:12px 22px",onclick:begin},"Start"),
    inprog ? h("button",{class:"btn",onclick:()=>{S.screen="q";save();rerender();}},"Resume where I left off") : null));
  return root; }
function begin(ids){ const keepMode=S.mode, keepTopic=S.topic; S=fresh(); S.mode=keepMode; S.topic=keepTopic;
  S.order = Array.isArray(ids) ? ids : DATA.order.filter(id => keepTopic==="all" || ITEMS[id].topic===keepTopic);
  S.screen="q"; S.start=Date.now(); save(); rerender(); window.scrollTo(0,0); }
function summaryScreen(){ const ids=list(); const un=ids.filter(id=>!answered(ITEMS[id],S.resp[id])).length, fl=ids.filter(id=>S.flags[id]).length;
  const c=h("div",{class:"card"});
  c.append(h("p",{class:"stem"}, `${ids.length-un} of ${ids.length} items answered.`));
  c.append(h("p",{class:"instr"}, `${un} unanswered · ${fl} flagged. Tap a tick in the strip above to revisit any item.`));
  c.append(h("div",{style:"display:flex;gap:10px;flex-wrap:wrap"},
    h("button",{class:"btn",onclick:()=>{S.screen="q";save();rerender();}},"Keep working"),
    h("button",{class:"btn primary",style:"flex:0 1 auto;padding:12px 22px",onclick:submit},"Submit exam")));
  return c; }
function submit(){ S.submitted=true; S.elapsed = S.start? Date.now()-S.start : 0; S.screen="res"; save(); rerender(); window.scrollTo(0,0); }
function itemScore(id){ const it=ITEMS[id]; return [score(it, it.type==="order"?(S.resp[id]?S.resp[id].seq:null):S.resp[id]), maxPts(it)]; }
function resultsScreen(){ const ids=list(); let e=0,m=0; const by={};
  ids.forEach(id=>{ const [s,mx]=itemScore(id); e+=s; m+=mx; const t=ITEMS[id].topic; by[t]=by[t]||[0,0]; by[t][0]+=s; by[t][1]+=mx; });
  const full=ids.filter(id=>{const [s,mx]=itemScore(id); return s===mx;}).length;
  const root=h("section");
  root.append(h("p",{class:"instr",style:"margin:0"},"Points earned"));
  root.append(h("div",{class:"score"}, `${Math.round(100*e/m)}%`));
  const mins=Math.round((S.elapsed||0)/60000);
  root.append(h("p",{class:"instr"}, `${e} of ${m} points · ${full} of ${ids.length} items fully correct${S.mode==="exam"&&mins?` · ${mins} min`:""}`));
  const bars=h("div",{class:"bars"});
  Object.entries(by).forEach(([t,[s,mx]])=> bars.append(h("div",{class:"b",style:`--c:var(${TOPICS[t]})`}, h("span",{},t), h("div",{class:"track"},h("div",{class:"fill",style:`width:${Math.round(100*s/mx)}%`})), h("span",{class:"pct"},`${Math.round(100*s/mx)}%`))));
  root.append(bars);
  const missed=ids.filter(id=>{const [s,mx]=itemScore(id); return s<mx;});
  root.append(h("div",{style:"display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px"},
    missed.length? h("button",{class:"btn primary",style:"flex:0 1 auto",onclick:()=>{ S.topic="all"; begin(missed); }},`Retake the ${missed.length} missed`) : null,
    h("button",{class:"btn",onclick:()=>{ S.screen="start"; S.order=[]; S.resp={}; S.submitted=false; save(); rerender(); }},"New attempt")));
  const tg=h("label",{class:"toggle"}, h("input",{type:"checkbox",checked:S.missedOnly,onchange:e=>{S.missedOnly=e.target.checked;save();rerender();}}), "Show missed and partial only");
  root.append(tg);
  const ul=h("ul",{class:"rlist"});
  ids.forEach((id,i)=>{ const [s,mx]=itemScore(id); if (S.missedOnly && s===mx) return; const it=ITEMS[id];
    const col = s===mx?"var(--ok)":s===0?"var(--bad)":"var(--flag)";
    ul.append(h("li",{}, h("button",{onclick:()=>{S.cur=i;S.screen="q";save();rerender();window.scrollTo(0,0);}},
      h("span",{class:"dot",style:`background:${col}`}), h("span",{class:"q"},`${i+1}. ${it.stem}`), h("span",{class:"s"},`${s}/${mx}`)))); });
  root.append(ul); return root; }

/* ---------- actions ---------- */
$("#bBack").addEventListener("click",()=>{ if (S.cur>0){ S.cur--; save(); rerender(); window.scrollTo(0,0);} });
$("#bFlag").addEventListener("click",()=>{ const id=curItem().id; S.flags[id]=!S.flags[id]; save(); refreshStrip(); refreshAct(); });
$("#bNext").addEventListener("click",()=>{ const it=curItem(); const last=S.cur===list().length-1;
  if (S.submitted){ if (last){ S.screen="res"; } else S.cur++; }
  else if (S.mode==="tutor" && !S.checked[it.id]){ S.checked[it.id]=true; save(); rerender(); return; }
  else if (last){ S.screen="sum"; } else S.cur++;
  save(); rerender(); window.scrollTo(0,0); });
document.addEventListener("keydown",e=>{ if (S.screen!=="q"||e.target.tagName==="SELECT") return;
  if (e.key==="ArrowRight") $("#bNext").click(); if (e.key==="ArrowLeft") $("#bBack").click(); });
rerender();
</script>
</body>
