<style>

.sheet{background:var(--surface);width:100%;max-width:760px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

<script>
// Chapter 38 exam bank. Every answer option verified against Iggy 11e Ch. 38.
// types: mcq, sata, matrix, highlight, cloze, dnd, order
const CASE38 = {
  title: '71-year-old client, emergency department → stroke unit',
  tabs: [
    { name: 'History & Physical', entries: [
      { s: 1, t: '71-year-old male. Right-handed. Retired bus driver; lives with wife.' },
      { s: 1, t: 'History: atrial fibrillation (diagnosed 1 year ago; declined anticoagulation), hypertension, type 2 diabetes mellitus.' },
      { s: 1, t: 'Home medications: metoprolol, lisinopril, metformin.' },
      { s: 1, t: 'Weight 80 kg (measured on emergency department bed scale).' }
    ] },
    { name: 'Nurses’ Notes', entries: [
      { s: 1, t: '0815 — Brought by wife. Last known well at 0700. Right facial droop. Right arm drifts to bed within 10 seconds. Follows two-step commands. Attempts to answer questions but produces only a few words and appears frustrated. Pupils equal and reactive. Pulse irregularly irregular at 104. BP 196/104. SpO2 96% on room air. Temperature 98.6°F (37°C). Fingerstick glucose 142 mg/dL. Stroke scale (NIHSS) score 9. Wife at bedside, tearful.' },
      { s: 2, t: '0850 — CT of head without contrast: no hemorrhage. Labetalol 10 mg IV given 0840 per protocol. BP now 178/100. Wife signed consent for alteplase. Bedside swallow screen not yet done.' },
      { s: 3, t: '0935 — Alteplase bolus given 0855; infusion started 0856 by pump. Client grimaces, points to head, and says "head… bad." Vomited once. BP 194/112, HR 110 irregular. Right arm now has no movement.' },
      { s: 4, t: '0950 — Stat CT: small area of hemorrhage, left parietal region. Alteplase not resumed. Neurosurgery consulted. Transferred to neuro critical care.' },
      { s: 4, t: 'Day 2, 0900 — Assessment findings recorded for evaluation (see question).' }
    ] },
    { name: 'Vital Signs', table: true, cols: ['Time', 'BP', 'HR', 'RR', 'SpO2', 'Temp'], entries: [
      { s: 1, r: ['0815', '196/104', '104 irreg', '18', '96%', '98.6°F'] },
      { s: 2, r: ['0850', '178/100', '98 irreg', '18', '97%', '98.6°F'] },
      { s: 3, r: ['0935', '194/112', '110 irreg', '22', '95%', '98.8°F'] },
      { s: 4, r: ['Day 2 0900', '162/88', '84 irreg', '18', '97%', '99.0°F'] }
    ] },
    { name: 'Labs & Imaging', entries: [
      { s: 1, t: 'Glucose 142 mg/dL • Hgb 15.2 g/dL • Platelets 240,000/mm³' },
      { s: 1, t: 'PT 12 sec • INR 1.0 • aPTT 30 sec' },
      { s: 2, t: 'CT head without contrast (0845): no intracranial hemorrhage.' },
      { s: 4, t: 'Stat CT head (0945): small left parietal hemorrhage.' }
    ] },
    { name: 'Orders', entries: [
      { s: 1, t: 'NPO. Continuous cardiac monitoring. Neuro checks per stroke protocol.' },
      { s: 1, t: 'Alteplase 0.9 mg/kg IV per stroke protocol after CT confirms no hemorrhage.' },
      { s: 1, t: 'Labetalol 10 mg IV PRN for SBP ≥ 185 or DBP ≥ 110.' },
      { s: 1, t: 'Aspirin 325 mg PO daily, start today.' }
    ] }
  ]
};

const Q38 = [
/* ---------- CASE STUDY (NCJMM 1–6) ---------- */
{ id: 1, type: 'highlight', case: true, stage: 1, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'Read the 0815 nurses’ note. Click to highlight the findings that require immediate follow-up.',
  passage: ['0815 — Brought by wife. ', { h: 'Last known well at 0700', k: 1 }, '. ', { h: 'Right facial droop', k: 1 }, '. ',
    { h: 'Right arm drifts to bed within 10 seconds', k: 1 }, '. ', { h: 'Follows two-step commands' }, '. ',
    { h: 'Attempts to answer questions but produces only a few words and appears frustrated', k: 1 }, '. ',
    { h: 'Pupils equal and reactive' }, '. ', { h: 'Pulse irregularly irregular at 104', k: 1 }, '. ', { h: 'BP 196/104', k: 1 }, '. ',
    { h: 'SpO2 96% on room air' }, '. ', { h: 'Temperature 98.6°F (37°C)' }, '. ', { h: 'Fingerstick glucose 142 mg/dL' }, '. ',
    { h: 'Stroke scale (NIHSS) score 9', k: 1 }, '. ', { h: 'Wife at bedside, tearful' }, '.'],
  rat: 'Time last known well decides fibrinolytic eligibility (3 hours FDA; up to 4.5 hours with exclusions). Facial droop, arm drift, and halting speech with intact comprehension are acute focal deficits. Irregularly irregular pulse = atrial fibrillation, the usual embolic source. BP 196/104 is above the 185/110 ceiling for alteplase. The stroke scale score is one assessment used to decide eligibility. Glucose 142 and SpO2 96% matter because they rule OUT the two mimics (hypoglycemia, hypoxia) — they do not need follow-up. Following commands is intact comprehension. A tearful spouse needs support but is not an immediate clinical cue.' },

{ id: 2, type: 'cloze', case: true, stage: 1, cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'Complete the statement using the chart.',
  parts: ['The client’s findings are most consistent with ', { o: ['acute ischemic stroke', 'hypoglycemia', 'subarachnoid hemorrhage', 'epidural hematoma'], a: 0 },
    ' as evidenced by ', { o: ['right-sided weakness with difficulty producing words', 'a temperature of 98.6°F', 'a glucose of 142 mg/dL', 'pupils that are equal and reactive'], a: 0 },
    '. The most likely source of the occlusion is ', { o: ['atrial fibrillation', 'a ruptured aneurysm', 'head trauma', 'uncontrolled diabetes mellitus'], a: 0 }, '.'],
  rat: 'Sudden focal deficits with preserved consciousness fit an ischemic (embolic) stroke; hemorrhagic strokes typically cause deepening lethargy and a "worst headache of my life" (subarachnoid hemorrhage). Glucose 142 rules out hypoglycemia as a mimic. No trauma history makes epidural hematoma unlikely. Iggy names the heart — especially atrial fibrillation — as the usual source of emboli. Contralateral findings (right body) and expressive aphasia point to the dominant left hemisphere, middle cerebral artery territory.' },

{ id: 3, type: 'cloze', case: true, stage: 1, cj: 'Prioritize Hypotheses', topic: 'Stroke',
  stem: 'Complete the statement.',
  parts: ['Before alteplase can be started, the nurse’s priority is to address the client’s ', { o: ['blood pressure', 'heart rate', 'blood glucose', 'stroke scale score'], a: 0 },
    ', because it must be below ', { o: ['185/110 mm Hg', '220/120 mm Hg', '140/90 mm Hg', '160/100 mm Hg'], a: 0 }, ' before the drug is given.'],
  rat: 'Iggy: the patient receives a rapid-acting antihypertensive until BP is below 185/110 mm Hg, and that level is maintained during fibrinolytic therapy. The heart rate reflects known atrial fibrillation; glucose 142 is acceptable; a score of 9 does not exclude treatment (exclusion in the extended window is a score > 25). 220 systolic is the permissive ceiling only for clients NOT receiving alteplase or embolectomy.' },

{ id: 4, type: 'matrix', case: true, stage: 2, cj: 'Generate Solutions', topic: 'Stroke drugs',
  stem: 'CT shows no hemorrhage and BP is 178/100. For each potential action, indicate whether it is indicated or contraindicated for this client at this time.',
  cols: ['Indicated', 'Contraindicated'],
  rows: [

    ['Give 10% of the alteplase dose as an IV bolus over 1 minute', 0],
    ['Manually push the remaining dose if the pump alarms', 1],
    ['Give the scheduled aspirin 325 mg with the alteplase', 1],
    ['Perform neuro checks every 10 to 15 minutes during the infusion', 0],

  ],

{ id: 5, type: 'mcq', case: true, stage: 3, cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'Review the 0935 note. Which action will the nurse take first?',
  o: ['Stop the alteplase infusion', 'Give labetalol 10 mg IV per the PRN order', 'Perform a full stroke scale reassessment', 'Turn the client to the side to prevent aspiration'], a: 0,
  rat: 'Severe headache (by gesture), vomiting, severe hypertension, and new loss of arm movement during alteplase signal intracerebral hemorrhage. Box 38.4: discontinue the infusion if the patient has severe headache, severe hypertension, bleeding, nausea, or vomiting, and notify the provider immediately. Every other action is reasonable afterward, but continuing to run a "clot buster" into a bleeding brain is the active harm — remove it first.' },

{ id: 6, type: 'matrix', case: true, stage: 4, cj: 'Evaluate Outcomes', topic: 'Stroke',
  stem: 'Day 2. The client remains in neuro critical care after a small hemorrhagic conversion. For each finding, indicate whether it shows improvement or decline.',

    ['Left pupil now larger than the right and sluggish to light', 1],

    ['Follows commands and speaks in short phrases', 0]
  ],

{ id: 7, type: 'matrix', cj: 'Analyze Cues (Trend)', topic: 'Traumatic brain injury',

    ['GCS', '15', '14', '13'], ['BP', '132/80', '148/78', '168/72'], ['HR', '84', '70', '58'],
    ['Pupils', 'Equal, brisk', 'Equal, brisk', 'Right 5 mm, sluggish'], ['Temp', '98.6°F', '98.8°F', '99.0°F'],
    ['SpO2', '97%', '97%', '96%'], ['Wrist pain', '4/10', '3/10', '3/10']] },
  cols: ['Indicates worsening', 'Not clinically significant'],
  rows: [['GCS trend', 0], ['Pulse pressure trend', 0], ['Heart rate trend', 0], ['Pupil trend', 0], ['Temperature trend', 1], ['SpO2 trend', 1], ['Wrist pain trend', 1]],

{ id: 8, type: 'cloze', cj: 'Analyze Cues', topic: 'Traumatic brain injury',
  stem: 'A 22-year-old was struck on the side of the head by a baseball, was unconscious for about 1 minute, and is now awake and talking in the emergency department. CT shows a temporal bone fracture.',
  parts: ['The nurse recognizes the client is at risk for ', { o: ['an epidural hematoma', 'a chronic subdural hematoma', 'postconcussion syndrome', 'a subarachnoid hemorrhage'], a: 0 },

  rat: 'Epidural hematoma = arterial bleeding between dura and skull, often from a temporal bone fracture tearing the middle meningeal artery. A brief loss of consciousness followed by a "lucid interval" is the classic picture; deterioration can be rapid, so Iggy says monitor every 5 to 10 minutes. Bridging veins tear in subdural hematomas, which bleed more slowly.' },

{ id: 9, type: 'highlight', cj: 'Recognize Cues', topic: 'Brain tumor / craniotomy',
  stem: 'A client returned 2 hours ago from an infratentorial (posterior fossa) tumor resection. Click the findings or actions in the note that require follow-up.',
  passage: ['1400 — ', { h: 'Head of bed at 30 degrees, supine', k: 1 }, '. ', { h: 'Bilateral periorbital edema' }, '. ',
    { h: 'Dressing has a 2-cm drainage spot, marked' }, '. ', { h: 'Drain output 20 mL since surgery' }, '. ',
    { h: 'Drowsy; given ice chips for dry mouth', k: 1 }, '. ', { h: 'Vomited once at 1345', k: 1 }, '. ',
    { h: 'Reports extreme thirst', k: 1 }, '. ', { h: 'Urine 450 mL in the last hour, very pale', k: 1 }, '. ',
    { h: 'Pupils equal and reactive' }, '. ', { h: 'Headache 3/10' }, '.'],
  rat: 'Infratentorial surgery: keep the client flat or at 10 degrees and side-lying (alternate every 2 hours for 24–48 hours) — 30 degrees supine is the supratentorial position. Keep NPO until awake and alert because edema near the medulla and lower cranial nerves causes vomiting and aspiration — ice chips for a drowsy client and the episode of vomiting both need follow-up. Extreme thirst with large volumes of very dilute urine suggests central diabetes insipidus. Periorbital edema, a small marked spot, and 20 mL of drainage (typical is 30–50 mL per 8 hours) are expected.' },

{ id: 10, type: 'dnd', cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'Drag the finding that best matches each artery affected by stroke. Not all findings will be used.',
  slots: ['Middle cerebral artery', 'Anterior cerebral artery', 'Vertebrobasilar artery', 'Internal carotid artery'],
  pool: ['Homonymous hemianopsia with unilateral neglect', 'Leg weaker than arm with bladder incontinence', 'Vertigo with flaccid paresis of all four extremities', 'Carotid bruit with contralateral hemiparesis', 'Perseveration with loss of deep sensation', 'Cheyne-Stokes respirations with pinpoint reactive pupils'],
  a: [0, 1, 2, 3],
  rat: 'Box 38.3: middle cerebral (most common) — homonymous hemianopsia, unilateral neglect, aphasia, contralateral arm-dominant weakness. Anterior cerebral — leg more than arm, bladder incontinence, personality change. Vertebrobasilar — headache, vertigo, flaccid quadriparesis, ataxia. Internal carotid — contralateral hemiparesis, carotid bruit. Perseveration and loss of deep sensation belong to the posterior cerebral artery. Cheyne-Stokes with pinpoint pupils is central herniation, not an arterial territory.' },

{ id: 11, type: 'order', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'Place the steps for IV alteplase in an eligible client in the correct order. All steps are used.',
  items: ['Confirm CT shows no intracranial hemorrhage', 'Confirm BP is below 185/110 mm Hg', 'Double-check the 0.9 mg/kg actual-weight dose with a second nurse', 'Give 10% of the dose as an IV bolus over 1 minute', 'Infuse the remaining dose over 60 minutes by pump', 'Obtain a follow-up CT before the first antiplatelet dose'],
  meta: { 'Client Needs': 'Physiological Integrity — Pharmacological and Parenteral Therapies', 'Clinical Judgment': 'Take Action', 'Cognitive Ability': 'Applying', 'Content Area': 'Neurologic — Stroke', 'Integrated Process': 'Nursing Process — Implementation', 'Priority Concept': 'Perfusion', 'Strategy': 'Sequence: confirm safety → verify drug → administer → follow up' },
  rat: 'Imaging must exclude hemorrhage first (alteplase into a bleed is lethal). BP must be below 185/110 before the drug. Box 38.4: double-check, then pump delivery — 10% bolus over 1 minute, remainder over 60 minutes. A follow-up CT or MRI is obtained after fibrinolytic therapy and before antiplatelet or anticoagulant drugs.' },

{ id: 12, type: 'matrix', cj: 'Generate Solutions', topic: 'Traumatic brain injury',

  ],
  rat: 'Box 38.8: acetaminophen every 4 hours as needed; no sedatives, sleeping pills, or alcohol for at least 24 hours; no strenuous activity for at least 48 hours. Return or call 911 for seizure, worsening headache, persistent vomiting, blurred vision, clear ear/nose drainage, increasing weakness, slurred speech, progressive sleepiness, or unequal pupils.' },

{ id: 13, type: 'cloze', cj: 'Take Action', topic: 'Increased ICP drugs',
  stem: 'A client with a severe traumatic brain injury is prescribed mannitol IV push.',

    ', and recognizes the goal serum osmolarity is ', { o: ['310 to 320 mOsm/L', '275 to 295 mOsm/L', '340 to 360 mOsm/L', '250 to 270 mOsm/L'], a: 0 }, '.'],

{ id: 14, type: 'matrix', cj: 'Generate Solutions', topic: 'Brain tumor / craniotomy',
  stem: 'Indicate whether each postoperative action or finding applies to supratentorial or infratentorial surgery.',
  cols: ['Supratentorial', 'Infratentorial'],
  rows: [
    ['Head of bed at 30 degrees or as tolerated', 0],
    ['Keep flat or at 10 degrees per prescription', 1],
    ['Side-lying, alternating every 2 hours for 24 to 48 hours', 1],
    ['NPO until awake and alert because of vomiting and aspiration risk', 1],
    ['Bone pieces often not replaced to allow room for edema', 1],
    ['Major complications are increased ICP from edema or hydrocephalus and hemorrhage', 0],
    ['Tumor presentation with ataxia, drooling, and hearing loss', 1]
  ],
  rat: 'Supratentorial (cerebral): HOB 30 degrees, head midline, avoid extreme hip/neck flexion; major complications are increased ICP (edema, hydrocephalus) and hemorrhage. Infratentorial (brainstem/cerebellum): usually a craniectomy with bone not replaced; flat or 10 degrees; side-lying alternating every 2 hours for 24–48 hours; NPO until awake and alert. Infratentorial tumors produce ataxia, autonomic dysfunction, vomiting, drooling, hearing and vision loss.' },

/* ---------- TRADITIONAL ---------- */
{ id: 15, type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Priority',
  stem: 'The nurse receives report on four clients on the neuroscience unit. Which client will the nurse see first?',
  o: ['Client with a traumatic brain injury whose GCS fell from 14 to 12 in the last hour', 'Client on day 3 after subarachnoid hemorrhage receiving nimodipine who reports headache 6/10 and light sensitivity', 'Client 1 day after supratentorial craniotomy with bilateral periorbital edema and bruising', 'Client after a right-hemisphere stroke who laughs and then cries without apparent reason'], a: 0,
  rat: 'A drop of 2 or more GCS points is clinically important and must be reported — decreasing consciousness is the earliest sign of increased ICP. Headache and photophobia are expected after subarachnoid hemorrhage; periorbital edema is expected after craniotomy; emotional lability is an expected effect of right or frontal brain injury.' },

{ id: 16, type: 'mcq', cj: 'Analyze Cues', topic: 'Traumatic brain injury',
  stem: 'An 81-year-old client taking warfarin fell 3 weeks ago. Her daughter reports worsening headaches and new confusion over the past week. Which condition does the nurse suspect?',
  o: ['Chronic subdural hematoma', 'Epidural hematoma', 'Postconcussion syndrome', 'Second-impact syndrome'], a: 0,
  rat: 'Chronic subdural hematoma presents 2 weeks to several months after injury; it nearly doubles in incidence after 65 and is commonly caused by falls plus anticoagulant or antiplatelet therapy. Signs: worsening headache, paresis, acute confusion, seizures. Epidural hematoma deteriorates within minutes to hours. Postconcussion syndrome (headache, dizziness, impaired cognition ≥ 4 weeks) does not explain progressive confusion in an anticoagulated older adult. Second-impact syndrome requires a second hit before recovery.' },

{ id: 17, type: 'mcq', cj: 'Take Action', topic: 'Delegation',
  stem: 'A client has right-sided hemiplegia with a flaccid right arm after a stroke. Which instruction will the nurse give the assistive personnel?',
  o: ['“Support his right arm on a pillow whenever he sits in the chair.”', '“Help him up in bed by lifting under his right arm.”', '“Give him small sips of water to see how well he swallows.”', '“Approach him from his right side so he notices that arm.”'], a: 0,
  rat: 'Support the flaccid arm and position it on a pillow when sitting to prevent shoulder subluxation; teach assistive personnel to avoid pulling on it. Swallow screening is a nursing assessment — the client stays NPO until it is done. Always approach from the unaffected side.' },

{ id: 18, type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'A client after a stroke nods appropriately to questions and follows commands but struggles to form words and becomes angry when he cannot answer. The nurse recognizes injury to which area?',
  o: ['Broca area of the frontal lobe', 'Wernicke area of the temporoparietal region', 'The cerebellum', 'The occipital visual cortex'], a: 0,
  rat: 'Expressive (Broca, motor) aphasia: the patient understands but cannot speak, is aware of the deficit, and may become frustrated. Receptive (Wernicke) aphasia: cannot understand spoken or written words; speech may be fluent but meaningless.' },

{ id: 19, type: 'mcq', cj: 'Evaluate Outcomes', topic: 'Stroke',
  stem: 'A client has homonymous hemianopsia after a stroke. Which statement indicates a need for further teaching?',
  o: ['“Wearing a patch over one eye will bring back the missing half of my vision.”', '“I will turn my head from side to side when I eat.”', '“I will keep my phone and glasses where I can see them.”', '“I will scan the hallway with my head when I walk.”'], a: 0,
  rat: 'Homonymous hemianopsia = blindness in the same half of both eyes; teach scanning (turning the head side to side) when eating and walking, and place objects in the visual field. An eye patch is used for diplopia (double vision), changed every 2–4 hours — it does not restore a lost field.' },

{ id: 20, type: 'sata', cj: 'Generate Solutions', topic: 'Increased ICP',
  stem: 'Which actions will the nurse include to prevent increased intracranial pressure in a client after an acute stroke? Select all that apply.',
  o: ['Keep the head in a midline, neutral position', 'Elevate the head of the bed per protocol', 'Give the bath and change the linens back to back so the client can rest longer afterward', 'Hyperoxygenate before and after suctioning', 'Keep room lights low', 'Flex the hips sharply when boosting the client up in bed', 'Maintain a quiet environment'], a: [0, 1, 3, 4, 6],
  rat: 'Midline neutral head promotes venous drainage; HOB elevation improves perfusion pressure; hyperoxygenation prevents transient hypoxemia that dilates cerebral arteries; low lights accommodate photophobia; a quiet environment helps the headache common with hemorrhage or increased ICP. Clustering procedures (bath then linens) can dramatically raise ICP. Extreme hip flexion raises intrathoracic pressure and decreases cerebral venous outflow.' },

{ id: 21, type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke drugs',
  stem: 'A client arrives 4 hours after onset of an acute ischemic stroke. Which finding makes the client ineligible for IV alteplase in the extended (3- to 4.5-hour) window?',
  o: ['History of both a prior stroke and diabetes mellitus', 'Age of 78 years', 'Stroke scale (NIHSS) score of 18', 'BP of 178/96 mm Hg'], a: 0,
  rat: 'The American Stroke Association extends the window to 4.5 hours unless the client is older than 80, takes an anticoagulant regardless of INR, has imaging showing injury to more than one-third of the middle cerebral artery territory, has a score greater than 25, has a history of BOTH stroke and diabetes, or has active bleeding. BP 178/96 is already below 185/110.' },

{ id: 22, type: 'mcq', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'A client who weighs 176 lb (80 kg) is prescribed alteplase 0.9 mg/kg. How much will the nurse give as the initial IV bolus?',
  o: ['7.2 mg', '72 mg', '15.8 mg', '6.5 mg'], a: 0,
  rat: '80 kg × 0.9 mg/kg = 72 mg total. 10% is given as a bolus over 1 minute = 7.2 mg; the remaining 64.8 mg runs over 60 minutes. Using pounds (176 × 0.9 × 0.1 = 15.8 mg) is the classic weight-unit error.' },

{ id: 23, type: 'mcq', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'Eight hours after an alteplase infusion was completed, a client has an order for aspirin 81 mg PO now. The client passed a swallow screen. What will the nurse do?',
  o: ['Hold the aspirin and contact the provider', 'Give the aspirin with a full glass of water', 'Give the aspirin crushed in applesauce', 'Give the aspirin and increase neuro checks to hourly'], a: 0,
  rat: 'Aspirin should not be given within 24 hours of fibrinolytic administration, and a follow-up CT or MRI must be obtained before starting antiplatelet or anticoagulant drugs. Passing the swallow screen does not make the order safe — the red herring is the swallow screen.' },

{ id: 24, type: 'sata', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'A client is receiving IV alteplase. Which findings require the nurse to discontinue the infusion and notify the provider? Select all that apply.',
  o: ['New severe headache', 'Vomiting', 'BP 224/118 mm Hg', 'Heart rate 96 beats/min', 'SpO2 95% on room air', 'Blood oozing from the gums', 'Nausea'], a: [0, 1, 2, 5, 6],
  rat: 'Box 38.4: discontinue the infusion if the patient reports severe headache or has severe hypertension, bleeding, nausea, or vomiting, and notify the provider immediately. HR 96 and SpO2 95% do not meet stopping criteria.' },

{ id: 25, type: 'mcq', cj: 'Take Action', topic: 'Stroke',
  stem: 'A client with an acute ischemic stroke arrived 9 hours after onset and did not receive alteplase or embolectomy. BP is 204/108 mm Hg. The client is alert with stable deficits. What is the nurse’s best action?',
  o: ['Continue monitoring; this pressure is acceptable at this time', 'Give PRN IV labetalol to lower the BP to 140/90', 'Activate the Rapid Response Team', 'Lower the head of the bed to flat'], a: 0,
  rat: 'For ischemic strokes without alteplase or embolectomy, BP is initially allowed to rise above 220 mm Hg systolic to keep perfusion past the occlusion. A sudden systolic drop below 120 may cause brain ischemia. The 180 systolic notification threshold applies AFTER alteplase or embolectomy.' },

{ id: 26, type: 'mcq', cj: 'Generate Solutions', topic: 'Stroke drugs',
  stem: 'The spouse of a client with a subarachnoid hemorrhage from a ruptured aneurysm asks why nimodipine was prescribed. What is the nurse’s best response?',
  o: ['“It helps prevent spasm of the brain’s arteries, which usually happens 4 to 14 days after the bleed.”', '“It dissolves the clot that formed around the aneurysm.”', '“It pulls fluid out of the swollen brain tissue.”', '“It prevents seizures caused by blood on the brain.”'], a: 0,
  rat: 'Nimodipine, a calcium channel blocker that crosses the blood–brain barrier, treats or prevents cerebral vasospasm after subarachnoid hemorrhage (usually days 4–14) by relaxing vessel smooth muscle and dilating collateral vessels. Clot dissolving = fibrinolytic; pulling fluid = mannitol/hypertonic saline; seizure prevention = antiepileptics.' },

{ id: 27, type: 'mcq', cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'A client reports a sudden “worst headache of my life” with neck stiffness and light sensitivity. Which additional finding will the nurse anticipate?',
  o: ['Deepening lethargy', 'Stepwise improvement between episodes', 'Clear cerebrospinal fluid', 'Preserved level of consciousness with gradual onset over hours'], a: 0,
  rat: 'This presentation fits a hemorrhagic stroke (subarachnoid). Table 38.1: hemorrhagic strokes produce deepening lethargy/stupor or coma, bloody cerebrospinal fluid, and usually seizures. Stepwise improvement and gradual onset with preserved consciousness describe thrombotic ischemic strokes.' },

{ id: 28, type: 'sata', cj: 'Take Action', topic: 'Traumatic brain injury',
  stem: 'A client with blunt head trauma awaits cervical spine clearance. Which spine precautions will the nurse implement? Select all that apply.',
  o: ['Bed rest', 'Log-roll to reposition', 'Place a small pillow under the neck for comfort', 'Manually control the cervical spine whenever the collar is off', 'Raise the head of the bed with the knees gatched to prevent sliding', 'Help the client sit upright in a chair for meals'], a: [0, 1, 3],
  rat: 'Spine precautions: bed rest; no neck flexion with a pillow or roll; no thoracic or lumbar flexion; manual control of the cervical spine anytime the rigid collar is removed; log-roll to reposition; frequent skin checks under the collar. Sitting in a chair flexes the thoracic and lumbar spine.' },

{ id: 29, type: 'mcq', cj: 'Recognize Cues', topic: 'Increased ICP',
  stem: 'Which set of vital signs in a client with a severe traumatic brain injury indicates a very late sign of increased intracranial pressure?',
  o: ['BP 188/70, HR 52', 'BP 88/56, HR 128', 'BP 152/98, HR 112', 'BP 132/84, HR 76'], a: 0,
  rat: 'Cushing triad = severe hypertension, widened pulse pressure (188 − 70 = 118), and bradycardia. It is a classic but very late sign that usually indicates imminent death. Hypotension with tachycardia suggests shock.' },

{ id: 30, type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Traumatic brain injury',
  stem: 'A client with a left temporal contusion becomes rapidly less responsive. The left pupil is 7 mm and nonreactive with a drooping left eyelid. Which complication is most likely?',
  o: ['Uncal herniation compressing the oculomotor nerve', 'Central herniation of the brainstem', 'Slowly progressive hydrocephalus', 'Postconcussion syndrome'], a: 0,
  rat: 'Uncal herniation shifts the temporal lobe (uncus) onto cranial nerve III: dilated nonreactive pupil, ptosis, rapidly deteriorating consciousness. Central herniation begins with Cheyne-Stokes respirations and pinpoint reactive pupils. Slowly progressive hydrocephalus causes headache, decreased consciousness, irritability, blurred vision, and urinary incontinence.' },

{ id: 31, type: 'mcq', cj: 'Recognize Cues', topic: 'Traumatic brain injury',
  stem: 'After a fall, a client has clear drainage from the right nostril. Which finding most strongly supports a cerebrospinal fluid leak?',
  o: ['A yellowish ring forms around a central blood spot on white gauze', 'Purplish discoloration around both eyes', 'The drainage is thick and yellow', 'Bright red drainage that clots on the gauze'], a: 0,
  rat: 'The halo sign — a clear or yellowish ring around a spot of blood on white absorbent material — distinguishes cerebrospinal fluid from other fluids (fluid can also be sent for glucose and electrolytes). Raccoon eyes suggest a basilar skull fracture but do not by themselves prove a leak.' },

{ id: 32, type: 'mcq', cj: 'Analyze Cues', topic: 'Increased ICP',
  stem: 'Within the first 24 hours after a severe traumatic brain injury, an intubated client’s PaCO2 falls to 28 mm Hg after aggressive manual ventilation during suctioning. What is the nurse’s primary concern?',
  o: ['Cerebral vasoconstriction causing ischemia', 'Cerebral vasodilation raising intracranial pressure', 'Absorptive atelectasis', 'Development of diabetes insipidus'], a: 0,
  rat: 'Hypocarbia from hyperventilation causes profound vasoconstriction and ischemia, so hyperventilation is usually avoided in the first 24 hours and overly aggressive hyperventilation is avoided during suctioning. High CO2 (hypercarbia) is what dilates vessels and raises ICP.' },

{ id: 33, type: 'mcq', cj: 'Take Action', topic: 'Traumatic brain injury',
  stem: 'The nurse raises the head of the bed of a client with a traumatic brain injury from 15 to 30 degrees. MAP falls from 92 to 62 mm Hg. What is the nurse’s best action?',
  o: ['Lower the head of the bed and notify the provider', 'Keep the head of the bed at 30 degrees because it lowers intracranial pressure', 'Raise the head of the bed to 45 degrees to improve venous drainage', 'Flex the client’s knees to reduce intra-abdominal pressure'], a: 0,
  rat: 'HOB elevation is generally 30–45 degrees, but if raising the head significantly lowers systemic BP, the client does not benefit and may be harmed. A MAP of 62 is below the 70 mm Hg threshold Iggy uses to define hypotension in traumatic brain injury.' },

{ id: 34, type: 'sata', cj: 'Take Action', topic: 'Increased ICP drugs',
  stem: 'Which nursing actions are appropriate for a client receiving mannitol? Select all that apply.',
  o: ['Administer through a filter', 'Measure urine output every hour', 'Monitor serum electrolytes and osmolarity every 6 hours', 'Give as a continuous infusion for best effect', 'Monitor for acute renal failure', 'Expect weight gain from fluid retention', 'Observe for signs of dehydration'], a: [0, 1, 2, 4, 6],
  rat: 'Mannitol is most effective in boluses, not continuous infusion. It pulls water out of brain tissue (osmotic diuresis), so watch for dehydration and acute renal failure, not fluid retention. Filter administration, hourly output, and electrolytes/osmolarity every 6 hours are all in Iggy.' },

{ id: 35, type: 'mcq', cj: 'Recognize Cues', topic: 'Increased ICP drugs',
  stem: 'A client with heart failure is receiving 3% hypertonic saline for increased intracranial pressure. Which finding requires immediate follow-up?',
  o: ['New crackles and SpO2 89%', 'Urine output 60 mL/hr', 'Intracranial pressure 14 mm Hg', 'Pupils equal and briskly reactive'], a: 0,
  rat: 'Hypertonic saline nursing implications: continual neuro assessments, serial sodium levels, fluid status, and monitoring for pulmonary edema, especially with a history of cardiac or renal disease. New crackles with falling SpO2 in a client with heart failure signal pulmonary edema. ICP of 14 is within the normal 10–15 range; output 60 mL/hr is adequate; equal brisk pupils are reassuring.' },

{ id: 36, type: 'mcq', cj: 'Generate Solutions', topic: 'Increased ICP drugs',
  stem: 'Why is fentanyl often preferred over morphine for a mechanically ventilated client with a traumatic brain injury?',
  o: ['It has fewer effects on blood pressure and heart rate', 'It provides deeper sedation than propofol', 'It lowers intracranial pressure by osmotic diuresis', 'It prevents posttraumatic seizures'], a: 0,
  rat: 'Iggy: fentanyl has fewer effects on blood pressure and heart rate than morphine and may be safer for managing pain in traumatic brain injury. Propofol and midazolam provide sedation; osmotic effects come from mannitol; seizure prevention comes from antiepileptic drugs.' },

{ id: 37, type: 'mcq', cj: 'Take Action', topic: 'Increased ICP drugs',
  stem: 'A ventilated client with a traumatic brain injury is receiving propofol. During turning, the client grimaces, HR rises from 84 to 112, and the client becomes restless. Which prescription does the nurse anticipate?',
  o: ['Fentanyl', 'An increased propofol dose', 'A mannitol bolus', 'Levetiracetam'], a: 0,
  rat: 'Propofol and midazolam sedate and lower ICP but are not as effective for pain. Restlessness caused by pain is treated with an opioid such as fentanyl. Most ventilated clients receive a combination.' },

{ id: 38, type: 'mcq', cj: 'Take Action', topic: 'Delegation',
  stem: 'Which task can the nurse delegate to assistive personnel for a client with a traumatic brain injury on spine precautions?',
  o: ['Help the nurse log-roll the client to change the linens', 'Check pupil size and reaction every hour', 'Calculate the hourly Glasgow Coma Scale score', 'Determine whether nasal drainage is cerebrospinal fluid'], a: 0,
  rat: 'Assisting with a log-roll while the nurse controls the cervical spine is a task with a predictable outcome. Pupil checks, GCS scoring, and deciding whether drainage is cerebrospinal fluid require nursing assessment and judgment.' },

{ id: 39, type: 'mcq', cj: 'Analyze Cues', topic: 'Traumatic brain injury',
  stem: 'A team is preparing to determine brain death in a client with a severe traumatic brain injury. Which finding must be corrected before the determination can proceed?',
  o: ['Core temperature 95.9°F (35.5°C)', 'Systolic BP 108 mm Hg', 'Coma from a known cause confirmed by CT', 'One neurologic examination already completed'], a: 0,
  rat: 'Prerequisites: coma of known cause, normal or near-normal core temperature higher than 96.8°F (36°C), systolic BP ≥ 100 mm Hg, and at least one neurologic examination. 95.9°F does not meet the temperature prerequisite.' },

{ id: 40, type: 'mcq', cj: 'Take Action', topic: 'Psychosocial / ethics',
  stem: 'A client with a severe traumatic brain injury is deteriorating, and brain death has not yet been declared. What is the nurse’s most appropriate action regarding organ donation?',
  o: ['Contact the local organ-procurement organization', 'Ask the family to sign the donation consent form', 'Wait until brain death is declared before any donation discussion', 'Tell the family that their wishes override the client’s driver’s license designation'], a: 0,
  rat: 'Before brain death is declared, contact the local organ-procurement organization and determine whether the client consented (driver’s license, state card, advance directive). The organ donor agency representative and/or provider discusses procurement with the family; the client’s wishes are followed unless a medical condition prevents donation.' },

{ id: 41, type: 'sata', cj: 'Evaluate Outcomes', topic: 'Traumatic brain injury',
  stem: 'Which findings will the nurse teach the caregiver of a client with a mild traumatic brain injury to report by returning to the emergency department or calling 911? Select all that apply.',
  o: ['A seizure', 'Clear fluid draining from one ear', 'A mild headache relieved by acetaminophen', 'Unequal pupil size', 'Increasing sleepiness that is harder to interrupt', 'Feeling tired at bedtime after a long day'], a: [0, 1, 3, 4],
  rat: 'Box 38.8 return precautions: seizure, severe or worsening headache, persistent or severe nausea/vomiting, blurred vision, clear drainage from ear or nose, increasing weakness, slurred speech, progressive sleepiness, unequal pupils. A controlled mild headache and ordinary tiredness are not on the list.' },

{ id: 42, type: 'mcq', cj: 'Recognize Cues', topic: 'Brain tumor / craniotomy',
  stem: 'A client is being evaluated for a possible brain tumor. Which headache pattern is most consistent with this diagnosis?',
  o: ['Headache that is most severe on awakening in the morning', 'Sudden “worst headache of my life” with neck stiffness', 'Headache that begins in the evening after screen use', 'Headache that resolves completely within 72 hours of a blow to the head'], a: 0,
  rat: 'Iggy lists headaches that are usually more severe on awakening in the morning among common brain tumor symptoms. A sudden worst-ever headache with stiff neck suggests subarachnoid hemorrhage; resolution within 72 hours after a blow fits mild traumatic brain injury.' },

{ id: 43, type: 'mcq', cj: 'Take Action', topic: 'Brain tumor / craniotomy',
  stem: 'Eight hours after a craniotomy, the client’s Jackson-Pratt drain has collected 65 mL. The dressing is dry. What will the nurse do?',
  o: ['Report the drainage to the surgeon now', 'Document it as expected output', 'Reinforce the dressing and recheck in 4 hours', 'Empty the drain and increase suction'], a: 0,
  rat: 'Typical drainage is 30–50 mL every 8 hours. Report a saturated head dressing or drainage greater than 50 mL in 8 hours to the surgeon immediately. A dry dressing does not cancel abnormal drain output, and suction is maintained per the surgeon’s and manufacturer’s instructions — not adjusted on the nurse’s own initiative.' },

{ id: 44, type: 'mcq', cj: 'Analyze Cues', topic: 'Brain tumor / craniotomy',
  stem: 'After surgery for a tumor near the pituitary gland, a client reports extreme thirst. Urine output is 600 mL/hr and very pale, and serum sodium is 152 mEq/L. The nurse suspects which complication?',
  o: ['Arginine vasopressin deficiency (central diabetes insipidus)', 'Syndrome of inappropriate antidiuretic hormone', 'Fluid volume overload', 'Neurogenic pulmonary edema'], a: 0,
  rat: 'Large amounts of very dilute urine with increasing serum osmolarity and sodium, extreme thirst, and dry mouth indicate central diabetes insipidus. Untreated hypernatremia can cause seizures. SIADH produces hyponatremia from water retention.' },

{ id: 45, type: 'mcq', cj: 'Generate Solutions', topic: 'Brain tumor / craniotomy',
  stem: 'Two days after craniotomy for a pituitary-area tumor, a client is newly confused with serum sodium 126 mEq/L and low urine output. Which order does the nurse anticipate?',
  o: ['Restrict fluids to 1500 mL per day', 'Encourage oral fluids of 3 L per day', 'Increase the dexamethasone dose', 'Position flat for 24 hours'], a: 0,
  rat: 'Hyponatremia after craniotomy can result from SIADH, fluid overload, or steroid administration. Iggy: anticipate fluid restriction to 1500 mL daily if pituitary involvement leads to SIADH. Extra fluids worsen dilution; steroids can contribute to hyponatremia.' },

{ id: 46, type: 'mcq', cj: 'Evaluate Outcomes', topic: 'Brain tumor / craniotomy',
  stem: 'A client is scheduled for CyberKnife stereotactic radiosurgery for a brain tumor. Which statement shows understanding of the procedure?',
  o: ['“I can go back to my normal activities right after the treatment.”', '“A frame will be attached to my skull so I cannot move.”', '“I will need general anesthesia and an overnight stay.”', '“The beams come from cobalt-60 inside the machine.”'], a: 0,
  rat: 'CyberKnife uses a linear accelerator, is noninvasive, requires no frame or general anesthesia, accommodates movement, and patients resume normal activity immediately. The skull frame, possible general anesthesia with overnight stay, and cobalt-60 describe the Gamma Knife.' },

{ id: 47, type: 'mcq', cj: 'Generate Solutions', topic: 'Brain tumor drugs',
  stem: 'Tumor Treating Fields are approved for a client with recurrent glioblastoma multiforme in combination with which drug?',
  o: ['Temozolomide', 'Bevacizumab', 'Vincristine', 'Carmustine wafers'], a: 0,
  rat: 'In 2011 the FDA approved Tumor Treating Fields in combination with temozolomide for recurrent glioblastoma refractory to surgery and radiation. Bevacizumab is molecularly targeted; vincristine is given IV in combination regimens; carmustine wafers are placed in the surgical cavity.' },

{ id: 48, type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Transient ischemic attack',
  stem: 'Which client with a transient ischemic attack whose symptoms have resolved is most likely to be admitted to the hospital?',
  o: ['Client with new-onset atrial fibrillation', 'Client whose symptoms resolved in 40 minutes', 'Client with BP 132/84 mm Hg', 'Client with 40% carotid stenosis'], a: 0,
  rat: 'A client with new-onset atrial fibrillation with the transient ischemic attack, or carotid stenosis greater than 70%, will most likely be admitted. Symptoms typically resolve in 30–60 minutes; BP below 140/90 does not add ABCD2 risk; 40% stenosis is below the 70% threshold.' },

{ id: 49, type: 'sata', cj: 'Generate Solutions', topic: 'Psychosocial / ethics',
  stem: 'The nurse is planning stroke-prevention care for a Black client with uncontrolled hypertension who smokes. Which actions are appropriate? Select all that apply.',
  o: ['Determine whether the client’s needs for housing and food are being met', 'Ask about transportation and internet access before recommending resources', 'Provide information on low-cost or free smoking-cessation resources', 'Teach the ABCS: aspirin when appropriate, BP control, cholesterol management, smoking cessation', 'Explain that hemorrhagic strokes are less common in Black adults', 'Delay screening for depression until after discharge'], a: [0, 1, 2, 3],
  rat: 'Health equity box: first determine whether basic needs are met (if not, they are the priority), then teach risk factors, check transportation and internet access, and provide accessible cessation resources. Black adults have strokes twice as often as White adults, especially hemorrhagic strokes from hypertension. Depression screening is a best practice, not something to delay.' },

{ id: 50, type: 'mcq', cj: 'Take Action', topic: 'Psychosocial / ethics',
  stem: 'The spouse of a client recovering from a moderate traumatic brain injury reports frequent temper outbursts at home and says, “I can’t leave him alone for a minute.” What is the nurse’s best advice?',
  o: ['“Keep a structured, consistent daily routine, reinforce positive behaviors, and arrange regular respite care.”', '“Point out each outburst right away so he learns which behaviors to stop.”', '“Change his routine often so he stays mentally stimulated.”', '“Avoid support groups until his behavior is under control.”'], a: 0,
  rat: 'Patients with personality and behavior problems respond best to a structured, consistent, repetitive environment; reinforce positive rather than negative behaviors. Teach the importance of regular respite care and encourage brain-injury support groups (Brain Injury Association of America) for caregiver isolation and depression.' },
/* ---------- LECTURE-FOCUS ITEMS (added from the Chapter 38 lecture slides; every option verified in Iggy Ch. 38) ---------- */
{ id: 51, type: 'sata', lec: true, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'A right-handed client has a stroke in the left cerebral hemisphere. Which findings will the nurse anticipate? Select all that apply.',
  o: ['Aphasia', 'Agraphia', 'Difficulty with math calculations', 'Deficits in the right visual field', 'Impulsive behavior with poor judgment', 'Unaware of own deficits', 'Alexia (difficulty reading)'], a: [0, 1, 2, 3, 6],
  rat: 'The left hemisphere (dominant in right-handed people) controls speech, language, math, and analytic thinking: aphasia, alexia, agraphia, acalculia. Deficits are contralateral, so the right visual field is affected. Impulsivity, poor judgment, and being unaware of deficits are right hemisphere findings.' },

{ id: 52, type: 'sata', lec: true, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'A client has a stroke in the right cerebral hemisphere. Which findings will the nurse anticipate? Select all that apply.',
  o: ['Disorientation to time and place', 'Neglect of the left side of the body', 'Impulsiveness and poor judgment', 'Difficulty judging depth and distance', 'Expressive aphasia', 'Inability to perform math calculations', 'Slow, cautious, hesitant behavior'], a: [0, 1, 2, 3],
  rat: 'The right hemisphere manages visual and spatial awareness and proprioception. Right-sided strokes cause disorientation, unawareness of deficits, impulsivity and poor judgment, depth and distance problems, and unilateral neglect (most common after a right stroke) of the LEFT side. Aphasia, acalculia, and a slow, cautious, hesitant style (apraxia) are left hemisphere findings.' },

{ id: 53, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Stroke',
  stem: 'At an urgent care clinic, a client develops sudden right arm weakness and slurred speech that began 40 minutes ago. The clinic is not a stroke center. What is the nurse’s first priority?',
  o: ['Arrange immediate transport to a stroke center', 'Obtain a complete medication and social history', 'Give aspirin 325 mg by mouth', 'Have the client lie flat and rest until symptoms resolve'], a: 0,
  rat: 'Iggy: although an accurate history is important, the first priority is to ensure the client is transported to a stroke center, and obtaining a history should not delay arrival. Aspirin is not given before hemorrhage is ruled out by imaging, and the client stays NPO until a swallow screen. Waiting for symptoms to resolve wastes the treatment window.' },

{ id: 54, type: 'mcq', lec: true, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'While a client with suspected stroke is being transferred, the nurse has time for one question. Which question is most important to ask the spouse?',
  o: ['“What time did his symptoms begin?”', '“Has anyone in the family had a stroke?”', '“What kind of work does he do?”', '“When did he last eat?”'], a: 0,
  rat: 'The time of symptom onset is essential for treatment decisions — it determines alteplase eligibility (3 hours FDA; up to 4.5 hours with exclusions). Family, occupational, and diet history are part of a full history but do not change emergency treatment.' },

{ id: 55, type: 'mcq', lec: true, cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'Which history finding most suggests a hemorrhagic rather than an ischemic stroke?',
  o: ['Symptoms began abruptly while the client was lifting weights at the gym', 'The client woke up early in the morning with the symptoms', 'Symptoms came on gradually over several hours', 'Symptoms improved, then worsened again over the day'], a: 0,
  rat: 'Iggy: hemorrhagic strokes tend to occur during activity and begin abruptly. Ischemic strokes tend to occur early in the morning; thrombotic strokes progress more gradually; waxing and waning suggests an incomplete stroke dependent on perfusion.' },

{ id: 56, type: 'mcq', lec: true, cj: 'Analyze Cues', topic: 'Traumatic brain injury',
  stem: 'A client with a traumatic brain injury has pinpoint pupils that do not respond to light. The nurse recognizes dysfunction in which area?',
  o: ['The brainstem at the level of the pons', 'The occipital lobe', 'The frontal lobe', 'The Wernicke area'], a: 0,
  rat: 'Iggy: pinpoint and nonresponsive pupils indicate brainstem dysfunction at the level of the pons. Loss of vision usually comes from direct eye injury or occipital lobe injury. The frontal lobe and Wernicke area relate to behavior/motor speech and language comprehension.' },

{ id: 57, type: 'mcq', lec: true, cj: 'Analyze Cues', topic: 'Increased ICP',
  stem: 'A client with a head injury now has both pupils fixed and dilated. How does the nurse interpret this finding?',
  o: ['Brain herniation from increased intracranial pressure, a poor prognostic sign', 'An early sign of increased intracranial pressure', 'Brainstem dysfunction at the level of the pons', 'Vision loss from occipital lobe injury'], a: 0,
  rat: 'Asymmetric pupils, loss of light reaction, or dilated pupils are treated as herniation from increased ICP until proven otherwise; fixed, dilated ("blown") pupils are a poor prognostic sign. Pupil changes are late — decreased level of consciousness is the early sign. Pinpoint pupils point to the pons.' },

{ id: 58, type: 'mcq', lec: true, cj: 'Recognize Cues', topic: 'Increased ICP',
  stem: 'The nurse is caring for a client with a head injury. Which finding requires immediate intervention?',
  o: ['New restlessness and disorientation to place', 'Headache 3/10 relieved by acetaminophen', 'BP 138/84 mm Hg, up from 132/80', 'Pupils 3 mm, equal, and brisk'], a: 0,
  rat: 'Early indicators of a change in level of consciousness — restlessness, irritability, disorientation — are often subtle and are the first sign of increased ICP; report immediately. A controlled mild headache, a small BP change, and normal pupils do not require immediate intervention.' },

{ id: 59, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Stroke',
  stem: 'A client with a right hemisphere stroke, left-sided neglect, and impulsive behavior keeps trying to climb out of bed. The spouse must leave for 2 hours. Which nursing action is most appropriate?',
  o: ['Keep the bed in the lowest position and place the call light on the client’s right side', 'Apply bilateral wrist restraints until the spouse returns', 'Place the call light on the client’s left side so he learns to use that side', 'Position the bed so the client’s left side faces the door'], a: 0,
  rat: 'Right hemisphere stroke = impulsivity, poor judgment, and left neglect, so fall prevention is the priority: a low bed and items within the visual field on the unaffected (right) side. Restraints are a last resort after alternatives. Iggy: the unaffected side should face the door. A call light on the neglected side will not be found.' },

{ id: 60, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Delegation',
  stem: 'A client with a left hemisphere stroke passed a swallow evaluation and needs help eating. Which task can the nurse delegate to assistive personnel?',
  o: ['Help the client eat lunch', 'Perform the bedside swallow screen before the next meal', 'Check the client’s gag and cough reflexes', 'Teach the spouse safe feeding techniques'], a: 0,
  rat: 'Feeding a client who swallows safely is within the scope of assistive personnel. Swallow screening and checking gag and cough reflexes are nursing assessments; family teaching is an RN responsibility.' },

{ id: 61, type: 'sata', lec: true, cj: 'Generate Solutions', topic: 'Stroke',
  stem: 'Which are core measures for the care of clients with ischemic stroke? Select all that apply.',
  o: ['Venous thromboembolism prophylaxis', 'Discharge on a statin', 'Stroke education provided and documented', 'Discharge on prophylactic levetiracetam', 'Discharge on nimodipine', 'Indwelling urinary catheter for the first 24 hours', 'Fluid restriction to 1500 mL per day'], a: [0, 1, 2],
  rat: 'The eight core measures: VTE prophylaxis; discharge with antithrombotic therapy; anticoagulation for atrial fibrillation/flutter; thrombolytic therapy as indicated; antithrombotic therapy reevaluated by end of day 2; discharge on a statin; stroke education provided and documented; assessment for rehabilitation. Antiepileptics are not a core measure. Nimodipine treats vasospasm after subarachnoid hemorrhage; invasive tubes are avoided for 24 hours after alteplase; fluid restriction is for SIADH after craniotomy.' },

{ id: 62, type: 'sata', lec: true, cj: 'Recognize Cues', topic: 'Traumatic brain injury',
  stem: 'Which findings are consistent with a mild traumatic brain injury? Select all that apply.',
  o: ['Sensitivity to light', 'Feeling mentally foggy', 'Irritability', 'Glasgow Coma Scale score of 7', 'Loss of consciousness for 2 hours', 'Glasgow Coma Scale score of 10'], a: [0, 1, 2],
  rat: 'Box 38.7 mild TBI: dazed, loss of consciousness (if any) under 30 minutes, headache, nausea, vomiting, balance problems, light and noise sensitivity; mentally foggy, slowed down, poor concentration; sleep changes; irritability, sadness, depression. Loss of consciousness of 30 minutes to 6 hours and a GCS of 9–12 define MODERATE injury; GCS 3–8 is SEVERE.' },

{ id: 63, type: 'sata', lec: true, cj: 'Generate Solutions', topic: 'Brain tumor / craniotomy',
  stem: 'A client is being discharged after debulking of a malignant brain tumor. Which teaching will the nurse include for the family? Select all that apply.',
  o: ['What to do if a seizure occurs', 'Keep the home environment safe and free of hazards', 'Contact a brain tumor support group', 'Seek hospice services if the tumor becomes untreatable and the client is terminally ill', 'Stop the antiepileptic drug once headaches resolve', 'Expect headaches to be worst in the evening'], a: [0, 1, 2, 3],
  rat: 'Lecture slide 30 and Iggy: maintain quality of life, a safe environment, and monitor for seizures; support groups and home care are resources; families should seek hospice and palliative care if the tumor is untreatable or metastatic and the client is terminally ill. Antiepileptics are not stopped on the family’s own judgment, and brain tumor headaches are usually worse on awakening in the morning.' },

{ id: 64, type: 'sata', lec: true, cj: 'Analyze Cues', topic: 'Stroke drugs',
  stem: 'A client with an acute ischemic stroke arrives 4 hours after symptoms began. Which findings make the client ineligible for IV alteplase in this extended window? Select all that apply.',
  o: ['Age 84', 'Takes warfarin with an INR of 1.4', 'Stroke scale (NIHSS) score of 22', 'History of both a prior stroke and diabetes mellitus', 'Age 76', 'Stroke scale (NIHSS) score of 12'], a: [0, 1, 3],
  rat: 'The American Stroke Association extends the window to 4.5 hours EXCEPT for: age older than 80; anticoagulation regardless of INR; imaging showing injury to more than one-third of the middle cerebral artery territory; NIHSS greater than 25; history of both stroke and diabetes; active bleeding. Age 76 and scores of 12 or 22 (not above 25) do not exclude the client.' },
/* ---------- TESTED IN CLASS, NOT IN IGGY OR SLIDES ---------- */
{ id: 65, type: 'sata', ext: true, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'The nurse teaches the family of a client who had a transient ischemic attack to use BE FAST. Which sudden findings should prompt the family to call 911? Select all that apply.',
  o: ['Loss of balance and trouble walking', 'Blurred or double vision in one eye', 'One side of the face droops when smiling', 'Slurred speech', 'Knee pain that gradually worsens over a week', 'Tiredness at the end of a busy day', 'Mild headache that goes away with acetaminophen'], a: [0, 1, 2, 3],
  rat: 'BE FAST: Balance (sudden dizziness, loss of balance or coordination), Eyes (sudden vision loss or change in one or both eyes), Face drooping, Arm weakness, Speech difficulty, Time to call 911. Iggy teaches FAST; the B and E match two of Iggy’s five most common stroke symptoms (sudden trouble seeing; sudden dizziness, trouble walking, or loss of balance). Gradual joint pain, ordinary fatigue, and a mild relieved headache are not sudden stroke signs.' },

{ id: 66, type: 'mcq', ext: true, cj: 'Evaluate Outcomes', topic: 'Stroke',
  stem: 'After BE FAST teaching, which statement by the spouse of a client who had a transient ischemic attack shows correct understanding?',
  o: ['“If he suddenly can’t keep his balance or loses vision in one eye, I’ll call 911 and note the time it started.”', '“If his face droops, I’ll wait an hour to see whether it goes away before calling anyone.”', '“The T stands for taking an aspirin as soon as symptoms start.”', '“I only need to call 911 if his face, arm, and speech are all affected at once.”'], a: 0,
  rat: 'Any one sudden BE FAST sign — Balance, Eyes, Face, Arms, Speech — means call 911, and Time means act now and note when symptoms began (onset time decides alteplase eligibility). Waiting wastes the 3–4.5 hour treatment window. Aspirin is not given before imaging rules out hemorrhage. One sign is enough; they do not all need to appear together.' },
/* ---------- FROM CLASS (lecture transcript, Ch. 38) ---------- */
{ id: 67, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Stroke',
  stem: 'A client on a medical-surgical unit suddenly develops a right facial droop and right arm drift. What is the nurse’s first action?',
  o: ['Call the Rapid Response Team', 'Activate a stroke code', 'Give aspirin 325 mg by mouth', 'Finish documenting the assessment, then notify the provider'], a: 0,
  rat: 'Said in class, and she stressed it: “If you see it on an exam, you call the rapid response first, not the stroke code.” In her hospital only a provider or PA calls the stroke code; the team decides. Aspirin is never given before imaging rules out hemorrhage.' },

{ id: 68, type: 'mcq', lec: true, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'A client with an ischemic stroke had a stroke scale (NIHSS) score of 2 at 0800. At 1200 the score is 5. What will the nurse do?',
  o: ['Call the Rapid Response Team', 'Recheck the score at the next scheduled neuro check', 'Document the score; changes under 5 points are expected', 'Lower the head of the bed and recheck in 1 hour'], a: 0,
  rat: 'In class: a lower score is better (0 = no deficits). If the stroke scale worsens by more than 2 points, call a rapid response. A rise from 2 to 5 is a 3-point decline.' },

{ id: 69, type: 'sata', lec: true, cj: 'Generate Solutions', topic: 'Brain tumor / craniotomy',
  stem: 'A client with a brain tumor is placed on seizure precautions. Which actions will the nurse take? Select all that apply.',
  o: ['Keep the bed in the lowest position', 'Pad the side rails', 'Maintain an IV access (saline lock)', 'Use a bed or chair alarm', 'Raise all four side rails', 'Tape a padded tongue blade to the headboard', 'Apply wrist restraints'], a: [0, 1, 2, 3],
  rat: 'In class: bed in lowest position, padded side rails, IV access so a drug such as lorazepam can be given right away, bed or chair alarm, and give antiepileptics as ordered. Only three side rails — four side rails up counts as a restraint. [Background] Nothing is placed in the mouth during a seizure; restraints cause injury.' },

{ id: 70, type: 'mcq', lec: true, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'A client was seen watching television and talking normally at 2300. The night nurse finds the client at 0500 with left-sided weakness. What is the client’s “last known well” time?',
  o: ['2300', '0500', 'The time the client arrives at CT', 'The time the provider examines the client'], a: 0,
  rat: 'In class and on her Neuro Nuggets sheet: last known well = the exact date and time the client was last seen acting normally or without symptoms — not the time symptoms were discovered. It decides fibrinolytic eligibility (3 hours; up to 4.5 hours with exclusions).' },

{ id: 71, type: 'mcq', lec: true, cj: 'Generate Solutions', topic: 'Stroke drugs',
  stem: 'A client received IV alteplase for an acute ischemic stroke 2 hours ago. Which venous thromboembolism prophylaxis does the nurse expect?',
  o: ['Sequential compression devices', 'Enoxaparin started now', 'Aspirin 325 mg now', 'Heparin bolus followed by an infusion'], a: 0,
  rat: 'In class: if the client received tPA, the client must have sequential compression devices. Iggy: no antiplatelet or anticoagulant within 24 hours after a fibrinolytic, and a follow-up CT is required first.' },

{ id: 72, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Stroke',
  stem: 'A 59-year-old began having trouble finding words 8 hours ago and has worsened. He now has right hemiparesis and urinary incontinence. What is the nurse’s priority intervention?',
  o: ['Elevate the head of the bed', 'Change the linens and gown', 'Prepare to give IV alteplase', 'Teach the wife about stroke risk factors'], a: 0,
  rat: 'Her case study: elevate the head of the bed — protect the airway; stroke clients may have no gag reflex. The linen change is done, but not first. At 8 hours he is outside the alteplase window. Teaching comes later.' },

{ id: 73, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Stroke',
  stem: 'Same client. His wife asks for a glass of water because he says he is thirsty. What is the nurse’s best response?',
  o: ['“He needs a swallow screen before he has anything to drink.”', '“Small sips of water are fine if he sits up.”', '“Use a straw so he can control the amount.”', '“Give him ice chips instead of water.”'], a: 0,
  rat: 'Her case and Iggy: before any liquids, food, or medication, the client is screened for the ability to swallow, and gag and cough reflexes are checked. Ice chips, sips, and straws are all oral intake.' }
];
