<style>

}

.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}

.sheet{background:var(--surface);width:100%;max-width:760px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.types{display:flex;flex-direction:column;gap:8px}

.type[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

<script>
// Chapter 38 exam bank. Every answer option verified against Iggy 11e Ch. 38.
// types: mcq, sata, matrix, highlight, cloze, dnd, order
const CASE = {
  title: '71-year-old client, emergency department → stroke unit',
  tabs: [
    { name: 'History & Physical', entries: [
      { s: 1, t: '71-year-old male. Right-handed. Retired bus driver; lives with wife.' },
      { s: 1, t: 'History: atrial fibrillation (diagnosed 1 year ago; declined anticoagulation), hypertension, type 2 diabetes mellitus.' },
      { s: 1, t: 'Home medications: metoprolol, lisinopril, metformin.' },
      { s: 1, t: 'Weight 80 kg (measured on emergency department bed scale).' }
    ] },
    { name: 'Nurses’ Notes', entries: [
      { s: 1, t: '0815 — Brought by wife. Last known well at 0700. Right facial droop. Right arm drifts to bed within 10 seconds. Follows two-step commands. Attempts to answer questions but produces only a few words and appears frustrated. Pupils equal and reactive. Pulse irregularly irregular at 104. BP 196/104. SpO2 96% on room air. Temperature 98.6°F (37°C). Fingerstick glucose 142 mg/dL. Stroke scale (NIHSS) score 9. Wife at bedside, tearful.' },
      { s: 2, t: '0850 — CT of head without contrast: no hemorrhage. Labetalol 10 mg IV given 0840 per protocol. BP now 178/100. Wife signed consent for alteplase. Bedside swallow screen not yet done.' },
      { s: 3, t: '0935 — Alteplase bolus given 0855; infusion started 0856 by pump. Client grimaces, points to head, and says "head… bad." Vomited once. BP 194/112, HR 110 irregular. Right arm now has no movement.' },
      { s: 4, t: '0950 — Stat CT: small area of hemorrhage, left parietal region. Alteplase not resumed. Neurosurgery consulted. Transferred to neuro critical care.' },
      { s: 4, t: 'Day 2, 0900 — Assessment findings recorded for evaluation (see question).' }
    ] },
    { name: 'Vital Signs', table: true, cols: ['Time', 'BP', 'HR', 'RR', 'SpO2', 'Temp'], entries: [
      { s: 1, r: ['0815', '196/104', '104 irreg', '18', '96%', '98.6°F'] },
      { s: 2, r: ['0850', '178/100', '98 irreg', '18', '97%', '98.6°F'] },
      { s: 3, r: ['0935', '194/112', '110 irreg', '22', '95%', '98.8°F'] },
      { s: 4, r: ['Day 2 0900', '162/88', '84 irreg', '18', '97%', '99.0°F'] }
    ] },
    { name: 'Labs & Imaging', entries: [
      { s: 1, t: 'Glucose 142 mg/dL • Hgb 15.2 g/dL • Platelets 240,000/mm³' },
      { s: 1, t: 'PT 12 sec • INR 1.0 • aPTT 30 sec' },
      { s: 2, t: 'CT head without contrast (0845): no intracranial hemorrhage.' },
      { s: 4, t: 'Stat CT head (0945): small left parietal hemorrhage.' }
    ] },
    { name: 'Orders', entries: [
      { s: 1, t: 'NPO. Continuous cardiac monitoring. Neuro checks per stroke protocol.' },
      { s: 1, t: 'Alteplase 0.9 mg/kg IV per stroke protocol after CT confirms no hemorrhage.' },
      { s: 1, t: 'Labetalol 10 mg IV PRN for SBP ≥ 185 or DBP ≥ 110.' },
      { s: 1, t: 'Aspirin 325 mg PO daily, start today.' }
    ] }
  ]
};

const Q = [
/* ---------- CASE STUDY (NCJMM 1–6) ---------- */
{ id: 1, type: 'highlight', case: true, stage: 1, cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'Read the 0815 nurses’ note. Click to highlight the findings that require immediate follow-up.',
  passage: ['0815 — Brought by wife. ', { h: 'Last known well at 0700', k: 1 }, '. ', { h: 'Right facial droop', k: 1 }, '. ',
    { h: 'Right arm drifts to bed within 10 seconds', k: 1 }, '. ', { h: 'Follows two-step commands' }, '. ',
    { h: 'Attempts to answer questions but produces only a few words and appears frustrated', k: 1 }, '. ',
    { h: 'Pupils equal and reactive' }, '. ', { h: 'Pulse irregularly irregular at 104', k: 1 }, '. ', { h: 'BP 196/104', k: 1 }, '. ',
    { h: 'SpO2 96% on room air' }, '. ', { h: 'Temperature 98.6°F (37°C)' }, '. ', { h: 'Fingerstick glucose 142 mg/dL' }, '. ',
    { h: 'Stroke scale (NIHSS) score 9', k: 1 }, '. ', { h: 'Wife at bedside, tearful' }, '.'],
  rat: 'Time last known well decides fibrinolytic eligibility (3 hours FDA; up to 4.5 hours with exclusions). Facial droop, arm drift, and halting speech with intact comprehension are acute focal deficits. Irregularly irregular pulse = atrial fibrillation, the usual embolic source. BP 196/104 is above the 185/110 ceiling for alteplase. The stroke scale score is one assessment used to decide eligibility. Glucose 142 and SpO2 96% matter because they rule OUT the two mimics (hypoglycemia, hypoxia) — they do not need follow-up. Following commands is intact comprehension. A tearful spouse needs support but is not an immediate clinical cue.' },

{ id: 2, type: 'cloze', case: true, stage: 1, cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'Complete the statement using the chart.',
  parts: ['The client’s findings are most consistent with ', { o: ['acute ischemic stroke', 'hypoglycemia', 'subarachnoid hemorrhage', 'epidural hematoma'], a: 0 },
    ' as evidenced by ', { o: ['right-sided weakness with difficulty producing words', 'a temperature of 98.6°F', 'a glucose of 142 mg/dL', 'pupils that are equal and reactive'], a: 0 },
    '. The most likely source of the occlusion is ', { o: ['atrial fibrillation', 'a ruptured aneurysm', 'head trauma', 'uncontrolled diabetes mellitus'], a: 0 }, '.'],
  rat: 'Sudden focal deficits with preserved consciousness fit an ischemic (embolic) stroke; hemorrhagic strokes typically cause deepening lethargy and a "worst headache of my life" (subarachnoid hemorrhage). Glucose 142 rules out hypoglycemia as a mimic. No trauma history makes epidural hematoma unlikely. Iggy names the heart — especially atrial fibrillation — as the usual source of emboli. Contralateral findings (right body) and expressive aphasia point to the dominant left hemisphere, middle cerebral artery territory.' },

{ id: 3, type: 'cloze', case: true, stage: 1, cj: 'Prioritize Hypotheses', topic: 'Stroke',
  stem: 'Complete the statement.',
  parts: ['Before alteplase can be started, the nurse’s priority is to address the client’s ', { o: ['blood pressure', 'heart rate', 'blood glucose', 'stroke scale score'], a: 0 },
    ', because it must be below ', { o: ['185/110 mm Hg', '220/120 mm Hg', '140/90 mm Hg', '160/100 mm Hg'], a: 0 }, ' before the drug is given.'],
  rat: 'Iggy: the patient receives a rapid-acting antihypertensive until BP is below 185/110 mm Hg, and that level is maintained during fibrinolytic therapy. The heart rate reflects known atrial fibrillation; glucose 142 is acceptable; a score of 9 does not exclude treatment (exclusion in the extended window is a score > 25). 220 systolic is the permissive ceiling only for clients NOT receiving alteplase or embolectomy.' },

{ id: 4, type: 'matrix', case: true, stage: 2, cj: 'Generate Solutions', topic: 'Stroke drugs',
  stem: 'CT shows no hemorrhage and BP is 178/100. For each potential action, indicate whether it is indicated or contraindicated for this client at this time.',
  cols: ['Indicated', 'Contraindicated'],
  rows: [
    ['Have a second nurse double-check the calculated alteplase dose', 0],
    ['Give 10% of the alteplase dose as an IV bolus over 1 minute', 0],
    ['Manually push the remaining dose if the pump alarms', 1],
    ['Give the scheduled aspirin 325 mg with the alteplase', 1],
    ['Perform neuro checks every 10 to 15 minutes during the infusion', 0],
    ['Insert a nasogastric tube for medications during the next 24 hours', 1],
    ['Keep the client NPO until a swallow screen is performed', 0],
    ['Calculate the dose from the weight the wife reports from his last office visit', 1]
  ],
  rat: 'Box 38.4: double check; programmable pump, 10% bolus over 1 minute, remainder over 60 minutes, never pushed manually; neuro checks every 10–15 minutes during infusion; no invasive tubes such as nasogastric tubes or urinary catheters until stable (usually 24 hours). Aspirin is never given within 24 hours of a fibrinolytic, and a follow-up CT is required before any antiplatelet — the aspirin order must be clarified. Dose is 0.9 mg/kg of ACTUAL weight (the bed-scale weight). Every stroke client stays NPO until swallowing is assessed.' },

{ id: 5, type: 'mcq', case: true, stage: 3, cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'Review the 0935 note. Which action will the nurse take first?',
  o: ['Stop the alteplase infusion', 'Give labetalol 10 mg IV per the PRN order', 'Perform a full stroke scale reassessment', 'Turn the client to the side to prevent aspiration'], a: 0,
  rat: 'Severe headache (by gesture), vomiting, severe hypertension, and new loss of arm movement during alteplase signal intracerebral hemorrhage. Box 38.4: discontinue the infusion if the patient has severe headache, severe hypertension, bleeding, nausea, or vomiting, and notify the provider immediately. Every other action is reasonable afterward, but continuing to run a "clot buster" into a bleeding brain is the active harm — remove it first.' },

{ id: 6, type: 'matrix', case: true, stage: 4, cj: 'Evaluate Outcomes', topic: 'Stroke',

{ id: 7, type: 'matrix', cj: 'Analyze Cues (Trend)', topic: 'Traumatic brain injury',

    ['SpO2', '97%', '97%', '96%'], ['Wrist pain', '4/10', '3/10', '3/10']] },

{ id: 8, type: 'cloze', cj: 'Analyze Cues', topic: 'Traumatic brain injury',
  stem: 'A 22-year-old was struck on the side of the head by a baseball, was unconscious for about 1 minute, and is now awake and talking in the emergency department. CT shows a temporal bone fracture.',

{ id: 9, type: 'highlight', cj: 'Recognize Cues', topic: 'Brain tumor / craniotomy',
  stem: 'A client returned 2 hours ago from an infratentorial (posterior fossa) tumor resection. Click the findings or actions in the note that require follow-up.',
  passage: ['1400 — ', { h: 'Head of bed at 30 degrees, supine', k: 1 }, '. ', { h: 'Bilateral periorbital edema' }, '. ',
    { h: 'Dressing has a 2-cm drainage spot, marked' }, '. ', { h: 'Drain output 20 mL since surgery' }, '. ',
    { h: 'Drowsy; given ice chips for dry mouth', k: 1 }, '. ', { h: 'Vomited once at 1345', k: 1 }, '. ',
    { h: 'Reports extreme thirst', k: 1 }, '. ', { h: 'Urine 450 mL in the last hour, very pale', k: 1 }, '. ',
    { h: 'Pupils equal and reactive' }, '. ', { h: 'Headache 3/10' }, '.'],
  rat: 'Infratentorial surgery: keep the client flat or at 10 degrees and side-lying (alternate every 2 hours for 24–48 hours) — 30 degrees supine is the supratentorial position. Keep NPO until awake and alert because edema near the medulla and lower cranial nerves causes vomiting and aspiration — ice chips for a drowsy client and the episode of vomiting both need follow-up. Extreme thirst with large volumes of very dilute urine suggests central diabetes insipidus. Periorbital edema, a small marked spot, and 20 mL of drainage (typical is 30–50 mL per 8 hours) are expected.' },

{ id: 10, type: 'dnd', cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'Drag the finding that best matches each artery affected by stroke. Not all findings will be used.',
  slots: ['Middle cerebral artery', 'Anterior cerebral artery', 'Vertebrobasilar artery', 'Internal carotid artery'],
  pool: ['Homonymous hemianopsia with unilateral neglect', 'Leg weaker than arm with bladder incontinence', 'Vertigo with flaccid paresis of all four extremities', 'Carotid bruit with contralateral hemiparesis', 'Perseveration with loss of deep sensation', 'Cheyne-Stokes respirations with pinpoint reactive pupils'],
  a: [0, 1, 2, 3],
  rat: 'Box 38.3: middle cerebral (most common) — homonymous hemianopsia, unilateral neglect, aphasia, contralateral arm-dominant weakness. Anterior cerebral — leg more than arm, bladder incontinence, personality change. Vertebrobasilar — headache, vertigo, flaccid quadriparesis, ataxia. Internal carotid — contralateral hemiparesis, carotid bruit. Perseveration and loss of deep sensation belong to the posterior cerebral artery. Cheyne-Stokes with pinpoint pupils is central herniation, not an arterial territory.' },

{ id: 11, type: 'order', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'Place the nurse’s actions for IV alteplase in an eligible client in the correct order. All steps are used.',
  items: ['Confirm CT shows no intracranial hemorrhage', 'Confirm BP is below 185/110 mm Hg', 'Double-check the 0.9 mg/kg actual-weight dose with a second nurse', 'Give 10% of the dose as an IV bolus over 1 minute', 'Infuse the remaining dose over 60 minutes by pump', 'Obtain a follow-up CT before the first antiplatelet dose'],
  meta: { 'Client Needs': 'Physiological Integrity — Pharmacological and Parenteral Therapies', 'Clinical Judgment': 'Take Action', 'Cognitive Ability': 'Applying', 'Content Area': 'Neurologic — Stroke', 'Integrated Process': 'Nursing Process — Implementation', 'Priority Concept': 'Perfusion', 'Strategy': 'Sequence: confirm safety → verify drug → administer → follow up' },
  rat: 'Imaging must exclude hemorrhage first (alteplase into a bleed is lethal). BP must be below 185/110 before the drug. Box 38.4: double-check, then pump delivery — 10% bolus over 1 minute, remainder over 60 minutes. A follow-up CT or MRI is obtained after fibrinolytic therapy and before antiplatelet or anticoagulant drugs.' },

{ id: 12, type: 'matrix', cj: 'Generate Solutions', topic: 'Traumatic brain injury',

  ],

{ id: 13, type: 'cloze', cj: 'Take Action', topic: 'Increased ICP drugs',

{ id: 14, type: 'matrix', cj: 'Generate Solutions', topic: 'Brain tumor / craniotomy',
  stem: 'Indicate whether each postoperative action or finding applies to supratentorial or infratentorial surgery.',

    ['NPO until awake and alert because of vomiting and aspiration risk', 1],
    ['Bone pieces often not replaced to allow room for edema', 1],
    ['Major complications are increased ICP from edema or hydrocephalus and hemorrhage', 0],

{ id: 15, type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Priority',
  stem: 'The nurse receives report on four clients on the neuroscience unit. Which client will the nurse see first?',
  o: ['Client with a traumatic brain injury whose GCS fell from 14 to 12 in the last hour', 'Client on day 3 after subarachnoid hemorrhage receiving nimodipine who reports headache 6/10 and light sensitivity', 'Client 1 day after supratentorial craniotomy with bilateral periorbital edema and bruising', 'Client after a right-hemisphere stroke who laughs and then cries without apparent reason'], a: 0,
  rat: 'A drop of 2 or more GCS points is clinically important and must be reported — decreasing consciousness is the earliest sign of increased ICP. Headache and photophobia are expected after subarachnoid hemorrhage; periorbital edema is expected after craniotomy; emotional lability is an expected effect of right or frontal brain injury.' },

{ id: 16, type: 'mcq', cj: 'Analyze Cues', topic: 'Traumatic brain injury',
  stem: 'An 81-year-old client taking warfarin fell 3 weeks ago. Her daughter reports worsening headaches and new confusion over the past week. Which condition does the nurse suspect?',
  o: ['Chronic subdural hematoma', 'Epidural hematoma', 'Postconcussion syndrome', 'Second-impact syndrome'], a: 0,
  rat: 'Chronic subdural hematoma presents 2 weeks to several months after injury; it nearly doubles in incidence after 65 and is commonly caused by falls plus anticoagulant or antiplatelet therapy. Signs: worsening headache, paresis, acute confusion, seizures. Epidural hematoma deteriorates within minutes to hours. Postconcussion syndrome (headache, dizziness, impaired cognition ≥ 4 weeks) does not explain progressive confusion in an anticoagulated older adult. Second-impact syndrome requires a second hit before recovery.' },

{ id: 17, type: 'mcq', cj: 'Take Action', topic: 'Delegation',
  stem: 'A client has right-sided hemiplegia with a flaccid right arm after a stroke. Which instruction will the nurse give the assistive personnel?',
  o: ['“Support his right arm on a pillow whenever he sits in the chair.”', '“Help him up in bed by lifting under his right arm.”', '“Give him small sips of water to see how well he swallows.”', '“Approach him from his right side so he notices that arm.”'], a: 0,
  rat: 'Support the flaccid arm and position it on a pillow when sitting to prevent shoulder subluxation; teach assistive personnel to avoid pulling on it. Swallow screening is a nursing assessment — the client stays NPO until it is done. Always approach from the unaffected side.' },

{ id: 18, type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'A client after a stroke nods appropriately to questions and follows commands but struggles to form words and becomes angry when he cannot answer. The nurse recognizes injury to which area?',
  o: ['Broca area of the frontal lobe', 'Wernicke area of the temporoparietal region', 'The cerebellum', 'The occipital visual cortex'], a: 0,
  rat: 'Expressive (Broca, motor) aphasia: the patient understands but cannot speak, is aware of the deficit, and may become frustrated. Receptive (Wernicke) aphasia: cannot understand spoken or written words; speech may be fluent but meaningless.' },

{ id: 19, type: 'mcq', cj: 'Evaluate Outcomes', topic: 'Stroke',
  stem: 'A client has homonymous hemianopsia after a stroke. Which statement indicates a need for further teaching?',
  o: ['“Wearing a patch over one eye will bring back the missing half of my vision.”', '“I will turn my head from side to side when I eat.”', '“I will keep my phone and glasses where I can see them.”', '“I will scan the hallway with my head when I walk.”'], a: 0,
  rat: 'Homonymous hemianopsia = blindness in the same half of both eyes; teach scanning (turning the head side to side) when eating and walking, and place objects in the visual field. An eye patch is used for diplopia (double vision), changed every 2–4 hours — it does not restore a lost field.' },

{ id: 20, type: 'sata', cj: 'Generate Solutions', topic: 'Increased ICP',
  stem: 'Which actions will the nurse include to prevent increased intracranial pressure in a client after an acute stroke? Select all that apply.',
  o: ['Keep the head in a midline, neutral position', 'Elevate the head of the bed per protocol', 'Give the bath and change the linens back to back so the client can rest longer afterward', 'Hyperoxygenate before and after suctioning', 'Keep room lights low', 'Flex the hips sharply when boosting the client up in bed'], a: [0, 1, 3, 4],
  rat: 'Midline neutral head promotes venous drainage; HOB elevation improves perfusion pressure; hyperoxygenation prevents transient hypoxemia that dilates cerebral arteries; low lights accommodate photophobia. Clustering procedures (bath then linens) can dramatically raise ICP. Extreme hip flexion raises intrathoracic pressure and decreases cerebral venous outflow.' },

{ id: 21, type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke drugs',
  stem: 'A client arrives 4 hours after onset of an acute ischemic stroke. Which finding makes the client ineligible for IV alteplase in the extended (3- to 4.5-hour) window?',
  o: ['History of both a prior stroke and diabetes mellitus', 'Age of 78 years', 'Stroke scale (NIHSS) score of 18', 'BP of 178/96 mm Hg'], a: 0,
  rat: 'The American Stroke Association extends the window to 4.5 hours unless the client is older than 80, takes an anticoagulant regardless of INR, has imaging showing injury to more than one-third of the middle cerebral artery territory, has a score greater than 25, has a history of BOTH stroke and diabetes, or has active bleeding. BP 178/96 is already below 185/110.' },

{ id: 22, type: 'mcq', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'A client who weighs 176 lb (80 kg) is prescribed alteplase 0.9 mg/kg. How much will the nurse give as the initial IV bolus?',
  o: ['7.2 mg', '72 mg', '15.8 mg', '6.5 mg'], a: 0,
  rat: '80 kg × 0.9 mg/kg = 72 mg total. 10% is given as a bolus over 1 minute = 7.2 mg; the remaining 64.8 mg runs over 60 minutes. Using pounds (176 × 0.9 × 0.1 = 15.8 mg) is the classic weight-unit error.' },

{ id: 23, type: 'mcq', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'Eight hours after an alteplase infusion was completed, a client has an order for aspirin 81 mg PO now. The client passed a swallow screen. What will the nurse do?',
  o: ['Hold the aspirin and contact the provider', 'Give the aspirin with a full glass of water', 'Give the aspirin crushed in applesauce', 'Give the aspirin and increase neuro checks to hourly'], a: 0,
  rat: 'Aspirin should not be given within 24 hours of fibrinolytic administration, and a follow-up CT or MRI must be obtained before starting antiplatelet or anticoagulant drugs. Passing the swallow screen does not make the order safe — the red herring is the swallow screen.' },

{ id: 24, type: 'sata', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'A client is receiving IV alteplase. Which findings require the nurse to discontinue the infusion and notify the provider? Select all that apply.',
  o: ['New severe headache', 'Vomiting', 'BP 224/118 mm Hg', 'Heart rate 96 beats/min', 'SpO2 95% on room air', 'Blood oozing from the gums'], a: [0, 1, 2, 5],
  rat: 'Box 38.4: discontinue the infusion if the patient reports severe headache or has severe hypertension, bleeding, nausea, or vomiting, and notify the provider immediately. HR 96 and SpO2 95% do not meet stopping criteria.' },

{ id: 25, type: 'mcq', cj: 'Take Action', topic: 'Stroke',
  stem: 'A client with an acute ischemic stroke arrived 9 hours after onset and did not receive alteplase or embolectomy. BP is 204/108 mm Hg. The client is alert with stable deficits. What is the nurse’s best action?',
  o: ['Continue monitoring; this pressure is acceptable at this time', 'Give PRN IV labetalol to lower the BP to 140/90', 'Activate the Rapid Response Team', 'Lower the head of the bed to flat'], a: 0,
  rat: 'For ischemic strokes without alteplase or embolectomy, BP is initially allowed to rise above 220 mm Hg systolic to keep perfusion past the occlusion. A sudden systolic drop below 120 may cause brain ischemia. The 180 systolic notification threshold applies AFTER alteplase or embolectomy.' },

{ id: 26, type: 'mcq', cj: 'Generate Solutions', topic: 'Stroke drugs',
  stem: 'The spouse of a client with a subarachnoid hemorrhage from a ruptured aneurysm asks why nimodipine was prescribed. What is the nurse’s best response?',
  o: ['“It helps prevent spasm of the brain’s arteries, which usually happens 4 to 14 days after the bleed.”', '“It dissolves the clot that formed around the aneurysm.”', '“It pulls fluid out of the swollen brain tissue.”', '“It prevents seizures caused by blood on the brain.”'], a: 0,
  rat: 'Nimodipine, a calcium channel blocker that crosses the blood–brain barrier, treats or prevents cerebral vasospasm after subarachnoid hemorrhage (usually days 4–14) by relaxing vessel smooth muscle and dilating collateral vessels. Clot dissolving = fibrinolytic; pulling fluid = mannitol/hypertonic saline; seizure prevention = antiepileptics.' },

{ id: 27, type: 'mcq', cj: 'Recognize Cues', topic: 'Stroke',
  stem: 'A client reports a sudden “worst headache of my life” with neck stiffness and light sensitivity. Which additional finding will the nurse anticipate?',
  o: ['Deepening lethargy', 'Stepwise improvement between episodes', 'Clear cerebrospinal fluid', 'Preserved level of consciousness with gradual onset over hours'], a: 0,
  rat: 'This presentation fits a hemorrhagic stroke (subarachnoid). Table 38.1: hemorrhagic strokes produce deepening lethargy/stupor or coma, bloody cerebrospinal fluid, and usually seizures. Stepwise improvement and gradual onset with preserved consciousness describe thrombotic ischemic strokes.' },

{ id: 28, type: 'sata', cj: 'Take Action', topic: 'Traumatic brain injury',
  stem: 'A client with blunt head trauma awaits cervical spine clearance. Which spine precautions will the nurse implement? Select all that apply.',
  o: ['Bed rest', 'Log-roll to reposition', 'Place a small pillow under the neck for comfort', 'Manually control the cervical spine whenever the collar is off', 'Raise the head of the bed with the knees gatched to prevent sliding', 'Assess the skin under the rigid collar'], a: [0, 1, 3, 5],
  rat: 'Spine precautions: bed rest; no neck flexion with a pillow or roll; no thoracic or lumbar flexion; manual control of the cervical spine anytime the rigid collar is removed; log-roll to reposition; frequent skin checks under the collar.' },

{ id: 29, type: 'mcq', cj: 'Recognize Cues', topic: 'Increased ICP',
  stem: 'Which set of vital signs in a client with a severe traumatic brain injury indicates a very late sign of increased intracranial pressure?',
  o: ['BP 188/70, HR 52', 'BP 88/56, HR 128', 'BP 152/98, HR 112', 'BP 132/84, HR 76'], a: 0,
  rat: 'Cushing triad = severe hypertension, widened pulse pressure (188 − 70 = 118), and bradycardia. It is a classic but very late sign that usually indicates imminent death. Hypotension with tachycardia suggests shock.' },

{ id: 30, type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Traumatic brain injury',
  stem: 'A client with a left temporal contusion becomes rapidly less responsive. The left pupil is 7 mm and nonreactive with a drooping left eyelid. Which complication is most likely?',
  o: ['Uncal herniation compressing the oculomotor nerve', 'Central herniation of the brainstem', 'Slowly progressive hydrocephalus', 'Postconcussion syndrome'], a: 0,
  rat: 'Uncal herniation shifts the temporal lobe (uncus) onto cranial nerve III: dilated nonreactive pupil, ptosis, rapidly deteriorating consciousness. Central herniation begins with Cheyne-Stokes respirations and pinpoint reactive pupils. Slowly progressive hydrocephalus causes headache, decreased consciousness, irritability, blurred vision, and urinary incontinence.' },

{ id: 31, type: 'mcq', cj: 'Recognize Cues', topic: 'Traumatic brain injury',
  stem: 'After a fall, a client has clear drainage from the right nostril. Which finding most strongly supports a cerebrospinal fluid leak?',
  o: ['A yellowish ring forms around a central blood spot on white gauze', 'Purplish discoloration around both eyes', 'The drainage is thick and yellow', 'Bright red drainage that clots on the gauze'], a: 0,
  rat: 'The halo sign — a clear or yellowish ring around a spot of blood on white absorbent material — distinguishes cerebrospinal fluid from other fluids (fluid can also be sent for glucose and electrolytes). Raccoon eyes suggest a basilar skull fracture but do not by themselves prove a leak.' },

{ id: 32, type: 'mcq', cj: 'Analyze Cues', topic: 'Increased ICP',
  stem: 'Within the first 24 hours after a severe traumatic brain injury, an intubated client’s PaCO2 falls to 28 mm Hg after aggressive manual ventilation during suctioning. What is the nurse’s primary concern?',
  o: ['Cerebral vasoconstriction causing ischemia', 'Cerebral vasodilation raising intracranial pressure', 'Absorptive atelectasis', 'Development of diabetes insipidus'], a: 0,
  rat: 'Hypocarbia from hyperventilation causes profound vasoconstriction and ischemia, so hyperventilation is usually avoided in the first 24 hours and overly aggressive hyperventilation is avoided during suctioning. High CO2 (hypercarbia) is what dilates vessels and raises ICP.' },

{ id: 33, type: 'mcq', cj: 'Take Action', topic: 'Traumatic brain injury',
  stem: 'The nurse raises the head of the bed of a client with a traumatic brain injury from 15 to 30 degrees. MAP falls from 92 to 62 mm Hg. What is the nurse’s best action?',
  o: ['Lower the head of the bed and notify the provider', 'Keep the head of the bed at 30 degrees because it lowers intracranial pressure', 'Raise the head of the bed to 45 degrees to improve venous drainage', 'Flex the client’s knees to reduce intra-abdominal pressure'], a: 0,
  rat: 'HOB elevation is generally 30–45 degrees, but if raising the head significantly lowers systemic BP, the client does not benefit and may be harmed. A MAP of 62 is below the 70 mm Hg threshold Iggy uses to define hypotension in traumatic brain injury.' },

{ id: 34, type: 'sata', cj: 'Take Action', topic: 'Increased ICP drugs',
  stem: 'Which nursing actions are appropriate for a client receiving mannitol? Select all that apply.',
  o: ['Administer through a filter', 'Measure urine output every hour', 'Monitor serum electrolytes and osmolarity every 6 hours', 'Give as a continuous infusion for best effect', 'Monitor for acute renal failure', 'Expect weight gain from fluid retention'], a: [0, 1, 2, 4],
  rat: 'Mannitol is most effective in boluses, not continuous infusion. It pulls water out of brain tissue (osmotic diuresis), so watch for dehydration and acute renal failure, not fluid retention. Filter administration, hourly output, and electrolytes/osmolarity every 6 hours are all in Iggy.' },

{ id: 35, type: 'mcq', cj: 'Recognize Cues', topic: 'Increased ICP drugs',
  stem: 'A client with heart failure is receiving 3% hypertonic saline for increased intracranial pressure. Which finding requires immediate follow-up?',
  o: ['New crackles and SpO2 89%', 'Urine output 60 mL/hr', 'Intracranial pressure 14 mm Hg', 'Pupils equal and briskly reactive'], a: 0,
  rat: 'Hypertonic saline nursing implications: continual neuro assessments, serial sodium levels, fluid status, and monitoring for pulmonary edema, especially with a history of cardiac or renal disease. New crackles with falling SpO2 in a client with heart failure signal pulmonary edema. ICP of 14 is within the normal 10–15 range; output 60 mL/hr is adequate; equal brisk pupils are reassuring.' },

{ id: 36, type: 'mcq', cj: 'Generate Solutions', topic: 'Increased ICP drugs',
  stem: 'Why is fentanyl often preferred over morphine for a mechanically ventilated client with a traumatic brain injury?',
  o: ['It has fewer effects on blood pressure and heart rate', 'It provides deeper sedation than propofol', 'It lowers intracranial pressure by osmotic diuresis', 'It prevents posttraumatic seizures'], a: 0,
  rat: 'Iggy: fentanyl has fewer effects on blood pressure and heart rate than morphine and may be safer for managing pain in traumatic brain injury. Propofol and midazolam provide sedation; osmotic effects come from mannitol; seizure prevention comes from antiepileptic drugs.' },

{ id: 37, type: 'mcq', cj: 'Take Action', topic: 'Increased ICP drugs',
  stem: 'A ventilated client with a traumatic brain injury is receiving propofol. During turning, the client grimaces, HR rises from 84 to 112, and the client becomes restless. Which prescription does the nurse anticipate?',
  o: ['Fentanyl', 'An increased propofol dose', 'A mannitol bolus', 'Levetiracetam'], a: 0,
  rat: 'Propofol and midazolam sedate and lower ICP but are not as effective for pain. Restlessness caused by pain is treated with an opioid such as fentanyl. Most ventilated clients receive a combination.' },

{ id: 38, type: 'mcq', cj: 'Take Action', topic: 'Delegation',
  stem: 'Which task can the nurse delegate to assistive personnel for a client with a traumatic brain injury on spine precautions?',
  o: ['Help the nurse log-roll the client to change the linens', 'Check pupil size and reaction every hour', 'Calculate the hourly Glasgow Coma Scale score', 'Determine whether nasal drainage is cerebrospinal fluid'], a: 0,
  rat: 'Assisting with a log-roll while the nurse controls the cervical spine is a task with a predictable outcome. Pupil checks, GCS scoring, and deciding whether drainage is cerebrospinal fluid require nursing assessment and judgment.' },

{ id: 39, type: 'mcq', cj: 'Analyze Cues', topic: 'Traumatic brain injury',

    const cur=r||[]; let bi=0; const p=el('p',{class:'cloze'});
    q.parts.forEach(part=>{
      if (typeof part==='string') return p.append(part);
      const i=bi++, order=P[q.id][i];
      let cls=''; if (rev) cls = cur[i]===part.a?'right':'wrong';
      const s=el('select',{id:`c${q.id}b${i}`,class:cls,disabled:lock,'aria-label':'Select option '+(i+1),onchange:(e)=>{ const n=cur.slice(); n.length=q.parts.filter(x=>typeof x==='object').length; n[i]=e.target.value===''?null:+e.target.value; setResp(q,n); }},
        el('option',{value:'',text:'Select…'}), order.map(oi=>el('option',{value:oi,selected:cur[i]===oi,text:part.o[oi]})));
      p.append(s);
      if (rev && cur[i]!==part.a) p.append(el('span',{class:'hint',text:` [${part.o[part.a]}] `}));
    });
    return p;
  }
  if (q.type==='dnd'){
    const cur=r||Array(q.slots.length).fill(null); const wrap=el('div',{class:'dnd'});
    wrap.append(el('p',{class:'hint',text:'Tap a finding, then tap the box where it belongs. Tap a filled box to empty it.'}));
    const chips=el('div',{class:'chips'});
    P[q.id].forEach(pi=>{
      const used=cur.includes(pi);
      chips.append(el('button',{class:'chip'+(used?' used':''),'aria-pressed':String(S.chip===pi),disabled:lock||used,onclick:()=>{ S.chip = S.chip===pi?null:pi; render(); }}, q.pool[pi]));
    });
    wrap.append(chips);
    q.slots.forEach((sl,i)=>{
      let cls='slot'+(cur[i]!=null?' filled':'')+(S.chip!=null&&cur[i]==null?' armed':'');
      if (rev) cls+= cur[i]===q.a[i]?' right':' wrong';
      wrap.append(el('button',{class:cls,disabled:lock,onclick:()=>{
        const n=cur.slice();
        if (S.chip!=null){ n[i]=S.chip; S.chip=null; setResp(q,n); }
        else if (n[i]!=null){ n[i]=null; setResp(q,n); }
      }}, el('b',{text:sl}), el('span',{text:cur[i]!=null?q.pool[cur[i]]:'Empty'}), rev&&cur[i]!==q.a[i]?el('span',{class:'hint',text:'Correct: '+q.pool[q.a[i]]}):null));
    });
    return wrap;
  }
  if (q.type==='order'){
    const cur=r; const ol=el('ol');
    cur.forEach((it,pos)=>{
      const li=el('li',{class:rev?(it===pos?'right':'wrong'):''}, el('span',{class:'n',text:pos+1}), el('span',{class:'t',text:q.items[it]}),
        el('span',{class:'mv'},
          el('button',{'aria-label':'Move up',disabled:lock||pos===0,onclick:()=>{ const n=cur.slice(); [n[pos-1],n[pos]]=[n[pos],n[pos-1]]; setResp(q,n); }},'▲'),
          el('button',{'aria-label':'Move down',disabled:lock||pos===cur.length-1,onclick:()=>{ const n=cur.slice(); [n[pos+1],n[pos]]=[n[pos],n[pos+1]]; setResp(q,n); }},'▼')));
      ol.append(li);
    });
    const wrap=el('div',{class:'order stack'}, el('p',{class:'hint',text:'Use the arrows to arrange every step. Scored all-or-nothing.'}), ol);
    if (rev && !cur.every((v,i)=>v===i)) wrap.append(el('div',{class:'hint'}, 'Correct order: ', q.items.map((t,i)=>`${i+1}) ${t}`).join('  ')));
    return wrap;
  }
}

function resultsView(app){
  $('#pos').textContent='Results';
  let pts=0, mx=0; const byTopic={}, byCj={};
  L.forEach(q=>{ const p=score(q,S.ans[q.id]), m=maxPts(q); pts+=p; mx+=m;
    const t=byTopic[q.topic]||(byTopic[q.topic]={p:0,m:0}); t.p+=p; t.m+=m;
    const ck=q.cj.replace(/ \(.*\)/,''); const c=byCj[ck]||(byCj[ck]={p:0,m:0}); c.p+=p; c.m+=m; });
  const pct=Math.round(pts/mx*100);
  const bars=(obj)=>el('div',{class:'bars'}, Object.entries(obj).sort((a,b)=>a[1].p/a[1].m-b[1].p/b[1].m).map(([k,v])=>el('div',{class:'barrow'}, el('span',{text:k}), el('span',{class:'track'}, el('i',{style:`width:${Math.round(v.p/v.m*100)}%`})), el('span',{class:'v',text:`${v.p}/${v.m}`}))));
  const missed=L.filter(q=>score(q,S.ans[q.id])<maxPts(q));
  app.append(el('div',{class:'stack'},
    el('div',{class:'card stack'},
      el('div',{class:'meta'}, el('span',{text:'Points-based score'}), el('span',{text:setName()})),
      el('div',{class:'big',text:pct+'%'}),
      el('p',{class:'muted',style:'margin:0',text:`${pts} of ${mx} points • ${L.length-missed.length} of ${L.length} items at full credit. Course target: 85%.`})),
    el('div',{class:'card stack'}, el('h2',{text:'By topic (weakest first)'}), bars(byTopic)),
    el('div',{class:'card stack'}, el('h2',{text:'By clinical judgment step'}), bars(byCj)),
    el('div',{class:'card stack'}, el('h2',{text:`Items to restudy (${missed.length})`}),
      missed.length? el('div',{class:'navgrid'}, missed.map(q=>el('button',{class:score(q,S.ans[q.id])>0?'part':'no',onclick:()=>{ S.view='review'; S.idx=L.indexOf(q); S.tab=1; save(); render(); }}, String(q.id)))) : el('p',{text:'None. Every item earned full credit.'})),
    el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
      el('button',{class:'btn primary',onclick:()=>{ S.view='review'; S.idx=0; save(); render(); }}, 'Review all items'),
      el('button',{class:'btn',onclick:()=>{ S.view='start'; save(); render(); }}, 'Back to start'))
  ));
  window.scrollTo(0,0);
}

/* ---------- nav ---------- */
function go(i){ S.idx=Math.max(0,Math.min(L.length-1,i)); S.chip=null; if (L[S.idx].case && !L[S.idx-1]?.case) S.tab=1; save(); render(); window.scrollTo(0,0); }
$('#prevBtn').onclick=()=>go(S.idx-1);
$('#nextBtn').onclick=()=>{
  if (S.idx===L.length-1){ if (S.view==='review'){ S.view='results'; save(); render(); } else openNav(); return; }
  const n=S.idx+1;
  if (S.view==='q' && S.mode==='tutor' && n%10===0 && !S.breaks[setKey()+n]){ S.breaks[setKey()+n]=1; S.idx=n; S.view='break'; save(); render(); window.scrollTo(0,0); return; }
  go(n);
};
$('#checkBtn').onclick=()=>{ const q=L[S.idx]; if (!answered(q)) return; S.checked[q.id]=true; save(); render(); };
$('#flagBtn').onclick=()=>{ const q=L[S.idx]; S.flags[q.id]=!S.flags[q.id]; save(); render(); };
function openNav(){
  const g=$('#navGrid'); g.innerHTML='';
  L.forEach((q,i)=>{
    let cls='';
    const shown = S.view==='review' || S.view==='results' || (S.mode==='tutor' && S.checked[q.id]);
    if (shown && answered(q)){ const p=score(q,S.ans[q.id]), m=maxPts(q); cls = p===m?'ok':p>0?'part':'no'; }
    else if (answered(q)) cls='ans';
    if (i===S.idx && (S.view==='q'||S.view==='review')) cls+=' cur';
    if (S.flags[q.id]) cls+=' fl';
    g.append(el('button',{class:cls,'aria-label':`Item ${i+1}`,onclick:()=>{ closeNav(); if (S.view!=='review') S.view='q'; go(i); }}, String(i+1)));
  });
  const left=L.length-L.filter(answered).length;
  $('#finishHint').textContent = left ? `${left} item${left>1?'s':''} unanswered — unanswered items score 0.` : 'All items answered.';
  $('#finishBtn').hidden = S.view==='review' || S.view==='results';
  $('#navOverlay').hidden=false;
}
function closeNav(){ $('#navOverlay').hidden=true; }
$('#navBtn').onclick=openNav; $('#navClose').onclick=closeNav;
$('#navOverlay').addEventListener('click',e=>{ if (e.target.id==='navOverlay') closeNav(); });
$('#finishBtn').onclick=()=>{ L.forEach(q=>S.checked[q.id]=true); S.finished=setKey(); S.view='results'; closeNav(); save(); render(); };
document.addEventListener('keydown',e=>{ if (e.key==='Escape') closeNav(); });

// Always open on the start page; saved answers stay available through Resume / View last results
S.view='start';
// Answers saved by the earlier version had no finished flag: treat a fully scored exam as finished
if (S.finished===true) S.finished=ALL_KEY;
if (!S.finished && Q.every(q=>S.checked[q.id]) && Object.keys(S.ans).length) S.finished=ALL_KEY;
render();
})();
</script>
