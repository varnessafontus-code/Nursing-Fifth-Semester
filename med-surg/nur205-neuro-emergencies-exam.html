  rat: 'Iggy: there is no single lab test that diagnoses pulmonary embolism, but a normal or low D-dimer can rule it out because D-dimer rises with fibrinolysis. An elevated D-dimer supports — but does not confirm — the diagnosis.' },

{ id: 129, type: 'mcq', lec: true, cj: 'Generate Solutions', topic: 'Pulmonary embolism',
  stem: 'A client with a history of deep vein thrombosis is going on a 7-hour flight. Which statement indicates the need for more teaching?',
  o: ['“I’ll cross my ankles instead of my knees so blood still flows.”', '“I’ll walk the aisle for at least 5 minutes every hour.”', '“I’ll drink plenty of water during the trip.”', '“I’m going to quit smoking since I take birth control pills.”'], a: 0,
  rat: 'Her education slide: avoid crossing the legs at the knees OR the ankles; stand and walk at least 5 minutes of every hour spent sitting; drink plenty of water; stop smoking, especially with hormone replacement therapy or oral contraceptives.' },

/* ---------- ARF / ARDS / COVID ---------- */
{ id: 130, type: 'mcq', cj: 'Recognize Cues', topic: 'Acute respiratory failure',
  stem: 'A client with myasthenia gravis has SpO2 95% on 2 L by nasal cannula. End-tidal CO2 has risen from 38 to 56 mm Hg over 2 hours, and the client is harder to wake. Which interpretation is correct?',
  o: ['The client is developing ventilatory failure despite an acceptable SpO2', 'The SpO2 confirms adequate gas exchange', 'The rising end-tidal CO2 is expected with oxygen therapy', 'The client is sleeping normally after a tiring day'], a: 0,
  rat: 'Iggy: end-tidal CO2 may be more valuable than pulse oximetry in acute respiratory failure — SpO2 may look adequate while rising CO2 shows the client is near respiratory failure. Myasthenia gravis is a neuromuscular (extrapulmonary) cause; decreased level of consciousness is a hypercapnia sign.' },

{ id: 131, type: 'mcq', cj: 'Analyze Cues', topic: 'Acute respiratory failure',
  stem: 'Which group of findings most indicates hypercapnia rather than hypoxemia?',
  o: ['Headache, drowsiness, and flushed skin', 'Restlessness, tachycardia, and cyanosis', 'Irritability, agitation, and tachypnea', 'Pallor, anxiety, and diaphoresis'], a: 0,
  rat: 'Iggy: hypercapnic failure — decreased level of consciousness, headache, drowsiness, lethargy, flushed skin, nausea, seizures. Hypoxemic failure — restlessness, irritability or agitation, confusion, tachycardia, tachypnea, cyanosis (late).' },

{ id: 132, type: 'mcq', lec: true, cj: 'Analyze Cues', topic: 'Acute respiratory failure',
  stem: 'Which client condition is an extrapulmonary cause of ventilatory failure?',
  o: ['Guillain-Barré syndrome', 'Chronic obstructive pulmonary disease', 'Massive pulmonary embolism', 'Pulmonary edema'], a: 0,
  rat: 'Box 26.6: extrapulmonary causes are outside the lung tissue — neuromuscular disorders (Guillain-Barré, myasthenia gravis, spinal cord injury), central nervous system depression (opioids, stroke), and chest wall problems. Chronic obstructive pulmonary disease, massive pulmonary embolism, and pulmonary edema are intrapulmonary. Her ARS 2 used opioid overdose as the extrapulmonary answer.' },

{ id: 133, type: 'mcq', cj: 'Analyze Cues', topic: 'Acute respiratory distress syndrome',
  stem: 'A client with sepsis has SpO2 84% on a 100% nonrebreather mask. Chest x-ray shows bilateral infiltrates with a normal heart size. The nurse recognizes this as which feature?',
  o: ['Refractory hypoxemia from acute respiratory distress syndrome', 'Heart failure with cardiogenic pulmonary edema', 'Hypoxemia that will correct with a higher oxygen flow', 'Ventilatory failure from an extrapulmonary cause'], a: 0,
  rat: 'Hypoxemia that persists even on 100% oxygen is refractory hypoxemia, the cardinal feature of acute respiratory distress syndrome. Sepsis is the most common cause. Bilateral infiltrates without cardiomegaly point to noncardiac edema; an ECG/echocardiogram rules out a cardiac cause.' },

{ id: 134, type: 'mcq', cj: 'Take Action', topic: 'Acute respiratory distress syndrome',
  stem: 'A client with acute respiratory distress syndrome on PEEP of 15 cm H2O suddenly has absent breath sounds on the right, the trachea shifted to the left, BP 78/50, and distended neck veins. What is the nurse’s priority?',
  o: ['Call the Rapid Response Team and prepare for needle decompression', 'Increase the PEEP to improve oxygenation', 'Suction the endotracheal tube and recheck in 30 minutes', 'Place the client in the prone position'], a: 0,
  rat: 'Iggy: a side effect of PEEP is tension pneumothorax, so lung sounds are assessed hourly. Tracheal deviation away from the affected side, distended neck veins, and hypotension = tension pneumothorax, which is quickly fatal. Immediate needle decompression (2nd intercostal space, midclavicular line) by the provider, then a chest tube. More PEEP worsens it; proning delays rescue.' },

{ id: 135, type: 'mcq', cj: 'Generate Solutions', topic: 'Acute respiratory distress syndrome',
  stem: 'Four ventilated clients have moderate-to-severe acute respiratory distress syndrome. For which client should the nurse question an order for prone positioning?',
  o: ['A client with increased intracranial pressure after a head injury', 'A client with sepsis from pneumonia', 'A client receiving tube feedings', 'A client who developed the syndrome after pancreatitis'], a: 0,
  rat: 'Iggy: avoid prone positioning in acute bleeding, elevated intracranial pressure, or unstable fractures of the spine, femur, pelvis, or face. Sepsis, pneumonia, and pancreatitis are causes of the syndrome, not contraindications to proning.' },

{ id: 136, type: 'mcq', cj: 'Generate Solutions', topic: 'Acute respiratory distress syndrome',
  stem: 'Which prescription for a client with acute respiratory distress syndrome should the nurse clarify?',
  o: ['Infuse 0.9% sodium chloride at 200 mL/hr continuously to keep CVP above 12 mm Hg', 'Tidal volume 6 mL/kg of ideal body weight', 'Start enteral tube feedings today', 'Pantoprazole IV daily'], a: 0,
  rat: 'Iggy: conservative fluid therapy (target CVP below 4 mm Hg, smaller IV volumes and diuretics) improves lung function and shortens ventilator time; liberal fluids increase edema. Low tidal volume (6 mL/kg), early nutrition with a dietitian, and GI ulcer prophylaxis are all part of supportive care.' },

{ id: 137, type: 'mcq', lec: true, cj: 'Recognize Cues', topic: 'Acute respiratory distress syndrome',
  stem: 'Which client is at greatest risk for developing acute respiratory distress syndrome?',
  o: ['A 31-year-old with a pulmonary contusion who aspirated gastric contents at the crash scene', 'A 45-year-old with well-controlled asthma admitted for a fractured wrist', 'A 62-year-old receiving 1 unit of packed red blood cells after knee surgery', 'A 79-year-old receiving oral antibiotics for a urinary tract infection'], a: 0,
  rat: 'Her ARS 1: a direct lung injury (chest trauma/contusion) combined with documented gastric aspiration carries the highest immediate risk. Box 26.7 lists multiple transfusions — not a single unit — as a risk. Sepsis is the most common cause overall.' },

{ id: 138, type: 'mcq', lec: true, cj: 'Recognize Cues', topic: 'Severe COVID-19',
  stem: 'Four clients have COVID-19. Which client meets the criteria for severe illness?',
  o: ['SpO2 93% on room air with bilateral infiltrates', 'SpO2 97% on room air with fever and cough', 'SpO2 96% on room air with loss of taste and smell', 'SpO2 98% on room air with headache and body aches'], a: 0,
  rat: 'Her slide and Iggy: severe COVID-19 is hypoxemia with SpO2 94% or less on room air and the need for oxygen or ventilatory support, with extensive bilateral infiltrates.' },

{ id: 139, type: 'mcq', cj: 'Take Action', topic: 'Severe COVID-19',
  stem: 'Which prescription for a client with severe COVID-19 should the nurse question?',
  o: ['Albuterol by nebulizer every 4 hours', 'Enoxaparin subcutaneously daily', 'Dexamethasone IV daily', 'Remdesivir IV daily'], a: 0,
  rat: 'Iggy: when inhaled drugs are needed, a metered-dose inhaler is preferred over a nebulizer to prevent aerosolization. All hospitalized COVID-19 clients receive thromboprophylaxis; dexamethasone (preferred glucocorticoid) and remdesivir are recommended therapies.' },

{ id: 140, type: 'mcq', cj: 'Take Action', topic: 'Severe COVID-19',
  stem: 'A client with critical COVID-19 received baricitinib this morning. A new order arrives for tocilizumab. What will the nurse do?',
  o: ['Hold the tocilizumab and contact the provider', 'Give the tocilizumab as a single dose', 'Give the tocilizumab daily for 5 days', 'Give the tocilizumab by nebulizer'], a: 0,
  rat: 'Iggy: tocilizumab (IL-6 inhibitor) is given as a single dose and is not administered to clients receiving baricitinib (JAK inhibitor). Clarify before giving.' },

/* ---------- INTUBATION / VENTILATION ---------- */
{ id: 141, type: 'mcq', cj: 'Analyze Cues', topic: 'Mechanical ventilation',
  stem: 'Immediately after intubation, the nurse hears breath sounds on the right but none on the left, and only the right chest rises. What does the nurse suspect?',
  o: ['The tube is in the right mainstem bronchus', 'The tube is in the esophagus', 'The client has a right pneumothorax', 'The cuff is overinflated'], a: 0,
  rat: 'Iggy: if breath sounds and chest movement are absent on the left, the tube may be in the right mainstem bronchus; the provider can pull it back without full reintubation. An esophageal tube causes absent end-tidal CO2 and gastric sounds. A right pneumothorax would reduce RIGHT-sided sounds.' },

{ id: 142, type: 'mcq', cj: 'Take Action', topic: 'Mechanical ventilation',
  stem: 'After intubation, no carbon dioxide is detected, the abdomen is distending, and gurgling is heard over the epigastrium. What does the nurse anticipate?',
  o: ['Reintubation, then gastric decompression with a nasogastric tube', 'Pulling the tube back 2 cm', 'A chest x-ray before any other action', 'Increasing the cuff pressure to 40 cm H2O'], a: 0,
  rat: 'Iggy: a tube in the stomach or esophagus causes abdominal distension and absent end-tidal CO2; reintubation is required, and the stomach is decompressed with a nasogastric tube after the tube is correctly placed. Waiting for an x-ray delays ventilation; cuff pressure stays 20–30 cm H2O.' },

{ id: 143, type: 'mcq', lec: true, cj: 'Evaluate Outcomes', topic: 'Mechanical ventilation',
  stem: 'Per her lecture, which finding gives definitive confirmation of endotracheal tube placement?',
  o: ['Chest x-ray showing the tip above the carina', 'Condensation inside the tube', 'Equal chest rise during bagging', 'The client can no longer speak'], a: 0,
  rat: 'Her slide: immediate checks are end-tidal CO2, symmetric chest rise, bilateral breath sounds, and no epigastric sounds; definitive confirmation is a chest x-ray showing the tip above the carina (Iggy: about 2 cm above). Condensation and lack of speech do not confirm placement.' },

{ id: 144, type: 'mcq', cj: 'Recognize Cues', topic: 'Mechanical ventilation',
  stem: 'A client intubated 1 hour ago is receiving a neuromuscular blocking agent. The nurse notes tears, HR 128, and BP 172/98. What do these findings most likely indicate?',
  o: ['Pain or awareness needing more sedation', 'An expected response to the paralytic', 'Ventilator-associated pneumonia', 'Fluid overload from the ventilator'], a: 0,
  rat: 'Iggy Action Alert: paralytics have no analgesic, amnestic, or sedative effect; the paralyzed client can hear and feel pain. Tachycardia, hypertension, and tears may signal pain or awareness — ensure sedation is given.' },

{ id: 145, type: 'mcq', cj: 'Take Action', topic: 'Mechanical ventilation',
  stem: 'A ventilated client’s high-pressure alarm sounds. The client is biting the oral endotracheal tube. Which action is most appropriate?',
  o: ['Insert an oral airway or bite block', 'Increase the high-pressure alarm limit', 'Deflate the cuff', 'Silence the alarm and recheck in 10 minutes'], a: 0,
  rat: 'Table 26.4: for coughing, gagging, or biting on the oral tube, insert an oral airway to prevent biting and provide pain control and sedation as prescribed. Alarms are never turned off or ignored; deflating the cuff causes a leak and lost tidal volume.' },

{ id: 146, type: 'mcq', cj: 'Take Action', topic: 'Mechanical ventilation',
  stem: 'A ventilator alarm sounds. The client is cyanotic, and the nurse cannot find the cause. What should the nurse do?',
  o: ['Ventilate the client manually with a resuscitation bag', 'Silence the alarm until the respiratory therapist arrives', 'Increase the FiO2 on the ventilator to 100% and wait', 'Obtain an arterial blood gas'], a: 0,
  rat: 'National Patient Safety Goal: ventilator alarms are always on. If the cause cannot be found, ventilate manually with a resuscitation bag until another professional corrects the problem. Iggy also teaches DOPE (displaced, obstructed, pneumothorax, equipment) when gas exchange drops.' },

{ id: 147, type: 'mcq', cj: 'Recognize Cues', topic: 'Mechanical ventilation',
  stem: 'Which finding meets the definition of a ventilator-associated event in a client who was stable for 3 days?',
  o: ['Daily minimum PEEP increased from 5 to 8 cm H2O and stayed there', 'FiO2 decreased from 50% to 40%', 'Peak pressure briefly rose during coughing', 'Secretions changed from clear to white'], a: 0,
  rat: 'Iggy: a ventilator-associated event is a sustained decline in oxygenation after at least 2 stable days — greater than 20% increase in daily minimum FiO2 or at least a 3 cm H2O increase in daily minimum PEEP.' },

{ id: 148, type: 'mcq', cj: 'Generate Solutions', topic: 'Mechanical ventilation',
  stem: 'A ventilated client with chronic obstructive pulmonary disease has a new enteral feeding order. Which formula consideration does the nurse anticipate?',
  o: ['A higher-fat, lower-carbohydrate formula', 'A high-carbohydrate formula for quick energy', 'Clear liquids only until extubation', 'Withholding nutrition until the client is weaned'], a: 0,
  rat: 'Iggy: carbohydrate metabolism produces carbon dioxide, which a client with chronic obstructive pulmonary disease may not exhale, risking hypercarbic failure; higher-fat formulas are used. Nutrition usually starts within 48 hours — malnutrition weakens the diaphragm and causes failure to wean.' },

{ id: 149, type: 'mcq', cj: 'Generate Solutions', topic: 'Mechanical ventilation',
  stem: 'A client being weaned with a T-piece tolerates 2 hours off the ventilator during the day. The family asks whether the client can stay off the ventilator overnight. What is the nurse’s best response?',
  o: ['“Nighttime weaning usually starts only after breathing alone for most of the day.”', '“Yes, sleep is the best time to wean because the body needs less oxygen.”', '“Weaning is not possible on a T-piece.”', '“The ventilator is never removed at night once weaning begins.”'], a: 0,
  rat: 'Box 26.9 (T-piece technique): periods off the ventilator lengthen as tolerated; nighttime weaning is not usually attempted until the client can maintain spontaneous respirations for most of the day.' },

{ id: 150, type: 'mcq', cj: 'Take Action', topic: 'Mechanical ventilation',
  stem: 'A client extubated 20 minutes ago now has a high-pitched crowing sound on inspiration and is anxious. What is the nurse’s priority?',
  o: ['Call the Rapid Response Team immediately', 'Encourage the client to use the incentive spirometer', 'Reassure the client that hoarseness is expected', 'Reassess in 30 minutes'], a: 0,
  rat: 'Stridor is a late sign of a narrowed airway (laryngospasm or glottic edema). Iggy critical rescue: immediately call the Rapid Response Team and/or provider before the airway becomes completely obstructed; racemic epinephrine, a glucocorticoid, and reintubation with a smaller tube may be needed.' },

{ id: 151, type: 'mcq', cj: 'Evaluate Outcomes', topic: 'Mechanical ventilation',
  stem: 'Which statement by a client extubated this morning indicates a need for more teaching?',
  o: ['“I should talk as much as I can today to get my voice back.”', '“I’ll take deep breaths every half hour.”', '“I’ll use the incentive spirometer every 2 hours while I’m awake.”', '“I’ll stay sitting up in semi-Fowler’s position.”'], a: 0,
  rat: 'Iggy: teach semi-Fowler’s, deep breaths every half-hour, incentive spirometry every 2 hours while awake, and LIMIT speaking — this reduces laryngeal edema and vocal cord irritation.' },

{ id: 152, type: 'mcq', cj: 'Take Action', topic: 'Mechanical ventilation',
  stem: 'A confused intubated client keeps reaching for the endotracheal tube despite reorientation and a sitter’s redirection. Soft wrist restraints are ordered. Which action meets The Joint Commission requirements?',
  o: ['Reassess the need daily and obtain a new order each day the restraints continue', 'Keep the same order for the entire intubation', 'Remove the restraints only when the family visits', 'Apply restraints before trying other measures'], a: 0,
  rat: 'Iggy: confusion and agitation are the most common causes of unplanned extubation. Restraints are a last resort; reassess the need daily and obtain a new order daily (National Patient Safety Goal). Adequate sedation may be needed.' },

/* ---------- TRACHEOSTOMY ---------- */
{ id: 153, type: 'mcq', cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'A client’s tracheostomy tube comes out 24 hours after surgery, and the client is in distress. What is the nurse’s priority action?',
  o: ['Ventilate with a bag-valve-mask while another nurse calls the Rapid Response Team and the surgical team', 'Reinsert the tube immediately with the obturator', 'Insert a suction catheter into the stoma', 'Place the client flat and wait for the surgeon'], a: 0,
  rat: 'Iggy: dislodgment in the first 72 hours is an emergency — the tract is immature and the tube can enter a false passage. Ventilate with a manual resuscitation bag and facemask while another nurse calls the Rapid Response Team and the surgical service; gentle tension on stay sutures can reopen the trachea. Reinsertion with the obturator is the approach AFTER 72 hours.' },

{ id: 154, type: 'mcq', cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'The tracheostomy tube of a client 10 days after surgery is pulsating with the heartbeat, and bright red blood is pouring from the stoma. What does the nurse anticipate first?',
  o: ['Removing the tube and applying direct pressure at the stoma while preparing for emergency surgery', 'Increasing cuff pressure to stop the bleeding', 'Suctioning the blood until it clears', 'Packing gauze into the tube'], a: 0,
  rat: 'Table 26.6: tracheoinnominate artery fistula — a tube that pulsates with the heartbeat and heavy stoma bleeding. Remove the tracheostomy tube immediately, apply direct pressure to the innominate artery at the stoma, and prepare for immediate surgical repair. This is a medical emergency.' },

{ id: 155, type: 'mcq', cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'A client with a cuffed fenestrated tracheostomy tube is ready to have the tube capped. What must the nurse do before applying the decannulation cap?',
  o: ['Deflate the cuff', 'Inflate the cuff to 30 cm H2O', 'Insert the obturator', 'Connect the tube to the ventilator'], a: 0,
  rat: 'Iggy Action Alert: always deflate the cuff before capping the tube with the decannulation cap; otherwise the client has no airway.' },

{ id: 156, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'Which statement by a nursing student about the tracheostomy obturator is correct?',
  o: ['“It is used only to guide insertion and is removed right after the tube is in place.”', '“It stays inside the tube to keep the airway open.”', '“It is the removable liner that is cleaned every 8 hours.”', '“It inflates the cuff.”'], a: 0,
  rat: 'Her slide: the obturator is a rigid, blunt-tipped guide used strictly during insertion to prevent mucosal tearing and removed immediately after placement. Iggy: keep one of the correct size at the bedside. The inner cannula is the removable liner; the pilot balloon inflates the cuff.' },

{ id: 157, type: 'mcq', cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'While changing tracheostomy ties, which technique prevents accidental decannulation?',
  o: ['Keep the old ties in place until the new ties are secured', 'Remove the old ties first so the new ones lie flat', 'Tie the new ties loosely enough to fit three fingers', 'Remove the inner cannula before changing ties'], a: 0,
  rat: 'Iggy Action Alert: keep the old ties or holder on while applying new ones, or keep a hand on the tube, ideally with a coworker. A properly secured tie allows only one finger between the tie and the neck.' },

{ id: 158, type: 'mcq', cj: 'Recognize Cues', topic: 'Tracheostomy',
  stem: 'Which finding best indicates that a client with a tracheostomy needs suctioning?',
  o: ['Coarse crackles heard over the trachea', 'Last suctioned 3 hours ago', 'Temperature 101°F (38.3°C)', 'Serous drainage on the dressing'], a: 0,
  rat: 'Iggy: the most common indicator of the need for suctioning is coarse crackles over the trachea; others are noisy secretions, restlessness, rising pulse or RR, visible mucus, or a rising peak pressure. Her slide: suction by assessment cues, never on a schedule. Fever and serous drainage are not suction cues.' },

{ id: 159, type: 'mcq', cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'Which action by a new graduate nurse suctioning a tracheostomy requires the preceptor to intervene?',
  o: ['Instills 5 mL of normal saline into the tube before suctioning', 'Preoxygenates with 100% oxygen', 'Applies suction only while withdrawing the catheter', 'Limits each pass to 10 seconds'], a: 0,
  rat: 'Box 26.13: routine instillation of normal saline is not supported — it impairs gas exchange and raises infection risk. Preoxygenation, suction only on withdrawal (continuous, with twirling), and 10–15 seconds maximum are correct.' },

{ id: 160, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'While the nurse suctions a client’s tracheostomy, the heart rate drops from 88 to 44 and the BP falls. What is the nurse’s immediate action?',
  o: ['Stop suctioning and manually oxygenate with 100% oxygen', 'Finish the pass quickly, then give oxygen', 'Instruct the client to cough forcefully', 'Raise the client to high-Fowler’s position'], a: 0,
  rat: 'Her ARS 3 and Iggy: vagal stimulation during suctioning causes bradycardia, hypotension, heart block, ventricular tachycardia, or other dysrhythmias. Stop suctioning immediately and oxygenate manually with 100% oxygen.' },

{ id: 161, type: 'mcq', lec: true, cj: 'Generate Solutions', topic: 'Tracheostomy',
  stem: 'A client with a tracheostomy has just finished lunch. Which instruction does the nurse give to prevent aspiration?',
  o: ['Keep the head of the bed elevated for at least 30 minutes', 'Lie flat for 30 minutes to rest', 'Drink thin liquids through a straw to clear the throat', 'Inflate the cuff fully during every meal'], a: 0,
  rat: 'Her slide and Iggy: keep the head of the bed elevated at least 30 minutes after eating. Box 26.12: avoid thin liquids and straws; when possible deflate (not inflate) the cuff during meals because an inflated cuff can press on the esophagus.' },

{ id: 162, type: 'mcq', cj: 'Take Action', topic: 'Delegation',
  stem: 'The nurse is caring for a stable client with a long-term tracheostomy. Which task is appropriate to delegate to assistive personnel?',
  o: ['Provide mouth care with a soft toothbrush moistened in water', 'Assess breath sounds before and after suctioning', 'Teach the spouse how to clean the inner cannula', 'Evaluate the stoma for signs of infection'], a: 0,
  rat: '[Delegation principles are background from fundamentals.] Hygiene for a stable client is within the scope of assistive personnel; Iggy specifies a soft-bristle toothbrush or sponge moistened in water (no alcohol mouthwash or glycerin). Assessment, teaching, and evaluation are RN responsibilities.' },

/* ---------- CHEST TRAUMA ---------- */
{ id: 163, type: 'mcq', cj: 'Generate Solutions', topic: 'Chest trauma',
  stem: 'A client with three uncomplicated rib fractures takes shallow breaths and refuses to cough. Which nursing action best prevents pneumonia?',
  o: ['Give the prescribed analgesic so the client can deep breathe and cough', 'Tape the chest wall to stabilize the ribs', 'Keep the client flat in bed to rest the ribs', 'Hold opioids to avoid respiratory depression'], a: 0,
  rat: 'Iggy and her slide: fractured ribs heal on their own and are not taped; the main focus is decreasing pain so ventilation stays adequate and atelectasis and pneumonia are prevented. Opioids are effective (monitor for respiratory depression); nerve blocks, NSAIDs, epidurals, and patient-controlled analgesia are options.' },

{ id: 164, type: 'mcq', cj: 'Take Action', topic: 'Chest trauma',
  stem: 'The provider is preparing to treat a client with a tension pneumothorax. Where does the nurse expect the initial large-bore needle to be inserted?',
  o: ['Second intercostal space, midclavicular line, on the affected side', 'Fourth intercostal space, midaxillary line, on the unaffected side', 'Fifth intercostal space at the sternal border', 'Directly over the trachea'], a: 0,
  rat: 'Iggy: immediate needle decompression with a 14- to 16-gauge needle into the 2nd intercostal space, midclavicular line, of the affected side changes a tension pneumothorax to a simple pneumothorax. A chest tube is then placed in the 4th or 5th intercostal space to water seal.' },

{ id: 165, type: 'mcq', cj: 'Recognize Cues', topic: 'Chest trauma',
  stem: 'A client with a hemothorax had 600 mL of drainage when the chest tube was placed. Which subsequent finding requires the nurse to notify the surgeon about a possible thoracotomy?',
  o: ['Drainage of 180 mL/hr for the past 3 hours', 'Drainage of 40 mL in the past hour', 'Tidaling in the water seal chamber', 'Pain 5/10 at the insertion site'], a: 0,
  rat: 'Iggy: open thoracotomy is needed for an initial blood loss of 1000 mL or persistent bleeding of 150–200 mL/hr over 3–4 hours. Ch. 24 also lists drainage above 70 mL/hr as a reason to notify. Tidaling is expected; insertion pain is managed.' },

{ id: 166, type: 'mcq', cj: 'Take Action', topic: 'Chest trauma',
  stem: 'A client’s chest tube falls out while the client is repositioning. What is the nurse’s first action?',
  o: ['Cover the site with dry sterile gauze', 'Reinsert the tube', 'Place the tube end in sterile water', 'Clamp the drainage system'], a: 0,
  rat: 'Ch. 24 chest tube box: if the chest tube falls out, first cover the area with dry, sterile gauze, then notify the surgeon or Rapid Response Team. Placing the tube end in sterile water is for a DISCONNECTION from the drainage system. Nurses do not reinsert chest tubes.' },

{ id: 167, type: 'mcq', lec: true, cj: 'Recognize Cues', topic: 'Chest trauma',
  stem: 'A client was in a high-speed car crash. Which assessment finding is most consistent with flail chest?',
  o: ['A section of the chest wall sinks in during inspiration and bulges out during expiration', 'Both sides of the chest rise equally with deep breaths', 'A dull sound when the injured side is percussed', 'Bruising over the sternum with clear breath sounds'], a: 0,
  rat: 'Her slide: flail chest = 3 or more adjacent ribs fractured in 2 or more places, causing paradoxical motion — inward on inspiration, outward on expiration. Dullness suggests hemothorax.' },

{ id: 168, type: 'mcq', cj: 'Recognize Cues', topic: 'Chest trauma',
  stem: 'A client was admitted 2 hours ago after a car crash with a bruise across the chest. Breath sounds were clear on arrival. Which finding now requires follow-up because it suggests a developing pulmonary contusion?',
  o: ['New crackles and wheezes over the bruised area with rising RR', 'Pain 4/10 at the bruise', 'SpO2 97% on room air', 'Heart rate 82'], a: 0,
  rat: 'Iggy and her slide: pulmonary contusion may be asymptomatic at first, then decreased breath sounds or crackles and wheezes over the area, tachypnea, tachycardia, and dyspnea develop — respiratory failure can develop over time.' },

/* ---------- PRIORITY / DELEGATION / ETHICS ---------- */
{ id: 169, type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Priority',
  stem: 'The nurse receives report on four clients. Which client should the nurse see first?',
  o: ['A client extubated 30 minutes ago who has new high-pitched noisy breathing on inspiration', 'A client on heparin with an aPTT of 2.4 times control and a small bruise at a lab draw site', 'A client 5 days after tracheostomy with thick secretions and SpO2 93%', 'A client with two rib fractures who reports pain 7/10 and is splinting'], a: 0,
  rat: 'Every client has an abnormal finding, but stridor after extubation is a late sign of airway narrowing that can progress to complete obstruction — airway first. The aPTT is therapeutic and a small bruise is minor; the tracheostomy client needs suctioning soon; the rib-fracture client needs analgesia soon. Neither is losing an airway.' },

{ id: 170, type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Priority',
  stem: 'Which client should the nurse assess first?',
  o: ['A client 1 day after tracheostomy whose neck skin is puffy and crackles when pressed', 'A client on a ventilator whose oral endotracheal tube was moved to the other side of the mouth this morning', 'A client 3 days after a pulmonary embolism with INR 1.8 on warfarin and heparin', 'A client with severe COVID-19 lying prone with SpO2 93%'], a: 0,
  rat: 'Subcutaneous emphysema around a new tracheostomy means air is escaping through a tear and can track into the neck and chest — Iggy says notify the surgeon immediately. Moving the oral tube every 24 hours is routine; an INR below 2 is expected while heparin continues; SpO2 93% in a prone severe COVID-19 client is acceptable and being treated.' },

{ id: 171, type: 'mcq', cj: 'Take Action', topic: 'Psychosocial / ethics',
  stem: 'A client is likely to remain ventilator dependent. The client’s advance directive refuses long-term ventilation, but a son insists on continuing it. What is the nurse’s most appropriate action?',
  o: ['Support a plan based on the client’s verified wishes and involve the ethics committee as needed', 'Follow the son’s request because family members make the final decision', 'Avoid discussing it with the family until the client can decide', 'Tell the son that the nurse will decide what is best'], a: 0,
  rat: 'Iggy Legal/Ethical box: family always has input, but the most ethical plan supports the client’s verified wishes; advance directives guide decisions. Collaborate with the ethics committee, provider, social worker, and clergy; the nurse confirms understanding, ensures no coercion, and supports the family.' },

{ id: 172, type: 'mcq', cj: 'Recognize Cues', topic: 'Mechanical ventilation',
  stem: 'A 79-year-old ventilated client with chronic obstructive pulmonary disease is being weaned. Which finding is the best early indicator that gas exchange is worsening in this client?',
  o: ['New confusion and restlessness', 'Cyanosis of the lips', 'Clubbing of the fingers', 'Barrel chest'], a: 0,
  rat: 'Iggy Older Adult box: hypoxemia and hypercarbia may be less obvious in older adults — use other measures such as a change in mental status. Cyanosis is a late sign; clubbing and barrel chest are chronic obstructive pulmonary disease findings.' },

/* ---------- LECTURE CASE (her slides) ---------- */
{ id: 173, type: 'mcq', lec: true, cj: 'Analyze Cues', topic: 'Pulmonary embolism',
  stem: 'A client 5 days after hysterectomy has stayed in bed since discharge. BP 80/44, HR 130, RR 28 and labored, SpO2 86% on room air, bilateral crackles, and petechiae across the upper chest and axillae. Which condition does the nurse anticipate?',
  o: ['Pulmonary embolism', 'Postoperative pneumonia', 'Acute coronary syndrome', 'Hypovolemia from surgical bleeding'], a: 0,
  rat: 'Her case Q2: pulmonary embolism. Pneumonia is an important differential (immobility, bilateral crackles), but her key states petechiae and severe tachycardia point heavily to pulmonary embolism. Note: Iggy says petechiae are usually seen with fat embolism; on her exam, use her slide.' },

{ id: 174, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Pulmonary embolism',
  stem: 'Same client. Orders: oxygen 2 L by nasal cannula; stat CBC, BMP, D-dimer, aPTT, INR; stat CT of the chest; insert saline lock. Which order does the nurse complete first?',
  o: ['Oxygen 2 L by nasal cannula', 'Stat D-dimer and coagulation studies', 'Stat CT of the chest', 'Insert a saline lock'], a: 0,
  rat: 'Her case Q3: oxygen. She is hypoxemic at 86% on room air — gas exchange first. Access, labs, and imaging follow immediately.' },

{ id: 175, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Pulmonary embolism',
  stem: 'Same client. In the treatment bay she says she needs to use the bathroom. What is the safest action?',
  o: ['Place her on a bedpan and stay with her', 'Walk her to the bathroom with a gait belt', 'Remove the oxygen so she can walk to the bathroom more easily', 'Ask her to wait until the CT scan is finished'], a: 0,
  rat: 'Her case Q4: place her on a bedpan and stay with her. She is too short of breath to walk and must stay on continuous oxygen; walking or stopping oxygen increases the risk of immediate cardiovascular collapse. Making her wait ignores a basic need.' },

{ id: 176, type: 'mcq', lec: true, cj: 'Evaluate Outcomes', topic: 'Pulmonary embolism drugs',
  stem: 'Same client is started on a weight-based heparin infusion. Which finding indicates the infusion is therapeutic?',
  o: ['aPTT 1.5 to 2.5 times the control value', 'INR 2 to 3', 'Platelet count above 150,000/mm³', 'D-dimer below the reference range'], a: 0,
  rat: 'Her case Q5: aPTT 1.5–2.5 times control. INR 2–3 is the warfarin target. Platelets are monitored for heparin-induced thrombocytopenia, not effectiveness.' },

{ id: 177, type: 'sata', lec: true, cj: 'Recognize Cues', topic: 'Pulmonary embolism',
  stem: 'Which clients have risk factors for venous thromboembolism and pulmonary embolism? Select all that apply.',
  o: ['A client with a central venous catheter for chemotherapy', 'A client who smokes and takes oral contraceptives', 'A client who gave birth 6 weeks ago', 'A client with factor V Leiden', 'A 30-year-old marathon runner with a BMI of 21', 'A client with seasonal allergies', 'A client admitted for an ankle sprain who walks independently'], a: [0, 1, 2, 3],
  rat: 'Iggy and her slide: central venous catheters, smoking with estrogen (oral contraceptives, hormone replacement therapy), pregnancy and up to 3 months postpartum, and thrombophilia such as factor V Leiden (3–5 times the risk). Normal weight, activity, allergies, and independent walking are not risk factors.' },

{ id: 178, type: 'sata', cj: 'Take Action', topic: 'Pulmonary embolism',
  stem: 'A client has a suspected pulmonary embolism. Which actions will the nurse take? Select all that apply.',
  o: ['Raise the head of the bed to high-Fowler’s position', 'Start continuous pulse oximetry', 'Check the position of the trachea', 'Compare blood pressure in both arms', 'Stay with the client and provide reassurance', 'Massage the calf to locate the clot', 'Place the client flat to improve blood pressure'], a: [0, 1, 2, 3, 4],
  rat: 'Box 26.3: oxygen; reassure; high-Fowler’s; telemetry; IV access; continuous pulse oximetry; lung sounds; trachea position; compare BP in both arms; neck veins; labs; petechiae; anticoagulants; bleeding precautions. Never massage the legs. Lying flat worsens dyspnea.' },

{ id: 179, type: 'sata', cj: 'Recognize Cues', topic: 'Pulmonary embolism drugs',
  stem: 'A client is receiving heparin and warfarin. Which findings would the nurse report as possible bleeding? Select all that apply.',
  o: ['Bleeding gums after brushing', 'Black, tarry stool', 'Pink-tinged urine', 'New abdominal pain with distension', 'Mild bruise at an injection site from yesterday that is fading', 'Clubbing of the fingers'], a: [0, 1, 2, 3],
  rat: 'Iggy bleeding assessment: gums, puncture sites, skin (petechiae, bruising), stool, urine, emesis, and the abdomen for pain or distension. A small fading bruise is minor and expected with subcutaneous injections; clubbing is a chronic hypoxia finding.' },

{ id: 180, type: 'sata', lec: true, cj: 'Generate Solutions', topic: 'Pulmonary embolism drugs',
  stem: 'Which points will the nurse include in discharge teaching for a client starting warfarin? Select all that apply.',
  o: ['Keep every follow-up INR appointment', 'Report bruising or bleeding right away', 'Keep vitamin K intake consistent from day to day', 'Use a soft-bristle toothbrush', 'Shave with an electric razor', 'Stop eating all green leafy vegetables', 'Take a double dose if a dose is missed'], a: [0, 1, 2, 3, 4],
  rat: 'Her case Q6: INR follow-up, report bruising or bleeding, consistent (not zero) vitamin K, soft-bristle toothbrush, electric razor. Eliminating greens makes INR unstable; doubling doses raises bleeding risk [background].' },

{ id: 181, type: 'sata', cj: 'Recognize Cues', topic: 'Acute respiratory failure',
  stem: 'Which findings does the nurse expect in a client with early hypoxemic respiratory failure? Select all that apply.',
  o: ['Restlessness', 'Irritability', 'Tachycardia', 'Tachypnea', 'Bradycardia', 'Flushed skin', 'Cyanosis as the first sign'], a: [0, 1, 2, 3],
  rat: 'Iggy: hypoxemic respiratory failure — restlessness, irritability or agitation, fatigue, confusion, tachycardia, tachypnea, and cyanosis as a LATE sign. Flushed skin is a hypercapnia finding; bradycardia is an acidosis effect.' },

{ id: 182, type: 'sata', cj: 'Analyze Cues', topic: 'Acute respiratory distress syndrome',
  stem: 'Which features define acute respiratory distress syndrome? Select all that apply.',
  o: ['Hypoxemia that persists on 100% oxygen', 'Decreased lung compliance', 'Bilateral ground-glass infiltrates', 'Enlarged heart on chest x-ray', 'Hypoxemia that corrects with a nonrebreather mask', 'Pulmonary edema caused by left-sided heart failure'], a: [0, 1, 2],
  rat: 'Iggy: refractory hypoxemia (cardinal), decreased pulmonary compliance (stiff lungs), dyspnea, noncardiac bilateral pulmonary edema, and dense bilateral ground-glass infiltrates. The heart is not enlarged, and the edema is not cardiac; an ECG rules out a cardiac cause.' },

{ id: 183, type: 'sata', cj: 'Generate Solutions', topic: 'Mechanical ventilation',
  stem: 'Which nursing actions are part of the ventilator bundle to prevent ventilator-associated pneumonia? Select all that apply.',
  o: ['Keep the head of the bed at least 30 degrees', 'Brush teeth with a suction toothbrush at least every 12 hours', 'Use chlorhexidine oral rinse', 'Assess daily for readiness to extubate', 'Keep cuff pressure 20–30 cm H2O', 'Instill saline before each suctioning pass', 'Keep the client deeply sedated to prevent tube movement'], a: [0, 1, 2, 3, 4],
  rat: 'Iggy bundle: head of bed at least 30 degrees, oral care (suction toothbrush at least every 12 hours with an antimicrobial rinse; her slide: chlorhexidine), ulcer prophylaxis, aspiration prevention, subglottic suctioning, pulmonary hygiene, MINIMIZE sedation, daily assessment for extubation, cuff pressure 20–30 cm H2O. Routine saline instillation is not supported.' },

{ id: 184, type: 'sata', cj: 'Analyze Cues', topic: 'Mechanical ventilation',
  stem: 'Which situations would trigger a ventilator high-pressure alarm? Select all that apply.',
  o: ['A mucus plug in the endotracheal tube', 'The client lying on kinked ventilator tubing', 'A pneumothorax', 'Disconnection of the tubing from the endotracheal tube', 'A leak in the endotracheal tube cuff', 'The client stops breathing spontaneously in SIMV'], a: [0, 1, 2],
  rat: 'Table 26.4: high-pressure — secretions/mucus plug, biting, fighting the ventilator, bronchospasm, pneumothorax, right mainstem displacement, kinks or water in the tubing, decreased compliance. Disconnection, cuff leak, and stopping spontaneous breathing trigger the low exhaled volume alarm.' },

{ id: 185, type: 'sata', cj: 'Generate Solutions', topic: 'Severe COVID-19',
  stem: 'Which actions are appropriate for a client with critical COVID-19? Select all that apply.',
  o: ['Perform intubation in an airborne infection isolation room', 'Use a metered-dose inhaler instead of a nebulizer', 'Give venous thromboembolism prophylaxis unless contraindicated', 'Identify a health care surrogate on admission', 'Place the phone and call light within reach', 'Use droplet precautions only during intubation', 'Hold anticoagulants because of bleeding risk from the virus'], a: [0, 1, 2, 3, 4],
  rat: 'Iggy: aerosolizing procedures in an airborne (negative-pressure) room with full airborne and contact protection including eye protection; metered-dose inhaler preferred; thromboprophylaxis because COVID-19 is hypercoagulable; advance care planning and a surrogate on admission; reduce isolation with phone, call light, updates, and video calls.' },

{ id: 186, type: 'sata', cj: 'Generate Solutions', topic: 'Tracheostomy',
  stem: 'Which products are appropriate for oral care for a client with a tracheostomy? Select all that apply.',
  o: ['A sponge tooth cleaner moistened in water', 'A soft-bristle toothbrush moistened in water', 'Alcohol-based mouthwash', 'Glycerin swabs', 'Full-strength hydrogen peroxide rinses every 2 hours'], a: [0, 1],
  rat: 'Iggy and her slide: use a sponge tooth cleaner or soft-bristle toothbrush moistened in water. Avoid glycerin swabs and alcohol mouthwash — they dry the mouth, change its pH, and promote bacterial growth. Diluted hydrogen peroxide only if ordered (it can break down healing tissue).' },

{ id: 187, type: 'sata', cj: 'Generate Solutions', topic: 'Tracheostomy',
  stem: 'A client is going home with a permanent tracheostomy. Which teaching points will the nurse include? Select all that apply.',
  o: ['Use a shower shield over the tube when bathing', 'Wear a medical alert bracelet stating that you cannot speak', 'Increase humidity in the home', 'Sterile technique is required for suctioning at home', 'Keep the stoma uncovered at all times', 'Use alcohol mouthwash to prevent infection'], a: [0, 1, 2],
  rat: 'Iggy: shower shield; loosely cover the stoma with a small cotton cloth (filters air, keeps humidity); increase home humidity; medical alert bracelet. Clean technique can be used at home. Alcohol mouthwash dries the mouth.' },

{ id: 188, type: 'sata', cj: 'Take Action', topic: 'Chest trauma',
  stem: 'Which interventions are appropriate for a client with flail chest? Select all that apply.',
  o: ['Give humidified oxygen', 'Manage pain with IV, epidural, or nerve block analgesia', 'Encourage deep breathing and position for lung expansion', 'Suction secretions as needed', 'Tape the chest wall to stop the paradoxical motion', 'Restrict all analgesics to protect the respiratory drive'], a: [0, 1, 2, 3],
  rat: 'Iggy: humidified oxygen, pain management, lung expansion through deep breathing and positioning, secretion clearance by coughing and tracheal suction; positive-pressure ventilation if respiratory failure or shock develops. The chest wall is not taped; surgical stabilization only in extreme cases.' },

{ id: 189, type: 'sata', cj: 'Recognize Cues', topic: 'Chest trauma',
  stem: 'Which findings support a left tension pneumothorax? Select all that apply.',
  o: ['Trachea deviated to the right', 'Distended neck veins', 'Hypotension', 'Absent breath sounds on the left', 'Hyperresonance on the left', 'Dull percussion on the left', 'Trachea deviated to the left'], a: [0, 1, 2, 3, 4],
  rat: 'Iggy: pneumothorax — reduced or absent breath sounds and hyperresonance on the affected side; when severe, the trachea shifts AWAY from the injury toward the unaffected side. Tension adds extreme distress, cyanosis, distended neck veins, tachycardia, and hypotension. Dullness = hemothorax.' },

{ id: 190, type: 'sata', cj: 'Analyze Cues', topic: 'Chest trauma',
  stem: 'Which findings in a client with rib fractures suggest a deep chest injury and a poorer prognosis? Select all that apply.',
  o: ['Fractures of the first or second ribs', 'Seven or more fractured ribs', 'A flail chest', 'A single fractured rib with pain 6/10', 'Bruising over the fracture site'], a: [0, 1, 2],
  rat: 'Iggy: clients with injuries to the first or second ribs, flail chest, seven or more fractured ribs, or expired volumes below 15 mL/kg often have a deep chest injury and a poor prognosis.' },

{ id: 191, type: 'sata', lec: true, cj: 'Recognize Cues', topic: 'Pulmonary embolism',
  stem: 'Her case: a 61-year-old 5 days after hysterectomy, in bed since discharge, now short of breath. Which venous thromboembolism risk factors does the nurse identify? Select all that apply.',
  o: ['Prolonged immobility', 'Advancing age', 'Recent major surgery', 'Temperature of 99.4°F', 'Bilateral crackles', 'Female sex'], a: [0, 1, 2],
  rat: 'Her case Q1 key: prolonged immobility, advancing age, and recent major surgery (hysterectomy 5 days ago). A low-grade temperature and crackles are assessment findings, not risk factors.' },

{ id: 192, type: 'sata', cj: 'Recognize Cues', topic: 'Mechanical ventilation',
  stem: 'A ventilated client’s SpO2 drops to 84% and end-tidal CO2 rises. Using DOPE, what will the nurse check? Select all that apply.',
  o: ['Whether the tube is displaced', 'Whether the tube is obstructed with secretions', 'Signs of a pneumothorax', 'Problems with the ventilator equipment', 'The client’s last bowel movement', 'Whether the client ate breakfast'], a: [0, 1, 2, 3],
  rat: 'Iggy critical rescue: with cyanosis, falling SpO2, rising end-tidal CO2, or anxiety, check DOPE — Displaced tube, Obstructed tube (most often secretions), Pneumothorax, Equipment problems.' },
/* ---------- FROM CLASS (lecture transcript, Ch. 26) ---------- */
{ id: 193, type: 'mcq', lec: true, cj: 'Evaluate Outcomes', topic: 'Mechanical ventilation',
  stem: 'A client was just extubated. How often will the nurse reassess the client’s breathing pattern for respiratory distress or stridor at first?',
  o: ['Every 5 minutes', 'Every 30 minutes', 'Every 3 hours', 'Once per shift'], a: 0,
  rat: 'Her slide and Iggy: after extubation, monitor vital signs every 5 minutes at first and assess for respiratory distress and stridor. In class she said the question will ask HOW OFTEN — the answer is every 5 minutes.' },

{ id: 194, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Pulmonary embolism',
  stem: 'A client becomes suddenly short of breath with SpO2 86% on room air. There is no oxygen order. What will the nurse do?',
  o: ['Apply oxygen and contact the provider for an order at the same time', 'Wait for the provider to return the call before applying oxygen', 'Apply oxygen; an order is not needed because oxygen is not a drug', 'Apply oxygen for 2 hours, then remove it if the client is comfortable'], a: 0,
  rat: 'In class: oxygen requires an order and is not a standing order at most facilities — but you never let a hypoxemic client wait. Put the oxygen on based on your assessment and obtain the order at the same time. Removing it on your own schedule without an order is not acceptable.' },

{ id: 195, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Priority',
  stem: 'A client’s daughter sees her father suddenly struggling to breathe while the nurse is in another room. She asks the nurse later, “Was I allowed to call the Rapid Response Team myself?” What is the nurse’s best response?',
  o: ['“Yes. Anyone, including family members, can call a rapid response.”', '“No. Only the registered nurse can activate the team.”', '“No. Only a physician can call a rapid response.”', '“Only if the nurse cannot be found within 10 minutes.”'], a: 0,
  rat: 'In class: anyone can call a rapid response — family, visitors, patient care technicians. The team brings more people faster and speeds up testing.' },

{ id: 196, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Priority',
  stem: 'The Rapid Response Team arrives and asks the nurse why the team was called. Which report is best?',
  o: ['“His SpO2 dropped from 95% to 82%, respirations are 34, and he is newly confused.”', '“He just doesn’t look right to me.”', '“He was eating breakfast and then he seemed off.”', '“I’m not sure, but the family was worried.”'], a: 0,
  rat: 'In class: know why you are calling and give OBJECTIVE information — measurable findings — not subjective impressions.' },

{ id: 197, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Pulmonary embolism drugs',
  stem: 'A client with a pulmonary embolism is to start a weight-based heparin infusion. Which action is most important before the nurse programs the pump?',
  o: ['Verify the client’s current, accurate weight and compare it with previous weights', 'Draw a D-dimer level', 'Check the client’s INR', 'Ask the client to rate chest pain'], a: 0,
  rat: 'In class: heparin is weight-based, and a weight that is off by even 5–15 pounds can over- or under-anticoagulate the client. Check the weight, and look back at prior weights, before you start. Heparin is a high-alert drug (National Patient Safety Goal).' },

{ id: 198, type: 'mcq', lec: true, cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'A confused client pulls out the tracheostomy tube and throws it on the floor. There is no emergency tracheostomy kit at the bedside. What is the nurse’s priority action?',
  o: ['Call the Rapid Response Team', 'Rinse the tube with sterile saline and reinsert it', 'Leave the room to find a tracheostomy kit', 'Wait for the surgeon to make rounds'], a: 0,
  rat: 'In class: nurses do not insert tracheostomies, and a tube from the floor is never reinserted. If no emergency kit is at the bedside, do not run down the hall looking for one — call a rapid response. (Iggy: ventilate with a bag-valve-mask while another person calls; keep a spare tube and obturator at the bedside at all times.)' },

{ id: 199, type: 'mcq', lec: true, cj: 'Generate Solutions', topic: 'Mechanical ventilation',
  stem: 'A new nurse wants to start chlorhexidine oral rinses for a ventilated client because “it prevents ventilator-associated pneumonia.” What should the preceptor tell the new nurse?',
  o: ['“Chlorhexidine needs a prescription, usually through the ventilator bundle order set.”', '“Any antiseptic mouthwash can be used without an order.”', '“Oral care is not part of pneumonia prevention.”', '“Use alcohol-based mouthwash instead; it kills more bacteria.”'], a: 0,
  rat: 'In class: you need an order for chlorhexidine. Iggy: chlorhexidine oral rinse reduces ventilator-associated pneumonia and is part of the bundle; alcohol mouthwash dries the mouth and promotes bacterial growth.' },

{ id: 200, type: 'sata', lec: true, cj: 'Generate Solutions', topic: 'Pulmonary embolism',
  stem: 'A client is on bed rest after abdominal surgery. Which actions help prevent deep vein thrombosis and pulmonary embolism? Select all that apply.',
  o: ['Sequential compression devices', 'Ankle pumps and range-of-motion exercises', 'Enoxaparin as prescribed while not ambulating', 'Ambulation as soon as it is ordered', 'A pillow under the knees for comfort', 'Massaging the calves to improve circulation'], a: [0, 1, 2, 3],
  rat: 'In class: circulation, compression, ambulation — and if they cannot walk, anticoagulants (enoxaparin is usual until the client is up and moving) with sequential compression devices. Box 26.1: no pillow under the knees and never massage the legs.' }
];

{ id: 314, type: 'mcq', cj: 'Take Action', topic: 'Drip rates',

{ id: 318, type: 'mcq', cj: 'Take Action', topic: 'Dosage',

  o: ['80 kg', '387 kg', '88 kg', '70 kg'], a: 0,

{ id: 319, type: 'mcq', cj: 'Take Action', topic: 'Dosage',
