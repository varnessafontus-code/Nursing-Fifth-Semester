const QH = [
/* ===== CHAPTER 26 ===== */
{ id: 401, hl: true, ch: 26, bloom: 'Evaluate', type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Priority',
  stem: 'Which client should the nurse see first?',
  o: ['Day 2 after hip replacement: HR 118, RR 28, restless, says “something bad is happening”', 'Chronic obstructive pulmonary disease: SpO2 89% on 2 L, baseline 88–90%', 'Heparin infusion: aPTT 2.6 times control, no bleeding noted', 'Three rib fractures: pain 7/10, splinting, due for an analgesic in 20 minutes'], a: 0,
  rat: 'Every client is abnormal. The post-op orthopedic client has new tachycardia, tachypnea, restlessness, and a sense of impending doom — the Box 26.2 picture of pulmonary embolism, which is acute and unstable (Iggy: begin management before diagnostics are done). The COPD saturation is at baseline (chronic, stable). An aPTT slightly above range is adjusted by protocol and there is no bleeding. Rib pain matters for ventilation but is not a life threat right now.' },

{ id: 402, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues (Trend)', topic: 'Pulmonary embolism',
  stem: 'A client with a confirmed pulmonary embolism had an arterial blood gas at 0800 of pH 7.48, PaCO2 30 mm Hg, HCO3 24. At 1100: pH 7.31, PaCO2 52 mm Hg, HCO3 24. The client is drowsier. What is the best interpretation?',
  o: ['Worsening gas exchange — shunting is now causing carbon dioxide retention', 'Improvement — the alkalosis has resolved', 'Metabolic compensation for the earlier alkalosis', 'An expected effect of the heparin infusion'], a: 0,
  rat: 'Iggy: pulmonary embolism first causes respiratory alkalosis (low PaCO2 from hyperventilation); as shunting worsens, PaCO2 rises and respiratory acidosis develops — a sign of deterioration, made clear by the falling level of consciousness (a hypercapnia sign). The HCO3 is unchanged, so there is no metabolic process. A pH moving through normal on the way to acidosis is not improvement.' },

{ id: 404, hl: true, ch: 26, bloom: 'Create', type: 'mcq', cj: 'Generate Solutions', topic: 'Pulmonary embolism',
  stem: 'The nurse is writing the plan of care for a client admitted 1 hour ago with a pulmonary embolism. HR 124, SpO2 88% on 4 L, BP 98/60. Which expected outcome has the highest priority?',
  o: ['Maintains SpO2 of at least 90% with unlabored breathing', 'Remains free of bleeding while on anticoagulants', 'States three ways to prevent venous thromboembolism at home', 'Walks in the hallway three times a day'], a: 0,
  rat: 'Iggy’s three outcomes for pulmonary embolism: adequate gas exchange, no hypovolemia/shock, no bleeding. Gas exchange comes first (airway/breathing). Bleeding prevention is a real but potential problem; teaching and ambulation come later — ambulation is unsafe while hypoxemic (her case Q4).' },

{ id: 405, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Pulmonary embolism',
  stem: 'A client with a pulmonary embolism has BP 112/70 (stable for 6 hours), elevated troponin and BNP, and right ventricular dilation on imaging. How does the nurse classify this pulmonary embolism, and what treatment is anticipated?',
  o: ['Submassive; anticoagulation with close monitoring', 'Massive; immediate systemic thrombolysis', 'Nonmassive; discharge on an oral anticoagulant today', 'Massive; inferior vena cava filter instead of anticoagulation'], a: 0,
  rat: 'Table 26.2: massive = SBP below 90 for at least 15 minutes (systemic thrombolysis); submassive = normal BP but right ventricular dysfunction or elevated BNP/troponin; nonmassive = no right ventricular strain. An inferior vena cava filter is for clients who cannot receive anticoagulation or who clot despite it.' },

{ id: 406, hl: true, ch: 26, bloom: 'Evaluate', type: 'sata', cj: 'Evaluate Outcomes', topic: 'Pulmonary embolism drugs',
  stem: 'A client is on day 6 of a heparin infusion with warfarin. Which findings require the nurse to follow up? Select all that apply.',
  o: ['aPTT 3.4 times control', 'Platelet count fell from 250,000 to 95,000/mm³', 'Black, tarry stool', 'New abdominal pain with distension', 'INR 2.4', 'Small fading bruise at yesterday’s blood draw site'], a: [0, 1, 2, 3],
  rat: 'aPTT therapeutic range is 1.5–2.5 times control (Ch. 30) — 3.4 is supratherapeutic. A large platelet drop on heparin suggests heparin-induced thrombocytopenia (Iggy names it as a risk and a reason to prefer low-molecular-weight heparin). Tarry stool and abdominal pain/distension are Iggy bleeding cues. INR 2.4 is in the 2–3 target (heparin can stop once INR > 2 for 24 hours). A small fading bruise is minor.' },

{ id: 407, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Acute respiratory failure',
  stem: 'A post-op client using opioid patient-controlled analgesia has RR 8, SpO2 94% on 3 L by nasal cannula, end-tidal CO2 58 mm Hg, and is hard to arouse. Which conclusion is best supported?',
  o: ['Ventilatory failure; the oxygen is masking the problem on pulse oximetry', 'Oxygenation failure from a pulmonary embolism', 'Adequate gas exchange because SpO2 is above 92%', 'Expected postoperative sleepiness'], a: 0,
  rat: 'Iggy: end-tidal CO2 may be more valuable than pulse oximetry — SpO2 can look adequate while CO2 rises toward failure. Opioids are an extrapulmonary cause of ventilatory (hypercapnic) failure (her ARS 2); decreased level of consciousness is a hypercapnia sign. Supplemental oxygen keeps SpO2 up even while ventilation fails.' },

{ id: 408, hl: true, ch: 26, bloom: 'Evaluate', type: 'mcq', cj: 'Take Action', topic: 'Acute respiratory distress syndrome',
  stem: 'A client with sepsis has SpO2 85% on a 100% nonrebreather mask, RR 36, retractions, and bilateral infiltrates with a normal heart size. The provider says, “Increase the oxygen flow and recheck in an hour.” What is the nurse’s best response?',
  o: ['Request evaluation for intubation and mechanical ventilation with PEEP', 'Increase the oxygen flow and recheck in 1 hour', 'Give furosemide for cardiogenic pulmonary edema', 'Place the client flat to reduce the work of breathing'], a: 0,
  rat: 'Hypoxemia that persists on 100% oxygen is refractory hypoxemia — the cardinal feature of acute respiratory distress syndrome (sepsis is the most common cause). More oxygen will not correct a shunt. Iggy: the client often needs intubation and mechanical ventilation with PEEP. Normal heart size argues against cardiogenic edema; upright positioning eases breathing.' },

{ id: 409, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Mechanical ventilation',
  stem: 'A client with acute respiratory distress syndrome on PEEP 14 cm H2O suddenly has a high-pressure alarm, absent breath sounds on the left, the trachea shifted to the right, and BP 78/48. Which mechanism best explains these findings?',
  o: ['Barotrauma causing a tension pneumothorax', 'Endotracheal tube in the right mainstem bronchus', 'A mucus plug in the endotracheal tube', 'Disconnection of the ventilator circuit'], a: 0,
  rat: 'Iggy: barotrauma (pressure injury) can rupture alveoli and cause pneumothorax; PEEP raises the risk, so lung sounds are checked hourly. Tracheal shift away from the silent side plus hypotension = tension pneumothorax. A right mainstem tube does not shift the trachea or drop BP this way; a mucus plug causes high pressure without tracheal deviation; a disconnection triggers the LOW exhaled volume alarm.' },

{ id: 410, hl: true, ch: 26, bloom: 'Create', type: 'sata', cj: 'Generate Solutions', topic: 'Acute respiratory distress syndrome',
  stem: 'The nurse is planning prone positioning for a ventilated client with moderate acute respiratory distress syndrome. Which actions belong in the plan? Select all that apply.',
  o: ['Have at least four staff members coordinate the turn', 'Secure the endotracheal tube and all lines before turning', 'Move ECG leads from the chest to the back', 'Inspect the face and pressure points for injury', 'Plan for at least 12 hours a day in the prone position', 'Limit proning to 1 hour because longer periods increase mortality', 'Delay proning until the client fails all other therapy'], a: [0, 1, 2, 3, 4],
  rat: 'Iggy: proning reduces mortality in moderate–severe disease on low tidal volume; start early, at least 12 hours a day; at least four people; risks include dislodged tubes and lines, airway obstruction, pressure injury, facial edema, hypotension, arrhythmia, brachial plexus injury. ECG leads go on the back (COVID-19 section). Delaying until other therapy fails and 1-hour limits contradict the evidence.' },

{ id: 413, hl: true, ch: 26, bloom: 'Evaluate', type: 'mcq', cj: 'Take Action', topic: 'Mechanical ventilation',
  stem: 'Right after intubation, end-tidal CO2 is detected, but breath sounds are louder on the right, the left chest rises less, and SpO2 is 89%. What is the nurse’s best action?',
  o: ['Notify the provider to reposition the tube before it is secured, then confirm with chest x-ray', 'Secure the tube at the current depth because CO2 confirms tracheal placement', 'Remove the tube and reintubate', 'Increase the FiO2 and reassess in 30 minutes'], a: 0,
  rat: 'CO2 confirms the trachea, not depth. Unequal breath sounds and chest rise point to the right mainstem bronchus; Iggy: the provider can pull the tube back without a full reintubation, and placement is confirmed by chest x-ray (tip about 2 cm above the carina). Securing it in the wrong position or just raising FiO2 leaves the left lung unventilated.' },

{ id: 414, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues (Trend)', topic: 'Mechanical ventilation',
  stem: 'A ventilated client’s peak inspiratory pressure has risen slowly from 24 to 38 cm H2O over 2 days. Secretions are scant, the tube position is unchanged, and the tubing is clear. What does this trend most likely indicate?',
  o: ['Decreasing lung compliance from worsening lung disease', 'An acute mucus plug', 'A leak in the endotracheal tube cuff', 'Disconnection from the ventilator'], a: 0,
  rat: 'Table 26.4: a gradual increase in peak pressure over hours to a day reflects decreased compliance (stiff lungs), as in acute respiratory distress syndrome or pneumonia. A plug causes a sudden rise; cuff leaks and disconnections LOWER pressure and trigger the low exhaled volume alarm.' },

{ id: 415, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Mechanical ventilation',
  stem: 'An intubated client becomes anxious; SpO2 falls to 84%, end-tidal CO2 rises, peak pressure is high, breath sounds are equal, and the nurse cannot pass a suction catheter. Using DOPE, which cause is most likely?',
  o: ['Obstructed tube', 'Displaced tube', 'Pneumothorax', 'Equipment failure'], a: 0,
  rat: 'Iggy DOPE: displaced, obstructed (most often secretions), pneumothorax, equipment. Iggy also lists difficulty inserting a suction catheter and high peak pressures as indicators of tube obstruction. Equal breath sounds argue against displacement and pneumothorax.' },

{ id: 416, hl: true, ch: 26, bloom: 'Evaluate', type: 'mcq', cj: 'Take Action', topic: 'Delegation',
  stem: 'Which task is appropriate for the nurse to assign to a licensed practical nurse?',
  o: ['Suction the established tracheostomy of a stable client', 'Assess a client extubated 15 minutes ago for stridor', 'Teach a family how to care for a new tracheostomy', 'Evaluate a client’s first spontaneous breathing trial'], a: 0,
  rat: '[Delegation rules are background from fundamentals.] Routine care for a stable client with an established airway fits the practical nurse’s scope. A just-extubated client is unstable (stridor is a late sign needing immediate rescue), and initial teaching and evaluating a weaning trial require RN assessment and judgment.' },

{ id: 417, hl: true, ch: 26, bloom: 'Evaluate', type: 'mcq', cj: 'Evaluate Outcomes', topic: 'Mechanical ventilation',
  stem: 'Forty minutes into a spontaneous breathing trial, a client has RR 34, HR 128, SpO2 86%, diaphoresis, and accessory muscle use. What should the nurse do?',
  o: ['End the trial, return to the prior ventilator support, and notify the provider and respiratory therapist', 'Continue to 60 minutes so the arterial blood gas can be drawn', 'Give a sedative so the client can finish the trial', 'Prepare for extubation because the client is breathing spontaneously'], a: 0,
  rat: 'Box 26.9: hemodynamic and pulmonary status are monitored during a spontaneous breathing trial; this client is failing (tachypnea, tachycardia, desaturation, distress). Iggy: promptly coordinate with the provider and respiratory therapist when the client does not respond. Pushing on, sedating, or extubating risks respiratory arrest.' },

{ id: 418, hl: true, ch: 26, bloom: 'Evaluate', type: 'sata', cj: 'Recognize Cues', topic: 'Mechanical ventilation',
  stem: 'A client was extubated 30 minutes ago. Which findings require immediate action? Select all that apply.',
  o: ['High-pitched crowing sound on inspiration', 'Unable to cough up secretions with mild dyspnea', 'SpO2 88% on face mask', 'Hoarse voice', 'Sore throat', 'Large amount of oral secretions at the moment of removal'], a: [0, 1, 2],
  rat: 'Iggy: early obstruction = mild dyspnea, coughing, inability to expectorate; stridor = late sign → call the Rapid Response Team before the airway closes. SpO2 below 90% needs action. Hoarseness, sore throat, and large oral secretions at removal are expected.' },

{ id: 419, hl: true, ch: 26, bloom: 'Evaluate', type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Tracheostomy',
  stem: 'A client is 1 day after tracheostomy. Which finding is the nurse’s priority?',
  o: ['Puffy skin around the stoma that crackles when pressed and is spreading up the neck', 'A small amount of blood on the tracheostomy dressing', 'Thick secretions in the inner cannula', 'The client is frustrated about not being able to talk'], a: 0,
  rat: 'Subcutaneous emphysema means air is escaping through a tear into the tissues; when it spreads into the neck, the airway can be affected — Iggy: notify the surgeon immediately. Small bleeding the first days is expected; inner cannula secretions are handled with care and suctioning; communication needs matter but are not the airway threat.' },

{ id: 420, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Tracheostomy',
  stem: 'A client with a cuffed tracheostomy and a nasogastric tube now coughs and chokes when eating, food particles appear in tracheal secretions, and more air is needed in the cuff to keep a seal. Which complication is most likely?',
  o: ['Tracheoesophageal fistula', 'Tracheoinnominate artery fistula', 'Tracheal stenosis', 'Subcutaneous emphysema'], a: 0,
  rat: 'Table 26.6: excessive cuff pressure erodes the posterior tracheal wall into the esophagus; highest risk with a nasogastric tube. Signs: food in secretions, coughing/choking while eating, more cuff air needed, set tidal volume not delivered. Tracheoinnominate fistula = pulsating tube and heavy bleeding; stenosis appears after cuff deflation or tube removal; subcutaneous emphysema = crackling skin.' },

{ id: 421, hl: true, ch: 26, bloom: 'Evaluate', type: 'sata', cj: 'Take Action', topic: 'Tracheostomy',
  stem: 'A nurse is supervising a student giving tracheostomy care. Which actions require the nurse to intervene? Select all that apply.',
  o: ['Cuts a gauze pad to fit around the tube', 'Removes the old ties before the new ties are secured', 'Plans to suction every 2 hours on schedule', 'Uses an alcohol-based mouthwash for oral care', 'Cleans the stoma site and then the faceplate', 'Leaves room for one finger under the new ties'], a: [0, 1, 2, 3],
  rat: 'Iggy: never cut gauze (fibers can be aspirated); keep old ties on until new ties are secure (prevents decannulation); suction by assessment cues, not a schedule (her slide); avoid alcohol mouthwash and glycerin (a “staple question,” per class). Cleaning stoma then faceplate and a one-finger fit are correct.' },

{ id: 422, hl: true, ch: 26, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Chest trauma',
  stem: 'After a car crash, a client has left chest pain, absent breath sounds and hyperresonance on the left, trachea midline, BP 128/76, HR 104, SpO2 92% on 2 L. Which conclusion is best supported?',
  o: ['Simple pneumothorax; prepare for chest tube placement and watch for tension', 'Tension pneumothorax needing immediate needle decompression', 'Hemothorax requiring thoracotomy', 'Flail chest requiring positive-pressure ventilation'], a: 0,
  rat: 'Absent breath sounds and hyperresonance on one side = pneumothorax. Tension adds tracheal deviation away from the injured side, distended neck veins, and hemodynamic instability — none are present yet. Hemothorax is dull to percussion; flail chest shows paradoxical movement. Iggy: more severe pneumothorax is treated with a chest tube; keep assessing for tension.' },

{ id: 423, hl: true, ch: 26, bloom: 'Evaluate', type: 'mcq', cj: 'Evaluate Outcomes', topic: 'Chest trauma',
  stem: 'A client with flail chest was intubated and placed on positive-pressure ventilation. Which finding best shows this treatment is effective?',
  o: ['The injured segment now moves with the rest of the chest and PaO2 has risen to 88 mm Hg', 'Pain is rated 3/10 after an epidural', 'The client no longer coughs', 'Bruising over the chest is fading'], a: 0,
  rat: 'Iggy: flail chest is usually stabilized by positive-pressure ventilation; monitor ABGs. Loss of paradoxical motion plus better oxygenation shows the intervention worked. Pain control and bruising do not measure stabilization; loss of cough is not a goal.' },

/* ===== CHAPTER 38 ===== */
{ id: 425, hl: true, ch: 38, bloom: 'Evaluate', type: 'mcq', cj: 'Prioritize Hypotheses', topic: 'Priority',
  stem: 'Which client should the nurse see first?',
  o: ['Alteplase infusing for 30 minutes; new severe headache and vomiting', 'Right hemisphere stroke; keeps trying to get out of bed', 'Left hemisphere stroke; crying and frustrated when trying to speak', 'Mild traumatic brain injury; GCS 15, headache 4/10'], a: 0,
  rat: 'Every client needs attention, but headache and vomiting during alteplase signal intracerebral hemorrhage — Box 38.4: stop the infusion and notify immediately. The impulsive right-hemisphere client is a fall risk (safety), and the aphasic client needs support, but neither is actively bleeding into the brain. A GCS of 15 with a mild headache is stable.' },

{ id: 426, hl: true, ch: 38, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'A right-handed client has sudden right arm weakness, cannot name common objects, and has lost the right half of the visual field in both eyes. Which additional finding does the nurse anticipate?',
  o: ['Difficulty reading and writing', 'Neglect of the left side of the body', 'Impulsive behavior with poor judgment', 'Unaware of having any deficits'], a: 0,
  rat: 'Right body weakness, aphasia, and a right homonymous field cut localize to the dominant LEFT hemisphere (middle cerebral artery territory). Left-hemisphere strokes cause aphasia, alexia, agraphia, and acalculia. Left neglect, impulsivity, and unawareness of deficits are right-hemisphere findings.' },

{ id: 427, hl: true, ch: 38, bloom: 'Evaluate', type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke drugs',
  stem: 'A client woke at 0630 with left-sided weakness. Her husband last saw her acting normally when she went to bed at 2200. CT shows no hemorrhage. It is now 0715. How does the nurse evaluate eligibility for IV alteplase?',
  o: ['Not eligible; last known well was more than 4.5 hours ago', 'Eligible; symptoms were discovered less than 1 hour ago', 'Eligible; CT shows no hemorrhage', 'Not eligible; ischemic strokes do not receive alteplase'], a: 0,
  rat: 'Time is counted from LAST KNOWN WELL (2200), not discovery — over 9 hours. Iggy: alteplase within 3 hours (up to 4.5 hours with exclusions). A negative CT is necessary but not sufficient. In class: endovascular clot removal may still be considered up to 24 hours for selected large-vessel occlusions.' },

{ id: 428, hl: true, ch: 38, bloom: 'Evaluate', type: 'mcq', cj: 'Take Action', topic: 'Stroke drugs',
  stem: 'Two hours after alteplase was completed, a client’s BP is 188/108 mm Hg. The neurologic exam is unchanged. What will the nurse do?',
  o: ['Give the prescribed IV antihypertensive per protocol and notify the provider', 'Document it; BP is expected to be high after a stroke', 'Start aspirin 325 mg to prevent another clot', 'Lower the head of the bed to flat'], a: 0,
  rat: 'Iggy: after alteplase the BP goal is below 180/105 — this exceeds it and raises the risk of hemorrhagic conversion; labetalol is the protocol drug, avoiding a sudden drop. No antiplatelet within 24 hours of a fibrinolytic and not before follow-up imaging.' },

{ id: 429, hl: true, ch: 38, bloom: 'Create', type: 'sata', cj: 'Generate Solutions', topic: 'Stroke',
  stem: 'The nurse is developing the plan for a client with a right hemisphere stroke, left unilateral neglect, and left homonymous hemianopsia. Which interventions belong in the plan? Select all that apply.',
  o: ['Teach the client to turn the head from side to side to scan the environment', 'Dress the affected side first', 'Keep the bed low and the call light within the client’s visual field', 'Position the bed so the unaffected side faces the door', 'Place all items on the left side so the client is forced to use it', 'Apply bilateral wrist restraints while the family is away'], a: [0, 1, 2, 3],
  rat: 'Iggy: teach scanning for homonymous hemianopsia; dress the affected side first with neglect; impulsivity makes fall prevention the priority; items and the call light go where the client can see them; the unaffected side faces the door (also stressed in class). Putting needed items only on the neglected side means the client will not find them; restraints are a last resort.' },

{ id: 430, hl: true, ch: 38, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'While lifting weights, a 48-year-old develops a sudden severe headache, vomits, and becomes progressively drowsy. BP is 210/118. Which conclusion and action are best supported?',
  o: ['Probable hemorrhagic stroke; prepare for immediate CT and give no antithrombotic drugs', 'Probable ischemic stroke; give aspirin now', 'Probable transient ischemic attack; observe for 24 hours', 'Probable migraine; give an analgesic and dim the lights'], a: 0,
  rat: 'Iggy: hemorrhagic strokes tend to occur during activity, begin abruptly, and cause decreasing level of consciousness (with headache and vomiting from rising pressure); ischemic strokes usually leave the client awake. Imaging must rule out bleeding before any antiplatelet, anticoagulant, or fibrinolytic.' },

{ id: 431, hl: true, ch: 38, bloom: 'Evaluate', type: 'mcq', cj: 'Take Action', topic: 'Delegation',
  stem: 'Which assignment to assistive personnel on a stroke unit requires the nurse to intervene?',
  o: ['Feeding breakfast to a client admitted overnight who has not yet had a swallow screen', 'Taking vital signs on a client who had a stroke 3 days ago', 'Helping a client who passed a swallow screen eat lunch', 'Turning a client with left hemiparesis every 2 hours'], a: 0,
  rat: 'Every stroke client is NPO until swallowing is assessed (Iggy; her case: “before the client is given any liquids, food, or medication, he must be screened”). Feeding a client who swallows safely, routine vital signs on a stable client, and turning are within the scope of assistive personnel.' },

{ id: 432, hl: true, ch: 38, bloom: 'Evaluate', type: 'mcq', ext: true, cj: 'Evaluate Outcomes', topic: 'Stroke',
  stem: 'After stroke teaching, which statement by a client’s wife shows she understands when to call 911?',
  o: ['“If his face droops or he loses his balance, I’ll call 911 right away and note the time, even if it goes away.”', '“If his symptoms go away within an hour, I’ll mention it at his next appointment.”', '“I’ll give him an aspirin first and call 911 if it doesn’t help.”', '“I’ll call 911 only if his arm, face, and speech are all affected.”'], a: 0,
  rat: 'BE FAST (taught and tested in class; Iggy teaches FAST): any one sign — Balance, Eyes, Face, Arms, Speech — means call 911, and Time means note when it started (onset time decides treatment). A resolved episode can be a transient ischemic attack, a warning of stroke. Aspirin is not given before imaging rules out hemorrhage.' },

{ id: 433, hl: true, ch: 38, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues', topic: 'Stroke',
  stem: 'Six days after a subarachnoid hemorrhage, a client who had been improving becomes newly confused and develops right-sided weakness. What is the most likely cause?',
  o: ['Cerebral vasospasm', 'Expected postictal confusion', 'Hypoglycemia from NPO status', 'Transient ischemic attack unrelated to the hemorrhage'], a: 0,
  rat: 'Iggy: vasospasm after subarachnoid hemorrhage typically occurs days 4–14 and causes new ischemic deficits; nimodipine is used to prevent and treat it. No seizure was described; a glucose check rules out a mimic but does not explain the timing.' },

{ id: 434, hl: true, ch: 38, bloom: 'Analyze', type: 'mcq', cj: 'Analyze Cues (Trend)', topic: 'Traumatic brain injury',
  stem: 'A client hit in the temple with a baseball was unconscious briefly, then alert and talking for 2 hours. Now the client is drowsy and the right pupil is larger and sluggish. What is happening?',
  o: ['An expanding epidural hematoma with compression of cranial nerve III', 'A concussion with expected post-injury fatigue', 'A chronic subdural hematoma', 'Postconcussion syndrome'], a: 0,
  rat: 'Iggy: epidural hematoma (often middle meningeal artery with a temporal fracture) classically shows brief loss of consciousness, a lucid interval, then rapid deterioration — monitor every 5–10 minutes. A unilateral dilated, sluggish pupil = cranial nerve III compression (herniation). This is a surgical emergency. Chronic subdural bleeding develops over weeks.' },

{ id: 435, hl: true, ch: 38, bloom: 'Evaluate', type: 'mcq', cj: 'Take Action', topic: 'Increased intracranial pressure',
  stem: 'A client with a head injury has this trend over 4 hours: GCS 13 → 10; BP 148/80 → 184/62; HR 82 → 52; RR 18 → irregular. What is the nurse’s priority?',
  o: ['Notify the provider immediately — these are late signs of increased intracranial pressure', 'Give the PRN antihypertensive for BP above 180', 'Recheck in 1 hour; the heart rate is within normal limits', 'Give the PRN analgesic for a likely headache'], a: 0,
  rat: 'Falling GCS (a 2-point drop is significant), widening pulse pressure (68 → 122), bradycardia, and irregular respirations = Cushing triad: very late, herniation may be imminent. Treating the BP alone misses the brain; a heart rate of 52 is not reassuring in this context.' },

{ id: 436, hl: true, ch: 38, bloom: 'Evaluate', type: 'mcq', cj: 'Evaluate Outcomes', topic: 'Traumatic brain injury',
  stem: 'Twelve hours after a severe traumatic brain injury, the respiratory therapist increased the ventilator rate. The new arterial blood gas shows PaCO2 26 mm Hg and PaO2 92 mm Hg. How does the nurse evaluate this?',
  o: ['A concern — hyperventilation causes cerebral vasoconstriction and ischemia in the first 24 hours', 'Ideal — low carbon dioxide lowers intracranial pressure safely', 'Ideal — the PaO2 is in the target range so no change is needed', 'A concern only because the PaO2 is too high'], a: 0,
  rat: 'Iggy: carbon dioxide is a potent vasodilator, but avoid hyperventilation in the first 24 hours — low PaCO2 constricts cerebral vessels and causes ischemia (secondary injury). PaO2 80–100 is the target, so oxygenation is fine; the problem is the PaCO2.' },

{ id: 437, hl: true, ch: 38, bloom: 'Create', type: 'sata', cj: 'Generate Solutions', topic: 'Increased intracranial pressure',
  stem: 'The nurse is planning care to prevent increases in intracranial pressure for a ventilated client with a traumatic brain injury. Which interventions belong in the plan? Select all that apply.',
  o: ['Head of bed at least 30 degrees', 'Head and neck in midline', 'Avoid hip and neck flexion', 'Hyperoxygenate before and after suctioning', 'Give lidocaine as prescribed to suppress coughing', 'Place in Trendelenburg position during turns', 'Hyperventilate during every suctioning pass'], a: [0, 1, 2, 3, 4],
  rat: 'Iggy: HOB at least 30 degrees, head midline, log roll, avoid hip and neck flexion (they impede venous drainage); hyperoxygenate around suctioning but avoid aggressive hyperventilation; lidocaine (IV or endotracheal) suppresses cough, which raises pressure. Head-down positioning raises intracranial pressure.' },

function maxPts(q){
  switch(q.type){
    case 'mcq': case 'order': return 1;
    case 'sata': return q.a.length;
    case 'matrix': return q.rows.length;
    case 'highlight': return q.passage.filter(x=>x.k).length;
    case 'cloze': return q.parts.filter(x=>typeof x==='object').length;
    case 'dnd': return q.slots.length;
  }
}
function score(q, r){
  if (r==null) return 0;
  switch(q.type){
    case 'mcq': return r===q.a ? 1 : 0;
    case 'sata': { let s=0; r.forEach(i => s += q.a.includes(i) ? 1 : -1); return Math.max(0,s); }
    case 'matrix': return q.rows.reduce((s,row,i)=>s+(r[i]===row[1]?1:0),0);
    case 'highlight': { let s=0; r.forEach(i => s += q.passage[i].k ? 1 : -1); return Math.max(0,s); }
    case 'cloze': { const bl=q.parts.filter(x=>typeof x==='object'); return bl.reduce((s,b,i)=>s+(r[i]===b.a?1:0),0); }
    case 'dnd': return q.a.reduce((s,a,i)=>s+(r[i]===a?1:0),0);
    case 'order': return r.every((v,i)=>v===i) ? 1 : 0;
  }
}

      el('div',{class:'types'}, SCOPES.map(sc=>el('button',{class:'mode type',id:'scope-'+sc.k,'aria-pressed':String(scope===sc.k),onclick:()=>{ if (scope!==sc.k) switchScope(sc.k); }},
        el('span',{class:'tick radio',text:scope===sc.k?'●':''}),
        el('span',{class:'tt'}, el('b',{text:sc.name}), el('span',{class:'hint',text:sc.desc})),
        el('span',{class:'cnt',text:String(scopeCount(sc.k))}))))
    ),
    fixed() ? null : el('div',{class:'card stack'},
      el('h2',{text:'Choose question types'}),
      el('div',{class:'types'}, GROUPS.map(g=>el('button',{class:'mode type',id:'set-'+g.k,'aria-pressed':String(S.sets.includes(g.k)),onclick:()=>{
          const i=S.sets.indexOf(g.k); i>=0 ? S.sets.splice(i,1) : S.sets.push(g.k);
          S.idx=0; buildList(); save(); render(); }},
        el('span',{class:'tick',text:S.sets.includes(g.k)?'✓':''}),
        el('span',{class:'tt'}, el('b',{text:g.name}), el('span',{class:'hint',text:g.desc})),
        el('span',{class:'cnt',text:String(count(g.k))})))),
      el('p',{class:'hint',style:'margin:0',text: L.length ? `${L.length} items selected` + (setKey()===ALL_KEY?' — every item':'') : 'Select at least one question type to begin.'})
    ),
    el('div',{class:'card stack'},
      el('h2',{text:'Choose a mode'}),
      el('div',{class:'modes'},
        el('button',{class:'mode','aria-pressed':String(S.mode==='tutor'),onclick:()=>{S.mode='tutor';save();render();}}, el('b',{text:'Tutor'}), 'Check each item and read the rationale immediately. Break prompts every 10 items.'),
        el('button',{class:'mode','aria-pressed':String(S.mode==='exam'),onclick:()=>{S.mode='exam';save();render();}}, el('b',{text:'Exam'}), 'No feedback until you finish. Same scoring as the real test.')
      )
    ),
    el('div',{class:'card stack'},
      el('h2',{text:'How scoring works'}),
      el('table',{}, el('tbody',{},
        el('tr',{}, el('th',{text:'Multiple choice'}), el('td',{text:'0/1.'})),
        el('tr',{}, el('th',{text:'Select all that apply'}), el('td',{text:'+/− : +1 per correct pick, −1 per wrong pick, never below 0. Read every option before you stop.'}))
      ))
    ),
    el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
      isFinished()
        ? el('button',{class:'btn primary',onclick:()=>{ S.view='results'; save(); render(); }}, 'View last results')
        : el('button',{class:'btn primary',disabled:!L.length,onclick:()=>{ if (answered(L[S.idx])) { const f=L.findIndex(q=>!answered(q)); if (f>=0) S.idx=f; } S.view='q'; save(); render(); }}, any?'Resume':'Begin'),
      (Object.keys(S.ans).length || scope==='mock') ? el('button',{class:'btn',id:'resetBtn',onclick:confirmReset}, scope==='mock'?'New mock':'Start over')
        : el('button',{class:'btn',id:'shuffleBtn',onclick:()=>{ S.oseed=1+Math.floor(Math.random()*1e9); S.idx=0; buildList(); save(); render(); }}, 'Shuffle order')
    ),
    el('p',{class:'hint',id:'resetMsg'})
  ));
}
function confirmReset(){
  const b=$('#resetBtn');
  if (b.dataset.armed){ S={ view:'start', mode:S.mode, sets:S.sets, finished:false, idx:0, ans:{}, checked:{}, flags:{}, breaks:{}, tab:1, armed:null, chip:null, seed: scope==='mock' ? 1+Math.floor(Math.random()*1e9) : undefined, oseed: 1+Math.floor(Math.random()*1e9) }; buildList(); save(); render(); return; }
  b.dataset.armed='1'; b.textContent= scope==='mock' ? 'Tap again for a new set of 50' : 'Tap again to erase answers and reshuffle'; $('#resetMsg').textContent= scope==='mock' ? 'This mock’s answers will be cleared and new questions drawn in a new order.' : 'Your saved answers for this section will be cleared and the questions will come in a new order.';
}

function breakView(app){
  $('#pos').textContent = `Break`;
  const done = S.idx;
  app.append(el('div',{class:'card stack break'},
    el('h2',{text:`${done} items done. Take 3 minutes.`}),
    el('p',{class:'muted',text:'Stand up, drink water, look at something far away. No scrolling. Your answers are saved.'}),
    el('button',{class:'btn primary',onclick:()=>{ S.view='q'; save(); render(); }}, 'Continue to item '+(done+1))
  ));
}

function chartView(q){
  const CASE = CASES[q.ch];
  const box=el('section',{class:'chart','aria-label':'Client chart'}, el('div',{class:'head',text:'Electronic health record — '+CASE.title}));
  const tabs=el('div',{class:'tabs',role:'tablist'});
  CASE.tabs.forEach((t,i)=>{
    const hasNew = t.entries.some(e=>e.s===q.stage && q.stage>1);
    tabs.append(el('button',{class:'tab',role:'tab','aria-selected':String(S.tab===i),onclick:()=>{S.tab=i;render();}}, t.name, hasNew?el('span',{class:'new-tag',style:'margin-left:6px',text:'NEW'}):null));
  });
  box.append(tabs);
  const t=CASE.tabs[S.tab]||CASE.tabs[0]; const body=el('div',{class:'tabbody'});
  const vis=t.entries.filter(e=>e.s<=q.stage);
  if (t.table){
    body.append(el('div',{class:'tablewrap'}, el('table',{}, el('thead',{}, el('tr',{}, t.cols.map(c=>el('th',{text:c})))),
      el('tbody',{}, vis.map(e=>el('tr',{class:e.s===q.stage&&q.stage>1?'entry new':''}, e.r.map((c,i)=>el('td',{class:i?'num':'',text:c}))))))));
  } else {
    vis.forEach(e=> body.append(el('div',{class:'entry'+(e.s===q.stage&&q.stage>1?' new':'')}, e.s===q.stage&&q.stage>1?el('span',{class:'new-tag',text:'NEW'}):null, e.t)));
  }
  box.append(body); return box;
}

function questionView(app){
  const q=L[S.idx]; initResp(q);
  $('#pos').textContent = `${S.idx+1} / ${L.length}`;
  const rev=revealed(q), r=S.ans[q.id];
  const card=el('article',{class:'card stack','data-qid':q.id});
  card.append(el('div',{class:'meta'}, el('span',{text:q.case?`Case study ${Q.filter(x=>x.case&&x.ch===q.ch).indexOf(q)+1} of 6`:`Item ${S.idx+1}`}), (scope==='both'||scope==='mock')?el('span',{text:chName(q)}):null, el('span',{text:TYPE_LABEL[q.type]}), el('span',{class:'cj',text:q.cj}), el('span',{text:q.topic}), q.bloom?el('span',{class:'cj',text:'Bloom: '+q.bloom}):null, q.lec?el('span',{class:'lec',text:'Lecture focus'}):null, q.ext?el('span',{class:'lec',text:'Tested in class — not in Iggy'}):null));
  card.append(el('p',{class:'stem',text:q.stem}));
  if (q.table) card.append(el('div',{class:'tablewrap'}, el('table',{}, el('thead',{}, el('tr',{}, q.table.cols.map(c=>el('th',{text:c})))), el('tbody',{}, q.table.rows.map(row=>el('tr',{}, row.map((c,i)=>i?el('td',{class:'num',text:c}):el('th',{text:c}))))))));
  card.append(responseUI(q, r, rev));
  if (q.meta && rev) card.append(el('dl',{class:'tags'}, Object.entries(q.meta).flatMap(([k,v])=>[el('dt',{text:k}), el('dd',{text:v})])));
  if (rev){
    const pts=score(q,r), mx=maxPts(q);
    card.append(el('div',{class:'rat '+(pts===mx?'good':pts>0?'part':'zero')},
      el('div',{class:'score',text:`${pts} / ${mx} ${mx===1?'point':'points'}`}),
      el('p',{style:'margin:.4em 0 0',text:q.rat})));
  }
  if (q.case){ app.append(chartView(q)); app.append(el('div',{style:'height:14px'})); }
  app.append(card);
  // footer state
  $('#prevBtn').disabled = S.idx===0;
  $('#flagBtn').setAttribute('aria-pressed', String(!!S.flags[q.id]));
  $('#checkBtn').hidden = !(S.view==='q' && S.mode==='tutor');
  $('#checkBtn').disabled = !answered(q) || !!S.checked[q.id];
  $('#nextBtn').textContent = S.idx===L.length-1 ? (S.view==='review'?'Results':'Finish') : 'Next';
}

function setResp(q,v){ if (revealed(q)) return; S.ans[q.id]=v; save(); render(); }

function responseUI(q, r, rev){
  const lock=rev;
  if (q.type==='mcq'||q.type==='sata'){
    const multi=q.type==='sata', p=P[q.id], box=el('div',{class:'opts',role:multi?'group':'radiogroup'});
    p.forEach((oi,pos)=>{
      const sel = multi ? (r||[]).includes(oi) : r===oi;
      const correct = multi ? q.a.includes(oi) : q.a===oi;
      let cls='opt '+(multi?'check':'radio');
      if (rev){ if (sel&&correct) cls+=' right'; else if (sel&&!correct) cls+=' wrong'; else if (!sel&&correct) cls+=' missed'; }
      box.append(el('button',{class:cls,'aria-pressed':String(sel),disabled:lock,onclick:()=>{
        if (multi){ const cur=(r||[]).slice(); const k=cur.indexOf(oi); k>=0?cur.splice(k,1):cur.push(oi); setResp(q,cur); } else setResp(q,oi);
      }}, el('span',{class:'key',text:multi?(sel?'✓':''):String.fromCharCode(65+pos)}), el('span',{text:q.o[oi]})));
    });
    if (rev && multi) box.append(el('p',{class:'hint',text:'Solid green = correct pick • red = wrong pick (−1) • dashed green = correct answer you missed'}));
    return box;
  }
  if (q.type==='matrix'){
    const cur=r||Array(q.rows.length).fill(null);
    const tb=el('tbody');
    q.rows.forEach((row,i)=>{
      const tr=el('tr',{class:rev?(cur[i]===row[1]?'right':'wrong'):''}, el('td',{}, row[0], rev&&cur[i]!==row[1]?el('div',{class:'hint',text:'Correct: '+q.cols[row[1]]}):null));
      q.cols.forEach((c,j)=> tr.append(el('td',{class:'c'}, el('input',{type:'radio',name:`m${q.id}r${i}`,id:`m${q.id}r${i}c${j}`,'aria-label':`${row[0]}: ${c}`,checked:cur[i]===j,disabled:lock,onchange:()=>{ const n=cur.slice(); n[i]=j; setResp(q,n); }}))));
      tb.append(tr);
    });
    return el('div',{class:'tablewrap mx'}, el('table',{}, el('thead',{}, el('tr',{}, el('th',{text:'Finding / action'}), q.cols.map(c=>el('th',{text:c})))), tb));
  }
  if (q.type==='highlight'){
    const cur=r||[]; const box=el('div',{class:'passage'});
    q.passage.forEach((seg,i)=>{
      if (typeof seg==='string') return box.append(seg);
      const sel=cur.includes(i); let cls='hl';
      if (rev){ if (sel&&seg.k) cls+=' right'; else if (sel) cls+=' wrong'; else if (seg.k) cls+=' missed'; }
      box.append(el('button',{class:cls,'aria-pressed':String(sel),disabled:lock,onclick:()=>{ const n=cur.slice(); const k=n.indexOf(i); k>=0?n.splice(k,1):n.push(i); setResp(q,n); }}, seg.h));
    });
    const wrap=el('div',{class:'stack'}, box, el('p',{class:'hint',text:'Tap a phrase to highlight it; tap again to remove. Scored +/−.'}));
    if (rev) wrap.append(el('p',{class:'hint',text:'Green outline = correct highlight • red = should not be highlighted (−1) • dashed = missed'}));
    return wrap;
  }
  if (q.type==='cloze'){
    const cur=r||[]; let bi=0; const p=el('p',{class:'cloze'});
    q.parts.forEach(part=>{
      if (typeof part==='string') return p.append(part);
      const i=bi++, order=P[q.id][i];
      let cls=''; if (rev) cls = cur[i]===part.a?'right':'wrong';
      const s=el('select',{id:`c${q.id}b${i}`,class:cls,disabled:lock,'aria-label':'Select option '+(i+1),onchange:(e)=>{ const n=cur.slice(); n.length=q.parts.filter(x=>typeof x==='object').length; n[i]=e.target.value===''?null:+e.target.value; setResp(q,n); }},
        el('option',{value:'',text:'Select…'}), order.map(oi=>el('option',{value:oi,selected:cur[i]===oi,text:part.o[oi]})));
      p.append(s);
      if (rev && cur[i]!==part.a) p.append(el('span',{class:'hint',text:` [${part.o[part.a]}] `}));
    });
    return p;
  }
  if (q.type==='dnd'){
    const cur=r||Array(q.slots.length).fill(null); const wrap=el('div',{class:'dnd'});
    wrap.append(el('p',{class:'hint',text:'Tap a finding, then tap the box where it belongs. Tap a filled box to empty it.'}));
    const chips=el('div',{class:'chips'});
    P[q.id].forEach(pi=>{
      const used=cur.includes(pi);
      chips.append(el('button',{class:'chip'+(used?' used':''),'aria-pressed':String(S.chip===pi),disabled:lock||used,onclick:()=>{ S.chip = S.chip===pi?null:pi; render(); }}, q.pool[pi]));
    });
    wrap.append(chips);
    q.slots.forEach((sl,i)=>{
      let cls='slot'+(cur[i]!=null?' filled':'')+(S.chip!=null&&cur[i]==null?' armed':'');
      if (rev) cls+= cur[i]===q.a[i]?' right':' wrong';
      wrap.append(el('button',{class:cls,disabled:lock,onclick:()=>{
        const n=cur.slice();
        if (S.chip!=null){ n[i]=S.chip; S.chip=null; setResp(q,n); }
        else if (n[i]!=null){ n[i]=null; setResp(q,n); }
      }}, el('b',{text:sl}), el('span',{text:cur[i]!=null?q.pool[cur[i]]:'Empty'}), rev&&cur[i]!==q.a[i]?el('span',{class:'hint',text:'Correct: '+q.pool[q.a[i]]}):null));
    });
    return wrap;
  }
  if (q.type==='order'){
    const cur=r; const ol=el('ol');
    cur.forEach((it,pos)=>{
      const li=el('li',{class:rev?(it===pos?'right':'wrong'):''}, el('span',{class:'n',text:pos+1}), el('span',{class:'t',text:q.items[it]}),
        el('span',{class:'mv'},
          el('button',{'aria-label':'Move up',disabled:lock||pos===0,onclick:()=>{ const n=cur.slice(); [n[pos-1],n[pos]]=[n[pos],n[pos-1]]; setResp(q,n); }},'▲'),
          el('button',{'aria-label':'Move down',disabled:lock||pos===cur.length-1,onclick:()=>{ const n=cur.slice(); [n[pos+1],n[pos]]=[n[pos],n[pos+1]]; setResp(q,n); }},'▼')));
      ol.append(li);
    });
    const wrap=el('div',{class:'order stack'}, el('p',{class:'hint',text:'Use the arrows to arrange every step. Scored all-or-nothing.'}), ol);
    if (rev && !cur.every((v,i)=>v===i)) wrap.append(el('div',{class:'hint'}, 'Correct order: ', q.items.map((t,i)=>`${i+1}) ${t}`).join('  ')));
    return wrap;
  }
}

function resultsView(app){
  $('#pos').textContent='Results';
  let pts=0, mx=0; const byTopic={}, byCj={};
  const byCh={}, byBloom={};
  L.forEach(q=>{ const p=score(q,S.ans[q.id]), m=maxPts(q); pts+=p; mx+=m;
    const h=byCh[chName(q)]||(byCh[chName(q)]={p:0,m:0}); h.p+=p; h.m+=m;
    if (q.bloom){ const b=byBloom[q.bloom]||(byBloom[q.bloom]={p:0,m:0}); b.p+=p; b.m+=m; }
    const t=byTopic[q.topic]||(byTopic[q.topic]={p:0,m:0}); t.p+=p; t.m+=m;
    const ck=q.cj.replace(/ \(.*\)/,''); const c=byCj[ck]||(byCj[ck]={p:0,m:0}); c.p+=p; c.m+=m; });
  const pct=Math.round(pts/mx*100);
  const bars=(obj)=>el('div',{class:'bars'}, Object.entries(obj).sort((a,b)=>a[1].p/a[1].m-b[1].p/b[1].m).map(([k,v])=>el('div',{class:'barrow'}, el('span',{text:k}), el('span',{class:'track'}, el('i',{style:`width:${Math.round(v.p/v.m*100)}%`})), el('span',{class:'v',text:`${v.p}/${v.m}`}))));
  const missed=L.filter(q=>score(q,S.ans[q.id])<maxPts(q));
  app.append(el('div',{class:'stack'},
    el('div',{class:'card stack'},
      el('div',{class:'meta'}, el('span',{text:'Points-based score'}), el('span',{text:setName()})),
      el('div',{class:'big',text:pct+'%'}),
      el('p',{class:'muted',style:'margin:0',text:`${pts} of ${mx} points • ${L.length-missed.length} of ${L.length} items at full credit. Course target: 85%.`})),
    Object.keys(byCh).length>1 ? el('div',{class:'card stack'}, el('h2',{text:'By chapter'}), bars(byCh)) : null,
    Object.keys(byBloom).length ? el('div',{class:'card stack'}, el('h2',{text:'By Bloom’s level'}), bars(byBloom)) : null,
    el('div',{class:'card stack'}, el('h2',{text:'By topic (weakest first)'}), bars(byTopic)),
    el('div',{class:'card stack'}, el('h2',{text:'By clinical judgment step'}), bars(byCj)),
    el('div',{class:'card stack'}, el('h2',{text:`Items to restudy (${missed.length})`}),
      missed.length? el('div',{class:'navgrid'}, missed.map(q=>el('button',{class:score(q,S.ans[q.id])>0?'part':'no',onclick:()=>{ S.view='review'; S.idx=L.indexOf(q); S.tab=1; save(); render(); }}, String(L.indexOf(q)+1)))) : el('p',{text:'None. Every item earned full credit.'})),
    el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'},
      el('button',{class:'btn primary',onclick:()=>{ S.view='review'; S.idx=0; save(); render(); }}, 'Review all items'),
      el('button',{class:'btn',onclick:()=>{ S.view='start'; save(); render(); }}, 'Back to start'))
  ));
  window.scrollTo(0,0);
}

/* ---------- nav ---------- */
function go(i){ S.idx=Math.max(0,Math.min(L.length-1,i)); S.chip=null; if (L[S.idx].case && !(L[S.idx-1]?.case && L[S.idx-1].ch===L[S.idx].ch)) S.tab=1; save(); render(); window.scrollTo(0,0); }
$('#prevBtn').onclick=()=>go(S.idx-1);
$('#nextBtn').onclick=()=>{
  if (S.idx===L.length-1){ if (S.view==='review'){ S.view='results'; save(); render(); } else openNav(); return; }
  const n=S.idx+1;
  if (S.view==='q' && S.mode==='tutor' && n%10===0 && !S.breaks[setKey()+n]){ S.breaks[setKey()+n]=1; S.idx=n; S.view='break'; save(); render(); window.scrollTo(0,0); return; }
  go(n);
};
$('#checkBtn').onclick=()=>{ const q=L[S.idx]; if (!answered(q)) return; S.checked[q.id]=true; save(); render(); };
$('#flagBtn').onclick=()=>{ const q=L[S.idx]; S.flags[q.id]=!S.flags[q.id]; save(); render(); };
function openNav(){
  const g=$('#navGrid'); g.innerHTML='';
  L.forEach((q,i)=>{
    let cls='';
    const shown = S.view==='review' || S.view==='results' || (S.mode==='tutor' && S.checked[q.id]);
    if (shown && answered(q)){ const p=score(q,S.ans[q.id]), m=maxPts(q); cls = p===m?'ok':p>0?'part':'no'; }
    else if (answered(q)) cls='ans';
    if (i===S.idx && (S.view==='q'||S.view==='review')) cls+=' cur';
    if (S.flags[q.id]) cls+=' fl';
    g.append(el('button',{class:cls,'aria-label':`Item ${i+1}`,onclick:()=>{ closeNav(); if (S.view!=='review') S.view='q'; go(i); }}, String(i+1)));
  });
  const left=L.length-L.filter(answered).length;
  $('#finishHint').textContent = left ? `${left} item${left>1?'s':''} unanswered — unanswered items score 0.` : 'All items answered.';
  $('#finishBtn').hidden = S.view==='review' || S.view==='results';
  $('#navOverlay').hidden=false;
}
function closeNav(){ $('#navOverlay').hidden=true; }
$('#navBtn').onclick=openNav; $('#navClose').onclick=closeNav;
$('#navOverlay').addEventListener('click',e=>{ if (e.target.id==='navOverlay') closeNav(); });
$('#finishBtn').onclick=()=>{ L.forEach(q=>S.checked[q.id]=true); S.finished=setKey(); S.view='results'; closeNav(); save(); render(); };
document.addEventListener('keydown',e=>{ if (e.key==='Escape') closeNav(); });

// Always open on the start page; saved answers stay available through Resume / View last results
boot();
render();
})();
</script>
