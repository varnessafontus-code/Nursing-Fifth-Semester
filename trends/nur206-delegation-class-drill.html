<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Delegation Class Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow working column — setup bar, a "shift board" of question squares, then the question card. Role colors (RN / LPN / UAP) carry through the text. */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --sunk:#E3E8E5; --ink:#17201E; --muted:#56625D; --line:#CFD7D3;
  --rn:#2B3C8C; --lpn:#0D7266; --uap:#99580A;
  --accent:var(--rn); --accent-ink:#FFFFFF;
  --ok:#1C7338; --ok-bg:#E2F1E6; --bad:#B0281F; --bad-bg:#FBE6E3; --warn:#8C5A00; --warn-bg:#FBEFD9;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --sunk:#222A27; --ink:#E5ECE8; --muted:#9AA7A1; --line:#2E3834;
  --rn:#A3B3F7; --lpn:#62CDBB; --uap:#E7AA5E; --accent:#A3B3F7; --accent-ink:#0F1530;
  --ok:#73D190; --ok-bg:#16301F; --bad:#F3897F; --bad-bg:#3A1A17; --warn:#E8B65C; --warn-bg:#352A12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --sunk:#222A27; --ink:#E5ECE8; --muted:#9AA7A1; --line:#2E3834;
  --rn:#A3B3F7; --lpn:#62CDBB; --uap:#E7AA5E; --accent:#A3B3F7; --accent-ink:#0F1530;
  --ok:#73D190; --ok-bg:#16301F; --bad:#F3897F; --bad-bg:#3A1A17; --warn:#E8B65C; --warn-bg:#352A12;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
header{display:grid;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,48px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:4px 0 0;color:var(--muted);max-width:60ch}
.roles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.role{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.ab{font-weight:400;color:var(--muted)}
.r-rn{color:var(--rn);font-weight:600}.r-lpn{color:var(--lpn);font-weight:600}.r-uap{color:var(--uap);font-weight:600}

.setup{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:15px;padding-bottom:7px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;cursor:pointer}
.btn{font-weight:600;font-size:15px;padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:4px}
.sq{aspect-ratio:1;max-width:100%;border-radius:4px;border:1px solid var(--line);background:var(--surface);padding:0;font-family:var(--f-mono);font-size:9px;color:var(--muted);display:grid;place-items:center}
.sq.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.sq.miss{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.sq.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line);background:var(--surface)}
.legend .l-ok::before{background:var(--ok);border-color:var(--ok)}
.legend .l-miss::before{background:var(--bad-bg);border-color:var(--bad)}
.opt.missed-right{border-style:dashed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,28px);display:grid;gap:16px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qnum{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.src{border:1px solid var(--line);background:transparent}
.stem{font-size:clamp(18px,2.6vw,20px);font-weight:600;line-height:1.45;margin:0;text-wrap:pretty}
.sata{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:6px;justify-self:start}
.opts{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .key{font-family:var(--f-mono);font-size:13px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.opt.multi .key{border-radius:5px}
.opt.sel{border-color:var(--accent);background:var(--sunk)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt:disabled{cursor:default}
.opt .body{min-width:0;display:grid;gap:6px}
.why{font-size:14px;color:var(--ink);opacity:.9}
.why b{font-weight:600}
.opt.wrong .why b{color:var(--bad)}.opt.right .why b{color:var(--ok)}
.opt.done:not(.right):not(.wrong) .why{color:var(--muted)}
.status{font-weight:600;padding:10px 14px;border-radius:8px}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.hint,.plain{border-left:3px solid var(--accent);background:var(--sunk);padding:12px 14px;border-radius:0 8px 8px 0;font-size:15px}
.plain{border-color:var(--lpn)}
.hint .lbl,.plain .lbl{display:block;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.actions .right{display:flex;gap:10px;margin-left:auto}
.kbd{font-size:12px;color:var(--muted)}

.results{display:grid;gap:18px}
.big{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,170px) 1fr 64px;gap:10px;align-items:center;font-size:14px}
.track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.fill{height:100%;background:var(--lpn)}
.bar .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.missed{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.missed li{font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}
.missed .qnum{margin-right:8px}
.empty{color:var(--muted)}
@media (max-width:480px){.bar{grid-template-columns:1fr 54px}.bar .track{grid-column:1/-1;grid-row:2}.kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">NUR206 · Trends · Delegation quiz prep</div>
    <h1>Delegation Class Drill</h1>
    <p class="lede">One try per question. Once you answer, you'll see the right answer and why every option is right or wrong.</p>
    <div class="roles" id="roles"></div>
  </header>

  <section class="setup" aria-label="Quiz setup">
    <div class="field"><label for="set">Questions</label>
      <select id="set">
        <option value="all">All 65</option>
        <option value="guide">Study guide 1–50</option>
        <option value="new">New 51–65</option>
        <option value="sata">Select all that apply only</option>
        <option value="missed">Missed last round</option>
      </select></div>
    <div class="field"><label for="topic">Topic</label>
      <select id="topic"></select></div>
    <label class="check" for="shuf"><input type="checkbox" id="shuf" checked> Shuffle questions</label>
    <button class="btn" id="start" type="button">Start over</button>
  </section>

  <section aria-label="Progress" style="display:grid;gap:8px">
    <div class="board-head">
      <span class="lbl">Shift board</span>
      <span class="score" id="score"></span>
    </div>
    <div class="board" id="board"></div>
    <div class="legend"><span class="l-ok">correct</span><span class="l-miss">incorrect</span><span>not done</span></div>
  </section>

  <main id="main"></main>
</div>

<script>
const DATA = [{"id": "g1", "num": 1, "src": "guide", "topics": ["scope", "tape"], "stem": "An RN on a medical-surgical unit works with an LPN and a UAP. Which task is most appropriate to delegate to the LPN?", "opts": ["Administer IV push furosemide to a client with heart failure", "Reinforce incentive spirometer use with a client on post-op day 2 whom the RN already taught", "Complete the admission assessment for a client with pneumonia", "Teach a newly diagnosed client with diabetes to self-inject insulin"], "ans": [1], "why": ["IV push is never LPN scope, no matter how routine the drug or how stable the client.", "The RN already taught it, so the LPN is reinforcing, not teaching. Reinforcing is LPN work.", "An admission assessment is the A in TAPE. Admissions belong to the RN.", "This is new teaching on a new diagnosis. Initial teaching is the T in TAPE; the LPN can only reinforce it later."]}, {"id": "g2", "num": 2, "src": "guide", "topics": ["scope"], "stem": "Which task is appropriate for the RN to delegate to a UAP?", "opts": ["Measure and record intake and output for a client with stable chronic kidney disease", "Check NG tube placement before an intermittent feeding", "Change a dry sterile dressing on a healing incision", "Ask a client with new chest pain to rate the pain and decide whether to call the nurse"], "ans": [0], "why": ["I&O on a stable client is measuring and recording with no judgment. That is UAP work.", "Checking NG placement is part of giving a tube feeding, and tube feedings are outside UAP scope.", "Any dressing change, even a simple dry one, is wound care. UAPs don't do wound care.", "Read the second half of the option. New chest pain makes the client unstable, and deciding whether it matters is assessment."]}, {"id": "g3", "num": 3, "src": "guide", "topics": ["scope", "rights"], "stem": "The RN started a unit of packed red blood cells 20 minutes ago. Vital signs are unchanged from baseline. Which delegation is most appropriate?", "opts": ["Ask the LPN to monitor the transfusion and report chills, fever, back pain, or dyspnea immediately", "Ask the UAP to monitor the client for a transfusion reaction", "Ask the LPN to hang the second unit when the first unit finishes", "Ask the UAP to take vital signs and slow the infusion if the temperature rises"], "ans": [0], "why": ["The RN already started the blood, so the LPN may monitor it, and the instruction names exact symptoms to report.", "Watching for a reaction means recognizing one, which takes clinical judgment a UAP doesn't have.", "Each new unit is a new initiation, and only the RN initiates blood products.", "Taking vitals is fine, but slowing the infusion is a clinical decision that touches the IV. That is beyond UAP scope."]}, {"id": "g4", "num": 4, "src": "guide", "topics": ["stability"], "stem": "The UAP is assigned to ambulate several clients. Which client should the RN ambulate personally?", "opts": ["A client on post-op day 3 after a total knee replacement who has walked with a walker four times", "A client with COPD on 2 L nasal cannula with stable oxygen saturation", "A client who fell in the bathroom one hour ago and is getting up for the first time since", "A client with chronic osteoarthritis who walks daily with a cane"], "ans": [2], "why": ["Post-op day 3 and has already walked four times with the walker. The outcome is predictable.", "Stable sats on 2 L is this client's baseline. Nothing new is happening.", "The first time up after a fall is unpredictable. The RN needs to see gait, injuries and orthostatic changes.", "Chronic, daily, with a cane. Ambulation doesn't get more routine than this."]}, {"id": "g5", "num": 5, "src": "guide", "topics": ["assignment"], "stem": "The charge nurse is making assignments. Which client is most appropriate to assign to the LPN?", "opts": ["A new admission with diabetic ketoacidosis on an insulin infusion", "A stable client on post-op day 2 after a laparoscopic cholecystectomy needing oral pain medication and a dressing change", "A client receiving a first dose of IV chemotherapy", "A client being discharged today who needs teaching on warfarin"], "ans": [1], "why": ["New admission, DKA, and an insulin drip that gets titrated. That is three RN flags in one client.", "Stable and predictable, with oral meds and a routine dressing change. All of it is LPN scope.", "Chemotherapy is high-risk, and a first dose adds unpredictability. RN only.", "Discharge plus medication teaching are both RN-only (T in TAPE)."]}, {"id": "g6", "num": 6, "src": "guide", "topics": ["rights"], "stem": "The RN delegates vital signs for a stable client with a history of hypotension to the UAP. Which instruction is best?", "opts": ["\"Let me know if his blood pressure seems low.\"", "\"Take his blood pressure at 1000 and 1100 and tell me right away if the systolic is below 100.\"", "\"Check his vitals and handle anything that comes up.\"", "\"Take his vitals whenever you get a chance this morning.\""], "ans": [1], "why": ["'Seems low' makes the UAP decide what low means. That is judgment you haven't given them.", "Specific times, a specific number, and a clear 'tell me right away.' That is right direction.", "'Handle anything that comes up' hands clinical decisions to someone who can't make them.", "No time frame and no report trigger. A vague instruction is a delegation error."]}, {"id": "g7", "num": 7, "src": "guide", "topics": ["priority", "stability"], "stem": "A UAP reports that a client with pneumonia now has a respiratory rate of 28 and is restless. What is the RN's best action?", "opts": ["Have the UAP recheck the respiratory rate in 15 minutes", "Go to the client and assess immediately", "Ask the LPN to give the client's PRN anxiolytic", "Document the findings and notify the provider"], "ans": [1], "why": ["A recheck delays care and leaves the judgment with the UAP. When a UAP reports something abnormal, the RN goes.", "Tachypnea plus restlessness may be hypoxia (normal RR is 12–20). The client changed, so the RN assesses now.", "Restlessness here may be hypoxia, not anxiety. Sedating before assessing can make breathing worse.", "Calling before you assess leaves you with nothing to report in SBAR."]}, {"id": "g8", "num": 8, "src": "guide", "topics": ["scope"], "stem": "The RN reviews the LPN's plan for the morning. Which statement by the LPN requires the RN to intervene?", "opts": ["\"I'll give the scheduled oral metoprolol after I check the apical pulse.\"", "\"I'll reinforce the leg exercises you taught Mr. Lee yesterday.\"", "\"I'll hang the new heparin infusion bag that pharmacy just sent up.\"", "\"I'll change the bag on Mrs. Ortiz's continuous tube feeding.\""], "ans": [2], "why": ["Scheduled oral metoprolol with an apical pulse check is routine LPN work. Nothing to stop here.", "The RN taught it yesterday. Reinforcing is exactly what the LPN is for.", "Heparin is a high-risk medication. Per your course file, LPNs don't give high-risk meds.", "Enteral feedings are on the LPN list in your course file."]}, {"id": "g9", "num": 9, "src": "guide", "topics": ["scope"], "stem": "Which task is within the LPN's scope of practice?", "opts": ["Insert an indwelling urinary catheter for a stable client with urinary retention", "Give IV push morphine for breakthrough pain", "Discharge a client home after surgery", "Titrate a nitroglycerin infusion for chest pain"], "ans": [0], "why": ["Urinary catheter insertion is a routine procedure listed in LPN scope.", "IV push is RN-only, every time.", "Discharge is RN-only. The LPN can't do or chart admissions or discharges.", "Titrating any medication is RN-only."]}, {"id": "g10", "num": 10, "src": "guide", "topics": ["rights"], "stem": "A UAP who started yesterday says she has never used the unit's mechanical lift. A client needs a bed-to-chair transfer. What should the RN do?", "opts": ["Let the UAP do the transfer after reading the lift manual", "Demonstrate the lift and supervise the UAP during the transfer to confirm competency", "Assign the transfer to the LPN only", "Delay the transfer until the next shift"], "ans": [1], "why": ["Reading a manual is not demonstrated competency. You're accountable if the transfer goes wrong.", "Right person means scope plus competency. Show them, then watch them do it.", "That sidesteps the training gap instead of fixing it, and a transfer doesn't need an LPN.", "There's no reason to delay care when the fix is available right now."]}, {"id": "g11", "num": 11, "src": "guide", "topics": ["rights"], "stem": "The LPN has six clients, two needing complex dressing changes, and is behind on 0900 medications. A stable client with a long-term tracheostomy needs trach care. What should the RN do?", "opts": ["Delegate the trach care to that LPN because it is within LPN scope", "Delegate the trach care to the UAP, who has watched it done many times", "Perform the trach care or delegate it to another competent LPN with a lighter workload", "Tell the LPN to skip one of the dressing changes to make time"], "ans": [2], "why": ["It's in scope, yes. Now look at the LPN's workload. An overloaded delegatee is the wrong choice.", "Trach care is outside UAP scope. Watching it many times doesn't change scope.", "Right circumstance includes the delegatee's workload. Do it yourself or pick an LPN who has room.", "This trades one client's ordered care for another's. That is never the answer."]}, {"id": "g12", "num": 12, "src": "guide", "topics": ["stability"], "stem": "Which client needs the RN, rather than the LPN, to perform suctioning?", "opts": ["A client with a tracheostomy for three months who needs routine suctioning", "A client whose tracheostomy was placed six hours ago, now with SpO2 88% and coarse crackles", "A long-term care resident with a chronic trach and scheduled care", "A stable client with a trach who needs suctioning before meals"], "ans": [1], "why": ["Three months in and routine. A competent LPN handles this.", "A six-hour-old trach with SpO2 88% (normal 95–100%) and coarse crackles is new and unstable.", "Chronic trach with scheduled care in long-term care. Predictable.", "Stable and routine, timed around meals. LPN territory."]}, {"id": "g13", "num": 13, "src": "guide", "topics": ["tape"], "stem": "A client is going home on subcutaneous enoxaparin and will self-inject. Which plan is most appropriate?", "opts": ["Ask the LPN to teach injection technique because LPNs give subcutaneous meds", "The RN teaches and evaluates a return demonstration; the LPN may reinforce later", "The UAP gives the client the written handout and answers questions", "Have the pharmacist teach so the RN does not need to"], "ans": [1], "why": ["Giving a SubQ med is not the same as teaching someone to give it. Teaching is RN work.", "Initial teaching and checking the return demonstration are the T and E in TAPE. The LPN can reinforce later.", "Answering questions about a handout is teaching. UAPs don't teach.", "Pharmacy can add to teaching, but it doesn't replace the RN's discharge teaching."]}, {"id": "g14", "num": 14, "src": "guide", "topics": ["stability"], "stem": "The UAP is passing lunch trays. For which client should the RN not delegate feeding?", "opts": ["A client with Parkinson disease who eats slowly but swallows safely", "A client admitted yesterday with a stroke who coughed while drinking water and has not had a swallow evaluation", "A client with a cast on the right arm who needs help cutting food", "A client with dementia who needs reminders to keep eating"], "ans": [1], "why": ["Slow, but swallows safely. The outcome is predictable, so feeding is delegable.", "A new stroke, coughing on water, and no swallow evaluation yet. That aspiration risk needs assessment first.", "Needs help cutting food, but there's no swallowing problem. That is a plain ADL.", "Needs reminders, not assessment. Cueing is UAP work."]}, {"id": "g15", "num": 15, "src": "guide", "topics": ["scope"], "stem": "Which lab-related task may the RN delegate to a trained UAP?", "opts": ["Draw an arterial blood gas", "Draw a venous blood sample for a CBC on a stable client", "Review the potassium result and decide whether to call the provider", "Decide whether a critical lab value needs a repeat draw"], "ans": [1], "why": ["Arterial punctures are the one phlebotomy exception in your course file.", "Venous phlebotomy on a stable client is UAP scope.", "Reviewing a result and deciding whether to call is interpreting data. That is assessment and planning.", "Deciding whether to redraw is a clinical judgment."]}, {"id": "g16", "num": 16, "src": "guide", "topics": ["scope"], "stem": "The LPN delegates tasks to a UAP. Which delegation requires the RN to intervene?", "opts": ["Weigh the client before breakfast", "Give the client his oral acetaminophen", "Help the client with a shower", "Record the client's intake and output"], "ans": [1], "why": ["Weighing is routine data collection. The LPN may delegate it to a UAP.", "UAPs give no medications, not even oral acetaminophen.", "A shower is an ADL.", "I&O is routine data collection."]}, {"id": "g17", "num": 17, "src": "guide", "topics": ["rights"], "stem": "A UAP used the wrong cuff size and recorded a falsely high blood pressure. Which statement about accountability is accurate?", "opts": ["The UAP is fully accountable because the UAP did the task", "The RN is accountable because the RN must perform all vital signs", "The UAP is accountable for doing the task correctly; the RN remains accountable for the delegation decision and supervision", "Neither is accountable because the cuff choice is a facility issue"], "ans": [2], "why": ["The UAP is responsible for doing the task correctly, but the RN doesn't stop being accountable.", "Vital signs are delegable. The RN doesn't have to do every set.", "Responsibility for the task moves to the UAP. Accountability for the decision and the follow-up stays with the RN.", "Both people have duties here. 'Facility issue' dodges both of them."]}, {"id": "g18", "num": 18, "src": "guide", "topics": ["scope"], "stem": "A client with a GI bleed is being admitted from the emergency department. Which task can the RN delegate to the UAP?", "opts": ["Complete the admission nursing history", "Orient the client to the room, call light, and bed controls", "Inspect the client's stool for blood", "Calculate the client's fall-risk score"], "ans": [1], "why": ["The admission nursing history is RN-only admission work.", "Showing the room, call light and bed controls needs no judgment.", "Inspecting stool for blood means judging a finding. That is assessment.", "A fall-risk score is a structured assessment that drives the plan of care."]}, {"id": "g19", "num": 19, "src": "guide", "topics": ["stability", "assignment"], "stem": "Which client should the RN keep rather than assign to the LPN?", "opts": ["A client with chronic heart failure on oral digoxin with stable vital signs", "A client with type 2 diabetes needing a fingerstick and scheduled subcutaneous insulin", "A client one hour after a cardiac catheterization with a new hematoma at the femoral site", "A client with a stable pressure injury needing a routine dressing change"], "ans": [2], "why": ["Stable vitals on an oral med this client already takes. Routine.", "Scheduled SubQ insulin is routine. Titration or a drip would be different.", "A new hematoma one hour after a cath is unexpected and could mean bleeding.", "Stable wound, routine dressing change. LPN scope."]}, {"id": "g20", "num": 20, "src": "guide", "topics": ["tape"], "stem": "Which discharge-related task may the RN delegate to the UAP?", "opts": ["Review discharge medications with the client", "Determine whether the client is ready to go home", "Take the client by wheelchair to the car after the RN completes the discharge", "Ask the client to explain the new medication schedule"], "ans": [2], "why": ["Reviewing discharge medications with the client is teaching.", "Deciding whether the client is ready is assessment and evaluation.", "Transport after the RN finishes the discharge needs no judgment.", "Asking the client to explain it back is evaluating learning, the E in TAPE."]}, {"id": "g21", "num": 21, "src": "guide", "topics": ["priority"], "stem": "Twenty minutes into a transfusion, the UAP reports the client says his back hurts and he feels chilled. What is the RN's first action?", "opts": ["Tell the UAP to recheck the temperature in 15 minutes", "Stop the transfusion and keep the IV open with normal saline through new tubing", "Ask the LPN to keep monitoring the transfusion", "Call the blood bank"], "ans": [1], "why": ["Back pain and chills during blood are reaction signs. Waiting 15 minutes lets more blood in.", "Suspected hemolytic reaction: stop the blood first and keep the line open with saline through new tubing.", "The client just became unstable. Handing off now is backwards.", "You will call the blood bank, but only after the transfusion is stopped."]}, {"id": "g22", "num": 22, "src": "guide", "topics": ["assignment"], "stem": "A pediatric RN floats to an adult medical-surgical unit. Which client is most appropriate to assign?", "opts": ["A client with a tracheostomy placed this morning", "A stable client on post-op day 2 after an appendectomy", "A client starting chemotherapy", "A new admission with suspected sepsis"], "ans": [1], "why": ["A trach placed this morning is new and complex. It needs an RN experienced with adults.", "Float nurses get the most stable, predictable clients whose care is similar across age groups.", "Starting chemotherapy is high-risk and specialty-specific.", "A new admission with suspected sepsis is unstable."]}, {"id": "g23", "num": 23, "src": "guide", "topics": ["priority", "stability"], "stem": "At the end of an 8-hour shift, the UAP reports that a client one day after abdominal surgery had a urine output of 150 mL. What should the RN do next?", "opts": ["Document the output and continue to monitor", "Ask the UAP to encourage oral fluids", "Assess the client, including the bladder and fluid status", "Ask the UAP to insert a straight catheter"], "ans": [2], "why": ["Expected minimum output is about 30 mL/hr, or 240 mL over 8 hours. 150 mL is low, so documenting alone ignores it.", "Pushing fluids is an intervention. You don't know yet why output is low.", "Below about 30 mL/hr (240 mL per 8 hours) is low. The RN checks for retention or hypovolemia.", "Catheterization is outside UAP scope."]}, {"id": "g24", "num": 24, "src": "guide", "topics": ["scope"], "stem": "The RN works in a state that bans LPNs from giving any IV medications. Which task may the RN delegate to the LPN?", "opts": ["Hang an IV piggyback of vancomycin", "Give a scheduled NG tube feeding by pump to a stable client", "Give IV push pantoprazole", "Start a unit of platelets"], "ans": [1], "why": ["An IV piggyback is still an IV medication, and this state bans those for LPNs.", "Enteral feeding is LPN scope, and it isn't IV.", "IV push is never LPN scope, in any state.", "Starting any blood product is RN-only."]}, {"id": "g25", "num": 25, "src": "guide", "topics": ["scope"], "stem": "Which client care activity is appropriate for the RN to delegate to the LPN?", "opts": ["Titrate a nitroglycerin infusion using the chest pain protocol", "Give scheduled oral metoprolol to a stable client after checking the apical pulse", "Evaluate whether a new pain regimen is working", "Give IV push ondansetron for nausea"], "ans": [1], "why": ["Titration is RN-only, even with a protocol.", "A routine oral med for a stable client, and the pulse check is data collection.", "Evaluating whether a regimen works is the E in TAPE.", "IV push is RN-only."]}, {"id": "g26", "num": 26, "src": "guide", "topics": ["scope", "tape"], "stem": "The RN is supervising a UAP caring for a client just started on a new heart medication. Which UAP statement shows the need for more instruction?", "opts": ["\"I'll help him walk to the bathroom.\"", "\"I'll write down how much he drinks.\"", "\"I'll tell you right away if his temperature is over 100.4.\"", "\"I heard you explain his new pill, so I can answer his questions about it.\""], "ans": [3], "why": ["Helping to the bathroom is an ADL. Nothing wrong here.", "Recording intake is routine data collection. Nothing wrong here.", "That is a clear report trigger (fever is 100.4°F / 38°C or higher). Nothing wrong here.", "Repeating what the RN said is still teaching. UAPs don't teach."]}, {"id": "g27", "num": 27, "src": "guide", "topics": ["priority"], "stem": "The RN has received report on four clients. Which client should the RN see first?", "opts": ["A client on post-op day 1 with new confusion and SpO2 86% on room air", "A client with COPD whose SpO2 is 90%, which is his baseline", "A client on post-op day 2 asking for pain medication for pain rated 5/10", "A client due for scheduled subcutaneous insulin with a glucose of 168"], "ans": [0], "why": ["New confusion plus SpO2 86% (normal 95–100%) is acute, unexpected, and a breathing problem.", "SpO2 90% is this client's baseline (COPD targets are often 88–92%). Expected findings can wait.", "Pain of 5/10 on day 2 is a real need, but it's stable and expected.", "Glucose 168 mg/dL is above normal (fasting 70–99) but not urgent, and the LPN can give scheduled insulin."]}, {"id": "g28", "num": 28, "src": "guide", "topics": ["assignment"], "stem": "Which client is most appropriate for the RN to assign to the LPN?", "opts": ["A client with acute pancreatitis whose BP just dropped to 88/50", "A client on a heparin infusion with an aPTT due in one hour", "A client being discharged who needs first-time teaching on colostomy care", "A client with stable Crohn disease receiving enteral feedings through an NG tube"], "ans": [3], "why": ["BP 'just dropped' to 88/50. 'Just' means newly unstable.", "Heparin is high-risk, and the aPTT result may mean adjusting the drip (therapeutic is about 1.5–2.5 times control).", "First-time teaching and discharge are both RN-only.", "Stable client and a routine enteral feeding. Both fit the LPN."]}, {"id": "g29", "num": 29, "src": "guide", "topics": ["scope"], "stem": "Which action by a UAP caring for a client receiving a continuous tube feeding requires the RN to intervene?", "opts": ["Keeping the head of the bed at 30 degrees", "Recording the client's intake at the end of the shift", "Turning down the feeding pump rate because the client says he feels full", "Telling the RN that the client coughed while the feeding was running"], "ans": [2], "why": ["Head of bed at 30 degrees is an aspiration precaution. Good.", "Recording intake is routine.", "Changing a pump rate is a clinical decision and part of giving the feeding. The fullness also needs RN assessment.", "That is exactly the report the RN wants."]}, {"id": "g30", "num": 30, "src": "guide", "topics": ["rights"], "stem": "The RN delegates ambulation of a stable client on post-op day 1 who already walked once with the RN. Which instruction is best?", "opts": ["\"Take him for a walk when he's ready.\"", "\"Walk him as far as he wants; he did fine earlier.\"", "\"Get him up and let me know how it goes.\"", "\"Walk him to the nurses' station and back twice with a gait belt before 1100. If he gets dizzy, sit him down and call me right away.\""], "ans": [3], "why": ["'When he's ready' leaves the decision to the UAP.", "'As far as he wants' has no limit and no safety plan.", "No parameters and no specific trigger to report.", "Distance, gait belt, a deadline, and a specific act-and-report trigger."]}, {"id": "g31", "num": 31, "src": "guide", "topics": ["priority", "stability"], "stem": "While bathing a client, the UAP reports that the client suddenly has chest pain. What is the most appropriate action?", "opts": ["The RN goes to assess the client and asks the UAP to get a full set of vital signs while the RN assesses", "Tell the UAP to finish the bath and then recheck how the client feels", "Send the LPN to assess the chest pain", "Call the provider before seeing the client"], "ans": [0], "why": ["The RN assesses, and the UAP can still take vitals under the RN's direct supervision.", "Finishing the bath delays care for what may be cardiac pain.", "New chest pain means unstable. Assessing an unstable client isn't LPN work.", "Assess before you call, or you have nothing to give the provider."]}, {"id": "g32", "num": 32, "src": "guide", "topics": ["scope"], "stem": "Which task is within the LPN's scope according to your course content?", "opts": ["Give initial pre-op teaching on deep breathing", "Give an oral chemotherapy agent", "Check NG tube patency and give the scheduled enteral feeding", "Do the first assessment of a client just transferred from PACU"], "ans": [2], "why": ["Initial pre-op teaching is RN-only.", "Oral or not, chemotherapy is high-risk.", "NG patency checks and enteral feedings are on the LPN list.", "Just out of PACU means not yet stable, and the first assessment is the RN's."]}, {"id": "g33", "num": 33, "src": "guide", "topics": ["scope"], "stem": "A client is actively dying, and the family is at the bedside. Which task may the RN delegate to the UAP?", "opts": ["Explain the signs of approaching death to the family", "Assess the client's pain using a nonverbal pain scale", "Give the PRN morphine", "Provide oral care and reposition the client for comfort"], "ans": [3], "why": ["Explaining the signs of approaching death to the family is teaching.", "Using a pain scale is assessment, even a nonverbal one.", "UAPs never give medications.", "Oral care and repositioning are comfort ADLs."]}, {"id": "g34", "num": 34, "src": "guide", "topics": ["rights"], "stem": "The RN assigns a stable trach client to an LPN, who says, \"I've only done trach care once, in school.\" What should the RN do?", "opts": ["Work alongside the LPN to observe competency, or reassign the client", "Keep the assignment because trach care is within LPN scope", "Ask the UAP to do the trach care instead", "Report the LPN to the nurse manager"], "ans": [0], "why": ["In scope isn't enough; you need demonstrated competency. Watch them do it, or reassign.", "Scope says they're allowed. Competency says they can. You need both.", "Trach care is outside UAP scope.", "Speaking up about a skill gap is appropriate. Don't punish it."]}, {"id": "g35", "num": 35, "src": "guide", "topics": ["rights"], "stem": "The RN delegated hourly vital signs on a client receiving IV fluids to a UAP. The UAP got busy and missed the 1200 and 1300 checks; at 1400 the client was hypotensive. Which RN action would best have prevented this?", "opts": ["Doing every vital sign personally for the rest of the shift", "Asking the UAP to write the vital signs in the chart", "Setting check-in times with the UAP and confirming each set was done and reported", "Asking another UAP to watch the first UAP"], "ans": [2], "why": ["That overcorrects. You can still use the team, with follow-up.", "Charting the vitals doesn't make them happen on time.", "Right supervision means planned check-ins and confirming the task was done and reported.", "A UAP has no authority to supervise another UAP."]}, {"id": "g36", "num": 36, "src": "guide", "topics": ["assignment"], "stem": "The charge nurse reviews the assignments. Which one should be changed?", "opts": ["RN: a client with a new pulmonary embolism on a heparin infusion", "LPN: a client on day 3 of stable cellulitis on oral antibiotics", "UAP: assist a stable client on post-op day 3 to walk", "LPN: a client returning from surgery in 30 minutes"], "ans": [3], "why": ["A new PE on heparin with the RN. That matches.", "Day 3 of stable cellulitis on oral antibiotics with the LPN. That matches.", "Walking a stable post-op day 3 client is UAP work. That matches.", "A client arriving from surgery needs an RN assessment on arrival."]}, {"id": "g37", "num": 37, "src": "guide", "topics": ["tape"], "stem": "A client newly diagnosed with heart failure asks the LPN what lifestyle changes he needs to make. Which LPN response is appropriate?", "opts": ["\"Let me get the RN to talk with you about that. I can go over the low-sodium food list she already gave you.\"", "\"You'll need to cut out salt and weigh yourself daily. Here's how.\"", "\"Ask your doctor at your next appointment.\"", "\"The UAP has a handout she can explain.\""], "ans": [0], "why": ["The LPN reinforces what the RN already gave and sends new teaching back to the RN.", "This is new, independent teaching. The LPN can't do that.", "There's a teaching need right now. Pushing it to the next appointment dismisses it.", "UAPs can't teach, with or without a handout."]}, {"id": "g38", "num": 38, "src": "guide", "topics": ["scope"], "stem": "A client with dementia keeps trying to climb out of bed. Which task may the RN delegate to the UAP?", "opts": ["Decide whether the client needs restraints", "Assess the client for a new cause of agitation, such as infection", "Stay with the client as a one-to-one sitter and report attempts to get up", "Give the PRN haloperidol"], "ans": [2], "why": ["Restraints require assessment and a provider order. Not a UAP decision.", "Looking for a new cause such as infection is assessment.", "Sitting with the client and reporting attempts needs no clinical judgment.", "UAPs give no medications."]}, {"id": "g39", "num": 39, "src": "guide", "topics": ["assignment"], "stem": "The RN works with an LPN and a UAP. Which plan makes the best use of the team?", "opts": ["RN: vital signs on stable clients; LPN: client with sudden dyspnea; UAP: scheduled oral meds", "RN: scheduled oral meds; LPN: vital signs on stable clients; UAP: client with sudden dyspnea", "RN: transporting a discharged client; LPN: discharge teaching; UAP: scheduled oral meds", "RN: assess the client with sudden dyspnea; LPN: scheduled oral meds for stable clients; UAP: vital signs on stable clients"], "ans": [3], "why": ["This puts an unstable client with the LPN and medications with the UAP.", "This puts a client with sudden dyspnea with the UAP.", "The LPN can't do discharge teaching and the UAP can't give meds. The RN is also doing the lowest-skill task.", "Everyone works at the top of their scope: RN with the unstable client, LPN with routine meds, UAP with routine vitals."]}, {"id": "g40", "num": 40, "src": "guide", "topics": ["scope"], "stem": "A client needs an arterial blood gas and a venous basic metabolic panel. Which plan is appropriate?", "opts": ["A trained UAP draws the venous BMP; the RN or respiratory therapist obtains the ABG", "A trained UAP draws both samples", "The LPN draws the ABG; the UAP draws the BMP", "The UAP draws the ABG; the RN draws the BMP"], "ans": [0], "why": ["The UAP draws the venous sample; the arterial stick goes to the RN or respiratory therapist.", "Arterial puncture is the exception to UAP phlebotomy.", "Drawing an ABG isn't listed as LPN scope in your course content.", "This hands the arterial stick to the UAP."]}, {"id": "g41", "num": 41, "src": "guide", "topics": ["stability"], "stem": "Which wound care task should the RN delegate to the LPN?", "opts": ["An abdominal incision with new purulent drainage and separating edges", "The first dressing change after a mastectomy, with a drain in place", "Initial debridement and assessment of a new burn", "A daily dressing change for a stable, healing stage 2 pressure injury"], "ans": [3], "why": ["Purulent drainage and separating edges suggest infection and dehiscence. Unstable.", "The first dressing change on a new surgical wound is a first assessment.", "A new burn needing initial debridement and assessment belongs to the RN.", "Stable, healing, routine. LPN."]}, {"id": "g42", "num": 42, "src": "guide", "topics": ["scope"], "stem": "The UAP reports that a client's tube feeding pump keeps alarming \"occlusion.\" What should the RN do?", "opts": ["Tell the UAP to flush the tube with 30 mL of water", "Tell the UAP to stop the pump and remove the NG tube", "Ask the LPN to check the NG tube's patency and report back", "Call the provider for a new order"], "ans": [2], "why": ["Flushing is manipulating the tube, which is outside UAP scope.", "UAPs can't manipulate the tube, and removing it needs an order.", "Checking NG patency is LPN scope.", "Too early. Nobody has checked the tube yet."]}, {"id": "g43", "num": 43, "src": "guide", "topics": ["tape"], "stem": "Which discharge-related task can the RN delegate to the LPN?", "opts": ["Reinforce the wound care steps the RN taught and report whether the client can repeat them", "Complete the discharge summary and discharge the client", "Decide whether the client is ready to go home", "Teach the client about two new home medications"], "ans": [0], "why": ["Reinforcing RN teaching and reporting back is LPN work. The RN does the evaluating.", "Discharge is outside LPN scope per your course file.", "Deciding readiness is evaluation.", "Teaching new medications is initial teaching."]}, {"id": "g44", "num": 44, "src": "guide", "topics": ["tape"], "stem": "Which task may never be delegated, no matter how stable the client is?", "opts": ["Bathing", "Recording urine output", "Feeding", "Evaluating the client's response to a newly started antihypertensive"], "ans": [3], "why": ["Bathing a stable client is delegable.", "Recording output is delegable.", "Feeding a stable client who swallows safely is delegable.", "Evaluation is the E in TAPE. It is never delegated."]}, {"id": "g45", "num": 45, "src": "guide", "topics": ["scope"], "stem": "A client is receiving chemotherapy. Which task can the RN delegate to the LPN?", "opts": ["Give the scheduled oral ondansetron", "Give the IV chemotherapy dose", "Assess the IV site for extravasation during the infusion", "Teach the client neutropenic precautions"], "ans": [0], "why": ["An oral antiemetic is routine and not high-risk.", "Chemotherapy is RN-only.", "Watching for extravasation during a high-risk infusion is assessment.", "Neutropenic precautions are initial teaching."]}, {"id": "g46", "num": 46, "src": "guide", "topics": ["rights"], "stem": "A UAP says, \"I'm not comfortable going into the isolation room. I was never trained on putting on the PPE.\" What is the RN's best response?", "opts": ["\"Just do your best; it's not hard.\"", "\"Then I'll write you up for refusing an assignment.\"", "\"Watch the PPE video in the break room and go in after.\"", "\"Thanks for telling me. Let me show you the steps and watch you put it on before you go in.\""], "ans": [3], "why": ["This ignores a safety gap. You're accountable for their competency.", "Speaking up about training is appropriate. Don't punish it.", "A video doesn't verify competency. Watching them do it does.", "Show the steps, then watch them put the PPE on before they go in."]}, {"id": "g47", "num": 47, "src": "guide", "topics": ["scope"], "stem": "Which task delegated to the UAP is inappropriate?", "opts": ["Change the sterile dressing on a PICC line", "Collect a clean-catch urine specimen from a stable client", "Turn and reposition a client every two hours", "Weigh the client each morning"], "ans": [0], "why": ["A sterile central-line dressing is wound care, outside UAP scope.", "A clean-catch specimen from a stable client needs no judgment.", "Turning and repositioning is UAP work.", "Daily weights are routine data."]}, {"id": "g48", "num": 48, "src": "guide", "topics": ["stability"], "stem": "Which vital-sign task is most appropriate for the RN to delegate to the UAP?", "opts": ["The first vital signs on a client who just returned from PACU after a hip replacement", "Vital signs during the first 15 minutes of a blood transfusion", "A neurovascular check on a newly casted arm", "Routine vital signs on a stable client on post-op day 2 after a lobectomy"], "ans": [3], "why": ["The first vitals after PACU fall in a high-risk window. RN.", "The first 15 minutes of a transfusion is when reactions show up. RN.", "A neurovascular check is an assessment, not just a measurement.", "Routine vitals on a stable client on post-op day 2."]}, {"id": "g49", "num": 49, "src": "guide", "topics": ["priority"], "stem": "After a bed bath, the UAP reports that the client's sacral skin is red and does not blanch. What should the RN do next?", "opts": ["Inspect the sacrum and start pressure injury interventions", "Ask the UAP to rub lotion on the red area", "Document the UAP's report", "Ask the LPN to stage the pressure injury"], "ans": [0], "why": ["Non-blanching redness may be a stage 1 pressure injury. The RN assesses and updates the plan.", "Massaging reddened skin can make the tissue damage worse.", "Documenting the report skips your own assessment.", "Staging is assessment."]}, {"id": "g50", "num": 50, "src": "guide", "topics": ["stability", "assignment"], "stem": "The LPN is caring for a stable client with pneumonia. The client's SpO2 drops to 85% and respiratory rate rises to 32. What should the charge nurse do?", "opts": ["Have the LPN continue caring for the client and recheck in one hour", "Have the UAP stay with the client and report changes", "Ask the LPN to increase the oxygen and reassess", "Have an RN assess the client and take over primary care while the client is unstable"], "ans": [3], "why": ["Waiting an hour on SpO2 85% (normal 95–100%) and RR 32 (normal 12–20) delays care.", "An unstable client can't go to a UAP.", "Turning up oxygen and reassessing are titration and assessment, both RN functions.", "When a client becomes unstable, an RN takes over; the LPN can still help under RN direction."]}, {"id": "n51", "num": 51, "src": "new", "topics": ["scope"], "stem": "The RN is planning what to delegate to the UAP. Which tasks are appropriate? Select all that apply.", "opts": ["Weigh a stable client before breakfast", "Help a stable client walk to the bathroom", "Apply a prescribed topical cream to a rash", "Perform postmortem care", "Explain to the client why a 24-hour urine collection is needed", "Empty a urinary drainage bag and record the amount"], "ans": [0, 1, 3, 5], "why": ["Weights are routine data collection.", "Ambulating a stable client is an ADL.", "A cream with a prescription is still a medication. UAPs give no medications.", "Postmortem care is on the UAP task list.", "Explaining the purpose of a test is teaching.", "Emptying and recording output is I&O."]}, {"id": "n52", "num": 52, "src": "new", "topics": ["scope"], "stem": "Which tasks are within the LPN's scope according to your course content? Select all that apply.", "opts": ["Insert an indwelling urinary catheter", "Monitor a unit of blood the RN started", "Give IV push metoclopramide", "Suction a stable chronic tracheostomy", "Chart the admission of a new client", "Delegate weighing a client to a UAP"], "ans": [0, 1, 3, 5], "why": ["Catheter insertion is on the LPN list.", "LPNs may monitor blood products once the RN has started them.", "IV push is never LPN scope.", "Suctioning and trach care on a stable client are LPN tasks.", "LPNs can't do or chart admissions.", "LPNs may delegate to UAPs."]}, {"id": "n53", "num": 53, "src": "new", "topics": ["rights"], "stem": "The RN delegates vital signs on a stable client on post-op day 1 to a UAP. Which belong in the RN's instruction? Select all that apply.", "opts": ["The times the vital signs are due", "Specific values to report right away, such as a systolic BP under 90", "The cuff size to use for this client", "“Use your judgment about what looks abnormal”", "A request to tell the RN when they're done", "“Give the PRN acetaminophen if his temperature is over 100.4”"], "ans": [0, 1, 2, 4], "why": ["A time frame is part of right direction.", "A specific number takes judgment out of it (adult systolic is roughly 90–120 mmHg).", "The wrong cuff size gives a false reading, so naming it prevents an error.", "Deciding what's abnormal is assessment. Give numbers instead.", "A report-back closes the loop for right supervision.", "UAPs give no medications, PRN const ABBR_RE=new RegExp("(?<![A-Za-z0-9])("+Object.keys(ABBR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\\/&]/g,"\\$&")).join("|")+")(?![A-Za-z0-9])","g");
// fmt: escapes text, colors RN/LPN/UAP, and writes each abbreviation out the first time it appears in `seen`
function fmt(s,seen){
  let out="",last=0;
  s.replace(ABBR_RE,(m,k,i)=>{
    out+=esc(s.slice(last,i));last=i+m.length;
    const[c,full]=ABBR[k];
    const role=/^(RN|LPN|UAP)$/.test(c)?` class="r-${c.toLowerCase()}"`:"";
    let piece=role?`<span${role}>${esc(m)}</span>`:esc(m);
    if(!seen.has(c)){seen.add(c);piece+=` <span class="ab">(${esc(full)})</span>`}
    out+=piece;return m});
  return out+esc(s.slice(last));
}

{const seen=new Set();$("#roles").innerHTML=[["rn","RN: TAPE, unstable, high-risk"],["lpn","LPN: stable, routine, reinforce"],["uap","UAP: ADLs, measure, report"]].map(([r,t])=>`<span class="role r-${r}">${fmt(t,seen)}</span>`).join("")}

  $("#main").innerHTML=`<article class="card results">
    <div><span class="lbl">Score</span><div class="big">${pct}%</div><div class="score">${s.right} of ${s.total} correct${s.done<s.total?` · ${s.total-s.done} skipped`:""}</div></div>
    <div><span class="lbl">By topic</span><div class="bars" style="margin-top:8px">${Object.entries(byT).filter(([k,v])=>v.n).map(([k,v])=>`<div class="bar"><span>${esc(TOPICS[k].name)}</span><div class="track"><div class="fill" style="width:${Math.round(100*v.f/v.n)}%"></div></div><span class="n">${v.f}/${v.n}</span></div>`).join("")}</div></div>
    <div><span class="lbl">Missed or skipped</span>${missed.length?`<ul class="missed" style="margin-top:8px">${missed.map(q=>`<li><span class="qnum">${q.src==="guide"?"Guide #":"New #"}${q.num}</span>${fmt(q.stem,new Set())}</li>`).join("")}</ul>`:`<p class="empty">Nothing. Every question correct.</p>`}</div>
    <div class="actions"><button type="button" class="btn ghost" id="review">Back to last question</button>${missed.length?`<button type="button" class="btn" id="redo">Redo these ${missed.length}</button>`:""}</div>
  </article>`;
  $("#review").addEventListener("click",()=>{run.idx=run.ids.length-1;persist();render()});
  $("#redo")&&$("#redo").addEventListener("click",()=>{$("#set").value="missed";topicSel.value="all";newRun()});
}
$("#start").addEventListener("click",newRun);
if(store.run&&store.run.ids&&store.run.ids.every(id=>byId[id])){
  run=store.run;$("#set").value=run.set||"all";topicSel.value=run.topic||"all";$("#shuf").checked=run.shuf!==false;render();
}else newRun();
</script>

</body></html>
