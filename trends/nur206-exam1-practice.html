<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NUR206 Exam 1 Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one reading column, a sticky status strip on top, one question at a time, answer feedback attached to the option it belongs to. */
:root {
  --bg: #eef2f1; --surface: #fbfcfc; --sunk: #e3eae9; --ink: #15262b; --muted: #56686d; --line: #cdd8d7;
  --accent: #0c5f6e; --accent-ink: #ffffff; --accent-soft: #d9ecef;
  --good: #1d6b3f; --good-bg: #dff1e5; --bad: #a3321f; --bad-bg: #f8e1dc; --warn: #7a5200; --warn-bg: #fbeccb;
  --display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e181b; --surface: #162428; --sunk: #101d21; --ink: #e2ecec; --muted: #9bb0b3; --line: #2c3f44;
  --accent: #63c6d3; --accent-ink: #06262b; --accent-soft: #173940;
  --good: #7bd49b; --good-bg: #173524; --bad: #f09a88; --bad-bg: #3d1e18; --warn: #f0c36a; --warn-bg: #3a2c0d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e181b; --surface: #162428; --sunk: #101d21; --ink: #e2ecec; --muted: #9bb0b3; --line: #2c3f44;
  --accent: #63c6d3; --accent-ink: #06262b; --accent-soft: #173940;
  --good: #7bd49b; --good-bg: #173524; --bad: #f09a88; --bad-bg: #3d1e18; --warn: #f0c36a; --warn-bg: #3a2c0d;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5 }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 20px }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance }
h1 { font-size: 1.9rem; font-weight: 700 }
h2 { font-size: 1.25rem; font-weight: 700 }
h3 { font-size: 1rem; font-weight: 700 }
p { margin: 0 }
.lede { color: var(--muted); max-width: 60ch }
.label { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }

.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 700; min-height: 44px }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.spread { justify-content: space-between }
.stack { display: flex; flex-direction: column; gap: 12px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px }

/* setup */
fieldset { border: 0; padding: 0; margin: 0; min-width: 0 }
legend { padding: 0; margin-bottom: 8px }
.pick { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer }
.pick:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.pick input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); flex: none }
.pick .t { min-width: 0; flex: 1 }
.pick .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.pick small { display: block; color: var(--muted); font-size: .9rem }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
select { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; min-height: 44px }
.resume { background: var(--warn-bg); border: 1px solid var(--warn); color: var(--ink) }

/* status strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px }
.strip .where { font-family: var(--display); font-weight: 700 }
.strip .stat { color: var(--muted); font-variant-numeric: tabular-nums }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px }
.confirm { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px }

/* question */
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: .8rem; padding: 2px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); font-weight: 700 }
.tag.kind { background: var(--accent-soft); color: var(--accent) }
.stem { font-size: 1.12rem; line-height: 1.45; max-width: 65ch }
.figure { border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: var(--sunk); color: var(--muted); font-size: .95rem; overflow-x: auto }
.figure svg { display: block; min-width: 460px; max-width: 100%; height: auto }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px }
.chips span { border: 1.5px solid var(--accent); color: var(--ink); border-radius: 6px; padding: 4px 10px; background: var(--surface) }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px }
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: var(--muted) }
.opt.multi .key { border-radius: 6px }
.opt .txt { min-width: 0; flex: 1 }
.opt:hover { border-color: var(--accent) }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.opt:has(input:checked) .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); cursor: default }
.opt.wrong .txt { text-decoration: line-through; text-decoration-color: var(--bad) }
.opt.wrong .key { border-color: var(--bad); color: var(--bad); background: transparent }
.opt.right { border-color: var(--good); background: var(--good-bg) }
.opt.right .key { background: var(--good); border-color: var(--good); color: var(--surface) }
.opt.locked { cursor: default }
.why { margin: -2px 0 4px 52px; color: var(--bad); font-size: .97rem }
.fb { border-radius: 8px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface) }
.fb.bad { border-color: var(--bad); background: var(--bad-bg) }
.fb.good { border-color: var(--good); background: var(--good-bg) }
.fb strong { font-family: var(--display) }
.note { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: .97rem }
.rat { max-width: 65ch }
.fill input { width: 100%; max-width: 22rem; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); min-height: 44px }
.ord { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.ord li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface) }
.ord li.right { border-color: var(--good); background: var(--good-bg) }
.ord li.wrong { border-color: var(--bad); background: var(--bad-bg) }
.ord .pos { font-family: var(--display); font-weight: 700; width: 1.4em; flex: none; font-variant-numeric: tabular-nums }
.ord .txt { flex: 1; min-width: 0 }
.ord .mv { display: flex; gap: 4px; flex: none }
.ord .mv button { width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 700 }

/* map */
details.map summary { cursor: pointer; color: var(--accent); font-weight: 700; padding-block: 4px }
.cells { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px }
.cell { width: 38px; height: 38px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); font-size: .85rem; font-variant-numeric: tabular-nums; position: relative; padding: 0 }
.cell.ans { background: var(--accent-soft); border-color: var(--accent) }
.cell.ok { background: var(--good-bg); border-color: var(--good) }
.cell.retry { background: var(--bad-bg); border-color: var(--bad) }
.cell.cur { outline: 3px solid var(--accent); outline-offset: 1px }
.cell.flag::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--muted); padding-top: 8px }

/* results */
.score { font-family: var(--display); font-size: 3rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums }
.brk { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; font-variant-numeric: tabular-nums }
.brk .bar { height: 10px }
.miss { border-top: 1px solid var(--line); padding-top: 14px }
.miss:first-of-type { border-top: 0; padding-top: 0 }
.miss summary { cursor: pointer; color: var(--accent); font-weight: 700 }
.yours { color: var(--bad) }
@media (max-width: 480px) { body { font-size: 16px } h1 { font-size: 1.55rem } .why { margin-left: 12px } .panel { padding: 14px } }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease } }
</style>

  <main id="app" class="stack" style="gap:20px"></main>

<script>
const DATA = {"chapters":[{"n":5,"title":"Theories of Nursing Practice"},{"n":8,"title":"Legal Issues in Nursing and Health Care"},{"n":10,"title":"Cultural Competency and Social Issues"},{"n":25,"title":"Managing Time"},{"n":26,"title":"Nursing Roles and Career Opportunities"},{"n":28,"title":"The NCLEX-RN Examination"}],"questions":[{"id":"25-m1","ch":25,"type":"mc","stem":"When deciding whether to say no to a request that involves a time commitment, the professional nurse must consider what initially?","rat":"The first step in learning the art of saying no is determining when to say it. The cost/benefit ratio of each opportunity must be evaluated in relation to the overall goal. If the activity will provide an overall benefit, obviously it must be given careful consideration. If it will not result in significant benefit, decline gracefully but emphatically. Personal preference may be a consideration but it is not the initial consideration. Neither of the remaining options are significant factors to making a personal decision.","bloom":"Application","opts":[{"k":"a","t":"The cost-benefit ratio"},{"k":"b","t":"The time commitment of coworkers"},{"k":"c","t":"Ways to buffer saying no"},{"k":"d","t":"Personal preference"}],"ans":["a"],"why":{"b":"Your coworkers’ schedules say nothing about whether this request helps your own goals.","c":"Softening a no comes after you have decided to say it. The stem asks what comes first.","d":"Preference can count, but the text says it is not the first thing to weigh."}},{"id":"25-m2","ch":25,"type":"mc","stem":"Positive time management skills include an effective approach to what aspect of planning?","rat":"Planning is the most important step in time management. Scheduling activities allows people to better use their time and can lead to closure in relation to those goals that will produce the greatest internal satisfaction. An unregulated open-door policy can encourage interrupts that affect daily work flow. The retaining of paper copies is not always necessary and is determined by the organization and need of such references. Telephone calls need to be prioritized and returned according to importance.","bloom":"Comprehension","opts":[{"k":"a","t":"Maintaining an open-door policy"},{"k":"b","t":"Retaining copies of paperwork"},{"k":"c","t":"Returning telephone calls immediately"},{"k":"d","t":"Scheduling daily activities"}],"ans":["d"],"why":{"a":"An unregulated open door invites interruptions. It works against planning.","b":"Keeping paper copies is storage, and often is not needed at all.","c":"Calls get returned by importance, not instantly."}},{"id":"25-m3","ch":25,"type":"mc","stem":"How can time be maximized to produce the best outcomes?","rat":"Making sure that the first hour of every workday is productive sets the tone for achieving goals. The order of task completion is reliant on priority. The remaining options are considered barriers to efficiency.","bloom":"Application","opts":[{"k":"a","t":"Making the first hour of each workday productive"},{"k":"b","t":"Completing trivial tasks before performing important tasks"},{"k":"c","t":"Eliminating recreational activities in the work environment"},{"k":"d","t":"Omitting breaks until the entire task has been completed"}],"ans":["a"],"why":{"b":"Trivial-first pushes important work later. Order follows priority.","c":"The text lists this as a barrier to efficiency, not a way to gain time.","d":"Skipping breaks drains energy. The text lists it as a barrier."}},{"id":"25-m4","ch":25,"type":"mc","stem":"To conduct a productive meeting, the nurse should focus on what?","rat":"You need to preplan for the meeting so it can be conducted in a timely manner. One way to have a productive meeting is to prepare a meeting agenda with time allotted for each item and the name of the person responsible for reporting on each item. Send out the agenda prior to the meeting so attendees can come prepared. Meetings seldom have the luxury of unlimited time to discuss issues or to delay the start of the discussion. The agenda should be planned to accommodate emotional topics.","bloom":"Application","opts":[{"k":"a","t":"Providing each person all the time needed to discuss desired topics"},{"k":"b","t":"Covering all emotional topics first"},{"k":"c","t":"Creating an agenda with specific times allotted for each agenda item"},{"k":"d","t":"Waiting for latecomers before starting the work of the meeting"}],"ans":["c"],"why":{"a":"Unlimited talk time means the meeting never ends.","b":"Emotional topics need a planned slot, not an automatic first position.","d":"Waiting penalizes the people who arrived on time and delays the work."}},{"id":"25-m5","ch":25,"type":"mc","stem":"The nurse should consider delegating the task to which person?","rat":"Delegating is giving other people tasks to be accomplished. The benefits of delegation involve (1) assisting in developing the initiative, skills, knowledge, and competence of others; (2) maintaining the level of responsibility and decision making of others; (3) freeing time for more important tasks; (4) extending results that can be accomplished from what one person can do alone to what he or she can manage through others; and (5) ensuring that completing the task is cost effective.","bloom":"Application","opts":[{"k":"a","t":"The one needing to develop related skills"},{"k":"b","t":"The one who is up for promotion"},{"k":"c","t":"The one who has failed with similar tasks"},{"k":"d","t":"The one deserving of a reward"}],"ans":["a"],"why":{"b":"Promotion status is not a reason to hand someone a task.","c":"A record of failing at similar tasks makes this an unsafe match.","d":"Delegation is not a reward system."}},{"id":"25-m6","ch":25,"type":"mc","stem":"When using the ABC system of managing time, which event should be coded A?","rat":"A items should stand out from other items because of their worth and high level of importance. A items are most urgent and may require more energy and time, but they should be completed before any of the B or C items are performed. Client safety is a consideration for A items.","bloom":"Application","opts":[{"k":"a","t":"Calling the pharmacy to see whether a drug insert is available for a patient"},{"k":"b","t":"Checking to see why a ventilator is alarming"},{"k":"c","t":"Organizing the medication cart"},{"k":"d","t":"Writing memos to remind everyone to contribute to the boss’s birthday gift"}],"ans":["b"],"why":{"a":"Useful, but no one is harmed if it waits.","c":"Tidying the cart is routine and low value.","d":"This has nothing to do with patient care."}},{"id":"25-m7","ch":25,"type":"mc","stem":"What action is appropriate when deciding whether and when a task should be completed?","rat":"Stopping to evaluate what is going on is important because you may have to readjust your plan and reprioritize to reach your goal. None of the other options allow for effective prioritization.","bloom":"Application","opts":[{"k":"a","t":"Completing all tasks as they are received"},{"k":"b","t":"Arranging according to the tasks’ time requirements"},{"k":"c","t":"Asking, “What will happen if I don’t complete the task now?”"},{"k":"d","t":"Viewing large projects holistically and not as many small pieces"}],"ans":["c"],"why":{"a":"Doing tasks in arrival order ignores priority.","b":"How long a task takes does not tell you how much it matters.","d":"Large projects get done when they are broken into small pieces."}},{"id":"25-m8","ch":25,"type":"mc","stem":"What principle should a nurse apply to assure effective daily planning?","rat":"One must consider many factors when planning a project. Some of the following factors influence how priorities should be established: (1) urgency of a situation, (2) demands of others, (3) closeness of deadlines, (4) existing time frame, (5) degree of familiarity with the task, (6) ease of task completion, (7) amount of enjoyment involved, (8) consequences involved, (9) size of the task, and (10) congruence with personal goals. When the use of time is considered, not all factors carry the same weight, and adjustments will be needed.","bloom":"Comprehension","opts":[{"k":"a","t":"Delay planning until the “first task of the morning” has been completed."},{"k":"b","t":"Recognize that rewarding oneself has a negative consequence."},{"k":"c","t":"Rotate between several tasks to stimulate creativity."},{"k":"d","t":"Remember that most tasks take longer than anticipated to complete."}],"ans":["d"],"why":{"a":"Planning has to come before the first task, not after it.","b":"Rewarding yourself is a motivator, not a problem.","c":"Hopping between tasks breaks concentration."}},{"id":"25-m9","ch":25,"type":"mc","stem":"What tactic is the inexperienced novice nurse using when prioritizing a client’s bed bath before the need to insert a nasogastric (NG) tube into a client vomiting coffee ground emesis?","rat":"Procrastination is evident when a person is faced with an unpleasant task, a difficult task, or a difficult decision. Usually procrastination is easily recognizable because it involves completing low-priority tasks rather than high-priority ones, and it always welcomes interruptions. Priority setting would consider the more important task to be the NG tube insertion. Introspection is the examination of one's own conscious thoughts and feelings. Energy management ensures that the right amount of effort matches the right task to optimize an outcome.","bloom":"Comprehension","opts":[{"k":"a","t":"Energy management"},{"k":"b","t":"Priority setting"},{"k":"c","t":"Procrastination"},{"k":"d","t":"Introspection"}],"ans":["c"],"why":{"a":"Energy management matches effort to the right task. Here the wrong task was picked.","b":"Real priority setting would put the NG tube first.","d":"Introspection is examining your own thoughts and feelings."}},{"id":"25-m10","ch":25,"type":"mc","stem":"A student nurse assigned to work with the charge nurse finds the work to be satisfying and receives several compliments from management and the nursing instructor for several creative suggestions. The student nurse enjoys the project and attention and begins to prolong the conclusion of the project. This behavior is indicative of what time management obstacle?","rat":"Fear of completion is a time management obstacle that may occur if you are afraid of completing a project that is creative and fun. To overcome this obstacle, take the time to understand why you are not completing the task or major project that has been with you for some time. Need for perfection demands extremely high standards for every single task you undertake. The student has demonstrated creativity and has been complimented on it. There is no indication that the goals of the task have not been met.","bloom":"Comprehension","opts":[{"k":"a","t":"Need for perfection"},{"k":"b","t":"Fear of losing creativity"},{"k":"c","t":"Unclear project goals"},{"k":"d","t":"Fear of completion"}],"ans":["d"],"why":{"a":"Perfectionism is holding every task to an extreme standard. This student is stalling because the project is enjoyable.","b":"The student’s creativity is being praised, not threatened.","c":"Nothing in the stem says the goals are unclear."}},{"id":"25-m11","ch":25,"type":"mc","stem":"An inexperienced nurse feels that all tasks must be performed faultlessly, which leads to his/her inability to complete all assigned tasks. This nurse would benefit from the seminar focusing on what potential obstacle to efficiency?","rat":"A perfectionist feels that everything should be completed at the same level of excellence. If you demand extremely high standards for every single task you undertake, you simply will not get everything done. None of the other options present this specific type of barrier to efficient time management.","bloom":"Comprehension","opts":[{"k":"a","t":"Creativity"},{"k":"b","t":"Perfectionism"},{"k":"c","t":"Failure"},{"k":"d","t":"Downtime"}],"ans":["b"],"why":{"a":"Creativity is not what stops the work from getting finished.","c":"Failure is the result here, not the obstacle causing it.","d":"Downtime is rest. The problem is the standard this nurse sets."}},{"id":"25-m12","ch":25,"type":"mc","stem":"A nurse is unable to concentrate on any one task or issue and is unable to view the health care milieu sensibly. Which source of energy is missing in this nurse?","rat":"Mental energy is the ability to maintain sustained concentration on a task, to move flexibly between broad and narrow issues, and to be internally and externally focused, as needed by the situation. It includes mental preparation, visualization, positive self-talk, effective time management, and creativity.","bloom":"Comprehension","opts":[{"k":"a","t":"Physical"},{"k":"b","t":"Mental"},{"k":"c","t":"Spiritual"},{"k":"d","t":"Emotional"}],"ans":["b"],"why":{"a":"Physical energy is about the body: sleep, food, water, exercise.","c":"Spiritual energy comes from reflection and a sense of purpose.","d":"Emotional energy is about feelings, such as patience and calm."}},{"id":"25-m13","ch":25,"type":"mc","stem":"After keeping a log of activities designed to improve time management, the nurse divides the distractions into internal and external sources. The nurse would classify which distraction as internal?","rat":"An internal distraction is one that can be controlled only by the person affected; it is important for each of us to recognize and understand the distracters that inhibit our ability to complete tasks and to meet our objectives and goals.","bloom":"Application","opts":[{"k":"a","t":"Responding to recurring crises at work or in one’s personal life"},{"k":"b","t":"Unsuccessful attempts to communicate with the unit manager"},{"k":"c","t":"Talking with potential faculty candidates"},{"k":"d","t":"Being given unclear job responsibilities"}],"ans":["a"],"why":{"b":"This depends on another person, so the nurse cannot control it alone. That makes it external.","c":"Visitors and conversations come from outside the nurse. External.","d":"Unclear responsibilities come from the organization. External."}},{"id":"25-m14","ch":25,"type":"mc","stem":"A nurse realizes that much time is wasted during shift report when coworkers discuss personal items such as recent movies or department store sales. Which statement would help with time management during this critical interaction?","rat":"The statement “I have the list of patients; let’s start with revisions to the plan of care and scheduled activities for the next shift” focuses the conversation during report, keeping personal conversations to a minimum. None of the remaining options focus on solving the problem refocusing on the task at hand.","bloom":"Application","opts":[{"k":"a","t":"“Let’s talk only about only one movie you recently watched.”"},{"k":"b","t":"“I like to know about department store sales, but we need to get through this report, so let’s talk about sales as we walk between patient rooms.”"},{"k":"c","t":"“I know your shift has been busy. What went wrong?”"},{"k":"d","t":"“I have the list of patients; let’s start with revisions to the plan of care and scheduled activities for the next shift.”"}],"ans":["d"],"why":{"a":"This still gives report time to movies.","b":"This moves the chatter to rounds instead of ending it.","c":"This opens a new off-topic conversation."}},{"id":"25-m15","ch":25,"type":"mc","stem":"A nurse takes a day to travel to a state park where she/he can sit by the river alone to reflect over recent events and put things into perspective. Time is spent recalling the time he/she was complimented for the ability to deal with a difficult patient and another time when he/she was criticized for lack of teamwork. This nurse is improving which source of energy?","rat":"Spiritual energy can be increased by taking time to reflect over events in one’s life and allowing time to understand feelings associated with events/happenings. A quiet environment is essential for reflection.","bloom":"Comprehension","opts":[{"k":"a","t":"Emotional"},{"k":"b","t":"Spiritual"},{"k":"c","t":"Physical"},{"k":"d","t":"Mental"}],"ans":["b"],"why":{"a":"Emotional energy is handling feelings in the moment, such as staying patient.","c":"Physical energy is body care.","d":"Mental energy is concentration on a task."}},{"id":"25-m16","ch":25,"type":"mc","stem":"As part of a quality assurance project, a nurse is to round on every patient daily for 1 month to ensure the intravenous tubing is labeled with date hung and nurse’s initials. The nurse is hoping to be promoted to a full-time position within the quality department, and success on this project is very important to receiving the position. The nurse retains all other assignments, and is often interrupted to help other staff or answer call lights. The nurse discusses these concerns with the manager, who frees him/her for 1 hour each day to make rounds. During this 1 hour each day the nurse will organize herself/himself and environment by practicing what organizational method?","rat":"The art of “no detourism” focuses on one task until completed.","bloom":"Comprehension","opts":[{"k":"a","t":"Art of “no detourism”"},{"k":"b","t":"Reducing stacked-desk syndrome"},{"k":"c","t":"Art of “wastebasketry”"},{"k":"d","t":"Managing e-mail and memo mania"}],"ans":["a"],"why":{"b":"Stacked-desk syndrome is about clearing piles of paper.","c":"Wastebasketry is throwing out paper you do not need.","d":"This is about message overload, not staying on one task."}},{"id":"25-r1","ch":25,"type":"sata","stem":"A nurse is having difficulty managing assignments at work, which results in a feeling of “failure” and tasks that are not completed or that are not completed satisfactorily. The mentor should suggest what tips for time management?","rat":"Planning for the future is an effective time management strategy. Maintaining a log of how you spend your time is an effective time management strategy.","bloom":"Analysis","opts":[{"k":"a","t":"Focusing on activities to be completed, rather than on objectives"},{"k":"b","t":"Planning today for tomorrow’s activities and needs"},{"k":"c","t":"Making certain that the last hours are the most productive in tying up loose ends"},{"k":"d","t":"Maintaining a log of how the nurse spends time"},{"k":"e","t":"Picking five major objectives for the day and not stopping until they are achieved"}],"ans":["b","d"],"why":{"a":"Backwards. Objectives come first, and activities serve them.","c":"The text puts the weight on the first hour, not the last.","e":"Refusing to stop leaves no room to reprioritize."}},{"id":"25-r2","ch":25,"type":"sata","stem":"A nurse is having difficulty keeping up with the six assigned patients and serving on the ethics committee. To take charge of both personal and work life, what activities should the nurse focus on to improve physical energy?","rat":"Drinking plenty of water promotes physical health. Taking a break every 90 minutes, especially during long shifts such as 12-hour shifts, provides a much-needed time to relax and reorganize. Proper and frequent exercise promotes physical health.","bloom":"Application","opts":[{"k":"a","t":"Telling himself/herself, “I provide quality safe care and will provide this level of care to all my patients”"},{"k":"b","t":"Taking a deep breath and remaining calm to develop patience"},{"k":"c","t":"Keeping a bottle of water available to consume a minimum of 24 ounces each shift"},{"k":"d","t":"Going into the nurse’s break room every 90 minutes to eat a healthy snack and prioritize remaining care"},{"k":"e","t":"Enrolling in the hospital-sponsored fitness program"}],"ans":["c","d","e"],"why":{"a":"Positive self-talk builds mental energy.","b":"Staying calm and patient is emotional energy."}},{"id":"25-r3","ch":25,"type":"sata","stem":"A nurse hopes to improve time management skills using the ABC prioritization approach. Which tasks would be prioritized as “B”?","rat":"Task that falls within Priority B includes the medium-value items, such as tasks that are not urgent but most likely will not “fall” off the list. Since the dress code must be reviewed and feedback constructed for a morning appointment, this would be level B, it is not urgent nor will it likely fall off the list. Completing patient teaching for a patient to be discharged in 2 hours must be completed but does not take priority over “A” tasks. Reviewing a procedure to be performed later in the day is Level “B.”","bloom":"Application","opts":[{"k":"a","t":"Turn in time sheet due in 3 days."},{"k":"b","t":"Review dress code policy to give feedback before appointment in the morning."},{"k":"c","t":"Perform blood glucose test on a patient admitted with Kussmaul respirations and change in level of consciousness."},{"k":"d","t":"Complete patient teaching prior to discharge in 2 hours."},{"k":"e","t":"Review procedure for inserting a PIC line to assist with procedure later this morning."}],"ans":["b","d","e"],"why":{"a":"Due in 3 days and low value. That is a C.","c":"Kussmaul respirations with a change in consciousness is a safety emergency. That is an A."}},{"id":"25-r4","ch":25,"type":"sata","stem":"The first task assigned by the time management coach is for the nurse to list all external distractors that prevent organization and completion of tasks. What would the nurse include on this list?","rat":"Waiting, such as for meetings or oncoming shift, is an external distraction. Socializing with visitors is an external distraction.","bloom":"Application","opts":[{"k":"a","t":"Waiting for oncoming shift to start walking rounds"},{"k":"b","t":"Failing to delegate tasks to the team members but instead, completing task herself"},{"k":"c","t":"Talking with a patient’s family member who is also a personal friend"},{"k":"d","t":"Spending time thinking about the vacation to the beach"},{"k":"e","t":"Using the Internet to read about a new drug that will be administered"}],"ans":["a","c"],"why":{"b":"Not delegating is her own habit. Internal.","d":"Daydreaming happens inside her own head. Internal.","e":"Choosing to go read online is under her control. Internal."}},{"id":"25-c1","ch":25,"type":"fill","stem":"The most important step in time management is ____________.","rat":"It is important to plan before beginning any task, project, or day’s activities. Planning involves (1) setting goals and establishing priorities, (2) scheduling activities, and (3) making to-do lists.","bloom":"Comprehension","accept":["planning","plan","to plan"],"hints":["It comes before any task, project or day begins.","It covers setting goals and priorities, scheduling activities and making to-do lists."],"ansText":"planning"},{"id":"28-m1","ch":28,"type":"mc","stem":"When may the graduates from approved schools of nursing sign their charting as registered nurses (RNs)?","rat":"A compulsory license requirement must be met to legally practice or work as a registered nurse in any state or U.S. territory. Licenses are granted only after an applicant has successfully passed the NCLEX-RN examination. None of the other options provide that legal proof.","bloom":"Comprehension","opts":[{"k":"a","t":"After passing the National Council Licensure Examination for Registered Nurses (NCLEX-RN)"},{"k":"b","t":"When the State Board has been provided with evidence of mental competency"},{"k":"c","t":"After supplying written proof of physical fitness to their employer"},{"k":"d","t":"When they have signed an employment contract with a health care facility"}],"ans":["a"],"why":{"b":"Evidence of mental competency does not grant the RN title.","c":"A fitness note for an employer has no bearing on licensure.","d":"A job contract does not make anyone licensed."}},{"id":"28-m2","ch":28,"type":"mc","stem":"Which statement concerning the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination is correct?","rat":"The purpose of the NCLEX-RN examination is to determine safe practice and the ability of candidates to perform at the entry level. Candidates from all three types of nursing programs must demonstrate the same competencies. None of the other options present accurate information about this licensure exam.","bloom":"Knowledge","opts":[{"k":"a","t":"Graduates from all three types of nursing programs (diploma, associate degree, and baccalaureate degree) take the same NCLEX-RN examination."},{"k":"b","t":"The NCLEX-RN is scored on an interval scale rather than on a pass-fail basis."},{"k":"c","t":"The NCLEX-RN examination is offered twice a year in major urban areas."},{"k":"d","t":"The candidate gets their NCLEX-RN results by mail."}],"ans":["a"],"why":{"b":"The result is pass or fail.","c":"It is offered year-round at testing centers.","d":"The test bank treats this as inaccurate."}},{"id":"28-m3","ch":28,"type":"mc","stem":"What does the phrase computerized adaptive testing imply?","rat":"Computerized adaptive testing is based on the measurement theory, by which the candidate must prove with a score of 95% that he or she is safe and knowledgeable at entry into the practice level. None of the other options present accurate information about this form of testing.","bloom":"Comprehension","opts":[{"k":"a","t":"The candidate must be computer literate."},{"k":"b","t":"Competency is determined based on the difficulty of questions, knowledge of the nursing process, and the number of questions answered correctly."},{"k":"c","t":"That the testing facilities have been adapted so the physically challenged candidate has easy access."},{"k":"d","t":"That the questions cannot be adapted to the individual needs of the student."}],"ans":["b"],"why":{"a":"Adaptive describes the questions, not the candidate’s computer skills.","c":"Adaptive describes the questions, not the building.","d":"The opposite. Each question is chosen from how the candidate answered the last one."}},{"id":"28-m4","ch":28,"type":"mc","stem":"On the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination, when the candidate is asked to set goals in collaboration with other members of the health care team, the nurse is being tested on what area of nursing practice?","rat":"Setting goals is one of the first steps in the planning process. Planning is the third phase of the nursing process and includes setting realistic and measurable mutual goals, developing interventions to meet or resolve identified patient needs or problems, and modifying goals as necessary. The fourth phase of the nursing process is implementation. This stage includes initiating and carrying out nursing interventions or nursing actions to achieve the goals set in the planning phase of the nursing process. Analysis is the second step or phase of the nursing process. Client-related data gathered during assessment provide the basis for analysis. During this phase, the nurse classifies or groups assessment data and identifies actual or potential client problems.","bloom":"Comprehension","opts":[{"k":"a","t":"Assessment"},{"k":"b","t":"Planning"},{"k":"c","t":"Analysis"},{"k":"d","t":"Implementation"}],"ans":["b"],"why":{"a":"Assessment is gathering data.","c":"Analysis is grouping data and naming the problems.","d":"Implementation carries out interventions toward goals that already exist."}},{"id":"28-m5","ch":28,"type":"mc","stem":"What is the length of the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination based upon?","rat":"The length of the examination is based on the ability of candidates to provide 95% confidence that they are safe practitioners and have acquired a minimal level of knowledge about the nursing process. The length of the examination ranges from 75 to 265 questions, and it takes up to 6 hours to complete.","bloom":"Application","opts":[{"k":"a","t":"The method of random selection"},{"k":"b","t":"The location of testing"},{"k":"c","t":"The candidate’s educational preparation"},{"k":"d","t":"The performance of the candidate"}],"ans":["d"],"why":{"a":"Questions are not random. Each one depends on the answer before it.","b":"Location has no effect on length.","c":"Diploma, associate and baccalaureate graduates all take the same exam."},"note":"The textbook numbers here are older than the exam you will sit. This chapter teaches 75 to 265 questions and a 6-hour limit; the current NCLEX-RN runs 85 to 150 items with a 5-hour limit. Answer course exams the way the textbook states it."},{"id":"28-m6","ch":28,"type":"mc","stem":"What is the primary purpose of the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination?","rat":"The purpose of the NCLEX-RN examination is twofold: (1) to safeguard the public from unsafe practitioners and (2) to determine whether candidates can perform entry level skills.","bloom":"Comprehension","opts":[{"k":"a","t":"Ensuring that practitioners have the minimum skills and knowledge needed to provide care that will produce the best patient care outcomes"},{"k":"b","t":"Effective regulation of nursing education"},{"k":"c","t":"To determine the mandatory educational level required for nurses to practice"},{"k":"d","t":"The basis of accreditation process for schools of nursing"}],"ans":["a"],"why":{"b":"The exam tests candidates. It does not regulate schools.","c":"It does not set the education level required.","d":"Accreditation is a separate process."}},{"id":"28-m7","ch":28,"type":"mc","stem":"A student nurse who is preparing to graduate and take the licensure examination asks, “What is compulsory licensure?” What is the appropriate response of the nursing advisor?","rat":"Licensure is a prerequisite for practice to ensure public safety.","bloom":"Knowledge","opts":[{"k":"a","t":"All candidates wishing to take the licensure examination must pass a drug screen."},{"k":"b","t":"Candidates must not have a felony conviction."},{"k":"c","t":"To practice as an RN, the nurse must be licensed as a registered nurse (RN)."},{"k":"d","t":"An impaired nurse must sign a legal document to acknowledge limitations on his or her practice."}],"ans":["c"],"why":{"a":"Drug screening is not what the term means.","b":"Criminal history rules are separate from this definition.","d":"That describes a practice agreement for an impaired nurse."}},{"id":"28-m8","ch":28,"type":"mc","stem":"The National Council of State Boards of Nursing determines acceptable National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination questions based on what criteria?","rat":"Periodically, the National Council of State Boards of Nursing surveys health care providers to identify nursing care activities of entry level nurses.","bloom":"Comprehension","opts":[{"k":"a","t":"The geographic location of the candidate"},{"k":"b","t":"Research that indicates needed skills for positions in which most entry level nurses are employed"},{"k":"c","t":"Surveys conducted by employers to determine the weaknesses of entry level nurses"},{"k":"d","t":"Surveys of physicians performed to determine what nurses must know to provide safe care"}],"ans":["b"],"why":{"a":"Geography does not shape the item pool.","c":"Items are not built from employer complaints.","d":"Physician opinion is not the basis."}},{"id":"28-m9","ch":28,"type":"mc","stem":"Although the NCLEX-RN examination has new formats for questions, what is the most common format?","rat":"Most NCLEX-RN examination questions have three distracters and one correct answer, but the examination allows all four levels of Bloom’s taxonomy to be tested.","bloom":"Knowledge","opts":[{"k":"a","t":"Fill-in-the-blank item because candidates are not provided with clues from distracters"},{"k":"b","t":"Multiple-choice question item, which allows candidates to select the one correct answer"},{"k":"c","t":"Multiple-response item because these questions require a higher level of critical thinking"},{"k":"d","t":"Hot-spot item because these questions are written at the application level of Bloom’s analysis"}],"ans":["b"],"why":{"a":"This format exists, but it is not the most common.","c":"This format exists, but it is not the most common.","d":"This format exists, but it is not the most common."}},{"id":"28-m10","ch":28,"type":"mc","stem":"When delegating care, the RN assigns one nurse to care for a patient with shingles and a different nurse to care for a patient with human immunodeficiency virus/acquired immunodeficiency disease syndrome (HIV/AIDS). This represents which category of nursing care?","rat":"The nurse is safeguarding the patient with immunosuppression from the possible transmission of an infection.","bloom":"Analysis","opts":[{"k":"a","t":"Safe and effective care environment"},{"k":"b","t":"Health promotion and maintenance"},{"k":"c","t":"Psychosocial integrity"},{"k":"d","t":"Teaching/learning"}],"ans":["a"],"why":{"b":"Health promotion covers wellness, development and prevention.","c":"Psychosocial integrity covers coping and mental health.","d":"Teaching/learning is an integrated process, not a client-need category, and no teaching happens here."}},{"id":"28-m11","ch":28,"type":"mc","stem":"A patient is brought to the unit with mediastinal chest tubes with no fluctuation in the water seal chamber; arterial blood gas results reveal pH, 7.55; CO2, 55; HCO3, 28 mEq/L, and O2, 98%. Carotid artery pulsation is visible with the head of the bed elevated and the use of tangential lighting. What should be the nurse’s first action? The above question represents which level of Bloom’s taxonomy?","rat":"In analysis, the candidate must make a judgment call after determining relationships among data. Knowledge is the lowest and simplest level of learning within the cognitive domain, and it is demonstrated by remembering or recalling information. Comprehension, the second level of Bloom’s cognitive domain, is the fundamental level of understanding or the ability to grasp or summarize information or material or restate in one’s own words. The third cognitive level, application, refers to the ability to use learned information in new situations.","bloom":"Comprehension","opts":[{"k":"a","t":"Knowledge"},{"k":"b","t":"Comprehension"},{"k":"c","t":"Application"},{"k":"d","t":"Analysis"}],"ans":["d"],"why":{"a":"Knowledge is plain recall.","b":"Comprehension is restating something in your own words.","c":"Application uses one learned idea in a new situation. This stem makes you relate several pieces of data before judging, which is one level higher."},"note":"Reference ranges: pH 7.35 to 7.45, PaCO2 35 to 45 mm Hg, HCO3 22 to 26 mEq/L. Every value in this stem is on the high side, which is part of why the item takes analysis."},{"id":"28-m12","ch":28,"type":"mc","stem":"A candidate who is taking the NCLEX-RN examination received only 75 questions before the test was stopped. She called her professor and stated, “I passed. I had to answer only 75 questions.” The professor correctly provides what response?","rat":"Seventy-five questions is the minimum number of questions that can determine 95% competency of the candidate; however, receiving 75 questions can indicate that the candidate passed and was able to answer a broad range of questions covering the nursing process at higher cognitive levels, or it can mean that the candidate failed, answered even the lowest cognitive level questions incorrectly, and was unprepared in area/s of the nursing process.","bloom":"Application","opts":[{"k":"a","t":"“You are now officially licensed; you answered the more difficult questions correctly.”"},{"k":"b","t":"“It is possible to receive only 75 questions and not be successful; however, we will keep a positive attitude.”"},{"k":"c","t":"“If you were given only 75 questions, you will have to retest because this is not enough to determine competency.”"},{"k":"d","t":"“You must have been extremely close to the passing standard because the computer shut off.”"}],"ans":["b"],"why":{"a":"A result is not a license, and 75 questions does not prove a pass.","c":"In the textbook, 75 is the minimum needed to decide. No retest follows.","d":"Stopping at the minimum means the computer was sure, in one direction or the other."},"note":"The textbook numbers here are older than the exam you will sit. This chapter teaches 75 to 265 questions and a 6-hour limit; the current NCLEX-RN runs 85 to 150 items with a 5-hour limit. Answer course exams the way the textbook states it."},{"id":"28-m13","ch":28,"type":"mc","stem":"Which statement accurately describes an expectation of the NCLEX-RN examination tester?","rat":"In April 2007, the difficulty of the examination was increased, which would require higher cognitive level questions at the application and analysis level.","bloom":"Application","opts":[{"k":"a","t":"They will have to answer more than 75 questions to be 95% certain that they are above the passing standard."},{"k":"b","t":"They will be required to submit a 100-word essay on an important nursing topic to evaluate safe nursing practice."},{"k":"c","t":"They should study and take practice examinations written at the application and analysis level to ensure that they can meet the higher standards of nursing care and health care delivery."},{"k":"d","t":"They will have additional time to complete the examination because most questions will be prepared in the alternate format, thereby requiring critical thinking."}],"ans":["c"],"why":{"a":"A candidate can pass at the minimum.","b":"There is no essay.","d":"There is no extra time, and most items are still standard multiple choice."},"note":"The textbook numbers here are older than the exam you will sit. This chapter teaches 75 to 265 questions and a 6-hour limit; the current NCLEX-RN runs 85 to 150 items with a 5-hour limit. Answer course exams the way the textbook states it."},{"id":"28-m14","ch":28,"type":"mc","stem":"In the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination test plan, client needs form the organizing framework of the examination with questions in four categories: safe and effective care environment, health promotion and maintenance, psychosocial integrity, and physiologic integrity. Certain processes are then integrated throughout the categories of client needs. Which process is integrated into all client need categories?","rat":"Teaching and learning are the processes that are integrated, along with the nursing process, caring, communication, and documentation.","bloom":"Comprehension","opts":[{"k":"a","t":"Teaching/learning"},{"k":"b","t":"Health promotion"},{"k":"c","t":"Infection control"},{"k":"d","t":"Pharmacology"}],"ans":["a"],"why":{"b":"Health promotion is one of the four client-need categories.","c":"Infection control sits inside safe and effective care environment.","d":"Pharmacology sits inside physiologic integrity."}},{"id":"28-m15","ch":28,"type":"mc","stem":"Which action would help a student successfully prepare for the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination?","rat":"Practicing helps the student learn how questions are presented and what level of difficulty should be anticipated. Reviewing rationales for the answers is a teaching/learning opportunity that enables the student to judge whether the rationale used to answer the question is valid.","bloom":"Application","opts":[{"k":"a","t":"Making note cards that can easily be retrieved to list only facts"},{"k":"b","t":"Avoiding timing oneself while studying and when in the actual testing mode to decrease anxiety"},{"k":"c","t":"Asking peers for help because they had the same resources; especially seek their help for difficult concepts requiring critical thinking"},{"k":"d","t":"Practicing taking NCLEX-RN examination–type questions and reviewing rationales for correct and incorrect answers"}],"ans":["d"],"why":{"a":"Fact cards train recall. The exam tests application and analysis.","b":"Timing yourself builds pacing.","c":"Peers share your gaps. Rationales teach more reliably."}},{"id":"28-m16","ch":28,"type":"mc","stem":"The nurse prepares to apply sterile gloves needed for a procedure. After introducing self and verifying patient information, the nurse performs hand hygiene. The nurse should open the outer package and then perform the following steps in order: (items on left will be moved in correct order on the right) Open inner package, taking care not to touch inner surface. Put the glove on the nondominant hand using the sterile gloved hand. Put glove on dominant hand by grasping folded cuff edge, touching only inside of cuff. Adjust each glove carefully by sliding fingers under the cuffs. The above question represents which type of alternate-format question written at which level of Bloom’s taxonomy?","rat":"The drag-and-drop format questions require the candidate to place options in a specific order, moving them from left to right using the mouse. The level is comprehension because it requires the student to have a fundamental level of understanding and summarize the material.","bloom":"Analysis","opts":[{"k":"a","t":"Drag-and-drop item, comprehension"},{"k":"b","t":"Chart/exhibit item, analysis"},{"k":"c","t":"Multiple-response, application"},{"k":"d","t":"Hot-spot item, knowledge"}],"ans":["a"],"why":{"b":"A chart/exhibit item gives you data to read.","c":"Multiple response is select-all-that-apply.","d":"A hot spot has you click on a figure."}},{"id":"28-m17","ch":28,"type":"mc","stem":"A graduate is preparing for the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination. Based on the latest practice survey, the candidate would focus the most amount of time on which content?","rat":"The current NLN test blueprint indicates that pharmacologic and parenteral therapies account for between 12% and 18% of the examination.","bloom":"Application","opts":[{"k":"a","t":"Stages of grief"},{"k":"b","t":"Pharmacologic pain management"},{"k":"c","t":"Practices to promote rest and sleep"},{"k":"d","t":"Prioritization of workload to manage time effectively"}],"ans":["b"],"why":{"a":"Grief sits in psychosocial integrity, a smaller share of the plan.","c":"Rest and sleep sit in basic care and comfort, a smaller share.","d":"Management of care is a large share too, but it is not what the test bank keys. Read the note after you answer."},"note":"Check this one against your 2026 test plan. Recent NCSBN plans weight Management of Care at 15 to 21 percent and Pharmacological and Parenteral Therapies at 13 to 19 percent, which would make D defensible. The test bank keys B."},{"id":"28-m18","ch":28,"type":"mc","stem":"Which strategy would promote a high rate of success on the National Council Licensure Examination for Registered Nurses (NCLEX-RN) examination?","rat":"Candidates should carefully read the entire question and all answers before selecting an answer. None of the other options are as likely to result in correctly answering the question since none address the need to focus effectively on each question completely before answering.","bloom":"Comprehension","opts":[{"k":"a","t":"Since the examination is time limited, skip questions when unsure of the answer and return later if time permits."},{"k":"b","t":"Work quickly through the examination to answer as many questions as possible."},{"k":"c","t":"Mark questions that may need to have the answer reviewed to make it possible to quickly go back and make change after answering all questions."},{"k":"d","t":"Read the entire question and all possible answer options before selecting an answer."}],"ans":["d"],"why":{"a":"On a computer adaptive test you cannot skip a question and come back.","b":"Speed is not rewarded.","c":"You cannot go back and change answers."}},{"id":"28-m19","ch":28,"type":"mc","stem":"A candidate is taking the NCLEX-RN examination when the computer turns off. The candidate was aware they had reached the 6-hour time limit. A count of completed questions had been recorded on the note pad, and 100 questions were answered. How will the examination be scored?","rat":"Run-out-of-time rule: if the candidate has answered the minimum number of questions, the computer analyzes the last 60 questions to determine if these questions were above or below the passing standard.","bloom":"Comprehension","opts":[{"k":"a","t":"The computer will analyze the last 60 questions and if above the passing standard, the candidate passes."},{"k":"b","t":"The candidate will be administered an additional 50 questions to determine ability to reach the 95% confidence interval."},{"k":"c","t":"If the time runs out, the candidate automatically fails the examination because it is impossible to determine if candidate is safe."},{"k":"d","t":"The candidate has the option to complete a simulated examination to show competence."}],"ans":["a"],"why":{"b":"No more questions are given after time expires.","c":"Running out of time is not an automatic fail once the minimum is answered.","d":"There is no make-up simulation."},"note":"The textbook numbers here are older than the exam you will sit. This chapter teaches 75 to 265 questions and a 6-hour limit; the current NCLEX-RN runs 85 to 150 items with a 5-hour limit. Answer course exams the way the textbook states it."},{"id":"28-m20","ch":28,"type":"mc","stem":"The order reads: Administer 500 mg of cefazolin sodium intramuscular. Using information located on the medication vial, the nurse will administer how many mL? The above question represents which type of alternate-format question written at which level of Bloom’s taxonomy?","rat":"The chart/exhibit presents the candidate with a chart or exhibit with information needed to answer the question. The question is at the analysis level since the candidate must calculate the correct amount to be given using a label requiring dilution.","bloom":"Comprehension","opts":[{"k":"a","t":"Multiple-response item, comprehension level"},{"k":"b","t":"Hot-spot item, application level"},{"k":"c","t":"Chart/exhibit item, analysis level"},{"k":"d","t":"Drag-and-drop item, knowledge level"}],"ans":["c"],"why":{"a":"Nothing here asks the candidate to select several answers.","b":"The candidate reads a label. Nothing is clicked on a figure.","d":"Nothing is being placed in order."},"fig":{"kind":"text","text":"Figure in the original: a vial label for cefazolin sodium 500 mg with reconstitution directions printed on it."}},{"id":"28-m21","ch":28,"type":"mc","stem":"A patient with end-stage renal disease has a potassium level of 7.5 mEq/L. Based on this laboratory result, the nurse interprets which symptom as significant prompting which action?","rat":"It is important to remember that candidates have specified laboratory values for which they must know the normal range and clinical manifestations when values are high, low, or critical. This question addresses an alteration in body system homeostasis. The student must know the normal lab value for potassium and common symptoms, as well as the correct nursing action.","bloom":"Analysis","opts":[{"k":"a","t":"Drowsiness, stimulate the patient every 30 minutes"},{"k":"b","t":"Confusion, ask the patient to state their name and date of birth"},{"k":"c","t":"Irregular heartbeat, evaluate the patient’s capillary refill"},{"k":"d","t":"Muscle cramps, elevate the affected limb"}],"ans":["a"],"why":{"b":"Stating name and date of birth is identification. It does not respond to a potassium of 7.5.","c":"An irregular heartbeat is the real danger with high potassium, but capillary refill does not address it. The action does not match the finding.","d":"Elevating a limb does nothing for an electrolyte problem."},"note":"Reference range: potassium 3.5 to 5.0 mEq/L, so 7.5 is critically high. Check this key with your professor. The test bank marks A, and its rationale never explains why. Clinically, the dangerous finding with hyperkalemia is an irregular heartbeat, though option C pairs it with an action that does not address it."},{"id":"28-m22","ch":28,"type":"mc","stem":"A patient presents with chest pain that increases when lying flat and a low-grade fever. Assessment reveals muffled heart sounds, tachycardia, and 3+ edema in the lower extremities. The nurse asks the patient to lean forward, which eases respiratory efforts. The nurse then places the stethoscope at which area on the chest to facilitate auscultation? The above question represents which type of alternate-format question written at which level of Bloom’s taxonomy?","rat":"This is a hot-spot item; students are presented with a figure on which they must indicate the answer by clicking the mouse over the area. The student would place the mouse over the left sternal border. It is analysis level because the student must take data from many sources to provide a complete assessment of the patient’s condition.","bloom":"Comprehension","opts":[{"k":"a","t":"Multiple-response item, comprehension level"},{"k":"b","t":"Hot-spot item, analysis level"},{"k":"c","t":"Chart/exhibit item, application level"},{"k":"d","t":"Drag-and-drop item, knowledge level"}],"ans":["b"],"why":{"a":"Nothing here asks the candidate to select several answers.","c":"A chart/exhibit gives data to read. This one asks where on the chest.","d":"Nothing is being placed in order."},"fig":{"kind":"text","text":"Figure in the original: a drawing of the chest and heart with four points labeled A to D."}},{"id":"28-o1","ch":28,"type":"order","stem":"The nurse prepares to apply sterile gloves needed for a procedure. After introducing self and verifying patient information, the nurse performs hand hygiene. The nurse should open the outer package and then perform the remaining steps in which order?","rat":"The nurse should open the inner package first, then put the glove on the dominant hand before the nondominant hand before adjusting the gloves.","bloom":"Application","opts":[{"k":"a","t":"Open inner package, taking care not to touch inner surface."},{"k":"b","t":"Put the glove on the nondominant hand using the sterile gloved hand."},{"k":"c","t":"Put glove on dominant hand by grasping folded cuff edge, touching only inside of cuff."},{"k":"d","t":"Adjust each glove carefully by sliding fingers under the cuff."}],"ans":["a","c","b","d"],"hints":["The first glove goes on with a bare hand, so that hand may only touch the inside of the cuff. Decide which hand gets gloved first.","A sterile gloved hand can touch sterile surfaces. Use that to place the second glove, and save the fine-tuning for last."]},{"id":"5-m1","ch":5,"type":"mc","stem":"Which nursing theory might a nurse use as a conceptual framework to determine how to meet the needs of immigrants while ensuring provision of high-quality and culturally sensitive care?","rat":"Madeleine Leininger proposed the theory of cultural care diversity and universality. This theory of transcultural nursing comprises concepts involving caring and the components of a cultural care theory: diversity, universality, worldview, and ethnohistory. None of the other options are directly associated with cultural diversity and sensitivity.","bloom":"Comprehension","opts":[{"k":"a","t":"Martha Rogers’ nursing theory"},{"k":"b","t":"Dorothea Orem’s nursing theory"},{"k":"c","t":"Hildegard Peplau’s nursing theory"},{"k":"d","t":"Madeleine Leininger’s nursing theory"}],"ans":["d"],"why":{"a":"Rogers describes humans as energy fields interacting with the environment.","b":"Orem is about self-care.","c":"Peplau is about the nurse-patient relationship."}},{"id":"5-m2","ch":5,"type":"mc","stem":"What term is used to identify the process used to determine the relationships among related concepts and a common theme?","rat":"A model is a group of concepts that are associated because of their relevance to a common theme. None of the other terms relate to this process.","bloom":"Application","opts":[{"k":"a","t":"Hypothesis"},{"k":"b","t":"Model"},{"k":"c","t":"Construct"},{"k":"d","t":"Variable"}],"ans":["b"],"why":{"a":"A hypothesis is a testable prediction.","c":"A construct is a building block, not a grouping around a theme.","d":"A variable is something measured that can change."}},{"id":"5-m3","ch":5,"type":"mc","stem":"The statement, “Nursing is a caring profession that focuses on helping people be as healthy as possible,” is an example of what term?","rat":"A philosophy is the values and beliefs of the discipline. The statement presents a value and belief associated with nursing.","bloom":"Comprehension","opts":[{"k":"a","t":"Concept"},{"k":"b","t":"Construct"},{"k":"c","t":"Philosophy"},{"k":"d","t":"Model"}],"ans":["c"],"why":{"a":"A concept is a label for one idea, object or event.","b":"A construct is a building block. This sentence states a belief.","d":"A model groups concepts around a theme. This sentence states a belief."}},{"id":"5-m4","ch":5,"type":"mc","stem":"Which nursing theory served as the foundation for nursing science?","rat":"Florence Nightingale investigated the effect of the environment on healing, and this serves as the foundation for nursing science.","bloom":"Comprehension","opts":[{"k":"a","t":"Rogers’ science of unitary human beings"},{"k":"b","t":"Nightingale’s theory of practice"},{"k":"c","t":"Watson’s theory of human caring"},{"k":"d","t":"King’s theory of goal attainment"}],"ans":["b"],"why":{"a":"This came much later and built on the foundation.","c":"This came much later and built on the foundation.","d":"This came much later and built on the foundation."}},{"id":"5-m5","ch":5,"type":"mc","stem":"A community health nurse has been visiting a postpartum client who experienced domestic violence throughout the pregnancy, and now she and the infant may be at risk. The nurse assisted the client in finding shelter and legal protection. Which conceptual framework is the basis for the nurse’s safety interventions?","rat":"In Roy’s adaptation model, when the client incurs an insult that renders him or her in need of environmental modification, the nurse will be the change agent in assisting the individual with this adaptation. None of the other options deal with the basic client need for an environmental change to assure safety.","bloom":"Application","opts":[{"k":"a","t":"Change agent, according to Roy’s adaptation model"},{"k":"b","t":"Translator, according to Leininger’s theory of cultural care diversity and universality"},{"k":"c","t":"Case manager, according to Peplau’s interpersonal relations model"},{"k":"d","t":"Caregiver, according to Rogers’ science of unitary human beings"}],"ans":["a"],"why":{"b":"The scenario has no language or culture barrier.","c":"Peplau centers on the therapeutic relationship. Here the nurse changes the client’s surroundings.","d":"Arranging shelter and legal protection is more than giving care."}},{"id":"5-m6","ch":5,"type":"mc","stem":"What term is used to identify the general explanations that scholars use to explain, predict, control, and understand commonly occurring events?","rat":"Theories are a group of related concepts that explain existing phenomena and predict events. Theories provide us with a frame of reference, the ability to choose concepts to study, or ideas that are within one’s practice.","bloom":"Comprehension","opts":[{"k":"a","t":"Theories"},{"k":"b","t":"Constructs"},{"k":"c","t":"Systems"},{"k":"d","t":"Propositions"}],"ans":["a"],"why":{"b":"Constructs are building blocks, not the explanation itself.","c":"A system is a set of interacting parts.","d":"A proposition states one relationship between concepts."}},{"id":"5-m7","ch":5,"type":"mc","stem":"Which type of theory most often guides present nursing practice?","rat":"Middle range theory is a nursing theory that refers to a specific population or to a specific situation, thereby making the theory easy to understand. An example is the theory of unpleasant symptoms (Lenz and Pugh), which examines symptoms that are influenced by physiologic, psychological, and situational factors as they relate to performance.","bloom":"Knowledge","opts":[{"k":"a","t":"Grand theory"},{"k":"b","t":"Middle range theory"},{"k":"c","t":"Developmental theory"},{"k":"d","t":"Values theory"}],"ans":["b"],"why":{"a":"Grand theories are broad and abstract, which makes them hard to apply directly.","c":"This is not one of the levels of nursing theory.","d":"This is not one of the levels of nursing theory."}},{"id":"5-m8","ch":5,"type":"mc","stem":"A client is hypertensive, and the doctor prescribes weight reduction. The client is excited about beginning the diet, but on arriving home the spouse states, “You have always been fat, and I am not going to starve because you can’t control yourself.” The client becomes anxious and is unable to participate in the diet plan, resulting in a weight gain of 5 pounds in 2 weeks. Which theorist could best be referred to for guidance regarding interventions in this situation?","rat":"Hildegard Peplau’s theory describes interpersonal relations as a nursing process. Nursing intervention in Peplau’s model focuses on reducing related incapacitating stressors through therapeutic interpersonal interaction.","bloom":"Application","opts":[{"k":"a","t":"Martha E. Rogers"},{"k":"b","t":"Hildegard E. Peplau"},{"k":"c","t":"Florence Nightingale"},{"k":"d","t":"Myra Estrin Levine"}],"ans":["b"],"why":{"a":"Rogers is about energy fields. The stressor here comes from a relationship.","c":"Nightingale is about the physical environment.","d":"Levine is about conserving energy and integrity."}},{"id":"5-m9","ch":5,"type":"mc","stem":"A nurse believes that humans use creativity and critical thinking to balance their connections with their surroundings. The nurse decides to conduct a study based on this belief. Which nursing theory would be best for this study?","rat":"Rogers’ science of unitary human beings, in which humans are energy fields that interact constantly with the environment, is a theory in which the nurse promotes synchronicity between human beings and their universe/environment.","bloom":"Comprehension","opts":[{"k":"a","t":"Peplau’s interpersonal relations as a nursing process: man as an organism that exists in an unstable equilibrium"},{"k":"b","t":"Roy’s adaptation model: assistance with the adaptation to stressors to facilitate the integration process of the client"},{"k":"c","t":"Orem’s self-care deficit model: self-care, self-care deficits, and nursing systems"},{"k":"d","t":"Rogers’ science of unitary human beings: humans as energy fields that interact constantly with the environment"}],"ans":["d"],"why":{"a":"Peplau is about the nurse-patient relationship.","b":"Roy is about adapting to stressors.","c":"Orem is about self-care."}},{"id":"5-m10","ch":5,"type":"mc","stem":"A client involved in a motor vehicle accident is blinded. The nurse helps the client obtain a guide dog so the client may continue grocery shopping and visiting friends and family. This enables the client to cope with the handicap and perform activities of daily living. Which nursing theory can be applied to this scenario?","rat":"In Orem’s self-care deficit theory, the nurse implements measures to help clients meet self-care needs by matching them with an appropriate supportive intervention.","bloom":"Comprehension","opts":[{"k":"a","t":"Watson’s philosophy and science of caring and humanistic nursing"},{"k":"b","t":"Mishel’s uncertainty in illness"},{"k":"c","t":"Orem’s self-care deficit"},{"k":"d","t":"Rogers’ science of unitary human beings"}],"ans":["c"],"why":{"a":"Watson is about the caring relationship.","b":"Mishel is about uncertainty.","d":"Rogers is about energy fields."}},{"id":"5-m11","ch":5,"type":"mc","stem":"A young child is having abdominal pain, and the doctor informs the parents that a computed tomography (CT or CAT) scan of the abdomen will be ordered. The doctor tells the child, “This CAT scan won’t hurt you.” The child is visibly upset because of a fear of cats. According to Mishel’s uncertainty in illness theory, which stage of the framework is represented?","rat":"In the stimuli frame, the client reacts to some stimulus in a negative manner. The nurse at this stage should listen carefully and then initiate, seek, and clarify concerns and questions.","bloom":"Comprehension","opts":[{"k":"a","t":"Stimuli frame"},{"k":"b","t":"Appraisal stage"},{"k":"c","t":"Initiation of coping mechanisms"},{"k":"d","t":"Adaptation"}],"ans":["a"],"why":{"b":"Appraisal comes next, when the person judges the uncertainty.","c":"Coping comes after appraisal.","d":"Adaptation is the end result."}},{"id":"5-m12","ch":5,"type":"mc","stem":"A nurse researcher determines whether findings are substantial by calculating the level of significance. Which aspect of the scientific inquiry is being conducted?","rat":"During evaluation, results are examined with the goal of determining the relevance of outcome data in answering the hypothesis; the significance of the data and the potential for future research are also explored.","bloom":"Application","opts":[{"k":"a","t":"Hypothesis"},{"k":"b","t":"Method"},{"k":"c","t":"Data collection"},{"k":"d","t":"Evaluation"}],"ans":["d"],"why":{"a":"The hypothesis is the prediction made before any data exist.","b":"Method is the plan for what to collect and how.","c":"Data collection is the gathering itself."}},{"id":"5-m13","ch":5,"type":"mc","stem":"At delivery the physician informs the mother who has practiced nursing for 10 years, “Your baby has Alport syndrome, but then I don’t have to explain what that means with your medical background.” The mother is unfamiliar with this disease and withdraws as a coping mechanism. Which nursing theory would provide a framework to guide nursing care for this mother?","rat":"In Mishel’s uncertainty of illness theory, the core position is that uncertainty in illness must be addressed. When uncertainties are not addressed, clients’ negative perceptions will escalate and they will suffer. Nursing responsibility based on this theory consists of reframing the client’s perceived loss of control, or uncertainty, and helping the client develop new skills of assimilation and accommodation.","bloom":"Comprehension","opts":[{"k":"a","t":"Mishel’s uncertainty of illness"},{"k":"b","t":"Orem’s self-care deficit model"},{"k":"c","t":"Nightingale’s canons of nursing"},{"k":"d","t":"Levine’s conservation model"}],"ans":["a"],"why":{"b":"She can care for herself. The problem is not knowing what the diagnosis means.","c":"Nightingale is about the physical environment.","d":"Levine is about conservation."}},{"id":"5-m14","ch":5,"type":"mc","stem":"When applying Nightingale’s theory to current practice, the nurse’s first step will be to evaluate the hospital room’s air quality. What should be the nurse’s second step?","rat":"Nightingale believed the need for light was second only to the need for fresh air.","bloom":"Application","opts":[{"k":"a","t":"Making certain that the volume of the television is not too loud"},{"k":"b","t":"Consulting the dietitian to assure that a client’s diet is meeting MyPyramid requirements"},{"k":"c","t":"Asking the family to bring family photographs and bright-colored throws for the bed of a client’s room"},{"k":"d","t":"Arrange for the client’s window blinds to remain open as appropriate"}],"ans":["d"],"why":{"a":"Noise mattered to Nightingale, but it was not second.","b":"Diet mattered to Nightingale, but it was not second.","c":"Variety and color come further down her list."}},{"id":"5-m15","ch":5,"type":"mc","stem":"A nurse develops a new nursing theory related to stress and viability. The nurse determines the theory accounts for historical events in which soldiers suffering from the stress of inadequate clothing to protect them from the cold and lack of correspondence from home had an increased mortality related to gunshot wounds. The theory will predict gunshot victims’ need for proper clothing and letters from significant others as they serve in Iraq. Which criterion for theory acceptance is being validated?","rat":"The accuracy of a theory is its ability to explain past occurrences while being useful in determining future outcomes.","bloom":"Application","opts":[{"k":"a","t":"Inclusiveness"},{"k":"b","t":"Consistency"},{"k":"c","t":"Accuracy"},{"k":"d","t":"Simplicity"}],"ans":["c"],"why":{"a":"Inclusiveness asks whether all related concepts are included.","b":"Consistency asks whether concepts are handled the same way throughout.","d":"Simplicity asks whether the theory is clear and brief."}},{"id":"5-m16","ch":5,"type":"mc","stem":"A nurse practicing on a unit where domestic violence is common wants to learn how to apply nursing theory to practice on this unit. The nurse considers the interrelatedness of the constructs of Watson’s Theory of Caring and creates a design related to what?","rat":"The conceptual model demonstrates how the concepts of compassion, commitment, conscience, confidence, and competence form a theme of caring (Watson).","bloom":"Comprehension","opts":[{"k":"a","t":"Conceptual model of caring"},{"k":"b","t":"Hypothesis of the impact of caring on domestic violence"},{"k":"c","t":"Proposition of how caring is conceptualized"},{"k":"d","t":"Theory of scientific inquiry"}],"ans":["a"],"why":{"b":"A hypothesis is a testable prediction. She is arranging concepts.","c":"A proposition is a single statement relating concepts.","d":"Scientific inquiry is the research process."},"fig":{"kind":"5c"}},{"id":"5-m17","ch":5,"type":"mc","stem":"A nurse plans activity of daily living to prevent excessive fatigue while allowing the patient to exercise autonomy in selecting what they wear. This nurse is best applying which theory to practice?","rat":"Certain parts of all the theories can be applied; however, all the constructs of Levine’s Model of Conservation are applied, including energy conservation, structural integrity, personal integrity, and social integrity. In this situation, the nurse conserved energy by planning ADLs, conserved structural integrity through ROMs, conserved social integrity by helping patient with appearance during family visits, thus improving the milieu for social visits.","bloom":"Application","opts":[{"k":"a","t":"Watson’s Theory of Caring"},{"k":"b","t":"Rogers’ Theory of Unitary Humans"},{"k":"c","t":"Levine’s Theory of Conservation"},{"k":"d","t":"Leininger’s Theory of Transcultural Nursing"}],"ans":["c"],"why":{"a":"Watson centers on the caring relationship.","b":"Rogers centers on energy fields.","d":"Leininger centers on culture."}},{"id":"5-m18","ch":5,"type":"mc","stem":"A nurse is evaluating Levine’s Theory of Conservation to determine if it can be applied to patients in the initial phases of chemotherapy treatment. During this phase of theory acceptance, the nurse wants to determine if all the concepts of energy, structural integrity, personal integrity, and social integrity are included in the care of cancer treatment. The nurse is applying which criteria of theory acceptance?","rat":"Inclusiveness asks the question, “Does the theory include all concepts related to the area of interest?”","bloom":"Application","opts":[{"k":"a","t":"Inclusiveness"},{"k":"b","t":"Consistency"},{"k":"c","t":"Accuracy"},{"k":"d","t":"Fruitfulness"}],"ans":["a"],"why":{"b":"Consistency asks whether concepts are handled the same way throughout.","c":"Accuracy asks whether the theory explains the past and predicts the future.","d":"Fruitfulness asks whether the theory opens new directions for study."}},{"id":"5-m19","ch":5,"type":"mc","stem":"A nurse is heard making this comment, “I believe human dignity is based on perceived self-worth while caring is based on perceived role in society that forms the basis of nursing practice.” This nurse’s statement is associated with what action?","rat":"A proposition is a statement that proposes the relationship between and among concepts.","bloom":"Application","opts":[{"k":"a","t":"Demonstrating a model of human dignity"},{"k":"b","t":"Evaluating the relevance of L
