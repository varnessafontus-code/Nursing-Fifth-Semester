eininger’s Theory"},{"k":"c","t":"Applying Mishel’s Theory of Disease Uncertainty"},{"k":"d","t":"Making a proposition concerning the constructs of nursing practice"}],"ans":["d"],"why":{"a":"A model groups several concepts. This is one statement.","b":"Nothing in the comment evaluates Leininger.","c":"Nothing in the comment involves uncertainty in illness."}},{"id":"5-m20","ch":5,"type":"mc","stem":"A group of nurses are interested in how to improve teaching effectiveness for patients who have a hearing impairment and lack family involvement while hospitalized. They believe “hearing loss decreases the teaching effectiveness while hospitalized.” The group plans to evaluate teaching effectiveness using a 10-point Likert scale pre-post teaching, perform a hearing test to determine degree of hearing loss on admission, and have social work evaluate the impact of hearing impairment on patient’s ability to safely live alone prior to discharge. The group is working in which step of the scientific process?","rat":"During the method step, the group decides what data will be collected to answer the question and identifies step-by-step procedures that will be used to collect these data.","bloom":"Application","opts":[{"k":"a","t":"Hypothesis"},{"k":"b","t":"Method"},{"k":"c","t":"Results"},{"k":"d","t":"Evaluation"}],"ans":["b"],"why":{"a":"The hypothesis is already written in the stem, in quotation marks.","c":"There are no results yet.","d":"Evaluation interprets results that do not exist yet."}},{"id":"5-r1","ch":5,"type":"sata","stem":"Which of the following are concepts related to nursing theory?","rat":"Environment is a concept, which is a label given to ideas, objects, or events; concepts become the “pieces” that make up a conceptual model or theory. Health is a concept, which is a label given to ideas, objects, or events; concepts become the “pieces” that make up a conceptual model or theory. Nursing is a concept, which is a label given to ideas, objects, or events; concepts become the “pieces” that make up a conceptual model or theory. Comfort is a concept, which is a label given to ideas, objects, or events; concepts become the “pieces” that make up a conceptual model or theory.","bloom":"Comprehension","opts":[{"k":"a","t":"Environment"},{"k":"b","t":"Health"},{"k":"c","t":"Nursing"},{"k":"d","t":"Relevance"},{"k":"e","t":"Comfort"}],"ans":["a","b","c","e"],"why":{"d":"Relevance is a test used to judge a theory, not a piece inside one."}},{"id":"5-c1","ch":5,"type":"fill","stem":"The basic ingredients of theory are ____________.","rat":"A theory is defined as a group of related concepts that explain existing phenomena and predict future events.","bloom":"Knowledge","accept":["concepts","concept"],"hints":["Think of the smallest pieces a theory is built from.","A theory is defined as a group of related ____ that explain phenomena and predict events."],"ansText":"concepts"},{"id":"10-m1","ch":10,"type":"mc","stem":"What should the nurse who works with culturally diverse clients complete first, as a priority action?","rat":"The first step to becoming a culturally sensitive and competent health care provider is to conduct a cultural self-assessment. Through identification of health-related attitudes, values, beliefs, and practices, the nurse can better understand the cultural aspects of health care from the client’s perspective.","bloom":"Application","opts":[{"k":"a","t":"A sign language course"},{"k":"b","t":"Cultural self-assessment"},{"k":"c","t":"Cultural client assessment"},{"k":"d","t":"A conversational Spanish course"}],"ans":["b"],"why":{"a":"A language skill helps, but it is not the first step.","c":"Assess the client after you know your own biases.","d":"A language skill helps, but it is not the first step."}},{"id":"10-m2","ch":10,"type":"mc","stem":"A nurse is caring for a recent Asian immigrant client and is overheard making the following comment, “These rituals you believe in are false. You live in America now and must believe in realistic health practices, like Americans do.” The nurse is exhibiting behavior associated with what belief?","rat":"Ethnocentrism is the belief that one’s own ethnic group, culture, or nation is best.","bloom":"Comprehension","opts":[{"k":"a","t":"Stereotyping"},{"k":"b","t":"Ethnocentrism"},{"k":"c","t":"Cultural accommodation"},{"k":"d","t":"Empathy"}],"ans":["b"],"why":{"a":"Stereotyping assigns one trait to everyone in a group. This nurse is ranking one culture above another.","c":"Accommodation would support the client’s practices.","d":"Empathy would mean understanding the client’s view."}},{"id":"10-m3","ch":10,"type":"mc","stem":"A nurse is submitting a grant application to improve access to health care and mortality for minority groups. The grant focuses on the six causes of death that are identified as priorities for minorities, which include what medical diagnosis?","rat":"Cancer is identified as a leading cause of excessive death among minority group members. The six leading causes are cancer, cardiovascular disease and stroke, chemical dependency, diabetes, homicides/accidents, and infant mortality.","bloom":"Comprehension","opts":[{"k":"a","t":"Chronic obstructive pulmonary disease (COPD)"},{"k":"b","t":"Malnutrition"},{"k":"c","t":"Cirrhosis of the liver"},{"k":"d","t":"Breast cancer"}],"ans":["d"],"why":{"a":"This is not one of the six priority causes.","b":"This is not one of the six priority causes.","c":"This is not one of the six priority causes."}},{"id":"10-m4","ch":10,"type":"mc","stem":"A nurse is given a referral to make a home visit to a Russian immigrant. The nurse knows very little about the health beliefs of this ethnic group. To research this group, what term should the nurse use in an Internet search?","rat":"Marginalized populations include recently arrived immigrants. Their lives and health care needs are often kept secret and are understood only by them.","bloom":"Application","opts":[{"k":"a","t":"Federally recognized minorities"},{"k":"b","t":"Marginalized populations"},{"k":"c","t":"Asian/Pacific Islander cultures"},{"k":"d","t":"Latino cultures"}],"ans":["b"],"why":{"a":"Russian immigrants are not one of the federally defined minority groups.","c":"Wrong part of the world.","d":"Wrong part of the world."}},{"id":"10-m5","ch":10,"type":"mc","stem":"Which statement is true regarding health care for minorities?","rat":"Most families with racially or ethnically diverse backgrounds have a lower socioeconomic status than is observed in the population at large. Dramatic changes in technology and specialization in the health care field have caused health care costs to skyrocket. Therefore, not everyone can afford health care services.","bloom":"Comprehension","opts":[{"k":"a","t":"Federal legislation that provides free health insurance for minorities has resulted in fewer minorities than members of the general population who lack health insurance."},{"k":"b","t":"Higher costs of health care coupled with lower wages for minorities have prevented most minorities from seeking health care."},{"k":"c","t":"Because many Mexican Americans are highly skilled workers with comparable wages, they have the lowest uninsured rate."},{"k":"d","t":"Asians, because of their quiet demeanor and unwillingness to challenge the health care system, have the highest rate of uninsured people."}],"ans":["b"],"why":{"a":"No such legislation exists.","c":"The stem’s claim about wages and insurance is not what the text reports.","d":"This is a stereotype, not a finding."}},{"id":"10-m6","ch":10,"type":"mc","stem":"While completing a masters nursing degree in Virginia, a nurse who is interested in teaching in Laredo, Texas, enrolls in Spanish classes for 4 years, knowing that a high number of Mexican-Americans live there. This nurse is demonstrating what social value?","rat":"Cultural competence is the responsibility of all nurses to become knowledgeable about the values, beliefs, and health care practices of the culturally diverse groups that are dominant in the nurse’s practice area.","bloom":"Comprehension","opts":[{"k":"a","t":"Cultural competence"},{"k":"b","t":"Ethnocentrism"},{"k":"c","t":"Prejudice"},{"k":"d","t":"Stereotyping"}],"ans":["a"],"why":{"b":"Ethnocentrism is believing your own culture is best.","c":"Prejudice is a negative judgment made in advance.","d":"Stereotyping assigns one trait to everyone in a group."}},{"id":"10-m7","ch":10,"type":"mc","stem":"A nurse plans to move to an area that is rich in immigrants from several countries and is concerned about respecting others’ cultural beliefs. What is the nurse’s first step to ensure cultural competence and sensitivity?","rat":"A cultural self-assessment allows the nurse to identify attitudes about individuals from different cultures.","bloom":"Application","opts":[{"k":"a","t":"Enrolling in a nursing theories course to increase knowledge about transcultural practices"},{"k":"b","t":"Becoming immersed in nursing literature about culturally diverse clients"},{"k":"c","t":"Participating in continuing education that focuses on health assessment variations among cultural groups"},{"k":"d","t":"Conducting a cultural self-assessment to identify biases or prejudices"}],"ans":["d"],"why":{"a":"Useful later. The first step looks inward.","b":"Useful later. The first step looks inward.","c":"Useful later. The first step looks inward."}},{"id":"10-m8","ch":10,"type":"mc","stem":"An Asian teenager is admitted with an eating disorder which she attributes to not meeting the academic expectations of her parents. The nurse is overheard saying, “That isn’t the reason; all Asians are really smart.” This nurse is demonstrating which cultural bias?","rat":"Stereotyping is associating certain behavior or competencies with an ethnic group without considering the individual.","bloom":"Comprehension","opts":[{"k":"a","t":"Cultural humility"},{"k":"b","t":"Stereotyping"},{"k":"c","t":"Cultural assimilation"},{"k":"d","t":"Acculturation"}],"ans":["b"],"why":{"a":"Cultural humility is ongoing self-reflection and openness.","c":"Assimilation is a person taking on the dominant culture.","d":"Acculturation is a person adapting to a new culture."}},{"id":"10-r1","ch":10,"type":"sata","stem":"Six cultural phenomena that vary among cultural groups are known to affect health care. The influence of the consequences of these phenomena can be seen in which of the following?","rat":"The use of eye contact is a cultural communication phenomenon. Cultures such as black and American Indian may view direct eye contact as rude behavior. Space and touch are cultural phenomena factors. In some cultures, touching strangers is inappropriate. On the other hand, Mexican Americans tend to be comfortable with less space because they like to touch persons with whom they are talking.","bloom":"Analysis","opts":[{"k":"a","t":"Asians and American Indians tend to be nonadherent with medications because they believe that the environment has no control over their fate."},{"k":"b","t":"Some cancers such as stomach cancer occur less frequently among blacks."},{"k":"c","t":"Blacks and American Indians often resist direct eye contact."},{"k":"d","t":"Mexican Americans are more likely to stand close and touch health care providers."},{"k":"e","t":"Whites are often late for health care appointments."}],"ans":["c","d"],"why":{"a":"The test bank treats this claim as inaccurate.","b":"The test bank treats this claim as inaccurate.","e":"The test bank treats this claim as inaccurate."}},{"id":"10-r2","ch":10,"type":"sata","stem":"A nurse involved in researching the leading causes of death for minorities considers the federally defined minority groups, which include what populations?","rat":"The Federally defined minority groups include blacks, Hispanics, American Indians, and Asians or Pacific Islanders.","bloom":"Comprehension","opts":[{"k":"a","t":"Blacks"},{"k":"b","t":"Russians"},{"k":"c","t":"Hispanics"},{"k":"d","t":"Asians or Pacific Islanders"},{"k":"e","t":"Scandinavians"}],"ans":["a","c","d"],"why":{"b":"This is not one of the four federally defined groups.","e":"This is not one of the four federally defined groups."}},{"id":"10-c1","ch":10,"type":"fill","stem":"Although communication varies among members of different cultures, the greatest obstacle to providing multicultural care is differences in _____.","rat":"Language can be the greatest obstacle to providing multicultural care. If the client does not speak the same language as the nurse, a skilled interpreter is mandatory.","bloom":"Comprehension","accept":["language","languages","the language"],"hints":["It is the reason a skilled interpreter becomes mandatory.","It is the most basic part of communication: the words themselves."],"ansText":"language"},{"id":"26-m1","ch":26,"type":"mc","stem":"What should be the primary focus of the care provider role for the nurse?","rat":"The primary focus of the care provider’s role is to use the nursing process in caring for patients. While appropriate, the remaining options are relevant only after the nursing process is implemented and needs are identified.","bloom":"Comprehension","opts":[{"k":"a","t":"Using the nursing process to provide guidance to the patient in recovery"},{"k":"b","t":"Encouraging both consumer self-responsibility and health promotion/maintenance"},{"k":"c","t":"Focusing on increasing satisfaction among professional nurses"},{"k":"d","t":"Advancing nursing practice through research"}],"ans":["a"],"why":{"b":"Appropriate, but it comes after the nursing process identifies needs.","c":"Staff satisfaction is a manager’s concern.","d":"That is the researcher role."}},{"id":"26-m2","ch":26,"type":"mc","stem":"A nurse researcher is attempting to describe the demographics of today’s RNs and reports what relevant information?","rat":"A substantial number (48.6%) of nurses enter practice with a BSN.","bloom":"Comprehension","opts":[{"k":"a","t":"Less than half of all RNs work in hospital settings."},{"k":"b","t":"The average age for an RN is 50 years."},{"k":"c","t":"Approximately 25% of RNs are male."},{"k":"d","t":"Most RNs are entering practicing with a bachelor’s degree."}],"ans":["d"],"why":{"a":"This is not the figure the text reports.","b":"This is not the figure the text reports.","c":"This is not the figure the text reports."}},{"id":"26-m3","ch":26,"type":"mc","stem":"A hospital standard states, “All intravenous (IV) sites must be rotated every 72 hours.” The nurse who assesses and records variations from this standard is fulfilling which role of nursing?","rat":"The basic premise is to ensure that outcomes in client care services are consistent with established standards. The infection control nurse assesses the total incidence of infections within the hospital. The nurse in coordinator position is responsible for the coordination and integration of the clinical and administrative requirements of specific types of patients. A counselor is a person trained to give guidance on personal, social, or psychological problems.","bloom":"Comprehension","opts":[{"k":"a","t":"Infection control"},{"k":"b","t":"Quality management"},{"k":"c","t":"Coordinator position"},{"k":"d","t":"Counselor"}],"ans":["b"],"why":{"a":"Infection control tracks infection rates across the hospital.","c":"A coordinator integrates clinical and administrative needs for one type of patient.","d":"A counselor gives guidance on personal or psychological problems."}},{"id":"26-m4","ch":26,"type":"mc","stem":"The nurse who organizes screenings for employees, assesses the work environment for hazards, and teaches health-promoting activities is employed in what field of nursing?","rat":"The occupational health nurse organizes screenings for employees, assesses the work environment for hazards, and teaches health-promoting activities. Quality managers assess opportunities for process improvement, implement changes, measure outcomes. The infection control nurse assesses the total incidence of infections within the hospital. Nursing informatics (NI) focuses on management and processing of health care information.","bloom":"Comprehension","opts":[{"k":"a","t":"Infection control"},{"k":"b","t":"Occupational health"},{"k":"c","t":"Informatics"},{"k":"d","t":"Quality control"}],"ans":["b"],"why":{"a":"Infection control tracks infection rates in the hospital.","c":"Informatics manages and processes health information.","d":"Quality work measures outcomes against standards."}},{"id":"26-m5","ch":26,"type":"mc","stem":"The RN who identifies the best resources at the lowest cost to achieve optimal health outcomes for the client is fulfilling the responsibilities of what role?","rat":"The role of the case manager includes coordination of resources to achieve the best outcomes based on quality, access, and cost. Quality managers assess opportunities for process improvement, implement changes, measure outcomes. Nursing informatics (NI) focuses on management and processing of health care information. Nursing educators assume leadership in curriculum development, instruction, and evaluation.","bloom":"Comprehension","opts":[{"k":"a","t":"Informatics specialist"},{"k":"b","t":"Nursing educator"},{"k":"c","t":"Case manager"},{"k":"d","t":"Quality manager"}],"ans":["c"],"why":{"a":"Informatics manages and processes health information.","b":"Educators lead curriculum, instruction and evaluation.","d":"Quality managers improve processes and measure outcomes."}},{"id":"26-m6","ch":26,"type":"mc","stem":"A patient is admitted for a hip replacement complicated by uncontrolled diabetes and early dementia. The nurse coordinates referrals to an endocrinologist to establish an insulin protocol and organizes out-patient physical therapy in an Alzheimer’s assisted living facility upon discharge. This is included in what nursing role?","rat":"The role of the case manager includes coordination of resources to achieve the best outcomes based on quality, access, and cost. Quality managers assess opportunities for process improvement, implement changes, measure outcomes. Nursing informatics (NI) focuses on management and processing of health care information. Nursing educators assume leadership in curriculum development, instruction, and evaluation.","bloom":"Comprehension","opts":[{"k":"a","t":"Informatics specialist"},{"k":"b","t":"Educator"},{"k":"c","t":"Case manager"},{"k":"d","t":"Quality manager"}],"ans":["c"],"why":{"a":"Informatics manages and processes health information.","b":"No teaching happens in this stem.","d":"Quality managers improve processes and measure outcomes."}},{"id":"26-m7","ch":26,"type":"mc","stem":"An RN testifies at a trial where domestic violence is being investigated. She had previously assisted with specimen collection and had assessed the victim. The nurse is involved in _____ nursing.","rat":"The forensic nurse provides direct services to clients and consults with and serves as an expert witness for medical and law enforcement.","bloom":"Comprehension","opts":[{"k":"a","t":"triage"},{"k":"b","t":"forensic"},{"k":"c","t":"flight"},{"k":"d","t":"entrepreneurial"}],"ans":["b"],"why":{"a":"Triage sorts patients by urgency.","c":"Flight nursing is critical care during transport.","d":"An entrepreneur runs a nursing business."}},{"id":"26-m8","ch":26,"type":"mc","stem":"The forensic nurse would most likely be involved in what task?","rat":"Forensic nursing involves providing direct services to clients involved in abuse or victims of crimes and consults with medical and law enforcement.","bloom":"Application","opts":[{"k":"a","t":"Performing an assessment of rape victim and collecting specimens needed for court."},{"k":"b","t":"Assigning a patient with chest pain to be seen first, followed by a patient with an insect bite of unknown origin with red streaks but no respiratory distress."},{"k":"c","t":"Assessing a patient at home by asking the patient to place a receiver over the pacemaker to evaluate capture of pacing stimuli and transmitting the results to another state where nurse located."},{"k":"d","t":"Performing pediatric life support at the scene of an accident to stabilize then transport via helicopter to the nearest trauma center."}],"ans":["a"],"why":{"b":"Deciding who is seen first is triage.","c":"Remote monitoring across state lines is telehealth.","d":"Stabilizing at the scene and transporting by helicopter is flight nursing."}},{"id":"26-m9","ch":26,"type":"mc","stem":"A nurse in an acute care facility helps patients understand how to prevent diabetic neuropathies. This nurse is functioning in what nursing role?","rat":"A nurse functioning in the role of educator helps patients understand the complications of their disease process. The change agent determines alternative and explore possible outcomes of the alternatives; and assess cost-effective resources in infinite health-related situations. Managers manage multiple resources in a health care facility. Coordinators are responsible for the coordination and integration of the clinical and administrative requirements of specific types of patients.","bloom":"Comprehension","opts":[{"k":"a","t":"Change agent"},{"k":"b","t":"Educator"},{"k":"c","t":"Manager"},{"k":"d","t":"Coordinator"}],"ans":["b"],"why":{"a":"A change agent spots a delivery problem and builds a solution.","c":"A manager handles staffing and resources.","d":"A coordinator integrates care for a specific type of patient."}},{"id":"26-m10","ch":26,"type":"mc","stem":"A nurse notices that care is often withheld until an interpreter arrives, if the nurse is not multilingual. The nurse discusses this with the management team and suggests a three-part series be presented to the nursing staff to teach some commonly used medical terms in Spanish. This nurse is involved in what nursing role?","rat":"The role of the change agent consists of assessing health care delivery issues and creating solutions to improve health care delivery.","bloom":"Comprehension","opts":[{"k":"a","t":"Change agent"},{"k":"b","t":"Educator"},{"k":"c","t":"Manager"},{"k":"d","t":"Coordinator"}],"ans":["a"],"why":{"b":"Teaching is her solution, but the role shown is noticing a delivery problem and proposing a fix.","c":"A manager handles staffing and resources.","d":"A coordinator integrates care for a specific type of patient."}},{"id":"26-m11","ch":26,"type":"mc","stem":"A nurse tallies the patient satisfaction surveys and approves the use of an agency nurse because of the high census. This nurse is involved in which nursing role?","rat":"The manager is the one who assesses the need for staffing and must justify this in a substantial way. Through this approach, the manager indirectly provides care for patients and families.","bloom":"Comprehension","opts":[{"k":"a","t":"Change agent"},{"k":"b","t":"Educator"},{"k":"c","t":"Manager"},{"k":"d","t":"Coordinator"}],"ans":["c"],"why":{"a":"Nothing is being changed.","b":"Nothing is being taught.","d":"A coordinator integrates care for a specific type of patient."}},{"id":"26-m12","ch":26,"type":"mc","stem":"In differentiating between interprofessional and multidisciplinary which statement is true?","rat":"Interprofessional, as related to member roles, involves members of many disciplines working together to provide patient care to a distinct population.","bloom":"Knowledge","opts":[{"k":"a","t":"Multidisciplinary refers to the care of many diverse patients by one discipline."},{"k":"b","t":"Interprofessional involves members of many disciplines working together to provide patient care to a distinct population."},{"k":"c","t":"Interprofessional refers to members of the same discipline working together to provide patient care to a distinct population."},{"k":"d","t":"Interprofessional is the use of multiple interventions by nurses with varying levels of education."}],"ans":["b"],"why":{"a":"This has the definition backwards.","c":"One discipline working together is not interprofessional.","d":"Education level is not what the term is about."}},{"id":"26-m13","ch":26,"type":"mc","stem":"A person from an underrepresented background in nursing is interested in entering the nursing profession and researches the ethnicity, age, and gender make-up of the nursing profession and finds which fact most interesting?","rat":"It is true that advance nursing programs see a 30% enrollment of minority population students.","bloom":"Knowledge","opts":[{"k":"a","t":"Nursing is a career field that is primarily made up of women younger than 30 years."},{"k":"b","t":"The number of male registered nurses has steadily increased and is equal to the number of female registered nurses."},{"k":"c","t":"30% of students in advanced nursing education programs represent minority populations."},{"k":"d","t":"More than half of all registered nurses are ages 55 through 65."}],"ans":["c"],"why":{"a":"This is not what the workforce data show.","b":"Men remain a minority in nursing.","d":"This is not what the workforce data show."}},{"id":"26-m14","ch":26,"type":"mc","stem":"A nurse who is participating in a health fair asks, “Other than nursing, what are some opportunities for careers in the health care professions, and what education is required?” The nurse informs participants that a master’s degree is required as the minimum standard for which nursing role?","rat":"Certification as nurse practitioner is achieved via written examination after the completion of a master’s-level program.","bloom":"Knowledge","opts":[{"k":"a","t":"Clinical nurse specialist"},{"k":"b","t":"Occupational nurse practitioner"},{"k":"c","t":"Nurse-midwife"},{"k":"d","t":"Nurse anesthetist"}],"ans":["b"],"why":{"a":"The test bank does not key this option. Read the note after you answer.","c":"The test bank does not key this option. Read the note after you answer.","d":"The test bank does not key this option. Read the note after you answer."},"note":"Weak item. Clinical nurse specialists, nurse-midwives and nurse anesthetists also need graduate preparation. The test bank keys the nurse practitioner option because the chapter states NP certification follows a master’s-level program."},{"id":"26-m15","ch":26,"type":"mc","stem":"A nurse is interested in practicing in a faith-based community; when researching the role of the parish nurse, the nurse finds which statement to be true?","rat":"The role of parish nurse has become a recognized specialty in a growing professional practice. In 1998, the ANA established the scope and standards of this professional practice.","bloom":"Comprehension","opts":[{"k":"a","t":"Certification is available at a basic level after a qualifying examination is completed and a set number of practice hours have been worked, as defined by the state’s nurse practice act."},{"k":"b","t":"This advanced practice role focuses on health promotion and disease prevention."},{"k":"c","t":"This role has no set standards or scope of practice but instead follows the doctrine of the denomination being served."},{"k":"d","t":"This role is recognized by the American Nurses Association (ANA) as a specialty with a defined set of practice guidelines."}],"ans":["d"],"why":{"a":"This is not how the text describes the credential.","b":"Parish nursing is not an advanced practice role.","c":"It does have a defined scope and standards."}},{"id":"26-m16","ch":26,"type":"mc","stem":"A nurse is responsible for determining the incidence rates of hospital-acquired diarrhea on a pediatric ward after receiving reports that five children admitted with uncontrolled asthma had developed diarrhea while hospitalized. The nurse is working in which nursing role?","rat":"The infection control nurse is concerned with incidence of infections within the hospital.","bloom":"Comprehension","opts":[{"k":"a","t":"Quality management"},{"k":"b","t":"Infection control"},{"k":"c","t":"Occupational health"},{"k":"d","t":"Forensics"}],"ans":["b"],"why":{"a":"Quality management measures outcomes against standards.","c":"Occupational health looks after employees.","d":"Forensics deals with victims of crime and legal evidence."}},{"id":"26-m17","ch":26,"type":"mc","stem":"A nurse working in a factory performs routine hearing tests for employees. The factory uses 90 dB as the safe limit for an 8-hour day’s exposure to machine noise rather than 85 dB as recommended by the Occupational Safety and Health Administration. The nurse is functioning in what nursing role?","rat":"The nurse in the role of occupational health focuses on health promotion and disease control of employees.","bloom":"Comprehension","opts":[{"k":"a","t":"Quality management"},{"k":"b","t":"Informatics nurse specialist"},{"k":"c","t":"Occupational health nurse"},{"k":"d","t":"Case manager"}],"ans":["c"],"why":{"a":"Quality management measures patient care outcomes against standards.","b":"Informatics manages health information.","d":"A case manager coordinates resources for individual patients."}},{"id":"26-m18","ch":26,"type":"mc","stem":"People are living longer and with older age comes a higher risk of terminal illness. Many individuals have chosen to maximize their quality of life but stop aggressive life-sustaining treatments. Nurses who work with terminally ill patients and their families to provide end-of-life care, pain management, and family support are practicing in which field of nursing practice?","rat":"Hospice nurses specialize in holistic care for the patient and family and end-of-life care to maximize quality rather than quantity of years of life.","bloom":"Comprehension","opts":[{"k":"a","t":"Hospice"},{"k":"b","t":"Infection control"},{"k":"c","t":"Coordinator"},{"k":"d","t":"Case manager"}],"ans":["a"],"why":{"b":"Infection control tracks infection rates.","c":"A coordinator integrates care for a specific type of patient.","d":"A case manager balances quality, access and cost."}},{"id":"26-m19","ch":26,"type":"mc","stem":"A nurse explaining the graph indicates the frequency of falls in 2017 to detect and possibly explain causes of variation. The peaks in June were attributed to regular staff vacations during which agency nurses were used. The nurse is employed in which role?","rat":"The role of the quality manager is to improve quality of care and reduce errors. Knowledge of quality management tools is essential to the role. The run chart shown above is one such quality management tool.","bloom":"Application","opts":[{"k":"a","t":"Case Manager"},{"k":"b","t":"Quality Manager"},{"k":"c","t":"Forensic Nurse"},{"k":"d","t":"Occupational Health Nurse"}],"ans":["b"],"why":{"a":"A case manager coordinates resources for individual patients.","c":"A forensic nurse works with victims of crime and the legal system.","d":"An occupational health nurse looks after employees."},"fig":{"kind":"run"}},{"id":"26-m20","ch":26,"type":"mc","stem":"A new graduate desires a position in labor and delivery; however, no position is available. What is the best advice for this nurse?","rat":"Entry level positions in labor and delivery may be difficult to find. Accepting a position in another area of the hospital will allow the novice nurse an opportunity to improve her skills and develop clinical decision making as she waits for an open position in labor and delivery.","bloom":"Application","opts":[{"k":"a","t":"Continue to study to keep skills current and wait for desired position."},{"k":"b","t":"Return to college until a position in labor or delivery opens."},{"k":"c","t":"Accept another nursing position and transfer into labor and delivery when a position is available."},{"k":"d","t":"Practice obstetrical skills in a simulation lab then present evidence of competency to potential employer."}],"ans":["c"],"why":{"a":"Waiting without practicing lets skills fade.","b":"More school does not build clinical judgment.","d":"Simulation practice does not replace real experience."}},{"id":"26-m21","ch":26,"type":"mc","stem":"An RN has critical care experience and is proficient in advanced cardiac life support and often helps to lead “codes” and is an expert clinician with superior health assessment skills. Enjoying a challenge of a fast-paced environment with autonomy, this nurse would best be suited for which nursing role?","rat":"An experienced nurse with critical care experience and a desire to practice in a complex dynamic health care environment requiring clinical decision making would thrive as a flight nurse.","bloom":"Comprehension","opts":[{"k":"a","t":"Flight nurse"},{"k":"b","t":"Home health nurse"},{"k":"c","t":"Hospice nurse"},{"k":"d","t":"Occupational health nurse"}],"ans":["a"],"why":{"b":"Home health is slower paced and less acute.","c":"Hospice focuses on comfort at the end of life.","d":"Occupational health focuses on prevention for employees."}},{"id":"26-m22","ch":26,"type":"mc","stem":"The role of the Clinical Nurse Leader (CNL) would include what nursing task?","rat":"The CNL is not an advanced practice nurse but is an advanced generalist who provides care and coordination of care for patients with complex needs and revises care plan to meet desired outcomes.","bloom":"Application","opts":[{"k":"a","t":"Diagnosing a patient with pneumonia and prescribing antibiotics"},{"k":"b","t":"Teaching members of a faith community how to avoid skin cancer and referring those with suspicious lesions"},{"k":"c","t":"Participating in the team who is investigating possible abuse of elderly persons by members of a gang known to sell illegal drugs"},{"k":"d","t":"Coordinating care of a patient admitted 4 days ago with stage IV heart failure and chronic bronchitis by revising care plan to include ambulation 50 feet with assistance"}],"ans":["d"],"why":{"a":"Diagnosing and prescribing is the nurse practitioner.","b":"That is the parish nurse.","c":"That is the forensic nurse."}},{"id":"26-r1","ch":26,"type":"sata","stem":"A nurse wants to become an advanced practice nurse and investigates the requirements for which role.","rat":"A nurse practitioner is considered an advanced practice nurse. A certified nurse-midwife is considered an advanced practice nurse. A certified registered nurse anesthetist is considered an advanced practice nurse. While important in the advancement of the profession, nurse executives are not generally considered advance practices nurses.","bloom":"Knowledge","opts":[{"k":"a","t":"Nurse practitioner"},{"k":"b","t":"Nurse executive"},{"k":"c","t":"Certified nurse-midwife"},{"k":"d","t":"Certified registered nurse anesthetist"}],"ans":["a","c","d"],"why":{"b":"A nurse executive leads the profession but is not an advanced practice nurse."}},{"id":"26-r2","ch":26,"type":"sata","stem":"Advanced practice nurses are prepared minimally at the master’s degree level with prescriptive privileges; these professionals include which nursing professionals?","rat":"A nurse practitioner requires preparation at the master’s degree level. A certified nurse-midwife requires preparation at the master’s degree level. A clinical nurse specialist requires preparation at the master’s degree level.","bloom":"Knowledge","opts":[{"k":"a","t":"Clinical nurse leader"},{"k":"b","t":"Nurse practitioner"},{"k":"c","t":"Nursing administrator"},{"k":"d","t":"Certified nurse-midwife"},{"k":"e","t":"Clinical nurse specialist"}],"ans":["b","d","e"],"why":{"a":"The clinical nurse leader is an advanced generalist, not an advanced practice nurse.","c":"An administrator is not an advanced practice nurse."}},{"id":"26-r3","ch":26,"type":"sata","stem":"What characteristics are associated with the clinical nurse leader?","rat":"Clinical nurse leaders are prepared as generalists at the master’s level. Clinical nurse leaders provide care to complex patients, change care plans as needed, and coordinate care to a group of patients.","bloom":"Comprehension","opts":[{"k":"a","t":"Is a generalist prepared at the master’s level"},{"k":"b","t":"Provides care at the bedside for complex patients"},{"k":"c","t":"Identifies the best resources at the lowest price to achieve best health outcomes for a client"},{"k":"d","t":"Serves as care coordinator whose practice is limited to acute care settings"},{"k":"e","t":"Is an advanced practice nurse with an earned doctorate in nursing"}],"ans":["a","b"],"why":{"c":"That describes the case manager.","d":"The role is not limited to acute care.","e":"The clinical nurse leader is master’s prepared and is not an advanced practice nurse."}},{"id":"8-m1","ch":8,"type":"mc","stem":"A client arrives in active labor and exhibits toxemia with irregular fetal heart tones. The client is an immigrant and is uninsured. Which act would prevent the client from being transferred to another facility?","rat":"The Emergency Medical Treatment and Active Labor Law is a federal statute that was enacted in 1986 to prohibit the transfer of unstable clients, including women in labor, from one facility to another. This law also prohibits refusal of care for indigent and uninsured clients who seek medical assistance in the emergency department.","bloom":"Comprehension","opts":[{"k":"a","t":"The Emergency Medical Treatment and Active Labor Law"},{"k":"b","t":"Health Insurance Portability and Accountability Act"},{"k":"c","t":"Patient Self-Determination Act"},{"k":"d","t":"The Patient Safety and Quality Improvement Act"}],"ans":["a"],"why":{"b":"HIPAA protects health information.","c":"The Patient Self-Determination Act deals with advance directives.","d":"This act deals with voluntary reporting of errors."}},{"id":"8-m2","ch":8,"type":"mc","stem":"A nurse is caring for a client with malignant hypertension whose blood pressure has increased by 40 mm Hg during the past hour. The nurse goes to lunch and fails to report the change to the physician. The nurse is at risk for being charged with which legal claim?","rat":"Negligence is defined as failure to act in a reasonable and prudent manner. The most frequent allegations of nursing negligence include failure to ensure client safety, improper treatment, failure to monitor the client and report significant findings, medication errors, and failure to follow the agency’s policies and procedures.","bloom":"Comprehension","opts":[{"k":"a","t":"Negligence"},{"k":"b","t":"Assault"},{"k":"c","t":"Defamation of character"},{"k":"d","t":"Tort"}],"ans":["a"],"why":{"b":"Assault is a threat of harmful contact.","c":"Defamation is harm to someone’s reputation.","d":"Tort is the whole category of civil wrongs. The stem wants the specific claim."}},{"id":"8-m3","ch":8,"type":"mc","stem":"A nurse is caring for a client who just suffered a stroke and is medicated for pain. The nurse completes the following interventions: places the client on the examining table, completes a thorough history and physical, covers the client with a sheet, places the call button within reach, and goes out in the hall to speak with the client’s primary care provider. The client tries to get up to speak with his family and falls, sustaining a hematoma on the head and a broken hip. The nurse’s actions reflect which legal claim?","rat":"The nurse is failing to ensure client safety after medication administration; this is defined as negligence.","bloom":"Comprehension","opts":[{"k":"a","t":"Invasion of privacy"},{"k":"b","t":"Libel"},{"k":"c","t":"Slander"},{"k":"d","t":"Negligence"}],"ans":["d"],"why":{"a":"Privacy was protected. The client was covered.","b":"Libel is written defamation.","c":"Slander is spoken defamation."}},{"id":"8-m4","ch":8,"type":"mc","stem":"A nursing student planning to apply for licensure knows that being charged with which offense would result in a misdemeanor criminal offense?","rat":"Failing to report elder abuse can lead to penalty of fine or imprisonment and is tried as a misdemeanor offense.","bloom":"Comprehension","opts":[{"k":"a","t":"Solicitation of illegal drugs"},{"k":"b","t":"Stealing a car"},{"k":"c","t":"Failing to report elder abuse"},{"k":"d","t":"Billing Medicare for services not rendered"}],"ans":["c"],"why":{"a":"The test bank does not treat this as the misdemeanor example.","b":"Stealing a car is a more serious offense.","d":"Billing fraud is a more serious offense."}},{"id":"8-m5","ch":8,"type":"mc","stem":"When differentiating between slander and libel, the nurse knows that libel is characterized by what action?","rat":"Libel is defined as comments that are written about a person that are defaming. Nurses may be subject to a charge of libel for subjective comments meant to denigrate the client that are placed in the medical record or in other written materials read by others. Slander refers to an injury to one’s reputation caused by the spoken word.","bloom":"Comprehension","opts":[{"k":"a","t":"Defamation caused by subjective comments written in the nurse’s notes"},{"k":"b","t":"Negative subjective comments made to those who are not providing care"},{"k":"c","t":"Verbally describing to the oncoming nurse assigned to the client objective data that place the client in a negative light"},{"k":"d","t":"Repeating prejudiced comments made by the primary caregiver to a neighbor at the local supermarket"}],"ans":["a"],"why":{"b":"Comments that are spoken are slander.","c":"This is spoken, and objective data shared with the next nurse is not defamation.","d":"Repeating comments aloud is slander."}},{"id":"8-m6","ch":8,"type":"mc","stem":"A client states, “I am leaving. No one here knows what they are doing.” The nurse completing the Against Medical Advice form must implement what intervention to best assure client safety?","rat":"The nurse must articulate to the client the dangers associated with leaving the facility if the primary provider is not present. The nurse’s notes on this form should reflect the specific advice given to the client, which should include the fact that leaving the facility could aggravate the current condition and complicate future care, resulting in permanent physical or mental impairment or disability, or resulting in complications that can cause death. None of the other options address the client’s known safety risks.","bloom":"Application","opts":[{"k":"a","t":"Notify the primary health care provider of the client’s wish to leave."},{"k":"b","t":"Alert family that the client will be leaving the facility."},{"k":"c","t":"Inform the client that leaving could result in complications and impairment."},{"k":"d","t":"Require security staff to accompany the client to the facility’s main entrance."}],"ans":["c"],"why":{"a":"Expected, but it does not tell the client what could happen.","b":"This breaks confidentiality and does not protect the client.","d":"An escort cannot be forced on a client who is free to leave."}},{"id":"8-m7","ch":8,"type":"mc","stem":"When can a nurse detain a client by implementing restraints?","rat":"A written primary care provider’s prescription that is timed and dated is required for the use of restraints. Renewal of orders must be accompanied by evidence of medical evaluation and nursing reassessment. Restraints can only be appropriately applied as a last resort to managing inappropriate behavior.","bloom":"Comprehension","opts":[{"k":"a","t":"Staffing resources are insufficient to monitor a patient."},{"k":"b","t":"The client is demonstrating behaviors associated with confusion."},{"k":"c","t":"The family requests the restraints to prevent the client from leaving the facility."},{"k":"d","t":"There are current prescribed instructions for their use."}],"ans":["d"],"why":{"a":"Staffing convenience never justifies restraints.","b":"Confusion alone is not enough.","c":"A family request carries no authority."}},{"id":"8-m8","ch":8,"type":"mc","stem":"When the client is unable to make medical decisions, authorization that allows another person to make these decisions is referred to by what term?","rat":"Durable power of attorney involves preselection by the client of a person who has been authorized legally to make health care decisions once the client becomes incompetent to do so. Several states have enacted a Uniform Durable Power of Attorney Act, which sanctions a durable power of attorney for health care. None of the remaining options address the inability to autonomously make effective medical choices.","bloom":"Knowledge","opts":[{"k":"a","t":"A living will"},{"k":"b","t":"Durable power of attorney"},{"k":"c","t":"Informed consent"},{"k":"d","t":"Immunity"}],"ans":["b"],"why":{"a":"A living will states treatment wishes. It does not name a person.","c":"Informed consent is the client’s own agreement to treatment.","d":"Immunity is protection from liability."}},{"id":"8-m9","ch":8,"type":"mc","stem":"All hospitals receiving Medicare and Medicaid funds must ask clients whether they have a living will or a durable power of attorney. What legislative act makes this action mandatory?","rat":"The Uniform Health Care Decisions Act of 1993 is a federal statute that was established to support individuals in expressing their preferences about medical treatment and making decisions about end-of-life care.","bloom":"Comprehension","opts":[{"k":"a","t":"Emergency Treatment and Active Labor Law"},{"k":"b","t":"Americans with Disabilities Act"},{"k":"c","t":"Uniform Health Care Decisions Act"},{"k":"d","t":"Patient Self-Determination Act"}],"ans":["c"],"why":{"a":"This law covers emergency screening and transfer.","b":"This law covers disability discrimination.","d":"Most references agree with you: the Patient Self-Determination Act of 1990 is the law that requires this. The test bank keys a different option. Pick again, then read the note."},"note":"Check this key with your professor. The test bank marks the Uniform Health Care Decisions Act, but the law that requires Medicare and Medicaid facilities to ask about advance directives is the Patient Self-Determination Act of 1990. This exam scores it the way the test bank does."},{"id":"8-m10","ch":8,"type":"mc","stem":"A nurse who functions in the role of team leader can be held negligent for matters involving what focus?","rat":"Delegation of client care tasks falls within the role of the team leader, and inappropriate delegation of client care tasks could result in negligence. Team leaders, charge nurses, and managers are held to the standard of care of the reasonably prudent nurse employed in that role.","bloom":"Comprehension","opts":[{"k":"a","t":"Adequate training"},{"k":"b","t":"Policies and procedures"},{"k":"c","t":"Staff discipline"},{"k":"d","t":"Delegation"}],"ans":["d"],"why":{"a":"Training is the employer’s responsibility.","b":"Policies and procedures belong to the institution.","c":"Discipline belongs to the manager and employer."}},{"id":"8-m11","ch":8,"type":"mc","stem":"Although a hospital reversed all charges when a client was the victim of wrong site surgery, the court awarded the client $1.5 million. The client could return to work in 6 weeks and had no permanent damages. This monetary compensation is referred to by what term?","rat":"Punitive damages are monetary compensation to an injured client that is greater than amount of loss. It is monetary compensation awarded to an injured person (patient) that goes beyond that which is necessary to compensate for losses (e.g., the ability to function, death, income) and is intended to punish the wrongdoer.","bloom":"Application","opts":[{"k":"a","t":"Liability"},{"k":"b","t":"Punitive damages"},{"k":"c","t":"Vicarious liability"},{"k":"d","t":"Immunity"}],"ans":["b"],"why":{"a":"Liability is legal responsibility, not a payment.","c":"Vicarious liability makes an employer responsible for an employee’s acts.","d":"Immunity is protection from liability."}},{"id":"8-m12","ch":8,"type":"mc","stem":"A primary health provider prescribes a drug for a patient with a known allergy, it is administered and results in anaphylactic shock. What statement is accurate regarding disclosure of this event?","rat":"The National Quality Forum identified the process of disclosure as a key element of the national patient safety movement. None of the other options accurately describe the focus of the disclosure.","bloom":"Comprehension","opts":[{"k":"a","t":"Disclosure of the error will result in more severe ramifications for the agency than if the negligence is discovered by the patient or family."},{"k":"b","t":"Disclosure of the occurrence should occur before notification of the prescribing health provider"},{"k":"c","t":"Disclosure is an essential component of the national patient safety movement."},{"k":"d","t":"Disclosure to the patient’s insurance company is focused on decreasing costs."}],"ans":["c"],"why":{"a":"The opposite. Concealment makes things worse.","b":"The prescriber is told first.","d":"Disclosure is not about insurers or cost."}},{"id":"8-m13","ch":8,"type":"mc","stem":"A nurse testifies at trial that a professional with the knowledge and skill of an RN should understand that, before administering digoxin, the client’s potassium level and pulse level is always checked to prevent negative effects on cardiac output. The nurse’s testimony as to what constitutes reasonable care is based on what criteria source?","rat":"Standard of care is the legal criteria against which the nurse’s (and primary care provider’s) conduct is compared to determine whether a negligent act or malpractice occurred. Nurses are specialists in hospital care who, in the final analysis, hold the well-being—in some instances, the very lives—of patients in their hands.","bloom":"Comprehension","opts":[{"k":"a","t":"The legal definition of standard of care"},{"k":"b","t":"The legal definition of the informed consent process"},{"k":"c","t":"The doctrine of res ipsa loquitur"},{"k":"d","t":"The concept of governmental immunity"}],"ans":["a"],"why":{"b":"Informed consent is about agreeing to treatment.","c":"Res ipsa loquitur means the thing speaks for itself, so negligence is inferred without this kind of testimony.","d":"Immunity is protection from liability."}},{"id":"8-m14","ch":8,"type":"mc","stem":"A blood reaction occurrence is noted in a client who did not receive pretransfusion care as clearly documented in the facility’s policies and procedures. The nurse providing care is liable for which legal tort?","rat":"In this case, criminal negligence charges would be based on “reckless and wanton” disregard for the safety, well-being, or life of an individual; behavior that demonstrates a complete disregard for another, such that death is likely in the transfusion reaction.","bloom":"Comprehension","opts":[{"k":"a","t":"Comparative negligence"},{"k":"b","t":"Punitive damages"},{"k":"c","t":"Criminal negligence"},{"k":"d","t":"Involuntary tort"}],"ans":["c"],"why":{"a":"Comparative negligence splits fault between the patient and the provider.","b":"Punitive damages are a money award, not a tort.","d":"This is not a category the text uses."}},{"id":"8-m15","ch":8,"type":"mc","stem":"A physician shares with the patient’s family that, while a central line was being inserted, the patient’s lungs were inadvertently punctured, which required oxygen administration. The physician also explains that a chest x-ray indicated the lung remained intact and no additional treatment was required. The physician’s role in this instance is based on what legal principle?","rat":"Disclosure is a process in which the patient’s primary provider (physician or advanced practice nurse) gives the patient, and when applicable, family members, complete information about unanticipated adverse outcomes of treatment and care.","bloom":"Comprehension","opts":[{"k":"a","t":"Comparative negligence"},{"k":"b","t":"Gross negligence"},{"k":"c","t":"Disclosure"},{"k":"d","t":"Emergency Medical Treatment and Active Labor Act (EMTALA)"}],"ans":["c"],"why":{"a":"Comparative negligence splits fault between the patient and the provider.","b":"Gross negligence is reckless disregard. The physician is explaining an accident.","d":"EMTALA covers emergency screening and transfer."}},{"id":"8-m16","ch":8,"type":"mc","stem":"A nurse is assigned to a unit other than the one she is normally assigned due to increased census on the alternate unit. She is assigned to care for seven patients and participates in walking rounds where the patient’s condition and needs are discussed between oncoming and off-going shifts of the interdisciplinary team. The nurse carefully makes notes of all pending orders and prioritizes needs. The nurse enters the cafeteria later and the notes accidentally fall from her pocket, which contain the above information that contains patient sensitive data. The liabilities arising from this incident would be covered under what issue?","rat":"HIPAA protects patient information and ensures confidentiality of data.","bloom":"Comprehension","opts":[{"k":"a","t":"Compliance with the Health Insurance Portability and Accountability Act (HIPAA)"},{"k":"b","t":"Performance in accordance with the American Nurse’s Association (ANA) Scope and Practice Act"},{"k":"c","t":"Nursing role in the securing of implied consent"},{"k":"d","t":"Personal liability with floating and cross-training"}],"ans":["a"],"why":{"b":"Professional standards do not govern liability for exposed patient data.","c":"Implied consent is about treatment.","d":"Floating explains why she was there. The liability comes from the lost information."}},{"id":"8-r1","ch":8,"type":"sata","stem":"Which components must be included regarding informed consent?","rat":"The information that constitutes informed consent for the client includes the nature of the therapy or procedure, expected benefits and outcomes of the therapy or procedure, potential risks of the therapy or procedure, alternative therapies to the intended procedure and their risks and benefits, and risks of not having the procedure. Cost is not a component of informed consent.","bloom":"Comprehension","opts":[{"k":"a","t":"Identification of risks for non-treatment"},{"k":"b","t":"Discussion of expected benefits"},{"k":"c","t":"Identification of known risks"},{"k":"d","t":"Acknowledgement of alternative therapy"},{"k":"e","t":"Communication of the estimate cost involved"}],"ans":["a","b","c","d"],"why":{"e":"Cost is not part of informed consent."}},{"id":"8-r2","ch":8,"type":"sata","stem":"Which nursing situation demonstrates the greatest need for individual malpractice insurance to help manage professional legal risk?","rat":"Reasons given for the purchase of malpractice insurance by RNs include the following; expanding functions of RNs and advanced practice nurses; floating and cross-training mandates; increasing responsibility for supervising subordinate staff; working in states where sovereign immunity makes health care workers not health care facilities liable for neglect. Being employed by the federal government can shield the nurse from personal liability by federal tort statutes in some cases.","bloom":"Application","opts":[{"k":"a","t":"Accepting the role of weekend unit manager"},{"k":"b","t":"Delegating health care responsibilities to nursing staff"},{"k":"c","t":"Working for the federal government attending to embassy staff"},{"k":"d","t":"Being licensed in a state where sovereign immunity is in effect"},{"k":"e","t":"Regularly working in the facility’s float pool"}],"ans":["a","b","d","e"],"why":{"c":"Federal tort statutes can shield federal employees from personal liability."}},{"id":"8-r3","ch":8,"type":"sata","stem":"Which types of abuse are the nurse required to report or be subject to fines and imprisonment for not reporting?","rat":"State laws have been created because of the 1973 Child Abuse Prevention and Treatment Act. These laws dictate that health professionals must report infant and child abuse and specified communicable diseases. Failure by the nurse to comply can result in fines and/or imprisonment.","bloom":"Comprehension","opts":[{"k":"a","t":"Animal"},{"k":"b","t":"Child"},{"k":"c","t":"Alcohol"},{"k":"d","t":"Infant"},{"k":"e","t":"Emotional"}],"ans":["b","d"],"why":{"a":"The laws the text cites do not require nurses to report this.","c":"The laws the text cites do not require nurses to report this.","e":"The text names two specific groups. This is not one of them."}},{"id":"8-r4","ch":8,"type":"sata","stem":"What examples should the nurse provide to best describe an advance directive?","rat":"Advance directives document an individual’s desires regarding end-of-life care. These wishes are generally stated through the execution of a formal document known as the living will. Right-to-die statutes vary from state to state; therefore, nurses must become familiar with their state-specific statute.","bloom":"Application","opts":[{"k":"a","t":"Preserving cord blood for possible future needs of a child"},{"k":"b","t":"Providing instructions about personal preferences regarding life-sustaining medical procedures"},{"k":"c","t":"Giving someone the legal right to act on one’s behalf when one becomes incapacitated"},{"k":"d","t":"Completing hospital admission paperwork before being admitted to the hospital"}],"ans":["b","c"],"why":{"a":"This is not a statement about end-of-life care.","d":"Admission paperwork is not a statement of treatment wishes."}},{"id":"8-r5","ch":8,"type":"sata","stem":"A nurse learns in orientation that an incident report does not “blame” anyone but concisely documents the events leading up to an occurrence. Which events would warrant completion of an incident report?","rat":"Nurses are legally bound to report critical incidents to their nurse managers, agency administration, and risk manager through a formal intra-agency document generally titled the “incident report.” Circumstances under which an incident report should be filed include malfunction or failure of medical equipment.","bloom":"Analysis","opts":[{"k":"a","t":"The client is crying and distraught when learning of a diagnosis of cancer."},{"k":"b","t":"An intravenous antibiotic given preoperatively does not infuse because of a faulty pump."},{"k":"c","t":"The nurse is unable to carry out orders written by the specialist because of illegibility."},{"k":"d","t":"A client falls while in the shower, after being instructed not to get up alone."},{"k":"e","t":"The registered nurse is not available to complete the preoperative checklist."}],"ans":["b","c","d","e"],"why":{"a":"Crying at a cancer diagnosis is an expected response, not an unusual occurrence."}}]};
const QS = DATA.questions, BYID = Object.fromEntries(QS.map(q => [q.id, q]));
const CH = Object.fromEntries(DATA.chapters.map(c => [c.n, c.title]));
const KIND = { mc: 'Multiple choice', sata: 'Select all that apply', fill: 'Fill in the blank', order: 'Ordered response' };
const BLOOMS = ['Knowledge', 'Comprehension', 'Application', 'Analysis'];
const KEY = 'nur206-exam1-practice-v1';
const app = document.getElementById('app');
let S = null, timer = null, confirmEnd = false;
let SETUP = { chapters: DATA.chapters.map(c => c.n), mode: 'coach', len: 'all', shuffle: true, alt: false };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const up = k => k.toUpperCase();
const store = { get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} } };
const save = () => { if (S) store.set(S); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const same = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const sameSet = (a, b) => same(a.slice().sort(), b.slice().sort());
const norm = s => String(s || '').toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
const mmss = t => { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

function pool(cfg) { return QS.filter(q => cfg.chapters.includes(q.ch) && (!cfg.alt || q.type !== 'mc')); }
function blank(q) { const r = { sel: [], tried: [], attempts: 0, done: false, first: null, revealed: false, text: '', msg: null };
  if (q.type === 'order') { let o = q.opts.map(x => x.k); if (same(o, q.ans)) o.push(o.shift()); r.order = o; } return r; }
function start(ids, mode) { S = { mode, ids, i: 0, resp: {}, flags: {}, elapsed: 0, finished: false };
  ids.forEach(id => S.resp[id] = blank(BYID[id])); confirmEnd = false; save(); tick(); renderQuiz(); window.scrollTo(0, 0); }
function tick() { clearInterval(timer); timer = setInterval(() => { if (!S || S.finished) return; S.elapsed++; const el = document.getElementById('clock'); if (el) el.textContent = mmss(S.elapsed); if (S.elapsed % 10 === 0) save(); }, 1000); }

/* ---------- grading ---------- */
function isCorrect(q, r) {
  if (q.type === 'mc') return r.sel.length === 1 && r.sel[0] === q.ans[0];
  if (q.type === 'sata') return r.sel.length > 0 && sameSet(r.sel, q.ans);
  if (q.type === 'fill') return q.accept.includes(norm(r.text));
  return same(r.order, q.ans);
}
function answered(q, r) { return q.type === 'fill' ? norm(r.text) !== '' : q.type === 'order' ? !!r.touched : r.sel.length > 0; }
function status(id) { const q = BYID[id], r = S.resp[id];
  if (S.mode === 'coach') return r.done ? (r.first ? 'right' : 'wrong') : 'skipped';
  return answered(q, r) ? (isCorrect(q, r) ? 'right' : 'wrong') : 'skipped'; }

/* ---------- setup screen ---------- */
function renderSetup() {
  S = null; clearInterval(timer);
  const saved = store.get(), p = pool(SETUP);
  const n = SETUP.len === 'all' ? p.length : Math.min(+SETUP.len, p.length);
  const count = t => QS.filter(q => q.type === t).length;
  let h = '';
  if (saved && saved.ids && !saved.finished) h += `<div class="panel resume stack"><p><strong>You have a session in progress.</strong> Question ${saved.i + 1} of ${saved.ids.length}, ${saved.mode === 'coach' ? 'coached' : 'exam'} mode.</p><div class="row"><button class="btn primary" id="resume">Resume</button><button class="btn" id="discard">Discard it</button></div></div>`;
  h += `<p class="lede">${QS.length} questions from your test bank: ${count('mc')} multiple choice, ${count('sata')} select-all, ${count('fill')} fill-in and ${count('order')} ordered response. Each one carries its Bloom's level so you can see where points go missing.</p>`;
  h += `<fieldset class="stack"><legend class="label">Chapters</legend>` + DATA.chapters.map(c =>
    `<label class="pick"><input type="checkbox" id="ch-${c.n}" data-ch="${c.n}" ${SETUP.chapters.includes(c.n) ? 'checked' : ''}><span class="t">Chapter ${c.n}: ${esc(c.title)}</span><span class="n">${QS.filter(q => q.ch === c.n).length}</span></label>`).join('') + `</fieldset>`;
  h += `<fieldset class="stack"><legend class="label">How to run it</legend><div class="grid2">
    <label class="pick"><input type="radio" name="mode" id="mode-coach" value="coach" ${SETUP.mode === 'coach' ? 'checked' : ''}><span class="t"><strong>Coached</strong><small>Check each answer as you go. A wrong pick gets an explanation of why it misses, then you try again. Your score counts first tries only.</small></span></label>
    <label class="pick"><input type="radio" name="mode" id="mode-exam" value="exam" ${SETUP.mode === 'exam' ? 'checked' : ''}><span class="t"><strong>Exam</strong><small>No feedback until you submit. A clock runs. Afterwards you can be coached through whatever you missed.</small></span></label></div></fieldset>`;
  h += `<fieldset class="stack"><legend class="label">Options</legend>
    <div class="row"><label for="len">Length</label><select id="len">${['all', '25', '50', '75'].map(v => `<option value="${v}" ${SETUP.len === v ? 'selected' : ''}>${v === 'all' ? 'Every question selected' : v + ' questions'}</option>`).join('')}</select></div>
    <label class="pick"><input type="checkbox" id="shuffle" ${SETUP.shuffle ? 'checked' : ''}><span class="t">Shuffle question order<small>Off keeps the test bank's order, chapter by chapter.</small></span></label>
    <label class="pick"><input type="checkbox" id="alt" ${SETUP.alt ? 'checked' : ''}><span class="t">Alternate formats only<small>Select-all, fill-in and ordered response, without the multiple choice.</small></span></label></fieldset>`;
  h += `<div class="row"><button class="btn primary" id="go" ${n ? '' : 'disabled'}>${n ? `Start ${n} question${n === 1 ? '' : 's'}` : 'Pick at least one chapter'}</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll('[data-ch]').forEach(el => el.onchange = () => { SETUP.chapters = [...app.querySelectorAll('[data-ch]:checked')].map(e => +e.dataset.ch); renderSetup(); });
  app.querySelectorAll('[name=mode]').forEach(el => el.onchange = () => { SETUP.mode = el.value; });
  document.getElementById('len').onchange = e => { SETUP.len = e.target.value; renderSetup(); };
  document.getElementById('shuffle').onchange = e => { SETUP.shuffle = e.target.checked; };
  document.getElementById('alt').onchange = e => { SETUP.alt = e.target.checked; renderSetup(); };
  document.getElementById('go').onclick = () => { let ids = pool(SETUP).map(q => q.id); if (SETUP.shuffle) ids = shuffle(ids); if (SETUP.len !== 'all') ids = ids.slice(0, +SETUP.len); start(ids, SETUP.mode); };
  const rs = document.getElementById('resume'); if (rs) rs.onclick = () => { S = saved; confirmEnd = false; tick(); renderQuiz(); };
  const ds = document.getElementById('discard'); if (ds) ds.onclick = () => { store.clear(); renderSetup(); };
}

/* ---------- figures ---------- */
function figure(f) {
  if (f.kind === 'text') return `<div class="figure">${esc(f.text)}</div>`;
  if (f.kind === '5c') return `<div class="figure">Figure in the original: a diagram labeled “5Cs” with five boxes around it.<div class="chips"><span>Compassion</span><span>Competence</span><span>Commitment</span><span>Confidence</span><span>Conscience</span></div></div>`;
  const v = [9, 11, 5, 7, 2, 18, 14, 5, 3, 12, 2, 10], m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const X = i => 46 + i * 40, Y = n => 170 - n * 8;
  let s = `<svg viewBox="0 0 510 205" width="510" role="img" aria-label="Run chart of total falls per month in 2017. June is the highest at 18, then July at 14."><g font-family="inherit" font-size="11" fill="var(--muted)">`;
  for (let n = 0; n <= 18; n += 2) s += `<line x1="40" x2="494" y1="${Y(n)}" y2="${Y(n)}" stroke="var(--line)" stroke-width="1"/><text x="34" y="${Y(n) + 4}" text-anchor="end">${n}</text>`;
  m.forEach((t, i) => s += `<text x="${X(i)}" y="188" text-anchor="middle">${t}</text>`);
  s += `<text x="12" y="100" text-anchor="middle" transform="rotate(-90 12 100)">Total falls</text></g>`;
  s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${v.map((n, i) => X(i) + ',' + Y(n)).join(' ')}"/>`;
  v.forEach((n, i) => s += `<circle cx="${X(i)}" cy="${Y(n)}" r="${i === 5 ? 5 : 3.5}" fill="var(--accent)"/>`);
  return `<div class="figure">${s}</svg></div>`;
}

/* ---------- quiz screen ---------- */
function strip() {
  const q = BYID[S.ids[S.i]], total = S.ids.length;
  const done = S.ids.filter(id => S.mode === 'coach' ? S.resp[id].done : answered(BYID[id], S.resp[id])).length;
  const first = S.ids.filter(id => S.resp[id].first === true).length;
  const stat = S.mode === 'coach' ? `First try ${first} of ${done}` : `<span id="clock">${mmss(S.elapsed)}</span> · ${done} answered`;
  let h = `<div class="strip"><div class="row spread"><span class="where">Question ${S.i + 1} of ${total}</span><span class="row" style="gap:6px"><span class="stat">${stat}</span><button class="btn quiet" id="end">${S.mode === 'coach' ? 'End' : 'Submit'}</button></span></div><div class="bar" aria-hidden="true"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div>`;
  if (confirmEnd) { const left = total - done; h += `<div class="confirm stack" role="alert"><p>${left ? `${left} question${left === 1 ? ' is' : 's are'} unanswered. ${S.mode === 'exam' ? 'They will be scored as missed.' : 'They will be left out of your score.'}` : 'Everything is answered.'} Finish now?</p><div class="row"><button class="btn primary" id="end-yes">Finish and score</button><button class="btn" id="end-no">Keep going</button></div></div>`; }
  return h + `</div>`;
}
function mapHTML() {
  const cells = S.ids.map((id, i) => { const r = S.resp[id], q = BYID[id]; let c = '';
    if (S.mode === 'coach') c = r.done ? (r.first ? 'ok' : 'retry') : (r.attempts ? 'retry' : ''); else c = answered(q, r) ? 'ans' : '';
    return `<button class="cell ${c} ${i === S.i ? 'cur' : ''} ${S.flags[id] ? 'flag' : ''}" data-go="${i}" aria-label="Question ${i + 1}${S.flags[id] ? ', flagged' : ''}">${i + 1}</button>`; }).join('');
  const lg = S.mode === 'coach' ? 'Green: right on the first try. Red: needed another try. Dot: flagged.' : 'Shaded: answered. Dot: flagged.';
  return `<details class="map"><summary>Question map</summary><div class="cells">${cells}</div><p class="legend">${lg}</p></details>`;
}
function optionsHTML(q, r, locked) {
  const multi = q.type === 'sata';
  return `<div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-label="Answer choices">` + q.opts.map(o => {
    const tried = r.tried.includes(o.k), right = locked && S.mode === 'coach' && q.ans.includes(o.k);
    const dis = locked || tried;
    return `<label class="opt ${multi ? 'multi' : ''} ${tried ? 'wrong' : ''} ${right ? 'right' : ''} ${dis ? 'locked' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="opt" id="opt-${o.k}" value="${o.k}" ${r.sel.includes(o.k) && !tried ? 'checked' : ''} ${dis ? 'disabled' : ''}><span class="key">${up(o.k)}</span><span class="txt">${esc(o.t)}</span></label>` +
      (tried && q.why[o.k] ? `<p class="why">${esc(q.why[o.k])}</p>` : '');
  }).join('') + `</div>`;
}
function orderHTML(q, r, locked) {
  const T = Object.fromEntries(q.opts.map(o => [o.k, o.t]));
  return `<ol class="ord">` + r.order.map((k, i) => { const cls = locked ? 'right' : (r.marks ? (r.marks[i] ? 'right' : 'wrong') : '');
    return `<li class="${cls}"><span class="pos">${i + 1}</span><span class="txt">${esc(T[k])}</span>${locked ? '' : `<span class="mv"><button data-mv="${i},-1" aria-label="Move step up" ${i === 0 ? 'disabled' : ''}>↑</button><button data-mv="${i},1" aria-label="Move step down" ${i === r.order.length - 1 ? 'disabled' : ''}>↓</button></span>`}</li>`; }).join('') + `</ol>`;
}
function answerText(q) {
  if (q.type === 'fill') return q.ansText;
  if (q.type === 'order') return q.ans.map((k, i) => `${i + 1}. ${q.opts.find(o => o.k === k).t}`).join(' ');
  return q.ans.map(k => `${up(k)}. ${q.opts.find(o => o.k === k).t}`).join(' · ');
}
function rationaleHTML(q) {
  return `<div class="stack"><p class="rat">${esc(q.rat)}</p>${q.note ? `<p class="note">${esc(q.note)}</p>` : ''}</div>`;
}
function renderQuiz() {
  const id = S.ids[S.i], q = BYID[id], r = S.resp[id], coach = S.mode === 'coach', locked = coach && r.done, last = S.i === S.ids.length - 1;
  let h = strip();
  h += `<article class="stack" style="gap:16px"><div class="tags"><span class="tag">Chapter ${q.ch}</span><span class="tag kind">${KIND[q.type]}</span><span class="tag">Bloom's: ${esc(q.bloom)}</span></div>`;
  h += `<p class="stem">${esc(q.stem)}</p>`;
  if (q.fig) h += figure(q.fig);
  if (q.type === 'sata') h += `<p class="label">Select all that apply. Scored all or nothing.</p>`;
  if (q.type === 'mc' || q.type === 'sata') h += optionsHTML(q, r, locked);
  if (q.type === 'fill') h += `<div class="fill stack" style="gap:6px"><label for="fill-in" class="label">Your answer</label><input id="fill-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(r.text)}" ${locked ? 'disabled' : ''}></div>`;
  if (q.type === 'order') h += `<p class="label">Use the arrows to put the steps in order, first step on top.</p>` + orderHTML(q, r, locked);
  h += `<div id="fb" aria-live="polite" class="stack">`;
  if (coach && r.done) h += `<div class="fb good stack"><p><strong>${r.revealed ? 'Answer shown.' : r.first ? 'Correct on the first try.' : `Correct, after ${r.attempts + 1} tries.`}</strong>${q.type === 'mc' || q.type === 'sata' ? '' : ' ' + esc(answerText(q))}</p>${rationaleHTML(q)}</div>`;
  else if (coach && r.msg) h += `<div class="fb bad stack"><p><strong>Not yet.</strong> ${esc(r.msg)}</p><p>Try again.</p></div>`;
  h += `</div>`;
  h += `<div class="row spread"><div class="row"><button class="btn" id="back" ${S.i === 0 ? 'disabled' : ''}>Back</button><button class="btn" id="flag" aria-pressed="${!!S.flags[id]}">${S.flags[id] ? 'Flagged' : 'Flag'}</button></div><div class="row">`;
  if (coach && !r.done) { if (r.attempts >= 3 && q.type !== 'mc') h += `<button class="btn quiet" id="reveal">Show the answer</button>`; h += `<button class="btn primary" id="check">Check answer</button>`; }
  else h += `<button class="btn ${coach || !last ? 'primary' : ''}" id="next">${last ? (coach ? 'See results' : 'Review before submitting') : 'Next'}</button>`;
  if (coach && !r.done) h += `<button class="btn" id="next">${last ? 'See results' : 'Skip'}</button>`;
  h += `</div></div></article>` + mapHTML();
  app.innerHTML = h;
  wireQuiz(q, r);
}
function wireQuiz(q, r) {
  const coach = S.mode === 'coach';
  app.querySelectorAll('input[name=opt]').forEach(el => el.onchange = () => { r.sel = [...app.querySelectorAll('input[name=opt]:checked')].map(e => e.value); save(); if (!coach) refreshStrip(); });
  const fi = document.getElementById('fill-in'); if (fi) { fi.oninput = () => { r.text = fi.value; save(); }; fi.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const c = document.getElementById('check'); if (c) c.click(); } }; }
  app.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const [i, d] = b.dataset.mv.split(',').map(Number); const o = r.order; [o[i], o[i + d]] = [o[i + d], o[i]]; r.marks = null; r.touched = true; save(); renderQuiz(); const t = app.querySelector(`[data-mv="${i + d},${d}"]`); if (t && !t.disabled) t.focus(); });
  const go = i => { S.i = Math.max(0, Math.min(S.ids.length - 1, i)); confirmEnd = false; save(); renderQuiz(); window.scrollTo(0, 0); };
  document.getElementById('back').onclick = () => go(S.i - 1);
  document.getElementById('flag').onclick = () => { const id = q.id; if (S.flags[id]) delete S.flags[id]; else S.flags[id] = 1; save(); renderQuiz(); document.getElementById('flag').focus(); };
  const nx = document.getElementById('next'); if (nx) nx.onclick = () => { if (S.i === S.ids.length - 1) { if (coach && S.ids.every(id => S.resp[id].done)) finish(); else { confirmEnd = true; renderQuiz(); window.scrollTo(0, 0); } } else go(S.i + 1); };
  const ck = document.getElementById('check'); if (ck) ck.onclick = () => check(q, r);
  const rv = document.getElementById('reveal'); if (rv) rv.onclick = () => { r.done = true; r.first = false; r.revealed = true; r.msg = null; if (q.type === 'order') r.order = q.ans.slice(); if (q.type === 'sata') r.sel = q.ans.slice(); save(); renderQuiz(); };
  document.getElementById('end').onclick = () => { confirmEnd = true; renderQuiz(); window.scrollTo(0, 0); };
  const ey = document.getElementById('end-yes'); if (ey) ey.onclick = finish;
  const en = document.getElementById('end-no'); if (en) en.onclick = () => { confirmEnd = false; renderQuiz(); };
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
}
function refreshStrip() { const old = app.querySelector('.strip'); if (!old) return; const t = document.createElement('div'); t.innerHTML = strip(); old.replaceWith(t.firstChild);
  document.getElementById('end').onclick = () => { confirmEnd = true; renderQuiz(); window.scrollTo(0, 0); }; }

function check(q, r) {
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  if (q.type === 'mc') {
    if (!r.sel.length) { r.msg = 'Pick an option first.'; return renderQuiz(); }
    if (isCorrect(q, r)) return win(q, r);
    r.tried.push(r.sel[0]); r.sel = []; r.attempts++; r.msg = 'The reason that option misses is written under it. Reread the stem for what it is really asking.';
  } else if (q.type === 'sata') {
    if (!r.sel.length) { r.msg = 'Select at least one option first.'; return renderQuiz(); }
    if (isCorrect(q, r)) return win(q, r);
    const bad = r.sel.filter(k => !q.ans.includes(k)), missing = q.ans.filter(k => !r.sel.includes(k)).length;
    bad.forEach(k => r.tried.push(k)); r.sel = r.sel.filter(k => q.ans.includes(k)); r.attempts++;
    r.msg = (bad.length ? `${plural(bad.length, 'pick')} did not belong. The reason is written under each one. ` : 'Everything you picked belongs. ') + (missing ? `You are still missing ${plural(missing, 'correct option')}. Treat each remaining option as its own true-or-false statement.` : 'What is left selected is the full answer. Check it again.');
  } else if (q.type === 'fill') {
    if (!norm(r.text)) { r.msg = 'Type an answer first.'; return renderQuiz(); }
    if (isCorrect(q, r)) return win(q, r);
    r.attempts++; r.msg = q.hints[Math.min(r.attempts - 1, q.hints.length - 1)] + (r.attempts >= 3 ? ` It starts with “${q.ansText[0]}” and has ${q.ansText.length} letters.` : '');
  } else {
    r.touched = true;
    if (isCorrect(q, r)) return win(q, r);
    r.attempts++; r.marks = r.order.map((k, i) => k === q.ans[i]); const ok = r.marks.filter(Boolean).length;
    r.msg = `${plural(ok, 'step')} out of ${q.ans.length} sit in the right position (marked green). ` + q.hints[Math.min(r.attempts - 1, q.hints.length - 1)];
  }
  save(); renderQuiz();
}
function win(q, r) { r.done = true; r.first = r.attempts === 0; r.msg = null; r.marks = null; save(); renderQuiz(); const n = document.getElementById('next'); if (n) n.focus(); }
function finish() { S.finished = true; confirmEnd = false; save(); clearInterval(timer); renderResults(); window.scrollTo(0, 0); }

/* ---------- results ---------- */
function yourAnswer(q, r) {
  if (q.type === 'fill') return r.text ? esc(r.text) : 'Left blank';
  if (q.type === 'order') return r.order.map(up).join(', ');
  const picks = S.mode === 'coach' ? r.tried : r.sel;
  return picks.length ? picks.map(up).join(', ') : 'Left blank';
}
function renderResults() {
  const coach = S.mode === 'coach', st = Object.fromEntries(S.ids.map(id => [id, status(id)]));
  const right = S.ids.filter(id => st[id] === 'right'), wrong = S.ids.filter(id => st[id] === 'wrong'), skip = S.ids.filter(id => st[id] === 'skipped');
  const denom = coach ? right.length + wrong.length : S.ids.length, pct = denom ? Math.round(right.length / denom * 100) : 0;
  const missed = coach ? wrong.concat(skip) : wrong.concat(skip);
  const brk = (title, groups) => { const rows = groups.map(([name, f]) => { const ids = S.ids.filter(id => f(BYID[id]) && (!coach || st[id] !== 'skipped')); if (!ids.length) return ''; const ok = ids.filter(id => st[id] === 'right').length;
      return `<span>${esc(name)}</span><span class="bar"><i style="width:${(ok / ids.length * 100).toFixed(0)}%"></i></span><span>${ok}/${ids.length}</span>`; }).join('');
    return rows ? `<section class="panel stack"><h2>${title}</h2><div class="brk">${rows}</div></section>` : ''; };
  let h = `<section class="panel stack"><p class="label">${coach ? 'Coached session · first-try score' : `Exam mode · ${mmss(S.elapsed)} elapsed`}</p><p class="score">${pct}%</p><p>${right.length} of ${denom} correct${coach ? ' on the first try' : ''}.${skip.length ? ` ${skip.length} ${coach ? 'not attempted and left out of the score' : 'left blank and scored as missed'}.` : ''}</p>
    <div class="row">${missed.length ? `<button class="btn primary" id="redo">Coach me through the ${missed.length} I missed</button>` : ''}<button class="btn" id="new">Set up a new exam</button></div></section>`;
  h += brk('By chapter', DATA.chapters.map(c => [`Ch ${c.n}: ${c.title}`, q => q.ch === c.n]));
  h += brk("By Bloom's level", BLOOMS.map(b => [b, q => q.bloom === b]));
  h += brk('By question type', Object.entries(KIND).map(([k, v]) => [v, q => q.type === k]));
  if (missed.length) { h += `<section class="panel stack" style="gap:14px"><h2>Missed questions</h2><p class="lede">Answers stay hidden until you open them, so you can work each one again first.</p>`;
    h += missed.map(id => { const q = BYID[id], r = S.resp[id]; let whys = '';
      if (q.why) { const picks = (coach ? r.tried : r.sel).filter(k => q.why[k]); whys = picks.map(k => `<p class="yours">${up(k)}: ${esc(q.why[k])}</p>`).join('');
        if (!coach && q.type === 'sata') { const m = q.ans.filter(k => !r.sel.includes(k)).length; if (m && r.sel.length) whys += `<p class="yours">You missed ${m} correct option${m === 1 ? '' : 's'}.</p>`; } }
      return `<div class="miss stack" style="gap:8px"><div class="tags"><span class="tag">Chapter ${q.ch}</span><span class="tag kind">${KIND[q.type]}</span><span class="tag">Bloom's: ${esc(q.bloom)}</span></div><p>${esc(q.stem)}</p>${q.opts && q.type !== 'order' ? `<p style="color:var(--muted)">${q.opts.map(o => `${up(o.k)}. ${esc(o.t)}`).join('<br>')}</p>` : ''}<p><strong>${coach ? 'First tries' : 'Your answer'}:</strong> ${st[id] === 'skipped' ? 'Not attempted' : yourAnswer(q, r)}</p>${whys}<details><summary>Show answer and rationale</summary><div class="stack" style="padding-top:8px"><p><strong>${esc(answerText(q))}</strong></p>${rationaleHTML(q)}</div></details></div>`; }).join('') + `</section>`; }
  app.innerHTML = h;
  const rd = document.getElementById('redo'); if (rd) rd.onclick = () => start(missed.slice(), 'coach');
  document.getElementById('new').onclick = () => { store.clear(); renderSetup(); window.scrollTo(0, 0); };
}

const boot = store.get();
if (boot && boot.finished && boot.ids && boot.ids.every(id => BYID[id])) { S = boot; renderResults(); } else renderSetup();
</script>

</body></html>
