k of six patients over the course of a shift.) • Ms. H, a 42-year-old woman, has right upper quadrant pain that radiates to the right shoulder. She has a history of gallstones. She was admitted through the emergency department last night with acute cholecystitis. The night shift nurse reports, “She had a good night.” • Ms. D, a 60-year-old woman, was admitted with vomiting and pain in the midabdomen related to a bowel obstruction. She reports abdominal pain that has gradually improved since the insertion of a nasogastric (NG) tube. She is receiving IV fluids and is currently NPO. • Ms. T, a 29-year-old woman, was admitted for an acute exacerbation of ulcerative colitis. She appears wasted and malnourished. She has severe diarrhea and reports predefecation abdominal pain and generalized tenderness to palpation. The plan is to start administering total parenteral nutrition (TPN) through a central line this morning. • Mr. A, a 26-year-old man, will be discharged in the afternoon. He is homeless and frequently sleeps in a nearby shelter. He had discharge teaching from the enterostomal therapist yesterday regarding his infected wound secondary to a ruptured appendix; he wants a review of the wound care instructions before he leaves. • Mr. K, an 85-year-old man, is frail but alert and oriented to person and place. He was transferred from an extended-care facility to receive a percutaneous endoscopic gastrostomy (PEG) tube that was placed 5 days ago. He has a large family. They ask a lot of questions and argue continuously among themselves and with the staff. His vital signs are stable. • Mr. R, a 57-year-old man, has periumbilical pain. The pain is very severe, despite medication, and radiates to the back. Mr. R was admitted with acute pancreatitis. He is NPO and has an NG tube and IV line. He is belligerent and confused. His white blood cell (WBC) count and blood glucose level are increased.","intro":true}],"why":"For a low calcium level (normal range 9.0-10.5 mg/dl [9.0-10.5 mmol/L]), the nurse will assess for Chvostek sign. This is accomplished by gently tapping the facial nerve in front of the ear and observing for contraction of the facial muscles. Hypocalcemia, a complication of acute pancreatitis, can cause tetany, laryngospasm, and seizures. Grey-Turner sign is a bluish discoloration of the flank that occurs with retroperitoneal bleeding of the pancreas. Cullen sign, a bluish discoloration of the periumbilical area, is associated with acute hemorrhagic pancreatitis. Tenderness over McBurney point is a sign for acute appendicitis.","tip":"","meta":{"Focus":"Prioritization"},"note":"","keyText":"4","stem":"For Mr. R (acute pancreatitis), the calcium level is 7.5 mg/dl (1.875 mmol/L). Which assessment will the nurse perform?","opts":["Assess for Cullen sign.","Assess for Grey-Turner sign.","Assess for McBurney sign.","Assess for Chvostek sign."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy9-40","topic":"fe","topicName":"F&E / ABG","source":"Case Study 9: Multiple Patients With Gastrointestinal Problems","srcShort":"Case Study 9","num":40,"ctx":[{"text":"An RN is the leader of a team caring for patients with gastrointestinal disorders on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation, an experienced assistive personnel (AP), and a nursing student. The following information about the six assigned patients is included in the hand-off report. (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study. This gives you practice in identifying important information and simulates how you would use the notes to remember and keep track of six patients over the course of a shift.) • Ms. H, a 42-year-old woman, has right upper quadrant pain that radiates to the right shoulder. She has a history of gallstones. She was admitted through the emergency department last night with acute cholecystitis. The night shift nurse reports, “She had a good night.” • Ms. D, a 60-year-old woman, was admitted with vomiting and pain in the midabdomen related to a bowel obstruction. She reports abdominal pain that has gradually improved since the insertion of a nasogastric (NG) tube. She is receiving IV fluids and is currently NPO. • Ms. T, a 29-year-old woman, was admitted for an acute exacerbation of ulcerative colitis. She appears wasted and malnourished. She has severe diarrhea and reports predefecation abdominal pain and generalized tenderness to palpation. The plan is to start administering total parenteral nutrition (TPN) through a central line this morning. • Mr. A, a 26-year-old man, will be discharged in the afternoon. He is homeless and frequently sleeps in a nearby shelter. He had discharge teaching from the enterostomal therapist yesterday regarding his infected wound secondary to a ruptured appendix; he wants a review of the wound care instructions before he leaves. • Mr. K, an 85-year-old man, is frail but alert and oriented to person and place. He was transferred from an extended-care facility to receive a percutaneous endoscopic gastrostomy (PEG) tube that was placed 5 days ago. He has a large family. They ask a lot of questions and argue continuously among themselves and with the staff. His vital signs are stable. • Mr. R, a 57-year-old man, has periumbilical pain. The pain is very severe, despite medication, and radiates to the back. Mr. R was admitted with acute pancreatitis. He is NPO and has an NG tube and IV line. He is belligerent and confused. His white blood cell (WBC) count and blood glucose level are increased.","intro":true}],"why":"The low calcium level and the falling hematocrit and Po2, in combination with the elevated WBC count and his age, are indicators of a high mortality risk. A high level of pain is not a prognostic factor, but severe unrelieved pain should always be reported. Blood type will not affect the HCP’s decisions about therapy. Reporting on the NG tube and IV line would be appropriate for a hand-off report, but information about equipment is not reported to the HCP unless there is a specific problem that requires an order or a change of therapy.","tip":"","meta":{"Focus":"Prioritization"},"note":"","keyText":"1, 2, 3, 4","stem":"Which information regarding Mr. R (acute pancreatitis) is appropriate to report to the HCP? Select all that apply.","opts":["Hematocrit has decreased by more than 10%.","Calcium level is 7.5 mg/dl (1.875 mmol/L).","Partial oxygen pressure (Po2) is less than 60 mm Hg.","Pain is unrelieved by medication.","Blood type is O positive.","NG tube and IV line are intact."],"nopts":6,"key":[1,2,3,4],"type":"multi"},{"id":"casestudy12-3","topic":"fe","topicName":"F&E / ABG","source":"Case Study 12: Gastrointestinal Bleeding","srcShort":"Case Study 12","num":3,"ctx":[{"text":"Mr. S, a 50-year-old man, has driven himself to the emergency department (ED) after vomiting a large amount of bright red blood twice within the past 3 hours. He arrives alert and oriented to person, place and time but appears anxious and restless. He is able to provide only a vague history but admits to drink-ing “a few” last weekend. He knows that he is “supposed to stop drinking” and is supposed to take “something for my stomach,” but he cannot recall the name of the medication. He reports intermittent dizziness and fatigue that have been worsening over the past 2 days. His skin is pale, cool, and clammy. His abdomen is slightly distended. He reports pain (4 on a scale of 1 to 10) in the midepigastric area and says he is thirsty. Capillary refill is prolonged, blood pressure is 100/90 mm Hg, pulse is weak and thready at 130 beats/ min, respiratory rate is 24 breaths/min, and temperature is 99°F (37.2°C).","intro":true}],"why":"The ABCs are used to prioritize care for critical patients. The patient shows no overt signs of respiratory distress; however, there is a high risk for hypovolemic shock, and supplemental oxygen should be given based on the assumption that the patient has already sustained blood loss and therefore has decreased oxygen-carrying capacity. Vital signs and oxygen saturation should be monitored every 15 minutes for all unstable patients. ECG monitoring is initiated because there is a risk for shock; tachycardia is an early sign. In an emergency situation, peripheral IVs are usually established first. Isotonic crystalloids, such as lactated Ringer or normal saline, are administered. Fluid bolus is given to increase vascular volume. Blood samples for CBC and clotting studies guide therapy, and type and crossmatch are done because of the potential need for blood products. The patient does not need endotracheal intubation at this point. Central line placement is a sterile procedure that takes more time and may be delayed, particularly if the patient is actively vomiting. Eventually the stool should be checked for occult blood, but the presence or absence will not affect the emergency treatment decisions. In the past, nasogastric tubes were routinely inserted when patients had active GI bleeding. The HCP may order an NG tube for decompression of the stomach, after the patient is stabilized. Reviewing the patient’s history and a description of events leading to the bleeding are deferred until after the life-saving interventions are performed.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange, Fluid and Electrolytes","QSEN":"S","Cognitive Level":"Analyzing","Cognitive Skill":"Take Action"},"note":"","keyText":"4, 5, 7, 8, 9, 11, 12","img":[{"src":"img/c0041.webp","w":1100,"h":814}],"type":"multi","nopts":12,"key":[4,5,7,8,9,11,12]},{"id":"casestudy12-4","topic":"fe","topicName":"F&E / ABG","source":"Case Study 12: Gastrointestinal Bleeding","srcShort":"Case Study 12","num":4,"ctx":[{"text":"Mr. S, a 50-year-old man, has driven himself to the emergency department (ED) after vomiting a large amount of bright red blood twice within the past 3 hours. He arrives alert and oriented to person, place and time but appears anxious and restless. He is able to provide only a vague history but admits to drink-ing “a few” last weekend. He knows that he is “supposed to stop drinking” and is supposed to take “something for my stomach,” but he cannot recall the name of the medication. He reports intermittent dizziness and fatigue that have been worsening over the past 2 days. His skin is pale, cool, and clammy. His abdomen is slightly distended. He reports pain (4 on a scale of 1 to 10) in the midepigastric area and says he is thirsty. Capillary refill is prolonged, blood pressure is 100/90 mm Hg, pulse is weak and thready at 130 beats/ min, respiratory rate is 24 breaths/min, and temperature is 99°F (37.2°C).","intro":true}],"why":"The priority for this patient is fluid loss and potential for hypovolemic shock, so the RN would insert two large-bore peripheral IVs. Drawing blood is important, but this is a lower priority. An indwelling urinary catheter is an important part of the therapy for this patient, but it is not considered a life-preserving measure. Repeat vital signs and application of the pulse oximeter are needed. This can be delegated, but the AP must be instructed to report all values so that the nurse can monitor trends.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"S","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"Which immediate (STAT) intervention would the RN perform first?","opts":["Draw blood for CBC and type and cross-match.","Insert two peripheral IV lines with large-bore catheters.","Insert an indwelling urinary catheter.","Repeat the vital signs and apply the pulse oximeter."],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy12-8","topic":"fe","topicName":"F&E / ABG","source":"Case Study 12: Gastrointestinal Bleeding","srcShort":"Case Study 12","num":8,"ctx":[{"text":"Mr. S, a 50-year-old man, has driven himself to the emergency department (ED) after vomiting a large amount of bright red blood twice within the past 3 hours. He arrives alert and oriented to person, place and time but appears anxious and restless. He is able to provide only a vague history but admits to drink-ing “a few” last weekend. He knows that he is “supposed to stop drinking” and is supposed to take “something for my stomach,” but he cannot recall the name of the medication. He reports intermittent dizziness and fatigue that have been worsening over the past 2 days. His skin is pale, cool, and clammy. His abdomen is slightly distended. He reports pain (4 on a scale of 1 to 10) in the midepigastric area and says he is thirsty. Capillary refill is prolonged, blood pressure is 100/90 mm Hg, pulse is weak and thready at 130 beats/ min, respiratory rate is 24 breaths/min, and temperature is 99°F (37.2°C).","intro":true}],"why":"2: The initial Hct and Hgb values could appear normal but be artificially high because plasma and red blood cells are equally lost during active bleeding. After emergency fluid resuscitation with normal saline or lactated Ringer solution, the nurse would expect the subsequent Hct and Hgb to be much lower. The normal ranges for men are a Hct of 42% to 52% (0.42 to 0.52 volume fraction) and a Hgb of 14 to 18 g/dL (8.7 to 11.2 mmol/L).","tip":"Don’t take laboratory numbers at face value. Results must be interpreted within the context of the patient’s condition. Higher Hct and Hgb values would normally accompany dehydration (low vascular volume), whereas lower values would be expected in overhydration (hemodilution).","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"S","Cognitive Level":"Analyzing"},"note":"","keyText":"","stem":"The results of the initial hematocrit (Hct) and hemoglobin (Hgb) tests, for which the blood was drawn when the patient first arrived in the ED, show that the Hct was 42% (0.42 volume fraction) and the Hgb was 14g/dL (11.2 mmol/L). How does the nurse interpret these results?","opts":["The results indicate that there is no active bleeding.","Loss of plasma (fluid) causes artificial high values.","Normal values within the low range indicate chronic bleeding.","The results indicate a need for immediate transfusion of whole blood."],"nopts":4,"key":[],"type":"reveal"},{"id":"casestudy13-10","topic":"fe","topicName":"F&E / ABG","source":"Case Study 13: Head and Leg Trauma and Shock","srcShort":"Case Study 13","num":10,"ctx":[{"text":"Ms. A, a 20-year-old college student who had been drinking at a fraternity party before she fell from a second-floor balcony, has just arrived in the emergency department (ED). A fellow college student who accompanies Ms. A tells the triage nurse, “She was completely knocked out right after the fall. But then she woke up a little, so we thought she was okay—until she stopped moving again.” When the nurse assesses Ms. A, there is no response to commands or to having her name called. Her eyes are shut, and she does not open them even when the nurse applies nail bed pressure. Her pupils are unequal, with the right pupil larger than the left. Ms. A’s blood pressure is 70/30 mm Hg, she is in a sinus bradycardia with a rate of 40 beats/min, and her respiratory rate is 6 breaths/min. Her respirations are irregular, and she has 20-second periods of apnea. She has a large occipital laceration, and her left leg is misaligned. The paramedics have a cervical collar and backboard in place. A 16-gauge catheter has been inserted at the left antecubital area, and lactated Ringer solution is infusing at 150 mL/hr.","intro":true},{"img":[{"src":"img/c0042.webp","w":1100,"h":642},{"src":"img/c0043.webp","w":1100,"h":404}],"intro":false}],"why":"Ms. A’s ABG results indicate uncompensated respiratory acidosis and hypoxemia. Because her respiratory drive is suppressed, she will need rapid intubation and ventilation using a mechanical positive-pressure ventilator. She may need surgery, in which case it would be appropriate to have blood available in the blood bank. Although ongoing monitoring of the magnesium level is indicated, the magnesium level is in the low-normal range, so administration of magnesium is not a priority at this time. Insulin would not typically be administered for a small glucose elevation such as this in a nonfasting patient.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"Based on the laboratory values, which collaborative intervention will the nurse anticipate next?","opts":["Type and cross-match for three units of packed red blood cells.","Administer magnesium sulfate 1 g IV over the next 3 hours.","Give insulin aspart dose based on the standard sliding scale.","Obtain an endotracheal intubation tray and assist with intubation."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy13-15","topic":"fe","topicName":"F&E / ABG","source":"Case Study 13: Head and Leg Trauma and Shock","srcShort":"Case Study 13","num":15,"ctx":[{"text":"Ms. A, a 20-year-old college student who had been drinking at a fraternity party before she fell from a second-floor balcony, has just arrived in the emergency department (ED). A fellow college student who accompanies Ms. A tells the triage nurse, “She was completely knocked out right after the fall. But then she woke up a little, so we thought she was okay—until she stopped moving again.” When the nurse assesses Ms. A, there is no response to commands or to having her name called. Her eyes are shut, and she does not open them even when the nurse applies nail bed pressure. Her pupils are unequal, with the right pupil larger than the left. Ms. A’s blood pressure is 70/30 mm Hg, she is in a sinus bradycardia with a rate of 40 beats/min, and her respiratory rate is 6 breaths/min. Her respirations are irregular, and she has 20-second periods of apnea. She has a large occipital laceration, and her left leg is misaligned. The paramedics have a cervical collar and backboard in place. A 16-gauge catheter has been inserted at the left antecubital area, and lactated Ringer solution is infusing at 150 mL/hr.","intro":true},{"img":[{"src":"img/c0042.webp","w":1100,"h":642},{"src":"img/c0043.webp","w":1100,"h":404}],"intro":false}],"why":"Lower-than-normal PaCO2 levels cause cerebral vasoconstriction and result in further cerebral hypoxia. The RN should notify the HCP and anticipate a decrease in the ventilator rate. The oxygen percentage being delivered by the ventilator should be evaluated because a lower fraction of inspired oxygen (FIO2) may be adequate. Nevertheless, the current PaO2 will not have any adverse effect on cerebral perfusion. The decrease in HCO3- reflects a compensatory mechanism for the patient’s respiratory alkalosis and will resolve spontaneously when the PaO2 level rises.","tip":"When analyzing ABGs, always consider both oxygenation (using PaO2 and oxygen saturation) and acid-base balance (using pH, PaCO2, and HCO3-). Even if the patient’s oxygenation is adequate, disorders in acid-base balance may lead to poor outcomes.","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"Which parameter indicates a need for an immediate change in the ventilator settings?","opts":["Paco2","O2 saturation","HCO3-","Pao2"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy13-16","topic":"fe","topicName":"F&E / ABG","source":"Case Study 13: Head and Leg Trauma and Shock","srcShort":"Case Study 13","num":16,"ctx":[{"text":"Ms. A, a 20-year-old college student who had been drinking at a fraternity party before she fell from a second-floor balcony, has just arrived in the emergency department (ED). A fellow college student who accompanies Ms. A tells the triage nurse, “She was completely knocked out right after the fall. But then she woke up a little, so we thought she was okay—until she stopped moving again.” When the nurse assesses Ms. A, there is no response to commands or to having her name called. Her eyes are shut, and she does not open them even when the nurse applies nail bed pressure. Her pupils are unequal, with the right pupil larger than the left. Ms. A’s blood pressure is 70/30 mm Hg, she is in a sinus bradycardia with a rate of 40 beats/min, and her respiratory rate is 6 breaths/min. Her respirations are irregular, and she has 20-second periods of apnea. She has a large occipital laceration, and her left leg is misaligned. The paramedics have a cervical collar and backboard in place. A 16-gauge catheter has been inserted at the left antecubital area, and lactated Ringer solution is infusing at 150 mL/hr.","intro":true},{"img":[{"src":"img/c0042.webp","w":1100,"h":642},{"src":"img/c0043.webp","w":1100,"h":404}],"intro":false}],"why":"Using the SBAR format, the nurse first describes the primary concern (situation) and then provides background information about the patient. Next, the nurse discusses pertinent assessment data. Finally, recommendations for needed changes in the treatment plan are communicated.","tip":"","meta":{"Focus":"Prioritization","Concept":"Communication","QSEN":"T/C","Cognitive Level":"Analyzing"},"note":"","keyText":"2, 4, 3, 1","stem":"Using the SBAR (situation, background, assessment, recommendations) format, in which order will the nurse communicate this information about the patient to the HCP?","opts":["“I am concerned that Ms. A may develop worsening cerebral hypoxia caused by cerebral vasoconstriction and I would like to decrease the respiratory rate setting on the ventilator.”","“This is the nurse caring for Ms. A. The patient’s most recent ABGs indicate that her PaCO2 is too low, possibly worsening her cerebral perfusion.”","“Her current ventilator respiratory rate is set at 20, and ABGs show the PaCO2 is 25 mm Hg (3.33 kPa), with a pH of 7.54. O2 saturation is 96% (0.96) with a PaO2 of 90 mm Hg (11.97 kPa).”","“Ms. A is a 20-year-old woman who had evacuation of an epidural hematoma and has been nonresponsive and ventilator dependent since surgery.”"],"nopts":4,"key":[2,4,3,1],"type":"order"},{"id":"casestudy13-17","topic":"fe","topicName":"F&E / ABG","source":"Case Study 13: Head and Leg Trauma and Shock","srcShort":"Case Study 13","num":17,"ctx":[{"text":"Ms. A, a 20-year-old college student who had been drinking at a fraternity party before she fell from a second-floor balcony, has just arrived in the emergency department (ED). A fellow college student who accompanies Ms. A tells the triage nurse, “She was completely knocked out right after the fall. But then she woke up a little, so we thought she was okay—until she stopped moving again.” When the nurse assesses Ms. A, there is no response to commands or to having her name called. Her eyes are shut, and she does not open them even when the nurse applies nail bed pressure. Her pupils are unequal, with the right pupil larger than the left. Ms. A’s blood pressure is 70/30 mm Hg, she is in a sinus bradycardia with a rate of 40 beats/min, and her respiratory rate is 6 breaths/min. Her respirations are irregular, and she has 20-second periods of apnea. She has a large occipital laceration, and her left leg is misaligned. The paramedics have a cervical collar and backboard in place. A 16-gauge catheter has been inserted at the left antecubital area, and lactated Ringer solution is infusing at 150 mL/hr.","intro":true},{"img":[{"src":"img/c0042.webp","w":1100,"h":642},{"src":"img/c0043.webp","w":1100,"h":404}],"intro":false}],"why":"Ms. A’s high urine output suggests that she has developed diabetes insipidus, a common complication of intracranial surgery. Because diabetes insipidus can rapidly lead to dehydration in a patient who is unable to take in oral fluids, the priority action needed is to increase the IV rate. Continuing to monitor the output and checking the specific gravity would also be needed but would not correct the risk for hypovolemia and hypotension. Because Ms. A’s neurologic status is so poor, it is unlikely that changes in her neurologic status would be helpful in determining the effects of fluid and electrolyte imbalance.","tip":"","meta":{"Focus":"Prioritization","Concept":"Elimination","QSEN":"T/C","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"The LPN/LVN reports that Ms. A’s output for the past hour was 1200 mL and that her urine is very pale yellow. Which action is best for the nurse to take at this time?","opts":["Instruct the LPN/LVN to continue to monitor the urine output hourly.","Send a urine specimen to the laboratory to check specific gravity.","Notify the neurosurgeon and anticipate an increase in the IV rate.","Assess the patient’s neurologic status for signs of increased irritability."],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy14-5","topic":"fe","topicName":"F&E / ABG","source":"Case Study 14: Septic Shock","srcShort":"Case Study 14","num":5,"ctx":[{"img":[{"src":"img/c0044.webp","w":1100,"h":428}],"intro":true},{"img":[{"src":"img/c0045.webp","w":1100,"h":313}],"intro":false}],"why":"The ABG values indicate that the patient is hypoxemic (low PaO2 and oxygen saturation) and has a severe uncompensated respiratory acidosis (low pH and elevated PaCO2). Because she is unable to maintain adequate oxygenation and ventilation independently, intubation and mechanical ventilation are indicated. Sodium bicarbonate is administered only if metabolic acidosis is present. Although the patient will need ongoing respiratory monitoring and may also benefit from albuterol therapy, these therapies are not adequate in a patient with these severe ABG abnormalities.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"Based on an analysis of the ABG values, which collaborative intervention will the nurse anticipate next?","opts":["Sodium bicarbonate bolus IV","Endotracheal intubation and mechanical ventilation","Continuous monitoring of Ms. D’s respiratory status","Nebulized albuterol therapy"],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy14-9","topic":"fe","topicName":"F&E / ABG","source":"Case Study 14: Septic Shock","srcShort":"Case Study 14","num":9,"ctx":[{"img":[{"src":"img/c0044.webp","w":1100,"h":428}],"intro":true},{"img":[{"src":"img/c0045.webp","w":1100,"h":313}],"intro":false}],"why":"The most common complication of too-rapid IV infusion of fluids is volume overload, leading to fluid overload and heart failure. Although peripheral edema, decreased urine output, and jugular venous distention may be indicators that heart failure is developing, they do not occur as rapidly as the backup of fluids into the pulmonary capillaries and then into the alveoli.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluids and Electrolytes","QSEN":"EBP","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"When the nurse is infusing the normal saline, which action is most important in evaluating for an adverse reaction to the rapid fluid infusion?","opts":["Palpating for any peripheral edema","Monitoring urine output","Listening to lung sounds","Checking for jugular venous distention"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy14-13","topic":"fe","topicName":"F&E / ABG","source":"Case Study 14: Septic Shock","srcShort":"Case Study 14","num":13,"ctx":[{"img":[{"src":"img/c0044.webp","w":1100,"h":428}],"intro":true},{"img":[{"src":"img/c0045.webp","w":1100,"h":313}],"intro":false},{"img":[{"src":"img/c0047.webp","w":1100,"h":298}],"intro":false}],"why":"The low central venous pressure indicates that the patient is still hypovolemic and will need an increase in IV fluids. The arterial blood pressure and temperature have improved. The patient has chronic atrial fibrillation, and the rate has remained stable.","tip":"","meta":{"Focus":"Prioritization","Concept":"Perfusion","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Which information about Ms. D is most important for the nurse to communicate rapidly to the HCP?","opts":["Decreased blood pressure","Ongoing atrial fibrillation","Low central venous pressure","Continued temperature elevation"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy14-14","topic":"fe","topicName":"F&E / ABG","source":"Case Study 14: Septic Shock","srcShort":"Case Study 14","num":14,"ctx":[{"img":[{"src":"img/c0044.webp","w":1100,"h":428}],"intro":true},{"img":[{"src":"img/c0045.webp","w":1100,"h":313}],"intro":false},{"img":[{"src":"img/c0047.webp","w":1100,"h":298}],"intro":false}],"why":"In a hypovolemic patient, increasing the norepinephrine rate will not improve perfusion and may increase the risk for adverse norepinephrine effects such as arrhythmias. The nurse may question the other prescribed actions, but these are not as likely to result in poor patient outcomes. A higher-than-prescribed normal saline infusion rate may be needed to improve volume status, the patient’s temperature is already decreasing in response to antibiotic therapy, and oxygen saturation is already at an adequate (though not optimal) level.","tip":"","meta":{"Focus":"Prioritization","Concept":"Collaboration, Communication","QSEN":"Safety","Cognitive Level":"Analyzing","IPEC":"R/R"},"note":"","keyText":"4","stem":"Which of these actions prescribed by the HCP will be most important for the nurse to question?","opts":["Increase oxygen flow rate (FIO2).","Raise normal saline rate to 450 mL/hr.","Administer acetaminophen 650 mg rectally.","Increase norepinephrine infusion rate to 12 mcg/kg."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy15-5","topic":"fe","topicName":"F&E / ABG","source":"Case Study 15: Heart Failure","srcShort":"Case Study 15","num":5,"ctx":[{"text":"The nurse admits Ms. C, an 81-year-old patient, to the intensive care unit (ICU). Ms. C, who has a history of mitral valve regurgitation and left ventricular failure, came to the emergency department (ED) with symptoms of increasing shortness of breath over the past week. The patient received furosemide 100 mg IV in the ED, and she is receiving oxygen via a nasal cannula at 4 L/min. When Ms. C arrives in the ICU, she is sitting up in bed at a 60-degree angle. She is pale, with circumoral cyanosis, and her respirations appear labored and rapid. She indicates that she feels very short of breath.","intro":true}],"why":"Although the assessment indicates that a loop diuretic is indicated, it is essential to know the patient’s potassium level before administering furosemide. She has already received furosemide in the ED, which can cause hypokalemia. Angiotensin-converting enzyme (ACE) inhibitors can increase potassium levels, so it is also essential to know the potassium level before giving the enalapril. The retention catheter is appropriate for this patient, but the priority is to ensure that her potassium level is within normal limits and then administer the diuretic to decrease volume overload.","tip":"When administering diuretics, ACE inhibitors, or angiotensin receptor blocking agents, you should be aware of recent electrolyte levels (especially potassium) before giving the medications.","meta":{"Focus":"Prioritization","Concept":"Fluids and Electrolytes","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Ms. C’s blood pressure is 98/52 mm Hg, and her apical pulse is 116 beats/min. The cardiac monitor shows sinus tachycardia at a rate of 110 to 120 beats/min. Which action prescribed by the health care provider (HCP) will the nurse implement first?","opts":["Give enalapril 2.5 mg PO.","Administer furosemide 100 mg IV.","Obtain a blood potassium level.","Insert a no. 16 urinary catheter."],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy15-8","topic":"fe","topicName":"F&E / ABG","source":"Case Study 15: Heart Failure","srcShort":"Case Study 15","num":8,"ctx":[{"text":"The nurse admits Ms. C, an 81-year-old patient, to the intensive care unit (ICU). Ms. C, who has a history of mitral valve regurgitation and left ventricular failure, came to the emergency department (ED) with symptoms of increasing shortness of breath over the past week. The patient received furosemide 100 mg IV in the ED, and she is receiving oxygen via a nasal cannula at 4 L/min. When Ms. C arrives in the ICU, she is sitting up in bed at a 60-degree angle. She is pale, with circumoral cyanosis, and her respirations appear labored and rapid. She indicates that she feels very short of breath.","intro":true}],"why":"KCl is infused at a rate no faster than 10 mEq/hr through a peripheral IV line and no faster than 20 to 30 mEq/hr through a central catheter. Infusing KCl too rapidly (over 1 or 10 minutes) is contraindicated because this may cause cardiac arrest. Administering KCl over 8 hours would delay the administration of furosemide.","tip":"","meta":{"Focus":"Prioritization","Concept":"Safety","QSEN":"Safety","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"Ms. C’s potassium level is 3.3 mEq/L (3.3 mmol/L). The HCP prescribes potassium chloride (KCl) 10 mEqIV. How should the nurse administer the KCl?","opts":["Use an infusion pump to give the KCl over 10 minutes.","Dilute the KCl in 100 mL of 5% dextrose in water (D5W) and infuse over 1 hour.","Administer the KCl by IV push over at least 1 minute using a 10-mL syringe.","Add the KCl to 1 L of D5W and administer over 8 hours."],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy15-9","topic":"fe","topicName":"F&E / ABG","source":"Case Study 15: Heart Failure","srcShort":"Case Study 15","num":9,"ctx":[{"text":"The nurse admits Ms. C, an 81-year-old patient, to the intensive care unit (ICU). Ms. C, who has a history of mitral valve regurgitation and left ventricular failure, came to the emergency department (ED) with symptoms of increasing shortness of breath over the past week. The patient received furosemide 100 mg IV in the ED, and she is receiving oxygen via a nasal cannula at 4 L/min. When Ms. C arrives in the ICU, she is sitting up in bed at a 60-degree angle. She is pale, with circumoral cyanosis, and her respirations appear labored and rapid. She indicates that she feels very short of breath.","intro":true}],"why":"Because Ms. C’s major problem is pulmonary edema, the most useful information will be changes in her lung sounds. The other data are also helpful in assessing for volume overload but are not as pertinent to the diagnosis of pulmonary edema.","tip":"Pulmonary congestion caused by fluid overload can occur very suddenly in heart failure but also in other situations, such as IV fluid infusions. Because changes in fluid balance can occur rapidly in acutely ill patients, auscultation of lung sounds is a common and very useful assessment to determine whether changes in treatment need to be considered. You will also need to monitor other respiratory parameters, such as respiratory effort, respiratory rate, and oxygen saturation.","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"EBP","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"After infusing the KCl, the nurse administers the furosemide to Ms. C. Which nursing action will be most useful in evaluating whether the furosemide is having the desired effect?","opts":["Weighing the patient daily","Measuring hourly urine output","Monitoring blood pressure","Assessing lung sounds"],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy15-13","topic":"fe","topicName":"F&E / ABG","source":"Case Study 15: Heart Failure","srcShort":"Case Study 15","num":13,"ctx":[{"text":"The nurse admits Ms. C, an 81-year-old patient, to the intensive care unit (ICU). Ms. C, who has a history of mitral valve regurgitation and left ventricular failure, came to the emergency department (ED) with symptoms of increasing shortness of breath over the past week. The patient received furosemide 100 mg IV in the ED, and she is receiving oxygen via a nasal cannula at 4 L/min. When Ms. C arrives in the ICU, she is sitting up in bed at a 60-degree angle. She is pale, with circumoral cyanosis, and her respirations appear labored and rapid. She indicates that she feels very short of breath.","intro":true}],"why":"Because the patient is receiving diuretic therapy, avoiding hypokalemia and hypomagnesemia is essential. Potassium supplements and ACE inhibitors can increase potassium levels. Diuretic use can impact renal function, so monitoring creatinine is important. BNP levels are used to check for improvement in heart failure. Glucose, calcium, and albumin may also be monitored but are not as important in evaluating for treatment effectiveness or adverse effects of treatment in patients with heart failure.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"1, 3, 4, 7","stem":"Which current laboratory values for this patient will be most important for the nurse to review? Select all that apply.","opts":["Potassium","Glucose","Magnesium","B-type natriuretic peptide (BNP)","Calcium","Albumin","Creatinine"],"nopts":7,"key":[1,3,4,7],"type":"multi"},{"id":"casestudy15-14","topic":"fe","topicName":"F&E / ABG","source":"Case Study 15: Heart Failure","srcShort":"Case Study 15","num":14,"ctx":[{"text":"The nurse admits Ms. C, an 81-year-old patient, to the intensive care unit (ICU). Ms. C, who has a history of mitral valve regurgitation and left ventricular failure, came to the emergency department (ED) with symptoms of increasing shortness of breath over the past week. The patient received furosemide 100 mg IV in the ED, and she is receiving oxygen via a nasal cannula at 4 L/min. When Ms. C arrives in the ICU, she is sitting up in bed at a 60-degree angle. She is pale, with circumoral cyanosis, and her respirations appear labored and rapid. She indicates that she feels very short of breath.","intro":true},{"img":[{"src":"img/c0048.webp","w":1100,"h":350}],"intro":false}],"why":"Because the nurse is concerned that the patient may have digoxin toxicity, the digoxin should be held. Hypokalemia can contribute to the risk for digoxin toxicity, and Ms. C is not acutely short of breath, so the furosemide (which causes potassium loss) should also be held until consulting with Ms. C’s HCP. There are no indications that the other medications are causing any adverse effects, and they should all be administered.","tip":"","meta":{"Focus":"Prioritization","Concept":"Safety","QSEN":"Safety","Cognitive Level":"Analyzing"},"note":"","keyText":"1, 5","stem":"All of Ms. C’s medications are scheduled to be given at 9:00 AM. Based on the patient’s assessment data and laboratory results, which medications will the nurse hold until after consulting with the HCP? Select all that apply.","opts":["Furosemide","Aspirin","KCl","Enalapril","Digoxin"],"nopts":5,"key":[1,5],"type":"multi"},{"id":"casestudy15-15","topic":"fe","topicName":"F&E / ABG","source":"Case Study 15: Heart Failure","srcShort":"Case Study 15","num":15,"ctx":[{"text":"The nurse admits Ms. C, an 81-year-old patient, to the intensive care unit (ICU). Ms. C, who has a history of mitral valve regurgitation and left ventricular failure, came to the emergency department (ED) with symptoms of increasing shortness of breath over the past week. The patient received furosemide 100 mg IV in the ED, and she is receiving oxygen via a nasal cannula at 4 L/min. When Ms. C arrives in the ICU, she is sitting up in bed at a 60-degree angle. She is pale, with circumoral cyanosis, and her respirations appear labored and rapid. She indicates that she feels very short of breath.","intro":true},{"img":[{"src":"img/c0048.webp","w":1100,"h":350}],"intro":false}],"why":"Using the SBAR format, the nurse first identifies himself or herself, gives the patient’s name, and describes the current situation. Next, relevant background information, such as the patient’s diagnosis and medications, are stated. The assessment includes both pertinent patient data and the nurse’s analysis of the situation. Finally, the nurse makes a recommendation indicating what action he or she thinks is needed.","tip":"","meta":{"Focus":"Prioritization","Concept":"Communication","QSEN":"T/C","Cognitive Level":"Analyzing","IEPC":"R/R"},"note":"","keyText":"3, 4, 1, 2","stem":"Using the SBAR (situation, background, assessment, recommendation) format, indicate the order in which the nurse will communicate concerns to the HCP.","opts":["“Today her lungs are clear to auscultation, but her potassium level is 3.4 mEq/L (3.4 mmol/L). I am concerned that she may have digoxin toxicity.”","“I’d like to obtain a digoxin level and administer additional potassium supplements before giving the prescribed digoxin and furosemide.”","“This is the nurse caring for Ms. C; I am calling because she has some PVCs and reports fuzzy vision.”","“Ms. C was admitted several days ago with pulmonary edema and dyspnea. She has been receiving digoxin and furosemide daily since admission.”"],"nopts":4,"key":[3,4,1,2],"type":"order"},{"id":"casestudy17-4","topic":"fe","topicName":"F&E / ABG","source":"Case Study 17: Respiratory Difficulty After Surgery","srcShort":"Case Study 17","num":4,"ctx":[{"text":"The nurse has just received the change-of-shift report about Mr. E, a 26-year-old man who had a ruptured appendix with an emergency appendectomy 2 days ago. The report included this information about Mr. E’s vital signs, assessments, and prescribed therapies: Vital Signs Temperature: 101.4°F (38.6°C) Pulse: 118 beats/min (sinus tachycardia) Respirations: 28 breaths/min Blood pressure (BP): 98/56 mm Hg Oxygen saturation: 90% (0.90) (decreased from 98% [0.98] over the past 4 hours) Assessment Respiratory: Fine crackles heard throughout lungs; nonproductive cough Gastrointestinal: Bowel sounds present, brown purulent drainage from wound drain Neurologic: Alert and oriented × 3 Therapies O2 at 2 L/min per nasal cannula Antibiotics: Vancomycin and ceftriaxone IV Arterial blood gases (ABGs), complete blood count (CBC), blood urea nitrogen, electrolytes, and glucose pending Vancomycin trough level ordered","intro":true},{"img":[{"src":"img/c0049.webp","w":1100,"h":281}],"intro":false}],"why":"The ABG results indicate that Mr. E is hypoxemic and has metabolic acidosis because of a cellular shift to the anaerobic metabolic pathway. These abnormalities should be corrected by increasing the PaO2 level. The nonrebreather mask is capable of delivering FIO2 levels of close to 100% (1.00). He is hyperventilating in response to hypoxemia, so administering morphine is not indicated. Although the nurse will continue to monitor this patient’s respiratory status, monitoring alone is not enough at this time.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"Which action will the nurse take next based on the ABG results?","opts":["Place Mr. E on oxygen at 15 L/min via a nonrebreather mask.","Obtain an order for sodium bicarbonate 50 mEq (50 mmol) IV.","Support the patient in taking long, slow breaths to decrease the respiratory rate.","Continue to monitor Mr. E’s respiratory status and vital signs."],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy17-11","topic":"fe","topicName":"F&E / ABG","source":"Case Study 17: Respiratory Difficulty After Surgery","srcShort":"Case Study 17","num":11,"ctx":[{"text":"The nurse has just received the change-of-shift report about Mr. E, a 26-year-old man who had a ruptured appendix with an emergency appendectomy 2 days ago. The report included this information about Mr. E’s vital signs, assessments, and prescribed therapies: Vital Signs Temperature: 101.4°F (38.6°C) Pulse: 118 beats/min (sinus tachycardia) Respirations: 28 breaths/min Blood pressure (BP): 98/56 mm Hg Oxygen saturation: 90% (0.90) (decreased from 98% [0.98] over the past 4 hours) Assessment Respiratory: Fine crackles heard throughout lungs; nonproductive cough Gastrointestinal: Bowel sounds present, brown purulent drainage from wound drain Neurologic: Alert and oriented × 3 Therapies O2 at 2 L/min per nasal cannula Antibiotics: Vancomycin and ceftriaxone IV Arterial blood gases (ABGs), complete blood count (CBC), blood urea nitrogen, electrolytes, and glucose pending Vancomycin trough level ordered","intro":true},{"img":[{"src":"img/c0049.webp","w":1100,"h":281}],"intro":false},{"img":[{"src":"img/c0050.webp","w":1100,"h":655}],"intro":false}],"why":"Current evidence-based guidelines for mechanical ventilation in ARDS suggest a PaO2 of 55 to 80 mm Hg as a goal; the FIO2 should be decreased because exposure to high oxygen levels causes alveolar damage. Although the PaCO2 is slightly elevated, mild hypercapnia is acceptable according to the most current research. Raising VT will increase the chance for complications such as pneumothorax. The CMV mode is generally used for patients who are unconscious or paralyzed because it allows the patient no control of respirations and is very uncomfortable.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"Safety","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Which ventilator change will the nurse anticipate based on analysis of the ABG values?","opts":["Increasing the tidal volume to 600 mL","Changing the rate on the ventilator to 35 breaths/min","Decreasing the Fio2 to 60% (0.60)","Changing to continuous mandatory ventilation (CMV) mode"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy17-12","topic":"fe","topicName":"F&E / ABG","source":"Case Study 17: Respiratory Difficulty After Surgery","srcShort":"Case Study 17","num":12,"ctx":[{"text":"The nurse has just received the change-of-shift report about Mr. E, a 26-year-old man who had a ruptured appendix with an emergency appendectomy 2 days ago. The report included this information about Mr. E’s vital signs, assessments, and prescribed therapies: Vital Signs Temperature: 101.4°F (38.6°C) Pulse: 118 beats/min (sinus tachycardia) Respirations: 28 breaths/min Blood pressure (BP): 98/56 mm Hg Oxygen saturation: 90% (0.90) (decreased from 98% [0.98] over the past 4 hours) Assessment Respiratory: Fine crackles heard throughout lungs; nonproductive cough Gastrointestinal: Bowel sounds present, brown purulent drainage from wound drain Neurologic: Alert and oriented × 3 Therapies O2 at 2 L/min per nasal cannula Antibiotics: Vancomycin and ceftriaxone IV Arterial blood gases (ABGs), complete blood count (CBC), blood urea nitrogen, electrolytes, and glucose pending Vancomycin trough level ordered","intro":true},{"img":[{"src":"img/c0049.webp","w":1100,"h":281}],"intro":false},{"img":[{"src":"img/c0050.webp","w":1100,"h":655}],"intro":false},{"img":[{"src":"img/c0052.webp","w":1100,"h":493}],"intro":false}],"why":"The central venous pressure and urine output suggest that Mr. E is hypovolemic, so increasing his IV fluid intake is essential. Nutritional interventions are important in critically ill patients. Enteral feeding is the preferred method for administering nutrition because the patient has bowel sounds. Correct placement of the NG tube should be confirmed with an X-ray. Furosemide administration would lead to further dehydration. Because the patient’s hypotension and tachycardia are most likely caused by hypovolemia, norepinephrine and diltiazem are not appropriate.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluids and Electrolytes, Perfusion","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"1, 5, 6","stem":"Based on the vital signs and assessment data, which collaborative interventions will the nurse anticipate at this time? Select all that apply.","opts":["Increase the IV rate to 150 mL/hr.","Administer furosemide 40 mg IV.","Start norepinephrine infusion.","Give diltiazem 15 mg IV.","Administer high-calorie enteral feeding at 25 mL/hr.","Obtain a portable x-ray to assure correct placement of nasogastric tube"],"nopts":6,"key":[1,5,6],"type":"multi"},{"id":"casestudy19-35","topic":"fe","topicName":"F&E / ABG","source":"Case Study 19: Pediatric Patients in Clinic and Acute Care Settings","srcShort":"Case Study 19","num":35,"ctx":[{"text":"The charge nurse is working in a large urban pediatric walk-in clinic that offers well-baby care, provides immunizations, and is an educational resource for child health topics. In addition, the clinic also accommodates walk-in patients and offers basic diagnostic testing and emergency care. The staff includes a pediatrician, a graduate student who is working toward an advanced practice nursing (APN) degree, an experienced RN, an experienced LPN/LVN, a pediatric social worker, a graduate nurse (GN), and an assistive personnel (AP). This morning, in addition to scheduled appointments, there is an immunization clinic. The charge nurse receives two phone calls, and there is one walk-in patient.","intro":true}],"why":"NG suctioning can result in metabolic alkalosis, hypokalemia, and hypochloremia. Charlie’s low respiratory rate, grogginess, and confusion are indicative of metabolic alkalosis. Metabolic alkalosis is further evidenced by increased pH. Muscle weakness is a sign of hypokalemia.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"PCC, S","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"At the change of shift, the nurse reassesses Charlie. His NG tube is patent and drained 120 mL over 12 hours. His oral temperature is 99.5°F (37.5°C), heart rate is 80 beats/min, and respiratory rate is 17 breaths/min. Charlie appears groggy and confused. Charlie’s muscle strength is 3 of 5 in his upper and lower extremities. Laboratory tests are ordered. Which results are most consistent with Charlie’s clinical presentation?","opts":["K+, 3.3 mEq/L (3.3 mmol/L); Cl−, 95 mEq/L (95 mmol/L); pH, 7.55","K+, 3.3 mEq/L (3.3 mmol/L); Cl−, 110 mEq/L (110 mmol/L); pH, 7.55","K+, 5.2 mEq/L (5.2 mmol/L); Cl−, 110 mEq/L (110 mmol/L); pH, 7.20","K+, 3.3 mEq/L (3.3 mmol/L); Cl−, 95 mEq/L (95 mmol/L); pH, 7.20"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy20-12","topic":"fe","topicName":"F&E / ABG","source":"Case Study 20: Multiple Patients With Mental Health Disorders","srcShort":"Case Study 20","num":12,"ctx":[{"text":"Note: In this case study, the term psychiatric nursing assistant (PNA) is used rather than the more familiar assistive personnel (AP). Different facilities and localities will use different titles for APs. The key point to remember in assigning tasks or making patient assignments is that APs who routinely work on a medical-surgical unit will have different skill sets compared with PNAs, who usually work on a psychiatric unit. The RN is the charge nurse caring for psychiatric patients on an acute admission unit. The team includes an experienced male RN, a female RN who has floated from a medical-surgical unit, an experienced female LPN/LVN, and two experienced PNAs. There is also a male nursing student on the unit today. The morning hand-off report includes the following information about the patients. (Note to student: This case study includes seven patients and simulates some events that could occur over the course of one shift. Take notes as though you were listening to the morning report. This will give you practice in identifying important information. Refer to your notes and use critical thinking to respond to the questions.) • Ms. G, an 82-year-old woman, has a history of dementia and depression. She has been admitted because her daughter believes that “Mom is getting more depressed and confused.” She is oriented to self and believes it is 1985. She is continuously trying to “find my coat so I can go to work.” She is ambulatory with an unsteady gait and can perform self-care with step-by-step coaching. Her daughter would like her transferred to a long-term geropsychiatric unit. • Ms. B, a 32-year-old woman, has borderline personality disorder and a history of frequent admissions to the psychiatric unit. Five days ago, she was admitted for suicidal gesture after self-infliction of cuts to the posterior forearm. She tries to manipulate others, and she is extremely flirtatious with males. She can independently perform activities of daily living (ADLs) but will dress in an excessively provocative manner. • Mr. D, a 58-year-old man, has a long history of major depression. He appears lethargic and disinterested in the environment and in others. He responds appropriately when asked a direct question but does not initiate any social interaction. He requires verbal prompting for all ADLs, which he can perform himself; however, he says, “I would rather not.” • Mr. S, a 38-year-old homeless man, has disorganized schizophrenia and was found wandering naked on a busy street. He has been on the unit for 7 weeks with minimal improvement, but he has not been aggressive toward anyone. He frequently giggles to himself, and if allowed, he weaves bits of garbage into his hair. He demonstrates word salad (schizophasia) and looseness of associations. He requires repetitive coaching to perform all ADLs. • Mr. V, a 62-year-old man, voluntarily committed himself 2 days previously for recurrent thoughts of suicide since the death of his wife several months ago. He reports frequently sitting at her graveside with a gun and a bottle of whiskey. He is alert and oriented × 3 (e.g., knows who he is, where he is, and what day and year it is) and answers questions appropriately, but he is preoccupied with thoughts of death. He is on one-to-one suicide precautions. • Ms. M, a 40-year-old woman, is diagnosed with manic phase of bipolar disorder. She was admitted after a verbal altercation in an expensive department store when her credit cards were declined because she was over the $10,000 limit. She is talkative, grandiose, and emotionally labile. She can accomplish ADLs but will change her clothes repeatedly throughout the day. • Mr. P, a 20-year-old man, has paranoid schizophrenia and was admitted yesterday through the emergency department after causing a disturbance on a public bus. He appears disheveled and acts suspicious. He has been refusing to eat or sleep because he believes that “those guys have been trying to kill me because I know who they are!”","intro":true}],"why":"When the sodium level (normal range 136–145 mEq/L or 136–145 mmol/L) is low, the body retains lithium, so there is an increased risk for lithium toxicity. The chloride (normal range 98–106 mEq/L or 98–106 mmol/L) and potassium (normal range 3.5–5.0 mEq/L or 3.5–5.0 mmol/L) levels are within normal limits. The glucose level (normal fasting range 70–110 mg/dL or < 6.1 mmol/L) would be considered elevated if the patient had not eaten within the past several hours.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid and Electrolytes","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"Which laboratory result causes the most concern for Ms. M (manic phase bipolar disorder), who is receiving lithium?","opts":["Serum chloride level of 100 mEq/L (100 mmol/L)","Serum sodium level of 125 mEq/L (125 mmol/L)","Serum potassium level of 5 mEq/L (5 mmol/L)","Serum glucose level of 140 mg/dL (7.8 mmol/L)"],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy21-25","topic":"fe","topicName":"F&E / ABG","source":"Case Study 21: Childbearing","srcShort":"Case Study 21","num":25,"ctx":[{"text":"Ms. N is a 20-year-old gravida 1, para 0 (G1P0) woman who begins her prenatal care today at 24 weeks’ gestation. She says that she didn’t know she was pregnant until now. Her pre-pregnancy body mass index was 23. She has gained 30 lb (13.6 kg) so far. She admits that she eats poorly and smokes a half-pack of cigarettes daily but uses no other substances. She lives with her boyfriend and has no immediate family in the area. She reports no significant medical, surgical, or family history. The RN is taking her history and drawing samples for laboratory work today on this first prenatal visit.","intro":true}],"why":"Tachycardia is an early sign of possible hypovolemia from hemorrhage. Hypotension, mental status changes, and decreased urine output are later signs. The relative hypervolemia in pregnancy allows the mother to tolerate normal blood loss at delivery with relatively little change in vital signs. The RN must be alert to early signs of hypovolemia and assess promptly for excessive blood loss.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"The RN receiving Ms. N on the postpartum unit is aware of her postpartum hemorrhage. Which would be the first clinical sign of hypovolemia related to postpartum hemorrhage?","opts":["Hypotension","Tachycardia","Mental status changes","Decreased urine output"],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy21-30","topic":"fe","topicName":"F&E / ABG","source":"Case Study 21: Childbearing","srcShort":"Case Study 21","num":30,"ctx":[{"text":"Ms. N is a 20-year-old gravida 1, para 0 (G1P0) woman who begins her prenatal care today at 24 weeks’ gestation. She says that she didn’t know she was pregnant until now. Her pre-pregnancy body mass index was 23. She has gained 30 lb (13.6 kg) so far. She admits that she eats poorly and smokes a half-pack of cigarettes daily but uses no other substances. She lives with her boyfriend and has no immediate family in the area. She reports no significant medical, surgical, or family history. The RN is taking her history and drawing samples for laboratory work today on this first prenatal visit.","intro":true},{"text":"Ms. N has now brought her breastfed newborn to the pediatric clinic for newborn follow-up with the nurse. He is 5 days old.","intro":false}],"why":"A newborn at 4 to 5 days of life should have at least six wet diapers per day. The mother’s report of only two should be explored. It could be that the mother is not noting small voids in very absorbent diapers, or it could be a sign of inadequate intake. Option 1 is a normal finding as the umbilical cord usually falls off at 7 to 14 days. Option 2 represents the normal stool of a breastfed infant. Option 3 is a finding of weight loss within the normal range for age. Birth weight should be regained by 7 to 14 days of life.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid and Electrolytes, Nutrition","Cognitive Level":"Evaluating"},"note":"","keyText":"4","stem":"Which finding will be most important for the pediatric nurse to report to the pediatric provider?","opts":["The baby’s umbilical cord stump is still attached.","The baby’s stools are unformed and yellow.","The baby has lost 5% of his birth weight.","The baby had two wet diapers yesterday."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter2-1","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":1,"ctx":[],"why":"Morphine is usually not prescribed for neuropathic pain because pain relief response is poor. Other medications, such as some antidepressants (e.g., imipramine) and some anticonvulsants (e.g., carbamazepine and gabapentin), provide better relief.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Pain","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"The patient who is receiving chemotherapy describes a burning sensation in the leg, which the health care provider diagnoses as neuropathic pain secondary to the therapy. The nurse is most likely to question the prescription of which drug?","opts":["Imipramine","Carbamazepine","Gabapentin","Morphine"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter2-2","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":2,"ctx":[],"why":"Analgesic drugs are the first-line treatment for cancer pain management. If pain is not controlled by medication, other options are available, including radiation, surgery, and nerve blocks.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Pain","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"A patient who has cancer will need ongoing treatment for pain. Which brochure is the nurse most likely to prepare that addresses questions related to the first-line treatment of cancer pain?","opts":["“An Illustrated Guide to the Analgesic Ladder”","“Common Questions About Radiation Therapy”","“How to Make Preparations for Your Cancer Surgery”","“How Nerve Blocks Can Help to Manage Cancer Pain”"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-3","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":3,"ctx":[],"why":"The nadir, usually 7 to 10 days after the start of therapy, is the point where blood cell counts are the lowest; therefore the LPN/LVN would be instructed to monitor the neutrophil count and watch for signs of infection. Low platelet count could also result in spontaneous bleeding, and low red cell count would contribute to anemia and fatigue. Nausea and vomiting, breakthrough pain, and anorexia are side effects of chemotherapy but are not necessarily linked to the nadir.","tip":"","meta":{"Focus":"Supervision","QSEN":"S","Concept":"Infection","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"1","stem":"A person who is receiving chemotherapy is approaching the nadir period. Which instruction will the team leader give to the LPN/LVN?","opts":["Monitor the neutrophil count; be vigilant for signs/symptoms of infection.","Expect nausea and vomiting; give antiemetics as prescribed.","Observe for breakthrough pain; report frequency of bolus doses of opioids.","Monitor for anorexia; initiate daily weights as needed."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-4","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":4,"ctx":[],"why":"Breakthrough pain is defined as being of rapid onset, short duration, and moderate to severe intensity; it is a temporary exacerbation related to poorly controlled around-the-clock dosing of background pain. Frequent breakthrough pain suggests that the around-the-clock dosing needs reevaluation, so the nurse would contact the HCP and advocate for a change of medication or dose or frequency.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Pain","IPEC":"IC"},"note":"","keyText":"2","stem":"After assessing the patient’s pain patterns, the nurse determines that frequent breakthrough cancer pain is occurring. Which member of the health care team is the nurse most likely to contact first?","opts":["Physical therapist to reevaluate physical therapy routines","Health care provider (HCP) to review medication, dosage, and frequency","Assistive personnel to increase help with activities of daily living","Psychiatric clinical nurse specialist to evaluate psychogenic pain"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-5","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":5,"ctx":[],"why":"The most important question is whether the HCP was notified and if any changes were made to address the patient’s pain. If the HCP was not called during the night (which is often the case), the nurse would also ask the other questions. The patient’s current pain, pattern of last night’s pain, data about the frequency of bolus doses, and data about other options that were tried need to be communicated to the HCP.","tip":"","meta":{"Focus":"Prioritization","QSEN":"TC","Concept":"Communication, Pain","IPEC":"IC"},"note":"","keyText":"3","stem":"During the handoff report, the oncoming day shift nurse hears that the cancer patient is on around-the-clock dosing of morphine but that end-of-dose pain might be occurring. Which question is the most important to ask the night shift nurse?","opts":["“How many times did you have to give a bolus dose of morphine?”","“Did the patient tell you that the pain was greater than a 5 out of 10?”","“Did you notify the health care provider (HCP) and were changes prescribed?”","“Did you try any nonpharmaceutical therapies or adjuvant medications?”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-6","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":6,"ctx":[],"why":"Oral hygiene is within the scope of duties of the AP. The nurse would give the AP specific instructions related to the esophageal cancer. It is the responsibility of the nurse to observe the response to treatments and evaluate the risk of aspiration. The AP can be directed to weigh the patient but would not be expected to know when to initiate the measurements.","tip":"","meta":{"Focus":"Delegation","QSEN":"TC","Concept":"Clinical Judgment","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"1","stem":"The nurse is caring for a patient with esophageal cancer. Which task could be delegated to assistive personnel (AP)?","opts":["Assisting with oral hygiene","Observing response to feedings","Evaluating risk for aspiration","Initiating weight measurements, as needed"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-7","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":7,"ctx":[],"why":"The patient needs to rest between activities because of fatigue caused by anemia. This can show up 3 to 4 months after radiation therapy. Epoetin is given to improve low hemoglobin and red cell factors. It is the nurse’s responsibility to determine resolution of nausea, energy loss, orthostatic hypotension, and mucositis, but giving information to the home health aide helps him or her to understand the relevance and parameters of care actions.","tip":"","meta":{"Focus":"Supervision, Delegation","QSEN":"TC","Concept":"Fatigue","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"2","stem":"A patient had radiation therapy 3 months ago and recently the health care provider prescribed epoetin. Which instruction will the home health nurse give to the home health aide related to this new therapy?","opts":["Encourage the patient to eat smaller amounts until nausea subsides.","Allow the patient to rest between care activities until energy improves.","Help the patient to stand up slowly until orthostatic hypotension resolves.","Frequently cleanse the mouth with clear water until mucositis abates."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-8","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":8,"ctx":[],"why":"Pancreatic cancer is more common in African-Americans, men, and smokers. Other associated factors include older age, alcohol use, diabetes, obesity, history of pancreatitis, exposure to organic chemicals, consumption of a high-fat diet, and previous abdominal irradiation.","tip":"","meta":{"Focus":"Prioritization","QSEN":"N/A","Concept":"Cellular Regulation","Cognitive Level":"Understanding"},"note":"","keyText":"1","stem":"Which patient is at greatest risk for pancreatic cancer?","opts":["An older African-American man who smokes","A young obese Asian woman with gallbladder disease","A young African-American man with type 1 diabetes","An elderly white woman who has pancreatitis"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-9","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":9,"ctx":[],"why":"Mouthwash should not include alcohol because it has a drying action that leaves the mucous membranes more vulnerable. Insertion of suppositories, probes, or tampons into the rectal or vaginal cavity is not recommended. All other options are appropriate.","tip":"","meta":{"Focus":"Delegation","QSEN":"S","Concept":"Clotting/Perfusion","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"2, 3, 5, 6","stem":"Patients receiving chemotherapy are at risk for thrombocytopenia related to the therapy or cancer disease process. Which actions for bleeding precautions can be delegated to assistive personnel? Select all that apply.","opts":["Provide mouthwash with alcohol for oral rinsing.","Use paper tape on fragile skin, if tape is needed.","Use a soft toothbrush or oral sponge.","Gently insert the rectal thermometer.","Handle gently to reduce bruising.","Avoid overinflation of blood pressure cuffs."],"nopts":6,"key":[2,3,5,6],"type":"multi"},{"id":"chapter2-10","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":10,"ctx":[],"why":"Administering enemas and antibiotics is within the scope of practice of LPNs/LVNs. Although some states and facilities may allow the LPN/LVN to administer blood, in general, administering blood, providing preoperative teaching, and assisting with central line insertion are the responsibilities of the RN.","tip":"","meta":{"Focus":"Assignment","QSEN":"TC","Concept":"Clinical Judgment","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"2","stem":"Which patient with a health problem related to gastrointestinal (GI) cancer would be the most appropriate to assign to an LPN/LVN under the supervision of a team leader RN?","opts":["A patient who needs a blood transfusion secondary to GI bleeding","A patient who needs enemas and antibiotics to control GI bacteria","A patient who needs preoperative teaching for bowel resection surgery","A patient who needs central line insertion for chemotherapy"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-11","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":11,"ctx":[],"why":"The LPN/LVN will know the standard seven warning signs and can educate through standard teaching programs. The health care provider performs the physical examinations and recommends diagnostic testing. The nutritionist can give information about diet. The RN has the primary responsibility for educating people about risk factors.","tip":"","meta":{"Focus":"Assignment","QSEN":"TC","Concept":"Clinical Judgment, Patient Education","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"3","stem":"A community health center is preparing a presentation on the prevention and detection of cancer. Which task would be best to assign to the LPN/LVN?","opts":["Explain screening examinations and diagnostic testing for common cancers.","Discuss how to plan a balanced diet and reduce fats and preservatives.","Prepare a poster on the seven warning signs of cancer.","Describe strategies for reducing risk factors such as smoking and obesity."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-12","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":12,"ctx":[],"why":"The nurse would assess what the patient means by having “control over my own life and death.” This could be an indirect statement of suicidal intent. A patient who believes he will be cured would also be assessed for misunderstanding the plan and outcomes; however, denial can also be used as a temporary defense mechanism. Acknowledgment that the treatments are for control of symptoms and plans for the immediate future suggest an understanding of treatment goals.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Mood and Affect","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"The patient with cancer needs an initial course of treatment with continued maintenance treatments and ongoing observation for signs and symptoms over a prolonged period of time. Which patient statement is cause for greatest concern?","opts":["“My symptoms will eventually be cured; I’m so happy that I don’t have to worry any longer.”","“My doctor is trying to help me control the symptoms; I am grateful for the extension of time with my family.”","“My pain will be relieved, but I am going to die soon; I would like to have control over my own life and death.”","“Initially, I may have to take some time off work for my treatments; I can probably work full time in the future.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-13","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":13,"ctx":[],"why":"The AP can observe the amount that the patient eats (or what is gone from the tray) and report to the nurse. Helping the patient to cope with fatigue and assessing skin reactions are the responsibilities of the RN. The initial recommendation for exercise would come from the health care provider.","tip":"","meta":{"Focus":"Delegation","QSEN":"TC","Concept":"Clinical Judgment, Care Coordination","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"3","stem":"For a patient who is experiencing side effects of radiation therapy, which task would be the most appropriate to delegate to assistive personnel (AP)?","opts":["Helping the patient to cope with fatigue and lack of energy","Encouraging participation in a walking program","Reporting the amount and type of food consumed from the tray","Checking the skin for redness and irritation after the treatment"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-14","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":14,"ctx":[],"why":"The American Geriatrics Society recommends that tricyclics should be avoided for older adults because of side effects, such as confusion or orthostatic hypotension. Lidocaine patches, gabapentinoids (e.g., gabapentin), and tricyclic antidepressants (e.g., imipramine) are first-line choices for postherpetic neuralgia, which can be a long-term sequela to herpes zoster. Capsaicin patches are considered a second-line option. A lidocaine patch would be a good choice for this patient because it can be applied to the local area with limited systemic effects.","tip":"Recall that age, malignancy, immunocompromised conditions (e.g., human immunodeficiency virus), and immunosuppressive medications increase the risk for herpes zoster.","meta":{"Focus":"Prioritization","QSEN":"PCC, EBP","Concept":"Pain"},"note":"","keyText":"4","stem":"An older patient needs treatment for severe localized pain related to postherpetic neuralgia secondary to chemotherapy. The nurse is most likely to question the prescription of which type of medication?","opts":["Lidocaine patch","Gabapentinoid","Capsaicin patch","Tricyclic antidepressant"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter2-15","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":15,"ctx":[],"why":"Paresthesia is a side effect associated with some chemotherapy drugs, such as vincristine. The HCP can modify the dosage or discontinue the drug. Fatigue, nausea, vomiting, and anorexia are common side effects of many chemotherapy medications. The nurse can assist the patient by planning for rest periods, giving antiemetics as prescribed, and encouraging small meals containing high-protein and high-calorie foods.","tip":"In caring for patients with cancer, many nursing interventions target the common side effects of chemotherapy, including fatigue, nausea, vomiting, and anorexia.","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Sensory Perception","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"For a patient receiving the chemotherapeutic drug vincristine, which side effect would be reported to the health care provider (HCP)?","opts":["Fatigue","Nausea","Paresthesia","Anorexia"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-16","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":16,"ctx":[],"why":"First, the supervising nurse assesses the newly hired nurse’s knowledge and beliefs about cancer pain and treatment. The nurse has experience, but that past experience may be related to caring for patients with acute pain, such as postoperative pain or acute exacerbations of disease. After assessing knowledge, the supervising nurse can then correct misconceptions or make suggestions for further study. Reassessing the patients together could be a learning opportunity. Writing an incident report and going to the nurse manager might occur if the new nurse is unable to adapt and correct the behavior.","tip":"Recall that the first step in the nursing process is always assessment. In this case, the newly hired nurse’s performance is the focus of the assessment.","meta":{"Focus":"Prioritization","QSEN":"TC","Concept":"Pain"},"note":"","keyText":"3","stem":"A newly hired nurse, who has 2 years of medical-surgical experience but limited experience caring for patients with cancer, seems to be consistently under-medicating the patients’ pain. What would the supervising nurse do first?","opts":["Reassess all of the patients and administer additional pain medication as needed.","Write an incident report and inform the nurse manager about the nurse’s performance.","Assess the new hire’s understanding and beliefs about cancer pain and treatments.","Ask the nurse about past experience in administering pain medications."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-17","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":17,"ctx":[],"why":"Chemotherapy can decrease WBCs, particularly neutrophils (known as neutropenia). This leaves the patient vulnerable to infection. Normal range for WBC is 5000 to 10,000/mm³ (5-10 × 10⁹ /L). The other tests are important in the total management but are less directly specific to chemotherapy. Normal range for K+ is 3.5 to 5.0 mEq/L (3.5 to 5.0 mmol/L). Low K+ could be associated with vomiting secondary to chemotherapy. Normal range for PAB is 15 to 36 mg/dL (150 to 360 mg/L); for BUN the range is 10 to 20 mg/dL (3.6 to 7.1 mmol/L); lower values for PAB or BUN could reflect malnutrition in a cancer patient.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Immunity","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"For a patient who is receiving chemotherapy, which laboratory result is of particular importance?","opts":["White blood cell count (WBC): 3000/mm³ (3 × 10⁹/L)","Serum potassium (K +): 3.4 mEq/L (3.4 mmol/L)","Prealbumin (PAB): 14 mg/dL (140 mg/L)","Blood urea nitrogen (BUN): 9 mg/dL (3.21 mmol/L)"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-18","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":18,"ctx":[],"why":"Giving medications is within the scope of practice of the LPN/LVN. Assisting the patient with oral hygiene would be delegated to assistive personnel; the nurse would give specific instructions related to the condition of the patient’s mouth. Explaining contraindications is the responsibility of the RN. Recommendations for saliva substitutes would come from the health care provider or pharmacist.","tip":"","meta":{"Focus":"Assignment","QSEN":"TC","Concept":"Clinical Judgment","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"3","stem":"For care of a patient who has oral cancer, which task would be appropriate to assign to an LPN/LVN?","opts":["Assisting the patient to perform oral hygiene","Explaining when brushing and flossing are contraindicated","Giving antacids and sucralfate suspension as prescribed","Recommending saliva substitutes"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-19","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":19,"ctx":[],"why":"Chemotherapy drugs would be given by nurses who have received additional training in how to safely prepare and deliver the drugs and protect themselves and others from potential toxic exposure. All nurses are trained to use the general principles of drug administration in dealing with vesicant medications, using central lines, and administering medications via intraveno
