"},{"id":"chapter19-8","topic":"onc","topicName":"Oncology","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":8,"ctx":[],"why":"LPN/LVN scope of practice includes the care of patients with chronic and stable health problems, such as the patient with chronic graft-versus-host disease. Chemotherapy medications are considered high-alert medications and should be given by RNs who have received additional education in chemotherapy administration. Platelets and other blood products should be given by RNs. The 6- year-old patient has a history and clinical manifestations consistent with neutropenia and sepsis and should be assessed by an RN as quickly as possible.","tip":"","meta":{"Focus":"Assignment","QSEN":"TC","Concept":"Clinical Judgment","Cognitive Level":"Analyzing","IPEC":"R/R"},"note":"","keyText":"3","stem":"The pediatric unit charge nurse is making patient assignments for the evening shift. Which patient is most appropriate to assign to an experienced LPN/LVN?","opts":["A 1-year-old patient with severe combined immunodeficiency disease who is scheduled to receive chemotherapy in preparation for a stem cell transplant","A 2-year-old patient with Wiskott-Aldrich syndrome who has orders for a platelet transfusion","A 3-year-old patient who has chronic graft-versus-host disease and is incontinent of loose stools","A 6-year-old patient who received chemotherapy 1 week ago and is admitted with increasing lethargy and a temperature of 101°F (38.3°C)"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter19-9","topic":"onc","topicName":"Oncology","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":9,"ctx":[],"why":"Protective isolation (wearing gloves, gowns, and mask) revealed no significant differences in infection rates for children who are neutropenic. General standard precautions are advised with routine patient care. Although private rooms are preferred for patients who need droplet precautions, such as patients with RSV infection, they can be placed in rooms with other patients with exactly the same microorganism. An N95 respirator is recommended for tuberculosis. Washing hands with soap and water after caring for a patient with C. difficile is also recommended.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Infection","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The pediatric unit charge nurse is working with a new RN. Which action by the new RN requires the most immediate action on the part of the pediatric unit charge nurse?","opts":["Wearing gloves, gowns, and a mask for a neutropenic child who is receiving chemotherapy","Placing a newly admitted child with respiratory syncytial virus (RSV) infection in a room with another child who has RSV","Wearing a N95 respirator mask when caring for a child with tuberculosis","Performing hand hygiene with soap and water after caring for a child with diarrhea caused by Clostridium difficile"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter19-13","topic":"onc","topicName":"Oncology","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":13,"ctx":[],"why":"The administration of varicella-zoster immune globulin can prevent the development of varicella in immunosuppressed patients and will typically be prescribed. Acyclovir therapy and hospitalization may be required if the child develops a varicella-zoster virus infection. Contact and airborne precautions will be implemented to prevent the spread of infection to other children if the child is hospitalized with varicella.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Immunity","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"While working in the pediatric clinic, the nurse receives a telephone call from the parent of a 13-year-old child who is receiving chemotherapy for leukemia. The patient’s sibling has chickenpox (varicella). Which action will the nurse anticipate taking next?","opts":["Administer varicella-zoster immune globulin to the patient.","Teach the parent about the correct use of acyclovir.","Educate the parent about contact and airborne precautions.","Prepare to admit the patient to a private room in the hospital."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter19-28","topic":"onc","topicName":"Oncology","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":28,"ctx":[],"why":"Methotrexate is a high-alert drug, and extra precautions, such as double-checking with another nurse, should be taken when administering this medication. Although many pediatric units have a policy requiring that all medication administration to children be double-checked, the other medications listed are not on the high-alert list published by the Institute for Safe Medication Practices.","tip":"For test-taking purposes and for safety in the clinical setting, it is worthwhile to memorize medications that are considered “high-alert” drugs.","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"A 4-year-old patient with acute lymphocytic leukemia has these medications prescribed. Which one is most important to double-check with another licensed nurse?","opts":["Prednisone 1 mg PO","Amoxicillin 250 mg PO","Methotrexate 10 mg PO","Filgrastim 5 mcg subcutaneously"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy6-14","topic":"onc","topicName":"Oncology","source":"Case Study 6: Home Health","srcShort":"Case Study 6","num":14,"ctx":[{"text":"The managing RN is assigning home visits to a registered nurse under her supervision for six patients:","intro":true}],"why":"Because Mr. I is in the nadir period after his chemotherapy, he is at high risk for infection. Avoidance of any cross-contamination from Mr. D’s leg infection is essential.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"The nurse still has visits to make to Mr. D and Mr. I before the mandatory in-service session. Which patient should be visited first?","opts":["Mr. D, who has diabetes and has an elevated glucose and fever","Mr. I, who has lung cancer and is receiving chemotherapy"],"nopts":2,"key":[2],"type":"single"},{"id":"casestudy6-16","topic":"onc","topicName":"Oncology","source":"Case Study 6: Home Health","srcShort":"Case Study 6","num":16,"ctx":[{"text":"The managing RN is assigning home visits to a registered nurse under her supervision for six patients:","intro":true}],"why":"Chemotherapy decreases the patient’s ability to mount a fever in response to infection, so even a minor increase in temperature (especially in combination with symptoms such as lethargy and confusion) can be an indicator of a serious infection, including sepsis. The decreased right-sided breath sounds are consistent with the patient’s diagnosis of lung cancer. The poor appetite and dry oral mucous membranes also require assessment and intervention, but infection is one of the most serious complications of chemotherapy.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"When the nurse arrives at Mr. I’s condominium, his wife says that Mr. I is very lethargic and a little confused today. Usually he is well oriented and cheerful despite his diagnosis of right-sided lung cancer. Which information noted during the assessment is the best indicator that rapid nursing action is needed?","opts":["Breath sounds are decreased on the right posterior chest.","Mr. I says that his appetite has not been very good recently.","Mr. I’s oral temperature is 101°F (38.3°C).","The oral mucosa is pale and dry."],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy6-17","topic":"onc","topicName":"Oncology","source":"Case Study 6: Home Health","srcShort":"Case Study 6","num":17,"ctx":[{"text":"The managing RN is assigning home visits to a registered nurse under her supervision for six patients:","intro":true}],"why":"Mr. I’s immunosuppression, fever, and possible sepsis diagnosis indicate that he should be assessed and treated immediately when he arrives in the ED. The other information will also be helpful but will not ensure that Mr. I is assessed and that treatment with antibiotics is initiated rapidly.","tip":"","meta":{"Focus":"Prioritization","Concept":"Infection","QSEN":"IC","IPEC":"T/T","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"The nurse calls the oncologist to discuss Mr. I’s condition and receives directions to have the patient transported to the hospital emergency department (ED) for evaluation. Which information is most important to communicate when calling a report to the ED?","opts":["Mr. I has lung cancer and decreased breath sounds.","Mr. I’s appetite and oral intake are decreased.","Mr. I needs a CBC today.","Mr. I is receiving chemotherapy and has a fever."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy10-27","topic":"onc","topicName":"Oncology","source":"Case Study 10: Multiple Patients With Pain","srcShort":"Case Study 10","num":27,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation and an assistive personnel (AP). The night shift nurse gives the following report on the six patients that are assigned: (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study.) • Ms. R, a 55-year-old woman with rheumatoid arthritis, underwent shoulder arthroplasty 3 days ago. She reports morning stiffness in her joints. Swelling is noted in both wrists and proximal interphalangeal joints. • Mr. L, a 35-year-old man with a history of kidney stones, reports intermittent severe back and right-sided flank pain (rating of 3 to 8 on a scale of 1 to 10). He has had episodic nausea and vomiting. He is urinating but has hematuria and dysuria. Mr. L was admitted through the emergency department (ED) at 10:00 pm. He is using a patient-controlled analgesia (PCA) pump. • Mr. O, an 18-year-old man, sustained a right tibia–fibula fracture in a motorcycle accident 7 hours ago. He has extensive skin abrasions underneath the cast and on the right anterolateral body. Although obvious chest and abdominal trauma were ruled out in the ED, he is being monitored for occult trauma. He is receiving an analgesic via PCA pump. The night shift nurse reports seeing the young man’s mother occasionally pushing the PCA pump button. • Mr. H, a 28-year-old man, is currently in the operating room (OR) for an inguinal hernia repair. He should return from the OR later in the shift. • Ms. J, a 65-year-old woman with end-stage multiple myeloma, is receiving hospice care. She has been on the unit for 2 weeks. Her health care provider (HCP) signed the do-not-resuscitate order 3 days ago. • Mr. A, a 55-year-old man, has been on the unit for 3 weeks. He is receiving IV antibiotics for bacterial pneumonia. He has a history of IV drug abuse and chronic back pain and has tested positive for human immunodeficiency virus (HIV) infection. Mr. A’s oxygen saturation was decreasing during the night shift.","intro":true}],"why":"A patient such as Ms. J has taken opiates for a long time. Constipation is the only opioid side effect to which the patient does not develop tolerance. Respiratory depression, nausea, vomiting, and sedation may have occurred when Ms. J was first receiving opioids but are now less of a concern.","tip":"","meta":{"Focus":"Prioritization","Concept":"Elimination","QSEN":"EBP","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"Ms. J (end-stage multiple myeloma) is receiving opiates to control her pain. Which side effect is the major concern for this patient?","opts":["Constipation","Respiratory depression","Nausea and vomiting","Sedation"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy10-28","topic":"onc","topicName":"Oncology","source":"Case Study 10: Multiple Patients With Pain","srcShort":"Case Study 10","num":28,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation and an assistive personnel (AP). The night shift nurse gives the following report on the six patients that are assigned: (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study.) • Ms. R, a 55-year-old woman with rheumatoid arthritis, underwent shoulder arthroplasty 3 days ago. She reports morning stiffness in her joints. Swelling is noted in both wrists and proximal interphalangeal joints. • Mr. L, a 35-year-old man with a history of kidney stones, reports intermittent severe back and right-sided flank pain (rating of 3 to 8 on a scale of 1 to 10). He has had episodic nausea and vomiting. He is urinating but has hematuria and dysuria. Mr. L was admitted through the emergency department (ED) at 10:00 pm. He is using a patient-controlled analgesia (PCA) pump. • Mr. O, an 18-year-old man, sustained a right tibia–fibula fracture in a motorcycle accident 7 hours ago. He has extensive skin abrasions underneath the cast and on the right anterolateral body. Although obvious chest and abdominal trauma were ruled out in the ED, he is being monitored for occult trauma. He is receiving an analgesic via PCA pump. The night shift nurse reports seeing the young man’s mother occasionally pushing the PCA pump button. • Mr. H, a 28-year-old man, is currently in the operating room (OR) for an inguinal hernia repair. He should return from the OR later in the shift. • Ms. J, a 65-year-old woman with end-stage multiple myeloma, is receiving hospice care. She has been on the unit for 2 weeks. Her health care provider (HCP) signed the do-not-resuscitate order 3 days ago. • Mr. A, a 55-year-old man, has been on the unit for 3 weeks. He is receiving IV antibiotics for bacterial pneumonia. He has a history of IV drug abuse and chronic back pain and has tested positive for human immunodeficiency virus (HIV) infection. Mr. A’s oxygen saturation was decreasing during the night shift.","intro":true}],"why":"Naltrexone is an opioid antagonist, which would cause opioid withdrawal and result in causing the patient significant pain. It is given if patients have significant respiratory depression caused by opioids.","tip":"","meta":{"Focus":"Prioritization","Concept":"Pain","QSEN":"S, PCC","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"After reviewing Ms. J’s (end-stage multiple myeloma) medication list, the nurse is most likely to question scheduled doses of which medication?","opts":["Naltrexone","Fentanyl","Morphine","Acetaminophen"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy10-29","topic":"onc","topicName":"Oncology","source":"Case Study 10: Multiple Patients With Pain","srcShort":"Case Study 10","num":29,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation and an assistive personnel (AP). The night shift nurse gives the following report on the six patients that are assigned: (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study.) • Ms. R, a 55-year-old woman with rheumatoid arthritis, underwent shoulder arthroplasty 3 days ago. She reports morning stiffness in her joints. Swelling is noted in both wrists and proximal interphalangeal joints. • Mr. L, a 35-year-old man with a history of kidney stones, reports intermittent severe back and right-sided flank pain (rating of 3 to 8 on a scale of 1 to 10). He has had episodic nausea and vomiting. He is urinating but has hematuria and dysuria. Mr. L was admitted through the emergency department (ED) at 10:00 pm. He is using a patient-controlled analgesia (PCA) pump. • Mr. O, an 18-year-old man, sustained a right tibia–fibula fracture in a motorcycle accident 7 hours ago. He has extensive skin abrasions underneath the cast and on the right anterolateral body. Although obvious chest and abdominal trauma were ruled out in the ED, he is being monitored for occult trauma. He is receiving an analgesic via PCA pump. The night shift nurse reports seeing the young man’s mother occasionally pushing the PCA pump button. • Mr. H, a 28-year-old man, is currently in the operating room (OR) for an inguinal hernia repair. He should return from the OR later in the shift. • Ms. J, a 65-year-old woman with end-stage multiple myeloma, is receiving hospice care. She has been on the unit for 2 weeks. Her health care provider (HCP) signed the do-not-resuscitate order 3 days ago. • Mr. A, a 55-year-old man, has been on the unit for 3 weeks. He is receiving IV antibiotics for bacterial pneumonia. He has a history of IV drug abuse and chronic back pain and has tested positive for human immunodeficiency virus (HIV) infection. Mr. A’s oxygen saturation was decreasing during the night shift.","intro":true}],"why":"Lorazepam is an anxiolytic. Naproxen is a nonsteroidal anti-inflammatory drug. Doxepin is used for depression or neuropathic pain. Dicyclomine is given to reduce smooth muscle spasms.","tip":"","meta":{"Focus":"Prioritization","Concept":"Anxiety","QSEN":"EBP","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"Ms. J (end-stage multiple myeloma) is having severe pain and admits to it; however, she becomes very anxious when certain family members come and go and refuses to take the pain medication. Which adjunct medication would be most useful to Ms. J to help her manage these episodes?","opts":["Naproxen","Doxepin","Lorazepam","Dicyclomine"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy10-30","topic":"onc","topicName":"Oncology","source":"Case Study 10: Multiple Patients With Pain","srcShort":"Case Study 10","num":30,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation and an assistive personnel (AP). The night shift nurse gives the following report on the six patients that are assigned: (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study.) • Ms. R, a 55-year-old woman with rheumatoid arthritis, underwent shoulder arthroplasty 3 days ago. She reports morning stiffness in her joints. Swelling is noted in both wrists and proximal interphalangeal joints. • Mr. L, a 35-year-old man with a history of kidney stones, reports intermittent severe back and right-sided flank pain (rating of 3 to 8 on a scale of 1 to 10). He has had episodic nausea and vomiting. He is urinating but has hematuria and dysuria. Mr. L was admitted through the emergency department (ED) at 10:00 pm. He is using a patient-controlled analgesia (PCA) pump. • Mr. O, an 18-year-old man, sustained a right tibia–fibula fracture in a motorcycle accident 7 hours ago. He has extensive skin abrasions underneath the cast and on the right anterolateral body. Although obvious chest and abdominal trauma were ruled out in the ED, he is being monitored for occult trauma. He is receiving an analgesic via PCA pump. The night shift nurse reports seeing the young man’s mother occasionally pushing the PCA pump button. • Mr. H, a 28-year-old man, is currently in the operating room (OR) for an inguinal hernia repair. He should return from the OR later in the shift. • Ms. J, a 65-year-old woman with end-stage multiple myeloma, is receiving hospice care. She has been on the unit for 2 weeks. Her health care provider (HCP) signed the do-not-resuscitate order 3 days ago. • Mr. A, a 55-year-old man, has been on the unit for 3 weeks. He is receiving IV antibiotics for bacterial pneumonia. He has a history of IV drug abuse and chronic back pain and has tested positive for human immunodeficiency virus (HIV) infection. Mr. A’s oxygen saturation was decreasing during the night shift.","intro":true}],"why":"The patient needs immediate intervention for relief of dyspnea. Oxygen and elevating the head of the bed are quick actions that the nurse should take immediately. If the patient is hypotensive, there is a possibility of fainting; however, dyspnea usually increases blood pressure because the patient will panic, fight for air, and struggle to sit upright. PRN oral morphine is typically prescribed for hospice patients and those who need end-of-life care.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"S","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"Ms. J’s (end-stage multiple myeloma) son tells the nurse, “My mom is having trouble breathing, and she is having a lot of pain!” On assessment, Ms. J demonstrates rapid shallow breathing and reports pain over the right lateral ribs that increases with movement and breathing. Which action is the priority?","opts":["Take vital signs with pulse oximeter reading and inform the HCP.","Apply oxygen and raise the head of the bed if patient is not hypotensive.","Obtain an order to start an IV and to give a bolus dose of morphine.","Be calm, stay with the patient, and encourage pursed-lip breathing."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter15-8","topic":"burn","topicName":"Burns","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":8,"ctx":[],"why":"Facial burns are frequently associated with airway inflammation and swelling, so this patient requires the most immediate assessment. The other patients also require rapid assessment or interventions, but their situations are not as urgent as that of the patient with facial burns.","tip":"","meta":{"Focus":"Prioritization","Concept":"Skin Integrity","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"The nurse has just received a change-of-shift report for the burn unit. Which patient should be assessed first?","opts":["Patient with deep partial-thickness burns on both legs who reports severe and continuous leg pain","Patient who has just arrived from the emergency department with facial burns sustained in a house fire","Patient who has just been transferred from the postanesthesia care unit after having skin grafts applied to the anterior chest","Patient admitted 3 weeks ago with full-thickness leg and buttock burns who has been waiting for 3 hours to receive discharge teaching"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter15-9","topic":"burn","topicName":"Burns","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":9,"ctx":[],"why":"Pain medication should be administered before changing the dressing because changing dressings for partial-thickness burns is painful, especially if the dressing change involves removal of eschar. The wound should be debrided before obtaining wound specimens for culture to avoid including bacteria that are skin contaminants rather than causes of the wound infection. Culture specimens should be obtained before the application of antibacterial creams. The antibacterial cream should then be applied to the area after debridement to gain the maximum effect. Finally, the wound should be covered with a sterile dressing.","tip":"","meta":{"Focus":"Prioritization","Concept":"Infection","QSEN":"EBP","Cognitive Level":"Application"},"note":"","keyText":"3, 4, 2, 1, 5","stem":"The nurse is performing a sterile dressing change for a patient with infected deep partial-thickness burns of the chest and abdomen. List the steps in the order in which each should be accomplished.","opts":["Apply silver sulfadiazine ointment.","Obtain specimens for aerobic and anaerobic wound cultures.","Administer morphine sulfate 10 mg IV.","Debride the wound of eschar using gauze sponges.","Cover the wound with a sterile gauze dressing."],"nopts":5,"key":[3,4,2,1,5],"type":"order"},{"id":"chapter15-10","topic":"burn","topicName":"Burns","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":10,"ctx":[],"why":"A nurse from the oncology unit would be familiar with dressing changes and the sterile technique. The charge RN in the burn unit would work closely with the float RN to assist in providing care and to answer any questions. Admission assessment and development of the initial care plan, discharge teaching, and splint positioning in burn patients all require expertise in caring for patients with burns. These patients should be assigned to RNs who regularly work on the burn unit.","tip":"","meta":{"Focus":"Assignment","Concept":"Care Coordination","QSEN":"T/C","IPEC":"T/T","Cognitive Level":"Evaluating"},"note":"","keyText":"3","stem":"Which patient is best for the nurse manager on the burn unit to assign to an RN who has floated from the oncology unit?","opts":["A 23-year-old patient who has just been admitted with burns over 30% of the body after a warehouse fire","A 36-year-old patient who requires discharge teaching about nutrition and wound care after having skin grafts","A 45-year-old patient with infected partial-thickness back and chest burns who has a dressing change scheduled","A 57-year-old patient with full-thickness burns on both arms who needs assistance in positioning hand splints"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter15-22","topic":"burn","topicName":"Burns","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":22,"ctx":[],"why":"With chemical injuries, it is important to remove the chemical from contact with the skin to prevent ongoing damage. The other actions also should be accomplished rapidly; however, rinsing the chemical off is the priority for this patient.","tip":"","meta":{"Focus":"Prioritization","Concept":"Safety","QSEN":"EBP","Cognitive Level":"Application"},"note":"","keyText":"2","stem":"A patient who has extensive blister injuries to the back and both legs caused by exposure to toxic chemicals at work is transferred to the emergency department. Which prescribed intervention will the nurse implement first?","opts":["Infuse lactated Ringer’s solution at 250 mL/hr.","Rinse the back and legs with 4 L of sterile normal saline.","Obtain blood for a complete blood count and electrolyte levels.","Document the percentage of total body surface area burned."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter15-23","topic":"burn","topicName":"Burns","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":23,"ctx":[],"why":"This patient’s vital signs indicate that the life-threatening complications of sepsis and septic shock may be developing. The other patients also need rapid assessment or nursing interventions, but their symptoms do not indicate that they need care as urgently as the febrile and hypotensive patient.","tip":"Remember that when skin integrity is affected due to large burn injuries, patients are at high risk for complications such as sepsis and hypovolemia. You should monitor for changes in vital signs that might indicate these complications are occurring.","meta":{"Focus":"Prioritization","Concept":"Care Coordination","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"The nurse has just received the change-of-shift report in the burn unit. Which patient requires the most immediate assessment or intervention?","opts":["A 22-year-old patient admitted 4 days previously with facial burns due to a house fire who has been crying since recent visitors left","A 34-year-old patient who returned from skin-graft surgery 3 hours ago and is reporting level 8 pain (on a scale of 0 to 10)","A 45-year-old patient with partial-thickness leg burns who has a temperature of 102.6°F (39.2°C) and a blood pressure of 98/46 mm Hg","A 57-year-old patient who was admitted with electrical burns 24 hours ago and has a blood potassium level of 5.1 mEq/L (5.1 mmol/L)"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter15-33","topic":"burn","topicName":"Burns","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":33,"ctx":[],"why":"After a major burn blood pressure initially increases due to vasoconstriction; however, within 12 hours, the BP will decrease due to capillary leak syndrome (third spacing), caused by dilation of the blood vessels that are near the burns. Morphine, insufficient fluid and septicemia can also lower blood pressure but are not unique to the physiology of major burns. Metabolic acidosis occurs as fluid, protein and electrolytes leak out of the vascular space. This action leads to decreased tissue perfusion which releases acids. Hyperkalemia worsens the acidosis as potassium from inside the destroyed cells is lost. In order to treat the metabolic acidosis intravenous fluids are given according to burn protocols in order to maintain urine output at 0.5mg/kg. Fluid resuscitation is necessary to maintain tissue perfusion in order to lessen the acidosis. Adequate renal function is necessary to excrete excess acid. Usually, sodium bicarbonate is administered only if the pH is less than 7.0 and is controversial. Fluids are first line therapy. Clostridium tetani is the bacteria that causes tetanus. The correct treatment for tetanus is tetanus toxoid. Vancomycin and Piperacillin-tazobactam are broad spectrum antibiotics that may be given to cover for septicemia, but they do not treat tetanus and Amphotericin B is an anti-fungal. Compression garments must be worn for 1-2 years for the full benefit to be realized.","tip":"","meta":{"Focus":"Priority","Concept":"Perfusion","QSEN":"EBP","Cognitive skill":"Take Action"},"note":"","keyText":"Option 1, Capillary leak syndrome; Option 2, Decreased tissue perfusion; Option 3, Intravenousfluids; Option 4, Tetanus Toxoid; Option 5, 1-2 years","img":[{"src":"img/c0020.webp","w":1100,"h":471}],"type":"reveal"},{"id":"chapter19-39","topic":"burn","topicName":"Burns","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":39,"ctx":[],"why":"Oral sedation agents such as the benzodiazepines are considered high-alert medications when ordered for children, and extra precautions should be taken before administration. Many facilities require that all medications administered to pediatric patients be double-checked before administration, but the lorazepam is the most important to double-check with another nurse.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S, EBP","Concept":"Clinical Judgment","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"These medications have been prescribed for a 9-year-old patient with deep partial-and full-thickness burns. Which medication is most important to double-check with another licensed nurse before administration?","opts":["Silver sulfadiazine ointment","Famotidine 20 mg IV","Lorazepam 0.5 mg PO","Multivitamin 1 tablet PO"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter21-42","topic":"burn","topicName":"Burns","source":"Chapter 21: Emergencies and Disasters","srcShort":"Chapter 21","num":42,"ctx":[],"why":"In disaster triage, the goal is to provide the greatest good for the greatest number with limited resources. Ethical considerations include prognosis, years of life saved, and age of patient. Treat the 12-year-old child with asthma first by initiating an albuterol treatment. This action is quick to initiate, and the child or parent can be instructed to hold the apparatus while the nurse attends to other patients. The firefighter is next. The firefighter is in greater respiratory distress than the 12-year-old child; however, managing a strong combative patient is difficult and time consuming (e.g., the 12-year-old could die if too much time is spent trying to control the firefighter). Next, attend to the adolescent with a crush injury. Anxiety and tachycardia may be caused by pain or stress; however, the swelling suggests hemorrhage. The woman with burns on the forearms needs cleaning, dressings, and pain management. The child with burns over more than 70% of the anterior body should be given pain relief, comfort measures, and emotional support; however, the prognosis is very poor. The prognosis for the patient in cardiac arrest is also very poor because CPR efforts have been prolonged. This patient is likely to be unresponsive.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Analyzing","Cognitive Skill":"Analyze Cues"},"note":"The book labels the patients A, B, C, D, E, and G in the question but uses F in the answer key. \"1F\" refers to the 12-year-old with asthma (labeled G in the question).","keyText":"1F, 2B, 3D, 4C, 5E, 6A","img":[{"src":"img/c0021.webp","w":1100,"h":781}],"type":"reveal"}]</script>
<script>
(function () {
  const Q = JSON.parse(document.getElementById('qdata').textContent);
  const BYID = Object.fromEntries(Q.map(q => [q.id, q]));
  const TOPICS = [
    { id: 'fe', name: 'F&E and ABGs', sub: 'Fluids, electrolytes, acid-base' },
    { id: 'onc', name: 'Oncology', sub: 'Cancer, chemo, neutropenia' },
    { id: 'burn', name: 'Burns', sub: 'Burn unit, triage, fluids' },
  ];
  const TOPIC_NAME = { fe: 'F&E / ABG', onc: 'Oncology', burn: 'Burns' };
  const LS = 'nur206-exam1-v1';
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} },
  };
  let saved = store.get();

  saved.hist = saved.hist || {}; // id -> {r:0|1, n:attempts}
  saved.setup = saved.setup || {};

  const S = {
    screen: 'setup',
    setup: Object.assign({ topics: ['fe', 'onc', 'burn'], count: '25', order: 'shuffle', pool: 'all' }, saved.setup, { mode: 'tutor' }),
    list: [], idx: 0, ans: {}, flags: {}, showPal: false, finished: false,
  };
  const app = document.getElementById('app');
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
  const sameSeq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

  function grade(q, sel) {
    if (q.type === 'single') return sel.length === 1 && sel[0] === q.key[0];
    if (q.type === 'multi') return sameSet(sel, q.key);
    if (q.type === 'order') return sameSeq(sel, q.key);
    return null;
  }
  function saveSetup() { saved.setup = S.setup; store.set(saved); }
  function record(q, correct) {
    const e = saved.hist[q.id] || { r: 0, n: 0 };
    e.r = correct ? 1 : 0; e.n += 1; saved.hist[q.id] = e; store.set(saved);
  }
  function poolFor(setup) {
    let p = Q.filter(q => setup.topics.includes(q.topic));
    if (setup.pool === 'missed') p = p.filter(q => saved.hist[q.id] && saved.hist[q.id].r === 0);
    if (setup.pool === 'new') p = p.filter(q => !saved.hist[q.id]);
    return p;
  }
  // keep case-study questions in book order when shuffled so context reads forward
  function buildList(setup) {
    const p = poolFor(setup);
    let ids = p.map(q => q.id);
    if (setup.order === 'shuffle') ids = shuffle(ids);
    const n = setup.count === 'all' ? ids.length : Math.min(ids.length, +setup.count);
    ids = ids.slice(0, n);
    if (setup.order === 'book') ids.sort((a, b) => Q.indexOf(BYID[a]) - Q.indexOf(BYID[b]));
    return ids;
  }

  // ---------------- setup screen ----------------
  function renderSetup() {
    const st = S.setup;
    const seen = Object.keys(saved.hist).length;
    const right = Object.values(saved.hist).filter(e => e.r === 1).length;
    const missed = seen - right;
    const avail = poolFor(st).length;
    const n = st.count === 'all' ? avail : Math.min(avail, +st.count);

    const seg = (name, opts) => h('div', { class: 'seg', role: 'radiogroup' }, opts.map(([v, lab]) =>
      h('label', null, h('input', { type: 'radio', name, id: `${name}-${v}`, value: v, checked: st[name] === v, onchange: () => { st[name] = v; saveSetup(); render(); } }), h('span', { text: lab }))));

    const topicCards = TOPICS.map(t => {
      const c = Q.filter(q => q.topic === t.id).length;
      return h('label', { class: 'tcard' },
        h('input', { type: 'checkbox', id: `topic-${t.id}`, checked: st.topics.includes(t.id), onchange: e => {
          st.topics = e.target.checked ? [...new Set([...st.topics, t.id])] : st.topics.filter(x => x !== t.id);
          saveSetup(); render();
        } }),
        h('span', { class: 'n', text: String(c) }), h('span', { class: 'nm', text: t.name }), h('span', { class: 'sub', text: t.sub }));
    });

    const start = h('button', { class: 'btn primary', id: 'start', disabled: n === 0, onclick: () => startExam(buildList(st)) },
      n === 0 ? 'No questions match' : `Start ${n} question${n === 1 ? '' : 's'}`);

    app.replaceChildren(h('div', { class: 'wrap' },
      h('header', { class: 'hero' },
        h('div', { class: 'eyebrow', text: 'NUR206 · Exam 1 · LaCharity 5th ed.' }),
        h('h1', { text: 'Prioritization flashcards' }),
        h('p', { text: '272 questions from the Prioritization, Delegation, and Assignment workbook on burns, oncology, fluid and electrolytes, and ABGs. Each answer comes with the book’s rationale.' })),
      h('section', { class: 'sheet setup' },
        h('fieldset', null, h('legend', { text: 'Topics' }), h('div', { class: 'topics' }, topicCards)),
        h('fieldset', null, h('legend', { text: 'Questions' }),
          h('div', { class: 'row' }, seg('count', [['10', '10'], ['25', '25'], ['50', '50'], ['all', 'All']]), seg('pool', [['all', 'Any'], ['new', 'Not tried yet'], ['missed', 'Missed last time']]))),
        h('fieldset', null, h('legend', { text: 'Order' }),
          h('div', { class: 'row' }, seg('order', [['shuffle', 'Shuffled'], ['book', 'Book order']]))),
        h('p', { class: 'hint', text: 'Answer a card and it flips right away to show the correct answer and the book’s rationale.' }),
        h('div', { class: 'startbar' },
          h('div', { class: 'history' },
            h('span', null, h('b', { text: String(seen) }), ' of 272 tried'),
            h('span', null, h('b', { text: String(right) }), ' right last time'),
            h('span', null, h('b', { text: String(missed) }), ' to review'),
            seen ? h('button', { class: 'btn ghost', id: 'reset-hist', style: 'padding:4px 10px;font-size:13px', onclick: () => { if (S.confirmReset) { saved.hist = {}; store.set(saved); S.confirmReset = false; } else { S.confirmReset = true; } render(); } }, S.confirmReset ? 'Tap again to clear history' : 'Clear history') : null),
          start))));
  }

  function startExam(ids) {
    S.list = ids; S.idx = 0; S.ans = {}; S.flags = {}; S.finished = false; S.showPal = false; S.screen = 'quiz';
    render(); window.scrollTo(0, 0);
  }

  // ---------------- question screen ----------------
  function curQ() { return BYID[S.list[S.idx]]; }
  function A(q) { return S.ans[q.id] || (S.ans[q.id] = { sel: [], done: false, correct: null }); }
  const showFeedback = a => a.done && (S.setup.mode === 'tutor' || S.finished);

  function toggle(q, v) {
    const a = A(q); if (a.done && (S.setup.mode === 'tutor' || S.finished)) return;
    if (q.type === 'single') a.sel = [v];
    else if (q.type === 'multi') a.sel = a.sel.includes(v) ? a.sel.filter(x => x !== v) : [...a.sel, v].sort((x, y) => x - y);
    else if (q.type === 'order') a.sel = a.sel.includes(v) ? a.sel.filter(x => x !== v) : [...a.sel, v];
    // flashcard behavior: single answers and completed orderings flip the card right away
    if (q.type === 'single' || (q.type === 'order' && a.sel.length === q.nopts)) { S.justAnswered = true; submit(q); return; }
    render();
  }
  function submit(q) {
    const a = A(q);
    if (!a.sel.length) return;
    if (q.type === 'order' && a.sel.length !== q.nopts) return;
    a.done = true; a.correct = grade(q, a.sel); record(q, a.correct); render();
  }
  function selfGrade(q, ok) { const a = A(q); a.done = true; a.correct = ok; a.self = true; a.revealed = true; record(q, ok); render(); }
  function go(i) { if (i < 0 || i >= S.list.length) return; S.idx = i; render(); window.scrollTo(0, 0); }
  function finish() {
    S.finished = true;
    if (S.setup.mode === 'exam') for (const id of S.list) { const q = BYID[id], a = S.ans[id]; if (a && a.done && a.correct != null) record(q, a.correct); }
    S.screen = 'results'; render(); window.scrollTo(0, 0);
  }

  const INSTR = { single: 'Tap an answer to flip the card', multi: 'Select all that apply, then flip the card', order: 'Tap the options in order, first to last. The card flips after the last one', reveal: 'Work it out, then flip the card' };

  function figs(list) { return h('div', { class: 'figs' }, list.map(im => h('img', { src: im.src, width: im.w, height: im.h, loading: 'lazy', alt: 'Question material from the workbook' }))); }

  function renderQuiz() {
    const q = curQ(), a = A(q), fbOn = showFeedback(a) || (q.type === 'reveal' && a.revealed);
    const answered = S.list.filter(id => S.ans[id] && S.ans[id].done).length;
    const correct = S.list.filter(id => S.ans[id] && S.ans[id].correct === true).length;
    const graded = S.list.filter(id => S.ans[id] && S.ans[id].done && S.ans[id].correct != null).length;

    const top = h('div', { class: 'topbar' }, h('div', { class: 'inner' },
      h('div', { class: 'tb-row' },
        h('span', { class: 'qcount', text: `Card ${S.idx + 1} of ${S.list.length}` }),
        (S.setup.mode === 'tutor' || S.finished) && graded ? h('span', { class: 'score-live', text: `${correct}/${graded} correct` }) : h('span', { class: 'score-live', text: `${answered} answered` }),
        h('div', { class: 'tb-actions' },
          h('button', { class: 'icon-btn', id: 'flag', 'aria-pressed': S.flags[q.id] ? 'true' : 'false', onclick: () => { S.flags[q.id] = !S.flags[q.id]; render(); } }, S.flags[q.id] ? 'Flagged' : 'Flag'),
          h('button', { class: 'icon-btn', id: 'pal', 'aria-expanded': S.showPal ? 'true' : 'false', onclick: () => { S.showPal = !S.showPal; render(); } }, 'All questions'),
          h('button', { class: 'icon-btn', id: 'end', onclick: () => S.finished ? (S.screen = 'results', render()) : finish() }, S.finished ? 'Results' : 'Finish'))),
      h('div', { class: 'progress', 'aria-hidden': 'true' }, h('i', { style: `width:${(answered / S.list.length) * 100}%` }))));

    const pal = S.showPal ? h('nav', { class: 'palette', 'aria-label': 'Jump to question' }, S.list.map((id, i) => {
      const x = S.ans[id]; let c = '';
      if (x && x.done) c = (S.setup.mode === 'tutor' || S.finished) && x.correct != null ? (x.correct ? 'ok' : 'bad') : 'ans';
      return h('button', { class: [c, i === S.idx ? 'cur' : '', S.flags[id] ? 'fl' : ''].join(' '), onclick: () => { S.showPal = false; go(i); }, 'aria-label': `Card ${i + 1}` }, String(i + 1));
    })) : null;

    const meta = h('div', { class: 'qmeta' },
      h('span', { class: 'chip topic', text: TOPIC_NAME[q.topic] }),
      h('span', { class: 'src', text: `${q.source} · Q${q.num}` }));

    let ctx = null;
    if (q.ctx && q.ctx.length) {
      ctx = h('details', { class: 'ctx', open: true }, h('summary', { text: 'Case study scenario and data' }),
        h('div', { class: 'ctx-body' }, q.ctx.map((c, i) => [
          i > 0 ? h('div', { class: 'upd', text: 'Update' }) : null,
          c.img ? figs(c.img) : c.text.split(/\s+•\s+/).map(s => h('p', { text: s }))])));
    }

    const body = [];
    if (q.img) body.push(figs(q.img));
    if (q.stem) body.push(h('p', { class: 'stem', text: q.stem }));
    body.push(h('p', { class: 'instr', text: INSTR[q.type] }));

    const keyset = q.key || [];
    if (q.type !== 'reveal' && q.opts) {
      body.push(h('div', { class: 'opts', role: q.type === 'single' ? 'radiogroup' : 'group' }, q.opts.map((o, i) => {
        const v = i + 1, picked = a.sel.includes(v);
        let cls = '', res = null;
        if (fbOn) {
          if (q.type === 'order') { if (picked) { const ok = a.sel.indexOf(v) === keyset.indexOf(v); cls = ok ? 'right' : 'wrong'; res = ok ? 'Right spot' : `Should be #${keyset.indexOf(v) + 1}`; } }
          else if (keyset.includes(v)) { cls = 'right'; res = picked ? 'Correct' : 'Missed'; }
          else if (picked) { cls = 'wrong'; res = 'Incorrect'; }
        }
        const mk = q.type === 'order' ? (picked ? String(a.sel.indexOf(v) + 1) : '') : (q.type === 'multi' ? (picked ? '✓' : '') : String(v));
        const role = q.type === 'single' ? 'radio' : (q.type === 'multi' ? 'checkbox' : null);
        return h('button', { class: 'opt ' + cls, id: `opt-${v}`, 'data-kind': q.type, role, 'aria-checked': role ? String(picked) : null, 'aria-pressed': role ? null : String(picked), disabled: fbOn, onclick: () => toggle(q, v) },
          h('span', { class: 'mk', text: mk }), h('span', { text: q.type === 'single' ? o : `${v}. ${o}` }), res ? h('span', { class: 'res', text: res }) : h('span'));
      })));
    } else if (q.type !== 'reveal') {
      body.push(h('div', { class: 'chips', role: 'group', 'aria-label': 'Answer choices by number' }, Array.from({ length: q.nopts }, (_, i) => {
        const v = i + 1, picked = a.sel.includes(v);
        let cls = '';
        if (fbOn) cls = keyset.includes(v) ? (picked ? 'right' : 'missed') : (picked ? 'wrong' : '');
        return h('button', { class: 'nchip ' + cls, id: `chip-${v}`, 'aria-pressed': String(picked), disabled: fbOn, onclick: () => toggle(q, v) }, String(v));
      })));
    }

    // action row
    const nav = h('div', { class: 'l' },
      h('button', { class: 'btn', id: 'prev', disabled: S.idx === 0, onclick: () => go(S.idx - 1) }, '← Back'));
    const right = h('div', { class: 'r' });
    const last = S.idx === S.list.length - 1;
    const nextBtn = h('button', { class: 'btn primary', id: 'next', onclick: () => last ? (S.finished ? (S.screen = 'results', render()) : finish()) : go(S.idx + 1) }, last ? (S.finished ? 'See results' : 'Finish exam') : 'Next →');
    if (q.type === 'reveal') {
      if (!a.revealed && !(S.finished && a.done)) right.append(h('button', { class: 'btn primary', id: 'reveal', onclick: () => { a.revealed = true; S.justAnswered = true; render(); } }, 'Flip card'));
      else right.append(nextBtn);
    } else if (S.setup.mode === 'tutor' && !a.done) {
      const ready = a.sel.length && (q.type !== 'order' || a.sel.length === q.nopts);
      if (q.type === 'order' && a.sel.length) right.append(h('button', { class: 'btn', id: 'clear', onclick: () => { a.sel = []; render(); } }, 'Start over'));
      right.append(h('button', { class: 'btn', id: 'skip', onclick: () => last ? finish() : go(S.idx + 1) }, 'Skip'));
      if (q.type === 'multi') right.append(h('button', { class: 'btn primary', id: 'submit', disabled: !ready, onclick: () => { S.justAnswered = true; submit(q); } }, 'Flip card'));
    } else {
      if (q.type === 'order' && a.sel.length && !fbOn) right.append(h('button', { class: 'btn', id: 'clear', onclick: () => { a.sel = []; a.done = false; render(); } }, 'Start over'));
      right.append(nextBtn);
    }

    let fb = null;
    if (fbOn) {
      const st = q.type === 'reveal' ? (a.done ? (a.correct ? 'ok' : 'bad') : 'neutral') : (a.correct ? 'ok' : 'bad');
      const head = q.type === 'reveal' ? (a.done ? (a.correct ? 'You marked this right' : 'You marked this missed') : 'Answer') : (a.correct ? 'Correct' : (a.sel.length ? 'Incorrect' : 'Not answered'));
      const extra = [];
      if (q.type === 'multi' && !a.correct && a.sel.length) {
        const hit = a.sel.filter(x => keyset.includes(x)).length, wrongPicks = a.sel.length - hit;
        extra.push(h('p', { class: 'kbd', text: `${hit} of ${keyset.length} correct choices picked${wrongPicks ? `, ${wrongPicks} incorrect` : ''}. Select-all items are scored all-or-nothing here.` }));
      }
      if (q.type === 'order' && q.opts) extra.push(h('div', null, h('p', { style: 'font-weight:600;margin:0 0 4px', text: 'Correct order' }), h('ol', { class: 'order-list' }, keyset.map(k => h('li', { text: q.opts[k - 1] })))));
      const tags = ['Focus', 'Concept', 'Cognitive Level'].filter(k => q.meta && q.meta[k]).map(k => h('span', { class: 'chip', text: `${k}: ${q.meta[k]}` }));
      fb = h('section', { class: `fb ${st}`, 'aria-live': 'polite' },
        h('div', { class: 'fb-head' }, h('span', { text: head }), q.keyText ? h('span', { class: 'key', text: `Answer: ${q.keyText}` }) : null),
        h('div', { class: 'fb-body' }, extra,
          q.why ? h('p', { text: q.why }) : null,
          q.tip ? h('p', { class: 'tip' }, h('b', { text: 'Test-taking tip: ' }), q.tip) : null,
          q.note ? h('p', { class: 'note' }, h('b', { text: 'Note: ' }), q.note) : null,
          q.type === 'reveal' && !a.done ? h('div', { class: 'selfgrade' }, h('span', { text: 'How did you do?' }),
            h('button', { class: 'btn', id: 'self-ok', onclick: () => selfGrade(q, true) }, 'I got it right'),
            h('button', { class: 'btn', id: 'self-bad', onclick: () => selfGrade(q, false) }, 'I missed it')) : null,
          tags.length ? h('div', { class: 'tags' }, tags) : null));
    }

    app.replaceChildren(top, h('div', { class: 'wrap', style: 'padding-top:0' }, pal,
      h('article', { class: 'sheet' }, meta, ctx, body, h('div', { class: 'actions' }, nav, right), fb),
      h('p', { class: 'kbd keys', style: 'margin-top:12px', text: 'Keys: 1–9 choose · Enter flip or next · ← → move' })));
    if (S.justAnswered && fb) {
      S.justAnswered = false; fb.classList.add('flip');
      requestAnimationFrame(() => { try { fb.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); } catch (e) {} });
    }
    S.justAnswered = false;
  }

  // ---------------- results ----------------
  function renderResults() {
    const rows = S.list.map((id, i) => ({ i, q: BYID[id], a: S.ans[id] }));
    const graded = rows.filter(r => r.a && r.a.done && r.a.correct != null);
    const right = graded.filter(r => r.a.correct).length;
    const pct = graded.length ? Math.round((right / graded.length) * 100) : 0;
    const skipped = rows.length - graded.length;
    const byTopic = ['fe', 'onc', 'burn'].map(t => {
      const g = graded.filter(r => r.q.topic === t); return { t, n: g.length, r: g.filter(r => r.a.correct).length };
    }).filter(x => x.n);
    const missedIds = rows.filter(r => !(r.a && r.a.correct)).map(r => r.q.id);
    S.rfilter = S.rfilter || 'all';
    const shown = rows.filter(r => S.rfilter === 'all' || (S.rfilter === 'missed' ? !(r.a && r.a.correct) : S.flags[r.q.id]));

    app.replaceChildren(h('div', { class: 'wrap' },
      h('header', { class: 'hero' }, h('div', { class: 'eyebrow', text: 'Results' }), h('h1', { text: pct >= 80 ? 'Strong work' : pct >= 65 ? 'Getting there' : 'Keep going' })),
      h('section', { class: 'sheet' },
        h('div', { class: 'res-top' },
          h('div', null, h('div', { class: 'big', text: `${pct}%` }), h('div', { class: 'src', text: `${right} of ${graded.length} correct${skipped ? ` · ${skipped} skipped` : ''}` })),
          h('div', { class: 'bars' }, byTopic.map(x => h('div', { class: 'bar' },
            h('span', { text: TOPIC_NAME[x.t] }), h('span', { class: 'track' }, h('i', { style: `width:${(x.r / x.n) * 100}%` })), h('span', { class: 'v', text: `${x.r}/${x.n}` }))))),
        h('div', { class: 'row' },
          missedIds.length ? h('button', { class: 'btn primary', id: 'retry', onclick: () => startExam(shuffle(missedIds)) }, `Retry ${missedIds.length} missed`) : null,
          h('button', { class: 'btn', id: 'review', onclick: () => { S.screen = 'quiz'; go(0); } }, 'Review answers'),
          h('button', { class: 'btn', id: 'new', onclick: () => { S.screen = 'setup'; render(); } }, 'New exam')),
        h('div', { class: 'filterrow' }, h('div', { class: 'seg' }, [['all', 'All'], ['missed', 'Missed'], ['flag', 'Flagged']].map(([v, l]) =>
          h('label', null, h('input', { type: 'radio', name: 'rf', id: `rf-${v}`, checked: S.rfilter === v, onchange: () => { S.rfilter = v; render(); } }), h('span', { text: l }))))),
        h('ul', { class: 'rlist' }, shown.map(r => {
          const s = r.a && r.a.done && r.a.correct != null ? (r.a.correct ? ['ok', 'RIGHT'] : ['bad', 'MISS']) : ['skip', 'SKIP'];
          return h('li', null, h('button', { onclick: () => { S.screen = 'quiz'; go(r.i); } },
            h('span', { class: 'st ' + s[0], text: s[1] }),
            h('span', { class: 'tx', text: `${r.i + 1}. ${r.q.stem || (r.q.ctx && r.q.ctx.length ? 'Case study item' : 'Image-based item')}` }),
            h('span', { class: 'sr', text: `${r.q.srcShort} · Q${r.q.num}` })));
        })))));
  }

  function render() {
    if (S.screen === 'setup') renderSetup();
    else if (S.screen === 'quiz') renderQuiz();
    else renderResults();
  }

  document.addEventListener('keydown', e => {
    if (S.screen !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const q = curQ(), a = A(q);
    if (/^[1-9]$/.test(e.key) && q.type !== 'reveal') { const v = +e.key; if (v <= (q.nopts || 0)) { toggle(q, v); e.preventDefault(); } }
    else if (e.key === 'ArrowRight') go(S.idx + 1);
    else if (e.key === 'ArrowLeft') go(S.idx - 1);
    else if (e.key === 'Enter' && !(e.target && e.target.tagName === 'BUTTON')) {
      if (S.setup.mode === 'tutor' && q.type !== 'reveal' && !a.done) submit(q);
      else if (S.idx < S.list.length - 1) go(S.idx + 1);
      e.preventDefault();
    }
  });

  render();
})();
</script>
