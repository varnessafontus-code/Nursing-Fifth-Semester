<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NUR206 Exam 1 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one exam sheet column (max ~46rem) under a sticky progress bar; setup, question and results are three states of the same sheet. */
:root {
  --paper: #F4F6F5;
  --sheet: #FFFFFF;
  --ink: #17212B;
  --muted: #58656E;
  --line: #D6DDDC;
  --accent: #24427A;
  --accent-soft: #E5EBF6;
  --mark: #FFE9A3;
  --ok: #1F7A4A;
  --ok-soft: #E3F2E8;
  --bad: #B0302A;
  --bad-soft: #F8E4E2;
  --flag: #B86E00;
  --ctx: #EEF1F0;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161B; --sheet: #182028; --ink: #E6ECEF; --muted: #9AA8B1; --line: #2C3843;
    --accent: #8EB0F0; --accent-soft: #233350; --mark: #5A4A12; --ok: #6CCB94; --ok-soft: #173427;
    --bad: #F08A83; --bad-soft: #3A1E1C; --flag: #F2B24C; --ctx: #1E2831; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161B; --sheet: #182028; --ink: #E6ECEF; --muted: #9AA8B1; --line: #2C3843;
  --accent: #8EB0F0; --accent-soft: #233350; --mark: #5A4A12; --ok: #6CCB94; --ok-soft: #173427;
  --bad: #F08A83; --bad-soft: #3A1E1C; --flag: #F2B24C; --ctx: #1E2831; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 48rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
@media (max-width: 480px) { .sheet { padding: 16px; } }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- setup ---------- */
.hero { display: grid; gap: 6px; margin-bottom: 18px; }
.hero h1 { font-family: var(--font-read); font-weight: 600; font-size: clamp(28px, 5vw, 38px); line-height: 1.15; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }
.setup { display: grid; gap: 22px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .topics { grid-template-columns: 1fr; } }
.tcard { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 14px; cursor: pointer; display: grid; gap: 2px; }
.tcard input { position: absolute; opacity: 0; pointer-events: none; }
.tcard .n { font-family: var(--font-mono); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tcard .nm { font-weight: 600; }
.tcard .sub { font-size: 13px; color: var(--muted); }
.tcard:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.tcard:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 8px 14px; border-right: 1px solid var(--line); font-weight: 500; }
.seg label:last-child span { border-right: 0; }
.seg input:checked + span { background: var(--accent); color: var(--sheet); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: -3px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.startbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; }
.startbar .count { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.history { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }
.history b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- quiz ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.topbar .inner { max-width: 48rem; margin: 0 auto; padding-inline: 16px; display: grid; gap: 8px; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.tb-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.qcount { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.score-live { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.tb-actions { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 14px; font-weight: 600; }
.icon-btn[aria-pressed="true"] { color: var(--flag); border-color: var(--flag); }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; padding: 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; }
.palette button { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 6px 0; font-family: var(--font-mono); font-size: 13px; cursor: pointer; position: relative; }
.palette button.cur { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.palette button.ans { background: var(--accent-soft); }
.palette button.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.palette button.bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.palette button.fl::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--flag); }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-bottom: 12px; }
.chip { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.topic { color: var(--accent); border-color: var(--accent); }
.src { font-size: 13px; color: var(--muted); }
details.ctx { background: var(--ctx); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
details.ctx summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.ctx-body { display: grid; gap: 12px; margin-top: 10px; font-family: var(--font-read); font-size: 16px; }
.ctx-body p { margin: 0; }
.ctx-body .upd { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.figs { display: grid; gap: 4px; margin-block: 4px 12px; }
.figs img { display: block; width: 100%; height: auto; border-radius: 4px; background: #fff; }
@media (max-width: 640px) { .figs { overflow-x: auto; -webkit-overflow-scrolling: touch; } .figs img { min-width: 620px; } .figs::after { content: 'Swipe sideways to read the full page image'; font-size: 12px; color: var(--muted); font-family: var(--font-ui); } }
.stem { font-family: var(--font-read); font-size: 19px; line-height: 1.5; margin: 0 0 8px; }
.instr { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
.opts { display: grid; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 12px; cursor: pointer; font-family: var(--font-read); font-size: 17px; line-height: 1.4; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .mk { width: 26px; height: 26px; border: 1.5px solid var(--muted); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-size: 13px; }
.opt[data-kind="multi"] .mk { border-radius: 6px; }
.opt[aria-checked="true"], .opt[aria-pressed="true"] { background: var(--mark); border-color: var(--ink); }
.opt[aria-checked="true"] .mk, .opt[aria-pressed="true"] .mk { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.right .mk { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong .mk { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.opt .res { font-family: var(--font-ui); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; align-self: center; }
.opt.right .res { color: var(--ok); }
.opt.wrong .res { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.nchip { width: 48px; height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; font-family: var(--font-mono); font-size: 16px; }
.nchip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.nchip.right { background: var(--ok); color: var(--sheet); border-color: var(--ok); }
.nchip.wrong { background: var(--bad); color: var(--sheet); border-color: var(--bad); }
.nchip.missed { border: 2px dashed var(--ok); color: var(--ok); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.actions .l, .actions .r { display: flex; gap: 10px; flex-wrap: wrap; }
.fb { margin-top: 18px; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
.fb-head { padding: 12px 16px; font-weight: 700; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.fb.ok .fb-head { background: var(--ok-soft); color: var(--ok); }
.fb.bad .fb-head { background: var(--bad-soft); color: var(--bad); }
.fb.neutral .fb-head { background: var(--accent-soft); color: var(--accent); }
.fb-head .key { font-family: var(--font-mono); font-weight: 500; color: var(--ink); }
.fb-body { padding: 14px 16px; display: grid; gap: 10px; font-size: 15.5px; }
.fb-body p { margin: 0; max-width: 68ch; }
.fb-body .tip { border-left: 3px solid var(--accent); padding-left: 12px; }
.fb-body .note { border-left: 3px solid var(--flag); padding-left: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.order-list { margin: 0; padding-left: 22px; font-family: var(--font-read); }
.selfgrade { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.kbd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* ---------- results ---------- */
.res-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; margin-bottom: 20px; }
@media (max-width: 520px) { .res-top { grid-template-columns: 1fr; } }
.big { font-family: var(--font-mono); font-size: 56px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) 4.5rem; gap: 10px; align-items: center; font-size: 14px; }
.bar .track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--accent); }
.bar .v { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.rlist { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 6px; }
.rlist button { width: 100%; text-align: left; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.rlist .st { font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
.rlist .st.ok { color: var(--ok); } .rlist .st.bad { color: var(--bad); } .rlist .st.skip { color: var(--muted); }
.rlist .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.rlist .sr { font-size: 12px; color: var(--muted); white-space: nowrap; }
.filterrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
@media (hover: none) { .kbd.keys { display: none; } }
.fb { scroll-margin-top: 90px; }
.fb.flip { animation: flipin .45s cubic-bezier(.2,.7,.2,1); transform-origin: top center; }
@keyframes flipin { from { transform: perspective(900px) rotateX(-70deg); opacity: 0; } to { transform: none; opacity: 1; } }
.fb-head .side { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-left: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="application/json" id="qdata">[{"id":"chapter4-1","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":1,"ctx":[],"why":"The first circle depicts sickled red blood cells (cells become sickle-shaped and inflexible and may occlude blood flow). The second shows what happens when a patient receives hypertonic solutions (water leaves the cells and cells shrink), and the third circle shows what happens with hypotonic fluids (water moves into cells causing them to swell and possibly burst). Normal saline (0.9%) is an isotonic fluid with the same tonicity as the body; thus these fluids do not affect red blood cells, and the nurse would expect normal-appearing red blood cells.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Fluid and Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"4","img":[{"src":"img/c0011.webp","w":1100,"h":228},{"src":"img/c0012.webp","w":1100,"h":1095}],"type":"single","nopts":4,"key":[4]},{"id":"chapter4-2","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":2,"ctx":[],"why":"An adult should take in about 2 to 3 L of fluid daily from food and liquids. Although the RN would want to know about bowel movements, dietary intake, and urine output, in this case the priority concern is that the patient is not taking in enough oral fluids.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"The RN is admitting a patient with benign prostatic hyperplasia to an acute care unit. The patient describes an oral intake of about 1400 mL/day. What is the RN’s priority concern?","opts":["Ask the patient about his bowel movements.","Have the patient complete a diet diary for the past 2 days.","Instruct the patient to increase oral intake to 2 to 3 L/day.","Ask the patient to describe his urine output."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter4-3","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":3,"ctx":[],"why":"APs can reinforce additional fluid intake when it is part of the care plan. Administering IV fluids, developing plans, and teaching families require additional education and skills that are within the scope of practice of an RN.","tip":"The nurse must be familiar with the scope of practice for APs before delegating patient care tasks. AP scope of practice includes checking vital signs and performing tasks associated with activities of daily living such as bathing and oral care, feeding, and recording intake and output. APs can provide items such as drinking straws and can encourage and remind patients about instructions from the nurse such as increasing fluid intake.","meta":{"Focus":"Delegation, Supervision","QSEN":"TC","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Applying","IPEC":"R/R, IC"},"note":"","keyText":"2","stem":"The patient has fluid volume deficit related to excessive fluid loss. Which action related to fluid management should be delegated by the RN to the assistive personnel (AP)?","opts":["Administering IV fluids as prescribed by the health care provider","Providing straws and offering fluids between meals","Developing a plan for added fluid intake over 24 hours","Teaching family members to assist the patient with fluid intake"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-4","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":4,"ctx":[],"why":"The minimum amount of urine per day needed to excrete toxic waste products is 400 to 600 mL. This minimum volume is called the obligatory urine output. If the 24-hour urine output falls below the obligatory output amount, wastes are retained and can cause lethal electrolyte imbalances, acidosis, and a toxic buildup of nitrogen. The patient may need additional fluids (IV or oral) after the cause of the low urine output is determined. Elevating the head of the bed will not help with urine output. Notifying the health care provider is the first priority in this case.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC, S","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"4","stem":"The assistive personnel (AP) reports to the nurse that a patient’s urine output for the past 24 hours has been only 360 mL. What is the nurse’s priority action at this time?","opts":["Place an 18-gauge IV in the nondominant arm.","Elevate the patient’s head of bed at least 45 degrees.","Instruct the AP to provide the patient with a pitcher of ice water.","Contact and notify the health care provider immediately."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-5","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":5,"ctx":[],"why":"Normally, neck veins are distended when the patient is in the supine position. These veins flatten as the patient moves to a sitting position. The other three responses are characteristic of excess fluid volume.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Perfusion","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The patient is at risk for poor perfusion related to decreased plasma volume. Which assessment finding supports this risk?","opts":["Flattened neck veins when the patient is in the supine position","Full and bounding pedal and post-tibial pulses","Pitting edema located in the feet, ankles, and calves","Shallow respirations with crackles on auscultation"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter4-6","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":6,"ctx":[],"why":"The LPN/LVN scope of practice and educational preparation includes oral care and routine observation. State practice acts vary as to whether LPNs/LVNs are permitted to perform assessments. The patient should be reminded to avoid most commercial mouthwashes, which contain agents such as alcohol. To assess skin turgor in an older adult, skin tenting is best checked by pinching the skin over the sternum or on the forehead rather than over the back of the hand. With aging, the skin loses elasticity and tents on hands and arms even when the adult is well hydrated. Initiating a dietary consult is within the purview of the RN or health care provider.","tip":"","meta":{"Focus":"Supervision","QSEN":"TC","Concept":"Caregiving","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"1, 2, 4, 5","stem":"The nursing plan of care for an older patient with dehydration includes interventions for oral health. Which interventions are within the scope of practice for an LPN/LVN being supervised by an RN? Select all that apply.","opts":["Reminding the patient to avoid commercial mouthwashes","Encouraging mouth rinsing with warm saline","Assessing skin turgor by pinching the skin over the back of the hand","Observing the lips, tongue, and mucous membranes","Providing mouth care every 2 hours while the patient is awake","Seeking a dietary consult to increase fluids on meal trays"],"nopts":6,"key":[1,2,4,5],"type":"multi"},{"id":"chapter4-7","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":7,"ctx":[],"why":"Bilateral moist crackles indicate fluid-filled alveoli, which interferes with gas exchange. Furosemide is a potent loop diuretic that will help mobilize the fluid in the lungs. The other orders are important but are not urgent.","tip":"When asked a question like this, the student must consider which action is most urgent. With fluid-filled lungs, gas exchange is at risk. Think ABCs!","meta":{"Focus":"Prioritization","QSEN":"S, EBP","Concept":"Gas Exchange","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"The health care provider has written these orders for a patient with a diagnosis of pulmonary edema. The patient’s morning assessment reveals bounding peripheral pulses, a weight gain of 2 lb, pitting ankle edema, and moist crackles bilaterally. Which order takes priority at this time?","opts":["Weigh the patient every morning.","Maintain accurate intake and output records.","Restrict fluids to 1500 mL/day.","Administer furosemide 40 mg IV push."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-8","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":8,"ctx":[],"why":"Mild dehydration is very common among healthy adults and is corrected or prevented easily by matching fluid intake with fluid output. Teach all adults to drink more fluids, especially water. Beverages with caffeine can increase fluid loss, as can drinks containing alcohol. These beverages should not be used to prevent or treat dehydration.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Fluid Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Which statement related to dehydration made by a patient with hypovolemia is the best indicator to the nurse of the need for additional teaching?","opts":["“I will drink 2 to 3 L of fluids every day.”","“I will drink a glass of water whenever I feel thirsty.”","“I will drink coffee and cola drinks throughout the day.”","“I will avoid drinks containing alcohol.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter4-9","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":9,"ctx":[],"why":"Suspect hypokalemia and check the patient’s potassium level. Common electrocardiogram changes with hypokalemia include ST-segment depression, inverted T waves, and prominent U waves. Patients with hypokalemia may also develop heart block. Other abnormal electrolyte levels can affect cardiac rhythms, but the occurrence of U waves is associated with low potassium levels.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"The nurse has been floated to the telemetry unit for the day. The monitor technician informs the nurse that the patient has developed prominent U waves. Which laboratory value should be checked immediately?","opts":["Sodium","Potassium","Magnesium","Calcium"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-10","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":10,"ctx":[],"why":"The patient’s potassium level is high (normal range is 3.5 to 5 mEq/L or 3.5 to 5 mmol/L). Sodium polystyrene sulfonate removes potassium from the body through the gastrointestinal system. Spironolactone is a potassium-sparing diuretic that may cause the patient’s potassium level to go even higher. A potassium chloride supplement can also raise the potassium level even higher. The beginning nursing student does not have the skill to assess ECG strips.","tip":"","meta":{"Focus":"Delegation, Supervision","QSEN":"S, TC","Concept":"Electrolyte Balance","Cognitive Level":"Applying","IPEC":"R/R, IC"},"note":"","keyText":"1","stem":"A patient’s potassium level is 6.7 mEq/L (6.7 mmol/L). Which intervention should the nurse delegate to the first-year student nurse under his or her supervision?","opts":["Administer sodium polystyrene sulfonate 15 g orally.","Administer spironolactone 25 mg orally.","Assess the electrocardiogram (ECG) strip for tall T waves.","Administer potassium 10 mEq (10 mmol/L) orally."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter4-11","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":11,"ctx":[],"why":"SIADH results in a relative sodium deficit caused by excessive retention of water. Thus the nurse should monitor the patient with SIADH for hyponatremia.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Electrolyte Balance","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"A patient is admitted to the unit with a diagnosis of syndrome of inappropriate antidiuretic hormone secretion (SIADH). For which electrolyte abnormality would the nurse be sure to monitor?","opts":["Hypokalemia","Hyperkalemia","Hyponatremia","Hypernatremia"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter4-12","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":12,"ctx":[],"why":"Providing oral care, assisting patients to reposition, and recording urine output are within the scope of practice of the AP. Monitoring or assessing patients, as well as administering IV fluids, requires the additional education and skills of the RN.","tip":"","meta":{"Focus":"Assignment, Delegation, Supervision","QSEN":"TC","Concept":"Caregiving","Cognitive Level":"Applying","IPEC":"R/R, IC"},"note":"","keyText":"1, 4, 6","stem":"The charge nurse assigned the care of a patient with acute kidney failure and hypernatremia to a newly graduated RN. Which actions can the new RN delegate to the assistive personnel (AP)? Select all that apply.","opts":["Providing oral care every 3 to 4 hours","Monitoring for indications of dehydration","Administering 0.45% saline by IV line","Recording urine output when patient voids","Assessing daily weights for trends","Helping the patient change position every 2 hours"],"nopts":6,"key":[1,4,6],"type":"multi"},{"id":"chapter4-13","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":13,"ctx":[],"why":"A positive Chvostek sign (facial twitching of one side of the mouth, nose, and cheek in response to tapping the face just below and in front of the ear) is a neurologic manifestation of hypocalcemia. The heart rate may be slower or slightly faster than normal, with a weak, thready pulse. Severe hypocalcemia causes severe hypotension. The LPN/LVN is experienced and possesses the skills to accurately measure vital signs.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S, TC","Concept":"Electrolyte Balance","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"An experienced LPN/LVN reports to the RN that a patient’s blood pressure and heart rate have decreased and that when his face was assessed, one side twitched. What action should the RN take at this time?","opts":["Reassess the patient’s blood pressure and heart rate.","Review the patient’s morning calcium level.","Request a neurologic consult today.","Check the patient’s pupillary reaction to light."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-14","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":14,"ctx":[],"why":"Patients with low calcium levels should be encouraged to consume dairy products, seafood, nuts, broccoli, and spinach, which are all good sources of dietary calcium. The other three options indicate a correct understanding of calcium therapy.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC, S","Concept":"Patient Education","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"The nurse is preparing to discharge a patient whose calcium level was low but is now just barely within the normal range (9 to 10.5 mg/dL [2.25 to 2.63 mmol/L]). Which statement by the patient indicates the need for additional teaching?","opts":["“I will call my doctor if I experience muscle twitching or seizures.”","“I will make sure to take my vitamin D with my calcium each day.”","“I will take my calcium citrate pill every morning before breakfast.”","“I will avoid dairy products, broccoli, and spinach when I eat.”"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-15","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":15,"ctx":[],"why":"Calcium excretion is decreased with thiazide diuretics (e.g., HCTZ), so the calcium level is at risk for going even higher. Loop diuretics (e.g., furosemide) increase calcium excretion. The addition of IV fluids and cardiac monitoring are appropriate actions for monitoring and treating a patient with hypercalcemia.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S, PCC","Concept":"Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"Which prescription for a patient with hypercalcemia would the nurse question?","opts":["0.9% saline at 50 mL/hr IV","Furosemide 20 mg orally each morning","Apply cardiac telemetry monitoring.","Hydrochlorothiazide (HCTZ) 25 mg orally each morning"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-16","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":16,"ctx":[],"why":"A musculoskeletal manifestation of low phosphorus levels is generalized muscle weakness, which may lead to acute muscle breakdown (rhabdomyolysis). Phosphate is necessary for energy production in the form of adenosine triphosphate, and when not produced, it leads to generalized muscle weakness. Although the other statements are true, they do not answer the AP’s question.","tip":"","meta":{"Focus":"Delegation, Supervision","QSEN":"TC, S","Concept":"Electrolyte Balance","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"3","stem":"The assistive personnel (AP) asks the nurse why the patient with a chronically low phosphorus level needs so much assistance with activities of daily living. What is the RN’s best response?","opts":["“The patient’s low phosphorus is probably because of malnutrition.”","“The patient is just worn out from not getting enough rest.”","“The patient’s skeletal muscles are weak because of the low phosphorus.”","“The patient will do more for himself when his phosphorus level is normal.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter4-17","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":17,"ctx":[],"why":"Although all of these laboratory values are outside of the normal range, the magnesium level is the furthest from normal. With a magnesium level this low, the patient is at risk for electrocardiogram changes and life-threatening ventricular dysrhythmias.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"The RN is reviewing the patient’s morning laboratory results. Which of these results is of most concern?","opts":["Serum potassium level of 5.2 mEq/L (5.2 mmol/L)","Serum sodium level of 134 mEq/L (134 mmol/L)","Serum calcium level of 10.6 mg/dL (2.65 mmol/L)","Serum magnesium level of 0.8 mEq/L (0.4 mmol/L)"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-18","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":18,"ctx":[],"why":"The patient with COPD, although ventilator dependent, is in the most stable condition of the patients in this group and should be assigned to the float nurse from the step-down unit. Patients with acid-base imbalances often require frequent laboratory assessment and changes in therapy to correct their disorders. In addition, the patient with diabetic ketoacidosis is a new admission and requires an in-depth admission assessment. All three of these other patients need care from an experienced critical care nurse.","tip":"","meta":{"Focus":"Assignment","QSEN":"TC","Concept":"Collaboration","Cognitive Level":"Applying","IPEC":"R/R, IC"},"note":"","keyText":"2","stem":"Which patient would the charge nurse assign to the step-down unit nurse who was floated to the intensive care unit for the day?","opts":["A 68-year-old patient on a ventilator with acute respiratory failure and respiratory acidosis","A 72-year-old patient with chronic obstructive pulmonary disease (COPD) and normal blood gas values who is ventilator dependent","A newly admitted 56-year-old patient with diabetic ketoacidosis receiving an insulin drip","A 38-year-old patient on a ventilator with narcotic overdose and respiratory alkalosis"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-19","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":19,"ctx":[],"why":"The blood gas component responsible for respiratory acidosis is carbon dioxide, thus increasing the ventilator rate will blow off more carbon dioxide and decrease or correct the acidosis. Changes in the oxygen setting may improve oxygenation but will not affect respiratory acidosis.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Acid-Base Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The patient with respiratory failure is receiving mechanical ventilation and continues to produce arterial blood gas results indicating respiratory acidosis. Which change in ventilator setting should the nurse expect to correct this problem?","opts":["Increase in ventilator rate from 6 to 10 breaths/min","Decrease in ventilator rate from 10 to 6 breaths/min","Increase in oxygen concentration from 30% to 40%","Decrease in oxygen concentration from 40% to 30%"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter4-20","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":20,"ctx":[],"why":"The AP’s training and education includes how to measure vital signs, record intake and output, and reposition patients. Performing fingerstick glucose checks or assessing patients requires additional education and skill, as possessed by licensed nurses. Notifying the health care provider of glucose changes is within the scope of practice for licensed nurses. Some facilities may train experienced APs to perform fingerstick glucose checks and change their role descriptions to designate their new skills, but this task is beyond the normal scope of practice of an AP.","tip":"","meta":{"Focus":"Delegation, Supervision","QSEN":"TC","Concept":"Collaboration","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"2, 3, 6","stem":"Which actions should the nurse delegate to an assistive personnel (AP) for the patient with diabetic ketoacidosis? Select all that apply.","opts":["Checking fingerstick glucose results every hour","Recording intake and output every hour","Measuring vital signs every 15 minutes","Assessing for indicators of fluid imbalance","Notifying the health care provider of changes in glucose level","Assisting the patient to reposition every 2 hours"],"nopts":6,"key":[2,3,6],"type":"multi"},{"id":"chapter4-21","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":21,"ctx":[],"why":"Risk factors for acid-base imbalances in older adults include chronic kidney disease and pulmonary disease. Occasional antacid use will not cause imbalances, although antacid abuse is a risk factor for metabolic alkalosis. The MI occurred 1 year ago and is no longer a risk factor.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Acid-Base Balance","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"The nurse is admitting an older adult patient to the acute care medical unit. Which assessment factor alerts the nurse that this patient has a risk for acid-base imbalances?","opts":["History of myocardial infarction (MI) 1 year ago","Antacid use for occasional indigestion","Shortness of breath with extreme exertion","Chronic renal insufficiency"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-22","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":22,"ctx":[],"why":"A decreased respiratory rate indicates respiratory depression, which also puts the patient at risk for respiratory acidosis. All of the other findings are important and should be reported to the RN, but the respiratory rate demands urgent attention.","tip":"","meta":{"Focus":"Delegation, Supervision","QSEN":"S, TC","Concept":"Acid-Base Balance","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"1","stem":"A patient with lung cancer has received oxycodone 10 mg orally for pain. When the student nurse assesses the patient, which finding would the nurse instruct the student nurse to report immediately?","opts":["Respiratory rate of 8 to 10 breaths/min","Decrease in pain level from 6 to 2 (on a scale of 1 to 10)","Request by the patient that the room door be closed","Heart rate of 90 to 100 beats/min"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter4-23","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":23,"ctx":[],"why":"The patient is most likely hyperventilating and blowing off carbon dioxide. This decrease in carbon dioxide will lead to an increase in pH and cause respiratory alkalosis. Eliminating carbon dioxide would lead to an alkalosis. Metabolic imbalances would be related to renal changes.","tip":"","meta":{"Focus":"Prioritization, Supervision","QSEN":"S","Concept":"Acid-Base Balance","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"The assistive personnel (AP) reports to the nurse that a patient seems very anxious, and vital sign measurement included a respiratory rate of 38 breaths/min. Which acid-base imbalance should the nurse suspect?","opts":["Respiratory acidosis","Respiratory alkalosis","Metabolic acidosis","Metabolic alkalosis"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-24","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":24,"ctx":[],"why":"Prolonged nausea and vomiting can result in acid deficit that can lead to metabolic alkalosis. The other findings are important and need to be assessed but are not related to acid-base imbalances.","tip":"","meta":{"Focus":"Prioritization, Supervision","QSEN":"TC, S","Concept":"Acid-Base Balance","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"1","stem":"A patient is admitted to the oncology unit for chemotherapy. To prevent an acid-base problem, which finding would the nurse instruct the assistive personnel to report?","opts":["Repeated episodes of nausea and vomiting","Reports of pain associated with exertion","Failure to eat all the food on the breakfast tray","Patient hair loss during the morning bath"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter4-25","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":25,"ctx":[],"why":"NG suctioning can result in a decrease in acid components and metabolic alkalosis. The patient’s decrease in rate and depth of ventilation is an attempt to compensate by retaining carbon dioxide. The first response may be true, but it does not address all the components of the question. The third and fourth answers are inaccurate.","tip":"","meta":{"Focus":"Supervision, Prioritization","QSEN":"TC","Concept":"Acid-Base Balance","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"2","stem":"The patient has a nasogastric (NG) tube connected to intermittent wall suction. The student nurse asks why the patient’s respiratory rate and depth has decreased. What is the nurse’s best response?","opts":["“It’s common for patients with uncomfortable equipment such as NG tubes to have a lower rate of breathing.”","“The patient may have a metabolic alkalosis because of the NG suctioning, and the decreased respiratory rate is a compensatory mechanism.”","“Whenever a patient develops a respiratory acid-base problem, decreasing the respiratory rate helps correct the problem.”","“The patient is hypoventilating because of anxiety, and we will have to stay alert for the development of respiratory acidosis.”"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-26","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":26,"ctx":[],"why":"HCTZ is a thiazide diuretic. It should not be taken at night because it will cause the patient to wake up to urinate. This type of diuretic causes a loss of potassium, so the nurse should teach the patient about eating foods rich in potassium and should inform the patient that the HCP may prescribe a potassium supplement. Weight gain and increased edema should not occur while the patient is taking this drug, so these should be reported to the HCP.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC, S","Concept":"Electrolyte Balance","Cognitive Level":"Applying"},"note":"","keyText":"1, 4, 5, 6","stem":"The patient has an order for hydrochlorothiazide (HCTZ) 10 mg orally every day. What should the nurse be sure to include in a teaching plan for this drug? Select all that apply.","opts":["“Take this medication in the morning.”","“This medication should be taken in two divided doses: half when you get up and half when you go to bed.”","“Eat foods with extra sodium every day.”","“Inform your health care provider (HCP) if you notice weight gain or increased swelling.”","“You should expect your urine output to increase.”","“Your HCP may also prescribe a potassium supplement.”"],"nopts":6,"key":[1,4,5,6],"type":"multi"},{"id":"chapter4-27","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":27,"ctx":[],"why":"Potassium is lost when a patient is taking HCTZ, and so the patient’s potassium level should be monitored regularly.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Electrolyte Balance","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"Which blood test result would the nurse be sure to monitor for the patient taking hydrochlorothiazide (HCTZ)?","opts":["Sodium level","Potassium level","Chloride level","Calcium level"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-28","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":28,"ctx":[],"why":"To correct hypovolemic shock with dehydration, the patient needs IV fluids that are isotonic and will increase intravascular volume, such as normal saline. With D5W, the body rapidly metabolizes the dextrose, and the solution becomes hypotonic. All of the other interventions are appropriate for a patient with shock.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Fluid Balance","Cognitive Level":"Analyzing","IPEC":"R/R, IC"},"note":"","keyText":"4","stem":"The RN is providing care for a patient diagnosed with dehydration and hypovolemic shock. Which prescribed intervention from the health care provider should the RN question?","opts":["Blood pressure every 15 minutes","Place two 18-gauge IV lines.","Oxygen at 3 L via nasal cannula","IV 5% dextrose in water (D5W) to run at 250 mL/hr"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-29","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":29,"ctx":[],"why":"This patient’s PaCO2 is elevated (normal is 35 to 45 mm Hg). Whenever the PaCO2 level changes acutely, the pH changes to the same degree but in the opposite direction. As the amount of CO2 begins to rise above normal in the brain’s blood and tissues, these central receptors trigger the neurons to increase the rate and depth of breathing (hyperventilation). For these reasons, answers 2, 3, and 4 are inaccurate.","tip":"","meta":{"Focus":"Supervision, Prioritization","QSEN":"PCC, S","Concept":"Acid-Base Balance","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The student nurse, under the supervision of an RN, is reviewing a patient’s arterial blood gas results and notes an acute increase in arterial partial pressure of carbon dioxide (PaCO2) to 51 mm Hg compared with the previous results. Which statement by the student nurse indicates an accurate understanding of the acid-base balance for this patient?","opts":["“When the PaCO2 is acutely elevated, the blood pH should be lower than normal.”","“This patient should be taught to breathe and rebreathe in a paper bag.”","“An elevated PaCO2 always means that a patient has an acidosis.”","“When a patient’s PaCO2 is increased, the respiratory rate should decrease to compensate.”"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter4-30","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":30,"ctx":[],"why":"Patients at greatest risk for acute acidosis are those with problems that impair breathing. Older adults with chronic health problems are at greater risk for developing acidosis. Whereas a patient who misuses antacids is at risk for metabolic alkalosis, a patient with anxiety is at risk for respiratory alkalosis. A patient with salicylate intoxication is at risk for metabolic acidosis.","tip":"Respiratory acid-base disorders are related to respiratory function. When a patient has a chronic respiratory illness, he or she is at risk for a respiratory acid-base imbalance.","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Acid-Base Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The nurse is providing care for several patients who are at risk for acid-base imbalance. Which patient is most at risk for respiratory acidosis?","opts":["A 68-year-old patient with chronic emphysema","A 58-year-old patient who uses antacids every day","A 48-year-old patient with an anxiety disorder","A 28-year-old patient with salicylate intoxication"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter4-31","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":31,"ctx":[],"why":"Seizures may be associated with apnea and thus hypoxemia and lactic acidosis. Lactic acidosis, a form of metabolic acidosis, occurs when cells use glucose without adequate oxygen (anaerobic metabolism); glucose then is incompletely broken down and forms lactic acid. This acid releases hydrogen ions, causing acidosis. Lactic acidosis occurs whenever the body has too little oxygen to meet metabolic oxygen demands (e.g., heavy exercise, seizure activity, reduced oxygen).","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC, S","Concept":"Acid-Base Balance","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"The nurse is caring for a patient who experiences frequent generalized tonic-clonic seizures associated with periods of apnea. The nurse must be alert for which acid-base imbalance?","opts":["Respiratory alkalosis","Respiratory acidosis","Metabolic alkalosis","Metabolic acidosis"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter4-32","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":32,"ctx":[],"why":"Collect data about risk factors related to the development of acidosis. Older adults may be taking drugs that disrupt acid-base balance, especially diuretics and aspirin. Ask about specific risk factors, such as any type of breathing problem. Also ask about headaches, behavior changes, increased drowsiness, reduced alertness, reduced attention span, lethargy, anorexia, abdominal distention, nausea or vomiting, muscle weakness, and increased fatigue. Ask the patient to relate activities of the previous 24 hours to identify activity intolerance, behavior changes, and fatigue. Answers 3 and 5 are not common concerns with acidosis.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Acid-Base Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"1, 2, 4, 6","stem":"The nurse is completing a history for an older patient at risk for an acidosis imbalance. Which questions would the nurse be sure to ask? Select all that apply.","opts":["“Which drugs do you take on a daily basis?”","“Do you have any problems with breathing?”","“When was your last bowel movement?”","“Have you experienced any activity intolerance or fatigue in the past 24 hours?”","“Over the past month have you had any dizziness or tinnitus?”","“Do you have episodes of drowsiness or decreased alertness?”"],"nopts":6,"key":[1,2,4,6],"type":"multi"},{"id":"chapter4-33","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":33,"ctx":[],"why":"If acidosis is metabolic in origin, the rate and depth of breathing increase as the hydrogen ion level rises. Breaths are deep and rapid and not under voluntary control, a pattern called Kussmaul respiration. The patient may not require oxygen. Although it’s important to record reflux and constipation, this is not related to metabolic acidosis, nor is keeping the water pitcher full specific to this condition.","tip":"","meta":{"Focus":"Supervision, Delegation","QSEN":"S, PCC","Concept":"Acid-Base Balance","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"2","stem":"Which specific instruction does the charge nurse give the assistive personnel helping to provide care for a patient who is at risk for metabolic acidosis?","opts":["Check to see that the patient keeps his oxygen in place at all times.","Inform the nurse immediately if the patient’s respiratory rate and depth increases.","Record any episodes of reflux or constipation.","Keep the patient’s ice water pitcher filled at all times."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter4-34","topic":"fe","topicName":"F&E / ABG","source":"Chapter 4: Fluid, Electrolyte, and Acid-Base Balance Problems","srcShort":"Chapter 4","num":34,"ctx":[],"why":"The patient would also be likely to have pale dry skin, a bounding pulse, altered level of consciousness, shallow and increased respirations, moist crackles, and weight gain. Hyperactive bowel sounds are the result of increased motility.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Fluid Balance","Cognitive Level":"Applying"},"note":"","keyText":"1, 4, 6, 8, 10","img":[{"src":"img/c0013.webp","w":1100,"h":667}],"type":"multi","nopts":10,"key":[1,4,6,8,10]},{"id":"casestudy5-1","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":1,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"The onset of symptoms and the amount of fluid loss help to determine acuity. Pain assessment of the abdomen should be performed to obtain a baseline; his pain is probably associated with diabetic ketoacidosis, but infection or trauma also cause pain. If Mr. D had insulin today, this could affect treatment. Information about allergies should be obtained for all patients regardless of the presenting problem. Knowing when the patient was diagnosed with diabetes does not alter the priority actions at this point.","tip":"","meta":{"Focus":"Prioritization","QSEN":"N/A","Concept":"Glucose Regulation","Cognitive Level":"Analyzing"},"note":"","keyText":"1, 2, 4, 5, 6","stem":"To clarify pertinent data, which questions would the nurse ask Mr. D? Select all that apply.","opts":["“When did your symptoms start?”","“How many times have you vomited?”","“When were you diagnosed with diabetes?”","“Where does your abdomen hurt?”","“Did you take any insulin today?”","“Do you have any allergies?”"],"nopts":6,"key":[1,2,4,5,6],"type":"multi"},{"id":"casestudy5-2","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":2,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"Mr. D should be taken to a treatment room for immediate evaluation and treatment. Paging the ED provider to come to the triage area is not necessary unless the patient becomes unresponsive in the triage area. Calling the parents is not necessary because Mr. D is old enough to provide consent for himself. (If Mr. D were under age, the treatment would not be delayed if the parents were unavailable in an emergency situation.) Calling the primary HCP is usually done by the ED provider after the preliminary workup is completed. (Policies for calling primary HCPs vary among institutions; be familiar with facility policies.)","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"The nurse has completed the triage assessment and history taking. Which action is the priority?","opts":["Page the ED health care provider (HCP) to come to triage.","Call the patient’s parents for permission to treat.","Notify the patient’s primary HCP.","Take the patient immediately to a treatment room."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy5-3","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":3,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"Hyperglycemia, ketosis, and metabolic acidosis are hallmark characteristics of DKA. Hyperglycemia results in glucosuria. This causes osmotic diuresis and fluid and electrolytes are lost through urination. Hyperosmolality of the blood draws water from the cells, causing cellular dehydration. Lack of insulin causes the body to metabolize fats at a higher rate and this leads to ketosis. Metabolic acidosis occurs as a result of the acidic byproducts of fat metabolism. Polyuria is expected and urine output is closely monitored because severe hypovolemia can cause acute renal failure. There is a risk for cardiac dysrhythmias, but they are not expected. Electrolytes must be closely monitored and corrected; electrolyte imbalances (especially potassium) can cause cardiac dysrhythmias.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Fluid and Electrolytes, Acid-Base Balance, Glucose Regulation","Cognitive Level":"Analyzing","Cognitive Skill":"Recognize Cues"},"note":"","keyText":"1, 2, 3, 4, 5, 7","stem":"Based on the patient’s history and clinical presentation, the HCP says that the probable medical diagnosis is diabetic ketoacidosis (DKA). In DKA, which abnormalities would the health care team expect to see and treat? Select all that apply.","opts":["Ketosis","Metabolic acidosis","Dehydration","Hyperglycemia","Glycosuria","Cardiac dysrhythmias","Hyperosmolarity"],"nopts":7,"key":[1,2,3,4,5,7],"type":"multi"},{"id":"casestudy5-4","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":4,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"Mr. D is severely dehydrated and is at risk for hypovolemic shock and electrolyte imbalance. Although he is demonstrating Kussmaul respirations, this breathing pattern is the body’s attempt to compensate for the acidosis. Acid-base imbalance is usually corrected by administering fluids, electrolytes, and insulin. Adherence is relevant but can be addressed after Mr. D’s condition is stabilized.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Which nursing concept is the priority in planning the initial emergency interventions for Mr. D?","opts":["Gas exchange","Acid-base balance","Fluid and electrolyte balance","Adherence"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy5-5","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":5,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"Taking vital signs, bagging up belongings, obtaining equipment, measuring output, and assisting with hygienic needs (e.g., cleaning emesis basin) are within the scope of duties for the AP. Checking the blood glucose level is accomplished with a fingerstick. APs, particularly in specialty areas such as the ED, will usually receive training to do this task, but this may vary by state and facility. Information should not be released by the AP because of confidentiality issues. Release of information to friends and family varies by facility policies, but typically the RN would escort the family in to see the patient as soon as possible.","tip":"","meta":{"Focus":"Delegation","QSEN":"TC","Concept":"Care Coordination","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"1, 2, 3, 5, 6","stem":"Which tasks can be delegated to an experienced assistive personnel (AP)? Select all that apply.","opts":["Measuring and reporting Mr. D’s vital signs every 15 minutes","Taking and reporting Mr. D’s blood glucose level","Bagging and labeling Mr. D’s belongings","Updating the roommate regarding Mr. D’s status","Measuring emesis and cleaning the basin as needed","Obtaining an infusion pump from the supply room"],"nopts":6,"key":[1,2,3,5,6],"type":"multi"},{"id":"casestudy5-6","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":6,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"Fluid replacement is the first priority. Furthermore, the fluid dilutes the glucose levels, which helps to correct osmotic diuresis. The serum potassium level may not reflect the total body potassium. Hypokalemia occurs because of loss of potassium in the urine and transcellular movement of fluid; however, potassium levels are closely monitored, and supplements are given accordingly. Insulin is given to slowly lower the blood glucose level, but this occurs after rehydration and evaluation of potassium levels. Bicarbonate is rarely given unless acidosis becomes life threatening; acidosis usually resolves with fluids, electrolytes, and insulin.","tip":"","meta":{"Focus":"Prioritization","QSEN":"TC, EBP","Concept":"Fluid and Electrolyte Balance","Cognitive Level":"Analyzing","IPEC":"T/T"},"note":"","keyText":"3","stem":"For the initial emergency care of Mr. D, which collaborative treatment goal is the priority?","opts":["Correction of hyperglycemia with IV insulin","Correction of acid-base imbalance using IV bicarbonate","Correction of fluid imbalance with IV fluids","Correction of potassium imbalance with IV potassium"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy5-7","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":7,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"The nurse would question the insertion of a straight catheter to obtain a urine specimen for a patient who is alert and able to use a urinal or commode because there is currently an emphasis on reducing catheter-associated urinary tract infections. (Note to student: The HCP may order an indwelling catheter for critically ill patients because hourly urinary output reflects cardiac output and kidney perfusion.) Subcutaneous insulin requires time to absorb; IV insulin is preferred. The patient is likely to be on food and fluid restrictions until the vomiting resolves. In addition, intra-abdominal conditions (e.g., appendicitis) should be ruled out before allowing oral fluids. At least one peripheral IV is needed for fluid replacement during the acute period. Semi-Fowler position is preferred to reduce the risk for aspiration. ECG monitoring is appropriate for all critical care patients. In this case, electrolyte imbalances increase the risk for dysrhythmias.","tip":"If the nurse is questioning the HCP, the plan of care, or the interventions, the question is asking you to identify the incorrect options.","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"2, 3, 6","stem":"In the initial emergency care for Mr. D, which HCP prescriptions would the nurse question? Select all that apply.","opts":["Start a peripheral IV line with a large-bore catheter.","Obtain a urine specimen with a small-bore straight catheter.","Administer regular insulin subcutaneously.","Maintain the patient in a semi-Fowler position.","Initiate continuous electrocardiographic (ECG) monitoring.","Encourage intake of oral fluids as tolerated."],"nopts":6,"key":[2,3,6],"type":"multi"},{"id":"casestudy5-8","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":8,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"Normal saline (0.9% sodium chloride) is the first fluid used to correct dehydration in most adults with DKA. Half-strength saline (0.45% sodium chloride) can be used for children and adults at risk for volume overload. Potassium supplements are added to correct potassium deficit before starting insulin. Solutions of 5% dextrose are added to the therapy when the blood glucose level approaches 250 mg/dL (13.9 mmol/L).","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"According to evidence-based practice, which IV solution will the HCP prescribe first for the initial fluid replacement?","opts":["Normal saline (0.9% sodium chloride)","Half-strength saline (0.45% sodium chloride)","5% dextrose in water and half-strength saline","Normal saline with potassium chloride"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy5-9","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":9,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true}],"why":"Many pumps only allow three digits for programming flow, so the nurse knows to use the available IV pump and program the rate to 999 mL/hr. It would not be possible to change the pump to deliver in L/hr.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Technology and Informatics","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"The HCP instructs the nurse to give 1 L of IV fluid over the next hour. The available IV pump delivers fluid in mL/hr and allows three digits for programming the flow rate. Which action would the nurse take first?","opts":["Try to find a pump that will accurately deliver the fluid.","Program the IV pump for 1 L/hr and start the infusion.","Ask the HCP to revise the rate to accommodate the available equipment.","Program the IV pump for 999 mL/hr and start the infusion."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy5-10","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":10,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"The ABG results indicate metabolic acidosis. The pH is low (reference range, 7.35–7.45). Paco2 is decreased (reference range 38–42 mmHg) because the deep and rapid Kussmaul respirations are the body’s attempt to lower the pH by blowing off carbon dioxide. Bicarbonate level is the metabolic component of the ABG; in metabolic acidosis the bicarbonate is low (reference range, 21–28 mEq/L [21–28 mmol/L]). PaO2 is normal (reference range 80–100 mmHg) because gas exchange is not impaired in metabolic acidosis.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Acid-Base Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"Which physical assessment finding is most likely to accompany these laboratory results?","opts":["Kussmaul respirations","Dilated pupils","Increased urination","Elevated blood pressure"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy5-11","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":11,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Initially in patients with DKA, the serum potassium level is expected to be within normal limits or elevated (reference range, 3.5–5 mEq/L[3.5–5 mmol/L]); regardless of the laboratory value, there is an overall potassium deficit. After insulin therapy, hypokalemia is expected as the potassium shifts back into the cells; therefore, if the potassium level is initially low, it will be even lower after therapy.","tip":"Potassium imbalances can cause lethal cardiac dysrhythmias. It is likely that the NCLEX Examination will include questions about potassium levels. It is worthwhile to memorize the reference range (reference range, 3.5–5 mEq/L[3.5–5 mmol/L]).","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"The nurse is reviewing the potassium values that were obtained when Mr. D first arrived in the ED. Which serum potassium level is most concerning?","opts":["3.5 mEq/L (3.5 mmol/L)","2 mEq/L (2 mmol/L)","5.8 mEq/L (5.8 mmol/L)","6 mEq/L (6 mmol/L)"],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy5-12","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":12,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"The calculations are incorrect. The pump should be set at 7 mL/hr. Calling the HCP is inappropriate; the nurse is responsible for calculating the pump settings. Insulin is a high-alert drug, and calculations must always be double-checked. When discrepancies are discovered, the source of the error must be determined and corrected.","tip":"When weight is given in pounds and medications or fluids are prescribed per kilogram, the first step is to convert pounds to kilograms.","meta":{"Focus":"Prioritization, Supervision","QSEN":"EBP","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"An insulin infusion is ordered for Mr. D to begin at 0.1 units/kg/hr. Mr. D weighs 155 lb. The pharmacy delivers a premixed bag of 100 units of regular insulin in 100 mL of normal saline. Nurse A has calculated the infusion pump setting as 10 mL/hr. What would the charge nurse do?","opts":["Tell Nurse A to obtain a pump and start the infusion as calculated.","Advise Nurse A to recalculate the infusion rate.","Call the HCP and ask for the exact pump setting to be clarified.","Allow Nurse A to administer the infusion using her own judgment."],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy5-13","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":13,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Hypokalemia and hypoglycemia are the most common complications associated with the treatment of DKA. In DKA, the initial serum potassium level may be normal or elevated, but this is because of diuresis and fluid shift within the cells; the body could have an overall potassium deficit. Insulin causes intracellular movement of potassium and bicarbonate therapy and can contribute to hypokalemia. Hypokalemia can be avoided by carefully monitoring the potassium and glucose levels and then adding dextrose and potassium to IV fluids as needed. Chloremic acidosis has been associated with excessive fluid resuscitation. Cerebral edema is seen in children and is related to rapid fluid resuscitation. Pulmonary venous congestion is a potential complication, but this has not been validated by research findings.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"Which complication, secondary to the treatment of DKA, is most common?","opts":["Cerebral edema","Pulmonary venous congestion","Chloremic acidosis","Hypokalemia"],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy5-14","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":14,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Abdominal pain is a common symptom of DKA; however, an infection can also trigger DKA. An intra-abdominal infection, such peritonitis or appendicitis, would also cause abdominal pain. The nurse would continue to assess the abdomen. Worsening pain with tenderness and rigidity and unresolved elevation of temperature would be reported to the HCP. Paralytic ileus is not expected in DKA, but is a sign of hypokalemia, which is a common complication of therapy. Administering pain medication would not be the first action. The pain should resolve after treatment if the metabolic disturbance is the cause; however, the nurse would perform ongoing pain assessments.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Pain","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Which action would the nurse take first to follow up on the patient’s report of abdominal pain?","opts":["Assess for paralytic ileus, which is expected with DKA.","Assess pain and obtain a prescription for pain medication.","Perform assessments for a possible abdominal infection.","Wait for pain to resolve after treatment of DKA."],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy5-15","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":15,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Acknowledging and reflecting underlying feelings is therapeutic. Options 1 and 4 give unsolicited advice, and option 2 is a platitude that is not supported by firsthand knowledge of the mother–son relationship.","tip":"To provide a therapeutic answer, the patient is first encouraged to express feelings, then the nurse and patient can define the needs and work on problem solving. In this case, the nurse uses reflection to help Mr. D to expand on his emotional concerns.","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Communication","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"Mr. D says to the nurse, “Please don’t call my mother. If she knows I’m in the hospital, she’ll make me quit school and move back home. I messed up, but I really don’t want to move back in with my parents.” Which response is the most therapeutic?","opts":["“None of the staff will say anything, but you should tell her yourself.”","“Your mom loves you, and she is just concerned about your well-being.”","“It sounds like you want to be independent and responsible for yourself.”","“You are an adult, and you have a right to make your own decisions.”"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy5-16","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":16,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"First, the situation should be assessed to determine if a privacy violation has occurred. Patient information should be released only to facilitate continuity of care (e.g., in a shift report) and only to those who are directly involved in the care. If Health Insurance Portability and Accountability Act rules were violated, the incident would be reported to the nurse manager for potential complaints related to the AP’s actions and so that the AP could receive the proper remediation. Giving positive feedback for sincere efforts to assist patients and families is appropriate, but guidelines must be recognized and followed.","tip":"","meta":{"Focus":"Prioritization, Supervision","QSEN":"TC, I, QI","Concept":"Health Care Law, Ethics","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The nurse overhears the AP talking to someone on the phone. The AP says, “Yes, Mr. D is doing much better than when he first got here. I will tell him that you called, and I will give him your message.” Which action would the nurse take first?","opts":["Ask the AP about the phone conversation that was just overheard.","Remind the AP that release of information is outside her scope of practice.","Report the AP to the nurse manager for a patient privacy violation.","Give positive feedback for trying to help the patient and the caller."],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy5-17","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":17,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Before potassium is administered, it is important to know that the kidneys are functioning. The other information is important but has less relevance to the potassium infusion.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"An IV potassium infusion needs to be started. Which information, related specifically to the potassium infusion, is the most important to give to the intensive care unit (ICU) nurse who will assume the care of the patient?","opts":["Mental status and cognition have improved with therapy.","Urinary output is 60 mL/hr, and urine is a clear yellow color.","Admitting blood pressure (BP) was 100/60 mm Hg; last BP is 125/76 mm Hg.","There are two existing peripheral IV lines, and both flush easily."],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy5-18","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":18,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"The nursing staff is likely to encourage the patient to inform his family, but the ICU staff should be aware that he is resistant to notifying his family. (Note to student: Policies vary greatly, but some facilities do not allow staff to confirm or deny the admission or discharge of patients. In such cases, the patient may be asked to provide a list of people that can visit or phone in.)","tip":"","meta":{"Focus":"Prioritization","QSEN":"TC","Concept":"Communication","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"The ED nurse is preparing the SBAR (situation, background, assessment, recommendation) report before the ICU transfer. Which detail would be most important to include as background to ensure that Mr. D’s right to privacy is maintained?","opts":["Patient is a premed student who was studying for finals, and this interfered with his normal routine.","Roommate is a medical student and a family friend, and he brought Mr. D to the ED.","Patient has not informed family that he is in the hospital, and he is relu
