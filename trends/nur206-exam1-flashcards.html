us or oral routes; however, chemotherapy medications require specialized knowledge.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S, TC","Concept":"Safety","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"When staff assignments are made for the care of patients who are receiving chemotherapy, which consideration related to chemotherapeutic drugs is the most important?","opts":["Administration of chemotherapy requires precautions to protect self and others.","Many chemotherapeutic drugs are vesicants.","Chemotherapeutic drugs are frequently given through central venous access devices.","Oral and intravenous routes of administration are the most common."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-20","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":20,"ctx":[],"why":"Tumor lysis syndrome is an emergency involving electrolyte imbalances and potential renal failure. A patient scheduled for surgery would be assessed before leaving the unit, and any final preparations for surgery would be completed. A patient with breakthrough pain needs a thorough pain assessment, an investigation of pain patterns, and a chart review of all attempted pharmaceutical and nonpharmaceutical interventions; the health care provider may need to be contacted for a change of dosage or medication. Anticipatory nausea and vomiting have a psychogenic component that requires assessment, teaching, reassurance, and administration of antiemetics.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Analyzing"},"note":"","keyText":"1, 3, 2, 4","stem":"The oncoming day shift nurse has just received the handoff report from the night shift nurse. List the order of priority for assessing and caring for the following patients, with 1 being first and 4 being last.","opts":["A patient who developed tumor lysis syndrome around 5:00 AM","A patient who is currently pain free but had breakthrough pain during the night","A patient scheduled for exploratory laparotomy this morning","A patient with anticipatory nausea and vomiting for the past 24 hours"],"nopts":4,"key":[1,3,2,4],"type":"order"},{"id":"chapter2-21","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":21,"ctx":[],"why":"Back pain is an early sign of spinal cord compression occurring in 95% of patients. The other symptoms are later signs.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Cellular Regulation","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The nurse is monitoring a patient who is at risk for spinal cord compression related to tumor growth. Which patient statement is most likely to suggest an early manifestation?","opts":["“Last night my back really hurt, and I had trouble sleeping.”","“My leg has been giving out when I try to stand.”","“My bowels are just not moving like they usually do.”","“When I try to pass urine, I have difficulty starting the stream.”"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-22","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":22,"ctx":[],"why":"The AP would be instructed to remain calm and give clear and simple directions. In chemo brain, patients experience mental cloudiness with memory problems. This is usually temporary, but this condition can potentially last for years and impair ability to return to work or other social activities.","tip":"","meta":{"Focus":"Supervision, Delegation","QSEN":"PCC","Concept":"Cognition","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"Which instruction would the nurse give to the assistive personnel (AP) about caring for a patient who is experiencing “chemo brain”?","opts":["“The patient can understand you but cannot speak clearly.”","“Be cautious; the patient may be unpredictably aggressive.”","“Calmly give explanations if the patient seems forgetful.”","“Report immediately if the patient complains of a headache.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-23","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":23,"ctx":[],"why":"3: Flu-like symptoms are the most common side effects of the MoAbs. Acetaminophen may be given prophylactically to reduce these symptoms. Capillary leak syndrome (a dangerous side effect that may lead to pulmonary edema), confusion, and hepatoxicity may also occur but are less common.","tip":"All medications have numerous side effects. For test-taking and for clinical practice, start your study by focusing on the most common side effects and the side effects that are the most dangerous.","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Applying"},"note":"","keyText":"","stem":"A patient who has breast cancer is receiving immunotherapy in the form of trastuzumab, a monoclonal antibody (MoAb). Which medication side effect is the patient most likely to experience?","opts":["Capillary leak syndrome","Hepatotoxicity","Flu-like symptoms","Memory loss"],"nopts":4,"key":[],"type":"reveal"},{"id":"chapter2-24","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":24,"ctx":[],"why":"The normal range for calcium is 9.0 to 10.5 mg/dL (2.25 to 2.75 mmol/L). Potentially life-threatening hypercalcemia can occur in cancers with destruction of bone. Other laboratory values are pertinent for overall patient management but are less specific to bone cancers. Normal ranges are: sodium 136 to 145 mEq/L (136 to 145 mmol/L); potassium 3.5 to 5.0 mEq/L (3.5 to 5.0 mmol/L); and BUN 10 to 20 mg/dL (3.6 to 7.1 mmol/L).","tip":"For test-taking and for clinical practice, memorizing normal ranges for common laboratory tests can help you to quickly identify potential problems.","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Cellular Regulation","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"For a patient with osteogenic sarcoma, which laboratory value causes the most concern?","opts":["Sodium level of 135 mEq/L (135 mmol/L)","Calcium level of 13 mg/dL (3.25 mmol/L)","Potassium level of 4.9 mEq/L (4.9 mmol/L)","Blood urea nitrogen (BUN) of 10 mg/dL (3.6 mmol/L)"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-25","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":25,"ctx":[],"why":"Patient B underwent debulking of tumor and Patient D had a laminectomy require postoperative care and pain management for these palliative procedures; they can be placed in the same room. Patients who have low neutrophil counts (normal range: 2500-8000/mm³ [5-10 x 10⁹ /L]) or those with recent bone marrow transplantation require protective isolation. The patient who is undergoing brachytherapy needs a private room because radiation is being emitted while the implant is in place. The patient with terminal cancer needs comfort measures, such as privacy, family members at the bedside, and symptom relief. In addition, observing a roommate who has end-of-life symptoms could be very stressful for other patients who have cancer. The nadir represents the point of the lowest white blood cell count following chemotherapy. This condition may also require protective isolation.","tip":"","meta":{"Focus":"Assignment","QSEN":"S","Concept":"Immunity","Cognitive Level":"Analyzing","Cognitive Skill":"Take Action"},"note":"","keyText":"2, 4","img":[{"src":"img/c0001.webp","w":1100,"h":533},{"src":"img/c0002.webp","w":1100,"h":337}],"type":"multi","nopts":7,"key":[2,4]},{"id":"chapter2-26","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":26,"ctx":[],"why":"The patient is not coping with the recent diagnosis of cancer and stressful prospect of losing his leg. His decision to go hiking may be a form of denial or possibly a veiled suicide threat. It is also possible that he has decided not to have any treatment; however, the nurse needs to make an additional assessment about his decision and actions and help him to discuss alternatives and consequences. This situation is complex, but if he leaves the hospital, there may be no chance to address any other isolation.","tip":"","meta":{"Focus":"Assignment","QSEN":"S","Concept":"Immunity","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"An athletic young man with pain, a low-grade fever, and anemia was recently diagnosed with Ewing sarcoma. The surgeon recommended amputation of the right lower leg for an operable tumor. The nurse discovers the patient preparing to leave the hospital “to go on a long hiking trip.” What is the priority nursing concept to consider at this time?","opts":["Pain","Cellular regulation","Stress and coping","Adherence"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-27","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":27,"ctx":[],"why":"Tumor lysis syndrome can result in severe electrolyte imbalances and potential kidney failure. The other laboratory values are important to identify general chemotherapy side effects but are less pertinent to tumor lysis syndrome.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP, S","Concept":"Fluid and Electrolytes","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"After chemotherapy, a patient is being closely monitored for tumor lysis syndrome. Which laboratory result requires particular attention?","opts":["Platelet count","Electrolyte levels","Red blood cell count","White blood cell count"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-28","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":28,"ctx":[],"why":"At 25 years of age, women should have a Pap smear, regardless of sexual activity. Annual mammograms are recommended for women with average risk starting at age 45. African-American men with average risk starting at age 45 years should talk to their HCPs about prostate cancer and risk versus benefits of prostate-specific antigen testing. Men aged 55 years or older who smoke should be advised to talk to their provider about lung cancer screening. Colon cancer screening tests are recommended for those with average risk starting at age 45 years. Women who have had a total hysterectomy for reasons other than cancer do not need a Pap test.","tip":"Cancer screening guidelines are constantly being updated and revised. The American Cancer Society is a good resource for this information (http://www.cancer.org/healthy/findcancerearly/cancerscreeningguidelines/american-cancer-society-guidelines-for-the-early-detection-of-cancer).","meta":{"Focus":"Prioritization","QSEN":"S, EBP","Concept":"Health Promotion","Cognitive Level":"Applying"},"note":"","keyText":"1, 3, 4, 5","stem":"People at risk are the target populations for cancer screening programs. According to the latest screening recommendations from the American Cancer Society, which of these asymptomatic patients need extra encouragement to participate in cancer screening? Select all that apply.","opts":["A 25-year-old African-American woman who is sexually inactive, for a Pap test","A 30-year-old Asian-American woman, for an annual mammogram","A 45-year-old African-American man, to talk with the health care provider (HCP) about prostate cancer","A 55-year-old white American man who smokes, to talk with the HCP about a lung cancer screening","A 50-year-old white American woman, for colon cancer screening","A 70-year-old Asian-American woman who had a total hysterectomy 15 years ago (not for cancer reasons), for a Pap test"],"nopts":6,"key":[1,3,4,5],"type":"multi"},{"id":"chapter2-29","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":29,"ctx":[],"why":"Hyponatremia is a concern; therefore fluid restrictions would be prescribed. Urinalysis is less pertinent; however, the nurse would monitor for changes in urine specific gravity. The diet may need to include sodium supplements. Fluid bolus is unlikely for patients with SIADH; however, IV normal saline or hypertonic saline solutions may be given very cautiously.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid and Electrolytes","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"A patient with lung cancer develops syndrome of inappropriate antidiuretic hormone secretion (SIADH). Which treatment does the nurse anticipate that the health care provider will prescribe first?","opts":["A fluid bolus","Fluid restrictions","A urinalysis","A sodium-restricted diet"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-30","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":30,"ctx":[],"why":"Measuring vital signs and reporting on specific parameters, practicing good hand washing, and gathering equipment are within the scope of duties for an AP. Assessing for symptoms of infections and superinfections is the responsibility of the RN.","tip":"","meta":{"Focus":"Delegation","QSEN":"TC","Concept":"Immunity","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"1, 2, 4, 6","stem":"In the care of a patient with neutropenia, what tasks would the nurse delegate to assistive personnel (AP) to perform? Select all that apply.","opts":["Taking vital signs every 4 hours","Reporting temperature of more than 100.4°F (38°C)","Assessing for sore throat, cough, or burning with urination","Gathering the supplies to prepare the room for protective isolation","Reporting superinfections, such as candidiasis","Practicing good hand-washing technique"],"nopts":6,"key":[1,2,4,6],"type":"multi"},{"id":"chapter2-31","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":31,"ctx":[],"why":"An LPN/LVN is versed in medication administration and able to teach patients standardized information. The other options require more in-depth assessment, planning, and teaching, which would be performed by the RN. Helping patients with smoking cessation is a Core Measure.","tip":"","meta":{"Focus":"Assignment","QSEN":"TC","Concept":"Health Promotion","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"2","stem":"A primary nursing responsibility is the prevention of lung cancer by assisting patients in the cessation of smoking or other tobacco use. Which task would be appropriate to assign to an LPN/LVN?","opts":["Develop a “quit plan”","Explain how to apply a nicotine patch","Discuss strategies to avoid relapse","Suggest ways to deal with urges for tobacco"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-32","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":32,"ctx":[],"why":"Morphine elixir is the therapy of choice because it is thought to reduce anxiety and the subjective sensation of air hunger. End-of-life care would not include aggressive measures such as intubation or resuscitation. Support and comfort are always welcome, but in this case, there is an option that would offer some physical relief for the patient.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP, PCC","Concept":"Palliative Care","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"A patient with terminal liver cancer is receiving end-of-life-care. The patient is weak and restless and her skin is mottled and cool. Dyspnea develops, and she appears anxious and frightened. What would the nurse do first?","opts":["Administer an as needed dose of morphine elixir.","Alert the rapid response team and call the health care provider.","Deliver breaths at 20 breaths/min with a bag-valve mask and prepare for intubation.","Sit quietly with the patient and offer emotional support and comfort."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-33","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":33,"ctx":[],"why":"Contact the charge nurse about the patient assignment. All nurses can assess patients, IV sites, and infusions; however, chemotherapy medications require special expertise. Asking the nurse to stay is not the best solution because the care of the patient and the effects of the medication continue after the infusion has been completed. Asking about or looking up the side effects of the drug is okay for personal information, but lack of chemotherapy certification is still an issue. In addition, knowing how to properly discontinue the infusion and dispose of the equipment are essential for personal safety and the safety of others. (Note to students: Facility policies may vary regarding chemotherapy certification. In your future career, for your safety and the safety of your patients, find out what the facility policy is and pursue certification as needed.)","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Safety","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"During report, the float nurse hears that the patient is receiving IV vincristine that will finish within the next 15 minutes. The IV site is intact, and the patient is not having any problems with the infusion. The float nurse is not certified in chemotherapy administration. What is the priority action?","opts":["Ask the off-going nurse to stay until the vincristine infusion is finished.","Ask the off-going nurse about problems to expect with vincristine infusions.","Contact the charge nurse and discuss the lack of chemotherapy certification.","Look up drug side effects and monitor because the infusion is almost complete."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-34","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":34,"ctx":[],"why":"If the radiation implant has obviously been expelled (e.g., is on the bed linens), use a pair of forceps to place the radiation source in a lead container. The other options would be appropriate after safety of the patient and personnel are ensured.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Safety","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"A patient with uterine cancer is being treated with intracavitary radiation therapy. The assistive personnel (AP) reports that the patient insisted on ambulating to the bathroom and now “something feels like it is coming out.” What is the priority action?","opts":["Assess the AP’s knowledge; explain the rationale for strict bed rest.","Assess for dislodgment; use forceps and a lead container to retrieve and store as needed.","Assess the patient’s knowledge of the treatment plan and her willingness to participate.","Notify the health care provider about dislodgment of the radiation implant."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-35","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":35,"ctx":[],"why":"First, the charge nurse identifies the reason for the switch. After the underlying issue is discovered, a plan can be made to assist Nurse A (e.g., referral to counseling or in-service training). The charge nurse should avoid being too draconian or condescending. Nurses frequently switch patients to help one another out, but the charge nurse should always be informed before changing assignments.","tip":"","meta":{"Focus":"Assignment, Supervision","QSEN":"TC, QI","Concept":"Leadership","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"3","stem":"The charge nurse discovers that two nurses have switched patient assignments because Nurse A does “not like to take care of patients with prostate cancer.” Which action would the charge nurse take first?","opts":["Insist that they switch back to the original patient assignments and talk to each of them at the end of the shift.","Allow them this flexibility; as long as the patients are well cared for, it doesn’t matter if the assignments are changed.","Ask Nurse A to explain her position regarding prostate cancer patients and seek alternatives to prevent future issues.","Explain to Nurse A and Nurse B that all patients deserve kindness and care regardless of their condition or the nurses’ personal feelings."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter2-36","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":36,"ctx":[],"why":"Incident pain is pain that is associated with an event, such as walking, position change, or coughing. In this case, movement is the incident that causes pain and the patient’s reaction to protect the arm. Pain 30 to 45 minutes before the next scheduled dose is breakout pain. Burning and tingling are descriptors of neuropathic pain. Depression and withdrawal could occur with all types of pain, especially severe chronic pain. When friends and family are not available, the nurse could try other forms of distraction.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Pain","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"Which assessment finding strongly suggests that the patient with cancer is having incident pain?","opts":["Frequently reports pain about 30 to 35 minutes before the next scheduled dose","Demonstrates protectiveness of right arm whenever moving or standing up","Reports a continuous burning and tingling sensation in left lower leg","Appears quiet, withdrawn, and depressed when family leaves after visiting"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-37","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":37,"ctx":[],"why":"Bisphosphonate medications are used for patients with cancer to relieve bone pain associated with primary bone cancer or metastasis and to reduce the risk of fractures. They also lower the calcium level in the blood.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Pain","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"Which question is the home health nurse most likely to ask to evaluate the efficacy of a bisphosphonate medication that was prescribed for a patient with cancer?","opts":["“Has the medication helped relieve the discomfort in your mouth?”","“Have you noticed any increase or changes in your energy level?”","“Has the medication helped to stop the nausea and vomiting?”","“Has the medication relieved the bone pain that you reported?”"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter2-38","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":38,"ctx":[],"why":"If the trigger factors for anxiety are identified, the nursing staff can plan nonpharmaceutical interventions. Lorazepam is a benzodiazepine, and it is not a first-line drug for cancer pain. It can be used for anxiety, insomnia, alcohol withdrawal, and muscle spasms and may be used in combination with antiemetics for cancer-induced nausea and vomiting.","tip":"","meta":{"Focus":"Prioritization","QSEN":"N/A","Concept":"Anxiety","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"The oncoming nurse hears in the handoff report that the patient with cancer received an as needed oral dose of lorazepam. Which question is the oncoming nurse most likely to ask the off-going nurse in relation to the medication?","opts":["“What did the patient say about the location and level of the pain?”","“Were you able to determine what was making the patient so anxious?”","“When is the patient allowed to have another dose of lorazepam?”","“Did the patient have a normal bowel movement after the medication?”"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter2-39","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":39,"ctx":[],"why":"Primary cancers (lung, prostate, breast, and colon) may metastasize to the spine. In spinal cord compression, back pain is a common early symptom. Later symptoms include weakness, loss of sensation, urinary retention or incontinence, and constipation.","tip":"Reports of pain in distal areas, worsening pain, or difficulty controlling pain can signal metastasis or reoccurrence, which is always a concern for cancer patients. Pain would be reported to the health care provider for evaluation.","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Pain, Cellular Regulation","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The nurse is interviewing a patient who was treated several months ago for breast cancer. The patient reports taking nonsteroidal anti-inflammatory drugs (NSAIDs) for back pain. Which patient comment is cause for greatest concern?","opts":["“The NSAIDs are really not relieving the back pain.”","“The NSAID tablets are too large, and they are hard to swallow.”","“I gained weight because I eat a lot before taking NSAIDs.”","“The NSAIDs are upsetting my stomach in the morning.”"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-40","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":40,"ctx":[],"why":"All of these conditions warrant calling the health care provider (HCP). Nevertheless, tracheal deviation is a symptom of tension pneumothorax, which is a medical emergency, and the nurse may have to intervene before the rapid response team or the HCP can arrive. Decreased urinary output for a patient with cancer is probably related to an obstruction, but other causes would be investigated. Dysrhythmias are one sign of tumor lysis syndrome secondary to hyperkalemia. After bowel resection, patients are at risk for hemorrhage or peritonitis.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Gas Exchange","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"Which assessment finding is the most critical and needs to be addressed first?","opts":["A patient with small cell lung cancer has tracheal deviation after a pulmonary resection.","A patient with bladder cancer has decreased urination after intravesical chemotherapy.","A patient with non-Hodgkin lymphoma has cardiac dysrhythmias after chemotherapy","A patient has severe abdominal pain after a bowel resection for colon cancer."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter2-41","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":41,"ctx":[],"why":"Superior vena cava syndrome is a compression or obstruction of the vessel that leads to congestion of the blood. Early manifestations include edema in the face, periorbital edema, and tightness around the neck of the gown. Other symptoms include cough, dyspnea, orthopnea, headache, upper extremity swelling, and distended chest veins. Stridor caused by narrowing of the pharynx or larynx is an ominous sign. Late symptoms include hemorrhage, cyanosis, mental status changes, decreased cardiac output, and hypotension. Elevation of the head of bed or placing the patient in a high Fowler’s position immediately helps to relieve the symptoms. Nasal cannula or a simple face mask would be used to increase oxygen saturation level.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Perfusion, Cellular Regulation","Cognitive Level":"Analyzing","Cognitive Skill":"Recognize Cues, Take Action"},"note":"","keyText":"Option 1, superior vena cava syndrome; Option 2, patency of airway; Option 3, Stridor; Option 4, place patient in a Fowler’s position","img":[{"src":"img/c0003.webp","w":1100,"h":766},{"src":"img/c0005.webp","w":1100,"h":786}],"type":"reveal"},{"id":"chapter2-42","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":42,"ctx":[],"why":"Level of consciousness and responsiveness are assessed and compared to baseline and 8:00 am status. Oxygen is administered immediately for respiratory distress or risk for decreased oxygenation and perfusion. Pulse oximeter is secured for continuous monitoring. Adequate pulse, blood pressure, and respirations are required for cerebral perfusion. Increased temperature may signal infection or sepsis. Blood glucose levels would be checked even if the patient does not have diabetes. Severe hypoglycemia would be immediately treated per protocol. Cardiac dysthymias can alter cerebral perfusion. Glasgow Coma Scale and neurological changes are assessed because change of mental status could be related to stroke or injury. Trauma may seem unlikely for a hospitalized patient but falls that result in head injury are a possibility, especially for older adults or confused patients. The liver plays a key role in blood clotting; liver cell dysfunction associated with the cancer increases the risk for bleeding even with minor injury. At 08:00 am, the sodium, potassium and blood glucose are in the lower range of normal and the ammonia level is in the upper range of normal. (Normal ranges: blood glucose, 70-110mg/dL (3.9-6.1 mmol/L); Potassium, 3.5-5.0 mEq/L (3.5-5.0 mmol/L); Sodium 136-145 mEq/L (136-145 mmol/L); Ammonia 10-80 mcg/dl (6-47µmol/L). With change in mental status, repeating laboratory tests is considered because cancer increases risk for hyponatremia. Liver cell dysfunction increases the risk for hypokalemia, hypoglycemia and elevated ammonia. Assessment findings and response to oxygen and glucose (if administered) are reported using SBAR.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Cognition","Cognitive Level":"Analyzing","Cognitive Skill":"Analyze Cues, Take Action","Test Taking Tip":"For patients who have a sudden change in mental status or a decreased level of consciousness, assume that the brain is experiencing decreased perfusion, decreased oxygenation, or both until proven otherwise. Administering oxygen and glucose are braincell–preserving interventions that must occur within several minutes"},"note":"","keyText":"2, 6, 1, 3, 7, 9, 8, 4, 5","img":[{"src":"img/c0006.webp","w":1100,"h":701},{"src":"img/c0007.webp","w":1100,"h":619}],"type":"reveal"},{"id":"chapter2-43","topic":"onc","topicName":"Oncology","source":"Chapter 2: Cancer","srcShort":"Chapter 2","num":43,"ctx":[],"why":"A 56-year-old patient comes to the clinic for scant rectal bleeding and intermittent diarrhea and constipation, cramping, and fatigue for the past several months. Despite an unintentional weight loss of 20lbs in the past month, his body mass index (BMI) is 31. He reports a chronic “smoker’s cough” and shortness of breath with minor exertion, that influences his desire to exercise. He reports “My father was an alcoholic, so I limit myself to an occasional social drink.” He has a history of appendectomy as a child and a gunshot wound to the abdomen sustained in military service. His mother died from colorectal cancer at age 43 and his father died of complications related to alcoholism at age 63. Signs and symptoms may not appear in the early stages of colon cancer. When signs/symptoms finally appear, they will include: change in bowel habits, such as diarrhea, constipation, change in consistency of stool, rectal bleeding or blood in stool; abdominal discomfort, such as cramps, gas, or a feeling that the bowel doesn't empty completely; weakness; fatigue; or unexplained weight loss. Modifiable risk factors include: obesity, lack of physical exercise, smoking, diet high in red meats, and heavy alcohol consumption. Non-modifiable factors include: age over 50; family history, especially if a first degree relative is less than 45 years old when colorectal cancer develops; inherited syndromes, such as Lynch syndrome or familial adenomatous polyposis; and ethnicity, such as, African American. Personal history includes: inflammatory bowel disease, such as ulcerative colitis, Crohn’s disease; polyps; previous episode of colorectal cancer and type 2 diabetes.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Cellular Regulation","Cognitive Level":"Analyzing","Cognitive Skill":"Recognize Cues"},"note":"","keyText":"","img":[{"src":"img/c0008.webp","w":1100,"h":359}],"type":"reveal"},{"id":"casestudy11-1","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":1,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Mr L and Mr U have the most critical conditions. Mr. L requires tracheostomy care and frequent suctioning. In addition, he is still learning to cope with impaired communications, changes in breathing, and managing his own secretions. He has tube feedings and is receiving chemotherapy. His energy level will be low, and he needs assistance for most ADLs. Mr. U had major chest surgery. He has a chest tube and requires frequent respiratory assessment. He is having significant pain that is not well controlled. Mr. U is also likely to have little energy to accomplish ADLs and has a risk for post-surgical complications.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"S","Cognitive Level":"Analyzing"},"note":"","keyText":"2, 6","stem":"Which two patients are the most critical and likely to require frequent assessment and skilled care throughout the shift? Select two.","opts":["Mr. N (non-Hodgkin lymphoma)","Mr. L (tracheostomy and partial laryngectomy)","Mr. B (bladder cancer)","Ms. C (bowel resection and colostomy)","Ms. G (breast lumpectomy)","Mr. U (pulmonary resection)"],"nopts":6,"key":[2,6],"type":"multi"},{"id":"casestudy11-2","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":2,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"When the patient responds to a question, this provides information about ease of respirations and cerebral perfusion. Noting the presence of complex equipment will help in making assignments, particularly if the staff is inexperienced. Measuring vital signs, checking intake and output, and palpating for pain are not necessary during this brief assessment unless there is reason to suspect that a patient is decompensating. (Note to student: Some nurses briefly palpate the radial pulse to detect irregularities, assess peripheral perfusion, and check skin temperature.)","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"S","Cognitive Level":"Analyzing","Cognitive Skill":"Generate Solutions"},"note":"","keyText":"1, 2, 5, 6","stem":"The team leader makes very brief rounds to see each patient before receiving the shift report to ensure patient safety and to help determine acuity and assignments. Which actions will these brief assessments entail? Select all that apply.","opts":["Asking, “How are you feeling?”","Noting mental status (alert and oriented?)","Measuring vital signs and looking at intake and output","Palpating chest and abdominal areas for pain","Noting the presence and complexity of equipment","Observing ease of respiratory effort"],"nopts":6,"key":[1,2,5,6],"type":"multi"},{"id":"casestudy11-3","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":3,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes nd sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Numbness, tingling, and neuropathic pain are reported by patients with chemotherapy induced peripheral neuropathy. For venous thromboembolism, expected signs and symptoms include calf or groin tenderness and pain, and sudden onset of unilateral swelling of the leg and induration (hardening) along the blood vessel and with warmth and edema. Peripheral arterial insufficiency would manifest as pain, pallor, pulselessness, paresthesia, paralysis, and poikilothermy (coolness). Before the patient stands and ambulates, an additional assessment would be performed to prevent falls.","tip":"","meta":{"Focus":"Prioritization","Concept":"Pain","QSEN":"S","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"Mr. N (non-Hodgkin lymphoma) reports noticing some transient numbness and tingling in his lower legs with occasional mild burning type pain. What is the nurse most likely to do first?","opts":["Assess for signs and symptoms of venous thromboembolism.","Check for signs and symptoms of peripheral arterial insufficiency.","Ask the patient to ambulate to stimulate muscles and circulation.","Assess for possible chemotherapy-induced peripheral neuropathy."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy11-10","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":10,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following in reluctance to use it.","intro":true}],"why":"According to the Centers for Disease Control and Prevention Division of Cancer Prevention and Control, patients who are neutropenic are advised to watch for and immediately report: a fever that is 100.4°F (38°C) or higher for more than one hour or a one-time temperature of 101°F (38.3°C) or higher; chills and sweats; cough or new cough; sore throat or mouth sores; difficulty breathing; nasal congestion; stiff neck; burning, painful, or increased urination; change in vaginal discharge or irritation; redness, soreness, or swelling in any area; diarrhea; vomiting; new onset of pain and changes in skin, urination, or mental status. Flatulence and insomnia, while troublesome for patients, are not usually associated with infection.","tip":"","meta":{"Focus":"Prioritization","Concept":"Infection","QSEN":"EBP","Cognitive Level":"Applying"},"note":"","keyText":"2, 3, 4, 5, 6, 8, 9, 11, 12","img":[{"src":"img/c0035.webp","w":1100,"h":672}],"type":"multi","nopts":12,"key":[2,3,4,5,6,8,9,11,12]},{"id":"casestudy11-11","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":11,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and equently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"The bag-valve mask (trade name, Ambu bag) is the first thing that is needed if there is a problem with the tracheostomy equipment or with respiratory effort. With a tracheostomy, there should be no need for an endotracheal tube or a laryngoscope. The insertion tray is also probably unnecessary because the site should mature within 72 hours.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"S","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"The team leader is teaching the nursing student about the emergency respiratory equipment that should be available for Mr. L (tracheostomy and partial laryngectomy). Which piece of equipment is the most important to show to the student?","opts":["Adult-sized endotracheal tube","Laryngeal scope with blades of several sizes","Bag-valve mask with extension tubing","Tracheostomy insertion tray"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy11-14","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":14,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as nto skin, the likelihood of damage is lower. Thus very close monitoring can prevent larger amounts of leakage into the tissues. The chemotherapy-certified nurse has the knowledge to safely administer chemotherapy, but close monitoring is still required. If the medication is a known vesicant, the nurse is more likely to closely monitor the access site, but any infiltration can be uncomfortable and problematic for the patient. Holding the medication is not appropriate, but the nurse may advocate for central line placement.","tip":"","meta":{"Focus":"Prioritization","Concept":"Tissue Integrity","QSEN":"S","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"Mr. L (tracheostomy and partial laryngectomy) needs to receive a dose of IV chemotherapy during the shift. What is the most important action to take to prevent extravasation?","opts":["Carefully monitor the access site during the administration of the medication.","Hold the medication until an implanted port or central line is established.","Ensure that a chemotherapy-certified nurse is assigned to care for the patient.","Call the pharmacy to find out if the prescribed medication has vesicant properties."],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy11-15","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":15,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary node Analyzing"},"note":"","keyText":"2","stem":"Mr. L (tracheostomy and partial laryngectomy) has been receiving 10 mg of IV morphine for pain. The HCP tells the nurse that Mr. L will be switched to oral (liquid) hydromorphone 5 mg. When the nurse checks an equianalgesic dose table, she sees that 10 mg of morphine equals 7.5 mg of hydromorphone. What would the nurse do?","opts":["Call the pharmacy to double-check that the equianalgesic dose is actually 7.5 mg.","Recognize that cross-tolerance is variable and titrating upward is required for safety.","Question the HCP because the patient deserves to have adequate pain relief.","Give the medication and tell the patient that he is receiving what was prescribed."],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy11-16","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":16,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He receiv . He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Mr. L is at risk for aspiration and an immediate airway obstruction if his tracheostomy tube is not suctioned. If a chest drainage system tips over, it is unlikely that anything untoward will occur; however, if the chest tube has been displaced, Mr. U is at risk for an open pneumothorax. The HCP must be notified about Mr. N’s fever so that therapy can be changed and cultures ordered to determine the source of infection. Ms. C must be assessed for signs and symptoms of venous thromboembolism. Mr. B needs reassurance that the dysuria is transient and to be expected after intravesical therapy.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"S","Cognitive Level":"Analyzing"},"note":"","keyText":"4, 2, 3, 5, 1","stem":"During the midmorning, the following events occur at the same time. Prioritize the events in the order in which they should be addressed, with 1 being the most urgent and 5 being the least.","opts":["Mr. B, who has bladder cancer, reports dysuria.","Mr. U’s (pulmonary resection) chest drainage system has tipped over.","Mr. N, who has non-Hodgkin lymphoma, has a fever of 101°F (38.3°C).","Mr. L’s (partial laryngectomy) tracheostomy tube needs to be suctioned.","Ms. C, who had a bowel resection, has a red, swollen, tender calf."],"nopts":5,"key":[4,2,3,5,1],"type":"order"},{"id":"casestudy11-21","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":21,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Asking for extra help and delaying independent action is a type of regression that allows Ms. C to cope with the changes in self-image and bodily functions. The nurse should evaluate the situation daily to help Ms. C find alternative coping strategies.","tip":"","meta":{"Focus":"Prioritization","Concept":"Stress and Coping","QSEN":"PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"Ms. C (bowel resection) repeatedly refuses to perform a return demonstration of any aspect of colostomy care. Despite steady improvement and independent resumption of other ADLs, she protests, “I’m too weak. You’ll have to do it for me.” At this point, what is the priority nursing concept to consider in planning interventions for Ms. C?","opts":["Mobility","Development","Functional Ability","Stress and Coping"],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy11-22","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":22,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team ays ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Have her hold the clamp or do some other small task to engage her in participation. This creates the expectation that she can participate and will eventually handle the equipment. Verbally reexplaining the procedure and providing written material does reinforce the initial teaching, but being told will not help her master the psychomotor aspects. Having a family member or a staff member take over the procedure does not support the goal of eventual independence.","tip":"","meta":{"Focus":"Prioritization","Concept":"Adherence","QSEN":"PCC","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"The nursing staff are making suggestions about how to help Ms. C (bowel resection) overcome her reluctance to perform colostomy care. Which suggestion will the team leader try first?","opts":["Verbally reexplain the procedure and give her written material.","Have a family member come in and do it for her.","Continue to do it for her until she is ready.","Ask her to hold the clamp while the bag is being emptied."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy11-23","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":23,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provide ation and assessment of patient’s self-management are necessary. The RN should also assist with the menu selection because some foods increase risk for blockage (e.g., popcorn or seeds) and other foods increase odors (e.g., onions or beans).","tip":"When assigning or delegating tasks remember that the patient’s status and needs must be considered. In this case, the need for assessment and teaching are beyond the scope of practice for the AP. In other circumstances, such as in the home setting, the AP may be assisting the patient to do many of the routine tasks associated with the colostomy.","meta":{"Focus":"Delegation","Concept":"Care Coordination","QSEN":"TC","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"1, 3, 6","stem":"In helping a patient such as Ms. C, who had a colostomy with a bowel resection, which tasks can be delegated to the AP? Select all that apply.","opts":["Assist Ms. C with perineal care.","Help Ms. C to position the adhesive wafer over the stoma.","Empty the colostomy bag and measure the contents.","Help Ms. C to reapply a new colostomy bag.","Assist Ms. C with selecting dinner items from the menu.","Report that Ms. C has a question about odor from the bag."],"nopts":6,"key":[1,3,6],"type":"multi"},{"id":"casestudy11-24","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":24,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight alling a volunteer might be useful after determining that her social needs could be met by a volunteer.","tip":"","meta":{"Focus":"Prioritization","Concept":"Communication","QSEN":"S, PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Ms. C (bowel resection and colostomy) repeatedly calls for help during the shift with various small requests. She is talkative and pleasant, and she does everything she can to get staff members to “stay and chat.” What is the best response?","opts":["“I really like talking to you, but I do have other patients.”","“You’ll be okay for right now, and I will come back and check on you later.”","“I have 10 minutes right now. Later this afternoon, I’ll have time to talk.”","“Let me call one of the hospital volunteers to come and sit with you.”"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy11-25","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":25,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (N aboratory result indicates that the HCP should be called to discontinue the medication?","opts":["Hemoglobin is 12 g/dl (7.4 mmol/L).","White blood cell (WBC) count is 7,000 mm³ (7 x 10⁹/L).","Potassium level is 3.6 mEq/L (3.6 mmol/L).","Blood glucose level is 85 mg/dl (12 mmol/L)."],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy11-26","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":26,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a ch
