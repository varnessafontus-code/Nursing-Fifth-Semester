topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":27,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Ms. G is demonstrating fear and anxiety related to uncertainty of the future. The nurse would first help her to express feelings and decrease anxiety; then information deficits, decision making, and dealing with body image could be dealt with.","tip":"","meta":{"Focus":"Prioritization","Concept":"Anxiety","QSEN":"PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The team leader is working through the preoperative checklist and Ms. G, who has a breast lump, begins to cry. “What do you think about this breast surgery? My friend’s arm got really swollen after she had the surgery. Can’t I just take medication?” What is the priority nursing concept to consider in responding to Ms. G?","opts":["Anxiety","Culture","Functional Ability","Adherence"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy11-28","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":28,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"First acknowledge Ms. G’s feelings and do additional assessment about “things” in order to design interventions. It is natural for her to be anxious about the surgery, but there may be other issues (e.g., problems with family, money, work). The other options might be appropriate after the situation has been assessed.","tip":"","meta":{"Focus":"Prioritization","Concept":"Anxiety","QSEN":"PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"Ms. G (breast lumpectomy) continues to be anxious and tearful, and she says that she has changed her mind about the surgery, saying, “I’m going to go home. I just can’t deal with everything that is going on right now. I need some time to think about things.” What is the best response?","opts":["“It’s okay to change your mind. You have the right to make your own decisions.”","“Please reconsider. This surgery is very important, and your health is the priority.”","“Would you like me to call your HCP, so you can discuss your concerns?”","“I see you are concerned. What things are you dealing with and thinking about?”"],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy11-29","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":29,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Patients who have continuous pain should be placed on around-the-clock analgesics. Non-opioid analgesics or as needed opioid administration may also be appropriate for situations such as breakthrough pain, but they are not the best solution for continuous pain. Patients should always be monitored for respiratory depression, especially if they are opioid naïve; however, this patient has advanced cancer, and he is also having postoperative pain, so opioids should not be withheld.","tip":"","meta":{"Focus":"Prioritization","Concept":"Pain","QSEN":"PCC","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"The team leader is reviewing the pain management plan for Mr. U. He is having significant pain related to the cancer and the pulmonary resection. Which option would be the best for Mr. U?","opts":["Mr. U is instructed to ask for pain medication whenever he needs it.","Mr. U should receive around-the-clock fixed doses of opioid analgesics.","Mr. U should be offered the non-opioid medication first to see it if works.","Mr. U has a high risk for respiratory distress, so opioids are not prescribed."],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy11-30","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":30,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"The intramuscular route is rarely used because it is painful and absorption is uneven. The IV route is frequently used in the immediate postoperative period, especially for patients who are candidates for PCA. The oral route is usually preferred if the patient can swallow. The rectal route is an option for those who cannot swallow.","tip":"","meta":{"Focus":"Prioritization","Concept":"Pain","QSEN":"PCC","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"For administering pain medication to Mr. U (lung cancer and pulmonary resection), which route is the nurse most likely to question?","opts":["Oral","IV","Rectal","Intramuscular"],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy11-31","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":31,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"In this scenario, there are three key observations that the nurse makes upon entering the room. The patient is gasping for breath. He is struggling to sit upright, and he is not able to answer questions. The nurse immediately does an emergency assessment which includes visually observing for skin color, labored or rapid breathing and listening for wheezing or stridor. Simultaneously, the nurse positions the patient and applies oxygen and pulse oximeter. The patient is using precious oxygen in his efforts to sit upright. Putting him a high Fowler’s position is a quick action that helps to improve breathing and will decrease his struggles. If the nursing student knows how to raise the head of the bed, the nurse could delegate this action and perform the second step, which is to apply oxygen and the pulse oximeter; however, a first-year nursing student may not be familiar with the equipment or be able to react quickly in an emergency situation. Once oxygen needs are addressed, the nurse will perform the other interventions.","tip":"Generally speaking, assessment is the first step of the nursing process. In-depth assessment is deferred if the patient is critically distressed and the question supplies enough information for the nurse to select and perform emergency actions.","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"S Cognitive Level: Applying Cognitive Skill: Take Action"},"note":"","keyText":"1, 3, 4","img":[{"src":"img/c0036.webp","w":1100,"h":779}],"type":"multi","nopts":10,"key":[1,3,4]},{"id":"casestudy11-32","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":32,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Tension pneumothorax is a medical emergency that occurs when air enters the pleural space, but cannot escape. Pressure builds up on the affected lung, heart, and the great vessels. A mediastinal shift occurs when continued pressure pushes against the unaffected lung and oxygenation and perfusion are further compromised. For Mr. U, the tension pneumothorax is most likely to be associated with the chest tube. Tachycardia, not bradycardia, is expected. Hemoptysis is more likely to occur with a hemopneumothorax. Paradoxical chest movements are associated with flail chest secondary to rib fractures.","tip":"Learn to recognize the signs and symptoms of life-threatening conditions because interventions need to be immediately initiated.","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"S","Cognitive Level":"Applying","Cognitive Skill":"Recognize Cues"},"note":"","keyText":"1, 2, 3, 4, 6, 7, 9, 11","img":[{"src":"img/c0037.webp","w":1100,"h":41},{"src":"img/c0038.webp","w":1100,"h":619}],"type":"multi","nopts":11,"key":[1,2,3,4,6,7,9,11]},{"id":"casestudy11-33","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":33,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer t mpanionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"For Mr. U, the tension pneumothorax has most likely been induced iatrogenically by the covering of the chest wound. (For patients without open chest wounds, the priority action is performing a needle thoracotomy.) Initiating CPR is inappropriate at this point. Having the crash cart and intubation equipment nearby is a precaution but should not delay other interventions.","tip":"","meta":{"Focus":"Prioritization","Concept":"Gas Exchange","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"Mr. U (pulmonary resection) has developed a tension pneumothorax. He is currently receiving high-flow oxygen via a nonrebreather mask but continues to experience respiratory distress. What is the priority action?","opts":["Remove the occlusive dressing around the chest wound.","Perform a needle thoracotomy with a 14- to 16-gauge catheter needle.","Initiate cardiopulmonary resuscitation (CPR).","Call for the crash cart and intubation equipment."],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy11-35","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":35,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Using the SBAR format, the nurse first identifies himself or herself, gives the patient’s name, and describes the current situation. Next, relevant background information, such as the patient’s diagnosis, medications, and laboratory data, is reported. The assessment includes both patient assessment data that are of concern and the nurse’s analysis of the situation. Finally, the nurse makes a recommendation indicating what action he or she thinks is needed.","tip":"","meta":{"Focus":"Prioritization","Concept":"Communication","QSEN":"TC, QI","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"2, 1, 4, 3","stem":"The team leader is calling the HCP to report events related to Mr. U’s (pulmonary resection complicated by tension pneumothorax) condition. Prioritize the following information according to the SBAR (situation, background, assessment, recommendation) format.","opts":["“Mr. U is 5 days postoperative for pulmonary resection for non–small cell lung cancer. He has a chest tube that has been draining progressively smaller amounts of dark red blood.”","“Dr. S, this is Nurse C on the medical-surgical oncology unit. I am calling about Mr. U. About 15 minutes ago, he developed severe respiratory distress, and tracheal deviation was noted. We removed the occlusive dressing at the chest tube insertion site, and his breathing improved. The rapid response team was called and is currently managing the airway. He is receiving 100% oxygen via a nonrebreather mask.”","“The rapid response team is recommending transfer to the ICU because the exact cause of the tension pneumothorax is undetermined. The radiology department is waiting to do a portable chest radiograph if we could get an order. Would you like us to get an arterial blood gas analysis or do anything else?”","“Mr. U is currently alert and anxious, and he is following commands. Blood pressure is 160/96 mm Hg, pulse rate is 110 beats/min, respiratory rate is 32 breaths/min, and pulse oximetry reading is 90% with the patient on 100% oxygen via nonrebreather mask.”"],"nopts":4,"key":[2,1,4,3],"type":"order"},{"id":"casestudy11-36","topic":"onc","topicName":"Oncology","source":"Case Study 11: Multiple Patients With Cancer","srcShort":"Case Study 11","num":36,"ctx":[{"text":"The RN is the leader of a team caring for patients on a medical-surgical oncology unit. In addition to the leader, the team includes an experienced chemotherapy-certified RN, a new assistive personnel (AP), and a first-semester nursing student. The morning hand-off report includes the following information: (Note to student: This case study includes six patients; take notes as though you were listening to the morning report and refer to your notes as you work through the case study.) • Mr. N, a 68-year-old man, went to see his health care provider (HCP) with fever, weight loss, and painless axillary nodes. After a lymph node biopsy, non-Hodgkin lymphoma was diagnosed. He is receiving chemotherapy and is on neutropenic precautions. He is currently afebrile, in good spirits, and feels reasonably well. • Mr. L, a 50-year-old man, was transferred 6 days ago from the surgical intensive care unit (ICU) after a tracheostomy and partial laryngectomy. He has a soft, small-bore nasogastric (NG) tube and a tracheostomy tube and is currently receiving chemotherapy. He received radiation therapy before surgery. • Mr. B, a 59-year-old man, went to his HCP with painless hematuria, and bladder cancer was subsequently diagnosed. He was admitted for intravesical chemotherapy. He received procedure-related teaching before admission. He is alert and conversant, and he independently performs activities of daily living (ADLs). • Ms. C, a 70-year-old woman, went to her HCP because of rectal bleeding and a change in bowel habits. She underwent a bowel resection and colostomy 5 days ago. She is progressing well but needs and likes companionship at the bedside. • Ms. G, a 65-year-old woman, was admitted for a right breast lumpectomy; it is scheduled for later in the day. Radiation therapy is planned as part of the follow-up treatment. She appears nervous and tearful and is frequently asking questions. • Mr. U, a 62-year-old man, has a history of cough, hemoptysis, fatigue, and dyspnea. After bronchoscopy and sputum cytologic analysis, non–small cell lung cancer was diagnosed. He underwent pulmonary resection 5 days ago and has a chest tube drainage system. He is having significant and continuous pain. A patient-controlled analgesia (PCA) pump is being considered, but Mr. U expresses reluctance to use it.","intro":true}],"why":"Determining what tasks and duties are pending and seeking replacement coverage are all appropriate. Because she is new, verbal warnings are appropriate. Any employee could have a personal emergency at any time, so refusing to let her go or expecting disclosure of personal details would only be used if her behavior is repetitive.","tip":"","meta":{"Focus":"Supervision, Assignment","Concept":"Leadership: QSEN: TC","Cognitive Level":"Analyzing","IPEC":"R/R"},"note":"","keyText":"1, 2, 3, 4, 6","stem":"There are 2 hours left before the shift ends. The new AP tells the team leader that she must leave now because she has a family emergency. What should the team leader do? Select all that apply.","opts":["Ask her what tasks and duties are pending for the next 2 hours.","Ask another AP who is scheduled for the next shift to come early.","Allow her to leave but remind her that she is still on probation as a new staff member.","Call another unit and see if there is an AP who could float to the unit.","Ask her to explain the nature of the family emergency so that a decision can be made.","Check with the other staff members to see if they will be able to cover her duties."],"nopts":6,"key":[1,2,3,4,6],"type":"multi"},{"id":"chapter1-12","topic":"onc","topicName":"Oncology","source":"Chapter 1: Pain","srcShort":"Chapter 1","num":12,"ctx":[],"why":"Cancer pain generally worsens with disease progression, and the use of opioids is more generous. Fibromyalgia is more likely to be treated with non-opioid and adjuvant medications. Trigeminal neuralgia is treated with antiseizure medications such as carbamazepine. Phantom limb pain usually subsides after ambulation begins.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Pain","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"Which patient is most likely to receive opioids for extended periods of time?","opts":["A patient with fibromyalgia","A patient with phantom limb pain in the leg","A patient with progressive pancreatic cancer","A patient with trigeminal neuralgia"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter1-37","topic":"onc","topicName":"Oncology","source":"Chapter 1: Pain","srcShort":"Chapter 1","num":37,"ctx":[],"why":"The patient with cancer needs morphine for symptom relief. For obstetric patients, morphine can suppress fetal respiration and uterine contractions, so regional or epidural methods are preferred. For head injuries, morphine could make evaluation of mental status more difficult. In addition, if respirations are depressed, intracranial pressure could increase. Opioids are usually not the first-line choice for chronic pain, and opioids must be used with caution in older adult patients because of changes related to aging, such as renal clearance. In addition, use of opioids increases the risk for falls and contributes to constipation.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP, S","Concept":"Pain","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"For which of these patients is IV morphine the first-line choice for pain management?","opts":["A 33-year-old intrapartum patient needs pain relief for labor contractions.","A 24-year-old patient reports severe headache related to being hit in the head.","A 56-year-old patient reports breakthrough bone pain related to multiple myeloma.","A 73-year-old patient reports chronic pain associated with hip replacement surgery."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter6-1","topic":"onc","topicName":"Oncology","source":"Chapter 6: Respiratory Problems","srcShort":"Chapter 6","num":1,"ctx":[],"why":"Hoarseness often gets worse during treatment with radiation therapy. The nurse should reassure the patient that this usually improves within 6 to 8 weeks after therapy is completed. Strategies that may help during radiation therapy include voice rest with use of alternative means of communication, as well as saline gargles or sucking on ice chips. Elevating the head of the bed may help with oxygenation but will not help with hoarseness. Responses 3 and 4 are important but do not speak directly to the patient’s concern.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Comfort","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"The nurse is providing care for a patient diagnosed with laryngeal cancer who is receiving radiation therapy. The patient tells the nurse that he is experiencing hoarseness and difficulty with speaking. What is the nurse’s best response?","opts":["“Let’s elevate the head of your bed and see if that helps.”","“Your voice should improve in 6 to 8 weeks after completion of the radiation.”","“Sometimes patients also experience dry mouth and difficulty with swallowing.”","“I will call your health care provider and let him know about this.”"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter6-12","topic":"onc","topicName":"Oncology","source":"Chapter 6: Respiratory Problems","srcShort":"Chapter 6","num":12,"ctx":[],"why":"The new RN is at an early point in orientation. The most appropriate patients to assign to the new RN are those in stable condition who require routine care. The patient with the lobectomy will require the care of an experienced nurse, who will perform frequent assessments and monitoring for postoperative complications. The patient admitted with newly diagnosed esophageal cancer will also benefit from care by an experienced nurse. This patient may have questions and needs a comprehensive admission assessment. The newly diagnosed diabetic patient will need much teaching as well as careful monitoring. As the new nurse advances through orientation, the preceptor will want to work with him or her in providing care for patients with more complex needs.","tip":"","meta":{"Focus":"Assignment, Supervision","QSEN":"TC, S","Concept":"Collaboration","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"1, 2, 6","stem":"The nurse is acting as preceptor for a newly graduated RN during the second week of orientation. The nurse would assign and supervise the new RN to provide nursing care for which patients? Select all that apply.","opts":["A 38-year-old patient with moderate persistent asthma awaiting discharge","A 63-year-old patient with a tracheostomy needing tracheostomy care every shift","A 56-year-old patient with lung cancer who has just undergone left lower lobectomy","A 49-year-old patient just admitted with a new diagnosis of esophageal cancer","A 76-year-old patient newly diagnosed with type 2 diabetes","A 69-year-old patient with emphysema to be discharged tomorrow"],"nopts":6,"key":[1,2,6],"type":"multi"},{"id":"chapter6-36","topic":"onc","topicName":"Oncology","source":"Chapter 6: Respiratory Problems","srcShort":"Chapter 6","num":36,"ctx":[],"why":"Removal of large quantities of fluid from the pleural space can cause fluid to shift from the circulation into the pleural space, causing hypotension and tachycardia. The patient may need to receive IV fluids to correct this. The other data indicate that the patient needs ongoing monitoring or interventions but would not be unusual findings for a patient with this diagnosis or after this procedure.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S, TC","Concept":"Clinical Judgment","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"3","stem":"The nurse has just finished assisting the health care provider (HCP) with a thoracentesis for a patient with recurrent left pleural effusion caused by lung cancer. The thoracentesis removed 1800 mL of fluid. Which patient assessment information is most important to report to the HCP?","opts":["The patient starts crying and says she can’t go on with treatment much longer.","The patient reports sharp, stabbing chest pain with every deep breath.","The blood pressure is 100/48 mm Hg, and the heart rate is 102 beats/min.","The dressing at the thoracentesis site has 1 cm of bloody drainage."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter8-1","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":1,"ctx":[],"why":"The most important assessment to carry out before the procedure is to review the platelet count to ensure that the platelets are within normal limits. A complication of a bone marrow aspiration is bleeding and platelets are necessary for normal clotting to take place. The RN should also review the prothrombin time, partial thromboplastin time, and international normalized ratio for the same reason. A patient’s DNR status should be reviewed in case of an emergency on all ill patients as a general rule. The leukocyte count in leukemia is expected to be altered and is not important when considering the bleeding complication. Usually it is not necessary for a patient to be NPO before the procedure.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"Safety","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"The RN is preparing to have a patient who has acute leukemia sign the permit for a bone marrow aspiration. The patient states that the oncologist has explained the procedure and the complications, and she has no further questions. What assessment is most important for the RN to complete before the procedure is carried out?","opts":["Review the patient’s do-not-resuscitate (DNR) status.","Review the platelet count.","Review the leukocyte count.","Ask when the patient ate last."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter8-6","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":6,"ctx":[],"why":"Leukocytosis is an adverse effect of filgrastim and indicates a need to stop the medication or decrease dosage. Bone pain is a common adverse effect as the bone marrow starts to produce more neutrophils; the patient should receive analgesics, but the medication will be continued. Stinging with injection may occur; the nurse should administer the medication more slowly. The patient’s platelet count is low and should be reported, but the level of 110,000 mm3 (110 × 109/L) does not increase risk for spontaneous bleeding.","tip":"","meta":{"Focus":"Prioritization","Concept":"Safety","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"A patient with chemotherapy-related neutropenia is receiving filgrastim injections. Which finding by the nurse is most important to report to the health care provider?","opts":["The patient says, “My bones are aching.”","The patient’s platelet count is 110,000 mm3 (110 × 109/L).","The patient’s white blood cell count is 39,000 mm3 (39.0 × 109/L).","The patient reports that the medication stings when it is injected."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter8-12","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":12,"ctx":[],"why":"Patients with pancytopenia are at higher risk for infection. The patient with digoxin toxicity presents the least risk of infecting the new patient. Viral pneumonia, shingles, and cellulitis are infectious processes.","tip":"","meta":{"Focus":"Prioritization","Concept":"Infection","QSEN":"Safety","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The nurse is making a room assignment for a newly arrived patient whose laboratory test results indicate pancytopenia. Which patient will be the best roommate for the new patient?","opts":["Patient with digoxin toxicity","Patient with viral pneumonia","Patient with shingles","Patient with cellulitis"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter8-13","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":13,"ctx":[],"why":"Because nonsteroidal anti-inflammatory drugs will decrease platelet aggregation, patients with thrombocytopenia should not use ibuprofen routinely. Patient teaching about this should be included in the care plan. Bruising is consistent with the patient’s admission problem of thrombocytopenia. Soft, dark brown stools indicate that there is no frank or occult blood in the bowel movements. Although the patient’s decreased appetite requires further assessment by the nurse, this is a common complication of chemotherapy.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"A 67-year-old patient who is receiving chemotherapy for lung cancer is admitted to the hospital with thrombocytopenia. Which statement made by the patient when the nurse is obtaining the admission history is of most concern?","opts":["“I’ve noticed that I bruise more easily since the chemotherapy started.”","“My bowel movements are soft and dark brown.”","“I take ibuprofen every day because of my history of osteoarthritis.”","“My appetite has decreased since the chemotherapy started.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter8-19","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":19,"ctx":[],"why":"More assessment about what the patient means is needed before any interventions can be planned or implemented. All of the other statements indicate an assumption that the patient is afraid of dying of Hodgkin disease, which may not be the case.","tip":"When determining how to respond to a patient concern or comment, always consider whether further assessment or clarification is needed before appropriate actions can be planned and implemented.","meta":{"Focus":"Prioritization","Concept":"Coping","QSEN":"PCC","IPEC":"I/C","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"A 22-year-old patient with stage I Hodgkin disease is admitted to the oncology unit for radiation therapy. During the initial assessment, the patient tells the nurse, “Sometimes I’m afraid of dying.” Which response is most appropriate at this time?","opts":["“Many individuals with this diagnosis have some fears.”","“Perhaps you should ask the doctor about medication.”","“Tell me a little bit more about your fear of dying.”","“Most people with stage I Hodgkin disease survive.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter8-20","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":20,"ctx":[],"why":"Any temperature elevation in a neutropenic patient may indicate the presence of a life-threatening infection, so actions such as drawing blood for culture and administering antibiotics should be initiated quickly. The other patients need to be assessed as soon as possible but are not critically ill.","tip":"","meta":{"Focus":"Prioritization","Concept":"Infection","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"After the nurse receives a change-of-shift report, which patient should be seen first?","opts":["A 26-year-old patient with thalassemia who has a hemoglobin level of 8 g/dL (80 g/L) and orders for a blood transfusion","A 44-year-old patient admitted 3 days previously for sickle cell crisis who is scheduled for a computed tomographic scan","A 50-year-old patient with stage IV non-Hodgkin lymphoma who is crying and saying, “I’m not ready to die”","A 69-year-old patient with chemotherapy-induced neutropenia who has an oral temperature of 100.1°F (37.8°C)"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter8-24","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":24,"ctx":[],"why":"The leg numbness may indicate spinal cord compression, which should be evaluated and treated immediately by the health care provider to prevent further loss of function. Chronic bone pain, hyperuricemia, and the presence of Bence Jones proteins in the urine all are typical of multiple myeloma and do require assessment or treatment; however, the loss of motor or sensory function is an emergency.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"S"},"note":"","keyText":"4","stem":"The nurse obtains the following data about a patient admitted with multiple myeloma. Which information requires the most rapid action by the nurse?","opts":["The patient reports chronic bone pain.","The blood uric acid level is very elevated.","The 24-hour urine test shows Bence Jones proteins.","The patient reports new-onset leg numbness."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter8-28","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":28,"ctx":[],"why":"Because many aspects of nursing care need to be modified to prevent infection when a patient has a low absolute neutrophil count, care should be provided by the staff member with the most experience with neutropenic patients. The other staff members have the education required to care for this patient but are not as clinically experienced. When LPN/LVN staff members are given acute care patient assignments, they must work under the supervision of an RN. The LPN/LVN in this case would report to the RN assigned to the patient.","tip":"","meta":{"Focus":"Assignment","Concept":"Care Coordination","QSEN":"T/C","IPEC":"I/C","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"A patient with an absolute neutrophil count of 300/µL (0.3 × 109/L) is admitted to the oncology unit. Which staff member should the charge nurse assign to provide care for this patient, under the supervision of an experienced oncology RN?","opts":["LPN/LVN who has floated from the same-day surgery unit","RN from a staffing agency who is being oriented to the oncology unit","LPN/LVN with 2 years of experience on the oncology unit","RN who recently transferred to the oncology unit from the emergency department"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter8-29","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":29,"ctx":[],"why":"A patient with neutropenia is at increased risk for infection, and the nurse who will be receiving the patient needs to know about the neutropenia to make decisions about the patient’s room assignment and to plan care. The other information will also impact planning for patient care, but the charge nurse needs the information about neutropenia before the patient is transferred.","tip":"","meta":{"Focus":"Prioritization","Concept":"Communication","QSEN":"T/C","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"The nurse is transferring a patient with newly diagnosed chronic myeloid leukemia to a long-term care facility. Which information is most important to communicate to the nurse at the long-term care facility before transferring the patient?","opts":["Philadelphia chromosome is present in the patient’s blood smear.","The patient’s glucose level is elevated as a result of prednisone therapy.","There has been a 20-lb (9.1-kg) weight loss over the last year.","The patient’s chemotherapy has resulted in neutropenia."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter8-30","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":30,"ctx":[],"why":"Fatal hyperkalemia may be caused by tumor lysis syndrome, a potentially serious consequence of chemotherapy in acute leukemia. The other symptoms also indicate a need for further assessment or interventions but are not as critical as the elevated potassium level, which requires immediate treatment.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluids and Electrolytes","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"A patient with acute myelogenous leukemia is receiving induction-phase chemotherapy. Which assessment finding requires the most rapid action?","opts":["Serum potassium level of 7.8 mEq/L (7.8 mmol/L)","Urine output less than intake by 400 mL","Inflammation and redness of the oral mucosa","Ecchymoses present on the anterior trunk"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter8-32","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":32,"ctx":[],"why":"Skin care is included in the AP’s education and job description. Assessment and patient teaching are more complex tasks that should be delegated to RNs. Because the patient’s clothes need to be carefully chosen to prevent irritation or damage to the skin, the RN should assist the patient with this.","tip":"","meta":{"Focus":"Delegation","Concept":"Care Coordination","QSEN":"T/C","IPEC":"R/R","Cognitive Level":"Application"},"note":"","keyText":"4","stem":"A patient with Hodgkin lymphoma who is receiving radiation therapy to the groin area has skin redness and tenderness in the area being irradiated. Which nursing activity should the nurse delegate to the assistive personnel (AP) caring for the patient?","opts":["Checking the skin for signs of redness or peeling","Assisting the patient in choosing appropriate clothing","Explaining good skin care to the patient and family","Cleaning the skin over the area daily with a mild soap"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter8-33","topic":"onc","topicName":"Oncology","source":"Chapter 8: Hematologic Problems","srcShort":"Chapter 8","num":33,"ctx":[],"why":"The newly admitted patient should be assessed first because the baseline assessment and plan of care need to be completed. The other patients also need assessments or interventions but do not need immediate nursing care.","tip":"","meta":{"Focus":"Prioritization","Concept":"Care Coordination","QSEN":"S","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"After the nurse receives the change-of-shift report, which patient should be assessed first?","opts":["A 20-year-old patient with possible acute myelogenous leukemia who has just arrived on the medical unit","A 38-year-old patient with aplastic anemia who needs teaching about decreasing infection risk before discharge","A 40-year-old patient with lymphedema who requests help in putting on compression stockings before getting out of bed","A 60-year-old patient with non-Hodgkin lymphoma who is refusing the prescribed chemotherapy regimen"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter9-36","topic":"onc","topicName":"Oncology","source":"Chapter 9: Neurologic Problems","srcShort":"Chapter 9","num":36,"ctx":[],"why":"The inability to recognize family members is a new neurologic deficit for this patient and indicates a possible increase in intracranial pressure (ICP). This change should be communicated to the health care provider immediately so that treatment can be initiated. The continuing headache also indicates that the ICP may be elevated but is not a new problem. The glucose elevation and weight gain are common adverse effects of dexamethasone that may require treatment but are not emergencies.","tip":"","meta":{"Focus":"Prioritization","Concept":"Intracranial Regulation","QSEN":"PCC, S","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The nurse is caring for a patient with a glioblastoma who is receiving dexamethasone 4 mg IV push every 6 hours to relieve symptoms of right arm weakness and headache. Which assessment information concerns the nurse the most?","opts":["The patient no longer recognizes family members.","The blood glucose level is 234 mg/dL (13 mmol/L).","The patient reports a continuing headache.","The daily weight has increased 2.2 lb (1 kg)."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter12-13","topic":"onc","topicName":"Oncology","source":"Chapter 12: Gastrointestinal and Nutritional Problems","srcShort":"Chapter 12","num":13,"ctx":[],"why":"Nausea and vomiting are common after chemotherapy. Administration of antiemetics and fluid monitoring can be done by an LPN/LVN. The RN should perform the preoperative teaching for the glossectomy patient. Patients returning from surgery need extensive assessment. The patient with anorexia is showing signs of hypokalemia and is at risk for cardiac dysrhythmias.","tip":"","meta":{"Focus":"Assignment","QSEN":"TC","Concept":"Clinical Judgment","Cognitive Level":"Analyzing","IPEC":"R/R"},"note":"","keyText":"4","stem":"Which patient is the most appropriate to assign to an LPN/LVN under the supervision of an RN?","opts":["A patient with oral cancer who is scheduled for a glossectomy in the morning","An obese patient who has returned from surgery after a vertical banded gastroplasty","A patient with anorexia nervosa who has muscle weakness and decreased urine output","A patient with intermittent nausea and vomiting after chemotherapy"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter15-6","topic":"onc","topicName":"Oncology","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":6,"ctx":[],"why":"An LPN/LVN who is experienced in working with postoperative patients will know how to monitor for pain, bleeding, or swelling and will notify the supervising RN. Patient teaching requires more education and a broader scope of practice and is appropriate for RN staff members.","tip":"","meta":{"Focus":"Assignment","Concept":"Care Coordination","QSEN":"T/C","IPEC":"R/R","Cognitive Level":"Application"},"note":"","keyText":"3","stem":"The nurse is caring for a patient who has just had a squamous cell carcinoma removed from the face. Which action can be assigned to an experienced LPN/LVN?","opts":["Teaching the patient about risk factors for squamous cell carcinoma","Showing the patient how to care for the surgical site at home","Monitoring the surgical site for swelling, bleeding, or pain","Discussing the reasons for avoiding aspirin use for 1 week after surgery"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter15-20","topic":"onc","topicName":"Oncology","source":"Chapter 15: Integumentary Problems","srcShort":"Chapter 15","num":20,"ctx":[],"why":"The highest priority problems for this patient are pain and inadequate nutrition. Administration of analgesics is the most important action because the patient’s acute oral pain will need to be controlled to increase the ability to eat and to improve nutrition. The patient’s concern about appearance and refusal to see visitors are also concerns but are not as high priority as the need for pain control and improved nutrition.","tip":"","meta":{"Focus":"Prioritization","Concept":"Tissue Integrity","QSEN":"EBP","Cognitive Level":"Evaluating"},"note":"","keyText":"2","img":[{"src":"img/c0018.webp","w":1100,"h":41},{"src":"img/c0019.webp","w":1100,"h":433}],"type":"single","nopts":4,"key":[2]},{"id":"chapter16-26","topic":"onc","topicName":"Oncology","source":"Chapter 16: Renal and Urinary Problems","srcShort":"Chapter 16","num":26,"ctx":[],"why":"Chemotherapy has limited effectiveness against renal cell carcinoma. This form of cancer is usually treated surgically with nephrectomy.","tip":"","meta":{"Focus":"Supervision, Prioritization","Concept":"Communication","QSEN":"EBP","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"2","stem":"The nurse is caring for a patient with renal cell carcinoma (adenocarcinoma of the kidney). While serving as preceptor for a new nurse orienting to the unit, the nurse is asked why this patient is not receiving chemotherapy. What is the best response?","opts":["“The prognosis for this form of cancer is very poor, and we will be providing only comfort measures.”","“Nephrectomy is the preferred treatment because chemotherapy has been shown to have only limited effectiveness against this type of cancer.”","“Research has shown that the most effective means of treating this form of cancer is with radiation therapy.”","“Radiofrequency ablation is a minimally invasive procedure that is the best way to treat renal cell carcinoma.”"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter17-1","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":1,"ctx":[],"why":"Spotting or bleeding after a woman has been in menopause for over a year can be a sign of uterine or ovarian cancer. Vaginal dryness, painful sex, and stress incontinence are common signs and symptoms of menopause and can be treated but are not considered a priority.","tip":"","meta":{"Focus":"Prioritization","Concept":"Reproduction","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"A 59-year-old postmenopausal woman is being interviewed by the nurse. Which statement made by the patient requires the nurse to notify the health care provider immediately?","opts":["“Every time I cough or sneeze, I spill a little urine.”","“My vagina feels so dry and uncomfortable.”","“I thought getting my period was finally over but I started bleeding again.”","“Having sex is so painful and uncomfortable.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter17-5","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":5,"ctx":[],"why":"Irregularly shaped and nontender lumps are consistent with a diagnosis of breast cancer, so this patient needs immediate referral for diagnostic tests such as mammography or ultrasonography. The other information is not unusual and does not indicate the need for immediate action.","tip":"Remember to investigate further when a patient has a nontender lump or swelling because lumps that are not painful are a common clinical manifestation of cancer in areas such as the breasts or lymph tissues. Pain is rarely an early manifestation of cancer but occurs as tumors grow and place pressure on other organs or tissues.","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"EBP","Cognitive Level":"Application"},"note":"","keyText":"4","stem":"While performing a breast examination on a 22-year-old patient, the nurse obtains these data. Which finding is of most concern?","opts":["Both breasts have many nodules in the upper outer quadrants.","The patient reports bilateral breast tenderness with palpation.","The breast on the right side is slightly larger than the left breast.","An irregularly shaped, nontender lump is palpable in the left breast."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter17-6","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":6,"ctx":[],"why":"An LPN/LVN working in a postanesthesia care unit would be expected to check dressings for bleeding and alert RN staff members if bleeding occurs. The other tasks are more appropriate for nursing staff with RN-level education and licensure.","tip":"","meta":{"Focus":"Assignment","Concept":"Cellular Regulation","QSEN":"T/C","IPEC":"R/R","Cognitive Level":"Application"},"note":"","keyText":"1","stem":"After undergoing a modified radical mastectomy, a patient is transferred to the postanesthesia care unit. Which nursing action is best to assign to an experienced LPN/LVN?","opts":["Monitoring the patient’s dressing for any signs of bleeding","Documenting the initial assessment on the patient’s chart","Communicating the patient’s status report to the charge nurse on the surgical unit","Teaching the patient about the importance of using pain medication as needed"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter17-7","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":7,"ctx":[],"why":"Positioning the patient’s arm is a task within the scope of practice for the AP working on a surgical unit. Patient teaching and assessment are RN-level skills. The RN should reinforce dressings as necessary because this requires assessment of the surgical site and possible communication with the surgeon.","tip":"","meta":{"Focus":"Delegation","Concept":"Cellular Regulation","QSEN":"T/C","IPEC":"R/R","Cognitive Level":"Application"},"note":"","keyText":"2","stem":"The nurse is working with an assistive personnel (AP) to care for a patient who has had a right breast lumpectomy and axillary lymph node dissection. Which nursing action can be delegated to the AP?","opts":["Teaching the patient why blood pressure measurements are taken on the left arm","Elevating the patient’s arm on two pillows to promote lymphatic drainage","Assessing the patient’s right arm for lymphedema","Reinforcing the dressing if it becomes saturated"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter17-14","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":14,"ctx":[],"why":"Painless vaginal bleeding in postmenopausal women may indicate endometrial or cervical cancer and will require diagnostic testing such as endometrial biopsy. Breast atrophy, vaginal dryness and painful intercourse, and hot flashes are common after menopause, although these symptoms should also be discussed with the HCP and may need treatment.","tip":"","meta":{"Focus":"Prioritization","Concept":"Reproduction","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"The nurse obtains this information when taking the health history of a 56-year-old postmenopausal woman. Which information is most important to report to the health care provider (HCP)?","opts":["Sagging of breasts bilaterally","Vaginal dryness and painful intercourse","Hot flashes occurring during the night","Occasional painless vaginal bleeding"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter17-15","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":15,"ctx":[],"why":"Current guidelines state that there is no effective screening tool for low-risk women, but women who are high risk because of family history or the BRCA genes may be screened with transvaginal ultrasonography and serum marker CA-125 levels. The other statements are accurate but do not respond as well to the patient’s concern.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"EBP","Cognitive Level":"Application"},"note":"","keyText":"3","stem":"The nurse is interviewing a woman who is in the clinic for a well woman examination, and the woman requests a screening test for ovarian cancer. Which response by the nurse is best?","opts":["“Only a small number of ovarian cancers are diagnosed at an early stage.”","“There is no effective screening test for ovarian cancer in low-risk women.”","“Benefits of ovarian cancer screening will depend on your medical history.”","“Ovarian cancer screening will probably not be covered by your insurance.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter17-18","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":18,"ctx":[],"why":"Administration of opioids and the associated patient monitoring are included in LPN/LVN education and scope of practice. Assessments and teaching are more complex skills that require RN-level education and are best accomplished by an RN with experience in caring for patients with this diagnosis.","tip":"","meta":{"Focus":"Assignment","Concept":"Cellular Regulation","QSEN":"T/C","IPEC":"R/R","Cognitive Level":"Application"},"note":"","keyText":"2","stem":"The nurse is caring for a 21-year-old patient who had a left orchiectomy for testicular cancer on the previous day. Which nursing activity will be best to assign to an LPN/LVN?","opts":["Educating the patient about postorchiectomy chemotherapy and radiation","Administering the prescribed as needed oxycodone to the patient","Teaching the patient how to do testicular self-examination on the remaining testicle","Assessing the patient’s knowledge level about postorchiectomy fertility"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter17-19","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":19,"ctx":[],"why":"An RN from the emergency department would be experienced in assessment and management of pain. Because of their diagnoses and treatments, the other patients should be assigned to RNs who are experienced in caring for patients with cancer.","tip":"When making assignments for nurses who have floated to a specialty area, it is best to assign the float nurse to patients who require actions that are commonly used in many areas of nursing, such as administration of analgesics, dressing changes, and fluid infusions.","meta":{"Focus":"Assignment","Concept":"Care Coordination","QSEN":"T/C","IPEC":"R/R","Cognitive Level":"Application"},"note":"","keyText":"3","stem":"Which patient is best for the oncology unit charge nurse to assign to an RN who has floated from the emergency department?","opts":["Patient who needs doxorubicin chemotherapy to treat metastatic breast cancer","Patient who needs discharge teaching after surgery for stage II ovarian cancer","Patient with metastatic prostate cancer who requires frequent assessment and treatment for breakthrough pain","Patient with testicular cancer who requires preoperative teaching about orchiectomy and lymph node resection"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter17-26","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":26,"ctx":[],"why":"Current guidelines indicate that Pap testing should be started at age 21 years, regardless of when a woman has become sexually active. The 19-year-old patient should be counseled that there is an increased risk for cervical cancer associated with sexual activity before age 17 years and encouraged to schedule Pap testing, human papillomavirus testing, or both at age 21 years. The 33-year-old patient will need screening every 3 years, and the 67-year-old will not need further Pap screening if she has had several normal Pap test results within the past 2 to 3 years.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"EBP","Cognitive Level":"Application"},"note":"","keyText":"2","stem":"The clinic nurse reviews information about four patients who are requesting Pap testing. Which patient needs to be scheduled first?","opts":["A 19-year-old patient who first had intercourse at age 13 years","A 25-year-old patient who has never had a pelvic examination","A 33-year-old patient who had a normal Pap test 2 years previously","A 67-year-old patient who says her previous Pap test results have been normal"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter17-27","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":27,"ctx":[],"why":"Right calf swelling and tenderness indicate the possible presence of deep vein thrombosis. This will change the plan of care because the patient may be placed on bed rest and will require diagnostic testing and possible anticoagulant therapy. The other data indicate the need for common postoperative nursing actions such as having the patient cough, assessing her pain, and increasing her fluid intake.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"EBP","Cognitive Level":"Application"},"note":"","keyText":"2","stem":"When assessing a patient with cervical cancer who had a total abdominal hysterectomy yesterday, the nurse obtains the following data. Which information has the most immediate implications for planning of the patient’s care?","opts":["Fine crackles are audible at the lung bases.","The patient’s right calf is swollen, and she reports mild calf tenderness.","The patient uses the patient-controlled analgesia device every 30 minutes.","Urine in the collection bag is amber and clear."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter17-28","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":28,"ctx":[],"why":"Patients with intracavitary implants are kept in bed during the treatment to avoid dislodgement of the implant. The other actions may also require the nurse to intervene by providing guidance to the student. Minimal time should be spent close to patients who are receiving internal irradiation. Asking the patient about her reaction to losing childbearing abilities may be inappropriate at this time. Patients are frequently placed on low-residue diets to decrease bowel distention while implants are in place.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"Safety","Cognitive Level":"Application"},"note":"","keyText":"3","stem":"The nurse is supervising a student nurse who is caring for a patient who has an intracavitary radioactive implant in place to treat cervical cancer. Which action by the student requires that the nurse intervene immediately?","opts":["Standing next to the patient for 5 minutes while assisting with her bath","Asking the patient how she feels about losing her childbearing ability","Assisting the patient to the bedside commode for a bowel movement","Offering to get the patient whatever she would like to eat or drink"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter17-31","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":31,"ctx":[],"why":"Testosterone is contraindicated in patients who have prostate cancer because it can promote the growth of prostate cancer. Although metformin is most commonly prescribed for type 2 diabetes, it can be helpful in restoring ovulation in patients with polycystic ovary syndrome. Sildenafil lowers blood pressure and should not be used by patients who are taking nitrates or alpha-adrenergic blockers but may be used in patients taking other antihypertensives. Progestin therapy alone will not treat infertility caused by endometriosis but may be used to shrink endometrial tissue.","tip":"","meta":{"Focus":"Prioritization","Concept":"Reproduction","QSEN":"Safety","Cognitive Level":"Application"},"note":"","keyText":"1","stem":"The nurse is reviewing medication lists for several patients. Which medication is most important for the nurse to question?","opts":["Testosterone transdermal gel for a patient who has prostate cancer","Metformin for a patient whose only diagnosis is polycystic ovary syndrome","Sildenafil for a patient who is also taking hydrochlorothiazide for hypertension","Methoprogesterone for a patient who has infertility associated with endometriosis"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter17-35","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":35,"ctx":[],"why":"LPN/LVN education includes vital sign monitoring after procedures such as paracentesis; an experienced LPN/LVN would recognize and report significant changes in vital signs to the RN. The paracentesis tray could be obtained by an AP. Patient admission assessment and teaching require RN-level education and experience, although part of the data gathering may be done by an LPN/LVN.","tip":"","meta":{"Focus":"Assignment","Concept":"Care Coordination","QSEN":"T/C","IPEC":"R/R","Cognitive Level":"Application"},"note":"","keyText":"3","stem":"The nurse is working on a medical unit staffed with LPNs/LVNs and assistive personnel (AP) when a patient with stage IV ovarian cancer and recurrent ascites is admitted for paracentesis. Which activity is best to assign to an experienced LPN/LVN?","opts":["Obtaining a paracentesis tray from the central supply area","Completing the short-stay patient admission form","Measuring vital signs every 15 minutes after the procedure","Providing discharge instructions after the procedure"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter17-38","topic":"onc","topicName":"Oncology","source":"Chapter 17: Reproductive Problems","srcShort":"Chapter 17","num":38,"ctx":[],"why":"The current guidelines, supported by nonrandomized screening trials and observational data, call for first-degree relatives of patients with the BRCA gene to be screened with both annual mammography and MRI. Although annual mammography, breast self-examination, and clinical breast examination by a health care provider may help to detect cancer, the best option for this patient is annual mammography and MRI.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"While the nurse is working in the clinic, a healthy 32-year-old woman whose sister is a carrier of the BRCA gene asks which form of breast cancer screening is the most effective for her. Which response is best?","opts":["“An annual mammogram is usually sufficient screening for women your age.”","“Monthly self-breast examination is recommended because of your higher risk.”","“A yearly breast examination by a health care provider should be scheduled.”","“Magnetic resonance imaging (MRI) is recommended in addition to annual mammography.”"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter19-4","topic":"onc","topicName":"Oncology","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":4,"ctx":[],"why":"National guidelines indicate that rapid treatment of infection in neutropenic patients is essential to prevent complications such as overwhelming sepsis and secondary infections; therefore the child with a fever and a low neutrophil count is the priority. A potassium level of 3.3 mEq/L (3.3 mmol/L) is borderline low and should be monitored. Nosebleeds are common, and the patient and parents should be taught to apply direct pressure to the nose, have the child sit upright, and not disturb the clot. Severe spontaneous hemorrhage is not expected until the platelet count drops below 20,000 mm3 (20 × 109/L). Children can withstand low hemoglobin levels. The nurse should help the patient and parents regulate activity to prevent excessive fatigue.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP, S","Concept":"Infection","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"The nurse is caring for several children with cancer who are receiving chemotherapy. The nurse is reviewing the morning laboratory results for each of the patients. Which patient condition combined with the indicated laboratory result would cause the nurse the greatest concern?","opts":["Nausea and vomiting with a potassium level of 3.3 mEq/L (3.3 mmol/L)","Epistaxis with a platelet count of 100,000/mm3 (100 × 109/L)","Fever with an absolute neutrophil count of 450/mm3 (450 × 109/L)","Fatigue with a hemoglobin level of 8 g/dL (80 g/L)"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter19-6","topic":"onc","topicName":"Oncology","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":6,"ctx":[],"why":"Help the mother to understand that the child may be angry about being left in the hospital or about her inability to prevent the illness and protect the child. Reminding the child about the food and the purpose of the food does not address the strong emotions underlying the outburst. Allowing the mother and child time alone is a possibility, but the assumption would be that the mother understands the child’s behavior and is prepared to deal with the behavior in a constructive manner. Asking the mother to leave the child suggests that the mother is a source of stress.","tip":"","meta":{"Focus":"Prioritization","QSEN":"PCC","Concept":"Development","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"A 6-year-old child who received chemotherapy and had anorexia is now cheerfully eating peanut butter, yogurt, and applesauce. When the mother arrives, the child refuses to eat and throws the dish on the floor. What is the nurse’s best response to this behavior?","opts":["Remind the child that foods tasted good today and will help her or his body to get strong.","Allow the mother and child time alone to review and control the behavior.","Ask the mother to leave until the child can finish eating and then invite her back.","Explain to the mother that the behavior could be a normal expression of anger."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter19-7","topic":"onc","topicName":"Oncology","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":7,"ctx":[],"why":"Helping the child to eat is within the scope of responsibilities for an AP. Assessing ability and willingness to drink and checking for extent of mucosal ulceration are the responsibilities of an RN. An 18-month-old child is not able to swish and spit, which could result in swallowing the mouthwash. Mouthwash is not intended for swallowing because it can contain alcohol and other ingredients not safe for ingestion.","tip":"","meta":{"Focus":"Delegation","QSEN":"TC","Concept":"Nutrition","Cognitive Level":"Applying","IPEC":"R/R"},"note":"","keyText":"4","stem":"An 18-month-old child has oral mucositis secondary to chemotherapy. Which task should the nurse delegate to the assistive personnel (AP)?","opts":["Reporting evidence of severe mucosal ulceration","Assisting the child in swishing and spitting mouthwash","Assessing the child’s ability and willingness to drink through a straw","Feeding the child a bland, moist, soft diet"],"nopts":4,"key":[4],"type":"single
