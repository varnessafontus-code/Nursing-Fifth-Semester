ctant to allow notification.","Patient arrived alert and conversant, but he initially had trouble focusing on questions."],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy5-19","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":19,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Ask the secretary to correct the omission by calling the admissions office right away. If the ED nurse has a good relationship with the ICU nurse, she or he will probably take the report; however, the ED nurse retains responsibility for the patient’s care until the admission procedure and transfer are completed. After the patient’s needs are met, the nurse could investigate the situation to determine if the admitting process can be improved. Writing an incident report would be appropriate, because the Joint Commission has a Core measure that addresses waiting times in the ED.","tip":"","meta":{"Focus":"Prioritization, Supervision","QSEN":"TC","Concept":"Clinical Judgment","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"2","stem":"The ED nurse is trying to call a report to the ICU but is told, “We were not notified about the admission.” What should the nurse do first?","opts":["Call the admissions office supervisor to resolve the delay.","Ask the unit secretary to call the admissions office now.","Write an incident report; a delay violates Joint Commission guidelines.","Ask the ICU nurse to take the report regardless of the clerical omission."],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy5-20","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":20,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Hyperglycemia should be reduced gradually, and in the critical phase if the blood glucose falls below 250 mg/dL (13.9 mmol/L), 5% or 10% IV glucose solution is added, and the insulin is continued.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Glucose Regulation","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"As the nurse is getting ready to transfer Mr. D to the ICU, the unit secretary hands the nurse the last blood glucose result, which is 150 mg/dL (8.33 mmol/L). What should the nurse do first?","opts":["Proceed with the transfer because blood glucose is trending toward the normal value.","Stop the insulin infusion, proceed with the transfer, and inform the ICU nurse on arrival.","Immediately notify the HCP and anticipate an order for IV fluid of 5% or 10% glucose.","Slow the insulin infusion and obtain an order to have the blood glucose redrawn."],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy5-21","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":21,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Before going straight to the charge nurse, the nurse should speak directly to the AP about the vital signs to problem solve and find a solution. This action builds trust and team building. The ICU nurse and the ED nurse are negotiating, which is fundamental to collaboration. For patients with DKA, fluids, rates of fluids, and medications are continuously adjusted according to the patient’s condition. By reading the nurse’s notes, the ED provider demonstrates respect and trust that the nurse has gathered valuable information that should be included in the overall summary of care.","tip":"","meta":{"Focus":"Prioritization, Supervision","QSEN":"TC","Concept":"Communication","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"4","stem":"Which member of the health care team is demonstrating a behavior that is an example of a barrier to interprofessional collaboration?","opts":["ICU nurse asks the ED nurse to hold the patient for 30 minutes until the shift change is over.","Admitting endocrinology specialist directs the ED nurse to change the rate of all IV fluids.","ED provider reviews the triage nurse’s admission notes before completing the provider summary.","ED nurse tells the charge nurse that the AP failed to record vital signs in a timely fashion."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy5-22","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":22,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"The AP can direct family and visitors to appropriate waiting areas, obtain equipment, and measure vital signs. An RN or HCP should accompany Mr. D to the ICU; the AP can help but should not independently transport patients to the ICU. The unit secretary usually prepares the papers, but the RN is responsible for ensuring that everything is in order. In specialty areas such as the ED, APs may receive additional training to connect patients’ cardiac leads to the cardiac monitor; however, the RN is responsible for ensuring the lead placement and for assessing the cardiac rhythm.","tip":"","meta":{"Focus":"Delegation","QSEN":"TC","Concept":"Care Coordination","Cognitive Level":"Analyzing","IPEC":"R/R"},"note":"","keyText":"1, 4, 5, 6","stem":"Which tasks can the nurse direct an experienced AP to perform to facilitate Mr. D’s transfer to the ICU? Select all that apply.","opts":["Giving Mr. D’s roommate directions to the ICU waiting room","Independently transporting Mr. D to the ICU","Collecting and organizing the chart and laboratory reports","Obtaining a portable oxygen tank and cardiac monitor","Connecting Mr. D’s ECG leads to the portable cardiac monitor","Obtaining the last set of vital sign values"],"nopts":6,"key":[1,4,5,6],"type":"multi"},{"id":"casestudy5-23","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":23,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"Option 2 shows ventricular tachycardia, which can be associated with an electrolyte imbalance, such as hypokalemia. This is a significant cause of death in patients with DKA. Option 1 shows normal sinus rhythm; note that one P wave normally precedes every QRS complex. Option 3 shows atrial fibrillation (AF). Patients with AF should be assessed for decreased cardiac output. Patients may tolerate AF, but this finding should be reported to the HCP because there is an increased risk for emboli. Option 4 shows artifact, which is usually caused by loose leads or patient movement.","tip":"Rhythm interpretation takes of practice, but ventricular dysrhythmias are among the most dangerous. Learn to differentiate normal from abnormal ECG findings and then focus your study on the most serious cardiac dysrhythmias.","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Perfusion"},"note":"","keyText":"2","img":[{"src":"img/c0029.webp","w":1100,"h":1030},{"src":"img/c0030.webp","w":1100,"h":341}],"type":"single","nopts":4,"key":[2]},{"id":"casestudy5-24","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":24,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"All of these signs and symptoms are associated with hypokalemia, except cold, clammy skin which occurs with hypoglycemia or decreased perfusion. Hypokalemia is a low level of potassium in the blood (normal: 3.5–5.0 mEq/L or 3.5-5 mmol/L). Potassium plays an important in nerve conduction and muscle contraction. The most serious complications are cardiac dysrhythmias with the potential for cardiac arrest.","tip":"","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid & Electrolyte Balance","Cognitive Level":"Applying","Cognitive Skill":"Recognize Cues"},"note":"","keyText":"1, 3, 4, 5, 6, 7, 8, 9, 10","img":[{"src":"img/c0031.webp","w":1100,"h":638}],"type":"multi","nopts":10,"key":[1,3,4,5,6,7,8,9,10]},{"id":"casestudy5-25","topic":"fe","topicName":"F&E / ABG","source":"Case Study 5: Diabetic Ketoacidosis","srcShort":"Case Study 5","num":25,"ctx":[{"img":[{"src":"img/c0027.webp","w":1100,"h":489}],"intro":true},{"img":[{"src":"img/c0028.webp","w":1100,"h":237}],"intro":false}],"why":"For protection of medical information, access is restricted to staff who are involved in the direct care of the patient. By job description, the quality assurance nurse has access to patient records for the purpose of reviewing the direct care and documentation provided by the nursing staff. Friends and family do not have access to medical records without specific consent of the patient. Students are allowed some access to medical records but only if they are involved in the direct care of patients. People conducting research may have access to patient records, but this involves a formal process to obtain research approval. Hospital employees, such as the chaplain, social worker, or nutritionist, may have access to some (or all) portions of the patient’s record but would not freely access the record unless they became involved in the patient’s care.","tip":"","meta":{"Focus":"Assignment, Supervision","QSEN":"TC, I","Concept":"Health Care Law","Cognitive Level":"Analyzing","IPEC":"R/R","Cognitive Skill":"Recognize Cues"},"note":"","keyText":"1, 2, 7, 9, 10","img":[{"src":"img/c0032.webp","w":1100,"h":516},{"src":"img/c0033.webp","w":1100,"h":438}],"type":"multi","nopts":10,"key":[1,2,7,9,10]},{"id":"chapter3-28","topic":"fe","topicName":"F&E / ABG","source":"Chapter 3: Immunologic Problems","srcShort":"Chapter 3","num":28,"ctx":[],"why":"The purpose of prednisone when given for rheumatoid arthritis, an autoimmune inflammatory disease, is to decrease the chronic inflammation in the joints that eventually causes cartilage and bone erosion from thickening of the synovium. Prednisone is a cortisone and like the cortisone normally produced in the body, affects the body’s balance of water and sodium. Prednisone can cause fluid retention for this reason. Furosemide must be ordered by the health care provider (HCP) so it is considered a medical intervention rather than a nursing intervention. Increasing trans fats promotes weight gain. The health care provider (HCP) should be notified of a 2 pound weight gain in one day or 5 or more pounds in one week. This may indicate worsening heart failure in this patient.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"PCC","Cognitive level":"Analyzing","Cognitive Skill":"Analyze cues, Take action"},"note":"","keyText":"Option 1, Inflammation; Option 2, Bone erosion; Option 3, Daily weights","img":[{"src":"img/c0009.webp","w":1100,"h":177},{"src":"img/c0010.webp","w":1100,"h":317}],"type":"reveal"},{"id":"chapter5-38","topic":"fe","topicName":"F&E / ABG","source":"Chapter 5: Safety and Infection Control","srcShort":"Chapter 5","num":38,"ctx":[],"why":"Because hypovolemia is a major concern with Ebola infection and IV fluid infusion has been demonstrated to improve outcomes, the nurse’s first action will be to infuse normal saline. Treatment of nausea and headache is appropriate and should be implemented next. There is no indication that this patient is hypoxemic, although patients with Ebola may develop multiorgan failure and require respiratory support.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluids and Electrolytes","QSEN":"PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"A patient who has been infected with the Ebola virus has an emesis of 750 mL of bloody fluid and complains of headache, nausea, and severe lightheadedness. Which action included in the treatment protocol should the nurse take first?","opts":["Give acetaminophen 650 mg PO.","Administer ondansetron 4 mg IV.","Infuse normal saline at 500 mL/hr.","Increase oxygen flow rate to 6 L/min."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter6-3","topic":"fe","topicName":"F&E / ABG","source":"Chapter 6: Respiratory Problems","srcShort":"Chapter 6","num":3,"ctx":[],"why":"When the need for oxygen is greater in the tissues, there is a curve shift to the right. This means that oxygen is dissociated from hemoglobin faster. Conditions that shift the curve to the right include increased body temperature, increased carbon dioxide concentration, and decreased pH or acidosis. This means that the hemoglobin unloads oxygen to the tissues because they need it to support the higher metabolism; this is a tissue protection that increases oxygen delivery to the tissues that need it the most.","tip":"","meta":{"Focus":"Prioritization, Supervision","QSEN":"TC","Concept":"Gas Exchange","Cognitive Level":"Analyzing"},"note":"","keyText":"4","img":[{"src":"img/c0014.webp","w":1100,"h":210},{"src":"img/c0015.webp","w":1100,"h":216},{"src":"img/c0016.webp","w":1100,"h":1006}],"type":"single","nopts":4,"key":[4]},{"id":"chapter6-29","topic":"fe","topicName":"F&E / ABG","source":"Chapter 6: Respiratory Problems","srcShort":"Chapter 6","num":29,"ctx":[],"why":"A nonrebreather mask can deliver nearly 100% oxygen. When the patient’s oxygenation status does not improve adequately in response to delivery of oxygen at this high concentration, refractory hypoxemia is present. Usually at this stage, the patient is working very hard to breathe and may go into respiratory arrest unless HCPs intervene by providing intubation and mechanical ventilation to decrease the patient’s work of breathing. Research has shown that patients with ARDS who are treated with conservative amounts of IV fluids while ventilated have improved lung function and shorter intensive care unit stays. Furosemide is a loop diuretic, which will not help with oxygenation.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Clinical Judgment","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"A patient with acute respiratory distress syndrome (ARDS) is receiving oxygen by nonrebreather mask, but arterial blood gas measurements continue to show poor oxygenation. Which action does the nurse anticipate that the health care provider (HCP) will prescribe?","opts":["Perform endotracheal intubation and initiate mechanical ventilation.","Begin IV normal saline at a high rate up to 250 mL per hour.","Administer furosemide (Lasix) 100 mg IV push immediately.","Call a code for respiratory arrest."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter7-1","topic":"fe","topicName":"F&E / ABG","source":"Chapter 7: Cardiovascular Problems","srcShort":"Chapter 7","num":1,"ctx":[],"why":"Glucophage should be withheld 24 hours before and 48 hours after cardiac catheterization. Contrast medium is used during a cardiac catherization and can affect kidney function, leaving the patient at an increased risk for lactic acidosis. The rest of the medications do not need to be withheld for longer than the recommended time the patient would need to be NPO.","tip":"","meta":{"Focus":"Priority","Concept":"Perfusion","QSEN":"EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"An RN is admitting a patient to the cardiac unit who has stable angina and a history of type 2 diabetes mellitus. The patient is scheduled for a cardiac catheterization the next day. Which medication would need to be withheld for 24 hours before the procedure and for 48 hours after the procedure?","opts":["Glucophage","Glimepiride","Pravastatin","Vitamin C"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter7-11","topic":"fe","topicName":"F&E / ABG","source":"Chapter 7: Cardiovascular Problems","srcShort":"Chapter 7","num":11,"ctx":[],"why":"The patient’s major modifiable risk factor is ongoing smoking. The family history is significant, and the patient should be aware that this increases cardiovascular risk. The blood pressure is well controlled on the current medication, and no change is needed. There is no indication that stress is a risk factor for this patient, and the patient’s activity level meets the American Heart Association recommendation for at least 150 minutes of moderate activity weekly. Hydrochlorothiazide can deplete potassium. Muscle weakness and cramping are signs of hypokalemia. Bananas, yogurt, spinach, and avocados are some foods that are high in potassium.","tip":"","meta":{"Focus":"Prioritization","Concept":"Patient Education","QSEN":"PCC","Cognitive Level":"Synthesizing"},"note":"","keyText":"1, 2, 6","img":[{"src":"img/c0017.webp","w":1100,"h":552}],"type":"multi","nopts":6,"key":[1,2,6]},{"id":"chapter7-21","topic":"fe","topicName":"F&E / ABG","source":"Chapter 7: Cardiovascular Problems","srcShort":"Chapter 7","num":21,"ctx":[],"why":"Hyperkalemia is a common adverse effect of both angiotensin-converting enzyme inhibitors and potassium-sparing diuretics. The other laboratory values may be affected by these medications but are not as likely or as potentially life threatening.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"Safety","Cognitive Level":"Application"},"note":"","keyText":"3","stem":"The nurse is caring for a hospitalized patient with heart failure who is receiving captopril and spironolactone. Which laboratory value will be most important to monitor?","opts":["Sodium level","Blood glucose level","Potassium level","Alkaline phosphatase level"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter7-45","topic":"fe","topicName":"F&E / ABG","source":"Chapter 7: Cardiovascular Problems","srcShort":"Chapter 7","num":45,"ctx":[],"why":"Because use of metformin may lead to acute lactic acidosis when patients undergo procedures that use iodine-based contrast dye, metformin should be held for 24 hours before and 48 hours after coronary arteriogram. The arteriogram will need to be rescheduled. The other information will also be reported to the HCP but would not be unusual in patients with coronary artery disease.","tip":"","meta":{"Focus":"Prioritization","Concept":"Acid Base Balance","QSEN":"Safety","Cognitive Level":"Analyzing"},"note":"","keyText":"4","stem":"A patient who is scheduled for a coronary arteriogram is admitted to the hospital on the day of the procedure. Which patient information is most important for the nurse to communicate to the health care provider (HCP) before the procedure?","opts":["Blood glucose level is 144 mg/dL (8 mmol/L).","Cardiac monitor shows sinus bradycardia with a rate of 56 beats/min.","Patient reports chest pain that occurred yesterday.","Patient took metformin 500 mg this morning."],"nopts":4,"key":[4],"type":"single"},{"id":"chapter12-3","topic":"fe","topicName":"F&E / ABG","source":"Chapter 12: Gastrointestinal and Nutritional Problems","srcShort":"Chapter 12","num":3,"ctx":[],"why":"The nurse monitors all laboratory results, but vomiting, nasogastric suction, and lavage (if it is ordered) can cause fluid and electrolyte imbalances. Fluid loss can cause hemoconcentration and artificially elevated levels for hematocrit, hemoglobin, and BUN. BUN is generally more affected by fluid loss than serum creatinine. The WBC count could be elevated because of stress, inflammation, or infection.","tip":"Use concept-based learning to recognize that vomiting, suctioning, and lavage share a common effect: altering fluid and electrolyte balance.","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"S","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Which laboratory results would the nurse check to determine if there are untoward effects associated with vomiting, nasogastric suction, or lavage?","opts":["White blood cell (WBC) counts","Hematocrit and hemoglobin","Serum electrolytes","Blood urea nitrogen (BUN) and serum creatinine"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter12-34","topic":"fe","topicName":"F&E / ABG","source":"Chapter 12: Gastrointestinal and Nutritional Problems","srcShort":"Chapter 12","num":34,"ctx":[],"why":"Refeeding syndrome occurs when aggressive and rapid feeding results in fluid retention and heart failure. Electrolytes, especially phosphorus, should be monitored, and the patient should be observed for signs of fluid overload. Changes in bowel sounds, nausea, and distention may occur but are also appropriate for any patient with nutritional issues or for patients receiving enteral feedings. Observing for purging and water ingestion would be appropriate for a patient with an eating disorder. Changes in stool patterns may occur but are not related to refeeding syndrome.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Nutrition, Fluid and Electrolytes","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"Patients who are undernourished or starved for prolonged periods are at risk for refeeding syndrome when nourishment is first given. What is the priority nursing assessment to prevent complications associated with this syndrome?","opts":["Monitor for peripheral edema, crackles in the lungs, and jugular vein distention.","Monitor for decreased bowel sounds, nausea, bloating, and abdominal distention.","Observe for signs of secret purging and ingestion of water to increase weight.","Assess for alternating constipation and diarrhea and pale clay-colored stools."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter12-35","topic":"fe","topicName":"F&E / ABG","source":"Chapter 12: Gastrointestinal and Nutritional Problems","srcShort":"Chapter 12","num":35,"ctx":[],"why":"All of these measures should be performed for total care of the patient; however, weighing the patient every day is considered the single best indicator of fluid volume.","tip":"In studying for the NCLEX® Examination, don’t neglect your fundamentals textbook. This question is based on fundamental knowledge of fluids and fluid management.","meta":{"Focus":"Prioritization","QSEN":"EBP","Concept":"Fluid and Electrolytes","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"The patient with advanced cirrhosis has: massive ascites, peripheral-dependent edema in the lower extremities, nausea and vomiting, and dyspnea related to pressure on the diaphragm. Which indicator is the most reliable for tracking fluid retention?","opts":["Auscultating the lung fields for crackles every day","Measuring the abdominal girth every morning","Performing daily weights with the same amount of clothing","Checking the extremities for pitting edema and comparing with baseline"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter13-13","topic":"fe","topicName":"F&E / ABG","source":"Chapter 13: Diabetes Mellitus","srcShort":"Chapter 13","num":13,"ctx":[],"why":"Rapid, deep respirations (Kussmaul respirations) are symptomatic of diabetic ketoacidosis. Hammer toe, as well as numbness and tingling, are chronic complications associated with diabetes. Decreased sensitivity and swelling (lipohypertrophy) occur at a site of repeated insulin injections, and treatment involves teaching the patient to rotate injection sites within one anatomic site.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"TC, S","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"2","stem":"In the emergency department, during the initial assessment of a newly admitted patient with diabetes, the nurse discovers all of these findings. Which finding should be reported to the health care provider immediately?","opts":["Hammer toe of the left second metatarsophalangeal joint","Rapid respiratory rate with deep inspirations","Numbness and tingling bilaterally in the feet and hands","Decreased sensitivity and swelling of the abdomen"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter13-14","topic":"fe","topicName":"F&E / ABG","source":"Chapter 13: Diabetes Mellitus","srcShort":"Chapter 13","num":14,"ctx":[],"why":"The nurse should not leave the patient. The scope of the unit clerk’s job includes calling and paging HCPs. LPNs/LVNs generally do not administer IV push medication, although in some states, with additional training, this may be done. (Be sure to check the scope of practice in your specific state.) IV fluid administration is not within the scope of practice of APs. Patients with DKA already have a high glucose level and do not need orange juice.","tip":"","meta":{"Focus":"Delegation, Supervision, Assignment","Concept":"Clinical Judgment","QSEN":"TC, S","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The nurse is caring for a patient with diabetes who is developing diabetic ketoacidosis (DKA). Which task delegation or assignment is most appropriate?","opts":["Ask the unit clerk to page the health care provider (HCP) to come to the unit.","Ask the LPN/LVN to administer IV push insulin according to a sliding scale.","Ask the assistive personnel (AP) to hang a new bag of normal saline.","Ask the AP to get the patient a cup (236 mL) of orange juice."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter14-2","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":2,"ctx":[],"why":"DI is a disorder of the posterior pituitary gland in which water loss is caused by either an antidiuretic hormone (ADH) deficiency or an inability of the kidneys to respond to ADH. The result of DI is the excretion of large volumes of dilute urine because the distal kidney tubules and collecting ducts do not reabsorb water; this leads to polyuria. Dehydration from massive water loss increases plasma osmolarity, which stimulates the sensation of thirst. Thirst promotes increased fluid intake and aids in maintaining hydration.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"The nurse is caring for a 25-year-old patient admitted to the acute care unit with an intense thirst and dilute, excessive straw-colored urine output (up to 15 L/day). What does the nurse suspect?","opts":["Type 2 diabetes","Diabetes insipidus (DI)","Cushing disease","Addison disease"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter14-9","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":9,"ctx":[],"why":"The presence of crackles in the patient’s lungs indicates excess fluid volume caused by excess water and sodium reabsorption and may be a symptom of pulmonary edema, which must be treated rapidly. Striae (stretch marks), weight gain, and dependent edema are common findings in patients with Cushing disease. These findings should be monitored but do not require urgent action.","tip":"Findings that the nurse should immediately report to the HCP are those that can indicate a worsening of the patient’s condition that must be treated to prevent further worsening or threat to life.","meta":{"Focus":"Prioritization","Concept":"Collaboration","QSEN":"TC","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"4","stem":"Assessment findings for a patient with Cushing disease include all of the following. For which finding would the nurse notify the health care provider immediately?","opts":["Purple striae present on the abdomen and thighs","Weight gain of 1 lb (0.5 kg) since the previous day","Dependent edema rated as + 1 in the ankles and calves","Crackles bilaterally in the lower lobes of the lungs"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter14-13","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":13,"ctx":[],"why":"Rapid weight gain and edema are signs of excessive drug therapy, and the dosage of the drug would need to be adjusted. Hypertension, hyponatremia, hyperkalemia, and hyperglycemia are common in patients with adrenal hypofunction.","tip":"","meta":{"Focus":"Prioritization","Concept":"Patient Education","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"A patient with adrenal insufficiency is to be discharged and will take prednisone 10 mg orally each day. Which instruction would the nurse be sure to teach the patient?","opts":["Excessive weight gain or swelling should be reported to the health care provider.","Changing positions rapidly may cause hypotension and dizziness.","A diet with foods low in sodium may be beneficial to prevent side effects.","Signs of hypoglycemia may occur while taking this drug."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter14-16","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":16,"ctx":[],"why":"The parathyroid glands are located on the back of the thyroid gland. The parathyroids are important in maintaining the calcium and phosphorus balance. The nurse should be attentive to all patient laboratory values, but calcium and phosphorus levels are especially important to monitor after thyroidectomy because abnormal values could be the result of removal of the parathyroid glands during the procedure.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The nurse is providing care for a patient who underwent a thyroidectomy 2 days ago. Which laboratory value requires close monitoring by the nurse?","opts":["Calcium level","Sodium level","Potassium level","White blood cell count"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter14-17","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":17,"ctx":[],"why":"A patient with permanent DI requires lifelong vasopressin therapy. All of the other statements are appropriate to the home care of this patient.","tip":"","meta":{"Focus":"Prioritization","Concept":"Patient Education","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"A 24-year-old patient with diabetes insipidus (DI) makes all of these statements when the nurse is preparing the patient for discharge from the hospital. Which statement indicates to the nurse that the patient needs additional teaching?","opts":["“I will drink fluids equal to the amount of my urine output.”","“I will weigh myself every day using the same scale.”","“I will wear my medical alert bracelet at all times.”","“I will gradually wean myself off the vasopressin.”"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter14-19","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":19,"ctx":[],"why":"Fluid restriction is essential because fluid intake further dilutes plasma sodium levels. In some cases, fluid intake may be kept as low as 500 to 1000 mL over 24 hours. All oral fluids count, including ice chips and mouth rinses, and strict intake and output is required. Measure intake, output, and daily weights to assess the degree of fluid restriction needed. A weight gain of 2.2 lb (1 kg) or more per day or a gradual increase over several days is cause for concern. A 2.2-lb (1-kg) weight increase is equal to a 1000-mL fluid retention (1 kg = 1 L). Keep the mouth moist by offering frequent oral rinsing (warn patients not to swallow the rinses).","tip":"","meta":{"Focus":"Delegation, Supervision","Concept":"Fluid Balance","QSEN":"PCC, S","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"1, 3, 4, 5","stem":"The nurse is caring for a patient with syndrome of inappropriate antidiuretic hormone secretion. Which patient care actions should the nurse delegate to the experienced assistive personnel? Select all that apply.","opts":["Monitor and record strict intake and output.","Provide the patient with ice chips when requested.","Remind the patient about his or her fluid restriction.","Weigh the patient every morning using the same scale.","Report a weight gain of 2.2 lb (1 kg) to the nurse.","Provide mouth care and allow the patient to swallow the rinses."],"nopts":6,"key":[1,3,4,5],"type":"multi"},{"id":"chapter14-20","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":20,"ctx":[],"why":"A patient with Cushing disease experiences increased levels of serum, urinary, and salivary cortisol. Other laboratory findings may include increased blood glucose level, decreased lymphocyte count, increased sodium level, and decreased serum calcium level.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"2, 3, 6","stem":"The nurse is preparing a care plan for a patient with Cushing disease. Which abnormal laboratory values would the nurse expect? Select all that apply.","opts":["Increased serum calcium level","Increased salivary cortisol level","Increased urinary cortisol level","Decreased serum glucose level","Decreased sodium level","Increased serum cortisol level"],"nopts":6,"key":[2,3,6],"type":"multi"},{"id":"chapter14-21","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":21,"ctx":[],"why":"A patient with Addison disease is at risk for anemia. The nurse should expect this patient’s sodium level to decrease and potassium and calcium levels to increase.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"S","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"When providing care for a patient with Addison disease, the nurse should be alert for which laboratory value change?","opts":["Decreased hematocrit","Increased sodium level","Decreased potassium level","Decreased calcium level"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter14-25","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":25,"ctx":[],"why":"This patient’s potassium level is very high, placing him or her at risk for cardiac dysrhythmias that could be life threatening. The other patients also need to be seen but are not as urgent.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"S","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"The nurse is caring for the following patients with endocrine disorders. Which patient must the nurse assess first?","opts":["A 21-year-old patient with diabetes insipidus whose urine output overnight was 2000 mL","A 55-year-old patient with syndrome of inappropriate antidiuretic hormone secretion who is demanding that the assistive personnel refill his water pitcher","A 65-year-old patient with Addison disease whose morning potassium level is 6.2 mEq/L (6.2 mmol/L)","A 48-year-old patient with Cushing disease with a weight gain of 1.5 lb (0.7 kg) over the past 4 days"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter14-28","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":28,"ctx":[],"why":"Diuretics and hydration help reduce serum calcium for patients with hyperparathyroidism who are not surgery candidates. Furosemide increases kidney excretion of calcium when combined with IV saline in large volumes.","tip":"","meta":{"Focus":"Prioritization","Concept":"Patient Education","QSEN":"PCC","Cognitive Level":"Applying"},"note":"","keyText":"3","stem":"The patient with hyperparathyroidism who is not a candidate for surgery asks the nurse why she is receiving IV normal saline and IV furosemide. What is the nurse’s best response?","opts":["“This therapy is to protect your kidney function.”","“You are receiving these therapies to prevent edema formation.”","“Diuretic and hydration therapies are used to reduce your serum calcium.”","“These therapies may help to improve your candidacy for surgery.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter14-33","topic":"fe","topicName":"F&E / ABG","source":"Chapter 14: Other Endocrine Problems","srcShort":"Chapter 14","num":33,"ctx":[],"why":"Ensure that no patient suspected of having DI is deprived of fluids for more than 4 hours, because reduced urine output and severe dehydration can result. Interventions for DI include accurately measuring fluid intake and output, checking urine specific gravity, and recording the patient’s weight daily.","tip":"","meta":{"Focus":"Prioritization","Concept":"Cellular Regulation","QSEN":"PCC, S","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"Which prescribed order for a patient with diabetes insipidus (DI) would the nurse be sure to question?","opts":["Monitor and record accurate intake and output.","Check urine specific gravity.","Restrict fluids for 6 hours.","Weigh the patient every morning."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter16-1","topic":"fe","topicName":"F&E / ABG","source":"Chapter 16: Renal and Urinary Problems","srcShort":"Chapter 16","num":1,"ctx":[],"why":"Patients receiving metformin are at risk for lactic acidosis when given iodinated contrast media. The drug should be discontinued for at least 24 hours before and 48 hours after the procedure and kidney function should be re-evaluated before the patient resumes taking metformin. The purpose of the scan is get three-dimensional information about the kidneys. A patient having this scan is not kept NPO and is not kept on bedrest.","tip":"","meta":{"Focus":"Supervision, Assignment","Concept":"Fluid Balance, Elimination","QSEN":"PCC","Cognitive Level":"Applying","IPEC":"R/R, IC"},"note":"","keyText":"3","stem":"The RN is supervising an LPN/LVN who is providing care for a patient with type 2 diabetes who is to have a renal computer tomography (CT) scan with contrast tomorrow morning. Which instruction would the RN be sure to provide to the LPN/LVN?","opts":["“Remind the patient that the purpose of this scan is to measure kidney function.”","“Tell the assistive personnel to remove the patient’s water pitcher from the bedside at 10 PM.”","“The patient’s metformin should be discontinued 24 hours before the procedure.”","“Keep the patient on bedrest for at least 8 hours after returning to the unit.”"],"nopts":4,"key":[3],"type":"single"},{"id":"chapter16-24","topic":"fe","topicName":"F&E / ABG","source":"Chapter 16: Renal and Urinary Problems","srcShort":"Chapter 16","num":24,"ctx":[],"why":"The underlying pathophysiology of nephrotic syndrome involves increased glomerular permeability, which allows larger molecules to pass through the membrane into the urine and be removed from the blood. This process causes massive loss of protein, edema formation, and decreased serum albumin levels. Key features include hypertension and renal insufficiency (decreased urine output) related to concurrent renal vein thrombosis, which may be a cause or an effect of nephrotic syndrome. Flank pain is seen in patients with acute pyelonephritis.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment, Fluid and Electrolytes","QSEN":"S","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The nurse is admitting a patient with nephrotic syndrome. Which assessment finding supports this diagnosis?","opts":["Edema formation","Hypotension","Increased urine output","Flank pain"],"nopts":4,"key":[1],"type":"single"},{"id":"chapter16-28","topic":"fe","topicName":"F&E / ABG","source":"Chapter 16: Renal and Urinary Problems","srcShort":"Chapter 16","num":28,"ctx":[],"why":"Administering oral medications is appropriate to the scope of practice for an LPN/LVN or RN. Assessing breath sounds requires additional education and skill development and is most appropriate within the scope of practice of an RN, but it may be part of the observations of an experienced and competent LPN/LVN. All other actions are within the educational preparation and scope of practice of an experienced AP.","tip":"","meta":{"Focus":"Delegation, Supervision","Concept":"Care Coordination","QSEN":"PCC, TC, S","Cognitive Level":"Applying","IPEC":"R/R, IC"},"note":"","keyText":"1, 2, 4, 6","stem":"The nurse is providing nursing care for a patient with acute kidney failure for whom volume overload has been identified. Which actions should the nurse delegate to an experienced assistive personnel? Select all that apply.","opts":["Measuring and recording vital sign values every 4 hours","Weighing the patient every morning using a standing scale","Administering furosemide 40 mg orally twice a day","Reminding the patient to save all urine for intake and output measurement","Assessing breath sounds every 4 hours","Ensuring that the patient’s urinal is within reach"],"nopts":6,"key":[1,2,4,6],"type":"multi"},{"id":"chapter16-32","topic":"fe","topicName":"F&E / ABG","source":"Chapter 16: Renal and Urinary Problems","srcShort":"Chapter 16","num":32,"ctx":[],"why":"Patients with acute kidney failure usually go through a diuretic phase 2 to 6 weeks after the onset of the oliguric phase. The diuresis can result in an output of up to 10 L/day of dilute urine. During this phase, it is important to monitor for electrolyte and fluid imbalances. This is followed by the recovery phase. A patient with acute kidney failure caused by hypovolemia would receive IV fluids to correct the problem; however, this would not necessarily lead to the onset of diuresis.","tip":"","meta":{"Focus":"Supervision","Concept":"Fluid Balance","QSEN":"TC","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"2","stem":"A patient diagnosed with acute kidney failure had a urine output of 1560 mL for the past 8 hours. The LPN/LVN who is caring for this patient under the RN’s supervision asks how a patient with kidney failure can have such a large urine output. What is the RN’s best response?","opts":["“The patient’s kidney failure was caused by hypovolemia, and we have given him IV fluids to correct the problem.”","“Acute kidney failure patients go through a diuretic phase when their kidneys begin to recover and may put out as much as 10 L of urine per day.”","“With that much urine output, there must have been a mistake in the patient’s diagnosis.”","“An increase in urine output like this is an indicator that the patient is entering the recovery phase of acute kidney failure.”"],"nopts":4,"key":[2],"type":"single"},{"id":"chapter16-34","topic":"fe","topicName":"F&E / ABG","source":"Chapter 16: Renal and Urinary Problems","srcShort":"Chapter 16","num":34,"ctx":[],"why":"A patient with dehydration as a result of deficient ADH would have dilute urine with a decreased urine specific gravity. Normal urine specific gravity ranges from 1.003 to 1.030. A specific gravity of 1.035 would indicate urine that is concentrated.","tip":"A way to remember the difference between Increased ADH and Decreased ADH is: Increased ADH = Increased specific gravity (Kidneys hold on to the water [antidiuretic]) so the urine is concentrated, while Decreased ADH = Decreased specific gravity (Kidneys can’t hold on to water because there is no antidiuretic) so the urine is very dilute.","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"S","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"The nurse is caring for a patient admitted with dehydration secondary to deficient antidiuretic hormone (ADH). Which specific gravity value supports this diagnosis?","opts":["1.010","1.035","1.020","1.002"],"nopts":4,"key":[4],"type":"single"},{"id":"chapter16-36","topic":"fe","topicName":"F&E / ABG","source":"Chapter 16: Renal and Urinary Problems","srcShort":"Chapter 16","num":36,"ctx":[],"why":"Dehydration reduces perfusion and can lead to AKI. Patients should be encouraged to take in adequate fluids, and extra fluids should be taken in during strenuous exercise. Intake and output, as well as daily weights, should be documented. Lab values that indicate kidney function should be followed. The health care provider should be notified for a urine output of less than 0.5 mL/kg/hr that persists for more than 2 hours. Many drugs are potentially nephrotoxic but are still administered. Patients are encouraged to take in extra fluids, and nurses must monitor for any nephrotoxic effects when these drugs are prescribed.","tip":"","meta":{"Focus":"Prioritization","Concept":"Elimination","QSEN":"PCC, S","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"1, 2, 4, 6","stem":"The RN supervising a senior nursing student is discussing methods for preventing acute kidney injury (AKI). Which points would the RN be sure to include in this discussion? Select all that apply.","opts":["Encourage patients to avoid dehydration by drinking adequate fluids.","Instruct patients to drink extra fluids during periods of strenuous exercise.","Immediately report a urine output of less than 2 mL/kg/hr.","Record intake and output and weigh patients daily.","Question any prescriptions for potentially nephrotoxic drugs.","Monitor laboratory values that reflect kidney function."],"nopts":6,"key":[1,2,4,6],"type":"multi"},{"id":"chapter19-54","topic":"fe","topicName":"F&E / ABG","source":"Chapter 19: Pediatric Problems","srcShort":"Chapter 19","num":54,"ctx":[],"why":"This infant is experiencing severe dehydration, which is evidenced by tachycardia and hypotension. The child is at risk for hypovolemic shock, which is a life-threatening event. A bolus of normal saline or lactated Ringer solution of 20 mL/kg is the standard of care to establish hemodynamic stability. The blood glucose is normal. The safety profile for antiemetics have not been established with infants, and the priority for this patient is to establish hemodynamic stability. Fever can cause increased fluid loss; however, the priority in this life-threatening situation is to establish hemodynamic stability.","tip":"","meta":{"Focus":"Prioritization","QSEN":"S","Concept":"Fluid Balance","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"The parents of a 6-month-old girl bring the infant to the emergency department because “she has not held anything down for the entire day.” The nurse obtains a fingerstick blood glucose of 94 (5.22 mmol/L). The infant’s rectal temperature is 101°F (38.3°C), heart rate is 198 beats/min, respiratory rate is 40 breaths/min, and blood pressure is 60/38 mm Hg in the left arm. Which nursing action is a priority?","opts":["Administer an antiemetic rectally.","Administer a bolus of D10W.","Administer a bolus of normal saline.","Administer an antipyretic rectally."],"nopts":4,"key":[3],"type":"single"},{"id":"chapter20-1","topic":"fe","topicName":"F&E / ABG","source":"Chapter 20: Pharmacology","srcShort":"Chapter 20","num":1,"ctx":[],"why":"Urine output should exceed 0.5 mL/kg/hr to prevent hyperkalemia. This patient’s weight is 80 kg so he should minimally put out 40 mL of urine per hour. His total urine output for the past 24 hours was 550 mL, which equals around 22.9 mL/hr. The health care provider must be notified of this. The patient’s sodium level is low normal, placement of a new IV would not interfere with giving the IV potassium, and a positive Chvostek sign is an indicator of hypoparathyroidism.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"S, EBP","Cognitive Level":"Analyzing"},"note":"","keyText":"2","stem":"The patient weighs 80 kg and is about to receive a potassium IV infusion of 10 mEq in 100 mL normal saline. For which finding must the nurse notify the health care provider before completing this prescribed action?","opts":["The patient’s morning serum sodium level was 136 mEq/L.","The patient’s urine output for the past 24 hours was 550 mL.","The patient required placement of a new IV access this morning.","Patient assessment revealed a positive Chvostek sign."],"nopts":4,"key":[2],"type":"single"},{"id":"chapter20-2","topic":"fe","topicName":"F&E / ABG","source":"Chapter 20: Pharmacology","srcShort":"Chapter 20","num":2,"ctx":[],"why":"Hydrochlorothiazide is a thiazide diuretic often used to treat hypertension. An adverse effect of these diuretics is that when sodium (Na+) reabsorption is blocked by thiazide diuretics, this increases Na+ delivery to the cortical collecting duct and increases Na+ reabsorption in this segment of the nephron. Because Na+ reabsorption is coupled to potassium (K+) secretion in the cortical collecting duct, these drugs can lead to excessive K+ secretion and hypokalemia (where the K+ in extracellular fluid is too low). The same is true of loop diuretics (e.g., furosemide). Thiazide and loop diuretics may be combined with potassium-sparing diuretics (e.g., spironolactone) to counteract this possibility. The other actions are also appropriate for this patient but are not as urgent.","tip":"Remember that most diuretics affect serum potassium levels so it is essential to follow this lab value whenever a patient is prescribed a diuretic. Thiazide and loop diuretics decrease potassium. Potassium-sparing diuretics may increase potassium.","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolyte","QSEN":"S","Cognitive Level":"Synthesizing"},"note":"","keyText":"1","stem":"The nurse is caring for a patient newly diagnosed with hypertension. Blood pressure readings over the past 8 hours have been: 08:00 164/93 mm Hg, 12:00 158/90 mm Hg, and 16:00 166/94 mm Hg. The health care provider prescribes a no added salt diet and plans to start the patient on hydrochlorothiazide 25 mg. Which action is most important for the nurse to take before administering this drug?","opts":["Check the patient’s serum potassium level.","Review the patient’s urine output for the past 24 hours.","Instruct the assistive personnel to check the orthostatic blood pressure.","Check the patient’s cardiac monitor for abnormal heart rhythms."],"nopts":4,"key":[1],"type":"single"},{"id":"chapter20-22","topic":"fe","topicName":"F&E / ABG","source":"Chapter 20: Pharmacology","srcShort":"Chapter 20","num":22,"ctx":[],"why":"Spironolactone is a potassium-sparing diuretic, so patients should avoid excessive intake of foods high in potassium such as bananas, broccoli, and spinach. Salt substitutes should also be avoided because the sodium is replaced with potassium. Urine output should increase, not decrease. The drug works by increasing excretion of water and sodium, but not potassium, in urine. Older adults are more sensitive to the action of this drug and are also more likely to experience side effects.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolyte Balance","QSEN":"PCC","Cognitive Level":"Applying"},"note":"","keyText":"1, 2, 5, 6","stem":"The nurse is providing patient teaching for an older adult about spironolactone. Which key points would the nurse include? Select all that apply.","opts":["Avoid the use of salt substitutes.","Do not consume excessive amounts of foods that are high in potassium.","Be prepared for a decrease in your urine output.","This drug works by conserving sodium and excreting potassium.","Older adults may be more sensitive to the action of this drug.","As an older adult, you are more likely to experience side effects from this drug."],"nopts":6,"key":[1,2,5,6],"type":"multi"},{"id":"chapter20-34","topic":"fe","topicName":"F&E / ABG","source":"Chapter 20: Pharmacology","srcShort":"Chapter 20","num":34,"ctx":[],"why":"Patients with diarrhea have increased water in bowel movements as well as increased volume and frequency of stools. A common side effect of diarrhea is electrolyte imbalance, especially low potassium (hypokalemia), so the nurse must monitor this laboratory value. Even small changes in potassium level may cause potentially life-threatening problems such as dysrhythmias.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"2","stem":"A patient with diarrhea has been prescribed loperamide 2 mg orally after each unformed stool. Which laboratory value will be most important for the nurse to monitor for this patient?","opts":["Serum sodium","Serum potassium","Urine protein","Urine nitrogen"],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy2-4","topic":"fe","topicName":"F&E / ABG","source":"Case Study 2: Dyspnea and Shortness of Breath","srcShort":"Case Study 2","num":4,"ctx":[{"img":[{"src":"img/c0022.webp","w":1100,"h":632}],"intro":true}],"why":"Baseline ABG results are important in planning the care of this patient. The unit clerk can schedule the pulmonary function tests and chest radiography. The albuterol therapy is a routine order and the patient may need this after the ABG is drawn.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"TC","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The health care provider’s (HCP’s) prescribed actions for this patient include all of the following. Which intervention should the nurse complete first?","opts":["Send an arterial blood gas (ABG) sample to the laboratory.","Schedule pulmonary function tests.","Repeat chest radiography each morning.","Administer albuterol via MDI 2 puffs every 4 hours."],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy2-5","topic":"fe","topicName":"F&E / ABG","source":"Case Study 2: Dyspnea and Shortness of Breath","srcShort":"Case Study 2","num":5,"ctx":[{"img":[{"src":"img/c0022.webp","w":1100,"h":632}],"intro":true},{"text":"Mr. W’s ABG results include the following: pH, 7.37; arterial partial pressure of carbon dioxide (Paco2), 55.4 mm Hg; arterial partial pressure of oxygen (Pao2), 51.2 mm Hg; and bicarbonate (HCO3−) level, 38 mEq/L (38 mmol/L).","intro":false}],"why":"The pH is on the low side of normal, and the Paco2 is elevated, which indicates an underlying respiratory acidosis. The HCO3− level is elevated, which indicates compensation and since the pH is within normal limits it is completed compensation. Both the Pao2 and the oxygen saturation levels are low, which points to hypoxemia. These blood gas results are typically expected when a patient has a chronic respiratory problem such as COPD.","tip":"The nurse must remember and apply physiologic concepts learned in school to patient care (e.g., normal ABG values).","meta":{"Focus":"Prioritization","Concept":"Acid-Base Balance","QSEN":"PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"What is the nurse’s interpretation of these results?","opts":["Compensated metabolic acidosis with hypoxemia","Compensated metabolic alkalosis with hypoxemia","Compensated respiratory acidosis with hypoxemia","Compensated respiratory alkalosis with hypoxemia"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy2-6","topic":"fe","topicName":"F&E / ABG","source":"Case Study 2: Dyspnea and Shortness of Breath","srcShort":"Case Study 2","num":6,"ctx":[{"img":[{"src":"img/c0022.webp","w":1100,"h":632}],"intro":true},{"text":"Mr. W’s ABG results include the following: pH, 7.37; arterial partial pressure of carbon dioxide (Paco2), 55.4 mm Hg; arterial partial pressure of oxygen (Pao2), 51.2 mm Hg; and bicarbonate (HCO3−) level, 38 mEq/L (38 mmol/L).","intro":false}],"why":"The patient’s major problem at this time is impaired gas exchange with hypoxemia based on the ABG results. Strategies to compensate include administration of low-flow oxygen as well as interventions to improve gas exchange, such as having the patient cough and take deep breaths and perform incentive spirometry. These strategies may improve the patient’s condition and prevent the need to initiate a code, transfer to the ICU, or both. A rapid response is for hospitalized patients with early signs of deterioration on non-ICUs to prevent respiratory or cardiac arrest. The team includes members that may not be routinely in the ER (e.g. RT, pharmacist, ICU nurse).The patient’s symptoms call for initiation of a rapid response to treat him now and prevent the need for a code. A saline lock is a good idea, but giving the patient too much fluid may worsen his condition by producing a fluid overload. Transfer to the ICU at this point is not warranted because the patient is unstable.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"1, 2, 3, 6","stem":"Based on the patient’s ABG results, what are the nurse’s priority actions at this time? Select all that apply.","opts":["Administer oxygen at 2 L/min via nasal cannula.","Initiate a rapid response.","Teach the patient how to cough and deep breathe.","Begin IV normal saline at 100 mL/hr.","Arrange a transfer to the intensive care unit (ICU).","Remind the patient to practice incentive spirometry every hour while awake."],"nopts":6,"key":[1,2,3,6],"type":"multi"},{"id":"casestudy2-9","topic":"fe","topicName":"F&E / ABG","source":"Case Study 2: Dyspnea and Shortness of Breath","srcShort":"Case Study 2","num":9,"ctx":[{"img":[{"src":"img/c0022.webp","w":1100,"h":632}],"intro":true},{"text":"Mr. W’s ABG results include the following: pH, 7.37; arterial partial pressure of carbon dioxide (Paco2), 55.4 mm Hg; arterial partial pressure of oxygen (Pao2), 51.2 mm Hg; and bicarbonate (HCO3−) level, 38 mEq/L (38 mmol/L).","intro":false}],"why":"A low serum potassium places the patient at risk for cardiac dysrhythmias, which can be life threatening. The HCP should be notified immediately and will likely order IV or oral potassium supplements to move the patient’s level back into the normal range. Later, before discharge, the nurse would certainly want to teach the patient about potassium-rich foods, but this is not urgent. Oxygen is essential for the patient’s respiratory problem but will not correct the low potassium, nor will IV normal saline.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes QSEN: PCC, S","Cognitive Level":"Analyzing","IPEC":"IC"},"note":"","keyText":"3","stem":"Mr. W’s ED lab values include a serum potassium of 2.8 mg/dL (2.8 mmol/L). What is the priority nursing action at this time?","opts":["Teach the patient about potassium-rich foods.","Provide the patient with oxygen at 2 L per nasal cannula.","Contact and notify the HCP immediately.","Initiate 0.9% saline at 20 mL/hr."],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy2-10","topic":"fe","topicName":"F&E / ABG","source":"Case Study 2: Dyspnea and Shortness of Breath","srcShort":"Case Study 2","num":10,"ctx":[{"img":[{"src":"img/c0022.webp","w":1100,"h":632}],"intro":true},{"text":"Mr. W’s ABG results include the following: pH, 7.37; arterial partial pressure of carbon dioxide (Paco2), 55.4 mm Hg; arterial partial pressure of oxygen (Pao2), 51.2 mm Hg; and bicarbonate (HCO3−) level, 38 mEq/L (38 mmol/L).","intro":false}],"why":"A dilution no greater than 1 mEq (1 mmol) of potassium to 10 mL of solution is recommended for IV administration. The maximum recommended infusion rate is 5 to 10 mEq/hr (5 to 10 mmol/hr); this rate is never to exceed 20 mEq/hr (20 mmol/hr) under any circumstances. In accordance with National Patient Safety Goals, potassium is not given by IV push to avoid causing cardiac arrest. Oral potassium can cause nausea and vomiting (give it with food to prevent this), but this does not answer the AP’s question. Lack of dietary intake and teaching about dietary sources of potassium do not answer the AP’s question.","tip":"","meta":{"Focus":"Prioritization, Supervision","Concept":"Electrolyte Imbalance","QSEN":"TC, S","Cognitive Level":"Applying","IPEC":"IC"},"note":"","keyText":"1, 2, 4, 6","img":[{"src":"img/c0023.webp","w":1100,"h":312},{"src":"img/c0024.webp","w":1100,"h":509}],"type":"multi","nopts":8,"key":[1,2,4,6]},{"id":"casestudy2-11","topic":"fe","topicName":"F&E / ABG","source":"Case Study 2: Dyspnea and Shortness of Breath","srcShort":"Case Study 2","num":11,"ctx":[{"img":[{"src":"img/c0022.webp","w":1100,"h":632}],"intro":true},{"text":"Mr. W’s ABG results include the following: pH, 7.37; arterial partial pressure of carbon dioxide (Paco2), 55.4 mm Hg; arterial partial pressure of oxygen (Pao2), 51.2 mm Hg; and bicarbonate (HCO3−) level, 38 mEq/L (38 mmol/L).","intro":false}],"why":"Barrel chest and clubbed fingers are signs of chronic COPD. The patient had a productive cough on admission to the hospital. Bilateral crackles are a new finding and indicate fluid-filled alveoli and pulmonary edema. Fluid in the alveoli affects gas exchange and can result in worsening ABG concentrations.","tip":"","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"TC, S","Cognitive Level":"Analyzing"},"note":"","keyText":"3","stem":"During morning rounds, the nurse notes all of these assessment findings for Mr. W. Which finding indicates a worsening of the patient’s condition?","opts":["Barrel-shaped chest","Clubbed fingers on both hands","Crackles bilaterally","Frequent productive cough"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy2-12","topic":"fe","topicName":"F&E / ABG","source":"Case Study 2: Dyspnea and Shortness of Breath","srcShort":"Case Study 2","num":12,"ctx":[{"img":[{"src":"img/c0022.webp","w":1100,"h":632}],"intro":true},{"text":"Mr. W’s ABG results include the following: pH, 7.37; arterial partial pressure of carbon dioxide (Paco2), 55.4 mm Hg; arterial partial pressure of oxygen (Pao2), 51.2 mm Hg; and bicarbonate (HCO3−) level, 38 mEq/L (38 mmol/L).","intro":false}],"why":"Furosemide is a loop diuretic. The uses of this drug include treatment of pulmonary edema, which is most directly related to the new finding. Intake and output records and daily weights are important in documenting the effectiveness of the medication. A side effect of this drug is hypokalemia, and some patients are also prescribed a potassium supplement when taking this medication.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"1","stem":"The nurse reports the morning assessment findings (see question 11) to the HCP. Which prescribed intervention is most directly related to the nurse’s assessment findings?","opts":["Administer furosemide 20 mg IV push now.","Keep accurate records of intake and output.","Administer potassium 20 mEq (20 mmol) orally every morning.","Weigh the patient every morning."],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy4-7","topic":"fe","topicName":"F&E / ABG","source":"Case Study 4: Shortness of Breath, Edema, and Decreased Urine Output","srcShort":"Case Study 4","num":7,"ctx":[{"img":[{"src":"img/c0025.webp","w":1100,"h":702}],"intro":true}],"why":"A patient with a serum potassium level of 7 to 8 mEq/L (7 to 8 mmol/L) or higher is at risk for electrocardiographic changes and fatal dysrhythmias. The HCP should be notified immediately about this potassium level. Although the serum creatinine and blood urea nitrogen levels are high, these levels are commonly reached before patients experience symptoms of CKD. The serum calcium level is low but not life threatening.","tip":"Keep in mind that there is an inverse relationship between calcium and phosphorus, so when calcium is low, expect phosphorus to be high.","meta":{"Focus":"Prioritization","Concept":"Clinical Judgment","QSEN":"TC, S","Cognitive Level":"Analyzing"},"note":"","keyText":"1","stem":"The RN reviews Ms. J’s laboratory results. Which laboratory finding is of greatest concern?","opts":["Serum potassium level of 7.1 mEq/L (7.1 mmol/L)","Serum creatinine level of 7.3 mg/dL (645 µmol/L)","Blood urea nitrogen level of 180 mg/dL (64.3 mmol/L)","Serum calcium level of 7.8 mg/dL (1.95 mmol/L)"],"nopts":4,"key":[1],"type":"single"},{"id":"casestudy4-8","topic":"fe","topicName":"F&E / ABG","source":"Case Study 4: Shortness of Breath, Edema, and Decreased Urine Output","srcShort":"Case Study 4","num":8,"ctx":[{"img":[{"src":"img/c0025.webp","w":1100,"h":702}],"intro":true}],"why":"Sodium polystyrene sulfonate removes potassium from the body by exchanging sodium for potassium in the large intestine. Diuretics such as furosemide generally do not work well in chronic kidney failure. The patient may need a calcium supplement and subcutaneous epoetin alfa; however, these drugs do nothing to decrease potassium levels.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid and Electrolytes","QSEN":"PCC, S","Cognitive Level":"Applying"},"note":"","keyText":"4","stem":"Which medication should the nurse be prepared to administer to lower the patient’s potassium level?","opts":["Furosemide 40 mg IV push","Epoetin alfa 300 units/kg subcutaneously","Calcium 1 tablet PO","Sodium polystyrene sulfonate 15 g PO"],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy4-12","topic":"fe","topicName":"F&E / ABG","source":"Case Study 4: Shortness of Breath, Edema, and Decreased Urine Output","srcShort":"Case Study 4","num":12,"ctx":[{"img":[{"src":"img/c0025.webp","w":1100,"h":702}],"intro":true}],"why":"The usual fluid restriction for patients with chronic kidney failure is 500 to 700 mL plus urine output. All of the other actions are appropriate for a patient with fluid overload. Remember that it is essential for the nurse to compare findings with previous shifts and days to determine if symptoms are worsening.","tip":"","meta":{"Focus":"Prioritization","Concept":"Fluid Balance","QSEN":"PCC","Cognitive Level":"Analyzing"},"note":"","keyText":"1, 2, 3, 5, 6, 7, 8","img":[{"src":"img/c0026.webp","w":1100,"h":666}],"type":"multi","nopts":8,"key":[1,2,3,5,6,7,8]},{"id":"casestudy8-3","topic":"fe","topicName":"F&E / ABG","source":"Case Study 8: Multiple Patients With Adrenal Gland Disorders","srcShort":"Case Study 8","num":3,"ctx":[{"img":[{"src":"img/c0034.webp","w":1100,"h":586}],"intro":true}],"why":"With acute adrenal insufficiency, the nurse must be aware of three major areas of concern for treatment, which are hormone replacement, hyperkalemia management, and hypoglycemia management.","tip":"","meta":{"Focus":"Prioritization"},"note":"","keyText":"1, 3, 5","stem":"What are three key components of emergency management of a patient with adrenocortical insufficiency? Select all that apply.","opts":["Hormone replacement with hydrocortisone","Administration of potassium-sparing diuretics","Hypoglycemia management with IV glucose","Subcutaneous insulin before meals and at bedtime","Hyperkalemia management with a potassium-binding and potassium-excreting resin","Fluid restrictions to maintain body weight and prevent edema"],"nopts":6,"key":[1,3,5],"type":"multi"},{"id":"casestudy8-10","topic":"fe","topicName":"F&E / ABG","source":"Case Study 8: Multiple Patients With Adrenal Gland Disorders","srcShort":"Case Study 8","num":10,"ctx":[{"img":[{"src":"img/c0034.webp","w":1100,"h":586}],"intro":true}],"why":"A patient with Cushing disease would have lab values that include increased serum, salivary, and urinary cortisol levels. Other lab value expectations include increased blood glucose level, decreased lymphocyte count, increased serum sodium, and decreased serum calcium. In a 24-hour urine collection, there would also be increased levels of cortisol and androgens.","tip":"","meta":{"Focus":"Prioritization"},"note":"","keyText":"1, 3, 4, 5","stem":"Which laboratory values would the nurse expect to find for Ms. H? Select all that apply.","opts":["Elevated serum cortisol level","Decreased serum sodium level","Elevated serum glucose level","Decreased lymphocyte count","Increased serum calcium level","Decreased urine androgen level"],"nopts":6,"key":[1,3,4,5],"type":"multi"},{"id":"casestudy9-14","topic":"fe","topicName":"F&E / ABG","source":"Case Study 9: Multiple Patients With Gastrointestinal Problems","srcShort":"Case Study 9","num":14,"ctx":[{"text":"An RN is the leader of a team caring for patients with gastrointestinal disorders on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation, an experienced assistive personnel (AP), and a nursing student. The following information about the six assigned patients is included in the hand-off report. (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study. This gives you practice in identifying important information and simulates how you would use the notes to remember and keep track of six patients over the course of a shift.) • Ms. H, a 42-year-old woman, has right upper quadrant pain that radiates to the right shoulder. She has a history of gallstones. She was admitted through the emergency department last night with acute cholecystitis. The night shift nurse reports, “She had a good night.” • Ms. D, a 60-year-old woman, was admitted with vomiting and pain in the midabdomen related to a bowel obstruction. She reports abdominal pain that has gradually improved since the insertion of a nasogastric (NG) tube. She is receiving IV fluids and is currently NPO. • Ms. T, a 29-year-old woman, was admitted for an acute exacerbation of ulcerative colitis. She appears wasted and malnourished. She has severe diarrhea and reports predefecation abdominal pain and generalized tenderness to palpation. The plan is to start administering total parenteral nutrition (TPN) through a central line this morning. • Mr. A, a 26-year-old man, will be discharged in the afternoon. He is homeless and frequently sleeps in a nearby shelter. He had discharge teaching from the enterostomal therapist yesterday regarding his infected wound secondary to a ruptured appendix; he wants a review of the wound care instructions before he leaves. • Mr. K, an 85-year-old man, is frail but alert and oriented to person and place. He was transferred from an extended-care facility to receive a percutaneous endoscopic gastrostomy (PEG) tube that was placed 5 days ago. He has a large family. They ask a lot of questions and argue continuously among themselves and with the staff. His vital signs are stable. • Mr. R, a 57-year-old man, has periumbilical pain. The pain is very severe, despite medication, and radiates to the back. Mr. R was admitted with acute pancreatitis. He is NPO and has an NG tube and IV line. He is belligerent and confused. His white blood cell (WBC) count and blood glucose level are increased.","intro":true}],"why":"With continuous NG suction, there is a loss of sodium and potassium. Also, the loss of acid via suctioning will result in an increase in blood pH or metabolic alkalosis. Full assessment of laboratory data is always important when a change in status is noted, but the other values are less relevant to this patient’s NG therapy.","tip":"","meta":{"Focus":"Prioritization"},"note":"","keyText":"3","stem":"Ms. D (bowel obstruction) reports feeling weak. She seems more confused compared with her baseline. The NG drainage container has a large amount of watery bile-colored fluid. Which laboratory values should be checked first?","opts":["Blood urea nitrogen and creatinine levels","Platelet count and WBC count","Sodium level, potassium level, and pH of blood","Bilirubin level, hematocrit, and hemoglobin level"],"nopts":4,"key":[3],"type":"single"},{"id":"casestudy9-15","topic":"fe","topicName":"F&E / ABG","source":"Case Study 9: Multiple Patients With Gastrointestinal Problems","srcShort":"Case Study 9","num":15,"ctx":[{"text":"An RN is the leader of a team caring for patients with gastrointestinal disorders on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation, an experienced assistive personnel (AP), and a nursing student. The following information about the six assigned patients is included in the hand-off report. (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study. This gives you practice in identifying important information and simulates how you would use the notes to remember and keep track of six patients over the course of a shift.) • Ms. H, a 42-year-old woman, has right upper quadrant pain that radiates to the right shoulder. She has a history of gallstones. She was admitted through the emergency department last night with acute cholecystitis. The night shift nurse reports, “She had a good night.” • Ms. D, a 60-year-old woman, was admitted with vomiting and pain in the midabdomen related to a bowel obstruction. She reports abdominal pain that has gradually improved since the insertion of a nasogastric (NG) tube. She is receiving IV fluids and is currently NPO. • Ms. T, a 29-year-old woman, was admitted for an acute exacerbation of ulcerative colitis. She appears wasted and malnourished. She has severe diarrhea and reports predefecation abdominal pain and generalized tenderness to palpation. The plan is to start administering total parenteral nutrition (TPN) through a central line this morning. • Mr. A, a 26-year-old man, will be discharged in the afternoon. He is homeless and frequently sleeps in a nearby shelter. He had discharge teaching from the enterostomal therapist yesterday regarding his infected wound secondary to a ruptured appendix; he wants a review of the wound care instructions before he leaves. • Mr. K, an 85-year-old man, is frail but alert and oriented to person and place. He was transferred from an extended-care facility to receive a percutaneous endoscopic gastrostomy (PEG) tube that was placed 5 days ago. He has a large family. They ask a lot of questions and argue continuously among themselves and with the staff. His vital signs are stable. • Mr. R, a 57-year-old man, has periumbilical pain. The pain is very severe, despite medication, and radiates to the back. Mr. R was admitted with acute pancreatitis. He is NPO and has an NG tube and IV line. He is belligerent and confused. His white blood cell (WBC) count and blood glucose level are increased.","intro":true}],"why":"All of this information could be given to the HCP, but validating renal function is a standard action before administering IV potassium. If the blood pressure is very low, the HCP could prescribe a fluid bolus, but potassium would not usually be added to that solution. Drainage from the NG tube would be replaced with IV fluids and electrolytes; therefore the HCP could use this information to adjust the IV rate. Abdominal assessment is part of the evaluation of therapy.","tip":"","meta":{"Focus":"Prioritization"},"note":"","keyText":"2","stem":"The nurse reports Ms. D’s laboratory results to the HCP, who then prescribes adding potassium to the IV fluid. Based on this prescription, which additional information should the nurse give to the HCP?","opts":["Latest blood pressure result","Urinary output per hour","Total drainage from the NG tube","Report on abdominal assessment"],"nopts":4,"key":[2],"type":"single"},{"id":"casestudy9-23","topic":"fe","topicName":"F&E / ABG","source":"Case Study 9: Multiple Patients With Gastrointestinal Problems","srcShort":"Case Study 9","num":23,"ctx":[{"text":"An RN is the leader of a team caring for patients with gastrointestinal disorders on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation, an experienced assistive personnel (AP), and a nursing student. The following information about the six assigned patients is included in the hand-off report. (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study. This gives you practice in identifying important information and simulates how you would use the notes to remember and keep track of six patients over the course of a shift.) • Ms. H, a 42-year-old woman, has right upper quadrant pain that radiates to the right shoulder. She has a history of gallstones. She was admitted through the emergency department last night with acute cholecystitis. The night shift nurse reports, “She had a good night.” • Ms. D, a 60-year-old woman, was admitted with vomiting and pain in the midabdomen related to a bowel obstruction. She reports abdominal pain that has gradually improved since the insertion of a nasogastric (NG) tube. She is receiving IV fluids and is currently NPO. • Ms. T, a 29-year-old woman, was admitted for an acute exacerbation of ulcerative colitis. She appears wasted and malnourished. She has severe diarrhea and reports predefecation abdominal pain and generalized tenderness to palpation. The plan is to start administering total parenteral nutrition (TPN) through a central line this morning. • Mr. A, a 26-year-old man, will be discharged in the afternoon. He is homeless and frequently sleeps in a nearby shelter. He had discharge teaching from the enterostomal therapist yesterday regarding his infected wound secondary to a ruptured appendix; he wants a review of the wound care instructions before he leaves. • Mr. K, an 85-year-old man, is frail but alert and oriented to person and place. He was transferred from an extended-care facility to receive a percutaneous endoscopic gastrostomy (PEG) tube that was placed 5 days ago. He has a large family. They ask a lot of questions and argue continuously among themselves and with the staff. His vital signs are stable. • Mr. R, a 57-year-old man, has periumbilical pain. The pain is very severe, despite medication, and radiates to the back. Mr. R was admitted with acute pancreatitis. He is NPO and has an NG tube and IV line. He is belligerent and confused. His white blood cell (WBC) count and blood glucose level are increased.","intro":true}],"why":"The low potassium (K+) level is the greatest concern because of the potential for cardiac dysthymias. Sodium (Na+) is also lost during diarrhea episodes. The WBC count, C-reactive protein, and ESR rate are likely to be increased because of the inflammatory process of the disease. Low hemoglobin (Hgb) and hematocrit (Hct) can occur because of ulceration and irritation of the intestinal mucosa.","tip":"For testing purposes and clinical practice, it is worthwhile to memorize normal values for common blood tests. Normal range for Na are 136 to 145mEq/L (136-145 mmol/L); K 3.5 to 5.0 mEq/L (3.5-5.0 mmol/L); WBC 5000 to 10,000/mm³ (5-10 X 10⁹/L); [female] Hgb 12 to 16 g/dl (7.4-9.9 mmol/L); [female] Hct 37% to 47% (0.37-0.47 volume fraction); [female] ESR 20 mm/hr.","meta":{"Focus":"Prioritization"},"note":"","keyText":"4","stem":"Because of Ms. T’s (ulcerative colitis) severe diarrhea, the nurse is reviewing the laboratory results. Which laboratory results are cause for greatest concern?","opts":["WBC count is 11,000/mm³ (11x10⁹/L).","Hemoglobin is 11 g/dl (6.83 mmol/L); hematocrit is 36% (0.36 volume fraction).","Erythrocyte sedimentation (ESR) rate is 22mm/hr.","Sodium is 132 mEq/L (132 mmol/L); potassium is 3.0 mEq/L 3.1mmol/L)."],"nopts":4,"key":[4],"type":"single"},{"id":"casestudy9-39","topic":"fe","topicName":"F&E / ABG","source":"Case Study 9: Multiple Patients With Gastrointestinal Problems","srcShort":"Case Study 9","num":39,"ctx":[{"text":"An RN is the leader of a team caring for patients with gastrointestinal disorders on a medical-surgical unit. The team includes a newly graduated RN who has recently completed hospital orientation, an experienced assistive personnel (AP), and a nursing student. The following information about the six assigned patients is included in the hand-off report. (Note to student: Use the information from the hand-off report to make brief notes about these six patients and refer to the notes as you work through the case study. This gives you practice in identifying important information and simulates how you would use the notes to remember and keep trac
