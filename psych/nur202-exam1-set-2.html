 any OTC medicine.\"","\"Yes, but take it at bedtime.\"","\"Only take half the usual dose.\""],"a":1,"r":"MAOIs plus vasoconstrictors (decongestants, epinephrine, amphetamines) can cause a hypertensive crisis. Teaching on the slides: do not use OTC medicines without talking to the provider.","src":"Slides 26, 36"},{"s":"meds","q":"A patient on nortriptyline (Pamelor) complains of a very dry mouth. Which advice does the nurse give?","o":["\"Stop the medicine until your mouth feels better.\"","\"Rinse with mouthwash that contains alcohol every hour.\"","\"Drink a glass of wine to relax your mouth.\"","\"Take frequent sips of water and chew sugarless gum.\""],"a":3,"r":"The slides list dry mouth as a side effect and teach frequent sips of water and chewing gum. Never stop the medication abruptly. Alcohol is to be avoided.","src":"Slides 30, 35"},{"s":"meds","q":"A patient on venlafaxine (Effexor) says, \"I forgot yesterday's dose, so I'll take two today.\" What should the nurse teach?","o":["\"That's fine as long as you take them together.\"","\"Take three to make up for it.\"","\"Don't double up. Take your next dose as scheduled, and call your provider if you aren't sure.\"","\"Skip today's dose too.\""],"a":2,"r":"\"Do not double up on meds\" is on the antidepressant teaching slide. A double dose raises the risk of side effects and toxicity.","src":"Slide 36"},{"s":"meds","q":"A patient who suddenly stopped paroxetine (Paxil) now has dizziness, nausea, irritability and flu-like feelings. What is this most likely?","o":["Serotonin syndrome","Neuroleptic malignant syndrome","Discontinuation syndrome","Hypertensive crisis"],"a":2,"r":"The slides list discontinuation syndrome as a side effect to watch for and teach: do not stop antidepressants abruptly. The provider tapers the dose instead.","src":"Slides 30, 35"},{"s":"meds","q":"A patient's phenelzine (Nardil) was stopped 5 days ago, and the provider now orders sertraline (Zoloft) to start today. What should the nurse do?","o":["Give the sertraline as ordered","Give half the dose","Give the sertraline with a full meal","Hold the sertraline and question the order, because at least 14 days are needed after an MAOI"],"a":3,"r":"The slides warn that a hypertensive crisis can occur if an SSRI is used within 14 days of an MAOI. Combining them can also cause serotonin syndrome.","src":"Slide 28"},{"s":"meds","q":"A patient taking carbamazepine (Tegretol) is to be switched to an MAOI. According to the slides, how long is the washout period?","o":["2 weeks","24 hours","5 weeks","No washout is needed"],"a":0,"r":"Slide 27: carbamazepine needs a 2-week washout before an MAOI, and fluoxetine needs 5 weeks. Starting too soon can cause a serious, possibly fatal reaction.","src":"Slide 27"},{"s":"meds","q":"Which evaluation finding best shows that care of a patient on an antidepressant has met its most important goal?","o":["The patient has not harmed self","The patient has gained 5 pounds","The patient sleeps 12 hours a night","The patient knows the name of the drug"],"a":0,"r":"The first evaluation item on the slides is \"has not harmed self.\" The top nursing diagnosis is risk for suicide related to depressed mood, so safety comes first.","src":"Slides 29, 37"},{"s":"meds","q":"A patient was started on lithium 3 days ago. How often should serum lithium levels be checked at this stage?","o":["Once a year","1–2 times a week until the dose and level are stable","Once a month","Only if the patient has symptoms"],"a":1,"r":"The slides state that levels are monitored 1–2 times a week after treatment starts, until the dosage and serum level are stable. After that they are checked less often.","src":"Slide 44"},{"s":"meds","q":"A patient taking lithium has a level of 2.4 mEq/L. Which findings match this level?","o":["Mild thirst only","Seizures, coma and cardiovascular collapse","Lots of dilute urine, worsening tremors, muscle irritability and confusion","No symptoms; this level is therapeutic"],"a":2,"r":"Toxicity symptoms by level: 1.5–2.0 brings blurred vision, ataxia, tinnitus, persistent nausea and vomiting, and severe diarrhea. 2.0–3.5 brings excessive dilute urine, increasing tremors, muscle irritability, psychomotor retardation and confusion. Above 3.5 brings seizures, coma, arrhythmias and cardiovascular collapse.","src":"Slide 46"},{"s":"meds","q":"A patient on lithium reports ringing in the ears, blurred vision and an unsteady walk. The nurse expects the lithium level to be in which range?","o":["0.6–1.2 mEq/L","1.0–1.5 mEq/L","1.5–2.0 mEq/L","Above 3.5 mEq/L"],"a":2,"r":"Tinnitus, blurred vision and ataxia, along with persistent nausea, vomiting and severe diarrhea, are early toxicity at 1.5–2.0 mEq/L. Hold the dose and notify the provider.","src":"Slides 46, 47"},{"s":"meds","q":"A patient's lithium level is 3.8 mEq/L. Which findings should the nurse be ready for?","o":["Tinnitus and mild nausea only","Weight gain and acne","Dry mouth and constipation","Seizures, coma, arrhythmias and possible cardiovascular collapse"],"a":3,"r":"Above 3.5 mEq/L the slides list impaired consciousness, nystagmus, seizures, coma, oliguria or anuria, arrhythmias, MI and cardiovascular collapse. This is life-threatening.","src":"Slide 46"},{"s":"meds","q":"Which patient is the poorest candidate for lithium?","o":["A patient with severe dehydration and kidney disease","A 30-year-old with acute mania","A patient who drinks 8 glasses of water a day","A patient with a normal sodium level"],"a":0,"r":"Lithium contraindications on the slides: hypersensitivity, cardiac or renal disease, dehydration, thyroid disease, urinary retention and older age. Lithium leaves the body through the kidneys, so poor kidney function or low fluid lets it build up to toxic levels.","src":"Slide 40"},{"s":"meds","q":"A patient on lithium plans to start running outdoors in the summer. Which teaching matters most?","o":["\"Cut back on salt so your blood pressure stays low.\"","\"Take an extra lithium dose before you run.\"","\"Drink 6–8 glasses of water a day and replace fluid and salt you lose from sweating.\"","\"Avoid drinking water while you run.\""],"a":2,"r":"Lithium acts like sodium. When the body loses sodium (sweating, vomiting, diarrhea, a low-salt diet), the kidneys hold on to lithium and the level rises toward toxicity. The slides teach 6–8 glasses of water a day and not reducing sodium.","src":"Slides 48, 49"},{"s":"meds","q":"A 14-year-old with bipolar disorder has an order for lamotrigine (Lamictal). Which contraindication on the slides applies?","o":["Patients who take vitamins","Patients who drink milk","Children younger than 16","Patients older than 12"],"a":2,"r":"The slides list Lamictal contraindications as hypersensitivity, renal or hepatic insufficiency, pregnancy, and children younger than 16. The nurse should question the order.","src":"Slide 41"},{"s":"meds","q":"A patient taking phenelzine (Nardil) has a new order for carbamazepine (Tegretol). What should the nurse do?","o":["Give the carbamazepine as ordered","Question the order, because carbamazepine is contraindicated with MAOIs","Give the two drugs 1 hour apart","Give the carbamazepine with food"],"a":1,"r":"Tegretol contraindications include MAOIs, lactation, pregnancy, liver, renal or cardiac disease, and older age. A 2-week washout is needed between them.","src":"Slides 27, 40"},{"s":"meds","q":"Verapamil (Calan, Isoptin) appears on the mood stabilizer slide. Which group does it belong to?","o":["Antimanic","Calcium channel blocker","Anticonvulsant","Benzodiazepine"],"a":1,"r":"The slide groups mood stabilizers into three sets: antimanic (lithium), anticonvulsants (Klonopin, carbamazepine, Depakote, Lamictal, Neurontin, Topamax, Trileptal) and calcium channel blockers (Calan, Isoptin).","src":"Slide 39"},{"s":"meds","q":"A patient with acute mania is pacing the halls nonstop, not eating, and running into other patients. Which nursing diagnosis is the priority?","o":["Knowledge deficit related to the medication","Risk for injury related to manic hyperactivity","Disturbed body image","Social isolation"],"a":1,"r":"\"Risk for injury related to manic hyperactivity\" is the first mood-stabilizer diagnosis on the slides. Physical safety comes before teaching or psychosocial goals.","src":"Slide 42"},{"s":"meds","q":"A patient has had hiccups for 3 days that nothing has stopped. The provider orders chlorpromazine (Thorazine). The patient asks, \"Isn't that for mental illness?\" What is the best response?","o":["\"Yes. The provider must think you have psychosis.\"","\"It's a sleeping pill.\"","\"That must be a mistake. I'll throw it away.\"","\"It's also used to treat hiccups that won't go away.\""],"a":3,"r":"The slides list intractable hiccups as a use for antipsychotics, along with psychosis and tics and vocal outbursts.","src":"Slide 50"},{"s":"meds","q":"A patient on an oral antipsychotic also takes an antacid several times a day. What should the nurse teach?","o":["\"Space the antacid away from the antipsychotic, because antacids reduce absorption.\"","\"Take them at the same time so you remember.\"","\"The antacid makes the antipsychotic stronger.\"","\"Stop the antipsychotic while you use antacids.\""],"a":0,"r":"Antacids and antidiarrheals decrease the absorption of antipsychotics, so the drug works less well. Give them at different times.","src":"Slide 53"},{"s":"meds","q":"A patient on haloperidol (Haldol) is also taking a beta blocker for high blood pressure. Which assessment matters most?","o":["Blood glucose","Skin color","Hearing","Blood pressure, especially when the patient stands up"],"a":3,"r":"Beta-adrenergic blockers add to the hypotensive effect of antipsychotics. Check orthostatic blood pressure and teach the patient to rise slowly.","src":"Slides 53, 70"},{"s":"meds","q":"A male patient on risperidone (Risperdal) is embarrassed and says his chest is getting bigger. What should the nurse know?","o":["Gynecomastia is a hormonal side effect of antipsychotics and should be reported","This is a sign of NMS","This happens only with benzodiazepines","This is a sign of lithium toxicity"],"a":0,"r":"Hormonal side effects on the slides: decreased libido, retrograde ejaculation, gynecomastia, amenorrhea and weight gain. These effects often lead patients to stop taking the drug, so address them openly.","src":"Slide 59"},{"s":"meds","q":"A patient taking ziprasidone (Geodon) reports dizziness and a \"fluttering\" heartbeat, then nearly faints. What is the most likely cause?","o":["Akathisia","Tardive dyskinesia","Prolonged QT interval","Hypoglycemia"],"a":2,"r":"Geodon can prolong the QT interval. The slides say to monitor vital signs every shift and watch for dizziness, palpitations, syncope or weakness. Notify the provider and expect an EKG.","src":"Slide 60"},{"s":"meds","q":"Which antipsychotic is specifically noted on the slides for causing seizures in about 5% of patients, depending on dose?","o":["Clozapine (Clozaril)","Haloperidol (Haldol)","Chlorpromazine (Thorazine)","Aripiprazole (Abilify)"],"a":0,"r":"The slides note that Clozaril lowers the seizure threshold and causes seizures in about 5% of patients, depending on dose. Patients with a seizure history need close monitoring.","src":"Slide 61"},{"s":"meds","q":"A patient is starting clozapine (Clozaril). How often should the WBC be drawn during the first 6 months?","o":["Daily","Weekly","Monthly","Only if the patient has a fever"],"a":1,"r":"Clozaril blood work is drawn weekly for the first 6 months, and only a 1-week supply is given at a time. Stop therapy if the WBC is below 3,000 or granulocytes are below 1,500.","src":"Slide 62"},{"s":"meds","q":"A patient on clozapine (Clozaril) wakes up with a wet pillow every morning and is drooling during the day. What is this?","o":["A sign of an MAOI reaction","A sign of agranulocytosis","A sign of lithium toxicity","Hypersalivation, a known side effect of clozapine"],"a":3,"r":"Hypersalivation is listed with clozapine on the slides. It is unusual because most antipsychotics cause dry mouth.","src":"Slides 56, 62"},{"s":"meds","q":"A patient's eyes suddenly roll back and stay fixed upward an hour after an IM dose of haloperidol (Haldol). The patient is awake and terrified. What should the nurse do?","o":["Treat it as a seizure and only document","Treat it as an emergency: stay with the patient, notify the provider STAT, and give benztropine (Cogentin) as ordered","Tell the patient to relax and close the eyes","Give another dose of haloperidol"],"a":1,"r":"This is an oculogyric crisis. It can look like a seizure or a dystonic reaction, and both are emergencies. Notify the provider STAT, give Cogentin as ordered, and stay with the patient to reassure them.","src":"Slides 63, 64"},{"s":"meds","q":"Which extrapyramidal symptom (EPS) is matched to the correct description?","o":["Akathisia: a fixed upward stare","Akinesia: muscle weakness","Dystonia: restless \"happy feet\"","Pseudoparkinsonism: worm-like tongue movements"],"a":1,"r":"From the slides: akinesia is muscle weakness. Akathisia is restlessness (\"happy feet\"). Dystonia is muscle spasms. Oculogyric crisis is the eyes rolling back. Pseudoparkinsonism is tremor, shuffling, drooling and rigidity. Worm-like tongue movements are tardive dyskinesia.","src":"Slide 63"},{"s":"meds","q":"A patient has neuroleptic malignant syndrome (NMS). The antipsychotic has been stopped. Which drug should the nurse expect the provider to order?","o":["Dantrolene (Dantrium) or bromocriptine (Parlodel)","Benztropine (Cogentin)","Haloperidol (Haldol)","Lithium carbonate"],"a":0,"r":"The slides state the provider may order bromocriptine or dantrolene to counteract NMS. The patient is usually transferred to a medical unit.","src":"Slide 68"},{"s":"meds","q":"A patient with suspected NMS has been transferred. Which set of assessments do the slides direct the nurse to monitor?","o":["Mood and sleep only","Weight and appetite only","Hearing and vision","Vital signs, degree of muscle rigidity, intake and output, and level of consciousness"],"a":3,"r":"Ongoing NMS care on the slides: monitor vital signs (especially temperature), degree of muscle rigidity, intake and output, and level of consciousness.","src":"Slide 68"},{"s":"meds","q":"A family member asks how quickly NMS develops. What is accurate?","o":["It can start hours or even years after the drug is started, and then gets worse quickly over 24–72 hours","It only happens on the first day of treatment","It develops slowly over many months","It only happens after the drug is stopped"],"a":0,"r":"The slides state NMS onset can be hours to years after starting the medication, with rapid progression over 24–72 hours. That is why the nurse monitors temperature and rigidity routinely.","src":"Slide 67"},{"s":"meds","q":"A patient on chlorpromazine (Thorazine) is going home in January. Which teaching is important?","o":["\"Dress warmly in cold weather.\"","\"Take a hot bath every night.\"","\"Stop your medicine when it's cold out.\"","\"You don't need sunscreen in winter.\""],"a":0,"r":"Antipsychotics affect temperature regulation, so the slides say to avoid extreme temperatures and dress warmly in cold weather. Sunscreen is still needed because of photosensitivity.","src":"Slides 52, 70"},{"s":"meds","q":"Antipsychotic teaching says never stop the medication abruptly, with one exception. What is it?","o":["Mild dry mouth","Neuroleptic malignant syndrome","Feeling better","Weight gain"],"a":1,"r":"The slides say \"Do not stop taking the meds abruptly (except NMS).\" With NMS, the drug is stopped right away and the provider is notified STAT.","src":"Slides 68, 70"},{"s":"meds","q":"A patient with Parkinson's disease develops hallucinations, and a typical antipsychotic is being considered. Why does the nurse raise a concern?","o":["Parkinson's disease is listed as a precaution, because blocking dopamine can worsen movement symptoms","Antipsychotics cure Parkinson's disease","Parkinson's patients cannot take pills","There is no concern"],"a":0,"r":"Parkinson's disease is on the antipsychotic precaution list. Parkinson's is already a dopamine shortage, so blocking dopamine further makes the rigidity and tremor worse.","src":"Slides 10, 52"},{"s":"meds","q":"How do atypical antipsychotics differ from typical antipsychotics in how they work?","o":["Atypicals block certain serotonin receptors as well as dopamine","Atypicals strengthen GABA","Atypicals block the reuptake of norepinephrine only","Atypicals do not affect neurotransmitters"],"a":0,"r":"From the slides: antipsychotics block dopamine receptors, and atypicals also block specific serotonin receptors. Benzodiazepines work on GABA, and antidepressants block reuptake.","src":"Slide 10"},{"s":"meds","q":"A patient says, \"Now that I'm on medication, I don't need therapy anymore.\" Which response reflects the slides?","o":["\"Medication helps relieve symptoms but doesn't solve emotional problems. It works best together with therapy.\"","\"You're right. The medicine cures the illness.\"","\"You only need therapy if the medicine fails.\"","\"Therapy and medicine can't be used together.\""],"a":0,"r":"Psychotropic medications are not meant to cure mental illness. They relieve physical and behavioral symptoms and are used together with therapy.","src":"Slides 6, 7"}];
const TOTAL = QUESTIONS.length;
{const t=document.getElementById("totN");if(t)t.textContent=TOTAL;else document.addEventListener("DOMContentLoaded",()=>{const e=document.getElementById("totN");if(e)e.textContent=TOTAL;});}
const SECTIONS = [
  {id:"meds", name:"Medications", c:"var(--meds)"},
  {id:"ch1", name:"Ch 1 Mental Health", c:"var(--ch1)"},
  {id:"ch6", name:"Ch 6 Legal & Ethical", c:"var(--ch6)"},
  {id:"ch8", name:"Ch 8 Relationships", c:"var(--ch8)"},
  {id:"ch25", name:"Ch 25 Suicide & NSSI", c:"var(--ch25)"}
];
const SEC = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const LET = ["A","B","C","D"];
QUESTIONS.forEach((q,i)=>{ q.id = i; });

// Fixed "exam mix" order (seeded shuffle so numbering stays the same for every visit)
function seeded(seed){ return ()=>{ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }; }
const MIX = (()=>{ const r = seeded(20261009); const a = QUESTIONS.map(q=>q.id); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; })();
const BYSEC = SECTIONS.flatMap(s=>QUESTIONS.filter(q=>q.s===s.id).map(q=>q.id));

const KEY = "nur202_exam1_set2_v1";
let st = { answers:{}, order:"mix", filter:"all", missed:false, cur:0 };
try{ const raw = localStorage.getItem(KEY); if(raw) st = Object.assign(st, JSON.parse(raw)); }catch(e){}
if (window.claude?.hot?.data?.st) st = Object.assign(st, window.claude.hot.data.st);
window.claude?.hot?.snapshot?.(()=>({st}));
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const isRight = id => st.answers[id] !== undefined && st.answers[id] === QUESTIONS[id].a;
const isWrong = id => st.answers[id] !== undefined && st.answers[id] !== QUESTIONS[id].a;

// global numbering follows the chosen order across all questions
function fullOrder(){ return st.order === "mix" ? MIX : BYSEC; }
function numberOf(id){ return fullOrder().indexOf(id) + 1; }
function seq(){
  return fullOrder().filter(id => (st.filter==="all" || QUESTIONS[id].s===st.filter) && (!st.missed || isWrong(id)));
}

function renderTop(){
  const ids = QUESTIONS.map(q=>q.id);
  const done = ids.filter(id=>st.answers[id]!==undefined).length;
  const right = ids.filter(isRight).length;
  const pct = done ? Math.round(right/done*100) : 0;
  $("#score").innerHTML = `<span class="pill"><span><b>${done}</b>/${TOTAL} answered</span></span><span class="pill"><span class="dot" style="background:var(--ok)"></span><span><b>${right}</b> correct · ${pct}%</span></span>`;
  const [g,r] = $("#pbar").children; g.style.width = (right/TOTAL*100)+"%"; r.style.width = ((done-right)/TOTAL*100)+"%";
  const chip = (id,label,c,n)=>`<button class="chip" type="button" style="--c:${c}" aria-pressed="${st.filter===id}" data-f="${id}">${id==="all"?"":'<span class="sw"></span>'}${esc(label)} <span class="n">${n}</span></button>`;
  $("#chips").innerHTML = chip("all","All sections","var(--accent)",TOTAL) + SECTIONS.map(s=>chip(s.id,s.name,s.c,QUESTIONS.filter(q=>q.s===s.id).length)).join("");
  $("#order").textContent = st.order==="mix" ? "Order: exam mix" : "Order: by section";
  $("#missed").setAttribute("aria-pressed", st.missed);
  const nWrong = ids.filter(isWrong).length;
  $("#retry").disabled = !nWrong; $("#retry").textContent = nWrong ? `Retry missed (${nWrong})` : "Retry missed";
}

function renderQ(){
  const list = seq(); const view = $("#qview");
  if(!list.length){
    view.innerHTML = `<div class="empty">${st.missed ? "No missed questions here. Nice work." : "No questions match this filter."}</div>`;
    return;
  }
  if(st.cur >= list.length) st.cur = list.length-1; if(st.cur<0) st.cur=0;
  const id = list[st.cur], q = QUESTIONS[id], s = SEC[q.s];
  const chosen = st.answers[id], answered = chosen !== undefined;
  const opts = q.o.map((o,i)=>{
    let cls = "", mk = "";
    if(answered){ if(i===q.a){ cls="correct"; mk = i===chosen ? "Your answer · correct" : "Correct answer"; } else if(i===chosen){ cls="wrong"; mk="Your answer"; } else cls="dim"; }
    return `<li><button class="opt ${cls}" type="button" data-i="${i}" ${answered?"disabled":""} aria-label="Option ${LET[i]}: ${esc(o)}"><span class="let">${LET[i]}</span><span class="txt">${esc(o)}</span><span class="mk">${mk}</span></button></li>`;
  }).join("");
  const fb = answered ? `<div class="fb ${chosen===q.a?"ok":"bad"}"><h3>${chosen===q.a ? "Correct." : "Not quite. The answer is " + LET[q.a] + "."}</h3><p>${esc(q.r)}</p><span class="src">Source: ${esc(q.src)}</span></div>` : "";
  view.innerHTML = `<article class="qcard" style="--c:${s.c}">
    <div class="meta"><span class="sec">${esc(s.name)}</span><span class="num">Question ${numberOf(id)} of ${TOTAL}${list.length<TOTAL?` · ${st.cur+1}/${list.length} in this view`:""}</span></div>
    <p class="stem">${esc(q.q)}</p>
    <ol class="opts">${opts}</ol>
    ${fb}
    <div class="nav">
      <button class="nbtn" id="prev" type="button" ${st.cur===0?"disabled":""}>Previous</button>
      <span class="hint">Keys: A–D to answer · ← → to move</span>
      <button class="nbtn ${answered?"primary":""}" id="next" type="button" ${st.cur===list.length-1?"disabled":""}>${answered?"Next question":"Skip"}</button>
    </div></article>`;
}

function renderGrid(){
  const list = seq(); const curId = list[st.cur];
  $("#grid").innerHTML = fullOrder().map(id=>{
    const q = QUESTIONS[id]; const inView = list.includes(id);
    const cls = isRight(id) ? "ok" : isWrong(id) ? "bad" : "";
    return `<button class="cell ${cls} ${id===curId?"cur":""}" type="button" style="--c:${SEC[q.s].c};${inView?"":"opacity:.35"}" data-id="${id}" aria-label="Question ${numberOf(id)}${cls==="ok"?", correct":cls==="bad"?", missed":""}">${numberOf(id)}</button>`;
  }).join("");
}

function renderSummary(){
  const done = QUESTIONS.filter(q=>st.answers[q.id]!==undefined).length;
  const box = $("#summary");
  if(!done){ box.innerHTML = `<h2>Your results</h2><p style="margin:0;color:var(--muted)">Answer a question to start your score. The blueprint weights medications most (${QUESTIONS.filter(q=>q.s==="meds").length} of ${TOTAL} here), so that bar matters most.</p>`; return; }
  const right = QUESTIONS.filter(q=>isRight(q.id)).length;
  const rows = SECTIONS.map(s=>{
    const qs = QUESTIONS.filter(q=>q.s===s.id); const d = qs.filter(q=>st.answers[q.id]!==undefined).length; const r = qs.filter(q=>isRight(q.id)).length;
    return `<div class="srow" style="--c:${s.c}"><span class="lab"><i></i>${esc(s.name)}</span><span class="val">${r}/${d} of ${qs.length}</span><div class="bar"><i class="g" style="width:${r/qs.length*100}%"></i><i class="r" style="width:${(d-r)/qs.length*100}%"></i></div></div>`;
  }).join("");
  const finished = done===TOTAL;
  box.innerHTML = `<h2>${finished?"Final results":"Results so far"}</h2>
    <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span class="big">${Math.round(right/done*100)}%</span><span style="color:var(--muted)">${right} correct of ${done} answered${finished?"":` · ${TOTAL-done} to go`}</span></div>
    <div class="rows">${rows}</div>`;
}

function render(){ renderTop(); renderQ(); renderGrid(); renderSummary(); save(); }

function answer(i){
  const list = seq(); const id = list[st.cur]; if(id===undefined || st.answers[id]!==undefined) return;
  st.answers[id] = i; render();
  const fb = document.querySelector(".fb"); if(fb && fb.getBoundingClientRect().bottom > innerHeight) fb.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function go(d){ const n = seq().length; st.cur = Math.max(0, Math.min(n-1, st.cur + d)); render(); $("#qview").scrollIntoView({block:"nearest"}); }

$("#qview").addEventListener("click", e=>{
  const o = e.target.closest(".opt"); if(o && !o.disabled) return answer(+o.dataset.i);
  if(e.target.closest("#prev")) return go(-1);
  if(e.target.closest("#next")) return go(1);
});
$("#grid").addEventListener("click", e=>{
  const c = e.target.closest(".cell"); if(!c) return; const id = +c.dataset.id;
  let list = seq(); if(!list.includes(id)){ st.filter="all"; st.missed=false; list = seq(); }
  st.cur = list.indexOf(id); render(); $("#qview").scrollIntoView({block:"start"});
});
$("#chips").addEventListener("click", e=>{ const c = e.target.closest(".chip"); if(!c) return; st.filter = c.dataset.f; st.cur = 0; render(); });
$("#order").addEventListener("click", ()=>{ const list = seq(); const id = list[st.cur]; st.order = st.order==="mix" ? "section" : "mix"; const nl = seq(); st.cur = Math.max(0, nl.indexOf(id)); render(); });
$("#missed").addEventListener("click", ()=>{ st.missed = !st.missed; st.cur = 0; render(); });
$("#retry").addEventListener("click", ()=>{
  const wrong = QUESTIONS.filter(q=>isWrong(q.id)).map(q=>q.id); if(!wrong.length) return;
  wrong.forEach(id=>delete st.answers[id]);
  st.missed = false; st._retry = wrong; st.filter = "all";
  st.cur = Math.max(0, seq().indexOf(fullOrder().find(id=>wrong.includes(id)))); render();
});
$("#reset").addEventListener("click", ()=>{ $("#confirm").hidden = false; });
$("#confirmNo").addEventListener("click", ()=>{ $("#confirm").hidden = true; });
$("#confirmYes").addEventListener("click", ()=>{ st.answers = {}; st.cur = 0; st.missed = false; $("#confirm").hidden = true; render(); window.scrollTo({top:0}); });
document.addEventListener("keydown", e=>{
  if(e.target.closest && e.target.closest("input,textarea")) return; if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase(); const idx = ["a","b","c","d"].indexOf(k); const num = ["1","2","3","4"].indexOf(k);
