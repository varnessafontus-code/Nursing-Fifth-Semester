<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: an exam booklet — sticky score strip on top, one question card at a time, answer sheet grid below */
:root{
  --paper:#EEF3F1; --card:#FFFFFF; --ink:#132029; --muted:#55646D; --line:#D2DCD9; --line-strong:#B9C7C3;
  --accent:#0A6A64; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --ok:#1E7A3C; --ok-soft:#E3F3E7; --bad:#AD2318; --bad-soft:#FBEAE7; --idle:#E4EAE8;
  --meds:#6A3D9A; --ch1:#1F6F8B; --ch6:#B03A2E; --ch8:#2E7D4F; --ch25:#A35C00;
  --shadow:0 1px 2px rgba(19,32,41,.06),0 6px 18px rgba(19,32,41,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --ok:#6FD08E; --ok-soft:#14301E; --bad:#FF8A7E; --bad-soft:#3A1C1A; --idle:#22313A;
  --meds:#C99BDA; --ch1:#6CC3D2; --ch6:#F08B80; --ch8:#80C99C; --ch25:#E7B95A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --ok:#6FD08E; --ok-soft:#14301E; --bad:#FF8A7E; --bad-soft:#3A1C1A; --idle:#22313A;
  --meds:#C99BDA; --ch1:#6CC3D2; --ch6:#F08B80; --ch8:#80C99C; --ch25:#E7B95A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.score{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;color:var(--ink);white-space:nowrap}
.pill b{font-weight:500}
.pill .dot{width:8px;height:8px;border-radius:50%}
.bar{height:6px;border-radius:999px;background:var(--idle);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent))}
.chip .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .sp{flex:1}
.tbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.82rem;font-weight:700}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tbtn.warn{color:var(--bad)}

main .wrap{padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--c)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.meta .sec{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.meta .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stem{margin:0;font-size:1.08rem;line-height:1.55;font-weight:400;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .let{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.85rem;background:var(--idle);color:var(--ink)}
.opt .txt{min-width:0}
.opt .mk{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;align-self:center}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .let{background:var(--ok);color:var(--card)}
.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);color:var(--card)}
.opt.wrong .mk{color:var(--bad)}
.opt.dim{opacity:.6}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{margin:0;font-family:var(--f-display);font-stretch:110%;font-size:1rem}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb p{margin:0;max-width:70ch}
.fb .src{font-size:.8rem;color:var(--muted)}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.nbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:700}
.nbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nbtn:disabled{opacity:.45;cursor:default}
.hint{font-size:.76rem;color:var(--muted)}
@media (max-width:600px){ .hint{display:none} }

.sheet{display:flex;flex-direction:column;gap:10px}
.sheet h2,.summary h2{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sheet h2::after,.summary h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:36px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums;position:relative}
.cell::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:7px 7px 0 0;background:var(--c)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:500}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:500}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}

.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 12px;align-items:center;font-size:.88rem}
.srow .lab{display:flex;gap:8px;align-items:center;min-width:0}
.srow .lab i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.srow .val{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.srow .bar{grid-column:1/-1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;background:var(--bad-soft);border:1px solid var(--bad);border-radius:9px;padding:8px 10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line-strong);border-radius:12px}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

    </section>

<script>
const QUESTIONS = [{"s":"ch1","q":"A new staff nurse has finished orientation on a psychiatric unit. Which intervention would the nurse expect only the psychiatric advanced practice nurse to perform?","o":["Prescribing psychotropic medication","Completing a mental health assessment","Building a therapeutic relationship","Individualizing the nursing care plan"],"a":0,"r":"Prescriptive authority belongs to advanced practice nurses (PMH-APRN). Basic-level RNs assess, build therapeutic relationships and individualize care plans.","src":"Chapter 1, Table 1.2"},{"s":"ch1","q":"A nursing student says, \"I don't want to work in psych. I'd lose all my nursing skills.\" Which reply by a psychiatric nurse is most accurate?","o":["\"Psych units are safer, so we get better staffing ratios.\"","\"We don't deal with as much suffering as med-surg nurses.\"","\"Actually, we manage IV drips and cardiac monitors all day.\"","\"We use complex communication and critical thinking to solve problems with many parts.\""],"a":3,"r":"Psychiatric nursing relies on advanced communication and critical thinking to address physical, psychological and social problems together. Workloads are not lighter, and psychological suffering is as real as physical suffering.","src":"Chapter 1"},{"s":"ch1","q":"A group of nurses writes to their state legislators opposing a bill that would cut funding for community mental health services. Which nursing role are they carrying out?","o":["Recovery","Attending","Advocacy","Milieu therapy"],"a":2,"r":"Advocacy includes supporting patients' rights and working on legislation and funding that affect people with mental illness, who often have little political voice.","src":"Chapter 1"},{"s":"ch1","q":"Which patient statement best shows the patient experienced the nurse as caring?","o":["\"My nurse lets me choose which juice to take my pills with.\"","\"My nurse sits and listens to my problems, so I don't feel so alone.\"","\"My nurse explained my treatment plan and asked for my ideas.\"","\"My nurse said if I take all my pills I'll go home sooner.\""],"a":1,"r":"Caring shows up as empathic presence that eases isolation. Offering choices and involving the patient in planning support autonomy; promising discharge for adherence is advice-giving.","src":"Chapter 1; Chapter 8"},{"s":"ch1","q":"Which assessment finding most strongly suggests that a patient may have a mental illness?","o":["A sad, discouraged, hopeless mood most days for weeks","Trouble sleeping now and then before exams","Mixed feelings about whether to change jobs","Feeling nervous before a job interview"],"a":0,"r":"A persistent hopeless mood is a significant alteration in emotion that impairs functioning. The other findings are normal, temporary stress responses at the well-being end of the continuum.","src":"Chapter 1, Fig. 1.2"},{"s":"ch1","q":"The goal for a patient is \"Demonstrates mentally healthy behavior.\" Which finding shows the goal was met?","o":["Acts without thinking about consequences","Meets own needs regardless of others' rights","Sees self as able to reach goals and handle life's demands","Relies on others to make major life decisions"],"a":2,"r":"A positive self-concept and confidence in meeting demands are attributes of mental health (Fig. 1.1). The other options describe impulsivity, disregard for others and dependency.","src":"Chapter 1, Fig. 1.1"},{"s":"ch1","q":"A nurse sees an unfamiliar psychiatric diagnosis on an admission form and wants to know the criteria used to make it. Which resource is best?","o":["A general internet encyclopedia","The International Classification for Nursing Practice","The Psychiatric-Mental Health Nursing Scope and Standards","The DSM-5"],"a":3,"r":"The DSM-5 (American Psychiatric Association) lists the diagnostic criteria for each psychiatric disorder. Nursing classifications describe human responses and interventions, not medical diagnostic criteria.","src":"Chapter 1"},{"s":"ch1","q":"Which person is showing the most resilience?","o":["Someone who pushes all stress out of mind and never talks about it","A widow who becomes too depressed to leave home","A worker laid off from a permanent job who takes a temporary job to keep paying bills","A family still living in a shelter 2 years after a fire, with no plans to move"],"a":2,"r":"Resilience is the ability to secure the resources needed for well-being after a setback. Repression and staying stuck are not adaptive.","src":"Chapter 1"},{"s":"ch1","q":"A college student says, \"Most of the time I feel good about myself, and I've learned I get out of things what I put into them.\" Where does this student fall on the mental health–mental illness continuum?","o":["Mental illness end","Emotional problems with moderate impairment","Serious mental illness","Mental health (well-being) end"],"a":3,"r":"The student shows a positive self-concept, reality orientation and effective functioning: the well-being end. Mental health does not require being happy all the time.","src":"Chapter 1, Fig. 1.2"},{"s":"ch1","q":"Which condition is an example of a culture-bound syndrome?","o":["Epilepsy","Running amok","Schizophrenia","Major depressive disorder"],"a":1,"r":"Culture-bound syndromes occur in specific sociocultural settings and are easily recognized there. Running amok (Southeast Asia) involves a sudden burst of violent behavior, usually by a man.","src":"Chapter 1"},{"s":"ch1","q":"At a health fair, someone asks which disorder in this list affects the largest share of people. Based on 12-month prevalence data, which is the best answer?","o":["Alzheimer's disease (in people over 65)","Bipolar disorder","Dissociative fugue","Schizophrenia"],"a":0,"r":"Alzheimer's disease affects about 10% of people over 65 (50% over 85). Schizophrenia is about 1.1% and bipolar disorder about 2.6%; dissociative fugue is rare.","src":"Chapter 1, Table 1.1"},{"s":"ch1","q":"In mainstream US culture, which person is most likely to be labeled mentally ill, even though their own religious community may see the behavior as normal?","o":["An optimist who expects good things in life","A pessimist who still works hard toward goals","A wealthy person who gives money to people in need","A person who reports hearing God's voice speak to them"],"a":3,"r":"Hearing voices is usually linked to mental illness, but in some religious groups hearing God's voice is valued. Culture shapes what is seen as normal, which complicates diagnosis.","src":"Chapter 1; Chapter 5"},{"s":"ch1","q":"A patient's relationships are intense and unstable: the patient idealizes a partner, then devalues them, and often feels empty. Which aspect of mental health should interventions target?","o":["Satisfying, stable relationships","Communication skills","Productive activities","Effectiveness at work"],"a":0,"r":"The data describe unstable relationships. Mentally healthy relationships are stable, satisfying and socially integrated. No data are given about work, communication or activities.","src":"Chapter 1, Fig. 1.1"},{"s":"ch1","q":"Which belief best prepares a nurse to advocate for a patient during an interdisciplinary care conference?","o":["All mental illnesses are caused by culture","Symptoms of mental disorders look the same in every culture","Culture has little to do with psychiatric assessment","A patient's symptoms and behaviors reflect the patient's cultural patterns"],"a":3,"r":"Understanding that culture shapes how symptoms appear lets the nurse explain the patient's behavior accurately to the team. The other statements are untrue.","src":"Chapter 1; Chapter 5"},{"s":"ch1","q":"A team compares outcomes between depressed patients who get medication plus supportive therapy and those who get medication only. What kind of study is this?","o":["Incidence study","Prevalence study","Clinical epidemiology","Comorbidity study"],"a":2,"r":"Clinical epidemiology includes observational and experimental studies of interventions used to treat people with an illness, along with natural history and screening studies.","src":"Chapter 1"},{"s":"ch1","q":"The husband of a patient with schizophrenia asks, \"Was it something in her childhood that caused this?\" Which response best helps him understand the cause?","o":["\"Research shows strong biological influences, which can be triggered by stress.\"","\"This illness comes from her upbringing, not her biology.\"","\"Childhood stress causes most mental illnesses.\"","\"It must be hard to see her sick so often.\""],"a":0,"r":"Schizophrenia has a strong biological (genetic and brain-based) component, and the diathesis-stress model explains how stress can trigger it. Empathy alone doesn't answer his question.","src":"Chapter 1"},{"s":"ch1","q":"A county health report lists the total number of residents currently living with bipolar disorder, including both new and long-standing cases. This figure is the:","o":["Incidence","Prevalence","Lifetime risk","Parity rate"],"a":1,"r":"Prevalence is the total number of cases, new and existing, in a population during a period. Incidence counts only new cases.","src":"Chapter 1"},{"s":"ch1","q":"Which principle of mental health care is one of the six key areas promoted by QSEN?","o":["Every genome is unique","Healthy development supports mental health","Care is centered on the patient","Recovery happens on a continuum"],"a":2,"r":"QSEN's six areas are patient-centered care, teamwork and collaboration, evidence-based practice, quality improvement, safety and informatics.","src":"Chapter 1"},{"s":"ch1","q":"Another health professional asks how a DSM-5 diagnosis differs from a nursing diagnosis. Which answer is best?","o":["\"The DSM identifies the disorder to guide medical treatment; a nursing diagnosis names the patient's response to guide nursing interventions.\"","\"The DSM ignores culture; nursing diagnoses consider it.\"","\"They're the same; both name the disorder.\"","\"The DSM explains causes; nursing diagnoses never consider causes.\""],"a":0,"r":"The DSM-5 names the psychiatric disorder. Nursing diagnoses describe the patient's responses (insomnia, hopelessness) and frame nursing care. Both consider culture.","src":"Chapter 1"},{"s":"ch1","q":"Which intervention is within the scope of a psychiatric advanced practice nurse but not a basic-level RN?","o":["Coordinating care","Psychotherapy","Milieu therapy","Health teaching"],"a":1,"r":"Psychotherapy (individual, couple, group, family) is an advanced practice intervention. Coordination of care, health teaching and milieu therapy are basic-level interventions.","src":"Chapter 1, Table 1.2"},{"s":"ch1","q":"An experienced nurse tells a new graduate, \"After enough years, you just know how to care for psychotic patients.\" What should the new graduate keep in mind?","o":["New research should keep informing practice, and each patient is an individual","Trial and error is the best way to learn psychiatric care","Experience alone is enough for safe practice","Intuition is more reliable than research"],"a":0,"r":"Evidence-based practice means continuously using new research and standards of care. Overgeneralizing from experience can cause nurses to lose sight of each patient's individuality.","src":"Chapter 1"},{"s":"ch1","q":"Which statement best shows mental health?","o":["\"I spend every holiday alone watching TV.\"","\"I have weaknesses, but I know I matter to my family and friends.\"","\"I follow my parents' beliefs exactly and never question them.\"","\"I avoid thinking about the future.\""],"a":1,"r":"Mental health includes self-esteem, realistic self-appraisal and meaningful relationships. Isolation, rigid unexamined beliefs and avoidance are less healthy.","src":"Chapter 1"},{"s":"ch1","q":"In the ED a patient says, \"Voices tell me someone wants to kill me because I cured cancer. I have a knife and I'll stab anyone who threatens me.\" Which aspect of mental health is the most immediate concern?","o":["Happiness","Work effectiveness","Spiritual satisfaction","Control over behavior"],"a":3,"r":"The plan to stab people shows poor control over behavior and creates immediate danger. Reality appraisal and self-concept are also impaired, but safety comes first.","src":"Chapter 1"},{"s":"meds","q":"A nurse gives a medication that strengthens the action of GABA. Which effect should the nurse expect?","o":["Improved memory","Reduced anxiety","More organized thinking","Fewer hallucinations"],"a":1,"r":"GABA is the brain's main calming (inhibitory) messenger. Drugs that enhance it, such as benzodiazepines, reduce anxiety. Your professor linked anxiety to GABA.","src":"Slide 10; lecture"},{"s":"meds","q":"A patient starts a drug with strong anticholinergic effects. Which findings should the nurse watch for?","o":["Diarrhea and excess salivation","Dry mouth, constipation and urinary retention","Bradycardia and pinpoint pupils","Increased sweating and frequent urination"],"a":1,"r":"Anticholinergic drugs block acetylcholine in the parasympathetic system, causing dry mouth, blurred vision, constipation, urinary retention and tachycardia (slide 57).","src":"Slides 31, 57"},{"s":"meds","q":"How does a reuptake-inhibiting antidepressant work?","o":["It leaves more of the neurotransmitter available in the synapse","It destroys the neurotransmitter in the synapse","It destroys the receptor sites","It stops the brain from making the neurotransmitter"],"a":0,"r":"Blocking reuptake keeps serotonin and norepinephrine in the synaptic gap longer, making more available for transmission (slides 8–9).","src":"Slides 8–9"},{"s":"meds","q":"A patient on an antipsychotic develops restlessness and an overwhelming need to keep moving. What drug action causes this?","o":["Anticholinergic effects","Endocrine stimulation","Dopamine-blocking effects","Serotonin excess"],"a":2,"r":"Blocking dopamine in movement pathways causes EPS such as akathisia. Anticholinergic effects cause dry mouth, constipation and blurred vision.","src":"Slides 10, 63"},{"s":"meds","q":"A patient has acute anxiety 2 hours after a car accident. Which medication group should the nurse expect to teach about?","o":["Tricyclic antidepressants","Benzodiazepines","Mood stabilizers","Antipsychotics"],"a":1,"r":"Benzodiazepines relieve acute anxiety quickly. Antidepressants and BuSpar take weeks, and antipsychotics and mood stabilizers treat psychosis and mania.","src":"Slides 11–13"},{"s":"meds","q":"A patient is admitted with severe depression. Which medication should the nurse expect to teach the patient about?","o":["Chlordiazepoxide (Librium)","Clozapine (Clozaril)","Lithium carbonate","Sertraline (Zoloft)"],"a":3,"r":"Sertraline is an SSRI, the drug of choice for major depression. Librium is a benzodiazepine, Clozaril is an antipsychotic, and lithium is a mood stabilizer.","src":"Slide 22; lecture"},{"s":"meds","q":"A patient with bipolar disorder is irritable, aggressive, very talkative and agitated. Which medication group should the nurse expect?","o":["Psychostimulants","Mood stabilizers","Anticholinergics","SSRIs"],"a":1,"r":"These are signs of mania, treated with mood stabilizers such as lithium and anticonvulsants (Tegretol, Depakote, Lamictal). Stimulants and antidepressants can worsen mania.","src":"Slides 38–39"},{"s":"meds","q":"A patient starts a phenothiazine such as fluphenazine (Prolixin). Because of its strong dopamine-blocking action, which teaching is most important?","o":["\"Chew sugarless gum for dry mouth.\"","\"Eat more fiber.\"","\"Report any muscle stiffness or unusual movements.\"","\"Get up slowly from bed.\""],"a":2,"r":"Dopamine blockade in movement pathways causes EPS (stiffness, tremor, restlessness, spasms), often early in treatment. The other teaching points relate to anticholinergic or blood pressure effects.","src":"Slides 51, 63"},{"s":"meds","q":"A patient says, \"My doctor switched me to Paxil (paroxetine). I guess I'll get the same side effects I had on Tofranil (imipramine).\" The nurse's reply is based on knowing that paroxetine is:","o":["A tricyclic antidepressant","An MAO inhibitor","An SSRI, with fewer side effects than a tricyclic","A benzodiazepine"],"a":2,"r":"Paxil is an SSRI; Tofranil is a tricyclic. SSRIs are better tolerated and much safer in overdose, though SSRIs have their own side effects (insomnia, headache, sexual dysfunction).","src":"Slides 22, 31–32"},{"s":"meds","q":"Which medication is most likely to cause anticholinergic side effects?","o":["Imipramine (Tofranil)","Buspirone (BuSpar)","Lithium","Sertraline (Zoloft)"],"a":0,"r":"Imipramine is a tricyclic with strong anticholinergic effects (dry mouth, blurred vision, constipation, urinary retention). Lithium affects fluid balance; BuSpar has few side effects; SSRIs have few anticholinergic effects.","src":"Slides 22, 31"},{"s":"meds","q":"A nurse's patients take haloperidol (Haldol), carbamazepine (Tegretol), trazodone (Desyrel) and phenelzine (Nardil). Which patient needs a special diet order?","o":["The patient on Haldol","The patient on Nardil","The patient on Desyrel","The patient on Tegretol"],"a":1,"r":"Nardil is an MAOI, so the patient needs a tyramine-restricted diet to prevent hypertensive crisis.","src":"Slides 22, 33"},{"s":"meds","q":"Why does a patient taking an MAOI need to avoid certain foods and medications?","o":["Risk of hypertensive crisis","Risk of hypotensive shock","Risk of cardiac dysrhythmia","Risk of hypoglycemia"],"a":0,"r":"With MAO blocked, tyramine from food builds up and causes intense vasoconstriction, raising blood pressure to dangerous levels (slides 26, 33).","src":"Slides 26, 33"},{"s":"meds","q":"Which outcome is most appropriate for a patient taking an SSRI?","o":["Thoughts are organized and coherent","Extrapyramidal symptoms decrease","Motor activity decreases","Depressive symptoms improve"],"a":3,"r":"SSRIs relieve depression by increasing available serotonin. They don't treat thought disorders or hyperactivity, and they don't cause or treat EPS.","src":"Slides 20–21"},{"s":"meds","q":"A patient taking clozapine (Clozaril) has a WBC count of 2,800/mm³. What is the nurse's best action?","o":["Give the next dose and recheck next week","Withhold the dose and notify the provider immediately","Give aspirin and push fluids","Repeat the lab test before doing anything else"],"a":1,"r":"The slides say Clozaril therapy is stopped if the WBC falls below 3,000/mm³ (or granulocytes below 1,500), because of agranulocytosis. Hold the drug and report right away.","src":"Slide 62"},{"s":"meds","q":"A drug blocks alpha-1 adrenergic receptors. Which teaching is most important?","o":["\"Have your WBC checked weekly.\"","\"Avoid aged cheese and wine.\"","\"Rise slowly when you get up from lying or sitting.\"","\"Drink 6 to 8 glasses of water a day.\""],"a":2,"r":"Alpha-1 blockade causes vasodilation and orthostatic hypotension, raising the risk of dizziness, falls and fainting. Many antipsychotics and antidepressants do this.","src":"Slides 31, 58"},{"s":"meds","q":"A nurse cares for four patients taking clozapine, lithium, fluoxetine and venlafaxine. Which patient most needs monitoring for fluid and electrolyte imbalance?","o":["The patient on clozapine","The patient on lithium","The patient on fluoxetine","The patient on venlafaxine"],"a":1,"r":"Lithium acts like sodium in the body. Changes in sodium and fluid (vomiting, diarrhea, sweating, low salt intake) quickly change lithium levels and can cause toxicity.","src":"Slide 48"},{"s":"meds","q":"Carbamazepine (Tegretol), lamotrigine (Lamictal) and gabapentin (Neurontin) belong to the same group of mood stabilizers. Which drug also belongs in this group?","o":["Divalproex (Depakote)","Buspirone (BuSpar)","Donepezil (Aricept)","Trazodone (Desyrel)"],"a":0,"r":"These are anticonvulsant mood stabilizers. Depakote is also an anticonvulsant used for bipolar disorder (slide 39).","src":"Slide 39"},{"s":"meds","q":"A patient with schizophrenia is starting an atypical antipsychotic. Which existing health problem calls for the closest extra monitoring?","o":["Osteoarthritis","Mild hearing loss","Seasonal allergies","Type 2 diabetes"],"a":3,"r":"Atypical antipsychotics raise blood sugar and can cause or worsen type 2 diabetes (slide 69), so glucose must be monitored closely. Weight gain and lipid changes add to the risk.","src":"Slide 69; lecture"},{"s":"meds","q":"Which question is the most nonjudgmental way to ask a patient about herbal remedies?","o":["\"What herbs, supplements or over-the-counter products do you use?\"","\"You don't take herbal stuff, do you?\"","\"Why would you take herbs instead of real medicine?\"","\"Herbal remedies don't work, right?\""],"a":0,"r":"A neutral, open question invites honest answers. Leading or negative questions reveal bias and discourage disclosure, and some herbs (like St. John's wort) interact dangerously with psych meds.","src":"Chapter 3; Chapter 14"},{"s":"ch6","q":"Which nursing action best supports the ethical principle of autonomy?","o":["Exploring options with a patient, who then chooses one","Restricting two patients who fought to the unit","Stopping a patient who is trying to cut themselves","Staying with a highly anxious patient"],"a":0,"r":"Autonomy is the right to make one's own decisions. Helping the patient weigh options supports an informed choice. The other actions reflect beneficence, justice or nonmaleficence.","src":"Chapter 6"},{"s":"ch6","q":"A patient who is now psychotic has a psychiatric advance directive written while stable. What should the nurse do?","o":["Ask the patient to update it now","Use it only if there is a cardiac arrest","Make sure the directive is followed in planning care","Set it aside until the patient is competent again"],"a":2,"r":"A psychiatric advance directive records treatment wishes made while well, for use when the person is too ill to decide. Honoring it respects self-determination.","src":"Chapter 6"},{"s":"ch6","q":"Two patients argue whenever they are together. A nurse suggests putting both in seclusion \"to be safe.\" This suggestion:","o":["Supports both patients' autonomy","Is an example of battery","Violates both patients' civil rights","Correctly puts safety first"],"a":2,"r":"Patients have the right to the least restrictive environment. Seclusion without imminent danger, when less restrictive measures haven't been tried, could be false imprisonment.","src":"Chapter 6; lecture"},{"s":"ch6","q":"A nurse asks why one self-harming patient is restrained while another with the same behavior gets one-to-one supervision. Which ethical principle is the nurse raising?","o":["Beneficence","Justice","Fidelity","Veracity"],"a":1,"r":"Justice is the fair and equal distribution of care, including using the least restrictive methods for everyone with similar needs.","src":"Chapter 6"},{"s":"ch6","q":"Which situation is an example of a tort?","o":["A care plan is finished 26 hours after admission","A patient changes from involuntary to voluntary status","An APRN recommends admission for a patient who is dangerous to self","A nurse gives a PRN antipsychotic to an agitated patient because the unit is short-staffed"],"a":3,"r":"Giving medication for staff convenience is a chemical restraint and could be charged as false imprisonment, an intentional tort.","src":"Chapter 6"},{"s":"ch6","q":"A patient clearly refuses an oral medication, and the nurse gives it anyway over the patient's objection. There is no emergency. Legally, the nurse:","o":["Met the standard of care","Was negligent","Committed malpractice","Could be charged with battery"],"a":3,"r":"Battery is touching or treating someone without consent. Forcing medication on a non-dangerous patient who refused it is battery, even if no harm results.","src":"Chapter 6"},{"s":"ch6","q":"Which action by a nurse is an example of false imprisonment?","o":["Restraining a confused, combative patient in an emergency, then promptly getting an order","Walking an attention-seeking patient to their room and saying, \"Stay in there or you'll go to seclusion\"","Persuading an involuntary, suicidal patient who ran off the unit to come back","Calling security per protocol when an involuntary, homicidal patient tries to leave"],"a":1,"r":"False imprisonment includes confining a competent person by threat, without legal justification. Involuntary patients and emergencies are handled within legal protocols.","src":"Chapter 6"},{"s":"ch6","q":"At the outpatient clinic, a patient about to get haloperidol decanoate says, \"Stop! I don't want this shot anymore. I hate the side effects.\" The patient is not dangerous. What should the nurse do?","o":["Stop and say, \"Tell me about the side effects you've been having.\"","Get extra staff and give the injection","Give it but promise medicine for the side effects","Say, \"I already drew it up, so I have to give it.\""],"a":0,"r":"Patients keep the right to refuse treatment unless there is clear evidence of danger. The nurse stops, explores the reason as advocate and educator, and reports to the prescriber.","src":"Chapter 6; slide 7"},{"s":"ch6","q":"A nurse believes some of the hospital's policies fall below accepted nursing standards. Which principle should guide the nurse's practice?","o":["Agency policy is the legal standard and overrides other standards","Agency policies don't excuse a nurse from practicing to professional standards","The nurse should stop all patient care until policies are fixed","Courts never consider agency policies"],"a":1,"r":"Substandard institutional policies don't protect the nurse. Nurses must follow laws and professional standards and should work to change questionable policies.","src":"Chapter 6"},{"s":"ch6","q":"A newly admitted, acutely psychotic patient is a private-pay patient of the medical director. To whom does the assigned nurse owe the duty of care?","o":["The medical director","The hospital","The patient","The nursing profession"],"a":2,"r":"The nurse is accountable to several parties, but the duty of care is owed to the patient.","src":"Chapter 6"},{"s":"ch6","q":"Which nursing action breaches a patient's right to privacy?","o":["Documenting the patient's behavior each shift","Telling the patient's employer about the admission without consent","Discussing the patient's history in a treatment team meeting","Asking family about the patient's behavior before admission"],"a":1,"r":"Releasing information to an employer without the patient's authorization violates privacy. Sharing within the treatment team is part of care.","src":"Chapter 6"},{"s":"ch6","q":"An adolescent admitted after a violent outburst says, \"I'm going to kill my father, but you can't tell anyone.\" What is the nurse's best response?","o":["\"Federal privacy law means I can't share that.\"","\"You should tell your psychiatrist about that.\"","\"Thoughts like that will keep you here longer.\"","\"I have to share this with the treatment team.\""],"a":3,"r":"Threats against a specific person must be reported to the treatment team, which has a duty to warn and protect the intended victim. The nurse is honest about this.","src":"Chapter 6"},{"s":"ch6","q":"A voluntarily admitted patient says, \"Get me the discharge forms. I want to leave now.\" What is the nurse's best response?","o":["\"I'll get them, but let's talk about your decision to leave.\"","\"You signed in voluntarily, so you can leave whenever.\"","\"I'll bring them to your room right away.\"","\"I can't give you those without your doctor's permission.\""],"a":0,"r":"Voluntary patients may request release, but as an advocate the nurse explores the reasons and the patient's safety. The provider may re-evaluate before discharge.","src":"Chapter 6"},{"s":"ch6","q":"A family worries that if their relative moves to a public psychiatric hospital, she won't get real treatment. What is the nurse's most accurate reply?","o":["\"Patients in public hospitals have a legal right to treatment, not just food and shelter.\"","\"The right to treatment only covers food, shelter and safety.\"","\"She can choose her own therapist and nurse there.\"","\"The sickest patients get treated first, so she may wait.\""],"a":0,"r":"Hospitalized patients have a right to treatment, including quality care and the least restrictive environment. Confinement without treatment violates their rights.","src":"Chapter 6"},{"s":"ch6","q":"Which person with a mental illness most likely needs emergency or involuntary admission?","o":["A person who misses an outpatient appointment","A person who hears angels singing during storms","A person who throws a heavy plate at a waiter because voices told them to","A person who uses heroin while taking naltrexone"],"a":2,"r":"Throwing a heavy object at someone shows danger to others, which meets commitment criteria. The other people show signs of illness but not dangerousness.","src":"Chapter 6"},{"s":"ch6","q":"During alcohol treatment, a patient tells the nurse, \"I feel terrible that I sexually abused my 6-year-old before I came in.\" What is the nurse's most important action?","o":["Keep it confidential because it was said in treatment","Send a written report to the ethics committee only","Report the abuse to child protective services in a way that doesn't identify the patient as a substance-treatment patient","Say, \"I'm glad you felt comfortable telling me.\""],"a":2,"r":"Child abuse must be reported. Federal confidentiality law for substance treatment programs means the report is made without identifying the abuser as a patient in the program (or anonymously, or under court order).","src":"Chapter 6"},{"s":"ch6","q":"The relative of a patient with paranoid delusions asks when the team is allowed to break confidentiality. The nurse should explain that confidentiality may be broken:","o":["When the patient threatens someone's life","Whenever the psychiatrist decides","Whenever police ask","Never"],"a":0,"r":"The duty to warn and protect a threatened person overrides confidentiality. Confidentiality is not broken at the provider's discretion or simply because police ask.","src":"Chapter 6"},{"s":"ch6","q":"An older adult with major depression is ordered a new antidepressant at a dose higher than the usual geriatric dose. What should the nurse do?","o":["Give it and watch for side effects","Teach the patient about side effects","Encourage extra fluids to dilute the drug","Hold the dose and contact the prescriber"],"a":3,"r":"Older adults usually need lower doses (\"start low, go slow\"). The nurse protects the patient by holding a questionable order and clarifying it with the prescriber.","src":"Chapter 6; Chapter 14"},{"s":"ch6","q":"A patient with schizophrenia believes a minister stirred up evil spirits and threatens to bomb the church. The psychiatrist notifies the minister. The psychiatrist:","o":["Carried out the duty to warn and protect","Released information without authorization","Violated the patient's confidentiality","Committed malpractice"],"a":0,"r":"When a patient threatens an identifiable person, the clinician has a duty to warn and protect the intended victim (Tarasoff). This is not a confidentiality violation.","src":"Chapter 6"},{"s":"ch6","q":"A patient struck another patient and was placed in seclusion. Which note is the best documentation?","o":["\"Patient aggressive. Seclusion ordered. Monitored.\"","\"Seclusion for 8 hours. Keep the two patients apart.\"","\"1300 pacing, shouting; haloperidol 5 mg PO given, no effect by 1315. 1415 yelled 'I'll punch anyone who comes near me' and hit another patient. Placed in seclusion 1420. MD order obtained 1430.\"","\"Patient calmer after seclusion and apologized.\""],"a":2,"r":"Seclusion documentation must describe specific behaviors and quotes, less restrictive measures tried and their effect, times, and the order. Vague notes don't show that seclusion was justified.","src":"Chapter 6"},{"s":"ch6","q":"A community member asks why people with mental illness aren't kept in state institutions anymore. Which response is most accurate?","o":["\"Less restrictive community settings can now treat many people.\"","\"Most still live in institutions.\"","\"Mental illness is less common now.\"","\"Institutions were all shut down for abuse.\""],"a":0,"r":"Deinstitutionalization shifted care to less restrictive community-based settings, helped by effective medications and the Community Mental Health Centers Act.","src":"Chapter 6"},{"s":"ch6","q":"A psychotic patient asks a technician, \"What's wrong with me?\" The technician answers, \"Nothing. You just need more self-control.\" What should guide the nurse who overhears this?","o":["The technician disclosed confidential information","The technician was negligent","The patient's right to be treated with dignity and respect was violated","The patient has a right to social interaction"],"a":2,"r":"Dismissing a patient's illness as a lack of self-control is disrespectful and stigmatizing. The nurse must intervene to protect the patient's dignity and supervise unlicensed staff.","src":"Chapter 6; Chapter 1"},{"s":"ch6","q":"Which note best documents what the nurse actually observed?","o":["\"Isolates self. Seems tired.\"","\"Calmer and more cooperative today.\"","\"Appeared to be hallucinating.\"","\"Wearing four layers of clothing. States, 'I need protection from bacteria trying to get through my skin.'\""],"a":3,"r":"Good documentation is objective: specific observations and the patient's exact words. The other notes are vague or interpretive.","src":"Chapter 6"},{"s":"ch6","q":"An off-duty nurse calls and asks you to chart a PRN medication they forgot to document, and gives you their password. What should you do?","o":["Chart it with their password","Write down the password for later","Report it to the patient's provider","Refer the matter to the charge nurse"],"a":3,"r":"Charting under someone else's login is fraudulent documentation. The charge nurse can resolve the missing entry according to policy. Never use or share passwords.","src":"Chapter 6"},{"s":"ch6","q":"Which person most likely meets criteria for involuntary hospitalization?","o":["A parent who has a panic attack when her child is briefly lost","A person who sees visions of demons in cemeteries","A person with depression who stopped taking their antidepressant","A person who swallowed 38 acetaminophen tablets after losing their savings"],"a":3,"r":"An overdose is clear evidence of danger to self, which meets commitment criteria. The others show distress or illness but not imminent danger.","src":"Chapter 6"},{"s":"ch6","q":"An aide says, \"We don't have time to help every patient pick a menu. Let's just have dietary send the most popular meals.\" What is the nurse's best response?","o":["\"Good idea, it will save time.\"","\"Thanks, but choosing their own meals is one way we respect patients as individuals.\"","\"That won't work because so many patients take MAOIs.\"","\"The law requires a written menu for every patient.\""],"a":1,"r":"Offering choices preserves dignity and autonomy, which matters for patients who have lost control on admission. The nurse also supervises unlicensed staff respectfully.","src":"Chapter 6; Chapter 8 lecture"},{"s":"ch6","q":"Before releasing information about a psychiatric patient to another facility, the nurse must have:","o":["Agreement from the treatment team","Verbal consent from the patient and next of kin","A signed patient consent that names the information to be released","Approval from the attending psychiatrist"],"a":2,"r":"Only the patient can waive confidentiality. Release requires the patient's signed authorization specifying what may be shared.","src":"Chapter 6"},{"s":"ch6","q":"Which situation requires a nurse to intervene and report?","o":["A coworker is caring for patients while impaired by alcohol","A provider gives a telephone order","A coworker struggles to write measurable outcomes","A patient refuses a prescribed medication"],"a":0,"r":"An impaired colleague endangers patients; the nurse reports immediately to the supervisor. The other situations are acceptable or can be handled with teaching.","src":"Chapter 6"},{"s":"ch6","q":"Which nursing action violates a psychiatric patient's civil rights?","o":["Doing mouth checks after hearing the patient say they spit out their pills","Opening and reading a letter the patient left to be mailed","Starting suicide precautions before the provider assesses the patient","Locking a patient's expensive watch in the hospital safe"],"a":1,"r":"Patients have the right to send and receive mail without interference. Mouth checks, precautions and safeguarding valuables are sound nursing judgment.","src":"Chapter 6"},{"s":"ch8","q":"While caring for a confused older adult, a nurse feels very sad and thinks, \"She's just like my grandmother, so helpless.\" What is the nurse experiencing?","o":["Transference","Countertransference","Empathy","A catastrophic reaction"],"a":1,"r":"Countertransference is the nurse's own feelings toward a patient, based on someone from the nurse's past. Transference is the patient's feelings toward the nurse.","src":"Chapter 8"},{"s":"ch8","q":"Which statement shows empathy for a patient who attempted suicide?","o":["\"It makes me so sad to see you going through this.\"","\"You must have been feeling very upset when you tried to hurt yourself.\"","\"Tell me what's wrong and I'll solve it for you.\"","\"Suicide is extreme for a problem that probably isn't that serious.\""],"a":1,"r":"Empathy reflects the patient's feelings from the patient's view. The others are sympathy (focus on the nurse), rescuing, or belittling.","src":"Chapter 8"},{"s":"ch8","q":"After several sessions with a patient who attempted suicide, which sign should alert the nurse to possible countertransference?","o":["The patient's reactions to the nurse seem realistic","The patient says, \"Talking to you is like talking to my mom.\"","The patient begins to trust the nurse","The nurse feels unusually elated when the patient's mood lifts"],"a":3,"r":"Strong positive or negative feelings toward a patient, or over-identifying, signal countertransference. A patient comparing the nurse to a parent is transference.","src":"Chapter 8"},{"s":"ch8","q":"A patient says, \"Please don't tell anyone what I share with you.\" What is the nurse's best response?","o":["\"This is just between us.\"","\"I won't share with your family or friends without your permission, but I will share information with the staff caring for you.\"","\"I'll tell you at the end of each session what I'll report.\"","\"I won't tell anyone. We'll keep each other's secrets.\""],"a":1,"r":"Patients have the right to know who will receive their information. The treatment team needs pertinent data; family and friends don't get it without consent.","src":"Chapter 8"},{"s":"ch8","q":"Which action shows a successful termination of the nurse-patient relationship?","o":["Gradually spending less time with the patient so they won't be upset","Giving the patient a personal phone number to call after discharge","Planning to meet the patient for coffee after discharge","Reviewing with the patient the changes made and evaluating goals"],"a":3,"r":"Termination includes summarizing progress, evaluating outcomes and sharing feelings about ending. Avoiding the patient feels like abandonment; ongoing contact creates a social relationship.","src":"Chapter 8"},{"s":"ch8","q":"What is the main goal of the orientation phase of the nurse-patient relationship?","o":["The patient shows more independence","The patient resolves transference","The patient develops rapport and trust with the nurse","The patient practices new coping skills"],"a":2,"r":"Rapport and trust must be built in orientation before the relationship can move to the working phase, where independence and new coping develop.","src":"Chapter 8"},{"s":"ch8","q":"In which phase of the nurse-patient relationship are the patient's problems explored and new coping behaviors practiced?","o":["Preorientation","Orientation","Working","Termination"],"a":2,"r":"In the working phase the nurse helps the patient explore problems, link thoughts, feelings and behaviors, and try new coping skills.","src":"Chapter 8"},{"s":"ch8","q":"When should the nurse first bring up termination of the relationship?","o":["When the patient raises it","At the end of the working phase","At the start of the termination phase","During the orientation phase"],"a":3,"r":"Termination is discussed from the start, as part of the contract in the orientation phase, so the patient knows the limits of the relationship.","src":"Chapter 8"},{"s":"ch8","q":"Why does a nurse set up a contract during the first session with a patient?","o":["To list what the nurse will do for the patient","To prevent either person from ending the relationship early","To describe the emotional tone of the relationship","To spell out the participation and responsibilities of both nurse and patient"],"a":3,"r":"The contract (time, place, length, purpose, ending) shows that the nurse works with the patient, not for the patient, and that both share responsibility.","src":"Chapter 8"},{"s":"ch8","q":"Which patient statement suggests the relationship has moved from orientation into the working phase?","o":["\"I want to find a way to handle my anger without getting violent.\"","\"It's really hard for me to talk about this.\"","\"I don't see how talking to you will help.\"","\"I don't have any problems.\""],"a":0,"r":"Readiness to change behavior marks the working phase. Denial, difficulty talking and doubt about the process are typical of orientation.","src":"Chapter 8"},{"s":"ch8","q":"A nurse explains to a family how the nurse-patient relationship differs from a social relationship. Which explanation is best?","o":["\"The focus is on the patient. We discuss problems together, but the patient carries out the solutions.\"","\"The focus shifts back and forth, and we both give advice.\"","\"It's mainly about socializing and sharing feelings with each other.\"","\"It's a partnership where each person helps the other grow.\""],"a":0,"r":"A therapeutic relationship is patient-centered; the nurse's needs are met elsewhere, and the patient implements solutions. The other descriptions fit social or intimate relationships.","src":"Chapter 8"},{"s":"ch8","q":"A nurse wants to show genuineness with a patient. The nurse should:","o":["Repeat the patient's words back","Share a lot of personal history","Make sure words, actions and feelings match","Interpret all of the patient's behavior"],"a":2,"r":"Genuineness means being open and authentic, with congruent verbal and nonverbal communication. Excessive self-disclosure shifts focus to the nurse.","src":"Chapter 8; lecture"},{"s":"ch8","q":"A nurse realizes she is feeling angry toward a withdrawn, suspicious patient. What should she do?","o":["Push the feelings down and keep working","Tell the patient she is angry","Discuss the feelings with an experienced clinician in supervision","Ask to never be assigned this patient again"],"a":2,"r":"Strong feelings toward a patient threaten objectivity. Supervision helps the nurse recognize and work through countertransference. Reassignment can happen but shouldn't be the first or habitual step.","src":"Chapter 8; lecture"},{"s":"ch8","q":"Which nursing action best communicates positive regard?","o":["Making rounds on schedule","Staying with a patient who is crying","Giving medications on time","Thinking about one's feelings about the patient"],"a":1,"r":"Staying with a distressed patient shows the patient is worth the nurse's time and care. Routine tasks don't necessarily communicate positive regard.","src":"Chapter 8"},{"s":"ch8","q":"A patient says, \"I've done a lot of lying and cheating in my relationships.\" Which response is nonjudgmental?","o":["\"That's not a good way to treat people.\"","\"I'm glad you finally realize that.\"","\"How do you feel about that?\"","\"Have you outgrown that behavior?\""],"a":2,"r":"Inviting the patient to reflect on their feelings lets them explore their own values without the nurse labeling the behavior.","src":"Chapter 8"},{"s":"ch8","q":"A patient says, \"People should be allowed to end their lives without interference.\" The nurse replies, \"You're wrong. Nothing justifies that.\" What is the best analysis?","o":["The patient is right","The nurse is right","The statements reflect different values","Neither is right"],"a":2,"r":"Values differ, and nurses must recognize their own values and avoid imposing them. The nurse should explore the patient's statement (including suicide risk) rather than argue.","src":"Chapter 8"},{"s":"ch8","q":"Which topics should the nurse cover during the first meeting with a new psychiatric patient?","o":["Trust, congruence, attitudes and boundaries","Goals, resistance, unconscious motivation and diversion","The purpose of meetings, the contract, confidentiality and termination","Transference, countertransference and intimacy"],"a":2,"r":"Orientation tasks include introductions, the purpose and parameters of the relationship, the contract, confidentiality and when the relationship will end.","src":"Chapter 8"},{"s":"ch8","q":"An experienced nurse suspects a new nurse's irritability toward a patient with alcohol use disorder is countertransference. Which comment by the new nurse confirms it?","o":["\"He keeps denying that drinking causes his problems.\"","\"My parents were alcoholics and neglected us.\"","\"He can't name a single goal.\"","\"He says I remind him of his mother.\""],"a":1,"r":"Countertransference comes from the nurse's own past relationships. The patient saying the nurse is like his mother is transference.","src":"Chapter 8"},{"s":"ch8","q":"Which nursing behavior shows that the nurse values patient autonomy?","o":["Recommending one-to-one observation for a suicidal patient","Telling a patient the spouse won't visit today","Setting limits on a patient's romantic comments","Discussing options and helping the patient weigh the consequences of each"],"a":3,"r":"Helping a patient consider alternatives and consequences before deciding supports self-determination.","src":"Chapter 8; Chapter 6"},{"s":"ch8","q":"At discharge, a patient gives the nurse a card they made in art group to say thank you. What is the nurse's best action?","o":["Decline it because gifts are against policy","Accept the card and thank the patient for the thoughtful gesture","Decline it but acknowledge the patient is ending treatment","Accept it and invite the patient back to art group"],"a":1,"r":"The nurse considers the meaning, timing and value of a gift. A small, handmade token offered at the end of the relationship can be graciously accepted. Expensive gifts or money are always refused.","src":"Chapter 8, Table 8.1"},{"s":"ch8","q":"A patient on unit restriction says, \"Can you ask my doctor to let me go to off-unit activities?\" What is the nurse's best response?","o":["\"That would be a good thing for you to bring up with your doctor.\"","\"Sure, I'll ask when I see her.\"","\"Why can't you ask for yourself?\"","\"Do you think you can't talk to doctors?\""],"a":0,"r":"Nurses encourage patients to use their own resources and act for themselves when they can. Doing it for them increases dependency.","src":"Chapter 8"},{"s":"ch8","q":"A community nurse ends a 3-year relationship with a patient because the nurse is moving. Where will the new nurse begin with this patient?","o":["Termination","The working phase","A social relationship","The orientation phase"],"a":3,"r":"A new nurse-patient relationship starts at orientation, building rapport and trust, even if it moves quickly to the working phase.","src":"Chapter 8"},{"s":"ch8","q":"As a patient is discharged, the nurse invites them to the staff's annual picnic. What is the best analysis?","o":["It encourages dependency","It helps the patient reintegrate into the community","It helps the patient's diversional activity needs","It blurs the boundaries of the therapeutic relationship"],"a":3,"r":"Inviting a patient to a social event turns a therapeutic relationship into a social one, a boundary problem.","src":"Chapter 8"},{"s":"ch8","q":"A nurse says, \"I'm the only one who really understands this patient. Everyone else is too hard on him.\" This statement suggests:","o":["Empathy","Positive regard","Advocacy","Boundary blurring / over-involvement"],"a":3,"r":"Believing you are the only one who understands a patient is a classic sign of over-involvement and boundary blurring, often from unrecognized countertransference. Supervision is needed.","src":"Chapter 8; lecture"},{"s":"ch8","q":"Which nursing action best promotes consistency in the nurse-patient relationship?","o":["Asking the patient for first impressions of the staff","Offering solutions to the patient's problems","Meeting with the patient at the same set time for each session","Rotating a different nurse each day"],"a":2,"r":"Consistency means predictability: the same nurse, a daily schedule, and regular session times help the patient feel secure.","src":"Chapter 8"},{"s":"ch8","q":"Which action belongs in the termination phase?","o":["Setting the contract for meeting times","Introducing yourself and your role","Identifying the patient's main problems for the first time","Helping the patient express feelings about the relationship ending"],"a":3,"r":"Termination tasks include sharing feelings about the ending, summarizing progress and planning for future challenges. Contract and introductions belong to orientation.","src":"Chapter 8"},{"s":"ch8","q":"A new psychiatric nurse grew up with a parent who has bipolar disorder and still feels angry and embarrassed about it. What is the best way for this nurse to cope?","o":["Use supervision to explore the feelings, which may also add sensitivity to her practice","Switch to a different specialty","Tell every new patient about the parent's illness","Suppress the feelings at work"],"a":0,"r":"Personal experience can deepen understanding, but unexamined feelings can cause countertransference. Supervision helps; suppression or routine self-disclosure does not.","src":"Chapter 8"},{"s":"ch8","q":"A nurse wants patients to see that she is interested and listening. Which behavior helps most?","o":["Sitting behind a desk facing the patient","Asking only direct questions to control the conversation","Looking at the chart while the patient talks","Using an open posture and facial expressions that show interest"],"a":3,"r":"Attending behaviors include an open posture, interested facial expressions and introducing yourself and your role. A desk is a barrier, and controlling questions limit the patient.","src":"Chapter 8"},{"s":"ch25","q":"An outpatient with major depression has overdosed several times in the past. Which antidepressant would the nurse expect to be prescribed?","o":["Fluoxetine (Prozac)","Amitriptyline (Elavil)","Desipramine (Norpramin)","Tranylcypromine (Parnate)"],"a":0,"r":"SSRIs like Prozac are very safe in overdose. Tricyclics (Elavil, Norpramin) are cardiotoxic and MAOIs are dangerous, so they are risky for a patient who overdoses.","src":"Chapter 25; slide 34"},{"s":"ch25","q":"Four patients describe their suicide plans. Which plan carries the highest risk?","o":["Turning on the gas oven overnight","Jumping from a railroad bridge in a deserted area late at night","Taking pills while a spouse is out","Cutting the wrists while a spouse is in the next room"],"a":1,"r":"Jumping is a high-lethality method, and a deserted place at night leaves little chance of rescue. The others are lower-lethality methods with more rescue potential.","src":"Chapter 25"},{"s":"ch25","q":"Which activity is primary prevention for suicide?","o":["Hospitalizing a suicidal patient","Teaching schoolchildren to manage stress and build resilience","Starting suicide precautions on admission","Referring a formerly suicidal patient to a support group"],"a":1,"r":"Primary prevention stops problems before they start through education and support in the community. Hospitalization and precautions are secondary; follow-up support is tertiary.","src":"Chapter 25"},{"s":"ch25","q":"Which change in brain chemistry is most strongly linked to suicidal behavior?","o":["Excess dopamine","Excess acetylcholine","Low serotonin","Low GABA"],"a":2,"r":"Low serotonin (and its metabolites) has been found in people who are suicidal and in postmortem studies of people who died by suicide.","src":"Chapter 25"},{"s":"ch25","q":"A college student who failed two exams cried for hours, tried to call home with no answer, then gave her favorite sweaters to her roommate and asked to be left alone. Which behavior is the strongest clue of a suicide plan?","o":["Calling her parents","Giving away her sweaters","Crying for hours","Asking to be alone"],"a":1,"r":"Giving away prized possessions is a classic covert clue that the person may not expect to need them. Act on it by asking directly about suicide.","src":"Chapter 25; lecture"},{"s":"ch25","q":"A nurse uses the SAD PERSONS scale during an interview. This tool gives information about:","o":["Current stress level","Mood disorder severity","Anxiety level","Suicide risk"],"a":3,"r":"SAD PERSONS scores suicide risk factors (sex, age, depression, previous attempt, ethanol use, rational thinking loss, social support lacking, organized plan, no spouse, sickness). Your textbook also names SAFE-T and the Columbia scale.","src":"Chapter 25"},{"s":"ch25","q":"A patient is admitted after intentionally overdosing on antidepressants. Which nursing diagnosis is the priority?","o":["Powerlessness","Social isolation","Risk for suicide","Compromised family coping"],"a":2,"r":"Risk for suicide is the priority because it is life-threatening. The other diagnoses matter but come after safety.","src":"Chapter 25"},{"s":"ch25","q":"A patient hospitalized after an overdose has just arrived on the unit. Which outcome should come first?","o":["States a will to live by day 2","Names two new coping skills by day 3","Lists personal strengths by the end of week 1","Does not attempt self-harm for the next 24 hours"],"a":3,"r":"The first outcome addresses immediate safety: remaining free from self-harm. Hope, coping and self-esteem outcomes follow.","src":"Chapter 25, Table 25.2"},{"s":"ch25","q":"After their son attempts suicide, his parents say, \"We should have seen this coming. We didn't do enough.\" Their reaction reflects:","o":["Denial","Guilt","Anger","Relief"],"a":1,"r":"Blaming themselves for not preventing the attempt shows guilt, a common reaction in families and survivors.","src":"Chapter 25"},{"s":"ch25","q":"A teenager has threatened to overdose. Which question is most critical for the nurse to ask?","o":["\"Why do you want to kill yourself?\"","\"Have you been using drugs or alcohol?\"","\"Do you have access to pills or other medications?\"","\"Did something happen with your parents?\""],"a":2,"r":"Access to the means is key to lethality. If medications are available, parents must remove or lock them up. Adolescents are impulsive and often take whatever is in the medicine cabinet.","src":"Chapter 25; lecture"},{"s":"ch25","q":"Five days after starting an antidepressant, a suicidal inpatient is more talkative and energetic. What is the priority?","o":["Keep the patient under close supervision","Begin discharge planning","Refer the patient to art therapy","Consider ending suicide precautions"],"a":0,"r":"As energy returns before mood lifts, the patient may now have the energy to act on a plan. Close supervision continues and suicide risk is reassessed.","src":"Chapter 25; slide 24"},{"s":"ch25","q":"A nurse helps a patient write a safety plan before discharge. Which item belongs in it?","o":["The names and phone numbers of people and crisis lines to call for help","A promise not to harm themselves for 24 hours","A list of reasons the patient's feelings are wrong","A plan to avoid all family contact"],"a":0,"r":"The six-step safety plan includes warning signs, coping strategies, people and places for distraction, people to ask for help, professionals and crisis lines (988), and making the environment safe. A no-harm promise is not a substitute.","src":"Chapter 25, Fig. 25.1"},{"s":"ch25","q":"An outpatient with past attempts says, \"I've been thinking about killing myself.\" Which response is most helpful?","o":["\"Don't worry, we'll take care of it.\"","\"You should check yourself into the hospital.\"","\"Think about all the good things you have to live for.\"","\"Telling me about this is an important step. Let's talk about what you're feeling.\""],"a":3,"r":"Reinforcing the patient for talking rather than acting supports their ambivalence toward living and opens assessment. False reassurance, advice and \"you have so much to live for\" shut down the conversation.","src":"Chapter 25"},{"s":"ch25","q":"Which intervention should the nurse recommend for family and friends of a person who died by suicide?","o":["Reminiscence therapy","A suicide survivors' support group","A psychological autopsy","Two sessions of group therapy"],"a":1,"r":"Survivor support groups give peer support for grief, guilt and anger, which often last for months and years. This is part of postvention.","src":"Chapter 25"},{"s":"ch25","q":"What is the best reason to watch a severely depressed patient closely during antidepressant therapy?","o":["As depression lifts, the patient may have the energy to carry out a suicide plan","Most patients get more suicidal thoughts on antidepressants","Antidepressants make people impulsive","Patients need to talk about side effects"],"a":0,"r":"Suicide risk rises as depression begins to lift because energy improves while suicidal thinking may remain.","src":"Slide 24; Chapter 25"},{"s":"ch25","q":"A patient whose business failed and whose spouse filed for divorce has been crying for weeks. Which statement is a covert (hidden) suicide message?","o":["\"I have a plan that will fix everything.\"","\"Life isn't worth living.\"","\"I wish I were dead.\"","\"My family would be better off without me.\""],"a":0,"r":"Covert statements hint at suicide without saying it. \"A plan that will fix everything\" is veiled; the others are overt.","src":"Chapter 25; lecture"},{"s":"ch25","q":"A patient with recent suicidal thoughts feels overwhelmed by many problems. Which nursing comment is most therapeutic?","o":["\"Let's figure out which problems are most important and which can wait.\"","\"I'm glad you're taking control.\"","\"Just focus on the good times.\"","\"Let's list every problem and solve them all.\""],"a":0,"r":"Prioritizing problems reduces the sense of being overwhelmed and builds problem-solving skills, which protect against suicide.","src":"Chapter 25"},{"s":"ch25","q":"When assessing a patient's suicide plan, which information has priority?","o":["Financial and education level","Insight into why they want to die","Access to the means and how lethal the method is","The quality of social support"],"a":2,"r":"A specific plan with a lethal method that is readily available signals the highest risk. Assess plan, lethality and access.","src":"Chapter 25"},{"s":"ch25","q":"Which feeling is most predictive of increased suicide risk?","o":["Hopelessness","Sadness","Elation","Anger"],"a":0,"r":"Hopelessness is the emotion most closely tied to suicide (Beck). Your professor said hopelessness and helplessness will be tested through patient statements.","src":"Chapter 25; lecture"},{"s":"ch25","q":"Which statement by a depressed patient signals the need for immediate, active intervention?","o":["\"I'm confused, but I know I need help.\"","\"Last time, I cut myself to get attention.\"","\"I have no one to turn to.\"","\"I want to feel better soon.\""],"a":2,"r":"Having no one to turn to shows hopelessness and isolation, which raise risk. Asking for help is protective.","src":"Chapter 25"},{"s":"ch25","q":"A patient on the unit died by suicide during the night. What is the most important first step for the nursing staff?","o":["Check that the computer system is secure","Tell the roommate not to discuss it","Hold a staff meeting to share feelings and plan support for the other patients","Finish the incident report before anything else"],"a":2,"r":"Staff are also affected and need support, and the other patients need a plan for safety and a chance to express feelings. Reports follow.","src":"Chapter 25"},{"s":"ch25","q":"After one identical twin dies by suicide, the parents worry about the other twin. What should the nurse tell them?","o":["\"Fraternal twins have a higher risk than identical twins.\"","\"Identical twins are not at higher risk.\"","\"She won't copy her twin.\"","\"Genetics play a role in suicide risk, so monitoring and support are important.\""],"a":3,"r":"Twin studies show higher concordance for suicide in identical twins, supporting a genetic component. Exposure to a family member's suicide also raises risk.","src":"Chapter 25"},{"s":"ch25","q":"A patient is actively suicidal. Which intervention is appropriate?","o":["Checks every 15 minutes","One-to-one observation within arm's length at all times","A private room with the door closed","Removing the patient's eyeglasses"],"a":1,"r":"Actively suicidal patients need constant one-to-one observation. 15-minute checks are not enough, a private room isolates the patient, and needed eyeglasses should stay with a patient who is closely watched.","src":"Chapter 25, Table 25.3"},{"s":"ch25","q":"A college student is upset about failing two exams and says, \"No one understands what this does to my future.\" He then shuts down his social media and turns off his phone. Which suicide risk factor does this behavior show?","o":["Panic attack","Self-imposed isolation","Grandiosity","Psychosis"],"a":1,"r":"Cutting off contact with others is withdrawal and isolation, a warning sign. A recent stressful event and shame add to his risk.","src":"Chapter 25, Box 25.2"},{"s":"meds","q":"A patient with narrow-angle glaucoma is anxious before a procedure, and the provider writes an order for lorazepam (Ativan). What should the nurse do?","o":["Give the dose and recheck the patient's vision in 1 hour","Give half the dose to limit side effects","Question the order, because benzodiazepines are contraindicated in narrow-angle glaucoma","Give the dose with food to slow absorption"],"a":2,"r":"The slides list narrow-angle glaucoma as a contraindication for antianxiety agents. The nurse holds the dose and clarifies the order before giving it. Changing the dose on your own is outside the nurse's scope.","src":"Slide 14"},{"s":"meds","q":"A patient taking diazepam (Valium) says the medication \"barely works anymore.\" Which habit reported by the patient most likely explains this?","o":["Drinking four cups of coffee and smoking a pack of cigarettes a day","Drinking a glass of milk at bedtime","Taking the dose with breakfast","Walking 30 minutes every evening"],"a":0,"r":"Smoking and caffeine decrease the effects of antianxiety agents. Alcohol, opioids and other CNS depressants do the opposite and increase them.","src":"Slide 15"},{"s":"meds","q":"A patient is being discharged on an antianxiety medication. Which symptom should the nurse teach the patient to report to the provider right away?","o":["Mild drowsiness the first few days","Dry mouth","Feeling calmer in social situations","Sore throat, fever or easy bruising"],"a":3,"r":"Sore throat, fever, restlessness and easy bruising can point to a blood problem and must be reported. Drowsiness and dry mouth are expected side effects, and feeling calmer means the drug is working.","src":"Slide 18"},{"s":"meds","q":"According to the course slides, how long has the effectiveness of antianxiety agents been studied?","o":["Up to 2 weeks","Up to 2 years","Up to 4 months; use longer than that has not been evaluated","Lifelong use has been proven safe and effective"],"a":2,"r":"The slides state that efficacy beyond 4 months has not been evaluated. That is one reason these drugs are meant for short-term use, along with the risk of tolerance and dependence.","src":"Slide 11"},{"s":"meds","q":"An 82-year-old patient given alprazolam (Xanax) for anxiety becomes agitated, excited and combative an hour later. What is the nurse most likely seeing?","o":["Serotonin syndrome","A therapeutic response","Paradoxical excitement from the benzodiazepine","Tardive dyskinesia"],"a":2,"r":"Paradoxical excitement is a listed side effect of antianxiety agents. The drug causes the opposite of the expected calming effect, and older adults are more prone to it. The slides list the elderly as a precaution group.","src":"Slide 17"},{"s":"meds","q":"A patient who has taken clonazepam (Klonopin) daily for a year says, \"I'm out of pills, so I'll just stop.\" Which risk concerns the nurse most?","o":["Weight gain","Seizures from abrupt withdrawal","Hypertensive crisis","Photosensitivity"],"a":1,"r":"The nursing diagnosis on the slides is \"Risk for injury related to seizures… abrupt withdrawal after long-term use.\" Teach the patient never to stop suddenly; the provider tapers the dose.","src":"Slides 16, 18"},{"s":"meds","q":"Besides anxiety, which condition is also treated with benzodiazepines such as diazepam (Valium)?","o":["Hypothyroidism","Hypertensive crisis","Tardive dyskinesia","Status epilepticus"],"a":3,"r":"The slides list these uses for antianxiety agents: anxiety disorders, acute alcohol withdrawal, skeletal muscle spasm, convulsive disorders, status epilepticus and pre-op sedation.","src":"Slide 11"},{"s":"meds","q":"Hydroxyzine (Vistaril) appears on the antianxiety slide. Which group does it belong to?","o":["Benzodiazepines","Antihistamines","Azaspirodecanediones","Propanediols"],"a":1,"r":"Atarax and Vistaril (hydroxyzine) and Benadryl are antihistamines used for anxiety. BuSpar is the azaspirodecanedione, Miltown is the propanediol, and Xanax, Librium, Klonopin, Valium and Ativan are benzodiazepines.","src":"Slide 12"},{"s":"meds","q":"A patient who had a myocardial infarction 5 days ago is depressed. The provider asks about starting amitriptyline (Elavil). Which concern should the nurse raise?","o":["Tricyclics must be given IM after an MI","Tricyclics cause hypertensive crisis with cheese","Tricyclics are contraindicated during the acute recovery phase after an MI","There is no concern; tricyclics protect the heart"],"a":2,"r":"The slides list the acute recovery phase after an MI as a contraindication. Tricyclics can cause tachycardia and arrhythmias.","src":"Slides 23, 31"},{"s":"meds","q":"A 70-year-old man with benign prostatic hypertrophy (BPH) is started on imipramine (Tofranil). Which side effect should the nurse watch for most closely?","o":["Diarrhea","Hypoglycemia","Excess salivation","Urinary retention"],"a":3,"r":"BPH is a listed precaution for antidepressants. The anticholinergic effects of a tricyclic can cause urinary retention, which is worse when the prostate is already enlarged. Monitor intake and output and ask about voiding.","src":"Slides 23, 31"},{"s":"meds","q":"A patient with a history of seizures is started on a tricyclic antidepressant. Why does the nurse put seizure precautions in place?","o":["Tricyclics raise the seizure threshold","Tricyclics cause dystonia","Tricyclics cause hypoglycemia","Tricyclics lower the seizure threshold"],"a":3,"r":"Antidepressants, especially tricyclics, lower the seizure threshold, so seizures happen more easily. The slides list a history of seizures as a precaution.","src":"Slides 23, 31"},{"s":"meds","q":"A depressed patient on a tricyclic antidepressant is being discharged. Why does the provider order only a 1-week supply?","o":["Tricyclics expire quickly","The drug is expensive","An overdose of a tricyclic can be fatal because of its cardiac effects","The patient will need a new drug in 1 week"],"a":2,"r":"The slides say that because of the cardiac side effects, a week's supply is given, since the patient can overdose. Limiting the supply limits suicide risk.","src":"Slide 34"},{"s":"meds","q":"A patient started sertraline (Zoloft) 10 days ago and says, \"Nothing's changed. This doesn't work.\" What is the nurse's best response?","o":["\"Let's ask your provider to switch you to another drug today.\"","\"It can take up to 4 weeks to feel the full effect, so keep taking it every day.\"","\"Double your dose to speed it up.\"","\"You can stop it if it isn't helping.\""],"a":1,"r":"Patient teaching on the slides: the therapeutic effect may take up to 4 weeks, keep taking it, do not stop abruptly, and do not double up.","src":"Slides 35, 36"},{"s":"meds","q":"A patient on fluoxetine (Prozac) is also started on cimetidine (Tagamet) for heartburn. What should the nurse watch for?","o":["Lower fluoxetine levels and a return of depression","Higher fluoxetine levels and more side effects","Hypoglycemia","No interaction"],"a":1,"r":"The slides state that taking an SSRI with cimetidine raises the SSRI concentration. More drug in the blood means more side effects and a higher risk of serotonin syndrome.","src":"Slide 28"},{"s":"meds","q":"A patient asks how the side effects of an SSRI compare with a tricyclic. Which side effect is listed for SSRIs?","o":["Weight gain","Photosensitivity","Urinary retention","Sexual dysfunction"],"a":3,"r":"The SSRI slide lists insomnia, headache, weight loss, sexual dysfunction and serotonin syndrome. Weight gain, urinary retention and photosensitivity are on the tricyclic list.","src":"Slides 31, 32"},{"s":"meds","q":"A patient taking phenelzine (Nardil) has a cold and asks if a decongestant containing pseudoephedrine is OK. What is the nurse's best answer?","o":["\"Yes, cold medicine is safe with your antidepressant.\"","\"No. Decongestants are vasoconstrictors and can cause a hypertensive crisis with an MAOI. Check with your provider before
