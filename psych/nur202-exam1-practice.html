<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NUR202 Exam 1 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an exam booklet — sticky score strip on top, one question card at a time, answer sheet grid below */
:root{
  --paper:#EEF3F1; --card:#FFFFFF; --ink:#132029; --muted:#55646D; --line:#D2DCD9; --line-strong:#B9C7C3;
  --accent:#0A6A64; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --ok:#1E7A3C; --ok-soft:#E3F3E7; --bad:#AD2318; --bad-soft:#FBEAE7; --idle:#E4EAE8;
  --meds:#6A3D9A; --ch1:#1F6F8B; --ch6:#B03A2E; --ch8:#2E7D4F; --ch25:#A35C00;
  --shadow:0 1px 2px rgba(19,32,41,.06),0 6px 18px rgba(19,32,41,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --ok:#6FD08E; --ok-soft:#14301E; --bad:#FF8A7E; --bad-soft:#3A1C1A; --idle:#22313A;
  --meds:#C99BDA; --ch1:#6CC3D2; --ch6:#F08B80; --ch8:#80C99C; --ch25:#E7B95A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --ok:#6FD08E; --ok-soft:#14301E; --bad:#FF8A7E; --bad-soft:#3A1C1A; --idle:#22313A;
  --meds:#C99BDA; --ch1:#6CC3D2; --ch6:#F08B80; --ch8:#80C99C; --ch25:#E7B95A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.score{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;color:var(--ink);white-space:nowrap}
.pill b{font-weight:500}
.pill .dot{width:8px;height:8px;border-radius:50%}
.bar{height:6px;border-radius:999px;background:var(--idle);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent))}
.chip .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .sp{flex:1}
.tbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.82rem;font-weight:700}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tbtn.warn{color:var(--bad)}

main .wrap{padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--c)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.meta .sec{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.meta .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stem{margin:0;font-size:1.08rem;line-height:1.55;font-weight:400;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .let{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.85rem;background:var(--idle);color:var(--ink)}
.opt .txt{min-width:0}
.opt .mk{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;align-self:center}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .let{background:var(--ok);color:var(--card)}
.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);color:var(--card)}
.opt.wrong .mk{color:var(--bad)}
.opt.dim{opacity:.6}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{margin:0;font-family:var(--f-display);font-stretch:110%;font-size:1rem}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb p{margin:0;max-width:70ch}
.fb .src{font-size:.8rem;color:var(--muted)}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.nbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:700}
.nbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nbtn:disabled{opacity:.45;cursor:default}
.hint{font-size:.76rem;color:var(--muted)}
@media (max-width:600px){ .hint{display:none} }

.sheet{display:flex;flex-direction:column;gap:10px}
.sheet h2,.summary h2{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sheet h2::after,.summary h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:36px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums;position:relative}
.cell::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:7px 7px 0 0;background:var(--c)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:500}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:500}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}

.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 12px;align-items:center;font-size:.88rem}
.srow .lab{display:flex;gap:8px;align-items:center;min-width:0}
.srow .lab i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.srow .val{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.srow .bar{grid-column:1/-1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;background:var(--bad-soft);border:1px solid var(--bad);border-radius:9px;padding:8px 10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line-strong);border-radius:12px}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>NUR202 Exam 1 <span>Practice</span></h1>
      <div class="score" id="score"></div>
    </div>
    <div class="bar" id="pbar" aria-hidden="true"><i class="g"></i><i class="r"></i></div>
    <div class="chips" id="chips" role="group" aria-label="Filter by section"></div>
    <div class="tools">
      <button class="tbtn" id="order" type="button">Order: exam mix</button>
      <button class="tbtn" id="missed" type="button" aria-pressed="false">Missed only</button>

    </div>

      <button class="tbtn warn" id="confirmYes" type="button">Yes, clear</button>
      <button class="tbtn" id="confirmNo" type="button">Cancel</button></div>
  </div>

    <section class="summary" id="summary"></section>

      <h2>Answer sheet</h2>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i></i>Not answered</span><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Missed</span><span>Top stripe = section color</span></div>
    </section>
  </div>
</main>

<script>
const QUESTIONS = [{"s":"meds","q":"A patient taking lithium carbonate has a serum lithium level of 1.7 mEq/L. The patient reports nausea and the nurse observes a coarse hand tremor. What is the nurse's priority action?","o":["Give the scheduled dose with food to reduce nausea","Hold the dose and notify the provider","Encourage the patient to limit fluids for the next 24 hours","Reassure the patient that a tremor is an expected side effect"],"a":1,"r":"Toxic symptoms begin above 1.5 mEq/L, and the slides say to hold the medication and notify the provider when the level reaches 1.5 or the patient has even mild symptoms. A coarse tremor is a toxic sign (a fine tremor is the expected side effect). Giving the dose worsens toxicity; fluid restriction raises lithium further; reassurance ignores toxicity.","src":"Slides 46–47"},{"s":"meds","q":"A patient is admitted with acute mania and started on lithium. According to the course slides, which serum level shows the drug has reached the therapeutic range for acute mania?","o":["0.2–0.5 mEq/L","0.6–0.9 mEq/L","1.0–1.5 mEq/L","2.0–2.5 mEq/L"],"a":2,"r":"The slides give 1.0–1.5 mEq/L for acute mania and 0.6–1.2 mEq/L for maintenance. 0.2–0.5 is subtherapeutic; 0.6–0.9 is a maintenance-type level; 2.0–2.5 is toxic.","src":"Slide 44; lecture"},{"s":"meds","q":"A nurse who has floated to the psychiatric unit is giving 0900 medications. A patient with bipolar disorder who takes lithium has a lithium level ordered for this morning. What should the nurse do first?","o":["Ask the patient whether the blood sample has already been drawn","Give the lithium, then send the patient to the lab","Hold lithium for the entire day","Give half the usual dose until the result is back"],"a":0,"r":"The level is drawn 12 hours after the last dose. If the morning dose is given before the draw, the result will be falsely high. Her lecture example: the first question to ask is \"Did you have your blood work done?\" Holding all day or giving half a dose is not ordered.","src":"Slide 45; lecture"},{"s":"meds","q":"The nurse is teaching a patient who is starting lithium. Which statement by the patient shows a need for more teaching?","o":["\"I will call my provider if I start vomiting or have diarrhea.\"","\"I will keep drinking about 6 to 8 glasses of water a day.\"","\"I'm going to start a low-salt diet to protect my heart.\"","\"I will carry an ID card that says I take lithium.\""],"a":2,"r":"Lithium acts like sodium. When sodium intake drops, the kidney reabsorbs lithium and toxicity results, so patients must not reduce salt. The other statements match the slide 49 teaching.","src":"Slides 48–49"},{"s":"meds","q":"A patient who has taken lithium for 2 years calls the clinic and says, \"I've had a stomach bug with vomiting and diarrhea for 2 days.\" What is the best response by the nurse?","o":["\"Keep taking your lithium and rest until you feel better.\"","\"Double your next dose to make up for what you vomited.\"","\"Stop drinking fluids until the vomiting stops.\"","\"Come in today so we can check your lithium level.\""],"a":3,"r":"Vomiting and diarrhea deplete sodium and water, so the kidney holds on to lithium and toxicity can develop. Patients are taught to notify the provider, and the level should be checked. Doubling the dose or restricting fluids raises the risk further.","src":"Slides 48–49; lecture"},{"s":"meds","q":"A patient who takes phenelzine (Nardil) calls on a Saturday night: \"I went out with friends and had pepperoni pizza and a beer. Now I have a terrible headache and my vision is blurry.\" What should the nurse tell the patient?","o":["\"Go to the nearest emergency department now.\"","\"Take acetaminophen and lie down in a dark room.\"","\"Skip tomorrow's dose of Nardil.\"","\"Call your psychiatrist on Monday morning.\""],"a":0,"r":"An MAOI plus tyramine (cured meat, beer) can cause a hypertensive crisis: severe headache, blurred vision, very high BP. It is life-threatening and needs emergency care. The other answers delay treatment.","src":"Slides 26, 33; lecture"},{"s":"meds","q":"A patient taking tranylcypromine (Parnate) asks for a snack. Which choice is safest?","o":["Aged cheddar cheese and crackers","Cottage cheese with fresh fruit","Sautéed chicken livers","Salami on rye bread"],"a":1,"r":"Milk, yogurt and cottage cheese contain little or no tyramine. Aged cheese, chicken livers (an NCLEX favorite) and fermented sausage like salami are high in tyramine and can trigger a hypertensive crisis.","src":"Lecture; Varcarolis Table 14.7"},{"s":"meds","q":"A patient who takes isocarboxazid (Marplan) has surgery. The postoperative orders include meperidine (Demerol) for pain. What is the nurse's best action?","o":["Give the meperidine and monitor the BP every 4 hours","Give half the ordered dose of meperidine","Hold the meperidine and question the order with the prescriber","Give the meperidine with an antiemetic"],"a":2,"r":"MAOI + meperidine can cause hyper- or hypotension, coma, convulsions and death. She called Demerol \"the biggie\" NCLEX likes. A dangerous order is held and questioned; it is not given at any dose.","src":"Slide 26; lecture"},{"s":"meds","q":"A patient's psychiatrist plans to switch the patient from fluoxetine (Prozac) to an MAOI. According to the course slides, how long must the washout period be?","o":["24 hours","3 days","2 weeks","5 weeks"],"a":3,"r":"The slides state fluoxetine needs a 5-week washout before an MAOI because of its very long half-life. Carbamazepine needs 2 weeks, and other SSRIs should not be used within 14 days of an MAOI.","src":"Slides 27–28"},{"s":"meds","q":"A patient taking sertraline (Zoloft) has a new antidepressant added. Two days later the patient is sweating heavily, has goosebumps, fluctuating vital signs and new confusion. Which action is the priority?","o":["Hold the medications and notify the provider immediately","Encourage oral fluids and recheck vital signs in 4 hours","Give the next scheduled doses with food","Document the findings as expected side effects"],"a":0,"r":"These are signs of serotonin syndrome. The nurse holds the drugs and notifies the provider so the patient can be sent for emergency care; it resolves when the drugs are stopped. Missing it can lead to cardiovascular collapse and death. It is the one time an SSRI is stopped abruptly.","src":"Slide 28; lecture"},{"s":"meds","q":"A patient with major depression and a suicide plan started an antidepressant 9 days ago. Today the patient is showering, eating and talking more. What is the nurse's most important action?","o":["Tell the treatment team the patient is ready to reduce observation","Praise the patient and encourage more group activities","Ask the patient, \"Do you feel as good as you look?\" and assess for suicidal thoughts","Plan discharge teaching for the next day"],"a":2,"r":"As antidepressants take effect, energy often returns before mood lifts, so suicide potential increases as depression decreases. The nurse must reassess suicidal ideation and the plan (her exact question). If the patient is still suicidal with a plan → 1:1 observation.","src":"Slide 24; lecture"},{"s":"meds","q":"A patient is to start amitriptyline (Elavil). Which action should the nurse take before the first dose?","o":["Obtain a baseline EKG","Check a serum drug level","Start a tyramine-free diet","Draw a baseline WBC count"],"a":0,"r":"Tricyclics are cardiotoxic (QRS changes, dysrhythmias) and the most lethal antidepressants in overdose, so a baseline EKG is obtained. No drug level is needed to start; the tyramine diet is for MAOIs; WBC monitoring is for Clozaril and Tegretol.","src":"Lecture; slides 31, 34"},{"s":"meds","q":"A male patient is prescribed trazodone (Desyrel) as needed for sleep. Which instruction is most important?","o":["\"Take it in the morning so it doesn't keep you awake.\"","\"Report a painful erection that won't go away right away.\"","\"Avoid all cheese and wine while taking it.\"","\"You will need monthly blood levels.\""],"a":1,"r":"Priapism is a rare but serious side effect of trazodone and is reported STAT (slides 34, 36). Trazodone is sedating, so it is taken at bedtime; the diet is for MAOIs; antidepressants don't need blood levels.","src":"Slides 34, 36; lecture"},{"s":"meds","q":"A patient started on buspirone (BuSpar) 3 days ago says, \"This pill isn't doing anything. I want something that works.\" Which response is best?","o":["\"I'll ask the provider to switch you to a stronger medication.\"","\"It may take about 10 days to 2 weeks before you feel the full effect.\"","\"Take an extra dose when you feel anxious.\"","\"It works best if you take it only when you feel anxious.\""],"a":1,"r":"BuSpar has a time lag: she said 10 days to 2 weeks minimum. It is taken every day on schedule, not PRN, and extra doses are not appropriate. Teaching about the lag is the nursing priority.","src":"Slide 18; lecture"},{"s":"meds","q":"Which statement about buspirone (BuSpar) is accurate?","o":["It depresses the CNS and causes heavy sedation","It is the drug of choice for a patient in an acute panic attack","It does not depress the CNS and carries no risk of addiction","It must be tapered quickly because of seizure risk"],"a":2,"r":"The slides say BuSpar does NOT depress the CNS (the exception among antianxiety agents), and she said there is no concern for addiction or tolerance. It is not for acute panic because the first dose does nothing.","src":"Slide 13; lecture"},{"s":"meds","q":"A patient has an order for clonazepam (Klonopin) 1 mg PO every 4 hours PRN anxiety. Two and a half hours after a dose the patient asks for another. What should the nurse do first?","o":["Give the dose because the patient says they are anxious","Tell the patient no and walk away","Call the provider for a stronger medication","Assess why the patient is asking early: panic, withdrawal, or drug-seeking"],"a":3,"r":"Benzodiazepines are controlled, addictive substances and the dose isn't due. She stressed assessing whether the patient is experiencing panic, withdrawal, or is manipulating. Assessment comes before any other action.","src":"Lecture"},{"s":"meds","q":"An NCLEX-style question asks which medication the nurse should expect for a patient in alcohol withdrawal. According to the lecture, which answer is most likely correct?","o":["Chlordiazepoxide (Librium)","Buspirone (BuSpar)","Sertraline (Zoloft)","Haloperidol (Haldol)"],"a":0,"r":"She said that on NCLEX the alcohol withdrawal answer is Librium (Ativan is often used in practice, especially in older adults because it is shorter acting). Alcohol withdrawal is also listed as a use for antianxiety agents on slide 11.","src":"Lecture; slide 11"},{"s":"meds","q":"A patient with schizophrenia is started on olanzapine (Zyprexa), an atypical antipsychotic. Which lab result is most important for the nurse to monitor?","o":["Serum sodium","Serum drug level","Blood glucose","Platelet count"],"a":2,"r":"Atypical antipsychotics raise the risk of hyperglycemia and type 2 diabetes; she called Zyprexa \"infamous\" for it, and blood sugar should be monitored regularly. Sodium matters for lithium; there is no routine Zyprexa level.","src":"Slide 69; lecture"},{"s":"meds","q":"A patient with a long history of not taking oral medication is ordered fluphenazine decanoate (Prolixin Decanoate). Which statement about this medication is correct?","o":["It is an atypical antipsychotic given orally once a day","It is a typical antipsychotic given as a deep IM injection, usually after an oral trial","It is given IV push over 2 minutes","It is used only for acute agitation in the emergency department"],"a":1,"r":"\"Decanoate\" = typical antipsychotic; only Haldol and Prolixin come in decanoate forms. They are deep IM (Z-track) injections given about every 2 weeks for nonadherence, after the patient tolerates the oral form, because the drug stays in the body a long time.","src":"Slide 51; lecture"},{"s":"meds","q":"A patient taking haloperidol (Haldol) suddenly screams; the neck is twisted to one side and the eyes are rolled upward. What should the nurse do?","o":["Stay with the patient, call for help, and give benztropine (Cogentin) IM as ordered","Leave to get the seizure-precaution equipment","Tell the patient to relax the neck muscles","Give the next dose of haloperidol early"],"a":0,"r":"This is acute dystonia with oculogyric crisis, treated as an emergency. Don't confuse it with a seizure and don't leave the patient; call for help and give Cogentin IM (Benadryl can substitute). It resolves almost immediately. More Haldol worsens it.","src":"Slides 63–64; lecture"},{"s":"meds","q":"During group, a patient taking an antipsychotic keeps getting up, pacing and tapping both feet. How should the nurse interpret this behavior?","o":["The patient is being deliberately disruptive and needs limits set","The patient is showing signs of tardive dyskinesia","The patient is having a dystonic reaction","The patient is likely experiencing akathisia, a medication side effect"],"a":3,"r":"Akathisia = restlessness, fidgeting, \"happy feet.\" She said the patient can't help it, so telling them they're being disruptive doesn't help. TD involves facial and tongue movements; dystonia involves muscle spasms.","src":"Slide 63; lecture"},{"s":"meds","q":"A patient who has taken chlorpromazine (Thorazine) for years has new lip smacking and worm-like movements of the tongue. What is the nurse's best action?","o":["Give benztropine (Cogentin) IM","Discontinue the medication and document it","Hold the medication and have the psychiatrist evaluate the patient","Reassure the patient that this will go away on its own"],"a":2,"r":"These are early signs of tardive dyskinesia, which is potentially irreversible. Prompt action may prevent irreversibility, but nurses don't discontinue medications: the nurse holds it and consults the psychiatrist. Cogentin does not treat TD.","src":"Slide 65; lecture"},{"s":"meds","q":"A patient on haloperidol (Haldol) has severe muscle rigidity, a temperature of 105°F, fluctuating BP, diaphoresis and is becoming less responsive. Which action is the priority?","o":["Discontinue the antipsychotic and notify the provider STAT","Give the next dose of haloperidol to calm the patient","Give benztropine (Cogentin) and recheck in an hour","Apply restraints for patient safety"],"a":0,"r":"This is neuroleptic malignant syndrome: rare but fatal, with rapid progression. Stop the neuroleptic immediately, notify STAT (rapid response), monitor vitals, rigidity, I&O and LOC, cool the patient, and expect bromocriptine or dantrolene and transfer to the ICU. It is the one time an antipsychotic is stopped abruptly.","src":"Slides 67–68; lecture"},{"s":"meds","q":"A patient who has taken clozapine (Clozaril) for 6 weeks says, \"My throat is sore and I feel achy and feverish.\" What should the nurse do?","o":["Give the dose and offer throat lozenges","Encourage fluids and recheck in the morning","Hold the clozapine and request an order for a WBC count","Give acetaminophen and the clozapine together"],"a":2,"r":"Sore throat, fever and malaise can signal agranulocytosis, which usually occurs within 3 months. She said to hold the Clozaril and ask the provider for an order for blood work (WBC). Agranulocytosis puts the patient at risk of opportunistic infection.","src":"Slides 61–62; lecture"},{"s":"meds","q":"A patient with refractory schizophrenia who stopped taking clozapine (Clozaril) for 3 weeks is readmitted. The new order is clozapine 200 mg PO twice daily, the patient's previous dose. What is the nurse's best action?","o":["Give the dose because the patient tolerated it before","Give the dose with a benzodiazepine to prevent seizures","Give half the dose and recheck vital signs","Hold the dose and question the order, because clozapine must be restarted at a low dose"],"a":3,"r":"Clozapine must be started low and titrated slowly (about 25 mg twice or three times a day); starting high or titrating fast causes seizures. After nonadherence, the titration starts over from the beginning. Unlike Depakote, it can never be loaded.","src":"Lecture; slide 61"},{"s":"ch1","q":"Which statement by a nurse uses the most appropriate, person-first language?","o":["\"The manic in room 12 needs her medication.\"","\"The schizophrenic in room 4 is hearing voices.\"","\"The patient in room 12 is displaying manic behavior.\"","\"Room 4 is a bipolar.\""],"a":2,"r":"The DSM-5 classifies disorders, not people. Person-first language describes behavior and avoids labeling a person as an illness (\"a schizophrenic,\" \"the manic\").","src":"Chapter 1"},{"s":"ch1","q":"A nursing student has felt sad and slept poorly for 2 days after failing an exam but is still attending class and working. Where does the student fall on the mental health–mental illness continuum?","o":["Mental health (well-being): stress with no serious impairment","Mental illness with moderate impairment","Serious mental illness","A psychiatric emergency"],"a":0,"r":"People at the well-being end may feel stress and discomfort from everyday problems but have no serious impairment in daily functioning. The textbook uses this exact kind of example (a gray cloud after a failed exam).","src":"Chapter 1, Fig. 1.2"},{"s":"ch1","q":"A patient asks why he developed depression when his brother, raised in the same home, did not. The nurse explains that most psychiatric disorders result from a combination of genetic vulnerability and environmental stress. Which model is the nurse describing?","o":["Germ theory","Diathesis-stress model","Paternalistic model","Recovery model"],"a":1,"r":"The diathesis-stress model (diathesis = biological predisposition; stress = environmental stress or trauma) is the most accepted explanation of mental illness: nature plus nurture.","src":"Chapter 1"},{"s":"ch1","q":"A report states that 3,000 adults in a county were newly diagnosed with major depressive disorder last year. This number describes the:","o":["Prevalence","Lifetime risk","Comorbidity","Incidence"],"a":3,"r":"Incidence = the number of new cases in a given period (usually a year). Prevalence = all cases, new and existing. Comorbidity = two or more disorders together.","src":"Chapter 1"},{"s":"ch1","q":"Which statement by a patient best reflects resilience?","o":["\"I've learned to calm down before I try to defend my opinion.\"","\"If I get really angry, I know I'll end up depressed.\"","\"Bad things just happen to me no matter what I do.\"","\"I avoid my problems until they go away.\""],"a":0,"r":"Resilient people regulate their emotions and don't dwell on negative, self-defeating thoughts. The other statements show poor emotional regulation, helplessness or avoidance.","src":"Chapter 1"},{"s":"ch1","q":"Which intervention is within the scope of a basic-level psychiatric-mental health registered nurse?","o":["Prescribing an antidepressant","Teaching a family coping skills for a stressful situation","Conducting individual psychotherapy","Diagnosing a patient with major depressive disorder"],"a":1,"r":"Basic-level nurses provide coordination of care, health teaching (coping skills, stress management), milieu therapy and medication teaching and monitoring. Prescribing and psychotherapy are advanced practice (PMH-APRN) roles; nurses treat responses to illness, not the disorder itself.","src":"Chapter 1, Table 1.2"},{"s":"ch1","q":"A patient in a recovery program says, \"I decide what my goals are now, and my providers give me tools to reach them.\" This statement best reflects which recovery principle?","o":["Recovery is linear and free of setbacks","Recovery depends mainly on the provider's decisions","Recovery is person-driven, based on self-determination","Recovery requires long-term hospitalization"],"a":2,"r":"SAMHSA describes recovery as person-driven: self-determination and self-direction are its foundation. The consumer movement shifted care away from a paternalistic model; recovery is nonlinear and can include setbacks.","src":"Chapter 1"},{"s":"ch1","q":"Which statement by a nurse shows correct understanding of mental and physical illness?","o":["\"Mental illness is mostly a matter of willpower.\"","\"Psychiatric disorders are all in the patient's head.\"","\"Mental illness is less serious than physical illness.\"","\"Mental illness is brain-based, so the line between mental and physical illness is artificial.\""],"a":3,"r":"The textbook calls the distinction between mental and physical illness artificial: the brain is physical, so mental illness is a physical illness. Calling disorders a choice or \"all in the head\" supports stigma.","src":"Chapter 1"},{"s":"ch6","q":"A patient who signed a voluntary admission 2 days ago tells the nurse, \"I want to go home today.\" What is the nurse's best response?","o":["\"You signed in, so you must stay until the doctor discharges you.\"","\"You have the right to request discharge. I'll notify your provider so you can be evaluated.\"","\"If you leave, we will call the police.\"","\"You cannot leave until your insurance runs out.\""],"a":1,"r":"Voluntary patients have the right to request and obtain release. They may be re-evaluated first, and if they meet criteria (e.g., danger to self) the provider may start an involuntary process. Threats or refusing the request could be false imprisonment.","src":"Chapter 6"},{"s":"ch6","q":"Which situation most clearly meets the criteria for involuntary commitment?","o":["A patient with schizophrenia who refuses to take medication but is eating, sleeping and safe","A patient with depression who wants to go home against medical advice","A patient with mental illness who has stopped eating and threatens to harm a neighbor","A patient who disagrees with the diagnosis"],"a":2,"r":"Involuntary commitment requires a mental illness plus danger to self or others, or being gravely disabled (unable to meet basic needs). Refusing medication or disagreeing with a diagnosis alone is not enough.","src":"Chapter 6"},{"s":"ch6","q":"An adult patient is placed in four-point restraints for violent behavior. What is the maximum length of time a single restraint order may last?","o":["1 hour","2 hours","8 hours","4 hours"],"a":3,"r":"Per CMS, orders last up to 4 hours for adults 18 and older, 2 hours for ages 9–17, and 1 hour for children under 9. Orders may be renewed to a total of 24 hours, after which the provider must assess the patient in person.","src":"Chapter 6"},{"s":"ch6","q":"A patient suddenly becomes violent and is about to hit another patient. There is no restraint order. What is the nurse's best action?","o":["Wait for the provider to arrive and write an order","Place the patient in seclusion or restraint for safety and obtain an order as soon as possible","Use a PRN restraint order from the admission orders","Ask the other patients to leave the unit"],"a":1,"r":"In an emergency, a nurse may place a patient in seclusion or restraint and then obtain an order as soon as possible. Restraint orders are never written as PRN or standing orders.","src":"Chapter 6"},{"s":"ch6","q":"An involuntarily committed patient who is calm and not dangerous refuses the scheduled antipsychotic. What should the nurse do?","o":["Respect the refusal, document it, and notify the provider","Give the medication IM because the patient is involuntary","Hide the medication in the patient's food","Withhold meals until the patient takes it"],"a":0,"r":"Patients have the right to refuse treatment even when involuntarily committed. They can be medicated against their will without a court order only in an emergency (imminent harm to self or others); otherwise a court hearing is required. Forcing or tricking the patient could be battery.","src":"Chapter 6; lecture"},{"s":"ch6","q":"During a one-on-one session, a patient tells the staff nurse, \"When I get out, I'm going to kill my ex-wife.\" What is the nurse's priority action?","o":["Keep the statement confidential to protect trust","Call the ex-wife personally from the unit phone","Report the threat to the treatment team","Tell the patient he will be arrested"],"a":2,"r":"Under the duty to warn and protect (Tarasoff), confidentiality is broken when a patient threatens a specific person. Staff nurses are obligated to report the threat to the treatment team; the advanced practice provider or team takes steps to warn and protect the victim.","src":"Chapter 6"},{"s":"ch6","q":"Which situation is an example of false imprisonment?","o":["Keeping a voluntarily admitted patient on a locked unit with no legal order to hold them","Restraining a patient who is actively assaulting staff, with an order","Placing an involuntarily committed patient on a 72-hour hold","Offering a patient a quiet room for time-out that the patient may leave"],"a":0,"r":"False imprisonment = confining a person without legal justification, such as detaining a voluntary patient with no supporting legal basis. Her example: a patient on the unit with no legal papers is a civil rights violation. Time-out is voluntary, so it is not confinement.","src":"Chapter 6; lecture"},{"s":"ch6","q":"A nurse tells a patient who refuses an oral medication, \"If you don't take this pill right now, I'll get help and give you a shot.\" This statement is an example of:","o":["Battery","Defamation of character","Invasion of privacy","Assault"],"a":3,"r":"Assault is a threat that makes a person fear harm or offensive touching. Battery is the actual touching (giving the injection without consent). Defamation is a false statement that damages reputation.","src":"Chapter 6"},{"s":"ch6","q":"A caller says, \"I'm Sarah Jones's mother. Is my daughter on your unit?\" The 25-year-old patient has not signed a release. What is the nurse's best response?","o":["\"Yes, she's here, but you can't visit yet.\"","\"I can neither confirm nor deny that anyone is a patient here.\"","\"Let me check her chart and call you back with her diagnosis.\"","\"Since you're her mother, I can tell you she's doing better.\""],"a":1,"r":"Only the patient can waive confidentiality. Without the adult patient's consent, the nurse cannot even confirm that she is a patient. Telling a parent that an adult child is on a psychiatric unit is an invasion of privacy.","src":"Chapter 6"},{"s":"ch8","q":"A nurse feels irritated with a patient who is withdrawing from alcohol and realizes the patient reminds her of her father, who drank heavily. This is an example of:","o":["Transference","Empathy","Countertransference","Sympathy"],"a":2,"r":"Countertransference is the nurse unconsciously putting feelings about someone from the nurse's own past onto the patient. Transference goes the other way (patient → nurse). The fix is self-awareness and supervision.","src":"Chapter 8; lecture"},{"s":"ch8","q":"A patient says to the nurse, \"You're cold and bossy, just like my mother.\" The nurse recognizes this as:","o":["Transference","Countertransference","A boundary violation","Positive regard"],"a":0,"r":"Transference occurs when the patient unconsciously displaces feelings about a significant person from the past onto the nurse. It is common because nurses are authority figures. A helpful response explores it: \"Let's talk about someone who was cold to you.\"","src":"Chapter 8"},{"s":"ch8","q":"A patient whose spouse just died is crying. Which response by the nurse shows empathy?","o":["\"I feel so sad for you. I know exactly how you feel.\"","\"You'll feel better in time.\"","\"Don't cry. Your spouse wouldn't want that.\"","\"This must be very painful for you. What are you thinking right now?\""],"a":3,"r":"Empathy is understanding the patient's feelings from their perspective without taking them on. Sympathy (\"I feel so sad for you\") shifts the focus to the nurse. False reassurance and \"don't cry\" shut down feelings.","src":"Chapter 8; lecture"},{"s":"ch8","q":"A patient says, \"I'll tell you something important, but you have to promise not to tell anyone.\" What is the nurse's best response?","o":["\"I promise. You can trust me.\"","\"I can't make that promise. It may be important to share with the staff.\"","\"Then don't tell me.\"","\"I'll only tell the doctor.\""],"a":1,"r":"The nurse cannot promise secrecy because the information could affect the patient's or others' safety and is shared with the treatment team. Being honest lets the patient decide what to share.","src":"Chapter 8, Table 8.1"},{"s":"ch8","q":"During the first meeting with a patient, which action belongs to the orientation phase of the nurse-patient relationship?","o":["Summarizing the goals the patient achieved","Reviewing the patient's chart before meeting","Setting a contract for meeting times and explaining confidentiality","Practicing new coping skills for anxiety"],"a":2,"r":"Orientation tasks include introductions, building rapport, setting a contract (time, place, length, ending) and explaining confidentiality. Chart review is preorientation; practicing coping skills is the working phase; summarizing goals is termination.","src":"Chapter 8 (Peplau)"},{"s":"ch8","q":"On admission day, a patient offers the nurse an expensive gold bracelet \"for taking such good care of me.\" What should the nurse do?","o":["Graciously refuse the gift and explore what it means to the patient","Accept it so the patient doesn't feel rejected","Accept it and give it to the nurse manager","Accept it only if no one else sees"],"a":0,"r":"Expensive gifts and money are always graciously refused; accepting them is a boundary violation. Explore the meaning: is the patient trying to get better care, keep self-esteem, or is it cultural?","src":"Chapter 8, Table 8.1; lecture"},{"s":"ch25","q":"A patient with depression says, \"My wife works two jobs to take care of me. I can't do anything anymore. I'm just a burden.\" The nurse recognizes this statement as reflecting:","o":["Ambivalence about treatment","Grandiosity","Hopelessness and helplessness","Denial of illness"],"a":2,"r":"She said hopelessness and helplessness will be on the exam, but the question won't use those words; you must identify them from what the patient says. Feeling like a burden is a warning sign (Box 25.2) and calls for a direct suicide assessment.","src":"Chapter 25; lecture"},{"s":"ch25","q":"A 70-year-old patient who has never had a will asks for help writing one and gives his watch collection to his grandson. What is the nurse's best action?","o":["Praise the patient for planning ahead","Ask the patient directly whether he is thinking about killing himself","Notify the family that the patient is organizing his affairs","Document the behavior as normal for his age"],"a":1,"r":"Making a will and giving away prized possessions are covert, nonverbal suicide clues. Asking directly about suicidal thoughts is the most important assessment and does not plant the idea.","src":"Chapter 25; lecture"},{"s":"ch25","q":"Which patient is at highest risk for suicide?","o":["A 32-year-old married woman with two children and a strong faith","A 45-year-old woman with anxiety who attends therapy weekly","A 19-year-old college student with test anxiety and supportive parents","A 72-year-old widowed white man who drinks daily and owns a gun"],"a":3,"r":"Risk rises with male gender (men use more lethal methods), older age (especially white men), substance use, isolation/loss and access to firearms. Marriage, children, faith, ongoing treatment and support are protective factors.","src":"Chapter 25, Box 25.2; lecture"},{"s":"ch25","q":"Four patients describe suicidal thoughts. Which plan has the highest lethality?","o":["\"I'll shoot myself with the gun in my nightstand on Friday when everyone's at work.\"","\"I might take some of my pills.\"","\"Sometimes I think about cutting my wrists.\"","\"I've thought about turning on the gas stove.\""],"a":0,"r":"Assess three elements: a specific plan (time, place, means), the method's lethality, and access. A gun is a high-lethality (\"hard\") method; this patient also has a specific time and access. Pills, wrist cutting and gas are lower-lethality (\"soft\") methods.","src":"Chapter 25; lecture"},{"s":"ch25","q":"A newly admitted patient with depression is quiet and avoids eye contact. Which question should the nurse ask during the assessment?","o":["\"You're not thinking of doing anything silly, are you?\"","\"Why are you so sad?\"","\"Are you thinking about killing yourself?\"","\"You don't want to hurt yourself, do you?\""],"a":2,"r":"Ask directly and clearly. Asking about suicide does not put the idea in someone's head, and patients often feel relief. Leading questions (\"you don't want to…, do you?\") discourage honest answers, and \"why\" questions make people defensive.","src":"Chapter 25"},{"s":"ch25","q":"On the first day of admission, a patient on suicide precautions asks for clean sheets and a fresh towel. What is the nurse's best action?","o":["Give the clean linens and let the patient keep the old ones for extra comfort","Give the clean linens and collect the used sheets and towel at the same time","Refuse all linens while the patient is on precautions","Leave the linens outside the patient's door"],"a":1,"r":"Inpatient suicides usually happen in the first 72 hours, and most often by hanging. Extra linens can become a ligature, so she teaches: \"Sure, Mr. Jones, let me have your dirty sheets back.\"","src":"Lecture; Chapter 25, Box 25.4"},{"s":"ch25","q":"A patient on one-to-one suicide observation needs to use the bathroom. What should the staff member do?","o":["Wait outside the closed bathroom door","Keep the patient in sight at all times, with a same-gender staff member if possible","Allow privacy for 5 minutes, then knock","Check on the patient every 15 minutes"],"a":1,"r":"One-to-one means never letting the patient out of staff's sight, including in the bathroom and shower. She advised arranging a same-gender colleague when possible. Every-15-minute checks are a lower level of observation.","src":"Chapter 25, Table 25.3; lecture"},{"s":"ch25","q":"The nurse is teaching the parents of a 15-year-old who was discharged after a suicide attempt. Which instruction is most important?","o":["\"Lock up or remove all medications and firearms from the home.\"","\"Teens rarely act on impulse, so watch for a detailed plan.\"","\"Avoid talking about the attempt so you don't upset your child.\"","\"Anger and acting out mean your child is no longer depressed.\""],"a":0,"r":"Adolescents are impulsive and are \"infamous for swallowing everything in the medicine cabinet,\" so limiting access to lethal means is key. Depression in teens often shows as anger and acting out. Talking openly is protective.","src":"Lecture; Chapter 25"},{"s":"ch25","q":"A 22-year-old patient has repeatedly cut her forearms \"to relieve the tension\" and denies wanting to die. Which nursing approach is most appropriate?","o":["Tell the patient that cutting is attention-seeking and must stop","Provide wound care, use a nonjudgmental approach, and explore triggers and other ways to cope","Ignore the cuts so the behavior is not reinforced","Place the patient in restraints until she promises to stop"],"a":1,"r":"This is nonsuicidal self-injury: intentional tissue damage without suicidal intent, often to relieve tension. Nursing care includes treating wounds, building a therapeutic alliance, and teaching replacement coping skills (DBT is used). Judgment or ignoring damages trust; NSSI still raises later suicide risk.","src":"Chapter 25"},{"s":"meds","q":"A patient taking chlorpromazine (Thorazine) is going on a day pass to the beach in July. Which instruction is most important?","o":["\"Use sunscreen and wear protective clothing and sunglasses.\"","\"Eat a high-sodium snack before you leave.\"","\"Skip your morning dose so you don't get drowsy.\"","\"Avoid all dairy products while you are out.\""],"a":0,"r":"Antipsychotics cause photosensitivity, so patients use sunscreen and protective clothing (slides 58, 70). They also affect temperature regulation, so extremes of heat and cold are avoided. Doses are not skipped without the provider.","src":"Slides 58, 70; lecture"},{"s":"meds","q":"A patient is to start ziprasidone (Geodon). Which assessment should be completed before the first dose?","o":["Serum lithium level","Baseline EKG","Tyramine dietary history","Abnormal Involuntary Movement Scale only"],"a":1,"r":"Geodon prolongs the QT interval (slide 60). She stressed knowing the patient's baseline EKG before starting it, then monitoring vital signs and watching for dizziness, palpitations, syncope or weakness.","src":"Slide 60; lecture"},{"s":"meds","q":"A patient taking lamotrigine (Lamictal) for bipolar disorder shows the nurse a new red rash across the chest and back. What is the nurse's best action?","o":["Apply an over-the-counter hydrocortisone cream and continue the drug","Reassure the patient that a rash is harmless","Hold the next dose and report the rash to the provider promptly","Double the fluids and recheck in a week"],"a":2,"r":"She called it \"the Lamictal rash,\" usually on the torso. The textbook explains any rash must be reported and the drug stopped because it can progress to Stevens-Johnson syndrome or toxic epidermal necrolysis.","src":"Lecture; Varcarolis Ch. 13"},{"s":"meds","q":"A hospitalized patient is started on carbamazepine (Tegretol) for bipolar disorder. According to the lecture, which lab value does the nurse expect to monitor closely?","o":["White blood cell count","Serum potassium","Hemoglobin A1C","Serum ammonia only"],"a":0,"r":"She said Tegretol patients have their WBCs monitored (about three times a week in the hospital) because a WBC below normal puts them at risk for opportunistic infection. Lithium and Depakote are the two mood stabilizers she said have blood levels monitored.","src":"Lecture"},{"s":"meds","q":"A patient prescribed alprazolam (Xanax) says, \"I like to have a glass of wine at dinner.\" What is the nurse's best response?","o":["\"One glass is fine if you take the pill with food.\"","\"Take the Xanax 2 hours after the wine.\"","\"Switch to beer instead of wine.\"","\"Avoid alcohol completely, because together they can dangerously slow your breathing and level of consciousness.\""],"a":3,"r":"Benzodiazepines and alcohol are both CNS depressants; together they add up, from sedation to respiratory depression and coma (slides 13, 15). Patients are taught not to consume other CNS depressants (\"don't have a martini with 2 mg of Xanax\").","src":"Slides 13, 15, 18; lecture"},{"s":"meds","q":"A patient taking haloperidol (Haldol) says, \"I feel so stiff.\" The nurse notes a shuffling gait, a fine hand tremor and a mask-like face. Which assessment best confirms the nurse's suspicion?","o":["Asking permission, then checking for cogwheel rigidity at the elbow","Checking the pupils for constriction","Testing for a positive Homans sign","Measuring abdominal girth"],"a":0,"r":"These are signs of pseudoparkinsonism (EPS). She taught asking the psychiatric patient for permission to touch, then placing a thumb in the antecubital fossa while moving the arm to feel cogwheeling. Cogentin can be ordered to treat it.","src":"Slide 63; lecture"},{"s":"meds","q":"A patient is starting disulfiram (Antabuse). Which statement by the patient shows the teaching was effective?","o":["\"I can still use my regular mouthwash and aftershave.\"","\"I'll check labels and avoid anything with alcohol, even vanilla extract and mouthwash.\"","\"A small glass of wine on weekends is okay.\"","\"I can drink as long as I take the pill afterward.\""],"a":1,"r":"Patients on disulfiram cannot have any alcohol, ingested or on the skin. She listed baked goods with vanilla extract, mouthwash, aftershave and cologne. Exposure makes the patient violently sick.","src":"Lecture; Varcarolis Table 22.6"},{"s":"meds","q":"A patient taking paroxetine (Paxil) for 1 week says, \"I feel a little better, so I'm going to stop taking it.\" What is the nurse's best response?","o":["\"That's fine as long as you feel better.\"","\"You can take it only on days you feel down.\"","\"Keep taking it as prescribed. The full effect takes time, and stopping suddenly can cause discontinuation symptoms.\"","\"Cut the dose in half on your own for a week, then stop.\""],"a":2,"r":"Teaching: the patient must keep taking the medication; the full effect may take up to 4 weeks (slide), and it must not be stopped abruptly because of discontinuation syndrome (slides 30, 35). Dose changes are made only by the prescriber.","src":"Slides 30, 35"},{"s":"meds","q":"Besides treating psychosis, haloperidol (Haldol) is also used to treat which condition?","o":["Hypertension","Tourette syndrome tics","Hypothyroidism","Insomnia in older adults"],"a":1,"r":"Slide 50 lists tics and vocal utterances (and intractable hiccoughs) as uses of antipsychotics, and she said Tourette syndrome patients respond well to Haldol.","src":"Slide 50; lecture"},{"s":"ch1","q":"A patient with schizophrenia develops type 2 diabetes from the side effects of an antipsychotic. Having both conditions is called:","o":["Incidence","Comorbidity","Prevalence","Parity"],"a":1,"r":"Comorbidity is the presence of two or more disorders, at the same time or in sequence. The textbook uses this example: schizophrenia is often comorbid with diabetes from antipsychotic side effects.","src":"Chapter 1"},{"s":"ch1","q":"Which statement best describes mental health parity?","o":["Insurance must cover mental health conditions on equal terms with medical and surgical conditions","Every hospital must have a psychiatric unit","Mental health care is free for everyone in the United States","Psychiatric patients must be treated by psychiatrists only"],"a":0,"r":"Parity means equal treatment in insurance coverage: deductibles, copays, visit limits and lifetime limits on par with medical care (Mental Health Parity Act 1996; Wellstone-Domenici 2008; strengthened by the ACA).","src":"Chapter 1"},{"s":"ch1","q":"A nurse learns that a behavior considered a sign of illness in one country is accepted as normal in another. Which concept does this best illustrate?","o":["Mental illness is always caused by genetics","The DSM-5 classifies people rather than disorders","What counts as mental illness is shaped by culture","Mental illness is the same everywhere in the world"],"a":2,"r":"There is no standard measure of mental health because it is culturally defined; cultures differ in what they view as acceptable and in the behaviors they label as illness (for example, culture-bound syndromes such as \"running amok\").","src":"Chapter 1"},{"s":"ch6","q":"A 12-year-old on the child unit is placed in restraints for violent behavior. What is the maximum length of time a single order may last?","o":["30 minutes","1 hour","2 hours","4 hours"],"a":2,"r":"Restraint/seclusion orders are limited by age: 4 hours for adults 18+, 2 hours for ages 9–17, and 1 hour for children under 9. Orders are never PRN, and a new order is needed once the patient is released.","src":"Chapter 6"},{"s":"ch6","q":"A patient is scheduled for electroconvulsive therapy (ECT). While the nurse is preparing him, he says, \"I don't really know what they're going to do to me.\" What is the nurse's best action?","o":["Proceed, because the consent form is already signed","Explain the procedure and have the patient sign again","Tell the patient that ECT is safe and he shouldn't worry","Notify the prescriber that the patient does not understand the procedure"],"a":3,"r":"The prescriber is legally responsible for obtaining informed consent. If the nurse believes the patient does not understand, the next step is to notify the prescriber of the concern. Proceeding or giving false reassurance violates the right to informed consent.","src":"Chapter 6"},{"s":"ch6","q":"A patient who has calmed down is sitting in an unlocked quiet room. A staff member says, \"If you step out of this room, we'll put you in restraints.\" This situation is best described as:","o":["Seclusion","Time-out","Therapeutic holding","An appropriate limit"],"a":0,"r":"Seclusion is confining a patient alone and preventing them from leaving. Even if the door is not locked, threatening the patient if they try to leave is still seclusion. Time-out is voluntary, and the patient can leave at any time.","src":"Chapter 6"},{"s":"ch25","q":"A patient with schizophrenia says, \"The voices are getting louder again.\" Which question should the nurse ask first?","o":["\"Have you been taking your medication?\"","\"What are the voices telling you to do?\"","\"Are the voices male or female?\"","\"How long have you heard voices?\""],"a":1,"r":"Command hallucinations can tell the patient to kill themselves or others (\"you're worthless, go kill yourself\"). She said to ask what the voices are telling them and whether they recognize the voice, because psychosis puts the patient at high risk.","src":"Lecture; Chapter 25"},{"s":"ch25","q":"Which factor is considered protective against suicide?","o":["Living alone after a recent divorce","Having firearms in the home for protection","Strong connections to family and a faith community","A family history of suicide"],"a":2,"r":"Protective factors include effective mental health care, strong connections to family and community, marriage and children, problem-solving skills, and religious beliefs against suicide. Isolation, access to firearms and family history are risk factors.","src":"Chapter 25, Box 25.2; lecture"},{"s":"ch25","q":"During night rounds, the nurse finds a patient on suicide precautions sleeping with both hands under the blanket. What should the nurse do?","o":["Let the patient sleep undisturbed and check again in an hour","Document that the patient is sleeping comfortably","Remove the blanket from the patient's bed for the rest of the night","Ask the patient to keep the hands in view, outside the covers"],"a":3,"r":"On suicide precautions, the patient's hands should always be in view while sleeping, not under the covers, because a patient can harm themselves out of sight (Table 25.3).","src":"Chapter 25, Table 25.3"}];
const TOTAL = QUESTIONS.length;
{const t=document.getElementById("totN");if(t)t.textContent=TOTAL;else document.addEventListener("DOMContentLoaded",()=>{const e=document.getElementById("totN");if(e)e.textContent=TOTAL;});}
const SECTIONS = [
  {id:"meds", name:"Medications", c:"var(--meds)"},
  {id:"ch1", name:"Ch 1 Mental Health", c:"var(--ch1)"},
  {id:"ch6", name:"Ch 6 Legal & Ethical", c:"var(--ch6)"},
  {id:"ch8", name:"Ch 8 Relationships", c:"var(--ch8)"},
  {id:"ch25", name:"Ch 25 Suicide & NSSI", c:"var(--ch25)"}
];
const SEC = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const LET = ["A","B","C","D"];
QUESTIONS.forEach((q,i)=>{ q.id = i; });

// Fixed "exam mix" order (seeded shuffle so numbering stays the same for every visit)
function seeded(seed){ return ()=>{ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }; }
const MIX = (()=>{ const r = seeded(20261008); const a = QUESTIONS.map(q=>q.id); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; })();
const BYSEC = SECTIONS.flatMap(s=>QUESTIONS.filter(q=>q.s===s.id).map(q=>q.id));

const KEY = "nur202_exam1_v1";
let st = { answers:{}, order:"mix", filter:"all", missed:false, cur:0 };
try{ const raw = localStorage.getItem(KEY); if(raw) st = Object.assign(st, JSON.parse(raw)); }catch(e){}
if (window.claude?.hot?.data?.st) st = Object.assign(st, window.claude.hot.data.st);
window.claude?.hot?.snapshot?.(()=>({st}));
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const isRight = id => st.answers[id] !== undefined && st.answers[id] === QUESTIONS[id].a;
const isWrong = id => st.answers[id] !== undefined && st.answers[id] !== QUESTIONS[id].a;

// global numbering follows the chosen order across all questions
function fullOrder(){ return st.order === "mix" ? MIX : BYSEC; }
function numberOf(id){ return fullOrder().indexOf(id) + 1; }
function seq(){
  return fullOrder().filter(id => (st.filter==="all" || QUESTIONS[id].s===st.filter) && (!st.missed || isWrong(id)));
}

function renderTop(){
  const ids = QUESTIONS.map(q=>q.id);
  const done = ids.filter(id=>st.answers[id]!==undefined).length;
  const right = ids.filter(isRight).length;
  const pct = done ? Math.round(right/done*100) : 0;
  $("#score").innerHTML = `<span class="pill"><span><b>${done}</b>/${TOTAL} answered</span></span><span class="pill"><span class="dot" style="background:var(--ok)"></span><span><b>${right}</b> correct · ${pct}%</span></span>`;
  const [g,r] = $("#pbar").children; g.style.width = (right/TOTAL*100)+"%"; r.style.width = ((done-right)/TOTAL*100)+"%";
  const chip = (id,label,c,n)=>`<button class="chip" type="button" style="--c:${c}" aria-pressed="${st.filter===id}" data-f="${id}">${id==="all"?"":'<span class="sw"></span>'}${esc(label)} <span class="n">${n}</span></button>`;
  $("#chips").innerHTML = chip("all","All sections","var(--accent)",TOTAL) + SECTIONS.map(s=>chip(s.id,s.name,s.c,QUESTIONS.filter(q=>q.s===s.id).length)).join("");
  $("#order").textContent = st.order==="mix" ? "Order: exam mix" : "Order: by section";
  $("#missed").setAttribute("aria-pressed", st.missed);
  const nWrong = ids.filter(isWrong).length;
  $("#retry").disabled = !nWrong; $("#retry").textContent = nWrong ? `Retry missed (${nWrong})` : "Retry missed";
}

function renderQ(){
  const list = seq(); const view = $("#qview");
  if(!list.length){
    view.innerHTML = `<div class="empty">${st.missed ? "No missed questions here. Nice work." : "No questions match this filter."}</div>`;
    return;
  }
  if(st.cur >= list.length) st.cur = list.length-1; if(st.cur<0) st.cur=0;
  const id = list[st.cur], q = QUESTIONS[id], s = SEC[q.s];
  const chosen = st.answers[id], answered = chosen !== undefined;
  const opts = q.o.map((o,i)=>{
    let cls = "", mk = "";
    if(answered){ if(i===q.a){ cls="correct"; mk = i===chosen ? "Your answer · correct" : "Correct answer"; } else if(i===chosen){ cls="wrong"; mk="Your answer"; } else cls="dim"; }
    return `<li><button class="opt ${cls}" type="button" data-i="${i}" ${answered?"disabled":""} aria-label="Option ${LET[i]}: ${esc(o)}"><span class="let">${LET[i]}</span><span class="txt">${esc(o)}</span><span class="mk">${mk}</span></button></li>`;
  }).join("");
  const fb = answered ? `<div class="fb ${chosen===q.a?"ok":"bad"}"><h3>${chosen===q.a ? "Correct." : "Not quite. The answer is " + LET[q.a] + "."}</h3><p>${esc(q.r)}</p><span class="src">Source: ${esc(q.src)}</span></div>` : "";
  view.innerHTML = `<article class="qcard" style="--c:${s.c}">
    <div class="meta"><span class="sec">${esc(s.name)}</span><span class="num">Question ${numberOf(id)} of ${TOTAL}${list.length<TOTAL?` · ${st.cur+1}/${list.length} in this view`:""}</span></div>
    <p class="stem">${esc(q.q)}</p>
    <ol class="opts">${opts}</ol>
    ${fb}
    <div class="nav">
      <button class="nbtn" id="prev" type="button" ${st.cur===0?"disabled":""}>Previous</button>
      <span class="hint">Keys: A–D to answer · ← → to move</span>
      <button class="nbtn ${answered?"primary":""}" id="next" type="button" ${st.cur===list.length-1?"disabled":""}>${answered?"Next question":"Skip"}</button>
    </div></article>`;
}

function renderGrid(){
  const list = seq(); const curId = list[st.cur];
  $("#grid").innerHTML = fullOrder().map(id=>{
    const q = QUESTIONS[id]; const inView = list.includes(id);
    const cls = isRight(id) ? "ok" : isWrong(id) ? "bad" : "";
    return `<button class="cell ${cls} ${id===curId?"cur":""}" type="button" style="--c:${SEC[q.s].c};${inView?"":"opacity:.35"}" data-id="${id}" aria-label="Question ${numberOf(id)}${cls==="ok"?", correct":cls==="bad"?", missed":""}">${numberOf(id)}</button>`;
  }).join("");
}

function renderSummary(){
  const done = QUESTIONS.filter(q=>st.answers[q.id]!==undefined).length;
  const box = $("#summary");
  if(!done){ box.innerHTML = `<h2>Your results</h2><p style="margin:0;color:var(--muted)">Answer a question to start your score. The blueprint weights medications most (${QUESTIONS.filter(q=>q.s==="meds").length} of ${TOTAL} here), so that bar matters most.</p>`; return; }
  const right = QUESTIONS.filter(q=>isRight(q.id)).length;
  const rows = SECTIONS.map(s=>{
    const qs = QUESTIONS.filter(q=>q.s===s.id); const d = qs.filter(q=>st.answers[q.id]!==undefined).length; const r = qs.filter(q=>isRight(q.id)).length;
    return `<div class="srow" style="--c:${s.c}"><span class="lab"><i></i>${esc(s.name)}</span><span class="val">${r}/${d} of ${qs.length}</span><div class="bar"><i class="g" style="width:${r/qs.length*100}%"></i><i class="r" style="width:${(d-r)/qs.length*100}%"></i></div></div>`;
  }).join("");
  const finished = done===TOTAL;
  box.innerHTML = `<h2>${finished?"Final results":"Results so far"}</h2>
    <div style="display:flex;gap:14px;align-items:baseline;flex-wrap:wrap"><span class="big">${Math.round(right/done*100)}%</span><span style="color:var(--muted)">${right} correct of ${done} answered${finished?"":` · ${TOTAL-done} to go`}</span></div>
    <div class="rows">${rows}</div>`;
}

function render(){ renderTop(); renderQ(); renderGrid(); renderSummary(); save(); }

function answer(i){
  const list = seq(); const id = list[st.cur]; if(id===undefined || st.answers[id]!==undefined) return;
  st.answers[id] = i; render();
  const fb = document.querySelector(".fb"); if(fb && fb.getBoundingClientRect().bottom > innerHeight) fb.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
function go(d){ const n = seq().length; st.cur = Math.max(0, Math.min(n-1, st.cur + d)); render(); $("#qview").scrollIntoView({block:"nearest"}); }

$("#qview").addEventListener("click", e=>{
  const o = e.target.closest(".opt"); if(o && !o.disabled) return answer(+o.dataset.i);
  if(e.target.closest("#prev")) return go(-1);
  if(e.target.closest("#next")) return go(1);
});
$("#grid").addEventListener("click", e=>{
  const c = e.target.closest(".cell"); if(!c) return; const id = +c.dataset.id;
  let list = seq(); if(!list.includes(id)){ st.filter="all"; st.missed=false; list = seq(); }
  st.cur = list.indexOf(id); render(); $("#qview").scrollIntoView({block:"start"});
});
$("#chips").addEventListener("click", e=>{ const c = e.target.closest(".chip"); if(!c) return; st.filter = c.dataset.f; st.cur = 0; render(); });
$("#order").addEventListener("click", ()=>{ const list = seq(); const id = list[st.cur]; st.order = st.order==="mix" ? "section" : "mix"; const nl = seq(); st.cur = Math.max(0, nl.indexOf(id)); render(); });
$("#missed").addEventListener("click", ()=>{ st.missed = !st.missed; st.cur = 0; render(); });
$("#retry").addEventListener("click", ()=>{
  const wrong = QUESTIONS.filter(q=>isWrong(q.id)).map(q=>q.id); if(!wrong.length) return;
  wrong.forEach(id=>delete st.answers[id]);
  st.missed = false; st._retry = wrong; st.filter = "all";
  st.cur = Math.max(0, seq().indexOf(fullOrder().find(id=>wrong.includes(id)))); render();
});
$("#reset").addEventListener("click", ()=>{ $("#confirm").hidden = false; });
$("#confirmNo").addEventListener("click", ()=>{ $("#confirm").hidden = true; });
$("#confirmYes").addEventListener("click", ()=>{ st.answers = {}; st.cur = 0; st.missed = false; $("#confirm").hidden = true; render(); window.scrollTo({top:0}); });
document.addEventListener("keydown", e=>{
  if(e.target.closest && e.target.closest("input,textarea")) return; if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase(); const idx = ["a","b","c","d"].indexOf(k); const num = ["1","2","3","4"].indexOf(k);
  if(idx>-1) { answer(idx); } else if(num>-1) { answer(num); } else if(e.key==="ArrowRight") go(1); else if(e.key==="ArrowLeft") go(-1);
});
render();
</script>

</body></html>
