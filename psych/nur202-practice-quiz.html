<style>

body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:var(--serif);font-weight:600;font-size:1.6rem;line-height:1.2;margin:0 0 4px}
header p{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}

.t1{background:var(--c1)} .t3{background:var(--c3)} .t6{background:var(--c6)} .t8{background:var(--c8)} .t10{background:var(--c10)}

.stem{font-family:var(--serif);font-size:1.12rem;line-height:1.6;margin:0 0 6px}

.opt{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;cursor:pointer}

<body>
<div class="wrap">
  <header>
    <h1>Nurse 202 Practice Quiz</h1>
    <p>Practice questions for Chapters 1, 3, 6, 8 and 10, with answers and rationales. Yellow notes flag places where a rationale (written for the 8th edition) disagrees with your 9th edition text or goes beyond it.</p>
  </header>
  <div id="prog"></div>
  <main id="main"></main>
</div>
<script>
const Q=[{"ch": 1, "n": 1, "sata": false, "eth": false, "stem": "A staff nurse completes orientation to a psychiatric unit. This nurse may expect an advanced practice nurse to perform which additional intervention?", "opts": ["Conduct mental health assessments.", "Prescribe psychotropic medication.", "Establish therapeutic relationships.", "Individualize nursing care plans."], "ans": [1], "rat": "In most states, prescriptive privileges are granted to masters-prepared nurse practitioners who have taken special courses on prescribing medication. The nurse prepared at the basic level is permitted to perform mental health assessments, establish relationships, and provide individualized care planning.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 2, "sata": false, "eth": false, "stem": "When a nursing student expresses concerns about how mental health nurses lose all their nursing skills, the best response by the mental health nurse is:", "opts": ["Psychiatric nurses practice in safer environments than other specialties. Nurse-to-patient ratios must be better because of the nature of the patients problems.", "Psychiatric nurses use complex communication skills as well as critical thinking to solve multidimensional problems. I am challenged by those situations.", "That's a misconception. Psychiatric nurses frequently use high technology monitoring equipment and manage complex intravenous therapies.", "Psychiatric nurses do not have to deal with as much pain and suffering as medical-surgical nurses do. That appeals to me."], "ans": [1], "rat": "The practice of psychiatric nursing requires a different set of skills than medical-surgical nursing, though there is substantial overlap. Psychiatric nurses must be able to help patients with medical as well as mental health problems, reflecting the holistic perspective these nurses must have. Nurse-patient ratios and workloads in psychiatric settings have increased, just like other specialties. Psychiatric nursing involves clinical practice, not just documentation. Psychosocial pain and suffering are as real as physical pain and suffering.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 3, "sata": false, "eth": false, "stem": "When a new bill introduced in Congress reduces funding for care of persons with mental illness, a group of nurses writes letters to their elected representatives in opposition to the legislation. Which role have the nurses fulfilled?", "opts": ["Recovery", "Attending", "Advocacy", "Evidence-based practice"], "ans": [2], "rat": "An advocate defends or asserts anothers cause, particularly when the other person lacks the ability to do that for self. Examples of individual advocacy include helping patients understand their rights or make decisions. On a community scale, advocacy includes political activity, public speaking, and publication in the interest of improving the human condition. Since funding is necessary to deliver quality programming for persons with mental illness, the letter- writing campaign advocates for that cause on behalf of patients who are unable to articulate their own needs.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 4, "sata": false, "eth": false, "stem": "Which comment best indicates that a patient perceived the nurse was caring? My nurse:", "opts": ["always asks me which type of juice I want to help me swallow my medication.", "explained my treatment plan to me and asked for my ideas about how to make it better.", "spends time listening to me talk about my problems. That helps me feel like I am not alone.", "told me that if I take all the medicines the doctor prescribes, then I will get discharged sooner."], "ans": [2], "rat": "Caring evidences empathetic understanding as well as competency. It helps change pain and suffering into a shared experience, creating a human connection that alleviates feelings of isolation. The distracters give examples of statements that demonstrate advocacy or giving advice.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 1, "n": 5, "sata": false, "eth": false, "stem": "Which assessment finding most clearly indicates that a patient may be experiencing a mental illness? The patient:", "opts": ["reports occasional sleeplessness and anxiety.", "reports a consistently sad, discouraged, and hopeless mood.", "is able to describe the difference between as if and for real.", "perceives difficulty making a decision about whether to change jobs."], "ans": [1], "rat": "The correct response describes a mood alteration, which reflects mental illness. The distracters describe behaviors that are mentally healthy or within the usual scope of human experience.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 6, "sata": false, "eth": false, "stem": "Which finding best indicates that the goal Demonstrate mentally healthy behavior was achieved? A patient:", "opts": ["sees self as capable of achieving ideals and meeting demands.", "behaves without considering the consequences of personal actions.", "aggressively meets own needs without considering the rights of others.", "seeks help from others when assuming responsibility for major areas of own life."], "ans": [0], "rat": "The correct response describes an adaptive, healthy behavior. The distracters describe maladaptive behaviors.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 1, "n": 7, "sata": false, "eth": false, "stem": "A nurse encounters an unfamiliar psychiatric disorder on a new patients admission form. Which resource should the nurse consult to determine criteria used to establish this diagnosis?", "opts": ["International Statistical Classification of Diseases and Related Health Problems (ICD-10)", "Diagnostic and Statistical Manual of Mental Disorders (DSM-5)", "A behavioral health reference manual", "Wikipedia"], "ans": [1], "rat": "The DSM-5 gives the criteria used to diagnose each mental disorder. The distracters may not contain diagnostic criteria for a psychiatric illness.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 8, "sata": false, "eth": false, "stem": "A nurse wants to find a description of diagnostic criteria for anxiety disorders. Which resource would have the most complete information?", "opts": ["Nursing Outcomes Classification (NOC)", "Diagnostic and Statistical Manual of Mental Disorders (DSM-5)", "The ANAs Psychiatric-Mental Health Nursing Scope and Standards of Practice", "International Statistical Classification of Diseases and Related Health Problems (ICD-10)"], "ans": [1], "rat": "The DSM-5 details the diagnostic criteria for psychiatric clinical conditions. The other references are good resources but do not define the diagnostic criteria.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 9, "sata": false, "eth": false, "stem": "Which individual is demonstrating the highest level of resilience? One who:", "opts": ["is able to repress stressors.", "becomes depressed after the death of a spouse.", "lives in a shelter for two years after the home is destroyed by fire.", "takes a temporary job to maintain financial stability after loss of a permanent job."], "ans": [3], "rat": "Resilience is closely associated with the process of adapting and helps people facing tragedies, loss, trauma, and severe stress. It is the ability and capacity for people to secure the resources they need to support their well-being. Repression and depression are unhealthy. Living in a shelter for two years shows a failure to move forward after a tragedy.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 10, "sata": false, "eth": false, "stem": "Complete this analogy. NANDA: clinical judgment: NIC:", "opts": ["patient outcomes", "nursing actions", "diagnosis", "symptoms"], "ans": [1], "rat": "Analogies show parallel relationships. NANDA, the North American Nursing Diagnosis Association, identifies diagnostic statements regarding human responses to actual or potential health problems. These statements represent clinical judgments. NIC (Nursing Interventions Classification) identifies actions provided by nurses that enhance patient outcomes. Nursing care activities may be direct or indirect.", "top": "Nursing Process: Evaluation", "note": "Your 9th edition uses ICNP (International Classification for Nursing Practice) rather than NANDA for nursing diagnoses. Check which system your professor expects."}, {"ch": 1, "n": 11, "sata": false, "eth": false, "stem": "A college student said, Most of the time I'm happy and feel good about myself. I have learned that what I get out of something is proportional to the effort I put into it. Which number on this mental health continuum should the nurse select? (Continuum: 1 = mental illness … 5 = mental health)", "opts": ["1", "2", "3", "4", "5"], "ans": [4], "rat": "5 The student is happy and has an adequate self-concept. The student is reality-oriented, works effectively, and has control over own behavior. Mental health does not mean that a person is always happy.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 12, "sata": false, "eth": false, "stem": "Which disorder is a culture-bound syndrome?", "opts": ["Epilepsy", "Schizophrenia", "Running amok", "Major depression"], "ans": [2], "rat": "Culture-bound syndromes occur in specific sociocultural contexts and are easily recognized by people in those cultures. A syndrome recognized in parts of Southeast Asia is running amok, in which a person (usually a male) runs around engaging in furious, almost indiscriminate violent behavior.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 13, "sata": false, "eth": false, "stem": "The Diagnostic and Statistical Manual of Mental Disorders (DSM-5) classifies:", "opts": ["deviant behaviors.", "present disability or distress.", "people with mental disorders.", "mental disorders people have."], "ans": [3], "rat": "The DSM-5 classifies disorders people have rather than people themselves. The terminology of the tool reflects this distinction by referring to individuals with a disorder rather than as a schizophrenic or alcoholic, for example. Deviant behavior is not generally considered a mental disorder. Present disability or distress is only one aspect of the diagnosis.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 14, "sata": false, "eth": false, "stem": "A citizen at a community health fair asks the nurse, What is the most prevalent mental disorder in the United States? Select the nurses best response.", "opts": ["Schizophrenia", "Bipolar disorder", "Dissociative fugue", "Alzheimers disease"], "ans": [3], "rat": "The 12-month prevalence for Alzheimers disease is 10% for persons older than 65 and 50% for persons older than 85. The prevalence of schizophrenia is 1.1% per year. The prevalence of bipolar disorder is 2.6%. Dissociative fugue is a rare disorder.", "top": "Nursing Process: Implementation", "note": "In your 9th edition Table 1.1, the 10% Alzheimer’s figure applies only to people over 65 (50% over 85). Answer the question as written, but know the context."}, {"ch": 1, "n": 15, "sata": false, "eth": false, "stem": "In the majority culture of the United States, which individual has the greatest risk to be labeled mentally ill? One who:", "opts": ["describes hearing Gods voice speaking.", "is usually pessimistic but strives to meet personal goals.", "is wealthy and gives away $20 bills to needy individuals.", "always has an optimistic viewpoint about life and having own needs met."], "ans": [0], "rat": "The question asks about risk. Hearing voices is generally associated with mental illness, but in charismatic religious groups, hearing the voice of God or a prophet is a desirable event. Cultural norms vary, which makes it more difficult to make an accurate diagnosis. The individuals described in the other options are less likely to be labeled mentally ill.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 16, "sata": false, "eth": false, "stem": "A patients relationships are intense and unstable. The patient initially idealizes the significant other and then devalues him or her, resulting in frequent feelings of emptiness. This patient will benefit from interventions to develop which aspect of mental health?", "opts": ["Effectiveness in work", "Communication skills", "Productive activities", "Fulfilling relationships"], "ans": [3], "rat": "The information given centers on relationships with others that are described as intense and unstable. The relationships of mentally healthy individuals are stable, satisfying, and socially integrated. Data are not present to describe work effectiveness, communication skills, or activities.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 17, "sata": false, "eth": false, "stem": "Which belief will best support a nurses efforts to provide patient advocacy during a multidisciplinary patient care planning session?", "opts": ["All mental illnesses are culturally determined.", "Schizophrenia and bipolar disorder are cross-cultural disorders.", "Symptoms of mental disorders are unchanged from culture to culture.", "Assessment findings in mental disorders reflect a persons cultural patterns."], "ans": [3], "rat": "A nurse who understands that a patients symptoms are influenced by culture will be able to advocate for the patient to a greater degree than a nurse who believes that culture is of little relevance. The distracters are untrue statements.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 18, "sata": false, "eth": false, "stem": "A nurse is part of a multidisciplinary team working with groups of depressed patients. Half the patients receive supportive interventions and antidepressant medication. The other half receives only medication. The team measures outcomes for each group. Which type of study is evident?", "opts": ["Incidence", "Prevalence", "Co-morbidity", "Clinical epidemiology"], "ans": [3], "rat": "Clinical epidemiology is a broad field that addresses studies of the natural history (or what happens if there is no treatment and the problem is left to run its course) of an illness, studies of diagnostic screening tests, and observational and experimental studies of interventions used to treat people with the illness or symptoms. Prevalence refers to numbers of new cases. Co-morbidity refers to having more than one mental disorder at a time.Incidence refers to the number of new cases of mental disorders in a healthy population within a given period.", "top": "Nursing Process: Evaluation", "note": "The rationale says prevalence means “numbers of new cases.” That’s wrong: new cases = incidence; all cases (new + existing) = prevalence."}, {"ch": 1, "n": 19, "sata": false, "eth": false, "stem": "The spouse of a patient diagnosed with schizophrenia says, I don't understand how events from childhood have anything to do with this disabling illness. Which response by the nurse will best help the spouse understand the cause of this disorder?", "opts": ["Psychological stress is the basis of most mental disorders.", "This illness results from developmental factors rather than stress.", "Research shows that this condition more likely has a biological basis.", "It must be frustrating for you that your spouse is sick so much of the time."], "ans": [2], "rat": "Many of the most prevalent and disabling mental disorders have strong biological influences. Genetics are only one part of biological factors. Empathy does not address increasing the spouses level of knowledge about the cause of the disorder. The other distracters are not established facts.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 20, "sata": false, "eth": false, "stem": "A category 5 tornado occurred in a community of 400 people resulting in destruction of many homes and businesses. In the 2 years after this disaster, 140 individuals were diagnosed with posttraumatic stress disorder (PTSD). Which term best applies to these newly diagnosed cases?", "opts": ["Prevalence", "Co-morbidity", "Incidence", "Parity"], "ans": [2], "rat": "Incidence refers to the number of new cases of mental disorders in a healthy population within a given period of time. Prevalence describes the total number of cases, new and existing, in a given population during a specific period of time, regardless of when they became ill. Parity refers to equivalence, and legislation required insurers that provide mental health coverage to offer annual and lifetime benefits at the same level provided for medical/surgical coverage. Co-morbidity refers to having more than one mental disorder at a time", "top": "Nursing Process: Planning/Outcomes Identification", "note": ""}, {"ch": 1, "n": 21, "sata": false, "eth": false, "stem": "Which component of treatment of mental illness is specifically recognized by Quality and Safety Education for Nurses (QSEN)?", "opts": ["All genomes are unique.", "Care is centered on the patient.", "Healthy development is vital to mental health.", "Recovery occurs on a continuum from illness to health."], "ans": [1], "rat": "The key areas of care promoted by QSEN are patient-centered care, teamwork and collaboration, evidence-based practice, quality improvement, safety, and informatics.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 22, "sata": false, "eth": false, "stem": "Select the best response for the nurse who receives a question from another health professional seeking to understand the difference between a Diagnostic and Statistical Manual of Mental Disorders (DSM-5) diagnosis and a nursing diagnosis.", "opts": ["There is no functional difference between the two. Both identify human disorders.", "The DSM-5 diagnosis disregards culture, whereas the nursing diagnosis takes culture into account.", "The DSM-5 diagnosis describes causes of disorders whereas a nursing diagnosis does not explore etiology.", "The DSM-5 diagnosis guides medical treatment, whereas the nursing diagnosis offers a framework for identifying interventions for issues a patient is experiencing."], "ans": [3], "rat": "The medical diagnosis is concerned with the patients disease state, causes, and cures, whereas the nursing diagnosis focuses on the patients response to stress and possible caring interventions. Both tools consider culture. The DSM-5 is multiaxial. Nursing diagnoses also consider potential problems.", "top": "Nursing Process: Implementation", "note": "The rationale calls the DSM-5 “multiaxial.” Outdated: the DSM-5 dropped the multiaxial system."}, {"ch": 1, "n": 23, "sata": false, "eth": false, "stem": "Which nursing intervention below is part of the scope of an advanced practice psychiatric/mental health nurse only?", "opts": ["Coordination of care", "Health teaching", "Milieu therapy", "Psychotherapy"], "ans": [3], "rat": "Psychotherapy is part of the scope of practice of an advanced practice nurse. The distracters are within a staff nurses scope of practice.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 1, "n": 1, "sata": true, "eth": false, "stem": "An experienced nurse says to a new graduate, When you've practiced as long as I have, you instantly know how to take care of psychotic patients. What information should the new graduate consider when analyzing thi comment? Select all that apply.", "opts": ["The experienced nurse may have lost sight of patients individuality, which may compromise the integrity of practice.", "New research findings should be integrated continuously into a nurses practice to provide the most effective care.", "Experience provides mental health nurses with the essential tools and skills needed for effective professional practice.", "Experienced psychiatric nurses have learned the best ways to care for mentally ill patients through trial and error.", "An intuitive sense of patients needs guides effective psychiatric nurses."], "ans": [0, 1], "rat": "Evidence-based practice involves using research findings and standards of care to provide the most effective nursing care. Evidence is continuously emerging, so nurses cannot rely solely on experience. The effective nurse also maintains respect for each patient as an individual. Overgeneralization compromises that perspective. Intuition and trial and error are unsystematic approaches to care.", "top": "Nursing Process: Diagnosis/Analysis", "note": ""}, {"ch": 1, "n": 2, "sata": true, "eth": false, "stem": "Which findings are signs of a person who is mentally healthy? Select all that apply.", "opts": ["Says, I have some weaknesses, but I feel I'm important to my family and friends.", "Adheres strictly to religious beliefs of parents and family of origin.", "Spends all holidays alone watching old movies on television.", "Considers past experiences when deciding about the future.", "Experiences feelings of conflict related to changing jobs."], "ans": [0, 3, 4], "rat": "Mental health is a state of well-being in which each individual is able to realize his or her own potential, cope with the normal stresses of life, work productively, and make a contribution to the community. Mental health provides people with the capacity for rational thinking, communication skills, learning, emotional growth, resilience, and self-esteem.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 1, "n": 3, "sata": true, "eth": false, "stem": "A patient in the emergency department says, Voices say someone is stalking me. They want to kill me because I developed a cure for cancer. I have a knife and will stab anyone who is a threat. Which aspects of the patients mental health have the greatest and most immediate concern to the nurse? Select all that apply.", "opts": ["Happiness", "Appraisal of reality", "Control over behavior", "Effectiveness in work", "Healthy self-concept"], "ans": [1, 2, 4], "rat": "The aspects of mental health of greatest concern are the patients appraisal of and control over behavior. The appraisal of reality is inaccurate. There are auditory hallucinations, delusions of persecution, and delusions of grandeur. In addition, the patients control over behavior is tenuous, as evidenced by the plan to stab anyone who seems threatening. A healthy self-concept is lacking, as evidenced by the delusion of grandeur. Data are not present to suggest that the other aspects of mental health (happiness and effectiveness in work) are of immediate concern.", "top": "Nursing Process: Assessment", "note": "“Appraisal of reality” and “control over behavior” come from the 8th edition’s list of mental health attributes. Your 9th edition uses Fig. 1.1 instead, so this item may not match your textbook."}, {"ch": 3, "n": 1, "sata": false, "eth": false, "stem": "A patient asks, What are neurotransmitters? The doctor said mine are imbalanced. Select the nurses best response.", "opts": ["How do you feel about having imbalanced neurotransmitters?", "Neurotransmitters protect us from harmful effects of free radicals.", "Neurotransmitters are substances we consume that influence memory and mood.", "Neurotransmitters are natural chemicals that pass messages between brain cells."], "ans": [3], "rat": "The patient asked for information, and the correct response is most accurate. Neurotransmitters are chemical substances that function as messengers in the central nervous system. They are released from the axon terminal, diffuse across the synapse, and attach to specialized receptors on the postsynaptic neuron. The distracters either do not answer the patients question or provide untrue, misleading information.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 3, "n": 2, "sata": false, "eth": false, "stem": "The parent of an adolescent diagnosed with schizophrenia asks the nurse, My childs doctor ordered a PET. What kind of test is that? Select the nurses best reply.", "opts": ["This test uses a magnetic field and gamma waves to identify problem areas in the brain. Does your teenager have any metal implants?", "PET means positron-emission tomography. It is a special type of scan that shows blood flow and activity in the brain.", "A PET scan passes an electrical current through the brain and shows brain-wave activity. It can help diagnose seizures.", "It's a special x-ray that shows structures of the brain and whether there has ever been a brain injury."], "ans": [1], "rat": "The parent is seeking information about PET scans. It is important to use terms the parent can understand, so the nurse should identify what the initials mean. The correct response is the only option that provides information relevant to PET scans. The distracters describe MRI, CT scans, and EEG.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 3, "n": 3, "sata": false, "eth": false, "stem": "A patient with a long history of hypertension and diabetes now develops confusion. The health care provider wants to make a differential diagnosis between Alzheimers disease and multiple infarcts. Which diagnostic procedure should the nurse expect to prepare the patient for first?", "opts": ["Skull x-rays", "Computed tomography (CT) scan", "Positron-emission tomography (PET)", "Single-photon emission computed tomography (SPECT)"], "ans": [1], "rat": "A CT scan shows the presence or absence of structural changes, including cortical atrophy, ventricular enlargement, and areas of infarct, information that would be helpful to the health care provider. PET and SPECT show brain activity rather than structure and may occur later.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 3, "n": 4, "sata": false, "eth": false, "stem": "A patients history shows drinking 4 to 6 liters of fluid and eating more than 6,000 calories per day. Which part of the central nervous system is most likely dysfunctional for this patient?", "opts": ["Amydala", "Parietal lobe", "Hippocampus", "Hypothalamus"], "ans": [3], "rat": "The hypothalamus, a small area in the ventral superior portion of the brainstem, plays a vital role in such basic drives as hunger, thirst, and sex.", "top": "Nursing Process: Assessment", "note": "The rationale places the hypothalamus in the brainstem. Your textbook says it lies above the brainstem. The answer is still correct."}, {"ch": 3, "n": 5, "sata": false, "eth": false, "stem": "The nurse prepares to assess a patient diagnosed with major depression for disturbances in circadian rhythms. Which question should the nurse ask this patient?", "opts": ["Have you ever seen or heard things that others do not?", "What are your worst and best times of the day?", "How would you describe your thinking?", "Do you think your memory is failing?"], "ans": [1], "rat": "Mood changes throughout the day may be related to circadian rhythm disturbances. Questions about sleep pattern are also relevant to circadian rhythms. The distracters apply to assessment for illusions and hallucinations, thought processes, and memory.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 3, "n": 6, "sata": false, "eth": false, "stem": "The nurse administers a medication that potentiates the action of gamma-aminobutyric acid (GABA). Which effect would be expected?", "opts": ["Reduced anxiety", "Improved memory", "More organized thinking", "Fewer sensory perceptual alterations"], "ans": [0], "rat": "Increased levels of GABA reduce anxiety. Acetylcholine and substance P are associated with memory enhancement. Thought disorganization is associated with dopamine. GABA is not associated with sensory perceptual alterations.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 3, "n": 7, "sata": false, "eth": false, "stem": "A nurse would anticipate that treatment for a patient with memory difficulties might include medications designed to:", "opts": ["inhibit gamma-aminobutyric acid (GABA).", "prevent destruction of acetylcholine.", "reduce serotonin metabolism.", "increase dopamine activity."], "ans": [1], "rat": "Increased acetylcholine plays a role in learning and memory. Preventing destruction of acetylcholine by acetylcholinesterase would result in higher levels of acetylcholine, with the potential for improved memory. GABA affects anxiety rather than memory. Increased dopamine would cause symptoms associated with schizophrenia or mania rather than improve memory. Decreasing dopamine at receptor sites is associated with Parkinsons disease rather than improving memory.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 3, "n": 8, "sata": false, "eth": false, "stem": "A patient has disorganized thinking associated with schizophrenia. Neuroimaging would likely show dysfunction in which part of the brain?", "opts": ["Hippocampus", "Frontal lobe", "Cerebellum", "Brainstem"], "ans": [1], "rat": "The frontal lobe is responsible for intellectual functioning. The hippocampus is involved in emotions and learning. The cerebellum regulates skeletal muscle coordination and equilibrium. The brainstem regulates internal organs.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 3, "n": 9, "sata": false, "eth": false, "stem": "The nurse should assess a patient taking a drug with anticholinergic properties for inhibited function of the:", "opts": ["parasympathetic nervous system.", "sympathetic nervous system.", "reticular activating system.", "medulla oblongata."], "ans": [0], "rat": "Acetylcholine is the neurotransmitter found in high concentration in the parasympathetic nervous system. When anticholinergic drugs inhibit acetylcholine action, blurred vision, dry mouth, constipation, and urinary retention commonly occur.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 3, "n": 10, "sata": false, "eth": false, "stem": "The therapeutic action of neurotransmitter inhibitors that block reuptake cause:", "opts": ["decreased concentration of the blocked neurotransmitter in the central nervous system.", "increased concentration of the blocked neurotransmitter in the synaptic gap.", "destruction of receptor sites specific to the blocked neurotransmitter.", "limbic system stimulation."], "ans": [1], "rat": "If the reuptake of a substance is inhibited, it accumulates in the synaptic gap, and its concentration increases, permitting ease of transmission of impulses across the synaptic gap. Normal transmission of impulses across synaptic gaps is consistent with normal rather than depressed mood. The other options are not associated with blocking neurotransmitter reuptake.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 3, "n": 11, "sata": false, "eth": false, "stem": "A patient taking medication for mental illness develops restlessness and an uncontrollable need to be in motion. Which drug action causes these symptoms to develop?", "opts": ["Anticholinergic effects", "Dopamine-blocking effects", "Endocrine-stimulating effects", "Ability to stimulate spinal nerves"], "ans": [1], "rat": "Medication that blocks dopamine often produces disturbances of movement, such as akathisia, because dopamine affects neurons involved in both thought processes and movement regulation. Anticholinergic effects include dry mouth, blurred vision, urinary retention, and constipation. Akathisia is not caused by endocrine stimulation or spinal nerve stimulation.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 3, "n": 12, "sata": false, "eth": false, "stem": "A patient has fear as well as increased heart rate and blood pressure. The nurse suspects increased activity of which neurotransmitter?", "opts": ["Gamma-aminobutyric acid (GABA)", "Norepinephrine", "Acetylcholine", "Histamine"], "ans": [1], "rat": "Norepinephrine is the neurotransmitter associated with sympathetic nervous system stimulation, preparing the individual for fight or flight. GABA is a mediator of anxiety level. A high concentration of histamine is associated with an inflammatory response. A high concentration of acetylcholine is associated with parasympathetic nervous system stimulation.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 3, "n": 13, "sata": false, "eth": false, "stem": "A patient has acute anxiety related to an automobile accident 2 hours ago. The nurse should teach the patient about medication from which group?", "opts": ["Tricyclic antidepressants", "Antipsychotic drugs", "Antimanic drugs", "Benzodiazepines"], "ans": [3], "rat": "Benzodiazepines provide anxiety relief. Tricyclic antidepressants are used to treat symptoms of depression. Antimanic drugs are used to treat bipolar disorder. Antipsychotic drugs are used to treat psychosis.", "top": "Nursing Process: Planning", "note": "Your textbook adds that antidepressants are first-line for long-term anxiety treatment. Benzodiazepines fit here because the anxiety is acute."}, {"ch": 3, "n": 14, "sata": false, "eth": false, "stem": "A patient is hospitalized for severe depression. Of the medications listed below, the nurse can expect to provide the patient with teaching about:", "opts": ["chlordiazepoxide (Librium).", "clozapine (Clozaril).", "sertraline (Zoloft).", "tacrine (Cognex)."], "ans": [2], "rat": "Sertraline (Zoloft) is an SSRI. This antidepressant blocks the reuptake of serotonin, with few anticholinergic and sedating side effects. Clozapine is an antipsychotic. Chlordiazepoxide is an anxiolytic. Tacrine tr eats Alzheimers disease.", "top": "Nursing Process: Planning", "note": "Tacrine (Cognex), a distractor, is no longer on the U.S. market and isn’t in your textbook."}, {"ch": 3, "n": 15, "sata": false, "eth": false, "stem": "A patient diagnosed with bipolar disorder has an unstable mood, aggressiveness, agitation, talkativeness, and irritability. The nurse expects the health care provider to prescribe a medication from which group?", "opts": ["Psychostimulants", "Mood stabilizers", "Anticholinergics", "Antidepressants"], "ans": [1], "rat": "The symptoms describe mania, which is effectively treated by mood stabilizers, such as lithium, and selected anticonvulsants(carbamazepine, valproic acid, and lamotrigine). Drugs from the other classifications listed are not effective in the treatment of mania.", "top": "Nursing Process: Planning", "note": "The rationale lists lamotrigine as a treatment for mania. Your textbook says lamotrigine is not effective for acute mania; it is used for maintenance and bipolar depression."}, {"ch": 3, "n": 16, "sata": false, "eth": false, "stem": "A drug causes muscarinic receptor blockade. The nurse will assess the patient for:", "opts": ["dry mouth.", "gynecomastia.", "pseudoparkinsonism.", "orthostatic hypotension."], "ans": [0], "rat": "Muscarinic receptor blockade includes atropine-like side effects, such as dry mouth, blurred vision, and constipation. Gynecomastia is associated with decreased prolactin levels. Movement defects are associated with dopamine blockade. Orthostatic hypotension is associated with a1 antagonism.", "top": "Nursing Process: Assessment", "note": "Error in the rationale: gynecomastia is caused by increased prolactin (hyperprolactinemia from dopamine blockade), not decreased prolactin. See First-Generation Antipsychotics, tuberoinfundibular pathway."}, {"ch": 3, "n": 17, "sata": false, "eth": false, "stem": "A patient begins therapy with a phenothiazine medication. What teaching should the nurse provide related to the drugs strong dopaminergic effect?", "opts": ["Chew sugarless gum.", "Increase dietary fiber.", "Arise slowly from bed.", "Report changes in muscle movement."], "ans": [3], "rat": "Phenothiazines block dopamine receptors in both the limbic system and basal ganglia. Movement disorders and motor abnormalities (extrapyramidal side effects), such as parkinsonism, akinesia, akathisia, dyskinesia, and tardive dyskinesia, are likely to occur early in the course of treatment. They are often heralded by sensations of muscle stiffness. Early intervention with antiparkinsonism medication can increase the patients comfort and prevent dystonic reactions. The distracters are related to anticholinergic effects.", "top": "Nursing Process: Implementation", "note": "The stem says “dopaminergic effect,” but phenothiazines are dopamine antagonists (antidopaminergic). The movement effects come from blocking D₂ in the nigrostriatal pathway."}, {"ch": 3, "n": 18, "sata": false, "eth": false, "stem": "A patient tells the nurse, My doctor prescribed Paxil (paroxetine) for my depression. I assume I'll have side effects like I had when I was taking Tofranil (imipramine). The nurses reply should be based on the knowledge that paroxetine is a(n):", "opts": ["selective norepinephrine reuptake inhibitor.", "tricyclic antidepressant.", "MAO inhibitor.", "SSRI."], "ans": [3], "rat": "Paroxetine is an SSRI and will not produce the same side effects as imipramine, a tricyclic antidepressant. The patient will probably not experience dry mouth, constipation, or orthostatic hypotension.", "top": "Nursing Process: Planning", "note": "Your textbook says paroxetine is the most anticholinergic SSRI (M₁ antagonism). It is still far less anticholinergic than imipramine, but the rationale’s claim that dry mouth and constipation won’t occur is too absolute."}, {"ch": 3, "n": 19, "sata": false, "eth": false, "stem": "A nurse can anticipate anticholinergic side effects are likely when a patient takes:", "opts": ["lithium (Lithobid).", "buspirone (BuSpar).", "imipramine (Tofranil).", "risperidone (Risperdal)."], "ans": [2], "rat": "Imipramine (Tofranil) is a tricyclic antidepressant with strong anticholinergic properties, resulting in dry mouth, blurred vision, constipation, and urinary retention. Lithium therapy is more often associated with fluid-balance problems, including polydipsia, polyuria, and edema. Risperidone therapy is more often associated with movement disorders, orthostatic hypotension, and sedation. Buspirone is associated with anxiety reduction without major side effects.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 3, "n": 20, "sata": false, "eth": false, "stem": "Which instruction has priority when teaching a patient about clozapine (Clozaril)?", "opts": ["Avoid unprotected sex.", "Report sore throat and fever immediately.", "Reduce foods high in polyunsaturated fats.", "Use over-the-counter preparations for rashes."], "ans": [1], "rat": "Clozapine therapy may produce agranulocytosis; therefore, signs of infection should be immediately reported to the health care provider. In addition, the patient should have white blood cell levels measured weekly. The other options are not relevant to clozapine.", "top": "Nursing Process: Planning", "note": "The rationale says to check WBC weekly. Your textbook uses ANC (absolute neutrophil count): weekly for 6 months, every 2 weeks for 6 months, then every 4 weeks."}, {"ch": 3, "n": 21, "sata": false, "eth": false, "stem": "A nurse cares for a group of patients receiving various medications, including haloperidol (Haldol), carbamazepine (Tegretol), trazodone (Desyrel), and phenelzine (Nardil). The nurse will order a special diet for the patient who takes:", "opts": ["carbamazepine.", "haloperidol.", "phenelzine.", "trazodone."], "ans": [2], "rat": "Patients taking phenelzine, an MAO inhibitor, must be on a low tyramine diet to prevent hypertensive crisis. There are no specific dietary precautions associated with the distracters.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 3, "n": 22, "sata": false, "eth": false, "stem": "A nurse instructs a patient taking a drug that inhibits monoamine oxidase (MAO) to avoid certain foods and drugs because of the risk of:", "opts": ["cardiac dysrhythmia.", "hypotensive shock.", "hypertensive crisis.", "hypoglycemia."], "ans": [2], "rat": "Patients taking MAO-inhibiting drugs must be on a low tyramine diet to prevent hypertensive crisis. In the presence of MAO inhibitors, tyramine is not destroyed by the liver and in high levels produces intense vasoconstriction, resulting in elevated blood pressure.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 3, "n": 23, "sata": false, "eth": false, "stem": "A nurse caring for a patient taking a selective serotonin reuptake inhibitor (SSRI) will develop outcome criteria related to:", "opts": ["coherent thought processes.", "improvement in depression.", "reduced levels of motor activity.", "decreased extrapyramidal symptoms."], "ans": [1], "rat": "SSRIs affect mood, relieving depression in many cases. SSRIs do not act to reduce thought disorders. SSRIs reduce depression but have little effect on motor hyperactivity. SSRIs do not produce extrapyramidal symptoms.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 3, "n": 24, "sata": false, "eth": false, "stem": "By which mechanism do selective serotonin reuptake inhibitors (SSRI) improve depression?", "opts": ["Destroying increased amounts of serotonin", "Making more serotonin available at the synaptic gap", "Increasing production of acetylcholine and dopamine", "Blocking muscarinic and a1 norepinephrine receptors"], "ans": [1], "rat": "Depression is thought to be related to lowered availability of the neurotransmitter serotonin. SSRIs act by blocking reuptake of serotonin, leaving a higher concentration available at the synaptic cleft. SSRIs prevent destruction of serotonin. SSRIs have little or no effect on acetylcholine and dopamine production. SSRIs do not produce muscarinic or a1 norepinephrine blockade.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 3, "n": 25, "sata": false, "eth": false, "stem": "The laboratory report for a patient taking clozapine (Clozaril) shows a white blood cell count of 3000 mm3. Select the nurses best action.", "opts": ["Report the results to the health care provider immediately.", "Administer the next dose as prescribed.", "Give aspirin and force fluids.", "Repeat the laboratory test."], "ans": [0], "rat": "These laboratory values indicate the possibility of agranulocytosis, a serious side effect of clozapine therapy. These results must be immediately reported to the health care provider, and the drug should be withheld. The health care provider may repeat the test, but in the meantime, the drug should be withheld. Caution: This question requires students to apply previous learning regarding normal and abnormal values of white blood cel counts.", "top": "Nursing Process: Implementation", "note": "Your textbook monitors ANC (absolute neutrophil count), not total WBC, and ANC values are reported to the clozapine program. The priority action (report immediately, hold the dose) is unchanged."}, {"ch": 3, "n": 26, "sata": false, "eth": false, "stem": "A drug blocks the attachment of norepinephrine to a1 receptors. The patient may experience:", "opts": ["hypertensive crisis.", "orthostatic hypotension.", "severe appetite disturbance.", "an increase in psychotic symptoms."], "ans": [1], "rat": "Sympathetic-mediated vasoconstriction is essential for maintaining normal blood pressure in the upright position. Blockage of a1 receptors leads to vasodilation and orthostatic hypotension. Orthostatic hypotension may cause fainting and falls. Teach patients ways of minimizing this phenomenon.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 3, "n": 27, "sata": false, "eth": false, "stem": "A nurse cares for four patients who are receiving clozapine, lithium, fluoxetine, and venlafaxine, respectively. With which patient should the nurse be most alert for problems associated with fluid and electrolyte imbalance? The patient receiving:", "opts": ["lithium (Lithobid).", "clozapine (Clozaril).", "fluoxetine (Prozac).", "venlafaxine (Effexor)."], "ans": [0], "rat": "Lithium is a salt and known to alter fluid and electrolyte balance, producing polyuria, edema, and other symptoms of imbalance. Patients receiving clozapine should be monitored for agranulocytosis. Patients receiving fluoxetine should be monitored for acetylcholine block. Patients receiving venlafaxine should be monitored for heightened feelings of anxiety.", "top": "Nursing Process: Assessment", "note": "The rationale says fluoxetine patients are monitored for “acetylcholine block.” That isn’t in your textbook; ignore that part."}, {"ch": 3, "n": 28, "sata": false, "eth": false, "stem": "An obese patient has a diagnosis of schizophrenia. Medications that block which receptors would contribute to further weight gain?", "opts": ["H1", "5 HT2", "Acetylcholine", "Gamma-aminobutyric acid (GABA)"], "ans": [0], "rat": "H1 receptor blockade results in weight gain, which is undesirable for an obese patient. Blocking of the other receptors would have little or no effect on the patients weight.", "top": "Nursing Process: Planning", "note": "Your textbook says weight gain comes from blocking both 5-HT₂C and H₁ receptors, so the rationale’s claim that other receptors have no effect is too strong. H₁ is still the best answer."}, {"ch": 3, "n": 29, "sata": false, "eth": false, "stem": "An individual hiking in the forest encounters a large poisonous snake on the path. Which change in this individuals vital signs is most likely?", "opts": ["Pulse rate changes from 90 to 72.", "Respiratory rate changes from 22 to 18.", "Complaints of intestinal cramping begin.", "Blood pressure changes from 114/62 to 136/78."], "ans": [3], "rat": "This frightening experience would stimulate the sympathetic nervous system, causing a release of norepinephrine, an excitatory neurotransmitter. It prepares the body for fight or flight. Increased blood pressure, pupil size, respiratory rate, and pulse rate signify release of norepinephrine. Intestinal cramping would be associated with stimulation of the parasympathetic nervous system.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 3, "n": 30, "sata": false, "eth": false, "stem": "Consider these medications: carbamazepine (Tegretol), lamotrigine (Lamictal), gabapentin (Neurontin). Which medication below also belongs with this group?", "opts": ["Galantamine (Reminyl)", "Valproate (Depakote)", "Buspirone (BuSpar)", "Tacrine (Cognex)"], "ans": [1], "rat": "The medications listed in the stem are mood stabilizers, anticonvulsant types. Valproate (Depakote) is also a member of this group. The distracters are drugs for treatment of Alzheimers disease and anxiety.", "top": "Nursing Process: Assessment", "note": "Your textbook names only valproate, carbamazepine, and lamotrigine as FDA-approved anticonvulsant mood stabilizers. Gabapentin in the stem isn’t one. Galantamine is a cholinesterase inhibitor; tacrine is off the market."}, {"ch": 3, "n": 31, "sata": false, "eth": false, "stem": "A professional football player is seen in the emergency department after losing consciousness from an illegal block. Prior to discharge, the nurse assists the patient to schedule an outpatient computed tomography (CT) scan for the next day. Which strategy should the nurse use to ensure the patient remembers the appointment?", "opts": ["Write the appointment day, time, and location on a piece of paper and give it to the player.", "Log the appointment day, time, and location into the players cell phone calendar feature.", "Ask the health care provider to admit the patient to the hospital overnight.", "Verbally inform the patient of the appointment day, time, and location."], "ans": [1], "rat": "This player may have suffered repeated head injuries with damage to the hippocampus. The hippocampus has significant role in maintaining memory. Logging the appointment into the players cell phone calendar will remind him of the appointment the next day. Paper will be lost, and the patient is unlikely to remember verbal instruction. Hospitalization is unnecessary. Caution: This question requires students to apply previous learning regarding central nervous system anatomy and physiology.", "top": "Nursing Process: Implementation", "note": "Concussion and head injury aren’t covered in your chapter; the answer relies on applying the hippocampus-memory link."}, {"ch": 3, "n": 1, "sata": true, "eth": false, "stem": "A nurse prepares to administer a second-generation antipsychotic medication to a patient diagnosed with schizophrenia. Additional monitoring for adverse effects will be most important if the patient has which co-morbid health problems? Select all that apply.", "opts": ["Parkinsons disease", "Graves disease", "Hyperlipidemia", "Osteoarthritis", "Diabetes"], "ans": [0, 2, 4], "rat": "Antipsychotic medications may produce weight gain, which would complicate care of a patient with diabetes, and increase serum triglycerides, which would complicate care of a patient with hyperlipidemia. Parkinsons disease involves changes in transmission of dopamine and acetylcholine, so these drugs would also complicate care of this patient. Osteoarthritis and Graves disease should have no synergistic effect with this medication.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 3, "n": 2, "sata": true, "eth": false, "stem": "Questions the nurse could ask that would be nonjudgmental when obtaining information about patient use of herbal remedies include: (select all that apply)", "opts": ["You don't regularly take herbal remedies, do you?", "What herbal medicines have you used to relieve your symptoms?", "What over-the-counter medicines and nutritional supplements do you use?", "What differences in your symptoms do you notice when you take herbal supplements?", "Have you experienced problems from using herbal and prescription drugs at the same time?"], "ans": [1, 2, 3, 4], "rat": "The correct responses are neutral in tone and do not express bias for or against the use of herbal medicines. The distracter, worded in a negative way, makes the nurses bias evident.", "top": "Nursing Process: Assessment", "note": "Your textbook covers why patients use herbals but not how to word the questions; the answer comes from therapeutic communication principles."}, {"ch": 3, "n": 3, "sata": true, "eth": false, "stem": "An individual is experiencing problems with memory. Which of these structures are most likely to be involved in this deficit? Select all that apply.", "opts": ["Amygdala", "Hippocampus", "Occipital lobe", "Temporal lobe", "Basal ganglia"], "ans": [0, 1, 3], "rat": "The frontal, parietal, and temporal lobes of the cerebrum play a key role in the storage and processing of memories. The amygdala and hippocampus also play roles in memory. The occipital lobe is predominantly involved with vision. The basal ganglia influence integration of physical movement, as well as some thoughts and emotions.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 3, "n": 4, "sata": true, "eth": false, "stem": "A patients sibling says, My brother has a mental illness, but the doctor ordered a functional magnetic resonance image (fMRI) test. That test is too expensive and will just increase the hospital bill. Select the nurses best responses. Select all that apply.", "opts": ["Sometimes there are physical causes for psychiatric symptoms. This test will help us understand whether that is the situation.", "Some mental illnesses are evident on fMRIs. This test will give information to help us plan the best care for your brother.", "Tell me more about what kinds of tests your brothers health insurance plan covers.", "It sounds like you do not truly believe your brother had a mental illness.", "It would be better for you to discuss your concerns with the doctor."], "ans": [0, 1], "rat": "The correct responses provide information to the sibling. Modern imaging techniques are important tools in assessing molecular changes in mental disease and marking the receptor sites of drug action, which can help in treatment planning. Psychiatric symptoms can be caused by anatomical or physiologic abnormalities. There is no evidence of denial in the siblings comment. The nurse can answer this question rather than referring it to the physician. It would be inappropriate to discuss finances with the patients sibling.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 1, "sata": false, "eth": true, "stem": "A psychiatric nurse best applies the ethical principle of autonomy by:", "opts": ["exploring alternative solutions with a patient, who then makes a choice.", "suggesting that two patients who were fighting be restricted to the unit.", "intervening when a self-mutilating patient attempts to harm self.", "staying with a patient demonstrating a high level of anxiety."], "ans": [0], "rat": "Autonomy is the right to self-determination, that is, to make ones own decisions. By exploring alternatives with the patient, the patient is better equipped to make an informed, autonomous decision. The distracters demonstrate beneficence, fidelity, and justice.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 6, "n": 2, "sata": false, "eth": false, "stem": "A nurse finds a psychiatric advance directive in the medical record of a patient experiencing psychosis. The directive was executed during a period when the patient was stable and competent. The nurse should:", "opts": ["review the directive with the patient to ensure it is current.", "ensure that the directive is respected in treatment planning.", "consider the directive only if there is a cardiac or respiratory arrest.", "encourage the patient to revise the directive in light of the current health problem."], "ans": [1], "rat": "The nurse has an obligation to honor the right to self-determination. An advanced psychiatric directive supports that goal. Since the patient is currently psychotic, the terms of the directive now apply.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 3, "sata": false, "eth": false, "stem": "Two hospitalized patients fight whenever they are together. During a team meeting, a nurse asserts that safety is of paramount importance, so treatment plans should call for both patients to be secluded to keep them from injuring each other. This assertion:", "opts": ["reinforces the autonomy of the two patients.", "violates the civil rights of both patients.", "represents the intentional tort of battery.", "correctly places emphasis on safety."], "ans": [1], "rat": "Patients have a right to treatment in the least restrictive setting. Safety is important, but less restrictive measures should be tried first. Unnecessary seclusion may result in a charge of false imprisonment. Seclusion violates the patients autonomy. The principle by which the nurse is motivated is beneficence, not justice. The tort represented is false imprisonment.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 6, "n": 4, "sata": false, "eth": true, "stem": "In a team meeting a nurse says, I'm concerned about whether we are behaving ethically by using restraint to prevent one patient from self-mutilation, while the care plan for another self-mutilating patient requires one-on-one supervision. Which ethical principle most clearly applies to this situation?", "opts": ["Beneficence", "Autonomy", "Fidelity", "Justice"], "ans": [3], "rat": "The nurse is concerned about justice, that is, fair distribution of care, which includes treatment with the least restrictive methods for both patients. Beneficence means promoting the good of others. Autonomy is the right to make ones own decisions. Fidelity is the observance of loyalty and commitment to the patient.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 6, "n": 5, "sata": false, "eth": false, "stem": "Select the example of a tort.", "opts": ["The plan of care for a patient is not completed within 24 hours of the patients admission.", "A nurse gives a PRN dose of an antipsychotic drug to an agitated patient because the unit is short-staffed.", "An advanced practice nurse recommends hospitalization for a patient who is dangerous to self and others.", "A patients admission status changed from involuntary to voluntary after the patients hallucinations subside."], "ans": [1], "rat": "A tort is a civil wrong against a person that violates his or her rights. Giving unnecessary medication for the convenience of staff controls behavior in a manner similar to secluding a patient; thus, false imprisonment is a possible charge. The other options do not exemplify torts.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 6, "n": 6, "sata": false, "eth": false, "stem": "What is the legal significance of a nurses action when a patient verbally refuses medication and the nurse gives the medication over the patients objection? The nurse:", "opts": ["has been negligent.", "committed malpractice.", "fulfilled the standard of care.", "can be charged with battery."], "ans": [3], "rat": "Battery is an intentional tort in which one individual violates the rights of another through touching without consent. Forcing a patient to take medication after the medication was refused constitutes battery. The charge of battery can be brought against the nurse. The medication may not necessarily harm the patient; harm is a component of malpractice.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 6, "n": 7, "sata": false, "eth": false, "stem": "Which nursing intervention demonstrates false imprisonment?", "opts": ["A confused and combative patient says, I'm getting out of here, and no one can stop me. The nurse restrains this patient without a health care providers order and then promptly obtains an order.", "A patient has been irritating and attention-seeking much of the day. A nurse escorts the patient down the hall saying, Stay in your room, or you'll be put in seclusion.", "An involuntarily hospitalized patient with suicidal ideation runs out of the psychiatric unit. The nurse rushes after the patient and convinces the patient to return to the unit.", "An involuntarily hospitalized patient with homicidal ideation attempts to leave the facility. A nurse calls the security team and uses established protocols to prevent the patient from leaving."], "ans": [1], "rat": "False imprisonment involves holding a competent person against his or her will. Actual force is not a requirement of false imprisonment. The individual needs only to be placed in fear of imprisonment by someone who has the ability to carry out the threat. If a patient is not competent (confused), then the nurse should act with beneficence. Patients admitted involuntarily should not be allowed to leave without permission of the treatment team.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 6, "n": 8, "sata": false, "eth": false, "stem": "Which patient meets criteria for involuntary hospitalization for psychiatric treatment? The patient who:", "opts": ["is noncompliant with the treatment regimen.", "fraudulently files for bankruptcy.", "sold and distributed illegal drugs.", "threatens to harm self and others."], "ans": [3], "rat": "Involuntary hospitalization protects patients who are dangerous to themselves or others and cannot care for their own basic needs. Involuntary commitment also protects other individuals in society. The behaviors described in the other options are not sufficient to require involuntary hospitalization.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 6, "n": 9, "sata": false, "eth": false, "stem": "A nurse prepares to administer a scheduled injection of haloperidol decanoate (Haldol depot) to an outpatient with schizophrenia. As the nurse swabs the site, the patient shouts, Stop! I don't want to take that medicine anymore. I hate the side effects. Select the nurses best action.", "opts": ["Assemble other staff for a show of force and proceed with the injection, using restraint if necessary.", "Stop the medication administration procedure and say to the patient, Tell me more about the side effects you've been having.", "Proceed with the injection but explain to the patient that there are medications that will help reduce the unpleasant side effects.", "Say to the patient, Since I've already drawn the medication in the syringe, I'm required to give it, but let's talk to the doctor about delaying next months dose."], "ans": [1], "rat": "Patients with mental illness retain their civil rights unless there is clear, cogent, and convincing evidence of dangerousness. The patient in this situation presents no evidence of dangerousness. The nurse, as an advocate and educator, should seek more information about the patients decision and not force the medication.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 10, "sata": false, "eth": false, "stem": "A nurse is concerned that an agencys policies are inadequate. Which understanding about the relationship between substandard institutional policies and individual nursing practice should guide nursing practice?", "opts": ["Agency policies do not exempt an individual nurse of responsibility to practice according to professional standards of nursing care.", "Agency policies are the legal standard by which a professional nurse must act and therefore override other standards of care.", "Faced with substandard policies, a nurse has a responsibility to inform the supervisor and discontinue patient care immediately.", "Interpretation of policies by the judicial system is rendered on an individual basis and therefore cannot be predicted."], "ans": [0], "rat": "Nurses are professionally bound to uphold standards of practice regardless of lesser standards established by a health care agency or a state. Conversely, if the agency standards are higher than standards of practice, the agency standards must be upheld. The courts may seek to establish the standard of care through the use of expert witnesses when the issue is clouded.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 6, "n": 11, "sata": false, "eth": false, "stem": "A newly admitted acutely psychotic patient is a private patient of the medical director and a private-pay patient. To whom does the psychiatric nurse assigned to the patient owe the duty of care?", "opts": ["Medical director", "Hospital", "Profession", "Patient"], "ans": [3], "rat": "Although the nurse is accountable to the health care provider, the agency, the patient, and the profession, the duty of care is owed to the patient.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 12, "sata": false, "eth": false, "stem": "Which action by a nurse constitutes a breach of a patients right to privacy?", "opts": ["Documenting the patients daily behavior during hospitalization", "Releasing information to the patients employer without consent", "Discussing the patients history with other staff during care planning", "Asking family to share information about a patients pre-hospitalization behavior"], "ans": [1], "rat": "Release of information without patient authorization violates the patients right to privacy. The other options are acceptable nursing practices.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 6, "n": 13, "sata": false, "eth": false, "stem": "An adolescent hospitalized after a violent physical outburst tells the nurse, I'm going to kill my father, but you can't tell anyone. Select the nurses best response.", "opts": ["You are right. Federal law requires me to keep clinical information private.", "I am obligated to share that information with the treatment team.", "Those kinds of thoughts will make your hospitalization longer.", "You should share this thought with your psychiatrist."], "ans": [1], "rat": "Breach of nurse-patient confidentiality does not pose a legal dilemma for nurses in these circumstances because a team approach to delivery of psychiatric care presumes communication of patient information to other staff members to develop treatment plans and outcome criteria. The patient should also know that the team has a duty to warn the father of the risk for harm.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 14, "sata": false, "eth": false, "stem": "A voluntarily hospitalized patient tells the nurse, Get me the forms for discharge. I want to leave now. Select the nurses best response.", "opts": ["I will get the forms for you right now and bring them to your room.", "Since you signed your consent for treatment, you may leave if you desire.", "I will get them for you, but let's talk about your decision to leave treatment.", "I cannot give you those forms without your health care providers permission."], "ans": [2], "rat": "A voluntarily admitted patient has the right to demand and obtain release in most states. However, as a patient advocate, the nurse is responsible for weighing factors related to the patients wishes and best interests. By asking for information, the nurse may be able to help the patient reconsider the decision. Facilitating discharge without consent is not in the patients best interests before exploring the reason for the request.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 15, "sata": false, "eth": false, "stem": "Insurance will not pay for continued private hospitalization of a mentally ill patient. The family considers transferring the patient to a public hospital but expresses concern that the patient will not get any treatment if transferred. Select the nurses most helpful reply.", "opts": ["By law, treatment must be provided. Hospitalization without treatment violates patients rights.", "All patients in public hospitals have the right to choose both a primary therapist and a primary nurse.", "You have a justifiable concern because the right to treatment extends only to provision of food, shelter, and safety.", "Much will depend on other patients, because the right to treatment for a psychotic patient takes precedence over the right to treatment of a patient who is stable."], "ans": [0], "rat": "The right to medical and psychiatric treatment was conferred on all patients hospitalized in public mental hospitals with the enactment of the federal Hospitalization of Mentally I'll Act in 1964.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 16, "sata": false, "eth": false, "stem": "Which individual with mental illness may need emergency or involuntary admission? The individual who:", "opts": ["resumes using heroin while still taking naltrexone (ReVia).", "reports hearing angels playing harps during thunderstorms.", "does not keep an outpatient appointment with the mental health nurse.", "throws a heavy plate at a waiter at the direction of command hallucinations."], "ans": [3], "rat": "Throwing a heavy plate is likely to harm the waiter and is evidence of dangerousness to others. This behavior meets the criteria for emergency or involuntary hospitalization for mental illness. The behaviors in the other options evidence mental illness but not dangerousness.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 17, "sata": false, "eth": false, "stem": "A patient in alcohol rehabilitation reveals to the nurse, I feel terrible guilt for sexually abusing my 6-year-old before I was admitted. Select the nurses most important action.", "opts": ["Anonymously report the abuse by phone to the local child protection agency.", "Reply, I'm glad you feel comfortable talking to me about it.", "File a written report with the agencys ethics committee.", "Respect nurse-patient relationship confidentiality."], "ans": [0], "rat": "Laws regarding child abuse reporting discovered by a professional during the suspected abusers alcohol or drug treatment differ by state. Federal law supersedes state law and prohibits disclosure without a court order except in instances in which the report can be made anonymously or without identifying the abuser as a patient in an alcohol or drug treatment facility.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 18, "sata": false, "eth": false, "stem": "A family member of a patient with delusions of persecution asks the nurse, Are there any circumstances under which the treatment team is justified in violating a patients right to confidentiality? The nurse should reply that confidentiality may be breached:", "opts": ["under no circumstances.", "at the discretion of the psychiatrist.", "when questions are asked by law enforcement.", "if the patient threatens the life of another person."], "ans": [3], "rat": "The duty to warn a person whose life has been threatened by a psychiatric patient overrides the patients right to confidentiality. The right to confidentiality is not suspended at the discretion of the therapist or for legal investigations.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 19, "sata": false, "eth": false, "stem": "A new antidepressant is prescribed for an elderly patient with major depression, but the dose is more than the usual geriatric dose. The nurse should:", "opts": ["consult a reliable drug reference.", "teach the patient about possible side effects and adverse effects.", "withhold the medication and confer with the health care provider.", "encourage the patient to increase oral fluids to reduce drug concentration."], "ans": [2], "rat": "The dose of antidepressants for elderly patients is often less than the usual adult dose. The nurse should withhold the medication and consult the health care provider who wrote the order. The nurses duty is to practice according to professional standards as well as intervene and protect the patient.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 20, "sata": false, "eth": false, "stem": "A patient diagnosed with schizophrenia believes a local minister stirred evil spirits. The patient threatens to bomb a local church. The psychiatrist notifies the minister. Select the answer with the correct rationale. The psychiatrist:", "opts": ["released information without proper authorization.", "demonstrated the duty to warn and protect.", "violated the patients confidentiality.", "avoided charges of malpractice."], "ans": [1], "rat": "It is the health care professionals duty to warn or notify an intended victim after a threat of harm has been made. Informing a potential victim of a threat is a legal responsibility of the health care professional. It is not a violation of confidentiality.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 21, "sata": false, "eth": false, "stem": "A patient with psychosis became aggressive, struck another patient, and required seclusion. Select the best documentation.", "opts": ["Patient struck another patient who attempted to leave day room to go to bathroom. Seclusion necessary at 1415. Plan: Maintain seclusion for 8 hours and keep these two patients away from each other for 24 hours.", "Seclusion ordered by physician at 1415 after command hallucinations told the patient to hit another patient. Careful monitoring of patient maintained during period of seclusion.", "Seclusion ordered by MD for aggressive behavior. Begun at 1415. Maintained for 2 hours without incident. Outcome: Patient calmer and apologized for outburst.", "Patient pacing, shouting. Haloperidol 5 mg given PO at 1300. No effect by 1315. At 1415 patient yelled, I'll punch anyone who gets near me, and struck another patient with fist. Physically placed in seclusion at 1420. Seclusion order obtained from MD at 1430."], "ans": [3], "rat": "Documentation must be specific and detail the key aspects of care. It should demonstrate implementation of the least restrictive alternative. Justification for why a patient was secluded should be recorded, along with interventions attempted in an effort to avoid seclusion. Documentation should include a description of behavior and verbalizations, interventions tried and their outcomes, and the name of the health care provider ordering the use of seclusion.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 22, "sata": false, "eth": false, "stem": "A person in the community asks, Why aren't people with mental illness kept in state institutions anymore? Select the nurses best response.", "opts": ["Less restrictive settings are available now to care for individuals with mental illness.", "There are fewer persons with mental illness, so less hospital beds are needed.", "Most people with mental illness are still in psychiatric institutions.", "Psychiatric institutions violated patients rights."], "ans": [0], "rat": "The community is a less restrictive alternative than hospitals for treatment of persons with mental illness. The distracters are incorrect and part of the stigma of mental illness.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 23, "sata": false, "eth": true, "stem": "A patient experiencing psychosis asks a psychiatric technician, What's the matter with me? The technician replies, Nothing is wrong with you. You just need to use some self-control. The nurse who overheard the exchange should take action based on:", "opts": ["the technicians unauthorized disclosure of confidential clinical information.", "violation of the patients right to be treated with dignity and respect.", "the nurses obligation to report caregiver negligence.", "the patients right to social interaction."], "ans": [1], "rat": "Patients have the right to be treated with dignity and respect. The technicians comment disregards the seriousness of the patients illness. The Code of Ethics for Nurses requires intervention. Patient emotional abuse has been demonstrated, not negligence. An interaction with the technician is not an aspect of social interaction. The technician did not disclose clinical information.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 6, "n": 24, "sata": false, "eth": false, "stem": "Which documentation of a patients behavior best demonstrates a nurses observations?", "opts": ["Isolates self from others. Frequently fell asleep during group. Vital signs stable.", "Calmer; more cooperative. Participated actively in group. No evidence of psychotic thinking.", "Appeared to hallucinate. Frequently increased volume on television, causing conflict with others.", "Wore four layers of clothing. States, I need protection from evil bacteria trying to pierce my skin."], "ans": [3], "rat": "The documentation states specific observations of the patients appearance and the exact statements made. The other options are vague or subjective statements and can be interpreted in different ways.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 25, "sata": false, "eth": false, "stem": "After leaving work, a nurse realizes documentation of administration of a PRN medication was omitted. This off-duty nurse phones the nurse on duty and says, Please document administration of the medication for me. My password is alpha1. The nurse receiving the call should:", "opts": ["fulfill the request promptly.", "document the callers password.", "refer the matter to the charge nurse to resolve.", "report the request to the patients health care provider."], "ans": [2], "rat": "Fraudulent documentation may be grounds for discipline by the state board of nursing. Referring the matter to the charge nurse will allow observance of hospital policy while ensuring that documentation occurs. Notifying the health care provider would be unnecessary when the charge nurse can resolve the problem. Nurses should not provide passwords to others.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 26, "sata": false, "eth": false, "stem": "Which individual diagnosed with a mental illness may need involuntary hospitalization? An individual:", "opts": ["who has a panic attack after her child gets lost in a shopping mall", "with visions of demons emerging from cemetery plots throughout the community", "who takes 38 acetaminophen tablets after the persons stock portfolio becomes worthless", "diagnosed with major depression who stops taking prescribed antidepressant medication"], "ans": [2], "rat": "Involuntary hospitalization protects patients who are dangerous to themselves or others and cannot care for their own basic needs. Involuntary hospitalization also protects other individuals in society. An overdose of acetaminophen indicates dangerousness to self. The behaviors described in the other options are not sufficient to require involuntary hospitalization.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 6, "n": 27, "sata": false, "eth": true, "stem": "An aide in a psychiatric hospital says to the nurse, We don't have time every day to help each patient complete a menu selection. Let's tell dietary to prepare popular choices and send them to our unit. Select the nurses best response.", "opts": ["Thanks for the suggestion, but that idea may not work because so many patients take MAOI (monoamine oxidase inhibitor) antidepressants.", "Thanks for the idea, but its important to treat patients as individuals. Giving choices is one way we can respect patients individuality.", "Thank you for the suggestion, but the patients bill of rights requires us to allow patients to select their own diet.", "Thank you. That is a very good idea. It will make meal preparation easier for the dietary department."], "ans": [1], "rat": "The nurses response to the aide should recognize patients rights to be treated with dignity and respect as well as promote autonomy. This response also shows respect for the aide and fulfills the nurses obligation to provide supervision of unlicensed personnel. The incorrect responses have flawed rationale or do not respect patients as individuals.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 6, "n": 28, "sata": false, "eth": false, "stem": "In order to release information to another health care facility or third party regarding a patient diagnosed with a mental illness, the nurse must obtain:", "opts": ["a signed consent by the patient for release of information stating specific information to be released.", "a
