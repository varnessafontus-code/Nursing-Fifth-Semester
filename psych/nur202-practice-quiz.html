 verbal consent for information release from the patient and the patients guardian or next of kin.", "permission from members of the health care team who participate in treatment planning.", "approval from the attending psychiatrist to authorize the release of information."], "ans": [0], "rat": "Nurses have an obligation to protect patients privacy and confidentiality. Clinical information should not be released without the patients signed consent for the release.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 6, "n": 1, "sata": true, "eth": false, "stem": "In which situations would a nurse have the duty to intervene and report? Select all that apply.", "opts": ["A peer has difficulty writing measurable outcomes.", "A health care provider gives a telephone order for medication.", "A peer tries to provide patient care in an alcohol-impaired state.", "A team member violates relationship boundaries with a patient.", "A patient refuses medication prescribed by a licensed health care provider."], "ans": [2, 3], "rat": "Both keyed answers are events that jeopardize patient safety. The distracters describe situations that may be resolved with education or that are acceptable practices.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 6, "n": 2, "sata": true, "eth": false, "stem": "Which actions violate the civil rights of a psychiatric patient? The nurse:(select all that apply)", "opts": ["performs mouth checks after overhearing a patient say, I've been spitting out my medication.", "begins suicide precautions before a patient is assessed by the health care provider.", "opens and reads a letter a patient left at the nurses station to be mailed.", "places a patients expensive watch in the hospital business office safe.", "restrains a patient who uses profanity when speaking to the nurse."], "ans": [2, 4], "rat": "The patient has the right to send and receive mail without interference. Restraint is not indicated because a patient uses profanity; there are other less restrictive ways to deal with this behavior. The other options are examples of good nursing judgment and do not violate the patients civil rights.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 1, "sata": false, "eth": false, "stem": "A nurse assesses a confused older adult. The nurse experiences sadness and reflects, The patient is like one of my grandparentsso helpless. Which response is the nurse demonstrating?", "opts": ["Transference", "Countertransference", "Catastrophic reaction", "Defensive coping reaction"], "ans": [1], "rat": "Countertransference is the nurses transference or response to a patient that is based on the nurses unconscious needs, conflicts, problems, or view of the world.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 8, "n": 2, "sata": false, "eth": false, "stem": "Which statement shows a nurse has empathy for a patient who made a suicide attempt?", "opts": ["You must have been very upset when you tried to hurt yourself.", "It makes me sad to see you going through such a difficult experience.", "If you tell me what is troubling you, I can help you solve your problems.", "Suicide is a drastic solution to a problem that may not be such a serious matter."], "ans": [0], "rat": "Empathy permits the nurse to see an event from the patients perspective, understand the patients feelings, and communicate this to the patient. The incorrect responses are nurse- centered (focusing on the nurses feelings rather than the patients), belittling, and sympathetic.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 3, "sata": false, "eth": false, "stem": "After several therapeutic encounters with a patient who recently attempted suicide, which occurrence should cause the nurse to consider the possibility of countertransference?", "opts": ["The patients reactions toward the nurse seem realistic and appropriate.", "The patient states, Talking to you feels like talking to my parents.", "The nurse feels unusually happy when the patients mood begins to lift.", "The nurse develops a trusting relationship with the patient."], "ans": [2], "rat": "Strong positive or negative reactions toward a patient or over-identification with the patient indicate possible countertransference. Nurses must carefully monitor their own feelings and reactions to detect countertransference and then seek supervision. Realistic and appropriate reactions from a patient toward a nurse are desirable. One incorrect response suggests transference. A trusting relationship with the patient is desirable.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 4, "sata": false, "eth": false, "stem": "A patient says, Please don't share information about me with the other people. How should the nurse respond?", "opts": ["I will not share information with your family or friends without your permission, but I share information about you with other staff.", "A therapeutic relationship is just between the nurse and the patient. It is up to you to tell others what you want them to know.", "It depends on what you choose to tell me. I will be glad to disclose at the end of each session what I will report to others.", "I cannot tell anyone about you. It will be as though I am talking about my own problems, and we can help each other by keeping it between us."], "ans": [0], "rat": "A patient has the right to know with whom the nurse will share information and that confidentiality will be protected. Although the relationship is primarily between the nurse and patient, other staff needs to know pertinent data. The other incorrect responses promote incomplete disclosure on the part of the patient, require daily renegotiation of an issue that should be resolved as the nurse-patient contract is established, and suggest mutual problem solving. The relationship must be patient centered.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 5, "sata": false, "eth": false, "stem": "A nurse is talking with a patient, and 5 minutes remain in the session. The patient has been silent most of the session. Another patient comes to the door of the room, interrupts, and says to the nurse, I really need to talk to you. The nurse should:", "opts": ["invite the interrupting patient to join in the session with the current patient.", "say to the interrupting patient, I am not available to talk with you at the present time.", "end the unproductive session with the current patient and spend time with the interrupting patient.", "tell the interrupting patient, This session is 5 more minutes; then I will talk with you."], "ans": [3], "rat": "When a specific duration for sessions has been set, the nurse must adhere to the schedule. Leaving the first patient would be equivalent to abandonment and would destroy any trust the patient had in the nurse. Adhering to the contract demonstrates that the nurse can be trusted and that the patient and the sessions are important. The incorrect responses preserve the nurse-patient relationship with the silent patient but may seem abrupt to the interrupting patient, abandon the silent patient, or fail to observe the contract with the silent patient.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 6, "sata": false, "eth": false, "stem": "Termination of a therapeutic nurse-patient relationship has been successful when the nurse:", "opts": ["avoids upsetting the patient by shifting focus to other patients before the discharge.", "gives the patient a personal telephone number and permission to call after discharge.", "discusses with the patient changes that happened during the relationship and evaluates outcomes.", "offers to meet the patient for coffee and conversation three times a week after discharge."], "ans": [2], "rat": "Summarizing and evaluating progress help validate the experience for the patient and the nurse and facilitate closure. Termination must be discussed; avoiding discussion by spending little time with the patient promotes feelings of abandonment. Successful termination requires that the relationship be brought to closure without the possibility of dependency-producing ongoing contact.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 7, "sata": false, "eth": false, "stem": "What is the desirable outcome for the orientation stage of a nurse-patient relationship? The patient will demonstrate behaviors that indicate:", "opts": ["self-responsibility and autonomy.", "a greater sense of independence.", "rapport and trust with the nurse.", "resolved transference."], "ans": [2], "rat": "Development of rapport and trust is necessary before the relationship can progress to the working phase. Behaviors indicating a greater sense of independence, self-responsibility, and resolved transference occur in the working phase.", "top": "Nursing Process: Outcomes Identification", "note": ""}, {"ch": 8, "n": 8, "sata": false, "eth": false, "stem": "During which phase of the nurse-patient relationship can the nurse anticipate that identified patient issues will be explored and resolved?", "opts": ["Preorientation", "Orientation", "Working", "Termination"], "ans": [2], "rat": "During the working phase, the nurse strives to assist the patient in making connections among dysfunctional behaviors, thinking, and emotions and offers support while alternative coping behaviors are tried.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 8, "n": 9, "sata": false, "eth": false, "stem": "At what point in the nurse-patient relationship should a nurse plan to first address termination?", "opts": ["During the orientation phase", "At the end of the working phase", "Near the beginning of the termination phase", "When the patient initially brings up the topic"], "ans": [0], "rat": "The patient has a right to know the conditions of the nurse-patient relationship. If the relationship is to be time-limited, the patient should be informed of the number of sessions. If it is open-ended, the termination date will not be known at the outset, and the patient should know that the issue will be negotiated at a later date. The nurse is responsible for bringing up the topic of termination early in the relationship, usually during the orientation phase.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 10, "sata": false, "eth": false, "stem": "A nurse introduces the matter of a contract during the first session with a new patient because contracts:", "opts": ["specify what the nurse will do for the patient.", "spell out the participation and responsibilities of each party.", "indicate the feeling tone established between the participants.", "are binding and prevent either party from prematurely ending the relationship."], "ans": [1], "rat": "A contract emphasizes that the nurse works with the patient rather than doing something for the patient. Working with is a process that suggests each party is expected to participate and share responsibility for outcomes. Contracts do not, however, stipulate roles or feeling tone, and premature termination is forbidden.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 8, "n": 11, "sata": false, "eth": false, "stem": "As a nurse escorts a patient being discharged after treatment for major depression, the patient gives the nurse a necklace with a heart pendant and says, Thank you for helping mend my broken heart. Which is the nurses best response?", "opts": ["Accepting gifts violates the policies and procedures of the facility.", "I'm glad you feel so much better now. Thank you for the beautiful necklace.", "I'm glad I could help you, but I can't accept the gift. My reward is seeing you with a renewed sense of hope.", "Helping people is what nursing is all about. It's rewarding to me when patients recognize how hard we work."], "ans": [2], "rat": "Accepting a gift creates a social rather than therapeutic relationship with the patient and blurs the boundaries of the relationship. A caring nurse will acknowledge the patients gesture of appreciation, but the gift should not be accepted.", "top": "Nursing Process: Implementation", "note": "Your 9th edition Table 8.1 says an inexpensive gift given at the end of hospitalization may be graciously accepted; expensive gifts and money are refused. The key here assumes the necklace should be declined, so value matters. Compare with the card question."}, {"ch": 8, "n": 12, "sata": false, "eth": false, "stem": "Which remark by a patient indicates passage from orientation to the working phase of a nurse-patient relationship?", "opts": ["I don't have any problems.", "It is so difficult for me to talk about problems.", "I don't know how it will help to talk to you about my problems.", "I want to find a way to deal with my anger without becoming violent."], "ans": [3], "rat": "Thinking about a more constructive approach to dealing with anger indicates a readiness to make a behavioral change. Behavioral change is associated with the working phase of the relationship. Denial is often seen in the orientation phase. It is common early in the relationship, before rapport and trust are firmly established, for a patient to express difficulty in talking about problems. Stating skepticism about the effectiveness of the nurse-patient relationship is more typically a reaction during the orientation phase.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 13, "sata": false, "eth": false, "stem": "A nurse explains to the family of a mentally ill patient how a nurse-patient relationship differs from social relationships. Which is the best explanation?", "opts": ["The focus is on the patient. Problems are discussed by the nurse and patient, but solutions are implemented by the patient.", "The focus shifts from nurse to patient as the relationship develops. Advice is given by both, and solutions are implemented.", "The focus of the relationship is socialization. Mutual needs are met, and feelings are shared openly.", "The focus is creation of a partnership in which each member is concerned with growth and satisfaction of the other."], "ans": [0], "rat": "Only the correct response describes elements of a therapeutic relationship. The remaining responses describe events that occur in social or intimate relationships.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 14, "sata": false, "eth": false, "stem": "A nurse wants to demonstrate genuineness with a patient diagnosed with schizophrenia. The nurse should:", "opts": ["restate what the patient says.", "use congruent communication strategies.", "use self-revelation in patient interactions.", "consistently interpret the patients behaviors."], "ans": [1], "rat": "Genuineness is a desirable characteristic involving awareness of ones own feelings as they arise and the ability to communicate them when appropriate. The incorrect options are undesirable in a therapeutic relationship.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 15, "sata": false, "eth": false, "stem": "A nurse caring for a withdrawn, suspicious patient recognizes development of feelings of anger toward the patient. The nurse should:", "opts": ["suppress the angry feelings.", "express the anger openly and directly with the patient.", "tell the nurse manager to assign the patient to another nurse.", "discuss the anger with a clinician during a supervisory session."], "ans": [3], "rat": "The nurse is accountable for the relationship. Objectivity is threatened by strong positive or negative feelings toward a patient. Supervision is necessary to work through countertransference feelings.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 16, "sata": false, "eth": false, "stem": "A nurse wants to enhance growth of a patient by showing positive regard. The nurses action most likely to achieve this goal is:", "opts": ["making rounds daily.", "staying with a tearful patient.", "administering medication as prescribed.", "examining personal feelings about a patient."], "ans": [1], "rat": "Staying with a crying patient offers support and shows positive regard. Administering daily medication and making rounds are tasks that could be part of an assignment and do not necessarily reflect positive regard. Examining feelings regarding a patient addresses the nurses ability to be therapeutic.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 17, "sata": false, "eth": false, "stem": "A patient says, I've done a lot of cheating and manipulating in my relationships. Select a nonjudgmental response by the nurse.", "opts": ["How do you feel about that?", "I am glad that you realize this.", "That's not a good way to behave.", "Have you outgrown that type of behavior?"], "ans": [0], "rat": "Asking a patient to reflect on feelings about his or her actions does not imply any judgment about those actions, and it encourages the patient to explore feelings and values. The remaining options offer negative judgments.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 18, "sata": false, "eth": true, "stem": "A patient says, People should be allowed to commit suicide without interference from others. A nurse replies, You're wrong. Nothing is bad enough to justify death. What is the best analysis of this interchange?", "opts": ["The patient is correct.", "The nurse is correct.", "Neither person is correct.", "Differing values are reflected in the two statements."], "ans": [3], "rat": "Values guide beliefs and actions. The individuals stating their positions place different values on life and autonomy. Nurses must be aware of their own values and be sensitive to the values of others.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 19, "sata": false, "eth": false, "stem": "Which issues should a nurse address during the first interview with a patient with a psychiatric disorder?", "opts": ["Trust, congruence, attitudes, and boundaries", "Goals, resistance, unconscious motivations, and diversion", "Relationship parameters, the contract, confidentiality, and termination", "Transference, countertransference, intimacy, and developing resources"], "ans": [2], "rat": "Relationship parameters, the contract, confidentiality, and termination are issues that should be considered during the orientation phase of the relationship. The remaining options are issues that are dealt with later.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 8, "n": 20, "sata": false, "eth": false, "stem": "An advanced practice nurse observes a novice nurse expressing irritability regarding a patient with a long history of alcoholism and suspects the new nurse is experiencing countertransference. Which comment by the new nurse confirms this suspicion?", "opts": ["This patient continues to deny problems resulting from drinking.", "My parents were alcoholics and often neglected our family.", "The patient cannot identify any goals for improvement.", "The patient said I have many traits like her mother."], "ans": [1], "rat": "Countertransference occurs when the nurse unconsciously and inappropriately displaces onto the patient feelings and behaviors related to significant figures in the nurses past. In this instance, the new nurses irritability stems from relationships with parents. The distracters indicate transference or accurate analysis of the patients behavior.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 8, "n": 21, "sata": false, "eth": true, "stem": "Which behavior shows that a nurse values autonomy? The nurse:", "opts": ["suggests one-on-one supervision for a patient who has suicidal thoughts.", "informs a patient that the spouse will not be in during visiting hours.", "discusses options and helps the patient weigh the consequences.", "sets limits on a patients romantic overtures toward the nurse."], "ans": [2], "rat": "A high level of valuing is acting on ones belief. Autonomy is supported when the nurse helps a patient weigh alternatives and their consequences before the patient makes a decision. Autonomy or self-determination is not the issue in any of the other behaviors.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 22, "sata": false, "eth": false, "stem": "As a nurse discharges a patient, the patient gives the nurse a card of appreciation made in an arts and crafts group. What is the nurses best action?", "opts": ["Recognize the effectiveness of the relationship and patients thoughtfulness. Accept the card.", "Inform the patient that accepting gifts violates policies of the facility. Decline the card.", "Acknowledge the patients transition through the termination phase but decline the card.", "Accept the card and invite the patient to return to participate in other arts and crafts groups."], "ans": [0], "rat": "The nurse must consider the meaning, timing, and value of the gift. In this instance, the nurse should accept the patients expression of gratitude.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 23, "sata": false, "eth": false, "stem": "A patient says, I'm still on restriction, but I want to attend some off-unit activities. Would you ask the doctor to change my privileges? What is the nurses best response?", "opts": ["Why are you asking me when you're able to speak for yourself?", "I will be glad to address it when I see your doctor later today.", "That's a good topic for you to discuss with your doctor.", "Do you think you can't speak to a doctor?"], "ans": [2], "rat": "Nurses should encourage patients to work at their optimal level of functioning. A nurse does not act for the patient unless it is necessary. Acting for a patient increases feelings of helplessness and dependency.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 24, "sata": false, "eth": false, "stem": "A community mental health nurse has worked with a patient for 3 years but is moving out of the city and terminates the relationship. When a novice nurse begins work with this patient, what is the starting point for the relationship?", "opts": ["Begin at the orientation phase.", "Resume the working relationship.", "Initially establish a social relationship.", "Return to the emotional catharsis phase."], "ans": [0], "rat": "After termination of a long-term relationship, the patient and new nurse usually have to begin at ground zero, the orientation phase, to build a new relationship. If termination is successfully completed, the orientation phase sometimes progresses quickly to the working phase. Other times, even after successful termination, the orientation phase may be prolonged.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 8, "n": 25, "sata": false, "eth": false, "stem": "As a patient diagnosed with a mental illness is being discharged from a facility, a nurse invites the patient to the annual staff picnic. What is the best analysis of this scenario?", "opts": ["The invitation facilitates dependency on the nurse.", "The nurses action blurs the boundaries of the therapeutic relationship.", "The invitation is therapeutic for the patients diversional activity deficit.", "The nurses action assists the patients integration into community living."], "ans": [1], "rat": "The invitation creates a social relationship rather than a therapeutic relationship.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 8, "n": 26, "sata": false, "eth": false, "stem": "A nurse says, I am the only one who truly understands this patient. Other staff members are too critical. The nurses statement indicates:", "opts": ["boundary blurring.", "sexual harassment.", "positive regard.", "advocacy."], "ans": [0], "rat": "When the role of the nurse and the role of the patient shift, boundary blurring may arise. In this situation the nurse is becoming over-involved with the patient as a probable result of unrecognized countertransference. When boundary issues occur, the need for supervision exists. The situation does not describe sexual harassment. Data are not present to suggest positive regard or advocacy.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 8, "n": 1, "sata": true, "eth": false, "stem": "Which descriptors exemplify consistency regarding nurse-patient relationships? Select all that apply.", "opts": ["Encouraging a patient to share initial impressions of staff", "Having the same nurse care for a patient on a daily basis", "Providing a schedule of daily activities to a patient", "Setting a time for regular sessions with a patient", "Offering solutions to a patients problems"], "ans": [1, 2, 3], "rat": "Consistency implies predictability. Having the same nurse see the patient daily and provide a daily schedule of patient activities and a set time for regular sessions will help a patient predict what will happen during each day and develop a greater degree of security and comfort. Encouraging a patient to share initial impressions of staff and giving advice are not related to consistency and would not be considered a therapeutic intervention.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 2, "sata": true, "eth": false, "stem": "A nurse ends a relationship with a patient. Which actions by the nurse should be included in the termination phase? Select all that apply.", "opts": ["Focus dialogues with the patient on problems that may occur in the future.", "Help the patient express feelings about the relationship with the nurse.", "Help the patient prioritize and modify socially unacceptable behaviors.", "Reinforce expectations regarding the parameters of the relationship.", "Help the patient to identify strengths, limitations, and problems."], "ans": [0, 1], "rat": "The correct actions are part of the termination phase. The other actions would be used in the working and orientation phases.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 3, "sata": true, "eth": false, "stem": "A novice psychiatric nurse has a parent with bipolar disorder. This nurse angrily recalls feelings of embarrassment about the parents behavior in the community. Select the best ways for this nurse to cope with these feelings.Select all that apply.", "opts": ["Seek ways to use the understanding gained from childhood to help patients cope with their own illnesses.", "Recognize that these feelings are unhealthy. The nurse should try to suppress them when working with patients.", "Recognize that psychiatric nursing is not an appropriate career choice. Explore other nursing specialties.", "The nurse should begin new patient relationships by saying, My own parent had mental illness, so I accept it without stigma.", "Recognize that the feelings may add sensitivity to the nurses practice, but supervision is important."], "ans": [0, 4], "rat": "The nurse needs support to explore these feelings. An experienced psychiatric nurse is a resource that may be helpful. The knowledge and experience gained from the nurses relationship with a mentally ill parent may contribute sensitivity to compassionate practice. Self-disclosure and suppression are not adaptive coping strategies. The nurse should not give up on this area of practice without first seeking ways to cope with the memories.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 8, "n": 4, "sata": true, "eth": false, "stem": "A novice nurse tells a mentor, I want to convey to my patients that I am interested in them and that I want to listen to what they have to say. Which behaviors will be helpful in meeting the nurses goal? Select all that apply.", "opts": ["Sitting behind a desk, facing the patient", "Introducing self to a patient and identifying own role", "Maintaining control of discussions by asking direct questions", "Using facial expressions to convey interest and encouragement", "Assuming an open body posture and sometimes mirror imaging"], "ans": [1, 3, 4], "rat": "Trust is fostered when the nurse gives an introduction and identifies his or her role. Facial expressions that convey interest and encouragement support the nurses verbal statements to that effect and strengthen the message. An open body posture conveys openness to listening to what the patient has to say. Mirror imaging enhances patient comfort. A desk would place a physical barrier between the nurse and patient. A face-to-face stance should be avoided when possible and a less intense 90- or 120-degree angle used to permit either party to look away without discomfort.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 10, "n": 1, "sata": false, "eth": false, "stem": "The adult child of a patient diagnosed with major depression asks, Do you think depression and physical illness are connected? Since my fathers death, my mother has had shingles and the flu, but shes usually not one who gets sick. Which answer by the nurse best reflects current knowledge about psychoneuroimmunology?", "opts": ["It is probably a coincidence. Emotions and physical responses travel on different tracts of the nervous system.", "You may be paying more attention to your mother since your father died and noticing more things such as minor illnesses.", "So far, research on emotions or stress and becoming ill more easily is unclear. We do not know for sure if there is a link.", "Negative emotions and stress may interfere with the bodys ability to protect itself and can increase the likelihood of infection."], "ans": [3], "rat": "The correct answer best explains the research. Research supports a link between negative emotions and/or prolonged stress and impaired immune system functioning. Activation of the immune system sends proinflammatory cytokines to the brain, and the brain in turn releases its own cytokines that signal the central nervous system to initiate myriad responses to stress. Prolonged stress suppresses the immune system and lowers resistance to infections. Although the adult child may be more aware of issues involving the mother, the pattern of illnesses described may be an increase from the mothers baseline.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 10, "n": 2, "sata": false, "eth": false, "stem": "A patient diagnosed with emphysema has severe shortness of breath and needs portable oxygen when leaving home. Recently the patient has reduced activity because of fear that breathing difficulty will occur. A nurse suggests using guided imagery. Which image should the patient be encouraged to visualize?", "opts": ["Engaging in activity without using any supplemental oxygen", "Sleeping comfortably and soundly, without respiratory distress", "Feeling relaxed and taking regular deep breaths when leaving home", "Having a younger, healthier body that knows no exercise limitations"], "ans": [2], "rat": "The patient has dysfunctional images of dyspnea. Guided imagery can help replace the dysfunctional image with a positive coping image. Athletes have found that picturing successful images can enhance performance. Encouraging the patient to imagine a regular breathing depth and rate will help improve oxygencarbon dioxide exchange and help achieve further relaxation. Other options focus on unrealistic goals (being younger, not needing supplemental oxygen) or restrict her quality of life.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 10, "n": 3, "sata": false, "eth": false, "stem": "A nurse leads a psychoeducational group for depressed patients. The nurse plans to implement an exercise regime for each patient. The rationale to use when presenting this plan to the treatment team is that exercise:", "opts": ["has an antidepressant effect comparable to selective serotonin reuptake inhibitors.", "prevents damage from overstimulation of the sympathetic nervous system.", "detoxifies the body by removing metabolic wastes and other toxins.", "improves mood stability for patients with bipolar disorders."], "ans": [0], "rat": "b-Endorphins produced during exercise result in improvement in mood and lowered anxiety. The other options are not accurate.", "top": "Nursing Process: Implementation", "note": "Your textbook doesn’t say exercise is comparable to SSRIs. It says exercise is linked to lower depression risk (3+ hours a week) and raises endorphins. A is still the best choice by elimination."}, {"ch": 10, "n": 4, "sata": false, "eth": false, "stem": "A recent immigrant from Honduras comes to the clinic with a family member who has been a U.S. resident for 10 years. The family member says, The immigration to America has been very difficult. Considering cultural background, which expression of stress by this patient would the nurse expect?", "opts": ["Motor restlessness", "Somatic complaints", "Memory deficiencies", "Sensory perceptual alterations"], "ans": [1], "rat": "Honduras is in Central America. Many people from Central American cultures express distress in somatic terms. The other options are not specific to this patients cultural background and are less likely to be observed in persons from Central America.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 10, "n": 5, "sata": false, "eth": false, "stem": "A patient nervously says, Financial problems are stressing my marriage. I've heard rumors about cutbacks at work; I am afraid I might get laid off. The patients pulse is 112/minute; respirations are 26/minute; and blood pressure is 166/88. Which nursing intervention will the nurse implement?", "opts": ["Advise the patient, Go to sleep 30 to 60 minutes earlier each night to increase rest.", "Direct the patient in slow and deep breathing via use of a positive, repeated word.", "Suggest the patient consider that a new job might be better than the present one.", "Tell the patient, Relax by spending more time playing with your pet."], "ans": [1], "rat": "The patient is responding to stress with increased arousal of the sympathetic nervous system, as evident by elevated vital signs. These will have a negative effect on his health and increase his perception of being anxious and stressed. Stimulating the parasympathetic nervous system will counter the sympathetic nervous systems arousal, normalizing these vital-sign changes and reducing the physiological demands stress is placing on his body. Other options do not address his physiological response pattern as directly or immediately.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 10, "n": 6, "sata": false, "eth": false, "stem": "According to the Recent Life Changes Questionnaire, which situation would most necessitate a complete assessment of a persons stress status and coping abilities?", "opts": ["A person who has been assigned more responsibility at work", "A parent whose job required relocation to a different city", "A person returning to college after an employer ceased operations", "A man who recently separated from his wife because of marital problems"], "ans": [2], "rat": "A person returning to college after losing a job is dealing with two significant stressors simultaneously. Together, these stressors total more life change units than any of the single stressors cited in the other options.", "top": "Nursing Process: Assessment", "note": "Do the math from Table 10.4: more responsibilities = 29, move to a different city = 47, separation for marital problems = 76, laid off (68) or fired (79) plus beginning college (38) = 106–117."}, {"ch": 10, "n": 7, "sata": false, "eth": false, "stem": "A patient newly diagnosed as HIV-positive seeks the nurses advice on how to reduce the risk of infections. The patient says, I used to go to church and I was in my best health then. Maybe I should start going to church again. Which response will the nurse offer?", "opts": ["Religion does not usually affect health, but you were younger and stronger then.", "Contact with supportive people at church might help, but religion itself is not especially helpful.", "Studies show that spiritual practices can enhance immune system function and coping abilities.", "Going to church would expose you to many potential infections. Let's think about some other options."], "ans": [2], "rat": "Studies have shown a positive correlation between spiritual practices and enhanced immune system function and sense of well-being. The other options wrongly suggest that spiritual practices have little effect on the immune system or reject the patients preferences regarding health management.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 10, "n": 8, "sata": false, "eth": false, "stem": "When a nurse asks a newly admitted patient to describe social supports, the patient says, My parents died last year and I have no family. I am newly divorced, and my former in-laws blame me. I don't have many friends because most people my age just want to go out drinking. Which action will the nurse apply?", "opts": ["Advise the patient that being so particular about potential friends reduces social contact.", "Suggest using the Internet as a way to find supportive others with similar values.", "Encourage the patient to begin dating again, perhaps with members of the church.", "Discuss how divorce support groups could increase coping and social support."], "ans": [3], "rat": "High-quality social support enhances mental and physical health and acts as a significant buffer against distress. Low-quality support relationships affect a persons coping negatively. Resuming dating soon after a divorce could place additional stress on the patient rather than helping her cope with existing stressors. Developing relationships on the Internet probably would not substitute fully for direct contact with other humans and could expose her to predators misrepresenting themselves to take advantage of vulnerable persons.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 10, "n": 9, "sata": false, "eth": false, "stem": "A patient experiencing significant stress associated with a disturbing new medical diagnosis asks the nurse, Do you think saying a prayer would help? Select the nurses best answer.", "opts": ["It could be that prayer is your only hope.", "You may find prayer gives comfort and lowers your stress.", "I can help you feel calmer by teaching you meditation exercises.", "We do not have evidence that prayer helps, but it wouldn't hurt."], "ans": [1], "rat": "Many patients find that spiritual measures, including prayer, are helpful in mediating stress. Studies have shown that spiritual practices can enhance the sense of well-being. When a patient suggests a viable means of reducing stress, it should be supported by the nurse. Indicating that prayer is the patients only hope is pessimistic and would cause further distress. Suggesting meditation or other alternatives to prayer implies that the nurse does not think prayer would be effective.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 10, "n": 10, "sata": false, "eth": false, "stem": "A patient is brought to the Emergency Department after a motorcycle accident. The patient is alert, responsive, and diagnosed with a broken leg. The patients vital signs are pulse (P) 72 and respiration (R) 16. After being informed surgery is required for the broken leg, which vital sign readings would be expected?", "opts": ["P 64, R 14", "P 68, R 12", "P 72, R 16", "P 80, R 20"], "ans": [3], "rat": "The patient would experience stress associated with anticipation of surgery. In times of stress, the sympathetic nervous system takes over (fight or flight response) and sends signals to the adrenal glands, thereby releasing norepinephrine. The circulating norepinephrine increases the heart rate. Respirations increase, bringing more oxygen to the lungs.", "top": "Nursing Process: Assessment", "note": "Your textbook attributes the surge to epinephrine (adrenaline) released by the adrenals; the rationale says norepinephrine. Either way, HR and RR go up."}, {"ch": 10, "n": 11, "sata": false, "eth": false, "stem": "A patient tells the nurse, I know that I should reduce the stress in my life, but I have no idea where to start. What would be the best initial nursing response?", "opts": ["Physical exercise works to elevate mood and reduce anxiety.", "Reading about stress and how to manage it might be a good place to start.", "Why not start by learning to meditate? That technique will cover everything.", "Let's talk about what is going on in your life and then look at possible options."], "ans": [3], "rat": "In this case, the nurse lacks information about what stressors the patient is coping with or about what coping skills are already possessed. Further assessment is indicated before potential solutions can be explored. Suggesting exploration of the stress facing the patient is the only option that involves further assessment rather than suggesting a particular intervention.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 10, "n": 12, "sata": false, "eth": false, "stem": "A patient tells the nurse, My doctor thinks my problems with stress relate to the negative way I think about things and suggested I learn new ways of thinking. Which response by the nurse would support the recommendation?", "opts": ["Encourage the patient to imagine being in calm circumstances.", "Provide the patient with a blank journal and guidance about journaling.", "Teach the patient to recognize, reconsider, and reframe irrational thoughts.", "Teach the patient to use instruments that give feedback about bodily functions."], "ans": [2], "rat": "Cognitive reframing focuses on recognizing and correcting maladaptive patterns of thinking that create stress or interfere with coping. Cognitive reframing involves recognizing the habit of thinking about a situation or issue in a fixed, irrational, and unquestioning manner. Helping the patient to recognize and reframe (reword) such thoughts so that they are realistic and accurate promotes coping and reduces stress. Thinking about being in calming circumstances is a form of guided imagery. Instruments that give feedback about bodily functions are used in biofeedback. Journaling is effective for helping to increase self-awareness. However, none of these last three interventions is likely to alter the patients manner of thinking.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 10, "n": 13, "sata": false, "eth": false, "stem": "A patient who had been experiencing significant stress learned to use progressive muscle relaxation and deep breathing exercises. When the patient returns to the clinic 2 weeks later, which finding most clearly shows the patient is coping more effectively with stress?", "opts": ["The patients systolic blood pressure has changed from the 140s to the 120s mm Hg.", "The patient reports, I feel better, and that things are not bothering me as much.", "The patient reports, I spend more time napping or sitting quietly at home.", "The patients weight decreased by 3 pounds."], "ans": [0], "rat": "Objective measures tend to be the most reliable means of gauging progress. In this case, the patients elevated blood pressure, an indication of the bodys physiological response to stress, has diminished. The patients report regarding activity level is subjective; sitting quietly could reflect depression rather than improvement. Appetite, mood, and energy levels are also subjective reports that do not necessarily reflect physiological changes from stress and may not reflect improved coping with stress. The patients weight change could be a positive or negative indicator; the blood pressure change is the best answer.", "top": "Nursing Process: Evaluation", "note": "Your chapter doesn’t discuss evaluating outcomes this way; the answer relies on the general rule that objective data outweighs subjective reports."}, {"ch": 10, "n": 14, "sata": false, "eth": false, "stem": "A patient tells the nurse, I will never be happy until I'm as successful as my older sister. The nurse asks the patient to reassess this statement and reframe it. Which reframed statement by the patient is most likely to promote coping?", "opts": ["People should treat me as well as they treat my sister.", "I can find contentment in succeeding at my own job level.", "I won't be happy until I make as much money as my sister.", "Being as smart or clever as my sister isn't really important."], "ans": [1], "rat": "Finding contentment within ones own work, even when it does not involve success as others might define it, is likely to lead to a reduced sense of distress about achievement level. It speaks to finding satisfaction and happiness without measuring the self against another person. Focusing on salary is simply a more specific way of being as successful as the sister, which would not promote coping. Expecting others to treat her as they do her sister is beyond her control. Dismissing the sisters cleverness as unimportant indicates that the patient continues to feel inferior to the sibling.", "top": "Nursing Process: Evaluation", "note": ""}, {"ch": 10, "n": 15, "sata": false, "eth": false, "stem": "A patient says, One result of my chronic stress is that I feel so tired. I usually sleep from 11:00 PM to 6:30 AM. I started setting my alarm to give me an extra 30 minutes of sleep each morning, but I don't feel any better and I'm rushed for work. Which nursing response would best address the patients concerns?", "opts": ["You may need to speak to your doctor about taking a sedative to help you sleep.", "Perhaps going to bed a half-hour earlier would work better than sleeping later.", "A glass of wine in the evening might take the edge off and help you to rest.", "Exercising just before retiring for the night may help you to sleep better."], "ans": [1], "rat": "Sleeping later in the morning may disturb circadian rhythms and in this case is adding, rather than reducing, stress. Going to bed earlier and arising at the usual time alleviates fatigue more effectively. Sedatives may offer some benefit but are a short-term intervention with potential side effects, and other nonpharmacological interventions might work as well or better. Exercise earlier in the evening could induce tiredness and ease the process of falling asleep, but doing so right before bedtime would stimulate and interfere with sleep. Alcohol is sedating but potentially addictive; encouraging its use could increase the risk of using alcohol maladaptively as a response to stress in general.", "top": "Nursing Process: Implementation", "note": ""}, {"ch": 10, "n": 16, "sata": false, "eth": false, "stem": "A patient reports, I am overwhelmed by stress. Which question by the nurse would be most important to use in the initial assessment of this the patient?", "opts": ["Tell me about your family history. Do you have any relatives who have problems with stress?", "Tell me about your exercise. How much activity do you typically get in a day?", "Tell me about the kinds of things you do to reduce or cope with your stress.", "Stress can interfere with sleep. How much did you sleep last night?"], "ans": [2], "rat": "The most important data to collect during an initial assessment is that which reflects how stress is affecting the patient and how he is coping with stress at present. This data would indicate whether or not his distress is placing him in danger (e.g., by elevating his blood pressure dangerously or via maladaptive responses, such as drinking) and would help the nurse understand how he copes and how well his coping strategies and resources serve him. Of the choices presented, the highest priority would be to determine what he is doing to cope at present, preferably via an open-ended inquiry. Family history, the extent of his use of exercise, and how much sleep he is getting are all helpful but seek data that is less of a priority. Also, the manner in which such data is sought here is likely to provide only brief responses (e.g., how much sleep he got on one particular night is probably less important than how much he is sleeping in general).", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 10, "n": 17, "sata": false, "eth": false, "stem": "Which scenario best demonstrates an example of eustress? An individual:", "opts": ["loses a beloved family pet.", "prepares to take a one-week vacation to a tropical island with a group of close friends.", "receives a bank notice there were insufficient funds in their account for a recent rent payment.", "receives notification their current employer is experiencing financial problems and some workers will be terminated."], "ans": [1], "rat": "Eustress is beneficial stress; it motivates people to develop skills they need to solve problems and meet personal goals. Positive life experiences produce eustress. Going on a tropical vacation is an exciting, relaxing experience and is an example of eustress. Losing the family pet, worrying about employment security, and having financial problems are examples of distress, a negative experience that drains energy and can lead to significant emotional problems.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 10, "n": 18, "sata": false, "eth": false, "stem": "A person with a fear of heights drives across a high bridge. Which structure will stimulate a response from the autonomic nervous system?", "opts": ["Thalamus", "Parietal lobe", "Hypothalamus", "Pituitary gland"], "ans": [2], "rat": "The individual will find this experience stressful. The hypothalamus functions as the command-and-control center when receiving stressful signals. The hypothalamus responds to signals of stress by engaging the autonomic nervous system. The parietal lobe is responsible for interpretation of other sensations. The thalamus processes messages associated with pain and wakefulness. The pituitary gland may be involved in other aspects of the persons response but would not stimulate the autonomic nervous system.", "top": "Nursing Process: Assessment", "note": ""}, {"ch": 10, "n": 19, "sata": false, "eth": false, "stem": "A person with a fear of heights drives across a high bridge. Which division of the autonomic nervous system will be stimulated in response to this experience?", "opts": ["Limbic system", "Peripheral nervous system", "Sympathetic nervous system", "Parasympathetic nervous system"], "ans": [2], "rat": "The autonomic nervous system is comprised of the sympathetic (fight or flight response) and parasympathetic nervous system (relaxation response). In times of stress, the sympathetic nervous system is stimulated. A person fearful of heights would experience stress associated with the experience of driving across a high bridge. The peripheral nervous system responds to messages from the sympathetic nervous system. The limbic system processes emotional responses but is not specifically part of the autonomic nervous system.", "top": "Nursing Process: Assessment", "note": "The rationale says the peripheral nervous system “responds to messages from” the sympathetic system. More precisely, the autonomic system (sympathetic + parasympathetic) is part of the peripheral nervous system."}, {"ch": 10, "n": 1, "sata": true, "eth": false, "stem": "Which changes reflect short-term physiological responses to stress? Select all that apply.", "opts": ["Muscular tension, blood pressure, and triglycerides increase.", "Epinephrine is released, increasing heart and respiratory rates.", "Corticosteroid release increases stamina and impedes digestion.", "Cortisol is released, increasing glucogenesis and reducing fluid loss.", "Immune system functioning decreases, and risk of cancer increases.", "Risk of depression, autoimmune disorders, and heart disease increases."], "ans": [0, 1, 2, 3], "rat": "The correct answers are all short-term physiological responses to stress. Increased risk of immune system dysfunction, cancer, cardiovascular disease, depression, and autoimmune disease are all long-term (chronic) effects of stress.", "top": "Nursing Process: Assessment", "note": "Triglycerides and reduced fluid loss aren’t mentioned in your textbook. Table 10.2 also lists immune suppression as an acute stress effect; option E is wrong because it pairs that with cancer risk, which is long-term."}, {"ch": 10, "n": 2, "sata": true, "eth": false, "stem": "Which nursing comments are likely to help a patient to cope by addressing the mediators of stress?Select all that apply.", "opts": ["A divorce, while stressful, can be the beginning of a new, better phase of life.", "You said you used to jog; getting back to aerobic exercise could be helpful.", "Journaling often promotes awareness of how experiences have affected people.", "Slowing your breathing by counting to three between breaths will calm you.", "Would a short-term loan make your finances less stressful?", "There is a support group for newly divorced persons in your neighborhood."], "ans": [0, 2, 4, 5], "rat": "Stress mediators are factors that can help persons cope by influencing how they perceive and respond to stressors; they include personality, social support, perceptions, and culture. Suggesting that a divorce may have positive as well as negative aspects helps the patient to alter perceptions of the stressor. Journaling increases self-awareness regarding how life experiences may have shaped how we perceive and respond to stress (or how our personality affects how we respond to stressors). A loan could help the patient by reducing the financial pressures. Participation in support groups is an excellent way to expand ones support network relative to specific issues. However, neither aerobic exercise nor breathing-control exercises, while helpful in other ways, affect stress mediators.", "top": "Nursing Process: Implementation", "note": "Your textbook lists perception, temperament, social support, support groups, culture, and spirituality as mediators. The divorce reframe (perception) and the support group clearly fit. Journaling and the loan aren’t described as mediators, so this key is debatable."}, {"ch": 10, "n": 3, "sata": true, "eth": false, "stem": "The nurse wishes to use guided imagery to help a patient relax. Which comments would be appropriate to include in the guided imagery script? Select all that apply.", "opts": ["Imagine others treating you the way they should, the way you want to be treated", "With each breath, you feel calmer, more relaxed, almost as if you are floating", "You are alone on a beach, the sun is warm, and you hear only the sound of the surf", "You have taken control, nothing can hurt you now. Everything is going your way", "You have grown calm, your mind is still, there is nothing to disturb your well-being", "You will feel better as work calms down, as your boss becomes more understanding"], "ans": [1, 2, 4], "rat": "The intent of guided imagery to assist patients manage stress is to lead the patient to envision images that are calming and health-enhancing. Statements that involve the patient calming progressively with breathing, feeling increasingly relaxed, being in a calm and pleasant location, being away from stressors, and having a peaceful and calm mind are therapeutic and should be included in the script. However, items that raise stressful images or memories or that involve unrealistic expectations or elements beyond the patients control (e.g., that others will treat the patient as he desires, that everything is going the patients way, that bosses are understanding) interfere with relaxation and/or do not promote effective coping. Thus these are not health-promoting and should not be included in the script.", "top": "Nursing Process: Planning", "note": ""}, {"ch": 10, "n": 4, "sata": true, "eth": false, "stem": "An individual says to the nurse, I feel so stressed out lately. I think the stress is affecting my body also. Which somatic complaints are most likely to accompany this feeling? Select all that apply.", "opts": ["Headache", "Neck pain", "Insomnia", "Anorexia", "Myopia"], "ans": [0, 1, 2, 3], "rat": "When individuals feel stressed-out, they often have accompanying somatic complaints, especially associated with sleep, eating, and headache or back pain. Changes in vision, such as myopia, would not be expected.", "top": "Nursing Process: Assessment", "note": "“Anorexia” here means loss of appetite, not anorexia nervosa."}];
const CH=[1,3,6,8,10];
const NAMES={1:"Mental Health and Mental Illness",3:"Psychobiology and Psychopharmacology",6:"Legal and Ethical Considerations",8:"Therapeutic Relationships",10:"Stress Responses and Stress Management"};
const KEY="nur202-tb-ch1-3-6-8-10-v1";
const L="ABCDEFG";
const $=id=>document.getElementById(id);
const same=(a,b)=>a.length===b.length&&[...a].sort().join()===[...b].sort().join();
let S=null, temp=[];
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.order)S=s;}catch(e){}
let cfg={ch:[...CH],sata:false,eth:false,shuf:true};
try{const c=JSON.parse(localStorage.getItem(KEY+"-cfg"));if(c)cfg=c;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+"-cfg",JSON.stringify(cfg))}catch(e){}};
const pool=()=>Q.map((q,k)=>k).filter(k=>cfg.ch.includes(Q[k].ch)&&(cfg.sata||!Q[k].sata)&&(cfg.eth||!Q[k].eth));

function setup(){
  $("prog").innerHTML="";
  const n=pool().length;
  let h=`<div class="card"><fieldset><legend>Chapters</legend><div class="chips">${CH.map(c=>{const t=Q.filter(q=>q.ch===c).length;return `<label class="chk"><input type="checkbox" data-c="${c}" ${cfg.ch.includes(c)?"checked":""}> Ch. ${c} <span class="sub">(${t})</span></label>`}).join("")}</div></fieldset>
  <fieldset><legend>Question types</legend><div class="chips">
  <label class="chk"><input type="checkbox" id="o-sata" ${cfg.sata?"checked":""}> Include select-all-that-apply</label>
  <label class="chk"><input type="checkbox" id="o-eth" ${cfg.eth?"checked":""}> Include ethics questions</label>
  <label class="chk"><input type="checkbox" id="o-shuf" ${cfg.shuf?"checked":""}> Shuffle order</label></div>
  <p class="sub">SATA and ethics are off by default because your professor isn\u2019t testing them. There are no bow-tie items in this set.</p></fieldset>
  <p class="count">${n} question${n===1?"":"s"} selected</p>
  <div class="row"><span>${S?`<button class="btn ghost" id="resume">Resume last quiz (${S.res.filter(r=>r!==null).length}/${S.order.length})</button>`:""}</span><button class="btn" id="go" ${n?"":"disabled"}>Start quiz</button></div></div>`;
  $("main").innerHTML=h;
  $("main").querySelectorAll("[data-c]").forEach(b=>b.onchange=()=>{const c=+b.dataset.c;cfg.ch=b.checked?[...cfg.ch,c]:cfg.ch.filter(x=>x!==c);setup()});
  $("o-sata").onchange=e=>{cfg.sata=e.target.checked;setup()};
  $("o-eth").onchange=e=>{cfg.eth=e.target.checked;setup()};
  $("o-shuf").onchange=e=>{cfg.shuf=e.target.checked;setup()};
  if($("resume"))$("resume").onclick=render;
  $("go").onclick=()=>{let o=pool();if(cfg.shuf){for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}}
    S={order:o,i:0,res:Array(o.length).fill(null),picks:Array(o.length).fill(null),only:null};save();render();};
}
function prog(){
  const N=S.order.length,ok=S.res.filter(r=>r===true).length,bad=S.res.filter(r=>r===false).length;
  $("prog").innerHTML=`<div class="bar" aria-hidden="true"><span style="width:${ok/N*100}%;background:var(--ok)"></span><span style="width:${bad/N*100}%;background:var(--bad)"></span></div>
  <div class="meta"><span>${S.i<N?`Question ${S.i+1} of ${N}`:"Results"}</span><span>${ok} correct of ${ok+bad} answered</span></div>`;
}
function nextIdx(){if(S.only){const r=S.only.filter(k=>k>S.i);return r.length?r[0]:S.order.length}return S.i+1}
function render(){
  prog();
  if(S.i>=S.order.length)return results();
  const q=Q[S.order[S.i]],answered=S.res[S.i]!==null,pick=S.picks[S.i]||[];
  temp=[];
  let h=`<div class="card"><span class="tag t${q.ch}">Chapter ${q.ch}</span>${q.sata?'<span class="tag plain">SATA</span>':''}${q.eth?'<span class="tag plain">Ethics</span>':''}<p class="stem">${q.stem}</p>${q.sata?'<p class="sata">Select all that apply.</p>':''}<ul class="opts">`+
  q.opts.map((o,k)=>{let c="",m="";if(answered){const A=q.ans.includes(k),P=pick.includes(k);if(A){c="right";m=P?"Correct":"Answer"}else if(P){c="wrong";m="Your pick"}}
    return `<li><button class="opt ${c}" data-k="${k}" ${answered?"disabled":""} aria-pressed="false"><span class="l">${L[k]}.</span><span>${o}</span>${m?`<span class="mark">${m}</span>`:""}</button></li>`}).join("")+`</ul>`;
  if(q.sata&&!answered)h+=`<div class="row"><span></span><button class="btn" id="chk" disabled>Check answer</button></div>`;
  if(answered){const ok=S.res[S.i];
    h+=`<div class="reveal"><div class="verdict ${ok?'ok':'bad'}">${ok?'Correct.':'Not quite.'} Answer: ${q.ans.map(a=>L[a]).join(", ")}</div>
    <div class="why"><h3>Rationale</h3><p>${q.rat}</p>${q.top?`<p class="top">${q.top}</p>`:""}</div>${q.note?`<div class="note"><strong>Textbook check:</strong> ${q.note}</div>`:""}</div>`;}
  h+=`<div class="row"><button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>Previous</button><button class="btn ghost" id="menu">Settings</button><button class="btn" id="next" ${answered?"":"disabled"}>${nextIdx()>=S.order.length?"See results":"Next question"}</button></div></div>`;
  $("main").innerHTML=h;
  $("prev").onclick=()=>{S.i=Math.max(0,S.i-1);save();render()};
  $("menu").onclick=setup;
  $("next").onclick=()=>{S.i=nextIdx();save();render();window.scrollTo({top:0})};
  if(!answered){
    $("main").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
      if(!q.sata){grade([k]);return}
      temp=temp.includes(k)?temp.filter(x=>x!==k):[...temp,k];b.classList.toggle("picked");b.setAttribute("aria-pressed",temp.includes(k));$("chk").disabled=!temp.length;});
    if(q.sata)$("chk").onclick=()=>grade(temp);
  }
}
function grade(p){S.picks[S.i]=p;S.res[S.i]=same(p,Q[S.order[S.i]].ans);save();render()}
function results(){
  const N=S.order.length,ok=S.res.filter(r=>r===true).length,blank=S.res.filter(r=>r===null).length;
  const rows=CH.map(c=>{const ix=S.order.map((g,k)=>Q[g].ch===c?k:-1).filter(k=>k>=0);return{c,n:ix.length,ok:ix.filter(k=>S.res[k]===true).length}}).filter(r=>r.n);
  const missed=S.res.map((r,k)=>r===false?k:-1).filter(k=>k>=0);
  let h=`<div class="card"><p class="score">${ok} / ${N}</p><p>${Math.round(ok/N*100)}% correct${blank?`, ${blank} unanswered`:""}.</p>
  <table><thead><tr><th>Chapter</th><th>Correct</th><th>%</th></tr></thead><tbody>${rows.map(r=>`<tr><td>Ch. ${r.c}: ${NAMES[r.c]}</td><td>${r.ok} / ${r.n}</td><td>${Math.round(r.ok/r.n*100)}%</td></tr>`).join("")}</tbody></table>`;
  if(missed.length)h+=`<h3>Missed questions</h3><ul class="missed">${missed.map(k=>{const q=Q[S.order[k]];return `<li><button data-k="${k}">Ch. ${q.ch}: ${q.stem.slice(0,80)}\u2026</button></li>`}).join("")}</ul>`;
  h+=`<div class="row">${missed.length?`<button class="btn" id="redo">Retry missed only</button>`:""}<button class="btn ghost" id="new">New quiz</button></div></div>`;
  $("main").innerHTML=h;
  $("main").querySelectorAll(".missed button").forEach(b=>b.onclick=()=>{S.i=+b.dataset.k;S.only=null;save();render()});
  if($("redo"))$("redo").onclick=()=>{missed.forEach(k=>{S.res[k]=null;S.picks[k]=null});S.only=missed;S.i=missed[0];save();render()};
  $("new").onclick=()=>{S=null;try{localStorage.removeItem(KEY)}catch(e){}setup()};
}
setup();
</script>
