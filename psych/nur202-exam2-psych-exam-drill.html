s. The nurse will advise the patient to:","m":false,"rw":false,"o":["Go to the nearest emergency department immediately.","Do not to be alarmed. Take two aspirin and drink plenty of fluids.","Take a dose of your antidepressant now and come to the clinic to see the health care provider.","Resume taking your antidepressants for 2 more weeks and then discontinue them again."],"a":[2],"r":"The patient has symptoms associated with abrupt withdrawal of the tricyclic antidepressant. Taking a dose of the drug will ameliorate the symptoms. Seeing the health care provider will allow the patient to discuss the advisability of going off the medication and to be given a gradual withdrawal schedule if discontinuation is the decision. This situation is not a medical emergency, although it calls for medical advice. Resuming taking the antidepressant for 2 more weeks and then discontinuing again would produce the same symptoms the patient is experiencing.","med":true},{"c":14,"n":19,"s":"Which documentation for a patient diagnosed with major depression indicates the treatment plan was effective?","m":false,"rw":false,"o":["Slept 6 hours uninterrupted. Sang with activity group. Anticipates seeing grandchild.","Slept 10 hours uninterrupted. Attended craft group; stated project was a failure, just like me.","Slept 5 hours with brief interruptions. Personal hygiene adequate with assistance. Weight loss of 1 pound.","Slept 7 hours uninterrupted. Preoccupied with perceived inadequacies. States, I feel tired all the time."],"a":[0],"r":"Sleeping 6 hours, participating with a group, and anticipating an event are all positive events. All the other options show at least one negative finding.","med":false},{"c":14,"n":20,"s":"A patient was diagnosed with seasonal affective disorder (SAD). During which month would this patients symptoms be most acute?","m":false,"rw":false,"o":["January","April","June","September"],"a":[0],"r":"The days are short in January, so the patient would have the least exposure to sunlight. Seasonal affective disorder is associated with disturbances in circadian rhythm. Days are longer in spring, summer, and fall.","med":false},{"c":14,"n":21,"s":"A patient diagnosed with depression repeatedly tells staff, I have cancer. Its my punishment for being a bad person. Diagnostic tests reveal no cancer. Select the priority nursing diagnosis.","m":false,"rw":false,"o":["Powerlessness","Risk for suicide","Stress overload","Spiritual distress"],"a":[1],"r":"A patient diagnosed with depression who feels so worthless as to believe cancer is deserved is at risk for suicide. Safety concerns take priority over the other diagnoses listed.","med":false},{"c":14,"n":22,"s":"A patient diagnosed with major depression refuses solid foods. In order to meet nutritional needs, which beverage will the nurse offer to this patient?","m":false,"rw":false,"o":["Tomato juice","Orange juice","Hot tea","Milk"],"a":[3],"r":"Milk is the only beverage listed that provides protein, fat, and carbohydrates. In addition, milk is fortified with vitamins.","med":false},{"c":14,"n":23,"s":"During a psychiatric assessment, the nurse observes a patients facial expression is without emotion. The patient says, Life feels so hopeless to me. I've been feeling sad for several months. How will the nurse document the patients affect and mood?","m":false,"rw":false,"o":["Affect depressed; mood flat","Affect flat; mood depressed","Affect labile; mood euphoric","Affect and mood are incongruent."],"a":[1],"r":"Mood refers to a persons self-reported emotional feeling state. Affect is the emotional feeling state that is outwardly observable by others. When there is no evidence of emotion in a persons expression, the affect is flat.","med":false},{"c":14,"n":24,"s":"A disheveled patient with severe depression and psychomotor retardation has not showered for several days. The nurse will:","m":false,"rw":false,"o":["bring up the issue at the community meeting.","calmly tell the patient, You must bathe daily.","avoid forcing the issue in order to minimize stress.","firmly and neutrally assist the patient with showering."],"a":[3],"r":"When patients are unable to perform self-care activities, staff must assist them rather than ignore the issue. Better grooming increases self-esteem. Calmly telling the patient to bathe daily and bringing up the issue at a community meeting are punitive.","med":false},{"c":14,"n":25,"s":"A patient diagnosed with major depression began taking escitalopram (Lexapro) 5 days ago. The patient now says, This medicine isn't working. The nurses best intervention would be to:","m":false,"rw":false,"o":["discuss with the health care provider the need to increase the dose.","reassure the patient that the medication will be effective soon.","explain the time lag before antidepressants relieve symptoms.","critically assess the patient for symptoms of improvement."],"a":[2],"r":"Escitalopram is an SSRI antidepressant. One to three weeks of treatment is usually necessary before symptom relief occurs. This information is important to share with patients.","med":true},{"c":14,"n":26,"s":"A nurse is caring for a patient with low self-esteem. Which nonverbal communication should the nurse anticipate from this patient?","m":false,"rw":false,"o":["Arms crossed","Staring at the nurse","Smiling inappropriately","Eyes pointed downward"],"a":[3],"r":"Nonverbal communication is usually considered more powerful than verbal communication. Downward casted eyes suggest feelings of worthlessness or hopelessness.","med":false},{"c":14,"n":27,"s":"A patient diagnosed with major depression received six electroconvulsive therapy sessions and aggressive doses of antidepressant medication. The patient owns a small business and was counseled not to make major decisions for a month. Select the correct rationale for this counseling.","m":false,"rw":false,"o":["Antidepressant medications alter catecholamine levels, which impairs decision-making abilities.","Antidepressant medications may cause confusion related to limitation of tyramine in the diet.","Temporary memory impairments and confusion may occur with electroconvulsive therapy.","The patient needs time to readjust to a pressured work schedule."],"a":[2],"r":"Recent memory impairment and/or confusion is often present during and for a short time after electroconvulsive therapy. An inappropriate business decision might be made because of forgotten important details. The rationales are untrue statements in the incorrect responses. The patient needing time to reorient to a pressured work schedule is less relevant than the correct rationale.","med":true},{"c":14,"n":28,"s":"A nurse instructs a patient taking a medication that inhibits the action of monoamine oxidase (MAO) to avoid certain foods and drugs because of the risk of:","m":false,"rw":false,"o":["hypotensive shock.","hypertensive crisis.","cardiac dysrhythmia.","cardiogenic shock."],"a":[1],"r":"Patients taking MAO-inhibiting drugs must be on a tyramine-free diet to prevent hypertensive crisis. In the presence of MAOIs, tyramine is not destroyed by the liver and in high levels produces intense vasoconstriction, resulting in elevated blood pressure.","med":true},{"c":14,"n":29,"s":"Transcranial Magnetic Stimulation (TCM) is scheduled for a patient diagnosed with major depression. Which comment by the patient indicates teaching about the procedure was effective?","m":false,"rw":false,"o":["They will put me to sleep during the procedure so I won't know what is happening.","I might be a little dizzy or have a mild headache after each procedure.","I will be unable to care for my children for about 2 months.","I will avoid eating foods that contain tyramine."],"a":[1],"r":"Transcranial Magnetic Stimulation (TCM) treatments take about 30 minutes. Treatments are usually 5 days a week. Patients are awake and alert during the procedure. After the procedure, patients may experience a headache and lightheadedness. No neurological deficits or memory problems have been noted. The patient will be able to care for children.","med":true},{"c":14,"n":30,"s":"The admission note says a patient with major depression has anergia and anhedonia. For which measure should the nurse plan?","m":false,"rw":true,"o":["Channeling excessive energy","Reducing guilty ruminations","Scheduling vigorous competitive activities","Assisting with self-care activities"],"a":[3],"r":"Anergia is lack of energy and anhedonia is loss of pleasure, so plan to assist with ADLs, accommodate psychomotor retardation and instill hope. Anergia is not excess energy, anhedonia doesn't imply guilty ruminations, and competitive activities are too demanding.","med":false},{"c":14,"n":31,"s":"A student nurse reads in a depressed patients record, This patient shows vegetative signs of depression. Which nursing diagnosis most clearly relates to vegetative signs?","m":false,"rw":true,"o":["Chronic low self-esteem","Insomnia","Powerlessness","Hopelessness"],"a":[1],"r":"Vegetative signs are changes in body processes that support life: eating, sleeping, elimination and sexual activity (so imbalanced nutrition, sexual dysfunction and self-care deficit also relate). The distractors describe feelings about the self.","med":false},{"c":14,"n":32,"s":"A patient with major depression shows vegetative signs of depression. Which nursing action should be implemented?","m":false,"rw":true,"o":["Eliminate all daily caffeine intake.","Monitor food and fluid intake.","Restrict intake of processed foods.","Encourage long daytime naps."],"a":[1],"r":"Monitoring intake supports nutrition and elimination; offering laxatives as needed and a quiet sleep environment are also appropriate. Small amounts of caffeine can be useful stimulation, there's no reason to restrict processed foods, and daytime naps worsen night sleep.","med":false},{"c":14,"n":33,"s":"A patient taking paroxetine (Paxil) 50 mg daily tells the clinic nurse, I took a few extra tablets earlier today and now I feel bad. Which assessment is most critical?","m":false,"rw":true,"o":["Urinary frequency","Psychomotor retardation","Appetite changes","Vital signs"],"a":[3],"r":"The patient took more than the maximum SSRI dose, so serotonin syndrome must be considered: tachycardia, high BP, hyperpyrexia, plus abdominal pain, diarrhea, restlessness, increased motor activity and muscle spasms. It can become a medical emergency. Urinary retention, not frequency, might occur.","med":true},{"c":15,"n":1,"s":"A nurse wants to teach alternative coping strategies to a patient experiencing severe anxiety. Which action should the nurse perform first?","m":false,"rw":false,"o":["Verify the patients learning style.","Lower the patients current anxiety.","Create outcomes and a teaching plan.","Assess how the patient uses defense mechanisms."],"a":[1],"r":"A patient experiencing severe anxiety has a markedly narrowed perceptual field and difficulty attending to events in the environment. A patient experiencing severe anxiety will not learn readily. Determining preferred modes of learning, devising outcomes, and constructing teaching plans are relevant to the task but are not the priority measure. The nurse has already assessed the patients anxiety level. Use of defense mechanisms does not apply.","med":false},{"c":15,"n":2,"s":"A woman is 57, 160 lbs, and wears a size 8 shoe. She says, My feet are huge. I've asked three orthopedists to surgically reduce my feet. This person tries to buy shoes to make her feet look smaller and, in social settings, conceals both feet under a table or chair. Which health problem is likely?","m":false,"rw":false,"o":["Social anxiety disorder","Body dysmorphic disorder","Separation anxiety disorder","Obsessive-compulsive disorder due to a medical condition"],"a":[1],"r":"Body dysmorphic disorder refers to a preoccupation with an imagined defect in appearance in a normal\u0002appearing person. The patients feet are proportional to the rest of the body. In obsessive-compulsive or related disorder due to a medical condition, the individuals symptoms of obsessions and compulsions are a direct physiological result of a medical condition. Social anxiety disorder, also called social phobia, is characterized by severe anxiety or fear provoked by exposure to a social or a performance situation that will be evaluated negatively by others. People with separation anxiety disorder exhibit developmentally inappropriate levels of concern over being away from a significant other.","med":false},{"c":15,"n":3,"s":"A patient experiencing moderate anxiety says, I feel undone. An appropriate response for the nurse would be:","m":false,"rw":false,"o":["What would you like me to do to help you?","Why do you suppose you are feeling anxious?","I'm not sure I understand. Give me an example.","You must get your feelings under control before we can continue."],"a":[2],"r":"Increased anxiety results in scattered thoughts and an inability to articulate clearly. Clarifying helps the patient identify thoughts and feelings. Asking the patient why he or she feels anxious is non-therapeutic; the patient likely does not have an answer. The patient may be unable to determine what he or she would like the nurse to do in order to help. Telling the patient to get his or her feelings under control is a directive the patient is probably unable to accomplish.","med":false},{"c":15,"n":4,"s":"A patient fearfully runs from chair to chair crying, They're coming! They're coming! The patient does not follow the staffs directions or respond to verbal interventions. The initial nursing intervention of highest priority is to:","m":false,"rw":false,"o":["provide for the patients safety.","encourage clarification of feelings.","respect the patients personal space.","offer an outlet for the patients energy."],"a":[0],"r":"Safety is of highest priority because the patient experiencing panic is at high risk for self-injury related to increased non-goal-directed motor activity, distorted perceptions, and disordered thoughts. Offering an outlet for the patients energy can occur when the current panic level subsides. Respecting the patients personal space is a lower priority than safety. Clarification of feelings cannot take place until the level of anxiety is lowered.","med":false},{"c":15,"n":5,"s":"A patient fearfully runs from chair to chair crying, They're coming! They're coming! The patient does not follow the staffs directions or respond to verbal interventions. Which nursing diagnosis has the highest priority?","m":false,"rw":false,"o":["Fear","Risk for injury","Self-care deficit","Disturbed thought processes"],"a":[1],"r":"A patient experiencing panic-level anxiety is at high risk for injury related to increased non-goal-directed motor activity, distorted perceptions, and disordered thoughts. Data are not present to support a nursing diagnosis of self-care deficit or disturbed thought processes. The patient may have fear, but the risk for injury has a higher priority.","med":false},{"c":15,"n":6,"s":"A patient checks and rechecks electrical cords related to an obsessive thought that the house may burn down. The nurse and patient explore the likelihood of an actual fire. The patient states this event is not likely. This counseling demonstrates principles of:","m":false,"rw":false,"o":["flooding.","desensitization.","relaxation technique.","cognitive restructuring."],"a":[3],"r":"Cognitive restructuring involves the patient in testing automatic thoughts and drawing new conclusions. Desensitization involves graduated exposure to a feared object. Relaxation training teaches the patient to produce the opposite of the stress response. Flooding exposes the patient to a large amount of an undesirable stimulus in an effort to extinguish the anxiety response.","med":false},{"c":15,"n":7,"s":"A patient undergoing diagnostic tests says, Nothing is wrong with me except a stubborn chest cold. The spouse reports the patient smokes, coughs daily, lost 15 pounds, and is easily fatigued. Which defense mechanism is the patient using?","m":false,"rw":false,"o":["Displacement","Regression","Projection","Denial"],"a":[3],"r":"Denial is an unconscious blocking of threatening or painful information or feelings. Regression involves using behaviors appropriate at an earlier stage of psychosexual development. Displacement shifts feelings to a more neutral person or object. Projection attributes ones own unacceptable thoughts or feelings to another.","med":false},{"c":15,"n":8,"s":"A patient with an abdominal mass is scheduled for a biopsy. The patient has difficulty understanding the nurses comments and asks, What do you mean? What are they going to do? Assessment findings include tremulous voice, respirations 28, and pulse 110. What is the patients level of anxiety?","m":false,"rw":false,"o":["Mild","Moderate","Severe","Panic"],"a":[1],"r":"Moderate anxiety causes the individual to grasp less information and reduces problem-solving ability to a less\u0002than-optimal level. Mild anxiety heightens attention and enhances problem solving. Severe anxiety causes great reduction in the perceptual field. Panic-level anxiety results in disorganized behavior.","med":false},{"c":15,"n":9,"s":"A patient preparing for surgery has moderate anxiety and is unable to understand preoperative information. Which nursing intervention is most appropriate?","m":false,"rw":false,"o":["Reassure the patient that all nurses are skilled in providing postoperative care.","Present the information again in a calm manner using simple language.","Tell the patient that staff is prepared to promote recovery.","Encourage the patient to express feelings to family."],"a":[1],"r":"Giving information in a calm, simple manner will help the patient grasp the important facts. Introducing extraneous topics as described in the distracters will further scatter the patients attention.","med":false},{"c":15,"n":10,"s":"A patient is experiencing moderate anxiety. The nurse encourages the patient to talk about feelings and concerns. What is the rationale for this intervention?","m":false,"rw":false,"o":["Offering hope allays and defuses the patients anxiety.","Concerns stated aloud become less overwhelming and help problem solving begin.","Anxiety is reduced by focusing on and validating what is occurring in the environment.","Encouraging patients to explore alternatives increases the sense of control and lessens anxiety."],"a":[1],"r":"All principles listed are valid, but the only rationale directly related to the intervention of assisting the patient to talk about feelings and concerns is the one that states that concerns spoken aloud become less overwhelming and help problem solving begin.","med":false},{"c":15,"n":11,"s":"A nurse assesses a patient with a tentative diagnosis of generalized anxiety disorder. Which question would be most appropriate for the nurse to ask?","m":false,"rw":false,"o":["Have you been a victim of a crime or seen someone badly injured or killed?","Do you feel especially uncomfortable in social situations involving people?","Do you repeatedly do certain things over and over again?","Do you find it difficult to control your worrying?"],"a":[3],"r":"Patients with generalized anxiety disorder frequently engage in excessive worrying. They are less likely to engage in ritualistic behavior, fear social situations, or have been involved in a highly traumatic event.","med":false},{"c":15,"n":12,"s":"A patient in the emergency department shows disorganized behavior and incoherence after a friend suggested a homosexual encounter. In which room should the nurse place the patient?","m":false,"rw":false,"o":["An interview room furnished with a desk and two chairs","A small, empty storage room with no windows or furniture","A room with an examining table, instrument cabinets, desk, and chair","The nurses office, furnished with chairs, files, magazines, and bookcases"],"a":[0],"r":"Individuals experiencing severe to panic-level anxiety require a safe environment that is quiet, non-stimulating structured, and simple. A room with a desk and two chairs provides simplicity, few objects with which the patient could cause self-harm, and a small floor space in which the patient can move about. A small, empty storage room without windows or furniture would feel like a jail cell. The nurses office or a room with an examining table and instrument cabinets may be over-stimulating and unsafe.","med":false},{"c":15,"n":13,"s":"A person has minor physical injuries after an auto accident. The person is unable to focus and says, I feel like something awful is going to happen. This person has nausea, dizziness, tachycardia, and hyperventilation. What is the persons level of anxiety?","m":false,"rw":false,"o":["Mild","Moderate","Severe","Panic"],"a":[2],"r":"The person whose anxiety is severe is unable to solve problems and may have a poor grasp of what is happening in the environment. Somatic symptoms such as those described are usually present. The individual with mild anxiety is only mildly uncomfortable and may even find his or her performance enhanced. The individual with moderate anxiety grasps less information about a situation and has some difficulty with problem solving. The individual in panic will demonstrate markedly disturbed behavior and may lose touch with reality.","med":false},{"c":15,"n":14,"s":"Two staff nurses applied for a charge nurse position. After the promotion was announced, the nurse who was not promoted said, The nurse manager had a headache the day I was interviewed. Which defense mechanism is evident?","m":false,"rw":false,"o":["Introjection","Conversion","Projection","Splitting"],"a":[2],"r":"Projection is the hallmark of blaming, scapegoating, prejudicial thinking, and stigmatizing others. Conversion involves the unconscious transformation of anxiety into a physical symptom. Introjection involves intense, unconscious identification with another person. Splitting is the inability to integrate the positive and negative qualities of oneself or others into a cohesive image.","med":false},{"c":15,"n":15,"s":"A patient tells a nurse, My new friend is the most perfect person one could imagine: kind, considerate, and good-looking. I can't find a single flaw. This patient is demonstrating:","m":false,"rw":false,"o":["denial.","projection.","idealization.","compensation."],"a":[2],"r":"Idealization is an unconscious process that occurs when the individual attributes exaggerated positive qualities to another. Denial is an unconscious process that would call for the nurse to ignore the existence of the situation. Projection operates unconsciously and would result in blaming behavior. Compensation would result in the nurse unconsciously attempting to make up for a perceived weakness by emphasizing a strong point.","med":false},{"c":15,"n":16,"s":"A patient experiences a sudden episode of severe anxiety. Of these medications in the patients medical record, which is most appropriate to give as a prn anxiolytic?","m":false,"rw":false,"o":["buspirone (BuSpar)","lorazepam (Ativan)","amitriptyline (Elavil)","desipramine (Norpramin)"],"a":[1],"r":"Lorazepam is a benzodiazepine used to treat anxiety. It may be given as a prn medication. Buspirone is long acting and is not useful as a prn drug. Amitriptyline and desipramine are tricyclic antidepressants and considered second- or third-line agents.","med":true},{"c":15,"n":17,"s":"Two staff nurses applied for promotion to nurse manager. The nurse not promoted initially had feelings of loss but then became supportive of the new manager by helping make the transition smooth and encouraging others. Which term best describes the nurses response?","m":false,"rw":false,"o":["Altruism","Suppression","Intellectualization","Reaction formation"],"a":[0],"r":"Altruism is the mechanism by which an individual deals with emotional conflict by meeting the needs of others and receiving gratification vicariously or from the responses of others. The nurses reaction is conscious rather than unconscious. There is no evidence of suppression. Intellectualization is a process in which events are analyzed based on remote, cold facts and without passion, rather than incorporating feeling and emotion into the processing. Reaction formation is when unacceptable feelings or behaviors are controlled and kept out of awareness by developing the opposite behavior or emotion.","med":false},{"c":15,"n":18,"s":"A person who feels unattractive repeatedly says, Although I'm not beautiful, I am smart. This is an example of:","m":false,"rw":false,"o":["repression.","devaluation.","identification.","compensation."],"a":[3],"r":"Compensation is an unconscious process that allows us to make up for deficits in one area by excelling in another area to raise self-esteem. Repression unconsciously puts an idea, event, or feeling out of awareness. Identification is an unconscious mechanism calling for imitation of mannerisms or behaviors of another. Devaluation occurs when the individual attributes negative qualities to self or others.","med":false},{"c":15,"n":19,"s":"A person speaking about a rival for a significant others affection says in an emotional, syrupy voice, What a lovely person. That's someone I simply adore. The individual is demonstrating:","m":false,"rw":false,"o":["reaction formation.","repression.","projection.","denial."],"a":[0],"r":"Reaction formation is an unconscious mechanism that keeps unacceptable feelings out of awareness by using the opposite behavior. Instead of expressing hatred for the other person, the individual gives praise. Denial operates unconsciously to allow an anxiety-producing idea, feeling, or situation to be ignored. Projection involves unconsciously disowning an unacceptable idea, feeling, or behavior by attributing it to another. Repression involves unconsciously placing an idea, feeling, or event out of awareness.","med":false},{"c":15,"n":20,"s":"An individual experiences sexual dysfunction and blames it on a partner by calling the person unattractive and unromantic. Which defense mechanism is evident?","m":false,"rw":false,"o":["Rationalization","Compensation","Introjection","Regression"],"a":[0],"r":"Rationalization involves unconsciously making excuses for ones behavior, inadequacies, or feelings. Regression involves the unconscious use of a behavior from an earlier stage of emotional development. Compensation involves making up for deficits in one area by excelling in another area. Introjection is an unconscious, intense identification with another person.","med":false},{"c":15,"n":21,"s":"A student says, Before taking a test, I feel very alert and a little restless. The nurse can correctly assess the students experience as:","m":false,"rw":false,"o":["culturally influenced.","displacement.","trait anxiety.","mild anxiety."],"a":[3],"r":"Mild anxiety is rarely obstructive to the task at hand. It may be helpful to the patient because it promotes study and increases awareness of the nuances of questions. The incorrect responses have different symptoms. See relationship to audience response question.","med":false},{"c":15,"n":22,"s":"A student says, Before taking a test, I feel very alert and a little restless. Which nursing intervention is most appropriate to assist the student?","m":false,"rw":false,"o":["Explain that the symptoms result from mild anxiety and discuss the helpful aspects.","Advise the student to discuss this experience with a health care provider.","Encourage the student to begin antioxidant vitamin supplements.","Listen attentively, using silence in a therapeutic way."],"a":[0],"r":"Teaching about symptoms of anxiety, their relation to precipitating stressors, and, in this case, the positive effects of anxiety will serve to reassure the patient. Advising the patient to discuss the experience with a health care provider implies that the patient has a serious problem. Listening without comment will do no harm but deprives the patient of health teaching. Antioxidant vitamin supplements are not useful in this scenario.","med":false},{"c":15,"n":23,"s":"A cruel and abusive person often uses rationalization to explain the behavior. Which comment demonstrates use of this defense mechanism?","m":false,"rw":false,"o":["I don't know why I do mean things.","I have always had poor impulse control.","That person should not have provoked me.","I'm really a coward who is afraid of being hurt."],"a":[2],"r":"Rationalization consists of justifying ones unacceptable behavior by developing explanations that satisfy the teller and attempt to satisfy the listener. The abuser is suggesting that the abuse is not his or her fault; it would not have occurred except for the provocation by the other person. The distracters indicate some measure of acceptance of responsibility for the behavior.","med":false},{"c":15,"n":24,"s":"A patient experiencing panic suddenly began running and shouting, I'm going to explode! Select the nurse's best action.","m":false,"rw":false,"o":["Ask, I'm not sure what you mean. Give me an example.","Capture the patient in a basket-hold to increase feelings of control.","Tell the patient, Stop running and take a deep breath. I will help you.","Assemble several staff members and say, We will take you to seclusion to help you regain control."],"a":[2],"r":"Safety needs of the patient and other patients are a priority. Comments to the patient should be simple, neutral, and give direction to help the patient regain control. Running after the patient will increase the patients anxiety More than one staff member may be needed to provide physical limits, but using seclusion or physically restraining the patient prematurely is unjustified. Asking the patient to give an example would be futile; a patient in panic processes information poorly.","med":false},{"c":15,"n":25,"s":"A person who has been unable to leave home for more than a week because of severe anxiety says, I know it does not make sense, but I just can't bring myself to leave my apartment alone. Which nursing intervention is appropriate?","m":false,"rw":false,"o":["Help the person use online video calls to provide interaction with others.","Advise the person to accept the situation and use a companion.","Ask the person to explain why the fear is so disabling.","Teach the person to use positive self-talk techniques."],"a":[3],"r":"Positive self-talk, a form of cognitive restructuring, replaces negative thoughts such as I can't leave my apartment with positive thoughts such as I can control my anxiety. This technique helps the patient gain mastery over the symptoms. The other options reinforce the sick role.","med":false},{"c":15,"n":26,"s":"A nurse assesses an individual who commonly experiences anxiety. Which comment by this person indicates the possibility of obsessive-compulsive disorder?","m":false,"rw":false,"o":["I check where my car keys are eight times.","My legs often feel weak and spastic.","I'm embarrassed to go out in public.","I keep reliving a car accident."],"a":[0],"r":"Recurring doubt (obsessive thinking) and the need to check (compulsive behavior) suggest obsessive\u0002compulsive disorder. The repetitive behavior is designed to decrease anxiety but fails and must be repeated. Stating My legs feel weak most of the time is more in keeping with a somatic disorder. Being embarrassed to go out in public is associated with an avoidant personality disorder. Reliving a traumatic event is associated with posttraumatic stress disorder. See relationship to audience response question.","med":false},{"c":15,"n":27,"s":"When alprazolam (Xanax) is prescribed for a patient who experiences acute anxiety, health teaching should include instructions to:","m":false,"rw":false,"o":["report drowsiness.","eat a tyramine-free diet.","avoid alcoholic beverages.","adjust dose and frequency based on anxiety level."],"a":[2],"r":"Drinking alcohol or taking other anxiolytics along with the prescribed benzodiazepine should be avoided because depressant effects of both drugs will be potentiated. Tyramine-free diets are necessary only with monoamine oxidase inhibitors (MAOIs). Drowsiness is an expected effect and needs to be reported only if it is excessive. Patients should be taught not to deviate from the prescribed dose and schedule for administration.","med":true},{"c":15,"n":28,"s":"The nurse assesses a patient who complains of loneliness and episodes of anxiety. Which statement by the patient is mostly likely if this patient also has agoraphobia?","m":false,"rw":false,"o":["I'm sure I will get over not wanting to leave home soon. It takes time.","Being afraid to go out seems ridiculous, but I can't go out the door.","My family says they like it now that I stay home most of the time.","When I have a good incentive to go out, I can do it."],"a":[1],"r":"Individuals who are agoraphobic generally acknowledge that the behavior is not constructive and that they do not really like it. The symptom is ego dystonic. However, patients will state they are unable to change the behavior. Agoraphobics are not optimistic about change. Most families are dissatisfied when family members refuse to leave the house.","med":false},{"c":15,"n":29,"s":"A patient diagnosed with obsessive-compulsive disorder has this nursing diagnosis: Anxiety related to as evidenced by inability to control compulsive cleaning. Which phrase correctly completes the etiological portion of the diagnosis?","m":false,"rw":false,"o":["feelings of responsibility for the health of family members","approval-seeking behavior from friends and family","persistent thoughts about bacteria, germs, and dirt","needs to avoid interactions with others"],"a":[2],"r":"Many compulsive rituals accompany obsessive thoughts. The patient uses these rituals for anxiety relief. Unfortunately, the anxiety relief is short lived, and the patient must frequently repeat the ritual. The other options are unrelated to the dynamics of compulsive behavior. See relationship to audience response question.","med":false},{"c":15,"n":30,"s":"A patient performs ritualistic hand washing. Which action should the nurse implement to help the patient develop more effective coping?","m":false,"rw":false,"o":["Allow the patient to set a hand-washing schedule.","Encourage the patient to participate in social activities.","Encourage the patient to discuss hand-washing routines.","Focus on the patients symptoms rather than on the patient."],"a":[1],"r":"Because obsessive-compulsive patients become overly involved in the rituals, promotion of involvement with other people and activities is necessary to improve coping. Daily activities prevent constant focus on anxiety and symptoms. The other interventions focus on the compulsive symptom. See relationship to audience response question.","med":false},{"c":15,"n":31,"s":"For a patient experiencing panic, which nursing intervention should be implemented first?","m":false,"rw":false,"o":["Teach relaxation techniques.","Administer an anxiolytic medication.","Prepare to implement physical controls.","Provide calm, brief, directive communication."],"a":[3],"r":"Calm, brief, directive verbal interaction can help the patient gain control of overwhelming feelings and impulses related to anxiety. Patients experiencing panic-level anxiety are unable to focus on reality; thus, learning relaxation techniques is virtually impossible. Administering anxiolytic medication should be considered if providing calm, brief, directive communication is ineffective. Although the patient is disorganized, violence may not be imminent, ruling out the intervention of preparing for physical control until other less-restrictive measures are proven ineffective.","med":true},{"c":15,"n":32,"s":"A child removed from abusive parents is apprehensive and overreacts to stimuli in the foster home. Which intervention should the nurse suggest to the foster parents?","m":false,"rw":true,"o":["Use a calm manner and a low voice.","Avoid repeating what is said to the child.","Minimize opportunities for exercise and play.","Keep the home busy to distract the child."],"a":[0],"r":"The child has moderate anxiety. A calm manner, a simple and predictable environment, and calm explanations that reinforce reality all lower anxiety. Repetition is often needed because anxiety impairs concentration; play and exercise help channel anxiety; a busy home overstimulates.","med":false},{"c":15,"n":33,"s":"A nurse plans teaching for a patient with generalized anxiety disorder starting lorazepam (Ativan). Which information should be included?","m":false,"rw":true,"o":["Foods allowed on a tyramine-free diet","Take the medication on an empty stomach.","Avoid alcohol and other sedatives.","Increase caffeine intake to counter drowsiness."],"a":[2],"r":"Benzodiazepines are CNS depressants; alcohol and sedatives potentiate them. Also teach caution with driving or machinery and caffeine restriction (caffeine counteracts the drug). No special diet is needed, and food reduces GI irritation.","med":true},{"c":15,"n":34,"s":"Which assessment question is most appropriate for a patient with possible obsessive-compulsive disorder?","m":false,"rw":true,"o":["Are there certain social situations that make you especially uncomfortable?","Have you been a victim of a crime or seen someone badly injured or killed?","Do you do certain things over and over again?","Do you have trouble falling asleep at night?"],"a":[2],"r":"This question targets compulsions. Asking about intrusive thoughts and family members who must do things a certain way (genetic link) also fits OCD. The social-situation question fits social phobia; the trauma question fits PTSD.","med":false},{"c":15,"n":35,"s":"The nurse assesses an adult who is socially withdrawn and hoards. Which nursing diagnosis most likely applies?","m":false,"rw":true,"o":["Ineffective home maintenance","Disturbed body image","Situational low self-esteem","Impaired verbal communication"],"a":[0],"r":"Hoarding causes problems maintaining the home, which can lead to injury (risk for injury also applies). It is usually associated with chronic, not situational, low self-esteem. Body image is not affected.","med":false},{"c":17,"n":1,"s":"Which assessment data would help the health care team distinguish symptoms of conversion (functional neurological) disorder from symptoms of illness anxiety disorder (hypochondriasis)?","m":false,"rw":false,"o":["Voluntary control of symptoms","Patients style of presentation","Results of diagnostic testing","The role of secondary gains"],"a":[1],"r":"Patients with illness anxiety disorder (hypochondriasis) tend to be more anxious about their concerns and display more obsessive attention to detail, whereas the patient with conversion (functional neurological) disorder often exhibits less concern with the symptom they are presenting than would be expected. Neither disorder involves voluntary control of the symptoms. Results of diagnostic testing for both would be negative (i.e., no physiological basis would be found for the symptoms). Secondary gains can occur in both disorders but are not necessary to either. See relationship to audience response question.","med":false},{"c":17,"n":2,"s":"Which prescription medication would the nurse expect to be prescribed for a patient diagnosed with a somatic symptom disorder?","m":false,"rw":false,"o":["Narcotic analgesics for use as needed for acute pain","Antidepressant medications to treat underlying depression","Long-term use of benzodiazepines to support coping with anxiety","Conventional antipsychotic medications to correct cognitive distortions"],"a":[1],"r":"Various types of antidepressants may be helpful in somatic disorders directly by reducing depressive symptoms and hence somatic responses, but also indirectly by affecting nerve circuits that affect not only mood, but fatigue, pain perception, GI distress, and other somatic symptoms. Patients may benefit from short\u0002term use of anti-anxiety medication (benzodiazepines) but require careful monitoring because of risks of dependence. Conventional antipsychotic medications would not be used, although selected atypical antipsychotics may be useful. Narcotic analgesics are not indicated.","med":true},{"c":17,"n":3,"s":"A medical-surgical nurse works with a patient diagnosed with a somatic symptom disorder. Care planning is facilitated by understanding that the patient will probably:","m":false,"rw":false,"o":["readily seek psychiatric counseling.","be resistant to accepting psychiatric help.","attend psychotherapy sessions without encouragement.","be eager to discover the true reasons for physical symptoms."],"a":[1],"r":"Patients with somatic symptom disorders go from one health care provider to another trying to establish a physical cause for their symptoms. When a psychological basis is suggested and a referral for counseling offered, these patients reject both.","med":false},{"c":17,"n":4,"s":"A patient has blindness related to conversion (functional neurological) disorder but is unconcerned about this problem. Which understanding should guide the nurses planning for this patient?","m":false,"rw":false,"o":["The patient is suppressing accurate feelings regarding the problem.","The patients anxiety is relieved through the physical symptom.","The patients optic nerve transmission has been impaired.","The patient will not disclose genuine fears."],"a":[1],"r":"Psychoanalytical theory suggests conversion reduces anxiety through production of a physical symptom symbolically linked to an underlying conflict. Conversion, not suppression, is the operative defense mechanism in this disorder. While some MRI studies suggest that patients with conversion disorder have an abnormal pattern of cerebral activation, there is no actual alternation of nerve transmission. The other distracters oversimplify the dynamics, suggesting that only dependency needs are of concern, or suggest conscious motivation (conversion operates unconsciously). See relationship to audience response question.","med":false},{"c":17,"n":5,"s":"A patient has blindness related to conversion (functional neurological) disorder. To help the patient eat, the nurse should:","m":false,"rw":false,"o":["establish a buddy system with other patients who can feed the patient at each meal.","expect the patient to feed self after explaining arrangement of the food on the tray.","direct the patient to locate items on the tray independently and feed self.","address needs of other patients in the dining room, then feed this patient."],"a":[1],"r":"The patient is expected to maintain some level of independence by feeding self, while the nurse is supportive in a matter-of-fact way. The distracters support dependency or offer little support.","med":false},{"c":17,"n":6,"s":"A patient with blindness related to conversion (functional neurological) disorder says, All the doctors and nurses in the hospital stop by often to check on me. Too bad people outside the hospital don't find me as interesting. Which nursing diagnosis is most relevant?","m":false,"rw":false,"o":["Social isolation","Chronic low self-esteem","Interrupted family processes","Ineffective health maintenance"],"a":[1],"r":"The patient mentions that the symptoms make people more interested. This indicates that the patient feels uninteresting and unpopular without the symptoms, thus supporting the nursing diagnosis of chronic low self\u0002esteem. Defining characteristics for the other nursing diagnoses are not present in the scenario.","med":false},{"c":17,"n":7,"s":"To assist patients diagnosed with somatic symptom disorders, nursing interventions of high priority:","m":false,"rw":false,"o":["explain the pathophysiology of symptoms.","help these patients suppress feelings of anger.","shift focus from somatic symptoms to feelings.","investigate each physical symptom as it is reported."],"a":[2],"r":"Shifting the focus from somatic symptoms to feelings or to neutral topics conveys interest in the patient as a person rather than as a condition. The need to gain attention with the use of symptoms is reduced over the long term. A desired outcome would be that the patient would express feelings, including anger if it is present. Once physical symptoms are investigated, they do not need to be reinvestigated each time the patient reports them.","med":false},{"c":17,"n":8,"s":"A patient with fears of serious heart disease was referred to the mental health center by a cardiologist. Extensive diagnostic evaluation showed no physical illness. The patient says, My chest is tight, and my heart misses beats. I'm often absent from work. I don't go out much because I need to rest. Which health problem is most likely?","m":false,"rw":false,"o":["Dysthymic disorder","Somatic symptom disorder","Antisocial personality disorder","Illness anxiety disorder (hypochondriasis)"],"a":[3],"r":"Illness anxiety disorder (hypochondriasis) involves preoccupation with fears of having a serious disease even when evidence to the contrary is available. The preoccupation causes impairment in social or occupational functioning. Somatic symptom disorder involves fewer symptoms. Dysthymic disorder is a disorder of lowered mood. Antisocial disorder applies to a personality disorder in which the individual has little regard for the rights of others. See relationship to audience response question.","med":false},{"c":17,"n":9,"s":"A nurse assessing a patient diagnosed with a somatic symptom disorder is most likely to note that the patient:","m":false,"rw":false,"o":["sees a relationship between symptoms and interpersonal conflicts.","has little difficulty communicating emotional needs to others.","rarely derives personal benefit from the symptoms.","has altered comfort and activity needs."],"a":[3],"r":"The patient frequently has altered comfort and activity needs associated with the symptoms displayed (fatigue, insomnia, weakness, tension, pain, etc.). In addition, hygiene, safety, and security needs may also be compromised. The patient is rarely able to see a relation between symptoms and events in his or her life, which is readily discernible to health professionals. Patients with somatic symptom disorders often derive secondary gain from their symptoms and/or have considerable difficulty identifying feelings and conveying emotional needs to others.","med":false},{"c":17,"n":10,"s":"To plan effective care for patients diagnosed with somatic symptom disorders, the nurse should understand that patients have difficulty giving up the symptoms because the symptoms:","m":false,"rw":false,"o":["are generally chronic.","have a physiological basis.","can be voluntarily controlled.","provide relief from health anxiety."],"a":[3],"r":"At the unconscious level, the patients primary gain from the symptoms is anxiety relief. Considering that the symptoms actually make the patient more psychologically comfortable and may also provide secondary gain, patients frequently fiercely cling to the symptoms. The symptoms tend to be chronic, but that does not explain why they are difficult to give up. The symptoms are not under voluntary control or physiologically based.","med":false},{"c":17,"n":11,"s":"A patient with a somatic symptom disorder has the nursing diagnosis Interrupted family processes related to patients disabling symptoms as evidenced by spouse and children assuming roles and tasks that previously belonged to patient. An appropriate outcome is that the patient will:","m":false,"rw":false,"o":["assume roles and functions of other family members.","demonstrate performance of former roles and tasks.","focus energy on problems occurring in the family.","rely on family members to meet personal needs."],"a":[1],"r":"The patient with a somatic symptom disorder has typically adopted a sick role in the family, characterized by dependence. Increasing independence and resumption of former roles are necessary to change this pattern. The distracters are inappropriate outcomes.","med":false},{"c":17,"n":12,"s":"Which comment by a patient who recently experienced a myocardial infarction indicates use of maladaptive, ineffective coping strategies?","m":false,"rw":false,"o":["My employer should have paid for a health club membership for me.","My family will see me through this. It won't be easy, but I will never be alone.","My heart attack was no fun, but it showed me up the importance of a good diet and more exercise.","I accept that I have heart disease. Now I need to decide if I will be able to continue my work daily."],"a":[0],"r":"Blaming someone else and rationalizing ones failure to exercise are not adaptive coping strategies. Seeing the glass as half full, using social and religious supports, and confronting ones situation are seen as more effective strategies. The distracters demonstrate effective coping associated with a serious medical condition.","med":false},{"c":17,"n":13,"s":"A nurse assesses a patient diagnosed with conversion (functional neurological) disorder. Which comment is most likely from this patient?","m":false,"rw":false,"o":["Since my father died, I've been short of breath and had sharp pains that go down my left arm, but I think its just indigestion.","I have daily problems with nausea, vomiting, and diarrhea. My skin is very dry, and I think I'm getting seriously dehydrated.","Sexual intercourse is painful. I pretend as if I'm asleep so I can avoid it. I think its starting to cause problems with my marriage.","I get choked very easily and have trouble swallowing when I eat. I think I might have cancer of the esophagus."],"a":[0],"r":"Patients with conversion (functional neurological) disorder demonstrate a lack of concern regarding the seriousness of symptoms. This lack of concern is termed la belle indiffrence. There is also a specific, identifiable cause for the development of the symptoms; in this instance, the death of a parent would precipitate stress. The distracters relate to sexual dysfunction and illness anxiety disorder.","med":false},{"c":17,"n":14,"s":"A patient who experienced a myocardial infarction was transferred from critical care to a step-down unit. The patient then used the call bell every 15 minutes for minor requests and complaints. Staff nurses reported feeling inadequate and unable to satisfy the patients needs. When the nurse manager intervenes directly with this patient, which comment is most therapeutic?","m":false,"rw":false,"o":["I'm wondering if you are feeling anxious about your illness and being left alone.","The staff are concerned that you are not satisfied with the care you are receiving.","Let's talk about why you use your call light so frequently. It is a problem.","You frustrate the staff by calling them so often. Why are you doing that?"],"a":[0],"r":"This patient is experiencing anxiety associated with a serious medical condition. Verbalization is an effective outlet for anxiety. I'm wondering if you are anxious focuses on the emotions underlying the behavior rather than the behavior itself. This opening conveys the nurses willingness to listen to the patients feelings and an understanding of the commonly seen concern about not having a nurse always nearby as in the intensive care unit. The other options focus on the behavior or its impact on nursing and do not help the patient with her emotional needs.","med":false},{"c":17,"n":15,"s":"A patient reports fears of having cervical cancer and says to the nurse, I've had Pap smears by six different doctors. The results were normal, but I'm sure that's because of errors in the laboratory. Which disorder would the nurse suspect?","m":false,"rw":false,"o":["Conversion (functional neurological) disorder","Illness anxiety disorder (hypochondriasis)","Somatic symptom disorder","Factitious disorder"],"a":[1],"r":"Patients with illness anxiety disorder have fears of serious medical problems, such as cancer or heart disease. These fears persist despite medical evaluations and interfere with daily functioning. There are no complaints of pain. There is no evidence of factitious or conversion disorder.","med":false},{"c":17,"n":16,"s":"A patient diagnosed with a somatic symptom disorder says, My pain is from an undiagnosed injury. I can't take care of myself. I need pain medicine six or seven times a day. I feel like a baby because my family has to help me so much. It is important for the nurse to assess:","m":false,"rw":false,"o":["mood.","cognitive style.","secondary gains.","identity and memory."],"a":[2],"r":"Secondary gains should be assessed. The patients dependency needs may be met through care from the family. When secondary gains are prominent, the patient is more resistant to giving up the symptom. The scenario doe not allude to a problem of mood. Cognitive style and identity and memory assessment are of lesser concern because the patients diagnosis has been established.","med":false},{"c":17,"n":17,"s":"What is an essential difference between somatic symptom disorders and factitious disorders?","m":false,"rw":false,"o":["Somatic symptom disorders are under voluntary control, whereas factitious disorders are unconscious and automatic.","Factitious disorders are precipitated by psychological factors, whereas somatic symptom disorders are related to stress.","Factitious disorders are individually determined and related to childhood sexual abuse, whereas somatic symptom disorders are culture bound.","Factitious disorders are under voluntary control, whereas somatic symptom disorders involve expression of psychological stress through somatization."],"a":[3],"r":"The key is the only fully accurate statement. Somatic symptom disorders involve expression of stress through bodily symptoms and are not under voluntary control or culture bound. Factitious disorders are under voluntary control. See relationship to audience response question.","med":false},{"c":17,"n":18,"s":"A patient says, I know I have a brain tumor despite the results of the MRI. The radiologist is wrong. People who have brain tumors vomit, and yesterday I vomited all day. Which response by the nurse fosters cognitive reframing?","m":false,"rw":false,"o":["You do not have a brain tumor. The more you talk about it, the more it reinforces your belief.","Let's see if there are any other possible explanations for your vomiting.","You seem so worried. Let's talk about how you're feeling.","We need to talk about something else."],"a":[1],"r":"Questioning the evidence is a cognitive reframing technique. Identifying causes other than the feared disease can be helpful in changing distorted perceptions. Distraction by changing the subject will not be effective.","med":false},{"c":17,"n":19,"s":"Which treatment modality should a nurse recommend to help a patient diagnosed with a somatic symptom disorder to cope more effectively?","m":false,"rw":false,"o":["Flooding","Response prevention","Relaxation techniques","Systematic desensitization"],"a":[2],"r":"Somatic symptom disorders are commonly associated with complicated reactions to stress. These reactions are accompanied by muscle tension and pain. Relaxation can diminish the patients perceptions of pain and reduce muscle tension. The distracters are modalities useful in treating selected anxiety disorders.","med":false},{"c":17,"n":20,"s":"Which assessment question could a nurse ask to help identify secondary gains associated with a somatic symptom disorder?","m":false,"rw":false,"o":["What are you unable to do now but were previously able to do?","How many doctors have you seen in the last year?","Who do you talk to when you're upset?","Did you experience abuse as a child?"],"a":[0],"r":"Secondary gains should be assessed. Secondary gains reinforce maladaptive behavior. The patients dependency needs may be evident through losses of abilities. When secondary gains are prominent, the patient is more resistant to giving up the symptom. There may be a history of abuse or doctor shopping, but the question does not assess the associated gains.","med":false},{"c":17,"n":21,"s":"A patient diagnosed with a somatic symptom disorder has been in treatment for 4 weeks. The patient says, Although I'm still having pain, I notice it less and am able to perform more activities. The nurse should evaluate the treatment plan as:","m":false,"rw":false,"o":["marginally successful.","minimally successful.","partially successful.","totally achieved."],"a":[2],"r":"Decreased preoccupation with symptoms and increased ability to perform activities of daily living suggest partial success of the treatment plan. Total success is rare because of patient resistance.","med":false},{"c":17,"n":22,"s":"A child with repeated hospitalizations for systemic infections is not improving despite aggressive treatment. Factitious disorder imposed on another (by proxy) is suspected. Which nursing intervention is appropriate?","m":false,"rw":true,"o":["Increase private visiting time for the parents to improve bonding.","Place mittens on the child to reduce access to ports and incisions.","Teach the parents aseptic technique.","Keep careful, detailed records of visitation and untoward events."],"a":[3],"r":"Detailed records reveal patterns between visitors and the child's illness. Small group visits and frequent staff checks during visits also reduce unobserved access. Private visits increase the chance of harm; mittens and aseptic teaching don't address intentional contamination.","med":false},{"c":17,"n":23,"s":"Which presentation suggests factitious disorder, self-directed type?","m":false,"rw":true,"o":["Going from one doctor to another seeking the desired response","History of multiple hospitalizations and procedures with no physical illness found","Claiming illness to obtain financial benefit","Difficulty describing symptoms"],"a":[1],"r":"These clients have many workups and even surgeries with negative findings. They usually stay with one provider rather than doctor-shop, are not motivated by external gain (that's malingering), and describe symptoms in detailed, plausible ways.","med":false},{"c":17,"n":24,"s":"A patient with somatic symptom disorder says, Why has God chosen me to be sick all the time and unable to provide for my family? The burden on my family is worse than the pain I bear. Which nursing diagnosis applies?","m":false,"rw":true,"o":["Decisional conflict","Spiritual distress","Adult failure to thrive","Impaired social interaction"],"a":[1],"r":"Questioning why God chose them reflects spiritual distress. Being unable to provide for the family also supports ineffective role performance. No data support the distractors.","med":false},{"c":17,"n":25,"s":"A nurse assesses a patient suspected of having somatic symptom disorder. Which finding supports the suspected diagnosis?","m":false,"rw":true,"o":["Rates pain as 1 on a scale of 10","First diagnosed with psoriasis at age 12","Male gender","Reports frequent fainting (syncope)"],"a":[3],"r":"Patients report multiple symptoms with no chronic disease to explain them; pseudoneurological symptoms such as syncope are common, as is pain disrupting sleep. The disorder is more common in women. A diagnosed skin disease explains its own symptoms, and underrating pain fits conversion disorder.","med":false},{"c":17,"n":26,"s":"A neighbor asks whether emotional shock can be fatal. The nurse explains that some medical conditions can be complicated by emotional stress. Which condition is NOT typically in this group?","m":false,"rw":true,"o":["Hip fractures","Hypertension","Immune disorders","Cardiovascular disease"],"a":[0],"r":"Intense stress can worsen cancer, hypertension, immune disorders and cardiovascular disease (for example through acute or chronic hypertension). Hip fractures are not in this group.","med":false}];</script><script>
const CH={12:["Ch 12","Schizophrenia","--c12"],13:["Ch 13","Bipolar","--c13"],14:["Ch 14","Depressive","--c14"],15:["Ch 15","Anxiety & OCD","--c15"],17:["Ch 17","Somatic","--c17"]};
const K="psychdrill-v3";
let saved={};try{saved=JSON.parse(localStorage.getItem(K)||"{}")||{}}catch(e){saved={}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(saved))}catch(e){}};
const id=q=>q.c+"-"+q.n;
const st={chaps:new Set([12,13,14,15,17]),f:"all",o:"seq",list:[],i:0,pick:new Set(),done:false,resetArm:false};
const $=s=>document.querySelector(s);
function build(){
 let l=Q.filter(q=>st.chaps.has(q.c));
 if(st.f==="med")l=l.filter(q=>q.med);
 if(st.f==="new")l=l.filter(q=>!(id(q) in saved));
 if(st.f==="miss")l=l.filter(q=>saved[id(q)]===false);
 if(st.o==="shuf"){l=l.slice();for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}}
 st.list=l;st.i=0;reset();render();
}
function reset(){st.pick=new Set();st.done=false}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
 const card=$("#card"),l=st.list;
 $("#pbar").style.width=l.length?((st.i+(st.done?1:0))/l.length*100)+"%":"0";
 if(!l.length){card.innerHTML=`<div class="empty">${st.f==="miss"?"No missed questions in these chapters yet.":st.f==="new"?"You've answered every question in these chapters.":"No questions match these filters."}</div>`;stats();return}
 const q=l[st.i],c=CH[q.c],L="ABCDEF";
 card.style.setProperty("--chc",`var(${c[2]})`);
 let h=`<div class="meta"><span class="tag">${c[0]} · ${c[1]}</span><span>Q${q.n}</span>${q.med?'<span class="medtag">MED</span>':''}${q.rw?'<span class="rwtag" title="Originally select-all-that-apply; rewritten as single-answer">REWRITTEN</span>':''}<span style="margin-left:auto">${st.i+1} of ${l.length}</span></div>`;
 h+=`<p class="stem">${esc(q.s)}</p><div class="opts">`;
 q.o.forEach((o,k)=>{let cls="opt"+(q.m?" multi":"");
  if(st.done){if(q.a.includes(k))cls+=" right";else if(st.pick.has(k))cls+=" wrong"}else if(st.pick.has(k))cls+=" sel";
  h+=`<button class="${cls}" data-k="${k}" ${st.done?"disabled":""} aria-pressed="${st.pick.has(k)}"><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`});
 h+=`</div>`;
 if(st.done){const ok=isOk(q);h+=`<div class="fb ${ok?"ok":"bad"}"><h3>${ok?"Correct":"Not quite"} · Answer: ${q.a.map(k=>L[k]).join(", ")}</h3><p>${esc(q.r)}</p></div>`}
 h+=`<div class="nav"><button class="btn" id="prev" ${st.i===0?"disabled":""}>Previous</button>`;
 h+=st.done?`<button class="btn pri" id="next">${st.i===l.length-1?"Finish":"Next question"}</button>`:`<button class="btn pri" id="check" ${st.pick.size?"":"disabled"}>Check answer</button>`;
 h+=`</div>`;
 card.innerHTML=h;
 card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
  if(q.m){st.pick.has(k)?st.pick.delete(k):st.pick.add(k)}else{st.pick=new Set([k])}render()});
 const ck=$("#check");if(ck)ck.onclick=()=>{st.done=true;if(!(id(q) in saved)){saved[id(q)]=isOk(q);save()}render()};
 const nx=$("#next");if(nx)nx.onclick=()=>{if(st.i<l.length-1){st.i++;reset();render();window.scrollTo({top:card.offsetTop-12,behavior:"smooth"})}else finish()};
 $("#prev").onclick=()=>{if(st.i>0){st.i--;reset();render()}};
 stats();
}
function isOk(q){return st.pick.size===q.a.length&&q.a.every(k=>st.pick.has(k))}
function finish(){
 const ids=st.list.map(id),a=ids.filter(x=>x in saved),r=a.filter(x=>saved[x]).length;
 $("#pbar").style.width="100%";
 $("#card").innerHTML=`<div class="empty"><h2 style="font-family:var(--display);color:var(--ink);margin:0 0 6px">Set finished</h2><p>First-attempt score on this set: <b style="color:var(--ink)">${r} / ${a.length}</b>${a.length?" ("+Math.round(r/a.length*100)+"%)":""}</p><div class="nav" style="justify-content:center;margin-top:12px"><button class="btn pri" id="again">Start over</button><button class="btn" id="missed">Drill missed questions</button></div></div>`;
 $("#again").onclick=build;$("#missed").onclick=()=>setF("miss");
}
function stats(){
 let tot=0,ans=0,ok=0,h="";
 for(const c of [12,13,14,15,17]){const qs=Q.filter(q=>q.c===c),a=qs.filter(q=>id(q) in saved),r=a.filter(q=>saved[id(q)]).length;tot+=qs.length;ans+=a.length;ok+=r;
  h+=`<div class="st" style="--chc:var(${CH[c][2]})"><b>${CH[c][0]} ${CH[c][1]}</b>${r}/${a.length} right · ${qs.length-a.length} left</div>`}
 $("#stats").innerHTML=h;
 $("#score").innerHTML=`<b>${ans?Math.round(ok/ans*100)+"%":"–"}</b>${ok} of ${ans} answered right`;
}
function setF(f){st.f=f;document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===f));build()}
const cw=$("#chaps");
for(const c of [12,13,14,15,17]){const b=document.createElement("button");b.className="chip";b.id="ch-"+c;b.setAttribute("aria-pressed","true");
 b.innerHTML=`<span class="dot" style="background:var(${CH[c][2]})"></span>${CH[c][0]}`;
 b.onclick=()=>{if(st.chaps.has(c)){if(st.chaps.size>1)st.chaps.delete(c)}else st.chaps.add(c);
  document.querySelectorAll("#chaps .chip").forEach(x=>x.setAttribute("aria-pressed",st.chaps.has(+x.id.slice(3))));build()};cw.appendChild(b)}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>setF(b.dataset.f));
document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{st.o=b.dataset.o;document.querySelectorAll("[data-o]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.o===st.o));build()});
$("#reset").onclick=()=>{const b=$("#reset");if(!st.resetArm){st.resetArm=true;b.textContent="Tap again to erase all scores";setTimeout(()=>{st.resetArm=false;b.textContent="Reset scores"},4000);return}
 saved={};save();st.resetArm=false;b.textContent="Reset scores";build()};
build();
</script>

</body></html>
