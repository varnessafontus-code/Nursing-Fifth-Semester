<style>
/* Layout: one centered study column — filter bar, question card, feedback; chapter hue tags every question */
:root{
 --bg:#f3f5f7;--surface:#ffffff;--ink:#16202b;--muted:#5d6b79;--line:#d9e0e7;--accent:#1b5e7a;--accent-ink:#ffffff;
 --ok:#1d7a44;--ok-bg:#e2f4e9;--bad:#b3261e;--bad-bg:#fbe6e4;--med:#b3261e;--note:#eef4f8;
 --c12:#6a45a3;--c13:#1f63b0;--c14:#0f7f76;--c15:#c0610f;--c17:#b0305a;
 --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171d;--surface:#1a222b;--ink:#e6ecf1;--muted:#9aa8b5;--line:#2c3742;--accent:#5fb3d6;--accent-ink:#0b1318;--ok:#5fd18f;--ok-bg:#16362a;--bad:#ff8a80;--bad-bg:#3d1d1b;--med:#ff8a80;--note:#1f2b36;--c12:#b195e0;--c13:#7fb0ec;--c14:#5fcfc4;--c15:#f0a35f;--c17:#ec88a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171d;--surface:#1a222b;--ink:#e6ecf1;--muted:#9aa8b5;--line:#2c3742;--accent:#5fb3d6;--accent-ink:#0b1318;--ok:#5fd18f;--ok-bg:#16362a;--bad:#ff8a80;--bad-bg:#3d1d1b;--med:#ff8a80;--note:#1f2b36;--c12:#b195e0;--c13:#7fb0ec;--c14:#5fcfc4;--c15:#f0a35f;--c17:#ec88a8;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.1rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem}
.score{font-variant-numeric:tabular-nums;text-align:right;font-size:.9rem;color:var(--muted)}
.score b{font-family:var(--display);font-size:1.5rem;color:var(--ink);display:block;line-height:1.1}
.bar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:64px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.tag{font-weight:700;color:var(--chc);border:1.5px solid var(--chc);border-radius:6px;padding:1px 7px}
.medtag{background:var(--med);color:var(--surface);font-weight:700;border-radius:4px;padding:1px 6px;font-size:.72rem;letter-spacing:.04em}
.rwtag{background:var(--ok);color:var(--surface);font-weight:700;border-radius:4px;padding:1px 6px;font-size:.72rem;letter-spacing:.04em}
.sata{background:var(--ink);color:var(--surface);font-weight:700;border-radius:4px;padding:1px 6px;font-size:.72rem;letter-spacing:.04em}
.stem{font-size:1.08rem;font-weight:700;margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-weight:700;min-width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;flex:none}
.opt.multi .k{border-radius:4px}
.opt.sel{border-color:var(--accent);background:var(--note)}.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.fb h3{margin:0;font-family:var(--display);font-size:1.05rem}.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.fb p{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.st{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.st b{display:block;color:var(--chc);font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:24px}
.small{font-size:.82rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:.82rem;cursor:pointer;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}

<script>const Q=[{"c":12,"n":1,"s":"A person has had difficulty keeping a job because of arguing with co-workers and accusing them of conspiracy. Today the person shouts, They're all plotting to destroy me. Isn't that true? Select the nurse's most therapeutic response.","m":false,"rw":false,"o":["Everyone here is trying to help you. No one wants to harm you.","Feeling that people want to destroy you must be very frightening.","That is not true. People here are trying to help you if you will let them.","Staff members are health care professionals who are qualified to help you."],"a":[1],"r":"Resist focusing on content; instead, focus on the feelings the patient is expressing. This strategy prevents arguing about the reality of delusional beliefs. Such arguments increase patient anxiety and the tenacity with which the patient holds to the delusion. The other options focus on content and provide opportunity for argument.","med":false},{"c":12,"n":2,"s":"A newly admitted patient diagnosed with schizophrenia is hypervigilant and constantly scans the environment. The patient states, I saw two doctors talking in the hall. They were plotting to kill me. The nurse may correctly assess this behavior as:","m":false,"rw":false,"o":["echolalia.","an idea of reference.","a delusion of infidelity.","an auditory hallucination."],"a":[1],"r":"Ideas of reference are misinterpretations of the verbalizations or actions of others that give special personal meanings to these behaviors; for example, when seeing two people talking, the individual assumes they are talking about him or her. The other terms do not correspond with the scenario.","med":false},{"c":12,"n":3,"s":"A patient diagnosed with schizophrenia says, My co-workers are out to get me. I also saw two doctors plotting to kill me. How does this patient perceive the environment?","m":false,"rw":false,"o":["Disorganized","Dangerous","Supportive","Bizarre"],"a":[1],"r":"The patient sees the world as hostile and dangerous. This assessment is important because the nurse can be more effective by using empathy to respond to the patient. Data are not present to support any of the other options.","med":false},{"c":12,"n":4,"s":"When a patient diagnosed with schizophrenia was discharged 6 months ago, haloperidol (Haldol) was prescribed. The patient now says, I stopped taking those pills. They made me feel like a robot. What are common side effects the nurse should validate with the patient?","m":false,"rw":false,"o":["Sedation and muscle stiffness","Sweating, nausea, and diarrhea","Mild fever, sore throat, and skin rash","Headache, watery eyes, and runny nose"],"a":[0],"r":"Typical antipsychotic drugs often produce sedation and extrapyramidal side effects such as stiffness and gait disturbance, effects the patient might describe as making him or her feel like a robot. The side effects mentioned in the other options are usually not associated with typical antipsychotic therapy or would not have the effect described by the patient.","med":true},{"c":12,"n":5,"s":"Which hallucination necessitates the nurse to implement safety measures? The patient says,","m":false,"rw":false,"o":["I hear angels playing harps.","The voices say everyone is trying to kill me.","My dead father tells me I am a good person.","The voices talk only at night when I'm trying to sleep."],"a":[1],"r":"The correct response indicates the patient is experiencing paranoia. Paranoia often leads to fearfulness, and the patient may attempt to strike out at others to protect self. The distracters are comforting hallucinations or do not indicate paranoia.","med":false},{"c":12,"n":6,"s":"A patients care plan includes monitoring for auditory hallucinations. Which assessment findings suggest the patient may be hallucinating?","m":false,"rw":false,"o":["Detachment and overconfidence","Darting eyes, tilted head, mumbling to self","Euphoric mood, hyperactivity, distractibility","Foot tapping and repeatedly writing the same phrase"],"a":[1],"r":"Clues to hallucinations include eyes looking around the room as though to find the speaker, tilting the head to one side as though listening intently, and grimacing, mumbling, or talking aloud as though responding conversationally to someone.","med":false},{"c":12,"n":7,"s":"A health care provider considers which antipsychotic medication to prescribe for a patient diagnosed with schizophrenia who has auditory hallucinations and poor social function. The patient is also overweight and hypertensive. Which drug should the nurse advocate?","m":false,"rw":false,"o":["Clozapine (Clozaril)","Ziprasidone (Geodon)","Olanzapine (Zyprexa)","Aripiprazole (Abilify)"],"a":[3],"r":"Aripiprazole is a third-generation atypical antipsychotic effective against both positive and negative symptoms of schizophrenia. It causes little or no weight gain and no increase in glucose, high- or low-density lipoprotein cholesterol, or triglycerides, making it a reasonable choice for a patient with obesity or heart disease. Clozapine may produce agranulocytosis, making it a poor choice as a first-line agent. Ziprasidone may prolong the QT interval, making it a poor choice for a patient with cardiac disease. Olanzapine fosters weight gain.","med":true},{"c":12,"n":8,"s":"A patient diagnosed with schizophrenia tells the nurse, I eat skiller. Tend to end. Easter. It blows away. Get it? Select the nurse's best response.","m":false,"rw":false,"o":["Nothing you are saying is clear.","Your thoughts are very disconnected.","Try to organize your thoughts and then tell me again.","I am having difficulty understanding what you are saying."],"a":[3],"r":"When a patients speech is loosely associated, confused, and disorganized, pretending to understand is useless. The nurse should tell the patient that he or she is having difficulty understanding what the patient is saying. If a theme is discernible, ask the patient to talk about the theme. The incorrect options tend to place blame for the poor communication with the patient. The correct response places the difficulty with the nurse rather than being accusatory. See relationship to audience response question.","med":false},{"c":12,"n":9,"s":"A patient diagnosed with schizophrenia exhibits little spontaneous movement and demonstrates waxy flexibility. Which patient needs are of priority importance?","m":false,"rw":false,"o":["Self-esteem","Psychosocial","Physiological","Self-actualization"],"a":[2],"r":"Physiological needs must be met to preserve life. A patient with waxy flexibility must be fed by hand or tube, toileted, given range-of-motion exercises, and so forth to preserve physiological integrity. Higher level needs are of lesser concern.","med":false},{"c":12,"n":10,"s":"A patient diagnosed with schizophrenia demonstrates little spontaneous movement and has waxy flexibility. The patients activities of daily living are severely compromised. An appropriate outcome would be that the patient will:","m":false,"rw":false,"o":["demonstrate increased interest in the environment by the end of week 1.","perform self-care activities with coaching by the end of day 3.","gradually take the initiative for self-care by the end of week 2.","accept tube feeding without objection by day 2."],"a":[1],"r":"Outcomes related to self-care deficit nursing diagnoses should deal with increasing ability to perform self-care tasks independently, such as feeding, bathing, dressing, and toileting. Performing the tasks with coaching by nursing staff denotes improvement over the complete inability to perform the tasks. The incorrect options are not directly related to self-care activities, difficult to measure, and unrelated to maintenance of nutrition.","med":false},{"c":12,"n":11,"s":"A nurse observes a catatonic patient standing immobile, facing the wall with one arm extended in a salute. The patient remains immobile in this position for 15 minutes, moving only when the nurse gently lowers the arm. What is the name of this phenomenon?","m":false,"rw":false,"o":["Echolalia","Waxy flexibility","Depersonalization","Thought withdrawal"],"a":[1],"r":"Waxy flexibility is the ability to hold distorted postures for extended periods of time, as though the patient were molded in wax. Echolalia is a speech pattern. Depersonalization refers to a feeling state. Thought withdrawal refers to an alteration in thinking.","med":false},{"c":12,"n":12,"s":"A patient is experiencing delusions of persecution about being poisoned. The patient has refused all hospital meals for 3 days. Which intervention is most likely to be acceptable to the patient?","m":false,"rw":false,"o":["Allowing the patient supervised access to food vending machines","Allowing the patient to phone a local restaurant to deliver meals","Offering to taste each portion on the tray for the patient","Providing tube feedings or total parenteral nutrition"],"a":[0],"r":"The patient who is delusional about food being poisoned is likely to believe restaurant food might still be poisoned and to say that the staff member tasting the food has taken an antidote to the poison before tasting. Attempts to tube feed or give nutrition intravenously are seen as aggressive and usually promote violence. Patients perceive foods in sealed containers, packages, or natural shells as being safer.","med":false},{"c":12,"n":13,"s":"A community mental health nurse wants to establish a relationship with a very withdrawn patient diagnosed with schizophrenia. The patient lives at home with a supportive family. Select the nurse's best plan.","m":false,"rw":false,"o":["Visit daily for 4 days, then every other day for 1 week; stay with patient for 20 minutes, accept silence; state when the nurse will return.","Arrange to spend 1 hour each day with the patient; focus on asking questions about what the patient is thinking or experiencing; avoid silences.","Visit twice daily; sit beside the patient with a hand on the patients arm; leave if the patient does not respond within 10 minutes.","Visit every other day; remind the patient of the nurses identity; encourage the patient to talk while the nurse works on reports."],"a":[0],"r":"Severe constraints on the community mental health nurses time will probably not allow more time than what is mentioned in the correct option; yet, important principles can be used. A severely withdrawn patient should be met at the patients own level, with silence accepted. Short periods of contact are helpful to minimize both the patients and the nurses anxiety. Predictability in returning as stated will help build trust. An hour may be too long to sustain a home visit with a withdrawn patient, especially if the nurse persists in leveling a barrage of questions at the patient. Twice-daily visits are probably not possible, and leaving after 10 minutes would be premature. Touch may be threatening. Working on reports suggests the nurse is not interested in the patient.","med":false},{"c":12,"n":14,"s":"Withdrawn patients diagnosed with schizophrenia:","m":false,"rw":false,"o":["are usually violent toward caregivers.","universally fear sexual involvement with therapists.","exhibit a high degree of hostility as evidenced by rejecting behavior.","avoid relationships because they become anxious with emotional closeness."],"a":[3],"r":"When an individual is suspicious and distrustful and perceives the world and the people in it as potentially dangerous, withdrawal into an inner world can be a defense against uncomfortable levels of anxiety. When someone attempts to establish a relationship with such a patient, the patients anxiety rises until trust is established. There is no evidence that withdrawn patients with schizophrenia universally fear sexual involvement with therapists. In most cases, it is untrue that withdrawn patients with schizophrenia are commonly violent or exhibit a high degree of hostility by demonstrating rejecting behavior.","med":false},{"c":12,"n":15,"s":"A newly admitted patient diagnosed with schizophrenia says, The voices are bothering me. They yell and tell me I am bad. I have got to get away from them. Select the nurse's most helpful reply.","m":false,"rw":false,"o":["Do you hear the voices often?","Do you have a plan for getting away from the voices?","I'll stay with you. Focus on what we are talking about, not the voices.","Forget the voices and ask some other patients to play cards with you."],"a":[2],"r":"Staying with a distraught patient who is hearing voices serves several purposes: ongoing observation, the opportunity to provide reality orientation, a means of helping dismiss the voices, the opportunity of forestalling an action that would result in self-injury, and general support to reduce anxiety. Asking if the patient hears voices is not particularly relevant at this point. Asking if the patient plans to get away from the voices is relevant for assessment purposes but is less helpful than offering to stay with the patient while encouraging a focus on their discussion. Suggesting playing cards with other patients shifts responsibility for intervention from the nurse to the patient and other patients.","med":false},{"c":12,"n":16,"s":"A patient diagnosed with schizophrenia has taken fluphenazine (Prolixin) 5 mg po bid for 3 weeks. The nurse now observes a shuffling propulsive gait, a mask-like face, and drooling. Which term applies to these symptoms?","m":false,"rw":false,"o":["Neuroleptic malignant syndrome","Hepatocellular effects","Pseudoparkinsonism","Akathisia"],"a":[2],"r":"Pseudoparkinsonism induced by antipsychotic medication mimics the symptoms of Parkinsons disease. It frequently appears within the first month of treatment and is more common with first-generation antipsychotic drugs. Hepatocellular effects would produce abnormal liver test results. Neuroleptic malignant syndrome is characterized by autonomic instability. Akathisia produces motor restlessness.","med":true},{"c":12,"n":17,"s":"A patient diagnosed with schizophrenia is very disturbed and violent. After several doses of haloperidol (Haldol), the patient is calm. Two hours later the nurse sees the patients head rotated to one side in a stiff position, the lower jaw thrust forward, and drooling. Which problem is most likely?","m":false,"rw":false,"o":["An acute dystonic reaction","Tardive dyskinesia","Waxy flexibility","Akathisia"],"a":[0],"r":"Acute dystonic reactions involve painful contractions of the tongue, face, neck, and back. Opisthotonos and oculogyric crisis may be observed. Dystonic reactions are considered emergencies requiring immediate intervention. Tardive dyskinesia involves involuntary spasmodic muscular contractions that involve the tongue, fingers, toes, neck, trunk, or pelvis. It appears after prolonged treatment. Waxy flexibility is a symptom seen in catatonic schizophrenia. Internal and external restlessness, pacing, and fidgeting are characteristics of akathisia.","med":true},{"c":12,"n":18,"s":"An acutely violent patient diagnosed with schizophrenia receives several doses of haloperidol (Haldol). Two hours later the nurse notices the patients head rotated to one side in a stiffly fixed position, the lower jaw thrust forward, and drooling. Which intervention by the nurse is indicated?","m":false,"rw":false,"o":["Administer diphenhydramine (Benadryl) 50 mg IM from the PRN medication administration record.","Reassure the patient that the symptoms will subside. Practice relaxation exercises with the patient.","Give trihexyphenidyl (Artane) 5 mg orally at the next regularly scheduled medication administration time.","Administer atropine sulfate 2 mg subcut from the PRN medication administration record."],"a":[0],"r":"Diphenhydramine, trihexyphenidyl, benztropine, and other anticholinergic medications may be used to treat dystonias. Swallowing will be difficult or impossible; therefore, oral medication is not an option. Medication should be administered immediately, so the intramuscular route is best. In this case, the best option given is diphenhydramine.","med":true},{"c":12,"n":19,"s":"A patient took trifluoperazine 30 mg po daily for 3 years. The clinic nurse notes that the patient grimaces and constantly smacks both lips. The patients neck and shoulders twist in a slow, snakelike motion. Which problem would the nurse suspect?","m":false,"rw":false,"o":["Agranulocytosis","Tardive dyskinesia","Tourettes syndrome","Anticholinergic effects"],"a":[1],"r":"Tardive dyskinesia is a neuroleptic-induced condition involving the face, trunk, and limbs. Involuntary movements, such as tongue thrusting; licking; blowing; irregular movements of the arms, neck, and shoulders; rocking; hip jerks; and pelvic thrusts, are seen. These symptoms are frequently not reversible even when the drug is discontinued. The scenario does not present evidence consistent with the other disorders mentioned. Agranulocytosis is a blood disorder. Tourettes syndrome is a condition in which tics are present. Anticholinergic effects include dry mouth, blurred vision, flushing, constipation, and dry eyes.","med":true},{"c":12,"n":20,"s":"A nurse sits with a patient diagnosed with schizophrenia. The patient starts to laugh uncontrollably, although the nurse has not said anything funny. Select the nurse's best response.","m":false,"rw":false,"o":["Why are you laughing?","Please share the joke with me.","I don't think I said anything funny.","You're laughing. Tell me what's happening."],"a":[3],"r":"The patient is likely laughing in response to inner stimuli, such as hallucinations or fantasy. Focus on the hallucinatory clue (the patients laughter) and then elicit the patients observation. The incorrect options are less useful in eliciting a response: no joke may be involved, why questions are difficult to answer, and the patient is probably not focusing on what the nurse said in the first place.","med":false},{"c":12,"n":21,"s":"The nurse assesses a patient diagnosed with schizophrenia. Which assessment finding would the nurse regard as a negative symptom of schizophrenia?","m":false,"rw":false,"o":["Auditory hallucinations","Delusions of grandeur","Poor personal hygiene","Psychomotor agitation"],"a":[2],"r":"Negative symptoms include apathy, anhedonia, poor social functioning, and poverty of thought. Poor personal hygiene is an example of poor social functioning. The distracters are positive symptoms of schizophrenia. See relationship to audience response question.","med":false},{"c":12,"n":22,"s":"What assessment findings mark the prodromal stage of schizophrenia?","m":false,"rw":false,"o":["Withdrawal, misinterpreting, poor concentration, and preoccupation with religion","Auditory hallucinations, ideas of reference, thought insertion, and broadcasting","Stereotyped behavior, echopraxia, echolalia, and waxy flexibility","Loose associations, concrete thinking, and echolalia neologisms"],"a":[0],"r":"Withdrawal, misinterpreting, poor concentration, and preoccupation with religion are prodromal symptoms, the symptoms that are present before the development of florid symptoms. The incorrect options each list the positive symptoms of schizophrenia that might be apparent during the acute stage of the illness.","med":false},{"c":12,"n":23,"s":"A patient diagnosed with schizophrenia says, Contagious bacteria are everywhere. When they get in your body, you will be locked up with other infected people. Which problem is evident?","m":false,"rw":false,"o":["Poverty of content","Concrete thinking","Neologisms","Paranoia"],"a":[3],"r":"The patients unrealistic fear of harm indicates paranoia. Neologisms are invented words. Concrete thinking involves literal interpretation. Poverty of content refers to an inadequate fund of information.","med":false},{"c":12,"n":24,"s":"A patient diagnosed with schizophrenia begins a new prescription for lurasidone HCL (Latuda). The patien is 56 and currently weighs 204 lbs. Which topic is most important for the nurse to include in the teaching plan related to this medication?","m":false,"rw":false,"o":["How to recognize tardive dyskinesia","Weight management strategies","Ways to manage constipation","Sleep hygiene measures"],"a":[1],"r":"Lurasidone HCL (Latuda) is a second-generation antipsychotic medication. The incidence of weight gain, diabetes, and high cholesterol is high with this medication. The patient is overweight now, so weight management will be especially important. The incidence of tardive dyskinesia is low with second-generation antipsychotic medications. Constipation may occur, but it is less important than weight management. This drug usually produces drowsiness.","med":true},{"c":12,"n":25,"s":"A patient diagnosed with schizophrenia says, Its beat. Time to eat. No room for the cat. What type of verbalization is evident?","m":false,"rw":false,"o":["Neologism","Idea of reference","Thought broadcasting","Associative looseness"],"a":[3],"r":"Looseness of association refers to jumbled thoughts incoherently expressed to the listener. Neologisms are newly coined words. Ideas of reference are a type of delusion. Thought broadcasting is the belief that others can hear ones thoughts.","med":false},{"c":12,"n":26,"s":"A patient diagnosed with schizophrenia has taken a conventional antipsychotic medication for a year. Hallucinations are less intrusive, but the patient continues to have apathy, poverty of thought, and social isolation. The nurse would expect a change to which medication?","m":false,"rw":false,"o":["Haloperidol (Haldol)","Olanzapine (Zyprexa)","Chlorpromazine (Thorazine)","Diphenhydramine (Benadryl)"],"a":[1],"r":"Olanzapine is a second-generation atypical antipsychotic that targets both positive and negative symptoms of schizophrenia. Haloperidol and chlorpromazine are conventional antipsychotics that target only positive symptoms. Diphenhydramine is an antihistamine. See relationship to audience response question.","med":true},{"c":12,"n":27,"s":"The family of a patient diagnosed with schizophrenia is unfamiliar with the illness and family's role in recovery. Which type of therapy should the nurse recommend?","m":false,"rw":false,"o":["Psychoeducational","Psychoanalytic","Transactional","Family"],"a":[0],"r":"A psychoeducational group explores the causes of schizophrenia, the role of medication, the importance of medication compliance, support for the ill member, and hints for living with a person with schizophrenia. Such a group can be of immeasurable practical assistance to the family. The other types of therapy do not focus on psychoeducation.","med":false},{"c":12,"n":28,"s":"A patient diagnosed with schizophrenia has been stable for a year; however, the family now reports the patient is tense, sleeps 3 to 4 hours per night, and has difficulty concentrating. The patient says, My computer is sending out infected radiation beams. The nurse can correctly assess this information as an indication of:","m":false,"rw":false,"o":["the need for psychoeducation.","medication noncompliance.","chronic deterioration.","relapse."],"a":[3],"r":"Signs of potential relapse include feeling tense, difficulty concentrating, trouble sleeping, increased withdrawal, and increased bizarre or magical thinking. Medication noncompliance may not be implicated. Relapse can occur even when the patient is taking medication regularly. Psychoeducation is more effective when the patients symptoms are stable. Chronic deterioration is not the best explanation.","med":true},{"c":12,"n":29,"s":"A patient diagnosed with schizophrenia begins to talks about macnabs hiding in the warehouse at work. The term macnabs should be documented as:","m":false,"rw":false,"o":["a neologism.","concrete thinking.","thought insertion.","an idea of reference."],"a":[0],"r":"A neologism is a newly coined word having special meaning to the patient. Macnabs is not a known common word. Concrete thinking refers to the inability to think abstractly. Thought insertion refers to thoughts of others are implanted in ones mind. Ideas of reference are a type of delusion in which trivial events are given personal significance.","med":false},{"c":12,"n":30,"s":"A patient diagnosed with schizophrenia anxiously says, I can see the left side of my body merging with the wall, then my face appears and disappears in the mirror. While listening, the nurse should:","m":false,"rw":false,"o":["sit close to the patient.","place an arm protectively around the patients shoulders.","place a hand on the patients arm and exert light pressure.","maintain a normal social interaction distance from the patient."],"a":[3],"r":"The patient is describing phenomena that indicate personal boundary difficulties and depersonalization. The nurse should maintain appropriate social distance and not touch the patient because the patient is anxious about the inability to maintain ego boundaries and merging or being swallowed by the environment. Physical closeness or touch could precipitate panic.","med":false},{"c":12,"n":31,"s":"A patient diagnosed with schizophrenia and auditory hallucinations anxiously tells the nurse, The voice is telling me to do things. Select the nurse's priority assessment question.","m":false,"rw":false,"o":["How long has the voice been directing your behavior?","Does what the voice tell you to do frighten you?","Do you recognize the voice speaking to you?","What is the voice telling you to do?"],"a":[3],"r":"Learning what a command hallucination is telling the patient to do is important because the command often places the patient or others at risk for harm. Command hallucinations can be terrifying and may pose a psychiatric emergency. The incorrect questions are of lesser importance than identifying the command.","med":false},{"c":12,"n":32,"s":"A patient receiving risperidone (Risperdal) reports severe muscle stiffness at 1030. By 1200, the patient has difficulty swallowing and is drooling. By 1600, vital signs are 102.8 F; pulse 110; respirations 26; 150/90. The patient is diaphoretic. Select the nurse's best analysis and action.","m":false,"rw":false,"o":["Agranulocytosis; institute reverse isolation.","Tardive dyskinesia; withhold the next dose of medication.","Cholestatic jaundice; begin a high-protein, high-cholesterol diet.","Neuroleptic malignant syndrome; notify health care provider stat."],"a":[3],"r":"Taking an antipsychotic medication coupled with the presence of extrapyramidal symptoms, such as severe muscle stiffness and difficulty swallowing, hyperpyrexia, and autonomic symptoms (pulse elevation), suggest neuroleptic malignant syndrome, a medical emergency. The symptoms given in the scenario are not consistent with the medical problems listed in the incorrect options.","med":true},{"c":12,"n":33,"s":"A nurse asks a patient diagnosed with schizophrenia, What is meant by the old saying You can't judge a book by looking at the cover.? Which response by the patient indicates concrete thinking?","m":false,"rw":false,"o":["The table of contents tells what a book is about.","You can't judge a book by looking at the cover.","Things are not always as they first appear.","Why are you asking me about books?"],"a":[0],"r":"Concrete thinking refers to an impaired ability to think abstractly. Concreteness is often assessed through the patients interpretation of proverbs. Concreteness reduces ones ability to understand and address abstract concepts such as love or the passage of time. The incorrect options illustrate echolalia, an unrelated question, and abstract thinking.","med":false},{"c":12,"n":34,"s":"The nurse is developing a plan for psychoeducational sessions for several adults diagnosed with schizophrenia. Which goal is best for this group? Members will:","m":false,"rw":false,"o":["gain insight into unconscious factors that contribute to their illness.","explore situations that trigger hostility and anger.","learn to manage delusional thinking.","demonstrate improved social skills."],"a":[3],"r":"Improved social skills help patients maintain relationships with others. These relationships are important to management of the disorder. Most patients with schizophrenia think concretely, so insight development is unlikely. Not all patients with schizophrenia experience delusions.","med":false},{"c":12,"n":35,"s":"A client says, Facebook has a new tracking capacity. If I use the Internet, Homeland Security will detain me as a terrorist. Select the nurse's best initial action.","m":false,"rw":false,"o":["Tell the client, Facebook is a safe website. You don't need to worry about Homeland Security.","Tell the client, You are in a safe place where you will be helped.","Administer a prn dose of an antipsychotic medication.","Tell the client, You don't need to worry about that."],"a":[1],"r":"The patient is experiencing paranoia and delusional thinking, which leads to fear. Explaining that the patient is in a safe place will help relieve the fear. It is not therapeutic to disagree or give advice. Medication will not relieve the immediate concern.","med":true},{"c":12,"n":36,"s":"Which finding constitutes a negative symptom associated with schizophrenia?","m":false,"rw":false,"o":["Hostility","Bizarre behavior","Poverty of thought","Auditory hallucinations"],"a":[2],"r":"Negative symptoms include apathy, anhedonia, poor social functioning, and poverty of thought. Poor personal hygiene is an example of poor social functioning. The distracters are positive symptoms of schizophrenia. See relationship to audience response question.","med":false},{"c":12,"n":37,"s":"A patient insistently states, I can decipher codes of DNA just by looking at someone. Which problem is evident?","m":false,"rw":false,"o":["Visual hallucinations","Magical thinking","Idea of reference","Thought insertion"],"a":[1],"r":"Magical thinking is evident in the patients appraisal of his own abilities. There is no evidence of the distracters.","med":false},{"c":12,"n":38,"s":"A newly hospitalized patient experiencing psychosis says, Red chair out town board. Which term should the nurse use to document this finding?","m":false,"rw":false,"o":["Word salad","Neologism","Anhedonia","Echolalia"],"a":[0],"r":"Word salad (schizophasia) is a jumble of words that is meaningless to the listener and perhaps to the speaker as well, because of an extreme level of disorganization.","med":false},{"c":12,"n":39,"s":"A nurse at the mental health clinic plans psychoeducational groups for persons newly diagnosed with schizophrenia. Which topic takes priority?","m":false,"rw":true,"o":["How to complete an application for employment","The importance of taking your medication correctly","How to dress when attending community events","How to give and receive compliments"],"a":[1],"r":"Stabilization depends on adherence to the antipsychotic regimen, and nonadherence is the main cause of relapse. (Smoking cessation is also a priority because so many persons with schizophrenia smoke.) The other topics are important but not priorities.","med":true},{"c":12,"n":40,"s":"A patient diagnosed with schizophrenia was hospitalized after arguing with co-workers and threatening to harm them. The patient is aloof, suspicious, and says, Two staff members I saw talking were plotting to kill me. Which nursing diagnosis takes priority?","m":false,"rw":true,"o":["Risk for loneliness","Spiritual distress","Social isolation","Risk for other-directed violence"],"a":[3],"r":"The patient feels endangered by persecutors and has already threatened others; fearful individuals may strike out at perceived persecutors. Safety comes first. Disturbed thought processes also applies (persecutory delusions, ideas of reference). No data support the other diagnoses.","med":false},{"c":13,"n":1,"s":"A person was online continuously for over 24 hours, posting rhymes on official government websites and inviting politicians to join social networks. The person has not slept or eaten for 3 days. What features of mania are evident?","m":false,"rw":false,"o":["Increased muscle tension and anxiety","Vegetative signs and poor grooming","Poor judgment and hyperactivity","Cognitive deficits and paranoia"],"a":[2],"r":"Hyperactivity (activity without sleep) and poor judgment (posting rhymes on government websites) are characteristic of manic episodes. The distracters do not specifically apply to mania.","med":false},{"c":13,"n":2,"s":"A patient diagnosed with bipolar disorder is dressed in a red leotard and bright scarves. The patient twirls and shadow boxes. The patient says gaily, Do you like my scarves? Here; they are my gift to you. How should the nurse document the patients mood?","m":false,"rw":false,"o":["Euphoric","Irritable","Suspicious","Confident"],"a":[0],"r":"The patient has demonstrated clang associations and pleasant, happy behavior. Excessive happiness indicates euphoria. Irritability, belligerence, excessive happiness, and confidence are not the best terms for the patients mood. Suspiciousness is not evident.","med":false},{"c":13,"n":3,"s":"A person was directing traffic on a busy street, rapidly shouting, To work, you jerk, for perks and making obscene gestures at cars. The person has not slept or eaten for 3 days. Which assessment findings will have priority concern for this patients plan of care?","m":false,"rw":false,"o":["Insulting, aggressive behavior","Pressured speech and grandiosity","Hyperactivity; not eating and sleeping","Poor concentration and decision making"],"a":[2],"r":"Hyperactivity, poor nutrition, hydration, and not sleeping take priority in terms of the needs listed above because they threaten the physical integrity of the patient. The other behaviors are less threatening to the patients life.","med":false},{"c":13,"n":4,"s":"A patient diagnosed with acute mania has distributed pamphlets about a new business venture on a street corner for 2 days. Which nursing diagnosis has priority?","m":false,"rw":false,"o":["Risk for injury","Ineffective coping","Impaired social interaction","Ineffective therapeutic regimen management"],"a":[0],"r":"Although each of the nursing diagnoses listed is appropriate for a patient having a manic episode, the priority lies with the patients physiological safety. Hyperactivity and poor judgment put the patient at risk for injury.","med":false},{"c":13,"n":5,"s":"A patient diagnosed with bipolar disorder becomes hyperactive after discontinuing lithium. The patient threatens to hit another patient. Which comment by the nurse is appropriate?","m":false,"rw":false,"o":["Stop that! No one did anything to provoke an attack by you.","If you do that one more time, you will be secluded immediately.","Do not hit anyone. If you are unable to control yourself, we will help you.","You know we will not let you hit anyone. Why do you continue this behavior?"],"a":[2],"r":"When the patient is unable to control his or her behavior and violates or threatens to violate the rights of others limits must be set in an effort to de-escalate the situation. Limits should be set in simple, concrete terms. The incorrect responses do not offer appropriate assistance to the patient, threaten the patient with seclusion as punishment, and ask a rhetorical question.","med":true},{"c":13,"n":6,"s":"This nursing diagnosis applies to a patient with acute mania: Imbalanced nutrition: less than body requirements related to insufficient caloric intake and hyperactivity as evidenced by 5-pound weight loss in 4 days.Select an appropriate outcome. The patient will:","m":false,"rw":false,"o":["ask staff for assistance with feeding within 4 days.","drink six servings of a high-calorie, high-protein drink each day.","consistently sit with others for at least 30 minutes at meal time within 1 week.","consistently wear appropriate attire for age and sex within 1 week while on the psychiatric unit."],"a":[1],"r":"High-calorie, high-protein food supplements will provide the additional calories needed to offset the patients extreme hyperactivity. Sitting with others or asking for assistance does not mean the patient ate or drank. The other indicator is unrelated to the nursing diagnosis.","med":false},{"c":13,"n":7,"s":"A patient demonstrating characteristics of acute mania relapsed after discontinuing lithium. New orders are written to resume lithium twice daily and begin olanzapine (Zyprexa). What is the rationale for the addition of olanzapine to the medication regimen? It will:","m":false,"rw":false,"o":["minimize the side effects of lithium.","bring hyperactivity under rapid control.","enhance the antimanic actions of lithium.","be used for long-term control of hyperactivity."],"a":[1],"r":"Manic symptoms are controlled by lithium only after a therapeutic serum level is attained. Because this takes several days to accomplish, a drug with rapid onset is necessary to reduce the hyperactivity initially. Antipsychotic drugs neither enhance lithiums antimanic activity nor minimize the side effects. Lithium will be used for long-term control.","med":true},{"c":13,"n":8,"s":"A patient diagnosed with bipolar disorder has rapidly changing mood cycles. The health care provider prescribes an anticonvulsant medication. To prepare teaching materials, which drug should the nurse anticipate will be prescribed?","m":false,"rw":false,"o":["phenytoin (Dilantin)","clonidine (Catapres)","risperidone (Risperdal)","carbamazepine (Tegretol)"],"a":[3],"r":"Some patients with bipolar disorder, especially those who have only short periods between episodes, have a favorable response to the anticonvulsants carbamazepine and valproate. Carbamazepine seems to work better in patients with rapid cycling and in severely paranoid, angry manic patients. Phenytoin is also an anticonvulsant but not used for mood stabilization. Risperidone is not an anticonvulsant. See relationship to audience response question.","med":true},{"c":13,"n":9,"s":"The exact cause of bipolar disorder has not been determined; however, for most patients:","m":false,"rw":false,"o":["several factors, including genetics, are implicated.","brain structures were altered by stress early in life.","excess sensitivity in dopamine receptors may trigger episodes.","inadequate norepinephrine reuptake disturbs circadian rhythms."],"a":[0],"r":"The best explanation at this time is that bipolar disorder is most likely caused by interplay of complex independent variables. Various theories implicate genetics, endocrine imbalance, environmental stressors, and neurotransmitter imbalances.","med":false},{"c":13,"n":10,"s":"The spouse of a patient diagnosed with bipolar disorder asks what evidence supports the possibility of genetic transmission of bipolar disorders. Which response should the nurse provide?","m":false,"rw":false,"o":["A high proportion of patients with bipolar disorders are found among creative writers.","A higher rate of relatives with bipolar disorder is found among patients with bipolar disorder.","Patients with bipolar disorder have higher rates of relatives who respond in an exaggerated way to daily stress.","More individuals with bipolar disorder come from high socioeconomic and educational backgrounds."],"a":[1],"r":"Evidence of genetic transmission is supported when twins or relatives of patients with a particular disorder also show an incidence of the disorder that is higher than the incidence in the general public. The incorrect options do not support the theory of genetic transmission and other factors involved in the etiology of bipolar disorder.","med":false},{"c":13,"n":11,"s":"A patient diagnosed with bipolar disorder commands other patients, Get me a book. Take this stuff out of here, and other similar demands. The nurse wants to interrupt this behavior without entering into a power struggle. Which initial approach should the nurse select?","m":false,"rw":false,"o":["Distraction: Let's go to the dining room for a snack.","Humor: How much are you paying servants these days?","Limit setting: You must stop ordering other patients around.","Honest feedback: Your controlling behavior is annoying others."],"a":[0],"r":"The distractibility characteristic of manic episodes can assist the nurse to direct the patient toward more appropriate, constructive activities without entering into power struggles. Humor usually backfires by either encouraging the patient or inciting anger. Limit setting and honest feedback may seem heavy-handed and may incite anger.","med":false},{"c":13,"n":12,"s":"The nurse receives a laboratory report indicating a patients serum level is 1 mEq/L. The patients last dose of lithium was 8 hours ago. This result is:","m":false,"rw":false,"o":["within therapeutic limits.","below therapeutic limits.","above therapeutic limits.","invalid because of the time lapse since the last dose."],"a":[0],"r":"Normal range for a blood sample taken 8 to 12 hours after the last dose of lithium is 0.4 to 1 mEq/L.","med":true},{"c":13,"n":13,"s":"Consider these three anticonvulsant medications: divalproex (Depakote), carbamazepine (Tegretol), and gabapentin (Neurontin). Which medication also belongs to this classification?","m":false,"rw":false,"o":["clonazepam (Klonopin)","risperidone (Risperdal)","lamotrigine (Lamictal)","aripiprazole (Abilify)"],"a":[2],"r":"The three drugs in the stem of the question are all anticonvulsants. Lamotrigine is also an anticonvulsant. Clonazepam is an anxiolytic; aripiprazole and risperidone are antipsychotic drugs. See relationship to audience response question.","med":true},{"c":13,"n":14,"s":"When a hyperactive patient diagnosed with acute mania is hospitalized, what is the initial nursing intervention?","m":false,"rw":false,"o":["Allow the patient to act out feelings.","Set limits on patient behavior as necessary.","Provide verbal instructions to the patient to remain calm.","Restrain the patient to reduce hyperactivity and aggression."],"a":[1],"r":"This intervention provides support through the nurses presence and provides structure as necessary while the patients control is tenuous. Acting out may lead to loss of behavioral control. The patient will probably be unable to focus on instructions and comply. Restraint is used only after other interventions have proved ineffective.","med":false},{"c":13,"n":15,"s":"At a unit meeting, the staff discusses decor for a special room for patients with acute mania. Which suggestion is appropriate?","m":false,"rw":false,"o":["An extra-large window with a view of the street","Neutral walls with pale, simple accessories","Brightly colored walls and print drapes","Deep colors for walls and upholstery"],"a":[1],"r":"The environment for a manic patient should be as simple and non-stimulating as possible. Manic patients are highly sensitive to environmental distractions and stimulation.","med":false},{"c":13,"n":16,"s":"A patient demonstrating behaviors associated with acute mania has exhausted the staff by noon. Staff members are feeling defensive and fatigued. Which action will the staff take initially?","m":false,"rw":false,"o":["Confer with the health care provider to consider use of seclusion for this patient.","Hold a staff meeting to discuss consistency and limit-setting approaches.","Conduct a meeting with all staff and patients to discuss the behavior.","Explain to the patient that the behavior is unacceptable."],"a":[1],"r":"When staff members are at their wits end, the patient has succeeded in keeping the environment unsettled and avoided outside controls on behavior. Staff meetings can help minimize staff splitting and feelings of anger, helplessness, confusion, and frustration.","med":false},{"c":13,"n":17,"s":"A patient experiencing acute mania undresses in the group room and dances. The nurse intervenes initially by:","m":false,"rw":false,"o":["quietly asking the patient, Why don't you put your clothes on?","firmly telling the patient, Stop dancing and put on your clothing.","putting a blanket around the patient and walking with the patient to a quiet room.","letting the patient stay in the group room and moving the other patients to a different area."],"a":[2],"r":"Patients must be protected from the embarrassing consequences of their poor judgment whenever possible. Protecting the patient from public exposure by matter-of-factly covering the patient and removing him or her from the area with a sufficient number of staff to avoid argument and provide control is an effective approach.","med":false},{"c":13,"n":18,"s":"A patient waves a newspaper and says, I must have my credit card and use the computer right now. A store is having a big sale, and I need to order 10 dresses and four pairs of shoes. Select the nurses appropriate intervention. The nurse:","m":false,"rw":false,"o":["suggests the patient have a friend do the shopping and bring purchases to the unit.","invites the patient to sit together and look at new fashion magazines.","tells the patient computer use is not allowed until self-control improves.","asks whether the patient has enough money to pay for the purchases."],"a":[1],"r":"Situations such as this offer an opportunity to use the patients distractibility to staffs advantage. Patients become frustrated when staff deny requests that the patient sees as entirely reasonable. Distracting the patient can avoid power struggles. Suggesting that a friend do the shopping would not satisfy the patients need for immediacy and would ultimately result in the extravagant expenditure. Asking whether the patient has enough money would likely precipitate an angry response.","med":false},{"c":13,"n":19,"s":"An outpatient diagnosed with bipolar disorder takes lithium carbonate 300 mg three times daily. The patient reports nausea. To reduce the nausea most effectively, the nurse suggests that the lithium be taken with:","m":false,"rw":false,"o":["meals.","an antacid.","an antiemetic.","a large glass of juice."],"a":[0],"r":"Some patients find that taking lithium with meals diminishes nausea. The incorrect options are less helpful.","med":true},{"c":13,"n":20,"s":"A health teaching plan for a patient taking lithium should include instructions to:","m":false,"rw":false,"o":["maintain normal salt and fluids in the diet.","drink twice the usual daily amount of fluid.","double the lithium dose if diarrhea or vomiting occurs.","avoid eating aged cheese, processed meats, and red wine."],"a":[0],"r":"Sodium depletion and dehydration increase the chance for development of lithium toxicity. The other options offer inappropriate information.","med":true},{"c":13,"n":21,"s":"Which nursing diagnosis would most likely apply to both a patient diagnosed with major depression as wel as one experiencing acute mania?","m":false,"rw":false,"o":["Deficient diversional activity","Disturbed sleep pattern","Fluid volume excess","Defensive coping"],"a":[1],"r":"Patients with mood disorders, both depression and mania, experience sleep pattern disturbances. Assessment data should be routinely gathered about this possible problem. Deficient diversional activity is more relevant for patients with depression. Defensive coping is more relevant for patients with mania. Fluid volume excess is less relevant for patients with mood disorders than is deficient fluid volume.","med":false},{"c":13,"n":22,"s":"Which dinner menu is best suited for a patient with acute mania?","m":false,"rw":false,"o":["Spaghetti and meatballs, salad, and a banana","Beef and vegetable stew, a roll, and chocolate pudding","Broiled chicken breast on a roll, an ear of corn, and an apple","Chicken casserole, green beans, and flavored gelatin with whipped cream"],"a":[2],"r":"These foods provide adequate nutrition, but more important they are finger foods that the hyperactive patient could eat on the run. The foods in the incorrect options cannot be eaten without utensils.","med":false},{"c":13,"n":23,"s":"Outcome identification for the treatment plan of a patient experiencing grandiose thinking associated with acute mania will focus on:","m":false,"rw":false,"o":["developing an optimistic outlook.","distorted thought self-control.","interest in the environment.","sleep pattern stabilization."],"a":[1],"r":"The desired outcome is that the patient will be able to control the grandiose thinking associated with acute mania as evidenced by making realistic comments about self, abilities, and plans. Patients with acute mania are already unduly optimistic as a result of their use of denial, and they are overly interested in their environment. Sleep stability is a desired outcome but is not related to distorted thought processes.","med":false},{"c":13,"n":24,"s":"Which documentation indicates that the treatment plan for a patient diagnosed with acute mania has been effective?","m":false,"rw":false,"o":["Converses with few interruptions; clothing matches; participates in activities.","Irritable, suggestible, distractible; napped for 10 minutes in afternoon.","Attention span short; writing copious notes; intrudes in conversations.","Heavy makeup; seductive toward staff; pressured speech."],"a":[0],"r":"The descriptors given indicate the patient is functioning at an optimal level, using appropriate behavior, and thinking without becoming overstimulated by unit activities. The incorrect options reflect manic behavior.","med":false},{"c":13,"n":25,"s":"A patient experiencing acute mania dances around the unit, seldom sits, monopolizes conversations, interrupts, and intrudes. Which nursing intervention will best assist the patient with energy conservation?","m":false,"rw":false,"o":["Monitor physiological functioning.","Provide a subdued environment.","Supervise personal hygiene.","Observe for mood changes."],"a":[1],"r":"All the options are reasonable interventions with a patient with acute mania, but providing a subdued environment directly relates to the outcome of energy conservation by decreasing stimulation and helping to balance activity and rest.","med":false},{"c":13,"n":26,"s":"A patient with diagnosed bipolar disorder was hospitalized 7 days ago and has been taking lithium 600 mg tid. Staff observes increased agitation, pressured speech, poor personal hygiene, and hyperactivity. Which action demonstrates that the nurse understands the most likely cause of the patients behavior?","m":false,"rw":false,"o":["Educate the patient about the proper ways to perform personal hygiene and coordinate clothing.","Continue to monitor and document the patients speech patterns and motor activity.","Ask the health care provider to prescribe an increased dose and frequency of lithium.","Consider the need to check the lithium level. The patient may not be swallowing medications."],"a":[3],"r":"The patient is continuing to exhibit manic symptoms. The lithium level may be low from cheeking (not swallowing) the medication. The prescribed dose is high, so one would not expect a need for the dose to be increased. Monitoring the patient does not address the problem.","med":true},{"c":13,"n":27,"s":"A patient with acute mania has disrobed in the hall three times in 2 hours. The nurse should:","m":false,"rw":false,"o":["direct the patient to wear clothes at all times.","ask if the patient finds clothes bothersome.","tell the patient that others feel embarrassed.","arrange for one-on-one supervision."],"a":[3],"r":"A patient who repeatedly disrobes despite verbal limit setting needs more structure. One-on-one supervision may provide the necessary structure. Directing the patient to wear clothes at all times has not proven successful, considering the behavior has continued. Asking if the patient is bothered by clothing serves no purpose. Telling the patient that others are embarrassed will not make a difference to the patient whose grasp of social behaviors is impaired by the illness.","med":false},{"c":13,"n":28,"s":"A patient experiencing acute mania is dancing atop a pool table in the recreation room. The patient waves a cue in one hand and says, I'll throw the pool balls if anyone comes near me. To best assure safety, the nurse's first intervention is to:","m":false,"rw":false,"o":["tell the patient, You need to be secluded.","clear the room of all other patients.","help the patient down from the table.","assemble a show of force."],"a":[1],"r":"Safety is of primary importance. Once other patients are out of the room, a plan for managing this patient can be implemented.","med":false},{"c":13,"n":29,"s":"A patient diagnosed with bipolar disorder will be discharged tomorrow. The patient is taking a mood stabilizing medication. What is the priority nursing intervention for the patient as well as the patients family during this phase of treatment?","m":false,"rw":false,"o":["Attending psychoeducation sessions","Decreasing physical activity","Increasing food and fluids","Meeting self-care needs"],"a":[0],"r":"During the continuation phase of treatment for bipolar disorder, the physical needs of the patient are not as important an issue as they were during the acute episode. After hospital discharge, treatment focuses on maintaining medication compliance and preventing relapse, both of which are fostered by ongoing psychoeducation.","med":true},{"c":13,"n":30,"s":"A nurse assesses a patient who takes lithium. Which findings demonstrate evidence of complications?","m":false,"rw":false,"o":["Pharyngitis, mydriasis, and dystonia","Alopecia, purpura, and drowsiness","Diaphoresis, weakness, and nausea","Ascites, dyspnea, and edema"],"a":[2],"r":"Diaphoresis, weakness, and nausea are early signs of lithium toxicity. Problems mentioned in the incorrect options are unrelated to lithium therapy.","med":true},{"c":13,"n":31,"s":"A patient diagnosed with bipolar disorder is in the maintenance phase of treatment. The patient asks, Do I have to keep taking this lithium even though my mood is stable now? Select the nurses appropriate response.","m":false,"rw":false,"o":["You will be able to stop the medication in about 1 month.","Taking the medication every day helps reduce the risk of a relapse.","Usually patients take medication for approximately 6 months after discharge.","Its unusual that the health care provider hasn't already stopped your medication."],"a":[1],"r":"Patients diagnosed with bipolar disorder may be maintained on lithium indefinitely to prevent recurrences. Helping the patient understand this need will promote medication compliance.","med":true},{"c":13,"n":32,"s":"An outpatient diagnosed with bipolar disorder is prescribed lithium. The patient telephones the nurse to say, I've had severe diarrhea for 4 days. I feel very weak and unsteady when I walk. My usual hand tremor has gotten worse. What should I do? The nurse will advise the patient to:","m":false,"rw":false,"o":["restrict food and fluids for 24 hours and stay in bed.","have someone bring the patient to the clinic immediately.","drink a large glass of water with 1 teaspoon of salt added.","take one dose of an over-the-counter antidiarrheal medication now."],"a":[1],"r":"The symptoms described suggest lithium toxicity. The patient should have a lithium level drawn and may require further treatment. Because neurological symptoms are present, the patient should not drive and should be accompanied by another person. The incorrect options will not ameliorate the patients symptoms.","med":true},{"c":13,"n":33,"s":"A newly diagnosed patient is prescribed lithium. Which information from the patients history indicates that monitoring of serum concentrations of the drug will be challenging and critical?","m":false,"rw":false,"o":["Arthritis","Epilepsy","Psoriasis","Heart failure"],"a":[3],"r":"The patient with congestive heart failure will likely need diuretic drugs, which will complicate the maintenance of the fluid balance necessary to avoid lithium toxicity.","med":true},{"c":13,"n":34,"s":"Four new patients were admitted to the behavioral health unit in the past 12 hours. The nurse directs a psychiatric technician to monitor these patients for safety. Which patient will need the most watchful supervision? A patient diagnosed with:","m":false,"rw":false,"o":["bipolar I disorder.","bipolar II disorder.","dysthymic disorder","cyclothymic disorder."],"a":[0],"r":"Bipolar I is a mood disorder characterized by excessive activity and energy. Psychosis (hallucinations, delusions, and dramatically disturbed thoughts) may occur during manic episodes. A patient with bipolar I disorder is more unstable than a patient diagnosed with bipolar II, cyclothymic disorder, or dysthymic disorder.","med":false},{"c":13,"n":35,"s":"Which suggestion is most appropriate for the family of a patient with bipolar disorder who is being treated as an outpatient during a hypomanic episode?","m":false,"rw":true,"o":["Limit access to credit cards and cash.","Encourage group social interaction.","Suggest limiting work to half-days.","Plan a busy weekend schedule to use up extra energy."],"a":[0],"r":"Hypomania brings poor judgment and inappropriate spending, so limiting access to money prevents financial harm. Providing structure and monitoring sleep (a continued decline may mean full mania) are also appropriate. Group socializing and busy schedules overstimulate; a full leave from work, not half-days, is usually needed.","med":false},{"c":13,"n":36,"s":"A nurse prepares the plan of care for a patient experiencing an acute manic episode. Which nursing diagnosis is most likely?","m":false,"rw":true,"o":["Imbalanced nutrition: more than body requirements","Chronic confusion","Sleep deprivation","Social isolation"],"a":[2],"r":"Sleep is markedly reduced in mania. Disturbed thought processes also applies. Nutrition is usually LESS than requirements (too busy to eat, high calorie burn); confusion may be acute, not chronic; socialization is impaired but not isolated.","med":false},{"c":13,"n":37,"s":"A patient tells the nurse, I'm ashamed of being bipolar. When I'm manic, my behavior embarrasses everyone. Even if I take my medication, there are no guarantees. I'm a burden to my family. These statements best support which nursing diagnosis?","m":false,"rw":true,"o":["Defensive coping","Impaired social interaction","Chronic low self-esteem","Risk-prone health behavior"],"a":[2],"r":"Shame and feeling like a burden reflect chronic low self-esteem. \"No guarantees\" also reflects powerlessness. No data support the other diagnoses.","med":true},{"c":13,"n":38,"s":"Which intervention should the plan of care include for a patient in the manic state of bipolar disorder?","m":false,"rw":true,"o":["Ensure that the patients nutritional needs are met.","Touch the patient to provide reassurance.","Invite the patient to lead a community meeting.","Design activities that require the patients concentration."],"a":[0],"r":"Hyperactive, distractible patients often don't eat, so meeting nutritional needs is most important; a structured environment also supports safety. Touch may provoke aggression, leading a meeting feeds grandiosity, and activities requiring concentration cause frustration.","med":false},{"c":14,"n":1,"s":"A patient became severely depressed when the last of the family's six children moved out of the home 4 months ago. The patient repeatedly says, No one cares about me. I'm not worth anything. Which response by the nurse would be the most helpful?","m":false,"rw":false,"o":["Things will look brighter soon. Everyone feels down once in a while.","Our staff members care about you and want to try to help you get better.","It is difficult for others to care about you when you repeatedly say the same negative things.","I'll sit with you for 10 minutes now and 10 minutes after lunch to help you feel that I care about you."],"a":[3],"r":"Spending time with the patient at intervals throughout the day shows acceptance by the nurse and will help the patient establish a relationship with the nurse. The therapeutic technique is offering self. Setting definite times for the therapeutic contacts and keeping the appointments show predictability on the part of the nurse, an element that fosters trust building. The incorrect responses would be difficult for a person with profound depression to believe, provide false reassurance, and are counterproductive. The patient is unable to say positive things at this point.","med":false},{"c":14,"n":2,"s":"A patient became depressed after the last of the family's six children moved out of the home 4 months ago. Select the best initial outcome for the nursing diagnosis Situational low self-esteem related to feelings of abandonment. The patient will:","m":false,"rw":false,"o":["verbalize realistic positive characteristics about self by (date).","agree to take an antidepressant medication regularly by (date).","initiate social interaction with another person daily by (date).","identify two personal behaviors that alienate others by (date)."],"a":[0],"r":"Low self-esteem is reflected by making consistently negative statements about self and self-worth. Replacing negative cognitions with more realistic appraisals of self is an appropriate intermediate outcome. The incorrect options are not as clearly related to the nursing diagnosis. Outcomes are best when framed positively; identifying two personal behaviors that might alienate others is a negative concept.","med":true},{"c":14,"n":3,"s":"A patient diagnosed with major depression says, No one cares about me anymore. I'm not worth anything. Today the patient is wearing a new shirt and has neat, clean hair. Which remark by the nurse supports building a positive self-esteem for this patient?","m":false,"rw":false,"o":["You look nice this morning.","You're wearing a new shirt.","I like the shirt you are wearing.","You must be feeling better today."],"a":[1],"r":"Patients with depression usually see the negative side of things. The meaning of compliments may be altered to I didn't look nice yesterday or They didn't like my other shirt. Neutral comments such as making an observation avoid negative interpretations. Saying, You look nice or I like your shirt gives approval (non-therapeutic techniques). Saying You must be feeling better today is an assumption, which is non-therapeutic.","med":false},{"c":14,"n":4,"s":"An adult diagnosed with major depression was treated with medication and cognitive behavioral therapy. The patient now recognizes how passivity contributed to the depression. Which intervention should the nurse suggest?","m":false,"rw":false,"o":["Social skills training","Relaxation training classes","Desensitization techniques","Use of complementary therapy"],"a":[0],"r":"Social skill training is helpful in treating and preventing the recurrence of depression. Training focuses on assertiveness and coping skills that lead to positive reinforcement from others and development of a patients support system. Use of complementary therapy refers to adjunctive therapies such as herbals, which would be less helpful than social skill training. Assertiveness would be of greater value than relaxation training because passivity was a concern. Desensitization is used in treatment of phobias.","med":true},{"c":14,"n":5,"s":"Priority interventions for a patient diagnosed with major depression and feelings of worthlessness should include:","m":false,"rw":false,"o":["distracting the patient from self-absorption.","careful unobtrusive observation around the clock.","allowing the patient to spend long periods alone in meditation.","opportunities to assume a leadership role in the therapeutic milieu."],"a":[1],"r":"Approximately two-thirds of people with depression contemplate suicide. Patients with depression who exhibit feelings of worthlessness are at higher risk. Regular planned observations of the patient diagnosed with depression may prevent a suicide attempt on the unit.","med":false},{"c":14,"n":6,"s":"When counseling patients diagnosed with major depression, an advanced practice nurse will address the negative thought patterns by using:","m":false,"rw":false,"o":["psychoanalytic therapy.","desensitization therapy.","cognitive behavioral therapy.","alternative and complementary therapies."],"a":[2],"r":"Cognitive behavioral therapy attempts to alter the patients dysfunctional beliefs by focusing on positive outcomes rather than negative attributions. The patient is also taught the connection between thoughts and resultant feelings. Research shows that cognitive behavioral therapy involves the formation of new connections between nerve cells in the brain and that it is at least as effective as medication. Evidence is not present to support superior outcomes for the other psychotherapeutic modalities mentioned.","med":false},{"c":14,"n":7,"s":"A patient says to the nurse, My life doesn't have any happiness in it anymore. I once enjoyed holidays, but now they're just another day. The nurse documents this report as an example of:","m":false,"rw":false,"o":["dysthymia.","anhedonia.","euphoria.","anergia."],"a":[1],"r":"Anhedonia is a common finding in many types of depression. It refers to feelings of a loss of pleasure in formerly pleasurable activities. Dysthymia is a diagnosis. Euphoria refers to an elated mood. Anergia means without energy.","med":false},{"c":14,"n":8,"s":"A patient diagnosed with major depression began taking a tricyclic antidepressant 1 week ago. Today the patient says, I don't think I can keep taking these pills. They make me so dizzy, especially when I stand up. The nurse will:","m":false,"rw":false,"o":["limit the patients activities to those that can be performed in a sitting position.","withhold the drug, force oral fluids, and notify the health care provider.","teach the patient strategies to manage postural hypotension.","update the patients mental status examination."],"a":[2],"r":"Drowsiness, dizziness, and postural hypotension usually subside after the first few weeks of therapy with tricyclic antidepressants. Postural hypotension can be managed by teaching the patient to stay well hydrated and rise slowly. Knowing this information may convince the patient to continue the medication. Activity is an important aspect of the patients treatment plan and should not be limited to activities that can be done in a sitting position. Withholding the drug, forcing oral fluids, and notifying the health care provider are unnecessary actions. Independent nursing action is called for. Updating a mental status examination is unnecessary.","med":true},{"c":14,"n":9,"s":"A patient diagnosed with depression is receiving imipramine (Tofranil) 200 mg qhs. Which assessment finding would prompt the nurse to collaborate with the health care provider regarding potentially hazardous side effects of this drug?","m":false,"rw":false,"o":["Dry mouth","Blurred vision","Nasal congestion","Urinary retention"],"a":[3],"r":"All the side effects mentioned are the result of the anticholinergic effects of the drug. Only urinary retention and severe constipation warrant immediate medical attention. Dry mouth, blurred vision, and nasal congestion may be less troublesome as therapy continues.","med":true},{"c":14,"n":10,"s":"A patient diagnosed with major depression tells the nurse, Bad things that happen are always my fault. Which response by the nurse will best assist the patient to reframe this overgeneralization?","m":false,"rw":false,"o":["I really doubt that one person can be blamed for all the bad things that happen.","Let's look at one bad thing that happened to see if another explanation exists.","You are being extremely hard on yourself. Try to have a positive focus.","Are you saying that you don't have any good things happen?"],"a":[1],"r":"By questioning a faulty assumption, the nurse can help the patient look at the premise more objectively and reframe it as a more accurate representation of fact. The incorrect responses cast doubt but do not require the patient to evaluate the statement.","med":false},{"c":14,"n":11,"s":"A nurse worked with a patient diagnosed with major depression, severe withdrawal, and psychomotor retardation. After 3 weeks, the patient did not improve. The nurse is most at risk for feelings of:","m":false,"rw":false,"o":["guilt and despair.","over-involvement.","interest and pleasure.","ineffectiveness and frustration."],"a":[3],"r":"Nurses may have expectations for self and patients that are not wholly realistic, especially regarding the patients progress toward health. Unmet expectations result in feelings of ineffectiveness, anger, or frustration. Nurses rarely become over-involved with patients with depression because of the patients resistance. Guilt and despair might be seen when the nurse experiences the patients feelings because of empathy. Interest is possible but not the most likely result.","med":false},{"c":14,"n":12,"s":"A patient diagnosed with depression begins selective serotonin reuptake inhibitor (SSRI) antidepressant therapy. The nurse should provide information to the patient and family about:","m":false,"rw":false,"o":["restricting sodium intake to 1 gram daily.","minimizing exposure to bright sunlight.","reporting increased suicidal thoughts.","maintaining a tyramine-free diet."],"a":[2],"r":"Some evidence indicates that suicidal ideation may worsen at the beginning of antidepressant therapy; thus, close monitoring is necessary. Avoiding exposure to bright sunlight and restricting sodium intake are unnecessary. Tyramine restriction is associated with monoamine oxidase inhibitor (MAOI) therapy.","med":true},{"c":14,"n":13,"s":"A nurse taught a patient about a tyramine-restricted diet. Which menu selection would the nurse approve?","m":false,"rw":false,"o":["Macaroni and cheese, hot dogs, banana bread, caffeinated coffee","Mashed potatoes, ground beef patty, corn, green beans, apple pie","Avocado salad, ham, creamed potatoes, asparagus, chocolate cake","Noodles with cheddar cheese sauce, smoked sausage, lettuce salad, yeast rolls"],"a":[1],"r":"The correct answer describes a meal that contains little tyramine. Vegetables and fruits contain little or no tyramine. Fresh ground beef and apple pie are safe. The other meals contain various amounts of tyramine-rich foods or foods that contain vasopressors: avocados, ripe bananas (banana bread), sausages/hot dogs, smoked meat (ham), cheddar cheese, yeast, caffeine drinks, and chocolate.","med":true},{"c":14,"n":14,"s":"What is the focus of priority nursing interventions for the period immediately after electroconvulsive therapy treatment?","m":false,"rw":false,"o":["Nutrition and hydration","Supporting physiological stability","Reducing disorientation and confusion","Assisting the patient to identify and test negative thoughts"],"a":[1],"r":"During the immediate post-treatment period, the patient is recovering from general anesthesia; hence, the priority need is to establish and support physiological stability. Reducing disorientation and confusion is an acceptable intervention but not the priority. Assisting the patient in identifying and testing negative thoughts is inappropriate in the immediate post-treatment period because the patient may be confused.","med":true},{"c":14,"n":15,"s":"A nurse provided medication education for a patient diagnosed with major depression who began a new prescription for phenelzine (Nardil). Which behavior indicates effective learning? The patient:","m":false,"rw":false,"o":["monitors sodium intake and weight daily.","wears support stockings and elevates the legs when sitting.","can identify foods with high selenium content that should be avoided.","confers with a pharmacist when selecting over-the-counter medications."],"a":[3],"r":"Over-the-counter medicines may contain vasopressor agents or tyramine, a substance that must be avoided when the patient takes MAOI antidepressants. Medications for colds, allergies, or congestion or any preparation that contains ephedrine or phenylpropanolamine may precipitate a hypertensive crisis. MAOI antidepressant therapy is unrelated to the need for sodium limitation, support stockings, or leg elevation. MAOIs interact with tyramine-containing foods, not selenium, to produce dangerously high blood pressure.","med":true},{"c":14,"n":16,"s":"Major depression resulted after a patients employment was terminated. The patient now says to the nurse, I'm not worth the time you spend with me. I am the most useless person in the world. Which nursing diagnosis applies?","m":false,"rw":false,"o":["Powerlessness","Defensive coping","Situational low self-esteem","Disturbed personal identity"],"a":[2],"r":"The patients statements express feelings of worthlessness and most clearly relate to the nursing diagnosis of situational low self-esteem. Insufficient information exists to lead to other diagnoses.","med":false},{"c":14,"n":17,"s":"A patient diagnosed with major depression does not interact with others except when addressed, and then only in monosyllables. The nurse wants to show nonjudgmental acceptance and support for the patient. Which communication technique will be effective?","m":false,"rw":false,"o":["Make observations.","Ask the patient direct questions.","Phrase questions to require yes or no answers.","Frequently reassure the patient to reduce guilt feelings."],"a":[0],"r":"Making observations about neutral topics such as the environment draws the patient into the reality around him or her but places no burdensome expectations for answers on the patient. Acceptance and support are shown by the nurses presence. Direct questions may make the patient feel that the encounter is an interrogation. Open\u0002ended questions are preferable if the patient is able to participate in dialogue. Platitudes are never acceptable. They minimize patient feelings and can increase feelings of worthlessness.","med":false},{"c":14,"n":18,"s":"A patient being treated for depression has taken 300 mg amitriptyline (Elavil) daily for a year. The patient calls the case manager at the clinic and says, I stopped taking my antidepressant 2 days ago. Now I am having cold sweats, nausea, a rapid heartbeat, and nightmare
