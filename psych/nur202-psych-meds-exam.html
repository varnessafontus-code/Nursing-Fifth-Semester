<style>
/* Layout: an exam booklet — sticky score strip on top, one question card at a time, answer sheet grid below */
:root{
  --paper:#EEF3F1; --card:#FFFFFF; --ink:#132029; --muted:#55646D; --line:#D2DCD9; --line-strong:#B9C7C3;
  --accent:#0A6A64; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --ok:#1E7A3C; --ok-soft:#E3F3E7; --bad:#AD2318; --bad-soft:#FBEAE7; --idle:#E4EAE8;
  --meds:#6A3D9A; --ch1:#1F6F8B; --ch6:#B03A2E; --ch8:#2E7D4F; --ch25:#A35C00;
  --shadow:0 1px 2px rgba(19,32,41,.06),0 6px 18px rgba(19,32,41,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --ok:#6FD08E; --ok-soft:#14301E; --bad:#FF8A7E; --bad-soft:#3A1C1A; --idle:#22313A;
  --meds:#C99BDA; --ch1:#6CC3D2; --ch6:#F08B80; --ch8:#80C99C; --ch25:#E7B95A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1517; --card:#162125; --ink:#E2ECE9; --muted:#9AABAF; --line:#26353A; --line-strong:#34474D;
  --accent:#4FC2B8; --accent-ink:#06211F; --accent-soft:#163A37;
  --ok:#6FD08E; --ok-soft:#14301E; --bad:#FF8A7E; --bad-soft:#3A1C1A; --idle:#22313A;
  --meds:#C99BDA; --ch1:#6CC3D2; --ch6:#F08B80; --ch8:#80C99C; --ch25:#E7B95A;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.score{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;color:var(--ink);white-space:nowrap}
.pill b{font-weight:500}
.pill .dot{width:8px;height:8px;border-radius:50%}
.bar{height:6px;border-radius:999px;background:var(--idle);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent))}
.chip .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .sp{flex:1}
.tbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.82rem;font-weight:700}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tbtn.warn{color:var(--bad)}

main .wrap{padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--c)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.meta .sec{font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.meta .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stem{margin:0;font-size:1.08rem;line-height:1.55;font-weight:400;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:11px 12px;cursor:pointer;transition:border-color .12s, background .12s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .let{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.85rem;background:var(--idle);color:var(--ink)}
.opt .txt{min-width:0}
.opt .mk{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;align-self:center}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .let{background:var(--ok);color:var(--card)}
.opt.correct .mk{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);color:var(--card)}
.opt.wrong .mk{color:var(--bad)}
.opt.dim{opacity:.6}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{margin:0;font-family:var(--f-display);font-stretch:110%;font-size:1rem}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb p{margin:0;max-width:70ch}
.fb .src{font-size:.8rem;color:var(--muted)}
.nav{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.nbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:700}
.nbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nbtn:disabled{opacity:.45;cursor:default}
.hint{font-size:.76rem;color:var(--muted)}
@media (max-width:600px){ .hint{display:none} }

.sheet{display:flex;flex-direction:column;gap:10px}
.sheet h2,.summary h2{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sheet h2::after,.summary h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:36px;border-radius:7px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums;position:relative}
.cell::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:7px 7px 0 0;background:var(--c)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:500}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:500}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}

.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 12px;align-items:center;font-size:.88rem}
.srow .lab{display:flex;gap:8px;align-items:center;min-width:0}
.srow .lab i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.srow .val{font-family:var(--f-mono);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.srow .bar{grid-column:1/-1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;background:var(--bad-soft);border:1px solid var(--bad);border-radius:9px;padding:8px 10px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line-strong);border-radius:12px}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<script>
const QUESTIONS = [{"s":"ch6","q":"A patient taking lithium carbonate has a serum lithium level of 1.7 mEq/L. The patient reports nausea and the nurse observes a coarse hand tremor. What is the nurse's priority action?","o":["Give the scheduled dose with food to reduce nausea","Reassure the patient that a tremor is an expected side effect","Encourage the patient to limit fluids for the next 24 hours","Hold the dose and notify the provider"],"a":3,"r":"Toxic symptoms begin above 1.5 mEq/L, and the slides say to hold the medication and notify the provider when the level reaches 1.5 or the patient has even mild symptoms. A coarse tremor is a toxic sign (a fine tremor is the expected side effect). Giving the dose worsens toxicity; fluid restriction raises lithium further; reassurance ignores toxicity.","src":"Slides 46–47"},{"s":"ch6","q":"A patient is admitted with acute mania and started on lithium. According to the course slides, which serum level shows the drug has reached the therapeutic range for acute mania?","o":["0.2–0.5 mEq/L","1.0–1.5 mEq/L","0.6–0.9 mEq/L","2.0–2.5 mEq/L"],"a":1,"r":"The slides give 1.0–1.5 mEq/L for acute mania and 0.6–1.2 mEq/L for maintenance. 0.2–0.5 is subtherapeutic; 0.6–0.9 is a maintenance-type level; 2.0–2.5 is toxic.","src":"Slide 44; lecture"},{"s":"ch6","q":"A nurse who has floated to the psychiatric unit is giving 0900 medications. A patient with bipolar disorder who takes lithium has a lithium level ordered for this morning. What should the nurse do first?","o":["Give the lithium, then send the patient to the lab","Ask the patient whether the blood sample has already been drawn","Hold lithium for the entire day","Give half the usual dose until the result is back"],"a":1,"r":"The level is drawn 12 hours after the last dose. If the morning dose is given before the draw, the result will be falsely high. The professor's example: the first question to ask is \"Did you have your blood work done?\" Holding all day or giving half a dose is not ordered.","src":"Slide 45; lecture"},{"s":"ch6","q":"The nurse is teaching a patient who is starting lithium. Which statement by the patient shows a need for more teaching?","o":["\"I will call my provider if I start vomiting or have diarrhea.\"","\"I'm going to start a low-salt diet to protect my heart.\"","\"I will keep drinking about 6 to 8 glasses of water a day.\"","\"I will carry an ID card that says I take lithium.\""],"a":1,"r":"Lithium acts like sodium. When sodium intake drops, the kidney reabsorbs lithium and toxicity results, so patients must not reduce salt. The other statements match the slide 49 teaching.","src":"Slides 48–49"},{"s":"ch6","q":"A patient who has taken lithium for 2 years calls the clinic and says, \"I've had a stomach bug with vomiting and diarrhea for 2 days.\" What is the best response by the nurse?","o":["\"Keep taking your lithium and rest until you feel better.\"","\"Double your next dose to make up for what you vomited.\"","\"Come in today so we can check your lithium level.\"","\"Stop drinking fluids until the vomiting stops.\""],"a":2,"r":"Vomiting and diarrhea deplete sodium and water, so the kidney holds on to lithium and toxicity can develop. Patients are taught to notify the provider, and the level should be checked. Doubling the dose or restricting fluids raises the risk further.","src":"Slides 48–49; lecture"},{"s":"ch1","q":"A patient who takes phenelzine (Nardil) calls on a Saturday night: \"I went out with friends and had pepperoni pizza and a beer. Now I have a terrible headache and my vision is blurry.\" What should the nurse tell the patient?","o":["\"Go to the nearest emergency department now.\"","\"Take acetaminophen and lie down in a dark room.\"","\"Skip tomorrow's dose of Nardil.\"","\"Call your psychiatrist on Monday morning.\""],"a":0,"r":"An MAOI plus tyramine (cured meat, beer) can cause a hypertensive crisis: severe headache, blurred vision, very high BP. It is life-threatening and needs emergency care. The other answers delay treatment.","src":"Slides 26, 33; lecture"},{"s":"ch1","q":"A patient taking tranylcypromine (Parnate) asks for a snack. Which choice is safest?","o":["Aged cheddar cheese and crackers","Cottage cheese with fresh fruit","Sautéed chicken livers","Salami on rye bread"],"a":1,"r":"Milk, yogurt and cottage cheese contain little or no tyramine. Aged cheese, chicken livers (an NCLEX favorite) and fermented sausage like salami are high in tyramine and can trigger a hypertensive crisis.","src":"Lecture"},{"s":"ch1","q":"A patient who takes isocarboxazid (Marplan) has surgery. The postoperative orders include meperidine (Demerol) for pain. What is the nurse's best action?","o":["Hold the meperidine and question the order with the prescriber","Give half the ordered dose of meperidine","Give the meperidine and monitor the BP every 4 hours","Give the meperidine with an antiemetic"],"a":0,"r":"MAOI + meperidine can cause hyper- or hypotension, coma, convulsions and death. The professor called Demerol \"the biggie\" NCLEX likes. A dangerous order is held and questioned; it is not given at any dose.","src":"Slide 26; lecture"},{"s":"ch1","q":"A patient taking sertraline (Zoloft) has a new antidepressant added. Two days later the patient is sweating heavily, has goosebumps, fluctuating vital signs and new confusion. Which action is the priority?","o":["Give the next scheduled doses with food","Encourage oral fluids and recheck vital signs in 4 hours","Hold the medications and notify the provider immediately","Document the findings as expected side effects"],"a":2,"r":"These are signs of serotonin syndrome. The nurse holds the drugs and notifies the provider so the patient can be sent for emergency care; it resolves when the drugs are stopped. Missing it can lead to cardiovascular collapse and death. It is the one time an SSRI is stopped abruptly.","src":"Slide 28; lecture"},{"s":"ch1","q":"A patient with major depression and a suicide plan started an antidepressant 9 days ago. Today the patient is showering, eating and talking more. What is the nurse's most important action?","o":["Ask the patient, \"Do you feel as good as you look?\" and assess for suicidal thoughts","Praise the patient and encourage more group activities","Tell the treatment team the patient is ready to reduce observation","Plan discharge teaching for the next day"],"a":0,"r":"As antidepressants take effect, energy often returns before mood lifts, so suicide potential increases as depression decreases. The nurse must reassess suicidal ideation and the plan (the professor's exact question). If the patient is still suicidal with a plan → 1:1 observation.","src":"Slide 24; lecture"},{"s":"ch1","q":"A patient is to start amitriptyline (Elavil). Which action should the nurse take before the first dose?","o":["Check a serum drug level","Obtain a baseline EKG","Start a tyramine-free diet","Draw a baseline WBC count"],"a":1,"r":"Tricyclics are cardiotoxic (QRS changes, dysrhythmias) and the most lethal antidepressants in overdose, so a baseline EKG is obtained. No drug level is needed to start; the tyramine diet is for MAOIs; WBC monitoring is for Clozaril and Tegretol.","src":"Lecture; slides 31, 34"},{"s":"ch1","q":"A male patient is prescribed trazodone (Desyrel) as needed for sleep. Which instruction is most important?","o":["\"Take it in the morning so it doesn't keep you awake.\"","\"Avoid all cheese and wine while taking it.\"","\"Report a painful erection that won't go away right away.\"","\"You will need monthly blood levels.\""],"a":2,"r":"Priapism is a rare but serious side effect of trazodone and is reported STAT (slides 34, 36). Trazodone is sedating, so it is taken at bedtime; the diet is for MAOIs; antidepressants don't need blood levels.","src":"Slides 34, 36; lecture"},{"s":"meds","q":"A patient started on buspirone (BuSpar) 3 days ago says, \"This pill isn't doing anything. I want something that works.\" Which response is best?","o":["\"I'll ask the provider to switch you to a stronger medication.\"","\"Take an extra dose when you feel anxious.\"","\"It may take about 10 days to 2 weeks before you feel the full effect.\"","\"It works best if you take it only when you feel anxious.\""],"a":2,"r":"BuSpar has a time lag: the professor said 10 days to 2 weeks minimum. It is taken every day on schedule, not PRN, and extra doses are not appropriate. Teaching about the lag is the nursing priority.","src":"Slide 18; lecture"},{"s":"meds","q":"Which statement about buspirone (BuSpar) is accurate?","o":["It does not depress the CNS and carries no risk of addiction","It is the drug of choice for a patient in an acute panic attack","It depresses the CNS and causes heavy sedation","It must be tapered quickly because of seizure risk"],"a":0,"r":"The slides say BuSpar does NOT depress the CNS (the exception among antianxiety agents), and the professor said there is no concern for addiction or tolerance. It is not for acute panic because the first dose does nothing.","src":"Slide 13; lecture"},{"s":"meds","q":"A patient has an order for clonazepam (Klonopin) 1 mg PO every 4 hours PRN anxiety. Two and a half hours after a dose the patient asks for another. What should the nurse do first?","o":["Assess why the patient is asking early: panic, withdrawal, or drug-seeking","Tell the patient no and walk away","Call the provider for a stronger medication","Give the dose because the patient says they are anxious"],"a":0,"r":"Benzodiazepines are controlled, addictive substances and the dose isn't due. The professor stressed assessing whether the patient is experiencing panic, withdrawal, or is manipulating. Assessment comes before any other action.","src":"Lecture"},{"s":"meds","q":"A patient is admitted for alcohol withdrawal. According to the lecture, which medication should the nurse look for as the answer on an exam question?","o":["Chlordiazepoxide (Librium)","Buspirone (BuSpar)","Sertraline (Zoloft)","Haloperidol (Haldol)"],"a":0,"r":"The professor said that on NCLEX the alcohol withdrawal answer is Librium (Ativan is often used in practice, especially in older adults because it is shorter acting). Alcohol withdrawal is also listed as a use for antianxiety agents on slide 11.","src":"Lecture; slide 11"},{"s":"ch8","q":"A patient with schizophrenia is started on olanzapine (Zyprexa), an atypical antipsychotic. Which lab result is most important for the nurse to monitor?","o":["Serum sodium","Blood glucose","Serum drug level","Platelet count"],"a":1,"r":"Atypical antipsychotics raise the risk of hyperglycemia and type 2 diabetes; the professor called Zyprexa \"infamous\" for it, and blood sugar should be monitored regularly. Sodium matters for lithium; there is no routine Zyprexa level.","src":"Slide 69; lecture"},{"s":"ch8","q":"A patient with a long history of not taking oral medication is ordered fluphenazine decanoate (Prolixin Decanoate). Which statement about this medication is correct?","o":["It is an atypical antipsychotic given orally once a day","It is a typical antipsychotic given as a deep IM injection, usually after an oral trial","It is given IV push over 2 minutes","It is used only for acute agitation in the emergency department"],"a":1,"r":"\"Decanoate\" means a typical antipsychotic; only Haldol and Prolixin come as decanoates. They are deep IM injections given about every 2 weeks for patients who don't take their pills. The patient takes the oral form first, because the injection stays in the body a long time.","src":"Slide 51; lecture"},{"s":"ch8","q":"A patient taking haloperidol (Haldol) suddenly screams; the neck is twisted to one side and the eyes are rolled upward. What should the nurse do?","o":["Give the next dose of haloperidol early","Leave to get the seizure-precaution equipment","Tell the patient to relax the neck muscles","Stay with the patient, call for help, and give benztropine (Cogentin) IM as ordered"],"a":3,"r":"This is acute dystonia with oculogyric crisis, treated as an emergency. Don't confuse it with a seizure and don't leave the patient; call for help and give Cogentin IM (Benadryl can substitute). It resolves almost immediately. More Haldol worsens it.","src":"Slides 63–64; lecture"},{"s":"ch8","q":"During group, a patient taking an antipsychotic keeps getting up, pacing and tapping both feet. How should the nurse interpret this behavior?","o":["The patient is likely experiencing akathisia, a medication side effect","The patient is showing signs of tardive dyskinesia","The patient is having a dystonic reaction","The patient is being deliberately disruptive and needs limits set"],"a":0,"r":"Akathisia = restlessness, fidgeting, \"happy feet.\" The professor said the patient can't help it, so telling them they're being disruptive doesn't help. TD involves facial and tongue movements; dystonia involves muscle spasms.","src":"Slide 63; lecture"},{"s":"ch8","q":"A patient who has taken chlorpromazine (Thorazine) for years has new lip smacking and worm-like movements of the tongue. What is the nurse's best action?","o":["Give benztropine (Cogentin) IM","Hold the medication and have the psychiatrist evaluate the patient","Discontinue the medication and document it","Reassure the patient that this will go away on its own"],"a":1,"r":"These are early signs of tardive dyskinesia, which is potentially irreversible. Prompt action may prevent irreversibility, but nurses don't discontinue medications: the nurse holds it and consults the psychiatrist. Cogentin does not treat TD.","src":"Slide 65; lecture"},{"s":"ch8","q":"A patient on haloperidol (Haldol) has severe muscle rigidity, a temperature of 105°F, fluctuating BP, diaphoresis and is becoming less responsive. Which action is the priority?","o":["Discontinue the antipsychotic and notify the provider STAT","Give the next dose of haloperidol to calm the patient","Give benztropine (Cogentin) and recheck in an hour","Apply restraints for patient safety"],"a":0,"r":"This is neuroleptic malignant syndrome: rare, fatal and fast. Stop the antipsychotic right away and notify the provider STAT (the professor calls a code). Monitor vital signs, rigidity, I&O and LOC, and cool the patient. Expect bromocriptine or dantrolene and transfer to the ICU. It is the one time an antipsychotic is stopped abruptly.","src":"Slides 67–68; lecture"},{"s":"ch8","q":"A patient who has taken clozapine (Clozaril) for 6 weeks says, \"My throat is sore and I feel achy and feverish.\" What should the nurse do?","o":["Give the dose and offer throat lozenges","Hold the clozapine and request an order for a WBC count","Encourage fluids and recheck in the morning","Give acetaminophen and the clozapine together"],"a":1,"r":"Sore throat, fever and malaise can signal agranulocytosis, which usually occurs within 3 months. The professor said to hold the Clozaril and ask the provider for an order for blood work (WBC). Agranulocytosis puts the patient at risk of opportunistic infection.","src":"Slides 61–62; lecture"},{"s":"ch8","q":"A patient with refractory schizophrenia who stopped taking clozapine (Clozaril) for 3 weeks is readmitted. The new order is clozapine 200 mg PO twice daily, the patient's previous dose. What is the nurse's best action?","o":["Give the dose because the patient tolerated it before","Hold the dose and question the order, because clozapine must be restarted at a low dose","Give half the dose and recheck vital signs","Give the dose with a benzodiazepine to prevent seizures"],"a":1,"r":"Clozapine must be started low and titrated slowly (about 25 mg twice or three times a day); starting high or titrating fast causes seizures. After nonadherence, the titration starts over from the beginning. Unlike Depakote, it can never be loaded.","src":"Lecture; slide 61"},{"s":"ch8","q":"A patient taking chlorpromazine (Thorazine) is going on a day pass to the beach in July. Which instruction is most important?","o":["\"Eat a high-sodium snack before you leave.\"","\"Use sunscreen and wear protective clothing and sunglasses.\"","\"Skip your morning dose so you don't get drowsy.\"","\"Avoid all dairy products while you are out.\""],"a":1,"r":"Antipsychotics cause photosensitivity, so patients use sunscreen and protective clothing (slides 58, 70). They also affect temperature regulation, so extremes of heat and cold are avoided. Doses are not skipped without the provider.","src":"Slides 58, 70; lecture"},{"s":"ch8","q":"A patient is to start ziprasidone (Geodon). Which assessment should be completed before the first dose?","o":["Serum lithium level","Abnormal Involuntary Movement Scale only","Tyramine dietary history","Baseline EKG"],"a":3,"r":"Geodon prolongs the QT interval (slide 60). The professor stressed knowing the patient's baseline EKG before starting it, then monitoring vital signs and watching for dizziness, palpitations, syncope or weakness.","src":"Slide 60; lecture"},{"s":"ch6","q":"A patient taking lamotrigine (Lamictal) for bipolar disorder shows the nurse a new red rash across the chest and back. What is the nurse's best action?","o":["Apply an over-the-counter hydrocortisone cream and continue the drug","Hold the next dose and report the rash to the provider promptly","Reassure the patient that a rash is harmless","Double the fluids and recheck in a week"],"a":1,"r":"The professor called it \"the Lamictal rash,\" usually on the torso. It is the side effect to watch for with Lamictal. A new rash is reported to the provider right away, and the provider decides whether to stop the drug.","src":"Lecture"},{"s":"ch6","q":"A hospitalized patient is started on carbamazepine (Tegretol) for bipolar disorder. According to the lecture, which lab value does the nurse expect to monitor closely?","o":["Serum potassium","White blood cell count","Hemoglobin A1C","Serum ammonia only"],"a":1,"r":"The professor said Tegretol patients have their WBCs monitored (about three times a week in the hospital) because a WBC below normal puts them at risk for opportunistic infection. Lithium and Depakote are the two mood stabilizers the professor said have blood levels monitored.","src":"Lecture"},{"s":"meds","q":"A patient prescribed alprazolam (Xanax) says, \"I like to have a glass of wine at dinner.\" What is the nurse's best response?","o":["\"One glass is fine if you take the pill with food.\"","\"Avoid alcohol completely, because together they can dangerously slow your breathing and level of consciousness.\"","\"Switch to beer instead of wine.\"","\"Take the Xanax 2 hours after the wine.\""],"a":1,"r":"Benzodiazepines and alcohol are both CNS depressants; together they add up, from sedation to respiratory depression and coma (slides 13, 15). Patients are taught not to consume other CNS depressants (\"don't have a martini with 2 mg of Xanax\").","src":"Slides 13, 15, 18; lecture"},{"s":"ch8","q":"A patient taking haloperidol (Haldol) says, \"I feel so stiff.\" The nurse notes a shuffling gait, a fine hand tremor and a mask-like face. Which assessment best confirms the nurse's suspicion?","o":["Asking permission, then checking for cogwheel rigidity at the elbow","Checking the pupils for constriction","Testing for a positive Homans sign","Measuring abdominal girth"],"a":0,"r":"These are signs of pseudoparkinsonism (EPS). The professor taught asking the psychiatric patient for permission to touch, then placing a thumb in the antecubital fossa while moving the arm to feel cogwheeling. Cogentin can be ordered to treat it.","src":"Slide 63; lecture"},{"s":"ch25","q":"A patient is starting disulfiram (Antabuse). Which statement by the patient shows the teaching was effective?","o":["\"I can still use my regular mouthwash and aftershave.\"","\"A small glass of wine on weekends is okay.\"","\"I'll check labels and avoid anything with alcohol, even vanilla extract and mouthwash.\"","\"I can drink as long as I take the pill afterward.\""],"a":2,"r":"Patients on disulfiram cannot have any alcohol, ingested or on the skin. The professor listed baked goods with vanilla extract, mouthwash, aftershave and cologne. Exposure makes the patient violently sick.","src":"Lecture"},{"s":"ch1","q":"A patient taking paroxetine (Paxil) for 1 week says, \"I feel a little better, so I'm going to stop taking it.\" What is the nurse's best response?","o":["\"That's fine as long as you feel better.\"","\"You can take it only on days you feel down.\"","\"Keep taking it every day as prescribed. The full effect takes time, and you shouldn't stop it on your own.\"","\"Cut the dose in half on your own for a week, then stop.\""],"a":2,"r":"Teaching from the slides: keep taking the medication, the full effect may take up to 4 weeks, and do not stop it abruptly. Only the prescriber changes the dose.","src":"Slides 30, 35"},{"s":"ch8","q":"Besides treating psychosis, haloperidol (Haldol) is also used to treat which condition?","o":["Hypertension","Insomnia in older adults","Hypothyroidism","Tourette syndrome tics"],"a":3,"r":"Slide 50 lists tics and vocal utterances (and intractable hiccoughs) as uses of antipsychotics, and the professor said Tourette syndrome patients respond well to Haldol.","src":"Slide 50; lecture"},{"s":"ch25","q":"A patient starts a drug with strong anticholinergic effects. Which findings should the nurse watch for?","o":["Diarrhea and excess salivation","Increased sweating and frequent urination","Bradycardia and pinpoint pupils","Dry mouth, constipation and urinary retention"],"a":3,"r":"Anticholinergic side effects are the \"dry\" effects: dry mouth, blurred vision, constipation and urinary retention, plus a fast heart rate. The professor said to ask about the last void and the last bowel movement.","src":"Slides 31, 57"},{"s":"meds","q":"A patient has acute anxiety 2 hours after a car accident. Which medication group should the nurse expect to teach about?","o":["Benzodiazepines","Antipsychotics","Mood stabilizers","Tricyclic antidepressants"],"a":0,"r":"Benzodiazepines relieve acute anxiety quickly. Antidepressants and BuSpar take weeks, and antipsychotics and mood stabilizers treat psychosis and mania.","src":"Slides 11–13"},{"s":"ch1","q":"A patient is admitted with severe depression. Which medication should the nurse expect to teach the patient about?","o":["Chlordiazepoxide (Librium)","Clozapine (Clozaril)","Lithium carbonate","Sertraline (Zoloft)"],"a":3,"r":"Sertraline is an SSRI, the drug of choice for major depression. Librium is a benzodiazepine, Clozaril is an antipsychotic, and lithium is a mood stabilizer.","src":"Slide 22; lecture"},{"s":"ch6","q":"A patient with bipolar disorder is irritable, aggressive, very talkative and agitated. Which medication group should the nurse expect?","o":["SSRIs","Psychostimulants","Anticholinergics","Mood stabilizers"],"a":3,"r":"These are signs of mania, treated with mood stabilizers such as lithium and anticonvulsants (Tegretol, Depakote, Lamictal). Stimulants and antidepressants can worsen mania.","src":"Slides 38–39"},{"s":"ch8","q":"Compared with a patient on an atypical antipsychotic, a patient on fluphenazine (Prolixin), a typical antipsychotic, is at higher risk for which side effect?","o":["Hypertensive crisis","Extrapyramidal symptoms (EPS)","Serotonin syndrome","Lithium toxicity"],"a":1,"r":"The professor said patients are more at risk for side effects with typicals. Patients on Haldol or Prolixin are more at risk for EPS than patients on atypicals such as Risperdal. Hypertensive crisis is an MAOI problem, serotonin syndrome comes from too much serotonin, and lithium toxicity applies only to lithium.","src":"Lecture; Slide 63"},{"s":"ch1","q":"A patient says, \"My doctor switched me to Paxil (paroxetine). I guess I'll get the same side effects I had on Tofranil (imipramine).\" The nurse's reply is based on knowing that paroxetine is:","o":["A tricyclic antidepressant","An MAO inhibitor","An SSRI, with fewer side effects than a tricyclic","A benzodiazepine"],"a":2,"r":"Paxil is an SSRI; Tofranil is a tricyclic. SSRIs are better tolerated and much safer in overdose, though SSRIs have their own side effects (insomnia, headache, sexual dysfunction).","src":"Slides 22, 31–32"},{"s":"ch1","q":"Which medication is most likely to cause anticholinergic side effects?","o":["Lithium","Buspirone (BuSpar)","Imipramine (Tofranil)","Sertraline (Zoloft)"],"a":2,"r":"Imipramine is a tricyclic with strong anticholinergic effects (dry mouth, blurred vision, constipation, urinary retention). Lithium affects fluid balance; BuSpar has few side effects; SSRIs have few anticholinergic effects.","src":"Slides 22, 31"},{"s":"ch1","q":"A nurse's patients take haloperidol (Haldol), carbamazepine (Tegretol), trazodone (Desyrel) and phenelzine (Nardil). Which patient needs a special diet order?","o":["The patient on Nardil","The patient on Tegretol","The patient on Desyrel","The patient on Haldol"],"a":0,"r":"Nardil is an MAOI, so the patient needs a tyramine-restricted diet to prevent hypertensive crisis.","src":"Slides 22, 33"},{"s":"ch1","q":"Why does a patient taking an MAOI need to avoid certain foods and medications?","o":["Risk of cardiac dysrhythmia","Risk of hypotensive shock","Risk of hypertensive crisis","Risk of hypoglycemia"],"a":2,"r":"With MAO blocked, tyramine from food builds up and causes intense vasoconstriction, raising blood pressure to dangerous levels (slides 26, 33).","src":"Slides 26, 33"},{"s":"ch1","q":"Which outcome is most appropriate for a patient taking an SSRI?","o":["Depressive symptoms improve","Thoughts are organized and coherent","Motor activity decreases","Extrapyramidal symptoms decrease"],"a":0,"r":"SSRIs relieve depression by increasing available serotonin. They don't treat thought disorders or hyperactivity, and they don't cause or treat EPS.","src":"Slides 20–21"},{"s":"ch6","q":"A nurse cares for four patients taking clozapine, lithium, fluoxetine and venlafaxine. Which patient most needs monitoring for fluid and electrolyte imbalance?","o":["The patient on lithium","The patient on clozapine","The patient on fluoxetine","The patient on venlafaxine"],"a":0,"r":"Lithium acts like sodium in the body. Changes in sodium and fluid (vomiting, diarrhea, sweating, low salt intake) quickly change lithium levels and can cause toxicity.","src":"Slide 48"},{"s":"ch6","q":"Carbamazepine (Tegretol), lamotrigine (Lamictal) and gabapentin (Neurontin) belong to the same group of mood stabilizers. Which drug also belongs in this group?","o":["Divalproex (Depakote)","Buspirone (BuSpar)","Donepezil (Aricept)","Trazodone (Desyrel)"],"a":0,"r":"These are anticonvulsant mood stabilizers. Depakote is also an anticonvulsant used for bipolar disorder (slide 39).","src":"Slide 39"},{"s":"ch8","q":"A patient with schizophrenia is starting an atypical antipsychotic. Which existing health problem calls for the closest extra monitoring?","o":["Osteoarthritis","Type 2 diabetes","Seasonal allergies","Mild hearing loss"],"a":1,"r":"Atypical antipsychotics raise blood sugar and can cause or worsen type 2 diabetes (slide 69), so glucose must be monitored closely. Weight gain and lipid changes add to the risk.","src":"Slide 69; lecture"},{"s":"meds","q":"A patient taking diazepam (Valium) says the medication \"barely works anymore.\" Which habit reported by the patient most likely explains this?","o":["Taking the dose with breakfast","Drinking a glass of milk at bedtime","Drinking four cups of coffee and smoking a pack of cigarettes a day","Walking 30 minutes every evening"],"a":2,"r":"Smoking and caffeine decrease the effects of antianxiety agents. Alcohol, opioids and other CNS depressants do the opposite and increase them.","src":"Slide 15"},{"s":"meds","q":"A patient is being discharged on an antianxiety medication. Which symptom should the nurse teach the patient to report to the provider right away?","o":["Sore throat, fever or easy bruising","Dry mouth","Mild drowsiness the first few days","Feeling calmer in social situations"],"a":0,"r":"Sore throat, fever, restlessness and easy bruising can point to a blood problem and must be reported. Drowsiness and dry mouth are expected side effects, and feeling calmer means the drug is working.","src":"Slide 18"},{"s":"meds","q":"According to the course slides, how long has the effectiveness of antianxiety agents been studied?","o":["Up to 2 weeks","Lifelong use has been proven safe and effective","Up to 2 years","Up to 4 months; use longer than that has not been evaluated"],"a":3,"r":"The slides state that efficacy beyond 4 months has not been evaluated. That is one reason these drugs are meant for short-term use, along with the risk of tolerance and dependence.","src":"Slide 11"},{"s":"meds","q":"An 82-year-old patient given alprazolam (Xanax) for anxiety becomes agitated, excited and combative an hour later. What is the nurse most likely seeing?","o":["A therapeutic response","Paradoxical excitement from the benzodiazepine","Serotonin syndrome","Tardive dyskinesia"],"a":1,"r":"Paradoxical excitement is a listed side effect of antianxiety agents. The drug causes the opposite of the expected calming effect, and older adults are more prone to it. The slides list the elderly as a precaution group.","src":"Slide 17"},{"s":"meds","q":"A patient who has taken clonazepam (Klonopin) daily for a year says, \"I'm out of pills, so I'll just stop.\" Which risk concerns the nurse most?","o":["Weight gain","Photosensitivity","Hypertensive crisis","Seizures from abrupt withdrawal"],"a":3,"r":"The nursing diagnosis on the slides is \"Risk for injury related to seizures… abrupt withdrawal after long-term use.\" Teach the patient never to stop suddenly; the provider tapers the dose.","src":"Slides 16, 18"},{"s":"ch1","q":"A patient who had a myocardial infarction 5 days ago is depressed. The provider asks about starting amitriptyline (Elavil). Which concern should the nurse raise?","o":["Tricyclics are contraindicated during the acute recovery phase after an MI","Tricyclics cause hypertensive crisis with cheese","Tricyclics must be given IM after an MI","There is no concern; tricyclics protect the heart"],"a":0,"r":"The professor said patients with a history of hypertension, MI or CHF are not candidates for tricyclics because tricyclics are so cardiotoxic. The slides also list the recovery phase after an MI as a contraindication.","src":"Lecture; Slides 23, 31"},{"s":"ch1","q":"A patient with a history of seizures is started on a tricyclic antidepressant. Why does the nurse put seizure precautions in place?","o":["Tricyclics raise the seizure threshold","Tricyclics cause hypoglycemia","Tricyclics lower the seizure threshold","Tricyclics cause dystonia"],"a":2,"r":"Antidepressants, especially tricyclics, lower the seizure threshold, so seizures happen more easily. The slides list a history of seizures as a precaution.","src":"Slides 23, 31"},{"s":"ch1","q":"A depressed patient on a tricyclic antidepressant is being discharged. Why does the provider order only a 1-week supply?","o":["Tricyclics expire quickly","The drug is expensive","The patient will need a new drug in 1 week","An overdose of a tricyclic can be fatal because of its cardiac effects"],"a":3,"r":"The slides say that because of the cardiac side effects, a week's supply is given, since the patient can overdose. Limiting the supply limits suicide risk.","src":"Slide 34"},{"s":"ch1","q":"A patient started sertraline (Zoloft) 10 days ago and says, \"Nothing's changed. This doesn't work.\" What is the nurse's best response?","o":["\"Let's ask your provider to switch you to another drug today.\"","\"You can stop it if it isn't helping.\"","\"Double your dose to speed it up.\"","\"It can take up to 4 weeks to feel the full effect, so keep taking it every day.\""],"a":3,"r":"Patient teaching on the slides: the therapeutic effect may take up to 4 weeks, keep taking it, do not stop abruptly, and do not double up.","src":"Slides 35, 36"},{"s":"ch1","q":"A patient asks how the side effects of an SSRI compare with a tricyclic. Which side effect is listed for SSRIs?","o":["Weight gain","Sexual dysfunction","Urinary retention","Photosensitivity"],"a":1,"r":"The SSRI slide lists insomnia, headache, weight loss, sexual dysfunction and serotonin syndrome. Weight gain, urinary retention and photosensitivity are on the tricyclic list.","src":"Slides 31, 32"},{"s":"ch1","q":"A patient on nortriptyline (Pamelor) complains of a very dry mouth. Which advice does the nurse give?","o":["\"Stop the medicine until your mouth feels better.\"","\"Drink a glass of wine to relax your mouth.\"","\"Take frequent sips of water and chew sugarless gum.\"","\"Rinse with mouthwash that contains alcohol every hour.\""],"a":2,"r":"The slides list dry mouth as a side effect and teach frequent sips of water and chewing gum. Never stop the medication abruptly. Alcohol is to be avoided.","src":"Slides 30, 35"},{"s":"ch1","q":"A patient on venlafaxine (Effexor) says, \"I forgot yesterday's dose, so I'll take two today.\" What should the nurse teach?","o":["\"Don't double up. Take your next dose as scheduled, and call your provider if you aren't sure.\"","\"That's fine as long as you take them together.\"","\"Take three to make up for it.\"","\"Skip today's dose too.\""],"a":0,"r":"\"Do not double up on meds\" is on the antidepressant teaching slide. A double dose raises the risk of side effects and toxicity.","src":"Slide 36"},{"s":"ch1","q":"A patient who takes phenelzine (Nardil) has a new order to add sertraline (Zoloft). What should the nurse do?","o":["Give the sertraline as ordered","Hold the sertraline and question the order","Give the sertraline with a full meal","Give half the dose of each drug"],"a":1,"r":"The professor said that if you see an order for an SSRI and an MAOI at the same time, \"there's something wrong. Don't administer that.\" Together they can cause a hypertensive crisis or serotonin syndrome.","src":"Lecture; Slide 28"},{"s":"ch1","q":"Which evaluation finding best shows that care of a patient on an antidepressant has met its most important goal?","o":["The patient has not harmed self","The patient has gained 5 pounds","The patient sleeps 12 hours a night","The patient knows the name of the drug"],"a":0,"r":"The first evaluation item on the slides is \"has not harmed self.\" The top nursing diagnosis is risk for suicide related to depressed mood, so safety comes first.","src":"Slides 29, 37"},{"s":"ch6","q":"A patient was started on lithium 3 days ago. How often should serum lithium levels be checked at this stage?","o":["Once a year","Once a month","Only if the patient has symptoms","1–2 times a week until the dose and level are stable"],"a":3,"r":"The slides state that levels are monitored 1–2 times a week after treatment starts, until the dosage and serum level are stable. After that they are checked less often.","src":"Slide 44"},{"s":"ch6","q":"A patient taking lithium has a level of 2.4 mEq/L. Which findings match this level?","o":["Mild thirst only","Seizures, coma and cardiovascular collapse","Lots of dilute urine, worsening tremors, muscle irritability and confusion","No symptoms; this level is therapeutic"],"a":2,"r":"Toxicity symptoms by level: 1.5–2.0 brings blurred vision, ataxia, tinnitus, persistent nausea and vomiting, and severe diarrhea. 2.0–3.5 brings excessive dilute urine, increasing tremors, muscle irritability, psychomotor retardation and confusion. Above 3.5 brings seizures, coma, arrhythmias and cardiovascular collapse.","src":"Slide 46"},{"s":"ch6","q":"A patient on lithium reports ringing in the ears, blurred vision and an unsteady walk. The nurse expects the lithium level to be in which range?","o":["0.6–1.2 mEq/L","1.5–2.0 mEq/L","1.0–1.5 mEq/L","Above 3.5 mEq/L"],"a":1,"r":"Tinnitus, blurred vision and ataxia, along with persistent nausea, vomiting and severe diarrhea, are early toxicity at 1.5–2.0 mEq/L. Hold the dose and notify the provider.","src":"Slides 46, 47"},{"s":"ch6","q":"A patient's lithium level is 3.8 mEq/L. Which findings should the nurse be ready for?","o":["Tinnitus and mild nausea only","Weight gain and acne","Dry mouth and constipation","Seizures, coma, arrhythmias and possible cardiovascular collapse"],"a":3,"r":"Above 3.5 mEq/L the slides list impaired consciousness, nystagmus, seizures, coma, oliguria or anuria, arrhythmias, MI and cardiovascular collapse. This is life-threatening.","src":"Slide 46"},{"s":"ch6","q":"A patient on lithium plans to start running outdoors in the summer. Which teaching matters most?","o":["\"Cut back on salt so your blood pressure stays low.\"","\"Drink 6–8 glasses of water a day and replace fluid and salt you lose from sweating.\"","\"Take an extra lithium dose before you run.\"","\"Avoid drinking water while you run.\""],"a":1,"r":"Lithium acts like sodium. When the body loses sodium (sweating, vomiting, diarrhea, a low-salt diet), the kidneys hold on to lithium and the level rises toward toxicity. The slides teach 6–8 glasses of water a day and not reducing sodium.","src":"Slides 48, 49"},{"s":"ch6","q":"A patient with acute mania is pacing the halls nonstop, not eating, and running into other patients. Which nursing diagnosis is the priority?","o":["Risk for injury related to manic hyperactivity","Knowledge deficit related to the medication","Disturbed body image","Social isolation"],"a":0,"r":"\"Risk for injury related to manic hyperactivity\" is the first mood-stabilizer diagnosis on the slides. Physical safety comes before teaching or psychosocial goals.","src":"Slide 42"},{"s":"ch8","q":"A patient has had hiccups for 3 days that nothing has stopped. The provider orders chlorpromazine (Thorazine). The patient asks, \"Isn't that for mental illness?\" What is the best response?","o":["\"Yes. The provider must think you have psychosis.\"","\"That must be a mistake. I'll throw it away.\"","\"It's also used to treat hiccups that won't go away.\"","\"It's a sleeping pill.\""],"a":2,"r":"The slides list intractable hiccups as a use for antipsychotics, along with psychosis and tics and vocal outbursts.","src":"Slide 50"},{"s":"ch8","q":"A patient on an oral antipsychotic also takes an antacid several times a day. What should the nurse teach?","o":["\"Space the antacid away from the antipsychotic, because antacids reduce absorption.\"","\"Take them at the same time so you remember.\"","\"The antacid makes the antipsychotic stronger.\"","\"Stop the antipsychotic while you use antacids.\""],"a":0,"r":"Antacids and antidiarrheals decrease the absorption of antipsychotics, so the drug works less well. Give them at different times.","src":"Slide 53"},{"s":"ch8","q":"A patient on haloperidol (Haldol) is also taking a beta blocker for high blood pressure. Which assessment matters most?","o":["Blood glucose","Hearing","Blood pressure, especially when the patient stands up","Skin color"],"a":2,"r":"Beta-adrenergic blockers add to the hypotensive effect of antipsychotics. Check orthostatic blood pressure and teach the patient to rise slowly.","src":"Slides 53, 70"},{"s":"ch8","q":"A male patient on risperidone (Risperdal) is embarrassed and says his chest is getting bigger. What should the nurse know?","o":["Gynecomastia is a hormonal side effect of antipsychotics and should be reported","This is a sign of NMS","This happens only with benzodiazepines","This is a sign of lithium toxicity"],"a":0,"r":"Hormonal side effects on the slides: decreased libido, retrograde ejaculation, gynecomastia, amenorrhea and weight gain. These effects often lead patients to stop taking the drug, so address them openly.","src":"Slide 59"},{"s":"ch8","q":"A patient taking ziprasidone (Geodon) reports dizziness and a \"fluttering\" heartbeat, then nearly faints. What is the most likely cause?","o":["Hypoglycemia","Tardive dyskinesia","Akathisia","Prolonged QT interval"],"a":3,"r":"Geodon can prolong the QT interval. The slides say to monitor vital signs every shift and watch for dizziness, palpitations, syncope or weakness. Notify the provider and expect an EKG.","src":"Slide 60"},{"s":"ch8","q":"Which antipsychotic is specifically noted on the slides for causing seizures in about 5% of patients, depending on dose?","o":["Clozapine (Clozaril)","Haloperidol (Haldol)","Chlorpromazine (Thorazine)","Aripiprazole (Abilify)"],"a":0,"r":"The slides note that Clozaril lowers the seizure threshold and causes seizures in about 5% of patients, depending on dose. Patients with a seizure history need close monitoring.","src":"Slide 61"},{"s":"ch8","q":"A patient on clozapine (Clozaril) wakes up with a wet pillow every morning and is drooling during the day. What is this?","o":["A sign of an MAOI reaction","A sign of agranulocytosis","A sign of lithium toxicity","Hypersalivation, a known side effect of clozapine"],"a":3,"r":"Hypersalivation is listed with clozapine on the slides. It is unusual because most antipsychotics cause dry mouth.","src":"Slides 56, 62"},{"s":"ch8","q":"A patient's eyes suddenly roll back and stay fixed upward an hour after an IM dose of haloperidol (Haldol). The patient is awake and terrified. What should the nurse do?","o":["Treat it as a seizure and only document","Give another dose of haloperidol","Tell the patient to relax and close the eyes","Treat it as an emergency: stay with the patient, notify the provider STAT, and give benztropine (Cogentin) as ordered"],"a":3,"r":"This is an oculogyric crisis. It can look like a seizure or a dystonic reaction, and both are emergencies. Notify the provider STAT, give Cogentin as ordered, and stay with the patient to reassure them.","src":"Slides 63, 64"},{"s":"ch8","q":"Which extrapyramidal symptom (EPS) is matched to the correct description?","o":["Akathisia: a fixed upward stare","Akinesia: muscle weakness","Dystonia: restless \"happy feet\"","Pseudoparkinsonism: worm-like tongue movements"],"a":1,"r":"From the slides: akinesia is muscle weakness. Akathisia is restlessness (\"happy feet\"). Dystonia is muscle spasms. Oculogyric crisis is the eyes rolling back. Pseudoparkinsonism is tremor, shuffling, drooling and rigidity. Worm-like tongue movements are tardive dyskinesia.","src":"Slide 63"},{"s":"ch8","q":"A patient has neuroleptic malignant syndrome (NMS). The antipsychotic has been stopped. Which drug should the nurse expect the provider to order?","o":["Benztropine (Cogentin)","Lithium carbonate","Haloperidol (Haldol)","Dantrolene (Dantrium) or bromocriptine (Parlodel)"],"a":3,"r":"The slides state the provider may order bromocriptine or dantrolene to counteract NMS. The patient is usually transferred to a medical unit.","src":"Slide 68"},{"s":"ch8","q":"A patient with suspected NMS has been transferred. Which set of assessments do the slides direct the nurse to monitor?","o":["Hearing and vision","Weight and appetite only","Vital signs, degree of muscle rigidity, intake and output, and level of consciousness","Mood and sleep only"],"a":2,"r":"Ongoing NMS care on the slides: monitor vital signs (especially temperature), degree of muscle rigidity, intake and output, and level of consciousness.","src":"Slide 68"},{"s":"ch8","q":"A family member asks how quickly NMS develops. What is accurate?","o":["It can start hours or even years after the drug is started, and then gets worse quickly over 24–72 hours","It only happens on the first day of treatment","It develops slowly over many months","It only happens after the drug is stopped"],"a":0,"r":"The slides state NMS onset can be hours to years after starting the medication, with rapid progression over 24–72 hours. That is why the nurse monitors temperature and rigidity routinely.","src":"Slide 67"},{"s":"ch8","q":"A patient on chlorpromazine (Thorazine) is going home in January. Which teaching is important?","o":["\"Dress warmly in cold weather.\"","\"Take a hot bath every night.\"","\"Stop your medicine when it's cold out.\"","\"You don't need sunscreen in winter.\""],"a":0,"r":"Antipsychotics affect temperature regulation, so the slides say to avoid extreme temperatures and dress warmly in cold weather. Sunscreen is still needed because of photosensitivity.","src":"Slides 52, 70"},{"s":"ch8","q":"Antipsychotic teaching says never stop the medication abruptly, with one exception. What is it?","o":["Mild dry mouth","Weight gain","Feeling better","Neuroleptic malignant syndrome"],"a":3,"r":"The slides say \"Do not stop taking the meds abruptly (except NMS).\" With NMS, the drug is stopped right away and the provider is notified STAT.","src":"Slides 68, 70"},{"s":"ch25","q":"A patient says, \"Now that I'm on medication, I don't need therapy anymore.\" Which response reflects the slides?","o":["\"You're right. The medicine cures the illness.\"","\"You only need therapy if the medicine fails.\"","\"Medication helps relieve symptoms but doesn't solve emotional problems. It works best together with therapy.\"","\"Therapy and medicine can't be used together.\""],"a":2,"r":"Psychotropic medications are not meant to cure mental illness. They relieve physical and behavioral symptoms and are used together with therapy.","src":"Slides 6, 7"},{"s":"ch8","q":"Which medication is an atypical (new-generation) antipsychotic?","o":["Fluphenazine (Prolixin)","Chlorpromazine (Thorazine)","Quetiapine (Seroquel)","Haloperidol (Haldol)"],"a":2,"r":"Seroquel is on the new-generation side of Slide 51, along with Risperdal, Clozaril, Zyprexa, Geodon and Abilify. Thorazine, Prolixin and Haldol are old-generation (typical) antipsychotics.","src":"Slide 51"},{"s":"ch8","q":"Which medication is a typical (old-generation) antipsychotic?","o":["Aripiprazole (Abilify)","Thiothixene (Navane)","Risperidone (Risperdal)","Olanzapine (Zyprexa)"],"a":1,"r":"Navane is on the old-generation list, along with Thorazine, Prolixin, Trilafon, Compazine, Mellaril, Stelazine, Haldol and Loxitane. Abilify, Risperdal and Zyprexa are atypicals.","src":"Slide 51"},{"s":"ch8","q":"Which trade and generic names are correctly matched?","o":["Seroquel – olanzapine","Zyprexa – quetiapine","Abilify – aripiprazole","Geodon – risperidone"],"a":2,"r":"The correct pairs: Abilify is aripiprazole, Seroquel is quetiapine, Zyprexa is olanzapine, Geodon is ziprasidone, Risperdal is risperidone, and Clozaril is clozapine. The professor said the exam will give both trade and generic names.","src":"Slide 51; Lecture"},{"s":"ch8","q":"The order reads \"quetiapine 50 mg PO at bedtime.\" The patient asks what the brand name is. What should the nurse say?","o":["Haldol","Zyprexa","Risperdal","Seroquel"],"a":3,"r":"Quetiapine is Seroquel. A memory trick: most atypical generic names end in -apine (clozapine, olanzapine, quetiapine) or -idone (risperidone, ziprasidone).","src":"Slide 51"},{"s":"ch8","q":"Which list contains only atypical (new-generation) antipsychotics?","o":["Haldol, Risperdal, Seroquel","Clozaril, Zyprexa, Geodon","Thorazine, Abilify, Clozaril","Prolixin, Mellaril, Zyprexa"],"a":1,"r":"Clozaril, Zyprexa and Geodon are all atypicals. Each of the other lists mixes in a typical: Haldol, Thorazine, or Prolixin and Mellaril.","src":"Slide 51"},{"s":"ch8","q":"According to the lecture, which statement best describes the difference in side effects between typical and atypical antipsychotics?","o":["Both can cause side effects, but the risk is much higher with typicals","Only typical antipsychotics cause side effects","Atypicals cause more EPS than typicals","Neither causes EPS"],"a":0,"r":"The professor said patients are at risk for side effects with either kind, but the incidence is significantly lower with atypicals. Patients on Haldol or Prolixin are more at risk for EPS.","src":"Lecture"},{"s":"ch8","q":"A student says, \"My patient is on risperidone (Risperdal), an atypical, so I don't need to watch for EPS.\" What is the best reply?","o":["\"EPS is less likely with an atypical, but it can still happen, so keep assessing for it.\"","\"That's right. Atypicals never cause EPS.\"","\"EPS only happens with antidepressants.\"","\"Only Clozaril causes EPS.\""],"a":0,"r":"The professor used this exact example: just because the patient is on risperidone, an atypical, don't think EPS can't happen. The risk is lower, not zero.","src":"Lecture"},{"s":"ch8","q":"According to the lecture, why should nurses rarely see new cases of tardive dyskinesia today?","o":["Tardive dyskinesia is now curable","Antipsychotics are no longer prescribed","Atypical antipsychotics have greatly reduced how often it develops","Benztropine prevents all tardive dyskinesia"],"a":2,"r":"The professor said that thanks to the atypicals, nurses should rarely see tardive dyskinesia except in patients who took the older typicals for years. It is still permanent once it develops.","src":"Lecture; Slide 65"},{"s":"ch8","q":"A patient is severely agitated and psychotic. According to the lecture, which medication is a classic choice for an IM injection to calm the crisis?","o":["Sertraline (Zoloft)","Chlorpromazine (Thorazine)","Buspirone (BuSpar)","Lithium carbonate"],"a":1,"r":"The professor described \"a nice little injection of Thorazine\" to calm psychomotor agitation and head off a crisis.","src":"Lecture"},{"s":"ch8","q":"A long-acting injection (LAI) is ordered for a patient on an atypical antipsychotic. What does \"LAI\" tell the nurse?","o":["The drug is only given by mouth","The drug is given as a long-acting injection, often for patients with a history of not taking their pills","The drug is a decanoate of a typical antipsychotic","The drug is given IV push"],"a":1,"r":"The lecture said typicals come as decanoates (Haldol and Prolixin), while atypicals come as long-acting injectables (LAI). The professor named Risperdal Consta as an example. Both help patients who have trouble taking pills every day.","src":"Lecture"},{"s":"ch8","q":"Which atypical antipsychotic is NOT given as a first choice and is saved for refractory schizophrenia?","o":["Quetiapine (Seroquel)","Risperidone (Risperdal)","Clozapine (Clozaril)","Aripiprazole (Abilify)"],"a":2,"r":"Clozaril is the last resort after several other antipsychotics have failed. Question an order for Clozaril in a patient having a first episode.","src":"Lecture"},{"s":"ch6","q":"Besides lithium, which mood stabilizer did the professor say also requires blood levels to be monitored?","o":["Lamotrigine (Lamictal)","Buspirone (BuSpar)","Topiramate (Topamax)","Divalproex (Depakote)"],"a":3,"r":"The professor said the two mood stabilizers with monitored blood levels are lithium and Depakote. With carbamazepine (Tegretol), the nurse monitors the WBC, not a drug level.","src":"Lecture"},{"s":"ch6","q":"A patient who often stops taking divalproex (Depakote) arrives in the psych ED with no Depakote in the bloodstream. Which order should the nurse expect?","o":["No Depakote until the patient has been stable for 30 days","Start at the lowest dose and increase slowly over weeks","A loading (bolus) dose to bring the level up quickly","Switch to clozapine"],"a":2,"r":"The professor said Depakote can be given as a loading dose to get a returning patient started again. Clozapine is the opposite: after a gap, it must always restart low and go up slowly.","src":"Lecture"},{"s":"ch6","q":"Divalproex (Depakote) is the same drug family as which generic name?","o":["Lamotrigine","Carbamazepine","Valproic acid","Lithium carbonate"],"a":2,"r":"Depakote is divalproex, a form of valproic acid. Carbamazepine is Tegretol, and lamotrigine is Lamictal.","src":"Lecture; Slide 39"},{"s":"ch6","q":"A bipolar patient is on dialysis. According to the lecture, why might the provider choose an anticonvulsant mood stabilizer instead of lithium?","o":["Lithium causes a torso rash","Lithium causes agranulocytosis","Lithium is only given IM","Lithium is hard on the kidneys"],"a":3,"r":"The professor gave two reasons a provider might pick an anticonvulsant over lithium: lithium is rough on the kidneys, and it causes a lot of weight gain.","src":"Lecture"},{"s":"ch6","q":"A patient refuses to keep taking lithium. Based on the lecture, which side effect is a common reason patients ask to switch?","o":["Hair growth","Hypersalivation","Significant weight gain","Photosensitivity"],"a":2,"r":"The professor said lithium \"makes you very fat.\" Weight gain is a big reason patients stop taking it, which is why the slides teach patients to monitor their diet for weight gain.","src":"Lecture; Slide 49"},{"s":"ch6","q":"A pregnant patient with bipolar disorder is admitted. What did the professor stress about lithium?","o":["Lithium dose should be doubled during pregnancy","Lithium is one of the worst medications for causing birth defects","Lithium is only a concern while breastfeeding","Lithium is the safest choice in pregnancy"],"a":1,"r":"The professor said the one contraindication to remember is pregnancy: psychiatric medications are not for pregnant women, and lithium is one of the worst for birth defects.","src":"Lecture"},{"s":"ch6","q":"A hospitalized patient on carbamazepine (Tegretol) has a WBC below normal. What is the patient now at risk for?","o":["Tardive dyskinesia","Hypertensive crisis","Lithium toxicity","Opportunistic infection"],"a":3,"r":"The professor said the WBC is checked about three times a week in the hospital for patients on Tegretol. A low WBC means a weak immune system, so the patient can pick up infections easily.","src":"Lecture"},{"s":"ch1","q":"A family member asks how often the patient's sertraline (Zoloft) blood level will be checked. What is accurate?","o":["12 hours after the last dose","Every morning before the first dose","Weekly for 6 months","Antidepressant blood levels are not monitored"],"a":3,"r":"The professor said that with antidepressants, \"we do not monitor blood levels.\" Lithium and Depakote are the ones with levels. Lithium is drawn 12 hours after the last dose.","src":"Lecture"},{"s":"ch1","q":"According to the lecture, why are SSRIs such as Prozac, Paxil, Zoloft and Celexa the first choice for depression today?","o":["Their side effects are very tolerable","They work within 24 hours","They need no patient teaching","They have no drug interactions at all"],"a":0,"r":"The professor said SSRIs are liked because their side-effect profile is extremely tolerable. They still have a lag time before they work and still carry a rare risk of serotonin syndrome.","src":"Lecture"},{"s":"ch1","q":"On the psych unit, trazodone (Desyrel) is most often ordered for what purpose?","o":["To treat alcohol withdrawal","To treat acute mania","As a PRN for sleep","To treat EPS"],"a":2,"r":"The professor said trazodone was first used for depressed patients with insomnia, and now \"everybody gets trazodone as a PRN for sleep.\" The key teaching is to report priapism right away.","src":"Lecture; Slides 34, 36"},{"s":"ch1","q":"A patient taking amitriptyline (Elavil) has strong anticholinergic effects. Which two questions should the nurse ask every shift?","o":["\"Did you exercise?\" and \"Did you sleep?\"","\"Are you hungry?\" and \"Are you cold?\"","\"When did you last void?\" and \"When was your last bowel movement?\"","\"Do you have a headache?\" and \"Is your vision normal?\""],"a":2,"r":"The professor called these the two most important questions for a patient on a tricyclic: when did you last void, and when was your last bowel movement. Urinary retention and constipation can become severe.","src":"Lecture; Slide 31"},{"s":"ch1","q":"Why did the professor say nurses should rarely see a new patient started on a tricyclic antidepressant today?","o":["Tricyclics are no longer made","Tricyclics are highly cardiotoxic and easy to overdose on, and SSRIs are much safer","Tricyclics only work in children","Tricyclics must be given IV"],"a":1,"r":"Tricyclics are \"the easiest drugs in psychiatry to kill yourself with\" because they are so cardiotoxic. The ones you still see are usually older patients who have done well on Elavil for years.","src":"Lecture"},{"s":"meds","q":"According to the lecture, benzodiazepines used to be called \"minor tranquilizers.\" What were antipsychotics called?","o":["Major tranquilizers","Mood elevators","Psychic energizers","Minor sedatives"],"a":0,"r":"Antipsychotics were called major tranquilizers (and neuroleptics), and benzodiazepines were the minor tranquilizers.","src":"Lecture; Slide 50"},{"s":"meds","q":"Why must the nurse be especially careful with PRN orders for drugs like alprazolam (Xanax) and clonazepam (Klonopin)?","o":["They have no side effects","They must be refrigerated","They are given only IM","They are controlled substances with potential for abuse and dependence"],"a":3,"r":"The professor said benzodiazepines are controlled substances: \"we don't fool around with those.\" Assess why a patient wants a dose early: panic, withdrawal, or manipulation.","src":"Lecture; Slide 17"},{"s":"ch8","q":"The first-ever order for clozapine (Clozaril) reads \"100 mg PO now.\" What should the nurse do?","o":["Give it as ordered","Give it with a benzodiazepine","Give it IM instead","Question the order; clozapine starts low, around 25 mg, and is increased slowly"],"a":3,"r":"With Clozaril it is \"low and slow.\" The professor said to look for about 25 mg to start. Starting too high or going up too fast can cause a seizure.","src":"Lecture; Slide 61"},{"s":"ch8","q":"The nurse prepares fluphenazine decanoate (Prolixin Decanoate). What did the professor say about how it is given?","o":["It is given subcutaneously in the abdomen","It comes in sesame oil and is given deep IM; she splits a large dose between two sites","It is given IV push","It is mixed into orange juice"],"a":1,"r":"Prolixin decanoate is a thick, oily (sesame oil) deep IM injection. The professor gives it in the upper outer area and splits the dose between both sides because it is painful.","src":"Lecture"},{"s":"ch8","q":"Before switching a patient to haloperidol decanoate (Haldol Decanoate), the provider orders oral haloperidol for a few days. Why?","o":["Because the injection does not work without pills","To see how the patient tolerates the drug, because the injection stays in the body a long time","To save money","Because oral Haldol has no side effects"],"a":1,"r":"If the patient reacts badly to oral Haldol, it clears quickly. A decanoate \"is going to be laying around for quite a long time,\" so tolerance is tested with pills first.","src":"Lecture"},{"s":"ch8","q":"A patient with a history of not taking pills is switched from oral haloperidol three times a day to haloperidol decanoate. How often does the patient usually come in for the injection?","o":["Once a year","Every day","Every 4 hours","About every 2 weeks"],"a":3,"r":"The professor said that instead of pills three times a day plus bedtime, the patient comes in about once every two weeks for the shot.","src":"Lecture"},{"s":"ch8","q":"A patient's acute dystonic reaction is treated with IM benztropine (Cogentin). What should the nurse expect?","o":["The spasm resolves almost immediately","Relief in 2–4 weeks","The spasm becomes permanent","The patient needs dialysis"],"a":0,"r":"The professor called Cogentin \"a magic wand.\" It is given as an IM injection, and dystonia resolves almost immediately. Some providers use diphenhydramine (Benadryl) instead.","src":"Lecture; Slide 64"},{"s":"ch8","q":"A patient on olanzapine (Zyprexa) develops type 2 diabetes, and the provider switches to a different antipsychotic. What does the nurse know?","o":["Diabetes only happens with typical antipsychotics","The diabetes always resolves within a week","Blood sugar no longer needs to be checked","The diabetes often does not go away after the switch, so glucose monitoring continues"],"a":3,"r":"The professor said it was once thought the diabetes would resolve after switching off Zyprexa, but \"we're finding out that's not happening.\" Fingersticks are now routine even for 30- and 40-year-olds on atypicals.","src":"Lecture; Slide 69"},{"s":"ch8","q":"A patient is diagnosed with neuroleptic malignant syndrome (NMS) on the psych unit. What did the professor say must happen?","o":["The patient gets another dose of the antipsychotic","The patient stays and is observed every 4 hours","The patient leaves the unit ASAP and goes to a medical/ICU setting","The patient is placed in seclusion"],"a":2,"r":"NMS is fatal and an emergency. Stop the drug, notify the provider STAT, and transfer the patient to medicine or the ICU.","src":"Lecture; Slide 68"},{"s":"ch8","q":"Which patient is at risk for neuroleptic malignant syndrome?","o":["Both a patient after a first dose of an antipsychotic and a patient who has taken one for 20 years","Only a patient on the first day of treatment","Only a patient who has taken an antipsychotic for more than 10 years","Only patients on atypical antipsychotics"],"a":0,"r":"The professor said the scary thing about NMS is that it can happen with the first dose or after 20 years on an antipsychotic. Monitor temperature and rigidity routinely.","src":"Lecture; Slide 67"},{"s":"ch8","q":"A patient on a phenothiazine is going outside on a sunny day. Besides sunscreen, what did the professor say these patients need?","o":["A heating pad","Ice packs on the neck","Extra salt","Sunglasses"],"a":3,"r":"Photosensitivity: the professor said patients \"have to wear sunglasses,\" and they also need sunscreen and protective clothing. Their body temperature regulation can also be off.","src":"Lecture; Slide 58"},{"s":"meds","q":"A patient who has taken alprazolam (Xanax) daily for 2 years stops it suddenly. Which findings point to benzodiazepine withdrawal?","o":["Low blood pressure, dry skin and drowsiness","Lip smacking and tongue movements","Elevated blood pressure, sweating and agitation","Weight gain and constipation"],"a":2,"r":"The professor described withdrawal as a rise in blood pressure, diaphoresis and agitation. The biggest danger is a grand mal seizure. The professor said Xanax has the worst withdrawal.","src":"Lecture; Slides 16, 18"},{"s":"meds","q":"During an admission, a patient says, \"I take Xanax 1 mg three times a day.\" What should the nurse ask first?","o":["\"Do you take it with food?\"","\"Do you like the taste?\"","\"How long have you been taking it?\"","\"Who prescribed it?\""],"a":2,"r":"The professor said the first question is how long the patient has taken it. A long-time user needs a benzodiazepine ordered in the hospital so they don't go into withdrawal.","src":"Lecture"},{"s":"meds","q":"A patient in a full panic attack is started on buspirone (BuSpar). What does the nurse expect the psychiatrist to also order?","o":["An MAOI","A second dose of buspirone right away","A PRN benzodiazepine until the buspirone starts working","Nothing else; buspirone works within an hour"],"a":2,"r":"BuSpar takes at least 10 days to 2 weeks to work, so it does nothing for a panic attack. The professor said it is common to start BuSpar and leave a benzo PRN until it kicks in.","src":"Lecture; Slide 18"},{"s":"meds","q":"According to the lecture, how long should benzodiazepines be used?","o":["Short term only","Lifelong","At least 5 years","Only after age 65"],"a":0,"r":"\"Benzodiazepines are not for the long term.\" The concerns are addiction and tolerance, which means needing more and more drug for the same effect, plus dangerous withdrawal.","src":"Lecture; Slides 11, 17"},{"s":"ch1","q":"Which food is a classic NCLEX example to avoid on an MAOI (tyramine-free) diet?","o":["Fresh apples","Plain white rice","Chicken livers","Fresh chicken breast"],"a":2,"r":"The professor said NCLEX likes chicken livers and fava beans. Also avoid beer, red wine, processed meats like pepperoni and sausage, and aged cheeses.","src":"Lecture; Slide 35"},{"s":"ch1","q":"A patient on an MAOI ate aged cheese. Which complaint best signals a hypertensive crisis?","o":["Mild dry mouth","A severe headache in the back of the head (occipital)","Increased appetite","Sleepiness after lunch"],"a":1,"r":"With a hypertensive crisis, blood pressure \"goes through the roof.\" Patients often have a severe occipital headache and changes in mental status. It is life-threatening: send the patient to the ER.","src":"Lecture; Slides 26, 33"},{"s":"ch1","q":"According to the lecture, what is one of the biggest reasons patients stop taking their antidepressants?","o":["Sunburn","Hair loss","Hiccups","Weight gain"],"a":3,"r":"The professor said weight gain is one of the biggest reasons for non-compliance. For SSRIs, sexual dysfunction is the other big one; the professor said men especially dislike Zoloft for this reason.","src":"Lecture; Slide 32"},{"s":"ch1","q":"An older patient with severe depression also has congestive heart failure. Why does the professor say ECT may be the better choice than a tricyclic?","o":["ECT requires no consent","ECT is safer for the heart and works faster","ECT cures schizophrenia","Tricyclics work faster than ECT"],"a":1,"r":"Patients with hypertension, MI or CHF are not candidates for tricyclics because tricyclics are cardiotoxic. The professor said ECT is \"way safer\" for the cardiovascular system and works much quicker.","src":"Lecture"},{"s":"ch6","q":"A patient's lithium level is 1.2 mEq/L, but the patient says ringing in the ears kept them up all night and their vision is blurry. What should the nurse do?","o":["Treat it as possible toxicity: hold the dose and notify the provider","Give the dose because the level is in range","Give extra fluids and the dose","Tell the patient this is normal"],"a":0,"r":"The professor said: \"It doesn't matter what that number is.\" Tinnitus and blurred vision mean the patient may be developing toxicity. Treat the patient, not just the lab value.","src":"Lecture; Slides 46, 47"},{"s":"ch6","q":"A patient on lithium asks if they need to limit how much water they drink. What did the professor say?","o":["Limit fluids to 1 liter a day","Stop drinking water 2 hours before each dose","Drink only when thirsty","No fluid restriction is needed; keep drinking your usual amount"],"a":3,"r":"Patients do not go on any fluid restriction. Whatever they drank before starting lithium, they can keep drinking. The slides add 6–8 glasses a day. The danger is losing fluid and sodium (vomiting, diarrhea, sweating), not drinking water.","src":"Lecture; Slide 49"},{"s":"ch6","q":"A patient arrives in the ED with a lithium level above 3.5 mEq/L. Where should this patient be admitted?","o":["Home with follow-up in a week","The psychiatric unit","Outpatient therapy","A medical unit, because of the risk of arrhythmias and cardiovascular collapse"],"a":3,"r":"The professor said a patient with a level that high \"is not coming to psychiatry. They're going to medicine.\" Above 3.5 brings seizures, coma, arrhythmias and cardiovascular collapse.","src":"Lecture; Slide 46"},{"s":"ch6","q":"The professor said this would \"definitely\" be on the exam: which mood stabilizer puts the patient at risk for agranulocytosis?","o":["Carbamazepine (Tegretol)","Lithium carbonate","Lamotrigine (Lamictal)","Buspirone (BuSpar)"],"a":0,"r":"Tegretol can drop the WBC below normal (agranulocytosis), which puts the patient at risk for opportunistic infection. Clozaril is the antipsychotic with the same risk.","src":"Lecture"},{"s":"ch6","q":"According to the lecture, is clonazepam (Klonopin) used to treat bipolar disorder in psychiatry?","o":["Yes, it is the first-choice mood stabilizer","No; Klonopin is a benzodiazepine and is not used to treat bipolar disorder","Yes, but only with lithium","Only in pregnancy"],"a":1,"r":"Even though Klonopin is on the mood stabilizer slide, the professor said, \"In psychiatry, we do not use Klonopin to treat bipolar disorder.\" Lithium is the main mood stabilizer, and Tegretol, Depakote and Lamictal are also used.","src":"Lecture; Slide 39"},{"s":"ch8","q":"Before the first dose of ziprasidone (Geodon), the baseline EKG does not show normal sinus rhythm. What should the nurse do?","o":["Give it with a beta blocker","Hold the medication and ask the provider about a cardiology consult","Give half the dose","Give the dose and recheck the EKG next week"],"a":1,"r":"The professor said she never gave Geodon without a baseline EKG. If it was not normal sinus rhythm, she held the drug and asked for a cardiology consult, because Geodon prolongs the QT interval.","src":"Lecture; Slide 60"},{"s":"ch8","q":"A 35-year-old on olanzapine (Zyprexa) has a new order for metformin, though he has no history of diabetes. Why?","o":["To lower his lithium level","To help prevent the type 2 diabetes that atypicals like Zyprexa can cause","To raise his WBC","To treat EPS"],"a":1,"r":"Zyprexa is \"the bad boy\" for type 2 diabetes. The professor said psychiatrists sometimes prescribe metformin to prevent it, and fingersticks are now done on patients in their 30s and 40s.","src":"Lecture; Slide 69"},{"s":"ch8","q":"On admission, the nurse completes a scale that looks for involuntary movements, mostly in the face. What side effect is this screening for?","o":["Tardive dyskinesia","Lithium toxicity","Serotonin syndrome","Hypertensive crisis"],"a":0,"r":"The professor said the involuntary movement scale is now part of the psychiatric admission. It screens for tardive dyskinesia, which is permanent. If caught early, holding the drug and having the psychiatrist evaluate may help.","src":"Lecture; Slide 65"},{"s":"ch8","q":"A patient's tardive dyskinesia is treated with a newer medication such as Ingrezza. What should the nurse teach?","o":["It works only if the antipsychotic is doubled","It cures tardive dyskinesia completely","It can lessen how often and how strongly the movements happen, but it does not cure tardive dyskinesia","It reverses the condition within 24 hours"],"a":2,"r":"The professor said Ingrezza decreases the frequency and intensity of the movements, but \"once a patient has tardive,
